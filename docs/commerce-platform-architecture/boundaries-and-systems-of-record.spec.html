<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/04-boundaries-and-systems-of-record/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over below, then corrected after one end-to-end check run. It is a contract, not a description: in the places listed under open_questions the published chapter does not yet do what the spec asks.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** What a business fact, a system of record, a copy, a writer and a bounded context are.\n- **Know:** The four ways merchants assign ownership and when each stops fitting.\n- **Believe:** Copies are unavoidable; the failure is a copy that nobody has declared to be a copy.\n- **Believe:** 'Single source of truth' means one record per fact, not one system for every fact.\n- **Be able to:** Write an entity–owner table for their own landscape, with a writer list and a reconciliation per row.\n- **Be able to:** Tell, from the writer list, whether a claimed system of record is one.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer or integration lead who inherits a landscape of connectors, and product, finance and operations leaders who are told to 'sync it both ways'.\n\n**Already knows:**\n\n- The order's journey and its handoffs (journey-of-an-order).\n- The four scale stages (commerce-business-models).\n- The capability map and that each capability owns a kind of fact (commerce-capability-map).\n- Kestrel & Pine and the Black Friday Oversell, in outline (meet-kestrel-and-pine).\n\n**Does not yet know:**\n\n- System of record, copy, writer, bounded context, reconciliation, event.\n- ERP, WMS, POS, PIM, OMS, PSP beyond a first mention.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given two systems that show different values for one fact, the reader asks which is the record and who may write it, before asking how to synchronize faster. *Probe:* The shop shows 12 units of a jacket and the warehouse system shows 0. Using only this chapter: what are the first two questions you ask? | `custom` | cold_reader | blocker |\n| AC-2 | The reader can explain why three systems showing three statuses for one order may all be correct. *Probe:* Shop: 'Delivered'. Warehouse: 'In picking'. Finance: 'Not invoiced'. Can all three be right? Explain. | `custom` | cold_reader | major |\n| AC-3 | The reader can fill one row of an entity–owner table with all six columns for a fact of their choice. *Probe:* Fill one row of the entity–owner table for 'consumer price'. | `custom` | cold_reader | major |\n| AC-4 | A reader of the introduction alone (callouts and paragraphs p01 to p04) can predict the chapter's sections. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-6 | The conclusion returns to the introduction's two disagreeing statuses and says what the reader can now see in them. | `conclusion_calls_back_to_introduction` | rubric | major |\n\n## Thesis\n\n**Question:** When several systems hold the same fact (a price, a stock level, an order status, a customer), which one is right, and how do the others find out?\n\n> **Claim:** Copies of a fact are unavoidable and harmless; unowned copies are the failure, so a merchant must name exactly one system of record per fact (not per system, and not per company), treat every other value as a copy that learns from it, and reassign that ownership when the business changes shape.\n\n**Disputed by:** The view that the remedy for disagreeing systems is faster two-way synchronization, or a single source of truth read as one system that holds everything.\n\n**So what:** Kestrel & Pine oversold 1,340 units on one evening while every system reported its own number honestly; without a named record, no amount of synchronization can say which number should have won.\n\n**How and why:** A disagreement can be resolved only if one value is entitled to win; the writer list shows whether a record is real, bounded contexts explain why one shared model is not the answer, and each scale stage brings a new system that claims facts the previous owner held.\n\n**Supporting claims**\n\n- **S1** — When copies disagree, the question is which value is entitled to win, not how to copy faster.\n- **S2** — Ownership is decided per fact, and it is real only when the record has one writer and its copies have none.\n- **S3** — The same word names different objects in different bounded contexts, so systems should share identifiers and translate at boundaries instead of sharing one model.\n- **S4** — Ownership becomes usable as an entity–owner table whose rows also name the writers, the refresh and how disagreement is found.\n- **S5** — Which system should be the hub depends on where orders and stock originate, so ownership must be reassigned at each stage transition.\n- **S6** — Ownership that has been decided still erodes, and each way it erodes has a detection and a recovery.\n\n## Role in the part\n\nMakes the part's central decision: for each fact on the capability map, which system is the record and which are copies. Supports P1-4 of part `part-1`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in scene, facts-records-copies, bounded-contexts, entity-owner-table: each supplies the terms the next one uses; `comparison` in four-ways; `chronological` in scale-stages)\n\nThe reader meets six honest, disagreeing numbers before any term is defined, so the vocabulary arrives as the answer to a problem they already feel. The table comes only after records, copies and contexts, because its columns are those terms. Choices, stages and failure modes follow the table because each is a way of filling it in or keeping it true. Opening with definitions would lose the newcomer; opening with the table would present columns the reader cannot yet read.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A customer asks where a parcel is. The storefront says Delivered; the warehouse system says In picking. Is one record stale, or do the two describe different parts of the order?\n\n**Bridge:** Anyone who has contacted support about an order, or answered such a contact, has seen two screens disagree. → Until someone knows which value is authoritative, copying either status faster only spreads the wrong answer; that authority is what a system of record is.\n\n**Thesis statement** (KEY POINTS callout, first bullet, and paragraph p02): Copies are unavoidable; unowned copies are the failure. Name one system of record per fact, decide who may change it, how copies learn and how errors are repaired.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p03):\n\n- Work through Kestrel & Pine's six answers to 'where does stock live', before and after the decision that settled it. *Kept in:* scene, in-practice.\n- Define the terms ownership is stated in: fact, record, copy and writer. *Kept in:* facts-records-copies.\n- Explain how systems can use different meanings for 'order'. *Kept in:* bounded-contexts.\n- Build an entity–owner table: business facts and the systems responsible for them. *Kept in:* entity-owner-table.\n- Compare ownership choices, using what vendors publish about their own products as evidence. *Kept in:* four-ways, suite-and-vendors, scale-stages.\n- Say what happens when systems disagree. *Kept in:* truth-patterns, when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Two systems show two statuses for one parcel, and until support knows whether one is stale or both are right, copying either faster makes things worse. | scenario: Storefront 'Delivered', warehouse 'In picking'. |  |\n| p02 | claim | A system of record is the system whose value is authoritative for one fact, and naming it forces three further decisions: who may change the fact, how copies are updated, how errors are repaired. |  | `problem_solution`: The unresolved question of which status to trust. → The system of record as the thing that settles it. |\n| p03 | transition | The chapter starts from Kestrel & Pine's six answers about stock, defines the terms of ownership, explains why 'order' has several meanings, builds an entity–owner table and compares ownership choices against vendors' published documentation, leaving the wider map and the repair mechanics to two other chapters. |  | `sequence`: The decisions a system of record requires. → The order in which the chapter takes them. |\n| p04 | context | In the journey of Eva's jacket, the stock badge, the price and the shipment status all reach her through copies, and this chapter decides which system each copy answers to. |  | `place`: The chapter's subject. → Its position on the recurring order's journey. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: \"Where Does Stock Live?\"\n\n**Controlling idea** (`example`, id `scene`): Six people gave six honest answers to 'where does stock live', and the useful question turned out to be which of the six is right, not how to sync them faster.\n\n**Advances the thesis** (S1): Shows the problem before the vocabulary: every number was honest, and none was entitled to win.\n\n**Transition in:** `example`: The introduction's claim that a fact needs an authoritative system. → One company and one fact, stock, where no system had that authority.\n\n**Order of paragraphs** (`chronological`): The question, the six answers, the evening it mattered, then the decision: the reader reaches W1 the way Noor did.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | Before the Waypoint program was approved, the head of engineering asked who owned the stock figure and got six answers. | table: Who / where stock lives in their words / what the number actually is, six rows. |  |\n| p06 | evidence | At 20:00 on Black Friday, twenty minutes after the warehouse sold its last unit, six systems showed six quantities for one jacket. | scenario: Reconstruction for the Ridgewalker women's M in moss, 27 November 2026, labelled illustrative. | `example`: The six answers. → One variant at one moment under those six answers. |\n| p07 | cause_effect | Because the copying chain took up to two hours, channels sold from old figures and produced the Black Friday Oversell. | statistic: 1,340 units oversold, 1,120 orders cancelled or delayed, about €96,000. | `cause_effect`: Six different quantities. → What selling from them cost. |\n| p08 | claim | The question that led to a decision was 'which of the six is right?', and the answer, the shelf, made the warehouse system the record and everything else a copy. | scenario: Waypoint decision W1: WMS for Duiven stock, POS for store stock, marketplace stock as a tracked external location, an availability service computing from the three; Figure 1. | `contrast`: The two-hour chain, which invites the question 'how do we sync faster'. → The different question that was asked. |\n\n### Facts, Records and Copies\n\n**Controlling idea** (`definition`, id `facts-records-copies`): Four plain terms (fact, record, copy, writer) are enough to state ownership, and the writer list is the test of whether it is real.\n\n**Advances the thesis** (S2): Supplies the terms the thesis is stated in and the test that distinguishes a named record from a real one.\n\n**Transition in:** `elaboration`: The words 'record' and 'copy', used in the scene without definition. → Their definitions, and two further terms.\n\n**Order of paragraphs** (`prerequisite_order`): Each definition uses only the ones before it: a record is defined for a fact, a copy against the record, a writer against both; the warning about 'single source of truth' needs all four.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | transition | Four terms carry the chapter: fact, record, copy and writer. |  |  |\n| p10 | definition | A business fact is something the business needs to be true about the world and acts on. | example: A variant's barcode, a customer's price, 14 units in Duiven, order #1072455 has shipped. | `sequence`: The announcement of four terms. → The first. |\n| p11 | definition | The system of record for a fact is the one system whose value wins when copies disagree and the only one in which the fact is changed directly. | analogy: The bank's ledger is the record for your balance; the budgeting app holds a copy. The shelf count in the WMS against the number on the product page. | `sequence`: The fact. → The system that is authoritative for it. |\n| p12 | definition | A copy is the same fact held elsewhere; copies are necessary, and the only rule is that a copy is known to be a copy and is never edited to fix a disagreement. | example: The storefront needs a stock number to render in milliseconds; the data warehouse needs every order; the marketplace needs the price. | `contrast`: The record as the one authoritative value. → Every other value, and why it is legitimate. |\n| p13 | claim | The practical test of ownership is the writer list: if a copy has writers of its own it is a second record, and the two will diverge. |  | `additional_support`: The rule that a copy is never edited. → The writer, and a test that makes the rule checkable. |\n| p14 | refutation | 'Single source of truth' is right as one record per fact and wrong as one system for every fact. | reasoning: No system is the natural home of both the shelf count and the ledger posting; Figure 2. | `contrast`: Ownership per fact, tested by writers. → The common phrase that sounds like the same idea and is often read as its opposite. |\n\n### Bounded Contexts: Why the Warehouse's Order Is Not the Ledger's Order\n\n**Controlling idea** (`explanation`, id `bounded-contexts`): The same word names different objects in different systems, so some disagreements are not stale copies at all and need translation, not a winner.\n\n**Advances the thesis** (S3): Blocks the wrong conclusion from the previous section, that one shared model would make ownership simple.\n\n**Transition in:** `contrast`: Record and copy as two values of the same fact. → Cases where two systems hold different facts under one name.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The concept and its sources first, then one order in four contexts, then the incident, then the rules that follow; the reader sees the incident as a case of the concept rather than as an anecdote.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | definition | A bounded context is a boundary inside which a model and its words have one agreed meaning. | source: Eric Evans, Domain-Driven Design (2003).; quotation: Fowler: total unification of the domain model for a large system 'will not be feasible or cost-effective'; confusion recurs 'with polysemes like Customer and Product'. |  |\n| p16 | example | The storefront, order management, the warehouse and the ERP each have their own 'order', and they are not the same object. | table: Context / what 'order' means / what it contains / its states, four rows. | `example`: The abstract definition. → The same idea in plain words for one term, 'order'. |\n| p17 | evidence | The Three-Status Order generated 11 tickets because its three statuses described three different objects, each correctly. | scenario: Order #1052877: fleece shipped 7 December 2026, socks waited a week; platform 'Delivered', WMS 'In picking', ERP 'Not invoiced'. | `example`: Four meanings of 'order'. → One order on which three of them collided. |\n| p18 | analysis | What was missing was not a correct status but an owner of the view across contexts, which is the job of an order management system. | scenario: Six days without a combined view; Waypoint decision W2 assigns it to a purchased OMS. | `cause_effect`: Three honest statuses. → The consequence for the customer and what resolves it. |\n| p19 | example | 'Product' and 'customer' split across contexts in the same way as 'order'. | scenario: Product as content, PIM attributes, ERP item, WMS SKU; Eva Janssen as four unlinked customer records. | `similarity`: 'Order' meaning four things. → Two more words with the same property. |\n| p20 | recommendation | Translate at the boundary and share identifiers rather than models. | example: The OMS-to-WMS connector turns an order into a fulfillment order; order number, SKU and GTIN let contexts refer to the same thing; Figure 3. | `cause_effect`: Words that legitimately mean different things per context. → Two design rules that follow. |\n\n### The Entity–Owner Table\n\n**Controlling idea** (`recommendation`, id `entity-owner-table`): Ownership is written down as one row per fact that names the record, the writers, the copies, how copies learn and how disagreement is found, and how fresh each copy must be differs by fact.\n\n**Advances the thesis** (S4, S2): Turns the definitions into the artifact the reader will produce, and adds the columns that make ownership enforceable.\n\n**Transition in:** `conclusion_summary`: Records, copies, writers and contexts. → One table that holds all four for every fact.\n\n**Order of paragraphs** (`large_to_small`): The whole table first, then the rows that surprise newcomers, then the one column most tables omit, then the separate question of freshness; the reader needs the whole before the exceptions make sense.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | claim | The chapter's deliverable is a table with one row per business fact and five columns of decisions, given here for a merchant at the omnichannel stage. | table: Fourteen facts by system of record, who may write, copies live in, how copies learn, disagreement found by. |  |\n| p22 | analysis (list) | Four rows carry lessons newcomers miss: stock has a record per location, availability has no human writer, payment's record is outside the company, and business and consumer customers have different records. | scenario: The App That Wrote Stock (phantom reservations on 600 variants); the Double Refund (212 returns, €19,400).; quotation: 'Mixing both directions without a clear ownership rule can lead to conflicting records.' | `emphasis`: The full table. → The rows that deserve a second look. |\n| p23 | claim | A record with copies and no reconciliation is a record on trust, so every copy row needs a named way of finding disagreement. | scenario: The Black Friday chain ran on trust. | `emphasis`: The rows. → The column most tables leave out. |\n| p24 | claim | Ownership decides who wins, not how quickly copies must follow; freshness depends on what a stale copy costs and differs sharply by fact. | table: Six facts by how stale a copy may be, agreement required and why. | `contrast`: Ownership as the question of who wins. → The separate question of how fast copies must follow. |\n| p25 | analysis | Choosing one refresh rhythm for all facts is how an ERP's hourly cycle became the storefront's availability latency. |  | `cause_effect`: Freshness per fact. → What happens when one rhythm is applied to all. |\n\n### Four Ways to Assign Ownership\n\n**Controlling idea** (`comparison`, id `four-ways`): Merchants assign ownership in four ways, three of them decisions, and the right one is set by where orders and stock originate.\n\n**Advances the thesis** (S5): Shows that the table can be filled in differently and gives the rule for choosing.\n\n**Transition in:** `contrast`: One recommended table for one stage. → The other ways the same table is filled in.\n\n**Order of paragraphs** (`comparison`): Each option gets the same treatment (what it is, evidence, when it fits, when it stops fitting), so the closing table and rule read as a summary of a fair comparison; 'no decision' comes last because it is defined by the absence of the other three.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p26 | transition | There are four ways; three are decisions and the fourth is what happens without one. |  |  |\n| p27 | comparison | With the ERP as hub, the web shop is a front end; this fits one channel and one warehouse and stops fitting when several parties need stock within minutes. | quotation: 'Business Central acts as the system of record for inventory', pushed one way every 15 to 30 minutes. | `sequence`: The count of four. → The first option. |\n| p28 | comparison | With the platform as hub, its order and stock are the record; this fits a direct-to-consumer brand and stops fitting when orders or stock originate elsewhere. |  | `contrast`: The ERP as the centre. → The opposite centre. |\n| p29 | comparison | With ownership per fact and an order hub, each fact goes to the system that originates it, which keeps a sales estimate from overwriting a physical count. |  | `contrast`: Two single-hub arrangements. → An arrangement with no single hub. |\n| p30 | evidence | Specialist vendors describe the same boundaries, and should be read as explaining their own categories. | quotation: Fluent Commerce: 'your ERP stays the system of record'; OneStock on ERP as product master and OMS as master for availability. | `additional_support`: The per-fact arrangement. → Public statements that match it. |\n| p31 | recommendation | Per-fact ownership fits several channels and stock locations and is not worth its cost before there is a coordination problem. |  | `contrast`: The arrangement and its backers. → Its cost and when not to pay it. |\n| p32 | description | With no decision, every system becomes a writer of every fact it holds; this is the default because it is never chosen. | scenario: Kestrel & Pine in January 2027: 34 integrations, six writers of stock, four sources of orders, four copies of product data. | `contrast`: Three arrangements someone chose. → The one nobody chooses. |\n| p33 | recommendation | Choose the hub by where orders and stock originate, not by which system is largest; the second order source or stock location is the moment per-fact ownership becomes necessary. | table: Four options by record for stock, orders, content, finance, fits, breaks when, copies tolerated; Figure 4. | `conclusion_summary`: The four options. → The rule for choosing among them. |\n\n### Ownership in a Suite and Across Vendors\n\n**Controlling idea** (`refutation`, id `suite-and-vendors`): A suite makes most ownership decisions for the merchant, yet the systems outside it and the decision itself remain the merchant's.\n\n**Advances the thesis** (S2, S4): Answers the objection that buying one vendor's suite makes the table unnecessary.\n\n**Transition in:** `contrast`: Ownership as something the merchant assigns. → The case where a vendor has already assigned it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | counterargument | Inside a suite or a vendor-built connector, the entity–owner table becomes settings the vendor has chosen or exposed. | source: Salesforce release of July 2026; Business Central connector's per-entity direction settings. |  |\n| p35 | refutation | Two things stay the merchant's even in a suite: the systems outside it, and the judgement whether the suite's ownership is right for the business. | quotation: 'Document every field that moves between systems, and name the system of record for each'; 'Decide in advance what happens when the two systems disagree.' | `contrast`: What the suite decides. → What it cannot decide. |\n\n### When Ownership Is Not Decided: The Five Truth Patterns\n\n**Controlling idea** (`cause_effect`, id `truth-patterns`): Each of the five 'Truth' failure patterns is a fact without an owner.\n\n**Advances the thesis** (S1): Connects the chapter's remedy to failures the reader already knows by name from the preface.\n\n**Transition in:** `cause_effect`: The ways ownership can be assigned. → What each unassigned fact looks like as a named failure.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | analysis | The five Truth patterns map one to one onto a fact with no record, a Kestrel & Pine incident and the owner Waypoint named. | table: Pattern / fact with no record / incident / owner named, five rows. |  |\n| p37 | analysis | The Secret Agent is the same failure seen from the writer's side: something changes a fact without being on the writer list. |  | `additional_support`: The five patterns in the family. → One outside it that belongs to the same cause. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`analysis`, id `scale-stages`): The table is rewritten at each scale stage, because each stage brings a system that claims facts the previous owner held.\n\n**Advances the thesis** (S5): Supplies the 'reassign when the business changes shape' half of the thesis.\n\n**Transition in:** `time`: Ownership as a decision made once. → How the decision moves over the four stages.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | claim | Each stage brings a new system that claims facts, and the moment of handover is when two writers exist. | table: Four stages by typical ownership, what becomes necessary and warning signs of outgrowing it. |  |\n| p39 | recommendation | Reassign ownership at the stage transition, not after the first incident; the sign is a second system that originates orders or counts stock. | scenario: Kestrel & Pine moved to stage 3 in 2023 and kept stage 2's ownership for four years. | `example`: The stage table. → One company that did not follow it, and the rule drawn from that. |\n\n### In Practice\n\n**Controlling idea** (`evidence`, id `in-practice`): Public evidence and the worked example both show one writer per fact being enforced, and what it would have changed on the evening of the oversell.\n\n**Advances the thesis** (S2, S4): Tests the remedy against the opening incident, so the reader sees the same evening with and without it.\n\n**Transition in:** `example`: The rules and the stages. → Cases of the rules applied.\n\n**Order of paragraphs** (`large_to_small`): From what real companies document, to one company's before-and-after table, to one minute of one evening, and then to what the first reconciliation found.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | evidence | Real vendors and one very large retailer enforce one writer per entity, mechanically. | quotation: 'each item store always goes to a specific partition', so 'that only one consumer deals with that item store combination'. |  |\n| p41 | comparison | Under Waypoint decision W1, each stock location has one record and one kind of writer, and copies learn by event. | table: January 2027 against after W1 (Q4 2027): record, writers, availability, how copies learn, disagreement found by. | `similarity`: One writer per entity at Walmart's scale. → The same rule applied to the running example. |\n| p42 | analysis | Replayed against the new design, the Black Friday evening oversells a handful of units instead of 1,340. | scenario: 19:40 last unit scanned, the availability service publishes zero within seconds, channels stop selling before 19:41; the per-channel buffer absorbs orders already in checkout; Figure 5. | `cause_effect`: The after-W1 design. → Its effect on the incident the chapter opened with. |\n| p42b | evidence | The first reconciliation after the change found copies that had drifted, which is the reason every copy row has one. | scenario: May 2027: 2.3% of active variants differ between the WMS and the platform (illustrative), most left behind by the three apps; their write access was removed and the figure became the baseline. | `contrast`: The new design working on the evening of the oversell. → What the design did not do by being named: its own reconciliation still found copies that had drifted. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): Ownership decided is not ownership kept: five things erode it, each with a detection and a recovery.\n\n**Advances the thesis** (S6): Prevents the reader from treating the table as a one-off document.\n\n**Transition in:** `contrast`: The design working as intended. → How it stops working after it is decided.\n\n**Order of paragraphs** (`grouping`): Five failure modes in the same three-part shape (what happens, detection, recovery), ordered from failures in the copies to failure in the record itself, which no ownership rule fixes.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | claim | Ownership decided is not ownership kept; five things go wrong. |  |  |\n| p44 | process | A second writer appears; a periodic write audit against the writer column finds it, and removing the write and re-publishing from the record repairs it. | scenario: The App That Wrote Stock. | `sequence`: The count of five. → The first. |\n| p45 | process | A copy goes stale; a lag metric per copy finds it, and a full re-publication from the record repairs it. | scenario: The two-hour chain; the Deprecated Endpoint of February 2027. | `sequence`: The first failure. → The second. |\n| p46 | process | A copy is edited by hand; change logs and daily refund reconciliation find it, and routing the action through the owner repairs it. | scenario: The Double Refund. | `sequence`: The second failure. → The third. |\n| p47 | process | A copy is mistaken for the record; asking which table row a disputed number comes from finds it, and publishing the table repairs it. |  | `sequence`: The third failure. → The fourth. |\n| p48 | process | The record itself is wrong; no ownership rule fixes that, and it must be corrected in the record by its own writers. |  | `contrast`: Four failures of copies. → The failure of the record. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Records, bounded contexts, the hub choice and the failure modes are one decision seen four ways: for every fact, someone must be able to say which value wins, who may change it, and how anyone would find out that a copy has drifted. The table is where that is written; the stage transition is when it is rewritten.\n\n**So what:** A bought hub fed by unreconciled sources is one more copy, and a written table with no reconciliation is a record on trust; the reader's first step costs nothing and comes before any purchase.\n\n**Callback:** The introduction's parcel that is Delivered in one system and In picking in another. The reader can now say that neither status was stale: they were true of different objects, and what was missing was an owner of the view across them.\n\n**Takeaway** (`course_of_action`): Write the entity–owner table for your own landscape before buying any hub, with the writer list and the reconciliation per row, and revisit it the day a second system originates orders or counts stock. Eight questions to ask follow.\n\n**Hand-off** to [Suites, SaaS, Open Source and Composable: The Platform Landscape in 2026](commerce-platform-landscape.html): `sequence`: The parts mapped and their owners named. → What the market sells to fill the boxes, who sells it and how it is priced.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p49 | synthesis (list) | Established: several systems holding one fact is normal, different systems legitimately model the same word differently, and one writer per entity can be enforced mechanically. |  |  |\n| p50 | synthesis (list) | Depends on context: which system is the hub, where the customer record lives and how fresh a copy must be. |  | `contrast`: What the field agrees on. → What changes with the situation. |\n| p51 | recommendation (list) | The author's synthesis: write the table before buying a hub, and reassign ownership at the stage transition rather than after the incident. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p52 | recommendation (list) | Eight questions let the reader test ownership of any fact in their own landscape. |  | `cause_effect`: The take-aways. → Questions that apply them. |\n| p53 | transition | With the parts mapped and their owners named, the next question is what the market sells to fill the boxes. |  | `sequence`: The reader's own table. → The market that offers to fill it. |\n\n## Non-goals\n\n- The capability map itself. See [The Map of a Commerce Platform: Capabilities and Layers](commerce-capability-map.html).\n- How copies are kept consistent: events, idempotency, the outbox, the design of reconciliation jobs; integration styles. See [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html), [APIs, Events, Files and Middleware: How Commerce Systems Talk](integration-styles.html).\n- Available-to-promise and the availability service's design; the order state machine and the OMS as a product. See [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html), [The Order Record: Lifecycle, State and the Order Management System](order-management.html).\n- Customer matching, golden records and master data management. See [One Customer, One Product: Identity and Master Data Across Systems](identity-and-master-data.html).\n- The ERP-as-hub debate in depth and ERP connector mechanics. See [The Back Office: ERP Integration and Who Is the Hub](erp-and-back-office-integration.html).\n- The finance ledger's own system-of-record rules. See [Systems of Record: Ending the Doppelgänger Record](../finance-systems-architecture/systems-of-record.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The six-quantity reconstruction for the Ridgewalker variant at 20:00 on 27 November 2026 is labelled illustrative; journey-peak-day and inventory-and-availability may reuse or refine it.\n- The entity–owner table names the platform's price lists as the consumer price record; pricing-architecture may move that to a pricing engine for the omnichannel stage and should then update the row here.\n- Customer identity is left 'not yet decided' in the Truth-pattern table because the Waypoint decisions name no customer master; identity-and-master-data should resolve it.\n- Published chapter against this spec, conclusion: it does not return to the introduction's Delivered / In picking parcel (conclusion.callback).\n- Published chapter against this spec, in-practice: the Black Friday replay and the May 2027 reconciliation are one paragraph; the spec has them as p42 and p42b.\n- Published chapter against this spec, introduction: the roadmap paragraph says 'six stock writers' before 'writer' is defined, and does not say that the comparison rests on vendor documentation.\n- Published chapter against this spec, facts-records-copies: the section opens 'Three words carry this chapter' and then defines four terms.\n- Published chapter against this spec, found by the same check run and not yet examined: the paragraph that introduces the before-and-after table does not state its claim in prose (p41); the opening of 'Four Ways to Assign Ownership' does not contrast with the table before it (p26); the entity–owner table uses PSP, reconciliation and event before the prose defines them (p21).\n\n## Decision log\n\n- **2026-11-07** — Lead with 'which of the six is right?' so that the business problem (six honest answers, one oversell) precedes the vocabulary; the definitions follow the scene. Rejected: Opening with the definition of a system of record.\n- **2026-11-07** — Use the Three-Status Order to teach bounded contexts, because order status is the case where the copies are all correct about different objects; stock is used for records and copies, where one value is simply wrong. Rejected: Teaching bounded contexts with stock.\n- **2026-11-07** — Keep the hub comparison to four options and cite vendors' own boundary statements (Fluent, OneStock, Microsoft), with vendor interest noted in the text. Rejected: Inferring any vendor's internals.\n- **2026-11-07** — Include the 'Across Scale Stages' section although it is optional in Part I, because the chapter's third key point is that ownership changes with scale and the table is where that is shown. Rejected: Omitting the section, as Part I permits.\n\n## Sources\n\n- **Internal**\n  - _research/scenario-ledger.md — Incidents, Waypoint decisions W1 to W3 and W5, the stock sync chain, the May 2027 reconciliation.\n  - _research/brief-integration-and-data.md — Business Central connector ownership statements, Walmart partitioning, reconciliation and master-data material.\n  - _research/brief-b2b-edi-erp.md — The ERP, commerce and OMS hub comparison; Shopify ERP guidance; OneStock and Business Central customer ownership.\n  - _research/brief-platform-landscape.md — The Salesforce 2026 release; Fluent Commerce.\n  - _research/brief-inventory-fulfillment-returns.md — Availability as a derived value.\n  - commerce-capability-map, meet-kestrel-and-pine, where-commerce-platforms-go-wrong — Neighbouring pages whose terms and ** — Final consistency pass: ledger-as-document references rephrased as Kestrel & Pine facts.\n- **2026-11-07** — Editorial review pass: Three-Status Order mechanism corrected to the ledger, wholesale prices moved by price events, a paraphrased Walmart quote replaced with the source's verified wording.\n- **2026-11-07** — Initial spec and article.\n"}]}]}</script>

                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
