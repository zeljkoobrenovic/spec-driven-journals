<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/37-journey-consumer-order/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (the thesis paragraph p03, the roadmap p04 and the conclusion's synthesis p55); these are listed under decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Which system owns each fact on a consumer order in the late-2027 design (the PIM the product, the platform's price list the price, the WMS physical stock, the availability service what may be sold per channel, the platform the cart and checkout, the PSP the payment, the OMS the order and its separate money, goods and return states, the WMS and the shipping service the parcel, PostNL the tracking events, the ERP the invoice and the ledger), and the fifteen steps from search to payout with the promise and the failure of each.\n- **Know:** How iDEAL shapes the order (instant charge, auto-capture only, a refund as a new transfer, the outcome learned from an id-only webhook and a fetched status, retries over hours or days); why the invoice is issued by one numbering authority at dispatch and corrected only by credit note; why revenue is recognized at delivery under IFRS 15; and how a PSP payout is matched to orders through its reconciliation report.\n- **Know:** The handoff requirements (freshness, consistency, latency, availability, style) for each join, and five failures with their detection and recovery: the duplicate order, the paid order never confirmed, the short pick, the lost parcel and the payout that does not match.\n- **Believe:** Eight systems holding a piece of one order is normal; a fact with two writers is the problem.\n- **Believe:** Every join delivers at least once and sometimes twice, late or not at all, so exactly-once is built by the receiver with a key and a reconciliation.\n- **Believe:** Finance can be batch; availability and the fulfillment order cannot.\n- **Be able to:** Trace an order through any merchant's landscape with a step table and name the system of record of each fact on it.\n- **Be able to:** Name, for each handoff, the idempotency key, the delivery style and the reconciliation that catches what the messages miss.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer or product manager who has read the capability chapters and now needs to see them as one path. The chapter is also written to be readable first, as a tour of the vocabulary, by a reader who starts here.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its 2026 and January 2027 incidents in outline and the names of the sixteen failure patterns.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines (money, goods, returns), 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, business models and the four scale stages, the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Parts II and III: product, variant, SKU and GTIN with one owning system per attribute; prices frozen at order placement; promotions as data; available-to-promise (on hand minus committed minus allocations), one writer each for on hand and committed, per-channel buffers; checkout creating the order once with payment pending until the provider's signed message; authorization, capture, settlement and payout, refunds as new payments; one order record with three status lines; tax from three facts, one invoice per shipment, credit notes as the only correction, the monthly match of invoices, payouts and bank lines.\n- From Parts IV to VIII: warehouse, shipping, notifications, integration styles, events and reconciliation, API contracts, and the part introduction's four journeys with their shared reading device.\n\n**Does not yet know:**\n\n- Entity-owner table; delivery-promise service; pick wave; manifest; tracking event; WISMO.\n- iDEAL's capture-less behaviour; payout reconciliation report and the three-way match; revenue at delivery under IFRS 15.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a duplicated order and a paid order stuck as pending, the reader locates each at its handoff and names the key and the reconciliation that handle it, rather than blaming the platform or the payment provider. *Probe:* A merchant's integration sends each new web order from its shop platform to its warehouse system. After an integration outage and replay, some customers receive two identical parcels; separately, a few orders paid by iDEAL still show 'payment pending' a day later, although the shoppers' banks show the money gone. Using only this chapter: what went wrong at which handoff, and what should be in place? | `custom` | cold_reader | major |\n| AC-2 | The reader can assign the facts on an order to systems of record and say which handoffs may be batch. *Probe:* Using only this chapter: for one online order, which system should own the product description, the price, physical stock, what may still be sold per channel, the order and its status, the payment and the invoice; and which handoffs may run as a daily batch and which may not? | `custom` | cold_reader | major |\n| AC-3 | The reader can say why a storefront's 'in stock' and delivery promise can be wrong while every system works, and what each should be computed from. *Probe:* A storefront says 'ordered before 22:00, delivered tomorrow' and shows 'in stock' from a stock number copied from the warehouse through the ERP every hour. The warehouse's last pick wave is at 21:00. Using only this chapter: what does a shopper ordering at 21:14 on a Tuesday get, and what should the page be computed from? | `custom` | cold_reader | major |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What has to go right, in which system, for one consumer order to be found, paid, picked, delivered and booked?\n\n> **Claim:** One consumer order crosses about fifteen handoffs among eight systems, and each step's promise (product, price, stock, delivery day, payment, parcel, invoice) is kept by a different system from the one before. It goes right when every fact has one system of record and every handoff carries the order number as an idempotency key, runs on a style matched to its clock (events for stock and orders, a daily batch for finance) and has a reconciliation behind it.\n\n**Disputed by:** The view that a capable shop platform keeps an ordinary order on its own: its order record is the order, its webhooks and integrations deliver each message once, and every system added beside it is a further place for the order to go wrong.\n\n**So what:** A merchant that accepts the claim reads its architecture by walking one order through it, counting writers rather than boxes, and puts a key and a reconciliation on every join before buying anything. Replayed through the late-2027 design, Eva's order #1072455 (21:14 on 13 April 2027, €235 by iDEAL, picked 14 April, delivered 15 April, invoiced net €194.21 plus €40.79 VAT) is promised Thursday and arrives Thursday, and its stock figure is seconds old. On the January 2027 landscape the same order was promised Wednesday by a static sentence, read stock up to two hours old and existed as three records with three statuses, the path on which the Three-Status Order of December 2026 showed Delivered, In picking and Not invoiced for six days and drew eleven tickets.\n\n**How and why:** The storefront answers from copies (a search index, an availability figure) and checkout only orchestrates calls to systems that own the facts, freezing the amounts it promises. The PSP reports the payment by webhook, which Mollie retries ten times over 26 hours and Stripe for up to three days without guaranteed order, so the order system fetches the status and keys creation on the order number. The warehouse confirms what it picked, the ERP numbers invoices gap-free at dispatch and corrects them only by credit note, and the PSP pays out in batches days later that contain hundreds of orders. Each system is right about its own fact on its own clock, so the order holds only if each join tolerates a repeated, late or missing message.\n\n**Supporting claims**\n\n- **S1** — Eight systems each hold a piece of one consumer order, and that is normal: each fact (product, price, physical stock, sellable stock, order, payment, parcel, invoice) has exactly one system of record, and copies are allowed but a second writer is not.\n- **S2** — The order crosses about fifteen steps from search to payout, and each step's promise is kept by a different system from the one before, so the failures that reach the customer sit at the handoffs between them.\n- **S3** — Every join delivers at least once and sometimes twice, late or not at all, so the receiver makes a repeat harmless with the order number as its idempotency key and catches gaps with a reconciliation, and webhooks are a latency optimization over a sweep, never a replacement.\n- **S4** — Each handoff's style follows its clock: stock and the fulfillment order must move by event because an hour's delay is an oversell or a missed cut-off, while invoice posting and payouts should run as a daily batch because finance tolerates a day and gains a reconciliation count.\n- **S5** — Run through the January 2027 landscape on the same dates, the same order read stock up to two hours old, was promised Wednesday by a static sentence and existed as three records with three statuses, while every system did what it was built to do: the failures were in the joins.\n\n## Role in the part\n\nWalks the recurring consumer order through every system of the late-2027 design with an entity–owner table, a step table and the handoff requirements, and compares the January 2027 path on the same dates. Supports P9-1, P9-5 of part `part-9`.\n\n## Flow\n\n**Pattern:** `chronological` (also `grouping` in handoffs, january, wrong: the walk read back as requirements, a comparison and failures)\n\nThe order's facts and owners come first because every step refers to them; the step table then gives the whole path, and the sections walk it in the order the order lives it (search, checkout and payment, the order record and the warehouse, transit, the books). Only after the reader has seen every join do the last three sections read the walk back: what each join requires, the same joins on the January 2027 landscape, and five failures with their detection. Moving the requirements or the failures before the walk would describe joins the reader has not met; moving the January comparison earlier would contrast a design the reader has not yet seen work.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): Eva Janssen buys a jacket and socks from Kestrel & Pine, a fictional outdoor brand. To deliver that simple purchase, search, checkout, payment, warehouse, carrier and finance systems must pass records to one another; a wrong stock answer or a late warehouse instruction can break the delivery promise even when checkout succeeds.\n\n**Bridge:** An online purchase that looks like one action to the shopper. → At 293,000 orders a year, the many systems behind it and what each handoff must preserve so that a one-in-a-thousand failure does not reach customers daily.\n\n**Thesis statement** (KEY POINTS callout (bullets 1 to 3) and paragraph p03): One consumer order crosses about fifteen handoffs among eight systems, each step's promise kept by a different system from the one before; it goes right when every fact has one system of record and every handoff carries the order number as an idempotency key, moves by event or daily batch as its clock requires, and has a reconciliation behind it.\n\n**Roadmap** (Paragraph p04):\n\n- Set out the order, the replay through the late-2027 design and the owner of each fact. *Kept in:* order.\n- Give the fifteen steps in one table. *Kept in:* steps.\n- Follow the order through search, checkout and payment, the order record and the warehouse, transit, and the money and the books. *Kept in:* buy, checkout, record, transit, money.\n- State what each handoff requires. *Kept in:* handoffs.\n- Run the same order through the January 2027 landscape. *Kept in:* january.\n- End with five failures and how each is caught. *Kept in:* wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Eva Janssen's purchase of a jacket and socks from Kestrel & Pine depends on search, checkout, payment, warehouse, carrier and finance systems passing records to one another, so a wrong stock answer or a late warehouse instruction can break the delivery promise even when checkout succeeds; following one order makes those dependencies visible. | scenario: Eva's purchase of a jacket and socks from a fictional outdoor brand. |  |\n| p02 | context | At Kestrel & Pine's 293,000 online orders a year, a failure in one order per thousand reaches customers almost daily; the company, figures, dates and systems are invented for teaching. | statistic: 293,000 online D2C orders a year. | `cause_effect`: One order's dependencies on many systems. → Why they matter at Kestrel & Pine's volume. |\n| p03 | claim | The chapter's answer in short: the order crosses about fifteen handoffs among eight systems and each step's promise is kept by a different system from the one before, so it goes right only when every fact has one system of record and every handoff carries the order number as its key, moves by event or by daily batch as its clock requires, and has a reconciliation behind it. |  | `problem_solution`: A failure rate that reaches customers daily. → What has to go right, in which system, stated as the chapter's claim. |\n| p04 | transition | The chapter first sets out the order, the replay and the owner of each fact, gives the fifteen steps in one table, and follows the order through search, checkout and payment, the order record and the warehouse, transit, and the money and the books; it then states what each handoff requires, runs the same order through the January 2027 landscape and ends with five failures and how each is caught, using the replayed order, vendor documentation and official rules as evidence. |  | `sequence`: The claim. → The order in which the chapter argues it. |\n| p05 | context | In the order's journey this chapter is the full purchase from search to the books; the next chapter follows the jacket back, and the first chapter gave a shorter overview. |  | `place`: The chapter's plan. → Where it sits among the book's walks of the same order. |\n\n## Sections\n\n### The Order, the Setting and the Rules of This Walk\n\n**Controlling idea** (`description`, id `order`): The walk replays Eva's April 2027 order, with the ledger's dates and amounts, through the late-2027 Waypoint design, in which each fact on the order has one named system of record among eight systems.\n\n**Advances the thesis** (S1): Fixes the order, the design it runs through and the owner of each fact before the walk starts.\n\n**Transition in:** `elaboration`: The roadmap's first item: the order, the replay and the owner of each fact. → The order itself.\n\n**Order of paragraphs** (`prerequisite_order`): The order's facts come first, then the design it is replayed through and why the replay keeps the real dates, then the owners in that design; the walk needs all three, and the owner table cannot be read before the reader knows which design it describes.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | description | Eva's order #1072455: at 21:14 on Tuesday 13 April 2027 she buys a €199 Ridgewalker jacket and two €18 pairs of socks, €235 including VAT with free shipping, paid by iDEAL; Duiven picks and packs on 14 April and PostNL delivers on 15 April. | fact: 21:14 on 13 April 2027; €199 jacket, M, moss; two pairs of socks at €18; €235 incl. VAT; iDEAL; picked 14 April; delivered 15 April. |  |\n| p07 | context | The walk replays the order through the late-2027 design, in which Waypoint makes the WMS the owner of physical stock and adds an availability service (W1), an order management system (W2) and a product information management system (W3). |  | `elaboration`: The order's facts. → The design the order is walked through. |\n| p08 | context | None of the three was live for the real April order, which ran on the landscape Noor Visser found in January 2027 (storefront orders reach the OMS only from 13 October 2027), so the walk keeps her dates and amounts in the later design and a later section runs the same order through the January 2027 landscape. | fact: D2C orders through the OMS from 13 October 2027 (consistency ruling 4). | `contrast`: The late-2027 design. → The fact that the real order ran before it. |\n| p09 | definition | An entity-owner table names, for each fact on the order, the system of record whose value is trusted when copies disagree, and the systems that hold copies. | table: Ten facts (product, price, physical stock, sellable stock, cart and checkout, payment, order, fulfillment order and parcel, tracking events, invoice and ledger) with their system of record in late 2027 and who holds copies. | `sequence`: The replay's design. → The owner of each fact in it. |\n| p10 | analysis | Eight systems holding a piece of one order is the normal condition; the problem is a fact with two writers, and the table has none. |  | `conclusion_summary`: The entity-owner table. → What to read from it: count writers, not systems. |\n\n### Fifteen Steps in One Table\n\n**Controlling idea** (`process`, id `steps`): The whole journey fits one table of fifteen steps, each naming the system that performs it, the data that moves, the promise made, the failure that belongs to it and the owning chapter, and each step's promise has a different owner from the step before.\n\n**Advances the thesis** (S2): Shows the fifteen steps and that their owners change at every row.\n\n**Transition in:** `sequence`: The owners of each fact. → The steps in which those owners act.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | process | The step table lays out the fifteen steps from search to payout with their system, data, promise made, possible failure and owning chapter; times within a day are illustrative and the ledger fixes the dates. | table: Fifteen steps from search to invoice, revenue and payout, with system, data, promise made, what could fail and chapter. |  |\n| p12 | analysis | Each row's promise has a different owner from the row above, which is why the joins between rows are where most of the book's failure patterns sit. | figure: Figure 1: the order in the late-2027 architecture, every arrow a handoff with one sender and one owner. | `cause_effect`: The step table. → What its promise column shows about where failures sit. |\n\n### Before the Buy: Search, Product Page and \"In Stock\"\n\n**Controlling idea** (`explanation`, id `buy`): Before Eva buys, the storefront answers from copies, the search index built from the PIM and 'in stock' from the availability service, and how old each copy may be is the design question.\n\n**Advances the thesis** (S1, S4): Shows the first three promises with separate owners and the stock figure as a copy whose age is set by its delivery style.\n\n**Transition in:** `example`: Steps 1 to 3 of the table. → Eva's search and product page at 21:02.\n\n**Order of paragraphs** (`chronological`): Follows Eva's clicks: search, then the product page, then the size she selects; the stock question gets the most room because it is the costliest promise, so it is defined before the vendor evidence and the delay argument, and the target design comes last as the answer to that delay.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | explanation | The storefront searches a search index, a copy of the catalog rebuilt from the PIM on publication, so the first promise ('these products exist and match') belongs to the publication schedule that W5, Waypoint's integration standards, sets for products. | fact: W5: products move by scheduled publication. |  |\n| p14 | example | The product page's next promises have different owners: what the jacket is comes from the PIM and what it costs from the shop platform's NL price list, and the October 2026 Price Drift, nine days of the German storefront selling at €179, shows what a silent copy costs. | case: The Price Drift, October 2026: €179 on the German storefront for nine days while the other channels charged €199. | `sequence`: The search result. → The product page Eva opens. |\n| p15 | definition | 'In stock' is available-to-promise for the NL channel: the units that may still be promised, computed as on-hand minus units committed to orders minus the merchant's buffer, per location and per channel. |  | `elaboration`: The product page's promises. → The stock promise and what it is computed from. |\n| p16 | evidence | Platforms expose the same quantities: Shopify separates on_hand, committed and available per location, and commercetools documents an availability figure that lags reservations by up to ten seconds. | source: Shopify inventory documentation (on_hand, committed, available); commercetools Inventory documentation ('eventually consistent', up to 10 seconds), both n.d., accessed 2026-11. | `additional_support`: The definition of available-to-promise. → How two platforms document it. |\n| p17 | analysis | Even a ten-second lag can sell the last unit of a hot SKU twice during a launch, so the buffer and the reservation path are design decisions. |  | `cause_effect`: The ten-second consistency window. → Why a lag is a design decision. |\n| p18 | description | In the target design the WMS sends a stock event for every change, the availability service subtracts commitments and the one-unit buffer and publishes availability per channel, and the storefront only reads it, so the moss M's 23 available is a copy seconds old instead of the January 2027 copy up to two hours old. | scenario: 23 available for NL at 21:05 (assumption); storefront buffer one unit per SKU.; fact: January 2027 stock sync chain: up to two hours, behind the Black Friday Oversell. | `problem_solution`: A lag that can oversell. → How the target design keeps the copy seconds old. |\n\n### Checkout: Six Promises Under a Clock\n\n**Controlling idea** (`process`, id `checkout`): Checkout orchestrates calls to the systems that own each fact, computes the delivery promise from the warehouse's real cut-off and freezes the amounts it promises, and the iDEAL payment's outcome reaches the order from a webhook and a fetched status, not from Eva's browser.\n\n**Advances the thesis** (S2, S3): Shows checkout as orchestration of other systems' promises and the payment join as one that may deliver late, twice or not at all.\n\n**Transition in:** `time`: The stock answer Eva sees at 21:05. → Her cart at 21:09 and the checkout that follows.\n\n**Order of paragraphs** (`chronological`): Cart, then the six checkout steps in the order Eva meets them, then the payment step unpacked, then the order's creation; the payment needs the checkout's sequence before its own detour can be placed.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | explanation | A cart is a draft that reserves and promises nothing; most carts are abandoned (Baymard's 70.22% average), and because the shop platform reserves stock at order creation, an abandoned cart costs only a lost sale. | statistic: Baymard Institute's average of fifty studies: 70.22% cart abandonment (updated 28 October 2026). |  |\n| p20 | process (list) | Checkout is a roughly ninety-second orchestration of six steps (identity, address, delivery option and promise, price review, payment, confirmation), each a call to a system that owns the fact; the delivery-promise service knows Duiven's last pick wave at 21:00, so the 21:14 order is promised Thursday 15 April, the day it arrives. | fact: Duiven's last pick wave 21:00, PostNL collection 22:30 (consistency ruling 15).; fact: €199 + 2 x €18 = €235, free shipping above €75, frozen on the order. | `elaboration`: The cart as a draft. → Checkout, which turns it into promises. |\n| p21 | recommendation | None of these calls should be patched into the checkout's markup: Shopify retired checkout.liquid for the main checkout pages on 13 August 2024, and the decision to stay on the shop platform (W4) depends on keeping the checkout uncustomized. | source: Shopify changelog, 13 February 2023: checkout.liquid stops working for the main checkout pages on 13 August 2024.; figure: Figure 2: checkout as six promises under a clock, each tied to an outside system. | `cause_effect`: Checkout as orchestration of other systems. → Where those calls must not live. |\n| p22 | claim | The payment method Eva chooses matters because the money's state machine differs by method, and the order system must model the one it is given rather than a generic 'paid'. |  | `sequence`: The six checkout steps, payment among them. → The payment step in detail. |\n| p23 | explanation (list) | iDEAL is a bank-initiated transfer with an instant charge and auto-capture only, so there is no separate capture and a refund is a new transfer, the shopper may never return from her bank app, and the PSP's webhook is only a notification whose status is fetched and which is retried for hours or days. | statistic: Dutch Payments Association: 1.47 billion iDEAL payments worth €141 billion in 2024 (18 February 2025).; source: Mollie iDEAL and webhook documentation (instant charge, auto-capture only, 15-minute session, id-only webhook, ten retries over 26 hours); Stripe fulfillment and webhook guides (do not rely on the landing page; retries for up to three days, no guaranteed order). | `elaboration`: Payment methods have different state machines. → iDEAL's and its three consequences. |\n| p24 | process | At 21:14 the shop platform creates #1072455 with the payment pending and shows the confirmation, then marks the order paid when the webhook arrives and the fetched status confirms it, and sends the confirmation e-mail. | fact: Order created with the payment pending, marked paid from the fetched webhook status seconds later. | `example`: iDEAL's consequences. → What happens to Eva's order at 21:14. |\n\n### The Order Becomes a Record: Platform to OMS to WMS\n\n**Controlling idea** (`process`, id `record`): From 21:14 the OMS owns the order with one state model, keyed on the order number, and gives the warehouse only a fulfillment order; the WMS confirms what it picked and the shipping service turns the parcel into a manifested label.\n\n**Advances the thesis** (S1, S3): Shows the order's ownership passing to the OMS, the order number making a repeated message harmless, and the warehouse owning the parcel.\n\n**Transition in:** `time`: The order created and paid at 21:14. → Who owns it from that moment.\n\n**Order of paragraphs** (`chronological`): Follows the order from the platform's event at 21:14 through the commitment and the fulfillment order to Wednesday's pick, label and evening collection; each step needs the previous one's record to exist.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | claim | From 21:14 the order belongs to the OMS, the handoff that Waypoint's W2 was created to fix. |  |  |\n| p26 | description | The shop platform's 'order placed' event reaches the OMS through the iPaaS, and the OMS keeps one state model for every channel with separate money, goods and return states, because fulfilled never means delivered and paid never means invoiced. | source: Shopify and commercetools order models, n.d., accessed 2026-11: separate payment and fulfillment states on one order. | `elaboration`: The OMS owns the order. → What the event carries and how the OMS records it. |\n| p27 | definition | The order number is the idempotency key: a second copy of the event finds the existing order and does nothing, which matters because webhooks arrive more than once and out of order; W5 makes this a standard. | quotation: Shopify: 'your app might receive the same webhook more than once'; Stripe's idempotent requests return the first response to a retried key. | `cause_effect`: The event that creates the order. → What happens when it arrives twice. |\n| p28 | process | Stock is committed: the availability service moves one jacket and two pairs of socks from available to committed, on-hand stays, and the moss M's availability drops from 23 to 22 within seconds. | scenario: Available 23 to 22 for the moss jacket in M. | `sequence`: The order created once. → The stock it commits. |\n| p29 | definition | The fulfillment order is the contract with the warehouse: it carries only what the warehouse needs and follows a request, accept or reject, and cancellation-request handshake; the WMS accepts at 21:15. | source: Shopify's fulfillment-order design (shopify.dev, n.d., accessed 2026-11). | `sequence`: The committed stock. → The instruction the OMS sends Duiven. |\n| p30 | process | On Wednesday morning the order is picked in the 06:30 pick wave, the GTIN scans confirm the promised units exist, and the WMS sends a stock event to the availability service and a shipped event to the OMS. | fact: First wave of the day 06:30 (illustrative). | `time`: The accepted fulfillment order. → Wednesday morning at Duiven. |\n| p31 | explanation | The shipping service gets the PostNL label and manifests the day's parcels, absorbing carrier rules such as DHL's manifest close-out and PostNL's API migration so the WMS sees one label call. | source: DHL Parcel DE Shipping API (transfer only when manifested, automatic close-out at 17:45); PostNL developer portal (renewed API generation from 2025). | `elaboration`: The label the shipped event waits for. → Where it comes from and what a manifest is. |\n| p32 | process | At 18:30 the shipping service closes Wednesday's PostNL manifest and at 22:30 PostNL collects the parcel. | fact: Manifest 18:30; PostNL collection 22:30 (illustrative). | `time`: The label and manifest. → Wednesday evening's close and collection. |\n\n### In Transit: Tracking, Notifications and \"Where Is My Order\"\n\n**Controlling idea** (`explanation`, id `transit`): From collection the parcel's state is PostNL's to know and Kestrel & Pine's to relay: notifications, the status page and the service agent should read one record, and the delivered event is also the moment risk passes to Eva.\n\n**Advances the thesis** (S2): Shows the carrier's promise and how its events reach the customer through other systems.\n\n**Transition in:** `time`: The parcel collected at 22:30. → Its journey with the carrier.\n\n**Order of paragraphs** (`chronological`): Tracking events first, then the messages Eva receives from them, then the support cost when they fail, then delivery as the legal end of the parcel's journey; the messages cannot be explained before the events that trigger them, and the support cost reads as an architecture signal only once the reader knows where the tracking number travels.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | definition | A tracking event is one carrier scan with a time and place; the shipping service maps carriers' codes to one small vocabulary and feeds the OMS, which updates the goods state and raises the notifications. | source: EasyPost tracker documentation: ten normalized statuses. |  |\n| p34 | description | Eva receives three messages from three sources: the shipping confirmation when the WMS reports the shipment at 08:40 on Wednesday, before PostNL collects the parcel, out for delivery at 07:50 and delivered at 11:20 on Thursday, and her status page reads the same record as the service agent. | fact: Shipment confirmed 08:40 on 14 April; out for delivery 07:50 and delivered 11:20 on 15 April (illustrative). | `example`: Tracking events and notifications in general. → The three Eva receives. |\n| p35 | evidence | WISMO, 'where is my order', is the largest category of support contacts and an architecture signal: a tracking number that never left the WMS means the customer gets no updates. | statistic: Gorgias: WISMO 18% of incoming requests (updated 13 November 2023).; quotation: Shopify: 'If you fulfill an order without a tracking number, then no shipping updates are received.' | `cause_effect`: Messages relayed from the carrier. → What happens when the relay fails. |\n| p36 | explanation | Delivery is also a legal event: under the Consumer Rights Directive risk passes when Eva takes physical possession, so the OMS needs the delivered event and not only the shipped one. | source: Directive 2011/83/EU, Art. 20. | `additional_support`: The delivered message. → Why delivery matters beyond notification. |\n\n### The Money and the Books\n\n**Controlling idea** (`process`, id `money`): After delivery three records must agree: the ERP's invoice issued at dispatch and corrected only by credit note, revenue recognized at delivery, and a PSP payout matched days later against the bank by finance, not by the order system.\n\n**Advances the thesis** (S3, S4): Shows the finance joins as daily batches closed by a reconciliation.\n\n**Transition in:** `contrast`: The parcel at Eva's door. → The order's journey, which continues in the books.\n\n**Order of paragraphs** (`chronological`): Invoice at dispatch (Wednesday), revenue at delivery (Thursday), payout days later and its match last, the order in which the records come into existence.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | transition | The parcel's journey ends at the door but the order's does not: the invoice, the payment and the bank still have to agree. |  |  |\n| p38 | explanation | The ERP issues the invoice from the shipped event because a Dutch invoice needs a unique, gap-free sequential number assigned by one system at posting. | source: Belastingdienst invoice requirements, n.d., accessed 2026-11. | `elaboration`: Three documents that must agree. → The first, the invoice. |\n| p39 | explanation | An issued invoice is immutable and corrected only by credit note, so Eva's exchange next week will produce a credit note, not an edit. | quotation: Odoo 18.0: 'Once confirmed, an invoice can no longer be updated'; a credit note 'is the only legal method' to cancel, refund or modify one. | `additional_support`: The invoice's numbering. → What happens once it is issued. |\n| p40 | example | Eva's invoice reads net €194.21, VAT €40.79, gross €235.00, matching checkout because nothing changed; when a line is short or canceled the invoice follows what shipped. | fact: Jacket €164.46, socks €29.75 net; total €194.21 net, €40.79 VAT, €235.00 gross. | `example`: Invoice rules. → Eva's invoice. |\n| p41 | explanation | Revenue is recognized at delivery under IFRS 15: Kestrel & Pine was paid on Tuesday, invoiced on Wednesday and earned the revenue on Thursday, with a refund liability beside it, three dates finance needs in three fields. | source: IFRS 15 (issued 2014, effective 2018); consistency ruling 1.; statistic: 24% item return rate. | `sequence`: The invoice issued on Wednesday. → When the revenue counts. |\n| p42 | evidence | The PSP pays out in batches days later, Adyen two business days after the sales day and Stripe after three business days to seven calendar days. | source: Adyen sales day payout; Stripe payouts documentation, n.d., accessed 2026-11. | `sequence`: Revenue on Thursday. → When the money arrives. |\n| p43 | explanation | One bank deposit therefore holds hundreds of orders net of fees, refunds and chargebacks, and the join is the PSP's payout reconciliation report. | quotation: Stripe's payout reconciliation report lists 'every payment, refund, dispute, fee, and other balance transaction included in the payout' with the order id and a trace_id. | `cause_effect`: Batched payouts. → How one deposit is traced to orders. |\n| p44 | example | The ERP matches Eva's €235 in Tuesday's batch to her invoice, posts the PSP's fee and closes the three-way match of invoices, PSP report and bank statement. | figure: Figure 3: one order, three financial records (checkout promise, ERP invoice, PSP payout against the bank). | `example`: The payout reconciliation report. → Eva's €235 in it. |\n\n### What Each Handoff Requires\n\n**Controlling idea** (`analysis`, id `handoffs`): Each handoff's style follows from how fresh, consistent, fast and available it must be: availability and the fulfillment order must be events, while invoice posting and payouts should be a daily batch.\n\n**Advances the thesis** (S4): States the requirements and style of each join walked so far.\n\n**Transition in:** `conclusion_summary`: The joins walked from search to payout. → What each of them requires.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | evidence | A table gives each join's freshness, consistency, latency, availability and style under W5; the latency figures are illustrative targets, not ledger facts. | table: Seven handoffs (WMS to storefront availability, checkout-PSP-platform, platform to OMS, OMS to WMS, WMS to carrier, OMS to ERP, PSP to ERP) with freshness, consistency, latency, availability and style. |  |\n| p46 | analysis | Two rows cannot be batch, availability and the fulfillment order, because an hour's delay is an oversell or a missed cut-off, and two should be, invoice posting and payouts, because finance tolerates a day and gains a reconciliation count: finance can be batch, availability cannot. |  | `cause_effect`: The requirements table. → Which rows must be events and which should be batch. |\n\n### The Same Order in January 2027\n\n**Controlling idea** (`comparison`, id `january`): On the January 2027 landscape the same order kept its dates but read stock up to two hours old, was promised Wednesday by a static sentence, existed as three records and waited for an 'order complete' invoice trigger, while every system worked: the failures were in the joins.\n\n**Advances the thesis** (S5): Holds the main systems constant and changes only the joins, showing where the failures were.\n\n**Transition in:** `contrast`: The late-2027 joins and their requirements. → The same order on the landscape Noor Visser found in January.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | comparison | Run through the January 2027 landscape, four things change while the dates stay the same: stock up to two hours old, a static promise of Wednesday that the parcel missed, three order records with three statuses, and an invoice sent only on the WMS's 'order complete'. | table: Late 2027 against January 2027 for 'in stock', the delivery promise, the order record and the invoice.; fact: WMS to ERP every 15 minutes, ERP to platform hourly; static 'ordered before 22:00, delivered tomorrow'. |  |\n| p48 | analysis | The parcel still arrived Thursday; the Three-Status Order of December 2026 is this January path with one split shipment, and nothing in that landscape was broken: the joins had no owner, no key and no reconciliation, which W5 changed. | case: #1052877, December 2026: Delivered, In picking and Not invoiced for six days, eleven tickets; the iPaaS flow marked the order fulfilled at the first parcel and the ERP waited for 'order complete'. | `cause_effect`: The four differences. → What they cost and where the cause lay. |\n\n### When It Goes Wrong Along This Path\n\n**Controlling idea** (`analysis`, id `wrong`): Five failures along the path recur at every merchant, and each is caught by a key, a sweep, a scan, a tracking rule or a three-way match rather than by the system where it shows.\n\n**Advances the thesis** (S3): Gives each failure's mechanism, detection and recovery, each at a join.\n\n**Transition in:** `example`: Joins without owner, key or reconciliation. → Five failures on this path with their detection and recovery.\n\n**Order of paragraphs** (`chronological`): The failures follow the order's path: the order created, the payment confirmed, the pick, the parcel in transit, the payout; a reader can map each to its row of the step table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p49 | transition | Of the failures the step table names, five deserve their mechanism, detection and recovery because they recur at every merchant. |  |  |\n| p50 | example | The duplicate order: an 'order placed' event arriving twice is a no-op when the OMS keys on the order number, and a count of orders received against created shows it; without the key two parcels ship. | figure: Figure 4: two copies of #1072455's message; with the key one parcel ships, without it two. | `sequence`: Five failures announced. → The first, at order creation. |\n| p51 | example | The order paid and never confirmed: when the PSP's webhook fails for good, a daily sweep queries the PSP for checkouts with no terminal payment state and marks them paid once, because webhooks are a latency optimization over a reconciliation, never a replacement. | fact: Mollie's 26 hours of retries; the sweep Stripe's and Mollie's documentation ask merchants to run. | `sequence`: The duplicate. → The opposite failure: a message that never arrives. |\n| p52 | example | The short pick: when the shelf holds fewer units than the WMS expects, the scan detects it and the WMS, OMS and availability service correct the line, the stock and the customer's expectation before the promise date. | statistic: DeHoratius and Raman (2008): 65% of about 370,000 inventory records inaccurate at one retailer (dated). | `sequence`: Failures of messages. → A failure of the stock record itself. |\n| p53 | example | The lost parcel: a rule on the tracking stream flags a parcel with no scan for 48 hours, and the merchant re-ships and claims against the carrier while the invoice stays unchanged. | statistic: PostNL delivery quality 97% (annual report, 2025); the remaining 3% is about ten thousand of Kestrel & Pine's parcels a year. | `sequence`: The pick. → The parcel in transit. |\n| p54 | example | The payout that does not match: a short batch is traced through the three-way match to a later refund, a fee, a failed refund or a double refund, and corrected with the PSP's line as evidence and one writer for refunds. | case: The Double Refund, January 2027: €19,400 refunded twice. | `sequence`: The parcel. → The last join, the payout. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Eva's purchase looked like one action, but it took about fifteen handoffs among eight systems, and checkout succeeding was only one of them. Replayed through the late-2027 design it is promised Thursday and arrives Thursday on a stock figure seconds old; on the January 2027 landscape the same shop platform, WMS, ERP and PSP promised Wednesday on stock up to two hours old. What differs is the joins, not the systems: one owner per fact, the order number as the key on every handoff, events where the clock is seconds and a daily batch where finance can wait, and a reconciliation behind each.\n\n**So what:** A merchant that walks one ordinary order through its own landscape and checks those four things at each handoff finds its next incidents before its customers do, and before it buys another system.\n\n**Callback:** The introduction's hook: Eva's simple purchase, where a wrong stock answer or a late warehouse instruction can break the delivery promise even when checkout succeeds. Both dangers named in the opening turn out to be joins (the stock copy and the fulfillment order), which the reader can now locate and specify.\n\n**Takeaway** (`course_of_action`): Walk one order through your landscape with the step table, and stop at every row where the promise and the system of record belong to different systems with no event, no key and no reconciliation between them; count writers, not boxes.\n\n**Hand-off** to [Journey 2: The Jacket Comes Back](journey-return-and-exchange.html): `sequence`: Journey 1's delivered order #1072455, with its iDEAL payment, its invoice in the ERP and its record in the OMS. → The way back through many of the same systems in the opposite direction, with a refund and a credit note where the payment and the invoice were, and the Double Refund of €19,400.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55 | synthesis | Eva's purchase took about fifteen handoffs among eight systems, and the two dangers the opening named, a wrong stock answer and a late warehouse instruction, are both joins: replayed through the late-2027 design the order is promised Thursday and arrives Thursday, while on the January 2027 landscape the same systems promised Wednesday, so what keeps the order is one owner per fact, the order number as key, a style matched to each clock and a reconciliation, and a merchant that checks these on one order finds its next incidents first. | reasoning: The opening's purchase set against the late-2027 and January 2027 outcomes. |  |\n| p56 | synthesis (list) | Established: systems each own one fact and failures concentrate at the handoffs, as four vendors document from four sides; every delivery mechanism is at-least-once, so exactly-once is built by the receiver with a key; and the invoice comes from one numbering authority at dispatch, is corrected only by credit note, and revenue counts at delivery. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what the sources establish. |\n| p57 | synthesis (list) | Depends on context: whether an OMS is needed at all (yes at Kestrel & Pine's stage, the Giant's Boots for a one-channel merchant), whether the delivery promise must be computed (when cut-off and collection differ or there is more than one lane), and whether capture should follow shipment (for cards, not for iDEAL). |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p58 | recommendation (list) | The author's synthesis: read any architecture by walking one order through it with the step table and stopping at every row where promise and system of record belong to different systems with no event, key or reconciliation, and prefer eight systems with one owner per fact to three with two owners for stock. |  | `contrast`: What depends on context. → The author's own reading. |\n| p59 | recommendation (list) | Nine questions let a reader check their own landscape: the system of record of each fact, the idempotency keys, who notices a missing webhook, where the delivery promise comes from, how old 'in stock' can be, who handles a short pick, whether status page and agent read one record, who numbers invoices, and how payouts are matched. |  | `sequence`: The author's reading. → The questions that apply it to the reader's own landscape. |\n| p60 | transition | Eva's jacket arrived on Thursday and on Monday she will ask for a size L; the way back starts from the order the OMS holds and crosses many of the same systems in the opposite direction, with a refund and a credit note where the payment and the invoice were, and it is where Kestrel & Pine paid €19,400 twice. |  | `sequence`: The questions about one order. → The same order coming back, in the next chapter. |\n\n## Non-goals\n\n- Teaching any capability in depth: search, product data, availability, checkout, payments, the OMS, the warehouse, carriers and the promise, notifications, invoicing and the ledger, reconciliation. The chapter names each step's owner and links. See [Finding the Product: Search, Navigation and Merchandising](commerce-search-and-discovery.html), [What Are We Selling? Products, Variants and the Catalog](product-information.html), [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html), [From Cart to Confirmation: Checkout Orchestration](cart-and-checkout.html), [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html), [The Order Record: Lifecycle, State and the Order Management System](order-management.html), [Pick, Pack, Ship: Warehouse Management and Fulfillment](warehouse-and-fulfillment.html), n, Three-Status mechanism per item 2. (from spec.md)\n- **2026-11-07** — Initial spec and article. (from spec.md)\n"}]}]}</script>

    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,

        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);

            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';

                const h = line.match(/^(#{1,6})\s+(.*)$/);

                    continue;
                }

                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');

                if (bullet.test(line) || ordered.test(line)) {

                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
