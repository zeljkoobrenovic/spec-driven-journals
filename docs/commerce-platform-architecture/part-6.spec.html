<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published page (posts/part-6-intro/index.md, 435 words, nine units) and its former spec.md, then reordered the same day (see decision_log); the page was revised to match. One spec paragraph per unit of the page. The KEY POINTS callout is evidence of the claim paragraph (p04); Figure 1 (the relay of handoffs) belongs to the hook (p01), Figure 2 (the joins Eva's order crosses) to the company paragraph (p03) and Figure 3 (the five questions) to the claim and roadmap (p04).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part VI answers five questions in order: how systems talk (files, shared databases, direct calls or messages, chosen per flow); how they retry safely and recover from disagreement (idempotency, the outbox, reconciliation); how their interfaces change and retire (versions and retirement dates); how records that refer to the same customer or product are connected; and why valid reports disagree.\n- **Know:** Kestrel & Pine's starting point: thirteen systems and 34 integrations, 13 of them with nobody to call in January 2027, and the Waypoint decisions that answer the part (integration standards, shared metric definitions and customer identity rules).\n- **Know:** That a join can fail while the systems at both ends work, and that the part sits under every step of Eva's order: checkout to warehouse and finance, payment success, stock after picking, the exchange.\n- **Be able to:** Pick the Part VI chapter that answers the decision in front of them.\n\n**Audience:** Readers new to commerce architecture (engineers, product managers and integration leads at a merchant that runs a dozen systems) who have read Parts I to V and are about to start the integration chapters, or who arrive with one integration, retry, interface, identity or reporting decision in hand and want the chapter that answers it.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Part I: the thirteen steps of an order, promise and handoff, the three status lines (money, goods, returns), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation; the glosses for PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, OMS, availability service, D2C, B2B, PIM and POS; the four scale stages; the Waypoint decisions W1 to W8 and the failure patterns and incidents in outline.\n- Parts II and III: one owner per product, price, discount and stock fact; available-to-promise; checkout creating the order once; refunds as new payments; one order record with three status lines; one invoice per shipment and the monthly match with the bank.\n- Parts IV and V: the warehouse system as the only writer of on-hand stock; returns with one refund writer; the connector that owns nothing and puts every marketplace order into the order record; the ERP owning the business buyer's prices, terms and credit; each EDI document with one source; the ERP keeping the ledger, purchasing and master data and receiving orders, shipments and payments by batch.\n- Kestrel & Pine in outline: a fictional outdoor brand, its thirteen systems, its incidents and the Waypoint program; Eva's jacket order of 13 April 2027 and her later exchange.\n\n**Does not yet know:**\n\n- The outbox (glossed here as saving an event with the change it describes); sunset or retirement dates of interface versions (named here; owned by api-contracts-and-versioning).\n- Cross-references, matching rules and reversible merges of customer and product records (owned by identity-and-master-data; only named here).\n- Metric definitions and the bridge between systems' counts (owned by commerce-data-and-analytics; only named here).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the five chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next five chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | A reader of this page alone can say why an exchange between two working systems can still fail, and what the merchant has to add besides an integration tool. *Probe:* Using only this page: how can an order be lost or doubled, or a customer go unrecognized, when every system involved is working, and what does Kestrel & Pine add besides its integration tool? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** How do separately owned systems behave like one platform?\n\n> **Claim:** They behave like one only where each join is decided: an exchange style chosen for the flow's freshness and failure needs, with a named owner; receivers that make a repeated message harmless, and a reconciliation job that shows two systems' copies agree; a contract that records each pinned version and its sunset date; one master and a cross-reference per shared customer or product; one owned definition per reported metric.\n\n**Disputed by:** The view that integration is a tooling choice: buy an integration platform or make the company event-driven, leave duplicates and lost messages to the platform's retries, let each vendor connector map fields and identifiers its own way, and treat differing numbers as a reporting problem for the data team.\n\n**So what:** A merchant that accepts the claim writes, for each flow, an inventory row with an owner, a key, a comparison, a pinned version and a date before it buys integration tooling, and names a master per entity and an owner per metric before it builds loyalty programs or dashboards. At Kestrel & Pine, 13 of 34 integrations had no named owner in January 2027 (5 were still unowned in April 2027) and only 3 had a reconciliation job, none for stock or orders; in the same months 212 returns were refunded twice (€19,400), the bol marketplace sold from two-day-old stock after an API version retired on 8 February 2027, one customer, Eva Janssen, existed as four records, and February's orders were counted as 21,050, 22,710 and 24,140.\n\n**How and why:** Each system is run by a different team or vendor and changes on its own schedule. Queues and webhooks would rather repeat a message than lose it, so delivery is at least once and unordered; a copy nobody compares drifts silently; a vendor retires a version on a date it chooses; each system keys people and products by what its own job has; and each counts what it exists to handle. Faster or more reliable transport removes none of these differences; a recorded decision with an owner turns each into a check someone runs.\n\n**Supporting claims**\n\n- **P6-1** — The exchange style (file, shared database, direct call, message) and its trigger are chosen per flow from its freshness, consistency, latency and availability needs: stock, orders and prices by events with a reconciliation net, products by scheduled publication, finance by a checked daily batch; and every flow has a row in an integration inventory with a named owner.\n- **P6-2** — Delivery between systems is at least once and unordered, so each receiver makes a repeat harmless with an idempotency key that names the business action, events are published with the change they describe (an outbox, or a webhook plus a periodic sweep), partial work is undone by compensation, and a reconciliation job with a key, tolerance, cadence and recipient shows whether copies agree, fixing them from the system of record.\n- **P6-3** — A contract states shape, meaning, timing and lifetime; a provider changes it by adding what consumers can ignore and retires a version on an announced date pair while monitoring who still calls it; a consumer records each pinned version and its sunset date with an owner, and treats webhooks as signed hints to verify, deduplicate and sweep.\n- **P6-4** — Each shared entity has one named master (the shop platform for consumers, the ERP for business customers, the PIM or the ERP item master for products), a cross-reference of every other system's identifier with a reversible merge log, and written matching and survivorship rules; the exact operational master feeds the fuzzy marketing profile, never the reverse.\n- **P6-5** — Operational systems count what they exist to handle, from the records that reach them, on their own dates, so honest counts differ; a metric is defined once with an owner, computed in one analytical store fed by every system, and published with the bridge to each system's count.\n\n## Role in the part\n\nPerforms the part's opening: states the part thesis in its three key points, places the part under every step of Eva's order, gives Kestrel & Pine's thirteen systems and 34 integrations with the 13 unowned in January 2027, and gives the reading order.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in chapters: the five chapter paragraphs, in the part's reading order; `grouping` in chapters: the first three paragraphs (how data moves, recovers and changes) and the last two (what the moved data means, as records and as numbers), joined at p08)\n\nThe page states a problem and the part's answer to it; the problem goes from failures at any join, to the path of one order, to the company-wide inventory. It opens on three failures at the joins between working systems; shows that every step of Eva's order crosses such a join; gives the size of the problem at Kestrel & Pine (thirteen systems, 34 integrations, 13 with no named owner in January 2027), with Figure 2 showing the joins her order crosses; then the answer: Waypoint's decisions, each with an owner, not the integration tool, make the flows recoverable, and the part's five questions, one per chapter; then one paragraph per chapter; and a one-paragraph closing that ties the opening's failures to the decisions and says where to start. Eva's order comes before the company's numbers so that the 34 integrations are the joins under steps the reader already knows; the unowned integrations come before the claim because the claim ('decisions with owners') answers them; the five questions close the claim paragraph because they announce the chapter list that follows. Put the claim first and it answers a problem with no systems in it; put the chapters first and they point at questions the reader has not been asked.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): An order reaches the warehouse twice, a stock update arrives after the last unit has sold, or an invoice names a customer the finance system cannot identify; the systems at either end can work correctly while the exchange between them fails.\n\n**Bridge:** Parts II to V, whose systems and channels each hold copies of the same facts (chapter 23 ends on the ERP as one of a dozen systems that must behave like one), and Eva's order crossing from checkout to the warehouse and finance, with payment success arriving separately, picking changing what channels may sell and her exchange adding return and replacement records. → The joins those steps depend on: Kestrel & Pine's thirteen systems and 34 integrations, and the Waypoint decisions on integration standards, metric definitions and customer identity.\n\n**Thesis statement** (KEY POINTS bullets 1 to 3 and paragraph p04): Separate systems behave like one only where each join is decided and owned: a style chosen per flow with an owner, safe retries and reconciliation, versions and deadlines on contracts, one identity per customer and product, and one definition per metric; the integration tool alone cannot supply that ownership.\n\n**Roadmap** (paragraph p04 (last sentence) and Figure 3):\n\n- Five questions, one chapter each, in reading order: how systems talk, recover from repeats and gaps, change their interfaces, recognize the same customer or product, and count orders. *Kept in:* chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | An order can reach the warehouse twice, a stock update arrive after the last unit has sold, or an invoice name a customer finance cannot identify while the systems at both ends work correctly and the exchange between them (the join) fails, so the part is about making the handoffs between systems timely, understandable and recoverable. | example: Three failures at a join: an order delivered to the warehouse twice, a stock update after the last unit sold, an invoice whose customer finance cannot identify.; figure: Figure 1: a parcel passed between four systems, each handoff showing it arriving late, twice, in the wrong shape or not at all. |  |\n| p02 | context | Every step of Eva's order at Kestrel & Pine, the fictional outdoor brand, crosses a join: checkout hands her order to the warehouse and finance, the PSP confirms payment separately, picking reduces the stock channels may sell, and her exchange adds return and replacement records. | scenario: Eva's order from checkout to warehouse and finance, the separate payment success, picking, and her later exchange (fictional). | `elaboration`: Failures at the handoffs between working systems. → Where those handoffs lie on Eva's order: under every step of it. |\n| p03 | context | Those steps run across Kestrel & Pine's thirteen systems and 34 integrations; in January 2027 nobody owned 13 of the integrations, and Eva's order in April crosses eight of the systems. | scenario: Thirteen systems and 34 integrations; 13 of them with no named owner in January 2027 (fictional).; figure: Figure 2: the joins Eva's order crosses in April 2027: eight systems, four styles, and a stock figure that takes up to two hours to travel from the warehouse to the marketplaces. | `elaboration`: The steps of Eva's order and their messages. → The company's systems and integrations that carry them, and the integrations nobody owned. |\n| p04 | claim | Part VI's claim and roadmap: Kestrel & Pine's integration platform (iPaaS) moves messages but cannot own a flow, so Waypoint adds decisions, each with an owner (integration standards, customer identity rules, shared metric definitions, in the order of the questions they answer), which make the flows explainable and recoverable; the part asks five questions, one chapter each: how systems talk, recover from repeats and gaps, change their interfaces, recognize the same customer or product and count orders. | scenario: Waypoint's integration standards (W5), shared metric definitions (W7) and the customer identity rule (fictional).; reasoning: KEY POINTS callout: integration is decided per flow and every flow needs an owner (13 of 34 integrations with nobody to call in January 2027); separate systems are built to disagree, so design them to recover; moving the data is half the work, meaning the same thing by it the other half.; figure: Figure 3: the five questions of Part VI and the answer each chapter gives; every incident in the part is a flow that had no answer to one of them. | `problem_solution`: The 34 integrations, 13 of them with no named owner. → Waypoint's decisions with owners as the answer, not the tool, and the five questions that organize the part. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the five chapters answers one of the part's questions and opens on one Kestrel & Pine case; the first three are about how data moves, recovers and changes, the last two about what it means.\n\n**Advances the thesis** (P6-1, P6-2, P6-3, P6-4, P6-5): Each paragraph introduces the chapter that argues one supporting claim, so the list is the part's argument in outline.\n\n**Transition in:** `elaboration`: The five questions announced in p04. → One paragraph per chapter: the question in bold, the case it opens on and what the chapter adds.\n\n**Order of paragraphs** (`prerequisite_order`): Each chapter uses what the one before it fixed. Integration styles comes first because it gives the vocabulary (styles, triggers, the integration inventory) and the per-flow rule; events and reconciliation needs the asynchronous styles to explain why repeats and gaps are normal; API contracts adds versions and dates to the inventory and relies on the previous chapter's safe retries; identity follows the transport chapters because its point is that delivered, recovered and versioned messages still do not say whether two records are one customer; analytics comes last because it consumes every flow and the customer master. Putting reconciliation before styles would teach recovery for deliveries the reader has not met; putting analytics before identity would leave its customer counts undefined.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description | The integration-styles chapter chooses files, shared databases, direct calls or messages according to each flow's needs (events for stock, scheduled publication for products), and each flow needs a documented purpose, owner, failure behavior and check. | reasoning: The four exchange styles and the four things each flow needs (purpose, owner, failure behavior, check). |  |\n| p06 | description | The events chapter explains safe retries and recovery from disagreement: idempotency makes repeats harmless, an outbox saves an event together with the change it describes, and reconciliation compares records to find gaps; duplicate refunds show why keys matter, stock differences why reconciliation does. | scenario: Duplicate refunds (the Double Refund) and stock differences (the first stock reconciliation) (fictional). | `sequence`: Flows with a chosen style and an owner. → What happens when their messages repeat or go missing. |\n| p07 | description | The API-contracts chapter manages interface changes and retirement dates: a forgotten 2021 script stops sending stock when a vendor retires its API version in February 2027, and a recorded version, deadline, owner and upgrade check would have made that change actionable. | scenario: The bol stock script of 2021 that stopped working when the connector retired its API version on 8 February 2027 (the Deprecated Endpoint) (fictional). | `sequence`: Flows that recover from repeats and gaps. → What happens when the interface itself changes or retires. |\n| p08 | description | The last two chapters turn to shared meaning: the identity chapter connects records that refer to the same customer or product, starting from Eva's four separate records in the storefront, loyalty, newsletter and returns systems, and defines authoritative identities, cross-references, matching and reversible merges. | scenario: Eva appearing as four records: storefront, loyalty, newsletter and returns portal (fictional). | `contrast`: The three chapters on how data moves, recovers and changes. → The second half of the work: whether the systems mean the same customer or product by the data. |\n| p09 | description | The analytics chapter explains why valid reports disagree: the platform, finance and the warehouse report 21,050, 22,710 and 24,140 February orders because their definitions and coverage differ, and a common definition makes genuine missing data distinguishable from expected differences. | scenario: February 2027 counted as 21,050 (platform), 22,710 (ERP) and 24,140 (warehouse) orders (fictional). | `sequence`: Records that mean the same customer or product. → Numbers that mean the same thing: the definition behind a count. |\n\n## Conclusion: Where to Begin\n\n**Synthesis:** Each of the opening's failures is settled by a decision at its join, not a new tool, in the order the opening gives them: the doubled order by ignoring repeats, the late stock update by a style chosen for freshness, the unknown customer by one authoritative identity. No chapter paragraph says this of the opening's failures.\n\n**So what:** The reader knows the opening's failures are settled by decisions at the join, not by a new integration tool, and starts with the first decision, how each flow talks.\n\n**Callback:** The opening's order that reaches the warehouse twice, stock update after the last unit sold and invoice whose customer finance cannot identify (p01). The closing names the decision each failure lacked.\n\n**Takeaway** (`course_of_action`): Begin with integration-styles.\n\n**Hand-off** to [APIs, Events, Files and Middleware: How Commerce Systems Talk](integration-styles.html): `elaboration`: The part introduction's first question, how systems talk (files, shared databases, direct calls or messages according to the flow's needs), and the 13 integrations that had no owner in January 2027. → The four styles, the five triggers, the three ways to wire a landscape, the per-flow choosing rule and the integration inventory.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | synthesis | The opening's failures, in the opening's order, are each settled by a decision at the join, not a new tool (ignoring repeats, a style chosen for freshness, one authoritative identity); begin with the first chapter, integration-styles. |  |  |\n\n## Non-goals\n\n- Teaching any chapter's mechanisms (idempotency keys, the outbox, versioning strategies, matching rules, the metrics layer); the page summarizes and does not re-argue. See [APIs, Events, Files and Middleware: How Commerce Systems Talk](integration-styles.html), [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html), [Promises Between Systems: API Contracts, Webhooks and Versioning](api-contracts-and-versioning.html), [One Customer, One Product: Identity and Master Data Across Systems](i     (function () {

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');

                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;

                    // Deeper-indented bullets become nested lists (rendered by

                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {

                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
