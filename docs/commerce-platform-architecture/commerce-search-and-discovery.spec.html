<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/09-search-and-discovery/index.md) and its former spec.md on 2026-11-12, then reordered and extended from the flow rubric's notes; the chapter is revised to match.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The three ways of finding a product (search, navigation, recommendations) and that all three read the search index.\n- **Know:** Which facts belong in the index and which are fetched from their owner at query time, and why.\n- **Know:** That reviews are data in the index with provenance the law requires a merchant to keep.\n- **Believe:** A query that returns nothing is more often a gap in the data than a fault of the engine.\n- **Believe:** Synonyms, merchandising rules and ranking parameters are data with owners and end dates, not settings in a vendor's console.\n- **Be able to:** Diagnose a zero-result query as a missing attribute, a missing synonym or an unindexed product.\n- **Be able to:** Decide, for a given fact, whether it goes in the index or is fetched at query time, from how fast it changes.\n\n**Audience:** Readers new to commerce architecture; most of all the product manager or ecommerce manager who owns the storefront's search and the engineer who will build or buy the pipeline that feeds the index. Catalog owners learn why filters fail without attributes; anyone evaluating a search or review vendor gets the questions to ask.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side, including typing into a search box and ticking a filter.\n- Roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its 2026 incidents and the sixteen failure-pattern names, in outline.\n- From Part I: the thirteen steps of an order, promise and handoff, that a system is any software or outside service that takes part in handling an order, 'the shop platform' for the hosted product, the business models and the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, system of record, single writer, events, idempotency and reconciliation, and the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub, availability service, D2C, B2B, PIM, POS.\n- From the three chapters before this one: who owns product content and attributes, how a price is selected and the pricing chapter's rule for a copy of a price (it names its source and is compared with it), and how a discount is computed in the cart.\n\n**Does not yet know:**\n\n- Search vocabulary: search index, indexing, relevance, ranking, facet, merchandising rule, synonym set, typo tolerance, personalization, zero-result rate, click position.\n- Retrieval vocabulary: lexical matching, stemming, collaborative filtering, vector or semantic search, embedding, hybrid search, reciprocal rank fusion, conversational search.\n- Wholesale search vocabulary: assortment, contract price.\n- Stock event; full rebuild of an index.\n- The rules on reviews: Directive (EU) 2019/2161 and the US Federal Trade Commission's 2024 rule.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a common query that returns no results, the reader looks for a gap in the indexed data and for measurements of failing queries, before considering another search engine. *Probe:* A shop's best-selling jacket returns no results for 'waterproof jacket'. Using only this chapter: what are the likely causes, and what would you check before looking at a new search engine? | `custom` | cold_reader | major |\n| AC-2 | The reader can say how availability should appear in search results and why an exact stock count in the index is a risk. *Probe:* Should the exact stock count be stored in the search index? Using only this chapter: what does it recommend, and why? | `custom` | cold_reader | major |\n| AC-3 | The reader can say what a merchant must keep for each published review and why. *Probe:* A merchant marks its reviews 'verified purchase'. Using only this chapter: what must it keep for each review, and why? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-6 | A reader new to commerce meets no term in this chapter before it is explained, and every acronym is expanded on first use. | `known_before_new` | rubric | minor |\n\n## Thesis\n\n**Question:** How do shoppers find products, and what has to be true of the data for search to work?\n\n> **Claim:** Shoppers find products by search, by navigation and by recommendation, and all three read one search index, which is a copy of product, price, availability and review data. Search works when three things are true of that data: the attributes and the words shoppers use are in the index; each feed into the index is refreshed at least as often as the statement shown from that feed (a price, a rating) can change; and a fact that no feed can keep that fresh, such as the last unit of stock, is fetched at query time from the system that owns the fact.\n\n**Disputed by:** The view that poor search results are a weakness of the search engine, to be cured by buying a stronger search product or adding AI retrieval.\n\n**So what:** Kestrel & Pine's rate of searches with no result fell from 9.4% to 4.1% after it added synonym sets and one product attribute, with the search engine it already had. A merchant that accepts the claim measures its failing queries, pays for product attributes and a stock feed before it pays a search vendor, and stops showing an exact stock count from the index.\n\n**How and why:** An engine can match, filter and rank only on what its index holds: a waterproof rating kept in a spreadsheet cannot match 'waterproof jacket', and a stock figure copied every hour keeps saying 'in stock' after the shelf is empty. Ranking, merchandising rules and semantic retrieval all run on those same index records, so none of them can supply an attribute that was never loaded or correct a figure that is out of date. A value fetched at query time is the owning system's current value, so it cannot be out of date in the way an indexed copy can.\n\n**Supporting claims**\n\n- **S1** — Shoppers find products by search, by navigation and by recommendation, and all three read the same search index.\n- **S2** — A query that returns nothing is usually a gap in the data the index reads (a missing attribute, a missing synonym or an unindexed product), not a weak engine.\n- **S3** — The index is a copy of facts owned elsewhere, and how fast each fact changes decides whether it is held in the index or fetched from its owner at query time.\n- **S4** — The copy stays usable only when its feeds are events with retry, a comparison against the sources and a planned full rebuild; the failures of search in operation are failures of those feeds or of the interfaces through which the index is queried.\n- **S5** — Synonyms, merchandising rules, ranking and AI retrieval all run on the index's records; they are data with owners and end dates, and none of them repairs a missing or out-of-date record.\n- **S6** — Reviews are data in the index whose provenance (how each was collected and which order it came from) the merchant must keep, because EU and US rules require it.\n\n## Role in the part\n\nShows the first consumer that needs all the catalog's facts at once, and makes the case that a copy's usefulness is decided by its feeds. Supports P2-4, P2-6 of part `part-2`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `grouping` in index-as-copy (two subsections), runs-on-index (three subsections), in-practice and when-it-goes-wrong: parallel topics, findings and failures; `comparison` in choices and stages: the engine options side by side, then by scale stage)\n\nThe Kestrel & Pine search report comes first because it gives the three faults (a missing attribute, a missing synonym, a stale stock copy) that every later section explains; told later, the mechanics would have no case to explain. The three ways of finding and the vocabulary come next because the index section uses every one of those terms; put after it, 'facet', 'relevance' and 'merchandising rule' would be used undefined. The index as a copy follows: what is in the index and what is fetched fresh, then how it is fed; a section on what runs on the index (relevance, rules and facets, AI retrieval and wholesale prices) comes next, because all of it works on the records the copy holds. Reviews come after the index because a rating is a fourth feed into it and 'best rated' is a sort the reader can only judge once ranking is explained; they come before the stages because the stage table names review tooling at every stage. The choices and the stages follow the mechanics because an engine cannot be chosen before the reader knows what it reads; put first, the comparison would be a feature list. The measures sit inside the choices, before the rule that rests on them; the public record follows because its limits are properties of the products just compared, and it ends on the plan Kestrel & Pine made with them; put before the choices, the limits would belong to products the reader has not yet met. The failures come last in the body because each recovery uses a mechanism from an earlier section (the coarse flag, the comparison job, the rebuild beside the live index, validity windows, the order link, the filter in the search service) or is a failure at the edge of the search service (a retired query interface, an outage); told before those sections, every recovery would need its mechanism explained on the spot.\n\n## Introduction\n\n**Hook** (`intriguing_example`): A shopper searches for a waterproof jacket, but a suitable product is missing from the results because its waterproof rating exists only in a spreadsheet. A better ranking algorithm cannot fill that gap reliably.\n\n**Bridge:** Anyone has typed a query or ticked a filter and been shown nothing, or been shown a product that turned out to be sold out. → Both happen because search reads a prepared copy of product, price, stock and review data and owns none of it: a fact that never reached the copy cannot be found, and a fact that is old in the copy is shown as if it were current.\n\n**Thesis statement** (KEY POINTS callout (three bullets); paragraphs p01 and p02 state the premise in prose): The search index is a copy, and every copy goes stale; search is only as good as the data under it; reviews are discovery data with provenance rules.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start from Kestrel & Pine's search report, in which the best-selling jacket could not be found. *Kept in:* scene.\n- Name the vocabulary of search and the three ways a shopper finds a product. *Kept in:* three-ways.\n- Explain the index as a copy (which facts go in it and which are fetched fresh, how it is fed), then what runs on it: how results are ordered and filtered, what AI retrieval adds, and how wholesale accounts search. *Kept in:* index-as-copy, runs-on-index.\n- Treat reviews as data in the index with a provenance record. *Kept in:* reviews.\n- Compare the search products a merchant can choose and how search is measured, fit them to the scale stages, and read what their vendors document about limits. *Kept in:* choices, stages, in-practice.\n- List the ways search fails, each with how to detect it and recover. *Kept in:* when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A product whose waterproof rating exists only in a spreadsheet is missing when a shopper searches for a waterproof jacket, and no ranking algorithm can fill that gap, because search, filters and recommendations all depend on which product facts reach the storefront. | scenario: A shopper searches for a waterproof jacket; the suitable product's rating exists only in a spreadsheet. |  |\n| p02 | claim | The three chapters before this one gave product content, price and discount an owner each, and the search index owns none of these facts: it is a prepared copy of them and of stock status, so each feed into it needs an update and repair process, or the storefront advertises a product it cannot sell on the displayed terms. |  | `contrast`: Product facts that must reach the storefront, each with an owner named in the three previous chapters. → A system that owns none of them and shows copies of all: the search index, held to the pricing chapter's rule for copies. |\n| p03 | claim | Reviews are one more kind of data in the index and the one kind of data in the index that no other chapter of this part covers, so this chapter covers them: a rating is a signal in the index and also a claim about a purchase that EU law has regulated since 2022. |  | `additional_support`: The index as a copy of product content, price and stock status, each owned in another chapter. → A fourth kind of data in the index, reviews, which this chapter itself must cover, with their legal provenance record. |\n| p04 | transition | The chapter starts from Kestrel & Pine's search report, gives the vocabulary and the three ways of finding, explains the index as a copy and the three things that must be true of it, then what runs on the index (ranking, filters, AI retrieval and wholesale search), reviews, the search products and how search is measured, the scale stages and what vendors document, and ends with the failures. |  | `sequence`: The index as a copy, and reviews. → The order in which the chapter takes them. |\n| p05 | context | Product content, prices, promotions and stock are left to the chapters that own them, engine internals and marketplace ranking to the companion book LISTED, shopping agents to the AI chapter and search-engine optimization to the storefront chapter. |  | `contrast`: What the chapter covers. → What it leaves to other chapters, with a pointer to each. |\n| p06 | context | On 13 April 2027 Eva searches Kestrel & Pine's Dutch storefront for a jacket, and before she can add the Ridgewalker to her cart, search must bring its description, price and stock status together. | scenario: Eva's search on the Dutch storefront on 13 April 2027. | `example`: The chapter's scope. → Where it sits in the order's journey: Eva's search on 13 April 2027. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: The Waterproof Jacket Nobody Could Find\n\n**Controlling idea** (`example`, id `scene`): Kestrel & Pine's Q1 2027 search report showed its best seller invisible to the words shoppers used and a stock status two hours old, and two of the three fixes were to the data, not the engine.\n\n**Advances the thesis** (S2, S3): Gives the case the chapter argues from: a zero-result query caused by a missing attribute and a missing synonym, and a stale stock copy in the results.\n\n**Transition in:** `example`: Eva's search and the claim that search depends on the facts that reach it. → The search report of the company she is buying from.\n\n**Order of paragraphs** (`problem_solution`): The report, what it made visible, then the fixes: the fixes cannot be judged before the causes are named.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | evidence | In March 2027 Hanna Berg, Noor Visser and Teun Baas reviewed the shop platform's built-in search over 3,400 products and 26,000 variants, and the report showed a zero-result rate (the share of searches that return nothing) of 9.4%, with top-ten queries in three languages among the failures. | table: The Q1 2027 search report: 31% of sessions used search; zero-result rate 9.4%; 'waterproof jacket', 'waterdichte jas' and 'wasserdichte Jacke' in the top ten with no results; the search indexes title, description, type and tags; 'regenjas' returns nothing; 'in stock' shown up to two hours after the sell-out of 27 November 2026. |  |\n| p08 | analysis | The report made three things visible: the attribute that answered the shoppers' question was in no system the search could read, the engine had no synonyms, and on the busiest evening the results showed a copy of stock two hours old. | figure: Figure 1: a search for waterproof jacket returning nothing while the jacket hangs labeled shell jacket and its rating sits in a spreadsheet. | `cause_effect`: The rows of the report. → The three causes behind them. |\n| p09 | explanation | The three fixes were synonym sets (lists of words the engine treats as matching each other) in March 2027, a waterproofness attribute once the PIM goes live in Q3 2027, and availability from the availability service instead of an hourly copy; the zero-result rate was 4.1% by Q4 2027. | scenario: Synonym sets per language in March 2027; the attribute through the PIM in Q3 2027; zero-result rate 4.1% in Q4 2027. | `problem_solution`: The three causes. → One fix for each, and the measured result. |\n\n### Three Ways to Find a Product\n\n**Controlling idea** (`definition`, id `three-ways`): Shoppers find products by search, navigation and recommendation, each needing indexed data, and public usability research shows that sites handle the product name and fail the words shoppers use.\n\n**Advances the thesis** (S1, S2): Names the three ways and the vocabulary, and shows from public research that the failing queries are the ones that need attributes.\n\n**Transition in:** `elaboration`: One company's failing search, told in the words of search. → Those words in plain language, then the general ways a shopper finds a product.\n\n**Order of paragraphs** (`prerequisite_order`): The terms, then the three ways, then the evidence: the table of the three ways uses the terms, and the research is read in both.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | The vocabulary of discovery is the search index, indexing, relevance, ranking, facet, merchandising rule, synonym set, typo tolerance and personalization; the zero-result rate is defined with the search report. |  |  |\n| p10 | claim | Discovery is whatever connects a shopper's need to the roughly 17,000 of Kestrel & Pine's 26,000 variants that are active at any time, and it takes three forms: search, navigation and recommendations. | table: Three ways of finding: what the shopper does, what the system needs and who tunes it. | `elaboration`: The terms just defined, among them the search index and facets. → The three ways a shopper uses them to find a product. |\n| p12 | evidence | Baymard Institute's usability research finds that failure rates rise from product-name queries to feature, use-case and non-product queries, the same pattern as at Kestrel & Pine. | statistic: Baymard (September 2024, updated April 2026): about half of participants prefer search; 56% of sites fail to adequately support search needs; 12% fail exact product-name searches, 39% feature searches, 43% use-case searches, 66% non-product searches. | `additional_support`: The three ways and Kestrel & Pine's failing queries. → Public research showing the same pattern across large retail sites. |\n\n### How the Pieces Fit Together: The Index as a Copy\n\n**Controlling idea** (`explanation`, id `index-as-copy`): The search index is a copy of four kinds of data that change at different speeds, so the central decision is which facts are in it and which are fetched fresh, and each feed must be as fresh as the statement shown from it.\n\n**Advances the thesis** (S3, S4): Establishes the index as a copy, the in-index or fetched-fresh decision, and the feeds and rebuilds that keep it.\n\n**Transition in:** `elaboration`: The search index, defined as a separate copy of the catalog. → What it copies, from which systems, and how the copy is kept.\n\n**Order of paragraphs** (`grouping`): Two subsections: what is in the index (and the rule for its feeds), then how it is fed and rebuilt. What runs on the index follows in its own section, because it works on the copy's records.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | description | The search service consumes four systems of record, each changing at its own pace, and the storefront asks it one question. | figure: Figure 2: the index as a copy of the catalog, the prices, the availability and the reviews, fed by change events and overlaid with merchandising rules and a ranking model; the storefront gets back ranked identifiers and facets and fetches fresh details separately. |  |\n| p14 | claim | The decision that shapes everything else is which facts are in the index, where they can be filtered and sorted on but are only as fresh as the last indexing run, and which are fetched at query time, fresh but not filterable. | source: commercetools Product Search indexes product fields, searchable variant attributes, prices and availability, returns identifiers and lets the client fetch full data separately.; table: Six facts by how often each changes, the freshness the shopper needs and where it should live. | `elaboration`: The index as a copy of four sources. → The trade-off for each fact: filterable but stale, or fresh but not filterable. |\n| p15a | claim | The pricing chapter's rule for a copy applies to every feed into the index, with one condition added: a feed must be refreshed at least as often as the statement shown from it can change, and a fact no feed can keep that fresh is fetched at query time; with the opening case's lesson that the words shoppers use must be loaded, these are the three things that must be true of the index. | reasoning: A description may be hours old without harm; a campaign price changes by the minute and the last unit sells in seconds. | `cause_effect`: The table's columns: how often each fact changes and where it should live. → The rule behind the table, taken from the pricing chapter's rule for copies: a feed as fresh as the statement shown from it, or the fact fetched at query time. |\n| p15 | example | Availability is the hardest case of the rule and the one where Kestrel & Pine was hurt, and the remedy is not a faster index: the index holds only a coarse 'available' flag, updated by a message each time stock changes, and the product page asks the availability service for the exact number. | scenario: The platform indexed its own stock copy, updated hourly from the ERP, which the WMS updated every fifteen minutes; results said 'in stock' for up to two hours after Duiven ran out.; figure: Figure 3: the Phantom Stock seen from search. | `example`: The rule that a fact no feed can keep fresh enough is fetched at query time. → The Black Friday case, where an indexed stock copy broke that rule, and its remedy under Waypoint W1. |\n| p16 | description | Scheduled synchronization copies the catalog hourly or nightly, so the index can be as far behind as the interval, or further when a delivery fails. | source: Algolia's Shopify B2B integration describes a daily resync, some changes taking up to two days, and product reindexing that is not automatic. | `elaboration`: Kestrel & Pine's chain of hourly copies. → Feeding on a schedule in general, and how far behind it can leave the index. |\n| p17 | description | Event-driven indexing updates affected records within seconds of a change, and needs safe handling of repeated messages and a comparison job to find missed updates. | scenario: Waypoint's integration standard W5 requires idempotent handling and a reconciliation job. | `contrast`: Feeding on a schedule. → Feeding by events, and what that requires. |\n| p18 | recommendation | A full rebuild must stay available with either approach, because a new language or a new attribute can require recreating the whole index; the new index is built beside the live one and takes over when it is complete. |  | `additional_support`: The two ways of feeding. → The third operation both need: rebuilding everything. |\n| p18a | comparison | Each interaction with the index, from a query to a full rebuild, has its own freshness, latency and failure behavior, and in all of them the product page and the availability service stay the truth. | table: Requirements per interaction (search query, attribute change, price change in a promotion, stock change at peak, full rebuild): freshness, consistency, latency, behavior when it fails. | `conclusion_summary`: The ways the index is fed and rebuilt. → All interactions with the index side by side. |\n\n### What Runs on the Index: Ranking, Recommendations and Wholesale Search\n\n**Controlling idea** (`explanation`, id `runs-on-index`): Relevance, merchandising rules, facets, recommendations, AI retrieval and wholesale search all run on the index's records, so none of them repairs what the records lack.\n\n**Advances the thesis** (S5): Shows that relevance, rules and AI retrieval all run on the index's records and that wholesale search reuses the in-index or query-time decision.\n\n**Transition in:** `sequence`: The index as a copy, filled and fed. → The three things that run on its records.\n\n**Order of paragraphs** (`grouping`): Three subsections: relevance with rules and facets, recommendations and AI retrieval, wholesale. Wholesale comes last because it reuses the in-index or query-time decision for prices per account.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18b | transition | Three things run on the records the index holds, each only as good as those records: ranking with its rules and filters, recommendations and AI retrieval, and search for wholesale buyers. |  |  |\n| p19 | process | A lexical engine matches words with stemming, synonyms and typo tolerance and ranks the matches by text, popularity and rules, with synonyms applied at search time so they change without reindexing. | source: Elasticsearch recommends search-time synonyms because the sets can be updated without reindexing. | `sequence`: The three things that run on the index. → The first: how the engine matches and orders what is in it. |\n| p20 | recommendation | Merchandising rules sit on top of relevance and should be treated as promotions are: data with an owner, a start, an end and a count. | source: Algolia's Rules can pin, hide, boost, bury, filter, rewrite the query or return custom data, carry up to 25 conditions and a validity period, and 'are no substitute for a well-configured index'; Shopify allows at most 10 search terms per product boost. | `additional_support`: The engine's own ranking. → Human overrides of it, and how to keep them. |\n| p21 | claim | Facets depend on attribute completeness, so a facet's quality is decided in the PIM, not in the search console. | source: Shopify's filters compute values and counts from the first 1,000 results, show no filters on collections above 5,000 products, allow 25 filters per store with up to 100 values each, and show no price filter outside the default currency.; reasoning: A 'waterproof' facet with half the jackets unfilled hides the other half from a shopper who ticks it. | `additional_support`: Rules laid over relevance. → Filters, which depend on the same attributes. |\n| p22 | evidence | Collaborative filtering recommends items from what other shoppers viewed or bought together, and Amazon's history shows that strong baselines are hard to beat. | source: Amazon's item-to-item filtering, described in a 2003 paper; its 2019 account says a deep-learning model for Prime Video first underperformed the old method and a bestseller list and won only after being reframed. | `sequence`: Matching and ranking by words and rules. → Recommending from behavior. |\n| p23 | definition | Vector search matches the meaning of a query to product text, and hybrid search merges a lexical and a vector ranking; both are now standard in the main engines. Elasticsearch recommends approximate nearest-neighbor retrieval for production (restored author statement). | source: Elasticsearch runs both in one request; OpenSearch has had hybrid search since 2.11; Algolia launched NeuralSearch on 2 May 2023; Shopify's semantic search reached its Shopify and Advanced plans on 24 June 2024.; quotation: 'pure lexical matching via an inverted index falls short' on hypernyms, synonyms, antonyms, morphological variants and spelling errors. | `additional_support`: Recommendations from behavior. → Retrieval by meaning, and how it is combined with word matching. |\n| p24 | counterargument | Two cautions apply to AI retrieval: embeddings are a second derived artifact that goes stale and must be rebuilt, and published conversion lifts are vendor anecdotes without a control. | quotation: Query vectors 'must have the same dimension and be created with the same model as the document vectors'.; source: Algolia's launch release: a 65% drop in zero results and up to 17% conversion uplift for one customer in a four-week test; Constructor's home page: a 13% lift for one retailer with no baseline or method. | `contrast`: What vector and hybrid search add. → What they cost and what the vendors' numbers are worth. |\n| p25 | example | Conversational search is the current frontier, and what an assistant needs from the merchant is structured attributes, fresh prices and availability, and order status by API. | source: Zalando announced a beta assistant built on ChatGPT on 19 April 2023; its Q3 2026 release reports more than 22 million unique users of the Zalando Assistant in the year. | `additional_support`: Retrieval by meaning. → Search by a need described in sentences, and what it needs from the merchant. |\n| p26 | comparison | For a wholesale account search must answer what this buyer can see at their price, and there are three designs for prices in the index. | source: Algolia's B2B guidance: under about 100 pricing levels, one price per tier in the index; with more, per-customer prices merged at query time and not filterable; or both. Its Shopify B2B integration recommends about 50 company locations before records hit size limits. | `additional_support`: Search for consumers. → Search for wholesale accounts, with assortments and contract prices. |\n| p27 | claim | Assortment visibility must be enforced in the search service, with the filter bound to the account's token, because search results are an information leak. | scenario: Kestrel & Pine's 1,100 accounts on a handful of price tiers (assumption) fit the segment-price design. | `emphasis`: The three price designs. → The rule that matters more than speed: where visibility is enforced. |\n\n### Reviews and Ratings as Discovery and Trust Data\n\n**Controlling idea** (`explanation`, id `reviews`): A review ranks and persuades as discovery data and is a regulated claim as trust data, so each review must keep its provenance.\n\n**Advances the thesis** (S6): Argues that reviews are index data with a provenance record the law requires.\n\n**Transition in:** `additional_support`: Product, price and availability data in the index, and how results are ranked. → The fourth kind of data in it, reviews and ratings, which the introduction said this chapter must cover itself.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The two jobs, the rules, then the consequences: the consequences follow from the rules.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | claim | A review does two jobs: as discovery data its rating ranks products and persuades shoppers, and as trust data it is a regulated claim that someone bought and used the product. | source: schema.org's Product type (version 30.1, September 2026) carries aggregateRating.; figure: Figure 4: a review enters through an invitation tied to a delivered order, carries its provenance through moderation, and reaches the index and the feeds with a verified-purchase flag. |  |\n| p29 | evidence | EU and US rules regulate the claim: Directive (EU) 2019/2161 makes it material whether reviews come from real purchasers, and the FTC's 2024 rule bans fake, sentiment-conditioned and suppressed reviews. | source: Directive (EU) 2019/2161, applied from 28 May 2022, with recital 19 on ranking; the FTC rule of 14 August 2024. | `elaboration`: The review as a regulated claim. → The two rules and what each requires. |\n| p30 | recommendation (list) | Four design consequences follow: provenance per review, moderation by rule, incentives disclosed and never conditional on sentiment, and a written description of what sorts such as 'best rated' do. | scenario: Kestrel & Pine's reviews app invites customers after delivery with the order reference, so each of its 6,800 reviews in 2026 is tied to an order. | `cause_effect`: What the rules require. → What a merchant builds in response. |\n| p31 | recommendation | Marketplaces keep their own review pools, and for a merchant of Kestrel & Pine's size reviews are a case for a specialist app, with the architectural work in getting the rating to the index and keeping the order link. |  | `additional_support`: The four consequences. → Where reviews should run and what remains the merchant's work. |\n\n### The Choices\n\n**Controlling idea** (`comparison`, id `choices`): A merchant can use the platform's built-in search, a hosted search service, a self-run engine or a search module of a larger stack; search is measured the same way whichever is chosen, and the merchant should measure its failing queries before buying any of them.\n\n**Advances the thesis** (S2, S5): Compares the engine options and concludes that data and measurement come before the purchase.\n\n**Transition in:** `sequence`: The data search needs, described in the sections so far. → The four kinds of search product a merchant can run on it.\n\n**Order of paragraphs** (`comparison`): The options from least to most owned by the merchant, then the measures that judge any of them, then the rule that rests on those measures (evidence before the rule).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | description | The platform's built-in search is free, indexes the platform's own copy of price and stock, and fits a merchant whose catalog fits the platform's product model and whose promises tolerate its indexing delay. |  |  |\n| p33 | description | A hosted search service fed by events buys relevance tooling, analytics and hybrid retrieval, and costs an integration per source, a subscription and configuration that lives in a vendor's console. |  | `contrast`: Search built into the platform. → Search as a separate service the merchant feeds. |\n| p34 | description | A self-run engine is right when relevance is a competitive asset, the catalog does not fit a hosted record model or the data cannot leave the merchant's control, and it costs a team that owns search as a product. |  | `contrast`: A service run by a vendor. → An engine run by the merchant's own team. |\n| p35 | description | A search module of a composable or marketplace stack runs discovery as its own platform and is a Group-stage answer. |  | `additional_support`: The three options most merchants choose among. → The fourth, for the largest. |\n| p41 | evidence | Search is measured by whether shoppers find results, click them and buy, per language and channel, with the vendor's counting rules kept constant. | source: Algolia's analytics define no-results rate, click-through rate, conversion rate and average click position, and aggregate keystrokes within 30 seconds into one search; Baymard finds weaker performance on mobile and apps. | `contrast`: The comparison table of search products. → How search is measured whichever product is chosen, with the vendor's counting rules. |\n| p36 | recommendation | The author's rule is to measure the zero-result rate and the top failing queries before buying anything. | table: Trade-off table across built-in, hosted and self-run: who owns relevance and the pipeline, freshness, B2B, hybrid retrieval, exit cost, fit by stage.; scenario: Half of Kestrel & Pine's problem was fixed with synonym sets in the platform it already had; the other half waits for the PIM. | `conclusion_summary`: The four options and the measures that judge them. → The author's rule for choosing among them: measure first. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`analysis`, id `stages`): What limits search changes from stage to stage (vocabulary, staleness, the number of consumers, ownership), and at every stage it is the pipeline, not the engine.\n\n**Advances the thesis** (S4): Shows by stage that the limiting factor is the pipeline: vocabulary, staleness, the number of consumers, ownership.\n\n**Transition in:** `elaboration`: The options and the stages each fits. → What is typical, necessary and a warning sign at each stage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | analysis | The engine matters less with each stage than the pipeline feeding it: a Starting merchant is limited by vocabulary, a Growing one by staleness, an Omnichannel one by the number of consumers and a Group by ownership. | table: Four stages: what is typical, what becomes necessary and the warning signs of outgrowing the approach.; scenario: Kestrel & Pine has third-row needs and still runs the platform's built-in search, the first row's tooling. |  |\n\n### In Practice\n\n**Controlling idea** (`evidence`, id `in-practice`): Vendor documentation adds a practical point to the comparison (limits are published), and Kestrel & Pine's 2027 plan applies it and the measures with its existing vendor.\n\n**Advances the thesis** (S2, S4): Grounds the argument in vendor documentation and in the plan that halved the zero-result rate without a new engine.\n\n**Transition in:** `additional_support`: The search products and the stages each fits. → What their vendors document, and the plan Kestrel & Pine made with its existing one.\n\n**Order of paragraphs** (`grouping`): A lead-in, the limits from vendor documentation, then the plan built on the measures.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37a | transition | Whichever product is chosen, its vendor's documentation says one thing a comparison table does not, its limits, and Kestrel & Pine's plan at the end is built on the measures set out with the choices. |  |  |\n| p39 | evidence | Search limits can exclude filter values, customer-specific prices or variants from the records the index holds, and Shopify, Algolia and commercetools each publish theirs, so read them before committing to a service. | source: Shopify: counts from the first 1,000 results, 25 filters per store; Algolia's Shopify B2B integration: about 50 company locations, only the highest volume tier stored; commercetools: up to 10,000 variants and standalone prices combined per product. | `example`: The one thing vendor documentation adds. → Limits, with three vendors' published ones. |\n| p42 | example | Kestrel & Pine's 2027 search plan kept the existing vendor and added to the three fixes of the opening a monthly review of failing searches, a rule that a filter appears only when 95% of jackets carry the attribute, and order links kept in review exports; it cost a few configuration days and an attribute model. | scenario: Noor's plan on top of the three fixes of the opening: a monthly review of the top 50 zero-result searches, four attributes modeled in the PIM, the 95% rule, order links in exports of the 6,800 reviews; a few configuration days and an attribute model. | `example`: The limits, and the measures set out with the choices. → The plan Kestrel & Pine built on those measures, beyond the three fixes already told. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`cause_effect`, id `when-it-goes-wrong`): Search fails in nine recognizable ways, most of them a copy that was not refreshed, compared or scoped, and each has a detection and a recovery.\n\n**Advances the thesis** (S4, S5, S6): Shows the failures of the feeds, the rules and the review record, each with how to detect and recover.\n\n**Transition in:** `cause_effect`: The mechanisms of the earlier sections. → The ways search fails when one of them is missing, each recovered by putting it back.\n\n**Order of paragraphs** (`grouping`): Three failures of the feeds, two of the data on top, then reviews, wholesale visibility, a retired query interface and the outage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | cause_effect | When the index says in stock and the warehouse says no, detect it by sampling results pages against the availability service and by counting failed adds to cart; the recovery is the coarse flag already described, with sold-out products re-indexed at once at peak. |  |  |\n| p45 | cause_effect | When a change never reached the index, a reconciliation job that compares index records with their sources finds it, and the lost event is fixed. |  | `similarity`: A stale stock status. → Any change that was lost on the way to the index. |\n| p46 | cause_effect | When a full rebuild is needed and nobody planned for it, the failure is rebuilding in place; build the new index beside the old one and swap. |  | `additional_support`: Single records that are behind. → The whole index needing to be recreated. |\n| p47 | cause_effect | Synonyms applied to the wrong language make one word match nothing and another match everything, which per-language metrics detect. |  | `additional_support`: Failures of the feeds. → A failure of the data laid on top: synonyms. |\n| p48 | cause_effect | A merchandising rule that outlives its campaign is found by listing active rules without an end date and prevented by validity windows. |  | `similarity`: Synonyms as unowned data. → Rules as undated data. |\n| p49 | cause_effect | Review provenance is lost when the reviews app is replaced and the export lacks the order reference; keep the order link in your own store. |  | `additional_support`: Rules and synonyms. → The review record. |\n| p50 | cause_effect | The assortment leaks when the filter is applied in the storefront, not in the search service; test with an account per tier and treat a leak as a security incident. |  | `additional_support`: Lost provenance. → A leak of what an account may see. |\n| p38 | cause_effect | When a vendor retires the interface through which the storefront queries the search engine, the integration must move before the cutoff, or search stops answering. | source: commercetools' older Product Projection Search cannot be activated by projects created after 31 August 2026 and deactivates after 30 days without calls. | `additional_support`: A leak of what an account may see: a failure at the edge of the search service. → Another failure at that edge: the query interface itself being withdrawn. |\n| p51 | cause_effect | When the hosted search service is down, navigation and category pages must still work and the search box must fail with a message, not an empty result. |  | `additional_support`: An interface withdrawn on a known date. → The search service failing without notice. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The jacket nobody could find, the 'in stock' that was two hours old, the rule that outlived its campaign and the review that lost its order are one kind of fault: the results page showed something its sources did not support, while the engine worked as built. Three conditions prevent the first two (the words and attributes are loaded, each feed is as fresh as the statement shown from it, and the fastest fact is asked of its owner at query time); owners and end dates on rules and an order link kept by the merchant prevent the other two. None of this is owned by the search team: it sits with the catalog, the pricing and availability services and the reviews app.\n\n**So what:** The first money goes to synonyms, product attributes and a stock feed, not to a search vendor: in the illustration Kestrel & Pine's zero-result rate falls from 9.4% to 4.1% by Q4 2027 with the engine it already had.\n\n**Callback:** The waterproof jacket whose rating existed only in a spreadsheet. The reader can now say why no ranking algorithm could have found it and what does: the attribute in a system the index reads, and a synonym for the word shoppers type.\n\n**Takeaway** (`course_of_action`): Measure the zero-result rate per language, write down which facts are in the index and which are fetched fresh, and take the ten questions to the team.\n\n**Hand-off** to [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html): `problem_solution`: A search result that shows Eva the Ridgewalker 'in stock'. → What 'in stock' means, who computed it, and how to make it a promise the warehouse can keep.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51a | synthesis | The jacket hidden in a spreadsheet, the stale 'in stock', the rule that outlived its campaign and the review without its order are one fault, a results page showing what its sources do not support; three conditions prevent the first two and owned, dated data the others, none of it owned by the search team, so the first money goes to attributes and a stock feed, not to an engine. | reasoning: The opening's jacket set against the chapter's three conditions; Kestrel & Pine's zero-result rate falling from 9.4% to 4.1% by Q4 2027 (illustrative) with the same engine. |  |\n| p52 | synthesis (list) | Established: the index is a derived copy that is always behind its sources; search is measured by zero-result, click and conversion rates per language and channel; hybrid retrieval is standard; EU and US rules require review provenance. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, sorted by how settled they are, starting with what the public record establishes. |\n| p53 | synthesis (list) | Depends on context: when built-in search is enough, when a hosted service pays, when availability belongs in the index as a flag, and when B2B visibility must be enforced in the search service. |  | `contrast`: What is settled. → What changes with the merchant's situation. |\n| p54 | recommendation (list) | The author's synthesis: treat search as the first consumer of the PIM and the availability service and fund those first, and keep rules, synonyms and ranking parameters as versioned data with owners and end dates. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p55 | recommendation (list) | Ten questions let the reader apply the chapter to their own search, index, rules, wholesale filter and reviews. |  | `cause_effect`: The take-aways. → Questions that apply them. |\n| p56 | transition | Search has shown Eva a Ridgewalker 'in stock'; the next chapter asks what that phrase means, who computed it and how to make it a promise the warehouse can keep. |  | `problem_solution`: A search result that says 'in stock'. → The question of what the phrase means and who computes it. |\n\n## Non-goals\n\n- The product model, attributes and the PIM itself. See [What Are We Selling? Products, Variants and the Catalog](product-information.html).\n- The price and the prior price; the rule for a copy of a price, which this chapter refers to and does not restate. See [What Does It Cost? Price Lists, Contract Prices, Currencies and Tax](pricing-architecture.html), [Discounts, Coupons and Loyalty: Promotions Without Chaos](commerce-promotions.html).\n- Availability computation, reservations and stock events. See [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html).\n- Engine internals (sharding, replication, index topology, query planning); two-sided and paid ranking. See [Search Architecture for Listings: Indices, Freshness and Scale](../listing-systems-architecture/search-architecture.html), [Ranking for Two Sides: Relevance, Freshness and Paid Visibility](../listing-systems-architecture/ranking.html).\n- Agentic commerce, conversational agents and merchant readiness for them. See [Assistants and Agents: AI in Commerce and What Is Real in 2026](ai-and-agentic-commerce.html).\n- Marketplace-owned reviews and listing content rules; B2B account and pricing models. See [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html), [Selling to Businesses: Accounts, Contract Prices, Quotes and Approvals](b2b-commerce.html).\n- Storefront rendering, caching, page performance and search-engine optimization. See [Delivering the Storefront: Themes, Headless, Rendering and Performance](storefront-architecture.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Pending the journal-spec step (rule 9 is not this post's): thesis.so_what says Kestrel & Pine's zero-result rate '                 s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
