<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/47-case-amazon/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (the contrast with chapter 46 in the opening, a thesis paragraph, a roadmap, a one-sentence lead-in to the promise table and a chapter synthesis that answers the opening). The 'Two-pizza teams' lead-in is merged into the paragraph it introduced and the promise section's definitions are moved before the evidence that uses them. These are recorded in decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The sequence monolith, scaling wall, services: Amazon's 2006 account (via a 2007 digest) dates the wall to 2001; by 2007 a page touched 100 to 150 services measured at the 99.9th percentile (Dynamo paper).\n- **Know:** The 2007 Dynamo cart: 'always writeable', an add-to-cart never rejected, conflicting versions merged on read at the price that a deleted item can resurface; what the paper does not say (that Amazon runs Dynamo today, anything about orders, pricing or checkout); the 2012 DynamoDB post on Amazon's teams preferring managed services to a system that was hard to run.\n- **Know:** What is documented about teams and contracts: the two-pizza rule and end-to-end ownership in AWS guidance; the 'API mandate' only as Steve Yegge's 2011 recollection, never confirmed by Amazon; the opening of services and fulfillment in Vogels' own words (2006, 2016).\n- **Know:** The retailer-to-platform record: Prime (2005, widely reported), Fulfillment by Amazon (19 September 2006), third-party share of physical sales from 3% (1999) to 58% (2018) and 'more than 60%' since; the FY2025 10-K stating Amazon is 'not the seller of record' in those sales; the 2024–2026 investments in regionalization and same-day centers behind the delivery promise; Buy with Prime, Shop Direct, Buy for Me and Alexa for Shopping; Amazon's 2025 position that third-party shopping agents should 'operate openly' and respect a provider's choice; the Prime Video 2023 post as a narrow cost-and-coupling case.\n- **Know:** Where the evidence stops: no public, dated description of Amazon's current order, pricing, promise or inventory systems.\n- **Believe:** The useful Amazon is narrow: four documented rules (the contract is the only door, the cart never says no, operability decides adoption, the promise is the product) fit a fourteen-person team; the service count does not.\n- **Believe:** Amazon became a platform by opening its operations, the warehouse and the promise, not its storefront.\n- **Be able to:** Find integrations that read another system's data directly and give each an owner and a contract.\n- **Be able to:** Count stock the merchant owns but does not control as a separate location, and treat a marketplace-fulfilled order as a different kind of order.\n- **Be able to:** Say which system computes their delivery promise and what it knows about warehouse capacity and carrier cut-offs.\n\n**Audience:** Readers new to commerce architecture: most of all the engineer or architect who hears 'Amazon did microservices' in a design review and needs to know what the sources say; second, the product manager or leader who sells on Amazon and sends stock to its fulfillment program.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Parts I to X: the thirteen steps of an order, promise and handoff, the three status lines, 'system', 'the shop platform' for the hosted product, the four scale stages (Starting, Growing, Omnichannel, Group), system of record, single writer, events, idempotency and reconciliation; available-to-promise; the failure-pattern names (The Giant's Boots, The Spaghetti Junction, The Secret Agent, the Black Friday Oversell, the App That Wrote Stock among them).\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order management system (OMS), availability service, D2C, B2B, PIM, POS.\n- Kestrel & Pine: a fictional outdoor brand with fourteen people in technology on a hosted shop platform, its Duiven warehouse, its Amazon.de channel, Eva's order of 13 April 2027, the Black Friday 2026 incidents, and the Waypoint decisions W1 to W8.\n- Part XI's method (dated public sources, documented versus inferred, each case ending where its evidence stops) and chapter 46: Shopify, the landlord that rents shops to merchants and changes the platform under them on published dates.\n\n**Does not yet know:**\n\n- Monolith, service-oriented architecture (SOA), service, tail latency and the 99.9th percentile.\n- Always writeable, eventual consistency, conflict resolution, managed service.\n- Two-pizza team, you build it you run it, the 'API mandate', externalizable interface.\n- Fulfillment as a service, first-party (1P), third-party (3P), seller of record, Fulfillment by Amazon (FBA), Prime, gross merchandise sales, Multi-Channel Fulfillment, Form 10-K.\n- Regionalization, placement algorithm, delivery promise as a computed commitment.\n- Agentic commerce, product feed, serverless; Buy with Prime, Shop Direct, Rufus / Alexa for Shopping, Buy for Me, Perplexity's Comet.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a proposal to split a shop into services because Amazon did, the reader states what Amazon's record supports and what the merchant should take instead. *Probe:* In a design review an architect argues: 'Amazon proved services are how commerce scales; we should split our shop now, before we hit the wall.' The merchant has a hosted platform, about a dozen systems and fourteen people in technology. Using only this chapter: what does Amazon's record support, and what should the merchant take instead? | `custom` | cold_reader | major |\n| AC-2 | The reader can say how a merchant's systems should treat stock and orders in a marketplace's fulfillment program, and why. *Probe:* A brand sends part of its German marketplace stock to the marketplace's fulfillment program. Using only this chapter: how should its systems treat that stock and those orders, and why? | `custom` | cold_reader | major |\n| AC-3 | The reader can explain why a static delivery promise is a weakness and what Amazon's record suggests a merchant build instead. *Probe:* Using only this chapter: what is wrong with a fixed 'ordered before 22:00, delivered tomorrow' rule, and what does Amazon's record suggest a merchant do instead? | `custom` | cold_reader | major |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What does Amazon's dated public record show about how a commerce platform grows, and which of it applies to a merchant a thousand times smaller?\n\n> **Claim:** Amazon's record shows each move answering a business problem: services after its front end stopped scaling in 2001, a cart that never refuses an add because a refusal loses a sale, managed databases its teams could run, and Fulfillment by Amazon letting other sellers' items carry Prime's delivery promise. A small merchant can adopt the rules behind those moves (contracts between systems, stock and payment never promised twice, systems its own team can run, a computed delivery date), not the service count or delivery network.\n\n**Disputed by:** The view, common in design reviews, that Amazon's lesson is microservices: a commerce platform that means to scale should split into many small services owned by two-pizza teams, as Amazon did, and the earlier it splits the better.\n\n**So what:** A merchant that accepts the claim drops 'Amazon did microservices' from its design reviews and asks instead whether each integration goes through a contract, whether the cart and the stock have the consistency each needs, whether its team can run what it proposes on the busiest night, and which system computes its delivery promise. Kestrel & Pine takes three lessons already in Waypoint: an owner and a contract for every integration with no script reading another system's data (W5); the stock in Amazon's fulfillment program as a tracked external location never pooled with Duiven (W1); and an engine behind 'ordered before 22:00' fed by the warehouse's real capacity (the delivery-promise prerequisite of W8). Its shape stays a hosted platform with an OMS, a PIM and an availability service beside it (W4).\n\n**How and why:** A page assembled from 100 to 150 services is as fast as its slowest call, so services cost a latency discipline that only a wall of load and of engineers changing one codebase paid for. A cart that refuses an add loses a sale while a briefly stale cart is harmless, so the cart trades consistency for availability; stock and payment cannot, because a promise made twice is an oversell or a double charge. Dynamo was correct but, in Amazon's 2012 account, did nothing to reduce the work of running it, and its teams preferred simplicity to control, so operability decided adoption. Opening fulfillment let a third-party seller's item carry Amazon's promise, which puts one stock pool under several seller-of-record models, and a date promised from that pool has to be computed from where the stock is and what the network can ship. The rules that follow are contracts as the only door between systems, stock and payment never promised twice, only systems the team can run, and a computed delivery date.\n\n**Supporting claims**\n\n- **S1** — Amazon's move from a monolith to services followed a front end that stopped scaling in 2001 and cost a tail-latency discipline; nothing in the record argues for splitting before such a wall, and a 2023 post read as a reversal supports only sizing a boundary to the data that crosses it.\n- **S2** — The 2007 cart accepts every add because a refused add loses a sale, while stock and payment need the consistency the cart gives up; Amazon's own engineers then preferred managed services they did not have to run, so operability decides adoption.\n- **S3** — The rule that transfers from Amazon's team practices is the contract as the only door: documented as Amazon opening its services to others, held for the 'API mandate' only as an unconfirmed recollection, and applied by a merchant first to vendors and scripts.\n- **S4** — Amazon became a platform by opening its operations: Prime and Fulfillment by Amazon let a third-party seller's item carry Amazon's promise while Amazon is not the seller of record, so one stock pool serves several seller-of-record models, and stock a merchant sends there is a location it owns but does not control.\n- **S5** — Amazon's recent record treats the delivery promise as the product and invests in the network that keeps it; what transfers is a computed promise and a curated fast subset of SKUs, not the network.\n- **S6** — Amazon now exports its checkout and fulfillment to other shops and admits outside shopping agents only if they operate openly and respect a provider's choice, which is the rule a merchant needs for automation on its own site.\n- **S7** — Read with dates and with inference labelled, the record divides into rules that fit a fourteen-person team and machinery only Amazon needs, each rule already a Waypoint decision at Kestrel & Pine, and it stops short of Amazon's current internals.\n\n## Role in the part\n\nReads the company most cited for services and shows from its own documents that each move answered a business problem at its size, giving the part its rules about contracts, the cart, operability, seller of record and the computed promise. Supports P11-2, P11-5 of part `part-11`.\n\n## Flow\n\n**Pattern:** `grouping` (also `prerequisite_order` in wall to nuance (the architecture record): the wall, the teams that own the services, the cart service, and the limit; `chronological` in fulfillment to agents (the business record, 2005 to 2026), with agents last because it needs fulfillment and the promise; `small_to_large` in lessons to evidence: from the dated cases to what transfers, then to the limits of the record)\n\n'How to Read' comes first because every later claim carries one of its three labels. The record then falls into two groups. The architecture group is in prerequisite order: the 2001 wall defines monolith and service and gives the tail-latency cost; the team rules and the contract between services follow because they presuppose services and date from the years right after the wall (about 2002 to 2004); the cart (2007) and the managed databases (2012) are one service read inside that architecture; the 2023 Prime Video post closes the group because it is read as a reversal of that story and gives its limit. The business group is in date order: fulfillment opened to others (2005 to 2006, with the 2018 to 2026 figures, picking up Vogels' 2006 note that closes the team section), the delivery promise that fulfillment keeps (2024 to 2026), and the export of that machinery to other shops and agents (2022 to 2026), placed last because it needs both fulfillment and the promise. 'What a Merchant Can Learn' needs every case before it; 'Where the Evidence Stops' comes last in the body because it marks the limit of each case just read. Putting the business group first would lose the 2006 note that links the team rules to the fulfillment opening and would give the seller-of-record split before the reader has seen what a contract between parties is for; putting the lessons before the cases would state rules without their evidence; putting the nuance before the cart would present a reversal of a story not yet told, and putting it after the business group would separate it from the services story it qualifies.\n\n## Introduction\n\n**Hook** (`intriguing_example`): A merchant can sell through Amazon, use its fulfillment services and compete with its own retail offers; each relationship changes what the merchant controls. Kestrel & Pine lists jackets on Amazon.de and sends some German marketplace stock to outside fulfillment programs.\n\n**Bridge:** Chapter 46 read Shopify, the landlord that rents shops to merchants and changes the platform under them on published dates; a merchant meets Amazon instead as a marketplace, a fulfillment provider and a competitor, and hears its architecture cited in design reviews. → Amazon is a retailer that built its own shop, opened its operations to other sellers and now offers its machinery to other shops and admits agents on its own terms; its dated papers, letters and filings say which of its moves answered which problem, and which rules a much smaller merchant can use.\n\n**Thesis statement** (KEY POINTS callout and paragraph p05): Amazon's record shows each move answering a business problem: services after the front end stopped scaling in 2001, a cart that never refuses an add because a refusal loses a sale, managed databases its own teams could run, and Fulfillment by Amazon letting other sellers' items carry Prime's delivery promise. A small merchant can adopt the rules behind those moves (contracts between systems, stock and payment never promised twice, systems its own team can run, a computed delivery date), not the service count or the delivery network.\n\n**Roadmap** (Paragraph p06):\n\n- Say how the case's claims are labelled and which primary pages could not be reached. *Kept in:* how-to-read.\n- Follow the architecture record: the 2001 wall and the move to services, the team rules with the contract as the only door, the cart and the managed databases that followed, closed by a 2023 post often quoted as a reversal. *Kept in:* wall, teams, cart, nuance.\n- Follow the business record: fulfillment opened to other sellers, the delivery promise, and the export of that machinery to other shops and AI agents. *Kept in:* fulfillment, promise, agents.\n- Separate what a merchant can learn from what only Amazon can do, and mark where the evidence stops. *Kept in:* lessons, evidence.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Unlike Shopify, the landlord of chapter 46, Amazon is a retailer that opened its operations to other sellers, so a merchant can sell through it, use its fulfillment and compete with its retail offers, each relationship changing what the merchant controls; Kestrel & Pine, which lists on Amazon.de and sends German marketplace stock to fulfillment programs, must know which records and commitments its own systems still track. | scenario: Kestrel & Pine lists jackets on Amazon.de and sends some German marketplace stock to outside fulfillment programs (fictional; ledger). | `contrast`: Shopify as the landlord: a platform company that rents shops to merchants and changes the platform under them on published dates. → Amazon, a retailer that built its own shop, opened its operations to other sellers and now offers its machinery to other shops and admits agents on its own terms. |\n| p02 | claim | Amazon's architecture history is widely cited, but its dated papers, engineering accounts, shareholder letters and filings explain particular choices about services, carts and fulfillment and do not reveal the design of today's order, pricing or delivery-promise systems. |  | `elaboration`: Amazon's roles toward a merchant. → Its architecture history as a cited example, and what its sources do and do not show. |\n| p03 | context | The central architecture evidence is from 2006–2007 and is read as history, while financial figures come from 2025–2026 filings and AI features from 2024–2026 announcements. |  | `elaboration`: The kinds of source the chapter uses. → Their dates, which separate old mechanisms from recent claims. |\n| p04 | context | In the order's journey, three steps of a jacket purchase meet Amazon's record: adding to a cart, calculating a delivery promise and fulfilling from marketplace-held stock, each treated in the merchant's setting by its own chapter. |  | `place`: The dated record. → Where in the order's thirteen steps it touches the merchant. |\n| p05 | claim | The chapter's claim: each Amazon move answered a business problem (services after the 2001 wall, a cart that never refuses an add, managed databases its teams could run, Fulfillment by Amazon letting other sellers' items carry Prime's promise), and a small merchant adopts the rules behind them (contracts between systems, stock and payment never promised twice, systems its team can run, a computed delivery date), not the service count or the delivery network. |  | `conclusion_summary`: The three steps where Amazon's record meets a merchant's order. → The chapter's answer, stated before the evidence. |\n| p06 | transition | The chapter first says how claims are labelled, then follows the architecture record (the 2001 wall, the team rules and the contract as the only door, the cart and the managed databases, closed by a 2023 post often quoted as a reversal) and the business record (fulfillment opened to others, the delivery promise, the export of the machinery to other shops and AI agents), and ends with what transfers to a merchant, what only Amazon can do and where the evidence stops. |  | `sequence`: The chapter's claim. → The order in which the evidence for it is read. |\n\n## Sections\n\n### How to Read a Case Study in This Book\n\n**Controlling idea** (`context`, id `how-to-read`): Every claim in the case is marked documented, widely reported or inferred, and the chapter names where digests or syndicated reports stand in for primary pages it could not reach.\n\n**Advances the thesis** (S7): Sets the labels that separate the documented record from inference.\n\n**Transition in:** `sequence`: The roadmap's first step: how claims are labelled. → The three labels and the research limits.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | context | Claims are marked documented, widely reported or inferred; inferences carry their reasoning and secondary coverage is named when a primary page could not be retrieved. |  |  |\n| p08 | context | Research closed on 7 November 2026 with four primary pages unreachable (the 2006 ACM Queue interview, the 2004 profile, the 2005 Prime announcement and a February 2026 delivery release), so the chapter says where digests or syndicated reports stand in for them. |  | `elaboration`: The label 'widely reported' for secondary coverage. → Which primary pages could not be reached. |\n\n### 2001: The Front End Hits a Wall\n\n**Controlling idea** (`evidence`, id `wall`): Amazon's move from one application to hundreds of services followed a front end that stopped scaling in 2001 and cost a tail-latency discipline; the order was monolith, wall, services.\n\n**Advances the thesis** (S1): Documents the first business problem and the move that answered it, and why a merchant far from the wall does not copy it.\n\n**Transition in:** `sequence`: The labels and their limits. → The first part of the architecture record: the 2001 wall.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The two terms come first because both sources use them; Amazon's account and its own paper are the evidence; the tail-latency paragraph explains the cost; the sequence paragraph draws the rule. Reversing evidence and reasoning would ask the reader to accept the rule before seeing the dates.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | A monolith is one deployable application with all the shop's logic and usually one database, while a service-oriented architecture splits the shop into separately deployed services that each own one function and call each other over the network. |  |  |\n| p10 | evidence | Amazon's own account, Vogels' 2006 interview as digested in 2007, describes a two-tier monolith whose front end could not scale from 2001 and a move to hundreds of services, with one page touching 100 to 150 of them. | quotation: 'In 2001 it became clear that the front-end application couldn't scale anymore'; 'grew into hundreds of services'; 'between 100-150 services' per page. | `example`: The two shapes just defined. → Amazon's own account of moving from the first to the second. |\n| p11 | evidence | Amazon's own 2007 paper on Dynamo, its internal data store built for the shopping cart, states the same architecture, hundreds of services, and adds that they are measured at the 99.9th percentile. | quotation: 'a highly decentralized, loosely coupled, service oriented architecture consisting of hundreds of services'; latency 'measured at the 99.9th percentile of the distribution'. | `additional_support`: The digest's account of hundreds of services. → Amazon's own paper saying the same, with a latency requirement. |\n| p12 | analysis | The 99.9th-percentile rule carries the cost of the split: a page built from 100 services is as slow as its slowest call, so services bought independent teams and scaling at the price of a time-budget discipline a monolith never needed. | figure: Figure 1: one application on one database until 2001, then a page assembled from hundreds of services where the slowest call sets the speed. | `cause_effect`: The latency clause of the paper. → What it cost: tail latency defined and explained. |\n| p13 | claim | The sequence is monolith, scaling wall, services: the record says decomposition followed the wall, so it gives no reason for a merchant far from either wall to split early, though one whose product page is assembled from several systems meets the aggregation problem in miniature. | reasoning: Inference callout: the wall was one of load and of people; Kestrel & Pine (293,000 online orders a year, fourteen people in technology) is near neither; a page assembled from PIM, ERP price, availability service and reviews inherits the tail-latency problem at the Omnichannel stage. | `conclusion_summary`: The wall, the move and its latency cost. → The order of events as the rule to take away. |\n\n### Teams, Ownership and the Contract as the Only Door\n\n**Controlling idea** (`evidence`, id `teams`): Of Amazon's well-known team rules, the two-pizza rule is in Amazon's own guidance and the API mandate only in one recollection, but Amazon's documented opening of its services shows the outcome, and the rule that transfers is the contract as the only door.\n\n**Advances the thesis** (S3): Separates the documented from the recalled and draws the contract rule a merchant applies to vendors first.\n\n**Transition in:** `elaboration`: Hundreds of services after the 2001 wall. → The teams that built and run them and the rules Amazon is known for.\n\n**Order of paragraphs** (`grouping`): The documented team rules first, then the recalled mandate, then what Amazon confirmed, then the definition and transfer of the rule. The confirmation has to follow the mandate so the reader sees which part of the story is documented.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | claim | Those hundreds of services were built and run by teams, Amazon is as famous for organizing those engineers as for its systems, and of its three well-known team rules one is in its own documentation, one in a digest of its CTO's interview and one only in a former engineer's recollection. |  |  |\n| p19 | evidence | The two-pizza rule is documented in Amazon's own DevOps guidance, which ties small teams to end-to-end ownership of a service, while its 2004 dating is secondary and 'you build it, you run it' comes from the 2007 digest. | quotation: 'We try to create teams that are no larger than can be fed by two pizzas'; 'an end-to-end venture'. | `sequence`: The three rules and their sources. → The first two: two-pizza teams and 'you build it, you run it'. |\n| p20 | evidence | The 'API mandate', the rule most quoted in architecture reviews, exists in public only as Steve Yegge's 2011 recollection of a memo from around 2002, unconfirmed by any Amazon document reviewed, and is treated as widely reported. | quotation: 'All teams will henceforth expose their data and functionality through service interfaces'; 'no direct reads of another team's data store'; 'designed from the ground up to be externalizable'. | `contrast`: Two rules with Amazon or interview sources. → The third, which has neither. |\n| p21 | evidence | What Amazon confirmed in its own words is the outcome: in 2006 it was opening all its services and its fulfillment network to others, and in 2016 Vogels said the API lesson came from Amazon retail. | quotation: 'opening up all of its services for customers and partners to use'; 'opening up our fulfillment network for everyone to use' (2006); 'we had already learned from our experiences with Amazon retail' (2016). | `contrast`: The unconfirmed mandate. → What Amazon did confirm. |\n| p22 | definition | An externalizable interface is an API built as if outsiders could use it, which forces a clean contract; that test is the useful part of the mandate, and for a merchant it applies first to vendors and scripts (W5) and later to internal services. | reasoning: Inference callout: Kestrel & Pine's 34 integrations include agency scripts that read systems directly; the App That Wrote Stock is a second writer reaching into an owned system; W5 is the merchant-scale form of 'no direct reads'; at the Omnichannel stage W1's availability service exposes available-to-promise only through an API. | `elaboration`: The mandate's last line, 'externalizable', and the confirmed opening of services. → What an externalizable interface is and how the rule transfers. |\n\n### The Cart That Never Says No\n\n**Controlling idea** (`evidence`, id `cart`): Amazon's 2007 cart was built to accept every add because a refused add loses a sale, merging conflicting copies later, and Amazon's own engineers then preferred managed services to a correct system that was hard to run.\n\n**Advances the thesis** (S2): Documents the second business problem, the trade-off it chose, and the operability lesson.\n\n**Transition in:** `elaboration`: The Dynamo paper that stated the services architecture, and the contract between services. → The one service the paper is about: the shopping cart.\n\n**Order of paragraphs** (`problem_solution`): The problem (a cart that must accept changes when storage fails) comes first; the paper's business requirement and merge rule are the solution; the 2012 sequel shows what happened to that solution. The sequel needs the merge rule before it, or its 'correct but hard to run' has nothing to refer to.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | context | The Dynamo paper is about one service, the cart, which must accept a customer's changes even when part of the storage is down, and keeping several copies for that creates the problem of reconciling copies that disagree. |  |  |\n| p15 | evidence | The paper states the cart as a business requirement: customers must be able to add items even during failures, because a refused add is a lost sale while a briefly stale cart is harmless, so conflict resolution is pushed to the reads. | quotation: 'even if disks are failing, network routes are flapping, or data centers are being destroyed by tornados'; 'an always writeable data store'; 'forces us to push the complexity of conflict resolution to the reads'. | `problem_solution`: The problem of accepting changes when copies disagree. → The paper's answer, stated as a business requirement. |\n| p16 | definition | Dynamo's cart rule is that an add is never forgotten or rejected: diverging versions are merged so no added item is lost, at the acknowledged price that a deleted item can resurface, and the paper documents this rule but nothing about Amazon's orders, pricing or checkout. The table separates what the paper can be cited for from what it cannot. | quotation: 'an Add to Cart operation can never be forgotten or rejected'; an older version's change 'is still meaningful and should be preserved'.; table: What the Dynamo paper documents (2007) and what it does not say: writes during failures merged on read; tens of millions of requests and over 3 million checkouts a day; the 99.9th percentile; a business rule encoded in a merge rule; versus Dynamo today, the order and pricing systems, the budgets, the rule's fitness for orders and stock. | `elaboration`: Conflict resolution pushed to the reads. → Eventual consistency, conflict resolution and the merge rule itself. |\n| p17 | evidence | In 2012 Amazon wrote that Dynamo, built for the cart, did nothing to reduce the work of running large databases and that its engineers preferred managed services, so operability decided adoption; the second generation, DynamoDB, peaked at 89.2 million requests per second on Prime Day 2021. | quotation: 'originally built to serve the needs of the shopping cart'; 'did nothing to reduce the operational complexity'; 'strongly preferred simplicity to fine-grained control'.; statistic: 89.2 million requests per second during the 66-hour Prime Day 2021 event.; reasoning: Inference callout: the cart is where availability beats consistency by design; a checkout or inventory that promises twice is the Black Friday Oversell; Kestrel & Pine's hosted cart already behaves this way, a builder buys a managed store, and operability applies to every system a fourteen-person team runs.; figure: Figure 2: two diverging carts merged so an add is never lost and a deleted item can resurface. | `time`: Dynamo's cart design of 2007. → What Amazon said about it in 2012, and the managed service that followed. |\n\n### A Nuance: When One Process Beat a Distributed Design\n\n**Controlling idea** (`refutation`, id `nuance`): A 2023 Prime Video post quoted as Amazon reversing its services story supports only a narrow rule: size a boundary to the data that crosses it.\n\n**Advances the thesis** (S1): Answers the misreading of a later source and adds the boundary rule.\n\n**Transition in:** `contrast`: The services story from the 2001 wall through the team rules to the cart and the managed databases. → One 2023 post read as its reversal, which closes the architecture record with its limit.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | counterargument | One 2023 Amazon post is quoted as the reversal of this services story, and the source supports a much narrower claim. |  |  |\n| p44 | evidence | A Prime Video monitoring team replaced a serverless, step-by-step design with one process because it was expensive at scale and handled only about 5% of the expected load, cutting costs by 90%. | quotation: 'running the infrastructure at a high scale was very expensive'; 'supported only around 5% of the expected load'; costs down 90%; 'distributed approach wasn't bringing a lot of benefits in our specific use case'. | `elaboration`: The post quoted as a reversal. → What the post actually describes. |\n| p45 | refutation | That is a cost-and-coupling argument about one internal pipeline, not about the retail site, and the rule it supports is that a boundary should be sized to the data that crosses it. |  | `conclusion_summary`: One pipeline made cheaper as one process. → What it does and does not show. |\n\n### Fulfillment as a Platform\n\n**Controlling idea** (`evidence`, id `fulfillment`): Amazon became a platform by opening its fulfillment and its delivery promise to other sellers, while staying out of the seller-of-record role in their sales, so one stock pool serves several seller-of-record models.\n\n**Advances the thesis** (S4): Documents the retailer-to-platform move and its consequence for a merchant's stock and orders.\n\n**Transition in:** `sequence`: The architecture record, closed by its limit, and Vogels' 2006 note (in the teams section) that Amazon was opening its fulfillment network to everyone. → The business record, starting with that opening.\n\n**Order of paragraphs** (`chronological`): The 2006 opening is picked up first, then the terms, the 2005 and 2006 launches, the 2018 series and later reports, the 2026 filing, and last Kestrel & Pine's side of the relationship. The merchant's side needs seller of record and FBA defined and the stock pool shown.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | context | The business record starts with the second thing Amazon opened in 2006, its fulfillment network: offering fulfillment as a service lets other merchants use a provider's warehouses and delivery while selling their own stock, and Amazon's filings show how this became part of its business model. |  |  |\n| p24 | definition | In the first-party model Amazon buys stock and sells it, in the third-party model an independent seller sells on Amazon for fees, the seller of record is the party that carries the invoice, VAT and return obligations, and under Fulfillment by Amazon the seller's stock sits in Amazon's warehouses. |  | `elaboration`: Fulfillment offered as a service. → The terms needed to read Amazon's version of it. |\n| p25 | evidence | Prime launched in February 2005 (widely reported) and Fulfillment by Amazon on 19 September 2006, with FBA items able to qualify for Prime, so a seller's item in Amazon's warehouse could carry Amazon's promise. | fact: Prime, February 2005, $79 a year for two-day shipping (widely reported); FBA beta, 19 September 2006, with 'Fulfilled by Amazon' items eligible for Prime shipping. | `time`: The definitions of FBA and the third-party model. → When Prime and FBA launched. |\n| p26 | evidence | Bezos' 2018 letter gives the result as a series: third-party sellers' share of physical gross merchandise sales rose from 3% in 1999 to 58% in 2018. | table: 3% (1999), 17% (2002), 28% (2005), 34% (2010), 42% (2012), 51% (2015), 58% (2018). | `cause_effect`: Prime and FBA. → The result, in Amazon's own series. |\n| p27 | evidence | The letter credits FBA and Prime for that growth, and Amazon's 2022 and 2024 reports put independent sellers above 60% of sales, with 80 billion items shipped through FBA since 2006 and Multi-Channel Fulfillment serving sellers' other channels. | quotation: 'Third-party sellers are kicking our first party butt. Badly.'; 'Fulfillment by Amazon and the Prime membership program'; 'more than 60%'; 'more than 80 billion items'; 'more than 300,000 sellers'. | `additional_support`: The 1999 to 2018 series. → The letter's explanation and the later figures. |\n| p28 | evidence | The FY2025 10-K says Amazon is not the seller of record in third-party sales and gives its scale, so one fulfillment network serves flows with different sellers of record, which is the split a merchant faces when one stock pool serves its shop and a marketplace. | quotation: 'We are not the seller of record in these transactions'; net sales $716.9 billion, fulfillment expense $109.1 billion, about 1,576,000 employees.; figure: Figure 3: one fulfillment network, three flows (Amazon's own stock, FBA, Multi-Channel Fulfillment) with different sellers of record.; reasoning: Inference callout: the record shows a retailer became a platform through the promise and the warehouse, not a storefront feature; 1P and 3P side by side means one inventory capability under two seller-of-record models; a marketplace order is a different kind of order. | `additional_support`: Independent sellers' share of sales. → The filing that defines their legal position. |\n| p29 | example | For Kestrel & Pine the relationship runs the other way: marketplace programs ship roughly 40% of its German marketplace units, and under W1 the stock it sends to Amazon's program is a tracked external location it owns but does not control, counted apart from Duiven and sold only on that channel. | scenario: About 40% of German marketplace units are shipped by marketplace programs from stock sent in advance; W1 names that stock a tracked external location (fictional; ledger). | `contrast`: Amazon's side of the third-party relationship. → The merchant's side. |\n\n### The Promise Is the Product\n\n**Controlling idea** (`evidence`, id `promise`): Amazon's 2024 to 2026 record is about delivery speed and the network that keeps the promise, not the software that computes it; what transfers is a promise engine and a curated fast subset, not the network.\n\n**Advances the thesis** (S5): Documents the investment behind the promise and draws the computed-promise rule.\n\n**Transition in:** `cause_effect`: Fulfillment opened to others, so a seller's item carries Amazon's promise. → The promise itself as the object of investment, which the recent record is about.\n\n**Order of paragraphs** (`chronological`): The terms come first because the letters use them; the 2024 letter, the 2025 letter and the February 2026 release follow in date order; the comparison table with the merchant's answers comes last because it needs all three.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | context | Once a seller's item could carry Amazon's promise, the promise became the thing to invest in: the 2024 to 2026 sources are about delivery speed and the network's shape, nothing about the software that computes the promise, and Amazon's 10-K treats the promise as marketing it means to keep offering. | quotation: Shipping offers and Prime benefits are 'effective worldwide marketing tools', to be offered 'indefinitely'. |  |\n| p31 | definition | Regionalization holds stock where it will be ordered, a placement algorithm decides which warehouse holds which SKU, and a delivery promise is the date shown at checkout that the network must keep. |  | `elaboration`: The network's shape. → The three terms the letters use. |\n| p32 | evidence | Jassy's 2024 letter credits faster delivery mainly to the regionalized network, placement algorithms and same-day centers, and says Prime two-day delivery grew from one million products to over 300 million items. | quotation: 'primarily to our regionalization redesign of our fulfillment network'; 'began with one million products and now covers over 300 million items'. | `example`: Regionalization and placement. → The 2024 letter's use of them. |\n| p33 | evidence | The 2025 letter reports over one million robots, more than 85 same-day centers carrying the top 90,000 SKUs and over $4 billion for rural delivery. | statistic: Over one million robots; 'more than 85 Same Day Fulfillment Centers'; 90,000 SKUs; over $4 billion rural network. | `time`: The 2024 letter. → The 2025 letter. |\n| p34 | evidence | A February 2026 release, known only through syndication, reports over 13 billion items delivered same or next day in 2025, figures quoted for their shape rather than their size. | statistic: Over 13 billion items same or next day worldwide, over 8 billion in the United States, a 70% rise in under-a-day deliveries. | `time`: The 2025 letter. → The February 2026 release and its caveat. |\n| p35 | comparison | Set side by side, each thing a delivery promise needs has a documented Amazon answer and a much smaller answer at Kestrel & Pine's scale; what transfers is a promise engine, and with it a curated fast subset of SKUs, since the merchant's static 'ordered before 22:00' rule failed widely on the Friday of Black Friday week 2026 and also fails late orders on ordinary days. | table: What the promise needs (stock near the customer, deciding where stock sits, capacity to keep it, measuring it) against Amazon's documented answer and Kestrel & Pine's.; scenario: Inference callout: the promise engine as a first-class system; Eva's order at 21:14 on Tuesday 13 April 2027 was promised for Wednesday and delivered Thursday; on the Friday of Black Friday week 2026 the WMS queue backed up for four hours (fictional; ledger).; figure: Figure 4: a static delivery sign beside a promise engine fed by stock, warehouses and carriers. | `contrast`: Amazon's documented answers for the promise. → A merchant's answers to the same needs. |\n\n### Other Shops, Other Agents: 2022 to 2026\n\n**Controlling idea** (`evidence`, id `agents`): Amazon now exports its checkout and fulfillment to other shops, imports their catalogs and agents' purchases into its own surface, and admits outside shopping agents only if they operate openly and respect a provider's choice.\n\n**Advances the thesis** (S6): Documents the latest outward moves and the agent rule a merchant needs on its own site.\n\n**Transition in:** `cause_effect`: The machinery that keeps the promise. → Amazon pushing that machinery out to other shops and to software that shops.\n\n**Order of paragraphs** (`chronological`): The term agentic commerce comes right after the section's opening because the products that follow are cases of it; then the products in launch order (2022, 2024, 2025), and last Amazon's 2025 rule for agents it does not control, because that rule is the part that transfers to a merchant. Defining the term after Rufus and Buy for Me would leave both unnamed; putting the rule first would give a merchant's lesson before the moves it answers.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | context | Amazon's latest moves push the same machinery into other merchants' storefronts and into software that shops for customers, and everything here changes quickly. |  |  |\n| p37 | definition | Agentic commerce is software that acts, placing an order on the customer's behalf; chapter 45 owns it, and this case adds how Amazon exports its machinery, the agents it runs itself and its position on agents it does not control. |  | `elaboration`: Software that shops on a customer's behalf. → The name for it and what this case adds. |\n| p38 | evidence | Buy with Prime (2022) exports Amazon's checkout and fulfillment to a merchant's own site, while Shop Direct imports other stores' products into Amazon's search through product feeds. | fact: Buy with Prime handles 'the payment, processing, storage, picking, packing, and shipping'; 16% revenue-per-visitor lift across 167 merchants; Shop Direct 'over 100 million products from more than 400,000 merchants'. | `example`: Amazon's machinery pushed outward. → The first export: Buy with Prime, and its import counterpart, Shop Direct. |\n| p39 | evidence | Rufus, launched in 2024 and renamed Alexa for Shopping in May 2026, has moved from answering questions to acting: automatic purchases at a target price, reorders and scheduled purchases. | fact: Renamed 13 May 2026; 'helped over 300 million customers in 2025'; auto-buy requests 'stay active for six months or until you cancel'. | `additional_support`: Software that connects shops and Amazon's surface. → Amazon's own shopping assistant. |\n| p40 | evidence | Buy for Me (April 2025) goes further: Amazon's app completes a purchase on a participating brand's site, passing encrypted details, while the brand keeps delivery, returns and service. | quotation: 'Amazon completes the purchase on the brand's site'; 'encrypted name, address, and payment details'; catalog from '65K products' to 'tens of millions'; no commission reported in April 2025. | `emphasis`: An assistant that orders within Amazon. → One that orders on other brands' sites. |\n| p41 | evidence | In its Perplexity statement Amazon wrote that third-party purchasing apps should operate openly and respect a provider's decision whether to participate, with the same obligations as delivery apps or travel agencies. | quotation: 'should operate openly'; 'respect service provider decisions whether or not to participate'; 'the same obligations'. | `contrast`: The agents Amazon runs itself. → Its terms for agents it does not control. |\n| p42 | evidence | The dispute is dated (a cease-and-desist letter of 31 October 2025 and a suit reported on 6 November 2025) and its outcome was not checked; read together, the moves make a merchant's checkout and warehouse modules behind someone else's demand and set the rule for bots on a merchant's own site. | fact: Letter dated 31 October 2025; Retail Dive, 6 November 2025: suit in Northern California, Perplexity calling it a 'threat to user choice'.; figure: Figure 5: three documented directions (export, import, agents on Amazon's terms).; reasoning: Inference callout: the two patterns; an authenticated channel for automation and a way to refuse unidentified bots; the Secret Agent from the other side; W8 at Kestrel & Pine. | `elaboration`: Amazon's statement. → Its dates, the lawsuit, and what the moves mean for a merchant. |\n\n### What a Merchant Can Learn, and What Only Amazon Can Do\n\n**Controlling idea** (`synthesis`, id `lessons`): Each lesson rests on dated evidence and transfers as a rule to a merchant, while the network, the robots, the database lineage and the demand surface stay Amazon's; Kestrel & Pine takes three lessons already in Waypoint and keeps its shape.\n\n**Advances the thesis** (S7): Divides the record into what transfers and what does not, and applies it to the book's merchant.\n\n**Transition in:** `conclusion_summary`: The architecture record with its 2023 limit and the business record up to Amazon's rule for agents. → The lessons they give a merchant, and what stays Amazon's.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | synthesis | The author's lessons table pairs each rule (contract as the only door, cart as an availability problem, operability, fulfillment opened to others, the promise, agents, boundary size) with its dated evidence and says how far it transfers. | table: Seven lessons, each with its dated evidence and a transfer verdict. |  |\n| p47 | comparison | Only Amazon can do the rest (85-plus same-day centers, a million robots, a 300-million-item two-day catalog, a demand surface 400,000 merchants feed, a database lineage), and the Giant's Boots is a merchant mistaking that list for the first. |  | `contrast`: The rules that transfer. → The machinery that does not. |\n| p48 | recommendation | Kestrel & Pine takes three lessons, each already a Waypoint decision (an owner and a contract for every integration, W5; the stock in Amazon's program as an external location never pooled with Duiven, W1; an engine behind 'ordered before 22:00', the delivery promise that W8, its agent-readiness decision, lists as a prerequisite), and keeps a hosted platform with an OMS, a PIM and an availability service beside it (W4). | scenario: W1, W4, W5 and the W8 delivery-promise prerequisite; Black Friday 2027; a €48 million merchant (fictional; ledger). | `example`: What transfers and what does not. → What the book's merchant takes. |\n\n### Where the Evidence Stops\n\n**Controlling idea** (`context`, id `evidence`): The public record stops short of Amazon's current internals, rests the API mandate on one recollection, leaves several dates and the agent products' terms unconfirmed or volatile, and gives no unit economics.\n\n**Advances the thesis** (S7): Marks the limit of every case read, so no lesson is mistaken for a description of today's Amazon.\n\n**Transition in:** `contrast`: The lessons drawn from the record. → What the record could not establish.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p49 | context (list) | Five limits: no public description of today's order, pricing, promise or inventory systems; the API mandate on one recollection; the monolith's name, the 2004 dating, the 2005 Prime release and the February 2026 record not fetched from primary pages; the agent products described as of November 2026; and no unit economics for FBA, Prime or same-day delivery. |  |  |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Each documented Amazon move was sized to a problem only Amazon had, but each left a rule that works at any size: contracts between systems, availability for the cart but stock and payment never promised twice, systems the team can run, a computed delivery date. Those rules sit where a merchant meets Amazon, so they are what it can copy.\n\n**So what:** In a design review, 'Amazon did microservices' is replaced by four questions: does each integration go through a contract, do the cart and the stock have the consistency each needs, can the team run what it proposes on the busiest night, and which system computes the delivery promise. Kestrel & Pine's answers are W5, W1 and the W8 promise prerequisite, with its shape (W4) unchanged.\n\n**Callback:** The opening's three relationships a merchant has with Amazon (selling through it, using its fulfillment, competing with it) and the question of which records and commitments the merchant's own systems must still track. p50 answers that question: the contract at each integration (W5), the stock in Amazon's program as its own location (W1), its duties as seller of record for its marketplace orders, and its own computed promise, the delivery-promise prerequisite of W8.\n\n**Takeaway** (`course_of_action`): Strike 'Amazon did microservices' from design reviews and test any Amazon example by the documented rule it shows and the size at which Amazon adopted the shape around it; then ask the eight questions about the merchant's own integrations, cart, stock, promise and agents.\n\n**Hand-off** to [Case: Zalando, Microservices, Platform Strategy and the Return to Discipline](case-zalando.html): `similarity`: Amazon's sequence, from one application to services after a scaling wall and from retailer to platform by opening its operations, with its internals documented only up to 2007. → Zalando, a European retailer that made similar moves (a split to services in 2015, a platform built through logistics) and has published ten years of its decisions, including the ones it later reversed.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | synthesis | Within those limits, each Amazon move was sized to a problem only Amazon had, but each left a rule that works at any size (contracts between systems, availability for the cart but stock and payment never promised twice, systems the team can run, a computed delivery date); those rules answer the question the chapter opened with, which records Kestrel & Pine's own systems must still track (W5, W1, seller-of-record duties for marketplace orders, the delivery-promise prerequisite of W8), and turn 'Amazon did microservices' into questions built on the same four rules. | reasoning: The opening's three relationships; the 2001 wall, the 2007 cart, FBA and the 10-K, the 2024–2026 network; W5, W1, the W8 promise prerequisite. |  |\n| p51 | synthesis (list) | Established: services followed a wall dated 2001 and cost a latency discipline; the cart was always writeable because a refused add is a lost sale, and Amazon's teams then preferred managed services; Prime and FBA took third-party sellers to more than 60% of sales with Amazon not the seller of record; Amazon credits faster delivery to its network and publishes nothing on the promise software; its rule for outside agents is to operate openly and respect a provider's choice. |  | `conclusion_summary`: The chapter's answer in one paragraph. → The points that are established by dated sources. |\n| p52 | synthesis (list) | Depends on context: no direct reads applies to vendors at every stage and to internal services from the Omnichannel stage; availability over consistency fits the cart, not stock, payment or orders; fulfilling other sellers' orders is a Group-stage move; a computed promise becomes necessary when a static one no longer matches the warehouse's real cut-off, a second location or peak days. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p53 | recommendation (list) | The author's synthesis: the useful Amazon is the narrow one, four documented rules that fit a fourteen-person team, and its most important decision for a merchant is that it opened its operations and let the storefront follow. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p54 | recommendation (list) | Eight questions apply the chapter to the reader's own systems: integrations that read data directly, the cart under failure, where consistency is non-negotiable, whether the team can run what it builds, stock owned but not controlled, which system computes the promise, a fast subset of SKUs, and a policy for automated buyers. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own systems. |\n| p55 | transition | Amazon's record ends where its publications end, with its sequence from one application to services and from retailer to platform documented inside only up to 2007; Zalando made similar moves, a split to services in 2015 and a platform built by opening its logistics to partner brands, and has published ten years of its decisions, including the ones it later reversed. |  | `similarity`: Amazon's sequence, from one application to services after a scaling wall and from retailer to platform by opening its operations, with its internals documented only up to 2007. → Zalando, a European retailer that made similar moves and published ten years of its decisions. |\n\n## Non-goals\n\n- The architecture styles as a general comparison, and when a split is justified. See [Monolith, Modular Monolith, Microservices, Composable: What the Evidence Says](commerce-architecture-styles.html).\n- API governance as a discipline, versioning and deprecation; Zalando's written guidelines. See [Promises Between Systems: API Contracts, Webhooks and Versioning](api-contracts-and-versioning.html), [Case: Zalando, Microservices, Platform Strategy and the Return to Discipline](case-zalando.html).\n- Marketplace selling mechanics, listings, SP-API, channel allocation. See [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html).\n- The delivery promise engine and carrier integration; peak-day capacity. See [Getting It There: Carriers, Labels, Tracking and the Delivery Promise](shipping-and-delivery.html), [Black Friday Every Year: Peak Load, Resilience and Recovery](peak-load-and-reliability.html), [Journey 4: Black Friday, Hour by Hour](journey-peak-day.html).\n- Agentic commerce protocols, EU constraints and the merchant's readiness list. See [Assistants and Agents: AI in Commerce and What Is Real in 2026](ai-and-agentic-commerce.html).\n- Any description of Amazon's current order, pricing, promise or inventory systems; the chapter says the evidence stops there.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Needs the author: Carried from spec.md: the ACM Queue text of the 2006 Vogels interview and Fast Company's 2004 profile were blocked on 7 November 2026; if a reviewer can fetch them, the 'widely reported' labels on the 2001 wall quotation and the two-pizza dating can be upgraded. (Fact needed: the primary texts of the ACM Queue interview and the 2004 Fast Company profile.)\n- Needs the author: Carried from spec.md: the Amazon v. Perplexity case status, Buy for Me's commission terms and the Alexa for Shopping feature set are volatile; re-check before any print edition. (Fact needed: the case docket and Amazon's current Buy for Me and Alexa for Shopping pages at print time.)\n- Needs the author: Carried from spec.md: whether to add the Prime Day 2021 DynamoDB figure to the peak chapter's evidence rather than keeping it only here. (Fact needed: the author's choice of where the figure belongs; the peak chapter is another post.)\n- Needs the author: the round 3 report is stale after the closing fixes, and its remaining single-reader notes (the three team rules sharing one paragraph, the 2016 'management APIs' quote's link to the mandate, the agents section's order against Figure 5's grouping, and the API mandate's caveat missing from the KEY POINTS) were not acted on. Fact needed: whether the author wants another draft-check round.\n\n## Decision log\n\n- **2026-11-13** — Confirming round 3 (after the auto-resolution) ended ESCALATE: 13 pass, 8 fail (three blocking: two corroborated flow points and one corroborated term, plus AC-1 and four single-reader flow notes recorded as minor). Cheap, plainly right fixes applied without another round, as the standing instruction says: the thesis paragraph (p05) split into short sentences so its glosses no longer crowd it; the synthesis callback (p50) states the opening's question outright instead of chaining clauses; Andy Jassy introduced as Amazon's chief executive (p32); the promise callout says the 22:00 line promises a later cut-off than the warehouse's 21:00 pick (ledger, warehouse-and-fulfillment line). Flow rubric rerun after the teams move: sound with notes; its note that the stock-and o Take Away' lists as the synthesis: none of them answers the opening.; Putting the contrast with chapter 46 in its own paragraph before the hook (two openings in a row).\n- **2026-11-13** — Canonical facts. The promise inference said the 'ordered before 22:00' rule 'was true on an ordinary Tuesday', which the ledger contradicts: Eva's order at 21:14 on Tuesday 13 April 2027 was promised for Wednesday 14 April and delivered Thursday 15 April, because orders placed between 21:00 and 22:00 are picked the next morning (ledger: Eva's jacket line; warehouse-and-fulfillment line on Duiven's weekday rhythm; journey-consumer-order line). The sentence now says the rule already failed late orders on an ordinary Tuesday and failed everyone on the Friday of Black Friday week (four-hour WMS queue, ledger Black Friday line). The 'Depends on context' bullet that said a static promise 'serves one warehouse on ordinary days' is aligned with the same ledger facts. Rejected: Keeping 'true on an ordinary Tuesday' (contradicts the ledger and chapter 1).\n- **2026-11-13** — Real-company statements held to the cited sources (brief-cases-amazon-zalando.md A1-A8): 'two of the three well-known rules are documented by Amazon' overstated 'you build it, you run it', which the brief tags widely reported (a 2007 digest of the CTO's interview), so the sentence now names each rule's source; 'the 2012 post says teams moved to managed services' and 'a system Amazon said in 2012 its teams had moved away from' overstated the 2012 post, which says Dynamo did nothing to reduce operational complexity and engineers preferred managed services such as S3 and SimpleDB, so both now say engineers chose managed services instead; 'The two were designed to meet' became 'The two met', since the press release says only that FBA items could qualify for Prime. Glosses added without claims: gross merchandise sales, Form 10-K, AWS, SOSP and USENIX as academic systems conferences, Prime Day, Perplexity's Comet as an AI browser. Rejected: Leaving the wording because it is the author's: the brief that sent this pass asks for nothing stronger than the sources.\n- **2026-11-13** — Merged the one-sentence lead-in '**Two-pizza teams.** A small team owns a service ...' into the paragraph with the AWS guidance it introduced (p19); moved the promise section's three definitions (regionalization, placement algorithm, delivery promise) and the 10-K's Prime framing before the letters that use the terms (p31), and added a one-sentence lead-in to the promise table (p35) so the table and the inference follow the comparison they illustrate. Rejected: Keeping the definitions after the 2024 letter, which uses 'regionalization' and 'placement' first (known before new).\n- **2026-11-13** — Length: max_words raised from 6,000 to 6,300 (5%, within the 10% the author allows). The added glosses (SOSP, USENIX, AWS and DevOps, gross merchandise sales, Form 10-K, Prime Day, Comet), the ledger-corrected 22:00 sentence, the rubric-requested 'Established' bullet and the contract's thesis, roadmap and synthesis paragraphs took about 650 words; about 110 were recovered by cutting two repeated sentences in the introduction, a repeated sentence in the promise inference and by tightening the new units. Rejected: Cutting author sentences to stay at 6,000.\n\n## Sources\n\n- **Internal**\n  - _research/brief-cases-amazon-zalando.md (Part A, Part C, key numbers, open questions) — Every Amazon fact and its tag; B1 and B5 for the hand-off's statement of Zalando's 2015 split and logistics platform.\n  - _research/scenario-ledger.md and _research/consistency-issues.md — The Amazon.de channel, the 40% program-fulfilled share, W1, W4, W5 and W8, the static 22:00 promise, Eva's 21:14 order promised Wednesday and delivered Thursday, the four-hour WMS queue, 34 integrations, fourteen in technology, 293,000 online orders, €48 million revenue.\n  - journal-spec.json (case-amazon; case-zalando transition_in; part-11) — Intent, thes
