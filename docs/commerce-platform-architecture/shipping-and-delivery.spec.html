<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/16-shipping-and-delivery/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (the thesis paragraph, a roadmap, and a conclusion paragraph that answers the opening); these are listed in the decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The shipping vocabulary (carrier, service, label, manifest, tracking event, pickup point, cut-off, lane, estimated delivery date, rate shopping, multi-carrier platform) and the three moments shipping touches an order: the promise at checkout, the label at packing and the tracking after collection.\n- **Know:** The four ways to talk to carriers and the four ways to make the promise (static rule, transit table, promise service, predictive model), with what each needs and is blind to.\n- **Know:** What consumer law sets around delivery: 30 days unless agreed, risk with the merchant until possession, refund of only the cheapest standard delivery.\n- **Believe:** From the second carrier onward a normalizing layer between the merchant's systems and the carriers is necessary; the choice is whether to buy or build it.\n- **Believe:** A promise that is not computed cannot be measured, and the only on-time rate to trust is the one computed from the merchant's own scan history.\n- **Be able to:** Specify a first delivery-promise component: its inputs, its safe default when it is unavailable, and the promised-versus-delivered measure per lane.\n- **Be able to:** Say what stops one parcel from getting two barcodes and what alerts on a missed manifest.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer or architect who must connect a warehouse or platform to carriers, or specify a delivery-promise component (Noor Visser at Kestrel & Pine). The e-commerce manager who owns the storefront's promise text (Milan Petrov) and the operations leader who owns carrier contracts (Daniel Okafor) are the second readers.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its 2026 and January 2027 incidents in outline and the names of the sixteen failure patterns.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines (money, goods, returns), 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, business models and the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Parts II and III: available-to-promise and one writer for on hand; checkout creating the order once; one order record with three status lines and goods status per shipment; tax from three facts and one invoice per shipment.\n- From chapter 15: the warehouse system as the only writer of on-hand stock; the fulfillment order accepted or rejected with a key; shipments reported as packed; Duiven's waves (last at 21:00), the carriers' collections (PostNL at 22:30), the warehouse's cut-off, capacity and backlog; the Queue That Waited.\n\n**Does not yet know:**\n\n- Carrier, carrier service, carrier API, label, manifest, tracking event, pickup point and locker, delivery option, lead time and transit time, lane, delivery promise and estimated delivery date (EDD), rate shopping, multi-carrier platform.\n- A normalized tracking-event vocabulary and the difference between a label and a booking.\n- The consumer-law bounds on delivery (Directive 2011/83/EU, Articles 13(2), 18 and 20); customs for consignments from outside the EU and IOSS; WISMO.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given an order placed after the warehouse's last wave under a static next-day promise, the reader gives the date that should have been shown and the inputs that compute it. *Probe:* A Dutch storefront shows 'ordered before 22:00, delivered tomorrow'. A customer orders at 21:14 on a Tuesday; the warehouse released its last wave at 21:00, the carrier collects at 22:30, and transit on her lane is one day. Using only this chapter: what date should she have been shown, why, and what does showing it require? | `custom` | cold_reader | major |\n| AC-2 | Given a retried label call and parcels that never left 'label created', the reader names each fault and its prevention. *Probe:* A label call times out and is retried; later that day a batch of labeled parcels is collected but still shows only 'label created' in tracking. Using only this chapter: what went wrong in each case, and what prevents it? | `custom` | cold_reader | major |\n| AC-3 | The reader can say what the order's shipping status should be derived from when several carriers use different codes. *Probe:* Four carriers send their own scan codes, and the status page, the e-mails and the support agent each read them differently. Using only this chapter: where should the order's shipping status come from? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How does a merchant connect to its carriers for labels and tracking, and how does it make a delivery promise it can keep?\n\n> **Claim:** From the second carrier onward a merchant connects through one normalizing layer, bought or built. The layer books each parcel once under the merchant's reference, closes each day's manifest and maps every carrier's scans onto one event vocabulary from which the shipping status is derived. A delivery promise the merchant can keep is computed from the warehouse's cut-off and backlog, the stock's location and each lane's measured transit time plus a margin set from the lane's late parcels, and checked against delivered dates.\n\n**Disputed by:** The view that carriers are integrated one at a time by whoever packs the parcel, that the order's shipping status is whatever the latest carrier message or a person sets, and that a delivery promise is a line of storefront text ('ordered before 22:00, delivered tomorrow') that operations tries to meet.\n\n**So what:** Eva ordered at 21:14 on 13 April 2027, after Duiven's 21:00 last wave; the storefront's line, written when a 3PL in Tiel shipped the orders, promised Wednesday, and the parcel arrived on Thursday 15 April, the date a computed promise would have shown. On Black Friday 2026 the same line promised next-day delivery while orders queued for four hours. A merchant that accepts the claim buys the normalizing layer early, stores every scan with its lane, and measures promised against delivered per lane before it builds a promise service, as Noor's first version in May 2027 does with a transit table plus the warehouse's cut-off and backlog.\n\n**How and why:** Each carrier has its own API versions and retirement dates, label format, manifest rule and status codes, so a merchant connected to each directly owns one migration per carrier; a normalizing layer absorbs them. A shipment call retried after a timeout books a second barcode unless it carries the merchant's reference, and a label is not a booking until the manifest is closed. Carrier codes differ, so systems reading raw scans disagree, while one vocabulary gives the status page, the notifications and the agent the same status. The promised date is the ship date, set by the cut-off and the backlog, plus the lane's transit time plus a margin for late parcels; a static sentence holds none of these inputs, so it is wrong after the last wave and whenever the queue grows, and nobody notices unless delivered dates are compared with promised ones.\n\n**Supporting claims**\n\n- **S1** — Every carrier has its own API generations, label format, manifest rule and status codes and changes them on its own calendar, so from the second carrier onward a normalizing layer, bought or built, must sit between the merchant's systems and the carriers.\n- **S2** — Booking is a transaction with the carrier: each parcel is booked once under the merchant's own reference, so a retried call cannot create a second barcode, and each day is closed with a manifest, because a label is not a booking until the carrier has the list.\n- **S3** — Every carrier's scans are mapped onto one small event vocabulary, keeping the original; the order's shipping status and its messages are derived from those events, never set by hand, every view reads the same derived status, and each event is stored with its lane.\n- **S4** — A delivery promise the merchant can keep is computed from the warehouse's cut-off and backlog, the stock's location, the lane's transit time and a margin for late parcels; a static sentence holds none of these inputs and is wrong after the last wave and whenever the queue grows.\n- **S5** — The promise is kept honest only by comparing promised with delivered dates per lane, from the merchant's own scan history; a merchant starts with a transit table agreed with the warehouse and builds or buys a promise service when other channels need the same answer by API.\n\n## Role in the part\n\nTurns the warehouse's cut-off and backlog into a computed delivery promise, and adds the carrier's side of the part: one booking per parcel and one event vocabulary from which the shipping status every view reads is derived. Supports P4-1, P4-3, P4-5 of part `part-4`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `chronological` in pieces: the three moments in the order a parcel meets them (label and manifest at packing, tracking after collection), then the promise, which reads both; `comparison` in choices and stages; `assertion_evidence_reasoning` in practice: the claims of the chapter set against public evidence and then against Eva's parcel)\n\nMilan's request and the static sentence come first so that the vocabulary arrives as the words needed to answer it; the vocabulary precedes the moments because every later section uses carrier, label, manifest, tracking event, cut-off and lane. The moments follow the parcel: the booking and the manifest at packing, then the scans after collection, then the promise, which needs the cut-off from chapter 15 and the lane data the scans produce; options, cross-border and cost come last in that section because each changes the label or the promise just explained. The choices can be compared only once the reader knows what a carrier integration and a promise must do, and the stage table needs the choices' names. The public evidence and Eva's parcel test the recommendations on documented cases, and the failures come last because each is one of the earlier mechanisms breaking. Putting the promise before the tracking events would ask the reader to compute a margin from lane data not yet introduced; putting the choices before the moments would compare options against requirements not yet stated.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A shopper sees 'delivered tomorrow' after the warehouse's last dispatch has left; even a carrier that delivers every parcel on time cannot keep that promise.\n\n**Bridge:** Every online shopper has seen a delivery date at checkout and has, at some point, received the parcel a day later. → The date depends on work before collection (the warehouse's waves and the carriers' collection times) and on the journey after it, across several carriers that each speak their own language, so the question becomes how a merchant connects to those carriers and computes a date it can keep.\n\n**Thesis statement** (KEY POINTS callout and paragraph p04): From the second carrier onward, connect through one normalizing layer, bought or built, which books each parcel once under the merchant's reference, closes each day's manifest and maps every carrier's scans onto one set of events from which the shipping status is derived; and compute the promise from the warehouse's cut-off and backlog, the stock's location, the lane's measured transit time and a margin for late parcels, checked against delivered dates.\n\n**Roadmap** (Paragraph p05):\n\n- Start from Milan's request for delivery dates on two more storefronts and the static Dutch sentence. *Kept in:* scene.\n- Define the shipping vocabulary. *Kept in:* vocabulary.\n- Follow the three moments shipping touches an order (labels and manifests, tracking events, the promise), with delivery options, cross-border shipping and cost. *Kept in:* pieces.\n- Compare four ways to talk to carriers and four ways to make the promise, and how they change with scale. *Kept in:* choices, stages.\n- Test the recommendations against public evidence and Eva's parcel from label to doorstep, then list what goes wrong. *Kept in:* practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A date shown at checkout must account for the work before collection as well as the journey after it, so 'delivered tomorrow' shown after the last dispatch has left cannot be kept, and a fixed sentence cannot adjust when those conditions change. | scenario: A shopper sees 'delivered tomorrow' after the warehouse's last dispatch has left. |  |\n| p02 | context | Kestrel & Pine's four carriers each have their own labels, interfaces, collection rules and tracking terms, and a shared shipping interface (which Kestrel & Pine already has as a multi-carrier service in the warehouse system's flow) lets checkout and support use one set of rules; for any merchant the choice is who builds and operates it. | fact: PostNL (NL), bpost (BE), DHL (DE), DPD as backup. | `example`: The date depends on the work before collection and the carrier's journey. → Kestrel & Pine's four carriers and their differences. |\n| p03 | context | Eva's shipment, confirmed at Duiven at 08:40 on 14 April 2027 after chapter 15's packing, is collected by PostNL that evening and delivered on 15 April; this chapter follows its label and tracking and asks whether checkout could have promised that date. |  | `sequence`: The parcel packed and confirmed at Duiven, and the cut-off, capacity and backlog that the storefront's promise ignored. → The carrier's part: labels, manifests and tracking events, and a delivery promise computed from the warehouse's facts and the carrier's transit time. |\n| p04 | claim | The chapter's answer is one normalizing layer from the second carrier onward, which books each parcel once, closes each day's manifest and maps every carrier's scans onto one set of events from which the status is derived, and a promise computed from the warehouse's cut-off and backlog, the stock's location, the lane's transit time and a margin, checked against delivered dates. |  | `problem_solution`: The question whether checkout could have promised Eva's date. → The chapter's claim about carriers and the promise. |\n| p05 | transition | The chapter starts from Milan's request and the shipping vocabulary, follows the three moments shipping touches an order, compares the choices and the scale stages, and ends with public evidence, Eva's parcel from label to doorstep and what goes wrong; its evidence is Kestrel & Pine's carriers and storefront text, carrier and vendor documentation, and research on delivery promises. |  | `sequence`: The claim. → The order in which the chapter argues it and the kind of evidence. |\n\n## Sections\n\n### Setting the Scene: A Sentence in the Theme\n\n**Controlling idea** (`context`, id `scene`): Kestrel & Pine's delivery promise is a sentence in the storefront theme that nothing computes, and Milan's request to extend it to two more storefronts exposes that the promise is wrong after the last wave and at peak and that Waypoint W8 needs a computed answer.\n\n**Advances the thesis** (S4): Shows the static promise failing on Eva's evening and on Black Friday, the problem the computed promise solves.\n\n**Transition in:** `example`: The chapter's claim and roadmap, which start from Milan's request. → The request itself.\n\n**Order of paragraphs** (`problem_solution`): The request first, then the objection that shows why a sentence cannot answer it, then where the sentence came from, then the two evenings it failed, then the decision that requires a computed answer; the failures need the sentence's origin to be understood as a missing computation rather than a typo.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | description | In April 2027 Milan Petrov asks Noor Visser to add delivery dates to the German and Belgian storefronts, while the Dutch one already says 'ordered before 22:00, delivered tomorrow'. | scenario: Milan's request; the Dutch storefront's sentence. |  |\n| p07 | counterargument | Daniel Okafor points out that carriers collect at different times and transit varies by destination, and that even the Dutch promise ignores Duiven's 21:00 last wave. | scenario: Duiven's last picking wave at 21:00 (illustrative, chapter 15). | `contrast`: The request to extend the sentence. → Why the sentence cannot be extended as it is. |\n| p08 | explanation | Nothing computes the promise: it is text written when a 3PL in Tiel handled fulfillment, the agency can change it in an hour, and nobody can say how often it is true. |  | `cause_effect`: The promise ignores the last wave. → Why: it is text from the Tiel era that nothing computes or measures. |\n| p09 | example | The sentence failed Eva, who ordered at 21:14 on 13 April, was promised Wednesday and received her parcel on Thursday, and it stayed visible on Black Friday 2026 while orders waited four hours to reach the warehouse. | case: Eva: ordered 21:14 on 13 April 2027, promised Wednesday 14 April, delivered Thursday 15 April.; case: Black Friday 2026: the order queue to the warehouse backed up for four hours while the promise stayed. | `example`: Nobody knows how often the sentence is true. → Two evenings on which it was not. |\n| p10 | context | Waypoint decision W8 requires availability and delivery dates through APIs, because a service agent, a marketplace or a future shopping agent needs the same computed answer as the storefront, and Milan's request exposes that shared need. |  | `cause_effect`: The sentence's two failures. → The Waypoint decision that requires a computed answer instead. |\n\n### The Vocabulary of Getting It There\n\n**Controlling idea** (`definition`, id `vocabulary`): A newcomer needs a small shipping vocabulary once (carrier and service, carrier API, label, manifest, tracking event, pickup point and locker, delivery option, cut-off, lead and transit time per lane, delivery promise and EDD, rate shopping, multi-carrier platform) before the moments and choices can be described.\n\n**Advances the thesis** (S1, S4): Defines the terms in which the normalizing layer and the computed promise are argued.\n\n**Transition in:** `elaboration`: The words used in Milan's request and Daniel's objection: carrier, collection, cut-off, transit. → Their definitions and the rest of the vocabulary.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | Shipping has a small vocabulary a newcomer needs once, set out in one table. | table: Vocabulary table: carrier and services, carrier API, label, manifest (with DHL's 'transferred only when manifested' rule and 17:45 close-out), tracking event, pickup point and locker, delivery option, cut-off, lead and transit time per lane, delivery promise and EDD, rate shopping, multi-carrier platform. |  |\n\n### How the Pieces Fit Together\n\n**Controlling idea** (`process`, id `pieces`): Shipping touches the order at three moments with different requirements: the booking and manifest at packing, the tracking events after collection and the promise at checkout, which reads both the warehouse's timing and the lane data the events produce; delivery options, cross-border shipping and cost change the label and the promise.\n\n**Advances the thesis** (S1, S2, S3, S4): Argues for one booking per parcel and a manifest, one event vocabulary with a derived status, and a computed promise, and shows why carrier differences need one layer.\n\n**Transition in:** `sequence`: The vocabulary. → How the defined pieces meet the order at three moments.\n\n**Order of paragraphs** (`prerequisite_order`): The overview and requirements come first; then the label and manifest at packing and the scans after collection, in the order the parcel meets them; the promise comes last although the customer sees it first, because its margin needs the lane data the scans produce and its ship date the cut-off from chapter 15. Options, cross-border and cost close the section because each changes the label or the promise already explained; placed earlier they would modify mechanisms the reader has not met.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | description | Shipping touches three moments of the order, the label at packing, the tracking after collection and the promise at checkout, which is shown first but reads what the other two produce, with one shipping layer around them. | figure: Figure 1: three moments, one shipping layer. |  |\n| p13 | analysis | The requirements differ by moment: the checkout promise must be fast and degrade to a safe default, a label call must create exactly one shipment, the manifest must precede the close-out, tracking events must be idempotent, and the tracking number must reach the order within a minute. | table: Requirements table for six flows (options and date at checkout, pickup point search, label creation, manifest, tracking events in, tracking number to the order) by freshness, consistency, speed and availability; latencies labelled as assumptions. | `elaboration`: The three moments. → What each requires. |\n| p14 | explanation (list) | Creating a shipment is a transaction with the carrier, and three details decide whether it is reliable: idempotency by the merchant's reference, manifesting (a label is not a booking), and version drift on each carrier's own calendar. | source: DHL's manifest rule; PostNL's Warehouse V4 Confirming step and its phased V4 rollout from 2025; DHL Parcel DE 2.2.0 (8 October 2026), Kleinpaket, the November 2026 certificate change; bpost v3 to v5 (17 April 2023).; figure: Figure 2: four carriers retire API versions on four calendars; one shipping layer absorbs each migration. | `elaboration`: The label-creation and manifest rows of the requirements table. → The carrier's side of the contract in detail. |\n| p15 | claim | A merchant needs one meaning for 'in transit' or 'delivered' across carriers, so each carrier's codes are mapped into a shared vocabulary while the original event is kept, and the events must arrive as webhooks, because carriers describe the same parcel differently and their tracking APIs are too limited to poll. | source: DHL's Unified Tracking API: codes vary by service, unknown values are undefined; DPD Belgium's depot arrival and departure notifications.; fact: DHL's tracking API: initial access of 250 calls per day, one every 5 seconds. | `sequence`: The booking and the manifest, after which the carrier scans the parcel. → The scans and why they need one vocabulary. |\n| p16 | evidence | A small public vocabulary is enough: EasyPost's ten tracker statuses cover the carriers, Shopify shows that the customer needs only five states and none without a tracking number, and the merchant's own list adapts EasyPost's. | source: EasyPost's ten statuses with scan history and webhooks; Shopify's five customer-facing states and 'no tracking number, no updates'.; table: Normalized-event table: event, meaning, who consumes it (pre_transit to exception). | `example`: The need for one shared vocabulary. → A public model of one and the customer's smaller view. |\n| p17 | claim | Two rules follow: the order's shipping status and its messages are derived from these events and never set by hand, so every view reads the same status, and the 'shipped' message belongs on the carrier's first scan rather than on the warehouse's label (the rule Kestrel & Pine adopts later, after Eva's order); and every event is stored with its lane, because the scan history is the only data on how long a lane really takes. |  | `cause_effect`: The vocabulary and its consumers. → The two rules it implies. |\n| p18 | comparison | A static promise is a business rule with no data behind it, while a computed one is an estimate with inputs: the order time, the cut-off, the backlog and the stock location for the ship date, plus the lane's transit and a margin. | figure: Figure 3: a computed promise. | `cause_effect`: Scan history stored per lane. → The promise that uses it, with the warehouse's timing. |\n| p19 | example | Computed for Eva at 21:14 on Tuesday 13 April, the promise is Thursday 15 April, the day the parcel arrived, where the static sentence said Wednesday; on Black Friday the same computation would have shown the slip. | case: Stock at Duiven; last wave 21:00 so ship date Wednesday; PostNL standard one day to Nijmegen; small margin; promise Thursday 15 April. | `example`: The inputs of a computed promise. → Those inputs for Eva's order. |\n| p20 | evidence | Even the best-resourced operators treat the promise as a model with a measured effect: Amazon's SPEEDY paper reports a small, measured gain in units from sharper promise slots. | source: SPEEDY (ACM SIGSPATIAL, 2025): narrower slots for 60%+ eligible orders; 21-day A/B test, +17 basis points in units. | `additional_support`: The promise as a computation. → Public evidence that operators model it. |\n| p21 | evidence | A 2025 paper forecasts fulfillment time as a distribution from location and carrier performance and finds it more accurate than a rule-based system, especially at spotting late deliveries. | source: Ye, Hijazi and Van Hentenryck (arXiv, 2025): up to 14% higher accuracy and up to 75% better identification of late deliveries than rules. | `additional_support`: Amazon's modelled promise. → A second study, which treats the promise as a distribution. |\n| p22 | analysis | The point for a newcomer is not the models but that the promise has a tail, which a point estimate hides, the margin is meant to hold, and consumer law bounds at 30 days unless agreed. | source: Directive 2011/83/EU, Article 18 (delivery within 30 days unless agreed). | `conclusion_summary`: The two studies. → What a newcomer should take from them. |\n| p23 | evidence | Showing a date, tail and all, is worth measuring: vendor case studies suggest it helps conversion, but only as a positive effect to measure, not a number to plan on. | source: Vendor-reported 10-20% conversion lifts (Maude via Wonderment, Natch via Hive, 2024-2026), not peer reviewed. | `additional_support`: The promise's tail. → What showing the promise is worth and the legal bounds around it. |\n| p25 | explanation | Three things change the label and the promise: first the delivery option, since pickup points and lockers are a second network with its own lookup, and the option chosen must be stored on the order because it changes the label, the promise, the notifications and the refund. | source: PostNL Checkout V4 Locations and TimeFrame APIs; Sendcloud '390K+' service points and nShift '1.2 million' points (marketing counts); Directive 2011/83/EU Article 13(2). | `sequence`: The promise of a date. → The other choice the customer makes at checkout: where to deliver. |\n| p26 | explanation | Kestrel & Pine ships only within the EU, but outside the customs union an import declaration, IOSS and customs data per SKU appear, which makes the label call depend on catalog data quality. | source: EU import declarations for all goods since 1 July 2021 with a reduced data set up to €150; IOSS; a 2026 Council proposal to delete the €150 threshold; DHL's paperless customs documents from 3 November 2026. | `contrast`: Options that change the label inside the EU. → What changes the label when a parcel leaves the customs union. |\n| p27 | analysis | Shipping is a cost lever as well as a logistics fact, and the architecture offers three levers (rate shopping, right-sized boxes, steering to pickup points) only if checkout can price options differently and the shipping service can choose per parcel. | statistic: D2C average order €92, free shipping above €75; €4.50 to €6.00 per domestic parcel (assumption). | `additional_support`: What changes the label and the promise. → What shipping costs and how the architecture can lower it. |\n\n### The Choices\n\n**Controlling idea** (`comparison`, id `choices`): There are four ways to talk to carriers and four ways to make the promise; from the second carrier the normalizing layer is not optional, only whether to buy or build it, and the promise grows from a static rule to a transit table, a promise service and, at Group scale, a model.\n\n**Advances the thesis** (S1, S4, S5): Compares the options against the requirements and states the rule for the normalizing layer and the stages of the promise.\n\n**Transition in:** `cause_effect`: What the shipping layer and the promise must do at each moment. → The ways a merchant can arrange both.\n\n**Order of paragraphs** (`comparison`): Who talks to the carriers first, because the promise service reads data the shipping layer produces; within each question, the options from most to least carrier-specific (or from least to most data), each followed by its table and the author's rule.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | comparison | Direct integration per carrier gives the best access to carrier features and rates but costs one integration and one migration calendar per carrier, which fits a merchant with volume contracts and an owner for each integration. |  |  |\n| p29 | comparison | A multi-carrier platform gives one interface across carriers and absorbs their changes, at the cost of services it may not expose and one more dependency; its marketing counts describe different units and should not be compared. | statistic: Sendcloud: over 30,000 businesses and 170 carriers (6 November 2026), 160 on its developer site; nShift: over 1,000 carrier services and 450 platforms (n.d.). | `contrast`: Direct integration and its per-carrier cost. → A service that takes that cost over. |\n| p30 | comparison | Carrier integration bundled in the WMS or the 3PL means the merchant integrates nothing and sees only tracking numbers, which fits Starting and Growing merchants and limits one that wants checkout options or its own scan history. | source: Picqer sends 'carrier labels and tracking codes' back to the store in one step. | `contrast`: A separate multi-carrier service. → Carrier integration inside the warehouse's own software. |\n| p31 | comparison | The shop platform's own labels are simplest for a single-country merchant and stop fitting when a warehouse system owns the packing station. | table: Who-talks-to-carriers table: four choices by fits when, limits when, who absorbs carrier change. | `contrast`: Integration inside the WMS. → Integration inside the shop platform. |\n| p32 | recommendation | Kestrel & Pine's combination of own carrier contracts and a multi-carrier service inside the WMS flow is common at the Omnichannel stage, and the author's rule is that the normalizing layer is not optional from the second carrier onward; only buying or building it is. | fact: A multi-carrier shipping service integrated in the WMS flow; own contracts with PostNL and DHL. | `conclusion_summary`: The four choices and their table. → Kestrel & Pine's combination and the author's rule. |\n| p33 | comparison | A static rule costs nothing and needs no data, and is right only as often as the warehouse and carrier happen to agree with it, which fits a Starting merchant with one carrier and one cut-off. |  | `sequence`: Who talks to the carriers. → The second choice: how the promise is made, starting with the static rule. |\n| p34 | comparison | A transit table of lead days per lane plus the warehouse's cut-off is honest on an ordinary day but blind to backlog and to the carrier's bad week, which fits a Growing merchant. |  | `contrast`: The static rule with no data. → The first approach with data. |\n| p35 | comparison | A promise service reads cut-off, backlog, stock location, lane table and a performance margin and answers checkout, marketplaces and agents, which is what W8 means; it fits the Omnichannel stage and is worthless if nobody feeds and measures it. |  | `contrast`: The transit table, blind to backlog. → A component that also reads the backlog and the lane's performance. |\n| p36 | comparison | A predictive model learned from scan history suits a Group-stage operator with the data and the analysts, and is too much for everyone else. | table: How-the-promise-is-made table: four approaches by inputs, honest when, blind to. | `contrast`: The promise service. → The model that replaces its lane table with forecasts. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`recommendation`, id `stages`): A Growing merchant should buy the normalizing layer early, because carrier change is external and frequent, but keep the promise a transit table agreed with the warehouse until it has the data to feed a service, and then build or buy one with an API.\n\n**Advances the thesis** (S1, S5): Places the layer and each promise approach at the stage where it fits.\n\n**Transition in:** `elaboration`: The options and the stages named beside them. → The options set stage by stage, with the warning signs of outgrowing each.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | recommendation | Shipping is the one area where a Growing merchant should buy the normalizing layer early, while the promise should stay a transit table agreed with the warehouse until the cut-off, backlog and lane data exist, and then become a component with an API. | table: Stage table: typical setup, what becomes necessary and warning signs, Starting to Group. |  |\n\n### In Practice\n\n**Controlling idea** (`evidence`, id `practice`): Public evidence confirms carrier drift, the thinness of public on-time data and the promise as a measured model, and Eva's parcel shows the layer working while the static promise failed.\n\n**Advances the thesis** (S1, S3, S4, S5): Tests the chapter's recommendations against documented cases and against Eva's parcel.\n\n**Transition in:** `additional_support`: The recommendations by stage. → The public evidence behind them and one parcel that tests them.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Public evidence first (carrier drift, then on-time data), then Kestrel & Pine's parcel in time order, then the promise that failed and the plan that answers it. The parcel's steps out of time order would hide that the shipped message went out before the carrier had the parcel; the plan before the failure would answer a question not yet asked.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | evidence | The carriers' own developer pages show the drift on four calendars at once, each change a Pulled Rug for a merchant that integrated directly without watching the changelog. | source: The carrier changes cited in the labels subsection, plus DHL's Kleinpaket rename 'with automatic correction of old requests' and bpost's bpack manual at version 3.3.35 (26 May 2026). |  |\n| p39 | evidence | Public on-time measures for parcels are thin and self-reported, so the only on-time rate a merchant can trust is the one it computes from its own scan history stored per lane. | statistic: PostNL: 97% 'delivery quality parcels in NL' in 2023 and 2024, 371 million parcels in 2024 (own KPI); ACM letter figures (86% within 24 hours in 2024; a fine of nearly €7 million for 2023). | `sequence`: What carriers document about their interfaces. → What is published about their delivery performance. |\n| p41 | example | Eva's parcel is one of those the shipping service handles (336,000 in 2026): at 08:40 on 14 April it books her PostNL parcel with the fulfillment order reference as the idempotency key, so a retry cannot book a second shipment. | case: Shipment created 08:40 on 14 April 2027; 1.1 kg; standard home delivery to Nijmegen. 336,000 parcels shipped in 2026. | `example`: The public evidence on carrier interfaces and on-time performance. → Eva's parcel as a worked case. |\n| p42 | example | The tracking number reaches the order within a minute of the label, and at 18:30 the parcel goes on the day's manifest of 1,100 PostNL parcels for the 22:30 collection. | case: Tracking number to the order within a minute; manifested 18:30 with 1,100 PostNL parcels (illustrative); collection 22:30. | `time`: The booking at 08:40. → The label's tracking number and the evening's manifest. |\n| p43 | example | PostNL's scans follow from 23:40 to delivery at 11:20 on 15 April, and each is translated into one status and stored with its route; Eva's 'shipped' e-mail had already gone out at 08:40, when the WMS reported the shipment, fifteen hours before the carrier's first scan, which is the gap the first-scan rule Kestrel & Pine adopts later closes. | case: WMS shipment report and Eva's shipping confirmation 08:40 on 14 April (ledger; journey-consumer-order); depot scan 23:40; out for delivery 07:50 and delivered 11:20 on 15 April (illustrative times). | `time`: The manifest and the collection. → The carrier's scans and what they drive. |\n| p44 | analysis | What failed was the promise on Tuesday evening (Wednesday shown, Thursday delivered), and its cost is a WISMO ticket and a disappointed customer for every weekday order between 21:00 and 22:00, which nobody has measured. | case: 21:14, 'ordered before 22:00, delivered tomorrow': Wednesday shown, Thursday delivered (computed in p19). | `contrast`: The parcel handled correctly from booking to delivery. → The part that did not work: the promise. |\n| p45 | recommendation | Noor's first version, specified in May 2027 ahead of the W8 promise API in 2028, is the transit table plus the WMS's cut-off and backlog, measured weekly as promised-versus-delivered per lane. | scenario: Transit table plus cut-off and backlog, measured weekly per lane (illustrative plan, May 2027); W8 promise API by 2028.; figure: Figure 4: Eva's promise written versus computed. | `problem_solution`: The unmeasured cost of the wrong promise. → The first computed promise Noor specifies. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`cause_effect`, id `wrong`): Each failure of shipping is one of the chapter's mechanisms breaking (a retired version, a duplicate booking, a missed manifest, a lost scan, a lost tracking number, a static promise at peak, a lost parcel, a marketplace parcel without tracking), and each has a detection and a recovery.\n\n**Advances the thesis** (S1, S2, S3, S4): Shows what happens when the layer, the booking key, the manifest, the event vocabulary or the computed promise is missing.\n\n**Transition in:** `contrast`: Eva's parcel handled correctly by the layer. → What happens when each mechanism fails.\n\n**Order of paragraphs** (`chronological`): The failures in the order a parcel meets them: the carrier interface, the booking, the tracking number reaching the order at label print, the manifest at the end of the day, the scans after collection, the promise at peak, then the parcel itself and, last, parcels the merchant does not ship. Out of that order the reader would meet a failure before the step it breaks.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | cause_effect | A retired API version stops the first label of the morning; it is detected by watching changelogs and testing in the sandbox and recovered by switching to the backup carrier. |  |  |\n| p47 | cause_effect | A timeout and a retry create two labels for one parcel; the second shipment is cancelled before the manifest and the call is made idempotent by reference. |  | `sequence`: The carrier interface failing. → The booking failing. |\n| p50 | cause_effect | A tracking number that never reached the order leaves the customer with no status, detected by comparing shipments with orders and recovered by replay. |  | `sequence`: The booking. → The tracking number on its way to the order at label print. |\n| p48 | cause_effect | A missed manifest leaves parcels the carrier does not know, detected as parcels stuck in pre-transit and prevented by a scheduled close-out with an alert. |  | `sequence`: The label and its tracking number. → The day's close-out. |\n| p49 | cause_effect | A lost or duplicated scan is caught by keying events and polling quiet parcels, and recovered by idempotent handling and a status derived from the full history. |  | `sequence`: The manifest and the collection. → The scans after collection. |\n| p51 | cause_effect | A static promise stays on the page while the order feed backs up; the age of the oldest unprocessed order and promised-versus-delivered detect it, and a promise that reads the backlog recovers it. |  | `sequence`: Failures of the carrier side, ending with the scans. → The promise failing at peak. |\n| p52 | cause_effect | Undeliverable, lost or damaged parcels are detected from the normalized events and the lane's expected time and handled by a service workflow, with the loss the merchant's until delivery. | source: Directive 2011/83/EU, Article 20: risk passes when the consumer has 'acquired the physical possession of the goods'. | `sequence`: The promise. → The parcel itself going wrong. |\n| p53 | cause_effect | Parcels shipped by a marketplace's own fulfillment program carry tracking the merchant never sees unless the connector imports it as events. | statistic: About 40% of Kestrel & Pine's German marketplace units fulfilled by the marketplace's program. | `sequence`: Parcels Kestrel & Pine ships. → Parcels someone else ships. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The two halves of the chapter depend on each other: the normalizing layer's events are the only record of how long each lane takes, and a computed promise needs exactly that record plus the warehouse's cut-off and backlog. Without the layer there is no lane data to compute from; with a static sentence the data is never used. The promise at checkout becomes true only when the shipping layer feeds it and its dates are compared with what the carriers report.\n\n**So what:** A merchant can start without a model: make the storefront's date agree with the warehouse's last wave, store every scan with its lane from the first day, and count how often parcels arrive on the date shown; Kestrel & Pine's first version does exactly this.\n\n**Callback:** The hook's shopper who sees 'delivered tomorrow' after the warehouse's last dispatch has left. The reader can now say which inputs would have changed that date (the cut-off, the backlog, the lane's transit and margin) and where they come from (the warehouse system and the scans the layer stores).\n\n**Takeaway** (`course_of_action`): Buy or build the normalizing layer from the second carrier, book each parcel once under your reference and close the manifest on a schedule, derive the status from one event vocabulary, and compute the promise from the warehouse's cut-off and backlog and the lane's measured transit, starting with a transit table measured promised-versus-delivered per lane.\n\n**Hand-off** to [Stores Are Systems Too: Point of Sale and Omnichannel Fulfillment](stores-and-omnichannel.html): `contrast`: The parcel delivered to Eva's door from Duiven, promised from the warehouse's cut-off and the carrier's lane. → Orders and stock that live in a store: collection at the counter, dispatch from a store shelf, returns at the till and orders for stock that is not in the building.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p54 | synthesis | The shopper who saw 'delivered tomorrow' after the last dispatch shows that the two halves depend on each other: the layer's events are the only record of each lane's transit, the promise needs that record and the warehouse's cut-off and backlog, and the date becomes true only when the layer feeds the promise and the promise is measured. | reasoning: The hook's 'delivered tomorrow' set against the chapter's two halves. |  |\n| p55 | synthesis (list) | Established: carriers version and retire their APIs and status codes on their own calendars; a tracking number must reach the order for any status to exist and a small vocabulary covers every carrier; consumer law bounds the promise; and published research treats the promise as a distribution. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what the sources establish. |\n| p56 | synthesis (list) | Depends on context: when to buy a multi-carrier platform, when to move from a transit table to a service, whether customs data matters, and where pickup points are worth offering. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p57 | recommendation (list) | The author's synthesis: a promise that cannot be computed cannot be measured, so the first step is to make the storefront's sentence agree with the last wave and count how often it holds, and every scan should be stored with its lane from the first day. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p58 | recommendation (list) | Ten questions let the reader check, in their own company, what the promise is computed from, who talks to the carriers, how bookings, manifests and the shipped message are protected, which vocabulary the status uses, and which carrier is the backup. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own company. |\n| p59 | transition | Eva's parcel is delivered to her door, but Kestrel & Pine's six stores, its click-and-collect pilot and its nightly store stock raise what changes when the order is collected at a counter, shipped from a store shelf, returned at the till or placed for stock that is not in the building. |  | `contrast`: The parcel delivered to Eva's door from Duiven, promised from the warehouse's cut-off and the carrier's lane. → Orders and stock that live in a store. |\n\n## Non-goals\n\n- Warehouse steps, the fulfillment order, waves, capacity and the wave schedule as such; easonable model, not a standard.\n- **2026-11-07** — Kept cross-border to one paragraph since Kestrel & Pine ships only within the EU; IOSS and customs are defined so a reader can recognize them, and the VAT side is left to chapter 14.\n- **2026-11-07** — Presented the vendor conversion case studies and PostNL's 97% KPI with explicit caveats (vendor-reported; self-reported) rather than omitting them, so the reader learns to read such numbers.\n\n## Sources\n\n- **Internal**\n  - _research/scenario-ledger.md and _research/consistency-issues.md (ruling 15) — Carriers, the static promise, Eva's dates and parcel times (shipping-and-delivery line), the Black Friday four-hour queue, the €75 free-shipping threshold and €92 average order, 336,000 parcels in 2026, the 40% marketplace-fulfilled German units, Waypoint W8, Duiven's 21:00 last wave and 22:30 PostNL collection.\n  - journal-spec.json (shipping-and-delivery; part-4; stores-and-omnichannel transition_in) — Intent, thesis, role, acceptance criteria and the hand-off to the stores chapter.\n  - PLAN.md contract 16 and the neighbouring contracts 11, 15, 17, 18, 19 and 20 — The chapter's original contract.\n  - _research/brief-inventory-fulfillment-returns.md (Parts 4 and 6) — Carrier APIs, multi-carrier platforms, delivery promise, cross-border, carrier performance, status page states.\n  - warehouse-and-fulfillment; customer-service-and-notifications; meet-kestrel-and-pine — The 21:00 last wave and 22:30 collection; the 08:40 shipping confirmation; the target rule that 'shipped' is sent on the carrier's scan.\n- **External**\n  - PostNL developer portal and API overview (n.d., accessed 2026-11); PostNL Annual Report 2024 (2025) — V4 API families and phased rollout; parcel KPI and volume.\n  - DHL Parcel DE Shipping API v2 (updated 2026-11-03); DHL Shipment Tracking Unified API (changelog through 2026-09); DHL developer portal — Manifest rule and close-out, Kleinpaket, customs documents, certificate change, tracking co <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');

            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);

            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';

                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {

                    sectionEl.insertBefore(wrap, sectionEl.firstChild);

            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
