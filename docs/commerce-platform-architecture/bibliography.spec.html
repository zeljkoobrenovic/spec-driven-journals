<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-13 from the published page (posts/bibliography/index.md, generated by _research/bib-tools/run.sh) and its former spec.md, whose Non-goals, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the page in its order; each topic's entry list is one paragraph with form list. Intent, acceptance criteria and role are copied unchanged from journal-spec.json; the journal spec gives a reference page no thesis, so the thesis here is the page's own and only orders its sections. A light pass for a lookup page: entries were checked for consistency, not rewritten.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Every public source the pages cite, listed once with a stable R-number, date, evidence type, the claim it supports and the pages citing it, by topic and by chapter.\n- **Believe:** A claim is as trustworthy as the kind and age of its source: a law records a requirement, a filing reported numbers, API documentation an interface as read, an engineering post what a company said it built that year.\n- **Be able to:** Trace a figure or rule in a chapter to its dated source and weigh it by evidence type and date.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader traces a claim in chapter 46 to its source and says how widely the book relies on it. *Probe:* Using only this page: chapter 46 says Shopify retries a failed webhook delivery 8 times over 4 hours. Which entry stands behind it, what kind of evidence is it, when was it read, and how many pages cite it? | `custom` | cold_reader | major |\n| AC-2 | A reader weighs a source by its type and date. *Probe:* Using only this page: a 2016 engineering post describes a company's architecture, and a documentation page is marked 'n.d.'. How far should a reader trust each for a claim about today, and does any source describe Kestrel & Pine? | `custom` | cold_reader | major |\n| AC-3 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict what the page contains and the kind of evidence or material it uses. *Probe:* After reading only the introduction: what will this page give you, in what order, and from what kind of material? | `intro_predicts_content` | cold_reader | major |\n\n## Thesis\n\n**Question:** Which sources does the book cite?\n\n> **Claim:** The book cites 847 public sources, each listed once with a stable R-number, its date, its evidence type, the claim it supports and the pages citing it, by topic and by chapter; a claim is as trustworthy as the kind and age of its source, and no source describes Kestrel & Pine.\n\n**Disputed by:** The view that a reader can follow a chapter's own Sources section or search the web, so a consolidated register adds nothing.\n\n**So what:** A reader traces any figure or rule to a dated document, weighs it by evidence type and age, and sees how many pages rely on it.\n\n**How and why:** The register is generated from every page's Sources and Evidence section with stable identifiers, consolidating equivalent URLs and keeping the most specific date.\n\n**Supporting claims**\n\n- **S1** — An entry is identified by a stable R-number and carries its date, evidence type, supported claim and citing pages.\n- **S2** — Every cited source can be found by topic or by citing chapter, and weighed by its evidence type and date.\n\n## Role in the part\n\nCloses the book's apparatus: every cited source once, so any claim can be traced to a dated document by topic or by chapter. Supports PR-4 of part `reference`.\n\n## Flow\n\n**Pattern:** `prerequisite_order`\n\nHow to read an entry comes first, because every entry is weighed by its type and date; the topic index then maps the topics before the entries themselves; the by-chapter list reads the same sources from the citing side, and the closing ends the reference pages.\n\n## Introduction\n\n**Hook** (`direct_statement`): Use this register to trace a claim in any chapter to its public source and see when that evidence was published or checked.\n\n**Bridge:** The reader has met a figure, a rule or a company fact in a chapter and wants to know what stands behind it. → Every cited source is gathered here once, with its date and evidence type, by topic and by chapter.\n\n**Thesis statement** (KEY POINTS callout): Sources are listed because they were cited; their dates and evidence types tell you how far to trust a claim; documented facts, inferences and Kestrel & Pine stay distinct.\n\n**Roadmap** (IN THIS SECTION callout and paragraphs p01-p02 (the by-chapter lookup, in the conclusion region, is also announced there)):\n\n- How to read an entry (R-number, fields, evidence type). *Kept in:* how-to-read.\n- A topic index, then the entries by topic. *Kept in:* topic-index, t1, t2, t3, t4, t5, t6, t7, t8, t9, t10, t11.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Use the register to trace a claim to its source and its date, by topic or by chapter; research took place in November 2026 and 'n.d.' means undated, so the access month dates the reading. |  |  |\n| p02 | transition | The page first explains how to read an entry, then gives a topic index, the entries by topic and the sources by chapter (some sources being in other languages). |  | `sequence`: What the register holds and how it is dated. → The order of the page. |\n\n## Sections\n\n### How to Read This Register\n\n**Controlling idea** (`explanation`, id `how-to-read`): An entry is identified, not ranked, by a stable R-number and carries the fields a reader needs to weigh it, above all its evidence type and date.\n\n**Advances the thesis** (S1, S2): Says how to read an entry  gives their range. |  |\n\n### Security, privacy and regulation\n\n**Controlling idea** (`evidence`, id `t8`): The sources cited mainly by the security, privacy and regulation chapters, one entry each.\n\n**Advances the thesis** (S2): Lists the dated sources of one topic.\n\n**Transition in:** `sequence`: The platform engineering, tenancy, extensibility, storefront and peak entries. → The security, privacy and regulation entries.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | evidence (list) | Each security, privacy and regulation source is listed once with its R-number, date, supported claim, evidence type and citing pages. | source: The security, privacy and regulation entries, as the topic index gives their range. |  |\n\n### Journeys\n\n**Controlling idea** (`evidence`, id `t9`): The sources cited mainly by the journeys chapters, one entry each.\n\n**Advances the thesis** (S2): Lists the dated sources of one topic.\n\n**Transition in:** `sequence`: The security, privacy and regulation entries. → The journeys entries.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | evidence (list) | Each journeys source is listed once with its R-number, date, supported claim, evidence type and citing pages. | source: The journeys entries, as the topic index gives their range. |  |\n\n### Evolution, organization and AI\n\n**Controlling idea** (`evidence`, id `t10`): The sources cited mainly by the evolution, organization and ai chapters, one entry each.\n\n**Advances the thesis** (S2): Lists the dated sources of one topic.\n\n**Transition in:** `sequence`: The journeys entries. → The evolution, organization and ai entries.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | evidence (list) | Each evolution, organization and ai source is listed once with its R-number, date, supported claim, evidence type and citing pages. | source: The evolution, organization and ai entries, as the topic index gives their range. |  |\n\n### Company records and case evidence\n\n**Controlling idea** (`evidence`, id `t11`): The sources cited mainly by the company records and case evidence chapters, one entry each.\n\n**Advances the thesis** (S2): Lists the dated sources of one topic.\n\n**Transition in:** `sequence`: The evolution, organization and ai entries. → The company records and case evidence entries.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | evidence (list) | Each company records and case evidence source is listed once with its R-number, date, supported claim, evidence type and citing pages. | source: The company records and case evidence entries, as the topic index gives their range. |  |\n\n## Conclusion: Sources by Chapter\n\n**Synthesis:** The four reference pages answer the four lookups a chapter leaves the reader with (where, which record, what word, what source), and each answer points back to the chapter that owns it.\n\n**So what:** A claim, a term or a card in any chapter can be checked against its owning chapter and its dated source without rereading the book, and a disagreement between them is a defect to fix.\n\n**Callback:** This page's KEY POINTS: weigh a claim by the kind and age of its source; keep documented facts, inferences and Kestrel & Pine apart. The closing turns them into the course of action for using the whole book, and, as the Reference part's closing, recalls domain-coverage's opening point that the book does not cover every job equally.\n\n**Takeaway** (`course_of_action`): Before relying on a figure or a rule from the book, find its source in the register, check the source's type and date, and keep documented facts, labeled inferences and Kestrel & Pine apart.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | description (list) | Each citing page lists the identifiers it cites, in reading order. |  |  |\n| p32 | explanation | No source describes Kestrel & Pine, which is fictional, and the recommendations, labeled inferences and assumptions are the author's judgement. |  | `contrast`: The public sources by page. → What no source stands behind. |\n| p33 | synthesis | The four reference pages answer four lookups that point back to the owning chapter, so check coverage and a claim's source, type and date before relying on it. |  | `conclusion_summary`: The register as a whole. → The close of the reference pages. |\n\n## Non-goals\n\n- A reading list, a ranking of sources, the research briefs, the plan or links to companion books\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The page is generated by _research/bib-tools/run.sh and its spec said it is never hand-edited. This pass hand-edited index.md (first sentence, the part-closing paragraph, R604's citing links); a rerun of run.sh will drop them unless gen.py emits the closing paragraph and the first sentence and the generator is rerun after chapter 36's Sources change. Needs the author: move these into gen.py or fix.py, and rerun the generator once the chapters' Sources sections settle (other chapters' Sources were also edited in this revision pass, so counts and Cited in lines may be stale beyond R604).\n- Chapter 46 (case-shopify) cites a 2019 Shopify Engineering post on database backups in its INFERENCE callout, but neither its Sources section nor this register lists it. Needs the author: the post's title and URL, to add it to chapter 46's Sources and regenerate, or drop the reference from chapter 46.\n- Generated entries the round-1 readers found faulty (citations left unchanged in this pass): claim text copied word for word across entries (R1=R2, R187=R188=R412, R189=R190, R409=R410, R638=R639; R188 'Fulfill orders with Checkout' does not show double-refund risk); doubtful evidence types (R98 ACM press item typed cour check-report.json is therefore stale against these edits. Rejected: Recording unrun checks as waived; A second round\n- **2026-11-13** — Converted spec.md to spec.json in a light pass for a lookup page: one spec paragraph per draft unit, each topic's entry list one list paragraph; the thesis is the page's own because the journal spec gives a reference page none. length.max_words is the published length plus 10% (32,751 words as check_draft counts them; 36,026). Rejected: Specifying entries as paragraphs; Carrying the old inventory-style success criteria over: each (entries come from Sources sections; entry fields; topics follow the parts; stable R-numbers; generated page) describes contents or process, not a reader outcome, and the journal spec's three acceptance criteria replace them\n- **2026-11-13** — Added the Reference part's closing as one short paragraph at the end of the page (p33), as the journal spec's reference part closing says, and made the first prose sentence say what the page is for and how to use it. Rejected: A separate closing heading; Placing the closing before the Kestrel & Pine note\n- **2026-11-13** — Chapter 36 (commerce-regulation) removed the Sephora settlement from its Sources on 2026-11-12; R604 stays (privacy-and-customer-data still cites it) but its Cited in no longer names commerce-regulation, and the commerce-regulation line in Sources by Chapter drops R604 (35 to 34). The citation itself is unchanged. Rejected: Retiring R604; Leaving the stale citing link\n- **2026-11-13** — Chapter 46's 2019 Shopify post on database backups is not in the register, so it is not resolved here; recorded under open_questions. Rejected: Adding an entry by hand\n- **2026-11-07** — Legal texts cited by the Part VIII chapters sit together under Security, privacy and regulation unless another part cites them in more pages.\n- **2026-11-07** — Filings and announcements of the case subjects (Shopify, Amazon, Zalando, commercetools, Shopware) go to Company records and case evidence.\n\n## Sources\n\n- **Internal**\n  - The Sources and Evidence sections of every page in config.yaml — Every entry.\n  - _research/bib-tools/ (run.sh, gen.py, fix.py, ids.json) — The generator and the stable R-number registry.\n\n## Changelog\n\n- **2026-11-13** — spec.md converted to spec.json; part-closing paragraph and a use-this-page first sentence added to index.md; R604's stale commerce-regulation citing link removed. After draft check round 1: roadmap sentence, Productscape sentence moved, Topic Index range note and rule wording, Kestrel & Pine contrast, callback fixes; spec p02, p06, p07, p32, roadmap and callback updated.\n- **2026-11-07** — First version; page generated from 818 sources.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
