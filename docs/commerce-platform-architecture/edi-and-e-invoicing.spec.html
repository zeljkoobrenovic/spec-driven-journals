<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Documents Between Companies: EDI, Punchout and E-Invoicing\n\n> Working doc for chapter 22 of *ORDERED: Architecting Commerce Platforms*. Lives next to `index.md`; the spec drives the post, the post is the artifact.\n\n## Intent\n\nGive a reader who has never seen an EDI message a working understanding of how companies trade by exchanging standard documents (order, despatch advice, invoice), why each document must be produced by a different internal system, and what the European e-invoicing mandates require by which date. The chapter's one durable claim: an EDI order is a channel into the same order record as a web order, the despatch advice must come from the warehouse's pack confirmation, and the invoice must come from the ERP's confirmed shipment, and every compliance chargeback in the public rule sets is a document generated from the wrong place. After reading, the reader can explain the ASN Chargeback at Kestrel & Pine, read a retailer's EDI purchasing conditions, and place their own company on the mandate calendar.\n\n## Audience\n\nNewcomers to commerce architecture. Benefits most: an integration engineer or product manager who inherits a wholesale channel and is asked why a retail chain deducted money, and a finance or engineering lead who hears \"Peppol\" for the first time. Also useful to an architect choosing between an EDI provider's portal, an integrated provider, in-house EDI and an e-document gateway.\n\n## Success criteria\n\n- [ ] A reader new to the field can define every term the chapter uses from the chapter alone (EDI, EDIFACT, EANCOM, X12, ORDERS, DESADV/ASN, INVOIC, CONTRL, GTIN, GLN, SSCC, AS2, VAN, Peppol, access point, four-corner model, mapping, chargeback, punchout, cXML, OCI, e-invoice, EN 16931, UBL, Peppol BIS Billing, clearance, iPaaS, OMS, idempotent).\n- [ ] The \"one honest source per document\" rule is stated with a table (order record, order response, despatch advice, invoice) and tied to the ASN Chargeback.\n- [ ] The mandate calendar carries official dates from primary sources for Belgium, Germany, France, Italy, Poland, the Netherlands and ViDA, each marked as of November 2026, and says which rows touch Kestrel & Pine.\n- [ ] Bergzicht's spring reorder is worked with ledger numbers (6 April 2027, 240 units, 18 SKUs, €19,860, three pallets, delivery and INVOIC 9 April, due 9 May) and the W6 flow; the ASN Chargeback (€14,200, Q3 2026) is the scene.\n- [ ] A requirements table (fresh, consistent, fast, available) and a trade-off table across the four choices are present; at least two mermaid diagrams (the document cycle as a sequence diagram, the Peppol four-corner model).\n- [ ] The \"Across Scale Stages\" section with the four-stage table is present and specific per stage.\n- [ ] The three take-away tiers are present and honest; Questions to Ask has 6–10 items; Sources are grouped with years.\n- [ ] Article length between 4,000 and 6,500 words including tables.\n\n## Non-goals\n\n- B2B features (company accounts, contract pricing, quotes, approvals, punchout as a storefront feature): [Selling to Businesses: Accounts, Contract Prices, Quotes and Approvals](b2b-commerce.html).\n- The invoice as a legal document, VAT rules, credit notes and order-to-ledger posting: [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html).\n- What the ERP owns and the hub debate: [The Back Office: ERP Integration and Who Is the Hub](erp-and-back-office-integration.html).\n- Idempotency, outbox, reconciliation jobs: [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html).\n- The regulatory calendar as a management practice and non-invoicing regulation: [Rules Turned Into Requirements: Consumer, Payment, Invoicing and Platform Regulation](commerce-regulation.html).\n- The step-by-step wholesale order with the full failure path: [Journey 3: A Chain Reorders by EDI, From Order to Invoice](journey-wholesale-order.html).\n- Warehouse pick and pack mechanics and SSCC label printing in the WMS: [Pick, Pack, Ship: Warehouse Management and Fulfillment](warehouse-and-fulfillment.html).\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\nArticle only for now.\n\n## Open questions\n\n- Whether Kestrel & Pine's Antwerp store makes it \"established\" in Belgium for the mandate is deliberately left to a tax adviser; the chapter states the ledger fact (Peppol invoices to Belgian business customers since January 2026) as a choice.\n- Belgium's announced e-reporting phase (2028) and Poland's threshold reference year were not settled from primary pages and are omitted.\n- The German issuing obligation from 1 January 2027 is stated as scheduled; if the transition periods are extended in 2027, the calendar needs an update.\n- No official Walmart on-time-in-full policy page exists; the figures are trade press (2017) and a provider guide (2024).\n\n## Decision log\n\n- **2026-11-07** — Chose the ASN Chargeback as the scene and the \"one honest source per document\" rule as the spine, over a tour of EDI message segments, because the reader needs the ownership principle more than the syntax.\n- **2026-11-07** — Put the mandate calendar in a single table with official dates and a \"touches Kestrel & Pine\" column, rather than a country-by-country narrative, so the Long Fuse pattern has a concrete artifact.\n- **2026-11-07** — Kept punchout to one section (it belongs mostly to chapter 21) and framed it only as \"another channel into the order record\".\n- **2026-11-07** — Rejected a separate \"EDI providers compared\" section; the provider market is covered by SPS Commerce's 10-K and Jumbo's two onboarding routes, which is enough for a newcomer.\n\n## Sources\n\n- **Internal**\n  - [Meet Kestrel & Pine](meet-kestrel-and-pine.html) — the ASN Chargeback, Bergzicht, the EDI provider, Waypoint W6.\n  - [Journey 3: A Chain Reorders by EDI, From Order to Invoice](journey-wholesale-order.html) — the full Bergzicht reorder path this chapter summarizes.\n  - [The Order Record: Lifecycle, State and the Order Management System](order-management.html) — the OMS as the order hub that EDI orders enter from Q4 2027.\n  - [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html) — the invoice as a legal document.\n  - [Rules Turned Into Requirements: Consumer, Payment, Invoicing and Platform Regulation](commerce-regulation.html) — the regulatory calendar.\n- **External**\n  - GS1 General Specifications Release 26.0 (2026); GS1 EANCOM manual (2021); GS1 EDI implementation survey (2021); X12 transaction sets; RFC 4130.\n  - Jumbo purchasing conditions (2026-04-09), mechanized-DC guidelines (2025-10) and EDI supplier page; bol SSCC supplier page.\n  - SPS Commerce Form 10-K for 2025; Talk Business (2017) and SPS Commerce (2024) on Walmart OTIF.\n  - cXML User's Guide 1.2.037 (2018); TradeCentric on OCI (2026).\n  - OpenPeppol About and BIS Billing 3.0 (3.0.21, 2026); European Commission \"What is eInvoicing\", \"eInvoicing in Italy\" and ViDA pages; einvoice.belgium.be (2024, 2025, FAQ); Bundesministerium der Finanzen FAQ; impots.gouv.fr; gov.pl KSeF; Rijksoverheid (2026-09-11); business.gov.nl.\n  - Research brief `_research/brief-b2b-edi-erp.md` (Parts 1.5, 2, 3).\n\n## Changelog\n\n- **2026-11-07** — Initial spec and article. *(AI-mediated session)*\n- **2026-11-07** — Editorial review pass: Belgian scope hedged per item 5, Bergzicht contract price no longer fixed at list, Belgian variant date left neutral pending item 12, acronyms expanded, timetoread corrected. *(AI-mediated session)*\n- **2026-11-07** — Final consistency pass: named the Belgian Peppol example Ardennes Trail Co., Namur (40 Ridgewalker jackets, €3,800, ordered 21 April 2027, Peppol invoice 23 April, due 23 May; items 12 and 19), keeping the hedge on the Belgian mandate (items 5, 17). *(AI-mediated session)*\n- **2026-11-07** — Visual layer: redrew 2 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator). *(AI-mediated session)*\n"}]}]}</script>

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {

                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');

                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');

                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
