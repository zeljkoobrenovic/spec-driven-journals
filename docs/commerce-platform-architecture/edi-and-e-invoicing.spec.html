<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/22-edi-and-e-invoicing/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (a thesis paragraph p05, a roadmap p06, and a conclusion paragraph p52 that answers the opening); p04 is rewritten to pick up the B2B chapter as this chapter's transition_in asks.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The EDI vocabulary: standards (UN/EDIFACT with GS1 EANCOM, ANSI X12), messages (ORDERS, ORDRSP, DESADV or ASN, INVOIC, CONTRL), identifiers (GTIN, GLN, SSCC), transports (AS2, SFTP, VAN, Peppol), per-partner guidelines and mappings, and the two families of chargebacks (delivery performance, data and label compliance).\n- **Know:** That a syntax acknowledgment says only that a file could be parsed, and that a punchout cart is not an order.\n- **Know:** The layers of an e-invoice (EN 16931, UBL, Peppol BIS Billing 3.0), the difference between an EDI INVOIC and a Peppol invoice, and the mandate calendar as of November 2026 (Belgium since 1 January 2026, Germany issuing from 2027 or 2028, the Netherlands planned for 2030, ViDA's cross-border reporting from 1 July 2030), with the domestic scope of the Belgian and German mandates.\n- **Believe:** Each document has one honest source: the order record from the buyer's message, the despatch advice from the warehouse's pack confirmation, the invoice from the ERP's confirmed shipment; a compliance chargeback is a document generated in the wrong place.\n- **Believe:** An EDI order is a channel into the order record, not a separate order system.\n- **Believe:** E-invoicing is a legal calendar that makes delivery status part of the invoice, and the company must hold the knowledge of each mapping even when its provider holds the mapping.\n- **Be able to:** Explain a compliance chargeback by the system that generated the document, and say which system should generate each document.\n- **Be able to:** Place their own company on the mandate calendar, and write a partner card (GLNs, transport, message and guideline versions, mapping version, internal owner, compliance rules, open disputes).\n- **Be able to:** Choose among a provider's portal, an integrated provider, in-house EDI and an e-document gateway by partners and countries.\n\n**Audience:** Newcomers to commerce architecture; most of all an integration engineer or product manager who inherits a wholesale channel and is asked why a retail chain deducted money, and a finance or engineering lead who hears 'Peppol' for the first time. Also an architect choosing between a provider's portal, an integrated provider, in-house EDI and an e-document gateway.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- From earlier chapters: Kestrel & Pine, its people and incidents in outline; the order record, systems of record, single writer, idempotency and reconciliation; the WMS, ERP, iPaaS, EDI (named), OMS, SKU and GTIN; Waypoint decisions W1–W8 in outline.\n- From Part III: one invoice per shipment issued by the ERP, credit notes as the only correction, and the Belgian Peppol invoice to Ardennes Trail Co. in outline.\n- From the B2B chapter: company accounts, contract prices, terms and credit owned by the ERP, the portal, and the buyer's own system (EDI or punchout) named as a fourth channel option.\n\n**Does not yet know:**\n\n- EDIFACT, EANCOM, X12, ORDERS, ORDRSP, DESADV/ASN, INVOIC, CONTRL/997, GLN, SSCC, AS2, SFTP, VAN, Peppol and its access points, the four-corner model, mapping and message implementation guidelines, supplier chargebacks.\n- cXML and OCI punchout.\n- EN 16931, UBL, Peppol BIS Billing 3.0, clearance, ViDA and the national mandate dates.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a deduction for despatch advices that did not match the pallets, the reader names the system that wrote them, why they differed and what should generate each document, not better pickers. *Probe:* A retail chain deducts money from a supplier's payment because pallet labels did not match the despatch advices it received. The supplier's ERP sends each despatch advice when the order is released to the warehouse; the warehouse system prints pallet labels at packing, and pickers sometimes merge or split pallets. Using only this chapter: why did the labels and the messages differ, and what should generate each? | `custom` | cold_reader | major |\n| AC-2 | Given a Dutch brand with business customers in three countries, the reader states which e-invoicing rules reach it and from when, hedging where the sources do, and what its invoicing system must keep. *Probe:* A Dutch brand invoices business customers in the Netherlands, Belgium and Germany. Using only this chapter: which e-invoicing rules apply to it or to its customers, from when, and what must its invoicing system keep for each invoice? | `custom` | cold_reader | major |\n| AC-3 | The reader can say what a repeated ORDERS file and a CONTRL acknowledgment each mean. *Probe:* Using only this chapter: the EDI provider re-sends an ORDERS file after a timeout that was in fact a success, and the supplier receives a CONTRL acknowledgment for an invoice it sent. What does each mean, and how should the supplier treat them? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How do large trading partners exchange orders, shipping notices and invoices without a web shop, and what do e-invoicing mandates require?\n\n> **Claim:** Trading partners exchange orders, despatch advices and invoices as standard EDI messages, mapped per partner and relayed by a provider or a direct link; each document has one internal source: the order enters the order record like a web order, the despatch advice comes from the warehouse's pack confirmation, the invoice from the ERP's confirmed shipment. E-invoicing mandates require structured invoices from dated, country-specific deadlines, so the ERP that issues them holds each invoice's transmission status.\n\n**Disputed by:** The view that EDI is a back-office file exchange the EDI provider or a consultant looks after: the ERP may generate every outgoing document from the order, EDI orders may stay in the ERP or the provider's portal apart from web orders, and e-invoicing is a question of PDF formats to answer when a customer asks.\n\n**So what:** In Q3 2026 Kestrel & Pine's ERP wrote Bergzicht's despatch advices when wholesale orders were released, before packing, with ERP pallet numbers, while the WMS labeled the pallets it actually built; Bergzicht deducted €14,200 for nine deliveries, and only an external consultant knew the mappings. Under W6 the WMS generates the SSCC labels and the despatch advice at pack confirmation and a partner card per trading partner holds the mapping knowledge, so Bergzicht's 240-unit reorder of 6 April 2027 ships on three pallets whose labels and message describe the same pallets. A merchant that accepts the claim routes each document from its one source and keeps a dated mandate calendar with an owner per country before the first chain or foreign business customer asks.\n\n**How and why:** A chain's receiving scans each pallet's SSCC label against the despatch advice, so a message written from the order before packing is wrong whenever pickers merge or split pallets; only the system that builds and labels the pallet knows what is on it. The invoice is a payment claim for what was delivered at agreed prices with VAT, so it comes from the system that holds the confirmed shipment, the prices and the legal numbering. An EDI order is a purchase commitment like a web order, so if it lives apart, allocation, invoicing and reporting see two shapes. Each partner's guideline changes on its own schedule and is enforced by chargebacks, so the knowledge of each mapping must sit inside the company. Under a mandate an invoice exists for the receiver only once the network delivers it, and in clearance countries only once the state accepts it, so delivery and rejection become states the issuing system must hold.\n\n**Supporting claims**\n\n- **S1** — Trading partners exchange a small set of standard documents (order, order response, despatch advice, invoice, acknowledgment) built on shared identifiers, carried point-to-point or over a network, and mapped to each partner's own guideline, which the buyer chooses and enforces with chargebacks.\n- **S2** — Each document has one internal source: the order record from the buyer's validated message, the despatch advice and its pallet labels from the warehouse's pack confirmation, the invoice from the ERP's confirmed shipment and price; a compliance chargeback is a document generated in the wrong place.\n- **S3** — An EDI order, like the order that follows a punchout, is a channel into the one order record, keyed on the buyer's order number and GLN and flagged by channel, never a separate order system.\n- **S4** — E-invoicing mandates require structured invoices from dated, country-specific deadlines, domestic in scope until ViDA, so the invoice becomes a transmitted document whose status, rejections and archive the issuing ERP holds.\n- **S5** — Whatever the route to its partners (portal, integrated provider, in-house EDI, e-document gateway), the company holds the knowledge of each mapping in a partner card with an internal owner, because guidelines change on the partner's schedule.\n\n## Role in the part\n\nGives the part its documents: one internal source per document (the order record, the warehouse's pack confirmation, the ERP's confirmed shipment), the partner card that keeps mapping knowledge inside the company, and the mandate calendar that turns the invoice into a transmitted document with a delivery status. Supports P5-1, P5-2, P5-3, P5-4 of part `part-5`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to order-record: Bergzicht's deduction and Noor's question, then the vocabulary needed to state the answer, then the answer; `comparison` in choices and stages)\n\nBergzicht's deduction comes first so every term arrives as part of the answer to Noor's question. EDI's vocabulary (what-edi), the documents, the identifiers inside them, the transports and the per-partner guideline follow in that order because each uses the one before: the ASN cannot be explained without the documents, the SSCC rule without the ASN, Peppol's network without transports, chargebacks without guidelines. The rule of one source per document (order-record) comes once all its terms are known, and punchout follows as a second way a buyer's system reaches the same record. The e-invoice follows because it is the third document under a new regime, and the calendar after it because dates mean nothing before the reader knows what is required. The choices and stages come after the requirements they meet, the worked orders after the choices so the reader sees W6's conditions applied, and the failures last, each read against the rule that prevents it. Moving order-record before the vocabulary would state a rule about documents the reader cannot yet name; moving the calendar before the e-invoice section would date an obligation not yet explained.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A retail chain sends a purchase order from its own purchasing system and expects a shipment notice describing each pallet and an invoice its accounting software can read; a mismatched pallet label or an unreadable invoice can hold up receiving or payment and trigger a supplier penalty, even when the goods were right.\n\n**Bridge:** Anyone who has sold through a web shop knows the order as something the shop itself creates at checkout. → When the buyer is a large company, the order, the shipment notice and the invoice are documents that travel between two companies' systems, and since 2026 the law sets the form of the invoice, so the question becomes which documents, from which system, by which date.\n\n**Thesis statement** (KEY POINTS callout and paragraph p05): Trading partners exchange orders, despatch advices and invoices as standard EDI messages, mapped per partner and relayed by a provider or a direct link; each document has one internal source (the order enters the order record like a web order, the despatch advice comes from the warehouse's pack confirmation, the invoice from the ERP's confirmed shipment), and e-invoicing mandates require structured invoices from dated, country-specific deadlines, so the ERP that issues them holds each invoice's transmission status.\n\n**Roadmap** (Paragraph p06):\n\n- Start from the deduction Bergzicht Outdoor made from Kestrel & Pine's payment and the question it raised. *Kept in:* scene.\n- Explain what EDI is and why it persists, its documents, identifiers and transports, and how partners enforce their guidelines. *Kept in:* what-edi, documents, identifiers, transport, mapping.\n- State the system each document must come from, and treat punchout as another way into the same order record. *Kept in:* order-record, punchout.\n- Explain the e-invoice and the mandate calendar. *Kept in:* e-invoicing, mandates.\n- Compare the ways to connect and how they change with scale. *Kept in:* choices, stages.\n- Work Bergzicht's spring reorder and a Belgian invoice through, then list what goes wrong. *Kept in:* practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A retail chain's purchase order comes with requirements for a per-pallet shipment notice and a machine-readable invoice, and a mismatched label or unreadable invoice can hold up receiving or payment and trigger a penalty, so the buyer's document requirements shape the merchant's systems. | scenario: A chain's purchase order, a shipment notice per pallet, an invoice its accounting software reads, a supplier penalty. |  |\n| p02 | definition | Electronic data interchange (EDI) exchanges these structured business documents between companies without retyping, and selling to a chain may require it even when the merchant has a capable web shop. |  | `elaboration`: The documents the chain requires. → The name for exchanging them: EDI. |\n| p03 | context | A second kind of document has joined EDI: since 1 January 2026 a Belgian business invoicing another Belgian business must send a structured e-invoice over Peppol, other countries have their own dates, and the invoice becomes a transmitted legal document whose issuing system must know whether it arrived. | fact: Belgian mandate since 1 January 2026 over Peppol; Germany, France, Italy, Poland with their own dates; the Netherlands announced 2030. | `additional_support`: EDI as the documents a chain requires. → The e-invoice, required by law, and its delivery receipt. |\n| p04 | context | The previous chapter followed the portal, the wholesale channel's self-service path, and named the buyer's own system as a fourth way in; this chapter takes that route with Bergzicht Outdoor, whose orders arrive electronically, from a 2026 incident to its spring reorder of April 2027, and like a web order an EDI order uses Duiven's warehouse management system and reaches the same books. | scenario: Bergzicht's reorder of 6 April 2027 by EDI; Duiven's WMS; link to journey-wholesale-order. | `sequence`: The documents between companies and the e-invoice. → Where the chapter stands in the book: the buyer's own system as the channel the B2B chapter only named, and Bergzicht's reorder sharing the warehouse and the accounts with web orders. |\n| p05 | claim | The chapter's answer is that each document between companies has one internal source: the order enters the one order record like a web order, the despatch advice comes from the warehouse's pack confirmation and the invoice from the ERP's confirmed shipment; partners enforce their guidelines with chargebacks, and e-invoicing mandates with dates make the invoice a transmitted document whose status the ERP holds. |  | `cause_effect`: Bergzicht's reorder sharing one warehouse and one set of accounts with web orders. → The claim about which system must produce each document. |\n| p06 | transition | The chapter starts from Bergzicht's deduction, explains what EDI is and why it persists, its documents, identifiers, transports and per-partner guidelines, states which system each document must come from and where punchout fits, treats the e-invoice and the mandate calendar, compares the ways to connect and the scale stages, and works the spring reorder and a Belgian invoice before listing what goes wrong; its evidence is Kestrel & Pine's chargeback, the GS1 and X12 standards, retailers' published supplier conditions and official mandate pages. |  | `sequence`: The chapter's claim. → The order in which the chapter argues it and the kind of evidence it uses. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: A Deduction Instead of a Payment\n\n**Controlling idea** (`example`, id `scene`): Bergzicht Outdoor deducted €14,200 from a payment because Kestrel & Pine's ERP wrote the despatch advices before packing while the WMS labeled the pallets it actually built, and W6 answers Noor Visser's question of which system knows the truth each document carries.\n\n**Advances the thesis** (S1, S2, S5): Gives the case the chapter answers: a compliance chargeback caused by a document generated in the wrong system and mappings known only to an outside consultant.\n\n**Transition in:** `example`: The chapter's claim and roadmap, which start from Bergzicht's deduction. → The deduction itself.\n\n**Order of paragraphs** (`chronological`): The partner and its documents first, then the short payment, its name, its cause and the decision that fixed it, in the order Kestrel & Pine met them; the cause only makes sense once the reader knows what the deduction was for.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | description | Bergzicht Outdoor, a Dutch chain worth €2.1 million a year to Kestrel & Pine, has ordered since 2025 through an EDI provider (a value-added network) using three main messages: ORDERS, DESADV and INVOIC. | scenario: Bergzicht: 38 shops, Zwolle DC, €2.1M a year, EDI since 2025; the EDI provider; ORDERS, DESADV, INVOIC. |  |\n| p08 | example | In October 2026 Head of Wholesale Lea Moreau received a payment €14,200 short, because Bergzicht charged for nine third-quarter deliveries whose pallet labels did not match the despatch advice. | case: €14,200 deducted from an October 2026 payment for nine Q3 2026 deliveries; compliance fee plus manual counting. | `cause_effect`: Bergzicht's EDI relationship. → What went wrong with it: a short payment. |\n| p09 | definition | This is the ASN Chargeback: ASN, the advance shipping notice, is another name for the despatch advice, and the deduction is a supplier-compliance penalty, not a card-payment dispute. |  | `elaboration`: The short payment. → Its name in the book and what kind of deduction it is. |\n| p10 | cause_effect | Lea and the lead integration engineer, Ruben Alves, needed two weeks to reconstruct the cause because only an external consultant knew the mappings: the ERP wrote the despatch advice at release, before packing, with ERP pallet numbers, while the WMS printed its own labels at pack time, so merged or split pallets made labels and messages disagree. | case: Before W6: DESADV from the ERP at release with pallet numbers from an ERP range; WMS labels at pack time; merged or split pallets.; figure: Figure 1: the ERP's despatch advice before packing against the WMS's from the pack confirmation. | `cause_effect`: The ASN Chargeback. → Its mechanism and why it was hard to find. |\n| p11 | claim | Noor Visser's question, which system knows the truth each document claims to carry, is the chapter's question, and W6 answered it here: pallet labels from the WMS at pack time, the despatch advice from the WMS pack confirmation, and one EDI partner card per trading partner, a record the company keeps of the partner's identifiers, message versions, mapping and internal owner. | case: W6: SSCC labels generated by the WMS at pack time; DESADV sent from the WMS confirmation; one EDI partner card per trading partner. | `problem_solution`: The mechanism: a document written by a system that did not know the pallets. → The question it raises and Waypoint's answer, W6. |\n\n### What EDI Is and Why It Has Not Gone Away\n\n**Controlling idea** (`definition`, id `what-edi`): EDI is agreed message formats plus a way of delivering them, with two dominant standards, and it persists because buyers choose it, its documents carry meaning, networks make change costly and regulators accommodate it.\n\n**Advances the thesis** (S1): Gives the vocabulary (message, standard, transport, mapping) and the reasons the buyer, not the merchant, decides the format.\n\n**Transition in:** `elaboration`: Bergzicht's three EDI messages and W6. → What EDI is in general and why it persists.\n\n**Order of paragraphs** (`small_to_large`): The four words first, then the standards, the evidence of what is used, and only then why it persists, which needs all of them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | definition | In plain words, EDI is a set of agreed message formats plus a way of delivering them: a message is a document such as an order, a standard says which fields it has, a transport is how the file travels and a mapping translates between the standard's fields and your own system's. |  |  |\n| p13 | description | Two standards dominate: UN/EDIFACT, with the GS1 EANCOM subset that European retail uses, and ANSI X12 in North America; a brand selling to a Dutch and a US chain needs both, and the message pairs are functional equivalents, not field-for-field translations. | source: UN/EDIFACT, ISO 9735 (1987); GS1 EANCOM manual (2002 edition, updated 2021); ANSI X12. | `elaboration`: What a standard is. → The two standards that dominate. |\n| p14 | evidence | GS1's 2021 survey, the most recent public one, found ORDERS, INVOIC and DESADV the most implemented EANCOM messages and AS2 the most used transport, and the standards have barely changed since. | statistic: GS1 EDI implementation survey 2021: ORDERS, INVOIC, DESADV most implemented; AS2 most used. | `additional_support`: The two standards. → Which of their messages and transports are used most. |\n| p15 | cause_effect | A 1980s format still carries wholesale orders first because the buyer chooses: Jumbo's 2026 purchasing conditions oblige suppliers to send order, despatch advice and invoice by EDI, charge €70 per message otherwise and allow deliveries without DESADV and SSCC to be refused. | quotation: Jumbo purchasing conditions of 9 April 2026: 'undertake to conduct all communication concerning the flow of goods ... via EDI'; €70 per message; refusal without DESADV and SSCC. | `cause_effect`: EDI's stability. → The first of four reasons it persists: the buyer chooses. |\n| p16 | cause_effect | Three further reasons keep EDI in place: its documents carry stable meaning, a chain that has mapped hundreds of suppliers would pay more to change than to keep it, and regulators accommodate it, as Germany does by tolerating EDI procedures that do not yet meet its e-invoice rules (explained later in the chapter) to the end of 2027. | fact: Germany tolerates EDI procedures that do not yet meet the e-invoice requirements until the end of 2027. | `additional_support`: The first reason, the buyer's choice. → The other three reasons. |\n\n### The Documents: Order, Despatch Advice, Invoice\n\n**Controlling idea** (`description`, id `documents`): Five documents make up the exchange, each with a sender and an internal system of truth; the ASN is the receiving plan keyed by the pallet label, and a syntax acknowledgment says only that a file could be parsed.\n\n**Advances the thesis** (S1, S2): Names the documents and the system of truth for each, and the two misreadings (the ASN as paperwork, the acknowledgment as acceptance) that cost money.\n\n**Transition in:** `elaboration`: EDI's most implemented messages. → Each document, its sender and its internal system of truth.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17a | description | Five documents make up the exchange, three that carry the business (order, despatch advice, invoice) and two that answer them (order response, syntax acknowledgment), each with an EDIFACT and an X12 name, a sender and an internal system of truth. | table: The five documents: ORDERS/850, ORDRSP/855, DESADV/856, INVOIC/810, CONTRL/997, with sender, content and internal system of truth. |  |\n| p17 | explanation | The ASN is a message sent at despatch that tells the receiver what is coming pallet by pallet, so receipt can be scanned instead of counted, and Jumbo refuses a delivery without it: the ASN is the receiving plan and the pallet label the key into it. | quotation: Jumbo mechanized-DC guidelines (2025-10): every delivery 'must be preceded by a DESADV message'; 'a delivery without an accompanying DESADV message cannot be processed and is therefore refused'; 'the SSCC label forms the link with the DESADV'. | `elaboration`: The five documents. → The one that decides whether a delivery is received: the ASN. |\n| p18 | explanation | A CONTRL or 997 says only that a file could be parsed, not that the order was accepted, the delivery received or the invoice will be paid, and treating it as acceptance is a common and expensive mistake. |  | `contrast`: The ASN, a document receivers act on. → The acknowledgment, a document readers over-read. |\n\n### Identifiers: What, Where and This Pallet\n\n**Controlling idea** (`definition`, id `identifiers`): EDI works because both sides use GS1's numbers for products (GTIN), parties and places (GLN) and pallets (SSCC), and the ASN ties them together, so the SSCC must come from the system that builds the pallet.\n\n**Advances the thesis** (S1, S2): Gives the identifiers the ASN is built from and derives the rule that the pallet's number comes from the system that packs it.\n\n**Transition in:** `elaboration`: The ASN as a receiving plan keyed by the pallet label. → The numbers in that label and in the documents.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | definition (list) | GS1's General Specifications define a GTIN for what is sold, a GLN for who and where, and an SSCC for this pallet, and retailers such as Jumbo and bol require them in the messages. | quotation: GS1 General Specifications Release 26.0: the SSCC 'is the only GS1 key that SHALL be used as the identifier of a logistic unit'; bol SSCC labels mandatory since 31 December 2021; Jumbo's GLN rule. |  |\n| p20 | claim | The ASN ties the three together, listing for each SSCC the GTINs and quantities it holds from one GLN to another, hence the rule Kestrel & Pine paid for: the SSCC must be generated by the system that physically builds the pallet. | reasoning: An ERP that invents pallet numbers before packing is wrong whenever the warehouse deviates from the plan. | `cause_effect`: The three identifiers. → How the ASN combines them and the rule that follows. |\n\n### Transport: Point-to-Point or Network\n\n**Controlling idea** (`comparison`, id `transport`): Documents travel point-to-point (AS2, SFTP), where every partner is a relationship to manage, or over a network (a VAN, Peppol), where one connection reaches many; Peppol alone has a public directory and mandates the document format.\n\n**Advances the thesis** (S1, S4): Explains how documents travel and introduces Peppol's four-corner model that the e-invoice uses.\n\n**Transition in:** `sequence`: The documents and the numbers in them. → How the documents travel.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | comparison | AS2 and SFTP are point-to-point, while a VAN and Peppol are networks you connect to once; Peppol alone has a public directory and mandates the document format, and in its four-corner model the sender's access point delivers to the receiver's without a bilateral agreement. | table: AS2 (RFC 4130), SFTP, VAN, Peppol: what each is, what you connect to, typical use. |  |\n\n### Mapping, Onboarding and the Chargeback Economy\n\n**Controlling idea** (`explanation`, id `mapping`): The standards are public but every chain publishes its own guideline, so mapping is done and maintained per partner, which is the EDI providers' business, and chargebacks enforce the guideline; data and label chargebacks are an architecture problem.\n\n**Advances the thesis** (S1, S5): Shows that the cost and the risk of EDI are per partner, and that one family of chargebacks comes from which system produces a document.\n\n**Transition in:** `contrast`: The public standards and networks. → The per-partner guideline and its enforcement.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | explanation | Every chain publishes its own message implementation guideline, so mapping is done and maintained per partner, which is the business EDI providers sell, and a retailer like Jumbo offers a cheap portal to small suppliers and an integrated route that needs IT effort. | statistic: SPS Commerce 10-K for 2025: 'connect once and immediately transact with thousands of trading partners'; $751.5 million revenue, 96% recurring.; quotation: Jumbo: WebEDI 'the simplest, and cheapest in the short term'; integration 'requires translating EDI messages to and from your internal system'. |  |\n| p23 | analysis | Chargebacks enforce the guideline in two families, delivery performance and data and label compliance; the first is a logistics problem and the second an architecture problem, because the ASN is only as right as the system that generated it. | fact: Walmart's on-time-in-full 3% fee at launch in 2017 (thresholds since raised; no official page); Jumbo €250 per order under 90% of a line; Jumbo €70 per message. | `cause_effect`: Each partner's guideline. → How the buyer enforces it: chargebacks. |\n\n### How EDI Documents Reach the Order Record and the Ledger\n\n**Controlling idea** (`claim`, id `order-record`): An EDI order is a channel into the one order record, not a separate order system, and each document then has its own internal source and its own requirements for freshness, consistency, speed and availability.\n\n**Advances the thesis** (S2, S3): States the chapter's rule: one order record for every channel and one honest source per document.\n\n**Transition in:** `problem_solution`: Data and label chargebacks as an architecture problem. → The architecture that prevents them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | claim | Data and label chargebacks are prevented where documents are produced, and every document starts from the order record: an EDI order is a channel into it, not a separate order system, so an ORDERS message creates the same order object as a web order, flagged by channel; Kestrel & Pine in January 2027 kept EDI, web and marketplace orders in three places, and the ERP stays the interim home of EDI orders until the OMS takes them in Q4 2027. | case: January 2027: EDI orders in the ERP, web orders in the shop platform, marketplace orders in the connector; the OMS takes EDI orders from the ERP in Q4 2027. |  |\n| p25 | claim | Building on the Documents table's systems of truth, each document has one internal source and never another: the order record from the validated ORDERS, the order response from the record after allocation, the despatch advice from the WMS pack confirmation, the invoice from the ERP's confirmed shipment and contract price. | table: Document / produced from / never from / why, for the order record, order response, despatch advice and invoice. | `elaboration`: The order record as the one home for EDI orders, and the Documents table's systems of truth. → What each document must never be produced from, and why. |\n| p26 | analysis | The flows differ in how fresh, consistent, fast and available they must be, so one integration flow on one schedule cannot serve them: ORDERS in must be exactly once, DESADV out must match the labels and leave before the truck arrives, invoices must be immutable once numbered and rejections tracked, and transmission status kept as evidence. | table: How fresh, consistent, fast and available each flow must be (ORDERS in, DESADV out, invoice out, status back). | `elaboration`: Each document's source. → What each flow requires. |\n\n### Punchout: When the Buyer's System Owns the Order\n\n**Controlling idea** (`explanation`, id `punchout`): In punchout the buyer shops in the supplier's web shop from inside its procurement system, which owns the requisition and the purchase order, so a punchout cart is never an order and the real order enters the same order record later.\n\n**Advances the thesis** (S3): Extends the one-order-record rule to buyers who send no ORDERS but shop through their own system.\n\n**Transition in:** `similarity`: The EDI order as a channel into the order record. → A second way a buyer's own system reaches it: punchout.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | description | Some corporate buyers send no ORDERS but shop in the supplier's web shop from inside their procurement system, as the cXML User's Guide and SAP's OCI describe. | quotation: cXML User's Guide 1.2.037: procurement applications 'display a button instead of product or pricing details' ... a button 'returns the order information to the procurement application'; OCI posts cart lines to a hook URL. |  |\n| p28 | claim | Punchout inverts the usual flow: the buyer's system owns the requisition and the purchase order, the shop is only a catalog session, and the real order arrives later as a cXML order request or an EDI ORDERS, so the shop must never treat a punchout cart as an order. |  | `cause_effect`: What punchout is. → What it means for the order record. |\n\n### E-Invoicing: The Invoice Becomes a Transmitted Legal Document\n\n**Controlling idea** (`explanation`, id `e-invoicing`): An e-invoice is a structured document in three layers (EN 16931, UBL, Peppol BIS Billing 3.0) that differs from an EDI INVOIC in almost everything but its claim, and it makes the issuing system hold transmission status, rejections and archive.\n\n**Advances the thesis** (S4): Explains what the mandates require and why the invoice becomes a document with a delivery state held by the ERP.\n\n**Transition in:** `contrast`: The documents of supply-chain EDI, whose format the buyer sets. → The invoice, whose format the law now sets.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | definition (list) | The European Commission defines an e-invoice as structured data for automatic processing, not a PDF, and it has three layers to keep apart: the EN 16931 semantic model, the UBL syntax and the Peppol BIS Billing 3.0 profile, whose own releases have dates. | quotation: European Commission: an electronic invoice is one 'issued, transmitted and received in a structured data format which allows for its automatic and electronic processing'; Peppol BIS 3.0.21 published 20 May 2026, mandatory 17 August 2026.; figure: Figure 2: Peppol's four-corner model, with the transmission status flowing back to the issuing system. |  |\n| p30 | comparison | An EDI INVOIC and a Peppol invoice carry the same claim and differ in who defines the content, purpose, addressing, transport, validation and legal weight. | table: EDI INVOIC against Peppol/EN 16931 invoice on six rows. | `contrast`: The e-invoice's layers. → How it differs from the EDI INVOIC the chapter already met. |\n| p31 | cause_effect | Three things change for the architecture: the system that issues invoices, usually the ERP, holds transmission status, rejections and archive; in clearance countries the state platform sits in the invoice path; and commerce platforms do not issue the tax invoice, their PDF being a courtesy copy. | figure: Figure 3: a PDF e-mailed into an inbox against a structured invoice sent through a network with its delivered status returned and stored. | `cause_effect`: What an e-invoice is. → What it changes in the systems. |\n\n### The Mandate Calendar\n\n**Controlling idea** (`description`, id `mandates`): The mandates have official dates per country as of November 2026, they are domestic in scope, and ViDA brings the cross-border case in 2030, so building the capability once is cheaper than per deadline.\n\n**Advances the thesis** (S4): Gives the dated obligations and their scope so the reader can place a company on the calendar.\n\n**Transition in:** `example`: What an e-invoice is and what it changes. → When and where it is required, starting with Belgium's mandate as announced.\n\n**Order of paragraphs** (`small_to_large`): Belgium's mandate in the government's words first, because it is the one Kestrel & Pine meets; then the whole calendar with Belgium as one row, then how to read its scope, which needs both.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | example | Belgium's mandate shows what the e-invoice means in practice: the government announced in September 2024 that from 1 January 2026 PDF invoices by e-mail would no longer be enough, and in December 2025 confirmed a three-month tolerance on penalties and refused a general postponement. | quotation: einvoice.belgium.be, 18 September 2024: 'all Belgian enterprises liable to VAT will have to use structured electronic invoices'; 'sending a PDF invoice by e-mail or via a platform will no longer be enough'; 'via a decentralised network called Peppol'; 18 December 2025 tolerance. |  |\n| p32 | description | The mandate dates as of November 2026, from tax administrations and the Commission, are the chapter's most volatile facts: Belgium since 1 January 2026, Germany receiving since 2025 and issuing from 2027 or 2028, France from September 2026, Italy since 2019, Poland from 2026, the Netherlands planned for 2030 and ViDA from 1 July 2030. | table: Seven rows (Belgium, Germany, France, Italy, Poland, Netherlands, ViDA): what is mandatory, since when, format and channel, whether it touches Kestrel & Pine. | `elaboration`: Belgium's mandate. → The full calendar of mandates, Belgium's among them. |\n| p33 | analysis | Two readings follow: the mandates are domestic, so whether a Dutch supplier is bound in Belgium is not settled and is a question for a tax adviser while Belgian customers expect Peppol anyway, and ViDA brings the cross-border case in 2030, so the capability is cheaper built once than per deadline, before the Long Fuse burns down. | fact: Belgium's FAQ: VAT-registered persons not established in Belgium and without a permanent establishment are not subject (law still being amended); Germany covers domestic transactions. | `elaboration`: The calendar. → How a newcomer should read it. |\n\n### The Choices\n\n**Controlling idea** (`comparison`, id `choices`): A merchant connects through a provider's portal, an integrated provider, in-house EDI or an e-document gateway, chosen by partners and countries, and whichever it picks the ASN must come from the WMS and the company must hold a partner card per partner.\n\n**Advances the thesis** (S5, S2): Lets the reader choose a route and states the two conditions that hold on every route.\n\n**Transition in:** `problem_solution`: The documents, their sources and the dated obligations. → The ways a merchant can meet them.\n\n**Order of paragraphs** (`small_to_large`): From the smallest commitment to the largest, so each route is read against the one before; the recommendation comes after the comparison table it rests on.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | description | A provider's web portal needs no integration and suits small suppliers, but it is retyping and does not scale past a few orders a day. |  |  |\n| p35 | description | A provider integrated with your systems maps the chain's guideline to your order record, WMS and ERP, often through an iPaaS; the provider owns the mappings, you own what each document means, and this is the common choice at Kestrel & Pine's size. |  | `contrast`: The portal's retyping. → Integration through the provider. |\n| p36 | description | In-house EDI gives full control at full cost and makes sense only when EDI is the business. |  | `contrast`: The provider owning the mappings. → The merchant owning everything. |\n| p37 | description | An e-document gateway produces and receives every structured document from the same internal records with per-partner and per-country rules as configuration, and the integrated provider grows into it as partners and countries multiply. | table: Portal, integrated provider, in-house, gateway on time to first partner, running cost, mapping ownership, chargeback exposure and when each is right. | `sequence`: Three routes for EDI alone. → One component for every structured document. |\n| p38 | recommendation | The author recommends the integrated provider at the Omnichannel stage on two non-optional conditions, the ASN from the WMS pack confirmation and a partner card per trading partner in the company's own repository, because the provider may hold the mapping but the company must hold the knowledge. |  | `conclusion_summary`: The four routes compared. → The author's choice and its conditions. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): Each scale stage has its typical EDI and e-invoicing setup, what becomes necessary and the signs of outgrowing it, and Kestrel & Pine runs a stage 2 setup at stage 3, which the deduction signalled.\n\n**Advances the thesis** (S5): Says which route fits which stage and places Kestrel & Pine.\n\n**Transition in:** `elaboration`: The four routes and the recommendation. → Which fits at which stage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | analysis | At the time of the deduction Kestrel & Pine sat at stage 3 with a stage 2 setup, one chain, one provider, mappings built by one consultant and the ASN from the wrong system, and the deduction was the warning sign. | table: Starting, Growing, Omnichannel, Group: what is typical, what becomes necessary, warning signs. |  |\n\n### In Practice\n\n**Controlling idea** (`example`, id `practice`): Bergzicht's spring reorder under W6 and a Belgian Peppol invoice show the rules at work: each document from its source and the invoice sent with its status kept.\n\n**Advances the thesis** (S2, S3, S4): Runs the chapter's rules through one EDI order and one Peppol invoice with ledger figures.\n\n**Transition in:** `example`: The stage table and Kestrel & Pine's place on it. → The rules applied to two orders after W6.\n\n**Order of paragraphs** (`chronological`): The EDI order from receipt to invoice, then the Belgian order from order to invoice and the reason for sending it over Peppol.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | example | On 6 April 2027 the EDI provider delivers Bergzicht's ORDERS for 240 units across 18 SKUs, €19,860 excluding VAT, and the ERP resolves the item codes, checks contract prices and creates the order, because the OMS is not live until Q4. | scenario: ORDERS 6 April 2027, 240 units, 18 SKUs, €19,860 excl. VAT; ERP creates the order; OMS from Q4 2027. |  |\n| p42 | process | The warehouse reserves the units, an ORDRSP confirms the lines, the WMS prints one SSCC label for each of three pallets at packing, and the DESADV comes from that same pack confirmation and reaches Zwolle before delivery on 9 April. | scenario: Three pallets with SSCC labels; DESADV from the pack confirmation; delivered to Zwolle 9 April. | `sequence`: The order created. → Allocation, packing and the despatch advice. |\n| p43 | example | The ERP issues the INVOIC on 9 April for the shipped quantities at contract prices, due 9 May, and this is W6 in practice: labels and shipment notice describe the same packed pallets, which in Q3 2026 they did not. | scenario: INVOIC 9 April, payment due 9 May; contrast with Q3 2026.; figure: Figure 4: Bergzicht's spring reorder as a document cycle, three documents from three systems of truth. | `sequence`: The despatch advice sent. → The invoice and what W6 changed. |\n| p44 | example | Ardennes Trail Co., a fictional shop in Namur and one of the 210 Belgian accounts, orders 40 Ridgewalker jackets at €95, €3,800 excluding VAT, through the B2B portal on Wednesday 21 April 2027. | scenario: Ardennes Trail Co., Namur; 40 jackets at €95 = €3,800; B2B portal; 21 April 2027. | `contrast`: An EDI order to a Dutch chain. → A portal order from a Belgian shop that needs a Peppol invoice. |\n| p45 | process | At dispatch on 23 April the ERP issues the invoice in its numbering sequence, an intra-EU supply at 0% VAT with the reverse-charge mention, due 23 May, as a UBL document under Peppol BIS Billing 3.0 sent through the EDI provider as access point, and stores the transmission status. | scenario: Invoice 23 April by bpost dispatch; 0% reverse charge; due 23 May; Peppol BIS 3.0 via the EDI provider's access point; status stored in the ERP. | `sequence`: The Belgian order. → Its invoice over Peppol. |\n| p46 | analysis | Kestrel & Pine has sent Peppol invoices to all Belgian business customers since January 2026 by choice, not because the mandate is known to bind a Dutch supplier, because larger customers' bookkeeping expects Peppol and one rule was cheaper than exceptions. | fact: Peppol to all Belgian business customers since January 2026, by choice. | `cause_effect`: The Peppol invoice to Ardennes Trail Co. → Why Kestrel & Pine sends one at all. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `wrong`): Five failures (a duplicate ORDERS, a changed guideline, the ASN from the wrong system, a rejected e-invoice, a provider outage or a departing consultant) each have a detection and a recovery that follow from the chapter's rules.\n\n**Advances the thesis** (S2, S3, S4, S5): Reads each failure against the rule that prevents it.\n\n**Transition in:** `contrast`: The rules working in the two orders. → What happens when they are broken.\n\n**Order of paragraphs** (`chronological`): The failures in the order of the document cycle: order in, partner rules, despatch advice, invoice, then the intermediary and the people around all of them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | analysis | A duplicate ORDERS after a timeout that was a success creates two orders unless handling is idempotent: the buyer's order number plus GLN is the natural key, so a second ORDERS with it is a duplicate or a change, never a new order. |  |  |\n| p48 | analysis | A changed guideline sent to the consultant's address shows up as a refused truck, the Pulled Rug; the partner card's internal owner and the scorecard detect it, and a versioned, tested mapping recovers. |  | `additional_support`: A failure in the order flow. → A failure in the partner's rules. |\n| p49 | analysis | The ASN from the wrong system, Kestrel & Pine's case, is detected by comparing every DESADV with the WMS pack confirmation before sending and recovered by a corrected DESADV or a dispute backed by the pack record and label log. |  | `additional_support`: A changed guideline. → The chapter's own case. |\n| p50 | analysis | A rejected e-invoice, numbered in the ERP but never received, is detected by a transmission-status field and a daily 'issued but not delivered' report, and recovered by a re-send or a credit note and new invoice as the country's rules require. |  | `additional_support`: The despatch advice. → The invoice. |\n| p51 | analysis | A provider outage loses nothing if every document is persisted before sending with a reference the provider can deduplicate and a heartbeat per partner, and a departing consultant costs little if the partner card and a mapping export sit in the company's own repository. |  | `additional_support`: Failures of individual documents. → Failures of the intermediary and of the knowledge. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The chain's purchase order, despatch advice and invoice of the opening are three documents with three sources: Bergzicht's €14,200 deduction came from a despatch advice written by the ERP before anyone packed, and the e-invoice adds a delivery state to the third document; every compliance chargeback in the public rule sets is a document generated in the wrong place.\n\n**So what:** The remedies are ownership rules, not a new provider: the despatch advice and labels from the WMS, the invoice from the ERP with its transmission status, EDI orders in the one order record, a partner card per trading partner and a dated mandate calendar with an owner.\n\n**Callback:** The introduction's retail chain whose pallet labels or invoice can hold up receiving or payment and trigger a penalty. Paragraph p52 answers it with Bergzicht's deduction and the three sources.\n\n**Takeaway** (`course_of_action`): For each trading partner, name the system that generates each document, compare every despatch advice with the pack confirmation, keep a partner card, and place your company on the mandate calendar.\n\n**Hand-off** to [The Back Office: ERP Integration and Who Is the Hub](erp-and-back-office-integration.html): `sequence`: The documents of the EDI chapter, which end in the ledger: invoices and credit notes the ERP numbers and issues, with their transmission status, and the terms, credit limits and wholesale prices the B2B chapter assigned to the ERP. → What the ERP, the system that keeps the ledger, should own in a commerce business, what it receives and how often, and whether it should be the hub everything else connects through.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | synthesis | The opening's retail chain asked for a purchase order, a per-pallet shipment notice and a readable invoice, and the chapter's answer is that the three documents the chain asked for have three different sources: Bergzicht's €14,200 came from a despatch advice the ERP wrote before packing, so the penalty is explained by the system that wrote the document, not by the pickers, and the e-invoice adds a delivery state to the third. | reasoning: The opening's three documents set against the ASN Chargeback and the e-invoice. |  |\n| p53 | synthesis (list) | Established: EDI's standards, identifiers and transports and its three most implemented documents; the ASN as a receiving plan keyed by the SSCC label that receivers refuse deliveries without; and the dated e-invoicing obligations. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what the sources establish. |\n| p54 | synthesis (list) | Depends on context: which route fits (portal, integrated provider, in-house, gateway), whether a foreign supplier is bound by a domestic mandate, and whether EDI orders live in the OMS or, before one exists, in the ERP. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p55 | recommendation (list) | The author's synthesis: each document has exactly one honest source that the architecture should enforce, and the e-invoice gives the ERP the same discipline as the order channel (persistence before sending, idempotent re-sends, a status per document, a daily report of what was issued but not received). |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p56 | recommendation (list) | Eight questions let the reader find, in their own company, the partners' EDI conditions, which system generates the DESADV, where EDI orders live, the partner cards, the ASN match rate and its owner, the mandates per country, the invoice issuer's status and archive, and who can read the mappings. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own company. |\n| p57 | transition | The documents end in the ledger, so the next chapter asks what the ERP, the system that keeps it, should own in a commerce business and whether it should be the hub everything connects through. |  | `sequence`: The documents of the EDI chapter, which end in the ledger: invoices and credit notes the ERP numbers and issues, with their transmission status, and the terms, credit limits and wholesale prices the B2B chapter assigned to the ERP. → What the ERP, the system that keeps the ledger, should own in a commerce business, what it receives and how often, and whether it should be the hub everything else connects through. |\n\n## Non-goals\n\n- B2B features: company accounts, contract pricing, quotes, approvals, punchout as a storefront feature. See [Selling to Businesses: Accounts, Contract Prices, Quotes and Approvals](b2b-commerce.html).\n- The invoice as a legal document, VAT rules, credit notes and order-to-ledger posting. See [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html).\n- What the ERP owns and the hub debate. See [The Back Office: ERP Integration and Who Is the Hub](erp-and-back-office-integration.html).\n- Idempotency, outbox, reconciliation jobs. See [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html).\n- The regulatory calendar as a management practice and non-invoicing regulation. See [Rules Turned Into Requirements: Consumer, Payment, Invoicing and Platform Regulation](commerce-regulation.html).\n- The step-by-step wholesale order with the full failure path. See [Journey 3: A Chain Reorders by EDI, From Order to Invoice](journey-wholesale-order.html).\n- Warehouse pick and pack mechanics and SSCC label printing in the WMS. See [Pick, Pack, Ship: Warehouse Management and Fulfillment](warehouse-and-fulfillment.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-12** — After the confirming round 3 (escalate), cheap and plainly right fixes without another round: p24's interim-ERP passage split and the ERP's order named as the order record until the OMS; p26 explains the four requirement columns before the table; p40 no longer p now announces why EDI persists; p52 no longer repeats the author's synthesis sentence. Notes not taken are in open_questions. Rejected: Moving 'Across Scale Stages' before 'The Choices' (the scale stages are known from Part I, and the house order puts choices before stages).; Splitting the outage and the departing consultant into two failures.; Adding a punchout failure (new material).\n- **2026-11-12** — Converted spec.md to spec.json from the published chapter. Success criteria not carried over as they were: the terms criterion (define every term from the chapter alone) is left to the draft check's known_before_new reading and the audience's does_not_know list rather than added as a criterion; the table, diagram, scale-stage, take-away, Questions and Sources criteria were inventories and are dropped; the Bergzicht and ASN criterion is covered by AC-1, the mandate criterion by AC-2. No criteria were added beyond the journal spec's AC-1 to AC-5. Rejected: Adding a known_before_new criterion with the full term list (an agent-added criterion the author's standing rule 7 would drop).\n- **2026-11-12** — Added p05 (thesis) and p06 (roadmap announcing every section) to the introduction, and p52, a conclusion paragraph that answers the opening's retail chain with Bergzicht's deduction; rewrote p04 to pick up the B2B chapter's portal and the buyer's own system, as this chapter's transition_in asks. The part closing belongs to erp-and-back-office-integration and is not performed here. Rejected: Leaving the KEY POINTS callout as the only statement of the thesis.\n- **2026-11-12** — Kept the old spec's word limit of 6,500 words (published chapter: 5,650 counted words).\n- **2026-11-12** — Corrected Lea Moreau's title to Head of Wholesale and Ruben Alves's to lead integration engineer, as the scenario ledger gives them.\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: AC-4's expected answer copied unchanged from the journal spec, which now matches the published introduction (Bergzicht's deduction and spring reorder of April 2027; Eva's order is no longer in the introduction); rejected: restoring Eva's order to the introduction. Rejected: Restoring Eva's order to the introduction\n\n## Sources\n\n- **Internal**\n  - _research/scenario-ledger.md (edi-and-e-invoicing, ASN Chargeback, W6, Bergzicht's spring reorder, cast) and _research/consistency-issues.md (rulings 3, 4, 5, 17, 19) — The ASN Chargeback, W6, the partner card, Bergzicht and its reorder, Ardennes Trail Co., Peppol by choice, the hedge on the Belgian mandate.\n  - journal-spec.json (edi-and-e-invoicing; erp-and-back-office-integration transition_in) — Intent, thesis, role, acceptance criteria and the hand-off.\n  - meet-kestrel-and-pine, journey-wholesale-order, order-management, tax-invoicing-and-ledger, commerce-regulation, b2b-commerce — The scenario, the full Bergzicht path, the OMS, the invoice as a legal document, the regulatory calendar, the previous chapter's hand-off.\n  - _research/brief-b2b-edi-erp.md (Parts 1.5, 2, 3) — The research base.\n- **External**\n  - GS1 General Specifications Release 26.0 (2026); GS1 EANCOM manual (2021); GS1 EDI implementation survey (2021); X12 transaction sets; RFC 4130 — Standards, identifiers, transports.\n  - Jumbo purchasing conditions (2026-04-09), mechanized-DC guidelines (2025-10) and EDI supplier page; bol SSCC supplier page; SPS Commerce Form 10-K for 2025; Talk Business (2017) and SPS Commerce (2024) on Walmart OTIF — Retailer requirements, chargebacks and the provider market.\n  - cXML User's Guide 1.2.037 (2018); TradeCentric on OCI (2026) — Punchout.\n  - OpenPeppol About and BIS Billing 3.0 (3.0.21, 2026); European Commission 'What is eInvoicing', 'eInvoicing in Italy' and ViDA pages; einvoice.belgium.be (2024, 2025, FAQ); Bundesministerium der Finanzen FAQ; impots.gouv.fr; gov.pl KSeF; Rijksoverheid (2026-09-11); business.gov.nl — E-invoicing and the mandate calendar.\n\n## Changelog                 // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
