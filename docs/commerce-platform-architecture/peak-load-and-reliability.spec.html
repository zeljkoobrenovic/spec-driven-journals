<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/33-peak-load-and-reliability/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (the thesis paragraph, a roadmap, a conclusion paragraph that answers the opening, and Part VII's closing); these are listed under decision_log and open_questions.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Peak profiles (seasonal, launch, flash sale, unplanned) and why the platform's peak is not the merchant's: the largest operators each report in their own unit, and Shopify's 2025 figures give a peak about twice its average against Kestrel & Pine's about seventy.\n- **Know:** The chain read from the front (storefront, checkout and payment, order export, warehouse and people, stock loop, back office), with a requirement per flow; queues and backpressure, caching, waiting rooms and a degradation ladder.\n- **Know:** Orders per minute as the health signal and the unit for SLOs, the situation room and runbook, and recovery as reconciliation followed by a post-mortem.\n- **Believe:** The platform's peak is not the merchant's peak: the storefront usually holds, and the chain behind it is where the day is lost.\n- **Believe:** Every link is measured in one unit, orders per minute; checkout, payment and the order record are never switched off.\n- **Believe:** Recovery is reconciliation, and the peak plan is a year-round product with one owner.\n- **Be able to:** Find the slowest link of their own chain in orders per minute and test every link above the forecast.\n- **Be able to:** Write a switch-off order with owners and triggers, and name before the day who compares which systems the morning after.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer or engineering lead who inherits a working but untested integration landscape (Noor Visser's position). The ecommerce manager who owns the promotion calendar and the operations lead who owns the warehouse's peak roster should recognize their part of the plan.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its 2026 and January 2027 incidents in outline and the names of the sixteen failure patterns.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines, 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, business models and the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Parts II to VI: available-to-promise, one writer for on hand and committed, per-channel buffers; checkout creating the order once with payment pending; one order record with three status lines; integration styles, events, idempotency keys and reconciliation jobs.\n- From the earlier chapters of Part VII: the vendor's inside against the merchant's own code; pooled tenancy and API budgets per app or customer, and Ruben Alves's analysis of the order flow throttled at both ends; app governance with an owner, scopes and one writer per fact (41 apps, six unused, three writing stock); the storefront's cache rule (cache content, fetch price, stock and cart live).\n\n**Does not yet know:**\n\n- Peak profiles; peak-to-average ratio; CDN `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How do you prepare a commerce platform and its integrations for a day with forty times the normal traffic?\n\n> **Claim:** A hosted platform smooths many merchants' spikes, so its storefront and checkout usually hold; the merchant's own chain meets its spike alone, and its integrations fail before the storefront. Prepare by measuring every link in orders per minute, testing above the forecast, queuing work behind checkout with gauged queues, writing a switch-off order that never touches checkout, payment or the order record, and naming who reconciles the systems the morning after.\n\n**Disputed by:** The view that peak readiness is the platform vendor's job: a hosted platform scales automatically, so a merchant prepares by load-testing the storefront, buying a higher tier or a waiting room and adding support staff, and leaves its integrations to run as on any other day.\n\n**So what:** A merchant that accepts the claim names a year-round owner for the peak plan, forecasts in orders per minute and tests each link above the forecast, gauges the age of its queues, writes and rehearses a degradation ladder with owners, staffs a room with an incident commander and schedules the reconciliation before the day. In Black Friday week 2026 Kestrel & Pine took 31,000 orders, 2,300 of them in the peak hour (38 a minute); the platform held, the order flow carried about seven a minute and built a four-hour backlog, and the stock chain let channels sell the sold-out Ridgewalker jacket for up to two hours: 1,340 units oversold, 1,120 orders canceled or delayed, about €96,000. The 2027 plan, approved with Waypoint in March 2027, forecasts 60 orders a minute and tests every link at 80, sends fulfillment orders from the OMS to the WMS in batches (tested at 120 a minute), sets a 15 October go/no-go for the availability service, has eight switches with owners, a freeze from 15 November to 5 December, and a reconciliation report at 08:00 on Saturday 27 November.\n\n**How and why:** The platform serves many merchants whose spikes fall at different hours, so its peak is about twice its average and its CDN absorbs most requests before application code; Kestrel & Pine's storefront traffic rose to 41 times an average hour and its order rate to about seventy (2,300 orders against 33). Each link behind checkout has a fixed capacity (rate limits at both ends, one order at a time), so the slowest one builds a queue at the difference between arrival and capacity (31 orders a minute in 2026) that nobody sees without a gauge, and every sync interval becomes an oversell window in proportion to the sales rate. Recording the order fast and queuing everything behind it keeps the money path working, switches flipped in rehearsal remove load in a planned order, and retries under load leave duplicates and gaps that only a comparison by order number afterwards finds.\n\n**Supporting claims**\n\n- **S1** — The hosted platform smooths many merchants' spikes to a peak about twice its average and serves most requests from its CDN, so its storefront and checkout usually hold, while the merchant's own chain meets its spike (about seventy times an average hour at Kestrel & Pine) alone and its integrations fail first.\n- **S2** — Each link behind checkout has a fixed capacity, so the slowest builds a queue at the difference between arrival and capacity and every sync interval becomes an oversell window; every link is therefore measured in orders per minute and tested above the forecast.\n- **S3** — Recording the order fast and queuing everything behind it, with gauged queues, idempotent receivers and owned dead-letter queues, keeps the money path working; caches and waiting rooms protect only the front.\n- **S4** — A switch-off order written in a calm month, with an owner per switch and every switch flipped in rehearsal, removes load in a planned order and never touches checkout, payment or the order record.\n- **S5** — The day is observed in orders per minute by a staffed room, recovery is a reconciliation by order number with named owners followed by a post-mortem, and the peak plan is a year-round product with one owner.\n\n## Role in the part\n\nTests the part's answers on the day they matter: the platform's smoothed peak against the merchant's own spike, the chain sized in orders per minute, queues, a switch-off order and reconciliation as recovery; performs the part's closing (the published chapter does not yet do so: it ends with one sentence on the peak and the hand-off to Part VIII). Supports P7-5 of part `part-7`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `chronological` in chain: the links in the order an order meets them; prepare to wrong: before, during and after the day; `comparison` in choices and stages)\n\nKestrel & Pine's post-mortem states the problem; why the platform's peak differs from the merchant's and where the chain breaks diagnose it (the platform-versus-merchant comparison comes before the chain because it establishes that the merchant's chain, not the platform, is what must be sized), and the diagnosis must come first because every preparation step and mechanism targets a link the chain section names. The solution then follows the day in time: preparing, running, observing, recovering; observing before running would watch mechanisms the reader has not met, and recovery before observing would clean up failures nobody detected. The choices and stages come after the whole day because they decide how much of it a merchant takes on, which cannot be judged before all of it is known. The 2027 plan comes last because it applies every practice, including the reconciliation report and the post-mortem that became the Waypoint proposal; placed earlier (as published, before recovery) it used terms the chapter had not yet explained.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): Kestrel & Pine takes about 800 online orders on an ordinary day, roughly 33 an hour, and 2,300 in one Black Friday hour; an integration that clears its queue between ordinary purchases builds a backlog, and the store looks healthy while promised deliveries become impossible to meet.\n\n**Bridge:** The previous chapter's storefront survives a peak hour because its pages can be cached. → The chain behind the storefront (order export, stock updates, picking) cannot be cached and has its own capacities, so the question becomes how to size, test, protect and recover that chain.\n\n**Thesis statement** (KEY POINTS callout (in full) and paragraph p04 (in short, to avoid restating the callout)): A hosted platform smooths many merchants' spikes, so its storefront and checkout usually hold; the merchant's own chain meets its spike alone, and its integrations fail before the storefront. Prepare by measuring every link in orders per minute, testing above the forecast, queuing work behind checkout with gauged queues, writing a switch-off order that never touches checkout, payment or the order record, and naming who reconciles the systems the morning after.\n\n**Roadmap** (Paragraph p05):\n\n- Start from Kestrel & Pine's Black Friday 2026 post-mortem. *Kept in:* scene.\n- Explain why the platform's peak is not the merchant's and where along the chain a peak day breaks. *Kept in:* peak, chain.\n- Follow the day in order: preparing, running, observing and recovering. *Kept in:* prepare, running, observe, wrong.\n- Compare how far a merchant should go and how that changes with scale. *Kept in:* choices, stages.\n- End with Kestrel & Pine's 2027 plan. *Kept in:* practice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | The previous chapter's storefront survives a peak hour because its pages can be cached, but the chain behind it meets the spike alone: Kestrel & Pine takes about 800 online orders on an ordinary day, roughly 33 an hour, and 2,300 in one Black Friday hour, so an integration that clears its queue on an ordinary day builds a backlog while the store looks healthy, because order export, stock updates and picking each have their own capacity. | scenario: About 800 online orders a day (roughly 33 an hour) against 2,300 in the Black Friday peak hour; the store looks healthy while promised deliveries become impossible. |  |\n| p03 | context | Eva's April 2027 jacket order, the book's running order, reached the warehouse within minutes on an ordinary evening through the same chain that failed in November 2026; this chapter asks what happens when thousands of orders take that path in one hour, where the steps stay the same and queues and delays decide the outcome. |  | `place`: The order path behind the storefront and its separate capacities. → Where the chapter sits in the order's journey the book follows. |\n| p04 | claim | The chapter's answer in short: the shop platform shares its capacity across many merchants so its storefront and checkout usually hold, while the merchant's own chain meets its spike alone and fails first; the rest of the chapter shows how to prepare that chain, measured in orders per minute. |  | `cause_effect`: Thousands of orders taking Eva's path in one hour. → The chapter's claim about why the chain fails and how to prepare it. |\n| p05 | transition | The chapter starts from Kestrel & Pine's Black Friday 2026 post-mortem, explains why the platform's peak is not the merchant's and where along the chain a peak day breaks, follows the day in order (preparing, running, observing, recovering) with dated figures and practices from large operators, and ends with the choices of how far to go, how they change with scale, and Kestrel & Pine's 2027 plan. |  | `sequence`: The claim. → The order in which the chapter argues it. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: Reading the Post-Mortem\n\n**Controlling idea** (`example`, id `scene`): Kestrel & Pine's Black Friday 2026 post-mortem shows a platform that held while the stock chain oversold and the order flow fell four hours behind, because nobody had compared the links' rates in orders per minute.\n\n**Advances the thesis** (S1, S2): Gives the case the chapter answers: the storefront held and the chain behind it failed at rates nobody had compared.\n\n**Transition in:** `example`: The claim and the roadmap, which start from the 2026 post-mortem. → The post-mortem itself.\n\n**Order of paragraphs** (`problem_solution`): The question (Mara's) first, then the figures and the two failures, then the cause they share, which the rest of the chapter answers.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | context | In March 2027 Noor Visser reads the post-mortem of 27 November 2026 because Mara Lindqvist asks whether the next Black Friday will repeat it; the book calls discovering capacity limits on the day they matter most The First Snowfall. |  |  |\n| p07 | evidence (list) | In Black Friday week 2026 the storefronts took 31,000 orders, 2,300 of them in Friday's 20:00-21:00 hour (about 38 a minute) at 41 times an average hour's storefront traffic and orders about seventy times; the platform handled checkout while the stock sync chain, up to two hours slow, oversold the Ridgewalker jacket at a cost of about EUR 96,000 and the order flow, throttled by the WMS vendor's rate limit, built a four-hour backlog that broke the next-day promise for roughly 8,000 orders placed between 17:00 and midnight. | statistic: 31,000 orders in 23-29 November 2026 (10.6% of the year); 2,300 in the peak hour, 38 a minute; traffic 41 times an average hour.; case: Stock sync chain: up to two hours from a sale at Duiven to the stock shown elsewhere; Ridgewalker sold out at 19:40; 1,340 units oversold, 1,120 orders canceled or delayed, about EUR 96,000.; case: Order flow on the iPaaS: one order at a time, four API calls each, throttled by the WMS vendor's rate limit; four-hour backlog by 21:00; roughly 8,000 orders missed the next-day promise. | `example`: Mara's question about the last Black Friday. → What the post-mortem records. |\n| p08 | analysis | Every system ran at its configured rate, but nobody had compared those rates in orders per minute, so the team could neither find the slowest link nor reduce the work before it overwhelmed the next; journey-peak-day gives the hour-by-hour account. |  | `cause_effect`: The two failures. → The cause they share, which the chapter answers. |\n\n### What a Peak Is, and Why the Merchant's Is Worse Than the Platform's\n\n**Controlling idea** (`comparison`, id `peak`): A peak's shape decides what breaks, and the platform's peak is not the merchant's: the hosted platform's is about twice its average, smoothed across merchants and absorbed by its CDN, while the merchant's own chain met about seventy times its average hour alone.\n\n**Advances the thesis** (S1): Establishes with dated figures why the storefront usually holds and the merchant's chain does not.\n\n**Transition in:** `cause_effect`: Rates nobody had compared in orders per minute. → What a peak is and why the merchant's differs from the platform's.\n\n**Order of paragraphs** (`large_to_small`): What a peak is and its shapes, then the operators' figures, then the two ratios read from Shopify's figures, then what that means for the merchant's own chain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | Comparing rates means knowing the load they must meet: a peak is a period, planned or not, in which traffic and orders are many times their normal level, and its shape (seasonal peak, launch, flash sale, unplanned moment) decides what breaks. | table: Four peak profiles with shape and what each stresses most. |  |\n| p10 | evidence | The figures that circulate about peaks come from the largest operators, and each reports in its own unit: Alibaba in orders per second, Zalando in orders per minute, Shopify in sales and requests per minute, Adobe in sales per minute, so a merchant needs its own unit for its whole chain, orders per minute. | source: Alibaba Cloud 2020 (583,000 orders per second, order undefined); Zalando 2020 (7,200 orders per minute in 2019); Shopify December 2025 ($5.1M sales per minute, $14.6B weekend, 489M edge and 117M app-server requests per minute, unaudited); Adobe December 2024 ($13.3B, $15.8M per minute). | `contrast`: What a peak is. → How the largest operators report theirs. |\n| p11 | analysis | Two ratios in Shopify's 2025 figures matter more than their size: about four edge requests per app-server request, so the CDN absorbed about three quarters of peak traffic, and a peak minute about twice the weekend average, against Kestrel & Pine's ratio in orders of about seventy (the units and baselines differ, so the comparison is approximate, but the gap is the point) (its storefront traffic rose 41 times; orders, the load the chain carries, about seventy); the platform's peak is not the merchant's. | reasoning: $5.1M peak minute against about $2.7M average over roughly 5,400 minutes; 489M against 117M requests; 2,300 orders in the peak hour against 33 in an average one.; figure: Figure 1: many merchant spikes summing to a smooth platform wave at about 2x; one merchant's spike at about 70x on its own chain. | `emphasis`: Shopify's figures among the operators'. → The two ratios in them that matter for a merchant. |\n| p12 | transition | Multi-tenancy, one system shared by many merchants, gives the platform its smoothing; the merchant's chain gets none, and it is what this chapter sizes. |  | `cause_effect`: The platform's peak is not the merchant's. → The chain that meets the merchant's spike, which the chapter sizes. |\n\n### The Chain Under Load: Where a Peak Day Breaks\n\n**Controlling idea** (`analysis`, id `chain`): A peak day runs down the chain from the front: the cached storefront and the protected checkout hold, the merchant's order export fails first, the stock loop becomes the oversell, and the back office can wait longest, so each flow gets its own requirement at peak.\n\n**Advances the thesis** (S1, S2): Locates where the day is lost and gives each link its requirement.\n\n**Transition in:** `elaboration`: The merchant's chain, which gets no smoothing. → The chain link by link, with the capacity each had in 2026.\n\n**Order of paragraphs** (`chronological`): The links in the order an order meets them, from the storefront to the back office, then the table that sets a requirement for each.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | description | A commerce chain is a sequence of handoffs and a peak day runs down it from the front; Kestrel & Pine's 2026 chain shows the vendor-hosted front links holding at 38 orders a minute and the hand-built order flow behind them carrying about seven. | figure: Figure 2: Kestrel & Pine's chain on 27 November 2026 with per-link capacities (illustrative reconstructions consistent with the recorded totals). |  |\n| p14 | explanation | The storefront holds because catalog pages, images and scripts are mostly cacheable and the platform's CDN serves them without the application; the previous chapter's cache rule (cache content, fetch price, stock and cart live) is what the peak tests here, after a cache is defined; a stock badge may show 'low stock' from a copy minutes old below a threshold, never 'in stock' from a stale copy. |  | `sequence`: The chain read from the front. → The first link, the storefront. |\n| p15 | explanation | Checkout is the most protected part of a platform, payment providers have their own limits, and the idea that transfers is to take the money and the commitment fast and let the record-keeping queue. | source: Stripe rate limits (asks merchants to announce flash sales); Shopify changelog 2018 (payment processing separate from order creation under high volume; eight years old). | `sequence`: The storefront. → Checkout and payment, the next link. |\n| p16 | cause_effect | The order export is where the merchant's part begins and almost always the first link to fail, because it processes orders one at a time with four API calls each, runs under rate limits at both ends that the previous chapters' API-budget analysis measured, and was tested, if at all, at an ordinary afternoon's rate; seven orders a minute against 38 builds a queue of 31 a minute that nobody sees without a gauge. | reasoning: The WMS vendor allows about 30 calls a minute per customer; four calls per order one at a time gives about seven orders a minute; 38 arriving minus 7 carried gives 31 a minute queued. | `contrast`: The vendor-hosted links that hold. → The merchant's own link, which fails first. |\n| p17 | explanation | Behind the WMS, a hosted product with capacity to spare, the constraint is pickers and carrier collections, and in 2026 no system could withdraw the delivery promise when the warehouse fell behind. |  | `sequence`: The order export. → The warehouse and its people. |\n| p18 | cause_effect | The stock loop that is harmless on a quiet day is the oversell on a peak day, because every sync interval is a risk in proportion to the sales rate. |  | `sequence`: The order going out to the warehouse. → Stock coming back around the loop to every channel. |\n| p19 | explanation | The ERP, the data warehouse (glossed as the analytics database) and the notifications come last and can wait longest, so they are where queues should grow. |  | `sequence`: The stock loop. → The back-office links at the end of the chain. |\n| p20 | synthesis | The requirements table sets out each flow's freshness, consistency and latency target at peak and its fallback, saying in prose that checkout, payment authorization and the order record are never degraded. | table: Requirements per flow: freshness, consistency, latency target (the author's illustrative targets) and what to do if it cannot keep up. | `conclusion_summary`: The links one by one. → A requirement per flow in one table. |\n\n### Preparing: Capacity, Forecasts and Load Tests\n\n**Controlling idea** (`process`, id `prepare`): Capacity planning sets, before the day, how many orders a minute each link must carry and proves it with load tests of the whole journey above the forecast, as the documented programs do, plus a freeze.\n\n**Advances the thesis** (S2): Shows how to measure and test every link in orders per minute before the day.\n\n**Transition in:** `problem_solution`: Each flow's requirement at peak. → How to prove before the day that each link meets it.\n\n**Order of paragraphs** (`large_to_small`): Definitions, then the two documented programs, then their translation for a merchant on a hosted platform, then the cheapest measure, the freeze.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | definition | Capacity planning is deciding before the day how many orders a minute each link must carry and proving it can, with a forecast as input and a load test as proof. |  |  |\n| p22 | evidence | Shopify's 2025 readiness program planned capacity from March, ran five full-scale tests at about 150% of the previous year's load and Game Days that injected faults into the critical journeys; its early tests found checkout queues backing up and rate-limit paths only authenticated checkout touched, and its 2023 tests bypass the CDN for part of the traffic so the origin is measured. | source: Shopify Engineering, November 2025: five tests April-October at about 150%, scripted journeys with flash-sale bursts, Game Days, the Resiliency Matrix; \"checkout queues backed up\"; authenticated checkout \"exposed rate-limit paths that anonymous browsing never touches\".; source: Shopify Engineering, January 2023: tests \"bypass the CDN for a portion of the traffic\". | `example`: Capacity planning and the load test. → The best-documented platform program. |\n| p25 | evidence | Zalando load-tested its production website end to end above its real peak because team-level tests could not show whether the whole system held, and its order-flow simulators place test orders that fulfillment skips. | source: Zalando Engineering 2019 (recorded journeys replayed to about 130,000 requests per second; seven years old) and 2020 (test orders fulfillment skips). | `similarity`: A platform's program. → A retailer's program. |\n| p26 | process (list) | For a merchant on a hosted platform the translation is five steps: forecast in orders per minute, test the journeys with marked orders, test the authenticated and integrated paths, rehearse failure on the money paths, and fix the slowest link and repeat. | reasoning: Step 3 names the spenders of the API budget and the apps that write stock, the subjects of the previous chapters' budget analysis and app audit. | `elaboration`: The two documented programs. → Their translation for a hosted-platform merchant. |\n| p27 | recommendation | A freeze on apps, theme, connector and configuration changes after a set date is the cheapest reliability measure, because the most common cause of a peak-day incident is a change made the week before. |  | `additional_support`: The five steps of testing. → One more measure that costs nothing. |\n\n### Running the Peak: Queues, Waiting Rooms and Switches\n\n**Controlling idea** (`explanation`, id `running`): On the day two mechanisms protect the chain behind the storefront, queues with backpressure behind a fast-recorded order, which let work wait, and a switch-off order decided in advance, which removes work; a waiting room protects only the front.\n\n**Advances the thesis** (S3, S4): Gives the mechanisms that queue the work behind checkout and remove load in a planned order.\n\n**Transition in:** `contrast`: What preparation proves before the day. → The surprises that remain on the day and the mechanisms that survive them.\n\n**Order of paragraphs** (`order_of_importance`): Queues first because they protect the order record by letting work wait; the waiting room next because it is the front's own queue and a rung of the ladder that follows, so it must be defined before the ladder (round 2 readers); graceful degradation last because it is what is left when waiting is not enough. The cache rule sits with the storefront link, as round 1 readers asked.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | transition | Preparation removes most surprises but not all, and three tools, announced in the order they follow, help with the rest: queues that let the chain's work wait, a waiting room that slows the storefront's own traffic, and switches that remove work. |  |  |\n| p29 | definition | A queue holds work until the next system can take it, and backpressure lets a slow system slow its producers or let work pile up rather than fail the customer-facing step, which preserves goodput. | quotation: AWS Builders' Library 2019: reject excess requests to focus on those let in; goodput is the throughput handled without errors. | `elaboration`: Two mechanisms. → The first: queues and backpressure. |\n| p30 | analysis | In a commerce chain this means accepting and persisting the order fast and queuing everything downstream, and Kestrel & Pine's 2026 queue failed for lack of a gauge, an alarm, an owner and a plan. | case: Zalando's 2015 practice of pausing non-essential asynchronous processing; Kestrel & Pine's iPaaS queue in 2026 with no gauge. | `elaboration`: The general principle. → Its specific shape in a commerce chain. |\n| p31 | cause_effect | Delivery between systems is at-least-once (glossed), so queues create duplicates and gaps under retries, so receivers must be idempotent on the order number and a dead-letter queue needs an alarm and an owner. |  | `cause_effect`: Queues behind the order. → What retries in those queues leave behind. |\n| p33 | analysis | The front door has its own tool: a waiting room admits shoppers at a set rate when traffic exceeds a threshold and turns an unknown spike into a known outflow, but it protects the storefront, not the chain, so it is a launch-day tool whose admission rate comes from the slowest tested link. | source: Cloudflare, January 2021 (maximum active users, new users per minute, session duration); Queue-it, n.d. (threshold-triggered, adjustable outflow). | `contrast`: Queues, which protect the chain. → The front door's own tool, the waiting room, and its limit. |\n| p35 | definition | When queues and the waiting room are not enough, work has to be removed: graceful degradation switches off non-essential features in a planned order through feature switches, which Hodgson calls ops toggles. | source: Hodgson, martinfowler.com, October 2017: ops toggles and kill switches to gracefully degrade non-vital functionality. | `problem_solution`: Queues and the waiting room, which let work wait. → Removing work when waiting is not enough. |\n| p36 | example | Amazon's Prime Day 2018 shows degradation under fire: a fallback front page and a cut of international traffic were switches that existed before the day. | case: CNBC, July 2018: fallback front page within fifteen minutes, international traffic cut at 12:15, default page restored for a quarter of traffic at 12:37 (a press account, eight years old). | `example`: Graceful degradation. → The documented case. |\n| p37 | recommendation | A merchant's switch-off order is shorter: the ladder recommended for an Omnichannel merchant on a hosted platform switches off, in order, recommendations, search facets, exact stock badges, low-stock marketplace listings, the next-day promise, non-essential checkout options and single failing payment methods (never payment as a whole), then turns on the waiting room for the storefront's own load and switches off sign-up and pop-ups, and never switches off checkout, payment, the order record or the order export (which may queue but keeps running). | figure: Figure 3: a degradation ladder whose rungs remove load or risk and whose bottom rung names what is never switched off. | `contrast`: Amazon's switches. → A merchant's shorter ladder. |\n| p38 | recommendation | A ladder works when every switch has been flipped in a test, has one owner who may flip it without a meeting, and its order was decided in a calm month by the people who own the revenue. |  | `elaboration`: The ladder. → The three rules that make it usable. |\n\n### Observing the Day: Orders per Minute as the Health Signal\n\n**Controlling idea** (`process`, id `observe`): The day is observed in business units: orders per minute against recent weeks as the health signal, the four golden signals per flow, SLOs the merchant owns, and a staffed room with an incident commander and a rehearsed runbook.\n\n**Advances the thesis** (S5): Shows how the merchant sees and steers its own chain on the day in orders per minute.\n\n**Transition in:** `sequence`: The mechanisms that run on the day. → Watching whether orders still flow while they run.\n\n**Order of paragraphs** (`large_to_small`): The one health signal, then the dashboard per flow, the alarms, the targets, and the people who act on them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | claim | While the mechanisms run someone has to see whether orders still flow; server metrics showed every server fine in 2026 while the business lost EUR 96,000, so the health signal is orders per minute against the same weekday and hour of recent weeks, as the largest operators report in business units. | figure: Figure 4: the orders-per-minute line drops below last weeks' and triggers an alarm while the server tiles show green. |  |\n| p43 | explanation | The peak dashboard applies Google's four signals (traffic, latency, errors, saturation) to each business flow, for example incoming orders per minute, the oldest unprocessed order, failed deliveries and remaining API capacity for order export. | source: Google SRE book, 2017: the four golden signals. | `elaboration`: Orders per minute as the health signal. → The dashboard per flow. |\n| p44 | explanation | On that dashboard the alarms that matter most are queue age and spare capacity, which show trouble before customers do, payment declines reveal failures healthy servers cannot, and a flow that falls silent while the shop is busy needs its own alert. |  | `emphasis`: The dashboard. → The alarms that matter most on it. |\n| p45 | definition | Targets belong in business units too: the merchant's peak SLOs are checkout success, confirmation latency, time from order to WMS release and stock lag, and the vendors' agreements cover only their own uptime. | source: Google SRE book, 2017: a service level objective is a target value for a measured aspect of service. | `additional_support`: The signals to watch. → The targets they are measured against. |\n| p46 | recommendation | Both documented programs staff a room through the peak, and a merchant's six-person version needs an incident commander, one person per link, vendor contacts, a runbook written in September and rehearsed in November, and a communication plan. | source: Zalando's Situation Room with incident commanders (2020); Shopify's round-the-clock incident coverage (2025). | `sequence`: The signals and targets. → The people who act on them. |\n\n### When It Goes Wrong: Recovery and Reconciliation\n\n**Controlling idea** (`process`, id `wrong`): A prepared merchant knows before the day what each failure leaves behind; recovery is a reconciliation of the systems by order number with named owners, followed by a blameless post-mortem.\n\n**Advances the thesis** (S5): Establishes recovery as reconciliation planned before the day.\n\n**Transition in:** `contrast`: Preparation, mechanisms and a watched dashboard, which reduce incidents. → What remains when incidents still happen, and how to recover.\n\n**Order of paragraphs** (`chronological`): What failures leave behind, then the morning-after comparison, then the post-mortem that closes the loop.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | claim | A plan reduces incidents but does not eliminate them, and a prepared merchant knows before the day what each failure leaves behind and how to clean it up. | table: Five failures at peak with what each leaves behind, its detection and its recovery. |  |\n| p51 | process | Recovery after a peak is reconciliation: the morning-after report compares orders across systems by order number, stock per SKU between the WMS and the availability service, and payments against orders, with the owner of each difference named in the plan. | quotation: Shopify developer docs: \"webhook delivery isn't always guaranteed\"; run reconciliation jobs. | `elaboration`: What failures leave behind. → How the morning after finds and fixes it. |\n| p52 | recommendation | The last step is a blameless post-mortem within two weeks with the timeline in orders per minute and every action assigned, as Kestrel & Pine's became the Waypoint proposal, the 2027 architecture plan whose decisions W1 to W8 the book follows. |  | `sequence`: The reconciliation. → The post-mortem that follows it. |\n\n### The Choices and Their Trade-offs\n\n**Controlling idea** (`comparison`, id `choices`): Peak preparation has four levels, each adding responsibility; a merchant with its own warehouse and more than one channel should protect the chain and give the peak plan an owner all year.\n\n**Advances the thesis** (S5): Places the chapter's practices among the alternatives and names the year-round owner.\n\n**Transition in:** `contrast`: The practices before, during and after the day. → How much of them a merchant should take on.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | comparison (list) | How much of this a merchant takes on is a choice among four levels, each adding responsibility: trust the platform, protect the front door, protect the chain, operate the platform yourself. |  |  |\n| p40 | analysis | Choose the level that protects the order path you actually operate, because a faster storefront only feeds a slow connector's queue faster and controls nobody maintains disappear. | table: The four levels by what each protects, cost and when it fails; introduced by a sentence saying so. | `cause_effect`: The four levels. → How to choose the level that protects the order path actually operated. |\n| p41 | recommendation | The author recommends protecting the chain for a merchant with its own warehouse and more than one channel, with a peak plan that has a named owner all year, except when the peak is under five times the normal hour or every integration is vendor-built and tested. |  | `conclusion_summary`: The choice rule and the table. → The author's recommendation and its limits. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): The four levels map to the scale stages, and the practices grow with the stage while ownership changes most, from a checklist the founder or agency runs to a program with an owner to a platform team's product, and Kestrel & Pine ran an Omnichannel chain with a Growing-stage plan.\n\n**Advances the thesis** (S5): Shows that the year-round owner is what changes with scale.\n\n**Transition in:** `elaboration`: The four levels. → How the ownership of the practices changes from one scale stage to the next.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46b | comparison | The four levels roughly follow the four scale stages (trust the platform at Starting, protect the front door when Growing, protect the chain at Omnichannel, operate the platform at Group or as a vendor), and the table shows what each stage needs. | table: Four stages with what is typical, what becomes necessary and the warning signs of outgrowing it. |  |\n| p47 | analysis | The practices grow with the stage but what changes most is who owns them, and Kestrel & Pine ran its 2026 peak with a Growing-stage plan for an Omnichannel-stage chain. |  | `cause_effect`: What each stage needs. → The judgement: ownership is what changes most. |\n\n### In Practice: Kestrel & Pine's 2027 Peak Plan\n\n**Controlling idea** (`example`, id `practice`): Kestrel & Pine's 2027 plan applies the chapter: one unit and a forecast of 60 orders a minute with every link tested at 80, the order path through the OMS in batches, the stock loop replaced, eight switches, a freeze after the app audit, a situation room and a morning-after reconciliation.\n\n**Advances the thesis** (S2, S3, S4, S5): Shows every element of the claim committed to in one plan with dates and figures.\n\n**Transition in:** `example`: The practices and their owner at Omnichannel scale. → Kestrel & Pine's plan that applies them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | example (list) | Noor's answer to Mara is a plan approved with Waypoint in March 2027 whose spine is one unit and forecast (60 orders a minute, every link tested at 80), the order path rebuilt through the OMS, the stock loop replaced by the availability service, eight switches, a freeze after the app audit, a situation room and a reconciliation report. | case: Forecast 60 a minute for Friday 26 November 2027, tests at 80; OMS to WMS in batches within the rate limit, idempotent on the order number, alarm at ten minutes, tested at 120; availability service go/no-go 15 October; eight switches; freeze 15 November-5 December after the app audit; situation room 16:00-midnight with Noor as incident commander; reconciliation report at 08:00 Saturday; wholesale moves on 8 December. |  |\n| p49 | analysis | The plan costs about four months of one integration engineer's time, a load-testing tool and Noor's October and November, and against EUR 96,000 in one evening Mara approved it in twenty minutes. |  | `cause_effect`: The plan's spine. → What it costs against what 2026 cost. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The store looked healthy at 2,300 orders an hour because the platform's capacity is shared and cached, while the order flow, the stock loop and the warehouse took the spike alone; so the answer to Mara's question is the chain measured in one unit, queued behind a fast-recorded order, protected by a written switch-off order and reconciled by a named owner, not a faster storefront. For the part: the five chapters' cases are one finding, the platform's inside did what its vendor designed and each promise broke in the layer the merchant owns around it.\n\n**So what:** A merchant prepares the next peak by testing every link above the forecast and naming owners for the queues, the switches and the morning after; for the part, Kestrel & Pine stayed on its platform (W4) and spent on its own layer, and a reader can audit their own platform with the same five questions.\n\n**Callback:** The introduction's store that looks healthy while 2,300 orders in an hour back up behind it; and, for the part, the part opening's hosted platform that keeps accepting orders while the merchant's warehouse connector falls behind. Paragraph p53 answers the opening's healthy-looking store and Mara's question; p58, under the heading Closing Part VII, returns to the part opening and names the chapter of each case; p59 and p59b perform the part closing's so-what and take-away.\n\n**Takeaway** (`course_of_action`): For the platform you rent, list what you own around it: your deployables and the teams that release them, the spenders of each API budget in order of priority, each app's owner, scopes and the facts it writes, the scripts on your product pages against a performance budget, and the tested capacity of every link in orders per minute. Start with the link that carried least on your last peak.\n\n**Hand-off** to [Part VIII — TRUST: Security, Privacy and Regulation](part-8.html): `additional_support`: The platform's structure and limits. → Promises the merchant does not choose: protection, consent and legal duties.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | synthesis | The store, which takes about 33 orders in an ordinary hour, looked healthy at 2,300 in one hour because the shop platform's capacity is shared and its pages cached, while the order flow, the stock loop and the warehouse took the spike alone; the answer to Mara's question is therefore not a faster storefront but every link measured and tested in orders per minute, the work behind checkout queued with gauges, a switch-off order that never touches checkout, payment or the order record, and a named owner for the morning-after reconciliation. | reasoning: The opening's healthy store and Mara's question set against the chapter's answer. |  |\n| p54 | synthesis (list) | Established: the platform's multi-tenancy smooths its peak to about twice its average while a merchant's chain sees its full spike; the documented operators prepare with forecasts, above-forecast tests, fault injection, a freeze, a staffed room and a runbook; and persisting the commitment fast and queuing the rest preserves goodput, with idempotent receivers and reconciliation for the duplicates and gaps. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what the sources establish. |\n| p55 | synthesis (list) | Depends on context: a waiting room helps where the storefront is the bottleneck, one and a half times last year's peak is a fair forecast only with a stable promotion plan, and the full readiness calendar belongs to platform owners and Group-stage merchants. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p56 | recommendation (list) | The author's synthesis: measure the whole chain in orders per minute, the one unit every link, vendor and executive can read, and run the peak plan as a year-round product with one owner, with the switch-off ladder written by the revenue owners in a calm month. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p57 | recommendation (list) | Eight questions let the reader find, in their own company, the peak forecast and its owner, each link's tested capacity, the API budgets and rate limits, the queues, the switch-off order, the delivery promise, the dashboard and the incident commander, and the morning-after comparison and freeze. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own company. |\n| p58 | synthesis | Part VII opened with a hosted platform that kept accepting orders while the merchant's warehouse connector fell behind, and its five chapters' cases (the EUR 3.2 million rebuild, the order flow throttled at both ends, 41 apps with three writing stock, the 310 ms delay to a tap, the order flow at seven orders a minute against 38) each named with its chapter, look like five questions about the platform but are one: the platform's inside did what its vendor designed and the promise broke in what Kestrel & Pine owned around it. | reasoning: The part opening's platform that kept accepting orders set against the five chapters' cases. | `conclusion_summary`: This chapter's answer, the last of the part's five. → What the five chapters of Part VII say together, set against the part opening. |\n| p59 | recommendation | Kestrel & Pine therefore stayed on its platform (W4) and spent on its own layer (one integration service, the order flow first in the API budget, an owner and card per app with 34 apps and none writing stock, INP at 180 ms after a theme pass, a peak plan tested at 80 orders a minute with eight owned switches and a reconciliation report). | case: W4; one integration service with a module per flow; order flow first in the API budget, batches to the WMS; app governance card per app, 34 apps by July 2027, no app writing stock; INP 180 ms by June 2027; the 2027 peak plan. | `problem_solution`: The one finding behind the five cases. → The remedies in the merchant's own layer. |\n| p59b | recommendation | A reader can audit the platform they rent the same way: list the deployables and the teams that release them, the spenders of each API budget in order of priority, each app's owner, scopes and facts written, the scripts on product pages against a performance budget, and the tested capacity of every link in orders per minute, starting with the link that carried least on the last peak. |  | `cause_effect`: Kestrel & Pine's remedies in its own layer. → The same audit for the reader's own platform. |\n| p60 | transition | Part VII has shown the platform's structure and limits and the layer the merchant owns around them; that layer must also keep promises the merchant does not choose, imposed from outside by attackers, privacy law and regulation, which Part VIII takes up. |  | `additional_support`: The platform's structure and limits. → Promises the merchant does not choose: protection, consent and legal duties. |\n\n## Non-goals\n\n- The hour-by-hour narrative of 23-29 November 2026, the switch table with owners and triggers, the runbook and the rehearsal. See [Journey 4: Black Friday, Hour by Hour](journey-peak-day.html).\n- Available-to-promise, reservations, buffers and the availability service. See [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html).\n- Rate limits as a tenancy tool, the API-budget analysis and pods. See [Many Merchants, One Platform: Multi-Tenancy, Pods and Isolation](multi-tenancy-and-isolation.html).\n- Idempotency keys, outbox, dead-letter mechanics, retries with jitter and the reconciliation card. See [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html).\n- Waves, cut-offs and warehouse capacity; the computed delivery promise. See [Pick, Pack, Ship: Warehouse Management and Fulfillment](warehouse-and-fulfillment.html), [Getting It There: Carriers, Labels, Tracking and the Delivery Promise](shipping-and-delivery.html).\n- Storefront caching and edge delivery in depth; checkout's internal protection and payment flows. See [Delivering the Storefront: Themes, Headless, Rendering and Performance](storefront-architecture.html), [From Cart to Confirmation: Checkout Orchestration](cart-and-checkout.html), [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html).\n- Card testing and bot traffic at peak. See [Protecting the Shop: Card Data, Account Takeover, Bots and Skimmers](commerce-security.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- After the confirming round 3 (escalate) and its closing fixes, these points remain, all recorded for the author and none changed further without another check: p14 carries both the storefront's cache rule and the stock-badge rule (outliner marked two ideas; spec merged them after round 1); the 'Established' list credits 'Shopify and Stripe documentation' for at-least-once delivery while the body cites Stripe only for rate limits (author's text, kept under rule 2); the requirements table uses 'at-least-once' before p31 glosses it and never explains 'Eventual'/'Strong' consistency; the introduction states the claim in KEY POINTS, p04 and the roadmap (p04 shortened in round 2; one reader still found it repetitive); one reader found the operator-figures paragraph dense and the Adobe figure unused; the 2027 plan mixes past-tense dates with a plan approved in March 2027.\n- Needs the author (rule 12): the chapter cites Shopify's 2018 changelog for decoupling payment from order creation and says the present-day checkout throttle is not publicly described; the fact needed is whether Shopify has since published a first-party description, in which case the paragraph is updated and dated. (from spec.md)\n\n## Decision log\n\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: the open questions carried from spec.md and the flow-rubric notes not taken are closed. The degradation ladder's order stays the author's judgement (rule 10); the oversell splits of sibling chapters are not used in this chapter, which states only the ledger's totals (rule 1); the introduction now has its thesis paragraph and roadmap and the conclusion its answer to the opening and Part VII's closing (units added); rubric notes not taken (merge p01 with p03, cut p12, fold 'Across Scale Stages' into 'The Choices', trim the take-away lists) keep the current position (rule 10; rule 8 for the house heading). Rejected: Leaving them open for the author.\n- **2026-11-07** — Framed the chapter around 'the platform's peak is not the merchant's peak' rather than around platform scaling, because the reader is a merchant-side newcomer and the evidence (Shopify's 4:1 edge ratio and 2x peak-to-average) supports it; platform-owner practices are marked as belonging to the fourth posture and the Group stage. (from spec.md) Rejected: A chapter about platform scaling.\n- **2026-11-07** — Chose orders per minute as the single unit throughout (tables, SLOs, dashboard, forecast), and rejected requests per second because the merchant's bottleneck links (WMS, ERP, carriers) cannot be measured in it. (from spec.md) Rejected: Requests per second.\n- **2026-11-07** — Summarized Kestrel & Pine's 2026 evening in one section and moved the timeline, the sequence diagram, the switch table and the runbook to Journey 4, so the two chapters do not duplicate. (from spec.md) Rejected: Repeating the hour-by-hour account h <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
