<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/26-api-contracts-and-versioning/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (a thesis paragraph p05, a roadmap p06 and a conclusion paragraph that answers the opening p55); see decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The four parts of an API contract (shape, meaning, timing, lifetime), how each breaks, and the machine-readable formats contracts are written in (OpenAPI, AsyncAPI, JSON Schema, CloudEvents).\n- **Know:** Additive change with tolerant readers (Google AIP-180, Zalando's rules), the three ways to version (dated, as Shopify and Stripe do; semantic; in the media type), and deprecation as a date pair with monitoring and consent (RFC 9745, RFC 8594, Zalando's rules).\n- **Know:** What Shopify and Stripe document about their webhooks: at-least-once, unordered, retried, signed, and in Shopify's case deleted after eight consecutive failed deliveries.\n- **Believe:** A consumer cannot prevent a vendor's change; it can know which version each flow pins, when that version expires, and who acts on the notice.\n- **Believe:** A 'deprecated' label without a date is a warning, not a deprecation.\n- **Believe:** A webhook is a signed hint, not a ledger.\n- **Be able to:** For any integration, say which version it pins, when that version expires, who owns the upgrade, and whether its webhook receiver verifies, deduplicates and sweeps.\n- **Be able to:** Write a contract card for a flow, and, as a provider, change an API by adding and retire a version by an announced date pair.\n\n**Audience:** Readers new to commerce architecture; most of all the integration engineer and the application support specialist who inherit scripts and connectors (Ruben Alves's position), and next the engineering lead who negotiates vendor contracts and the product manager who owns a marketplace channel and needs the questions to ask.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its thirteen systems and 34 integrations, its 2026 and January 2027 incidents in outline and the names of the sixteen failure patterns.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines, 'system', 'the shop platform' and 'commerce platform', business models and the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- Parts II to V: one owner per product, price, discount and stock fact; available-to-promise; checkout creating the order once; refunds as new payments; one order record with three status lines; one invoice per shipment and the monthly match; the WMS as the only writer of on-hand stock; the marketplace connector that owns nothing; the ERP receiving orders, shipments and payments by batch; one source per EDI document.\n- From the earlier chapters of Part VI: integration styles and triggers, the iPaaS and the integration inventory with an owner per flow (integration-styles); at-least-once delivery, the idempotency key, the outbox or webhook plus sweep, retries with backoff and the dead-letter queue, compensation and the reconciliation job (events-consistency-and-reconciliation).\n\n**Does not yet know:**\n\n- API contract and its four parts; OpenAPI, AsyncAPI, JSON Schema and CloudEvents.\n- Additive change, breaking change and the tolerant reader.\n- Versioning: dated, semantic and media-type versions; pinning; Shopify's fall-forward rule.\n- Deprecation and sunset; the Deprecation and Sunset headers; RFC and IETF.\n- HMAC signatures, replay tolerance and the Standard Webhooks headers.\n- Rate limits and cost points; consumer-driven contracts and Pact; the contract card.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a script that stopped when a vendor retired an API version, the reader names what failed and the consumer-side record that prevents it, not a different connector. *Probe:* A script written in 2021 pushes stock to one marketplace through a connector's API, with the API version fixed in its code. The connector announces in November that the version retires on a Monday in February, by e-mail to a developer who has since left the agency. The script logs the errors and tries again every hour; two days later the marketplace escalates canceled orders. Using only this chapter: what failed, and what would have prevented it? | `custom` | cold_reader | major |\n| AC-2 | Given four changes to an API, the reader says which are safe without a new version and what consumers must do for additions to be safe. *Probe:* Using only this chapter: which of these changes can a provider make without a new version, and what must consumers do for the safe ones to stay safe: adding an optional field; renaming a field; changing 'available' from physical stock to available-to-promise; adding a new value to a list of allowed values? | `custom` | cold_reader | major |\n| AC-3 | The reader can say what a webhook receiver must do. *Probe:* Using only this chapter: your system receives order webhooks from a commerce platform. What must the receiver do, and why? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How do you change a system other systems depend on without breaking them, and how does a merchant keep working when the systems it depends on change?\n\n> **Claim:** Write the contract down: what the system accepts and returns, what each value means, its rate limits and timeouts, and until when. A provider changes it only by adding what consumers can ignore, versions removals, renames and changes of meaning, and announces a deprecation date and a later sunset date while monitoring who still calls. A consumer records each pinned version, its sunset date and an owner, and verifies, deduplicates and periodically re-fetches webhook data.\n\n**Disputed by:** The view that API change is the vendor's problem: the vendor's connector or the integration platform keeps integrations working, deprecation notices reach whoever needs them, and webhooks are a reliable record of what happened.\n\n**So what:** A merchant that accepts the claim adds two columns to its integration inventory (the pinned version and its sunset date), reads vendor changelogs from a role mailbox, and, when it becomes a provider itself, publishes its contract, changes it by adding and watches who still calls a version before turning it off. Kestrel & Pine learned this from a 2021 agency script that pushed stock to the bol marketplace with its connector API version fixed in code. The connector retired that version on Monday 8 February 2027, after announcing it in November 2026 to a contact who had left the agency in 2025; the script logged errors and kept running, bol showed Monday's stock for two days, and the failure was found on 10 February through bol's escalation about canceled orders. From March 2027 every inventory row carries both columns, and no new flow goes live on a version with less than six months of support.\n\n**How and why:** Providers must change to add features and fix faults, and their consumers upgrade on their own schedules. A consumer written to ignore unknown fields survives additions, so only removals, renames and changes of meaning need a new version. Breakage also comes from the parts of a contract that are rarely written down: a call limit lowered at peak, a retry window changed, or a version whose end date the provider chose. A consumer therefore stays safe only while it knows which version each flow pins, when it expires and who reads the notice. Webhooks are retried and reordered by design, and an unsigned request can be forged, so a receiver that checks the signature, ignores a delivery id it has seen and fetches what it missed stays correct when deliveries are lost or repeated.\n\n**Supporting claims**\n\n- **S1** — A contract has four parts, shape, meaning, timing and lifetime, and each breaks in its own way; written in a machine-readable format it can be compared version by version, its guarantees differ per flow, its timing clauses include rate limits that decide whether a flow can finish, and a merchant holds it both as a consumer of vendors' contracts and as a provider of its own.\n- **S2** — A provider changes a contract by adding what tolerant consumers can ignore; removals, renames and changes of meaning need a new version (dated, semantic or in the media type), and the consumer pins the version it relies on and puts the upgrade on a calendar.\n- **S3** — A deprecation is a date pair, announced and then sunset, with monitoring of who still calls and the consumers' consent; on the consuming side it becomes two columns of the integration inventory (the pinned version and its sunset date), a role mailbox for vendor notices and a calendar entry assigned to the flow's owner.\n- **S4** — Webhooks are delivered at least once, unordered and signed, so the receiver verifies the signature, stores a delivery before acknowledging it, deduplicates, and runs a periodic sweep for what was never delivered.\n- **S5** — Every contract needs an owner: the provider team inside a company; with a vendor, a notice period in the commercial contract, the inventory row and a sandbox test of each new version; per flow the merchant pins and schedules, floats or delegates, and the contract card records the choice.\n\n## Role in the part\n\nGives the part its contracts: the four parts of a contract, additive change and dated deprecation on the provider's side, the pinned version and sunset date with an owner on the consumer's side (two columns added to the integration inventory), the contract card, and webhooks as signed hints to verify, deduplicate and sweep. Supports P6-3, P6-2 of part `part-6`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene and contract: the retired version that stopped the bol stock push, then what a contract promises and which of its parts the incident broke; `grouping` in changing, versioning and deprecation: how a provider changes a contract, from the change that needs no version to the version that is retired; `comparison` in trade-offs and stages)\n\nThe Deprecated Endpoint comes first so that every term arrives as part of the answer to why a working script stopped. The four parts of a contract come next because every later section treats one of them: change and versioning treat shape and meaning, deprecation and rate limits treat lifetime and timing for the calls a merchant makes, webhooks treat the messages it receives. Additive change precedes versioning because a version is needed only for the changes additions cannot make, and versioning precedes deprecation because only a named version can be retired on a date. Rate limits follow deprecation so that all clauses about outgoing calls sit together; webhooks follow because their receiver rules rely on the previous chapter's deduplication and sweep and their payload versions on the versioning section. Ownership asks who keeps all these contracts, ending with partners'. The trade-offs and stages compare the consumer's options once ownership is defined; In Practice applies them to the bol stock flow; the failures come last because each is read against a part of the contract or a rule already given. Webhooks before rate limits would split the outgoing-call clauses; trade-offs before ownership would offer postures with no one to choose them; the failures before In Practice would list symptoms without the card that catches them; versioning before additive change would teach versions for changes that need none; deprecation first would retire versions the reader cannot name.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A connector keeps sending the same requests while the platform it calls changes; if the platform stops accepting a field or changes what a response means, stock stops reaching a marketplace, or orders the warehouse, although nobody changed the connector.\n\n**Bridge:** The previous chapter made a flow safe against messages that repeat, arrive late or go missing; the reader knows how a receiver survives an unreliable delivery. → Those mechanisms assume the other side keeps its interface, so the question becomes how a system other systems depend on can change without breaking them, and how a merchant keeps working when its vendors change theirs.\n\n**Thesis statement** (KEY POINTS callout and paragraph p05): Write the contract down: what the system accepts and returns, what each value means, its call limits and timeouts, and until when. A provider changes it only by adding what consumers can ignore, gives removals, renames and changes of meaning a new version, and retires an old version on two announced dates while watching who still calls. A consumer records which version each flow uses, when that version ends and who will act, and checks the notifications it receives against the sender's records.\n\n**Roadmap** (Paragraph p06):\n\n- Start from the Deprecated Endpoint, Kestrel & Pine's February 2027 incident. *Kept in:* scene.\n- Say what a contract promises and how its guarantees differ per flow. *Kept in:* contract.\n- Show how a provider changes a contract: by adding, by versioning, and by retiring a version on announced dates, which adds two columns to the integration inventory. *Kept in:* changing, versioning, deprecation.\n- Cover rate limits, how to receive webhooks safely, and who owns a contract, including partners'. *Kept in:* rate-limits, webhooks, ownership.\n- Weigh the consumer's choices and the scale stages, show the contract card for the bol stock flow, and end with what goes wrong. *Kept in:* trade-offs, stages, in-practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | The previous chapter's mechanisms protect a flow against messages that repeat, arrive late or go missing, but not against the other side changing: a connector can keep sending the same requests while the platform it calls stops accepting a field or changes what a response means, so stock stops reaching a marketplace, or orders the warehouse, although nobody changed the connector, and preventing that needs an agreement about the interface and how it will evolve. | scenario: A connector whose unchanged requests fail after the platform it calls changes. |  |\n| p02 | definition | An application programming interface (API) defines how one program asks another for data or action, and its contract covers accepted fields, meanings, responses and failure behavior; a managed transition lets the provider add features and fix problems while consumers get time to adapt. |  | `elaboration`: The agreement about an interface and how it evolves. → The names API and contract, and why both sides need a managed transition. |\n| p03 | context | Kestrel & Pine consumes vendor contracts in most of its 34 integrations (the shop platform, the payment provider, carriers, the returns portal and the marketplace connector) and provides interfaces to its agency and trading partners, so it must track vendor deadlines and give its own consumers notice. | fact: 34 integrations; vendors named by role; the agency and trading partners as consumers. | `example`: What a contract covers and why transitions must be managed. → Kestrel & Pine as both consumer and provider. |\n| p04 | context | In the order's journey, Eva's jacket reaches the warehouse through a platform notification, her return uses a portal API and marketplace stock uses another API, so every exchange depends on a contract that can expire; the previous two chapters covered how systems talk and how messages are recovered. |  | `example`: Kestrel & Pine's contracts as consumer and provider. → The exchanges of Eva's order that depend on contracts. |\n| p05 | claim | Keeping contracts working has two halves: the provider writes the contract down, changes it only by adding and retires old versions on dates announced in advance while watching who still calls; the consumer writes down which version each flow uses, when it ends and who acts, and checks the notifications it receives against the sender's records. |  | `cause_effect`: Every exchange depends on a contract that can expire. → The thesis, split into the provider's and the consumer's obligations. |\n| p06 | transition | The chapter starts from the Deprecated Endpoint, says what a contract promises, shows how a provider changes a contract by adding, versioning and retiring on announced dates (which adds two columns to the integration inventory), covers rate limits, webhooks and who owns a contract, weighs the consumer's choices and the scale stages, shows the contract card for the bol stock flow and ends with what goes wrong; the evidence is the incident, Shopify's and Stripe's documentation and Google's and Zalando's published API rules. |  | `sequence`: The chapter's answer in two halves. → The order of the chapter and its kinds of evidence. |\n\n## Sections\n\n### Setting the Scene: The Deprecated Endpoint\n\n**Controlling idea** (`example`, id `scene`): In February 2027 a retired API version stopped the bol stock push for two days because nobody owned the contract's lifetime on the consuming side.\n\n**Advances the thesis** (S3, S5): Gives the case the chapter answers: a provider that kept its promise and a consumer with no owner for the version's end date.\n\n**Transition in:** `example`: The roadmap, which starts from the Deprecated Endpoint. → The incident itself.\n\n**Order of paragraphs** (`chronological`): The escalation comes first because that is how the failure was found; the script's history and the retirement explain it, the two days of stale stock show its cost, and the lesson and W5's answer come last because they depend on all three.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | description | On 10 February 2027 Milan Petrov receives a bol escalation about canceled jacket and fleece orders, and Ruben Alves finds that the stock update script stopped working on Monday. | case: The bol seller-support escalation on Wednesday 10 February 2027. |  |\n| p08 | cause_effect | The agency wrote the script in 2021 with its API version fixed in code, and the connector retired that version on 8 February 2027 after publishing the date in November and e-mailing a technical contact who had left the agency in 2025. | fact: 2021 script; version fixed in code; retirement Monday 8 February 2027; announced November 2026; contact left in 2025. | `cause_effect`: The script that stopped on Monday. → Why it stopped: a version fixed in 2021 and retired on a published date. |\n| p09 | description | Every later call returned an error that the script logged and retried hourly, so for two days bol showed Monday's stock. | fact: Two days of stale stock on bol. | `time`: The retirement on Monday. → What the script did from then on and what bol showed. |\n| p10 | analysis | The provider followed its published schedule while the consumer had no owner tracking it, so a deprecation notice is useful only if someone acts on it (The Pulled Rug); Noor Visser adds pinned versions and retirement dates, alongside a named owner, to the contracts W5 (Waypoint's integration standards) requires. |  | `conclusion_summary`: The two days of stale stock. → The lesson and W5's answer. |\n\n### What a Contract Promises\n\n**Controlling idea** (`definition`, id `contract`): An API contract states shape, meaning, timing and lifetime, is written down so versions can be compared, binds the merchant as consumer and as provider, and must say different things for different flows.\n\n**Advances the thesis** (S1): Defines the four parts every later section treats and the per-flow requirements the contract card records.\n\n**Transition in:** `problem_solution`: A notice nobody acted on and W5's contracts. → What such a contract contains.\n\n**Order of paragraphs** (`large_to_small`): The definition and its four parts come first because the other paragraphs use them; why the unwritten three matter follows the table; the formats explain how a contract is written down; the two roles say who holds it; the per-flow table and its two rows bring the definition down to the flows the chapter follows.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | An API contract is the written description of what a system promises to accept and return, including errors, call limits and how long all of that stays true; it lets two parties build against each other without reading each other's code, and it has four parts that each break in their own way. | table: Shape, meaning, timing and lifetime, with what each covers, how it breaks and an example from the chapter. |  |\n| p12 | analysis | Shape is the part people write down, while meaning, timing and lifetime are where incidents come from, so a contract that documents only fields is incomplete. | analogy: A lease that names the apartment but not the rent or the end date.; figure: Figure 1: a contract with only the shape section filled in. | `emphasis`: The four parts in the table. → Which of them are usually missing. |\n| p13 | explanation | Contracts are written in machine-readable formats (OpenAPI, AsyncAPI, JSON Schema, CloudEvents) so tools can check them, and a written contract can be compared between versions, which is the only reliable way to know whether an integration is affected. | source: OpenAPI 3.2.1 (September 2026), AsyncAPI 3.0.0 (December 2023), JSON Schema 2020-12, CloudEvents. | `cause_effect`: Most of a contract goes unwritten. → The formats for writing it down and why writing it down matters. |\n| p14 | comparison | A merchant is on both sides: as a consumer it must know which version each integration uses and when it expires and test the next one before the old one disappears; as a provider it owes its consumers a published document, additive change and a dated, monitored deprecation, a role that grows when the OMS exposes order status. | example: The OMS (bought under W2, the single record of every order) exposing order status to the agency, the returns portal and a later shopper-facing agent. | `elaboration`: Written contracts that can be compared. → Who holds them: the merchant as consumer and as provider. |\n| p15 | comparison | Not every contract needs the same guarantees, and the illustrative requirements table shows four flows that differ in freshness, consistency, speed and what the contract must say. | table: Order webhook to the WMS, stock push to the marketplace connector, availability check at checkout, order status from the OMS, each with direction, freshness, consistency, speed and contract content (figures illustrative). | `elaboration`: The obligations of consumer and provider. → How they differ by flow. |\n| p16 | transition | Two rows carry the chapter: the order webhook needs the receiving discipline of the webhook section and the stock push needs the version discipline of the next three sections, and the Deprecated Endpoint was that stock-push flow with no contract card, the one-page record of a flow's contract that W5 requires and the chapter shows at its end. |  | `emphasis`: The four flows in the table. → The two the chapter follows and where each is treated. |\n\n### Changing Without Breaking\n\n**Controlling idea** (`explanation`, id `changing`): A provider that only adds, and consumers that ignore what they do not know, can change a contract with no version at all; versions are needed only for what additions cannot fix.\n\n**Advances the thesis** (S2): States the rule for change that needs no version and its limit.\n\n**Transition in:** `problem_solution`: The stock push's need for version discipline. → The cheapest discipline: changes that need no version.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The claim that most change needs no version comes first, Google's and Zalando's rules support it, the combined rule states it plainly, and its limit hands on to versioning; the limit must come last because it is what the next section answers.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | claim | The cheapest way to version an API is not to: if every change is one a consumer written against the old shape can survive, nothing needs retiring, and two published rule sets define what is survivable. |  |  |\n| p18 | evidence | Google's AIP-180 says a minor or patch release must not break existing client code, allows adding optional fields, enumeration values and methods, and classes removing, renaming, retyping or changing defaults or behavior as breaking. | quotation: AIP-180 (created July 2019, updated October 2025): existing client code 'must not be broken'; changing a field's type 'even to a wire-compatible type' is breaking. | `example`: Two rule sets define survivable change. → The first: Google's. |\n| p19 | evidence | Zalando's API Guidelines make the same rules mandatory (#106 to #108, #113), and rule #108 is the consumer's half: a tolerant reader ignores fields it does not know and does not fail on a list value it does not recognize, so the provider can add fields and values without asking anyone. | quotation: Zalando rules #106 MUST not break backward compatibility, #107 SHOULD prefer compatible extensions, #108 MUST prepare clients to accept compatible extensions, #113 SHOULD avoid versioning (changelog to 16 March 2026). | `similarity`: Google's rules. → Zalando's matching rules and the tolerant reader. |\n| p20 | synthesis | Together the rules give the workhorse of API change in commerce, the provider only adds and the consumer ignores what it does not understand, so most of a platform's quarterly change goes unnoticed by a tolerant consumer. |  | `conclusion_summary`: The provider's and the consumer's rules. → The combined rule in one line. |\n| p21 | counterargument | Additive change cannot fix a field whose meaning was wrong or a whole generation of an API built on a different model, such as Shopify's REST Admin API declared legacy in 2024, and for those you need versions. | fact: Shopify's REST Admin API 'a legacy API as of October 1, 2024'; new public apps GraphQL-only from 1 April 2025. | `contrast`: Additive change as the default. → Its limit, which versions address. |\n\n### Versioning: Dated, Semantic or in the Media Type\n\n**Controlling idea** (`comparison`, id `versioning`): Versioning names generations of a contract in one of three ways; whichever a vendor uses, the consumer must pin the version and calendar the upgrade, because an expired version either fails loudly or is silently answered by a newer one.\n\n**Advances the thesis** (S2): Sets out the versioning strategies and derives the consumer's two obligations.\n\n**Transition in:** `problem_solution`: Change too large to make by adding. → Versions, and the three ways to name them.\n\n**Order of paragraphs** (`comparison`): The definition comes first; dated versions follow because the chapter's vendors use them, with Shopify's window, its fall-forward rule and the bol script's loud failure kept together so the reader sees what an expired version does while Shopify is in view; Stripe follows as a different promise on the same idea; semantic and media-type versions complete the three strategies; the table compares them with additive change; the author's reading closes with the consumer's obligations, which need the comparison. Putting fall-forward after the table would separate it from the Shopify paragraph it qualifies.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | definition | Versioning is naming generations of a contract so that a consumer can say which one it relies on, and three strategies are in common use. |  |  |\n| p23 | example | Dated versions name each version by a date that the consumer states on every call, and Shopify's quarterly versions, each supported for at least twelve months with nine months of overlap and stated in the URL, are the clearest public example. | quotation: Shopify releases 'a new API version every three months at 5pm UTC on the first day of the quarter'; latest stable 2026-10, accessible until 16 October 2027; 'Each stable version is supported for a minimum of 12 months'; 'Deprecated fields or types are removed in a subsequent release'. | `example`: Three strategies. → The first, dated versions, with Shopify. |\n| p27 | explanation | Shopify's fall-forward rule answers a call to an inaccessible version with the oldest accessible version instead of an error, which is kinder than failing and more dangerous because it is silent. | quotation: 'If your app targets an inaccessible version, Shopify falls forward and responds using the oldest accessible stable version'. | `elaboration`: Shopify's dated versions and their support window. → What happens when a call names a version past that window: the fall-forward rule. |\n| p29 | analysis | The connector in the Deprecated Endpoint failed loudly with an error, while a fall-forward would have kept the script running against a changed contract, the quiet version of the same incident. |  | `contrast`: Shopify's silent fall-forward. → The loud failure the bol script met. |\n| p24 | example | Stripe also uses dates but pins each account to its first version, lets callers override it per request and keeps old versions working through version change modules; since 2024 it ships monthly non-breaking versions and two major releases a year. | source: Brandur Leach, Stripe, 2017: account pinning, the Stripe-Version header, version change modules, compatibility with every version since 2011; Stripe 2024 release process; current version 2026-10-28.endive. | `contrast`: Shopify's forced window and what an expired version does there. → Stripe's different support promise on the same dated idea. |\n| p25 | definition | Semantic versions use major.minor.patch numbers in which only a major change may break consumers, the convention for software libraries that Stripe applies to its SDKs. |  | `sequence`: Dated versions at Shopify and Stripe. → The second strategy. |\n| p26 | comparison | Media-type versioning carries the version in the Accept header, which Zalando requires because a resource's address should not change when its representation does. |  | `sequence`: Semantic versions. → The third strategy. |\n| p26a | comparison | The comparison table sets the three strategies beside additive change and splits dated versions by whether consumers may stay, so that each row says who has to move when the contract changes. | table: Additive only, dated with forced upgrade, dated with consumers allowed to stay, media type, semantic: where the version lives, who moves, a public example and when each fits. | `conclusion_summary`: Three strategies described one by one. → The comparison of all of them with additive change. |\n| p30 | recommendation | In the author's reading Shopify and Stripe offer the same contract with a different default, and for a merchant both mean two obligations: pin the version explicitly and put the upgrade on a calendar, because a merchant that pins nothing is on the vendor's changing default. |  | `conclusion_summary`: The strategies compared in the table, and the loud and quiet failure of an expired dated version. → What both dated models require of the consumer. |\n\n### Deprecation: A Date Pair, Monitoring and Consent\n\n**Controlling idea** (`explanation`, id `deprecation`): A deprecation is an announced date and a later sunset date, kept by a provider that monitors use and obtains consent and by a consumer that records the dates in the integration inventory and acts on them.\n\n**Advances the thesis** (S3): Defines the date pair, the provider's duties and the two inventory columns on the consuming side.\n\n**Transition in:** `cause_effect`: Pin the version and calendar the upgrade. → The dates that go on the calendar.\n\n**Order of paragraphs** (`grouping`): The definition and the standard headers come first; the provider's duties follow because they extend the headers; the consumer's half comes last because it is the half the merchant controls and the one the Deprecated Endpoint lacked.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | definition | Deprecation is the announced, dated withdrawal of part of a contract and the sunset is the date it stops working; RFC 9745 and RFC 8594 define headers for the two dates, so 'deprecated' alone is a warning and 'deprecated on this date, gone on that date' is a deprecation. | quotation: RFC 9745 (IETF, 2025) Deprecation header; RFC 8594 Sunset header, whose date 'MUST NOT be earlier than the one given in the Deprecation header field'; a deprecation with no Sunset 'doesn't imply the resource will go offline'. |  |\n| p32 | evidence | Zalando's rules show what a provider owes beyond the headers: the consumers' consent to a sunset date, the date and migration guidance in the specification, monitoring of who still calls, the headers, and no new use of deprecated APIs. Together they make the date pair enforceable: a version is switched off only after the provider has seen who still calls and they have agreed, which is where the provider's and the consumer's timelines must meet. | quotation: Rules #185, #187, #188, #189, #191.; figure: Figure 2: the provider's and the consumer's timelines must meet before the sunset date. | `elaboration`: The two dates. → The provider's duties around them. |\n| p33 | recommendation | The consumer's half is small: the integration inventory from the integration-styles chapter gains two columns, the pinned version and its sunset date, the vendor's changelog is read monthly from a role mailbox, and each sunset date becomes a calendar entry three months ahead assigned to the flow's owner; Kestrel & Pine adds that no new flow goes live against a version with less than six months of published support. | fact: Shopify's app requirements: 'apps using APIs that will be deprecated within 90 days can't be submitted'.; fact: From March 2027 every inventory row carries the pinned version and sunset date; changelogs go to a role mailbox read monthly; no new flow on a version with less than six months of support. | `contrast`: What a provider owes. → What the consuming merchant controls. |\n\n### Rate Limits\n\n**Controlling idea** (`explanation`, id `rate-limits`): Rate limits are timing clauses that decide whether a flow can finish within its schedule.\n\n**Advances the thesis** (S1): Completes the timing part of the contract.\n\n**Transition in:** `additional_support`: The pinned version and its sunset date: until when a consumer may call. → A second timing clause: how often it may call.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The definition comes first, the published limits are the evidence, the arithmetic and the shared bucket are the reasoning about what they mean for Kestrel & Pine.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | definition | A version's sunset date says until when a consumer may call and a rate limit says how often: the maximum number or cost of calls in a period, above which the provider answers with an error, a timing clause that decides whether an integration can finish before its next run. |  |  |\n| p42 | evidence | Shopify meters its GraphQL Admin API in cost points refilled per second by plan, with a mutation costing 10 points and a 1,000-point query maximum, and Stripe limits live mode to 100 requests per second per account and 25 per endpoint. | statistic: 100/200/1,000/2,000 points per second by plan; object 1 point, mutation 10; query maximum 1,000; Stripe 100 per second per account, 25 per endpoint, 429 response. | `example`: What a rate limit is. → Two vendors' published limits. |\n| p43 | analysis | Applied as an illustration to Kestrel & Pine's roughly 17,000 active variants, a stock push of one mutation each needs about 28 minutes at 100 points per second, so batch operations are a necessity and the contract card records the expected call rate; and because limits are shared by every app on a store, a chatty app can starve the WMS connector at peak. | reasoning: 17,000 x 10 = 170,000 points; 28 minutes at 100 points per second, under three at 1,000 (illustration). | `cause_effect`: Published limits. → What they mean for an hourly stock push and for shared buckets. |\n\n### Webhooks Done Well\n\n**Controlling idea** (`explanation`, id `webhooks`): The best-documented providers say their webhooks can be missed, duplicated and reordered, so the receiver verifies, stores before acknowledging, deduplicates and sweeps, using the previous chapter's mechanisms.\n\n**Advances the thesis** (S4): Shows from vendors' own words that a webhook is a signed hint and gives the receiver's rules.\n\n**Transition in:** `contrast`: Versions, sunset dates and rate limits for the calls a merchant makes. → The contracts of messages that travel the other way.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The bridge and definition come first; Shopify, Stripe and Standard Webhooks are the evidence, compared in a table; the reading of the table states what holds for every provider; the receiver's rules follow from it; Shopify's subscription-version detail comes last because it ties the section back to versioning without interrupting the delivery evidence.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | definition | Versions, sunset dates and rate limits govern the calls a merchant makes, but many messages travel the other way: a webhook is an HTTP request the source system sends to a registered URL when something happens, the most common way a hosted platform reports change and the mechanism most often trusted beyond what it promises. |  |  |\n| p35 | evidence | Shopify documents that delivery is not guaranteed, that ordering is not guaranteed, that apps should run reconciliation jobs, that it retries eight times over four hours and deletes an API-created subscription after eight consecutive failures, and that the same webhook may arrive more than once. | quotation: 'Webhook delivery isn't always guaranteed'; 'doesn't guarantee ordering'; 'use reconciliation jobs'; 'retries 8 times over the next 4 hours'; 'After 8 consecutive failures, the subscription is automatically deleted'; 'your app might receive the same webhook more than once'. | `example`: Webhooks trusted beyond their promise. → What the first provider promises. |\n| p36 | evidence | Stripe documents three days of retries, no ordering, occasional duplicates and a fast success answer before business logic, and signs with an HMAC over a timestamp and the payload with a five-minute replay tolerance. | quotation: 'up to three days with an exponential back off'; 'doesn't guarantee the delivery of events in the order'; 'might occasionally receive the same event more than once'; 'quickly return a successful status code (2xx) before any complex logic'. | `similarity`: Shopify's webhook statements. → Stripe's matching statements. |\n| p37 | evidence | The Standard Webhooks specification generalizes the pattern into three headers and tells consumers to use the webhook id as an idempotency key, and the table compares the three on signature, replay, duplicate key, retries, ordering and response time. | table: Shopify, Stripe and Standard Webhooks compared on six properties. | `similarity`: Two providers' statements. → The vendor-neutral standard and the comparison. |\n| p38 | analysis | Read as a contract, the table says delivery is at least once at best, order is not promised, the signature is the only proof of origin and the receiver owns deduplication and a periodic sweep, so the receiving design is the same for every provider. | figure: Figure 3: a receiver that verifies, stores, answers fast and processes later, with deduplication and a nightly sweep. | `conclusion_summary`: The comparison table. → What it means for every receiver. |\n| p39 | recommendation (list) | Because notifications reduce delay and only a comparison job checks completeness, four rules make webhook delivery manageable: authenticate the delivery, store it before acknowledging it, deduplicate both the delivery and the business action, and compare periodically with the provider's records, the last two as the previous chapter describes. |  | `cause_effect`: The same receiving design for every provider. → Its four rules. |\n| p35a | explanation | One more Shopify detail ties webhooks back to versioning: payloads (the message bodies) follow the version of the subscription (the registration that asks for a kind of event) that created them, so an old subscription keeps sending old-shaped payloads after the app's other calls have moved on and belongs in the version column too. |  | `additional_support`: The four receiver rules. → A versioning detail of the same webhooks. |\n\n### Who Owns a Contract\n\n**Controlling idea** (`explanation`, id `ownership`): Every contract needs an owner: inside a company the provider team; with a vendor, a notice period in the commercial contract, the inventory row and a consumer test, because consumer-driven contracts stop at the vendor's schema; partners' contracts need the same.\n\n**Advances the thesis** (S5): Says who keeps each contract the chapter has described.\n\n**Transition in:** `cause_effect`: The contract clauses described so far. → Who keeps each contract.\n\n**Order of paragraphs** (`large_to_small`): The provider team's ownership inside a company comes first, then the 'only door' rule, which the next paragraph applies to vendors; the three parts of vendor ownership are the merchant's case; consumer-driven contracts show where the in-house idea stops with a vendor; partners close the section because the same records apply to them, which would be unexplained before vendor ownership is set out.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | claim | A contract needs an owner, and inside a company that is the provider team, which publishes the document, keeps the compatibility rules, announces deprecations and monitors use, as Zalando's API First practice and API Guild show. | quotation: Zalando Engineering 2015: a guild of about twenty, 'a sounding board and review resource, not an approval board', 'We cannot afford to break our APIs'.; quotation: InfoQ 2016: 'We see API definitions as a source truth, part of a contract between a service provider and consumers'. |  |\n| p45a | claim | The often-told Amazon mandate, known only from Steve Yegge's 2011 recollection, gives the useful rule that the contract is the only door into another team's data. | quotation: Yegge 2011: 'no direct reads of another team's data store', not confirmed by Amazon. | `additional_support`: The provider team as owner. → The rule that every access goes through the contract. |\n| p46 | recommendation | For a merchant of Kestrel & Pine's size the rule applies to vendors first: integrations use a vendor's documented API and never read the ERP's database or scrape an admin page, because an undocumented path has no contract and no deprecation notice. |  | `elaboration`: The contract is the only door. → What the rule means for a merchant's vendors. |\n| p47 | process | With vendors, ownership has three parts: a commercial contract that names a minimum notice period and a role as technical contact, the inventory row with the pinned version and sunset date, and a consumer test against the vendor's sandbox for each new version. |  | `elaboration`: Integrations only through documented vendor APIs. → The three records that make a vendor contract owned. |\n| p48 | comparison | Consumer-driven contracts, in which a provider's contract follows what its consumers use and Pact verifies the provider against the consumers' tests, work between services inside one company, while with a SaaS vendor the vendor's schema is the contract and the sandbox test is as far as the idea goes. | source: Ian Robinson, 2006; Pact documentation, August 2026. | `contrast`: The consumer test against a vendor's sandbox. → The fuller in-house version of that test and its limit. |\n| p44 | example | Partner APIs exposed by a marketplace, a carrier or a wholesale customer are contracts too, with the same four parts and usually thinner documents, so they need the same owner and records; the ASN Chargeback was a shape-and-meaning failure of the EDI contract with Bergzicht Outdoor. | case: The ASN Chargeback of 2026: the despatch advice said one thing, the pallets another. | `additional_support`: Contracts with vendors and services, and who owns them. → Partners' contracts, which need the same. |\n\n### The Choices and Their Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): As a consumer the merchant pins and schedules, floats on the default or delegates to a connector per integration; as a first-time provider it should adopt Zalando's compatibility rules and defer the full deprecation machinery.\n\n**Advances the thesis** (S5, S2): Turns the chapter's rules into choices with costs and failure modes.\n\n**Transition in:** `cause_effect`: Who owns a vendor contract. → The postures an owner can take.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p49 | comparison | A consumer has three postures per integration, pin and schedule, float on the default, or delegate to a connector, and only pinning fits a flow that carries orders, stock or money; the agency script sat between pinning and floating, stating a version nobody scheduled. | table: Pin and schedule, float on the default, delegate to a connector: meaning, maintenance cost, failure mode, when right. |  |\n| p50 | recommendation | As a provider, a merchant offering its first APIs should take Zalando's compatibility rules wholesale and defer the full deprecation machinery until it has consumers it cannot call on the phone. |  | `contrast`: The consumer's postures. → The provider's choice. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): The topic never disappears but its owner moves from the vendor to the merchant's scripts, then to the merchant as provider, then to a named function, and the Growing-stage habit of pinning and scheduling pays most.\n\n**Advances the thesis** (S5): Shows how ownership of contracts grows with the merchant.\n\n**Transition in:** `elaboration`: The choices a merchant makes now. → How they change with scale.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | synthesis | Who owns contracts moves with scale, from the vendor at Starting to the merchant's first scripts at Growing, where most Pulled Rugs are planted, to the merchant as provider at Omnichannel and a named function at Group, and in the author's judgement the Growing-stage habit of pinning and scheduling pays most. | table: Typical integrations, what becomes necessary and the warning signs at each of the four stages. |  |\n\n### In Practice: The Contract Card for the bol Stock Flow\n\n**Controlling idea** (`example`, id `in-practice`): After the Deprecated Endpoint the bol stock flow got a contract card that gives it an owner, a pinned version, a sunset date, an alarm and a check, and needed no new system.\n\n**Advances the thesis** (S3, S5): Applies the chapter to the flow that failed.\n\n**Transition in:** `example`: The Growing-stage habit of pinning and scheduling. → That habit applied to the flow that failed.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | example | Under W5 Ruben rewrote the inventory row for the failed flow as a contract card with an owner, a style, the pinned contract, its sunset, the system of record, idempotency, failure handling, reconciliation and the expected rate. | table: The contract card for the stock push to bol (fictional details). |  |\n| p53 | analysis | The card is ordinary and needs no new system, and by the end of 2027 the inventory shows the pinned version and sunset date of all 34 integrations, which is what Noor shows the board: not a platform, a calendar. | figure: Figure 4: the stock pipe before and after, with owner, version, sunset date, alert and check attached. | `conclusion_summary`: The card's fields. → What the card is worth and what the board sees. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`cause_effect`, id `wrong`): Five contract failures are recognized by their symptoms, and recovery is the same in every case: the sweep and the reconciliation job find what the failure hid and the inventory says who fixes it.\n\n**Advances the thesis** (S3, S4): Maps each failure to the part of the contract or the receiver rule that prevents it.\n\n**Transition in:** `contrast`: The flow with a contract card. → What happens to flows without one.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p54 | synthesis | A flow without a contract card fails in one of five ways (the version expires, silent fall-forward, a deleted webhook subscription, duplicate or reordered deliveries, meaning changed without a version), each with a symptom short of a partner's complaint, and recovery is the same in every case: the sweep and the reconciliation job find what the failure hid and the inventory says who fixes it. | table: Five failures with how you notice and what to do. |  |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The opening's connector that keeps sending the same requests while the system it calls changes is answered by the chapter's two halves meeting in one record: the provider changes by adding and retires on a monitored date pair; the consumer writes the pinned version, its sunset date and its owner into the inventory and treats each webhook as a signed hint to verify, deduplicate and sweep. The Deprecated Endpoint broke where the consumer's half was missing.\n\n**So what:** A merchant keeps selling while its vendors change without buying anything: two inventory columns, a role mailbox, a calendar entry and a webhook receiver that does four things.\n\n**Callback:** The introduction's connector that keeps sending the same requests while the platform it calls changes. Paragraph p55 names the bol stock script as that connector and says which records would have caught the change.\n\n**Takeaway** (`course_of_action`): For every flow that moves orders, stock or money, record the pinned version, its sunset date and its owner, read vendor notices from a role mailbox, and give every webhook receiver a signature check, deduplication and a sweep.\n\n**Hand-off** to [One Customer, One Product: Identity and Master Data Across Systems](identity-and-master-data.html): `sequence`: Contracts that fix how two systems speak to each other: the shape, meaning, timing and lifetime of what passes between them. → The next question: whether the records on both sides refer to the same customer or product, with Eva held by the platform, the POS and the returns portal under no shared identifier.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55 | synthesis | The opening's connector that kept sending the same requests while the system it called changed was, at Kestrel & Pine, the bol stock script: the provider kept its promise by announcing the date and nobody held the consumer's half; the two halves meet in the inventory, where the provider's date pair and the consumer's pinned version, sunset date and owner sit on one row, beside a webhook receiver that verifies, deduplicates and sweeps, and none of it needs a new system. | reasoning: The hook's connector set against the provider's and the consumer's obligations. |  |\n| p56 | synthesis (list) | Established: additive change is safe and removal is not, a deprecation is a date pair plus monitoring, and webhooks are at least once, unordered and signed with the receiver owning deduplication and a sweep. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what the sources establish. |\n| p57 | synthesis (list) | Depends on context: whether to force upgrades or carry old versions depends on the number of consumers and the cost of silent change, consumer-driven contract tests pay only between services one organization owns, and delegating version tracking moves the obligation rather than removing it. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p58 | recommendation (list) | The author's synthesis: the cheapest fix for The Pulled Rug is a calendar with two inventory columns, a role mailbox and a six-month minimum of support for new flows, and a merchant's first API should be treated as if a stranger will call it. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p59 | recommendation (list) | Six questions let the reader check, in their own company, the pinned versions and their owners, where vendor notices go, the webhook receiver, silent fall-forward, the APIs the merchant provides and how a silent flow is noticed. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own company. |\n| p60 | transition | Contracts decide how systems speak to each other, and the next question is whether they speak about the same thing: when the platform, the POS and the returns portal each hold a record called Eva Janssen with no shared identifier, no contract can say they are one customer, which is the subject of identity and master data. |  | `sequence`: The questions about the reader's own contracts. → The next chapter's question about shared identity. |\n\n## Non-goals\n\n- Integration styles, iPaaS and the integration inventory itself; this chapter only adds two columns (pinned version, sunset date). See [APIs, Events, Files and Middleware: How Commerce Systems Talk](integration-styles.html).\n- Idempotency keys, the outbox pattern, retries, dead-letter queues and reconciliation jobs in depth; this chapter names them where webhooks need them and points back. See [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html).\n- Rate limits as a tenancy mechanism; peak planning. See [Many Merchants, One Platform: Multi-Tenancy, Pods and Isolation](multi-tenancy-and-isolation.html), [Black Friday Every Year: Peak Load, Resilience and Recovery](peak-load-and-reliability.html).\n- App permissions, scopes and app governance. See [Apps, Plugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html).\n- EDI message standards and the ASN Chargeback. See [Documents Between Companies: EDI, Punchout and E-Invoicing](edi-and-e-invoicing.html).\n- Webhook endpoint security beyond signature verification. See [Protecting the Shop: Card Data, Account Takeover, Bots and Skimmers](commerce-security.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Before print: Shopify's version numbers (2026-10), Stripe's (2026-10-28.endive) and the OpenAPI version (3.2.1) will change within a year; refresh them and keep the 'accessed 2026-11' dating.\n\n## Decision log\n\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: after the confirming round 3 (ESCALATE: the four acceptance criteria, the reverse outline and the introduction and conclusion checks pass; four transition failures and seven corroborated flow points remained), the cheap, plainly right fixes were applied without another round: the Amazon paragraph (p45a) rewritten as grammatical sentences that start from owning the contract; the journey paragraph (p04) opens from Kestrel & Pine's contracts; the formats paragraph (p13) opens as a consequence of the unwritten parts; the ownership section (p45) opens from the clauses that need an owner; the webhook bridge no longer promises versioned payloads at the start; p16 names the sections it points to; the semantic-versions sentence split; 'the same k             const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
