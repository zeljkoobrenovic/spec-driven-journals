<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/23-erp-and-back-office-integration/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (a thesis paragraph p04, a roadmap p06, a conclusion paragraph that answers the opening p52, and Part V's closing p57-p58); see decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The ERP's four jobs in a commerce business (the ledger, purchasing, inventory valuation, master data) and the boundary between stock quantity, owned by the WMS, and stock value, owned by the ERP under IAS 2 and a costing method.\n- **Know:** The flows between the commerce systems and the ERP (orders, shipments, payments and refunds, invoices, products, stock, customers and terms) with the system of record, direction and cadence of each.\n- **Know:** The four hub answers (the ERP, the commerce platform, an OMS, an iPaaS with no hub) with where each fits and breaks, and the master-data ownership table for an Omnichannel merchant.\n- **Believe:** Finance can be batch; availability cannot: the ERP is the system of record for finance and never the system a storefront waits on.\n- **Believe:** 'Who is the hub' is a scale-stage decision, and an iPaaS with no hub is an accident, not a design.\n- **Believe:** The connector an ERP partner builds is a contract the merchant must own, written field by field before it is replaced.\n- **Be able to:** Spot an ERP in a real-time path (availability, order status, checkout) and say what should replace it there.\n- **Be able to:** Read a vendor connector's documentation as an entity–owner table, and write a field-level contract for an ERP connector: direction, cadence, system of record and the rule when the two disagree.\n- **Be able to:** Choose the integration hub for a given business shape and stage.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given an omnichannel merchant whose stock and prices pass through the ERP and its partner's undocumented connector, the reader says what is wrong and what the ERP should own and receive, not a bigger ERP. *Probe:* A brand with its own warehouse, six stores, a wholesale portal and three marketplaces sends stock from its warehouse system to its ERP every 15 minutes and from the ERP to the storefront hourly; its ERP partner's connector also copies orders hourly and pushes a price list, and nobody inside the company can say which fields it moves. Using only this chapter: what is wrong, and what should the ERP own and receive? | `custom` | cold_reader | major |\n| AC-2 | Given three business shapes, the reader names the integration hub for each and what is wrong with having none. *Probe:* Using only this chapter: which system should be the integration hub for a direct-to-consumer brand with one storefront and one warehouse, for a B2B-heavy business with one channel and one warehouse, and for a merchant with stores, wholesale and marketplaces in several countries? What is wrong with having no hub? | `custom` | cold_reader | major |\n| AC-3 | The reader can say what prevents duplicate sales orders in the ERP. *Probe:* Using only this chapter: a platform webhook fires twice and the nightly order batch to the ERP is re-run after a partial failure. What goes wrong, and what prevents and detects it? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-6 | The reader can say which system knows how much stock there is and which knows what it is worth, and why a storefront must not take availability from the ERP. *Probe:* Using only this chapter: which system knows how many jackets are on the shelf, which knows what they are worth, and why should a storefront not read availability from the ERP? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** What does the ERP do in a commerce business, what should it own, and should it be the hub of integration?\n\n> **Claim:** The ERP keeps the ledger, purchasing, inventory valuation and the master data for items, costs and business customers' prices, terms and credit; it should own only those facts and receive orders, shipments and payments by batch from their owners. It can be the hub while one channel sells from one warehouse; once several channels create orders needing availability in seconds, an OMS is the hub and no sale waits on the ERP.\n\n**Disputed by:** The view that the ERP is the natural hub because it already holds items, stock, prices, customers and orders: every system should connect through it, channels should read stock and prices from it, and the connector its implementation partner built is part of the ERP relationship rather than a contract the merchant owns.\n\n**So what:** At Kestrel & Pine the ERP sat in the stock chain between the WMS and the platform, adding up to an hour to the delay behind the Black Friday Oversell; its partner-built connector, undocumented and not idempotent, carried the German price-list push that failed silently in the Price Drift and invoiced only on the WMS 'order complete' message that left #1052877 'Not invoiced' for six days; and January 2027's close took eleven working days because marketplace orders arrived as a weekly summary and store sales as a nightly total. Waypoint's finance-only rule takes the ERP out of every real-time path and retires the connector flow by flow after Ruben Alves writes its field-level contract. A merchant that accepts the claim names a system of record per flow with a rule for disagreement, and writes its ERP connector's contract before replacing it.\n\n**How and why:** A ledger needs every order, shipment, payment and refund once and complete, not within the minute, and a finance system changes in careful releases under audit, so a daily batch suits it. Availability and order status change by the minute and with the storefront's frequent releases, so a stock figure or status routed through the ERP's cycle arrives late and changes at the ERP's pace. With one channel and one warehouse there are no separate order and stock systems to integrate, so an ERP-centered store is the cheapest design; when stores, wholesale and marketplaces each create orders, they need one cross-channel order record and an availability calculation that an ERP's batch cycle cannot serve. A connector only its builder can read cannot be checked, changed or replaced, so its field-level contract is what the merchant must own.\n\n**Supporting claims**\n\n- **S1** — The ERP's jobs in a commerce business are the ledger, purchasing, inventory valuation and master data for items, costs and business customers' prices, terms and credit; stock quantity belongs to the WMS and stock value to the ERP, and nothing in the path of a sale belongs in it.\n- **S2** — Orders, shipments, payments and refunds reach the ERP by daily batch from the systems that own them, what the ERP owns for channels leaves it as events, and availability never comes from it, because finance needs completeness while availability needs seconds and the ERP changes in slow, audited releases.\n- **S3** — Who is the hub depends on the business shape and scale stage: the ERP for one channel and one warehouse, the commerce platform for a D2C brand with one or two channels, an OMS at the Omnichannel and Group stages; an iPaaS with no hub is an accident.\n- **S4** — Ownership of each master record and each flow is decided per entity and per field, with a rule for disagreement; a vendor connector encodes such a table, and its rules fit only the merchant it was built for.\n- **S5** — The connector an ERP partner builds is a dependency the merchant must turn into a contract it owns (field-level specification, named owner, idempotent handling, reconciliation, failure alert) before replacing it flow by flow.\n\n## Role in the part\n\nPlaces the ERP behind every channel: the system of record for finance that receives by batch and publishes what it owns for channels as events, the hub decision by scale stage, and the partner's connector as a contract the merchant owns; performs the part's closing (the published chapter does not yet do so: it ends with Questions to Ask and a one-paragraph hand-off to Part VI). Supports P5-2, P5-5 of part `part-5`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene: the connector nobody could read and the incidents it caused, then Waypoint's finance-only rule; `comparison` in hub, trade-offs and stages: the hub answers, then compared on the same criteria, then by scale stage)\n\nThe scene comes first so that every term arrives as part of the answer to Sanne's question of what the ERP should be the truth for. The ERP's four jobs come next because the flows section uses them (what each job needs from commerce). Batch and events follow the flows because they name the cadences the flows table assigns and give the rule (finance can be batch, availability cannot) that the hub question then rests on. The hub answers follow, and the trade-offs and stages come at once after them, because they turn the answers into a rule for choosing and place it on the book's stages. Connectors follow the stages because the first two stages rest on connectors, and a connector is where each flow's direction, cadence and owner are configured; master data follows connectors because the connectors raise, entity by entity, the question the ownership table settles. The partner-built connector closes the connectors section, set against the documented vendor connectors (both readers of round 3 asked for it there); what never belongs in the ERP comes after the table that settles its grey area; the worked cases then apply the rule and the owned contract, and the failures come last because each is read against the design that detects it. Putting the hub before the flows and their cadences would argue a hub without the requirements that decide it (readers in round 1 found batch and events, placed after the stages, came too late for terms the flows and hub already used); separating the trade-offs and stages from the hub leaves the answers without a rule for choosing; putting master data before connectors presents the ownership table before the reader sees why a connector forces the choice; putting the cases before the partner remedy (the round-1 order) applied the remedy before stating it; putting the failures earlier would describe detections for a design not yet explained.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): When finance closes the books it must connect sales, payments, fees and refunds; the ERP that keeps that ledger holds so much data that other systems connect through it, and its scheduled updates end up deciding how quickly a shopper learns that a jacket has sold out.\n\n**Bridge:** Anyone who has worked near a month-end close knows finance's question: what did the business earn and what is it owed, and from which records. → The system that answers it, the ERP, is also the one every other system is tempted to connect through, so the question becomes what the ERP should own, what it should only receive and how often, and whether it should be the hub.\n\n**Thesis statement** (KEY POINTS callout and paragraph p04): The ERP should own the books, not the shop: the ledger, purchasing, inventory valuation and the master records for items, costs and business customers' prices, terms and credit, receiving orders, shipments and payments in daily batches from the systems that own them. It can be the hub while one channel sells from one warehouse; once several channels create orders and need availability in seconds, an OMS is the hub and no sale waits on the ERP.\n\n**Roadmap** (Paragraph p06):\n\n- Start from the connector nobody at Kestrel & Pine could read. *Kept in:* scene.\n- Name the ERP's four jobs and the flows between the ERP and the commerce systems. *Kept in:* erp-jobs, flows.\n- Explain why finance can work in batches while availability cannot. *Kept in:* batch-events.\n- Compare three answers and one accident to who is the hub and weigh them by cost and scale stage. *Kept in:* hub, trade-offs, stages.\n- Read vendor connectors as tables of who owns what, show why the ERP partner's connector is a dependency, and settle master data. *Kept in:* connectors, master-data.\n- State what never belongs in the ERP. *Kept in:* never-in-erp.\n- Follow Eva's order, a wholesale order and the connector's retirement, and end with what goes wrong. *Kept in:* in-practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | When finance closes the books it must connect sales, payments, fees and refunds, and the ERP keeps that ledger alongside purchasing, stock valuation and master records, so it is a natural place to look for data, although different consumers need that data at different speeds. | scenario: Finance closing the books from sales, payments, fees and refunds. |  |\n| p02 | context | The previous chapter's documents end in the ERP, which numbers and issues invoices and credit notes and keeps the terms, credit limits and wholesale prices the B2B chapter gave it; because it arrives early and holds so much, storefronts, warehouses and trading partners tend to connect through it. |  | `sequence`: The ERP as the place finance looks for data. → Where the previous chapters' documents and account data end: in the ERP, which others then connect through. |\n| p03 | claim | The ERP can become the hub by accident, and its scheduled updates then decide how quickly a shopper learns that a jacket has sold out, which the storefront's need for fresh stock cannot wait for. |  | `cause_effect`: Everything connecting through the ERP. → The accidental hub and its consequence for stock freshness. |\n| p04 | claim | The chapter's answer is that the ERP should own the books, not the shop, receiving orders, shipments and payments in daily batches; it can be the hub while one channel sells from one warehouse, and once several channels need availability in seconds an OMS is the hub and no sale waits on the ERP. |  | `problem_solution`: The storefront's need that the accounting cycle cannot serve. → The chapter's thesis: separate the books from the selling, by stage. |\n| p05 | context | In the order's journey, Eva's €235 order from Kestrel & Pine, with its iDEAL payment, provider fee, shipment and any later refund, becomes ERP postings that Finance Director Sanne de Wit needs to agree when she closes April 2027. | scenario: Eva's order #1072455, €235, iDEAL, April 2027 close. | `example`: The ERP owning the books. → Where the running order meets the books: Eva's order and Sanne's April close. |\n| p06 | transition | The chapter starts from the connector nobody at Kestrel & Pine could read, then covers the ERP's four jobs and flows, batch against events, three answers and one accident to who is the hub weighed by cost and stage, vendor connectors, master data, what never belongs in the ERP and the partner as a dependency, three worked cases, and what goes wrong, with Kestrel & Pine's incidents and vendors' documentation as evidence. |  | `sequence`: Eva's order and Sanne's close as the chapter's running case. → The order of the sections and the kind of evidence. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: The Connector Nobody Could Read\n\n**Controlling idea** (`context`, id `scene`): At Kestrel & Pine an ERP that held too much, joined to the shop platform by a partner-built connector nobody inside could read, sat behind three incidents and an eleven-day close, and Waypoint narrows it to finance.\n\n**Advances the thesis** (S2, S5): Shows the cost of an ERP in the path of the sale and of a connector the merchant does not own, and states Waypoint's answer the chapter generalises.\n\n**Transition in:** `example`: The roadmap's first item: the connector nobody could read. → Kestrel & Pine's ERP, its partner and the connector between them.\n\n**Order of paragraphs** (`problem_solution`): The ERP and its connector first, then what Noor found, then the incidents and the close it caused, then Waypoint's answer; the answer cannot come before the reader has seen what it fixes, and the incidents only make sense once the connector's behaviour is known.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | description | Kestrel & Pine has run a cloud ERP since 2023 for finance, purchasing, valuation, item records and invoices, wholesale staff key 38% of wholesale orders into it, and its connector to the shop platform was built by an outside implementation firm, the ERP partner. | fact: Cloud ERP since 2023; 38% of wholesale orders keyed by hand; the partner-built connector. |  |\n| p08 | example | When Noor Visser asked the partner in January 2027 which fields the connector moves, how often and which system wins, she received a configuration export and a bill, and she and Ruben Alves needed three weeks to reconstruct its behaviour. | case: A configuration export, a bill and three weeks of reconstruction. | `elaboration`: The partner-built connector. → How opaque it was to its owner. |\n| p09 | description | The reconstruction showed a connector that copies orders hourly, invoices only on the WMS's 'order complete' message, relays stock and German consumer prices on a schedule, is not idempotent and leaves failed runs until the next day. | fact: Hourly order copy, invoicing on 'order complete', scheduled stock hops, the DE price list, no idempotency. | `cause_effect`: The three weeks of reconstruction. → What they found. |\n| p10 | evidence | Three of 2026's incidents ran through this connector: the Black Friday Oversell, because the ERP sat in the stock chain; the Three-Status Order, because invoicing waited for 'order complete'; and the Price Drift, a price push that failed silently for nine days. | case: The Black Friday Oversell, the Three-Status Order #1052877 (six days 'Not invoiced'), the Price Drift (nine days).; figure: Figure 1: a stock figure relayed from the WMS through the ERP and a connector to the storefront, with the delays. | `cause_effect`: The connector's behaviours. → The incidents they caused. |\n| p11 | evidence | Sanne de Wit's month-end problem was larger: with marketplace orders arriving as a weekly summary and store sales as a nightly total, January's close took eleven working days, and she asked what the ERP should be the truth for and what it should just receive. | statistic: Eleven working days; weekly marketplace summary; nightly store total. | `contrast`: Three loud incidents. → Finance's quieter, larger problem and its question. |\n| p12 | claim | Waypoint narrows the ERP to finance, the finance-only rule: it stays authoritative for finance, purchasing, valuation, costs, wholesale contract prices, terms and credit limits, while an OMS takes channel orders, a PIM product content, the WMS physical stock and an availability service what channels may sell. |  | `problem_solution`: Sanne's question of what the ERP should be the truth for. → Waypoint's answer: what the ERP keeps and who takes the rest. |\n| p13 | description | The ERP then consumes orders, shipments, payments and refunds in daily batches and publishes wholesale prices, terms and credit changes for the OMS and business catalogs, storefronts never read it live, and the partner connector is retired as the OMS takes over order flows in late 2027. | fact: Waypoint decisions W1, W2, W3 and W5, glossed by content. | `elaboration`: What the ERP keeps and who owns the rest. → How the ERP exchanges data under Waypoint and what happens to the connector. |\n\n### What an ERP Does in a Commerce Business\n\n**Controlling idea** (`definition`, id `erp-jobs`): An ERP has four jobs in a commerce business, the ledger, purchasing, inventory valuation and master data, and only it knows what the stock is worth.\n\n**Advances the thesis** (S1): Names the jobs the ERP should keep and draws the quantity–value boundary.\n\n**Transition in:** `elaboration`: The jobs Waypoint leaves the ERP. → The four jobs any ERP does in a commerce business.\n\n**Order of paragraphs** (`large_to_small`): The four jobs, then how vendors describe the same scope, then the one job newcomers underrate; the valuation paragraph needs the table to place valuation among the others.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | definition | The ERP has four jobs a commerce architect should be able to name, the ledger, purchasing, inventory valuation and master data, and none of them needs anything from commerce in real time. | table: Four jobs with what each means, what it needs from commerce and what commerce needs from it. |  |\n| p15 | evidence | Dutch mid-market ERP vendors describe their products in the same terms, which is true at the size where the ERP is the commerce back end. | quotation: Exact: 'manage stock, orders and accounting in one system'; AFAS: 'data only needs to be entered once' (translated). | `similarity`: The four jobs. → Vendors' own descriptions of that scope. |\n| p16 | explanation | Inventory valuation is an accounting job governed by IAS 2 and a costing method, so the WMS knows stock quantity and only the ERP knows its value: the chapter's first boundary. | quotation: IAS 2: 'at the lower of cost and net realisable value'; Business Central: 'you can't change an item's costing method if item ledger entries exist'. | `emphasis`: Vendors' all-in-one scope. → The job newcomers underrate and the boundary it draws. |\n\n### What Flows Between Commerce and the ERP\n\n**Controlling idea** (`description`, id `flows`): Seven kinds of data cross the boundary, each with its own owner, direction and cadence, and their different requirements mean they should not share one connector and one schedule; availability must not come from the ERP.\n\n**Advances the thesis** (S2): Shows that every flow into the ERP tolerates a daily cadence and that availability does not.\n\n**Transition in:** `elaboration`: What each job needs from commerce and gives back. → The flows that carry those exchanges, with direction and cadence.\n\n**Order of paragraphs** (`large_to_small`): The flows, then their requirements, then the one row that carries the argument; the requirements table only makes sense once the flows are named.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | description | Seven kinds of data cross the boundary between commerce and the ERP, and their direction and cadence are the design, not details. | table: Flows table: orders, shipments, payments, invoices, products, stock, customers with direction, system of record, cadence and why.; figure: Figure 2: the finance-only ERP, with daily batches in and invoices, item identity, cost and business terms out. |  |\n| p18 | analysis | The flows have different requirements for freshness, consistency, speed and availability, which is why they should not share one connector and one schedule. | table: Requirements table: how fresh, how consistent, how fast, how available, per flow. | `cause_effect`: The flows and their cadences. → Their requirements and the consequence for connectors and schedules. |\n| p19 | claim | The last row of the requirements table, availability not from the ERP, is the chapter's argument in one line. |  | `emphasis`: The requirements table. → Its last row as the chapter's argument. |\n\n### Batch or Events: The ERP's Rhythm\n\n**Controlling idea** (`cause_effect`, id `batch-events`): Finance can work in daily batches while availability needs events, chiefly because a finance system changes slowly, and Kestrel & Pine's stock chain shows what breaks when the rule is ignored.\n\n**Advances the thesis** (S2): Explains why the ERP's cadence suits finance and must not become the storefront's.\n\n**Transition in:** `elaboration`: The cadence column of the flows table. → What a batch and an event are and which rhythm each flow needs.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The flows table's cadences named, then the rule, then its main reason (change, not performance), then Kestrel & Pine's breach as the example; both round-2 readers asked for the reason directly after the rule, where it supports it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p26 | definition | The flows table gives each flow a cadence: a batch exchanges accumulated changes on a schedule and an event reports one change, and ERP connectors commonly run scheduled jobs whose cadence must be checked against each flow's required freshness. | source: Business Central: inventory sync every 15–30 minutes; OneStock: hourly or nightly; Shopify: real time or a daily batch (August 2026). |  |\n| p27 | claim | Finance can often work in batches while availability needs fresher answers, so each fact's owner publishes changes and consumers process them at the cadence their work needs. |  | `cause_effect`: Cadence as an operating choice. → The rule for choosing it. |\n| p29 | analysis | The business reason to keep the ERP out of the real-time path is change, not performance: a finance system changes carefully in audited releases while availability logic changes weekly, so coupling them lets the slow one set the pace. |  | `elaboration`: The rule that finance can be batch while availability cannot. → The deeper business reason for it: change, not performance. |\n| p28 | example | Kestrel & Pine's 2026 stock chain, described in the scene, broke the rule that finance can be batch while availability cannot, and the Black Friday Oversell exposed the delay. | case: The 2026 stock chain and the Black Friday Oversell.; figure: Figure 4: availability as a live pulse in the path of the sale; the ERP receiving a daily batch behind a fence. | `example`: The rule and its reason. → Kestrel & Pine's breach of it, pointing back to the scene. |\n\n### Who Is the Hub? Three Answers and a Non-Answer\n\n**Controlling idea** (`comparison`, id `hub`): There are three honest answers to which system is the integration hub, the ERP, the commerce platform and an OMS, each right for a different business shape, and one accident, an iPaaS with no hub.\n\n**Advances the thesis** (S3): Sets out the hub options with where each fits and breaks, and places Waypoint's rule among them.\n\n**Transition in:** `cause_effect`: Finance can wait for batches; availability cannot. → The question which system the others should connect through.\n\n**Order of paragraphs** (`comparison`): Definition first, then the three answers from the smallest business shape to the largest, then the accident, then Kestrel & Pine's choice; the choice cannot be read before the options.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | definition | If finance can wait for batches and availability cannot, the next question is which system the others connect through: an integration hub is the one system every other system connects through and that owns the shared records, and there are three honest answers and one accident. |  |  |\n| p21 | example | With the ERP as hub every system integrates with the ERP, which holds stock, prices and customers; ERP-driven web stores such as Sana Commerce sell this, and it fits one channel, one warehouse, a B2B-heavy business and a small team because it avoids separate systems. | quotation: Sana Commerce: 'built on your SAP or Dynamics ERP', 'the prices you agreed and the stock you really have'. | `example`: The three answers. → The first: the ERP. |\n| p22 | example | With the commerce platform as hub the platform owns orders, customers and stock and the ERP subscribes for finance, as Business Central's Shopify connector describes; it fits a D2C brand with one or two channels and breaks when stores, wholesale and marketplaces bring their own order sources. | source: Business Central Shopify connector documentation, October 2026: orders flow into Business Central with the Shopify order id kept. | `contrast`: The ERP as hub. → The platform as hub. |\n| p23 | example | With an OMS as hub the OMS owns the order record, allocation and availability, the ERP finance and the platform the storefront; it fits the Omnichannel and Group stages and is a second integration surface nobody needs before them. | quotation: OneStock (a vendor source): 'ERPs update inventory in batch cycles, hourly or nightly'; 'ERP isn't broken. It's just not built for everything.' | `contrast`: The platform as hub. → The OMS as hub. |\n| p24 | analysis | An iPaaS with no hub is not a design but what happens when each system is connected as it arrives: no system owns the cross-channel order record, which is how Kestrel & Pine came to thirty-four integrations and three definitions of 'order'. | fact: 34 integrations; three definitions of 'order'.; table: Hub table: what each means, fits, breaks when. | `contrast`: Three honest answers. → The accident. |\n| p25 | claim | Waypoint's finance-only rule is the OMS-as-hub position written as an ownership rule, decided per fact, which leaves the ledger where it is and takes the ERP out of the path of a sale. | figure: Figure 3: Kestrel & Pine's target shape after Waypoint. | `example`: The OMS-as-hub answer. → Kestrel & Pine's version of it. |\n\n### Trade-offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Compared on integration surfaces, availability latency, order record, cost and fit, the ERP cannot be the hub once any channel needs availability in seconds and more than one channel creates orders, and an OMS is excess when one channel sells from one warehouse.\n\n**Advances the thesis** (S3): Turns the hub options into a decision rule.\n\n**Transition in:** `conclusion_summary`: The four hub answers. → Their comparison on the same criteria and the rule for choosing.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | recommendation | Set side by side on the same criteria, the four hub answers give a rule: if any channel needs availability in seconds and more than one channel creates orders, the ERP cannot be the hub, and with one channel and one warehouse the ERP-centered suite is the cheapest honest architecture; the table compares the four. | table: Trade-off table: four hubs against integration surfaces, availability latency, order record, cost and right-when. |  |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): Each scale stage needs a different back-office arrangement, and Kestrel & Pine is at stage 3 with a stage 2 back office.\n\n**Advances the thesis** (S3): Places the hub decision on the book's four stages with warning signs.\n\n**Transition in:** `elaboration`: The trade-off table's 'right when' row. → The same choice read stage by stage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | analysis | Read stage by stage, the 'right when' row becomes the stage table: the ERP's job narrows as channels multiply, from the whole back end at stage 1 to finance per legal entity at stage 4, and Kestrel & Pine is at stage 3 with a stage 2 back office, whose eleven-day close and Oversell are the two warning signs. | table: Stage table: typical, what becomes necessary, warning signs, for stages 1 to 4.; fact: Eleven-day close; the Black Friday Oversell. |  |\n\n### Connectors as Products\n\n**Controlling idea** (`example`, id `connectors`): A vendor-built connector writes an entity–owner table into configuration, Microsoft's Business Central Shopify Connector being the clearest example, Shopify's guidance names the two rules any contract needs, a connector's ownership rules fit only the merchant it was built for, and a partner-built connector is a dependency the merchant must turn into a contract it owns.\n\n**Advances the thesis** (S4, S5): Shows ownership written per entity in a vendor's configuration, why it must be checked against the merchant, and why the partner's undocumented connector must become a contract the merchant owns.\n\n**Transition in:** `cause_effect`: The stage table's first two rows, which rest on a vendor's connector and the partner's. → Connectors as the place where each flow's direction, cadence and owner are configured, and vendor-built connectors as products.\n\n**Order of paragraphs** (`large_to_small`): The option and its best example, then what the connector maintains and the two rules any contract needs, then the suite-era view and the judgement on fit, and last the partner-built connector, which has none of that documentation; the judgement and the contrast both need the documented rules first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | example (list) | The early stages rest on connectors, where each flow's direction, cadence and owner are configured; between a hand-built integration and a general iPaaS sits a connector built by one of the two vendors, and Microsoft's Business Central Shopify Connector documents its ownership choices per entity. | source: Shopify Global ERP Program (14 October 2021); Business Central connector pages (September–October 2026): preinstalled, product system of record chosen by the merchant, inventory owned by Business Central every 15–30 minutes, customers and terms in Business Central, order import keeping the Shopify id, expiring tokens. |  |\n| p31 | analysis | What a connector as a product maintains is small print, tokens, retries, version changes and mapping options, and Shopify's 2026 guidance adds a review that certified apps pass and two rules any connector contract needs: name the system of record for every field, and decide in advance what happens when two systems disagree. | quotation: Shopify: certified ERP apps 'undergo a 100-checkpoint review'; 'custom integrations introduce more risk and maintenance overhead'.; quotation: 'Document every field that moves between systems, and name the system of record for each'; 'Decide in advance what happens when the two systems disagree.' | `elaboration`: The connector's token bullet. → What a productised connector actually maintains. |\n| p32 | analysis | SAP's learning material confirms the same division from the ERP vendor's side, master data from the ERP and storefront orders to it, and like Business Central's rules it fits only the merchant it was written for. | source: SAP Learning, S/4HANA Cloud with SAP Commerce Cloud.; reasoning: INFERENCE callout: Business Central's inventory rule is the ERP-as-hub position for stock, right for one warehouse and one storefront, and the stock chain that oversold at Kestrel & Pine's size. | `additional_support`: Microsoft's and Shopify's documentation. → The ERP vendor's side and the judgement on fit. |\n| p45 | recommendation | Kestrel & Pine's connector is neither vendor's product but the ERP implementation partner's, an unlisted architectural dependency, the Lynchpin, and the remedy is to treat the connector as a contract the merchant owns, with a field-level specification, an owner, idempotent handling, a reconciliation job and a failure alert. | reasoning: Waypoint's W5 (integration standards) applied to one integration. | `contrast`: Vendor-built connectors whose ownership rules are documented and fit the merchant they were built for. → The partner-built connector, documented nowhere, as a dependency. |\n\n### Master Data: Who May Create and Change What\n\n**Controlling idea** (`definition`, id `master-data`): Master data ownership names one system that may create and change each kind of record; at the Omnichannel stage the ERP owns item identity and cost, wholesale prices, business accounts, stock value and invoices, while content, consumer prices, consumer accounts, stock quantity and orders belong elsewhere.\n\n**Advances the thesis** (S4, S1): Gives the full entity–owner table the connectors only partly encode.\n\n**Transition in:** `cause_effect`: Connectors, vendor-built or the partner's, that force a choice of owner entity by entity, and Shopify's per-field rule. → One ownership table for every kind of master record.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | definition | The connectors force a choice of owner entity by entity, so the ownership table makes it for every kind of record: master data is the slow-changing reference data many systems copy, master data ownership says which system may create and change each record, and for an Omnichannel merchant the ERP owns identity, cost, wholesale prices, business accounts, stock value and invoices. | table: Ownership table: data, owner, readers, note. |  |\n| p34 | evidence | Vendors on both sides agree: the ERP owns the item's identity and cost, and something else owns what the shopper reads. | quotation: Akeneo: a PIM is 'a central source of truth' that 'collects data from your ERP'; OneStock: 'ERP is the master for product data (if no dedicated PIM system exists)'. | `additional_support`: The ownership table. → Vendor sources that say the same from the PIM and OMS sides. |\n\n### What Never Belongs in the ERP\n\n**Controlling idea** (`claim`, id `never-in-erp`): Anything in the path of a sale never belongs in the ERP, while postings and legal documents always do.\n\n**Advances the thesis** (S1): States the boundary as a rule.\n\n**Transition in:** `cause_effect`: The ownership table, which settles the grey area of master data. → What plainly never and always belongs in the ERP.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | claim | With the ownership table in place the rest of the boundary is plain: things in the path of a sale never belong in the ERP; postings, stock cost, legal invoices, receivables and purchasing always do. |  |  |\n\n### In Practice\n\n**Controlling idea** (`example`, id `in-practice`): Kestrel & Pine's consumer order, wholesale order and connector retirement show the finance-only rule at work.\n\n**Advances the thesis** (S2, S5): Shows the rule applied to the book's running orders and to the connector's replacement.\n\n**Transition in:** `example`: The finance-only rule and the contract the merchant owns. → Three Kestrel & Pine cases that apply them.\n\n**Order of paragraphs** (`small_to_large`): One consumer order through the books, then a wholesale order, then the retirement of the connector that carried both; the retirement plan makes sense once the reader has seen the flows it carries.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | example | Three Kestrel & Pine cases show the rule and the owned contract at work, starting with Eva's €235 order, which reaches the ERP in the night batch from the OMS, its shipment in the next batch from the WMS, and its payment and an illustrative €0.30 fee in the PSP's payout file a few days later. | scenario: Order #1072455, 13 April 2027; shipment 14 April; PSP payout file; fee about €0.30 (assumption). |  |\n| p40 | process | The ERP then posts revenue of €194.21 at delivery and VAT of €40.79, relieves stock at landed cost, records the fee and reconciles the payout through the PSP's reference. | statistic: Revenue €194.21 recognised 15 April; VAT €40.79; jacket landed cost €58. | `sequence`: The batches arriving. → What the ERP posts from them. |\n| p41 | example | Eva's exchange on 19 April becomes a return and a new order in the OMS and a €199 credit note and new sale in the ERP's batch of 22 April, and nothing in it needed the ERP within the minute. | scenario: Exchange for size L; credit note €199 and new sale €199, batch of 22 April. | `time`: The original postings. → The exchange that follows. |\n| p42 | example | Bergzicht's wholesale reorder shows the ERP's job undiminished: it issues the INVOIC from the WMS's shipment confirmation, posts the receivable, runs dunning and holds the credit limit and terms read at order acceptance. | scenario: Bergzicht's reorder of 6 April 2027: 240 units, €19,860 excl. VAT; INVOIC 9 April; due 9 May. | `contrast`: A consumer order that needs nothing from the ERP in real time. → A wholesale order where the ERP's finance job is large. |\n| p43 | process | The partner-built connector is retired in two steps: Ruben writes its field-level contract in Q3 2027 as the specification for the OMS-to-ERP batch, then each flow is switched off as its order path moves to the OMS, with the old paths retired in January 2028. | fact: Contract Q3 2027; marketplace orders September, storefront October, EDI and manual wholesale December 2027; old paths retired January 2028. | `problem_solution`: The flows the ERP must keep receiving. → How the unreadable connector that carries them is replaced. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `wrong`): Six failures, duplicate sales orders, posting before payment, double refunds, missing items, a batch window that meets the peak and a silent connector change, each have a detection and a recovery that rely on idempotent batches and reconciliation.\n\n**Advances the thesis** (S2, S5): Shows what the batch-and-contract design must detect and how it recovers.\n\n**Transition in:** `cause_effect`: The connector retired after its contract, with idempotent handling and reconciliation. → The failures the batch-and-contract design must detect and recover from.\n\n**Order of paragraphs** (`grouping`): Failures of the order flow first (duplicates, posting before payment, double refunds), then of master data and capacity, then of the connector itself; each needs the design described earlier, so they come last.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | analysis | A webhook that fires twice or a re-run batch creates duplicate sales orders unless the batch enforces one ERP document per order number and a daily count compares orders with sales orders. | scenario: Two sales orders for #1072455. |  |\n| p47 | analysis | An order posted as a sale before payment is captured needs a credit note when the bank declines, so only the PSP's capture event should make a sale postable. |  | `additional_support`: A duplicate in the order flow. → A sale posted too early. |\n| p48 | example | The Double Refund was found in the ERP, where the returns portal's and support's refunds met, so a daily reconciliation of refunds against PSP records by return number detects it. | case: 212 returns, €19,400 refunded twice, January 2027. | `similarity`: Failures of money posted wrongly. → A refund posted twice. |\n| p49 | analysis | A variant created outside its owner fails the night's order batch unless the batch reports per line, and the cause is fixed by creating items in the ERP first. |  | `additional_support`: Failures of the order and money flows. → A failure of master data. |\n| p50 | example | A nightly order batch sized for an average day of about 950 orders meets Black Friday's 11,500 and blocks the stock sync behind it, so batches are split by flow and the ERP taken out of the stock path. | statistic: About 950 orders on an average 2026 day; 11,500 on Black Friday 2026 (31,000 in the week). | `additional_support`: A failure of master data. → A failure of capacity at the peak. |\n| p51 | example | A partner who quietly changes the connector lets a flow fail silently, as the Price Drift showed, so a daily price reconciliation detects it and a versioned contract with change notices prevents it. | case: The Price Drift: €179 for nine days on the DE storefront. | `additional_support`: Failures in the flows the connector carries. → A failure of the connector itself. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Finance's question at the start, what the ERP should be the truth for and what it should just receive, has one answer across the sections: the ERP is the truth for the books and receives everything else by daily batch from the system that owns each fact, so the shopper learns that the jacket has sold out from the availability service, not from the accounting cycle; the hub follows the business shape, and the connector that carries the books is a contract the merchant writes and owns. For the part: the marketplace strike, the hand-keyed wholesale orders, Bergzicht's deduction and the eleven-day close are one problem, a value sent to an outside party from a copy or a system that did not own it, or an order kept in the tool its channel arrived through.\n\n**So what:** A merchant that keeps the ERP to finance gets a complete, reconciled ledger and a storefront that never waits on accounting; Kestrel & Pine's Part V remedies are ownership decisions and contracts more than new channels or platforms, so a reader can list, for each outside channel, where its orders are created, which system computes each value it is sent, and who owns its rules and dates.\n\n**Callback:** The introduction's ERP whose scheduled updates decide how quickly a shopper learns that a jacket has sold out, and Sanne's question; and, for the part, the part opening's jacket sold through a marketplace and a retail chain, where an extra sale handled like a consumer checkout ends in a penalty or a deduction. p52 answers the chapter's opening with the finance-only rule; p57 returns to the part opening and names the one problem behind its cases; p58 and p58a give the part's so-what and take-away.\n\n**Takeaway** (`course_of_action`): For each flow between commerce and the ERP, name the system of record and the rule when two systems disagree, and write the ERP connector's field-level contract before replacing it; for the part, list for each outside channel where its orders are created, which system computes each value it is sent, which rule or date the outside party enforces and who owns it, and whether any sale waits on the ERP.\n\n**Hand-off** to [Part VI — INTEGRATION: Making Separate Systems Behave Like One](part-6.html): `cause_effect`: The many systems and channels of Parts II to V, each holding copies of the same facts. → The joins between them as a design subject of their own.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | synthesis | Finance's question, what the ERP should be the truth for and what it should just receive, now has an answer: the truth for the books, fed by daily batches from each fact's owner, so the shopper learns a jacket has sold out from availability, not from the accounting cycle, and the hub follows the business's shape and stage. | reasoning: The opening's sold-out jacket and Sanne's question set against the finance-only rule. |  |\n| p53 | synthesis (list) | Established: the ERP's four jobs with valuation distinct from availability, batch as the vendors' default and finance's right rhythm, and ownership named per field with a rule for disagreement. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what the sources establish. |\n| p54 | synthesis (list) | Depends on context: ERP as hub, an OMS as hub and a vendor connector are each right only for the business shape and stage they fit. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p55 | recommendation (list) | The author's synthesis: the finance-only rule gives the ERP a smaller and more important job, and the partner-built connector is the most important undocumented integration, whose contract should be written before it is replaced. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p56 | recommendation (list) | Eight questions let the reader find, in their own company, the system of record per flow, any channel reading the ERP, the connector's builder and specification, the ERP in real-time paths, marketplace and store feeds, reconciliation, the posting trigger and the partner dependency. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own company. |\n| p57 | synthesis | Part V opened with a jacket sold through a marketplace and a retail chain, and its four chapters' cases (the marketplace strike, the hand-keyed wholesale orders, Bergzicht's deduction and the eleven-day close) are one problem: something was held in the wrong place, a value sent to an outside party from a copy or a system that did not own it, or an order that never left the tool its channel arrived through. | reasoning: The part opening's jacket and the four chapters' cases: the bol strike after the Black Friday Oversell, 38% of 9,400 wholesale orders keyed by hand, Bergzicht's €14,200 deduction, the eleven-day January close. | `conclusion_summary`: This chapter's questions about the ERP, the last of the part's channels' destinations. → What the four chapters of Part V say together, set against the part opening. |\n| p58 | recommendation | The remedy in every chapter has the same parts (one order record, each value computed by its owner, each intermediary's contract written down with an owner, the ERP outside the path of the sale), and at Kestrel & Pine these are ownership decisions and contracts, not new channels or platforms. | reasoning: Kestrel & Pine's remedies: one available-to-promise figure per channel with a ten-unit marketplace buffer until it arrives; the OMS taking marketplace, storefront, then EDI and manual wholesale orders in September, October and December 2027; ERP price events and a credit check at placement; labels and despatch advice from the WMS (W6) with a partner card per trading partner; the finance-only ERP with a contract for its connector. | `problem_solution`: The one problem behind the part's cases. → The remedies that answer it and the list a reader can make. |\n| p58a | recommendation | For each outside channel of their own company, the reader can write down where its orders are created and under which key, which system computes each value sent, which rule or date the outside party enforces and who owns it, and whether any sale waits on the ERP, starting with the age of the last accepted stock update per marketplace and the share of wholesale orders keyed by hand. | reasoning: The part closing's take-away from the journal spec. | `cause_effect`: Kestrel & Pine's remedies as ownership decisions and contracts. → The same list for the reader's own channels. |\n| p59 | transition | Because every system and channel of Parts II to V holds its own copy of the same orders, stock, prices and customers, the joins between them need a design of their own, which is what Part VI covers. |  | `cause_effect`: The many systems and channels of Parts II to V, each holding copies of the same facts. → The joins between them as a design subject of their own. |\n\n## Non-goals\n\n- The invoice as a legal document, VAT, revenue recognition and order-to-ledger detail. See [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html).\n- Payout reconciliation in depth. See [Payments-to-Ledger: Draining the Suspense Swamp](../finance-systems-architecture/payments-to-ledger.html).\n- EDI documents and e-invoicing mandates. See [Documents Between Companies: EDI, Punchout and E-Invoicing](edi-and-e-invoicing.html).\n- Integration styles, the iPaaS as a tool and the integration inventory; idempotency, outbox and reconciliation mechanics. See [APIs, Events, Files and Middleware: How Commerce Systems Talk](integration-styles.html), [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html).\n- The OMS's internal state model and order orchestration; available-to-promise and stock events; the PIM. See [The Order Record: Lifecycle, State and the Order Management System](order-management.html), [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html), [What Are We Selling? Products, Variants and the Catalog](product-information.html).\n- The ERP-centered platform category as a market (Odoo, JTL, PlentyONE, NetSuite). See [Suites, SaaS, Open Source and Composable: The Platform Landscape in 2026](commerce-platform-landscape.html).\n- Vendor and partner management as an organizational question. See [Who Builds and Who Owns: Teams, Vendors, Agencies and Governance](organizing-commerce-engineering.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Needs the author (record, not a decision): NetSuite/SuiteCommerce could not be fetched for the brief; the chapter makes no feature claims about it.\n- Needs the author (record): the Business Central connector's first release date is inferred from Shopify's 2021 'early 2022' announcement; no Microsoft release no e move).; Moving the scene's Waypoint answer after the concept sections (author's design, rule 10).\n\n## Sources\n\n- **Internal**\n  - _research/scenario-ledger.md and _research/consistency-issues.md (rulings 1, 2, 3, 4) — The ERP since 2023, the partner-built connector, the incidents, the finance-only rule, Eva's order, Bergzicht's reorder, the OMS seam dates, the average of about 950 orders a day.\n  - journal-spec.json (erp-and-back-office-integration; part-5 closing; part-6 transition_in) — Intent, thesis, role, acceptance criteria, the part closing this chapter performs and the hand-off to Part VI.\n  - meet-kestrel-and-pine — The ERP since 2023, the partner-built connector, the incidents, Waypoint W1–W5.\n  - boundaries-and-systems-of-record — Ownership per fact; the entity–owner table this chapter applies to the back office.\n  - order-management — The OMS as order hub.\n  - integration-styles and events-consistency-and-reconciliation — The iPaaS, events, batch and reconciliation.\n  - edi-and-e-invoicing and tax-invoicing-and-ledger — Invoices out of the ERP.\n  - _research/brief-b2b-edi-erp.md (Part 4), _research/brief-platform-landscape.md (1.6), _research/brief-integration-and-data.md (1.4–1.6) — The factual base for the ERP, connectors and integration claims.\n- **External**\n  - Microsoft Learn, Business Central Shopify Connector pages (get started, items, inventory, customers, orders; September–October 2026) and costing methods (March 2026) — The connector's per-entity ownership, cadence and token mechanics; the costing methods.\n  - Shopify, Global ERP Program announcement (14 October 2021) and 'ERP Integration: Methods, Benefits, and Examples' (updated 28 August 2026) — The program; real time or daily batch; the review checkpoints and the two ownership sentences.\n  - SAP Learning, S/4HANA Cloud with SAP Commerce Cloud integration journey (n.d.) — The suite-era division from the ERP side.\n  - OneStock, 'OMS vs ERP' (2026); Sana Commerce home page;                     i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
