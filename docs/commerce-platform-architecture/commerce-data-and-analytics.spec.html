<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/28-commerce-data-and-analytics/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have: the carry-over from the previous chapter in p02, the thesis sentence in p03, a roadmap p05, a lead sentence for the failure table p50, a conclusion paragraph that answers the opening p51, and Part VI's closing (p56, p57) with a hand-off p58 rewritten to Part VII's question; see decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The difference between operational and analytical data, the warehouse or lakehouse, and the three ways data reaches it (scheduled extract-and-load, event streams, platform exports).\n- **Know:** How public definitions of an order or of sales differ (Shopify's sales schema and annual report, Zalando's annual report, Google Analytics 4's purchase event), what a metric definition must settle, and what a metrics layer is.\n- **Know:** The four uses of commerce data (reporting, experimentation, data science, merchandising and inventory planning), data products for partners, and the rule that separates live operational signals from business metrics shown on a lag.\n- **Believe:** Three honest systems give three honest counts; none is the company's number until someone owns its definition.\n- **Believe:** Define before you build: written definitions with an owner do more for trust than a new warehouse or dashboard.\n- **Believe:** The number that gets believed is the number published with its bridge to each system's count.\n- **Be able to:** Attribute each difference between two counts to definition, collection or time.\n- **Be able to:** Write a definition table for order, net sales and return that settles cancellations, exchanges, test orders, split shipments, store transactions, dates and tax.\n- **Be able to:** Decide which numbers to show live and which on a lag, and whether to feed the warehouse by extract-and-load or by events.\n\n**Audience:** Readers new to commerce architecture; most of all the analyst or data engineer who inherits a warehouse without definitions, and next the product manager or finance partner who has to defend a number; the engineering lead gets the design choices by stage.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what a database, a report and a dashboard are.\n- Kestrel & Pine, its people (Mara Lindqvist, Milan Petrov, Sanne de Wit, Daniel Okafor, Hanna Berg, Teun Baas), its thirteen systems and 34 integrations, its incidents in outline and the names of the sixteen failure patterns.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines, 'system', 'the shop platform' and 'commerce platform', business models and the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- Parts II to V: one owner per product, price and stock fact; available-to-promise; checkout creating the order once; refunds as new payments; one order record with three status lines; one invoice per shipment, credit notes and the monthly match; marketplace orders reaching the ERP as a weekly summary and store sales as a nightly total.\n- Part VI so far: integration styles and the integration inventory with an owner per flow; events, idempotency keys and the reconciliation sweep; contracts, pinned versions, sunset dates and rate budgets; a master per entity, the cross-reference with its merge log, and automatic links only on exact keys.\n\n**Does not yet know:**\n\n- Operational and analytical data; data warehouse; lakehouse; business intelligence (BI) tool.\n- Extract-and-load (ELT), a lookback window, event streams as a feed for analytics, platform bulk exports.\n- Metric definition, metrics layer (semantic layer), GMV, VAT-inclusive and exclusive bases, IFRS 15 recognition.\n- Sell-through, weeks of cover, data product, data mesh, operational signal versus business metric, the bridge between counts.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given three order counts from three systems, the reader explains them by definition, collection and time and says what the company should report, rather than picking one system as right. *Probe:* For one month a brand's storefront reports 21,050 orders, its ERP 22,710 and its warehouse report 24,140. The storefront counts orders created, including canceled, test and exchange orders and no marketplace orders; the ERP counts sales orders invoiced, with marketplace orders from a weekly summary; the warehouse report counts parcels shipped. Using only this chapter: which count is right, and what should the company report? | `custom` | cold_reader | major |\n| AC-2 | The reader can say why a live count and a later report differ and how each should be shown. *Probe:* A live dashboard showed 2,300 orders in the peak hour; the report a week later says 2,210. Using only this chapter: which is wrong, and how should the two numbers be shown? | `custom` | cold_reader | major |\n| AC-3 | The reader can say when to feed the analytical store by extract-and-load and when by events. *Probe:* Using only this chapter: should a merchant feed its data warehouse by scheduled extract-and-load from its platform or by event streams? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-6 | The conclusion performs Part VI's closing: it sets the part's five cases against the part opening's order that reaches the warehouse twice, stock update that arrives after the last unit has sold and invoice whose customer finance cannot identify, and states what the cases have in common, rather than only listing the part's questions. *Probe:* Does the conclusion return to Part VI's opening failures (an order reaching the warehouse twice, a stock update arriving after the last unit sold, an invoice naming a customer finance cannot identify) and say what the part's five cases have in common? | `custom` | rubric | minor |\n\n## Thesis\n\n**Question:** Why do three reports show three different order counts, and how do you build analytics that the business trusts?\n\n> **Claim:** Each system counts what it exists to handle (orders created, sales orders invoiced, parcels shipped), from the records that reach it, dated by its own clock, so correct counts differ by definition, collection and time. Analytics are trusted when every system's data is copied into one analytical store, each metric is defined once with an owner, and the company's number is published with a bridge reconciling it to each system's count.\n\n**Disputed by:** The view that one of the counts is right and the others are errors, so the fix is to name a system of record for orders or build a real-time dashboard, and that a data warehouse and a BI tool by themselves give the business one number.\n\n**So what:** A merchant that accepts the claim writes definitions with owners before it adds dashboards, and treats a difference the bridge does not explain as an incident. For February 2027 Kestrel & Pine's platform counted 21,050 orders, its ERP 22,710 and its warehouse report 24,140, and in March nobody owned the definition. Under W7 the Data Lead, Hanna Berg, published definitions in June 2027, adopted from the July close: February became 23,150 orders, 22,860 net of cancellations, with 9,200 store transactions reported beside them. The bridge found its first unexplained exception in August 2027, 23 marketplace orders dropped from the connector's weekly summary during a vendor outage. The definitions took three weeks; the warehouse already existed.\n\n**How and why:** An operational system stores what its job needs, one record at a time, and dates each record by the moment of that job: creation, invoice or shipment. Copies reach the analytical store by extract jobs with lookback windows or by events, and a late edit missed by both stays a difference until something compares them. Every dashboard that computes 'order' for itself decides cancellations, exchanges, test orders, split shipments and dates again; a definition kept as code in one place, with an owner, takes those choices out of the dashboards, and the bridge sorts each remaining difference into an explained definition or a missing record.\n\n**Supporting claims**\n\n- **D1** — Each operational system counts what it exists to handle, from the records that reach it, on its own clock, so honest counts differ by definition, collection and time, and none is the company's number until someone owns the definition.\n- **D2** — Operational and analytical work need separate stores, and every system's data is copied into one analytical store by extract-and-load, event streams or platform exports; incremental extraction is a sweep, so a late edit it misses stays a difference until a comparison finds it.\n- **D3** — A metric definition settles what is counted, which records are in or out, which date and tax basis apply and how later changes are reported; public definitions differ, so each metric is defined once, as code in a metrics layer, with a named owner, and every use of the data (reporting, experimentation, data science, planning, partner data products) computes from it.\n- **D4** — Live operational signals and business metrics are different objects: signals are shown live and approximate for acting now, metrics on a lag with a definition, a revision policy and the reconciliation beside them, never under one label.\n- **D5** — The design follows the stage: platform reports at Starting, a warehouse fed by extract-and-load with a metrics layer at Omnichannel, an event stream and lakehouse at Group; at every stage the definitions and their owner matter more than the tool.\n- **D6** — The company's number is published with a bridge to each system's count; the bridge sorts every difference into an explained definition or a missing record, and an unexplained difference is an exception to investigate.\n\n## Role in the part\n\nGives the part its last join, between the operational systems and the numbers the business decides by: copies of every system in one analytical store, one owned definition per metric, and the bridge to each system's count; performs the part's closing (the published chapter does not yet do so: it ends with a one-sentence list of the part's questions and the hand-off to Part VII). Supports P6-5 of part `part-6`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in opanalytical to realtime: the analytical store, the ways data reaches it, the definitions and bridge computed in it, the uses that depend on them, and the freshness each needs with the live view that sits outside them; `comparison` in choices and stages)\n\nThe three February counts come first because every later section answers part of the question they raise: why the counts differ and what the company should report. The analytical store comes next because definitions, uses and the bridge all need one place where every system's data is copied; the three ways of getting data there follow, since each explains how a record can be missed on the way (a collection difference in the scene). Definitions, the metrics layer and the bridge come after the store they are computed in and before the uses, because every use depends on shared definitions. The freshness table and real-time dashboards follow the uses because the table compares the uses with the live view, the one view that is not computed from settled definitions. The four designs and the stage table compare the options once the reader has all the parts, including the bridge the recommendation adds; W7 in practice then resolves the scene's three counts with a definition table and a bridge; the failures come last because each is read against a part of the design. Putting the definitions before the store would leave the reader asking where a definition is computed; putting the freshness table before the uses would refer to uses not yet named; putting W7 before the definitions would show the answer before the reader knows what a definition must settle.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): Finance and operations bring different order totals to the same meeting and both have counted correctly: finance counts invoices, operations shipments, merchandising products sold, and calling each figure 'orders' hides the difference until leadership mistakes a change in definition for a change in performance.\n\n**Bridge:** Anyone who has sat in a meeting where two reports disagree about last month knows the argument over whose number is right. → Even with every customer and product linked to one master record, the storefront, the ERP and the warehouse count different things, so the question becomes how analytics tells a difference of definition from missing data and which number the company reports.\n\n**Thesis statement** (KEY POINTS callout and paragraph p03): Each system counts what it exists to handle, from the records that reach it, on its own clock, so correct counts differ by definition, collection and time; analytics are trusted when every system is copied into one analytical store, each metric is defined once with an owner, and the company's number is published with the bridge to each system's count.\n\n**Roadmap** (Paragraph p05):\n\n- Start from Kestrel & Pine's three February order counts. *Kept in:* scene.\n- Separate operational from analytical data and show the three ways data reaches the analytical store. *Kept in:* opanalytical, data-out.\n- Say what a metric definition settles and where it lives. *Kept in:* metrics.\n- Name what the data is for and when a live dashboard misleads. *Kept in:* uses, realtime.\n- Weigh four designs by cost and scale stage. *Kept in:* choices, stages.\n- Follow W7 at Kestrel & Pine to one number and a bridge, and end with what goes wrong. *Kept in:* in-practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Finance and operations can bring different order totals to the same meeting and both have counted correctly, and calling each figure 'orders' hides the difference until leadership mistakes a change in definition for a change in performance. | scenario: Finance counting invoices, operations shipments, merchandising products sold, each called 'orders'. |  |\n| p02 | explanation | Linking every record to a master, as the previous chapter did, does not settle the count: the storefront records orders placed, the ERP invoices and the warehouse parcels, so their totals should sometimes differ, and the analytical system must tell differences of definition from missing or incorrect data. |  | `cause_effect`: Correct counts that differ, and the previous chapter's master per entity and cross-reference. → Why the counts still differ: each system serves a different job, and what analytics must therefore separate. |\n| p03 | claim | W7 gives Kestrel & Pine's Data Lead the common definitions of order, revenue and return, and the chapter's answer is to settle those definitions before adding dashboards: copy every system into one analytical store, define each metric once with an owner, and publish the company's number with the bridge to each system's count. |  | `problem_solution`: The need to tell a definition difference from missing data. → Kestrel & Pine's answer, W7, and the chapter's thesis. |\n| p04 | context | In the order's journey, Eva's €235 purchase becomes order #1072455, invoice lines and a parcel, and her exchange a credit note and a second parcel, so the reporting question is what each event counts toward, which In Practice answers. | scenario: Order #1072455 of 13 April 2027, dispatched 14 April; the exchange on 22 April with a credit note and a second parcel. | `example`: Definitions that decide what counts. → Eva's order as the running case. |\n| p05 | transition | The chapter starts from Kestrel & Pine's three February counts, then covers operational and analytical data, the three ways data reaches the analytical store (scheduled copies, event streams, platform exports), what a metric definition settles against published definitions from Shopify, Zalando and Google Analytics, what the data is for and when live dashboards mislead, weighs four designs by stage, follows W7 to one number and a bridge, and ends with what goes wrong. |  | `sequence`: The running case and the thesis. → The order of the chapter. |\n\n## Sections\n\n### Setting the Scene: Three Answers to One Question\n\n**Controlling idea** (`example`, id `scene`): Kestrel & Pine's February 2027 order counts of 21,050, 22,710 and 24,140 are each correct for what they count, and the differences trace to definition, coverage and timing; the real gap was that nobody owned the definition.\n\n**Advances the thesis** (D1): Gives the case the chapter answers: three honest counts and no owner.\n\n**Transition in:** `example`: The roadmap, which starts from the three February counts. → The leadership meeting where the counts met.\n\n**Order of paragraphs** (`chronological`): The meeting comes first, then Hanna's explanation, then the three causes it shows, then the question Mara asks; the causes only make sense after the reader has seen the table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | example | At the March 2027 leadership meeting three managers report February's orders as 21,050 (the shop platform), 22,710 (the ERP) and 24,140 (a BI tool on the WMS), the meeting spends forty minutes without reconciling them, and the data warehouse Kestrel & Pine has run since 2024 has no owned definitions to settle them. | scenario: Milan Petrov 21,050 (the shop platform), Sanne de Wit 22,710 (the ERP), Daniel Okafor 24,140 (a BI tool reading the WMS).; fact: A data warehouse and BI tool since 2024; three definitions of 'order' in use. |  |\n| p07 | evidence | Hanna Berg's explanation, by Wednesday, shows what each count includes, row by row. | table: What each count includes: D2C orders created (18,900 incl. 290 canceled and 40 test) against 18,420 invoiced and 19,100 parcels (incl. 640 second parcels); marketplace orders absent from the platform, 3,310 in the ERP from the connector's weekly summary, 2,520 shipped from Duiven with 790 program-fulfilled; wholesale 610, 980, 980; 1,540 exchanges as platform orders and parcels but credit notes in the ERP; store transactions only as a nightly total. | `time`: The three counts at the meeting. → Hanna's explanation and its table. |\n| p08 | analysis | Three differences explain the totals (definition, collection and time), and a useful report makes those choices visible. | figure: Figure 1: three people at three windows with three counts, explained by definition, collection and time. | `conclusion_summary`: The table's rows. → The three causes they reduce to. |\n| p09 | claim | Mara did not ask which number was correct but who owned the definition, and in March 2027 the answer was nobody. |  | `cause_effect`: Three causes, none of them an error. → The question that follows: who owns the definition. |\n\n### Operational Data and Analytical Data\n\n**Controlling idea** (`definition`, id `opanalytical`): The same facts are used one record at a time to run the business and across all records to analyse it, the two uses need separate stores, and one analytical store (a warehouse or a lakehouse) must receive every system's data.\n\n**Advances the thesis** (D2): Establishes the one place where the counts can be compared.\n\n**Transition in:** `problem_solution`: Counts that can only be compared somewhere all of them land. → The two uses of the same facts and the store each needs.\n\n**Order of paragraphs** (`large_to_small`): The distinction first, then why the stores must be apart, then the two forms of the analytical store, then the judgement that for this merchant the form is a vendor choice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | claim | The three counts can only be compared where all of them land, and the first idea a newcomer needs is that the same facts are used in two different ways that want different stores. |  |  |\n| p11 | definition | Operational data is the live state of the business, read and written one record at a time and fast; analytical data is the history laid out for questions across all records, which read millions of rows and tolerate hours of lag. |  | `elaboration`: Two ways of using the same facts. → Each way defined, with examples. |\n| p12 | cause_effect | The two must be kept apart because an analytical query competes with checkout for the same machine, so analytical questions never run against an operational store and an analytical store is never trusted for an operational answer. | example: A year-long report run against the platform's database on a Friday evening in November; 'the dashboard says it shipped' is not a shipment. | `cause_effect`: The two uses' different load and lag. → Why they need separate stores, and the rule. |\n| p13 | definition | The analytical store comes in two forms; the first, a data warehouse, is a database built for large analytical queries into which copies of every system's data are loaded and modelled, and vendors describe separating storage from compute so one team's queries do not slow another's. | source: Snowflake's architecture documentation; Google's BigQuery as 'a fully managed serverless data warehouse'. | `elaboration`: The analytical store. → Its first name and form, the data warehouse. |\n| p14 | definition | A lakehouse keeps the raw copies in open file formats in cloud storage and runs warehouse-style queries over them, proposed in 2021 against the staleness, duplication and cost of a lake feeding a separate warehouse. | source: Armbrust, Ghodsi, Xin and Zaharia, CIDR 2021. | `contrast`: The warehouse. → The second form, the lakehouse. |\n| p15 | recommendation | For a merchant of Kestrel & Pine's size the difference is a vendor choice, not an architecture choice; what matters is that one analytical store exists and every system lands in it. | figure: Figure 2: every operational system copied into one analytical store, modelled once and served through a metrics layer. | `conclusion_summary`: Two forms of the analytical store. → Which matters for this merchant: that one exists and receives everything. |\n\n### Getting the Data Out\n\n**Controlling idea** (`process`, id `data-out`): Three mechanisms (extract-and-load, event streams and platform exports) copy operational data into the analytical store, each with its own way of missing a change.\n\n**Advances the thesis** (D2): Explains the collection cause of the scene's differences and why a missed edit stays a difference.\n\n**Transition in:** `sequence`: One analytical store every system lands in. → How the data gets there.\n\n**Order of paragraphs** (`grouping`): The three mechanisms from the most common to the least; the sweep paragraph follows extract-and-load directly because it reads the connector's behaviour as a reconciliation, and moving it later would separate it from the cursor and lookback window it explains.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | claim | Three mechanisms carry data from the operational systems into the analytical store, and a merchant usually uses all three. |  |  |\n| p17 | definition | Extract-and-load (ELT) copies a system's tables on a schedule through a connector, and hosted tools sell it by volume. | source: Fivetran prices by monthly active rows, free tier of 500,000, 15-minute syncs on its Standard plan. | `sequence`: Three mechanisms. → The first, extract-and-load. |\n| p18 | example | A real connector does what the previous chapters taught: it syncs incrementally on each record's update time, offers a lookback window for late updates, captures deletions separately and backs off on rate limits. | source: Airbyte's Shopify source, version 4.3.5, changelog of 3 November 2026: streams, update-time cursor, lookback window, deleted-products stream, rate-limit backoff. | `example`: Extract-and-load through a connector. → One connector's documented behaviour. |\n| p19 | analysis | Incremental extraction is a reconciliation sweep applied to analytics: an edit after the last run is caught by the lookback window or not at all, and a missed edit becomes a permanent difference between the warehouse and the platform. |  | `cause_effect`: The connector's cursor and lookback window. → What that means for the counts: a missed edit stays a difference. |\n| p20 | definition | Event streams carry each change as it happens through a durable log the warehouse reads at its own pace, giving it the same facts the operational systems act on with no second extraction. | case: Walmart's inventory events: more than ten sources normalized into one feed, each item and store pair handled by one consumer. | `contrast`: Scheduled extraction and its sweep. → The second mechanism, which carries each change as it happens. |\n| p21 | definition | Platform exports deliver many records in one file and spare the rate budget that a page-by-page pull of a year's orders would spend on a report. | source: Shopify's bulk operations; Stripe's Data Pipeline recommended 'for a complete export of API data'. | `sequence`: Two mechanisms. → The third, platform exports. |\n\n### One Definition: Metrics and the Metrics Layer\n\n**Controlling idea** (`definition`, id `metrics`): A metric definition settles what is counted, which records and dates apply and how later changes are reported; public definitions differ, so each metric is defined once as code in a metrics layer outside any dashboard, owned by its business domain with central standards, and published with a bridge to each system's count.\n\n**Advances the thesis** (D3, D6): Gives the definition cause of the scene's differences and the place a single definition lives.\n\n**Transition in:** `sequence`: Every system's data landing in one store by three mechanisms. → What decides how a record in it is counted: the metric definition.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): What a definition is and four public definitions that differ, then the hard rows every definition must settle, then where a definition lives (the metrics layer and its products), the two properties that matter and who the owner is, then the bridge beside it. The reader learns what a definition contains before where it is stored; ownership follows the property it elaborates; the bridge comes last because it presupposes one owned definition.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | definition | Once every system lands in one store someone must say how to count, and a metric definition is the written rule for computing a business number; public definitions from large companies show how many decisions hide in a word like 'order'. | table: Shopify's ShopifyQL sales schema (2026-10), Shopify's FY2025 GMV, Zalando's 2025 GMV and average basket of €62.8, GA4's purchase event and its transaction_id. |  |\n| p25 | analysis | The four sources use four units, each internally consistent and none interchangeable, which is why analytics vendors publish lists of the usual gaps between a platform's sales and web analytics. | source: Vendor help pages listing the usual platform-versus-analytics gaps (app and subscription orders, POS and draft orders, ad blockers and consent, refunds, currency and tax, attribution windows). | `conclusion_summary`: The four definitions in the table. → What they add up to: four units, none interchangeable. |\n| p29 | explanation | A definition must settle the hard rows that are always the same: cancellations, returns, exchanges, test orders and split shipments, the date, the currency and tax basis, and how a late change is reported, with Hanna's W7 table later in the chapter as a worked example. |  | `elaboration`: Four public definitions that count an order on four bases. → The hard rows every definition must settle, with Hanna's W7 table later in the chapter as the worked example. |\n| p26 | definition | The architectural answer to definitional drift is the metrics layer, one place where each metric is defined as code and from which every dashboard computes it. | quotation: Benn Stancil, 2021: 'there's no central repository for defining a metric'. | `problem_solution`: Definitions that must settle the same hard rows and that drift when each dashboard settles them again. → The metrics layer. |\n| p27 | example | The products that followed implement the idea differently: dbt's Semantic Layer, Looker's LookML and Cube. | source: dbt: a changed definition 'is refreshed everywhere it's invoked'; LookML describes dimensions and aggregates once; Cube adds access control, caching and APIs. | `example`: The metrics layer as an idea. → Products that implement it. |\n| p28 | claim | The tool matters less than two properties: the definition lives outside any one dashboard, and it has an owner. |  | `contrast`: Three products. → What matters regardless of the product. |\n| p36 | recommendation | Who owns a definition follows the business domains: domains own their datasets and definitions as products, the data team owns the platform and the shared keys, time zones and currency rules that make them joinable, and below about five data people one owner, the Data Lead under W7, holds the definitions. | quotation: Zhamak Dehghani, 2019: domains should 'host and serve their own datasets'. | `elaboration`: The second property: a definition has an owner. → Who that owner is: the domain, with central standards. |\n| p29a | definition | A definition needs a bridge beside it: the published reconciliation from the company's count to each system's count. |  | `additional_support`: A definition outside any dashboard, owned by its domain. → The bridge that accompanies it. |\n\n### What the Data Is For\n\n**Controlling idea** (`description`, id `uses`): Every use of the data computes from the shared definitions: the same warehouse serves reporting, experimentation, data science, merchandising and inventory planning, and partners, each with different tolerances.\n\n**Advances the thesis** (D3): Shows that every use of the data depends on the definitions and says who owns them.\n\n**Transition in:** `cause_effect`: One owned definition per metric, published with its bridge. → The uses that compute from it and their different tolerances.\n\n**Order of paragraphs** (`grouping`): The uses in turn, internal first and partners last; partners come last because their data products add a contract and consent to the definitions the internal uses share.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | claim | Every use of the data inherits the definitions and their bridge, and the same warehouse serves four internal audiences with different tolerances, and partners from the Omnichannel stage, which a design should name. |  |  |\n| p31 | definition | Reporting is the monthly and weekly record, and it must be defined, reconciled and revised with a stated policy. |  | `sequence`: Four audiences. → The first, reporting. |\n| p32 | definition | Experimentation compares two versions on randomly split traffic and needs event-level data with a stable key and the same metric definitions as reporting. |  | `sequence`: Reporting's definitions. → Experimentation, which must use the same definitions. |\n| p33 | definition | Data science builds forecasts and models from the modelled tables and writes back predictions, and it is the main reason to keep raw history. |  | `sequence`: Experimentation. → Data science. |\n| p34 | definition | Merchandising and inventory planning is the most commercially important use at Kestrel & Pine's stage, and its two numbers, sell-through and weeks of cover, depend on one definition of a sale and one view of stock. | example: Teun Baas reading sell-through on the moss Ridgewalker; Daniel Okafor reading weeks of cover; stock across Duiven, six stores and the marketplace program's location. | `sequence`: Data science. → Merchandising and inventory planning, the use that matters most here. |\n| p35 | definition | Data products for partners appear at the Omnichannel stage; warehouses now make delivery cheap, which moves the cost to definitions and consent. | source: Snowflake's Secure Data Sharing with 'no actual data ... copied'; Databricks' open sharing protocol across platforms. | `additional_support`: The internal uses. → Uses outside the company: data products for partners. |\n\n### Real-Time Dashboards and When They Mislead\n\n**Controlling idea** (`explanation`, id `realtime`): Each flow of data needs its own freshness and completeness, and a live dashboard counts while records are still arriving, so live operational signals and business metrics shown on a lag with a definition, a revision policy and the reconciliation are different objects and must not share a label.\n\n**Advances the thesis** (D4): Explains the time cause of differences for live views and gives the rule for showing each kind of number.\n\n**Transition in:** `contrast`: Uses that compute from shared definitions on settled data. → How fresh each flow must be, and the live view that counts before the data has settled.\n\n**Order of paragraphs** (`problem_solution`): The freshness table first, because it sets the live operational view beside the settled reports; then the confusion between its last two rows, the reason a live count is provisional, and the rule that separates them. The table needs the uses of the previous section, which is why it sits here rather than with the mechanisms; the rule needs the confusion stated first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | comparison | The uses work on settled data while running the business live does not, so each flow of data (orders and shipments, stock snapshots, finance figures, operational dashboards, board reports) needs its own freshness and completeness, with a different system allowed to disagree. | table: Five flows (orders and shipments, stock snapshots, finance figures, operational dashboards, board reports) with how fresh, how complete, who may disagree and the typical mechanism; illustrative targets. |  |\n| p23 | analysis | The table's last two rows, a live orders-per-minute dashboard and a monthly order count, are the ones that get confused, and showing both under one label makes the dashboard a fourth opinion. |  | `emphasis`: The table's last two rows, live operational dashboards and monthly board reports. → The confusion between a rate and a record. |\n| p37 | cause_effect | A real-time dashboard counts while orders, refunds and payment records are still arriving, so a live view and a closed-period report can disagree without either calculation being wrong. | source: GA4's intraday export is best-effort and some attribution lags up to 24 hours; Stripe: a payout 'might arrive before its reconciliation data is ready'. | `cause_effect`: A rate for acting now against a record that will be revised. → Why a live count is provisional: records are still arriving, as the vendors document. |\n| p38 | recommendation | Operational signals are rates for acting in the next ten minutes and are shown live and approximate; business metrics are records shown on a lag with a definition, a revision policy and the reconciliation beside them. | example: A live 2,300 orders against a reported 2,210, with 90 canceled, refunded, edited or duplicated after the dashboard counted them; Figure 3. | `problem_solution`: A live view and a report that disagree. → The rule that separates the two kinds of number. |\n\n### The Choices and Their Trade-offs\n\n**Controlling idea** (`comparison`, id `choices`): Four realistic designs exist for a merchant's analytics, mostly a function of stage, and at Kestrel & Pine's stage the warehouse with extract-and-load and a metrics layer is right, with a reconciliation published with the number.\n\n**Advances the thesis** (D5, D6): Compares the designs and adds the published reconciliation that no vendor sells.\n\n**Transition in:** `conclusion_summary`: The store, the feeds, the definitions, the uses and the live rule. → Four designs that combine them differently.\n\n**Order of paragraphs** (`small_to_large`): The designs from the smallest to the largest, then the table that sets them side by side, then the recommendation.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | claim | The store, the feeds, the definitions, the uses and the live rule combine into four realistic designs for a merchant's analytics, and the right one is mostly a function of stage. |  |  |\n| p40 | description | The platform's reports plus web analytics need no engineering but give two definitions of 'order' from day one and cannot count other channels alongside. |  | `sequence`: Four designs. → The smallest. |\n| p41 | description | A BI tool on operational copies is cheap and quick, but every report embeds its own definition, and a wrong report is wrong invisibly. | fact: Much of Kestrel & Pine's reporting in early 2027 still worked this way, beside a data warehouse with no owned definitions. | `sequence`: Platform reports. → The next design up. |\n| p42 | description | A warehouse with extract-and-load, a modelling tool and a metrics layer copies every system into one store with metrics defined once and reconciled, the standard Omnichannel design. |  | `sequence`: Reports that each embed a definition. → The design that defines each metric once. |\n| p43 | description | An event stream feeding a lakehouse and the operational systems carries order and stock events once to every reader, the Group-stage design. | table: The four designs by cost and skills, definitions, freshness and when each is right. | `sequence`: The Omnichannel design. → The largest design. |\n| p44 | recommendation | The author recommends the third design for a merchant at Kestrel & Pine's stage, with a reconciliation published with the number (the platform's, the ERP's and the warehouse report's counts with the bridge between them), because a number with its bridge is believed and a number alone is argued with. |  | `conclusion_summary`: The four designs and the table. → The author's choice and the one addition vendors do not sell. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): The subject changes shape with scale: nothing to build at Starting, a warehouse before the second channel at Growing, ownership rather than technology at Omnichannel, federation at Group.\n\n**Advances the thesis** (D5): Shows that the definitions and their owner, not the tool, become the problem as the merchant grows.\n\n**Transition in:** `elaboration`: Designs that depend on the stage. → Each stage with what is typical, what becomes necessary and the warning signs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | analysis | The subject changes shape with scale: at Starting there is one thing to know, at Growing the warehouse is worth building before the second channel, at Omnichannel the problem is ownership, not technology, and at Group it is federation across units. | table: The four stages with what is typical, what becomes necessary and the warning signs of outgrowing it.; fact: Kestrel & Pine had a warehouse for three years before it had a definition. |  |\n\n### In Practice: Waypoint W7 at Kestrel & Pine\n\n**Controlling idea** (`example`, id `in-practice`): Under W7 Hanna Berg's definitions turned February's three counts into one number and a bridge, the bridge found its first exception in August 2027, and the definitions took three weeks because the warehouse already existed.\n\n**Advances the thesis** (D6, D1): Resolves the scene's three counts with a definition table and a bridge.\n\n**Transition in:** `example`: The recommendation of a warehouse with a metrics layer and a published bridge. → Kestrel & Pine doing it under W7.\n\n**Order of paragraphs** (`chronological`): The definitions, then the restated February number, then how the bridge changed the monthly report and its first exception, then why it was cheap.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | evidence | Under W7 Hanna Berg published the metric definitions in June 2027, adopted from the July close, settling order, store transaction, net sales, return and customer. | table: Definitions of order (confirmation in Amsterdam time, every channel incl. program-fulfilled marketplace orders, test excluded, cancellations counted with status, exchange a return outcome, split order one order), store transaction beside orders, net sales excl. VAT recognized at delivery (IFRS 15), return with the 24% item and 19% order rates and 28% exchanges, customer deferred to identity. |  |\n| p47 | evidence | With the definitions, February 2027 became 23,150 orders, 22,860 net of cancellations, with 9,200 store transactions reported beside them, and Eva's order counts once while her exchange is a return outcome. | statistic: 18,860 D2C + 3,310 marketplace + 980 wholesale = 23,150; 22,860 net of cancellations; 9,200 store transactions.; figure: Figure 4: the bridge from the platform's count to the W7 definition and on to the ERP's and the warehouse's counts.; scenario: Eva's order #1072455 counted once at confirmation on 13 April; her exchange a return outcome, not a second order. | `cause_effect`: The definitions. → The restated February number. |\n| p48 | example | The bridge, not the number, changed the meeting: the monthly report shows the W7 count beside each system's count, and a difference the bridge does not explain is an exception, the first of which was 23 marketplace orders the connector's weekly summary had dropped. | case: August 2027: 23 marketplace orders dropped from the connector's weekly summary during a vendor outage (illustrative). | `emphasis`: One number. → The bridge beside it, which did more. |\n| p49 | analysis | W7 was cheap because the definitions took three weeks of conversations on a warehouse and BI tool that already existed, and the OMS from Q4 2027 shrinks the collection problem without removing the need for W7. |  | `cause_effect`: What W7 achieved. → Why it cost little, and what the OMS does and does not settle. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`cause_effect`, id `wrong`): Each failure of analytics comes from a missing part of the design (a missed late edit, two clocks, refunds netted on one side, reports on operational stores, browser analytics as the order count, a metric redefined in a dashboard, the warehouse used as a system of record, a partner feed without a contract), and each has a way to notice it and a fix.\n\n**Advances the thesis** (D6, D2): Shows each part of the design by what happens without it.\n\n**Transition in:** `contrast`: The design working at Kestrel & Pine. → What goes wrong when a part of it is missing.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | claim | Most failures in analytics come from a part of the design that is missing, and each shows itself in a recognizable way. | table: Eight failures with how you notice each and what to do. |  |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The opening's meeting, where finance and operations bring different correct totals, is answered by the chapter's parts together: the counts differ by definition, collection and time; one analytical store receiving every system makes them comparable, one owned definition makes one of them the company's, and the bridge to each system's count turns every remaining difference into either an explained definition or a missing record. For the part: the Black Friday stock chain, the Double Refund, the Deprecated Endpoint, Eva's four records and February's three counts look like five problems in five technologies and are one: in each, both ends worked and something about the join had not been decided, and each chapter's remedy is a record with an owner.\n\n**So what:** A merchant can explain any two counts by definition, collection and time and write the definition before buying a dashboard; at Kestrel & Pine W7 took three weeks. Across Part VI the remedies were records with owners: W5's integration standards, Eva's four records made one master with three links in July 2027, and February restated as 23,150 orders with a bridge.\n\n**Callback:** The introduction's meeting where finance and operations bring different correct totals; and, for the part, the Part VI opening's order that reaches the warehouse twice, stock update that arrives after the last unit has sold and invoice whose customer finance cannot identify. p51 answers the chapter's opening meeting; p56 returns to the part opening and names what its five cases have in common; p57 gives the part's so-what and take-away.\n\n**Takeaway** (`course_of_action`): Write the definition of an order, net sales and return with an owner and publish the bridge to each system's count every month; for the part, build the integration inventory for your own landscape, one row per flow with its owner, idempotency key, pinned version and sunset date and reconciliation job, then name a master per shared entity and an owner per metric, starting with the rows that have no owner and the flows that move stock, orders or money with nothing comparing their two ends.\n\n**Hand-off** to [Part VII — PLATFORM: How Commerce Platforms Are Built](part-7.html): `place`: The merchant's own landscape and its joins. → The inside of the platforms the merchant buys.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | synthesis | The opening's two correct but different totals now have an answer: one store makes them comparable, one owned definition makes one of them the company's number, and the bridge sorts every remaining difference into an explained definition or a missing record. | reasoning: The opening meeting set against the store, the definition and the bridge. |  |\n| p52 | synthesis (list) | Established: operational and analytical workloads belong in different stores, public metric definitions differ and say so, and incremental extraction from a SaaS platform is a reconciliation sweep. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what the sources establish. |\n| p53 | synthesis (list) | Depends on context: extract-and-load or events depends on whether the operational systems already emit events, central or domain ownership on team size, and a metrics layer product on how many tools consume the metrics. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p54 | recommendation (list) | The author's synthesis: the number that gets believed is the one published with its bridge, and definitions should come before building. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p55 | recommendation (list) | Eight questions let the reader find, in their own company, who owns the definition of an order, where metrics are defined, how late changes are reported, which systems are missing from the warehouse, which reports hit operational stores, how late edits are caught, which dashboard numbers are rates and which records, and what partners receive. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own company. |\n| p56 | synthesis | Part VI opened with an order that reaches the warehouse twice, a stock update that arrives after the last unit has sold and an invoice whose customer finance cannot identify, and its five cases (the Black Friday stock chain, the Double Refund, the Deprecated Endpoint, Eva's four records and February's three counts) look like five problems in five technologies but are one: in each, both ends worked and something about the join had not been decided. | reasoning: The part's five cases set against the part opening's three failures. | `conclusion_summary`: The chapter's questions, the last of the part's five. → The part's cases read together against its opening. |\n| p57 | recommendation | Each chapter's remedy was a written record with an owner rather than a new system, and at Kestrel & Pine those records produced measurable results, so a reader can start an integration inventory of their own, beginning where no one owns a row. | case: W5's integration standards (an owner, a contract and a reconciliation job per flow); Eva's four records one master with three links in July 2027; February restated as 23,150 orders with a bridge. | `cause_effect`: One problem across the five cases: an undecided join. → The remedy each chapter gave and what it produced, and what the reader does next. |\n| p58 | transition | Part VI has dealt with the joins inside the merchant's own landscape; Part VII looks inside the platforms the merchant buys and asks how the way a bought platform is built limits what a merchant can promise, and what is left for the merchant to decide. |  | `place`: The merchant's own landscape and its joins. → The inside of the platforms the merchant buys. |\n\n## Non-goals\n\n- Integration mechanics (ELT connectors as an integration style, change data capture, iPaaS). See [APIs, Events, Files and Middleware: How Commerce Systems Talk](integration-styles.html).\n- Reconciliation jobs and idempotency in the operational systems; this chapter applies the sweep idea to analytics only. See [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html).\n- Customer identity and matching, and therefore customer counts; the chapter defers the 'customer' metric explicitly. See [One Customer, One Product: Identity and Master Data Across Systems](identity-and-master-data.html).\n- Experimentation design and search or storefront metrics. See [Finding the Product: Search, Navigation and Merchandising](commerce-search-and-discovery.html), [Delivering the Storefront: Themes, Headless, Rendering and Performance](storefront-architecture.html).\n- Privacy obligations of partner data products. See [Whose Data Is It? Privacy, Consent and Retention](privacy-and-customer-data.html).\n- Revenue recognition rules in accounting terms; the chapter takes the ERP's basis as given. See [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: after the confirming round 3 (escalate: 14 passed, 8 failed; one failure at fault in the spec, the rest past the revision budget), the cheap, plainly right fixes were made without another round. Spec fault (no_weak_conclusion_pattern: the take-away's team-size rule was new in the conclusion): p36 now states it in the body ('Below about five data people, the Data Lead under W7 holds them'), which also removes the apparent conflict between domain ownership and W7. Draft: p06 names each count's source; p13 says 'comes in two forms' instead of 'has had two names' (the lakehouse is a different design); p51 returns to 'finance and operations with correct but different totals' (the introduction's example, not the three-count meeting); p04 says In Practice returns to Eva's order; the design table's warehouse row reads 'Growing and Omnichannel stages' to agree with the stage table. To hold 5,840 words (rule 4), agent additions were cut: the part closing's May 2027 stock-reconciliation figure (both round-3 readers found it out of place), W5's list shortened, the hand-off merged into one sentence, p29a and p22 shortened. Rejected: a fourth round; raising the word limit.\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: (rule 10) the Eva paragraph p04 keeps its house position between the thesis and the roadmap, with its opening label; the transition finding there (the link to definitions arrives in its last sentence) is answered by the forward pointer to In Practice, not by moving the paragraph. (rule 7) AC-6 passed in all three rounds and is kept     (function () {
        const data = JSON.parse(document.getElementById('data').textContent);

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');

                sectionEl = document.createElement('p');

                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
