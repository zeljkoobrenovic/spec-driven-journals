<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/24-integration-styles/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (a thesis paragraph p04, a roadmap p06 and a conclusion paragraph that answers the opening p50); see decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The four integration styles (file, shared database, direct call, message), the five triggers (call, webhook, poll, schedule, change data capture) and the three ways to wire a landscape (point to point, a hub such as an iPaaS, a vendor's connector), each with a commerce example.\n- **Know:** The needs that decide a flow's style (freshness, consistency, latency, availability) for stock, orders, prices, products, customers and finance, and the rule Waypoint's W5 adopts: stock, orders and prices by events, products by scheduled publication, finance by daily batch.\n- **Know:** The integration inventory's columns and the book's operational definition of integration debt: the integrations whose owner, contract version, failure alert and reconciliation job are unknown.\n- **Believe:** The style is chosen per flow, never for the company.\n- **Believe:** A webhook is a notification, not a guarantee, and a hub without owners, contracts and reconciliation is the same tangle in one place.\n- **Believe:** An inventory with a named owner on every row is worth more than any integration tool.\n- **Be able to:** Classify any integration by style and trigger, and say what it does when the other side is down and whether anyone owns it.\n- **Be able to:** Choose the style and trigger for a flow from its needs and the business's scale stage, and start an integration inventory with an owner per row.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer or engineering lead who inherits an integration landscape they did not build (Noor Visser's position), and next the product manager or operations lead who has to ask how anyone knows a flow worked.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its thirteen systems and 34 integrations, its 2026 and January 2027 incidents in outline and the names of the sixteen failure patterns.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines, 'system', 'the shop platform' and 'commerce platform', business models and the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- Parts II to V: one owner per product, price, discount and stock fact; available-to-promise; checkout creating the order once; refunds as new payments; one order record with three status lines; one invoice per shipment and the monthly match; the WMS as the only writer of on-hand stock; the marketplace connector that owns nothing; the ERP owning the business buyer's prices, terms and credit and receiving orders, shipments and payments by batch; one source per EDI document.\n- From the Part VI introduction: the five questions of the part and the 13 integrations with no named owner in January 2027.\n\n**Does not yet know:**\n\n- Integration style; the four styles (file transfer, shared database, direct call, messaging); synchronous and asynchronous; queue and broker.\n- Triggers: polling, scheduled batch, change data capture; event notification and event-carried state transfer; event sourcing and CQRS (only named).\n- Point to point, hub, vendor connector; iPaaS metering units.\n- Integration inventory and integration debt.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a scheduled stock chain and a peak order rate, the reader names the oversell window and the style each flow should use, and starts with an inventory rather than a new tool. *Probe:* A brand sends stock from its warehouse system to its ERP every 15 minutes, from the ERP to the storefront hourly and from the storefront to its marketplaces hourly; orders reach the warehouse through a webhook into an integration platform; finance receives orders by an hourly copy. In the peak hour the shop takes 38 orders a minute. Using only this chapter: what is wrong with the stock flow, which style should each flow use, and what is the first management step? | `custom` | cold_reader | major |\n| AC-2 | The reader can say why 'we use webhooks, so nothing gets lost' is wrong. *Probe:* A colleague says: 'We use webhooks, so we are event-driven and nothing gets lost.' Using only this chapter: what is wrong with that, and what should be added? | `custom` | cold_reader | major |\n| AC-3 | The reader can say when an iPaaS pays for itself and what a hub does not provide. *Probe:* Using only this chapter: when is a hosted integration platform worth buying, how should vendors be compared, and what does it not give you? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What ways do systems have to exchange data, and when is each the right choice?\n\n> **Claim:** Systems exchange data by file, shared database, direct call or message, triggered by a call, webhook, poll, schedule or database change log. The flow decides, not the company: stock, orders and prices by events checked by a reconciliation job, products by scheduled publication, finance by a checked daily batch, direct calls only where the next step needs the answer; every flow needs a named owner in an integration inventory.\n\n**Disputed by:** The view that integration is a company-wide strategy or a tool purchase ('we are event-driven now', 'the iPaaS is our integration layer'): one style serves every flow, and a hub or a vendor's connector supplies the ownership.\n\n**So what:** A merchant that accepts the claim chooses each flow's style from that flow's needs, as Kestrel & Pine's W5 does, and puts no flow live without an inventory row and an owner. Noor Visser's inventory found 34 integrations (9 file or batch, 1 shared-database read, 11 direct calls, 13 event, webhook or queue flows); 13 had no named owner in January 2027 and 5 were still unowned in April 2027; only 3 had a reconciliation job, none for stock or orders. On Black Friday 2026 a 15-minute hop and two hourly hops let channels sell sold-out stock for up to two hours; at the peak hour's 38 orders a minute, even one 15-minute interval is 570 orders.\n\n**How and why:** Flows differ in what a stale or lost copy costs: a stock copy's age is the oversell window, an order must never be lost or doubled and must wait out a warehouse outage, a wrong price is a broken promise, product content is prepared and released by season so completeness matters more than speed, and finance works in periods and needs completeness to the cent. The styles trade these differently: a file is complete but as old as its schedule; a direct call is fresh but fails when the other side is down; a message survives outages but arrives at least once and out of order, so it needs a key and a comparison. A hub centralizes mapping and retries but not responsibility, so a flow with no owner fails unnoticed in any tool.\n\n**Supporting claims**\n\n- **S1** — Systems exchange data in four styles (file transfer, shared database, direct call, messaging) that differ in whether they share storage and whether the sender waits: a direct call is fresh but fails when the other side is down, the asynchronous styles survive outages but leave copies that disagree for a while.\n- **S2** — A separate choice, the trigger (call, webhook, poll, schedule, change data capture), decides when an exchange starts; a webhook is a notification, not a guarantee, so every webhook flow needs a polling sweep or reconciliation job beneath it.\n- **S3** — A landscape is wired point to point, through a hub such as an iPaaS, or by a vendor's connector; a hub centralizes mapping, retries and monitoring but not ownership, a vendor connector encodes an ownership model that fits only when it matches the merchant's, and hubs are compared per flow at the merchant's volume.\n- **S4** — The style is chosen per flow from its freshness, consistency, latency and availability needs (stock, orders and prices by events with a reconciliation net, products by scheduled publication, finance by a checked daily batch, direct calls only where the next step needs the answer), and the rule holds at every scale stage while the discipline around it grows.\n- **S5** — Every flow needs a row in an integration inventory with a named owner; integration debt is the set of flows whose owner, contract version, failure alert and reconciliation job are unknown, and Kestrel & Pine's incidents ran in such flows.\n\n## Role in the part\n\nGives the part its vocabulary and its first decision: the four styles and five triggers, the style chosen per flow (the rule W5 adopts), and the integration inventory with an owner per row, to which the next chapters add keys, reconciliations, versions and sunset dates. Supports P6-1 of part `part-6`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene and integration: the 34 flows nobody had listed, then what a flow is and which lever controls which of its properties; `grouping` in styles, triggers and wiring: how data moves, when it moves and how the landscape is wired; `comparison` in trade-offs and stages)\n\nNoor's inventory comes first so that every term arrives as part of the answer to her question of what the 34 flows are and who owns them. What an integration is comes next because the four properties it names (freshness, reliability, coupling, ownership) are the criteria every later section uses, and it splits them between the style and the inventory. The styles precede the triggers because a trigger starts an exchange of some style, and both precede the wiring options because a hub carries flows of every style and trigger. The trade-offs compare the options and draw the judgements that Choosing Per Flow then applies flow by flow; the stages say how the rule holds as a merchant grows and that the discipline around it is what changes, which leads into its first piece, the inventory and integration debt. In Practice then shows Eva's order and the stock path as inventory rows before and after Waypoint, and the failures come last because each is read against a style's weakness or a missing inventory column. Putting the per-flow rule before the styles and triggers would recommend options the reader cannot yet name; putting the wiring before the triggers would describe a hub's retries before the reader knows what is retried; putting the failures earlier would describe detections for columns not yet defined; putting the trade-offs after the rule (the published order) made them read as justification after the fact, and putting In Practice before the inventory showed an inventory excerpt before its columns were defined, as round-1 readers reported.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A storefront accepts an order, but the warehouse can only pick it after its own system receives the instruction: if that message is lost the customer is charged while the parcel never enters the picking queue, and if it arrives twice the warehouse may prepare two parcels.\n\n**Bridge:** Anyone who has ordered online knows the moment after checkout when the order disappears into the shop's back office. → Behind that moment is a message between separately owned systems, so the question becomes which ways systems have to exchange data and when each is the right choice.\n\n**Thesis statement** (KEY POINTS callout (the full rule per flow) and paragraph p04 (the two halves, without repeating the rule)): Systems exchange data by file, shared database, direct call or message, started by a call, a webhook, a poll, a schedule or a database's change log; the choice is made per flow, not for the company (stock, orders and prices by events checked by a reconciliation job, products by scheduled publication, finance by a checked daily batch, direct calls only where the next step needs the answer), and every flow needs a named owner in an integration inventory.\n\n**Roadmap** (Paragraph p06):\n\n- Start from Noor Visser's inventory of the 34 integrations. *Kept in:* scene.\n- Say what an integration is and what its design decides. *Kept in:* integration.\n- Set out the four styles, the five triggers and three ways to wire a landscape, with what a hosted integration platform costs. *Kept in:* styles, triggers, wiring.\n- Weigh the styles against each other, choose a style per flow and look across scale stages. *Kept in:* trade-offs, per-flow, stages.\n- Turn the inventory into a working tool with a definition of integration debt. *Kept in:* inventory.\n- Follow Eva's order and the stock path before and after Waypoint, and end with what goes wrong. *Kept in:* in-practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A storefront's order reaches the warehouse only as a message to the warehouse's own system: if the message is lost the customer is charged and nothing ships, and if it arrives twice two parcels may be prepared, so the reliability of the handoff reaches the customer. | scenario: One order whose message to the warehouse is lost or arrives twice. |  |\n| p02 | definition | An integration exchanges data or triggers work between systems, and its design decides how fresh the stock badge is, what happens during an outage and who investigates a missing order; at Kestrel & Pine three scheduled updates added their delays together and let the channels oversell for up to two hours on Black Friday. | case: The Black Friday Oversell: three scheduled updates in a row let storefronts and marketplaces sell a sold-out jacket for up to two hours. | `elaboration`: The handoff whose reliability reaches the customer. → The name for such a handoff and what its design decides, with Kestrel & Pine's Black Friday case. |\n| p03 | claim | Flows differ in the timing and recovery they need, so choosing the exchange method per flow avoids paying for speed where it adds little and tolerating delay where it loses sales. |  | `cause_effect`: What an integration's design decides. → That the right design differs per flow. |\n| p04 | claim | The part introduction's first question, how systems talk, and why so many of Kestrel & Pine's integrations had nobody to call, get this chapter's two-part answer: each flow's way of exchanging data and its trigger are chosen from that flow's needs, not as one strategy for the company, and every flow needs a named owner in an integration inventory. | statistic: 34 integrations, 13 with no named owner in January 2027. | `elaboration`: Flows differ in what they need; and the part introduction's first question with its 13 unowned integrations. → The chapter's answer: four styles, five triggers, the choice per flow and an owner per flow. |\n| p05 | context | In the order's journey, Eva's jacket order of 13 April 2027 crosses from the platform to the warehouse after checkout, payment success arrives separately, and after picking stock changes travel back toward the storefronts and marketplaces; the chapter follows those messages and who is responsible at each crossing in In Practice, once the ways of exchanging data have names. |  | `example`: The chapter's answer in general terms. → The order whose messages the chapter follows. |\n| p06 | transition | The chapter starts from Noor Visser's inventory of the 34 integrations, says what an integration is and what its design decides, sets out the four styles, the five triggers and three ways to wire a landscape with what a hosted integration platform costs, weighs the styles against each other, chooses a style per flow and looks across scale stages, turns the inventory into a working tool with a definition of integration debt, follows Eva's order and the stock path before and after Waypoint, and ends with what goes wrong; the evidence is Kestrel & Pine's inventory and incidents and the vendors' documentation, and recovery from duplicates and changes to agreements are left to the next two chapters. |  | `sequence`: Eva's order and the messages it sends. → The order of the chapter's sections, its evidence and what the next two chapters take over. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: Thirty-Four Lines Nobody Had Drawn\n\n**Controlling idea** (`example`, id `scene`): Noor Visser's first inventory found 34 integrations where the official list held 14, with 13 unowned in January 2027 and nothing comparing stock or orders, which made the business case for W5.\n\n**Advances the thesis** (S5): Gives the case the chapter answers: flows nobody owned or checked, and the incidents that ran through them.\n\n**Transition in:** `example`: The chapter's roadmap, which starts from Noor Visser's inventory. → The inventory itself.\n\n**Order of paragraphs** (`chronological`): The incomplete list Noor received comes first, then the inventory she built in February, then what it showed: the findings only make sense once the reader has seen how many flows were missing from the list.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | description | In January 2027 Kestrel & Pine had thirteen systems and 34 integrations, but the list new Head of Engineering Noor Visser received from lead integration engineer Ruben Alves held only the fourteen flows running in the iPaaS (a hosted tool for configuring data flows); scripts and other connectors were missing. | fact: Thirteen systems, 34 integrations, 14 on the iPaaS list. |  |\n| p08 | evidence | Noor's February inventory, one row per flow, found all 34, three of them only because data arrived that no listed flow explained, and classified them by style, builder, ownership, reconciliation and stock writing.; its first rows count by method, the styles the next sections explain, and the next row counts the same 34 by builder | table: 9 file or batch flows, 1 shared-database read, 11 direct API calls, 13 event, webhook or queue flows; 14 iPaaS, 9 agency scripts, 11 vendor connectors; 13 unowned as of January 2027 and 5 still unowned in April 2027; 3 with a reconciliation job; 4 flows writing stock into the platform, six writers of Duiven stock in all. | `time`: The incomplete list of fourteen flows. → The inventory Noor built in February and what it counted. |\n| p09 | analysis | Two findings made the business case for W5, Waypoint's integration standards: in January 2027 thirteen flows had nobody who would be called when they stopped and nothing compared stock or orders between any two systems; the Black Friday stock chain had three scheduled hops, each with an owner, and no check across its ends, and the Price Drift and the Deprecated Endpoint ran in flows with no owner and no check. | case: Black Friday Oversell (stock chain owned hop by hop by Ruben, the ERP partner and Milan, no check end to end); Price Drift and Deprecated Endpoint (unowned flows); Noor's line to Mara Lindqvist: 34 integrations and 34 answers to 'how do we know it worked?'.; figure: Figure 1: the tangle of 34 lines turned into a list. | `cause_effect`: The inventory's counts. → What two of them meant for the business and for the incidents. |\n\n### What an Integration Is, and Why the Joins Cost Money\n\n**Controlling idea** (`definition`, id `integration`): An integration moves a fact from its system of record to the copies, and four properties of that movement matter to the business: freshness, reliability and coupling, which the style decides, and ownership, which only the inventory decides.\n\n**Advances the thesis** (S1, S5): Defines the movement the styles differ on and separates the three properties a style decides from the one it cannot.\n\n**Transition in:** `elaboration`: The 34 flows of the inventory and their missing owners. → What one flow is and what about it costs money.\n\n**Order of paragraphs** (`prerequisite_order`): Owner and copy first, because the four properties describe the movement between them; the split between style and inventory last, because it needs all four properties named. Stating the split first would name levers for properties the reader has not met.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition | Two systems exchange data when one needs a fact the other owns; the owner is the system of record and every other system holds a copy. | example: The WMS's count of Ridgewalker jackets in size M that the storefront needs; Eva's order that the warehouse needs. |  |\n| p11 | definition (list) | An integration moves the fact from the owner to the copies, or sends a request back, and four properties of that movement matter to the business: freshness, reliability, coupling and ownership. | example: An hour-old stock copy sells units that are gone, an hour-old description is fine; a flow tied to the WMS's field names breaks when the vendor changes them. | `elaboration`: The owner and its copies. → The movement between them and its four properties. |\n| p12 | claim | The style is the main lever on the first three properties; the inventory is the only lever on ownership. |  | `cause_effect`: The four properties. → Which lever controls which, setting up the styles and the inventory. |\n\n### The Four Styles: File, Shared Database, Direct Call, Message\n\n**Controlling idea** (`definition`, id `styles`): Systems exchange data in four styles (file transfer, shared database, direct call, messaging); only the direct call makes the sender wait, which makes it fresh but fragile, while the others are resilient but leave the copies stale for a while.\n\n**Advances the thesis** (S1): Names the four styles with commerce examples and the trade-off between waiting and decoupling.\n\n**Transition in:** `sequence`: The style as the main lever on freshness, reliability and coupling. → The four styles themselves.\n\n**Order of paragraphs** (`prerequisite_order`): The four styles first; then synchronous and asynchronous, which group them; then the coupling warning, which explains why the grouping matters. The two words before the styles would have nothing to group; the warning before them would warn about a call the reader has not seen.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | definition (list) | An integration style is the mechanism by which systems exchange data or request work, deciding whether they share storage, wait for one another or continue independently, and Hohpe and Woolf's four styles (file transfer, shared database, direct call, messaging) each have a commerce example. | source: Hohpe and Woolf, Enterprise Integration Patterns (2003).; example: Nightly product feed and Bergzicht's EDI order; a suite's shared tables; the checkout asking the PSP to authorize €235; 'order #1072455 placed' read by the WMS, the ERP connector and the e-mail service.; figure: Figure 2: the four styles; only the direct call makes A wait for B. |  |\n| p14 | comparison | A synchronous exchange (the direct call) is simple to reason about but fragile under load, because the caller is as slow or as down as the other side; an asynchronous one (files, messages) is resilient but leaves a delay in which the two sides disagree. | example: The checkout cannot continue until the PSP answers; the storefront does not wait for the warehouse to confirm receipt. | `elaboration`: Figure 2's point that only the direct call waits. → The two words for waiting and not waiting, and their costs. |\n| p15 | evidence | Hohpe and Woolf's warning, that tightly coupled applications make numerous assumptions about each other, is the one to remember: a direct call to the WMS assumes it is up, fast and unchanged, a message only that the broker will hold it. | quotation: \"Tightly coupled applications make numerous assumptions about how the other applications work.\" | `emphasis`: Synchronous fragility and asynchronous delay. → The assumption each style makes about the other side. |\n\n### Five Ways to Trigger an Exchange\n\n**Controlling idea** (`comparison`, id `triggers`): A second choice, the trigger, decides when an exchange starts; a webhook is a notification, not a guarantee, and needs polling beneath it, as its vendors document, change data capture gets events out of old systems at the cost of translation, and an event either announces a change or carries the new state.\n\n**Advances the thesis** (S2): Separates when from how, and gives the webhook-plus-polling rule the chapter's choices rely on.\n\n**Transition in:** `contrast`: The style: how the data moves. → The trigger: when, and who notices the change.\n\n**Order of paragraphs** (`grouping`): The table first, then the two mechanisms that need plain words: the webhook with what its vendors document, then CDC; then the two forms an event message takes, which the per-flow rule and the stock event example use. Explaining the webhook before the table would single it out before the reader sees what it is compared with; the event forms before CDC would leave CDC's row-change events unclassified.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | comparison | Besides how the data moves, a second choice says when: who notices that something changed and starts the exchange; a call, a webhook, a poll, a schedule or a database change log does that work and most merchants run all of them, while the table's sixth row, the queue or event stream, is the channel in which messages wait. | table: Who starts each mechanism, its typical delay, what the receiver must handle and its typical commerce use (the author's synthesis of vendor documentation). |  |\n| p17 | evidence | A webhook is a notification, not a guarantee: Shopify retries eight times over four hours, deletes an API-created subscription after eight consecutive failures and says delivery isn't always guaranteed, Stripe retries for up to three days, and both tell integrators to run a reconciliation job, so the webhook is a speed-up on top of polling, never a replacement. | source: Shopify HTTPS webhook delivery and Stripe webhooks documentation, accessed November 2026. | `elaboration`: The table's webhook row. → What a webhook does and does not promise. |\n| p35 | evidence | The same vendor documentation says more than the retry figures: Shopify's warns that apps can miss or mishandle events, guarantees no ordering and asks for reconciliation jobs with changed-since filters, and Stripe's asks receivers to answer fast and process events from a queue. | source: Shopify and Stripe webhook documentation (accessed November 2026). | `additional_support`: The webhook as a notification, with Shopify's and Stripe's retry figures. → What else the same documentation says about missed, reordered and duplicated events. |\n| p18 | definition | Change data capture reads a database's transaction log and turns it into row-change events, the honest way to get events from a system never built to publish them, but someone has to translate a row change into a business event and keep the translation current. | source: Debezium 3.7 documentation: source connectors using each database's own change-capture features.; example: 'Row updated in the item ledger table' is not 'stock changed for SKU X at location Y'. | `additional_support`: The webhook and what its vendors document. → The second mechanism that needs plain words, CDC. |\n| p19 | comparison | An event either announces that a fact changed and lets receivers fetch the details (event notification) or carries the new state so receivers keep a copy without asking (event-carried state transfer), which saves calls but leaves each receiver responsible for a copy that can go stale. (terms from Fowler's 2017 article) | example: 'Order #1072455 changed' against 'SKU 2113-M-moss at Duiven: 14 on hand, 3 reserved, as of 21:14:07'.; source: Fowler, 'What do you mean by Event-Driven?' (2017). | `elaboration`: Webhooks, queues and CDC, which all deliver events. → The two forms an event message can take. |\n\n### Point to Point, Hub, or the Vendor's Connector\n\n**Controlling idea** (`comparison`, id `wiring`): A landscape is wired point to point, through a hub or by a vendor's connector; a hub puts mapping, retries and monitoring in one place but does not create ownership, a vendor connector encodes an ownership model, and hubs are compared per flow at the merchant's volume because each vendor meters a different unit.\n\n**Advances the thesis** (S3): Shows that the wiring choice changes where flows are found, not whether they are owned.\n\n**Transition in:** `sequence`: How one exchange moves and is triggered. → How the whole landscape of thirteen systems is wired.\n\n**Order of paragraphs** (`comparison`): Point to point first, because the hub is the answer to its tangle; the hub's arithmetic stays beside the hub; the vendor's connector follows at once so the three answers sit together, as both round-1 flow readers asked; the hub's price and price tiers come last, after the list of answers is complete. Putting the arithmetic after the vendor connector (the published order) separated the hub from its benefit; putting the connector before the hub would describe something between two options before the second is known.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | transition | With thirteen systems a second question is how the whole landscape is wired, and of the three answers most Omnichannel merchants run all three at once. |  |  |\n| p22 | explanation | Point to point is cheap and fast for the first three connectors, but by the tenth every change means finding and testing every connector that touches a system and the mapping lives in code one person understands: The Spaghetti Junction. | example: Connectors built by the agency, the ERP partner or an engineer who has left. | `sequence`: Three answers. → The first: point to point. |\n| p23 | explanation | A hub, in hosted form the iPaaS, holds mapping, schedule, retries and monitoring in one place, but does not create ownership: Kestrel & Pine's fourteen iPaaS flows were the best documented of the 34 and still had three with no owner in January 2027. | quotation: Gartner's iPaaS definition as relayed by an encyclopedia entry (2015 retrieval).; fact: Three of the fourteen iPaaS flows unowned in January 2027. | `contrast`: Point to point's scattered mapping. → The hub, which centralizes it. |\n| p25 | analysis | Thirteen systems need up to 78 point-to-point links and 13 through a hub, but the real saving is one place to find each flow's mapping, schedule, failure handling and log. | figure: Figure 3: four systems need six links, a hub four.; reasoning: n(n−1)/2 links. | `elaboration`: The hub, which puts every flow's mapping in one place. → The arithmetic that compares it with point to point. |\n| p24 | example | Between point to point and a hub, a vendor's connector, as Business Central's Shopify connector shows, encodes an ownership model (the ERP owns inventory and pushes it every 15 to 30 minutes; orders are imported in batches that a notification triggers): it is the cheapest reliable option when the model matches the merchant's and no configuration fixes it when it does not. | source: Microsoft Learn, Business Central Shopify connector (October 2026). | `contrast`: The hub and its arithmetic. → The third answer, a connector the vendor builds, which sits between point to point and a hub. |\n| p26 | evidence | Hub prices are hard to compare, because each vendor meters a different unit (MuleSoft from $2,000 a month with a $50,000 pre-commit minimum, Boomi from $99 plus usage, Make in credits, n8n per execution, Workato and Celigo unpublished, all as of November 2026), so the only honest comparison is per flow at the merchant's volume. | statistic: Public price points fetched November 2026.; statistic: Kestrel & Pine's roughly 950 orders a day (2026 average), each triggering five or six flow executions. | `sequence`: The three answers, ending with the vendor's connector. → A return to the hub: what it costs and how to compare hubs. |\n| p28 | analysis | The low end is priced for a Growing-stage merchant's first integrations and a $50,000 pre-commitment signals a Group-stage buyer; underneath the AI framing on every pricing page, a merchant buys the same four functions as in 2020. | reasoning: The labelled inference callout: connectors, mapping, scheduling and monitoring. | `elaboration`: Comparing hub prices per flow. → Which buyer each price tier targets and what is really bought. |\n\n### The Trade-Offs\n\n**Controlling idea** (`comparison`, id `trade-offs`): Set side by side, the options give three judgements: a direct call only where the next step needs the answer, a webhook as notification with polling as the truth, and a scheduled batch for finance and products provided a missed run raises an alert.\n\n**Advances the thesis** (S1, S2, S4): Compares the options on the same criteria and draws the judgements the per-flow rule rests on.\n\n**Transition in:** `sequence`: The styles, triggers and wiring options. → The options compared on the same criteria, and the judgements the choice per flow rests on.\n\n**Order of paragraphs** (`comparison`): One comparison table and the judgements drawn from it; placed before Choosing Per Flow so that the rule applies judgements the reader has already seen, as both round-1 flow readers asked.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | recommendation | The comparison of direct call, webhook plus polling (set beside the styles because that pairing is how receivers get changes from a hosted vendor), queue, scheduled batch and shared database gives three judgements that the choice per flow rests on: use a direct call only where the answer is needed before the next step, treat a webhook as a notification and polling as the truth, and keep scheduled batches for finance and product publication provided a missed run raises an alert. | table: Freshness, behaviour when the other side is down, coupling, duplicates and order, who owns the mapping, fit and limits for five options. |  |\n\n### Choosing Per Flow\n\n**Controlling idea** (`recommendation`, id `per-flow`): The style follows each flow's freshness, consistency, latency and availability needs, which gives the rule W5 adopts: stock, orders and prices by events with a reconciliation net, products by scheduled publication, finance by a checked daily batch.\n\n**Advances the thesis** (S4): States the per-flow rule from the needs and ties it to W5.\n\n**Transition in:** `cause_effect`: The three judgements from the trade-offs. → How to choose among the options for each flow.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The needs per flow first, because the rule is derived from them; the rule next; W5 last, as the rule applied to Kestrel & Pine. The rule before the needs would be an assertion without its reason; W5 first would make the rule look like one company's choice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | claim | Choosing a strategy for the company ('we are event-driven now') is the most common mistake, because flows differ in freshness, consistency, latency and availability, as the requirements table sets out for stock, orders, prices, products, customers and finance. | table: Six flows by system of record, freshness, consistency, latency and availability. |  |\n| p30 | recommendation | From those needs, typical values rather than a standard, follows a rule by stage: stock as events per SKU and location into an availability service with reconciliation, orders by webhook or event with a sweep and receivers that ignore repeats, prices by events with a scheduled net, products by scheduled publication, customers by identity matching, finance by a nightly batch reconciled against the payouts. | table: The per-flow rule at the Growing stage and at Omnichannel and beyond, with the reason for each.; statistic: 38 orders a minute in the peak hour: fifteen minutes is 570 orders. | `cause_effect`: The needs per flow. → The style each need calls for. |\n| p31 | example | This is what Waypoint's W5 says for Kestrel & Pine: stock, orders and prices by events, products by scheduled publication, finance by daily batch, and every flow with an owner, a contract, idempotent handling and a reconciliation job; the next chapter explains how the last two are built. | fact: W5 — Integration standards.; figure: Figure 4: the style follows the flow. | `example`: The per-flow rule. → Kestrel & Pine's decision that adopts it. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): The styles do not change with scale; the discipline around them does, from an inventory with four rows at the Starting stage to integration as a platform team's product at the Group stage.\n\n**Advances the thesis** (S4, S5): Shows that the per-flow rule holds at every stage and that ownership and standards are what grow.\n\n**Transition in:** `elaboration`: The per-flow rule, given for two stages in its table. → All four stages: what is typical, what becomes necessary and when a merchant has outgrown each.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The stage table first, then the judgement drawn from it; the judgement first would ask the reader to accept it before seeing the stages it generalizes.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | comparison | At each of the book's four stages a typical integration setup gives way to what becomes necessary, and each has warning signs of being outgrown. | table: Starting, Growing, Omnichannel and Group: what is typical, what becomes necessary, warning signs. |  |\n| p34 | analysis | The judgement is that the styles do not change with scale but the discipline around them does (a Starting-stage merchant and a Group follow the same rule per flow): a Group needs ownership at team level, contracts enforced by tooling and a hub run as a product, and Kestrel & Pine is at the point where that discipline becomes necessary, which is what W5 is. |  | `conclusion_summary`: The four stages. → What changes across them and where Kestrel & Pine stands. |\n\n### The Integration Inventory and Integration Debt\n\n**Controlling idea** (`definition`, id `inventory`): Integration debt is the set of integrations whose owner, contract version, failure alert and reconciliation job are unknown; vendors charge its interest on their own schedule, and an inventory with one owned row per flow turns it into a list.\n\n**Advances the thesis** (S5): Defines integration debt and the inventory that manages it, with Noor's rule.\n\n**Transition in:** `elaboration`: The discipline around the styles that grows with scale. → Its first piece: the inventory, and the debt it measures.\n\n**Order of paragraphs** (`problem_solution`): The debt and its interest first, then the inventory's columns that make it a list, then the rule and the April 2027 result. The columns before the debt would be a form without a purpose; the rule before the columns would require rows the reader cannot yet fill in.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | definition | The first piece of that discipline is a list of flows and what is unknown about them: this book defines integration debt operationally as the set of integrations whose owner, contract version, failure alert and reconciliation job are unknown; each unowned flow is cheap today and charges interest as the next silent failure, vendor retirement or departure. |  |  |\n| p41 | evidence | The vendors document the interest: Shopify deletes an API-created webhook subscription after eight consecutive failures, declared its REST Admin API legacy as of 1 October 2024, and Stripe and Shopify retire API versions on dates they choose, so an unmaintained integration breaks on the vendor's schedule. | source: Shopify webhook delivery, REST Admin API legacy notice and versioning; Stripe (accessed November 2026). | `additional_support`: Integration debt and its interest. → The vendors' own evidence of that interest. |\n| p42 | process | The inventory makes the debt a list, with one row per flow giving source and target, style and trigger, system of record, a named owner, contract version, volume, failure handling, reconciliation and last incident. | table: The nine columns, what goes in each and why it matters. | `problem_solution`: The debt. → The tool that lists it. |\n| p43 | recommendation | Noor's rule is that no flow goes live without a row and no row without an owner: by April 2027 her ownership map had named owners for 8 of the 13, 5 were still unowned, the inventory is reviewed quarterly, and apps that move data between systems appear in both the app list and the inventory. | statistic: 8 of the 13 owned by April 2027; 5 still unowned. | `elaboration`: The inventory's columns. → The rule that keeps it current and its first result. |\n\n### In Practice\n\n**Controlling idea** (`example`, id `in-practice`): Eva's order and the stock path, read as inventory rows before and after Waypoint, show the same technologies with owners, timings and checks made explicit.\n\n**Advances the thesis** (S2, S4, S5): Applies the rule and the inventory to one order and one stock path.\n\n**Transition in:** `example`: The inventory, its columns and Noor's rule. → Eva's order and the stock path read as rows of that inventory, before and after Waypoint.\n\n**Order of paragraphs** (`chronological`): Eva's order before Waypoint, then the 2028 target, then the stock path and the inventory excerpt that compares the two; the target before the starting point would hide what changed.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | example | Read as rows of the inventory, Eva's order before the change runs from the platform, which creates #1072455 at 21:14:03 on 13 April 2027 and sends a webhook to the iPaaS, to the WMS, with an assumed retry policy of three retries at one-minute intervals. | scenario: Eva's order #1072455 path into the warehouse (retries are an assumption). |  |\n| p37 | example | Payment success arrives separately, an hourly connector copies the order to the ERP, stock takes up to two hours to reach the marketplaces after picking, and nobody has recorded who responds if a message is missed. | fact: The stock chain from the WMS through the ERP and the platform to the marketplace connector: up to two hours. | `sequence`: The order's path into the warehouse. → The other flows the order and its stock touch. |\n| p38 | example | Under Waypoint each flow gets an owner and a reason for its timing: in the 2028 target the platform's order notification reaches an OMS through the iPaaS, and the OMS supplies the warehouse, finance and notification flows. | fact: W2: the OMS as order hub; W5: an owner per flow. | `contrast`: The flows before the change, with nobody responsible. → The same order under Waypoint. |\n| p39 | analysis | Warehouse stock events feed the availability service and the ERP leaves the stock path, with a nightly order comparison and weekly stock comparisons (daily in November): the inventory excerpt shows, flow by flow, that the technology is familiar and the owners and checks are now explicit. | table: Inventory excerpt: seven flows with style and trigger, owner and reconciliation in February 2027 and under W5. | `sequence`: The order path under Waypoint. → The stock path and the checks, compared in the inventory excerpt. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`example`, id `wrong`): Each integration failure at Kestrel & Pine is a style's known weakness left unwatched: a silent stop, a dropped notification, a backed-up queue, a retired contract, a second writer and a vendor outage, each with its detection.\n\n**Advances the thesis** (S2, S5): Shows the failure each style and each missing inventory column produces, and the detection for each.\n\n**Transition in:** `contrast`: Kestrel & Pine's flows with owners and checks under Waypoint. → What happens when a flow lacks them: the debt charged.\n\n**Order of paragraphs** (`grouping`): Failures of the asynchronous transports first (a scheduled sync, a webhook, a queue), each read against its row in the triggers table; then contract and ownership failures, which the inventory's columns detect; the synchronous dependency last, as the direct call's weakness. Putting the contract and ownership failures first would read them before the transport failures they are often mistaken for.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | example | A scheduled sync can stop silently (The Message in a Bottle), as in the Price Drift (October 2026), when the German storefront kept €179 for nine days while stores and the marketplace charged €199; the fix is an alert when a run does not happen or produces no changes. | case: Price Drift: 410 orders, about €8,200 of margin, a price-parity warning. |  |\n| p45 | explanation | A webhook can be dropped after its retries or by a deleted subscription, and the receiver believes nothing happened; the polling sweep detects it and the reconciliation job recovers it. |  | `sequence`: The scheduled sync's failure. → The webhook's failure. |\n| p46 | example | A queue can back up, as the WMS connector queue did for four hours on Black Friday 2026, so its depth and oldest message's age are health metrics, or a resilience feature becomes an unexplained delay. | case: WMS connector queue backed up four hours on 27 November 2026; no order lost, orders late. | `sequence`: The webhook's failure. → The queue's failure. |\n| p47 | example | A retired contract breaks an unmaintained flow, as in the Deprecated Endpoint of February 2027 (The Pulled Rug, and The Lynchpin because only the agency understood the script), when an agency script read an API version the marketplace connector retired and stock to bol was stale for two days; a contract-version column with the retirement date puts it on someone's calendar. | case: The Deprecated Endpoint: two days of stale stock to bol. | `sequence`: Transport failures. → A contract failure. |\n| p48 | example | A second writer of one fact, as in the App That Wrote Stock (March 2026), when the pre-order app and the hourly ERP sync both wrote platform stock for two weeks on 600 variants, is a failure of the entity-owner table visible in the inventory's system-of-record column. | case: App That Wrote Stock: two weeks of phantom reservations on 600 variants. | `sequence`: A contract failure. → An ownership failure. |\n| p49 | example | A synchronous dependency fails with its vendor, as when the PSP paused Kestrel & Pine's account for 40 minutes during the Card-Testing Night and every direct call from the checkout failed; the only responses are a short call list, quick timeouts and a decision made in advance. | case: Card-Testing Night: the PSP paused the account for 40 minutes. | `contrast`: Failures of asynchronous flows and ownership. → The failure of the direct call. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The opening's order message that reaches the warehouse late, twice or not at all is answered by the chapter's two halves together: the style and trigger chosen for the order flow (an event or webhook with a polling sweep, receivers that ignore repeats) make the handoff recoverable, and a named owner in the inventory makes its failure someone's to notice; the same pairing gives stock its events and reconciliation, products their schedule and finance its checked batch, and the incidents happened where one half was missing.\n\n**So what:** A reader can classify any flow of their own by style and trigger, say what it does when the other side is down and whether anyone owns it, and start the inventory before buying a tool; Kestrel & Pine's W5 is that rule written down.\n\n**Callback:** The introduction's storefront order whose message to the warehouse is lost or arrives twice. Paragraph p50 says which style, trigger and owner make that handoff safe, and which incidents show what happens without them.\n\n**Takeaway** (`course_of_action`): List every flow with its style, trigger, system of record and named owner; give each webhook a polling sweep and each scheduled sync an alert; and choose events, schedules or batches per flow from its freshness and recovery needs.\n\n**Hand-off** to [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html): `problem_solution`: The asynchronous styles the previous chapter chose per flow, and what every one of them brings: a window in which two systems disagree, messages that arrive twice or out of order, and failures that leave one side updated and the other not. → The mechanisms that make that window safe, with reconciliation as a component and Kestrel & Pine's first stock reconciliation as the worked example.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | synthesis | The opening's order message lost or doubled between storefront and warehouse is now answerable: the order travels as a webhook or event with a polling sweep beneath it and a receiver that ignores repeats, and a named owner is told when it goes quiet; the same reasoning gives stock, products and finance their styles, and the Black Friday chain, the Price Drift and the Deprecated Endpoint show what happens when the owner or the check is missing. | reasoning: The opening's handoff set against the per-flow rule and the inventory. |  |\n| p51 | synthesis (list) | Established: the four styles and their trade-offs have been stable since 2003, webhooks are a notification and not a guarantee by the vendors' own documentation, and a vendor connector encodes an ownership model. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what the sources establish. |\n| p52 | synthesis (list) | Depends on context: a scheduled stock sync is acceptable until its interval times the peak order rate exceeds the affordable buffer, an iPaaS pays for itself when flows and builders make point to point unmanageable, and the hub follows which system owns the order. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p53 | recommendation (list) | The author's synthesis: choose the style per flow from its needs, never for the company, and value the inventory with a named owner per row above any integration tool. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p54 | recommendation (list) | Seven questions let the reader find, in their own company, the integration list and its owners, the stock flows' age and checks, the synchronous calls, the nets under webhooks and schedules, the vendor connectors' ownership models, the iPaaS meter and the flows only one person understands. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own company. |\n| p55 | transition | Choosing the style is half the work; the other half is living with what every asynchronous style introduces (a window in which two systems disagree, messages that arrive twice or out of order, failures that leave one side updated), which the next chapter makes safe with idempotency, the outbox, retries, compensation and reconciliation, using Kestrel & Pine's first stock reconciliation. |  | `problem_solution`: The questions about the reader's own flows. → The problem every asynchronous style leaves, handed to the next chapter. |\n\n## Non-goals\n\n- Idempotency, the outbox, retries, dead-letter queues, sagas and reconciliation as a component; this chapter only names them. See [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html).\n- API contracts, versioning, deprecation and webhook security. See [Promises Between Systems: API Contracts, Webhooks and Versioning](api-contracts-and-versioning.html).\n- Which system should be the hub (ERP, OMS or iPaaS); the entity-owner table. See [The Back Office: ERP Integration and Who Is the Hub](erp-and-back-office-integration.html), [Who Owns the Truth: Boundaries, Bounded Contexts and Systems of Record](boundaries-and-systems-of-record.html).\n- Rate limits and peak behaviour of integrations. See [Many Merchants, One Platform: Multi-Tenancy, Pods and Isolation](multi-tenancy-and-isolation.html), [Black Friday Every Year: Peak Load, Resilience and Recovery](peak-load-and-reliability.html).\n- App governance inside the platform (the 41 apps). See [Apps, Plugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html).\n- Customer and product identity matching; the data platform. See [One Customer, One Product: Identity and Master Data Across Systems](identity-and-master-data.html), [Counting the Same Thing Everywhere: Data Platforms, Definitions and Analytics](commerce-data-and-analytics.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Remaining after the confirming round 3 (ESCALATE; no rule requires a further change and no further round is run): the scene table counts flows by style before the styles are defined (announced in p08; spec order kept, rule 10); p35 restates the reconciliation advice of p17 (both kept: the round-2 move was made at both readers' request); the per-flow table's Growing and Omnichannel columns precede the stages section; the one-sentence p28 and the explanation of the webhook-plus-polling column after the trade-off table (moving either changes units); the hub's costs after the vendor's connector (rule 10); single-reader term glosses (schema, retry storm, rate limits, endpoint, payload, SaaS, pre-commit model, identity service, safety buffer, REST Admin API, phantom reservations) and the Black Friday Oversell's absence from When It Goes Wrong. Needs the author only if any of these should change the spec's order.\n\n## Decision log\n\n- **2026-1 very incident happened in a flow whose row was missing, had no owner or had no check (it said 'had no row', which the inventory row naming owners for the stock chain contradicts). Rejected: Leaving 'had no row'.\n- **2026-11-12** — Converted spec.md to spec.json from the published chapter. Success criteria: the term-definition and acronym criterion is covered by the standard known_before_new check; the inventory criteria (styles and triggers with examples, the two tables, the trade-off table and stage table, the worked example, the dated evidence list, diagrams, three take-away tiers, 6-10 questions, Sources) are dropped as inventories; the reader outcomes they served are the journal spec's AC-1 to AC-3; the word limit (6,500 including tables) is carried over as length.max_words. Rejected: Carrying the inventory criteria over as minor acceptance criteria.\n- **2026-11-12** — Added an introduction paragraph that states the thesis and picks up the part introduction's first question and its 13 unowned integrations, as this chapter's transition_in asks (p04), and a roadmap that announces every section (p06); the sentence of the published third paragraph that pointed to the next two chapters moved into the roadmap. Added a conclusion paragraph (p50) that answers the opening's lost or doubled order message. Rejected: Leaving the KEY POINTS callout as the only statement of the thesis.\n- **2026-11-12** — Ledger alignment (rulings 16 and 22 and the organizing-commerce-engineering line): the scene no longer says the Black Friday Oversell happened in a flow with no owner; its inventory row names an owner for each hop (Ruben, the ERP partner, Milan), so p09 says the chain had an owner per hop and no check across its ends, while the Price Drift and the Deprecated Endpoint ran in unowned flows (the ledger lists the DE price-list export and the bol stock script among them). The three unowned iPaaS flows are dated January 2027. The stock chain is stated as 'up to two hours' without hop intervals in In Practice and the inventory excerpt, because the published hops (15 minutes, an hour, another hour) sum to more than the ledger's two hours. Rejected: Keeping 'no owner' for all three incidents.; Listing the hop intervals.\n- **2026-11-12** — The two italic table notes that stood as their own units ('the author's synthesis of the vendor documentation', 'typical values; the author's recommendation') are folded into the paragraphs beside their tables (p16, p30), so each unit has one controlling idea; the vendor-outage half of the published 'second writer and the vendor outage' paragraph is its own unit (p49). Rejected: Keeping the notes as one-line units.\n\n## Sources\n\n- **Internal**\n  - _research/scenario-ledger.md (integration-styles, organizing-commerce-engineering lines; Waypoint W5) and _research/consistency-issues.md (rulings 16, 22) — The 34 integrations and their breakdown, the unowned counts by date, the stock chain, the incidents, W5.\n  - journal-spec.json (integration-styles; part-6; events-consistency-and-reconciliation transition_in) — Intent, thesis, role, acceptance criteria and the hand-off.\n  - meet-kestrel-and-pine, boundaries-and-systems-of-record, inventory-and-availability — The 34 integrations, the stock sync chain, system of record and copies, stock events and the oversell window.\n  - _research/brief-integration-and-data.md Part 1 — Styles, mechanisms, iPaaS, vendor connectors, per-flow table, integration debt.\n- **External**\n  - Hohpe and Woolf, Enterprise Integration Patterns, Integration Styles (2003) — The four styles and the criteria.\n  - Fowler, 'What do you mean by Event-Driven?' (2017) — Event notification and event-carried state transfer.\n  - Shopify webhooks and HTTPS delivery documentation (accessed 2026-11) — Retries, deletion after failures, reconciliation jobs.\n  - Stripe webhooks documentation (accessed 2026-11) — Three-day retries, ordering, queue-first processing.\n  - Microsoft Learn, Business Central Shopify Connector (October 2026) — A vendor connector's ownership model and sync intervals.\n  - Debezium 3.7 documentation — Change data capture.\n  - MuleSoft, Boomi, Workato, Celigo, Make and n8n pricing pages (accessed 2026-11) — Metering units and price points.\n\n## Changelog\n\n- **2026-11-12** — Draft check rounds 1 and 2 (both ESCALATE); sections and paragraphs reordered as logged; round-2 escalations auto-resolved; confirming round 3 ESCALATE; closing fixes applied (check report now stale).\n- **2026-11-12** — Converted spec.md to spec.json, reconstructed from the published chapter; added the thesis paragraph, roadmap and opening-answering conclusion paragraph; aligned the scene and the stock chain with the ledger and rulings 16 and 22.\n- **2026-11-07** — Visual layer: redrew 2 mermaid diagrams as illustrations and added 2 conceptual figures. (from spec.md)\n- **2026-11-07** — Final consistency pass: tied the four stock-writing flows to six writers of Duiven stock in all (consistency item 22). (from spec.md)\n- **2026-11-07** — Editorial review passes: Omnichannel stage defined on first use; daily order volume about 950; App That Wrote Stock writer aligned with the ledger; 13 unowned integrations dated to January 2027 and 5 in April 2027 (item 16); post-Waypoint stock path through the iPaaS. (from spec.md)\n- **2026-11-07** — Initial spec and article. Earlier decisions (from spec.md): style separated from trigger; the integration inventory as the chapter's spine; iPaaS pricing kept to one paragraph of dated price points and a lesson about metering units; Fowler's four meanings reduced to notification against state transfer.\n"}]}]}</script>

    (function () {

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.

        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {

                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');

                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {

                    }

                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {

                    while (i < lines.length && tableRow.test(lines[i])) {
