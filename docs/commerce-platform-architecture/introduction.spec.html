<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published page (posts/introduction/index.md) and its former spec.md on 2026-11-12, then reordered the same day on the flow rubric's notes (see decision_log); the page was revised to match. One spec paragraph per unit of the page; tables and figures are evidence of the paragraph they belong to.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The book's claim and the three questions architecture answers for every promise: who may make it, how the others learn of it, what happens when they disagree.\n- **Know:** The four scale stages (Starting, Growing, Omnichannel, Group), and that the shape of the business decides the stage, not its revenue.\n- **Know:** How the book is laid out: three preface pages, eleven parts that follow one order, an appendix and four reference pages.\n- **Know:** The six kinds of statement and the three tiers of take-away.\n- **Know:** Kestrel & Pine in a few paragraphs, and the names of the sixteen failure patterns, given as a list grouped by their four families that the next page unpacks.\n- **Believe:** A commerce platform is the whole set of systems that make and keep promises, not one product, and its failures live in the joins.\n- **Believe:** The right architecture changes with the shape of the business.\n- **Be able to:** Go from the decision in front of them to the chapter to start with.\n- **Be able to:** Tell a documented fact from a recommendation, an illustration and an assumption when a chapter states one.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can state the book's argument and list the subjects of its parts in order. *Probe:* After reading only this page: what does this book argue, and what will its parts cover, in order? | `custom` | cold_reader | major |\n| AC-2 | Given a decision the routing table lists, the reader names the chapter to start with. *Probe:* Your channels keep overselling and you must decide which system should own stock. Using only this page: which chapter do you open first, and why not the storefront or marketplace chapter? | `custom` | cold_reader | major |\n| AC-3 | Given three sentences in the book's style, the reader labels each with the kind of statement it is. *Probe:* Using only this page, say what kind of statement each is: (a) 'Kestrel & Pine's item return rate is 24%.' (b) 'I would make the warehouse the system of record for physical stock.' (c) 'Assume 800 orders a day.' | `custom` | cold_reader | major |\n| AC-4 | A reader of the opening alone (the two callouts and the four paragraphs before the first heading) can predict the page's sections. *Probe:* After reading only the callouts and the first four paragraphs: what will this page discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the page, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-6 | A reader who knows software but not commerce can say what a SKU, a system of record and idempotency are after reading this page. *Probe:* Using only this page: what is a SKU, what is a system of record, and what does idempotency mean? | `custom` | cold_reader | minor |\n| AC-7 | Given a merchant described by its channels and countries, the reader names its scale stage and says why revenue alone does not decide it. *Probe:* Using only this page: a brand with €15 million revenue has stores, a wholesale line and sells in two countries. Which scale stage's problems does it have, and why? | `custom` | cold_reader | minor |\n| AC-8 | The reader can say what the book's material is and is not: public dated sources, verified research briefs and domain models used as maps, with nothing in the models used as a fact about a real company. *Probe:* Using only this page: does the book use its domain models as facts about Shopify or Amazon, and does it recommend products? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** What does this book argue, who is it for, and how should it be read?\n\n> **Claim:** This book argues that a commerce platform is not a product a merchant buys but the whole set of systems that make and keep promises to a customer, so that architecture is deciding which system may make each promise, how the others learn of it and what happens when they disagree; it is for readers new to commerce architecture, who should read it in order along one order's journey or enter it from the decision on their desk.\n\n**Disputed by:** The view that a commerce platform is the product a merchant subscribes to, licenses or assembles, so that a newcomer should begin by comparing products and vendors.\n\n**So what:** A reader who accepts this stops looking for the fault inside one product, asks of every design which promise it is and which system keeps it, and treats a vendor comparison as a later step that follows the ownership decisions.\n\n**How and why:** The storefront promises a product, a price, stock, a delivery date and a return in seconds; pricing, the warehouse, the carrier and finance supply the facts and do the keeping over days, and every handoff between them can be late, lost, duplicated or misread. On Black Friday 2026 Kestrel & Pine's systems all stayed up and 1,340 units were still oversold from a stock copy up to two hours old.\n\n**Supporting claims**\n\n- **S1** — The book is written for readers new to commerce architecture, who need general software knowledge and no commerce experience.\n- **S2** — A commerce platform is the whole set of systems that make and keep promises to a customer, its failures are promises broken at the joins between systems, and architecture answers three questions for every promise.\n- **S3** — The right answers change with the shape of the business, so the book follows one fictional merchant as it grows and compares every decision across four scale stages.\n- **S4** — The book can be read in order along one order's journey or entered from the decision on the reader's desk, and it says where its subject stops.\n- **S5** — A reader can weigh each statement in the book, because it keeps six kinds of statement apart, dates its claims, uses only public material and labelled fiction, and states its own limits.\n\n## Role in the part\n\nPerforms the journal's and the part's opening: states the claim, the four scale stages and the reading order, and gives the pattern names and the merchant in outline so the next two pages have something to unpack. Supports PF-1 of part `preface`.\n\n## Flow\n\n**Pattern:** `grouping` (also `prerequisite_order` in argument to kestrel-and-pine: the claim, the recurring forms in which it shows, why the answers differ by stage, then the merchant followed through the stages; 'who' stands first by convention and because the opening ends on the reader; `prerequisite_order` in organization to leaves-to-others: the order's journey and the layout of parts it explains, entry by one decision as the alternative to that layout, then where the subject stops; `prerequisite_order` in evidence to living-journal: the kinds of statement and the dating rule, then the material behind the statements, then how current that material is)\n\nThree groups. First what the book says, to whom and about whom (who, argument, failure-patterns, stages, kestrel-and-pine): the opening ends on the reader, so 'who' continues from it; the failure patterns stand directly after the claim because they are the recurring forms of the broken promises it describes; the stages follow because they say why the answers to the same questions differ; and the merchant follows the stages because it is the one company the stage table tracks. The merchant cannot stand later: the order's journey, the Part IX journeys, the evidence rules and the conclusion all use its order, its 2027 program or its figures, and two readers of the earlier order lost the thread at each of those points. Then how to move through the book (organization, decision, leaves-to-others): the journey opens the section on the book's organization and comes before the table of parts because it is the reason for the order of the table's rows, and no part is cited by number before the table; the routing table is offered only after the learning path it is an alternative to; what the book leaves to other books follows the routing table as the decisions it does not route. Last how far to trust it (evidence, draws-on, living-journal): the reader learns to read a statement before learning what stands behind it, and how current the material is comes last because it qualifies both. This group cannot precede the second: its take-away tiers and its 'every chapter' need the map of parts and the shape of a chapter.\n\n## Introduction\n\n**Hook** (`vivid_anecdote`): At 21:14 on 13 April 2027, Eva Janssen in Nijmegen buys a €199 Ridgewalker jacket and two €18 pairs of socks from Kestrel & Pine, a fictional outdoor brand, and pays €235 through iDEAL; the shop confirms order #1072455. On Black Friday 2026 the same shop oversold 1,340 units while its component systems stayed up.\n\n**Bridge:** Anyone who has bought something online knows the shopper's side: after the confirmation, the next step is waiting for delivery. → On the merchant's side the page that took the order depends on answers from pricing, the warehouse, the carrier and finance, so checkout can succeed while committing the merchant to a promise it cannot keep.\n\n**Thesis statement** (KEY POINTS callout, all three bullets, and paragraph p04, which also names the audience and the two ways of reading): A commerce platform is not one product you buy but the whole set of systems that make and keep promises to a customer; most commerce failures are a promise one system made and another could not keep; and architecture decides who may make which promise, how the others learn of it and what happens when they disagree.\n\n**Roadmap** (IN THIS SECTION callout, in the order of the sections; KEY POINTS third bullet and paragraph p04):\n\n- Say who the book is for. *Kept in:* who.\n- State what the book argues, a promise-keeping machine whose failures live in the joins, and name the recurring patterns in which the promises break. *Kept in:* argument, failure-patterns.\n- Say why every decision is compared across four scale stages, and introduce the one fictional merchant the book follows through them. *Kept in:* stages, kestrel-and-pine.\n- Show how the eleven parts follow one order. *Kept in:* organization.\n- Show how to find the chapter for the decision in front of you, and say what the book leaves to other books. *Kept in:* decision, leaves-to-others.\n- Explain how to read the book's evidence: the kinds of statement, the material behind them and how current it is. *Kept in:* evidence, draws-on, living-journal.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | When Eva Janssen's order at Kestrel & Pine, a fictional outdoor brand, is confirmed, her part is to wait, while several of the merchant's systems must turn that confirmation into the right parcel on the promised day. | scenario: Eva Janssen's order at the fictional Kestrel & Pine: a €199 Ridgewalker jacket and two €18 pairs of socks, €235 paid through iDEAL at 21:14 on 13 April 2027, order #1072455. |  |\n| p02 | claim | The shop's confirmation promises a product, a price, stock, a delivery date and a return on the strength of other systems' answers, so checkout can succeed while committing the merchant to a promise it cannot keep. | reasoning: Pricing supplies the amount, the warehouse supplies stock, the carrier helps determine delivery and finance records payment and any refund; the page taking the order depends on their answers. | `elaboration`: The confirmation and the systems behind it. → The five promises, and which system supplies the fact behind each. |\n| p03 | example | On Black Friday 2026 the same shop oversold 1,340 units while every component system stayed up, because the handoffs between them failed the customer. | scenario: The jacket sold out at 19:40, but channels kept selling for up to two hours from old stock copies; 1,340 units oversold. | `example`: A checkout that can succeed on an out-of-date answer. → One day on which it did, at scale. |\n| p04 | transition | The book follows Eva's order from discovery to delivery, exchange and accounting to explain, for readers new to commerce architecture, who should own each fact, how other systems learn about changes and what to do when they disagree, in a story set in 2027, a year after the research cut-off, with choices that evolve as Kestrel & Pine grows; it can be read in order or entered from a decision. |  | `problem_solution`: Handoffs that failed while every system stayed up. → The three questions the book answers, the order it follows, the merchant whose growth changes the answers, the reader it is written for and the two ways of reading it. |\n\n## Sections\n\n### Who This Book Is For\n\n**Controlling idea** (`description`, id `who`): The book is for newcomers to commerce architecture, asks only general software knowledge of them, explains its vocabulary where it is needed and speaks in the voice of an advising architect.\n\n**Advances the thesis** (S1): Fixes the reader the thesis names, and what the book may assume of them.\n\n**Transition in:** `elaboration`: The book announced in the opening, and its callout's promise to say who it is for. → The readers by role, what they must already know and who is speaking to them.\n\n**Order of paragraphs** (`grouping`): Four facts about the reader and the text addressed to them: who they are, what they bring, how the gap in vocabulary is filled, and the voice addressing them; the voice comes last because it is a promise about the text, not about the reader.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description (list) | The book is for readers new to commerce architecture who have just joined a retailer, brand or wholesaler, a commerce software vendor, an agency or consultancy, or a leadership role. |  |  |\n| p06 | context | The reader should recognize an API, a database, a message queue and a web page, and needs no commerce experience. |  | `elaboration`: The newcomers by role. → What they are expected to know already and what not. |\n| p07 | explanation | Each chapter explains the terms and mechanisms its decisions need, and the glossary collects the definitions. | example: SKU, system of record and idempotency, each glossed in one clause on this page. | `additional_support`: No commerce experience is required. → How the commerce vocabulary is supplied instead. |\n| p08 | context | The book speaks as an architect who advises growing merchants, and the author's judgement is given in the first person with its reasons and the conditions under which it would change. |  | `contrast`: Who the reader is. → Who is speaking, and how the speaker's own judgement is marked. |\n\n### The Argument: A Promise-Keeping Machine\n\n**Controlling idea** (`claim`, id `argument`): A commerce platform is the whole set of systems that make and keep promises to a customer, most failures are a promise one system made and another could not keep, and architecture answers three questions for every promise.\n\n**Advances the thesis** (S2): States the book's claim in full: the definition, the failure it predicts and the discipline that follows.\n\n**Transition in:** `elaboration`: Eva's five promises and the Black Friday handoffs from the opening. → The definition of a commerce platform that makes those two stories one argument.\n\n**Order of paragraphs** (`prerequisite_order`): The definition comes first because the job (promise here, keep there) is stated in its terms; the claim about failures needs the handoff; the three questions come last because they answer the failures.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | In this book a commerce platform is the whole set of systems that make and keep promises to a customer, not a product one subscribes to, licenses or assembles. | example: The list of systems the definition takes in, from the storefront, catalog and pricing to the warehouse, the carriers, the ERP and the data warehouse. |  |\n| p10 | explanation | The platform makes promises in one place and keeps them in another, and the handoff between the two can be late, lost, duplicated or misread. |  | `cause_effect`: The platform as a set of systems. → Its job, and the handoff where the job can fail. |\n| p11 | claim | Most commerce failures are a promise one system made and another could not keep, so the book's central claim is about joins, not components. | scenario: The Black Friday oversell: a storefront promising from a two-hour-old copy.; scenario: The Three-Status Order: Delivered on the platform, In picking in the warehouse and Not invoiced in the ERP for six days.; scenario: The Double Refund: 212 returns refunded twice.; figure: Figure 1: a storefront hands the shopper a promise ticket that the warehouse, carrier, payment provider and ledger must keep; a torn envelope marks where it breaks. | `cause_effect`: Handoffs that can be late, lost, duplicated or misread. → The central claim, with three Kestrel & Pine incidents as instances. |\n| p12 | definition | Architecture is the discipline of answering three questions for every promise: who may make it, how the others learn of it, and what happens when they disagree. | table: Three questions, what each means in practice, and where the book answers it first (boundaries-and-systems-of-record, integration-styles, events-consistency-and-reconciliation). | `problem_solution`: Failures at the joins. → The three questions that address them, and the chapter that first answers each. |\n\n### The Failure Patterns\n\n**Controlling idea** (`description`, id `failure-patterns`): Commerce platforms break promises through sixteen recurring patterns in four families, which travel in chains that start at a connector nobody owns, a dependency nobody watches or a decision copied without its reasons; the next page unpacks them.\n\n**Advances the thesis** (S2): Gives the claim about broken promises its recurring forms, by name only and directly after the claim, so the next page has something to unpack.\n\n**Transition in:** `elaboration`: The claim that most failures are a promise one system made and another could not keep, and the three questions that address it. → The named, recurring forms those broken promises take.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | description (list) | Commerce platforms break promises through recurring patterns that each looked reasonable when chosen; the next page unpacks sixteen of them, and this page gives only their names, as a list grouped by their four families (truth, integration, platform and change, governance). |  |  |\n| p41 | explanation | The patterns travel in chains that start at a connector nobody owns, a dependency nobody watches or a decision copied without its reasons; Kestrel & Pine's incidents are instances of them, and every chapter names the patterns it works on, so the list can be used as an index. | example: A Spaghetti Junction of unowned connectors breeds Messages in a Bottle, which breed Phantom Stock and Boomerangs.; scenario: Kestrel & Pine's Black Friday 2026 met The Phantom Stock in the two-hour-old copy and The First Snowfall in a stock chain that met real load for the first time on the day. | `cause_effect`: Sixteen names in four families. → How one pattern breeds another, and how chapters use the names. |\n\n### Four Scale Stages, and Why Every Chapter Compares Them\n\n**Controlling idea** (`comparison`, id `stages`): The right architecture depends on the shape of the business, so the book follows one merchant as it grows and every chapter compares its decision across four scale stages.\n\n**Advances the thesis** (S3): Argues that there is no single right answer, and names the four stages the answers are sorted by.\n\n**Transition in:** `contrast`: The three questions and the failure patterns, which are the same for every merchant. → What differs: the right answers, which change with the size and shape of the merchant.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The claim and its table, then the rule for reading the table, then why the comparison is repeated in every chapter; the reason comes last because it needs the stages to be named.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | claim | The questions are the same for every merchant but the right answers are not: the right architecture for a merchant with one shop is the wrong one for a group of brands in six countries and the reverse, which is why the book follows one merchant as it grows and compares its decisions across four scale stages. | table: Starting, Growing, Omnichannel and Group, each with a rough revenue band, a typical shape and the years Kestrel & Pine spent in it (2016–2018, 2019–2022, since 2023, not yet). |  |\n| p17 | explanation | The shape of the business decides the stage; the revenue bands are illustrative markers, not thresholds. | example: A €15 million brand with stores, wholesale and two countries already has Omnichannel problems. | `contrast`: The revenue bands in the table. → Shape, not revenue, as what decides. |\n| p18 | claim | Every subject chapter, from product information to regulation, compares the stages, because the most common mistake in commerce architecture is a design that was right two stages ago or will be right two stages from now. | scenario: Kestrel & Pine's 2026 troubles are mostly Growing-stage designs, such as an hourly stock sync built for fewer channels, still running under Omnichannel load. | `cause_effect`: Stages decided by shape. → The stage table in every chapter and the mistake it guards against. |\n\n### Kestrel & Pine\n\n**Controlling idea** (`description`, id `kestrel-and-pine`): Kestrel & Pine is a fictional €48 million omnichannel brand whose incidents and Waypoint program run through every chapter, a composite to be read for its equivalents in the reader's own business.\n\n**Advances the thesis** (S3): Introduces in outline the one merchant whose growth the book follows, directly after the stages it grows through and before the sections that rely on its 2027 story.\n\n**Transition in:** `elaboration`: The one merchant the stage table follows from 2016 to now, and its 2026 troubles. → The merchant itself: fictional, its size, landscape, incidents and the program that changes its architecture during 2027.\n\n**Order of paragraphs** (`prerequisite_order`): What the merchant is, then its landscape and costs, then the program that answers them, then how to read the whole example; the reading advice comes last because it applies to all three.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | description | The merchant in the stage table is Kestrel & Pine, a fictional brand, founded in Arnhem in 2016, that earns €48 million in 2026 across online, wholesale, stores and marketplaces, the shape of the Omnichannel stage. | scenario: €27 million online across the Netherlands, Belgium and Germany, €12 million wholesale, €6 million in stores, €3 million through marketplaces; 1,100 wholesale accounts, six stores, three marketplaces (bol, Amazon.de, Zalando). |  |\n| p35 | description | Its landscape of thirteen systems and 34 integrations holds orders and product content in four places each with no shared management, and its recurring incidents expose the cost. | scenario: About €96,000 from overselling, €19,400 refunded twice and €14,200 deducted for pallet labels that did not match shipment notices. | `elaboration`: The merchant's channels. → The systems behind them and what their disagreements cost. |\n| p36 | description | Noor Visser, the reader's stand-in, joins in January 2027 and in March launches Waypoint, a €1.1 million program that decides ownership first, buys the missing central systems second and keeps the shop platform; its changes land later in 2027, after Eva's order. | scenario: Waypoint's eight decisions, W1 to W8, each named by number with one clause of content (rule 6): W1 the warehouse owns physical stock; W2 an order management system is the one order record; W3 a PIM owns product content; W4 the company stays on its shop platform; W5 integrations get owners, contracts and reconciliation; W6 pallet labels and shipment notices come from the warehouse; W7 one reporting definition of order, revenue and return; W8 the product data and APIs an AI agent would need, before any agent. Canonical (ledger). | `problem_solution`: The landscape and its costs. → The person who meets them and the program that answers them. |\n| p37 | recommendation | Kestrel & Pine is a composite of patterns common among growing omnichannel brands, not a disguise for any company, introduced in full on its own page, so when Noor decides the reader should ask what the equivalent would be in their own business. |  | `emphasis`: The merchant and its program. → Its status as a composite, and how to use it. |\n\n### How the Book Is Organized\n\n**Controlling idea** (`description`, id `organization`): The eleven parts follow the journey of one order at Kestrel & Pine and each answers one question; Part I carries the vocabulary the rest needs, the chapters share one shape, and Part IX runs the journey whole.\n\n**Advances the thesis** (S4): Gives the organizing line of the first of the two ways to read the book, the journey of one order, and then lays out the whole reading path in the order that journey sets.\n\n**Transition in:** `elaboration`: The merchant and its 2027 program. → The one order at that merchant whose journey organizes the book, and the layout of parts that follows it.\n\n**Order of paragraphs** (`large_to_small`): The journey first, because it is the reason for the order of the table's rows; then the whole layout, then how it maps onto the journey, then the one part it rests on, then the shape of a chapter, then the one part that departs from that shape; Part IX comes last because it retells the step-by-step parts.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | description | At that merchant the book follows the journey of one order, Eva's jacket, whose canonical facts never change; that journey is the reason for the order of the parts. | scenario: Ordered Tuesday 13 April 2027 at 21:14, picked and packed at the Duiven warehouse on Wednesday, delivered by PostNL on Thursday 15 April, exchanged for a size L through the returns portal on Monday 19 April. |  |\n| p19 | description | The book's eleven parts follow that journey: with three preface pages, an appendix tutorial and four reference pages around them, each part asks one question. | table: Fourteen rows from Preface to Reference: the question each section answers and the chapters it holds. | `cause_effect`: The order's journey. → The layout that follows from it: every part and the question it answers. |\n| p15 | explanation | Parts II to IV follow the order in sequence, Part V brings in the orders that arrive from marketplaces, wholesale customers and EDI and the ERP that books them all, Part VI is about the arrows between systems, and a short paragraph near the top of each chapter says which step of Eva's order the reader is looking at. | figure: Figure 2: Eva's order crosses Parts II to IV in the order it happens; Part V joins the orders from outside to the same record and the ERP; Part VI covers the arrows between them; Parts VII to XI step back. | `elaboration`: The table of parts. → How the parts map onto the order's journey, in a figure, and how each chapter signals its place on it. |\n| p20 | recommendation | Part I is the one part not to skip, because it introduces the vocabulary, the capability map of what the business must do and the entity–owner table of which system owns each fact, which every later chapter points back to. |  | `emphasis`: The parts and their place on the journey. → The one part every other part depends on. |\n| p21 | description | Every chapter in Parts II to VIII answers the same five questions, opens with a scene at Kestrel & Pine and ends with take-aways, design-review questions and sources. |  | `elaboration`: The parts. → The shape of a chapter inside them. |\n| p22 | description | Where Parts II to V take the journey a step at a time, each of Part IX's four journeys runs one Kestrel & Pine story with fixed dates whole and twice, through the January 2027 architecture before Waypoint and the late-2027 one after it, so a reader who learns best from a whole example can read one early. | scenario: Eva's order, her exchange, the Bergzicht Outdoor chain's spring reorder by EDI and Black Friday, each run through the late-2027 architecture and the January 2027 one. | `contrast`: Chapters of one shape, each showing one step. → Part IX, whose four journeys run a story whole, and when to read one. |\n\n### Start With the Decision in Front of You\n\n**Controlling idea** (`recommendation`, id `decision`): A reader with a decision already on the desk can enter the book from a routing table instead of reading the parts in order, and has the toolkit's templates as working aids.\n\n**Advances the thesis** (S4): Gives the second way to read the book that the thesis names.\n\n**Transition in:** `contrast`: The parts as a learning path for a first reading. → Entry by decision, for a reader who cannot read in order first.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The advice and its table, then one row that shows how the table routes, then the aids to use once a chapter is found; the aids come last because they serve a decision already located.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | recommendation | If a decision is already on the desk, the reader finds the matching row, reads the chapter to start with, follows the others if more is needed, and returns to Part I when a term or an owner is unclear. | table: Twelve decisions (replatforming, overselling, an order management system, a PIM, prices, refunds, marketplaces, wholesale and EDI, integrations, architecture style, Black Friday, apps and agents), each with a chapter to start with and up to three to read next. |  |\n| p24 | example | Overselling starts with the inventory chapter, not the storefront or the marketplace connector, because the fix is deciding which system owns stock, not making the copies faster. | example: The overselling row, which starts with inventory-and-availability. | `example`: The routing table. → One row whose starting chapter is not where the symptom appears. |\n| p38 | recommendation | The toolkit's sixteen working templates are the book's working aids, and the reader should start with the template that changes the decision they face this week. |  | `additional_support`: A reader with a decision on the desk. → The working templates that help carry the decision out. |\n\n### What the Book Leaves to Others\n\n**Controlling idea** (`context`, id `leaves-to-others`): Three neighboring subjects appear only where they touch commerce architecture, and each has a book of its own in the collection.\n\n**Advances the thesis** (S4): Marks where the book's subject stops, directly after the routing table, so a reader does not look here for what another book covers.\n\n**Transition in:** `contrast`: The decisions the routing table sends to a chapter of this book. → Three neighboring subjects the book deliberately leaves to other books.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | context (list) | Payments and ledgers in depth, running a marketplace and the internals of AI agents appear only where they touch commerce architecture, and each is the subject of another book in the collection (RECONCILED, LISTED, Architecting Agentic Systems). |  |  |\n\n### How to Read the Evidence\n\n**Controlling idea** (`explanation`, id `evidence`): Every chapter keeps six kinds of statement apart, dates its company and regulatory claims, and sorts its conclusions into three tiers, so the reader can tell how much weight each sentence carries.\n\n**Advances the thesis** (S5): Shows how the book lets a newcomer tell fact from judgement, illustration and assumption.\n\n**Transition in:** `sequence`: The reader now knows where in the book to go and where its subject stops. → How to weigh what they find in a chapter.\n\n**Order of paragraphs** (`grouping`): The kinds of statement first, with the two confusions; then the dating rule with its three public cases; then the tiers of conclusion. The tiers come last because they sort conclusions built from the six kinds.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | claim | Every chapter keeps six kinds of statement apart, because architecture writing becomes unreliable when facts, habits, guesses, opinions, examples and estimates blur into one voice. | table: Documented fact, industry practice, reference-architecture inference, recommendation, illustration and assumption, each with what it is and how to recognize it. |  |\n| p26 | example | Two distinctions are easy to lose: a Kestrel & Pine figure is an illustration, not an industry benchmark, and a recommendation that sounds like a fact is still a recommendation. | example: The 24% item return rate at Kestrel & Pine.; example: \"The warehouse is the system of record for physical stock.\" | `emphasis`: The six kinds. → The two pairs most often confused. |\n| p27 | evidence | Claims carry dates because an undated claim quietly goes stale: Zalando described replacing a design in March 2025, and vendor interfaces change on published dates. | fact: In March 2025 Zalando's engineering blog described replacing a price-and-stock event stream, which could fall up to 30 minutes behind during Cyber Week, with a synchronous read API.; fact: On 3 November 2026 bol announced that its Offers API v10 stops on 1 February 2027.; fact: Shopify releases a new API version every quarter. | `additional_support`: The documented fact, written with its year in the sentence. → Why the year is there. |\n| p29 | claim | Laws run on a timetable too, so every company and regulatory claim carries its date, evidence older than about three years is flagged, and announced features are kept apart from generally available ones. | fact: The EU rule that a price reduction must be shown against the lowest price of the previous 30 days has applied since 28 May 2022. | `similarity`: Company designs and vendor interfaces with dates. → Laws with dates of application, and the rule the book draws from all three. |\n| p30 | explanation | Every chapter ends its argument with take-aways split into three tiers (established, depends on context, the author's synthesis), so the reader can tell how much weight each conclusion carries. | table: Established, depends on context and the author's synthesis, each with what it holds and how to use it. | `similarity`: Statements sorted by kind inside a chapter. → Conclusions sorted by weight at its end, under the subheading 'Three tiers of take-away'. |\n\n### What the Book Draws On\n\n**Controlling idea** (`explanation`, id `draws-on`): The book rests on public dated sources, verified research briefs and domain models used only as maps; it is vendor-neutral and uses no internal material.\n\n**Advances the thesis** (S5): Says what stands behind the book's statements, so that a documented fact can be trusted as public and an illustration as fiction.\n\n**Transition in:** `elaboration`: The kinds of statement, among them documented facts and illustrations. → The material those statements were built from.\n\n**Order of paragraphs** (`grouping`): The material used, then the stance toward vendors and real companies, then what is excluded and what stands in for it; the exclusion comes last because it leads to the fictional merchant.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | description (list) | The book uses three kinds of material and no others: public dated sources, verified research briefs, and domain models used as research maps only. | source: Productscape domain models in the author's sibling repository, inferred from public product behavior and mapped to chapters in domain-coverage. |  |\n| p32 | claim | The book is vendor-neutral: it recommends architectures, names Kestrel & Pine's systems by role, and presents real companies only as dated cases with their sources. | example: Shopify, Amazon, Zalando, and commercetools and Shopware with the composable movement, each a dated case chapter. | `additional_support`: Material that is public and dated. → The same restraint applied to products and companies. |\n| p33 | claim | Nothing in the book comes from confidential documents or inside knowledge of any company; where the public record cannot supply a situation, it uses Kestrel & Pine. |  | `contrast`: What the book uses. → What it never uses, and what stands in instead. |\n\n### A Living Journal\n\n**Controlling idea** (`context`, id `living-journal`): The book is a living journal with a stated research cut-off, a visible spec behind every chapter and an author who answers for it.\n\n**Advances the thesis** (S5): States the limits of the book's evidence: how current it is, what it was written against and who is responsible.\n\n**Transition in:** `elaboration`: Public, dated sources as the book's material. → The date up to which they were checked, the visible spec behind each chapter, and how the book was made.\n\n**Order of paragraphs** (`grouping`): How current the facts are, what each chapter was written against, then how the writing was done; responsibility is stated last so that it covers all three.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | context | The book is a living journal whose research cut-off is 7 November 2026, so a time-sensitive fact should be checked at the source before being relied on. | fact: Where the 2027 story (introduced in p04) touches real dates, it uses the dates published by November 2026. |  |\n| p43 | explanation | Every chapter links to the specification it was written against, including its open questions, so the book should be read as current thinking with its limits stated. |  | `additional_support`: A book that is revised. → The spec behind each chapter as a visible statement of its limits. |\n| p44 | context | The author developed the book through AI-mediated authoring, setting the concept, structure, chapter contracts and arguments and reviewing the result, and is responsible for its content, judgements and errors. |  | `elaboration`: The specs chapters were written against. → Who wrote the contracts, what AI tools did and who answers for the text. |\n\n## Conclusion: Where to Go Next\n\n**Synthesis:** The parts, the routing table, the stage comparison and the kinds of statement are four ways of asking one question of a promise: which system makes it, which system keeps it, and how far the answer holds for a business of the reader's shape. Whether the reader goes on in order or jumps from a decision, every chapter is about one of Eva's five promises and about which system keeps it.\n\n**So what:** The reader can open any chapter, in order or from the routing table, and ask of it which promise it is about and which system keeps that promise; that question comes before the question of which product to buy.\n\n**Callback:** Eva's order from the opening and the five promises the shop made when it confirmed it. The promises return as five words (this jacket, at this price, in stock, on Thursday, returnable), and the reader can now see them as the index to every chapter.\n\n**Takeaway** (`course_of_action`): Read on in order (the sixteen patterns, then Kestrel & Pine, then Part I with the journey of an order), or use the routing table and come back to Part I when a term is unclear; either way keep Eva's five promises in mind.\n\n**Hand-off** to [Out of Stock, Out of Sync: Sixteen Ways Commerce Platforms Go Wrong](where-commerce-platforms-go-wrong.html): `elaboration`: The claim that a failure is a promise one system made and another could not keep, the four scale stages, and the bare list of sixteen pattern names in four families. → The next page unpacks each of the sixteen patterns.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | recommendation | A reader going in order turns next to the patterns page, then to Kestrel & Pine, then to Part I, and a reader with a decision uses the routing table and returns to Part I when a term is unclear. |  |  |\n| p46 | synthesis | Either way every chapter is about one of Eva's five promises and which system keeps it: the parts, the routing table, the stage comparison and the kinds of statement are ways of asking that one question, and it comes before the question of which product to buy. |  | `conclusion_summary`: The two ways of going on. → What both have in common: Eva's five promises as the question to ask of every chapter. |\n\n## Non-goals\n\n- The sixteen failure patterns in depth. See [Out of Stock, Out of Sync: Sixteen Ways Commerce Platforms Go Wrong](where-commerce-platforms-go-wrong.html).\n- Kestrel & Pine's full profile, systems and incidents. See [Meet Kestrel & Pine](meet-kestrel-and-pine.html).\n- Any chapter's argument beyond one line; the templates and the definitions. See [Toolkit: Cards and Templates for Commerce Architecture Decisions](toolkit.html), [Glossary: Plain-Language Definitions](glossary.html).\n- Payments and ledgers in depth, running a marketplace, and the internals of AI agents: handed off through the allowed sibling permalinks. See payments-fundamentals (RECONCILED), liquidity-and-network-effects (LISTED), tool-ecosystems-and-mcp (Architecting Agentic Systems).\n- Any mention of the private source journal or its brief.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Check finding: both flow readers stopped at the research cut-off sentence in Introduction ¶4 ('The story is set in 2027, a year after the book's research cut-off of November 2026.') before they know why a cut-off matters; the spec places it in p04 (round 5, fault spec).\n- Check finding: How the Book Is Organized ¶6 says 'Parts II to V take the journey one step at a time' while ¶3 says Parts II to IV follow the order and Part V brings in outside orders; the spec's p22 controlling idea says 'Parts II to V', against p15. Both readers stopped (round 5, fault spec).\n- Check finding: the declared order kinds -> dating -> tiers in 'How to Read the Evidence' puts the two dating paragraphs between the six kinds and the three tiers; both flow readers felt a jump back and proposed placing the tiers straight after the kinds (round 5, fault spec).\n\n## Decision log\n\n- **2026-11-13** — Auto-resolved in the cleanup pass, 2026-11-13: the round-4 findings left open for length are fixed <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
