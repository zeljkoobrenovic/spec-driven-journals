. |  | `sequence`: Where promotions sit in the order's journey. → The order of the chapter's sections and the kinds of evidence it uses. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: The Black Friday Stacking Bug\n\n**Controlling idea** (`example`, id `scene`): In Black Friday week 2026 two valid promotions combined on 2,860 orders because of a setting nobody checked, and the cost of about €52,000 came from three separate faults: the stacking, the shipping threshold and the missing allocation.\n\n**Advances the thesis** (S1, S3): Shows in one incident that the stacking rule lived in an unowned setting, that the page and the cart computed the threshold differently, and that an unallocated order-level discount was refunded back.\n\n**Transition in:** `example`: Two valid discounts combining against intent, announced in the introduction. → The incident at Kestrel & Pine in which that happened, with its figures.\n\n**Order of paragraphs** (`chronological`): The promotions as configured, what the setting did to them, then the diagnosis: the reader needs the three promotions before the combination and the figures before the three faults are named.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | context (list) | For Black Friday week, 23–29 November 2026, Milan Petrov configured three promotions on the hosted shop platform: an automatic 20% off outerwear, the standing 10% welcome code and free shipping over €75. | scenario: The three promotions active in the week of 23–29 November 2026. |  |\n| p07 | cause_effect | The welcome code was not meant to combine with the outerwear discount, but a combination setting the agency had switched on in October still allowed both and nobody checked it against the campaign plan; the week cost about €52,000 in three ways: two discounts on 2,860 orders, shipping charged on 1,140 orders after the page had promised it free, and 190 returns refunded too much. | table: 31,000 online orders in the week; 2,860 with both discounts; Ridgewalker €199 → €159.20 → €143.28; about €43,000 margin beyond plan; 1,140 orders charged €4.95 shipping after the page promised it free, about €5,600 refunded; 190 returns over-refunded, about €3,000; total about €52,000. | `contrast`: The three promotions as configured. → The intent that two of them should not combine, the setting that let them, and what the week cost. |\n| p08 | analysis | Three things went wrong, and the chapter returns to each: the stacking rule lived in a setting and not in the campaign, the free-shipping threshold was evaluated on different subtotals by the page and the cart, and the order-level discount was never allocated to the lines. | figure: Figure 1: the jacket price falling from €199 to €159.20 to €143.28 because a combine switch was left on. | `cause_effect`: The three costs of the week: double discounts, shipping charged against the page's promise, over-refunded returns. → The fault behind each, and the conclusion that a price nobody can reconstruct from the rules has no owner. |\n\n### What a Promotion Is, and What It Touches\n\n**Controlling idea** (`definition`, id `what-a-promotion-is`): A promotion is a rule that lowers the price under stated conditions; it comes in seven shapes, each of which touches the price, the margin and the books, and stored value is not one of them.\n\n**Advances the thesis** (S2, S4): Gives the vocabulary (promotion, code, eligibility, stacking, allocation) in which the thesis is stated and sets stored value apart from the start.\n\n**Transition in:** `elaboration`: The three faults of the Stacking Bug: stacking, evaluation and allocation. → Plain definitions of those words and of the kinds of promotion.\n\n**Order of paragraphs** (`large_to_small`): The definition, then its seven types, then what all the types have in common, then what is excluded: the exclusion makes sense only once the reader knows what a promotion is.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | A promotion is a rule that lowers the price a customer pays under stated conditions, and five words describe it: coupon code, automatic discount, eligibility, stacking and discount allocation. | figure: Figure 2: an eligibility rule card above four panels (coupon code, automatic, stacking, allocation). |  |\n| p10 | description | Every platform supports the same seven types of promotion, and each type needs different facts to compute and changes a different part of the order. | table: Seven promotion types (percentage off, fixed amount off, order discount, buy X get Y, tiered, free shipping, bundle) with an example, what each needs to compute and what it changes.; figure: Figure 3: seven tiles, one per promotion type. | `elaboration`: The definition of a promotion. → The seven types and what each needs and changes. |\n| p11 | analysis | Every type touches three things the business cares about: the price the customer sees, the margin, and the books. | scenario: The Ridgewalker at €143.28 still cleared its €58 landed cost but gave up about a sixth of its planned Black Friday unit margin.; figure: Figure 4: one discount tag with arrows to a price tag, a margin bar and an invoice with a ledger. | `conclusion_summary`: The seven types and what each changes. → The three things all of them touch: price, margin and books. |\n| p12 | claim | Gift cards, store credit and loyalty points look like promotions and are not: they are value the merchant owes, kept as ledgers, and get their own section. |  | `contrast`: What a promotion is and touches. → The instruments that look like promotions and are money owed. |\n\n### How the Pieces Fit Together\n\n**Controlling idea** (`process`, id `pieces`): A promotion system has five parts arranged around one decision: the final discount is computed once, in the cart, and written to the order allocated per line, where the invoice, the credit note and the ledger read it.\n\n**Advances the thesis** (S2, S3): Carries the first two clauses of the thesis: promotions as data with a declared order and stop rule, and the discount computed once and allocated to lines, shown on Eva's order.\n\n**Transition in:** `elaboration`: The vocabulary of promotions and the three things a promotion touches. → The parts of the system that evaluates promotions, and the path of a discount from the cart to the books.\n\n**Order of paragraphs** (`chronological`): The five parts in the order a discount passes through them, then the discount's path after the order with one worked case, then the moments at which the parts are used. The worked allocation follows the fifth part directly, because a reader who has just met allocation can check it on real numbers; placed after the table of moments it would be separated from the step it illustrates. The moments come last because their table mentions every part, and its closing point, that code redemption and stored value behave like money, leads into the next section.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | claim | A promotion system has five parts, whatever product provides them, arranged around one decision: the final discount is computed once, in the cart, and written to the order with its allocation. | figure: Figure 5: the product page shows an estimate; the promotion engine computes the final discount at cart time and writes it to the order per line, read by invoice, refund and analytics. |  |\n| p14 | evidence | Promotion definitions: each promotion is a record with a position in the order of evaluation, and three vendors document the same shape, a declared order and a stop rule. | source: Shopify evaluates product, then order, then shipping discounts, and calculates two combined percentage order discounts on the original subtotal (10% plus 20% on €100 gives €70); commercetools gives each cart discount a sortOrder, a stacking mode and discount groups; Adobe Commerce has rule priority and 'Discard subsequent rules'. | `elaboration`: The five parts. → The first part, the definition record, and how three vendors order and stop evaluation. |\n| p15 | example | Eligibility and identity: conditions such as 'first order' need to know who the customer is, and a check on the e-mail address alone treats one person with two addresses as two first-time customers. | scenario: Kestrel & Pine's welcome code checked 'first order' by e-mail address. | `sequence`: The definition record and its conditions. → The second part: deciding who qualifies, which depends on customer identity. |\n| p16 | explanation | The code ledger: every code has a usage record that must be strongly consistent at redemption, so that two checkouts cannot both take the last use. | source: Adobe generates single-use codes in batches with usage caps; Shopify separately limits how many codes one order may carry (5 product or order codes and 1 shipping code). | `sequence`: Eligibility per customer. → The third part: the record of how often a code has been used. |\n| p17 | process | Evaluation in the cart: the engine applies the promotions in order to the cart's lines and stops where the stop rule says, and because some conditions are known only at checkout, the product page can show only an estimate. | quotation: Adobe: conditions on the shipping or payment method 'are met only in checkout after the specific shipping/payment methods are selected'. | `sequence`: Definitions, eligibility and codes, the inputs. → The fourth part: the evaluation itself, and why it can be final only in the cart. |\n| p18 | process | Allocation and events: the last part writes the result where later systems read it, as a net price on each order line and as an event for each promotion applied, redeemed or offered. | source: commercetools distributes an absolute cart discount proportionately, evenly or individually across the lines. | `sequence`: The discount the cart computed. → The fifth part: writing that discount to the order per line and emitting events. |\n| p21 | explanation | A discount leaves the order in three documents, the invoice, the credit note and the ledger, and each reads the net price per line, which makes allocation a tax matter as well. | example: An order-level discount across a jacket at 21% VAT and a book at 9% must be allocated before the tax can be right. | `sequence`: The net price written to each order line by the fifth part. → The three documents that read it after the order: invoice, credit note and ledger. |\n| p22 | example | On Eva's order of €235, a hypothetical 10% code is allocated in proportion to the list prices: €19.90 to the jacket and €3.60 to the socks. | table: Jacket €199.00, 84.7% of €235, discount €19.90, net €179.10; socks €36.00, 15.3%, discount €3.60, net €32.40; total discount €23.50, net €211.50. The code is hypothetical. | `example`: Allocation as the step the three documents depend on. → The calculation on Eva's order. |\n| p23 | analysis | When Eva returns the jacket the refund is €179.10, not €199, and the 190 over-refunded Black Friday returns were this calculation skipped. | scenario: The returns portal read €159.20 because the order-level 10% had not been written to the lines, and gave back €15.92 per jacket that the customer had never paid.; figure: Figure 6: a returns counter refunding €159.20 for a jacket paid at €143.28. | `cause_effect`: The net line prices on Eva's order. → The refund that follows from them, and the Stacking Bug's over-refunds as the same step missing. |\n| p19 | comparison | Promotions are evaluated at six moments, and each moment has its own requirements for freshness, consistency, latency and availability. | table: Six interactions (product page strike-through price, cart evaluation, code redemption, stored-value redemption, promotion publication, analytics) by freshness, consistency, latency and availability; latency figures labelled assumptions. | `elaboration`: The five parts and the discount's path from the cart to the refund. → The six moments at which a promotion is evaluated or read, and what each moment needs. |\n| p20 | analysis | Only the two interactions that behave like money, code redemption and stored value, must be strongly consistent; everything else can be a cached copy with a known delay. |  | `conclusion_summary`: The table of interactions. → The one distinction to take from it: the two rows that behave like money hold the truth, and the rest are copies. |\n\n### Gift Cards, Store Credit and Points: Ledgers, Not Promotions\n\n**Controlling idea** (`explanation`, id `stored-value`): Gift cards, store credit and loyalty points are liabilities with settled accounting rules, so each is kept as a ledger whose balances finance reconciles to a liability account every month.\n\n**Advances the thesis** (S4): Carries the third clause of the thesis: stored value is money owed, with its own records and its own monthly check.\n\n**Transition in:** `contrast`: Stored value, named at the end of the promotion system as one of the two interactions that behave like money. → What gift cards, store credit and points are: balances the merchant owes, not rules.\n\n**Order of paragraphs** (`prerequisite_order`): What the instruments are, the rules that make them liabilities and where the chapter takes those rules from, a filing that applies them, the design rules, then the one thing often confused with them, and Kestrel & Pine's position: the design rules cannot be argued before the accounting that forces them, and membership placed between the liability claim and its accounting support made two readers lose the claim.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | definition | A gift card is value paid in advance, store credit is value the merchant granted and loyalty points are value the customer earned, and all three are a liability on the balance sheet until redeemed or expired. | figure: Figure 7: issuance, redemption, expiry and breakage changing a balance per instrument in the commerce platform, with the sum agreeing with the liability account in finance. |  |\n| p25 | explanation | For the three instruments the accounting is settled and drives the data model: under IFRS 15 and ASC 606 a gift-card sale is a liability and not revenue, the part never redeemed (breakage) is estimated, and points that give a material right defer revenue. |  | `elaboration`: The three instruments as liabilities. → The accounting standards that say so and what they require to be recorded. |\n| p26 | evidence | A note on sources: these rules are cited from PwC's guide to ASC 606 and a secondary summary of IFRS 15, because the standard's own text was not checked for this chapter. | source: PwC's revenue guide on unexercised rights: estimated breakage is recognized 'in proportion to the pattern of exercised rights'; breakage not expected is recognized only when redemption becomes remote; amounts due under unclaimed-property law are never breakage revenue. The IFRS Foundation's page confirms IFRS 15 replaced IFRIC 13. | `additional_support`: The accounting rules for liabilities and breakage. → Where the chapter takes them from, and the limit of that sourcing. |\n| p27 | evidence | Starbucks' FY2025 annual report shows the same obligation at scale: a stored value card and loyalty liability of $1,751.7 million and $200.4 million of breakage recognized in the year. | statistic: Stored value card and loyalty liability $1,751.7 million; breakage recognized in company-operated stores $200.4 million; Stars deferred 'as each Star is earned' and expiring 'after six to twelve months, depending on the market'. | `example`: The rules for liabilities and breakage, and their sources. → One company's filing that applies them, with amounts. |\n| p28 | recommendation (list) | Four design rules follow: every instrument is a ledger, expiry belongs to the issuance, redemption is idempotent, and the platform's balances are reconciled to finance's liability account every month. | quotation: Shopify: 'Store credit expiration is set per issuance'. | `cause_effect`: The accounting rules and their scale. → The four design rules they lead to. |\n| p29 | explanation | Paid membership programs are often confused with loyalty points and are none of the three instruments: a membership is a subscription with its own revenue line, which the promotion engine reads as an eligibility condition. | source: Amazon's 2025 annual report: subscription services net sales of $49.6 billion, Prime benefits as 'effective worldwide marketing tools'; Target's FY2025 report on Target Circle 360. | `contrast`: The three instruments and the design rules for them. → Paid membership, often confused with loyalty, which is a subscription and not a balance. |\n| p30 | example | Kestrel & Pine's gift cards live in two separate pools, about €186,000 online and €41,000 in stores at 31 December 2026, which neither channel can redeem for the other and which finance reconciles each month from two exports. | scenario: Outstanding balances at 31 December 2026: about €186,000 online and €41,000 in stores; Sanne de Wit reconciles two exports to the liability account monthly. | `example`: The design rules for stored value, and membership set apart. → How Kestrel & Pine's stored value stood at the end of 2026. |\n| p31 | example | Kestrel & Pine deferred an online loyalty program until it can recognize the same customer across channels, and left a shared balance service to the 2028 store-system evaluation. | scenario: Stores keep a loyalty list; the online shop has none; a shared balance service is to be considered under decision W4. | `additional_support`: The two gift-card pools. → The loyalty program not launched, for the same reason of separate systems. |\n\n### The Choices\n\n**Controlling idea** (`comparison`, id `choices`): A merchant can run promotions in four ways, and the platform's built-in promotions are enough until one promotion must be the same rule in two systems the platform does not control.\n\n**Advances the thesis** (S5, S1): Turns the model into a decision: which arrangement fits, and why governance is the first improvement.\n\n**Transition in:** `sequence`: The promotion system and the stored-value ledgers as they must work. → The four ways a merchant can obtain them.\n\n**Order of paragraphs** (`grouping`): Four parallel options from the least to the most machinery, with the non-design last, then the rule for choosing: the rule can be read only after the options it chooses between.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | claim | A merchant can run promotions in four ways, the fourth of which is common and not good. |  |  |\n| p33 | description | The platform's built-in promotions come with documented combination rules and limits, and fit any merchant whose promotions fit the platform's vocabulary. | source: Shopify allows at most 25 active automatic discounts; commercetools 100 active code-less cart discounts per project plus 100 per store, and 10 codes per cart. | `elaboration`: The four ways. → The first: the platform's own promotions. |\n| p34 | description | A promotion or loyalty app adds what the platform does not model and becomes a second writer of the price, with its own rules and failure modes. | scenario: Kestrel & Pine's pre-order app wrote stock; a loyalty app is the same shape of risk. | `sequence`: The platform's built-in promotions. → The second way: the platform plus an app. |\n| p35 | description | A dedicated promotion engine shared across channels is the only option in which a store and the web shop run one promotion from one rule, at the cost of an integration into every checkout and a team that owns the rules. |  | `sequence`: The platform plus an app. → The third way: a separate engine every channel calls. |\n| p36 | description | Rules hard-coded in a theme, a script or a marketplace listing are copies that drift, so nobody can say what the price was on a given day. | table: The four options compared on where the final discount is computed, order of evaluation and stop rule, the same promotion across channels, allocation to lines, stored value across channels, and which scale stages each fits. | `contrast`: The three designed options. → The fourth, which is the absence of a design. |\n| p37 | recommendation | The author's rule is to use the platform's promotions until a promotion must be the same rule in two systems the platform does not control, and until then to improve governance: one owner for the combination settings, one calendar and a rollout test against the active promotions. | scenario: For Kestrel & Pine the moment has arrived for the stores (a separate POS), will arrive for the B2B portal if wholesale promotions start, and never arrives for marketplaces. | `conclusion_summary`: The four options and their comparison. → The author's rule for choosing, applied to Kestrel & Pine. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `scale-stages`): The promotion engine changes little with scale; what changes is how many systems must agree on the result and how much money the stored-value ledger holds.\n\n**Advances the thesis** (S5): Says when each choice stops fitting, by the number of systems that must agree.\n\n**Transition in:** `elaboration`: The four options and the rule for choosing. → What is typical, necessary and a warning sign at each of the four scale stages.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | analysis | Across the four stages the engine changes little; what grows is the number of systems that must agree on the result and the money the stored-value ledger holds, so Kestrel & Pine's order is ownership and allocation first, a cross-channel balance second and a loyalty program last. | table: Four stages (Starting, Growing, Omnichannel, Group), each with what is typical, what becomes necessary and the warning signs of outgrowing the approach.; scenario: Kestrel & Pine at stage 3: three channels with their own discounts, two gift-card pools, about €227,000 outstanding. |  |\n\n### In Practice\n\n**Controlling idea** (`evidence`, id `in-practice`): Law, abuse and measurement each ask the promotion system to record something, and Kestrel & Pine's plan for Black Friday 2027 shows the chapter's rules written down for one campaign.\n\n**Advances the thesis** (S6, S1, S3): Supplies dated public evidence for the data a promotion system must keep, and shows the governance and allocation fixes in one plan.\n\n**Transition in:** `additional_support`: The model and the choice of arrangement. → Dated public examples of what promotions must record, and the plan Kestrel & Pine wrote after the incident.\n\n**Order of paragraphs** (`grouping`): Three parallel public findings, then the one company plan that answers the incident the chapter opened with: the plan comes last because it uses the governance rule from the choices and the allocation from the system description.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38a | transition | Three dated public sources show what the outside asks a promotion system to record (the law a price history, abuse a check of who the customer is, measurement a record of the offers made), and Kestrel & Pine's 2027 plan then shows the chapter's rules written down for one campaign. |  |  |\n| p39 | evidence | The EU's prior-price rule turns a promotion into a data requirement: a price history per SKU and country that can give the lowest price of the last 30 days when a promotion is published. | source: Directive (EU) 2019/2161, applied from 28 May 2022; the Dutch regulator ACM supervising from 1 January 2023 with a worked example (€50 raised to €70 and cut 35% is a 9% discount); fines published 11 June 2024 against five named web shops; § 11 PAngV in Germany.; scenario: Had the Price Drift run into November, the German strike-through price for the Ridgewalker would legally have been €179, not €199. | `example`: The three outside demands just named. → The first: the EU's prior-price rule and the price history it requires. |\n| p40 | evidence | Promotion abuse is an identity problem: its main forms, several accounts for one sign-up offer, self-referral and guessable codes, all exploit a weak check of who the customer is. | source: Ravelin's 2020 article names multi-accounting, self-referral and guessable codes; its figure that 53% of merchants saw more abuse is a vendor survey without a published sample. | `additional_support`: A requirement the law places on promotion data. → A requirement abuse places on it: knowing the customer. |\n| p41 | evidence | Whether a promotion earned anything can be measured only against a holdout group not given the offer, which requires the platform to record which promotions were offered. | source: Gubela, Lessmann and Jaroszewicz (2019): judge coupon campaigns on revenue uplift, not conversions; Gubela and Lessmann (2021): of several coupon types, only a €15 coupon produced positive incremental revenue. | `additional_support`: What abuse requires the system to know. → What measurement requires it to record. |\n| p42 | example | For Black Friday 2027 Milan and Noor wrote the promotion plan as a table in which every row has an owner, an order of evaluation and a stop rule, stated the free-shipping threshold the way the cart computes it, and tested the plan against every active promotion in a staging copy. | table: Five rows (20% off outerwear, welcome code 10%, free shipping over €75, the store promotion, marketplace deals) with type, order, what each combines with, stop and owner; the welcome code never combines with the outerwear discount, and the shipping threshold is on the discounted subtotal and stated on the product page. | `problem_solution`: The public examples, and the 2026 incident behind them. → Kestrel & Pine's written plan for the next campaign. |\n| p43 | analysis | Two changes matter more than the table: the order export now carries the allocated net price per line, and every change to a promotion setting needs a second person's approval. | scenario: Ruben Alves added the net line price to the integration contract under decision W5; neither change cost software. | `emphasis`: The plan as a table. → The two changes that outlast one campaign. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`cause_effect`, id `when-it-goes-wrong`): Promotions fail in six recurring ways, and each can be detected by comparing what was computed with what was recorded and recovered by correcting the record.\n\n**Advances the thesis** (S1, S3, S4): Shows what breaks when a clause of the thesis is missing: an unowned stacking rule, two computations of one discount, a missing allocation, an unchecked balance.\n\n**Transition in:** `contrast`: The plan made in advance for 2027. → What still goes wrong, how each failure is noticed and how it is repaired.\n\n**Order of paragraphs** (`chronological`): Six failures along a promotion's life: the combination when the campaign starts, the estimate against the cart, the code and the stored-value debit at checkout, the refund after the order, and the copies when the promotion ends. Read in this order the list works as a timeline a team can walk through before a campaign; in any other order the reader has to work out when each failure can occur.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | cause_effect | Unintended stacking is detected by a daily report of orders with more than one discount and repaired by honoring the orders and fixing the setting. |  |  |\n| p45 | cause_effect | The estimate and the final discount disagree when the page and the cart compute by different rules; logging both per session detects it. |  | `additional_support`: Stacking, the first failure. → A second: the page and the cart disagree. |\n| p47 | cause_effect | Codes leak or are guessed, which shows as redemptions per code per hour above the expected rate. |  | `additional_support`: Failures of the discount calculation in the cart. → A failure at redemption: the code itself leaks or is guessed. |\n| p48 | cause_effect | Stored value is debited twice, or not at all, when a checkout is retried or a payment message arrives late; ledger entries that reference the checkout attempt show the duplicate. |  | `additional_support`: A failure of codes at checkout. → A failure of the stored-value debit at the same moment. |\n| p46 | cause_effect | The discount comes back twice when a return refunds the list price or a gift-card purchase is refunded both to the card and to the payment method; a weekly reconciliation of refunds against net line prices detects it. |  | `sequence`: Failures up to and at checkout. → A failure after the order: the refund gives the discount back twice. |\n| p49 | cause_effect | A promotion ends but a copy of it does not, on a cached page, a marketplace listing, a feed or a till; an end-of-promotion check on every channel detects it. |  | `sequence`: Failures during the promotion's life. → A failure at its end: a copy outside the platform keeps running. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The stacking, the shipping charge and the over-refund looked like three faults and were one: each time, a number the customer or a later system relied on had been computed in one place and never recorded where the next reader looked. The same holds for stored value. A promotion system is therefore judged by what it writes down (the order and stop rule in the campaign, the net price on each line, the balance in a ledger) more than by how it computes.\n\n**So what:** A merchant can prevent most promotion incidents without buying anything: give the combination settings an owner, test each campaign against the promotions already active, and make every order export carry the net price per line.\n\n**Callback:** The shopper who used a welcome code on a jacket and socks and returned the jacket. The reader can now compute the refund (the jacket's net line price) and say what had to be written to the order at checkout for the returns system to find it.\n\n**Takeaway** (`course_of_action`): Give the combination settings one owner, keep one promotion calendar with an order of evaluation per campaign, test every campaign against the active promotions, export the allocated net line price, and take the ten questions to the business.\n\n**Hand-off** to [Finding the Product: Search, Navigation and Merchandising](commerce-search-and-discovery.html): `contrast`: Product content, price and discount, each with a named owner. → A system that owns none of those facts and shows copies of all of them: the search index through which the shopper finds the product.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | synthesis | The refund for the returned jacket is its net line price, which exists only if the discount was computed once in the cart and written to the order per line; the Stacking Bug's three faults were each a number computed in one place and not recorded where the next system read it. | reasoning: The opening's return set against the chapter's answer and the three faults of the Stacking Bug. |  |\n| p51 | synthesis (list) | Established: promotions are data with an order of evaluation and a stop rule, computed once in the cart; an order-level discount must be allocated to lines; stored value is a contract liability; the EU requires the prior price. |  | `elaboration`: The chapter's answer in one case. → What is established, with its sources. |\n| p52 | synthesis (list) | Depends on context: when a shared promotion engine, a central stored-value balance, a loyalty program and holdout measurement are worth their cost. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p53 | recommendation (list) | The author's synthesis: the cheapest promotion architecture is governance, and the allocated net line price should be treated as the order's primary price. |  | `additional_support`: What depends on context. → The author's own judgement, labelled as such. |\n| p54 | recommendation (list) | Ten questions let the reader test a promotion setup in their own company. |  | `sequence`: The take-aways. → Questions that apply them. |\n| p55 | transition | Product content, price and discount now each have a named owner; the next chapter turns to the search index, which owns none of those facts and shows copies of all of them. |  | `contrast`: The facts decided so far, each with an owner. → A system that owns none of them and shows copies of all: the search index. |\n\n## Non-goals\n\n- The base price, price lists, contract prices and the pricing engine. See [What Does It Cost? Price Lists, Contract Prices, Currencies and Tax](pricing-architecture.html).\n- The cart's persistence and checkout orchestration; the payment, idempotency keys and refunds as money movements. See [From Cart to Confirmation: Checkout Orchestration](cart-and-checkout.html), [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html).\n- Invoice numbering, VAT rates and the ledger entries; the return workflow. See [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html), [The Way Back: Returns, Exchanges, Refunds and Reverse Logistics](returns-and-exchanges.html).\n- Customer identity resolution across channels; holdout analytics and metric definitions. See [One Customer, One Product: Identity and Master Data Across Systems](identity-and-master-data.html), [Counting the Same Thing Everywhere: Data Platforms, Definitions and Analytics](commerce-data-and-analytics.html).\n- Marketplace promotion tools, price parity and repricing; app governance. See [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html), [Apps, Plugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html).\n- Fraud and identity signals in depth; ledger design in depth. See LISTED: fraud-prevention, RECONCILED: designing-financial-ledgers.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The IFRS 15 breakage paragraphs (B44–B47) are cited through PwC's ASC 606 guide and a secondary IFRS summary; the standard's own text was not readable in research. A reviewer with access should confirm the wording.\n- Whether Kestrel & Pine's 2028 POS evaluation (W4) should make a cross-channel stored-value balance a selection criterion is raised here but decided nowhere yet; stores-and-omnichannel or build-buy-or-assemble may want to pick it up.\n- Loyalty program mechanics (tiers, earn and burn rates, partner points) are deliberately thin; if the book later adds a loyalty case, this chapter's liability rules are the place to link from.\n- Flow rubric note not taken: 'Across Scale Stages' is one paragraph and a table, and its judgement overlaps the choices; the rubric would merge it into 'The Choices'. Kept because every chapter of the book has the section. The author decides.\n- Paid membership has now stood in two places: after the design rules (published, and again now, after both round-1 flow readers lost the thread with it earlier), and directly after the definitions (first flow rubric). The author may prefer to cut it to a sentence.\n- Flow rubric note not taken: 'the discount comes back twice' in 'When It Goes Wrong' brings a second case (a gift-card purchase refunded to the card and to the payment method) that no earlier section prepares. A clause in the stored-value design rules would prepare it.\n- Both round-1 flow readers found the dated examples of 'In Practice' far from the points they support (the prior-price rule from the price, abuse from eligibility and the code ledger, holdouts from the events). The journal spec's AC-4 expects the section after the choices, so it stays and now opens with a paragraph saying what it adds. Moving the examples needs a journal-spec change, which is the author's.\n- In the 2027 plan table, row 1 has Stop 'Yes' while row 2 says the customer gets the larger of the two discounts; both round-1 flow readers could not reconcile the two. Row 2's wording was made plainer; what 'Stop: Yes' means for a cart with outerwear and other lines is the author's to say, since the ledger gives the plan only in outline.\n\n## Decision log\n\n- **2026-11-12** — Round 1 of the draft check escalated on spec faults (auto mode; changes to order, paragraph ideas and transitions were pre-approved by the author; intent, thesis, role and acceptance criteria untouched). (1) Both flow readers lost the liability claim when paid membership (p29) stood between it and the accounting: membership is back after the design rules, where the published chapter had it, reversing a note of the first flow rubric. (2) Both readers found the sourcing merged into the accounting paragraph (p25) a break of thought: it is its own short paragraph (p26) again, reversing another note of the first rubric. (3) Both readers found the position of 'In Practice' partly unclear. The journal spec's AC-4 fixes the section after the choices, so the order is kept and a short opening paragraph (p38a) says what the public sources add and why the plan closes them; 56 paragraphs. (4) p16's evidence used Shopify's limit on codes per order as if it were a usage cap; the spec and the chapter now give it as a separate limit. Rejected: Moving the dated examples next to the points they support, against the journal spec's expected order.; Cutting the Shopify code limit.\n- **2026-11-12** — Flow rubric, second run after the reordering: sound with notes, no blocking forward reference. Two notes taken without changing the order: p08 no longer calls the incident's three faults 'the three things this chapter is about' (the chapter's three subjects are stacking, allocation and stored value), and the 2027 plan (p42) says in prose that the free-shipping threshold is now stated the way the cart computes it, so the plan answers all three faults. Three notes not taken are under open_questions. Rejected: Merging the one-paragraph scale-stages section into the choices: the journal spec's AC-4 and the book's chapter template expect the section.; Moving membership again.\n- **2026-11-12** — Flow rubric, first run: sound with notes. The author asked for the rubric notes to be taken without review (auto mode), so all five were taken. (1) 'When It Goes Wrong' now runs along a promotion's life: the double refund (p46) follows the code and stored-value failures at checkout. (2) The scene's second paragraph (p07) names the three costs of the week in prose, so the diagnosis in p08 and the 190 returns cited later rest on something already told. (3) The sourcing paragraph (p26) is merged into the accounting paragraph (p25); 54 paragraphs. (4) Paid membership (p29) moves to directly after the definitions of the three instruments, so the design rules run into Kestrel & Pine's position. (5) In 'How the Pieces Fit Together' the discount's path to the invoice with the worked allocation (p21 to p23) follows the fifth part directly, and the moments of evaluation (p19, p20) close the section and lead into stored value. Every transition a move invalidated was rewritten, and the declared reasons for the chapter and for sections 3, 4 and 8 now say what would break. Rejected: Keeping the moments of evaluation between allocation being written and being read.; Cutting the membership paragraph to a sentence.\n- **2026-11-12** — Converted spec.md to spec.json from the published chapter (auto mode: the author asked for the pass to run without stopping). Intent outcome, acceptance criteria AC-1 to AC-5, thesis and role are copied unchanged from the journal spec. The old success criteria were inventories and are dropped (callouts and pattern names; tables and diagrams present; sourcing list; sections present), except two: the worked allocation is covered by AC-1, and 'a newcomer can define every term' is kept as AC-6 (known_before_new, minor), which is an addition to the journal spec's criteria for the author to keep or drop. The 6,500-word limit is kept. Rejected: Carrying the inventory criteria over as acceptance criteria.; Making AC-6 major.\n- **2026-11-12** — Changes to the published order made with the conversion, because the contract asks for them. (1) Introduction reordered to the order of the thesis: the return (allocation), offers combining (stacking), stored balances, then where the chapter sits in the order's journey, then the roadmap; the journey paragraph now opens with the price selected and frozen in the previous chapter, as the post's transition_in requires, and the roadmap announces every section and the kinds of evidence (AC-4). (2) The two 'Stored value is a liability' paragraphs of 'In Practice' repeated the stored-value section and pointed back to it ('Starbucks' FY2025 10-K, above'); their one new item, the PwC and IFRS sourcing, is now one paragraph (p26) in the stored-value section next to the rules it sources. (3) A synthesis paragraph (p50) opens 'What to Take Away', returning to the opening's return; the published conclusion was three sorted lists with no callback. (4) The hand-off is a contrast (facts with owners against a search index that owns none), as commerce-search-and-discovery declares, where the published sentence was a sequence. Rejected: Leaving the sourcing paragraphs in 'In Practice' as a third dated example.; Moving the prior-price example forward to the definitions; the journal spec's AC-4 expects the dated examples after the choices, so the earlier mention gets a gloss and a pointer instead.\n- **2026-11-07** — Made discount allocation the chapter's spine rather than the rules engine, because the stacking bug's costliest tail (over-refunds) and the invoice and tax consequences hang off it; the rules engine is explained through three vendors' published ordering rules rather than an abstract design.\n- **2026-11-07** — Treated gift cards, store credit and points as a separate section with their own diagram, so the reader learns they are liabilities; chose Starbucks' 10-K as the public example because it is the most precise filing on stored-value liability and breakage.\n- **2026-11-07** — Invented the stacking bug as three chained failures (combination setting, threshold on the discounted subtotal, missing allocation) totaling about €52,000, kept separate from the Oversell's €96,000.\n- **2026-11-07** — Kept paid membership to one paragraph; a longer Prime treatment belongs to case-amazon.\n\n## Sources\n\n- **Internal**\n  - _research/scenario-ledger.md and _research/consistency-issues.md (ruling 9) — All Kestrel & Pine figures: Black Friday week, the Stacking Bug (2,860 orders; about €43,000, €5,600 and €3,000; about €52,000 in total), the Price Drift, Eva's order, the gift-card balances.\n  - _research/brief-catalog-pricing-search.md Parts 2.3 and 3; _research/brief-checkout-payments-tax.md Parts 7.4 and 8.5–8.6 — Prior price, platform discount rules, abuse, stored-value accounting, incrementality, allocation as a tax problem.\n  - pricing-architecture, cart-and-checkout, tax-invoicing-and-ledger, returns-and-exchanges, identity-and-master-data — Neighbours whose terms this chapter uses briefly.\n- **External**\n  - Shopify, commercetools and Adobe Commerce discount documentation (accessed 2026-11) — Ordering rules, limits, allocation modes, per-issuance expiry.\n  - Directive (EU) 2019/2161; ACM publications of 2022-12-06 and 2024-06-11; § 11 PAngV — The prior-price rule and its enforcement.\n  - Starbucks, Amazon and Target FY2025 10-Ks; PwC Viewpoint on unexercised rights; IFRS Foundation IFRS 15 page — Liabilities, breakage, membership.\n  - Gubela, Lessmann and Jaroszewicz (2019); Gubela and Lessmann (2021); Ravelin (2020) — Incrementality and promotion abuse.\n\n## Changelog\n\n- **2026-11-12** — Round 1 (escalate: 9 checks passed; failures on 4 fixed checks and 12 corroborated flow points): membership moved back after the design rules, the sourcing note split out again, an opening paragraph added to 'In Practice', p16's evidence corrected; round 1's draft faults fixed in the chapter (Eva told apart from the opening shopper, 'the better offer' said plainly, the price-margin-books sentence split, the Black Friday refund bridged, vendor limits explained, the plan's two changes and the synthesis reworded, the First Snowfall named, glosses for net price, VAT, landed cost, strike-through price, contract liability, deferred revenue, parity warning, RECONCILED and LISTED).\n- **2026-11-12** — Flow rubric notes taken: failures reordered along a promotion's life, the three costs named in the scene, sourcing merged into the accounting paragraph, membership moved up, the worked allocation placed directly after the five parts. Chapter revised to match unit for unit.\n- **2026-11-12** — spec.md converted to spec.json (outcome spec), reconstructed from the published chapter; introduction reordered, sourcing paragraph moved to the stored-value section, synthesis paragraph and contrast hand-off added. Status draft.\n- **2026-11-09** — Added three figures to 'What a Promotion Is, and What It Touches': the promotion vocabulary, the seven promotion types, and one discount touching price, margin and books (article-illustrator).\n- **2026-11-07** — Visual layer: redrew 2 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator).\n- **2026-11-07** — Final consistency pass: ledger-as-document reference rephrased.\n- **2026-11-07** — Editorial review pass: confirmed the Stacking Bug figures against ruling 9, expanded acronyms and accounting terms, removed internal ledger and brief references, timetoread 28.\n- **2026-11-07** — Initial spec and article.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
