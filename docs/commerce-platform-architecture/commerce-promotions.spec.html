<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/08-promotions-and-loyalty/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter. It is a contract, not a description: the places where the published chapter did not do what the spec asks are listed under open_questions and decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The parts of a promotion system: definitions with an order of evaluation and a stop rule, eligibility, the code ledger, evaluation in the cart, allocation to order lines.\n- **Know:** Why gift cards, store credit and loyalty points are liabilities held in ledgers and not promotions.\n- **Believe:** A promotion incident is a governance failure (a setting without an owner) before it is a software failure.\n- **Believe:** The allocated net line price, not the list price, is the price every later system must read.\n- **Be able to:** Allocate an order-level discount to lines and compute the refund for one returned line.\n- **Be able to:** Ask of any promotion setup which system computes the final discount, in what order, where stacking stops and who may change that.\n\n**Audience:** Readers new to commerce architecture. The ecommerce manager who configures campaigns and the engineer who owns the order export benefit most: the chapter shows them the same promotion from the cart's side and from the invoice's side. Finance readers get the liability and breakage rules in plain words; product managers get the choices and the scale-stage judgement.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side, including typing a discount code and paying with a gift card.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines, what a system is, 'the shop platform' for the hosted product, Kestrel & Pine's systems, people and incidents in outline, the four scale stages, bounded context, system of record, single writer, events, idempotency and reconciliation, Waypoint decisions W1 to W8, the failure-pattern names.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub / order management system, availability service, D2C, B2B, PIM, POS.\n- From the two chapters before this one: product information owned per attribute, and a price selected by one rule and frozen on the order.\n\n**Does not yet know:**\n\n- Promotion, coupon code, automatic discount, eligibility, stacking, order of evaluation, stop rule, discount allocation, net line price.\n- Gift card, store credit and loyalty points as liabilities; breakage, material right, contract liability, deferred revenue.\n- Prior price, strike-through price, incrementality, holdout group.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given an order with an order-level discount and one returned line, the reader computes the refund from the allocated net line price and says what had to be recorded at order time. *Probe:* An order holds a €199 jacket and €36 of socks, with a 10% code on the whole order. The customer returns the jacket. Using only this chapter: how much is refunded, and what must have been recorded when the order was placed? | `custom` | cold_reader | major |\n| AC-2 | Given two discounts that combined against the business's intent, the reader names the missing owner of the combination rule and a test against the active promotions, before naming a new tool. *Probe:* In a sale week a welcome code combined with an automatic 20% discount on the same carts, although nobody intended it. Using only this chapter: what was missing, and what would you do before the next campaign? | `custom` | cold_reader | major |\n| AC-3 | The reader can say why a gift-card balance is not a discount and who must check it against what. *Probe:* Using only this chapter: why is a gift card not a promotion, and who has to check its balance against what, how often? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-6 | A reader new to commerce meets no term in this chapter before it is explained, and every acronym is expanded on first use. | `known_before_new` | rubric | minor |\n\n## Thesis\n\n**Question:** How do you offer discounts, coupons, bundles and loyalty rewards without breaking the price, the margin or the books?\n\n> **Claim:** Promotions leave the price, the margin and the books intact when three things hold: each promotion, whether a discount, a coupon or a bundle, is a data record with a place in a declared order of evaluation and a rule that says where stacking (combining promotions on one order) stops; the final discount is computed once, in the cart, and written to the order allocated to its lines, so that invoices and refunds read the net price of each line; and gift cards, store credit and loyalty points are kept apart from promotions as ledgers of value the merchant owes its customers, reconciled every month to a liability account.\n\n**Disputed by:** The view that a promotion is a marketing setting a campaign manager switches on in the shop platform, that the discount shown on the product page is the discount, and that a gift card or a loyalty point is one more kind of discount.\n\n**So what:** Kestrel & Pine's Black Friday Stacking Bug put two discounts on 2,860 orders and cost about €52,000, part of it refunded twice on returns. A merchant that accepts the claim gives the combination settings one owner, tests each campaign against the promotions already active, and makes its order export carry the net price per line.\n\n**How and why:** Two promotions that are each valid combine unless a rule says where stacking stops; when that rule is a platform setting nobody owns, nobody checks it against a new campaign. The product page is rendered before the cart exists, so it can only estimate; the cart is the first place where all lines, codes and the customer are known. Invoices, tax, returns and partial refunds work line by line, so a discount left at order level is refunded at the wrong amount. A gift-card balance is money already received for goods not yet delivered, and a loyalty point is a reward the customer has already earned, so accounting standards record both as liabilities.\n\n**Supporting claims**\n\n- **S1** — Two promotions that are each valid combine against the business's intent when the rule that decides stacking is a platform setting nobody owns or tests, so a promotion incident is a governance failure before it is a software failure.\n- **S2** — A promotion is a data record: a type, conditions of eligibility, a usage record, and a place in a declared order of evaluation with a rule that says where stacking stops.\n- **S3** — The final discount is computed once, in the cart, and written to the order allocated to its lines, because the product page can only estimate and because invoices, tax, returns and refunds work line by line.\n- **S4** — Gift cards, store credit and loyalty points are value the merchant owes its customers, kept as ledgers apart from promotions and reconciled every month to a liability account.\n- **S5** — How much promotion machinery a merchant needs depends on how many systems must agree on the result, so the platform's own promotions with clear ownership are enough until one promotion must be the same rule in two systems the platform does not control.\n- **S6** — What the law, abuse and measurement ask of promotions arrives as requirements on recorded data: a price history, a usage record per customer identity and a record of what was offered.\n\n## Role in the part\n\nShows what may be subtracted from a selected price and how the result is fixed on the order, so that the price a later system reads is the one the customer paid. Supports P2-3 of part `part-2`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene through pieces: the incident, then the vocabulary and the system that would have prevented it; `grouping` in choices, in-practice and when-it-goes-wrong: parallel options, parallel findings and parallel failures)\n\nThe incident comes first because it gives the reader three concrete faults to carry through the chapter. The vocabulary follows because the faults cannot be named exactly without it, and the system description follows the vocabulary because its five parts are described in those words. Stored value comes after the promotion system because it is defined by contrast with it: a reader who met the ledgers first would not yet know what they are being kept apart from. The choices and the scale stages need both halves, since the comparison of the four options has a row for allocation and a row for stored value; moved before the system description, it would compare options on criteria not yet explained. The public examples follow the choices because each names a record (a price history, a customer identity, the offers made) that the chosen arrangement must keep, and the 2027 plan closes them because it applies the governance rule the choices end on. The failures come last because each is the absence of something an earlier section established.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A shopper uses a welcome code to buy a jacket and socks, then returns the jacket. How much should the merchant refund?\n\n**Bridge:** Anyone who has typed a discount code or spent a gift card knows promotions from the shopper's side, where the discount is simply a lower total. → The refund question shows that the total is not enough: the discount has to be recorded per item, the combination of offers has to be decided by a rule, and a stored balance is a debt and not a discount.\n\n**Thesis statement** (KEY POINTS callout, all three bullets; paragraphs p01 to p03 state the three parts in prose): A promotion is a rule evaluated in one place, at cart time, in a declared order with a rule that says when stacking stops; the discount is not finished until it is allocated to lines; gift cards, store credit and points are money owed, kept as ledgers and reconciled to a liability account every month.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p05):\n\n- Start from Kestrel & Pine's Black Friday Stacking Bug. *Kept in:* scene.\n- Define a promotion and what it touches. *Kept in:* what-a-promotion-is.\n- Describe the parts of a promotion system and where the final discount is computed, and follow a discount to the invoice, the refund and the books with a worked allocation on Eva's order. *Kept in:* pieces.\n- Treat gift cards, store credit and points as ledgers of money owed. *Kept in:* stored-value.\n- Compare four ways to run promotions and say how each fits the scale stages. *Kept in:* choices, scale-stages.\n- Give dated examples and Kestrel & Pine's plan for Black Friday 2027. *Kept in:* in-practice.\n- List the ways promotions fail, with detection and recovery. *Kept in:* when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A shopper who used a welcome code on a jacket and socks returns the jacket, and the right
