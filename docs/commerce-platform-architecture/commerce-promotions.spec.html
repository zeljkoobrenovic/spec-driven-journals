<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Discounts, Coupons and Loyalty: Promotions Without Chaos\n\n## Intent\n\nGive a reader who has never run a promotion system the model that every serious platform has converged on: promotions are data with a declared order of evaluation and a stop rule, computed once at cart time (the product page shows an estimate), written to the order allocated per line so that invoices, VAT, returns and refunds carry the right share, and kept apart from gift cards, store credit and loyalty points, which are ledgers of money the merchant owes rather than rules. After reading, the reader can explain why a Black Friday stacking bug is a governance failure before it is a software failure, why a refund of a discounted item must read the allocated net line price, and why the finance director must reconcile stored-value balances to a liability account every month.\n\n## Audience\n\nReaders new to commerce architecture. The ecommerce manager who configures campaigns and the engineer who owns the order export benefit most: the chapter shows them the same promotion from the cart's side and from the invoice's side. Finance readers get the liability and breakage rules in plain words; product managers get the choices and the scale-stage judgement.\n\n## Success criteria\n\n- [x] Opens with a one-sentence \"IN THIS CHAPTER, YOU WILL\", exactly three KEY POINTS, the business and architect callouts, and three named failure patterns (The Price Nobody Can Explain, The Boomerang, The First Snowfall).\n- [x] The Black Friday stacking bug is told with illustrative figures consistent with the ledger (31,000 orders in the week; Ridgewalker €199, landed cost €58; free shipping over €75) and labeled illustrative; new canonical facts (gift-card balances, the stacking incident, the 2027 plan) are appended to the ledger.\n- [x] A reader new to the field can define every term the chapter uses (promotion, coupon code, automatic discount, eligibility, stacking, rules engine, discount allocation, gift card, store credit, liability, breakage, material right, incrementality, holdout, prior price, POS) from the chapter alone; every acronym is expanded on first use.\n- [x] A promotion-type table, a requirements table (freshness, consistency, latency, availability), a trade-off table across four choices, and the \"Across Scale Stages: When It Fits and When It Limits\" table with the four ledger stages.\n- [x] Two mermaid diagrams with captions: the promotion flow (estimate on the page, final in the cart, allocated to the order, read by invoice, refund and analytics) and the stored-value lifecycle (balance in the platform, liability in finance).\n- [x] A worked allocation on Eva's order (€235, hypothetical 10% code, refund of €179.10 not €199) tied to the Boomerang pattern.\n- [x] Every company claim dated and sourced (Shopify, commercetools, Adobe Commerce documentation accessed November 2026; Directive 2019/2161 and ACM 2022–2024; Starbucks FY2025 10-K; Amazon and Target FY2025 10-Ks; PwC on ASC 606 breakage; Gubela et al. 2019 and 2021); vendor survey figures labeled directional.\n- [x] \"When it goes wrong\" covers stacking, estimate vs final, double refund, code leaks, double stored-value debits and stale copies, each with detection and recovery; the three take-away tiers are present and honest; 6–10 questions; hand-off to [Finding the Product: Search, Navigation and Merchandising](commerce-search-and-discovery.html); article at or under 6,500 words from front matter to Sources, including tables.\n\n## Non-goals\n\n- The base price, price lists, contract prices and the pricing engine — [What Does It Cost? Price Lists, Contract Prices, Currencies and Tax](pricing-architecture.html).\n- The cart's persistence and checkout orchestration — [From Cart to Confirmation: Checkout Orchestration](cart-and-checkout.html); the payment, idempotency keys and refunds as money movements — [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html).\n- Invoice numbering, VAT rates and the ledger entries — [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html); the return workflow — [The Way Back: Returns, Exchanges, Refunds and Reverse Logistics](returns-and-exchanges.html).\n- Customer identity resolution across channels — [One Customer, One Product: Identity and Master Data Across Systems](identity-and-master-data.html); holdout analytics and metric definitions — [Counting the Same Thing Everywhere: Data Platforms, Definitions and Analytics](commerce-data-and-analytics.html).\n- Marketplace promotion tools, price parity and repricing — [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html); app governance — [Apps, Plugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html).\n- Fraud and identity signals in depth — LISTED's [Scams, Fakes and Account Takeovers: Fraud Prevention for Listings](../listing-systems-architecture/fraud-prevention.html); ledger design in depth — RECONCILED's [Never Update, Only Append: Designing Custom Ledgers](../finance-systems-architecture/designing-financial-ledgers.html).\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\n## Open questions\n\n- The IFRS 15 breakage paragraphs (B44–B47) are cited through PwC's ASC 606 guide and a secondary IFRS summary; the standard's own text was not readable in research. A reviewer with access should confirm the wording.\n- Whether Kestrel & Pine's 2028 POS evaluation (W4) should make a cross-channel stored-value balance a selection criterion is raised here but decided nowhere yet; [Stores Are Systems Too: Point of Sale and Omnichannel Fulfillment](stores-and-omnichannel.html) or [Build, Buy or Assemble: Choosing and Changing Platforms](build-buy-or-assemble.html) may want to pick it up.\n- Loyalty program mechanics (tiers, earn and burn rates, partner points) are deliberately thin; if the book later adds a loyalty case, this chapter's liability rules are the place to link from.\n\n## Decision log\n\n- **2026-11-07** — Made discount allocation the chapter's spine rather than the rules engine, because the stacking bug's costliest tail (over-refunds) and the invoice and tax consequences hang off it; the rules engine is explained through three vendors' published ordering rules rather than an abstract design.\n- **2026-11-07** — Treated gift cards, store credit and points as a separate section with their own diagram, so the reader learns they are liabilities; chose Starbucks' 10-K as the public example because it is the most precise filing on stored-value liability and breakage.\n- **2026-11-07** — Invented the stacking bug as three chained failures (combination setting, threshold on the discounted subtotal, missing allocation) totaling about €52,000, kept separate from the Oversell's €96,000.\n- **2026-11-07** — Kept paid membership to one paragraph; a longer Prime treatment belongs to [Case: Amazon, From Monolith to Services to the Everything Store](case-amazon.html).\n\n## Sources\n\n- **Internal**\n  - `_research/scenario-ledger.md` — all Kestrel & Pine figures (Black Friday week, Price Drift, Eva's order).\n  - `_research/brief-catalog-pricing-search.md` Parts 2.3 and 3; `_research/brief-checkout-payments-tax.md` Parts 7.4 and 8.5–8.6 — prior price, platform discount rules, abuse, stored-value accounting, incrementality, allocation as a tax problem.\n  - [What Does It Cost? Price Lists, Contract Prices, Currencies and Tax](pricing-architecture.html), [From Cart to Confirmation: Checkout Orchestration](cart-and-checkout.html), [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html), [The Way Back: Returns, Exchanges, Refunds and Reverse Logistics](returns-and-exchanges.html), [One Customer, One Product: Identity and Master Data Across Systems](identity-and-master-data.html) — neighbours whose terms this chapter uses briefly.\n- **External**\n  - Shopify, commercetools and Adobe Commerce discount documentation (accessed 2026-11) — ordering rules, limits, allocation modes, per-issuance expiry.\n  - Directive (EU) 2019/2161; ACM publications of 2022-12-06 and 2024-06-11; § 11 PAngV — the prior-price rule and its enforcement.\n  - Starbucks, Amazon and Target FY2025 10-Ks; PwC Viewpoint on unexercised rights; IFRS Foundation IFRS 15 page — liabilities, breakage, membership.\n  - Gubela, Lessmann and Jaroszewicz (2019); Gubela and Lessmann (2021); Ravelin (2020) — incrementality and promotion abuse.\n\n## Changelog\n\n- **2026-11-07** — Initial spec and article. *(AI-mediated session)*\n- **2026-11-07** — Editorial review pass: confirmed the Stacking Bug figures against ruling 9, expanded acronyms and accounting terms, removed internal ledger and brief references, timetoread 28. *(AI-mediated session)*\n- **2026-11-07** — Final consistency pass: ledger-as-document reference rephrased. *(AI-mediated session)*\n- **2026-11-07** — Visual layer: redrew 2 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator). *(AI-mediated session)*\n"}]}]}</script>

        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped

                // Stray ampersands still get fixed up.

                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
