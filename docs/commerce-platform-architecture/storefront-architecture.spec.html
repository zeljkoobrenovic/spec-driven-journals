<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/32-storefront-architecture/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for that the published chapter did not have: a roadmap p05, a lead p26 for the requirements table, a lead p53 for the failure table, a synthesis p54 that answers the opening, and a hand-off p59 rewritten as the contrast the next chapter declares; see decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** What a storefront owns (templates, layout, brand, browser scripts) and what it renders from other systems; the three rendering models (a theme rendered by the platform, headless on the vendor's runtime, headless anywhere), with checkout on the platform under all three.\n- **Know:** 'Cache the shell, fetch the promise' and the requirements per page type; Core Web Vitals with their thresholds and dates, and the dated, caveated evidence that speed moves sales.\n- **Know:** Technical SEO as part of the storefront's contract, and accessibility as a dated obligation (WCAG 2.2; the European Accessibility Act applying since 28 June 2025).\n- **Believe:** A storefront renders facts it does not own; a new renderer moves rendering and glue, not facts.\n- **Believe:** The usual cause of a slow page is the scripts, not the rendering model.\n- **Believe:** Go headless for a need the theme cannot meet and a team that can run it, never for speed alone.\n- **Be able to:** Read field Core Web Vitals at the 75th percentile and trace a slow metric to its cause before choosing a remedy.\n- **Be able to:** Set a cache and freshness rule per page type, and judge a headless proposal against the three needs and the team that would run it.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer or product manager who receives a headless proposal from an agency (Noor Visser at Kestrel & Pine) and the leader who must approve it; next, the storefront engineer who inherits an agency-customized theme.\n\n**Already knows:**\n\n- Roughly what an API, a database, a browser and a script are.\n- Kestrel & Pine, its people, its 2026 and January 2027 incidents in outline, the sixteen failure-pattern names and the Waypoint decisions W1 to W8.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines, 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, business models and the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Parts II to V: one owner per product attribute; prices selected at order placement and frozen; one search index as a copy; available-to-promise and per-channel buffers; checkout creating the order once; payment stages; one order record with three status lines.\n- From Part VI: an integration style per flow with an owner, pinned API versions and sunset dates, reconciliation jobs, eventual consistency.\n- From Part VII so far: architecture style and deployment unit, and one deployment unit per team that must release independently (chapter 29); pooled tenancy and the API budgets a merchant shares with its apps (chapter 30); extension mechanisms, apps with scopes and an API version, app blocks, app review, one writer per fact and the app governance card, and Kestrel & Pine's 41 apps (chapter 31).\n\n**Does not yet know:**\n\n- Storefront, theme, headless storefront, storefront API, edge runtime.\n- Server-side and client-side rendering, edge cache, incremental static regeneration and request collapsing.\n- Core Web Vitals (LCP, INP, CLS), the 75th percentile of field measurements, Lighthouse.\n- CMS, SEO, crawling, indexing, sitemap, structured data, canonical URL, hreflang, robots.txt and noindex.\n- WCAG, the European Accessibility Act, PWA.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a headless proposal and field measurements, the reader decides from the measurements and the three needs, not from the promise of speed. *Probe:* An agency proposes rebuilding a brand's three country storefronts as a headless application for about €240,000 and nine months, promising speed, flexible brand content and readiness for the future. Field measurements on mobile product pages at the 75th percentile show the main content in 2.1 seconds, interaction response in 310 milliseconds and layout shift of 0.08, and the slow interaction traces to scripts from eleven apps. Using only this chapter: should the brand accept, and what should it do instead? | `custom` | cold_reader | major |\n| AC-2 | The reader can say which parts of a product page are cached and which are fetched live, and what breaks when the rule is broken. *Probe:* Using only this chapter: which parts of a product page can be cached and which must be fetched or checked live, and what goes wrong in each direction? | `custom` | cold_reader | major |\n| AC-3 | The reader can say what the storefront owes search engines and shoppers with disabilities, and who owns it. *Probe:* Using only this chapter: besides speed, what does a storefront owe search engines and shoppers with disabilities? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How does the storefront reach the shopper's browser, and when does headless make sense?\n\n> **Claim:** The storefront renders facts other systems own, from a platform-rendered theme or a headless front end on the vendor's runtime or elsewhere; checkout stays on the platform under every model. Content is cached per market at the edge; price, stock and cart are fetched or validated live. Headless pays only for a shared front end across brands, a content-led site or a B2B portal the theme cannot express, with a team to run it; never for speed alone.\n\n**Disputed by:** The view that headless is the modern storefront: an agency-built front end on a fast framework makes pages faster and converts better, so a merchant with a slow theme should rebuild its storefront rather than fix what runs on the theme.\n\n**So what:** A merchant that accepts the claim reads field Core Web Vitals before any rebuild, traces a slow metric to its cause, sets a cache rule per page type, and asks a headless proposal which of the three needs it serves and who will run it in year two. In February 2027 Kestrel & Pine's agency proposed a headless rebuild on the platform vendor's edge runtime with a headless CMS (about €240,000 and nine months, plus a second runtime to operate; illustrative). Noor Visser measured the NL product pages on mobile at the 75th percentile (LCP 2.1 s, INP 310 ms, CLS 0.08), found the INP problem in eleven apps' scripts and declined. A quarter of agency time (about €38,000) went to a theme performance pass and an app-script audit, and by June 2027 INP measured 180 ms after six unused apps and four redundant scripts were removed. The decision is part of W4 and is revisited at the 2029 review.\n\n**How and why:** The storefront owns templates, layout and scripts, not the catalog, prices, stock or cart, so a new renderer moves the rendering and the glue into the merchant's hands without moving any fact, and a slow price or stock answer or a heavy app script slows a headless page as much as a themed one. Content changes when the catalog changes, so it can be computed once and served to many shoppers from the edge, collapsing requests at peak; price, stock and cart change per shopper or per sale, and a cached copy of them is how the Price Drift and the Oversell reached the page. A headless front end is a second production application with on-call, caching rules, framework upgrades and API version pins, which a team of three that also runs the apps can carry only when the theme blocks a real need.\n\n**Supporting claims**\n\n- **S1** — The storefront owns templates, layout, brand and browser scripts and renders facts other systems own (catalog, price, promotions, search, stock, delivery promise, cart, content), so a new renderer moves the rendering and the glue, not the facts.\n- **S2** — The three rendering models (a theme rendered by the platform, headless on the vendor's runtime, headless anywhere) differ in who runs the renderer and where the templates live; checkout stays on the platform under all three.\n- **S3** — Cache the shell, fetch the promise: content is cached per market and language and collapsed at peak, while account prices, stock commitments and the cart are fetched or validated live; public pages also serve search engines, so their rendered content, product data and URL rules must agree and have an owner.\n- **S4** — Page experience is measured in the field at the 75th percentile and owed to every shopper; the evidence that speed moves sales is directional and dated, the usual cause of a slow page is the scripts rather than the rendering model, and accessibility is a dated obligation on the theme and every app block.\n- **S5** — Headless pays only for a need the theme cannot meet (a shared front end across brands, a content-led site, a B2B portal) and a team that can run a second production application; never for speed alone, as Kestrel & Pine's measured decision shows.\n\n## Role in the part\n\nGives the part its surface to the shopper: the storefront as a renderer of facts it does not own, the three rendering models with checkout left on the platform, the rule 'cache the shell, fetch the promise' that the peak relies on, and the three needs that justify headless. Supports P7-4 of part `part-7`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to in-practice: the agency's proposal, then Noor's answer)\n\nThe proposal and Noor's measurements come first so every later section answers part of them. What the storefront owns comes before the rendering models, because the models differ only in who renders facts the storefront does not own; the performance evidence follows the models directly, because it answers the agency's speed promise and the scene's measurements and shows that the rendering model is not the usual cause; accessibility sits beside it as the other requirement every page must meet; the cache rule follows, because it decides whether those requirements hold on a peak day, and technical SEO after it, because search engines read the same cached public pages; the evidence, accessibility, cache and SEO before the options, because the options are judged against them, including whether the theme and its app blocks can meet the accessibility obligation; the options before the stage table and Noor's decision, which apply them; the failures after the decision, in the book's fixed order. Putting the options before the cache rule and the evidence would ask the reader to judge headless before knowing what it would and would not change.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A slow product page can lose a sale before checkout, but the delay may come from a price service, a stock lookup or an app script, so a new page that waits for the same answers inherits the same problem.\n\n**Bridge:** Anyone who has waited for a product page on a phone, or received an agency proposal promising a faster, more modern storefront, has met the pull to replace the front end. → The step from that pull to the chapter's question: what the storefront actually owns, where the apps of the previous chapter land on it, and when replacing its renderer pays.\n\n**Thesis statement** (KEY POINTS callout, with paragraph p02a (where the apps' scripts land) and the roadmap p05): A storefront renders facts other systems own and leaves checkout on the platform whichever model renders it; content is cached and promises are fetched or validated live; and headless pays for a need the theme cannot meet with a team to run it, never for speed alone, because a slow page is usually its scripts.\n\n**Roadmap** (Paragraph p05, the last paragraph of the introduction (with the IN THIS CHAPTER callout)):\n\n- Start from the agency's February 2027 headless proposal and Noor's measurements. *Kept in:* scene.\n- Say what a storefront owns and what it only renders. *Kept in:* own.\n- Compare the three rendering models. *Kept in:* models.\n- Read the dated performance evidence. *Kept in:* performance.\n- Treat accessibility as a requirement. *Kept in:* access.\n- Set the rule for what is cached and what is fetched live, per page type. *Kept in:* cache.\n- Say what public pages owe search engines. *Kept in:* seo.\n- Set out the four options, with mobile apps beside them, and when each fits by scale stage. *Kept in:* choices, stages.\n- End with Noor's decision, two public checks for a merchant that does replace its storefront, the ways storefronts go wrong and what to take away. *Kept in:* in-practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A slow product page can lose a sale, but the delay may come from a price service, a stock lookup or an app script, so a replacement page that waits for the same answers inherits the problem, and the cause must be found before a replacement is chosen. | scenario: A slow product page whose delay may come from a price service, a stock lookup or an app script. |  |\n| p02 | definition | The storefront produces the pages shoppers use, from a platform theme or as a separate headless application calling the commerce engine through APIs, which gives more control and makes the team run the application and keep its answers fresh. |  | `elaboration`: The hook's slow page and its possible causes. → The two terms the chapter needs, storefront and headless storefront. |\n| p02a | claim | Most of the previous chapter's apps land on the storefront as theme code, app blocks and browser scripts, and those app scripts, more often than the rendering model, are what makes a product page slow. |  | `place`: The storefront and its rendering. → Where the previous chapter's apps land on it, and the scripts as the usual cause of a slow page. |\n| p03 | context | Kestrel & Pine runs three localized storefronts from one agency-maintained theme with 41 installed apps and peak traffic 41 times an average hour, and the chapter follows Noor Visser's decision to decline a February 2027 headless proposal. | fact: Three localized storefronts, one agency theme, 41 apps, peak storefront traffic about 41 times an average hour (illustrative). | `example`: Storefronts, headless storefronts and the apps on them. → Kestrel & Pine's storefronts, apps and peak, and the decision the chapter follows. |\n| p04 | context | Eva sees the Ridgewalker jacket's price, stock and next-day delivery promise on her phone before checking out at 21:14 on 13 April 2027, and later chapters follow the obligations that page creates. |  | `place`: Kestrel & Pine's storefronts. → Eva's product page as the step of the order's journey this chapter covers. |\n| p05 | transition | The chapter starts with the agency's headless proposal and Noor's measurements, then sets out what a storefront owns, the three rendering models, the dated performance evidence, accessibility, the rule for what is cached and what is fetched live, what public pages owe search engines, the four options with mobile apps beside them and by scale stage, and ends with Noor's decision, two public checks for a merchant that does replace its storefront, the ways storefronts go wrong and what to take away. |  | `sequence`: Eva's page and the decision the chapter follows. → The order of the chapter's sections and the kind of evidence each uses. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: The Headless Proposal\n\n**Controlling idea** (`context`, id `scene`): In February 2027 the agency proposed a headless rebuild for about €240,000 and nine months plus a second runtime to operate; Noor measured the product pages first, found two of three metrics already good and the third caused by eleven apps' scripts, and declined.\n\n**Advances the thesis** (S5, S4): Sets the case the chapter's rule is tested on: a speed pitch against field measurements that point to scripts.\n\n**Transition in:** `example`: The roadmap's first promise: the proposal and the measurements. → The agency's February 2027 proposal.\n\n**Order of paragraphs** (`chronological`): The proposal, its price, the measurement, what it showed and the decision, in the order they happened, so the reader sees the evidence before the verdict the rest of the chapter explains.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | context | The agency proposed a separate storefront application on the platform vendor's edge runtime, with a separate content system, promising better speed, more flexible brand content and future readiness. | fact: Headless rebuild of the three storefronts on the vendor's edge runtime plus a headless CMS. |  |\n| p07 | context | The illustrative estimate was about €240,000 and nine months plus a second runtime to operate, and Noor asked which need the existing theme could not meet. | statistic: About €240,000, nine months, plus a second runtime to operate (illustrative). | `elaboration`: The proposal. → Its cost and Noor's question. |\n| p08 | evidence | Noor started from real-user measurements: on the NL storefront's product pages, mobile, at the 75th percentile in February 2027, the main content appeared in 2.1 seconds, response to interaction took 310 milliseconds and layout shift scored 0.08. | statistic: LCP 2.1 s, INP 310 ms, CLS 0.08; 75th percentile, mobile, NL product pages, February 2027 (illustrative). | `sequence`: Noor's question. → The measurements she gathered to answer it. |\n| p09 | analysis | Content loading and layout stability already met Google's good ranges (2.5 seconds, 0.1) and responsiveness did not (good is 200 milliseconds or less), and the slow responses traced to scripts from eleven apps, which pointed to specific work before any architectural replacement. | fact: The INP problem traced to scripts from eleven apps. | `cause_effect`: The three measurements. → What they meant and where the slow one came from. |\n| p10 | transition | Noor declined the rebuild; the next sections set out what she weighed, and her four-part answer comes in In Practice. |  | `conclusion_summary`: The measurements and their cause. → The decision, and where the chapter gives what she weighed and her answer. |\n\n### What a Storefront Does, and What It Does Not Own\n\n**Controlling idea** (`definition`, id `own`): A storefront produces pages from facts almost every other system owns and owns only its templates, layout, brand and browser scripts, so a headless storefront moves the rendering and the glue, not the facts.\n\n**Advances the thesis** (S1): States the first supporting claim and shows the owner of each fact on the page.\n\n**Transition in:** `cause_effect`: Noor's decision and the promise to set out what she weighed. → The starting point of her answer: what the storefront owns and what it only shows.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | A storefront produces home, category, product, search, content, cart and account pages and hands over to checkout, using facts from almost every other part of the platform while owning only its templates, layout, brand and browser scripts. | table: What the page shows against who owns the fact and which chapter covers it: catalog or PIM, pricing, promotions, search index, availability service, shipping service, checkout, CMS, identity.; figure: Figure 1: the storefront renders facts it does not own; the buy button hands the shopper to the platform's checkout. |  |\n| p12 | analysis | Because the storefront owns no fact, a headless storefront moves only the rendering and the glue between the facts into the merchant's hands, which is a gain only if the merchant wanted either. |  | `cause_effect`: The table of facts and their owners. → What a headless storefront does and does not move. |\n\n### Three Rendering Models\n\n**Controlling idea** (`comparison`, id `models`): Today's storefronts render on the server, so the three models differ in who runs the renderer and where the templates live: a theme rendered by the platform, headless on the vendor's runtime, or headless anywhere; checkout stays on the platform under all three.\n\n**Advances the thesis** (S2): Sets out the three models with dated vendor examples and the checkout boundary.\n\n**Transition in:** `elaboration`: Headless moves the rendering and the glue. → The ways the rendering can be organized.\n\n**Order of paragraphs** (`comparison`): The rendering terms first, because the models are compared in them; then the models from the most platform-run to the most merchant-run, each with its dated examples, so each step adds one thing the merchant must run.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | definition | Server-side rendering builds the full page on a server and client-side rendering builds it in the browser; early headless storefronts were slow client-rendered applications, but today's frameworks render on the server, so the models now differ in who runs the renderer and where the templates live. |  |  |\n| p14 | definition | In the first model a theme, a set of templates the platform's renderer turns into pages (Shopify's Liquid, BigCommerce's Stencil, Salesforce's SFRA), leaves rendering, caching, delivery, security and scale to the platform and the templates to the merchant. | example: Shopify Liquid themes; BigCommerce Stencil, 'BigCommerce's Handlebars-based theme engine'; Salesforce SFRA templates. | `sequence`: The rendering terms. → Model 1, the theme rendered by the platform. |\n| p15 | evidence | Shopify's 2020 account of a dedicated Liquid renderer with several cache layers, four to six times faster than its predecessor and deployed regionally by 2022, is a dated example of the delivery infrastructure a theme inherits, not a measurement of today's service. | case: Storefront Renderer: database replicas, query cache, in-memory cache, full-page cache; 4x-6x faster (August 2020); regional deployment without the monolith (January 2022). | `example`: The platform runs rendering and caching. → Shopify's dated account of that renderer. |\n| p16 | analysis | The merchant inherits the delivery infrastructure but is limited by the platform's page types, which Shopify's Online Store 2.0 (29 June 2021) extended with JSON templates, sections and app blocks so templates need less direct editing. | fact: Online Store 2.0, 29 June 2021: JSON templates, sections, app blocks. | `contrast`: What the merchant inherits. → What it is limited by. |\n| p17 | definition | In the second model the vendor supplies a storefront API and hosting and the merchant builds the front end, as with Shopify's Hydrogen and Oxygen, Salesforce's PWA Kit on Managed Runtime and Adobe Commerce as a Cloud Service on Edge Delivery Services. | example: Hydrogen with Storefront and Customer Account API clients, React Router 7 starter, Oxygen hosting (docs 2026-10); Oxygen on main plans at no extra cost (February 2023); PWA Kit on Managed Runtime; Adobe Commerce as a Cloud Service on Edge Delivery Services (20 October 2026). | `sequence`: Model 1 and its limit. → Model 2, headless on the vendor's runtime. |\n| p18 | explanation | Checkout stays on the commerce platform under the vendor-runtime model: Hydrogen excludes checkout UI, and the merchant's application builds the cart and hands the shopper over. | fact: Hydrogen explicitly excludes checkout UI. | `emphasis`: The merchant building the front end. → The part it does not build: checkout. |\n| p19 | definition | In the third model the merchant chooses framework and hosting and may call several commerce platforms, as Vercel's Next.js Commerce and Alokai's unified data layer show, so a group can share one front end across brands with different engines. | example: Next.js Commerce, server-rendered, Shopify as reference with forks, moved to a successor repository; Alokai's unified data layer normalizing several platforms (accessed November 2026).; figure: Figure 2: the three models differ in who renders, who hosts and how many engines the front end can face; checkout stays on the platform under all three. | `sequence`: Model 2. → Model 3, headless anywhere. |\n\n### Performance: What the Evidence Says, With Dates\n\n**Controlling idea** (`evidence`, id `performance`): Core Web Vitals measure real visitors at the 75th percentile against dated thresholds; the evidence that speed moves money is consistent in direction and weak in precision, and the usual culprit is scripts, not the rendering model.\n\n**Advances the thesis** (S4): Gives the metrics, the dated evidence and its caveats, and the scripts as the usual cause.\n\n**Transition in:** `elaboration`: The three rendering models. → How a page's speed is measured whichever model renders it, answering the agency's first promise.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The metrics and their dated definitions first, close to the scene's measurements, which used them in one clause; then Google's ranking wording; then the business evidence with its caveats; then the reading that follows from it, applied back to the scene. The reading needs the evidence before it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | definition | Core Web Vitals are Google's three field metrics, assessed at the 75th percentile of page loads, mobile and desktop separately: LCP (good at 2.5 seconds or less), INP (200 milliseconds or less) and CLS (0.1 or less). | source: web.dev Web Vitals, updated 31 October 2024. |  |\n| p37 | evidence | INP replaced first input delay on 12 March 2024, and Google's Search documentation 'highly recommend[s]' good Core Web Vitals and says they align with what its ranking systems reward, without stating a weight. | quotation: 'highly recommend[s]' good Core Web Vitals 'for success with Search'; they 'align with what our core ranking systems seek to reward'. | `elaboration`: The three metrics. → Their date of change and their place in search ranking. |\n| p38 | evidence (list) | The evidence that speed moves money is consistent in direction and weak in precision: a six-year-old commissioned correlation study, self-selected case studies, and a vendor's own rules limiting what apps may cost. | statistic: Deloitte Ireland for Google (24 March 2020): 0.1 s faster went with +8.4% retail conversions and +9.2% average order value; commissioned, sites undisclosed, correlation.; case: web.dev cases: Vodafone Italy LCP 31% better, sales +8%; Lazada LCP 3x, mobile conversion +16.9%; Cdiscount +6% revenue in a Black Friday sale; self-selected.; quotation: Shopify: performance 'directly influences conversion rates...'; Theme Store minimum Lighthouse 60; apps 'shouldn't reduce Lighthouse performance scores by more than 10 points'; theme code and apps 'can slow down your site'. | `emphasis`: What Google says about ranking. → What the evidence says about sales. |\n| p39 | analysis | Faster is better, nobody can say by how much, and the usual culprit is the scripts rather than the rendering model: the vendor's ten-point cap on apps admits it, and Kestrel & Pine's INP of 310 milliseconds came from eleven apps' scripts. | figure: Figure 3: Kestrel & Pine's INP of 310 ms was eleven apps' scripts, not the rendering model; good is 200 ms or less. | `conclusion_summary`: The three kinds of evidence. → What they add up to, applied to Kestrel & Pine. |\n\n### Accessibility Is a Requirement, Not a Performance Option\n\n**Controlling idea** (`explanation`, id `access`): An accessible storefront lets every shopper complete the purchase; WCAG 2.2 states the standard, the European Accessibility Act has made it an obligation for consumer e-commerce since 28 June 2025, and it applies to the theme and every app block together.\n\n**Advances the thesis** (S4): Makes accessibility a dated obligation on the theme and every app block.\n\n**Transition in:** `contrast`: Speed as a page requirement. → Accessibility, a requirement speed does not satisfy.\n\n**Order of paragraphs** (`large_to_small`): What accessibility means, then the standard, then the law, then Kestrel & Pine's place under it, then what that requires of a theme with apps: each step narrows to the merchant's own work.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | definition | An accessible storefront lets people find products, understand choices and pay with the ways they use a device, and a fast page still fails a customer who cannot use a form or a payment control. |  |  |\n| p41 | definition | WCAG 2.2, the W3C's Web Content Accessibility Guidelines, is a Recommendation dated 12 December 2024 with three conformance levels and four principles. | source: W3C WCAG 2.2, 12 December 2024. | `elaboration`: What accessibility asks. → The standard that states it. |\n| p42 | evidence | The European Accessibility Act applies to consumer e-commerce services provided after 28 June 2025, with microenterprises exempt. | quotation: Directive (EU) 2019/882: services 'provided to consumers after 28 June 2025'; 'e-commerce services' listed; microenterprises (under 10 people, up to €2 million turnover) exempt. | `elaboration`: The standard. → The law that makes it an obligation for e-commerce. |\n| p43 | example | Kestrel & Pine, with 310 employees and three consumer storefronts, has been in scope since June 2025, while its B2B portal is not a consumer service, and national enforcement belongs to the regulation chapter. | fact: 310 employees; three consumer storefronts; B2B portal. | `example`: The Act's scope. → Kestrel & Pine inside and outside it. |\n| p44 | recommendation | An accessible theme can still contain an unusable app block, so accessibility criteria apply to the theme, the inserted components and their combined purchase flow. |  | `cause_effect`: Kestrel & Pine in scope. → What being in scope requires: the whole purchase flow, theme and app blocks together. |\n\n### Cache the Shell, Fetch the Promise\n\n**Controlling idea** (`explanation`, id `cache`): Content that is the same for many shoppers is cached per market and language; answers that are promises to this shopper are fetched or validated live; the rule sets each page type's requirements and decides peak-day survival.\n\n**Advances the thesis** (S3): States the cache rule, its mechanisms and its requirements per page type.\n\n**Transition in:** `sequence`: The page requirements of speed and accessibility. → The decision that lets a page meet them on a peak day: which answers can be reused.\n\n**Order of paragraphs** (`large_to_small`): The split first (what can be computed once and what cannot), then each side, then the rule's name, then the mechanisms that implement it on the platform and the headless layer, then the peak-day feature, and last the requirements per page type that apply it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | claim | Some page content can be computed once and served repeatedly, while other answers depend on this shopper and this purchase. |  |  |\n| p21 | explanation | Product content, images, attributes and layout per market and language, category pages, editorial pages and to a degree search facets are cacheable, because they change with the catalog or the campaign, not with each shopper. |  | `elaboration`: Two kinds of answer. → The first kind: what can be cached. |\n| p22 | explanation | Account prices, stock commitments, the cart and checkout are validated live; public snapshots of price and availability need a freshness limit, account-specific answers are never shared, and stale answers are how the Price Drift and the Oversell reached the page. | example: The Price Drift and the Black Friday Oversell, seen from the page's side.; figure: Figure 4: the cached shell served many times while price, stock badge and cart are fetched for this shopper. | `contrast`: What can be cached. → What must be validated live. |\n| p23 | definition | 'Cache the shell, fetch the promise' names the rule of serving cached content, refreshing changing facts and validating purchase terms, and Shopify's full-page cache supplies it at the platform level. |  | `conclusion_summary`: The two sides of the split. → The rule's name and its platform mechanism. |\n| p24 | evidence | At the headless layer the same idea appears as incremental static regeneration, which Vercel documents as serving the cached page while regenerating it, with e-commerce catalogs as the first use case, request collapsing per region and stale content served if regeneration fails. | quotation: Vercel ISR documentation (updated 28 August 2026): catalogs 'that need current pricing and availability without rebuilding the entire site'; concurrent requests collapsed 'into one function invocation per region, protecting your backend during traffic spikes'. | `similarity`: The platform's full-page cache. → The same rule at the headless layer. |\n| p25 | analysis | Request collapsing is the peak-day feature: when 41 times the normal traffic hits one hero product, the backend sees one request instead of thousands; on the 2026 peak night Kestrel & Pine's cached pages held while the stock sync chain behind the stock badge did not. | figure: Figure 5: Eva's product page arrives from the edge cache first; the storefront then fetches availability and price. | `emphasis`: Request collapsing among the documented features. → Why it matters on the peak day. |\n| p26 | comparison | Each page type gets its own freshness, consistency, speed and peak-day requirement under the rule, from fully cached product content to a live, platform-owned cart and checkout. | table: Requirements per page type: product and category content, price shown, stock badge and delivery promise, search results, logged-in B2B pages, cart and checkout, against how fresh, how consistent, how fast and on a peak day. | `elaboration`: The rule and its peak-day feature. → The rule applied to each page type. |\n\n### Technical SEO and Product Discoverability\n\n**Controlling idea** (`process`, id `seo`): Public product pages must also be discoverable by search engines: crawlable links and sitemaps, product content and structured data in the initial HTML that agree with the live facts, an explicit policy per kind of URL, distinct crawl and index controls, and a named owner who checks them after each release.\n\n**Advances the thesis** (S3): Extends the cache rule to search engines and gives the public pages' discoverability an owner.\n\n**Transition in:** `elaboration`: Cached public pages and their freshness limits. → The second reader of those public pages: search engines.\n\n**Order of paragraphs** (`prerequisite_order`): Definitions first; then a path to every product, then what an engine reads on the page, then the policy for each kind of URL, then the controls that block crawling or indexing, then who owns and checks it all: each step assumes the one before.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | definition | A fast product page can still be hard to find: search-engine optimization rests on letting engines crawl and index pages, and the platform controls much of that foundation through links, rendered content, URLs and product data. |  |  |\n| p28 | process | Every product to be found needs a path of ordinary HTML links, supported by a sitemap, because Google generally does not search a store's own search box. | source: Google Search Central, ecommerce navigation guidance (accessed 9 November 2026). | `sequence`: What SEO rests on. → The first requirement: a path to every product. |\n| p29 | recommendation | Google can execute JavaScript but renders in a separate step and other crawlers may not, so useful product content and a descriptive title belong in the initial HTML; server rendering or pre-rendering supports this, and headless alone gives no SEO advantage. | source: Google's JavaScript SEO guidance. | `sequence`: A path to each product. → What the engine finds when it arrives: the rendered page. |\n| p30 | process | Structured data names the product's facts for machines, Google recommends it in the initial HTML, and it should come from the same records as the visible page and the product feed. | source: Google's merchant listing guidance: product markup in the initial HTML. | `elaboration`: Product content in the initial HTML. → The product facts named for machines. |\n| p31 | analysis | The cache rule serves search engines too: public price and availability snapshots need a maximum age and coordinated updates in HTML, markup and feeds, so machines do not read yesterday's price, and good markup makes a page eligible for richer results without guaranteeing them. |  | `similarity`: Structured data from the same records. → The cache rule applied to what machines read. |\n| p32 | claim | Variants, filters and translations multiply the URLs a platform can publish, so each kind of page needs an explicit policy for its address before crawlers see it. | table: Policy per case: product variants (canonical URL), filters and sorting (index chosen landing pages, limit crawling), languages and countries (hreflang), temporary stockouts (keep the page), moves and retirement (301/308, 404/410). | `elaboration`: Pages that agree with the live facts. → The addresses those pages are published under. |\n| p33 | evidence | These policies follow Google's guidance on ecommerce URLs, faceted navigation, localized versions and site moves, checked 9 November 2026, and the stockout row is an implementation recommendation, because a sell-out and a retirement are different events. | source: Google Search Central and Google Crawling Infrastructure pages on ecommerce URLs, faceted navigation, localized versions and site moves, accessed 9 November 2026. | `elaboration`: The policy table. → Its sources and the one row that is the author's recommendation. |\n| p34 | definition | robots.txt controls fetching and noindex controls inclusion in results; blocking crawling can hide a noindex, neither protects private data, and a release must not carry test-site exclusions onto public product pages. | source: Google's guidance on blocking indexing with noindex. | `contrast`: Policies that decide which pages should be found. → The two controls that keep pages out, and how they differ. |\n| p35 | recommendation | The storefront team should own these rules with catalog and marketing choosing the landing pages, check one jacket's localized pages and variants through a price change and a stockout, inspect and monitor with Search Console after template changes, and preserve the URL policy during migration. |  | `conclusion_summary`: The links, rendering, markup, URL policies and controls. → Who owns them and how they are checked. |\n\n### The Choices and Their Trade-Offs\n\n**Controlling idea** (`comparison`, id `choices`): A merchant on a hosted platform has four options (the disciplined theme, the theme plus a CMS, headless on the vendor's runtime, headless anywhere), and headless is chosen only when the theme cannot express a shared design across brands, a content-led site or a B2B portal, and a team can own on-call, caching, upgrades and API versions.\n\n**Advances the thesis** (S5): States the decision rule against the four options.\n\n**Transition in:** `cause_effect`: Speed, accessibility, caching and discoverability, all of which can be met on a theme. → The other needs a choice of rendering model rests on, and the options.\n\n**Order of paragraphs** (`comparison`): The four options and their trade-offs, then the rule for choosing among them, then mobile apps, the other front end proposed in speed's name, judged by the same rule.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | comparison (list) | The realistic options for a merchant on a hosted platform are four, from the disciplined theme to headless anywhere, and they differ in who runs rendering and caching, flexibility, peak-day posture, the team needed and when each is right. | table: Four options against who runs rendering and caching, flexibility, peak-day posture, team needed and when right. |  |\n| p47 | recommendation | Headless is right only when the theme cannot express a shared design across brands, an editorially driven site or a B2B portal's account pricing and approvals, and when a team will own on-call, caching, framework upgrades and API versions after the agency leaves; speed alone establishes neither. |  | `conclusion_summary`: The four options. → The rule for choosing between them. |\n| p45 | comparison | A progressive web app is mostly the headless question in disguise, since a server-rendered storefront can be made installable, while a native app is a second storefront that must show the same prices, stock and promises and is justified by loyalty, push and in-store features, not speed. | quotation: web.dev: a PWA is a website 'built and enhanced with modern APIs' that can be installed, work offline and send push notifications. | `additional_support`: The rule for choosing a front end. → Mobile apps, the other front end proposed in speed's name. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): The disciplined theme fits from Starting through Omnichannel; at Group scale a shared front end becomes valuable, and Omnichannel scale alone is no reason to build one.\n\n**Advances the thesis** (S5): Applies the rule to each scale stage.\n\n**Transition in:** `elaboration`: The decision rule. → The rule applied stage by stage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | analysis | The theme is kept while it meets the requirements; Group scale makes a shared front end more valuable, and Omnichannel scale alone does not justify one. | table: Four stages with what is typical, what becomes necessary and warning signs of outgrowing the approach, Kestrel & Pine at Omnichannel. |  |\n\n### In Practice\n\n**Controlling idea** (`example`, id `in-practice`): Dated public examples show what to check when replacing a storefront, and Noor's four-part answer applied the rule: measured speed, a content need met by the theme, no need for headless, and a peak problem behind the page.\n\n**Advances the thesis** (S5, S4, S3): Shows the rule, the measurements and the cache argument deciding a real-shaped case.\n\n**Transition in:** `example`: The stage table's judgement for Omnichannel. → Kestrel & Pine at the Omnichannel stage and Noor's decision, then checks for a merchant that does replace its storefront.\n\n**Order of paragraphs** (`small_to_large`): Kestrel & Pine at the Omnichannel stage first, because the stage table's judgement leads straight into it: Noor's four-part answer, then what it cost and when it is revisited; then, for the merchant whose need does justify a new storefront, the two public checks and the boundaries every replacement must keep. Putting the checks first placed replacement advice before a decision not to replace, which both round-2 readers found unclear.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | example (list) | Kestrel & Pine is at the Omnichannel stage, where the stage table keeps the disciplined theme unless one of the three needs applies, and Noor's late-February 2027 answer had four parts, folded into W4: the speed argument failed measurement and the retainer went to a theme performance pass; the content need was met by theme sections and a content model after the PIM; future readiness named no need; and the peak problem was the stock chain behind the badge, not the renderer. | fact: Retainer redirected for one quarter to a theme performance pass and an app-script audit; INP 180 ms by June 2027 after six unused apps and four redundant scripts were removed (illustrative).; fact: Brand content to theme sections and a content model fed by the PIM after W3 (Q3 2027).; fact: One brand, three countries on one design, a B2B portal serving 62% of wholesale orders on the platform's B2B features, no native app.; fact: 2026 peak hour: 2,300 orders, storefront traffic about 41 times an average hour; the platform held, the stock sync chain did not; until W1 lands in Q4 2027 the 2027 peak plan hides the stock count and shows in stock / low stock from a per-channel buffer. |  |\n| p52 | synthesis | What Noor approved cost about €38,000 of agency time over a quarter instead of €240,000 and nine months, left the storefront on the one model her team can run, and is revisited at the 2029 review because the one need that could change it is a Group-stage question. | statistic: About €38,000 of agency time (illustrative); revisited at the 2029 review with the POS question. | `conclusion_summary`: The four parts. → Their cost against the proposal's, and when they are revisited. |\n| p49 | example (list) | For a merchant whose need does justify a new storefront, two dated public practices give concrete checks: compare old and new responses on sampled traffic before switching, and test regeneration failures before the peak. | case: Shopify's renderer rollout (2020-2022) compared status codes, headers and bodies with fallback; Vercel documents request collapsing and stale content after failed regeneration (28 August 2026). | `contrast`: Noor's decision to keep the theme. → Checks for a merchant whose need does justify a new storefront. |\n| p50 | transition | Whatever renders the pages, two things from earlier sections still need checking: checkout stays on the platform, and the whole purchase flow, theme and app blocks together, must still work for every shopper. |  | `additional_support`: The two public practices. → The boundaries established earlier in the chapter. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`cause_effect`, id `wrong`): Storefronts fail as cached promises, uncacheable peaks, script sprawl, forked themes, drifting headless front ends, bots at the front door and inaccessible flows, each with a sign to detect and a recovery.\n\n**Advances the thesis** (S3, S4, S5): Shows the chapter's rules as recoveries from named failures.\n\n**Transition in:** `contrast`: Noor's decision, which went right. → The ways a storefront decision goes wrong, mapped to the chapter's named failure patterns.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | cause_effect | Seven storefront failures recur, from a cached promise to an inaccessible checkout, and each has a sign to detect and a recovery drawn from the chapter's rules. | table: Seven failures: a cached promise, the uncacheable peak, script sprawl, the forked theme, the headless storefront that drifted, bots at the front door, an inaccessible storefront; what each looks like, detection and recovery.; fact: Commerce.com (formerly BigCommerce) Q2 2026 filing reported lower gross margin; an earnings-call summary attributed part of it to hosting costs from AI crawlers and agents (6 August 2026). |  |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The slow product page at the start has one answer across the chapter: the storefront owns templates and scripts, not facts, so its speed is found by measuring the page in the field and tracing the slow metric, which at Kestrel & Pine led to eleven apps' scripts, not to the renderer. The same split governs the rest: what is the same for many shoppers is cached and shown to search engines, what is a promise is fetched or validated live, and the renderer changes only for a need the theme cannot meet with a team to run it.\n\n**So what:** A merchant can answer a headless proposal by reading field Core Web Vitals, tracing the slow metric, setting a cache rule per page type and asking which of the three needs the proposal serves and who runs it in year two; Kestrel & Pine spent about €38,000 on a theme performance pass instead of €240,000 on a rebuild.\n\n**Callback:** The opening's slow product page whose delay may come from a price service, a stock lookup or an app script. p54 names where Kestrel & Pine's delay came from and why a new page would have inherited it.\n\n**Takeaway** (`course_of_action`): Measure product and category pages in the field at the 75th percentile on mobile, trace any slow metric to its cause, budget app scripts, set what is cached and what is fetched per page type, give public-page discoverability and accessibility an owner, and consider headless only for a shared front end, a content-led site or a B2B portal the theme cannot express, with a team that can run it.\n\n**Hand-off** to [Black Friday Every Year: Peak Load, Resilience and Recovery](peak-load-and-reliability.html): `contrast`: The storefront whose cacheable pages held on the 2026 peak night. → The chain behind the storefront, which met the merchant's spike alone and failed, and how to size, test, protect and recover it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p54 | synthesis | The opening's slow product page gets one answer: the storefront owns templates and scripts, not facts, so the cause is found by measuring and tracing, which at Kestrel & Pine led to eleven apps' scripts rather than the renderer, and the same split decides what is cached, what is fetched and when the renderer should change. | reasoning: The opening's slow page set against the scene's measurements, the cache rule and the decision rule. |  |\n| p55 | synthesis (list) | Established: Core Web Vitals measure real users and the studies support speed without predicting a merchant's gain; the hosted models keep checkout on the platform and the caching mechanisms are documented; discovery needs crawlable pages and consistent product data; the Accessibility Act applies since 28 June 2025. |  | `elaboration`: The chapter's answer in one paragraph. → What is established, with its sources. |\n| p56 | synthesis (list) | Depends on context: headless needs both an unmet requirement and an operating team, editorial needs may be met by theme sections or a CMS, and cache policy follows the business model. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p  chapter only treats app scripts as a performance cause. See [Apps, Plugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html).\n- Load testing, degradation ladders and the peak plan; this chapter only establishes cacheability as the storefront's contribution. See [Black Friday Every Year: Peak Load, Resilience and Recovery](peak-load-and-reliability.html).\n- National transposition and enforcement of the Accessibility Act. See [Rules Turned Into Requirements: Consumer, Payment, Invoicing and Platform Regulation](commerce-regulation.html).\n- Agentic channels and catalog feeds for AI agents. See [Assistants and Agents: AI in Commerce and What Is Real in 2026](ai-and-agentic-commerce.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The illustrative Core Web Vitals, the €240,000 proposal and the €38,000 performance pass are ledger facts appended by this chapter; [Build, Buy or Assemble: Choosing and Changing Platforms](build-buy-or-assemble.html) records the February 2027 platform review with its own illustrative figures, and a review pass should confirm the two February decisions read as one month's work. (from spec.md)\n- The 2027 peak plan's 'hide the stock count, show in stock / low stock from a per-channel buffer' is stated here as the storefront's part; [Journey 4: Black Friday, Hour by Hour](journey-peak-day.html) and [Black Friday Every Year: Peak Load, Resilience and Recovery](peak-load-and-reliability.html) should carry the same wording. (from spec.md)\n- Remaining after the confirming round 3 (ESCALATE, 16 pass, 18 fail; cheap fixes applied afterwards, so the report is stale): p37 joins INP's date and Google's ranking wording in one controlling idea (spec; one reader); the bots row of the failure table breaks no rule the chapter sets and sits beside the SEO advice to let crawlers in (spec, corroborated; the row is the author's and cited, so it is kept and the table's lead now says six of seven bre rom product information, search and migration. Distinguish a crawlable product snapshot from the live purchase validation; do not imply Google cannot execute JavaScript or that every retired URL should redirect. (from spec.md)\n- **2026-11-07** — Framed the chapter around 'the storefront owns no fact' and the cache/promise split rather than around framework comparison, because the newcomer's decision is organizational (who renders, who runs it, what is fetched live), not which JavaScript framework to pick. (from spec.md)\n- **2026-11-07** — Put the performance evidence in one section with dates and caveats, and made 'never for speed alone' the headless rule, because the agency pitch in the ledger scene leads with speed and the public evidence cannot support that lead. (from spec.md)\n- **2026-11-07** — Kept accessibility inside the chapter as a storefront requirement (theme and app blocks) rather than deferring it entirely to the regulation chapter, since the EAA's June 2025 date is the one storefront deadline a Dutch merchant of Kestrel & Pine's size cannot skip. (from spec.md)\n- **2026-11-07** — Chose three diagrams (dependencies, rendering models, the cached-page sequence) and no architecture diagram of a specific framework, keeping the chapter platform-neutral. (from spec.md)\n\n## Sources\n\n- **Internal**\n  - journal-spec.json (storefront-architecture; part-7; peak-load-and-reliability transition_in) — Intent, acceptance criteria, thesis, role and the hand-off.\n  - _research/scenario-ledger.md (company; agency retainer; Black Friday week 2026; systems landscape; storefront-architecture and extensibility-and-app-ecosystems lines) and _research/consistency-issues.md (ruling 13a) — The three storefronts, the agency, the 41 apps, the 2026 peak hour, W1, W3, W4, the February 2027 proposal and the measured vitals.\n  - _research/brief-platform-engineering-scale.md (Part 4), _research/brief-shopify.md (Parts 2.5 and 3), _research/brief-platform-landscape.md (Parts                 s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
