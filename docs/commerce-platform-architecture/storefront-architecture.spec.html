<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Delivering the Storefront: Themes, Headless, Rendering and Performance\n\n## Intent\n\nGive a newcomer a working model of the storefront as an architectural component: a renderer of facts other systems own (catalog, prices, promotions, availability, search, content, cart), delivered through one of three rendering models (theme rendered by the platform; headless on the vendor's runtime; headless anywhere), under all of which checkout stays on the platform. The chapter's operating rule is \"cache the shell, fetch the promise\": content pages are cacheable per market, promises (price for an account, live stock, cart) are fetched live, and that split decides both ordinary performance and peak-day survival. It presents the Core Web Vitals and the business evidence behind them with dates and caveats, accessibility as a dated legal requirement, and a decision rule for headless (a shared front end across brands or countries, a content-led site, or a B2B portal the theme cannot express; never speed alone). The Kestrel & Pine thread is the headless rebuild the agency proposed in February 2027 and Noor Visser declined after measuring the storefront.\n\nTechnical SEO belongs to the storefront contract too: explain how public product pages become discoverable, how rendering and fresh product data support that, and who owns URLs, crawl controls, localization and product retirement. Keep the addition compact by shortening repeated rendering-model explanations; preserve the existing evidence and scenario.\n\n## Audience\n\nReaders new to commerce architecture. The engineer or product manager who receives a headless proposal from an agency, and the leader who must approve it, benefit most; the storefront engineer who inherits an agency-customized theme is the second reader. Terms defined in the chapter: storefront, theme, headless, storefront API, server-side vs client-side rendering, edge cache and CDN, incremental static regeneration and request collapsing, Core Web Vitals (LCP, INP, CLS), Lighthouse, CMS, PWA, WCAG, the European Accessibility Act.\n\n## Success criteria\n\n- [x] A reader new to the field can define every term the chapter uses from the chapter alone; every acronym is expanded on first use.\n- [x] The three rendering models are explained in plain words with dated vendor examples (Shopify's Storefront Renderer 2020 and Hydrogen/Oxygen docs 2026-10; BigCommerce Stencil; Salesforce PWA Kit; Adobe Cloud Service October 2026; Next.js Commerce; Alokai), and the chapter states explicitly that checkout stays on the platform under all three.\n- [x] \"Cache the shell, fetch the promise\" is shown as a sequence diagram on Eva's product page and as a requirements table per page type (fresh, consistent, fast, peak-day posture), tying the Price Drift and the Oversell to cached promises.\n- [x] Core Web Vitals carry their current thresholds and dates (web.dev updated 31 October 2024; INP since 12 March 2024), Google's own wording on ranking, and the business evidence with its caveats (Deloitte 2020 as six years old and commissioned; web.dev cases as self-selected).\n- [x] A self-contained technical SEO section defines crawling, indexing and the relevant controls before examples; covers links and sitemaps, rendering, variants and filters, structured product data, localized pages, stock changes and retirement, ownership and monitoring; cites current primary guidance and links to product information, search and migration.\n- [x] Accessibility appears as a dated obligation (WCAG 2.2, 12 December 2024; EAA application 28 June 2025; microenterprise exemption) with Kestrel & Pine placed in scope and its B2B portal out of consumer scope.\n- [x] The trade-off table, the \"Across Scale Stages\" table and judgement, a \"When it goes wrong\" table, the three take-away tiers, Questions to ask and a hand-off to [Black Friday Every Year: Peak Load, Resilience and Recovery](peak-load-and-reliability.html) are present.\n- [x] The Kestrel & Pine worked example gives the February 2027 proposal (illustrative €240,000, nine months), the measured vitals (LCP 2.1 s, INP 310 ms, CLS 0.08, illustrative), the four-part decision, the June 2027 result and the link to W4 and the 2029 review, consistent with the ledger.\n- [x] Prose inside the 6,500-word cap: about 6,250 words excluding front matter and URL destinations.\n\n## Non-goals\n\n- On-site search relevance, filter behavior and merchandising — [Finding the Product: Search, Navigation and Merchandising](commerce-search-and-discovery.html); this chapter covers the resulting URLs' discoverability.\n- Pricing display rules and tax-inclusive pricing — [What Does It Cost? Price Lists, Contract Prices, Currencies and Tax](pricing-architecture.html).\n- The availability service and stock badges' source of truth — [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html).\n- Cart, checkout orchestration and checkout extensibility — [From Cart to Confirmation: Checkout Orchestration](cart-and-checkout.html).\n- Extension mechanisms, app scopes and app governance — [Apps, Plugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html); this chapter only treats app scripts as a performance cause.\n- Load testing, degradation ladders and the peak plan — [Black Friday Every Year: Peak Load, Resilience and Recovery](peak-load-and-reliability.html); this chapter only establishes cacheability as the storefront's contribution.\n- National transposition and enforcement of the Accessibility Act — [Rules Turned Into Requirements: Consumer, Payment, Invoicing and Platform Regulation](commerce-regulation.html).\n- Agentic channels and catalog feeds for AI agents — [Assistants and Agents: AI in Commerce and What Is Real in 2026](ai-and-agentic-commerce.html).\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\n## Open questions\n\n- The illustrative Core Web Vitals, the €240,000 proposal and the €38,000 performance pass are new ledger facts appended by this chapter; [Build, Buy or Assemble: Choosing and Changing Platforms](build-buy-or-assemble.html) records the February 2027 platform review with its own illustrative figures, and a review pass should confirm the two February decisions read as one month's work.\n- The 2027 peak plan's \"hide the stock count, show in stock / low stock from a per-channel buffer\" is stated here as the storefront's part; [Journey 4: Black Friday, Hour by Hour](journey-peak-day.html) and [Black Friday Every Year: Peak Load, Resilience and Recovery](peak-load-and-reliability.html) should carry the same wording.\n- Hydrogen's framework list and Oxygen's plan availability are volatile; re-verify in a 2027 revision.\n\n## Decision log\n\n- **2026-11-09** — Add technical SEO as a storefront responsibility, with links from product information, search and migration. Distinguish a crawlable product snapshot from the live purchase validation; do not imply Google cannot execute JavaScript or that every retired URL should redirect.\n- **2026-11-07** — Framed the chapter around \"the storefront owns no fact\" and the cache/promise split rather than around framework comparison, because the newcomer's decision is organizational (who renders, who runs it, what is fetched live), not which JavaScript framework to pick.\n- **2026-11-07** — Put the performance evidence in one section with dates and caveats, and made \"never for speed alone\" the headless rule, because the agency pitch in the ledger scene leads with speed and the public evidence cannot support that lead.\n- **2026-11-07** — Kept accessibility inside the chapter as a storefront requirement (them ce, app requirements; accessed November 2026) — the theme and vendor-runtime models.\n  - Adobe Experience League (Cloud Service overview, 20 October 2026; Commerce Storefront), BigCommerce Stencil, Salesforce PWA Kit, Vercel (Next.js Commerce; ISR updated 28 August 2026), Alokai (Unified Data Layer) — the other models and the regeneration mechanism.\n  - web.dev (Web Vitals updated 31 October 2024; INP blog 2024; PWA article; business-impact case studies), Google Search Central (Core Web Vitals page) — metrics, thresholds and ranking wording, verified in this session.\n  - Deloitte Ireland for Google, *Milliseconds Make Millions* (24 March 2020) — the conversion study and its caveats.\n  - W3C, WCAG 2.2 (12 December 2024); Directive (EU) 2019/882 (7 June 2019) — accessibility obligations.\n  - Commerce.com 8-K exhibit 99.1 (6 August 2026) and the Nasdaq earnings-call summary (2026) — AI crawler hosting costs, labeled as a secondary attribution.\n\n## Changelog\n\n- **2026-11-09** — Added technical SEO and product discoverability, linked the related chapters, clarified public snapshots versus live purchase validation, and shortened repeated rendering explanations to control length. Sources checked against Google's documentation; status `accepted`.\n- **2026-11-07** — Initial spec and article. *(AI-mediated session)*\n- **2026-11-07** — Editorial review pass: corrected Hydrogen and Oxygen quotations against the docs, Noor's timing (second month, not three weeks), expanded PIM, SFRA, B2B, D2C, POS, W3C, glossed edge runtime and Commerce.com, timetoread; item 13 wording kept neutral. *(AI-mediated session)*\n- **2026-11-07** — Visual layer: redrew 3 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator). *(AI-mediated session)*\n"}]}]}</script>

                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
