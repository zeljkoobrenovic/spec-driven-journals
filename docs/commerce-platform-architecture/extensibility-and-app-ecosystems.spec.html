<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/31-extensibility-and-app-ecosystems/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for that the published chapter did not have: a roadmap p05 and a conclusion paragraph p49 that answers the opening; see decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The five ways to extend a platform (in-process plugins, theme code, apps over APIs with scopes, functions, synchronous call-outs), placed by where they run, what they may touch and how tightly they are tied to the vendor's releases, with dated vendor examples.\n- **Know:** The app store as a business and as governance: what review checks (least scope, performance, clean uninstall, privacy webhooks) and what it cannot see.\n- **Know:** The Forked Platform and its hosted mirror: upgrade cost and the vendor's support clock (Adobe), and extension points withdrawn on announced dates (Shopify's checkout template and Scripts).\n- **Believe:** App review protects the platform and the shopper; which app may write stock or prices is the merchant's decision, and no vendor can make it.\n- **Believe:** One writer per fact: set and adjust do not mix on one number.\n- **Believe:** A platform the merchant cannot upgrade is a platform it has already left; custom behavior belongs on the lowest rung that works, never in the core.\n- **Be able to:** Place any extension on the mechanism table and say which failure it risks.\n- **Be able to:** Run the one-writer-per-fact test on their own app list, and write an app governance card with owner, scopes, API version and support end, review date and exit plan.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer or product manager who inherits a platform with dozens of installed apps and an agency that installed half of them (Milan Petrov and Noor Visser at Kestrel & Pine); next, the leader who approves app installs and agency work.\n\n**Already knows:**\n\n- Roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its 2026 and January 2027 incidents in outline, the sixteen failure-pattern names and the Waypoint decisions W1 to W8.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines, 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Parts II to VI: available-to-promise with one writer each for on hand and committed; checkout creating the order once; an integration style per flow with an owner, a reconciliation job, pinned API versions and sunset dates.\n- From chapters 29 and 30: the vendor's inside versus the merchant's own layer; pooled tenants kept apart by the vendor; rate limits per app and store that the vendor may lower, spent mostly by apps and connectors.\n\n**Does not yet know:**\n\n- Extension point, in-process plugin, theme code, scope, serverless function and WebAssembly sandbox, synchronous call-out, app store.\n- The Forked Platform and the Pulled Rug as named failures.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given two apps writing one stock figure, the reader explains why review did not catch it and names the merchant's governance, not a better app. *Probe:* A brand finds the stock shown on its storefront drifting away from its warehouse count. The warehouse feed sets each variant's stock every hour; a pre-order app subtracts pre-ordered quantities from the same number; both passed the platform's app review. Using only this chapter: why did review not catch this, and what should the brand change? | `custom` | cold_reader | major |\n| AC-2 | The reader can say what risk deep customization carries on a self-run platform and on a hosted one, and how each is managed. *Probe:* Using only this chapter: one merchant runs an open-source or suite platform with years of custom modules in the core; another runs a hosted platform with checkout customizations built on the vendor's extension points. What risk does each carry, and how is it managed? | `custom` | cold_reader | major |\n| AC-3 | The reader can say where a new custom behavior should be built. *Probe:* Using only this chapter: the business asks for a behavior the platform does not have. Where should it be built? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How do platforms let merchants and partners extend them without breaking them, and how should a merchant govern its apps?\n\n> **Claim:** Platforms bound extensions by where code runs: an in-process plugin can reach the core's code and data and ties every upgrade to it; an app reaches only its granted scopes on a dated API version; a function gets a fixed input, output and time budget. App review cannot see two apps writing one business fact, so the merchant governs: an owner, scopes and API version per app, one writer per fact such as stock or price.\n\n**Disputed by:** The view that the app store's review keeps installed apps safe, so a merchant may install whatever the business asks for, let its agency add apps as needed, and modify the platform's core or theme when no app fits.\n\n**So what:** A merchant that accepts the claim keeps a card per app (owner, scopes, API version and support end, review date, exit plan), names one writer per fact and revokes every other write scope on it, runs a quarterly uninstall review, and puts custom behavior on the lowest rung that works. In March 2026 Kestrel & Pine's warehouse feed set stock every hour while a pre-order app adjusted it, giving two weeks of phantom reservations on 600 variants. The April 2027 inventory found 41 apps (about €2,900 a month, illustrative), 6 unused and 3 able to write inventory; the May 2027 reconciliation found 2.3% of active variants with a different quantity, most from those apps. Under the governance rule approved that April, the 6 were uninstalled, write access was withdrawn from the 3 by June 2027, and 34 apps remained in July at about €2,400 a month.\n\n**How and why:** The deeper extension code sits, the more it can touch and the more each vendor release can break it: an in-process module must stay compatible with every core version, the vendor's support clock turns a postponed upgrade into a forced migration, and hosted platforms retire extension points on dates they announce. Each app passes review alone and asks for the write scope its job needs; which system owns stock or price is a decision about the merchant's business that no vendor sees, so an app that sets a number and another that adjusts it both work while the number drifts from both. Only the merchant's own list of owners, scopes and writers connects them.\n\n**Supporting claims**\n\n- **S1** — Extension mechanisms differ by where the code runs, what it may touch and how tightly it is tied to the vendor's releases: an in-process plugin reaches the core's code and data and ties every upgrade to it, an app reaches only its granted scopes on a dated API version, and a function or call-out gets a fixed input, a fixed output and a time budget.\n- **S2** — App review, scopes and dated API versions protect the platform and the shopper, but no review can see two installed apps writing one business fact, because which system owns a fact is a decision about the merchant's business.\n- **S3** — One writer per fact: set and adjust do not mix on one number, so each fact the platform holds has one system of record and one path that writes it, and every other write scope on it is revoked.\n- **S4** — Deep customization ties the merchant to the core: upgrade cost grows with in-process modules until the vendor's support clock forces a migration, while hosted platforms retire extension points on announced dates; custom behavior therefore goes on the lowest rung that works and never into the core.\n- **S5** — Governance is the merchant's own inventory: an owner, scopes, API version and support end per app on a card, one writer per fact and a quarterly uninstall review, sized to the scale stage; Kestrel & Pine went from 41 apps, 6 unused and 3 writing stock, to 34 apps with no app writing stock.\n\n## Role in the part\n\nGoverns the spenders of the merchant's budget and the code that changes its platform: the five extension mechanisms placed by what they may touch and how they age, what app review does and does not protect, the one-writer-per-fact rule, the app governance card and the ladder for where custom behavior lives. Supports P7-3 of part `part-7`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to in-practice: Noor's question, then the rule that answers it)\n\nThe scene comes first so every later section answers part of Noor's question. The five mechanisms come next because every later section uses their terms (scope, extension point, in process); the app store follows because review is the vendor's answer to the risks the mechanisms carry and its gap is the merchant's problem; the writer section follows the gap because it states the rule that closes it; the Forked Platform follows because it turns from code that writes facts to code that changes the platform itself; the ladder then places custom behavior using both risks; the stage table, Kestrel & Pine's rule and the failures apply all of it, in the book's fixed order. Putting the writer rule before the app store would give a rule for a gap the reader has not seen; putting the ladder before the Forked Platform would recommend rungs before the reader knows why the lower ones cost more; putting the mechanisms after the scene's question unanswered for long would be worse than the reverse, because the question needs the terms.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A merchant needs a size guide, a pre-order flow or a loyalty scheme its platform does not provide; an app adds it quickly, but to do its job the app may need customer records or permission to change prices and stock, so choosing the feature also decides which business facts another program may control.\n\n**Bridge:** Anyone who has installed an app to add a missing feature has clicked through a consent screen without asking what else the app may change. → The step from that click to the chapter's question: what each kind of extension may touch, and who in the merchant decides which program writes stock, prices or orders.\n\n**Thesis statement** (KEY POINTS callout and paragraph p02): Extension mechanisms differ by where the code runs and what it may touch; app review protects the platform and the shopper but cannot tell a merchant which of its apps write the same fact, so the merchant governs by owner, scope and writer and keeps custom behavior out of the core.\n\n**Roadmap** (Paragraph p05, the last paragraph of the introduction (with the IN THIS CHAPTER callout)):\n\n- Start from Kestrel & Pine's spreadsheet of 41 apps. *Kept in:* scene.\n- Set out the five ways a platform lets other code in, by where it runs and what it may touch. *Kept in:* mechanisms.\n- Show what app review checks and what it misses. *Kept in:* app-store.\n- Show why two writers of one fact fail and state the one-writer rule. *Kept in:* writer.\n- Show how deep customization stops upgrades, and the hosted mirror of that risk. *Kept in:* forked.\n- Say where custom behavior should live. *Kept in:* choices.\n- End with the scale stages, Kestrel & Pine's governance rule and the ways extensions go wrong. *Kept in:* stages, in-practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Installing an app or plugin for a missing feature also decides which business facts, such as customer records, prices or stock, another piece of software may control. | scenario: A size guide, a pre-order flow or a loyalty scheme the platform lacks. |  |\n| p02 | claim | The risk shows when two extensions change the same fact: each can work as designed while the shopper gets an unreliable availability promise, so permissions and an owner are assigned at installation. | example: A stock badge reads inventory; a pre-order app changes it while a warehouse feed overwrites the same number. | `cause_effect`: Extensions that may change business facts. → What happens when two change the same one, and what prevents it. |\n| p03 | context | Kestrel & Pine supplies the example: the previous chapter found its stock-writing apps among the heaviest spenders of its API budget, and its 41 apps, 6 unused and 3 writing stock, led Noor Visser to an ownership rule in April 2027. | fact: 41 apps, 6 unused, 3 writing stock; the April 2027 rule; chapter 30's finding that the stock apps and the connector's full-catalog sync took about 55% of recorded API usage on Black Friday 2026. | `example`: Two extensions writing one fact. → Kestrel & Pine's apps, met last chapter as spenders of its API budget. |\n| p04 | context | Eva's jacket page carries a size guide, a stock badge and a review widget, and a notification app later sends tracking: each reads data, some can change it, and the chapter establishes what they may touch and who answers for the result. |  | `place`: Kestrel & Pine's apps. → Where they sit on Eva's order. |\n| p05 | transition | The chapter starts from Kestrel & Pine's spreadsheet of 41 apps; sets out the five ways a platform lets other code in, what app review checks and misses, why two writers of one fact fail, how deep customization stops upgrades, and where custom behavior should live; and ends with the scale stages, Kestrel & Pine's governance rule and the ways extensions go wrong, with vendors' own documentation as evidence. |  | `sequence`: The question and Eva's page. → The order in which the chapter answers it. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: Forty-One Apps and One Spreadsheet\n\n**Controlling idea** (`context`, id `scene`): Kestrel & Pine's April 2027 app inventory found 41 apps that few people knew, 6 unused and 3 able to write stock beside the warehouse feed, and nobody who decided which program could write stock.\n\n**Advances the thesis** (S5, S3): Sets the case the governance rule answers: an unowned app list with three extra writers of stock.\n\n**Transition in:** `example`: The introduction's 41 apps, 6 unused and 3 writing stock, and Noor's April 2027 rule. → The April 2027 inventory that produced those figures.\n\n**Order of paragraphs** (`large_to_small`): From the whole list and its cost, to the three apps that write stock, to the one incident, to the question the chapter answers; the question would mean nothing before the reader has seen the three writers.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | context | In April 2027 Noor and Milan inventoried all 41 apps: Milan knew about twenty well, the agency had installed 22 over several years, and the rest came from campaigns, pilots and former staff. | fact: 41 installed apps; 22 installed by the agency; Milan knows about twenty well. |  |\n| p07 | analysis | Recording each app's purpose, owner and permissions, not only counting the apps, is what let Noor find the unused subscriptions and the apps that write the same facts. | statistic: About €2,900 a month (illustrative) across platform and agency invoices and three company cards.; table: The 41 apps by category, with unused apps, apps that write platform data and an example per category (illustrative breakdown). | `elaboration`: The 41 apps and where they came from. → What the inventory recorded about each, and what that showed. |\n| p08 | description | Three apps could write inventory separately from the main warehouse feed, which is one chain: the iPaaS carries the WMS's counts to the ERP and the ERP's hourly sync writes them into the platform. | fact: Three stock-writing apps beside the hourly WMS feed; the WMS reaches the platform only through the hourly sync (ruling 22). | `emphasis`: The table's three apps that write inventory. → Those three set beside the main warehouse feed. |\n| p09 | example | Each of the three needed a decision: one copied stock between locations, one was the pre-order app whose adjustments the warehouse feed overwrote, causing the App That Wrote Stock in March 2026 (phantom reservations on about 600 variants for two weeks), and one still held write access for a channel no longer used. | case: The App That Wrote Stock, March 2026: about 600 variants, two weeks of phantom reservations. | `elaboration`: The three apps that write inventory. → What each one does, and the incident one of them caused. |\n| p10 | claim | Noor's question was not which app caused the incident but who in the company may let a program write stock and how anyone would know it had; nobody could, and that is the question the chapter answers. |  | `cause_effect`: The three writers and the incident. → The governance question they raise. |\n\n### Five Ways to Extend a Platform\n\n**Controlling idea** (`comparison`, id `mechanisms`): Platforms let other code in through five mechanisms, and where each runs, what it may touch and how tightly it is tied to the vendor's releases decide how dangerous it is.\n\n**Advances the thesis** (S1): Places each mechanism by the three tests, with the vendors' own documentation.\n\n**Transition in:** `problem_solution`: Noor's question: who may let a program write stock. → How platforms let programs in at all, the first thing needed to answer it.\n\n**Order of paragraphs** (`large_to_small`): Why extensions exist, then the three tests, then the table of five mechanisms, then each mechanism from the one that reaches furthest to the most bounded, then the common design and what each interaction needs; the summary rule about extension points would be empty before the reader has seen the bounded mechanisms.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | context | Answering Noor's question starts with how programs get into a platform: extensions let a shared platform serve different businesses without a separate core for each, which is why hosted platforms run one version for every merchant and list thousands of apps. | quotation: Shopify 10-K FY2025: 'single branch' software, 'millions' of merchants, 'more than 21,000 apps'; SAP Commerce 'a flexible, modular architecture based on extensions'. |  |\n| p12 | claim | Three things decide how dangerous an extension is: where it runs, what it may touch (everything, or only the data its permissions, called scopes, cover) and how tightly it is coupled to the platform's version. |  | `cause_effect`: Many extensions on one shared platform. → The three tests that tell them apart. |\n| p13 | definition | An extension point is a named place in the platform's flow where it agrees to run or call someone else's code, and platforms offer five kinds. | table: Five mechanisms (in-process plugin, theme code, app over APIs and webhooks, serverless function, synchronous call-out) by where they run, what they can touch, version coupling and dated examples. | `elaboration`: The three tests. → The term 'extension point' and the five mechanisms placed on the tests. |\n| p14 | explanation | An in-process plugin runs inside the platform program and can do anything it can, including replacing the platform's own logic, and several plugins can disagree about which runs first. | quotation: Adobe Commerce plugins: before, after, around; sortOrder; around plugins 'should be avoided unless they're required'. | `sequence`: The table's first row. → The in-process plugin explained. |\n| p15 | evidence | Vendors that offer in-process code warn about upgrades and draw the line themselves: a vendor that runs the platform for you cannot let your code run inside it. | quotation: WooCommerce: backwards compatibility 'is not guaranteed'; Salesforce: 'you never edit app_storefront_base directly'; Shopware: plugins 'have direct access to the database' and 'are not supported by Shopware cloud'. | `additional_support`: Adobe's description of plugins. → Three more vendors' warnings and Shopware's line between plugins and apps. |\n| p16 | explanation | Theme code is a second place where outside code lands, and hand-edited theme files carry the risk the chapter later names the Forked Platform, glossed here as a platform changed so deeply it cannot be upgraded: every theme update becomes a merge. | fact: Shopify Online Store 2.0 (29 June 2021): theme app extensions introduced to end 'ghost code' left by uninstalled apps. | `sequence`: Code inside the platform's program. → Code inside the storefront renderer. |\n| p17 | definition | An app is a separate program that talks to the platform through its APIs and webhooks and may do only what its granted scopes allow. | example: Shopify scopes read_inventory, write_inventory, read_orders, write_orders; order scopes cover the last 60 days unless a broader scope is approved; Saleor apps as external services. | `contrast`: Code that runs inside the platform or its renderer. → Code that runs outside and is limited by scopes. |\n| p18 | analysis | Apps are loosely coupled because the API is versioned with a support window, and the price of that looseness is an upgrade obligation for every app. | quotation: Shopify releases an API version every three months, supports each for at least 12 months, and 'falls forward' from a retired one. | `cause_effect`: Apps that reach the platform only through its API. → What the versioned API gives them and what it costs. |\n| p19 | description | The newest mechanism runs the merchant's small program at a named moment in the platform's flow with a fixed input, a fixed output and a time limit, as Shopify Functions do, after Scripts were retired. | fact: Shopify Functions: WebAssembly, JSON in, operations out, no network; limits for 2026-10 of 11 million instructions, 10 MiB memory, 256 KiB module; Scripts retired 30 June 2026. | `sequence`: Apps outside the process. → Functions, which run inside the request path but in a sandbox. |\n| p20 | description | A synchronous call-out lets the platform ask the merchant's endpoint before saving a change, so its latency and failures become the merchant's. | quotation: commercetools API Extensions: 'if it fails or takes a second longer..., the whole API call fails or takes a second longer'; 2 s budgets, about 50 ms target, 25 per project, no retry. | `similarity`: Functions with a fixed input, output and time limit. → The call-out variant of the same idea. |\n| p21 | synthesis | The common design is the lesson: an extension point is a named moment with a fixed input, a fixed output, a time budget and a failure rule, and the time budget is the vendor protecting checkout from the merchant's code. | figure: Figure 1: where an extension runs decides what it can touch. | `conclusion_summary`: Functions and call-outs. → The design they share. |\n| p22 | comparison | The five mechanisms meet in four interactions a merchant actually has (a webhook being the notification half of an app over APIs), each needing a different time budget and failure rule and someone who answers when it fails, the question the rest of the chapter takes up. | table: Checkout validation, stock write, order webhook and replaced core method, with mechanism, time budget, failure rule and owner (vendors' documented budgets; one labelled assumption). | `elaboration`: The extension point's time budget and failure rule. → The four interactions a merchant has, with the webhook placed as part of an app over APIs and the owner column announced as the chapter's next question. |\n| p23 | analysis | Every interaction except the replaced core method has a platform rule for failure; in-process code has none, because the platform no longer knows what it is doing. |  | `conclusion_summary`: The table's four rows. → The one row without a failure rule. |\n\n### The App Store: Business Model and Governance\n\n**Controlling idea** (`analysis`, id `app-store`): The app store is the vendor's business and its governance; its review protects the platform and the shopper but cannot tell a merchant that two installed apps write the same fact.\n\n**Advances the thesis** (S2): Lists what review checks and states the gap it leaves.\n\n**Transition in:** `elaboration`: Apps over APIs, limited by scopes, as one of the five mechanisms. → Where merchants get those apps: the app store.\n\n**Order of paragraphs** (`grouping`): The definition, then the store as a business, then the store as governance, then what the governance list omits; the gap can be seen only after the list.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | definition | An app store lists, reviews and bills for third-party apps and takes a share, so it is both a business and a governance mechanism, and the two are not the same. |  |  |\n| p25 | analysis | As a business, the app store aligns the vendor and developers around installs, so nothing in it is designed to reduce the number of apps a merchant runs. | fact: Shopify revenue share: developers keep the first $1,000,000 of lifetime gross app revenue and pay 15% above it. | `elaboration`: The store as two things. → The first: the store as a business. |\n| p26 | evidence (list) | As governance, review requirements protect the platform and the shopper and read like a list of harms the vendor has seen: least scope, performance and currency, clean uninstall, privacy webhooks and billing through the platform. | source: Shopify app requirements (least scope, 10-point Lighthouse rule, 90-day deprecation rule, privacy webhooks within 30 days); BigCommerce ('Apps configured with all scopes aren't approved', PCI review, clean uninstall). | `contrast`: The store as a business that wants installs. → The store as governance: what review requires. |\n| p27 | claim | Nothing in app review tells the merchant that two installed apps both write inventory, because each passed review alone and which system owns stock is a decision about the merchant's business; the App That Wrote Stock is a gap on the merchant's side that no vendor can close. |  | `contrast`: What review requires. → What review cannot see. |\n\n### What an App May Touch: The Writer Problem\n\n**Controlling idea** (`claim`, id `writer`): The question to ask of any extension is what it writes, and the rule that answers it is one writer per fact.\n\n**Advances the thesis** (S3): Works the March 2026 incident into the one-writer rule and the table of facts and writers.\n\n**Transition in:** `problem_solution`: The gap review leaves: two apps writing one fact. → Why writing is the question, and the rule that closes the gap.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The claim that writing is what matters, the incident as two writers, the vendor's own set-versus-adjust distinction, the rule, the table that applies it, and the exception that keeps it from being read as a ban.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | example | What an extension writes matters more than what it does: in March 2026 the WMS feed set stock every hour while the pre-order app adjusted it, each correct alone, and the number shown drifted from both. | case: The App That Wrote Stock: hourly set by the WMS feed, adjust by the pre-order app.; figure: Figure 2: two writers of one fact. |  |\n| p29 | evidence | The vendor's own inventory API separates adjusting a quantity from setting it and keeps stock in separate states per location. | fact: Shopify inventoryAdjustQuantities and inventorySetQuantities; states available, committed and on hand. | `additional_support`: Set and adjust at Kestrel & Pine. → The same distinction in a vendor's API. |\n| p30 | claim | Set and adjust do not mix on one number and a reservation belongs in its own state, so the rule is one writer per fact; the states and the availability service belong to the inventory chapter. |  | `conclusion_summary`: The incident and the vendor's distinction. → The general rule they support. |\n| p31 | explanation | Each fact the platform holds has one system of record and one path that writes it into the platform, and every app with a write scope on that fact is either that path or a mistake. | table: Stock, prices, product content and orders at Kestrel & Pine after Waypoint: system of record, the one writer into the platform, and apps that may only read. | `elaboration`: One writer per fact. → What the rule means for each fact the platform holds. |\n| p32 | explanation | The rule does not forbid writing: the returns portal creates exchange orders through the API with an owner and a reason, and every writer is named. |  | `contrast`: Apps that may only read. → A named writer that is allowed. |\n\n### The Forked Platform and the Pulled Rug\n\n**Controlling idea** (`cause_effect`, id `forked`): Customizing the core makes a platform un-upgradable until the vendor's support clock forces a migration, and hosted platforms carry the mirror risk of extension points withdrawn on announced dates; one inventory manages both.\n\n**Advances the thesis** (S4): Documents the upgrade risk and the deprecation risk in the vendors' words and dates.\n\n**Transition in:** `contrast`: Apps that write facts through a platform's API. → Code that changes the platform itself.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The definition, then Adobe's evidence in three steps (guidance, tool, its own out-of-process reasoning), then the support clock that turns the cost into a deadline, then the hosted mirror, then the comparison that joins them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | definition | Set against programs working through the API, the Forked Platform is a platform whose core or theme has been customized so deeply that it can no longer be upgraded, so every release becomes a project and eventually none is taken. |  |  |\n| p34 | evidence | Adobe's upgrade guidance says the amount and quality of custom work and third-party modules decide how hard an upgrade is, and skipped releases make the next one harder. | quotation: 'The amount of custom work and the number of installed third-party modules strongly affects the complexity of an upgrade'. | `example`: The Forked Platform. → The vendor's own description of its cost. |\n| p35 | evidence | Adobe ships a tool that checks a customized instance against a target version and reports the issues, and that the vendor builds such a tool shows how common the problem is. | fact: Upgrade Compatibility Tool reports 'critical issues, errors, and warnings' (updated 8 October 2026). | `additional_support`: Adobe's guidance. → Adobe's tool for the same problem. |\n| p36 | evidence | Adobe's reasoning for its out-of-process model is the same lesson from the vendor's side: in-process code must stay compatible with every version, while out-of-process apps run on their own schedule at the cost of deep synchronous control. | quotation: In-process code 'must stay compatible with each Commerce version and its runtime'; App Builder apps 'developed, deployed, and operated on their own schedule'. | `additional_support`: Adobe's guidance and tool. → Adobe's reasoning for moving extensions out of process. |\n| p37 | evidence | The vendor's support policy turns a postponed upgrade into a forced migration: about three years of standard support per release, and from 1 June 2027 cloud environments on unsupported versions are taken offline. | fact: 2.4.4: GA 12 April 2022, standard support to 12 April 2025; 2.4.7: GA 9 April 2024, supported to 31 May 2027; from 1 June 2027 traffic suspended, the storefront 'will go offline'. | `cause_effect`: Upgrade cost that grows with modules. → The clock that turns the cost into a deadline. |\n| p38 | evidence | Hosted platforms cannot be forked but withdraw extension points on announced dates (the book's Pulled Rug), so an extension point is a promise with a date that the merchant's inventory must record. | fact: checkout.liquid stopped working 13 August 2024 by a notice of 13 February 2023, non-upgraded checkouts automatically replaced; Scripts retired 30 June 2026. | `contrast`: Self-run platforms whose core the merchant changed. → Hosted platforms whose extension points the vendor withdraws. |\n| p39 | comparison | Open source and suites put the upgrade risk in the merchant's hands and hosted SaaS the deprecation risk; neither is safe, and both are managed by the same inventory. | figure: Figure 3: upgrade risk beside deprecation risk, one inventory. | `conclusion_summary`: The upgrade risk and the deprecation risk. → The two set side by side and joined by one inventory. |\n\n### The Choices: Where Custom Behavior Should Live\n\n**Controlling idea** (`recommendation`, id `choices`): Custom behavior belongs on the lowest rung of a ladder that works: configuration, a native extension point, a public app, a custom app with an owner, an in-process plugin rarely, the core never.\n\n**Advances the thesis** (S4): Turns the mechanisms and their risks into a placement rule.\n\n**Transition in:** `cause_effect`: The upgrade and deprecation risks of deep customization. → Where custom behavior should therefore go.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | recommendation (list) | Because both risks grow with the depth of a change, the author climbs a ladder of six places from the top and stops at the first rung that works: configuration (with Hodgson's three kinds of feature toggle glossed), a platform-native extension point, a public app, a custom app with an owner and a pinned API version, an in-process plugin only for synchronous core control, and editing the core never. | table: Six choices by upgrade coupling, what they may touch, latency risk to checkout, who maintains them and when each is right.; source: Pete Hodgson, Feature Toggles (2017); Shopify Flow help page. |  |\n| p41 | explanation | The ladder assumes a small team that does not sell software: a Group-stage merchant with a platform team on a suite can afford a budgeted in-process layer, and Kestrel & Pine, with three storefront-and-apps engineers and an agency, cannot. | fact: Kestrel & Pine's technology team: three storefront-and-apps engineers among nine engineers, plus the agency. | `contrast`: The ladder as a general recommendation. → Who it fits and who can depart from it. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): The mechanisms do not change with scale but the governance does: a list with owners and scopes from the Starting stage, a card per app and a one-writer rule at Omnichannel, a shared catalog and upgrade calendar at Group.\n\n**Advances the thesis** (S5): Sizes the governance to each scale stage.\n\n**Transition in:** `elaboration`: The ladder and the team size it assumes. → The governance each scale stage needs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | comparison | The mechanisms stay the same across stages while the governance grows, and the stage decides which failure arrives first. | table: The four stages with what is typical, what becomes necessary and the warning signs of outgrowing the approach. The card and the quarterly review are glossed in the table's Omnichannel row, ahead of In Practice. |  |\n| p43 | analysis | Extensibility is cheap to adopt and expensive to govern: the bill arrives at Omnichannel as two writers of one fact, and a list kept from the Starting stage costs almost nothing while one started at forty apps costs a week of archaeology. |  | `conclusion_summary`: The stage table. → The judgement it supports. |\n\n### In Practice\n\n**Controlling idea** (`example`, id `in-practice`): Two dated public examples show vendors moving extensions out of the core, and Kestrel & Pine's five-line app governance rule turned the April 2027 spreadsheet into 34 owned apps with no app writing stock.\n\n**Advances the thesis** (S4, S5): Shows the direction vendors take and the governance rule applied, with its results.\n\n**Transition in:** `example`: The governance each stage needs. → Public examples and Kestrel & Pine's rule at the Omnichannel stage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | example (list) | Beyond the Shopify dates already given, one dated public example shows the direction vendors are taking: Adobe's Commerce as a Cloud Service, from 2025, extends through out-of-process mechanisms rather than in-process modules. | case: Adobe Commerce as a Cloud Service: release notes from November 2025, extension through App Builder, API Mesh, events and webhooks, 30-day sandbox window (20 October 2026). |  |\n| p45 | recommendation (list) | Noor and Milan turned the spreadsheet into a five-line rule approved by Mara Lindqvist alongside Waypoint: a named owner per app, scopes and API version on a card, one writer per fact, a quarterly uninstall review, and custom behavior on the lowest rung that works. | fact: The April 2027 app governance rule and the app governance card. | `contrast`: What the vendors did. → What the merchant did on its own side of the platform, signalled at the start of the unit. |\n| p46 | evidence | The rule's results: six unused apps removed in April 2027, inventory write access withdrawn from all three stock-writing apps by June after the May reconciliation found 2.3% of active variants differing, and 34 apps in July at about €2,400 a month; the point is that Noor can now answer who may let a program write stock. | statistic: 6 uninstalled April 2027; 2.3% of active variants differing in May 2027, most from the three apps; write access withdrawn by June 2027; 34 apps at about €2,400 a month in July 2027 (illustrative).; figure: Figure 4: 41 ownerless apps to 34 owned ones.; table: The app governance card filled in for the pre-order app. | `cause_effect`: The five-line rule. → What it produced by July 2027. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`cause_effect`, id `wrong`): Extensions fail the way integrations fail, often without the merchant knowing the extension exists, and every failure is found and fixed faster by a merchant that can list its apps, owners, scopes and the facts they write.\n\n**Advances the thesis** (S2, S3, S4): Lists each failure with its detection and recovery.\n\n**Transition in:** `contrast`: Kestrel & Pine's rule working. → The ways extensions go wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | cause_effect | Kestrel & Pine's rule works only while someone keeps it: extensions fail the way integrations fail, often without the merchant knowing the extension exists, in five ways with their own detection and recovery, two of them named the Pulled Rug (met above) and the Lynchpin (a capability that runs through one app or vendor nobody is watching). The lead also places the author's opening patterns: the first row is the Secret Agent when the writing app has no owner, and forty-one apps with their own paths into the data are the Spaghetti Junction. | table: Five failures: two writers of one fact, a lost webhook, the withdrawn extension point (the Pulled Rug), the un-upgradable core (the Forked Platform), an app as attacker's path or abandoned (the Lynchpin), with detection and recovery. |  |\n| p48 | synthesis | Every failure is found and fixed faster by a merchant that can list its apps, their owners, their scopes and the facts they write. |  | `conclusion_summary`: The five failures. → What they have in common. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The mechanisms, the app store and the forked core meet on one point: the platform bounds what each extension may reach, but only the merchant knows which system owns each fact, so how deep the code sits decides what an upgrade costs, while who may write each fact decides whether the shopper's promise holds. Both are answered by the same list of apps with owners, scopes, API versions and the facts they write.\n\n**So what:** A merchant that keeps that list can answer the question Kestrel & Pine could not in March 2026, place any new behavior on the lowest rung that works, and see a deprecation or an upgrade deadline before it arrives; one that relies on app review installs the next App That Wrote Stock.\n\n**Callback:** The opening's app installed for a missing feature, Eva's jacket page with its stock badge, and Noor's question of who may let a program write stock. p49 answers them: installing the feature is a decision about which facts the app may write, and at Kestrel & Pine the answer is one named writer of stock, so Eva's stock badge shows a number one program sets.\n\n**Takeaway** (`course_of_action`): List every app with an owner, its scopes, its API version and support end; name one writer per fact and revoke every other write scope on it; review the list each quarter; and put custom behavior on the lowest rung that works.\n\n**Hand-off** to [Delivering the Storefront: Themes, Headless, Rendering and Performance](storefront-architecture.html): `place`: The apps of this chapter, which mostly land on one surface through theme code, app blocks and scripts. → The storefront where that code meets the shopper's browser: the three rendering models, the cache rule per page type, and the headless proposal Noor Visser declined in February 2027.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p49 | synthesis | The opening's feature and Noor's question get one answer: the platform bounds what each extension may reach, but only the merchant knows which system owns each fact, so one list of apps with owners, scopes, API versions and the facts they write manages both the upgrade cost of deep code and the promise a second writer breaks; at Kestrel & Pine it names one writer of stock, so the stock badge on Eva's jacket page shows a number one program sets. | reasoning: The opening case and Noor's question set against the mechanisms, the review gap, the writer rule and the forked core. |  |\n| p50 | synthesis (list) | Established: where an extension runs decides what it can touch and what it costs at upgrade time; upgrade cost scales with in-process customization under the vendor's support clock; hosted platforms withdraw extension points on published dates; app review protects the platform and the shopper but cannot see two writers of one fact. | source: Adobe, Shopware, WordPress, Shopify, BigCommerce, Saleor and commercetools documentation; Adobe lifecycle policy; Shopify's 2023–2026 timeline. | `elaboration`: The chapter's answer in one paragraph. → What is established, with its sources. |\n| p51 | synthesis (list) | Depends on context: whether in-process extension is acceptable depends on who runs the platform and the team's size; how formal governance must be depends on stage; whether to build or buy an app depends on whether the need is special. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p52 | recommendation (list) | The author's synthesis: treat every installed app as an integration under W5 (an owner, a contract, idempotent writes and a reconciliation job), and lose a feature rather than keep a second writer. |  | `sequence`: What depends on context. → The author's own judgement. |\n| p53 | recommendation (list) | A lead sentence says seven questions turn the chapter into a review of the reader's own platform, and the questions follow: the app list with owners, the single writer per fact, the mechanism per behavior, in-process modules and support end, API versions and deprecations, checkout time budgets, and who approves an app and its exit plan. |  | `cause_effect`: The author's judgement. → Questions the reader can ask of its own platform. |\n| p54 | transition | The apps that extend a platform mostly land on one surface, the storefront, where theme code, app blocks and scripts meet the shopper's browser, which the next chapter takes up with the headless proposal Noor declined in February 2027. |  | `place`: The apps and scripts this chapter governs. → The surface where they meet the shopper. |\n\n## Non-goals\n\n- Inventory states, reservations and the availability service. See [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html).\n- API versioning, webhook contracts and deprecation mechanics in depth. See [Promises Between Systems: API Contracts, Webhooks and Versioning](api-contracts-and-versioning.html).\n- Theme rendering, headless storefronts and storefront performance. See [Delivering the Storefront: Themes, Headless, Rendering and Performance](storefront-architecture.html).\n- Checkout extensibility as a checkout topic. See [From Cart to Confirmation: Checkout Orchestration](cart-and-checkout.html).\n- App security (supply-chain risk, compromised apps) and privacy obligations. See [Protecting the Shop: Card Data, Account Takeover, Bots and Skimmers](commerce-security.html), [Whose Data Is It? Privacy, Consent and Retention](privacy-and-customer-data.html).\n- Team ownership models and agency contracts. See [Who Builds and Who Owns: Teams, Vendors, Agencies and Governance](organizing-commerce-engineering.html).\n- Shopify as a case; this chapter uses Shopify only as dated evidence beside other vendors. See [Case: Shopify, the Modular Monolith That Serves Millions of Merchants](case-shopify.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-07** — Organized the mechanisms by where the code runs (in process, theme, outside over APIs, sandboxed function, call-out) rather than by vendor, so the chapter stays platform-neutral and the newcomer gets one test that works for any product. (from spec.md)\n- **2026-11-07** — Made 'one writer per fact' the chapter's governance rule and tied every Kestrel & Pine outcome to it, instead of a generic 'app hygiene' list, because the incident and the May 2027 reconciliation are both instances of that rule. (from spec.md)\n- **2026-11-07** — Treated the Forked Platform and the Pulled Rug as two faces of one risk (in-process code vs withdrawn extension points) managed by the same inventory; the Adobe lifecycle dates and the Shopify deprecation timeline carry the evidence. (from spec.md)\n- **2026-11-07** — Cut a third diagram (the decision ladder) and an open-source-vs-SaaS contrast table during the length pass; the ladder survives as a paragraph and a trade-off table, the contrast as one paragraph. (from spec.md)\n- **2026-11-12** — Converted spec.md to spec.json. The old success criteria were inventories and are not carried over as criteria: term definitions are covered by the standard known_before_new check; the five mechanisms and the app-review gap by AC-1; the Forked Platform and its hosted mirror by AC-2; the ladder by AC-3; the tables, take-away tiers, questions, ledger agreement and word count are contents, not reader outcomes, and are dropped (the ledger agreement stays a rule of the pass; the word cap becomes length.max_words 6500). No criteria were added beyond the journal spec's AC-1 to AC-5. Rejected: Keeping the success criteria as custom rubric criteria (they list contents).\n- **2026-11-12** — Units the contract asks for and the published chapter lacked are added: a roadmap p05 announcing every section (the old introduction had none beyond the callout), and a conclusion paragraph p49 with synthesis and callback (the published conclusion was lists and a hand-off). p03 gains one sentence that does the chapter's transition_in (chapter 30's finding that the stock-writing apps were among the heaviest users of the API budget, with nobody ranking them). Rejected: Leaving the roadmap to the IN THIS CHAPTER callout alone (it names four of nine sections).\n- **2026-11-12** — Ledger alignment in the prose: Milan Petrov is named by his ledger role (ecommerce and marketplaces manager, owner of the storefronts and apps) instead of 'storefront manager'; the warehouse feed reaches the platform through the iPaaS and the ERP's hourly sync (ruling 22, one writer); the pre-order app waits for 'pre-order allocations' (inventory-and-availability ledger line). No figure changed. Rejected: Leaving 'storefront manager' (not his ledger rol transitions; glosses for scope (p12), ERP (p08), feature toggles (p40), the governance card and quarterly review (stage table), the Pulled Rug (p38); the interaction table's stock row follows ruling 22; open questions auto-resolved.\n- **2026-11-12** — After draft-check round 1: p08, p22, p40 (list), p44, p45, p47 and p53 revised in spec and prose; minor glosses (theme app extensions, the Plus plan, suites).\n- **2026-11-12** — Converted spec.md to spec.json, reconstructed from the published chapter; added a roadmap (p05), a carry-over sentence from chapter 30 in p03 and a synthesis paragraph with callback (p49); ledger alignments (Milan's role, the feed's path, pre-order allocations); flow rubric notes taken in p16, p47 and p49.\n- **2026-11-07** — Visual layer: redrew 2 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator). (from spec.md)\n- **2026-11-07** — Editorial review pass: the third stock-writing app no longer described as the main WMS feed, Adobe lifecycle wording corrected against the policy page, acronyms expanded (WMS, ERP, PIM, OMS, SEO, PCI, SFRA, 3PL), timetoread. (from spec.md)\n- **2026-11-07** — Initial spec and article. (from spec.md)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
