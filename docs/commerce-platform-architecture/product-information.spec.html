<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/06-product-information/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter. It is a contract, not a description: the places where the chapter does not yet do what the spec asks are listed under open_questions.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The four things that share the name 'product' (product, variant, SKU, GTIN) and which of them may change.\n- **Know:** Which system is the record for each kind of product data: identity and cost, logistic attributes, content, channel mappings, storefront presentation, listings.\n- **Know:** The four ways merchants arrange product data and the test for when a product information system (PIM) is needed.\n- **Believe:** The design question is which system may change which field and how the others learn of it, not which tool to buy.\n- **Believe:** A channel's rejection of a product is a message to route to the field's owner, not an exception.\n- **Be able to:** Write an attribute-level ownership table for one product at their own company.\n- **Be able to:** Say whether a merchant needs a PIM by counting the teams that produce product data and the channels that consume it.\n\n**Audience:** Readers new to commerce architecture: engineers, product managers, analysts and consultants who have just joined a merchant, a vendor or an agency. Most of all the product manager or engineer handed 'the catalog' or 'the marketplace listings' as a responsibility, who needs the ownership table and the questions to ask before touching a tool. The leader approving a PIM purchase gets the trade-off table and the scale-stage test.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- From Part I: the thirteen steps of an order, promise and handoff, what a system is, 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, Kestrel & Pine's systems, people and ten incidents in outline, the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, Waypoint decisions W1 to W8 and the sixteen failure-pattern names.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub, availability service, D2C, B2B, PIM, POS.\n- From the Part II introduction: that the facts on one product page (content, price, discount, availability) change at different speeds and have different owners.\n\n**Does not yet know:**\n\n- The product model: product, variant, option and option value, SKU against GTIN, EAN-13 and GTIN-14, GS1.\n- Attribute, attribute set, taxonomy, channel mapping, bundle, configurable product, digital good, lifecycle states.\n- Enrichment, syndication, feed, structured data, schema.org, staged and published data.\n- The four arrangements of product data and the producer-and-consumer test for a PIM.\n- Master data management (MDM), product lifecycle management (PLM), CE marking.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a short description of a merchant, the reader decides whether it needs a PIM by counting producers and consumers of product data, not by revenue or by what larger brands use. *Probe:* A merchant has one storefront in one language, and one team edits products in the shop platform. A vendor offers it a product information system. Using only this chapter: should it buy, and what is the test? | `custom` | cold_reader | major |\n| AC-2 | Given a product value that is right in one channel and wrong in another, the reader asks which system owns that attribute and in which direction it flows, before asking for a faster copy. *Probe:* The product team corrects a jacket's waterproof rating in the web shop; a marketplace listing still shows the old value. Using only this chapter: what is missing, and where should the correction have been made? | `custom` | cold_reader | major |\n| AC-3 | The reader can state the rule for a mistyped or reusable identifier and the reason for it. *Probe:* A SKU was typed wrong on a variant that already has orders. Using only this chapter: what should happen to it, and why? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-6 | A reader new to commerce meets no term in this chapter before it is explained, and every acronym is expanded on first use. | `known_before_new` | rubric | minor |\n\n## Thesis\n\n**Question:** How should product data be modeled and owned so that every channel shows the same, correct product?\n\n> **Claim:** Model a product as a product, its variants and two permanent identifiers per variant (the SKU and the GTIN), which are never edited once issued and never reused (a wrong one is retired and replaced); give each attribute exactly one owning system, from which the value flows in one direction to every channel; and route each channel's rejection back to the owner of the attribute that caused it. A product information system becomes necessary only when product data has more than one producing team and more than one consuming channel.\n\n**Disputed by:** The view that product data is one record that belongs in one tool, so that channels showing different things is cured by choosing the right tool: the shop platform, the ERP or a product information system.\n\n**So what:** A merchant writes the attribute ownership table before it sees a vendor demo, because a product information system bought without one becomes one more copy of the product data to keep in step; and it retires a wrong SKU instead of editing it, so that old orders keep their link.\n\n**How and why:** Different teams produce different attributes (purchasing the identity and cost, the product team the content, the marketplace team the channel mappings), so ownership per product leaves several teams editing the same record in different systems. Orders, warehouses and marketplaces are keyed on the SKU and the GTIN, so a changed or reused identifier joins two items or loses an order's link. Each channel validates what it receives against its own rules and answers later, so a product can be declined after it was sent and nobody is told unless the answer has a route back. With one producing team or one consuming channel the shop platform's product record can hold the work; several of both need a workflow between them that the record cannot hold, which is the job of a product information system.\n\n**Supporting claims**\n\n- **S1** — A 'product' is a product, its variants and two identifiers per variant, the SKU and the GTIN; the content around them may change, and the identifiers are assigned once, never edited and never reused, because orders, warehouses and marketplaces are keyed on them.\n- **S2** — Product data has many producers and many consumers, so each attribute needs exactly one owning system, from which its value flows in one direction; without one, every consumer makes its own copy.\n- **S3** — Each channel validates product data against its own rules and answers later, so publishing to channels needs a record of what was sent and a route that brings each rejection back to the attribute's owner.\n- **S4** — A product information system becomes necessary only when product data has more than one producing team and more than one consuming channel; below that the shop platform or a disciplined spreadsheet is the right catalog.\n- **S5** — Product data fails without an error, so every identifier and every copy needs a scheduled check against its system of record.\n\n## Role in the part\n\nSupplies the product model and the identifiers that prices, discounts, the search index and stock figures are all keyed on, and applies the record-and-copy rule at the level of one attribute. Supports P2-1, P2-6 of part `part-2`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to pim: a launch with no owner for product content, then the model, the ownership rule and the system that carries it out; `comparison` in choices, trade-offs and stages: four arrangements, their conditions, and the stage at which each fits)\n\nThe scene comes first because it shows the cost of copies with no owner before any term is defined. The product model follows because ownership is decided per piece, and the pieces (identifiers, attributes, mappings, translations) need names first. Ownership precedes the PIM because the PIM is only the system that the ownership table names for one row; described first, it would be a tool with no job. The flow requirements stand inside the PIM section, after enrichment and syndication are defined; one section earlier they used both words undefined. The choices, trade-offs and stages come after the PIM section because three of the four arrangements are defined by what they lack compared with it, and the test for a PIM needs all four on the table. The public documentation and Kestrel & Pine's W3 follow the recommendation because W3 is the recommendation carried out; before it, W3 would be a sequence of steps with no reason for their order. Trade-offs precede the stages because the stage table applies the test for a PIM that the trade-offs section states. The public documentation stands with W3, after the judgement, as the evidence and the application of it. The failures come last because they are what remains to detect once an owner exists, and the pulled rug needs the channels' documented, changing rules before it. If the definitions came before the scene, the reader would not yet have the case that shows why they matter.\n\n## Introduction\n\n**Hook** (`intriguing_example`): The Ridgewalker women's jacket comes in six sizes and four colors: twenty-four variants, each with an internal code and a barcode, whose descriptions must reach several channels in three languages. A corrected waterproof rating reaches only the web shop, and marketplace buyers still get the old one.\n\n**Bridge:** Anyone has seen the same product described differently on a brand's own shop and on a marketplace. → Product data starts in whichever system first needed it, so there are several copies and no rule for which one a correction goes into; the question becomes which system may change which field.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and paragraph p02 ('Give each field an owner and let the channels consume its value'); the PIM test is announced in the IN THIS CHAPTER callout and the Giant's Boots bullet): Separate the product from its variants and its permanent identifiers, give each field one owner whose value the channels consume, and bring each channel's rejection back to that owner; a PIM is needed only when several teams write product data and several channels read it.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start with one season launch at Kestrel & Pine in which four teams typed the same color four times. *Kept in:* scene.\n- Say what a product is made of and who should own each field. *Kept in:* product-model, ownership.\n- Show how the pieces fit together when a PIM is one of them. *Kept in:* pim.\n- Compare four ways to arrange product data, with their trade-offs and the scale stage at which each fits. *Kept in:* choices, trade-offs, stages.\n- End with what platforms and channels document, what Kestrel & Pine decides, and how product data fails. *Kept in:* in-practice, when-it-goes-wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | One jacket in six sizes and four colors is twenty-four variants whose codes, descriptions, images and attributes must reach several channels in three languages, and a corrected waterproof rating that reaches only the web shop leaves marketplace buyers with wrong information about the same jacket. | scenario: The Ridgewalker women's jacket: 6 sizes x 4 colors = 24 variants; a corrected waterproof rating that reaches only the web shop. |  |\n| p02 | claim | Product data starts in whichever system first needed it, and the copies agree only until someone changes one; giving each field one owner whose value the channels consume stops every correction from becoming another round of manual entry. |  | `cause_effect`: The correction that reached one channel and not the other. → Why that happens (copies that began in different systems, with no owner) and the chapter's claim: one owner per field. |\n| p03 | context | Before Eva can find the jacket, the Ridgewalker women's M in moss needs its content and two identifiers, a SKU and a GTIN; of the facts on a product page the content changes most slowly, and the identifiers are the keys under which price, discount and stock are stored. |  | `place`: The jacket of the opening and its record. → Where that record sits in the order's journey and in Part II: the slowest-changing fact on the product page, and the identifiers every other catalog fact is keyed on. |\n| p04 | transition | The chapter goes from one season launch at Kestrel & Pine to what a product is made of, who should own each field and how the pieces fit with a PIM, then compares four arrangements by trade-off and scale stage, and ends with the public documentation, Kestrel & Pine's decision and the ways product data fails. |  | `sequence`: The product record the order's journey depends on. → The order in which the chapter takes its subject. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: The Season That Was Typed Four Times\n\n**Controlling idea** (`example`, id `scene`): At one season launch, four teams typed the same product into four systems, because product content had no owner.\n\n**Advances the thesis** (S2, S3): Shows the cost of copies with no owner (a color in three spellings, 310 untranslated variants, 140 declined listings) before any concept or tool is named.\n\n**Transition in:** `example`: The claim that product data begins in several places and drifts. → Kestrel & Pine's copies in January 2027 and one variant followed through a launch.\n\n**Order of paragraphs** (`problem_solution`): The state of the copies, one variant followed through them, what the steps share, then the decision that answers it. The decision placed first would be a tool with no reason.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description | In January 2027 Kestrel & Pine's product data for 3,400 products in 26,000 variants lives in the shop platform, the ERP and spreadsheets, with a fourth copy in the marketplace connector, and there is no PIM, the shared place where content would be prepared for all channels. | fact: 3,400 products, 26,000 variants, about 17,000 active, 1,200 new per season; three places plus the connector's copy; no PIM. |  |\n| p06 | example (list) | Followed through the Spring/Summer 2027 launch, one new Ridgewalker variant passed through five steps, each in a different system or spreadsheet, and something was lost or changed at each one. | scenario: Purchasing (ERP, color MOSS GRN, landed cost EUR 58), the product team (season sheet, Moss), the agency (two-day import; the 20,000 mm rating never became a field), a translator (about 310 variants in Dutch on the German storefront for three weeks), the marketplace team (about 140 variants declined by bol; color olive). | `example`: The copies and the missing PIM. → What the copies cost in one launch, step by step (illustrative details). |\n| p07 | analysis | Four teams typed one color four times in three forms and a marketplace declined a tenth of the season, because without an owner for product content every channel created its own version. | figure: Figure 1: one green jacket typed into four systems as MOSS GRN, Moss, Moss and olive. | `conclusion_summary`: The five steps of the launch. → What they have in common: no owner for product content. |\n| p07a | claim | Waypoint decision W3 answers this by introducing a PIM in Q3 2027 as the owner of content and attributes, while the ERP keeps costs and purchasing and the shop platform and the marketplace connector consume published content. | fact: W3: a PIM in Q3 2027 as system of record for content and attributes; the ERP keeps costs and purchasing. | `problem_solution`: Product content without an owner. → The decision that gives it one, W3. |\n\n### What a Product Is: Four Things That Share a Name\n\n**Controlling idea** (`definition`, id `product-model`): A product is a product, its variants and two permanent identifiers per variant, surrounded by attributes, categories, translations and lifecycle states that change.\n\n**Advances the thesis** (S1): Separates what may change (content, attributes, categories, translations, states) from what may not (the SKU and the GTIN), which is the first third of the thesis.\n\n**Transition in:** `elaboration`: The launch in which product content had no owner. → What the thing to be owned is made of: four concepts under one name.\n\n**Order of paragraphs** (`large_to_small`): The four concepts and their permanence first, because every later paragraph and section keys on them; then the identifiers and their rule, the other shapes in which the rule holds, and how many variants a platform allows; then the fields, categories, translations and states that hang on a product. Attributes before taxonomies because a channel's category decides which attributes are mandatory. The variant limits follow the identifier rule (moved in round 2) so that the definitions of variant, SKU and GTIN are not interrupted.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition | Before asking who should own product data, a newcomer needs to know that a 'product' is a stack of four concepts (product, variant, SKU, GTIN), each identified differently and each stable to a different degree. | table: Four rows (product, variant, SKU, GTIN) with what each is, who assigns it and whether it may change. |  |\n| p09 | evidence | A variant is one point in the grid that the options define, and the platforms' documentation and the schema.org vocabulary both split product from variant in this way. | quotation: Shopify: the product is 'the container for all product information'; 'each variant represents a specific combination of option values'.; quotation: schema.org v30.1: a ProductGroup differs 'only along defined dimensions, such as size or color', variants linked by isVariantOf. | `elaboration`: The product and variant rows of the table. → Option and option value, and two public sources that make the same split. |\n| p10 | definition | The SKU is the merchant's private code and the GTIN the global identifier issued through GS1, in a 13-digit form on European retail barcodes and a 14-digit form for trade units, with a separate GTIN for every distinct item and packaging configuration. | quotation: GS1: a GTIN is 'unique, global and verifiable within the GS1 system'; 'only a GS1 Member Organisation can provide you with a GS1 GTIN'.; fact: Kestrel & Pine has carried a GTIN on every own-brand SKU since 2021. | `contrast`: Product and variant, which the merchant names freely. → The two identifiers, which are where newcomers make costly mistakes. |\n| p11 | recommendation | A SKU and a GTIN are promises to every other system, so they are assigned once, before the first sale, and a mistake is retired, never corrected in place. | quotation: commercetools: 'treat the sku values as immutable identifiers'.; reasoning: A reused SKU is a stock count that belongs to two items; a reused GTIN is a marketplace listing that shows the wrong product.; figure: Figure 2: one product as a grid of variants, each with two permanent identifiers, plus attributes, media and categories that change. | `cause_effect`: What the two identifiers are and who issues them. → The rule that follows: assign once, never edit, never reuse. |\n| p14 | explanation (list) | Other product shapes (a bundle, a digital good, a gift card) and other platforms' names for the grid (a configurable product) keep the same rule: every item that can be sold keeps its own identity. | source: Adobe Commerce's October 2026 documentation distinguishes the configurable parent from simple products with their own SKUs. | `additional_support`: The rule that identifiers are assigned once and never reused. → Four other shapes of product in which the rule still holds. |\n| p09a | evidence | Do not split a product to fit a platform's cap on variants, because a split damages search, feeds and analytics for years after the cap is lifted; the caps are recent and moving (Shopify from 100 to 2,048, commercetools 100 or 10,000 by catalog model). | fact: Shopify: 100 variants historically, 2,048 for all merchants from 15 October 2025. commercetools: Classic 100; Modular Catalog, generally available 29 September 2026, up to 10,000. | `elaboration`: The grid of variants under one product. → How many variants a platform lets one product hold, and the lasting cost of splitting a product to fit. |\n| p12 | definition | An attribute is a typed field and an attribute set is the list of fields a kind of product must carry; a storefront filter, a search facet or a marketplace listing can use only an attribute that is filled consistently for every product of that kind. | example: Kestrel & Pine's waterproof rating, held only in a spreadsheet, is invisible to the filter, the search and the listing. | `contrast`: The variant grid and its identifiers, which should neither change nor be split. → The fields around it, which do change: attributes and attribute sets. |\n| p13 | definition | Every channel has its own taxonomy, so the merchant needs an internal taxonomy and a mapping per channel, and the mapping is data with an owner, not code. | fact: Google's product taxonomy: version 2021-09-21, 5,595 categories. bol: more than 4,000 classifications ('chunks'), each with mandatory attributes. | `additional_support`: Attributes and attribute sets inside the merchant. → The category trees outside it, one per channel, and the mapping between them. |\n| p15 | explanation | Translation is per product, per language and often per channel, so every description exists several times by design and each translation has its own completeness status. | quotation: Shopify: 'each published language gets its own URLs, and your store displays the translated version when translations exist'.; fact: Kestrel & Pine sells in three countries and two languages in Belgium alone. | `additional_support`: Attributes and categories, which differ per channel. → Content that also differs per language: translations. |\n| p16 | explanation | A product has a lifecycle whose states are set per channel, and a product that has been sold is discontinued and never deleted, because orders, returns, invoices and analytics reference it for years. | quotation: commercetools separates staged from published data and 'you can only delete unpublished products'.; reasoning: A variant can be end-of-season on the storefront and still listed on a marketplace clearing the last units. | `additional_support`: Translations with their own status. → The product's own status over time: its lifecycle. |\n\n### Who Owns Which Field: Producers, Consumers and the System of Record\n\n**Controlling idea** (`claim`, id `ownership`): Because different teams produce different attributes, the system of record for product data is decided per attribute, not per product.\n\n**Advances the thesis** (S2): States the central rule of the thesis, one owning system per attribute, and gives the table a reader can copy.\n\n**Transition in:** `cause_effect`: The pieces a product is made of: identifiers, attributes, mappings, translations. → Who writes and who reads each piece, and so which system should own it.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The fact (many producers and consumers), the rule with its table, the two rows the table hands on, then the running example read against it. The table before the producers would be a list of owners with no reason for there being several.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | claim | Product data has many producers (purchasing, the product team, translators, suppliers, the marketplace team) and many consumers (storefronts, search, marketplaces and feeds, the warehouse, the wholesale portal, the data warehouse and, from 2027, AI agents). |  |  |\n| p18 | claim | The system of record for product data must be decided per attribute, not per product, because the attributes have different natural owners. | table: Eight rows of data (item identity, logistic attributes, product content, channel mappings, storefront presentation, listings, price, stock), each with its system of record, producers, readers and the reason. | `cause_effect`: Many producers and many consumers. → The rule that follows from them, and the ownership table. |\n| p19 | explanation | Price and stock are left out of this chapter's ownership because they need different freshness, so product content, prices and stock travel on separate paths even when they end in the same feed. |  | `elaboration`: The table's last two rows. → Why price and stock are owned elsewhere: a day-old description is harmless, a day-old price or an hour-old stock figure is not. |\n| p20 | example | Read against the table, Kestrel & Pine in January 2027 has four producers of product content and no system of record for it, which is the Spaghetti Junction. | case: The shop platform, the spreadsheets, the ERP and the connector each hold product content for their own reason. | `example`: The ownership table. → Kestrel & Pine's own state read against the 'product content' row. |\n\n### How the Pieces Fit Together With a PIM\n\n**Controlling idea** (`explanation`, id `pim`): With a PIM as the owner of content, three rules about ownership make the arrangement work: one direction per attribute, whole products published on a schedule, and every channel's answer returned to the owner.\n\n**Advances the thesis** (S2, S3): Turns the ownership table into flows: where each value is written, how it reaches the channels and how a channel's refusal comes back.\n\n**Transition in:** `problem_solution`: Kestrel & Pine's product content with four producers and no system of record. → The system the table names for that row, a PIM, and the rules that make it an owner.\n\n**Order of paragraphs** (`prerequisite_order`): The terms and the vendors' agreement on them first, with the picture, then what each flow in the picture requires, then the rules that meet the requirements. The flow table before the definitions would use 'enrichment' and 'syndication' undefined.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | definition | A PIM, the system the ownership table names for product content, is the editorial system where product data is created, enriched, translated and approved before it is published; enrichment, syndication, feed and structured data are the four terms its work is described in. | reasoning: Each term is defined in one sentence in the paragraph. |  |\n| p23 | evidence | The vendors agree on what a PIM is, a central place that collects, enriches and distributes product information, and none gives a testable threshold for when it pays off. | quotation: Akeneo: 'a system or solution that helps businesses manage, centralize, and distribute product information'; Pimcore: an 'open core platform for Product Experience Management'.; figure: Figure 3: the ERP creates the item and keeps its cost, the PIM owns what a shopper reads, every channel consumes, and rejections flow back to the owner. | `additional_support`: The chapter's own definition of a PIM. → Two vendors' definitions, what they leave unanswered, and the arrangement in one picture. |\n| p24 | comparison | The four flows of product data (the new season into the ERP, enrichment into the PIM, publication to the storefront and search, syndication to marketplaces and feeds) differ in how fresh, how consistent, how fast and how available they must be. | table: Four flows by freshness, consistency, speed and availability need. | `elaboration`: The arrows in Figure 3. → The four flows they stand for and what each requires. |\n| p25 | analysis | Two requirements stand out: content tolerates lag but demands completeness, and syndication is asynchronous, so the architecture must expect a 'no' to arrive after the 'sent'. | fact: bol's documentation says an upload report may take an hour; Google disapproves a product with an incorrect GTIN. | `conclusion_summary`: The flow table. → The two requirements in it that shape the design. |\n| p26 | transition | Three design rules meet these requirements, and they are rules about ownership, not about the tool. |  | `cause_effect`: The two requirements and the picture in Figure 3. → Three rules that meet them. |\n| p27 | recommendation | Rule 1: each attribute flows in one direction, from the one system that may change it, and a connector's direction setting carries out that decision but cannot make it. | quotation: Microsoft, Business Central Shopify connector: 'decide which system is the system of record for product data'; 'If you manage item names, descriptions, and pricing in Business Central, choose the To Shopify direction. If your merchandising team maintains product content in Shopify ... choose From Shopify'. | `sequence`: The announcement of three rules. → The first: one direction per attribute. |\n| p28 | recommendation | Rule 2: publish whole products on a schedule, not single fields on change, because content changes constantly during a season build and nobody wants half-enriched products on the storefront; a whole-product publication also keeps the visible page, the structured data and the feeds saying the same thing. | fact: Waypoint's integration standard (W5): products move 'by scheduled publication' while stock, orders and prices move by events.; source: commercetools' staged and current data; Shopify's productSet mutation for when 'an external system is the source of truth'.; figure: Figure 4: loose fields dripping onto a shelf one by one against complete product boxes arriving together on a date. | `sequence`: Rule 1. → The second rule: whole products, on a schedule. |\n| p29 | recommendation | Rule 3: every channel's answer comes back to the owner, through an outbox per channel, a validation step before sending and a rejection report that becomes a task for a person. | case: Without the loop, bol's 140 declined variants are a line in a report nobody reads. | `sequence`: Rule 2. → The third rule: the channel's answer returns to the owner. |\n\n### The Choices\n\n**Controlling idea** (`comparison`, id `choices`): There are four realistic ways to arrange product data, and each is right for some merchant.\n\n**Advances the thesis** (S4): Places the PIM as one of four arrangements, so that the test for needing one has alternatives to choose between.\n\n**Transition in:** `contrast`: The arrangement with a PIM. → The three arrangements without one, and the PIM as the fourth.\n\n**Order of paragraphs** (`small_to_large`): From the arrangement every merchant starts with to the one that needs the most organization; the order is also the order in which Kestrel & Pine met them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | transition | The arrangement with a PIM just described is one of four realistic ways to arrange product data; the other three do without one. |  |  |\n| p31 | description | In the first way the shop platform is the catalog: every merchant's starting point, and right for one channel and one language. |  | `sequence`: The four ways announced. → The first way. |\n| p32 | description | Second, the ERP is the product master: it works for identity and cost and fails for content, which ends up in spreadsheets beside it. | case: Kestrel & Pine's content in spreadsheets beside the ERP. | `sequence`: The shop platform as catalog. → The second way. |\n| p33 | description | Third, spreadsheets with discipline: cheap and flexible, and limited by the number of hands, not by size. |  | `sequence`: The ERP as master. → The third way. |\n| p34 | description | Fourth, a PIM as the system of record for content, with the ERP keeping identity and cost: Waypoint's W3, whose conditions the trade-offs section states. |  | `sequence`: Spreadsheets. → The fourth way. |\n| p35 | context | A fifth option, master data management across products, customers, suppliers and locations, belongs to the Group stage and to another chapter. |  | `contrast`: The four ways compared here. → One left out, and where it is covered. |\n\n### Trade-offs\n\n**Controlling idea** (`recommendation`, id `trade-offs`): A PIM becomes necessary when product data has more than one producer and more than one consumer; below that line it is the Giant's Boots.\n\n**Advances the thesis** (S4): States the test for a PIM, the last sentence of the thesis, with its conditions and the two assumptions under it.\n\n**Transition in:** `elaboration`: The four arrangements, the fourth 'right under conditions'. → The conditions, in a table, and the author's recommendation.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35b | comparison | The fourth way is right only under conditions; set side by side, the four arrangements differ most on workflow, translations and channel validation, which is what several producers and several consumers need. | table: The four arrangements by when each is right, cost, workflow, translations, channel validation and the warning sign of outgrowing it. |  |\n| p36 | recommendation | The author's recommendation: a PIM becomes necessary when product data has more than one producer and more than one consumer and the shop platform's product record can no longer hold the workflow between them; below that line it is the Giant's Boots, above it the drift costs more than the subscription. | case: Kestrel & Pine crossed the line around 2021-2022, with marketplaces (2021) and a third country (2022). | `conclusion_summary`: The table of the four arrangements and where they differ. → The author's recommendation and its test. |\n| p37 | explanation | Two assumptions sit under the recommendation: the ERP keeps item identity and cost, and the merchant can name one owner for product content with authority over every team that writes it; without that owner the PIM becomes a fifth copy. | case: At Kestrel & Pine the owner is Teun Baas, who owns the catalog and the seasons. | `elaboration`: The recommendation. → The two assumptions it rests on. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): Identifier discipline is the same at every stage; the arrangement of content ownership changes once, between Growing and Omnichannel.\n\n**Advances the thesis** (S1, S4): Sets the test for a PIM and the identifier rule against the four scale stages, so a reader can place a merchant.\n\n**Transition in:** `time`: The recommendation and its conditions. → How what is typical, what is necessary and the warning signs change as a merchant grows.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | comparison | Which arrangement fits changes as a merchant grows, and at each of the book's four stages a different arrangement is typical, something different becomes necessary, and different signs show the merchant has outgrown it. | table: Four stages (Starting, Growing, Omnichannel, Group) by what is typical, what becomes necessary and the warning signs. |  |\n| p39 | analysis | The author's judgement: identifier discipline does not change with scale and everything else does; the ownership rule changes once, at the Growing-to-Omnichannel boundary, when content gets its own system. |  | `conclusion_summary`: The stage table. → What stays the same across its rows and what changes. |\n\n### In Practice\n\n**Controlling idea** (`evidence`, id `in-practice`): Public documentation confirms that channels validate and reject on their own schedule, and Kestrel & Pine's W3 applies the chapter's rules in a fixed order: ownership, direction, loop, migration.\n\n**Advances the thesis** (S3, S2): Supplies the dated public evidence for channel validation, and shows the ownership table, the direction rule and the rejection loop carried out for one company.\n\n**Transition in:** `additional_support`: Rule 3's expectation that a channel's 'no' arrives after the 'sent'. → What channels document about the rules that produce the 'no', and what one company does.\n\n**Order of paragraphs** (`grouping`): The public documentation first, then the company: the reader sees that the constraints are real before seeing one merchant work within them. Inside W3 the order is the order of the work: the table, the direction, the loop, then the migration.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | claim | Public documentation shows how many rules can produce the 'no' that Rule 3 expects: channels validate and reject, so a record that looks complete in the merchant's shop can still be rejected by a channel that checks its own required fields, identifiers and media rules. |  |  |\n| p43 | evidence | Google and bol each publish required fields and refusal rules, and each rule changes on the channel's schedule, which is the Pulled Rug seen from the catalog side. | fact: Google Merchant Center: required id, title, description, link, image_link, price, availability; an incorrect GTIN is disapproved; a 500 x 500 pixel image minimum from 31 January 2027. bol: an EAN for every product, two mandatory enrichment levels, products offline without a required CE marking, a data model updated 'daily'. | `example`: The claim that channels validate and reject. → Two channels' documented rules. |\n| p44 | transition | Kestrel & Pine's W3, the decision from the opening scene, is a bought PIM, and the chapter reads it as a sequence of four steps with illustrative dates. |  | `contrast`: What vendors and channels document. → What Kestrel & Pine does about it under W3. |\n| p45 | example | Ownership first: in April 2027, before any vendor demo, Noor, Teun and Milan wrote the attribute-level ownership table for the Ridgewalker on one page. | scenario: ERP: SKU, GTIN, supplier, landed cost (EUR 58), purchasing unit, weight, dimensions. PIM: names, descriptions in Dutch, French and German, the jacket attribute set, media, internal category, mappings to four channel taxonomies, color as a controlled list. Shop platform: collections and landing pages only. Connector: nothing; it derives listings. | `sequence`: The announced sequence. → Its first step, the ownership table. |\n| p46 | example | One direction per field: the ERP creates items and the PIM imports them, the PIM publishes whole products to the shop platform on a schedule, and the shop platform's editor is read-only for the fields it does not own. | scenario: Nightly import from the ERP; scheduled publication with a launch date per season; the agency's season-sheet import retired. | `sequence`: The ownership table. → The second step: the direction each field flows in. |\n| p47 | example | Syndication with a loop: each channel's rejections return to the PIM as tasks on the product, and a completeness score per channel is visible before launch. | scenario: A repeat of bol's 140 declines becomes a list to clear before launch, not a surprise in the next day's upload report. | `sequence`: Direction per field. → The third step: the route back from the channels. |\n| p48 | example | Migration consumer by consumer: the PIM is loaded in July 2027 from the four copies, about 1,900 variants with conflicting attributes are resolved before anything is published, the consumers move one at a time, and the PIM is the first prerequisite of W8. | scenario: Load in July 2027; about 1,900 conflicting variants; DE storefront in August; NL and BE storefronts and the connector in September; spreadsheets read-only; Spring/Summer 2028 the first season built in the PIM. | `sequence`: The rules in place. → The fourth step: how the copies are replaced. |\n| p49 | analysis | The results that matter are small: the season import becomes a scheduled publication, the German storefront launches with no untranslated variants, and one spelling of moss reaches four channels. | scenario: Two agency days become a scheduled publication; the completeness score blocks an untranslated product. | `cause_effect`: The four steps. → What they change, measured against the scene. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`cause_effect`, id `when-it-goes-wrong`): Product data fails without an error, in five ways that have to be detected on purpose, and each is found by comparing a copy or an identifier with its system of record.\n\n**Advances the thesis** (S5, S1, S3): Shows what the identifier rule and the rejection loop protect against, and adds the scheduled comparison that the rules alone do not provide.\n\n**Transition in:** `contrast`: W3 carried out and its results. → What still fails with an owner in place, and how to detect it.\n\n**Order of paragraphs** (`grouping`): Five parallel failures, each with detection and recovery, from the one the scene showed (rejection) to the one a channel causes (the pulled rug), then what they share.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | claim | Even with an owner in place, product data fails quietly, so its failures have to be detected on purpose. |  |  |\n| p51 | example | Silent rejection: a channel declines a product in a report nobody reads; it is detected by a listing status per variant per channel reconciled against the channel, and recovered by making the rejection a task for the owner. | reasoning: Detection: status per variant per channel and a daily count of variants that should be live and are not. Recovery: a task on the owner's queue. | `example`: Failures to detect on purpose. → The first failure. |\n| p52 | example | Identifier drift: a reused SKU, a wrong GTIN or a recreated variant joins two items or loses an order's link; it is detected by a weekly cross-reference check and recovered by retiring the identifier and mapping the old one for history, never by editing in place. | reasoning: The warehouse counts two items as one; a marketplace shows the wrong product; orders lose their link. | `additional_support`: Silent rejection. → The second failure. |\n| p53 | example | The split product: variants modeled as separate products show the jacket several times in search, feeds and analytics; it is detected by products that share a name and brand but not a group id and recovered by a merge that keeps old URLs and ids mapped. | reasoning: Search shows the jacket four times, item_group_id is wrong in feeds, analytics count four products. | `additional_support`: Identifier drift. → The third failure. |\n| p54 | example | Stale translation: one language is republished while another still carries the old claim; it is detected by completeness per locale as a blocking state and recovered by publishing the whole product again in all locales. | reasoning: A fixed Dutch description beside an unchanged German one. | `additional_support`: The split product. → The fourth failure. |\n| p55 | example | The pulled rug: a marketplace changes its data model or retires an API version on a published date; it is detected by a named owner who reads the channel's notices and by a weekly listing status check, and recovered through the mapping, which is data. | case: Kestrel & Pine's Deprecated Endpoint of February 2027, in one sentence: an agency script called a retired API version and bol's figures were stale for two days. | `additional_support`: Stale translation. → The fifth failure. |\n| p56 | synthesis | The five failures share one remedy: a copy is acceptable only with a reconciliation that compares it with its system of record on a schedule and lists the differences for a person. |  | `conclusion_summary`: The five failures. → What their detections have in common: a scheduled comparison of copy against record. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The product model, the ownership table and the rejection loop are three parts of one design: the identifiers say which item a value belongs to, the owning system says where the value may be changed, and the route back from each channel says whether the channel accepted it. The choice of tool comes after these three, and a PIM is one place to keep the second and third.\n\n**So what:** A merchant that has the three in writing can decide on a PIM by counting producing teams and consuming channels, and can refuse one bought because larger brands have one; a merchant without them gets one more copy whatever it buys.\n\n**Callback:** The corrected waterproof rating that reached the web shop and not the marketplace. The reader can now say what was missing: no system owned the rating, so the correction was made in a system that only shows it, and nothing carried it on or reported that the marketplace still had the old value.\n\n**Takeaway** (`course_of_action`): Write the attribute ownership table before choosing a tool, treat SKUs and GTINs as permanent, route each channel's rejection to the owner, and take the eight questions to the people who run the catalog.\n\n**Hand-off** to [What Does It Cost? Price Lists, Contract Prices, Currencies and Tax](pricing-architecture.html): `contrast`: The product described once and owned per attribute, with price and stock left out of the ownership table. → A product-related fact that changes on a different cadence, carries legal weight in Europe and is copied into more systems than any other: the price.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p57 | synthesis | The corrected waterproof rating of the opening reached one channel because no system owned it; three things would have carried it to every channel (identifiers that say which jacket, one owning system per attribute, a route back from each channel), and a PIM is needed for the second and third only when several teams write product data and several channels read it. | reasoning: The opening's correction set against the chapter's three rules. |  |\n| p58 | synthesis (list) | Established: a product is a product, its variants and permanent identifiers; channels validate against their own rules and reject asynchronously; products with sales history are never deleted. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, sorted by how settled they are, starting with what the documentation establishes. |\n| p59 | synthesis (list) | Depends on context: when the shop platform stops being the right catalog, whether the ERP also owns logistic attributes, where channel mappings live, and whether a variant limit matters. |  | `contrast`: What the documentation settles. → What changes with the merchant's situation. |\n| p60 | recommendation (list) | The author's synthesis: decide the ownership table before choosing a PIM, and treat syndication as an integration with an outbox, a validation step and a rejection loop, not as a feed. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p61 | recommendation (list) | Eight questions let the reader apply the chapter to their own company's copies, editors, identifiers, attributes, rejections, launches, channel rules and readiness for agents. |  | `cause_effect`: The take-aways. → Questions that apply them. |\n| p62 | transition | The ownership table left out price and stock; the price comes next, a product-related fact that changes at a different cadence, carries legal weight in Europe and is copied into more systems than any other, taken up in the next chapter with the Price Drift. |  | `contrast`: The product described once and owned per attribute, with price and stock left out of the ownership table. → A product-related fact that changes on a different cadence, carries legal weight in Europe and is copied into more systems than any other: the price. |\n\n## Non-goals\n\n- Prices, price lists and tax-inclusive display. See [What Does It Cost? Price Lists, Contract Prices, Currencies and Tax](pricing-architecture.html).\n- Stock, available-to-promise and the oversell. See [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html).\n- The search index, facets and relevance built on attributes. See [Finding the Product: Search, Navigation and Merchandising](commerce-search-and-discovery.html).\n- Marketplace listing operations, order import and channel allocation. See [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html).\n- Master data management across customers, suppliers and locations, and the cross-reference table as a product. See [One Customer, One Product: Identity and Master Data Across Systems](identity-and-master-data.html).\n- The ERP's role as a hub and the ERP partner's connector. See [The Back Office: ERP Integration and Who Is the Hub](erp-and-back-office-integration.html).\n- Promotions, bundle discount allocation and gift-card liabilities. See [Discounts, Coupons and Loyalty: Promotions Without Chaos](commerce-promotions.html), [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html).\n- Migration mechanics for the PIM introduction. See [Moving Without Burning the Bridge: Replatforming and Migration](replatforming-and-migration.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The chapter assigns logistic attributes (weight, dimensions, customs code) to the ERP; warehouse-and-fulfillment may prefer the WMS to measure and own them at first receipt. Reconcile when that chapter is revised.\n- The PIM go-live sequence follows the ledger line appended by replatforming-and-migration (loaded July 2027 with 1,900 conflicting variants resolved, DE storefront first consumer in August, NL/BE and the connector in September); this chapter adds only that Spring/Summer 2028 is the first season built in the PIM, and both lines should be kept in step if either chapter changes.\n- Flow rubric, first run (2026-11-12, sound with notes). Taken: the vendors' definitions now follow the PIM definition directly (p23 before p22); the one-sentence opening of The Choices is merged into the first option; a sentence on variant limits is added where the variant is defined (p09); the W3 introduction (p44) no longer restates the scene. Not taken: (a) 'system of record', the Group stage, the failure-pattern names and W8 were called forward references; all are established in Part I, and W8 is glossed again in the text. (b) 'feeds' is used in the ownership section before the PIM section defines 'feed'; the ownership table would need a gloss in a table cell. (c) The 'depends on context' take-away on logistic attributes and the eighth question on AI agents rest on one table row and one clause each; they are the author's and were kept. (d) Trade-offs and Across Scale Stages declare no section flow of their own (two paragraphs each).\n- Flow rubric, second run (2026-11-12, sound with notes). Taken: the paragraph on keeping page, structured data and feeds aligned (p22) now follows the flow requirements. Not taken: (a) move the vendors' definitions (p23) to the head of Trade-offs, where 'no vendor gives a threshold' meets the author's threshold; kept in the PIM section because Figure 3 hangs on that paragraph and it completes the definition. (b) Cut or move the list of four product shapes (p14), which no later item uses. (c) Swap p02 and p03 in the introduction. (d) The stages section does not visibly apply the producer-and-consumer test. (e) The conclusion's opening paragraph (p57) and the author's-synthesis list (p60) partly restate each other; the three-tier take-away is the book's house format.\n- Flow rubric, third run after the move (2026-11-12, sound with notes; no change of order followed). Notes not taken: none of the three rules visibly meets the alignment requirement of p22; merge the announcement of the rules (p26) into Rule 1; the pulled rug is found by reading a channel's notices, so the shared remedy of p56 (a scheduled comparison) fits it only in part; 'outbox' and 'group id' need a gloss (the text glosses the outbox in Rule 3 and names item_group_id in In Practice).\n- GS1's own site blocked fetching; the GTIN format facts rest on a GS1 support article and an encyclopaedia page. A reviewer with access to the GTIN Management Standard could replace the secondary citation.\n- Draft check rounds 2 and 3 (2026-11-12), for the author: both flow readers in rounds 1, 2 and 3 found the PIM section (how it works) arriving before The Choices and Trade-offs (whether to have one). The spec keeps the order because three arrangements are defined by what they lack against the PIM; moving The Choices and Trade-offs before the PIM section is the alternative. Not changed without the author.\n- Draft check rounds 2 and 3, for the author: both flow readers want 'What the channels document' (p42-p43) moved up beside Rule 3 or Requirements per flow, which already cite bol's upload report and Google's GTIN disapproval; In Practice now carries over Rule 3's 'no', but the evidence still comes late and partly repeats. Moving it, or cutting the repetition in Requirements per flow, is the author's decision.\n- Round 3, one reader: the product-shapes list (p14) mixes three other shapes with one synonym for the grid (configurable product); a sentence before the list, or dropping Adobe's configurable product, would separate them.\n- Round 3, one reader: 'n.d.' (no date) in the in-text citations is never expanded; this is the book-wide citation convention and was left as is.\n\n## Decision log\n\n- **2026-11-12** — Converted spec.md to spec.json from the published chapter, one paragraph per unit. The author asked for the flow rubric's notes to be taken without review; the changes of order made for that reason are the entries of this date. Rejected: Keeping spec.md beside spec.json.\n- **2026-11-12** — Moved 'Requirements per flow' (the flow table and its reading, p24 and p25) from the ownership section into the PIM section, after the definitions and Figure 3 and before the three rules: the table uses 'enrichment' and 'syndication', which were defined one section later, and its two findings are the reasons d pointer.\n- **2026-11-12** — Added a roadmap paragraph (p04) that announces every section, a sentence in p03 that places the chapter in Part II as the part's transition_in asks (the slowest-changing fact; the identifiers every other catalog fact is keyed on), and an opening paragraph of the conclusion (p57) that returns to the corrected waterproof rating and states the synthesis. Rejected: Relying on the IN THIS CHAPTER callout as the only roadmap.; A conclusion made only of the three take-away lists.\n- **2026-11-12** — Success criteria of spec.md: the criterion on terms and acronyms is kept as AC-6 (known_before_new, minor; added beyond the journal spec's criteria, for the author to keep or drop). The others were inventories (a table is present, a section has four columns, three tiers and eight questions are present, two diagrams have captions) or facts the ledger and the Sources apparatus already govern (Kestrel & Pine figures, dated public evidence); they are dropped as criteria. Their substance is carried by the journal spec's AC-1 to AC-3 and by the evidence entries of the paragraphs. Rejected: Carrying the nine checklist items over as acceptance criteria.\n- **2026-11-12** — Kept the word limit of 6,500 that spec.md set. Where the chapter means the hosted product it now says 'the shop platform', the name fixed in chapter 1. Rejected: Raising the limit to make room for the added paragraphs.\n- **2026-11-07** — Chose attribute-level ownership (a table per kind of data) as the chapter's central device, because the ledger's three copies exist precisely because identity, cost and content have different natural owners, and because the Business Central connector documentation shows the per-field direction as a documented setting. Rejected: Product-level ownership ('the PIM owns the product').\n- **2026-11-07** — Opened the scene with a season launch, because the ledger gives no product-data incident with numbers and a launch shows all four copies and all four prod
