<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Where Is My Order? Notifications, Service and the Customer Record\n\n> Working doc for chapter 19 of *ORDERED: Architecting Commerce Platforms* (Part IV — FULFILLMENT, last chapter). Lives next to `index.md`; the spec drives the post, the post is the artifact.\n\n## Intent\n\nNewcomers see customer service as a department and notifications as e-mail templates. This chapter shows both as the customer-facing read side of the order record: messages triggered by events from the platform, the warehouse and the carrier; a status page and an agent's screen that must read the same status; self-service gated on the goods state; and \"where is my order\" volume as a measurement of the integrations. The spine is the Three-Status Order, told as the eleven tickets one customer opened in six days and the five tabs the agent used to answer them. After reading, the reader can say which system must emit each message, why the status page and the agent's tool must share a source, and what to measure.\n\n## Audience\n\nNewcomers to commerce architecture. The roles that benefit most: a product manager asked to \"reduce support tickets\", an engineer wiring notifications to a new warehouse or OMS integration, and a head of customer service deciding between a helpdesk integration and an OMS service view. Readers should leave able to define transactional notification, order status page, service view, read model, WISMO and the separate status machines of an order, and to explain why a single \"status\" string loses what the customer is asking about.\n\n## Success criteria\n\n- [ ] A reader new to the field can define every term the chapter uses from the chapter alone (WMS, ERP, iPaaS, PSP, OMS, webhook, read model, transactional notification, order status page, service view, WISMO, idempotency key, fulfillment order, Order Defect Rate, restricted data token), with every acronym expanded on first use.\n- [ ] The business problem (11 tickets, six days, order #1052877) comes before any component; the ticket table shows what the customer asked and what the agent could see, and the missing message (\"two parcels\") is identified as the one with no emitter.\n- [ ] The notification map names, per message, the event and the emitting system, with dated vendor documentation behind it.\n- [ ] The chapter states that money, goods and returns are separate status machines (Shopify and commercetools documentation) and ties the Three-Status Order to that fact without re-teaching the order lifecycle (chapter 13's).\n- [ ] Four choices for the service layer are compared in a trade-off table, with the recommendation tied to which system owns the goods state.\n- [ ] Self-service actions are gated on the fulfillment state with a state diagram and the Shopify constraints (edit only unfulfilled; cancel becomes a request after acceptance).\n- [ ] WISMO is sourced (Gorgias 2023, 18% of tickets, basis stated; Branvas 2026 critique) and reframed as a per-shipped-order measure; a measurement table with labeled assumptions is present.\n- [ ] The \"Across Scale Stages: When It Fits and When It Limits\" table is specific per stage and ends with a judgement; at least two mermaid diagrams, a Kestrel & Pine worked example (Eva's jacket, ledger dates), a \"When it goes wrong\" section, the three take-away tiers, 6–10 questions and grouped Sources and Evidence are present.\n- [ ] Customer identity depth is deferred to [One Customer, One Product: Identity and Master Data Across Systems](identity-and-master-data.html) with an explicit link; the chapter only shows what the agent cannot see without it.\n\n## Non-goals\n\n- The order state machine, order edits as transactions and the OMS as a product category: [The Order Record: Lifecycle, State and the Order Management System](order-management.html).\n- Carrier integration, tracking-event vocabularies and the delivery promise: [Getting It There: Carriers, Labels, Tracking and the Delivery Promise](shipping-and-delivery.html).\n- Return policies, dispositions and refund reconciliation: [The Way Back: Returns, Exchanges, Refunds and Reverse Logistics](returns-and-exchanges.html); this chapter only names the helpdesk as a refund path.\n- Customer matching, the golden record and consent: [One Customer, One Product: Identity and Master Data Across Systems](identity-and-master-data.html) and [Whose Data Is It? Privacy, Consent and Retention](privacy-and-customer-data.html).\n- Marketplace order import, performance metrics and strikes in full: [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html); only the service-side obligations are covered here.\n- AI agents in service and agentic commerce: [Assistants and Agents: AI in Commerce and What Is Real in 2026](ai-and-agentic-commerce.html); W8 is mentioned only as the reason order status by API matters.\n- Metric definitions and the data platform: [Counting the Same Thing Everywhere: Data Platforms, Definitions and Analytics](commerce-data-and-analytics.html).\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\nArticle only for now.\n\n## Open questions\n\n- The only WISMO figure with a stated basis is one vendor's 2023 number; no independent or European study was found. Replace or supplement if one appears.\n- The Three-Status Order's mechanism (a two-line order, a partial shipment collapsed into \"fulfilled\" by the iPaaS flow, the ERP invoicing on \"order complete\") is this chapter's reconstruction, appended to the ledger. Chapter 13, written in parallel, should be checked for agreement.\n- The 2026 service measures for Kestrel & Pine (9 contacts per 100 orders, 3.5 WISMO per 100 shipped orders) are labeled assumptions, not ledger facts; promote them to the ledger only if other chapters need them.\n\n## Decision log\n\n- **2026-11-07** — Chose the eleven tickets as the spine, told as a day-by-day table, rather than a tour of notification channels, because the tickets show the customer's and the agent's views at once and make \"two parcels\" the missing message.\n- **2026-11-07** — Gave the Three-Status Order a concrete mechanism (partial shipment collapsed into one status) and recorded it in the ledger, so that chapters 13 and 19 can share it; a vaguer \"the systems disagreed\" would not have taught the state-machine point.\n- **2026-11-07** — Framed the status page, the notifications and the agent's screen as three read models over one record, and made \"which system owns the goods state\" the trigger for changing the design, rather than order volume.\n- **2026-11-07** — Kept customer identity to one table row, one failure bullet and links, as the contract requires; the Familiar Stranger is chapter 27's.\n\n## Sources\n\n- **Internal**\n  - [Meet Kestrel & Pine](meet-kestrel-and-pine.html) — the Three-Status Order, the Double Refund, Eva's jacket dates, Waypoint W2 and W8.\n  - [The Order Record: Lifecycle, State and the Order Management System](order-management.html) — the order record and its state machines.\n  - [Getting It There: Carriers, Labels, Tracking and the Delivery Promise](shipping-and-delivery.html) — tracking events and the computed promise.\n  - [The Way Back: Returns, Exchanges, Refunds and Reverse Logistics](returns-and-exchanges.html) and [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html) — the return record and the refund path.\n  - [One Customer, One Product: Identity and Master Data Across Systems](identity-and-master-data.html) — the customer record.\n  - `_research/brief-inventory-fulfillment-returns.md` (Parts 2, 4 and 6) and `_research/brief-integration-and-data.md` (Parts 2 and 4) — the verified vendor and research facts.\n- **External**\n  - Shopify help and developer pages (notifications, order status page, order status families, edit orders, fulfillment order), accessed 2026-11.\n  - commercetools orders API, accessed 2026-11 — separate state machines.\n  - Zendesk Shopify integration, Gorgias, Fluent Commerce, Kibo, Narvar pages, accessed 2026-11 — helpdesk and OMS service views (vendor claims).\n  - Gorgias 2023 and Branvas 2026 — WISMO figures and their basis.\n  - EasyPost trackers, DPD Belgium Predict — tracking statuses and carrier notifications.\n  - Meta WhatsApp Business Platform pricing, accessed 2026-11 — channel economics and dates.\n  - bol service standards and Amazon order performance policy (2026) — marketplace service obligations; Amazon Tokens API — personal data access.\n  - Directive 2011/83/EU — the withdrawal clocks referenced in return messages.\n\n## Changelog\n\n- **2026-11-07** — Initial spec and article. *(AI-mediated session)*\n- **2026-11-07** — Editorial review pass: WHY IT MATTERS cut to two sentences, Three-Status tickets corrected to three channels, Eva's times aligned with the ledger, WhatsApp pricing claim corrected, OMS/3PL/SP-API expanded. *(AI-mediated session)*\n- **2026-11-07** — Final consistency pass: ledger-as-document references rephrased. *(AI-mediated session)*\n- **2026-11-07** — Visual layer: redrew 3 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator). *(AI-mediated session)*\n"}]}]}</script>

        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

                // Stray ampersands still get fixed up.

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
