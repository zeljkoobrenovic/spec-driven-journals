<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/19-customer-service-and-notifications/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (a roadmap in the introduction, a conclusion paragraph that answers the opening, and Part IV's closing, which the journal spec assigns to this chapter); these are listed in decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Which event and which system emit each customer message (confirmed, shipped with tracking, ships in two parcels, out for delivery, delivered, ready for collection, return received, refund issued).\n- **Know:** The order status page as a read model and a privacy boundary, and the separate status machines (order, money, goods per shipment, returns) that platforms keep.\n- **Know:** The four ways to build the service layer (platform notifications and a helpdesk, a tracking vendor, a notification service and service view over the OMS, a built layer) and where each fits.\n- **Believe:** The status page, the notifications and the agent's screen are three read models over one order record; any difference between them is a defect.\n- **Believe:** 'Where is my order' contacts per shipped order measure the integrations, not the staffing.\n- **Be able to:** Say which system must emit each customer message and which system the status page and the helpdesk must read.\n- **Be able to:** Choose the measures (contacts and WISMO per 100 shipped orders, contacts per split shipment, status disagreements) that show where the joins fail.\n\n**Audience:** Readers new to commerce architecture; most of all a product manager asked to 'reduce support tickets', an engineer wiring notifications to a new warehouse or OMS integration, and a head of customer service choosing between a helpdesk integration and an OMS service view.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its 2026 and January 2027 incidents in outline (the Three-Status Order, the Double Refund, the Queue That Waited, the Store Stock Mirage among them) and the names of the sixteen failure patterns.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines (money, goods, returns), 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, business models and the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Part III: checkout creates the order once with payment pending until the provider's signed message; one writer and a key for every refund (the Double Refund); the order's one home with three status lines, goods status per shipment, split shipments and the fulfillment order.\n- From the earlier chapters of Part IV: the warehouse system as writer of on-hand stock and the fulfillment order it accepts or rejects; carrier scans mapped to one vocabulary and the 'shipped' message sent on the carrier's first scan, not at label print; the store's till and click-and-collect; the return request and the warehouse's disposition as two records, the disposition releasing the refund or the held replacement, one refund writer keyed on the return id.\n\n**Does not yet know:**\n\n- Transactional notification, order status page, read model, service view, WISMO.\n- Helpdesk, tracking-and-notifications vendor, notification service; the fulfillment order's request status.\n- Marketplace service standards and the Order Defect Rate; the restricted data token.\n- Utility templates and per-message pricing on messaging channels.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a two-parcel order that read 'Delivered' after the first parcel, the reader names the missing message, the only kind of system that could emit it, and what every view should read. *Probe:* A two-line order ships its first item; the second waits for replenishment. The status page and the e-mail say 'Delivered', the warehouse says 'In picking', and the customer writes eleven times in six days while the agent switches between five systems. Using only this chapter: which message was missing, which system could have sent it, and what should the page and the agent read? | `custom` | cold_reader | major |\n| AC-2 | Given a helpdesk that still reads the shop platform after an OMS took over and a 'shipped' e-mail sent at label print, the reader names the failure and the rule. *Probe:* A merchant has moved its orders to an order management system, but its helpdesk still reads the shop platform, and the 'shipped' e-mail goes out when the label prints. Using only this chapter: what goes wrong, and what is the rule? | `custom` | cold_reader | major |\n| AC-3 | The reader can say when a customer may cancel herself and how 'where is my order' contacts should be measured. *Probe:* Using only this chapter: when may a customer cancel her order without contacting anyone, and how should a merchant measure 'where is my order' contacts? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How does the customer learn what is happening, and what does a service agent need to see?\n\n> **Claim:** The customer learns what is happening from notifications and a status page; the service agent needs the goods state of each line or parcel, the money state and any return state. The notifications, the status page and the agent's screen must be read models over one order record fed by events from the platform, the warehouse, the carrier and the returns flow, because disagreements between them reach the service desk as customer contacts.\n\n**Disputed by:** The view that notifications are e-mail templates the shop platform sends, that agents should look each answer up in the system that holds it (the platform, the warehouse, the carrier, the payment provider), and that 'where is my order' contacts are a staffing cost to be reduced with more agents or a chatbot.\n\n**So what:** Order #1052877 (a €119 fleece and €18 socks) produced 11 tickets in six days: the integration marked the whole order fulfilled on the first shipment, so the page said 'Delivered' while the warehouse said 'In picking' and the ERP 'Not invoiced', the agent worked from five tabs, and no system could send 'your order ships in two parcels'. A merchant that accepts the claim points the status page, the notifications and the helpdesk at the system that owns the goods state (at Kestrel & Pine the OMS from Q4 2027 under W2), gates self-service on the fulfillment state, and reports contacts per shipped order and per split shipment beside its integration monitors.\n\n**How and why:** Each fact about the order is first known by a different system: the platform knows the order and the payment, the warehouse the shipment and its tracking number, the carrier the scans, the returns flow what came back. A view that reads one of them shows only its fact, and a single status string lets the latest event, such as the first parcel's delivery, overwrite the others; the message 'two parcels' can come only from a record that holds the lines and their fulfillment state together. A cancel or address change is safe only before the warehouse accepts the work, so self-service must read the goods state. Contacts per shipped order rise when tracking numbers arrive late, promises slip or splits go unannounced, which makes them a measure of the joins.\n\n**Supporting claims**\n\n- **S1** — Every customer message is triggered by an event that one system witnesses (the shop platform for the order, its payment, cancellation and refund; the warehouse or 3PL for the shipment and its tracking number; the carrier for the scans; the returns flow for what came back), and the message customers most needed, 'ships in two parcels', had no system able to emit it.\n- **S2** — An order has separate status machines (the order, the money, the goods per line or shipment, the returns); a single status string lets the latest event overwrite the others, so the page and the agent must show each state, not one word.\n- **S3** — The notifications, the status page and the agent's view must be read models over one order record, and the service view must read the system that owns the goods state; any difference between views is a defect that reaches the service desk as a contact.\n- **S4** — Self-service and agent actions write back through the order record's own rules: a cancel or address change is gated on the fulfillment state, and a refund has one command that every tool invokes with the order and return ids as its key.\n- **S5** — 'Where is my order' contacts counted per shipped order, with contacts per split shipment and sampled status disagreements, measure the notification and tracking joins rather than the staffing.\n\n## Role in the part\n\nShows the customer's and the agent's side of every event in the part, makes one status built from those events the rule for every view, and performs the part's closing (the published chapter does not yet do so: it ends with a one-sentence summary and the hand-off to Part V). Supports P4-2, P4-5 of part `part-4`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in needs to pieces: the messages, their emitters and the status page are named before the shape that joins them into one record; `comparison` in choices and stages: four ways to build the service layer on the same criteria, then which fits at which stage; `chronological` in practice, the worked example: Eva's messages from 13 to 22 April 2027)\n\nThe eleven tickets come first so that every later term answers a question the reader has already seen asked: why the page said 'Delivered', why the agent needed five tabs, why nobody said 'two parcels'. The message map and the status page come next because they name, per message, the system that must emit it, which the shape of the solution then joins into one record; putting the components first would ask the reader to accept one record before seeing that each message has a different witness. The section on that shape starts with the state machines, because they explain why one record must still keep several states and the component table names them. The choices follow because each is a way of building that shape, and the scale stages after them because they say which choice fits when. In Practice applies the rules to channels, refunds, Eva's order and the measures, and the failures come last because each is read against the rule that prevents it. Moving the failures earlier would describe breakages before the reader knows the design they break; moving the scale stages before the choices would assign choices the reader has not met. Marketplace service sits in In Practice, after the merchant's own refund path, because it applies the rules where someone else owns the conversation; among the build choices it read as out of place.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A customer receives a shipping e-mail, checks a page that says 'Delivered' and then hears from support that the order is still being picked: three answers, and she still does not know when the parcel will come.\n\n**Bridge:** Anyone who has ordered online has had a shipping e-mail, a tracking page and, sometimes, an answer from support that did not agree. → The disagreement starts with facts held in different systems (the shop platform, the warehouse, the carrier, the returns flow), so the question becomes what the customer and the agent must read so that every view gives the same answer.\n\n**Thesis statement** (KEY POINTS bullets 1 and 2 and paragraph p02): Notifications, the status page and the agent's screen are three read models of one order record, fed by events from the platform, the warehouse, the carrier and the returns flow; the agent needs the goods state per line or parcel, the money state and any return state, and every disagreement between the views reaches the service desk as a contact.\n\n**Roadmap** (Paragraph p03):\n\n- Start from the Three-Status Order's eleven tickets. *Kept in:* scene.\n- Say which system must emit each message, and treat the status page and 'where is my order' contacts. *Kept in:* needs.\n- Show the separate states an order record keeps and the one-record shape built around it. *Kept in:* pieces.\n- Compare the four ways to build the service layer and how the answer changes with scale. *Kept in:* choices, stages.\n- Apply it in practice, to marketplace orders, Eva's messages and the measures, and end with what goes wrong, including the Familiar Stranger. *Kept in:* practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A customer who gets a shipping e-mail, a page saying 'Delivered' and support saying the order is still being picked has three answers and still does not know when to expect the parcel; conflicting messages create contacts and weaken trust in promises that may have been kept. | scenario: One customer, three channels, three answers about one order. |  |\n| p02 | claim | The disagreement starts with facts held in different systems (the platform knows the order and the payment, the warehouse the shipment, the carrier delivery, the returns flow what came back), so the notifications, the status page and the agent must read one order record built from those events, showing the goods state per line or parcel, the money state and any return state. |  | `cause_effect`: The three conflicting answers. → Where they come from, and the chapter's answer: one record read by every view. |\n| p03 | transition | The chapter connects three views (transactional notifications, the order status page and the agent's service view) and goes from the eleven tickets of the Three-Status Order through the message map, the record's separate states and the one-record shape, the four ways to build it and its scale stages, to practice (marketplaces, Eva, measures) and the failures, with the kinds of evidence it uses. |  | `elaboration`: One record read by every view. → The three views by name, the chapters they draw on, and the order of the chapter. |\n| p04 | context | The previous chapter closed Eva's return on the warehouse's disposition and shipped her size L, and she saw only a few messages of that work; this chapter follows those messages from order #1072455's confirmation on 13 April 2027 to the replacement's dispatch on 22 April, with the page she checks and the record support needs. |  | `sequence`: The roadmap and the three views. → Where Eva's order stands: the return closed, and the messages she saw of the part's work. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: Eleven Tickets, Six Days, One Order\n\n**Controlling idea** (`example`, id `scene`): The Three-Status Order shows the cost of views that read different systems: eleven tickets in six days, five tabs for the agent, and no system able to say 'two parcels'.\n\n**Advances the thesis** (S1, S2): Shows one status string overwritten by the first parcel's delivery and the missing message that no system could emit.\n\n**Transition in:** `example`: The customer's three conflicting answers and Eva's messages. → The Kestrel & Pine case where this happened: order #1052877.\n\n**Order of paragraphs** (`chronological`): The statuses, the mechanism, the tickets day by day, the answer no system held, then the decision that addresses it: the reader sees the cost before the cure.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | evidence | Kestrel & Pine's Three-Status Order, #1052877, produced 11 support tickets over six days in December 2026 while the shop platform said Delivered, the WMS In picking and the ERP Not invoiced. | case: Order #1052877, 11 tickets, six days, three statuses. |  |\n| p06 | cause_effect | The €137 order held a €119 fleece that shipped on 7 December and €18 socks that waited for replenishment, and the integration treated the first shipment as fulfilment of the whole order, so the page and e-mail said Delivered when PostNL delivered the fleece on 8 December. | case: Fleece shipped 7 December, delivered 8 December; socks on replenishment; the iPaaS flow marked the whole order fulfilled. | `elaboration`: The three statuses. → The mechanism behind 'Delivered'. |\n| p07 | evidence | The WMS kept the order In picking and the ERP waited for 'order complete', and nobody told the customer to expect two parcels; the ticket table shows what she asked and what the agent could see each day. | table: The eleven tickets, 8 to 14 December: channel, the customer's question, what the agent could see, what the agent did. | `additional_support`: The page's 'Delivered'. → The other two systems' statuses and the eleven tickets. |\n| p08 | analysis | The useful answer, 'the order ships in two parcels, and the second leaves on the 14th', was held by no system; agents checked five tabs and only finance could see the ERP. |  | `conclusion_summary`: The eleven tickets. → The one answer that would have ended them and why nobody had it. |\n| p09 | context | Waypoint addresses this with a bought order management system by Q4 2027 under W2 and order status through an API under W8, so customers and agents get one explainable record. | figure: Figure 1: an agent with five tabs that disagree, then one view showing the order's two parcels. | `problem_solution`: No system held the answer. → Kestrel & Pine's decisions that give it a home. |\n\n### What the Customer Needs to Know, and Which System Knows It\n\n**Controlling idea** (`explanation`, id `needs`): Each customer message is an event some system must emit, the status page is a read model of the same facts, and 'where is my order' contacts measure how well that layer works.\n\n**Advances the thesis** (S1, S3, S5): Maps each message to its emitter, defines the status page as a read model, and reframes WISMO as a measure.\n\n**Transition in:** `cause_effect`: No system held the answer 'two parcels'. → Which system holds each answer the customer needs.\n\n**Order of paragraphs** (`prerequisite_order`): The messages and their emitters first, because the status page shows the same facts, and the measurement last, because it counts the contacts the first two fail to prevent.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition | A transactional notification is a message triggered by an event on the customer's own order, so the list of notifications is a list of events some system must emit; Shopify's inventory names three emitters (the platform, the warehouse or fulfillment app, the carrier), and the notification map adds the returns flow and the order confirmation sent once the payment provider's signed message marks the order paid. | source: Shopify's customer-notifications help page: confirmation, shipping confirmation, shipping update, out for delivery, delivered, refund, canceled.; table: The notification map: message, event behind it, emitting system, lag the customer tolerates. |  |\n| p11 | analysis | 'Ships in two parcels' is the message that would have ended the eleven tickets, and it had no emitter at Kestrel & Pine in 2026 because no system held the order's lines with their fulfilment state; an order management system produces it as a side effect. |  | `emphasis`: The notification map. → The row with no emitter. |\n| p12 | definition | The order status page is the customer's self-service answer to 'where is my order' and a read model: a view assembled from the order record and the tracking stream for reading, not where either is written. |  | `sequence`: The messages pushed to the customer. → The page the customer pulls between messages. |\n| p13 | evidence | Shopify's page shows the design choices in miniature: five customer-facing states, no updates without a tracking number, and less detail for a visitor who is not logged in. | quotation: Five states 'Confirmed, On its way, Out for delivery, Delivered, and Attempted delivery'; 'If you fulfill an order without a tracking number, then no shipping updates are received'; access without login for three weeks. | `example`: The status page as a read model. → One platform's page as the example. |\n| p14 | recommendation | Three rules follow: the page reads the same status as the notifications and the agent, it receives tracking numbers at handover, and it shows a stranger holding the link as little as possible. |  | `cause_effect`: Shopify's design choices. → The three rules they imply. |\n| p15 | evidence | WISMO is the contact that asks for delivery status and is consistently reported as the largest single contact category, but the only figure with a stated basis is Gorgias's 18% of tickets in 2023; other vendor figures are shares of tickets, not of shipped orders, and no independent study was found. | statistic: 18% of incoming requests on average (Gorgias, 2023, mostly small Shopify merchants); vendor figures from 10% to 50%; the Branvas 2026 critique. | `cause_effect`: A page that goes silent or disagrees with the messages. → The contact that results, and how it is counted. |\n| p16 | analysis | Measured per shipped order, WISMO is a direct measure of the notification and tracking layer: it rises when tracking numbers arrive late, promises slip, splits go unannounced or the page reads a system that is behind. | figure: Figure 2: a notification pipeline leaking into a bucket of tickets read by a WISMO gauge. | `contrast`: The safe statement about WISMO as a share of tickets. → The architectural statement: WISMO per shipped order. |\n\n### How the Pieces Fit Together\n\n**Controlling idea** (`description`, id `pieces`): One order record keeps separate status machines and emits events; the notifications, the status page and the service view read it, and self-service writes back through its rules, gated on the goods state.\n\n**Advances the thesis** (S2, S3, S4): Explains why the record keeps several states, gives the target shape, and gates self-service on the goods state.\n\n**Transition in:** `problem_solution`: Messages, a page and contacts that each depend on a different system's facts. → The shape that joins them in one record.\n\n**Order of paragraphs** (`small_to_large`): The separate states the record must keep come first, because the component table names them and the Three-Status Order was just told; then the whole shape built around that record, then the requirement that matters most (consistency). Putting the shape first made readers in two rounds meet 'state machines' in the component table before they were explained. Self-service closes the section because it is the component that writes back through the record; among the build choices readers in rounds 1 and 3 found it out of place.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | evidence | One record does not mean one status: the Three-Status Order was three systems each telling the truth about a different thing, and platforms model this openly with separate order, payment and fulfilment states (Shopify) or order, shipment and payment states (commercetools). | source: Shopify's three status families plus the fulfilment order's statuses; commercetools' order, shipment (with Partial and Backorder) and payment states. |  |\n| p20 | recommendation | The agent's screen and the status page should show the goods state per line, the money state and any return state; a single word is a subject line, not what the views should read. | figure: Figure 4: the Three-Status Order as one status overwritten by the first parcel while the socks and the invoice waited. | `cause_effect`: Separate status machines. → What the service views must therefore show. |\n| p17 | description | With those states in one record, the target shape follows: the record emits events, a notification service turns them into messages, a status page and a service tool read the same record, and self-service writes back through the record's rules; the component table gives each component's job, the one shortcut it must never take and where Kestrel & Pine stands in 2027. | figure: Figure 3: one order record fed by the platform, the warehouse, the carrier and the returns portal drives the notifications, the status page and the agent's view.; table: Components: responsibility, what each must never do, and Kestrel & Pine in 2027. | `cause_effect`: The separate states the record must keep. → The target shape built around that record. |\n| p18 | analysis | Each flow has its own requirements, and the consistency column is the point: freshness can be minutes, but two views of one order may never differ, because the difference is what the customer writes in about. | table: Requirements for the flows: freshness, consistency, speed and availability for confirmation, shipped notification, status page, service view and self-service cancel. | `elaboration`: The components of the target shape. → The requirements of the flows between them, and the one column that cannot be relaxed. |\n| p27 | recommendation | Self-service cancels, address changes and returns must check the fulfilment state first, because once the warehouse has accepted the work a cancellation is a request to the warehouse, not a change to a record. | quotation: 'You can edit only unfulfilled line items'; after acceptance 'the merchant can no longer cancel it directly and must submit a cancellation request'.; figure: Figure 5: which self-service actions are safe in which goods state. | `cause_effect`: One record whose views may never differ. → Self-service, which writes back through that record and must read its goods state first. |\n\n### The Choices\n\n**Controlling idea** (`comparison`, id `choices`): A merchant has four ways to build the service layer, and the right one is the one whose views read the system that owns the goods state.\n\n**Advances the thesis** (S3): Compares the four ways and states the rule for choosing.\n\n**Transition in:** `sequence`: The target shape. → The ways to build it.\n\n**Order of paragraphs** (`comparison`): The four options on the same criteria, then the rule that decides between them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | transition | A merchant has four realistic ways to build the service layer, and they line up with the scale stages. |  |  |\n| p22 | comparison | The platform's built-in notifications and a helpdesk that reads the platform are right while the platform is the only system that fulfils, and stop being enough when a warehouse system or an OMS holds a state the platform does not. | source: Zendesk's Shopify integration: orders matched by e-mail or phone, statuses and tracking in the sidebar, refund in any state, cancel only unfulfilled. | `sequence`: Four ways. → The first. |\n| p23 | comparison | A tracking-and-notifications vendor over the carrier stream solves the carrier half well and the order half not at all: it knows where the parcel is, not whether there is a second one or whether the refund went out. | quotation: Narvar's claim that its pages 'convert 10% higher and reduce support costs'. | `sequence`: The platform-only option. → The second option. |\n| p24 | comparison | Once an OMS is the order record, a notification service subscribes to its events, the status page reads it and the helpdesk's sidebar is backed by it; this is where Waypoint takes Kestrel & Pine. | quotation: Fluent Commerce: agents 'see the same order data the platform used to make its decisions'; Kibo: edit, credit and refund 'without leaving the order screen'. | `sequence`: The tracking vendor's carrier-only view. → The third option, over the order record. |\n| p25 | comparison | A built notification and service layer is right at Group stage for a merchant with engineers and many countries, brands and channels, and the Giant's Boots for anyone smaller; the comparison table sets the four side by side. | table: The four options against carrier events, splits and returns, gated actions, channels, integrations to own, refund paths and stage fit. | `sequence`: The OMS option. → The fourth option and the comparison. |\n| p26 | recommendation | The author's rule: the service view must read the system that owns the goods state, so the helpdesk is re-pointed at the OMS the moment an OMS or WMS owns it; the channels are a second-order question. |  | `conclusion_summary`: The comparison table. → The rule that decides between the options. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`analysis`, id `stages`): The service layer changes shape once, when the goods state leaves the shop platform, and Kestrel & Pine is at that point now.\n\n**Advances the thesis** (S3): Ties the change of design to the ownership of the goods state, not to volume.\n\n**Transition in:** `elaboration`: The four choices and the rule. → Which choice fits at which stage, with the warning signs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | synthesis | The judgement: the layer changes shape exactly once, when the goods state leaves the platform; before that the platform's tools suffice, after it every view must read the order hub, and the eleven tickets are what Kestrel & Pine's delay cost. | table: Four stages: what is typical, what becomes necessary, warning signs of outgrowing the approach. |  |\n\n### In Practice\n\n**Controlling idea** (`example`, id `practice`): In practice the rules become event-driven messages, a channel chosen per message, one status endpoint, one refund command, Eva's messages from one record, and service measures read as architecture signals.\n\n**Advances the thesis** (S1, S3, S4, S5): Applies the emitter rule to carriers and channels, the one-command rule to refunds, and the measure to Kestrel & Pine.\n\n**Transition in:** `example`: The design and when it changes shape. → How the rules look in practice.\n\n**Order of paragraphs** (`grouping`): Four practice rules on the merchant's own channels, each with its evidence (events, channel costs, the status endpoint, the refund button), then the marketplace case where someone else owns the conversation, then the worked example that uses them, then the measures that show whether they hold. Readers in two rounds found the marketplace paragraphs out of place among the build choices.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | recommendation | In practice the design comes down to four rules (carrier events, channel costs that change, one status endpoint, one refund command), the service rules of marketplaces, one worked order and a set of measures; the first rule is that carrier events, not polling, trigger the messages customers receive. |  |  |\n| p33 | evidence | Carriers already emit these events: DPD sends its own Predict messages at depot arrival and departure, and EasyPost reduces every carrier's codes to ten statuses pushed by webhook, five of which the customer needs and all ten the agent. | source: DPD Belgium Predict notifications; EasyPost's ten tracker statuses with webhooks on update. | `example`: Messages triggered by carrier events. → Two carriers' event streams. |\n| p34 | recommendation | Channels change their economics on published dates, as Meta's WhatsApp pricing did for utility messages on 1 July 2025 and again on 1 October 2026, so a notification service that chooses the channel per message, with cost as an input, survives such changes and one that hard-codes 'WhatsApp for shipped' does not. | source: Template categories; per-message pricing from 1 July 2025 with utility messages in the service window free; charged again from 1 October 2026 with a 1,000-a-month free tier for service messages. | `additional_support`: What triggers a message. → What sending it costs, per channel. |\n| p36 | recommendation | Order status by API is a prerequisite, not a feature: W8 lists it among what an AI shopping agent would need, and the same endpoint feeds the status page, the helpdesk and the tracking page. |  | `additional_support`: Messages pushed to the customer. → The status that other systems pull. |\n| p37 | recommendation | The service tool's refund button is another refund path, so the order record owns one refund command and every tool invokes it with the order and return ids as the idempotency key. | case: The Double Refund, January 2027: 212 returns, €19,400 refunded twice by the returns portal and by hand in the PSP console; the helpdesk's button would be a third path. | `additional_support`: One read model for every consumer. → One write path for refunds. |\n| p28 | evidence | On a marketplace the customer conversation belongs to the marketplace, and the merchant answers under its standards and clocks. | source: bol's customer-questions standard, response time and strike process; Amazon's Order Defect Rate 'under 1%' over 60 days. | `contrast`: Practice on the merchant's own channels, where the merchant owns the conversation and the refund command. → Marketplace orders, where the marketplace owns the conversation and sets the clocks. |\n| p29 | recommendation | Marketplace messages belong in the helpdesk with their deadlines, and the service view should find an order by the marketplace's id as well as its own. |  | `cause_effect`: The marketplace's standards and clocks. → What the helpdesk and the service view must do about them. |\n| p30 | explanation | Personal data is the other difference: Amazon releases a buyer's name and address only through a restricted data token, so the service view holds only what fulfilment needed. |  | `additional_support`: Deadlines and order ids. → The second marketplace difference, personal data. |\n| p38 | example | Eva's order from 13 to 22 April 2027 shows what she receives in the 2026 landscape and in the Q4 2027 target, message by message. | table: When, what happened, what Eva receives in the 2026 landscape and in the target; dates from the ledger, message times and channels illustrative. | `example`: The practice rules, marketplaces included. → Eva's order run through them. |\n| p39 | analysis | Nothing in the target column needs a new channel; it needs one record emitting the events and one read model, and the messages that matter most are those that pre-empt a ticket. |  | `conclusion_summary`: Eva's two columns. → What separates them. |\n| p40 | recommendation | A small set of measures (contacts and WISMO per shipped order, contacts per split shipment, status disagreements, the worst order, first replies with a true answer) turns the service desk into the platform's most honest monitor. | table: Measures, definitions, why each is an architecture signal, Kestrel & Pine 2026 values (labelled assumptions) and illustrative targets. | `cause_effect`: Messages that pre-empt tickets. → How to measure whether they do. |\n| p41 | recommendation | Hanna Berg's data team can produce most measures once there is one order record, and the first and last belong on Noor's monthly page. |  | `elaboration`: The measures. → Who produces them and where they are reported. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`cause_effect`, id `wrong`): The service layer fails in eight recurring ways, each detected by a measure or a log and recovered by the rule it broke.\n\n**Advances the thesis** (S1, S3, S5): Shows each failure as a broken emitter, a second source or an unmeasured join.\n\n**Transition in:** `contrast`: The design and the measures that watch it. → What happens when a rule is broken.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | cause_effect (list) | Eight failures (the duplicate notification, the notification that precedes the event, no tracking number, the unannounced split, the carrier outage, the agent and the page disagreeing, the wrong template for the country, the agent who cannot find the person) each come with detection and recovery. | case: Kestrel & Pine's Black Friday queue backed up for four hours; the Three-Status Order; Eva writing from her loyalty e-mail. |  |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The customer's three answers and the eleven tickets have one cause: each view read a different system, and the one answer the customer needed, 'two parcels', lived in none of them. One order record that keeps goods per line, money and returns, read by the e-mail, the page and the agent, gives one answer, and the number of contacts per shipped order shows whether it does. For the part: the Queue That Waited, Eva's Wednesday promise, the Store Stock Mirage, the Double Refund and the eleven tickets look like five problems in five places and are one: a promise or a status taken from a copy or a sentence instead of from the system that witnessed the physical fact, or an action two systems could take.\n\n**So what:** The remedies are contracts and rules more than buildings, tills or more agents: the helpdesk pointed at the order hub, 'shipped' on the carrier's scan, a split message, self-service gated on the goods state, one refund command; for the part, a queue allowed to grow and a cut-off that moves with it, a transit table plus the warehouse's cut-off and backlog measured per lane, a two-unit store threshold and a staff confirmation, and refund on disposition by one writer keyed on the return id. A reader can list, for their own operation, which system witnesses each physical fact and which promise reads it.\n\n**Callback:** The introduction's customer with three answers about one order; for the part, the Part IV opening's order confirmed in seconds whose goods still have to be picked and packed before the carrier's collection. Paragraph p43 gives the customer the one answer the views could not; p48 returns to the part opening's confirmation in seconds and sets the five incidents against it; p49 gives the part's so-what and take-away.\n\n**Takeaway** (`course_of_action`): For each promise your shop makes after checkout (delivery date, collection, refund, order status), name the system that witnesses the fact it depends on, the event that carries that fact, and the measure that shows when the promise broke; start with promised-versus-delivered per lane and contacts per split shipment.\n\n**Hand-off** to [Part V — CHANNELS: Selling Everywhere](part-5.html): `additional_support`: The single-shop journey of Parts II to IV, from catalog to return. → Orders created by someone else's system, under someone else's rules.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | synthesis | The customer of the opening had three answers because each view read a different system, and the answer she needed, 'two parcels', lived in none of them; one order record keeping goods per line, money and returns, read by the e-mail, the page and the agent, gives one answer, and contacts per shipped order show whether it does. | reasoning: The opening's three answers and the eleven tickets set against the chapter's answer. |  |\n| p44 | synthesis (list) | Established: platforms keep several status machines; notifications come from three emitters and the status page needs tracking numbers; edits and cancellations are safe only before the warehouse accepts the work; WISMO is the largest reported category, with one sourced figure counted as a share of tickets. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what the sources establish. |\n| p45 | synthesis (list) | Depends on context: the platform's tools fit while it owns the goods state; a tracking vendor depends on carriers and countries; the channel mix depends on country and pricing. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p46 | recommendation (list) | The author's synthesis: build the status page, the notifications and the agent's screen as three read models over one order record, and measure WISMO per shipped order beside the integration monitors. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p47 | recommendation (list) | Nine questions let the reader find, in their own company, which system each view reads, what triggers 'shipped', what a split order sends, how many refund paths exist, what self-service checks, how WISMO moves, how many tabs an agent opens, how marketplace messages arrive, and what happens with an unknown e-mail. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own company. |\n| p48 | synthesis | Part IV opened with an order confirmed in seconds whose goods still had to be picked and packed, and its five cases (the Queue That Waited, Eva's Wednesday promise, the Store Stock Mirage, the Double Refund, the eleven tickets) look like five problems in five places but are one: a promise or a status taken from a copy or a sentence instead of from the system that witnessed the physical fact, or an action two systems could take. | reasoning: The part opening's confirmation in seconds set against the part's five cases. | `conclusion_summary`: This chapter's answer: one status built from the events of the part. → What the five chapters of Part IV say together, set against the part opening. |\n| p49 | recommendation | Each chapter's remedy has the same parts (name the system on the spot, compute the promise from its events, let its confirmation commit it, give each money or stock action one writer and a key, build one status from the same events), and Kestrel & Pine's remedies are contracts and rules rather than buildings, tills or more agents, so a reader can list them for their own operation, starting with promised-versus-delivered per lane and contacts per split shipment. | reasoning: A queue allowed to grow and a cut-off that moves with it; a transit table plus the warehouse's cut-off and backlog measured per lane; a two-unit store threshold and a staff confirmation; refund on disposition by one writer keyed on the return id; the helpdesk pointed at the order hub. | `problem_solution`: The one problem behind the five cases. → The remedy's common parts and the list a reader can make. |\n| p50 | transition | Parts II to IV followed one shop's order from catalog to return; Part V adds orders created by someone else's system under someone else's rules, starting with marketplaces, where the customer conversation, the deadlines and the order id belong to the marketplace. |  | `additional_support`: The single-shop journey of Parts II to IV, from catalog to return. → Orders created by someone else's system, under someone else's rules. |\n\n## Non-goals\n\n- The order state machine, order edits as transactions and the OMS as a product category. See [The Order Record: Lifecycle, State and the Order Management System](order-management.html).\n- Carrier integration, tracking-event vocabularies and the delivery promise. See [Getting It There: Carriers, Labels, Tracking and the Delivery Promise](shipping-and-delivery.html).\n- Return policies, dispositions and refund reconciliation; this chapter only names the helpdesk as a refund path. See [The Way Back: Returns, Exchanges, Refunds and Reverse Logistics](returns-and-exchanges.html).\n- Customer matching, the golden record and consent. See [One Customer, One Product: Identity and Master Data Across Systems](identity-and-master-data.html), [Whose Data Is It? Privacy, Consent and Retention](privacy-and-customer-data.html).\n- Marketplace order import, performance metrics and strikes in full; only the service-side obligations are covered here. See [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html).\n- AI agents in service and agentic commerce; W8 is mentioned only as the reason order status by API matters. See [Assistants and Agents: AI in Commerce and What Is Real in 2026](ai-and-agentic-commerce.html).\n- Metric definitions and the data platform. See [Counting the Same Thing Everywhere: Data Platforms, Definitions and Analytics](commerce-data-and-analytics.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-13** — Auto-resolved in the cleanup pass, 2026-11-13, the round-3 points the page had no room for (rule 4 allows up to 7,150; the page stays under 6,500): p17 ends with a sentence saying what the component table shows (each component's job, the shortcut it must never take, Kestrel & Pine in 2027); the Requirements subsection now opens on p18, moved before its table and reworded as its lead ('Each flow between those components has its own requirements, and the consistency column is the point'), with the requirements table as p18's evidence instead of p17's; the WhatsApp paragraph (p34) drops the agent's two general sentences on per-message cost and keeps the author's published facts (categories, 1 July 2025, 1 October 2026, the 1,000-message service tier) in three plainer sentences (rule 2); p48 identifies the Double Refund (212 returns refunded twice) and the eleven tickets (this chapter's split order), and p49 states the five remedy parts as five short clauses; rule 2: the unglossed vendor name Branvas is cut from the body (the source stays listed in Sources), since no cited source says what Branvas is; rule 6: 'helpdesk' is glossed at first use in p15 ('the tool in which service agents answer tickets'). The open question listing these points is closed; the WISMO-source question stays (needs the author). The journal-spec part-4 closing so_what that mentions a 2028 till decision this page omits is left to the journal-spec cleanup step (this pass does not edit journal-spec.json). Rejected: Adding new paragraphs for the table leads (the existing units carry them); Dropping the author's WhatsApp facts for density\n- **2026-11-07** — Chose the eleven tickets as the spine, told as a day-by-day table, rather than a tour of notification channels, because the tickets show the customer's and the agent's views at once and make 'two parcels' the missing message. Rejected: A tour of notification channels.\n- **2026-11-07** — Gave the Three-Status Order a concrete mechanism (partial shipment collapsed into one status) and recorded it in the ledger, so that chapters 13 and 19 can share it; a vaguer 'the systems disagreed' would not have taught the st s.\n  - Directive 2011/83/EU — The withdrawal clocks referenced in return messages.\n\n## Changelog\n\n- **2026-11-13** — Open questions settled at the author's instruction of 2026-11-13 (see decision_log); no change to the page.\n- **2026-11-13** — Cleanup pass: component-table sentence, Requirements subsection opens on its lead (p18 moved before the table), WhatsApp paragraph tightened, Part IV closing clarified, Branvas name cut, 'helpdesk' glossed; 6,493 words; check-report.json stale. (AI-mediated session)\n- **2026-11-12** — Confirming round 3 ESCALATE (13 pass, 29 fail). Closing fixes without another round: self-service moved into 'How the Pieces Fit Together'; In Practice rules signposted; W8 glossed; roadmap split; Detection added to the Familiar Stranger failure. The check report is stale after these fixes.\n- **2026-11-12** — Round 2 ESCALATE (14 pass, 23 fail; three corroborated flow failures at fault in the spec). Resolved under the author's standing instruction: state machines moved before the target shape; marketplace service moved into In Practice; the tills clause cut and 'witness' replaced in the part closing; corroborated draft faults and cheap minors fixed (see decision_log).\n- **2026-11-12** — Draft check round 1 (REVISE: 11 pass, 39 fail, 24 blocking, all at fault in the draft). Revised the named units: transitions at scene/needs, p14/p15, p25/p26, stages/practice, p37/p38, p39/p40 and practice/wrong; the comparison table explained; p49 rewritten as one chain; Eva introduced before her return in p04; the reconstruction note moved to the mechanism; self-service and marketplace service tied to the rule; In Practice announced; the five EasyPost statuses tied to the status page's five states; the WhatsApp sentence split; the monthly-page measures named; the Familiar Stranger and the evidence named in the roadmap; state machine and restricted data token glossed.\n- **2026-11-12** — Converted spec.md to spec.json (outcome-spec pass): reconstructed from the published chapter; journal-spec intent, thesis and role copied; roadmap, carry-over from chapter 18, a conclusion paragraph answering the opening and Part IV's closing added; order confirmation aligned with chapters 11 and 12.\n- **2026-11-07** — Visual layer: redrew 3 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator).\n- **2026-11-07** — Final consistency pass: ledger-as-document references rephrased.\n- **2026-11-07** — Editorial review pass: WHY IT MATTERS cut to two sentences, Three-Status tickets corrected to three channels, Eva's times aligned with the ledger, WhatsApp pricing claim corrected, OMS/3PL/SP-API expanded.\n- **2026-11-07** — Initial spec and article.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
