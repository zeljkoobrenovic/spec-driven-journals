<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/45-ai-and-agentic-commerce/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (a bridge from chapter 44, a thesis paragraph, a roadmap, a chapter synthesis and the Part X closing); two one-sentence lead-ins in the Europe section are merged into the paragraphs they introduced, and a sentence split across two units in the protocol section is rejoined. These are recorded in decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The difference between an assistant (reads and proposes) and an agent (has tools and permission to act), and the uses AI already has in commerce with their dated evidence: search and recommendations, product content, customer service bots, fraud screening, demand forecasting, visits referred by AI assistants, and admin assistants that act through the platform's own permissions.\n- **Know:** Agentic commerce from September 2025 to November 2026 as the chapter's sources state it: AP2 announced on 16 September 2025; Instant Checkout launched in ChatGPT under ACP on 29 September 2025 and moved to Apps in March 2026; UCP announced on 11 January 2026; Shopify's Storefront MCP replaced by UCP endpoints; no party publishing a transaction count; the protocol layers (MCP, ACP, UCP, AP2, agent identity); and, for Europe, strong customer authentication dynamically linked to the amount and payee, the AI Act's Article 50 applying from 2 August 2026, the unsettled consumer-law position, and no live consumer channel in which an agent completes checkout for a Dutch, Belgian or German merchant.\n- **Know:** The readiness list and four postures (a correct feed, the platform's agent channel, an agent gateway over the merchant's own services, an own shopping agent), and Kestrel & Pine's February 2027 agent test and W8 with owners and dates.\n- **Believe:** Agent readiness is a data and API program, not an AI program.\n- **Believe:** An agent is an integration: a row, an owner, a contract, a pinned version, a reconciliation and no write scope on stock, prices or orders.\n- **Believe:** An agent channel is the harshest consumer of availability, because a stale copy becomes a promise a third party makes for the merchant.\n- **Be able to:** Run the agent test on their own systems: answer an agent's five questions from the systems as they stand and name which system owns each answer.\n- **Be able to:** Choose an agent posture for their stage and write an agent policy (identity, allowed actions, no writes, disclosure).\n\n**Audience:** Newcomers to commerce architecture; most of all the engineer or architect asked whether the business is 'ready for ChatGPT shopping' (Noor Visser at Kestrel & Pine). Product managers and leaders fielding an agency's shopping-assistant proposal or a board's question about AI are the second readers.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its ten incidents of 2026 and early 2027 in outline (among them the Black Friday Oversell, the Three-Status Order and the App That Wrote Stock), Eva's order of 13 April 2027 and the names of the sixteen failure patterns (among them the Secret Agent, the Phantom Stock, the Giant's Boots, Schrödinger's Order and the Pulled Rug).\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines, 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system (OMS), availability service, D2C, B2B, PIM, POS.\n- From Parts II and III: product, variant, SKU and GTIN with one owning system per attribute; prices frozen at order placement; one search index as a copy; available-to-promise; checkout creating the order once, keyed on cart and payment; authorization and capture; one order record with three status lines.\n- From chapters 41 to 44: W4, stay and surround; the PIM and OMS introduced seam by seam with a freeze around Black Friday; the stage map; the ownership map, with a row, a named owner and one writer per fact for every system, integration and app.\n\n**Does not yet know:**\n\n- Model, large language model, assistant, agent, agentic commerce; deflection.\n- Commerce protocol, MCP, ACP, UCP, AP2, mandate, seller of record, product feed, Web Bot Auth, trust tier.\n- Strong customer authentication, dynamic linking, passkey; the AI Act's Article 50; the consumer-law question of delegated buying.\n- The dated agentic-commerce events of September 2025 to November 2026 and the status of each protocol and program.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a proposal to build a shopping agent on stale data, the reader declines it in favour of readiness work and names what that work is, rather than choosing a protocol or a vendor. *Probe:* A Dutch outdoor brand's agency proposes a shopping agent on the storefront and native support for three agent-commerce protocols, so the brand is 'present when agents buy'. Its stock reaches the shop through an hourly copy from the warehouse, and its delivery promise is a fixed sentence in the theme. Using only this chapter: what should it do in 2027 instead, and why? | `custom` | cold_reader | major |\n| AC-2 | The reader can tell an assistant that proposes from one that writes, and states the rule that governs the second. *Probe:* A merchandiser wants to switch on 'auto-apply' for the admin AI assistant so it can fix negative stock figures before a campaign; until now the assistant only drafted product descriptions for review. Using only this chapter: what changes, and what should the rule be? | `custom` | cold_reader | major |\n| AC-3 | The reader can explain what European payment rules require of an agent purchase and what that means for the merchant's checkout. *Probe:* Using only this chapter: why can an agent not simply pay for a European shopper's cart, and what does that require of the merchant's systems? | `custom` | cold_reader | major |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What is AI doing in commerce as of November 2026, and what must a merchant have in place before an AI agent can buy from it?\n\n> **Claim:** AI in commerce is two things with different permissions: assistants that read and propose (search, content, service bots, fraud screening) and agents that act; an agent that can create a cart, an order or a refund is a new writer of the merchant's facts. With no live consumer agent checkout for European merchants in November 2026, a merchant first needs correct product, availability, delivery-promise and order-status answers from one owner by API, and an identity and policy for each agent.\n\n**Disputed by:** The view that agentic commerce is a channel to join early: build or buy a shopping agent or implement the new protocols in the storefront now, so the brand is present when shoppers start buying through AI assistants, and treat the data behind it as good enough.\n\n**So what:** A merchant that accepts the claim spends on the facts an agent asks for and on an agent policy before any agent, and holds at a correct feed and the platform's agent channel until a protocol is governed by a standards body and a European checkout program reports order volumes. Kestrel & Pine's February 2027 agent test asked five questions at 20:00 on 27 November 2026 and at 21:14 on 13 April 2027: two answers were wrong on the Oversell night and one on Eva's evening, and none came from a system that owned the fact. It declined the agency's shopping assistant (about €60,000 to build, €2,500 a month), kept the platform's AI channel for discovery only, and wrote W8, its agent-readiness decision, as prerequisites with owners and dates, with no write scope for any agent and every agent credential on the ownership map.\n\n**How and why:** An agent cannot negotiate: it reads a figure and shows or buys the product, so a stale stock copy becomes a promise a third party makes for the merchant. An agent that can create a cart, an order or a refund writes the same facts as every other system, so the one-writer rule and the ownership map apply to it. The channels changed within months (Instant Checkout launched in September 2025 and moved to Apps in March 2026), while the feeds ask for the same fields, so adapters over the merchant's own services make a protocol change a mapping change. In Europe the shopper still authenticates the exact amount and payee, so the cart must not change before authentication.\n\n**Supporting claims**\n\n- **S1** — AI in commerce is two things with different permissions: assistants read and propose, agents act; an assistant or agent that can create a cart, an order or a refund, or change stock, is a new writer of the merchant's facts and is governed like any other writer.\n- **S2** — The established uses (search and recommendations, product content, service bots, fraud screening, demand forecasting, visits referred by AI assistants) are real and dated, are measured mostly by their vendors, and each is only as good as the product, price, stock and order records behind it.\n- **S3** — As of November 2026 agentic commerce is real, early and volatile: the flagship in-chat checkout launched and was pulled back within six months, three protocols were published without standards-body governance, no party published a transaction count, and live consumer checkout is limited to the United States, Canada or Australia.\n- **S4** — In Europe the shopper still authenticates the exact cart (strong customer authentication with dynamic linking), the AI Act's Article 50 requires bots to say they are automated, consumer law treats the agent as the shopper's instrument only as a working assumption, and no live consumer channel lets an agent check out for a Dutch, Belgian or German merchant.\n- **S5** — Agent readiness is a data and API program: the five facts an agent asks for correct, from one owner and by API, plus an identity and a policy for every agent with no write scope on stock, prices or orders; a merchant holds at a correct feed and the platform's agent channel until a protocol is governed, a European checkout program reports volumes and its own answers are better than the platform's copy.\n\n## Role in the part\n\nExtends the part's ownership rule to the newest writer, separating assistants from agents, dating what is real in agentic commerce as of November 2026 and turning it into W8's readiness list, and performs the part's closing (the published chapter does not yet do so: it ends with one sentence on the oldest question in the book and a hand-off to Part XI). Supports P10-5 of part `part-10`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `large_to_small` in two-kinds to europe: the distinction, then what is real (established uses, admin assistants), then agentic commerce (story, protocols) and its European constraints; `chronological` in story: the fourteen months in date order)\n\nThe scene states the problem: three AI requests and data that would give an agent wrong answers. 'Two Kinds of AI' defines the distinction every later section uses. 'What AI Already Does' shows what is real; 'Assistants in the Admin' follows because the admin is the first place AI already writes, the step between reading and proposing and acting; before 'Agentic Commerce' and 'The Protocols' describe what is promised, dated so the volatility is the evidence. 'Europe' follows the protocols because its rules explain why the protocols' checkouts are not live for the book's merchant. The solution comes next: 'What a Merchant Must Have' needs the five questions of the scene and the two shapes of the story; 'Across Scale Stages' follows it directly, because its point is that the list stays the same while who assembles it changes; 'The Choices' then sets the postures on top of the list, using the stage names just placed, and leads straight into W8, the chosen posture at one merchant; 'In Practice' shows W8 at Kestrel & Pine's stage; 'When It Goes Wrong' comes last because each failure is read against the rules just set. Putting the protocols before the established uses would present beta specifications as the main story; putting the readiness list before Europe would leave the 2027 posture without its reason; putting W8 before the readiness list would show owners and dates for a list not yet explained.\n\n## Introduction\n\n**Hook** (`intriguing_example`): A shop can use AI to recommend a jacket, or authorize it to place an order for that jacket. A shopper can ignore a recommendation; placing the order can reserve stock and start a payment.\n\n**Bridge:** Anyone who has been asked whether the business is ready for shopping through ChatGPT, or offered an AI assistant by an agency, has met the difference between software that suggests and software that acts. → Chapter 44 gave every writer of a fact a row on the ownership map and a named owner; AI assistants and agents are the newest actors that read and write those facts.\n\n**Thesis statement** (KEY POINTS callout and paragraph p05): AI in commerce is two things with different permissions: assistants that read and propose and agents that act, and an agent that can create a cart, an order or a refund is a new writer. With no live consumer agent checkout for European merchants in November 2026, a merchant first needs correct product, availability, delivery-promise and order-status answers from one owner by API, and an identity and a policy for each agent.\n\n**Roadmap** (Paragraph p06):\n\n- Start with Kestrel & Pine's agent test. *Kept in:* scene.\n- Separate the two kinds of AI. *Kept in:* two-kinds.\n- Survey what AI already does in commerce and what admin assistants may change. *Kept in:* established, admin.\n- Tell agentic commerce's fourteen months in date order and explain the protocols. *Kept in:* story, protocols.\n- Set out Europe's payment, AI and consumer rules. *Kept in:* europe.\n- Set out the readiness list, the four scale stages and four postures. *Kept in:* readiness, stages, choices.\n- Show Kestrel & Pine's W8 and five ways agent work goes wrong. *Kept in:* practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A shop can use AI to recommend a jacket or authorize it to place the order: a shopper can ignore a recommendation, but an order reserves stock and starts a payment, so software that orders needs permissions, limits and an accountable owner who can investigate and correct a mistaken action. | scenario: A jacket recommended versus a jacket ordered by software. |  |\n| p02 | claim | Software that helps someone decide is an assistant and software given tools and permission to carry out the decision is an agent; both need reliable data, since with a two-hour-old stock count an assistant recommends and an agent orders a sold-out jacket, so before adding either the merchant establishes where product, price and stock answers come from and who may change them. |  | `elaboration`: The two uses of AI: recommending and ordering. → Their names (assistant, agent) and what both depend on: data with a known source and a known writer. |\n| p03 | context | In the order's journey an assistant and an agent can both appear: a shopper might ask an assistant for a waterproof jacket under €200 delivered by Thursday, and authorized software might place the order or later request an exchange; each step needs current product facts, a clear permission and a confirmed result. | scenario: A waterproof jacket under €200, delivered by Thursday; an order and an exchange placed by software. | `place`: The two uses of AI and the data both depend on. → Where in the order's journey an assistant or agent appears. |\n| p04 | context | Those permissions need owners: chapter 44 gave every writer of a fact a row on the ownership map and a named owner, AI assistants and agents are the newest actors that read and write the merchant's facts, and this chapter explains agentic commerce, software acting in a shopping or merchant workflow, and what the systems and owners must provide before an agent can buy, leaving agent design to the linked records. |  | `example`: Each step of the journey needs a clear permission; chapter 44's rule that every writer of a fact, whether a system, an integration or an app, has a row and a named owner. → AI assistants and agents as the newest actors that read and write the merchant's facts, and agentic commerce as the chapter's subject. |\n| p05 | claim | The chapter's claim: AI in commerce is two things with different permissions, assistants that read and propose and agents that act, and an agent that can create a cart, an order or a refund is a new writer; with no live consumer agent checkout for European merchants in November 2026, a merchant first needs correct product, availability, delivery-promise and order-status answers from one owner by API, and an identity and a policy for each agent. |  | `cause_effect`: Agents as new actors that read and write the merchant's facts. → The chapter's answer to what AI does and what must be in place before an agent buys. |\n| p06 | transition | The chapter starts with Kestrel & Pine's agent test, separates the two kinds of AI, surveys what AI already does and what admin assistants may change, tells agentic commerce's fourteen months in date order, explains the protocols and Europe's rules, then sets out the readiness list, the scale stages, four postures, Kestrel & Pine's W8 and five ways agent work goes wrong, before closing Part X; its evidence is dated vendor announcements and protocol specifications, EU law and legal commentary, and the agent test. |  | `sequence`: The chapter's claim. → The order in which the chapter argues it, and its evidence. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: The Agent Test\n\n**Controlling idea** (`example`, id `scene`): In February 2027 three AI requests reach Kestrel & Pine; Noor Visser tests the data first with five questions an agent asks, and the answers, wrong on the Oversell night and on Eva's evening and never from a system that owned the fact, become W8: agent readiness, not agents.\n\n**Advances the thesis** (S5): Gives the case the chapter generalizes: an agent would have broadcast the merchant's wrong answers, so readiness comes before agents.\n\n**Transition in:** `example`: The chapter's claim and roadmap. → Kestrel & Pine's three requests and Noor's test.\n\n**Order of paragraphs** (`problem_solution`): The requests first, then the test, its table and its verdict; the verdict comes last because it is W8.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | context | In February 2027 Kestrel & Pine faces three AI decisions: the agency's shopping assistant (€60,000 to build, €2,500 a month, illustrative), a board observer's question whether shoppers find the brand in ChatGPT, and an AI channel the platform vendor switched on by default with checkout limited to US shoppers. | fact: The agency's proposal (about €60,000 and €2,500 a month), the board observer's question, the vendor's default-on AI channel with US-only checkout. |  |\n| p08 | process | Head of Engineering Noor Visser tests the data before judging the proposals: five questions about the women's M Ridgewalker in moss at 20:00 on 27 November 2026, the Oversell night, and at 21:14 on 13 April 2027, Eva's order. | fact: The agent test: five questions at two dated moments. | `problem_solution`: Three requests to judge. → Noor's test of the data behind them. |\n| p09 | evidence | The answers must come from the shop platform, the WMS and the returns portal, joined by the iPaaS, with Waypoint adding a PIM and an OMS; the table shows which system answers each question today and whether the answer was true at each moment. | table: The five agent questions, the system that answers each today, and whether the answer was true on 27 November 2026 at 20:00 and on 13 April 2027 at 21:14 (no rating, stock copy up to two hours behind, a static delivery sentence, policies as page text, no single order-status answer). | `elaboration`: Five questions at two moments. → The systems that answer them and the result. |\n| p10 | claim | Two of five answers were wrong on the Oversell night and one on an ordinary evening, none from a system that owned the fact; an agent would have broadcast these errors, not fixed them, so Noor's memo became W8, agent readiness, not agents: the agency's assistant was declined and the AI channel kept for discovery only. | statistic: Two of five wrong on 27 November 2026, one of five on 13 April 2027, none from an owning system. | `cause_effect`: The table's answers. → What they mean for an agent, and W8. |\n\n### Two Kinds of AI, and Why the Difference Is Architectural\n\n**Controlling idea** (`definition`, id `two-kinds`): A model, an LLM, an assistant and an agent differ in what they may do: an agent has tools and permission to act, so the architectural question is which actions the software may carry out, governed by the same permission checks and records as any integration.\n\n**Advances the thesis** (S1): Defines the terms and the distinction the chapter is built on.\n\n**Transition in:** `elaboration`: Noor's test and W8. → The terms behind it: assistant and agent.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | Noor's test needs exact terms: a model produces an output from an input, an LLM reads and writes natural language, an assistant is an LLM in a product that helps a person, an agent is an assistant given tools and permission to use them, and agentic commerce is agents that discover, compare and buy on a shopper's behalf. |  |  |\n| p12 | claim | The architectural question is which actions the software may carry out: drafting differs from publishing and suggesting a refund from sending the money, so an agent uses the same permission checks as other integrations and its actions are recorded so its owner can explain and correct a mistaken commitment. | figure: Figure 1: the assistant reads the stock count and suggests; the agent changes it. | `cause_effect`: The definitions of assistant and agent. → Why the difference matters: permissions, owners and records. |\n\n### What AI Already Does in Commerce\n\n**Controlling idea** (`evidence`, id `established`): Six uses of AI are established in commerce, each with dated evidence mostly reported by vendors, and each depends on the merchant's product, price, stock and order records.\n\n**Advances the thesis** (S2): Shows what is real before the chapter turns to what is promised, and that every use rests on the merchant's records.\n\n**Transition in:** `example`: The distinction between assistants and agents. → What assistant-style AI already does in commerce.\n\n**Order of paragraphs** (`grouping`): Each use is described and then given its dated evidence; the five that help run the shop come before the one that brings shoppers, and the closing paragraph names what all six share.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | transition | AI already supports several everyday commerce jobs, all assistant work that reads and proposes: five run inside the merchant's own shop, and the sixth brings shoppers in from AI assistants outside it. |  |  |\n| p14 | description | Search finds products for a shopper's request and recommendations suggest others; AI matches meaning or learns from products bought together. |  | `sequence`: The list of uses. → The first use: search and recommendations. |\n| p15 | evidence | Amazon's dated record (2003; a 2019 history in which an early deep-learning model lost to the older method and a bestseller list) and Zalando's assistant (April 2023; over 22 million users by its 3 November 2026 release) show adoption, and teach that a new model should be compared with a simple alternative and that usage does not establish additional sales. | fact: Amazon 2003 and 2019; Zalando April 2023 and 3 November 2026, 22 million users. | `example`: Search and recommendations. → Dated evidence and its lessons. |\n| p16 | description | Content tools draft titles, descriptions and translations, and someone checks each draft against the product facts before publication, because fluent text can describe the wrong material. |  | `sequence`: Search and recommendations. → The second use: product content. |\n| p17 | evidence | Amazon reported over 100,000 sellers using its listing tools in September 2023, which shows adoption, not accuracy; reviewed text is saved in the authoritative product record so every channel publishes the same description. | statistic: More than 100,000 sellers, September 2023 (vendor figure). | `example`: Content drafted by AI. → A dated figure and where reviewed text is kept. |\n| p18 | description | A service bot answers routine questions such as where an order is, and needs current order, shipment and refund records, because a convincing reply from an old status creates another contact. |  | `sequence`: Product content. → The third use: service bots. |\n| p19 | evidence | Klarna reported 2.3 million bot conversations, two thirds of its chats, in February 2024 and said in May 2025 it was rehiring humans because quality was lower, so resolution is measured alongside deflection, the share of contacts handled without a person. | statistic: 2.3 million conversations, two thirds of chats (February 2024); rehiring humans (May 2025). | `example`: Service bots. → A dated case and the measure it teaches. |\n| p20 | description | Fraud models estimate whether a payment is suspicious, and the merchant or its PSP accepts, checks again or rejects, trading caught fraud against blocked customers. |  | `sequence`: Service bots. → The fourth use: fraud screening. |\n| p21 | evidence | Stripe's Radar claims a '32% average reduction in fraud' without false-positive rates, so the figure cannot show how many genuine purchases are blocked. | quotation: '32% average reduction in fraud' (Stripe Radar page, vendor claim). | `example`: Fraud screening. → A vendor claim and what it leaves out. |\n| p22 | description | Forecasting estimates demand for each product to plan replenishment, and needs sales and availability history, because low sales while a jacket was unavailable are not low demand. |  | `sequence`: Fraud screening. → The fifth use: demand forecasting. |\n| p23 | evidence | Amazon's DeepAR paper (2017) describes a forecasting method whose output informs a purchase proposal the merchant still decides, and conflicting stock records weaken the evidence behind that decision. | source: DeepAR, Salinas, Flunkert and Gasthaus, 2017. | `example`: Demand forecasting. → A dated method and its dependency on stock records. |\n| p24 | description | Shoppers can discover a product through an AI assistant and follow its link to the shop, a discovery channel whose value depends on the purchases those visitors make. |  | `sequence`: The five uses that help run the shop. → The sixth: visits referred by AI assistants. |\n| p25 | evidence | Adobe Analytics reported in January 2026 that such visits to US retail sites rose 693% in the 2025 holiday season from an unpublished, small base, so orders and their value are tracked as well as traffic. | statistic: 693% year on year, 2025 holiday season, from a small unpublished base. | `example`: AI-referred visits. → A dated figure and its limit. |\n| p26 | synthesis | Across these uses the merchant still needs reliable product, price, stock and order records, because rankings, generated text, risk scores and forecasts depend on them. |  | `conclusion_summary`: Six uses, each with its dated evidence. → What they share: they depend on the merchant's records. |\n\n### Assistants in the Admin: The Secret Agent Wears a Badge\n\n**Controlling idea** (`analysis`, id `admin`): Admin assistants that can apply changes become writers to the merchant's systems; they act through the platform's permissions with a review step that someone can switch off, and their reach ends where the platform's data ends, so one writer per fact still applies.\n\n**Advances the thesis** (S1): Shows the assistant-to-agent step inside the merchant's own admin, where the Secret Agent appears first.\n\n**Transition in:** `contrast`: AI that reads and proposes in six established uses. → AI in the admin that can apply changes.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | evidence | An admin assistant inspects records and proposes changes; when it can apply them it becomes another writer, and the dated record (Shopify's Sidekick from July 2023, with approval steps described in May 2025 and a vendor usage figure in Fall 2026; Shopware and Salesforce in mid-2026) shows the step being taken. | fact: Sidekick announced July 2023; 21 May 2025 capabilities 'with the merchant's approval'; help page on editing orders with review; Fall 2026 claim of sessions up 4.2 times (vendor figure); Shopware June 2026, Salesforce July 2026. |  |\n| p28 | analysis | All of them act through the platform's own APIs and permissions, describe a draft-and-review step and see only the platform's data; the review step is a default someone can switch off, and a merchandiser who lets an assistant clean up inventory recreates the App That Wrote Stock, so one writer per fact holds and an assistant is not it. |  | `conclusion_summary`: The dated admin assistants. → What they have in common and the risk it carries. |\n\n### Agentic Commerce: Fourteen Months, Told in Order\n\n**Controlling idea** (`evidence`, id `story`): From September 2025 to November 2026 the flagship in-chat checkout launched and retreated, three protocols appeared and no transaction count was published; two shapes remain, discovery with hand-off and checkout inside the channel, with different requirements.\n\n**Advances the thesis** (S3): Makes volatility the evidence rather than a disclaimer, and separates the two shapes a merchant must prepare for.\n\n**Transition in:** `contrast`: Admin assistants inside the merchant's own systems. → Agents outside them that find and buy for shoppers.\n\n**Order of paragraphs** (`chronological`): Dates in order show the volatility before the shapes are described; the shapes come last because they are what the events left standing.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | evidence | Agentic commerce puts agents outside the merchant's systems, finding and buying for shoppers: on 16 September 2025 Google announced AP2 with signed mandates (intent and cart), and on 29 September 2025 Stripe and OpenAI launched Instant Checkout in ChatGPT under ACP, a published checkout contract, for US users buying from US Etsy sellers with a payment token scoped to one merchant and one cart. | fact: AP2, 16 September 2025, more than 60 organizations; Instant Checkout and ACP, 29 September 2025. |  |\n| p30 | evidence | On 11 January 2026 Google and Shopify announced UCP, co-developed with Etsy, Wayfair, Target and Walmart, with checkout in Google's AI Mode and Gemini app for US shoppers, and Shopify later replaced its own agent interface, Storefront MCP (May 2025), with UCP endpoints. | fact: UCP, 11 January 2026. | `time`: AP2 and ACP in September 2025. → UCP in January 2026. |\n| p31 | evidence | On 6 and 12 March 2026 OpenAI moved Instant Checkout 'to Apps', turning ChatGPT into a discovery channel with checkout on the merchant's storefront, and on 3 November 2026 Zalando announced Zalando Extended with agent checkout planned for 2027. | quotation: 'evolving how we approach commerce in ChatGPT' (6 March 2026); 'is moving to Apps' (12 March); Zalando Extended (3 November 2026). | `time`: UCP in January 2026. → The March 2026 retreat and Zalando's November announcement. |\n| p32 | synthesis | In fourteen months the flagship checkout launched and retreated, three protocols appeared, Shopify swapped its own agent interface for UCP and no party published a transaction count, which makes this the book's most volatile part and the reason the chapter is dated to the day. |  | `conclusion_summary`: The dated events. → What the fourteen months add up to. |\n| p33 | transition | What the fourteen months left standing are two shapes of agentic commerce as of November 2026, and the difference decides what a merchant needs. | figure: Figure 2: discovery with hand-off needs a feed and a product URL; checkout inside the channel needs cart, checkout, order and payment-token APIs and an agent identity. | `cause_effect`: A volatile market. → The two shapes it has settled into. |\n| p34 | definition | In discovery with hand-off the agent shows the product and the shopper pays on the merchant's checkout, so the merchant needs only a correct, fresh product feed, a machine-readable export of the catalog; this is where a European merchant can be in 2026. |  | `sequence`: Two shapes. → The first: discovery with hand-off, and the product feed. |\n| p35 | definition | In checkout inside the channel the agent builds the cart and pays while the merchant remains seller of record (the party that legally sells, collects VAT and owes the withdrawal right), as in AI assistants such as Google's AI Mode and Gemini, Copilot and Meta's Muse for US shoppers, so the merchant needs cart, checkout, order and payment APIs and a way to know which agent is calling. |  | `contrast`: Discovery with hand-off. → Checkout inside the channel and what it requires. |\n\n### The Protocols in Plain Words\n\n**Controlling idea** (`explanation`, id `protocols`): The protocols form layers (MCP for tool calls, ACP and UCP for commerce operations, AP2 for payment authority, agent identity underneath), none is governed by a standards body, no checkout program has published volumes and Europe has only pilots.\n\n**Advances the thesis** (S3): Explains the names a merchant will be pitched and reads their status as evidence that the field is early.\n\n**Transition in:** `elaboration`: Checkout inside the channel, which needs APIs and an agent identity. → The protocols that define those APIs and that identity.\n\n**Order of paragraphs** (`small_to_large`): The concept of a commerce protocol first, then the layers from the transport up (MCP), through the commerce contracts (ACP, UCP, their overlap) and payment authority (AP2), to the identity layer they all assume, then the status of all of them in one table; the table comes last because it is read against the layers.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | definition | A commerce protocol is a published contract (feed, cart, checkout, order, payment token) that lets any agent talk to any merchant without a bespoke integration, as EDI does for orders between retailers and suppliers; four protocol names recur in layers, with agent identity as a fifth layer under them. | figure: Figure 3: MCP exposes tools; UCP or ACP define commerce operations; AP2 records payment authority; payment providers process money; request signatures identify the caller. |  |\n| p37 | definition | MCP is the transport by which an agent discovers and calls tools such as 'create cart', and it says nothing about what a cart is. |  | `sequence`: Four layers. → The first: MCP, the transport. |\n| p38 | definition | ACP is OpenAI and Stripe's specification (feed, checkout, delegated payment and, since April 2026, cart, orders and authentication), 'in beta', governed by its two founders, with a feed that 'currently targets the US'. | quotation: 'in beta'; 'currently targets the US'. | `sequence`: MCP. → ACP. |\n| p39 | definition | UCP describes catalog, cart, checkout, identity linking and order, with profiles that advertise supported versions, a published 2026-08-25 specification over REST and MCP, and a Google claim of 'hundreds of thousands' of enabled merchants that counts enabled, not transacting, merchants. | quotation: 'enables direct checkout for hundreds of thousands of brands and retailers' (Google, 16 September 2026). | `sequence`: ACP. → UCP. |\n| p40 | comparison | ACP and UCP overlap rather than divide the work, and their contracts differ, so supporting one does not support the other; the UCP appendix follows a purchase step by step. |  | `similarity`: ACP and UCP described one after the other. → How they relate: they overlap. |\n| p41 | definition | AP2 provides signed mandates recording what the shopper authorized, can be used by UCP through an optional extension, and does not itself process the charge. |  | `sequence`: The commerce protocols. → AP2, the payment-authority layer. |\n| p42 | definition | Agent identity is the layer the others assume: the merchant identifies the calling application, limits its permissions and ties each action to an owner, and the converging answer is Web Bot Auth, signed requests with published keys (an IETF working-group draft of 29 October 2026 behind Visa's, Mastercard's and Shopify's schemes, Shopify's with trust tiers, levels of access granted to an identified agent), while Amazon insists third-party agents 'operate openly'. | quotation: 'user agent headers alone are easily spoofed' (Cloudflare, May 2025); 'higher trust tiers unlock broader access, including direct checkout completion' (Shopify); 'operate openly' (Amazon). | `sequence`: AP2. → Agent identity, the layer the others assume. |\n| p43 | analysis | The status table of 7 November 2026 gives the status of the layers and of programs built on them, some missing from the timeline; every row is volatile, and read for its shape the table shows no protocol governed by a standards body, no checkout program with published volumes, and live European transactions only as pilots with the shopper present. | table: Status as of 7 November 2026: Instant Checkout, ACP, AP2, UCP, Shopify Agentic Storefronts, Visa and Mastercard programs, the Worldline and ING pilot, Zalando Extended, Web Bot Auth. | `conclusion_summary`: The four layers described. → The status of each protocol and program on one date. |\n\n### Europe: The Shopper Still Authenticates the Cart\n\n**Controlling idea** (`explanation`, id `europe`): In Europe strong customer authentication binds the shopper to the exact cart, the AI Act requires disclosure, consumer law is unsettled, and no live consumer channel lets an agent check out for a Dutch, Belgian or German merchant.\n\n**Advances the thesis** (S4): Turns the European rules into the constraint on the merchant's checkout and the reason for the 2027 posture.\n\n**Transition in:** `cause_effect`: Live European transactions only as pilots with the shopper present. → The payment rule that explains why, then the AI Act and consumer law.\n\n**Order of paragraphs** (`grouping`): Payment rules first because they constrain the checkout most, then the AI Act and consumer law, then the conclusion for a European merchant that rests on all three.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | explanation | The pilots keep the shopper present for a reason: under the technical standards of PSD2, the EU's second Payment Services Directive (Delegated Regulation 2018/389), a remote payment needs strong customer authentication, two of knowledge, possession and inherence, dynamically linked to one amount and payee, and no exemption was written for a delegated purchase whose amount is unknown when the shopper delegates. | quotation: 'any change to the amount or the payee results in the invalidation of the authentication code'. |  |\n| p46 | evidence | That is why the European pilots authenticate at the moment of purchase: Worldline and ING's June 2026 transaction completed only after the consumer approved it, and Visa's July 2026 pilot used a passkey for every purchase. | quotation: 'only after the consumer explicitly approved it' (Worldline, June 2026); passkey per purchase (Visa, July 2026). | `cause_effect`: Dynamic linking. → How the pilots comply. |\n| p47 | evidence | Osborne Clarke (March 2026) says agent payments remain subject to PSD2 with no special regime, and the PSD3 texts read for the book do not address agent-initiated payments. | quotation: 'remain subject to PSD2 and the RTS'; 'no special \"extra-regulatory\" regime'. | `additional_support`: The pilots' design. → The legal reading behind it. |\n| p48 | claim | So the cart the agent builds must equal the cart the shopper authenticates, with price, delivery promise and tax final before the mandate is signed, and unattended delegated purchases in the EU are unproven as of November 2026. | figure: Figure 4: the agent builds the cart, the merchant finalizes price and promise, the shopper authenticates that cart, the order carries the agent's identity. | `cause_effect`: SCA, the pilots and the law. → The consequence for the merchant's checkout. |\n| p49 | explanation | Payment rules are one constraint and the AI Act another: Regulation 2024/1689 applies generally from 2 August 2026, its Article 50 requires an AI system that interacts with people to say so unless obvious and generated content to be marked, and search and recommendations are not high-risk. | quotation: Article 50: 'unless this is obvious'; machine-readable marking. | `sequence`: Payment rules. → The AI Act. |\n| p50 | explanation | Consumer law has not settled who answers when an agent acts outside the shopper's terms: a CERRE paper of July 2026 says EU consumer law 'implicitly assumes' a human decides, and the protocols treat the agent as the consumer's instrument only as a working assumption. | quotation: 'implicitly assumes' (CERRE, July 2026). | `sequence`: The AI Act. → Consumer law. |\n| p51 | claim | Together these rules mean that for a Dutch, Belgian or German merchant in November 2026 no live consumer channel lets an agent complete a checkout, so the realistic 2026-2027 work is feed quality, discovery presence and payment-side readiness through the PSP and card networks. |  | `conclusion_summary`: Payment, AI and consumer rules. → What is live for a European merchant, and the work that follows. |\n\n### What a Merchant Must Have Before an Agent Can Buy\n\n**Controlling idea** (`recommendation`, id `readiness`): Agent readiness is the five facts an agent asks for, correct, owned by one system and served by API, plus an identity and a policy for every agent and an agentic marker on the order.\n\n**Advances the thesis** (S5): States the readiness list the thesis requires and shows it is mostly work the book has already described.\n\n**Transition in:** `problem_solution`: No live European agent checkout; the work is feed, discovery and payment-side readiness. → What that readiness consists of.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | claim | Agent readiness means the five facts an agent asks for are correct, owned by one system and served by API; the table gives each fact's owner after Waypoint and its freshness, consistency, latency and availability requirements. | table: Readiness requirements for product, availability, delivery promise, price and policy, and order status: owner after Waypoint, freshness, consistency, latency (assumptions), availability. |  |\n| p53 | analysis | Three observations carry the design: the feed is most of the work and the feed specifications ask for the same fields, with freshness in minutes as the new requirement; availability and the promise are the hard part and are not AI work, because an agent cannot negotiate; and order status is one API used three times. | fact: schema.org Product, Google Merchant Center, the ACP feed (nine required fields) and Shopify's catalog ask for the same fields. | `elaboration`: The readiness table. → The three observations that shape the design. |\n| p54 | recommendation | To the list the merchant adds an identity and a policy for every agent (verified at the CDN or platform, allowed actions per agent, no direct writes to stock, prices or orders) and an agentic marker on the order for service, fraud review and disclosure. |  | `additional_support`: The five facts. → The identity, policy and order marker that complete the list. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): The readiness list does not change with scale; who assembles it does, from the platform at the Starting stage to the merchant's own systems at the Omnichannel stage and a shared service at the Group stage, and the stage table gives each stage's typical AI use, what becomes necessary and the warning signs.\n\n**Advances the thesis** (S5): Lets the reader place the posture and readiness work at their own stage.\n\n**Transition in:** `elaboration`: The readiness list. → Who assembles it at each scale stage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p57 | comparison | The stage table gives each stage's typical AI use, what becomes necessary and the warning signs, and shows that the readiness list stays the same while who assembles it moves from the platform to the merchant to a shared service. | table: Starting, Growing, Omnichannel (Kestrel & Pine), Group: typical AI use, what becomes necessary, warning signs. |  |\n\n### The Choices and Their Trade-offs\n\n**Controlling idea** (`comparison`, id `choices`): Four cumulative postures exist (a correct feed, the platform's agent channel, an agent gateway over the merchant's services, an own shopping agent); a merchant should hold at the first two until governance, European volumes and its own better answers exist.\n\n**Advances the thesis** (S5): Turns the readiness list into a choice of posture and a recommendation with conditions for changing it.\n\n**Transition in:** `sequence`: The readiness list and who assembles it at each stage. → The posture a merchant chooses on top of it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55 | comparison | The four postures are cumulative: a correct feed; the platform's agent channel, which carries protocol churn but sells the platform's availability copy; a gateway of adapters over the merchant's services, so a protocol change is a mapping change; and an own shopping agent, which a fourteen-person team should not build when OpenAI retreated from owning checkout. | table: Four postures: what you build, what you depend on, when it fits, when it limits.; figure: Figure 5: adapters per channel over one internal commerce API. |  |\n| p56 | recommendation | The author would hold a merchant at the first two postures until a protocol has stable governance, a European checkout program publishes volumes and the merchant's own availability and order answers beat the platform's copy, revisiting in mid-2027, and lists what not to build yet. |  | `cause_effect`: The four postures and their limits. → Which to choose now and what not to build. |\n\n### In Practice: Waypoint's W8 at Kestrel & Pine\n\n**Controlling idea** (`example`, id `practice`): W8 records agent readiness as prerequisites with owners and dates, and its policy line extends the ownership map to agents: an agent is an integration, with no write scope on stock, prices or orders.\n\n**Advances the thesis** (S1, S5): Shows the readiness list and the one-writer rule as one merchant's dated decision.\n\n**Transition in:** `example`: The recommended posture and what not to build. → Kestrel & Pine's W8 at the Omnichannel stage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p58 | example | W8 is written as prerequisites with owners and dates (product data through the PIM, availability through the availability service, a computed delivery promise, order status on the OMS, an agent policy and AI disclosure) and a sentence about what will not be built. | table: W8: prerequisite, owner, delivery date, how an agent sees it (Teun Baas Q3 2027; Daniel Okafor and Ruben Alves Q4 2027; Noor Visser 2028; the Fulfil and Return team Q4 2027; Milan Petrov and Ruben Alves April 2027; the Buy team April 2027). |  |\n| p59 | claim | The policy line mattered most: W8 extends the ownership map to agents by one rule, an agent is an integration with a row, an owner, a contract, a pinned API version (one fixed version, changed only on purpose) and a reconciliation; in June 2027 the agency also ran a trial of an admin assistant, a different product from the declined shopping assistant, under it with auto-apply disabled, and W8 records what is not built in 2027 and the 2028 gateway plan. | statistic: June 2027 trial: about 1,400 descriptions drafted, about 60% accepted unchanged, no access to stock (illustrative).; figure: Figure 6: an agent's row on the ownership map. | `emphasis`: The W8 prerequisites. → The policy line and the rule it states. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `wrong`): Five failures recur in agent work (an assistant with a write scope, a stale feed, duplicate orders from retries, cart drift before authentication, a protocol pulled back), each with a detection and a remedy already in the book.\n\n**Advances the thesis** (S1, S4, S5): Shows that the readiness list and the one-writer rule are what prevent the failures agents bring.\n\n**Transition in:** `contrast`: W8 as designed. → Five recurring failures when its rules are missing.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p60 | example | When W8's rules are missing agent work fails in five recurring ways, the first an assistant given auto-apply to fix negative stock that writes quantities while the WMS feed also writes them, the App That Wrote Stock again; the weekly reconciliation detects it, and the remedy is revoke, overwrite from the system of record and put the credential on the ownership map. | scenario: Auto-apply on an admin assistant before a campaign. |  |\n| p61 | example | A feed rebuilt nightly from the platform's stock copy shows a product sold out at 19:40 in stock until morning; a feed-freshness monitor detects it, and the remedy is availability from the availability service, refreshed in minutes, with 'check at checkout' when it is down. | scenario: A nightly feed and a 19:40 sell-out. | `sequence`: An assistant that writes. → A feed that is stale. |\n| p62 | example | An agent's retried checkout call creates two orders unless every cart and checkout call carries an idempotency key, with a daily match of agent orders to PSP authorizations. | scenario: A timed-out checkout call, retried. | `sequence`: A stale feed. → Duplicate orders from retries. |\n| p63 | example | If the promotion ends between the agent's quote and the shopper's authentication, dynamic linking voids the authentication, so price, promise and tax are held for the authentication window, re-quoted rather than silently charged, and the mandate reference and agent identity stored with the order. | scenario: €199 with Thursday delivery, then a promotion ends. | `sequence`: Duplicate orders. → Cart drift before authentication. |\n| p64 | example | A channel built against can disappear or change within a year, as Instant Checkout did in six months and Storefront MCP within twelve, the Pulled Rug at protocol scale, and the remedy is adapters over one internal API and a contract card per channel. | case: Instant Checkout (six months) and Storefront MCP (twelve months). | `sequence`: Cart drift. → A protocol pulled back. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The jacket an assistant recommends and an agent orders needs the same five answers; the protocols for the second changed within months and none is live for a European merchant, while the answers stay the same. So the work that pays under any protocol is the readiness list, and every agent is admitted as an integration. For the part: the platform review, the migrations, the stage map, the ownership map and the agent policy each came down to naming which system or person owns a fact or a join, and when that changes.\n\n**So what:** A merchant spends on the facts an agent asks for and on an agent policy before any agent, and holds at a correct feed and the platform's channel until governance and European volumes exist; for the part, any proposal (a new platform, a reorganization, an agent) is tested by which fact's owner it changes and whether the shape of the business has changed enough to make it due, which at Kestrel & Pine cost about €1.33 million over three years instead of about €3.2 million.\n\n**Callback:** The chapter's opening jacket, recommended or ordered by software; and the Part X opening's merchant that adds a store, a channel or a brand and finds its systems still running but now required to share stock and coordinate orders they were never designed for. p65 returns to the jacket and Noor's test; p70, under the heading Closing Part X, returns to the part opening's merchant and reads the five decisions as one act; p71 performs the part closing's so-what and take-away.\n\n**Takeaway** (`course_of_action`): Before the next change of shape, write a stage map that marks the leftovers to retire and an ownership map with a named owner and one writer per fact for every system, integration, app and agent, and date each decision record for review at the next transition.\n\n**Hand-off** to [Part XI — PRACTICE: How Others Built It](part-11.html): `additional_support`: The book's argument, made so far with a fictional merchant and dated examples. → Four real cases read in full against that argument.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p65 | synthesis | The jacket an assistant recommends and an agent orders needs the same five answers, which at Kestrel & Pine were wrong on the Oversell night; the protocols changed within months while the answers stay the same, so the work that pays under any protocol is each fact from one owner by API and every agent admitted as an integration with no write scope on stock, prices or orders. | reasoning: The hook's jacket, the agent test's two wrong answers, the fourteen months of protocol change, W8. |  |\n| p66 | synthesis | Established: AI has two kinds, assistants that propose and agents that act and so add a writer; as of 7 November 2026 agentic commerce has three ungoverned protocols, a checkout pulled back and no published volumes; EU payment rules bind agents to the exact cart and Article 50 requires disclosure; feeds ask for the same fields and agent identity is converging on signed requests. |  | `conclusion_summary`: The chapter's answer in one paragraph. → The points that are established. |\n| p67 | synthesis | Depends on context: switching on the platform's agent channel depends on whether its availability copy is the stock owner's truth, building a gateway on owning better truth than the platform and on a European checkout program, and how much an admin assistant may apply without review on the fact it touches. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p68 | recommendation | The author's synthesis: agent readiness is the same program as fixing the Phantom Stock and Schrödinger's Order, every agent is an integration, and for a European merchant in 2027 the honest plan is feed, discovery, payment-side readiness and a mid-2027 review. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labeled as such. |\n| p69 | recommendation (list) | Eight questions apply the chapter to the reader's own systems: who owns each of the five facts and can serve it by API, how old the feed's stock figure is, which agent channels are on by default, whether any agent holds a write scope, whether retries create two orders, whether the authenticated cart equals the agent's, whether bots disclose, and when the protocol table is re-checked. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own business. |\n| p70 | synthesis | This chapter closes Part X, which opened with a merchant whose systems still run but must now share stock and coordinate orders: its five decisions look like decisions about vendors, projects, growth, people and AI, but at Kestrel & Pine each named which system or person owns a fact or a join and when that changes (W4 kept the shop platform and took the joins, the PIM and OMS moved in seam by seam, the stage map traced eight of ten incidents to Growing-stage designs, the ownership map gave most unowned integrations an owner, and W8 gave the agent a row and no write scope). | reasoning: W4 (about €1.33 million over 2027-2029); PIM consumers from August and September 2027 and D2C orders through the OMS from 13 October 2027 with a freeze around Black Friday; eight of ten incidents to Growing-stage designs; 13 of 34 integrations unowned in January 2027, 5 in April; W8. | `emphasis`: The chapter's questions. → The part's synthesis, under the heading Closing Part X. |\n| p71 | recommendation | A merchant facing its next change of shape tests any proposal, a new platform, a reorganization or an agent, by which fact's owner it changes and whether the shape has changed enough to make it due, which cost Kestrel & Pine about €1.33 million over three years instead of about €3.2 million, and applies both questions by writing a stage map that marks the leftovers to retire and an ownership map with a named owner and one writer per fact for every system, integration, app and agent, each decision dated for review. | statistic: About €1.33 million over 2027-2029 for stay and surround against about €3.2 million for the composable rebuild; W4 reviewed in 2029. | `cause_effect`: The five decisions as one act. → What a merchant does with that. |\n| p73 | transition | Part X ends with the newest kind of actor asking the oldest question in the book, who may make which promise and which system has to keep it; the book has argued with a fictional merchant and dated examples, and Part XI reads four real cases in full against that argument, starting with the platform that serves millions of merchants on one codebase. |  | `additional_support`: The book's argument, made so far with a fictional merchant and dated examples. → Four real cases read in full against that argument. |\n\n## Non-goals\n\n- AI-assisted search mechanics (vector search, hybrid retrieval, measuring search). See [Finding the Product: Search, Navigation and Merchandising](commerce-search-and-discovery.html).\n- App scopes, the writer problem and the app governance card; the ownership map itself. See [Apps, Plugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html), [Who Builds and Who Owns: Teams, Vendors, Agencies and Governance](organizing-commerce-engineering.html).\n- Bot defense, card testing and admin security; the regulatory calendar as a whole. See [Protecting the Shop: Card Data, Account Takeover, Bots and Skimmers](commerce-security.html), [Rules Turned Into Requirements: Consumer, Payment, Invoicing and Platform Regulation](commerce-regulation.html).\n- Available-to-promise and the computed delivery promise as designs; idempotency and reconciliation. See [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html), [Getting It There: Carriers, Labels, Tracking and the Delivery Promise](shipping-and-delivery.html), [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html).\n- How an agent is built (tool calling, planning, sandboxing, human oversight). See [Tool Ecosystems, MCP and the Tool Broker](../agentic-systems-architecture/tool-ecosystems-and-mcp.html), [Side Effects: When Agents Touch the World](../agentic-systems-architecture/side-effects-and-external-actions.html), [Agent Identity, Delegation and Least Privilege](../agentic-systems-architecture/agent-identity-and-least-privilege.html), Architecting Agentic Systems (sibling book).\n- Shopify's agent surface, Amazon's and Zalando's agents as cases. See [Case: Shopify, the Modular Monolith That Serves Millions of Merchants](case-shopify.html),
