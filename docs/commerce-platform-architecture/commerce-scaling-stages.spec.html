<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/43-commerce-scaling-stages/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (a thesis paragraph, a roadmap and a conclusion paragraph that answers the opening); two Group-stage paragraphs that made one point are merged. These are recorded in decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The four stages (Starting, Growing, Omnichannel, Group) as shapes of channels and stock locations, with revenue bands as rough markers only, and the map of what is typical and what becomes necessary at each: where the order and stock truth live, product data, fulfillment, finance, integration style, who builds and runs, fees met, peak day, decisions due and failure patterns.\n- **Know:** How fresh each fact must be at each stage, the Group stage's share-or-separate table per capability, and the transition signals (a fee cliff, a second stock location, a retail chain asking for EDI, two order counts, a connector without an owner, support opening several systems, an app writing a fact another system owns, a first peak-day integration failure, a second brand).\n- **Know:** Kestrel & Pine's path priced: Starting 2016–2018, Growing 2019–2022, Omnichannel since 2023; the April 2027 stage map, which maps its thirteen systems to their stages, attributes eight of its ten incidents to Growing-stage designs, finds six signals in 2026 and defers the Group stage to the 2029 review because no stage-4 signal is planned for 2027–2028.\n- **Believe:** A stage is a shape, not a revenue number.\n- **Believe:** Most incidents at a stage are designs from the stage before still running; the leftover, not the missing tool, is what fails.\n- **Believe:** Two transition signals in one year mean the stage has changed, whatever the revenue says.\n- **Be able to:** Place a merchant on the map by its channels and stock locations and list which stage each of its systems was bought for.\n- **Be able to:** Sort a program's decisions into those for the current stage, those left from the last one and those copied from a larger company, and say for a group which capabilities to share.\n\n**Audience:** Newcomers to commerce architecture; most of all the engineering lead or architect who, like Noor Visser, inherits systems bought at earlier stages and must explain to a board which decisions belong to the company it is now. Product managers and consultants who need to read a vendor's price list as a map of expectations are the second readers.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its ten incidents of 2026 and early 2027 in outline (among them the Black Friday Oversell, the Three-Status Order, the Price Drift, the ASN Chargeback, the Store Stock Mirage, the App That Wrote Stock and the Deprecated Endpoint) and the names of the sixteen failure patterns.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines, 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, the business models and the four scale stages (Starting, Growing, Omnichannel, Group) with Kestrel & Pine's years, the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system (OMS), availability service, D2C, B2B, PIM, POS.\n- From Parts II and III: one owning system per product attribute; prices frozen at order placement; available-to-promise; one order record with an OMS once two of four conditions hold; the monthly match of invoices, payouts and bank lines.\n- From chapters 41 and 42: W4, stay and surround (keep the shop platform, buy the hubs beside it, own the joins), and migrations moved one seam at a time, named there as the moments a merchant moves from one stage to the next.\n\n**Does not yet know:**\n\n- Stock location as a counting unit of a stage; GMV; fee cliffs and plan thresholds as transition signals.\n- The transition-signal rule (two signals in one year) and the three directions of a stage mismatch (too early, too late, sideways).\n- The Group stage's share-or-separate question and the public group evidence (VF Corporation, Zalando and ABOUT YOU, Jacobs 2020, Uber 2020).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a merchant whose revenue says one stage and whose shape says another, the reader places it by shape and names the decision due, rather than by revenue or by adding a tool. *Probe:* A brand with €15M revenue runs a web shop, two stores, wholesale including EDI with one retail chain, and a marketplace, all from one warehouse whose stock its ERP copies to the shop every hour. This year it held its first 'which number is right' meeting and had its first peak-day integration failure. Its board calls it a Growing business. Using only this chapter: which stage is it in, and what should it decide first? | `custom` | cold_reader | major |\n| AC-2 | Given a group adding a brand, the reader decides capability by capability what to share, rather than one stack or full separation. *Probe:* A group acquires a second outdoor brand that runs its own stack. Using only this chapter: which capabilities should the group share, which may stay separate, and how should it proceed? | `custom` | cold_reader | major |\n| AC-3 | The reader can explain why a merchant's current-stage incidents are attributed to the stage before, and what that changes in its program. *Probe:* Kestrel & Pine's incidents of 2026 and early 2027 happened while it was an Omnichannel business. Using only this chapter: why does the stage map attribute most of them to the Growing stage, and what follows for Waypoint? | `custom` | cold_reader | major |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** Which architecture decisions change as a business grows, and what are the signs that a stage is ending?\n\n> **Claim:** A scale stage is a shape (the channels that sell, the locations that hold stock), not a revenue band. Each stage moves the order record, stock record and integration style to a system that owns each fact, and retires the previous stage's systems, which still run on its assumptions. A stage is ending when two signals of a new shape, such as a second stock location or a connector nobody owns, arrive in one year.\n\n**Disputed by:** The view that a business grows along a revenue line and its architecture should be scaled up when volume demands it: buy the systems that companies in the next revenue band use, and keep what works until it breaks under load.\n\n**So what:** A merchant that accepts the claim places itself by shape, retires the previous stage's leftovers before adding tools, and sorts each decision by the stage it belongs to. Kestrel & Pine's April 2027 stage map found it had been in the Omnichannel stage since 2023, attributed eight of its ten incidents to Growing-stage designs still running in 2026, counted six transition signals in 2026, and deferred Group-stage questions to the 2029 review because none of their signals (a second brand, a fourth country, revenue past about €200M) is planned for 2027–2028. Waypoint, its 2027 improvement program, spends €1.1M on the Omnichannel hubs and retires the hourly chain. The fee cliff that matters most to it is payments, not the platform plan: on €27.0M of online revenue each half percentage point of payment cost is about €135,000 a year.\n\n**How and why:** Each channel or stock location added multiplies the systems that must agree about the same stock, order and product facts, so the same fact must travel faster and more reliably at each stage: from the platform's own count, to a scheduled copy from the ERP, to an availability service fed by stock events. Systems are bought when a channel arrives, by whoever is available, with that moment's assumptions (one store, a few marketplace orders a day), and because they keep working nobody retires them; under the next stage's load the assumption fails at the join. Vendors tier their prices on volume and shape, so fee cliffs and plan thresholds mark a transition before an incident does. Each signal is either a new channel or stock location the existing joins were not built for, or a join already slipping (a connector without an owner, two counts of one fact); one can be a one-off, but two in one year (the author's rule) mean the channels and the joins have both changed.\n\n**Supporting claims**\n\n- **S1** — A scale stage is a shape of business (how many channels sell and how many locations hold stock, and at the Group stage how many brands or units share them), not a revenue band; revenue bands are only markers, and vendors' price tiers and fee cliffs mark the same shape changes.\n- **S2** — At each stage the order record, the stock record and the integration style move toward a hub that owns each fact, because the same fact must reach more systems faster and more reliably: the platform's own count, then a scheduled copy, then an availability service fed by events.\n- **S3** — Systems are bought for the stage the business is in and keep running into the next one; those leftovers are where the next stage's incidents come from (eight of Kestrel & Pine's ten), so the decision at a transition is which leftovers to retire, and a stage mismatch fails too early, too late or sideways.\n- **S4** — The signals of a transition (a fee cliff, a second stock location, an EDI request, two order counts, an unowned connector, a first peak-day integration failure, a second brand) arrive before the incidents, and two in one year mean the stage has changed.\n- **S5** — At the Group stage the question is no longer which systems but which are shared, answered capability by capability with conditions, because forcing one stack and keeping everything apart both fail.\n\n## Role in the part\n\nGives the part its rule about timing: one map of the four stages, the signals that a stage is ending and the Group stage's share-or-separate table, with Kestrel & Pine's April 2027 stage map tracing its incidents to leftovers from the stage before. Supports P10-3 of part `part-10`.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `problem_solution` in scene: the board's question and the stage map's answer, which the chapter then generalizes; `chronological` in stages and practice: the stages in the order a business meets them, and Kestrel & Pine's path from 2016 to 2027)\n\nThe scene ('Setting the Scene') gives the board's question and the stage map's uncomfortable row, so the reader knows what the chapter must explain. 'What a Scale Stage Is' defines the unit the map is drawn in; 'The Map' then sets all four stages side by side before any is examined, and 'How Fresh Must a Fact Be?' explains the map's main movement (records moving to hubs) by the requirement behind it. 'Stage by Stage' goes from the whole to each part, in the order a business meets the stages, and its Group section raises the share-or-separate question that 'The Group's Decision Table' answers next to it. 'The Transition Signals' gathers the ending signals each stage named into one table and the two-signal rule, which needs every stage told first. 'In Practice' prices one merchant's whole path, which needs the stages and signals; 'When It Goes Wrong' comes last because each direction of failure (too early, too late, sideways) is read against the stages and the table. Putting 'How Fresh Must a Fact Be?' after the stage sections would leave the map's movement toward hubs unexplained while each stage relies on it; folding the decision table into the Group stage's section would bury the chapter's one recommendation table among the evidence. Putting the map after 'Stage by Stage' would leave the stage sections without the frame they fill in; putting the signals before the stages would list endings of stages not yet described; putting 'In Practice' first would price leftovers the reader cannot yet place.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A merchant opens its first store while still selling online: the servers have room to spare, but stock now sits in two places and either channel may fulfill an order, so systems built for one warehouse must coordinate decisions they were never designed for.\n\n**Bridge:** Anyone who has watched a small business add a shop, a wholesale customer or a marketplace knows that the work changes before the volume does. → Chapter 42's migrations are how a merchant crosses from one such shape to the next; the stages themselves say which decisions each shape makes necessary and how to see the next one coming.\n\n**Thesis statement** (KEY POINTS callout and paragraph p05): A stage is a shape (how many channels sell and how many locations hold stock), not a revenue band. At each stage the order record, stock record and integration style move toward a hub that owns each fact, while the systems bought for the previous stage keep running (at Kestrel & Pine they caused eight of the ten incidents) and are retired at the transition. Two transition signals in one year mean a stage is ending.\n\n**Roadmap** (Paragraph p06):\n\n- Start from the one-page stage map the board asks Noor Visser for. *Kept in:* scene.\n- Define a stage and check the definition against vendors' price lists. *Kept in:* definition.\n- Set the four stages side by side and say how fresh each fact must be at each. *Kept in:* map, freshness.\n- Go through the stages one by one and give the Group stage a table of what to share and what to keep separate. *Kept in:* stages, group-table.\n- List the signals that a stage is ending. *Kept in:* signals.\n- Price Kestrel & Pine's path and end with the three ways a stage mismatch goes wrong. *Kept in:* practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A merchant that opens its first store has stock in two places and new decisions to coordinate before its servers are strained; a first wholesale customer, marketplace or second brand does the same, often before volume is a problem. | scenario: A first store beside the web shop: stock in two places, either channel may fulfill. |  |\n| p02 | context | Chapter 42 called migrations the moments a merchant moves from one stage to the next; this chapter looks at the stages themselves, the book's four (Starting, Growing, Omnichannel, Group), brought into one map to recognize transitions, not to copy a larger company's system list. |  | `elaboration`: The merchant whose shape has changed, and chapter 42's migrations as the moments of moving stage. → The four stages and the map that brings their decisions together. |\n| p03 | context | The stages combine common practice, dated vendor evidence and the fictional example; they are not validated revenue thresholds, because no public survey of system counts or team sizes by revenue was found. |  | `elaboration`: The four stages. → What they rest on and what they are not. |\n| p04 | context | The stages show up even in a single order: Eva's order at Kestrel & Pine crosses systems bought at different stages (the shop platform in 2016, the marketplace connector in 2021, warehouse and finance systems in 2023, the returns portal in 2025), each still carrying the assumptions of its time. | scenario: Eva's jacket order and the years of the systems it crosses. | `example`: Stages as the setting for decisions. → Where the stages show in the order's journey. |\n| p05 | claim | The chapter's claim: a stage is a shape (channels that sell and locations that hold stock), not a revenue band; at each stage the order record, stock record and integration style move toward a hub that owns each fact, while systems bought for the previous stage keep running with their old assumptions and, at Kestrel & Pine, caused most of the incidents, so they are retired at the transition; two transition signals in one year mean a stage is ending. |  | `elaboration`: Systems that carry the assumptions of the stage they were bought for. → The claim that starts from those assumptions: what changes at each stage and how to see a stage ending. |\n| p06 | transition | The chapter starts from the board's stage map, defines a stage and checks it against vendors' price lists, sets the four stages side by side and says how fresh each fact must be, goes stage by stage with the Group stage's share-or-separate table, lists the transition signals, prices Kestrel & Pine's path and ends with too early, too late and sideways; its evidence is the stage map and costs, dated vendor price lists and annual reports and engineering accounts of larger companies. |  | `sequence`: The chapter's claim. → The order in which the chapter argues it, and its evidence. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: The Stage Map\n\n**Controlling idea** (`example`, id `scene`): In April 2027 the board asks Noor Visser for a one-page stage map; it places Kestrel & Pine in the Omnichannel stage since 2023, keeps Waypoint on that stage's problems and defers the Group stage to 2029, and its uncomfortable row traces eight of the ten incidents to Growing-stage designs still running.\n\n**Advances the thesis** (S3, S4): Gives the case the chapter generalizes: a company that moved stage while its architecture did not, and the signals that would move it again.\n\n**Transition in:** `example`: The roadmap, which starts from the board's stage map. → Kestrel & Pine in April 2027.\n\n**Order of paragraphs** (`problem_solution`): The board's question first, then Noor's placement and the signals of the next stage, then the uncomfortable entry (eight of ten incidents from Growing-stage leftovers), and last what Waypoint does and defers because of it. The decision follows its reason, so a reader never meets a 'therefore' before the evidence.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | context | In April 2027 the board asks Head of Engineering Noor Visser for a one-page stage map that shows which of Waypoint's planned fixes suit the company now and what would make them worth revisiting. | fact: April 2027; the board asks Noor Visser for a one-page stage map; Waypoint launched March 2027. |  |\n| p08 | evidence | Noor places Kestrel & Pine in the Omnichannel stage since 2023, maps its thirteen systems to the stages they came from, and names the Group-stage signals (a second brand, a fourth country, revenue past about €200 million), none planned for 2027–2028. | fact: Stage 3 since 2023; thirteen systems mapped to their stages; stage-4 signals, none planned for 2027–2028. | `problem_solution`: The board's question. → Noor's placement and the next stage's signals. |\n| p10 | evidence | The map's uncomfortable row attributes eight of the ten incidents of 2026 and early 2027 to Growing-stage designs still running (the hourly stock sync, one-channel agency scripts, the ERP as hub for stock it did not hold, the nightly POS sync), the Black Friday Oversell the costliest: the company had moved stage and the architecture had not. | statistic: Eight of ten incidents to Growing-stage (2019–2022) designs; the Black Friday Oversell, 1,340 units, 1,120 orders, about €96,000.; figure: Figure 1: an omnichannel building on three cracked supports labeled hourly sync, agency scripts and ERP as hub. | `contrast`: Noor's placement of the company in the Omnichannel stage. → The uncomfortable entry: the incidents came from the stage before. |\n| p09 | claim | So Waypoint retires those leftovers, adding an OMS, a PIM and an availability service for today's coordination problems, and defers group-wide choices to the 2029 review. |  | `cause_effect`: The Growing-stage leftovers behind eight of ten incidents, and no Group-stage signal planned. → What Waypoint does and what it defers. |\n\n### What a Scale Stage Is, and Is Not\n\n**Controlling idea** (`definition`, id `definition`): A scale stage is a shape defined by how many channels sell and how many locations hold stock; revenue bands are markers, vendors' price tiers confirm the shape, and a stage is not a target or a verdict.\n\n**Advances the thesis** (S1): Defines the stage as a shape and shows vendors tiering on the same shape changes.\n\n**Transition in:** `elaboration`: The stage map's placement of Kestrel & Pine by shape. → What a stage is, defined.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The definition first, then the book's stage table, then the vendors' price lists that support it, then what a stage is not, so the reader does not take the definition as a ranking.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | A stage is a shape defined by the number of channels and stock locations, because those two numbers decide how many systems must agree about the same facts: one channel and one location need no integration, four and four need every system to learn what every other has sold or moved. | figure: Figure 2: one channel and one stockroom beside four channels and four locations joined by a dense web. |  |\n| p12 | evidence | The book's stage table gives each stage its typical size, shape and Kestrel & Pine's years, with revenue bands as rough markers. | table: Four stages with typical size, shape and Kestrel & Pine's years (2016–2018, 2019–2022, 2023 to now, not yet). | `elaboration`: The definition. → The four stages as the book defined them in chapter 2. |\n| p13 | evidence | Vendors' price lists mark the same transitions: their tiers rise with volume but each assumes a different kind of merchant, as Shopify's euro pricing tiers its plans and its fee for a third-party payment provider by size (Basic at €21 a month to Plus from €2,100; the fee from 2% to 0.2%), with different decisions to make. | fact: Shopify pricing (EUR), accessed November 2026: Basic €21 a month paid yearly, Plus from €2,100; third-party gateway fee 2% on Basic, 0.2% on Plus. | `additional_support`: Stages as shapes. → A vendor's price list that tiers on the same changes. |\n| p14 | evidence | Other vendors tier on GMV, the value of orders through a platform before refunds and the vendor's cut: Shopware bases its plans on it with a paid plan above €1 million, and BigCommerce assigns tiers by trailing-twelve-month GMV and auto-upgrades at $2 million. | fact: Shopware pricing (accessed November 2026): paid plan above €1M GMV in a rolling year; BigCommerce (accessed November 2026): tiers by trailing-twelve-month GMV, auto-upgrade at $2M. | `additional_support`: Shopify's tiers. → GMV, glossed, and two more vendors that tier on it. |\n| p15 | analysis | The vendors' numbers change often, but the mechanism does not: a vendor's tiers map which decisions it expects at which size. |  | `conclusion_summary`: Three vendors' tiers. → The lesson of the tiers. |\n| p16 | definition | A stage is not a target, a maturity score or a verdict: a merchant can stay at the Growing stage profitably, and the stage only says which problems are now its own. |  | `contrast`: What a stage is. → What it is not. |\n\n### The Map: Four Stages Side by Side\n\n**Controlling idea** (`comparison`, id `map`): One map sets the four stages side by side on fifteen questions; read across it, the order and stock records move toward a hub, the integration style changes faster than the systems, and the failure patterns cluster by stage.\n\n**Advances the thesis** (S1, S2): Shows, row by row, what is typical and necessary at each shape and the movement toward hubs.\n\n**Transition in:** `elaboration`: The definition of a stage. → What is typical and necessary at each of the four.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | comparison | The chapter's centerpiece map gives, for each stage, the shape, channels, storefront, where the order and stock truth live, product data, fulfillment, finance, integration style, who builds and runs, fees, peak day, necessary decisions, failure patterns, ending signals and Kestrel & Pine's years, each row linked to the chapter that owns it. | table: The stage map: fifteen rows by four stages, with the owning chapter linked in each row; WMS, PSP, iPaaS, SSCC and B2B2C glossed before it. |  |\n| p18 | analysis | Three things stand out: the order and stock records move from 'the platform knows' to 'a hub knows', the integration style changes faster than the systems, and the failure patterns are stage-specific, clustering where one fact first lives in four systems. | figure: Figure 3: each stage entered by adding a channel or a stock location and carrying the previous stage's systems; a dotted arrow where eight of Kestrel & Pine's ten incidents came from. | `conclusion_summary`: The map's rows. → What the rows show when read across. |\n\n### How Fresh Must a Fact Be? Requirements by Stage\n\n**Controlling idea** (`explanation`, id `freshness`): Stock, order status and price must travel faster and more reliably at each stage, so a requirement met for free with one writer becomes an engineering problem with four, and the Growing stage's scheduled copies are what breaks between them.\n\n**Advances the thesis** (S2, S3): Explains why the joins must be rebuilt at each stage and why the scheduled copies fail.\n\n**Transition in:** `cause_effect`: The map's records moving toward a hub. → Why they must: how fresh each fact must be.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | evidence | For stock, order status and price, the requirement tightens from one writer at the Starting stage to scheduled copies at the Growing stage to events within minutes at the Omnichannel stage, and Kestrel & Pine's incidents are the failures in between. | table: Three facts by four stages, latencies labeled illustrative; the two-hour chain (1,340 units oversold), the Three-Status Order (11 tickets, six days), the Price Drift (€179 for nine days, about €8,200). |  |\n| p20 | analysis | The point is not the numbers: a requirement met for free with one writer and one reader becomes an engineering problem with four of each, and the scheduled copies are the bridge that collapses between them, which is also why the integration style changes faster than the systems; the ownership decision comes first. |  | `conclusion_summary`: The requirements table. → What it means for the joins. |\n\n### Stage by Stage\n\n**Controlling idea** (`explanation`, id `stages`): Each stage has its own shape, its necessary decisions, the failure pattern that strikes and the signals that it is ending: the Starting stage is a purchase, the Growing stage accretes joins, the Omnichannel stage makes the joins the architecture, and the Group stage asks what to share.\n\n**Advances the thesis** (S2, S3, S4, S5): Walks each stage with dated public evidence, showing what each leaves behind and the signals of its end.\n\n**Transition in:** `elaboration`: The map and the requirements by stage. → Each stage in turn, with dated public evidence.\n\n**Order of paragraphs** (`chronological`): The stages in the order a business meets them, each told in the same order (shape and evidence, what becomes necessary, the failure that strikes, the signals of its end), so each stage's ending signals lead straight into the next stage's shape. The Group stage has no end and closes on its remaining questions instead.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | description | At the Starting stage the architecture is a purchase: a hosted platform, a PSP and a 3PL or back room; most of a platform vendor's merchants are here, while most of its GMV is not. | fact: Shopify's 10-K for fiscal 2025 (filed February 2026): most merchants on Basic and Grow, most GMV from Plus and enterprise merchants. |  |\n| p22 | explanation | What becomes necessary is small (an exportable platform, understood PSP fees, an app inventory with permissions, the founder holding the logins); the pattern that strikes is The Lynchpin, as Kestrel & Pine's agency of 2017 still shows at €14,000 a month. | fact: Agency retained 2017; still holds theme, apps and scripts at €14,000 a month. | `elaboration`: The Starting stage's shape. → What it requires and what fails. |\n| p23 | explanation | The Starting stage ends with a second channel or a first store: once stock in two places both sells, the business has an integration problem whether or not it has an integration. |  | `sequence`: What the Starting stage needs. → The signal that it is ending. |\n| p24 | description | The Growing stage adds a store on a POS, a marketplace through a connector and wholesale keyed into an ERP that often becomes the hub; Microsoft preinstalling its Shopify connector for new Business Central sign-ups shows that shape is mainstream. | fact: Microsoft Learn, 22 September 2026: the Shopify connector preinstalled for all new Business Central sign-ups. | `sequence`: The end of the Starting stage. → The Growing stage's shape. |\n| p25 | cause_effect | Each Growing-stage join is built when its channel arrives, by whoever is available, and is right for that day's volume, so the Spaghetti Junction accretes rather than being built, as Kestrel & Pine's 2021 hourly marketplace sync shows. | case: The connector's hourly sync of 2021, when marketplace orders were a few a day (illustrative); 43,000 marketplace orders in 2026 and a two-hour chain. | `cause_effect`: The channels the Growing stage adds. → How their joins are built and what they become. |\n| p26 | evidence | At the Growing stage fees change character (the third-party gateway fee, per-order tool prices, open-source plans paid above €1 million GMV), and a merchant moving to Omnichannel crosses several thresholds at once, so price lists are a transition signal. | fact: Shopify gateway fee 2% on Basic; Picqer €379 a month including 3,000 orders, then €0.28 an order (accessed November 2026); Shopware's €1M GMV line. | `additional_support`: The joins the Growing stage accretes. → The fees it starts to meet. |\n| p27 | explanation | The Growing stage ends on concrete signals: a retail chain asks for EDI (still most of European B2B electronic ordering by value), a second stock location must be sold from, two reports show two order counts, and the first peak day's failure is in an integration, followed closely by an unowned connector, support opening several systems and an app writing another system's fact; the EDI request often comes first because European B2B electronic ordering is still mostly EDI by value. | statistic: Eurostat 2024 data (extracted February 2026): EDI-type sales 11.07% of EU enterprise turnover against 8.39% for web sales. | `sequence`: The Growing stage's joins and fees. → The signals that it is ending. |\n| p28 | description | At the Omnichannel stage three or four business models share one stock, and for a retailer with stores omnichannel is the business, with an order hub what makes store stock sellable online. | statistic: Target's 10-K for fiscal 2025 (filed March 2026): stores fulfilled 97.6% of merchandise sales. | `sequence`: The end of the Growing stage. → The Omnichannel stage's shape. |\n| p29 | explanation | What becomes necessary at the Omnichannel stage is Waypoint's set: a system of record per fact, an OMS, a PIM, an availability service and integration standards with owner, contract, idempotency and reconciliation, with the ERP demoted from hub. | source: Akeneo guidance (accessed November 2026): content scattered across teams, manual channel launches and inconsistent storefront data signal a PIM. | `elaboration`: The Omnichannel stage's shape. → The decisions it makes necessary. |\n| p30 | counterargument | The Omnichannel stage's temptation is The Giant's Boots: public examples come from companies with hundreds of engineers, so a 14-person team should adopt composable per capability around a kept core and own the joins. | quotation: Fowler, MonolithFirst (June 2015): boundaries are hard to get right at the beginning; Shopify Engineering (February 2019): a modular monolith for over a thousand developers; MACH Alliance survey (February 2026): 37% of 600 cite integration complexity. | `contrast`: What the Omnichannel stage needs. → What it is tempted to copy instead. |\n| p31 | explanation | The Omnichannel stage ends with a second brand or unit, an acquisition, a fourth country with its own books, or the platform's tenancy binding; a vendor's enterprise band of $50 million to $500 million of GMV hints at the stage's top. | fact: Shopify enterprise page (accessed November 2026): organizations with GMV of $50M to $500M and more. | `sequence`: The Omnichannel stage's needs and temptation. → The signals that it is ending. |\n| p32 | definition | The Group stage is defined by plurality (several brands, units or countries that could each run a stack), so its question becomes which systems are shared and who owns them. |  | `sequence`: The end of the Omnichannel stage. → The Group stage's shape and question. |\n| p33 | evidence | VF Corporation's direct-to-consumer business across brand stores and sites, 44% of revenue, shows one group with many brand storefronts and a shared question about what sits behind them. | statistic: VF Corporation 10-K for the fiscal year to March 2026: DTC across brands such as The North Face and Timberland, 44% of revenue. | `example`: The share-or-separate question. → A multi-brand group that faces it. |\n| p34 | evidence | An acquisition changes a group's metrics on day one and its architecture over years, as Zalando's consolidation of ABOUT YOU diluted its reported partner share before any system was touched. | statistic: Zalando Annual Report 2025 (March 2026): partner-business share of GMV fell to 32.1% from 34.2% by dilution after consolidating ABOUT YOU. | `additional_support`: A group with many brands. → What an acquisition does first. |\n| p36 | evidence | The Group stage's failure pattern is One Size Fits None (one stack forced without measuring, or shareable work duplicated), and the public cautions against too much autonomy, Zalando's services in six languages and Uber's 2,200 microservices, are six years old and from far larger companies, but the lesson transfers: autonomy without shared standards produces the Spaghetti Junction at group scale. | quotation: Jacobs 2020: more than 260 teams, similar services 'written in six languages', which 'hurts productivity at scale'; Uber 2020: about 2,200 microservices, an investigation through fifty services owned by twelve teams. | `problem_solution`: Groups that must decide what to share, seen in VF and Zalando. → The failure pattern of that decision and the evidence of what too much autonomy costs. |\n| p37 | explanation | The Group stage's remaining questions are vendor-scale ones (tenancy, extensibility, data residency, exit terms), and the Data Act's ban on switching charges from 12 January 2027 may or may not reach hosted commerce platforms; the main question, which capabilities to share, is left to the decision table that follows. | fact: Regulation (EU) 2023/2854: switching charges for data processing services prohibited from 12 January 2027; whether hosted commerce platforms fall under it is open as of November 2026. | `additional_support`: What a group shares and what it keeps apart. → The vendor-scale questions left. |\n\n### Multi-Brand and Multi-Country: The Group's Decision Table\n\n**Controlling idea** (`recommendation`, id `group-table`): The Group stage's question is answered capability by capability: share the integration layer, data definitions, peak tooling, security and the PSP contract always, and share storefront, PIM, stock and the order hub only under stated conditions; acquisitions turn the question into a migration.\n\n**Advances the thesis** (S5): Gives the share-or-separate decision per capability with its conditions.\n\n**Transition in:** `elaboration`: The Group stage's question of what to share. → The answer per capability.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | recommendation | The author's default shares expensive capabilities with common requirements, run once by a platform team, and leaves brand-visible ones with the brands; the decision table says, per capability, when to share across brands or units and when to keep separate: always share the PSP contract and fraud rules, the integration layer and data definitions, peak tooling, security and compliance; share storefront, PIM, stock and the order hub under conditions. | table: Seven capabilities with 'share when' and 'keep separate when' conditions; separate definitions of 'order' per brand named as the Group-stage Schrödinger's Order. |  |\n| p39 | explanation | Two conditions govern the table: an acquired brand brings its own stack, so the question becomes sequencing, which is a migration; and a group that runs a marketplace or partner program has become a platform vendor with its tenancy concerns. |  | `elaboration`: The table's recommendations. → The two conditions that change how it is applied. |\n\n### The Transition Signals\n\n**Controlling idea** (`evidence`, id `signals`): Each transition signal was visible at Kestrel & Pine before the incident that priced it, and two signals in one year mean the stage has changed, whatever the revenue says.\n\n**Advances the thesis** (S4): Maps each signal to what it means, the pattern it precedes and Kestrel & Pine's case, and states the two-signal rule.\n\n**Transition in:** `conclusion_summary`: The signals named for each stage in turn and the Group stage's question. → All the signals in one table, with the pattern each precedes.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | evidence | The table gathers the ending signals each stage section named, and every signal that led to an incident was visible at Kestrel & Pine before the incident that priced it: a fee threshold, a second stock location, an EDI request, two order counts, an unowned connector, support opening several systems, an app writing another system's fact, a peak-day integration failure, and the not-yet second brand. | table: Nine signals with what each means, the pattern it precedes and Kestrel & Pine's case (enterprise tier 2023; Duiven 2023; Bergzicht 2025 and the ASN Chargeback; three definitions of 'order'; the Deprecated Endpoint; the Three-Status Order; the App That Wrote Stock; Black Friday 2026; not yet). |  |\n| p41 | claim | The author's rule is that two signals in one year mean the stage has changed, whatever the revenue says; Kestrel & Pine had six in 2026 (stores selling online stock, the ASN Chargeback, the App That Wrote Stock, the Three-Status Order, the Black Friday integration failure, three definitions of order), signals that marked its 2023 change of shape long before the April 2027 stage map named it. | figure: Figure 4: transitions triggered by shape changes, with self-loops where a stage does its work. | `conclusion_summary`: The signals and their incidents. → The rule for reading them. |\n\n### In Practice: Kestrel & Pine's Path, Priced\n\n**Controlling idea** (`example`, id `practice`): Kestrel & Pine's path from 2016 to 2027, priced from its own figures, shows a Starting stage that left a habit, a Growing stage whose joins caused eight of the ten incidents, an Omnichannel stage whose incidents cost about €138,000 directly, a payment fee worth more than all of them, and a 2027 stage map that sorts decisions by shape.\n\n**Advances the thesis** (S3, S1): Prices the leftovers and the fee cliff for one merchant.\n\n**Transition in:** `example`: The signals and the two-signal rule. → One merchant's whole path, with costs.\n\n**Order of paragraphs** (`chronological`): The stages in Kestrel & Pine's own order, then the fee example that the Omnichannel costs make comparable, then the 2027 stage map that the whole path leads to.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | transition | The stage map is more persuasive with costs, so the section gives Kestrel & Pine's figures with one illustrative calculation. |  |  |\n| p43 | example | Kestrel & Pine's Starting stage (2016–2018) was the vendor's architecture and caused no 2026 incident, except the habit that the agency owns the storefront. | fact: One Dutch web shop on the shop platform, one PSP, a 3PL in Tiel, an agency from 2017. | `sequence`: The costs to come. → The first stage. |\n| p44 | example | Its Growing stage (2019–2022) built every join when its channel arrived, and eight of the ten incidents descend from that era's designs, the clearest being the Store Stock Mirage, the Deprecated Endpoint and the Black Friday Oversell's cadence. | case: Arnhem store and nightly POS sync (2019), Belgium (2020), Utrecht, connector, iPaaS, GTINs (2021), Germany, investor, Ruben Alves (2022); the Store Stock Mirage (37 items), the Deprecated Endpoint. | `sequence`: The Starting stage. → The Growing stage. |\n| p45 | example | Its Omnichannel stage (2023–2026) brought thirteen systems, four order records, four copies of stock and three definitions of 'order', technology spend of about €2.6 million (5.4% of revenue, high against a judged 2–4%), and incidents with about €138,000 of direct cost. | statistic: €2.6M, 5.4% of revenue; €96,000 (Oversell), €19,400 refunded twice, €8,200 (Price Drift), €14,200 (ASN Chargeback): about €138,000. | `sequence`: The Growing stage. → The Omnichannel stage and its costs. |\n| p46 | analysis | The fee cliff that matters most to Kestrel & Pine is payments, not the €2,300-a-month platform tier: on €27.0 million of online revenue each half point of payment cost is about €135,000 a year, nearly as much as the four priced incidents and recurring every year. | reasoning: 0.5% × €27.0M ≈ €135,000 a year (illustrative arithmetic on ledger figures); enterprise tier €2,300 a month. | `contrast`: The incidents' direct cost. → A fee that outweighs them. |\n| p47 | synthesis | In 2027 the stage map lets Waypoint's €1.1 million buy the Omnichannel stage's hubs and standards, retire the Growing stage's chain and defer the Group stage: the stages sort decisions by the shape they belong to. | fact: Waypoint, €1.1M over 2027–2028; Group stage deferred to the 2029 review. | `conclusion_summary`: The path and its costs. → What the 2027 stage map does with them. |\n\n### When It Goes Wrong: Too Early, Too Late, Sideways\n\n**Controlling idea** (`evidence`, id `wrong`): A stage mismatch fails too early (The Giant's Boots), too late (The Phantom Stock, Schrödinger's Order) or sideways (One Size Fits None), each with a detection and a recovery, and every recovery runs through an entity–owner table and a reconciliation job per copy.\n\n**Advances the thesis** (S3, S5): Shows the three directions in which decisions taken for the wrong stage fail, and how each is detected and recovered.\n\n**Transition in:** `contrast`: Kestrel & Pine's path, where decisions were sorted by stage. → What happens when they are not.\n\n**Order of paragraphs** (`grouping`): The three directions in the order of a business's growth (ahead of its stage, behind it, then across a group), then the two tools all three recoveries share.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | transition | A stage mismatch fails in three directions, each with a detection and a recovery. |  |  |\n| p49 | evidence | Too early, a Growing-stage merchant adopts a composable core or microservices from larger companies' case studies; it shows when the integration layer is the largest effort and nobody is on call, and it is recovered by consolidating, as Segment did. | case: Segment (2018) folded more than 140 services back into one (its own account, eight years old). | `sequence`: The three directions. → The first: too early. |\n| p50 | evidence | Too late, an Omnichannel merchant runs Growing-stage copies; one reconciliation detects it cheaply, as Kestrel & Pine's May 2027 count of 2.3% differing variants did, and Waypoint's hubs, events and kept reconciliation are the recovery. | statistic: First weekly reconciliation, May 2027: 2.3% of active variants with a different quantity, most from the apps that wrote stock. | `contrast`: Moving too early. → Moving too late. |\n| p51 | explanation | Sideways, a group forces one stack or keeps everything apart without measuring; it shows as consolidation with no per-capability benefit or as many definitions of 'customer', and the decision table applied per capability is the recovery. |  | `sequence`: Too early and too late. → The third direction: sideways, at the Group stage. |\n| p52 | synthesis | Every recovery runs through an entity–owner table and a reconciliation job per copy; the stage sets how many rows those tools have, not whether they are needed. |  | `conclusion_summary`: The three recoveries. → What they share. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The first store, Eva's order across systems from four different years and Kestrel & Pine's incidents are one fact seen three times: a stage changes when the shape of the business changes, and the systems bought for the old shape keep running until someone decides to retire them. The stage map turns that into a decision rule: place the business by shape, retire the previous stage's leftovers, and wait for the next stage's signals before buying for it.\n\n**So what:** A merchant that asks which shape it has and which stage each system was bought for can tell a board which decisions are due now, which are leftovers and which belong to a larger company; revenue answers none of these. Kestrel & Pine spends Waypoint's €1.1 million on its own stage and leaves the Group stage to the 2029 review.\n\n**Callback:** The introduction's merchant that opens a first store and has stock in two places, and Eva's order crossing systems bought in 2016, 2021, 2023 and 2025. Paragraph p53 reads both as changes of shape whose systems were never retired, and names the eight of ten incidents that followed at Kestrel & Pine.\n\n**Takeaway** (`course_of_action`): Place the business by shape, list which stage each system was bought for, and ask the eight questions: the stage by shape, the vendor thresholds ahead, the stock writers, the order records, the integrations' owners, last year's signals, what a second brand would share, and which current decisions belong to which stage.\n\n**Hand-off** to [Who Builds and Who Owns: Teams, Vendors, Agencies and Governance](organizing-commerce-engineering.html): `sequence`: The stage map's sorting of decisions by stage, including its row on who builds and runs at each stage. → The people who make and keep the decisions: who owns each system, integration and app, how a fourteen-person team works with an agency and a dozen vendors, and governance that fits a merchant.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | synthesis | The opening's first store and Eva's order are changes of shape whose systems were never retired: Kestrel & Pine had been an Omnichannel business since 2023 while eight of its ten incidents came from Growing-stage designs, so Waypoint retires them and leaves the Group stage to its signals; a merchant asks which shape it has and which stage each system was bought for, which revenue cannot answer. | reasoning: The hook's first store, Eva's order across systems from 2016 to 2025, the eight of ten incidents, Waypoint's €1.1 million and the 2029 review. |  |\n| p54 | synthesis (list) | Established: vendors tier on volume and shape; by value European B2B electronic ordering is still mostly EDI; for a retailer with stores omnichannel fulfillment is the business; and autonomy without shared standards is costly at group scale. |  | `conclusion_summary`: The chapter's answer in one paragraph. → The points that are established. |\n| p55 | synthesis (list) | Depends on context: whether an OMS, PIM or WMS is needed (channel and location counts, not volume), how to read revenue bands, when the ERP as hub stops working, and what a group shares. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p56 | recommendation (list) | The author's synthesis: the first decision at each stage is which leftovers to retire; and two transition signals in one year mean the stage has changed, so a stage map that lists the signals is worth more to a board than a roadmap of tools. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labeled as such. |\n| p57 | recommendation (list) | Eight questions let the reader apply the map: the stage by shape and each system's stage, the vendor thresholds ahead, the stock writers and comparisons, the order records, the integrations' builders and owners, last year's signals, what a second brand would share, and which current decisions belong to which stage. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own business. |\n| p58 | transition | The stages sort the decisions but people make them; the map's 'who builds and runs' row only sketched the team at each stage, and the next chapter covers who owns each system, integration and app, how a 14-person team works with an agency and vendors, and what governance fits a merchant. |  | `sequence`: The stage map's sorting of decisions by stage. → The people who make and keep them. |\n\n## Non-goals\n\n- The economics of each business model and the per-order unit economics; used here only as fee thresholds. See [Who Sells What to Whom: Business Models and the Economics That Shape Architecture](commerce-business-models.html).\n- The mechanics of any single capability's scale table (availability, OMS, PIM, WMS, EDI, integration standards). See [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html), [The Order Record: Lifecycle, State and the Order Management System](order-management.html), [What Are We Selling? Products, Variants and the Catalog](product-information.html), [Pick, Pack, Ship: Warehouse Management and Fulfillment](warehouse-and-fulfillment.html), [Documents Between Companies: EDI, Punchout and E-Invoicing](edi-and-e-invoicing.html), [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html).\n- The build/buy/assemble decision and total cost of ownership; replatforming and migration mechanics; architecture styles and The Giant's Boots in depth. See [Build, Buy or Assemble: Choosing and Changing Platforms](build-buy-or-assemble.html), [Moving Without Burning the Bridge: Replatforming and Migration](replatforming-and-migration.html), [Monolith, Modular Monolith, Microservices, Composable: What the Evidence Says](commerce-architecture-styles.html).\n- Team shape by stage beyond one row of the map. See [Who Builds and Who Owns: Teams, Vendors, Agencies and Governance](organizing-commerce-engineering.html).\n- Tenancy and extensibility at vendor scale. See [Many Merchants, One Platform: Multi-Tenancy, Pods and Isolation](multi-tenancy-and-isolation.html), [Apps, Plugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Carried from spec.md: no public survey of commerce system counts or team sizes by revenue band was found; the map's shapes are a composite and the chapter says so (Avasant's retail chapter is paywalled).\n- Carried from spec.md: the 2–4% retail IT-spend range is judgement from secondary sources; Kestrel & Pine's 5.4% is presented against it as a judgement, not a benchmark.\n- Carried from spec.md: whether hosted commerce platforms are 'data processing services' under the Data Act (switching charges prohibited from 12 January 2027) is an open legal question; the chapter presents it as such.\n\n## Decision log\n\n- **2026-11-13** — Converted spec.md to spec.json from the published chapter, one spec paragraph per unit. Intent outcome, the five acceptance criteria, thesis and role copied unchanged from journal-spec.json; audience written for this chapter. The old success criteria were inventories (table rows, sources listed, diagrams, word count) and are dropped as criteria: their outcomes are covered by AC-1 to AC-5, the dated evidence by the evidence items, and the word limit by length.max_words (6,500, the old limit). Rejected: Keeping the inventory criteria as minor criteria (rule 7 of the standing instruction would drop them).\n- **2026-11-13** — Added the units the contract asks for and the published chapter lacked: p05 (thesis statement), p06 (roadmap announcing every section) and p53 (a conclusion paragraph with synthesis, so-what and a callback to the opening's first store and Eva's order). The opening paragraph p02 now carries the journal spec's transition_in from chapter 42 (migrations as the moments of moving stage). Merged the one-sentence Group-stage paragraph ('Both sources are six years old...') into the paragraph whose evidence it qualified (p36). Rejected: Leaving the introduction without a thesis paragraph or roadmap (AC-4 needs the sections predicted).; Treating the 'What to Take Away' lists as the synthesis: none of them answers the opening.\n- **2026-11-13** — Canonical facts: the stage map is asked for by the board, as the commerce-scaling-stages ledger line says (the page had CEO Mara Lindqvist asking); the revenue signal is 'past about €200 million' (the page had 'near'). The journal thesis's 'leftovers cause most of the new stage's incidents' is stated on the page only as the ledger supports it: eight of Kestrel & Pine's ten incidents traced to Growing-stage designs (KEY POINTS bullet 2, Figure 3's caption and the author's synthesis bullet changed from 'most Omnichannel incidents'). 'The ledger defines the stages' becomes 'Chapter 2 defined the stages', since readers do not know the ledger. Kestrel & Pine's hosted product is 'the shop platform' where the text means it. Rejected: Keeping 'most incidents' as a general claim (not supported beyond Kestrel & Pine's eight of ten).\n- **2026-11-13** — Flow rubric (fresh agent, outline only): sound with notes. Taken without review, as the author asked on 2026-11-12: GMV glossed before Shopware's tiers use it (p14); the integration-style point of p18 explained in p20; the thre n 2026' is kept from the journal spec and now lists the six 2026 signals so the reader can count them; (rule 3, both flow readers) the Eurostat evidence moved out of the middle of the Growing stage's list of signals to follow it (p27), the forward pointer to the decision table moved from p35 to the end of the Group section (p37), the repeated POS, ERP and PSP glosses in Stage by Stage removed, and p05 gives the figure as 'most of the incidents' so the eight-of-ten figure is not stated three times before the first section; p05's transition changed from cause_effect to elaboration (the claim starts from the old assumptions) and p14 opens with its link to Shopify's tiers; (rule 6) glosses for suite, platform plus specialist layers, item master, teams owning one flow of work, parity rules, data residency, blended payment cost, ABOUT YOU and the partner share; the double comma fixed; the signals table's opening limited to the signals that led to incidents. Rejected: Moving the vendor price-list paragraphs out of 'What a Scale Stage Is' (the two readers asked for different destinations; rule 10 keeps the current position).; Dropping the eight-of-ten figure from the KEY POINTS (it is the page's evidence for the thesis; the repetition was reduced in p05 instead).\n- **2026-11-13** — Closing fixes after round 3 (ESCALATE; no further round), taken by the author's standing instruction of 2026-11-12 (rule 3: both flow readers): in 'Setting the Scene' the Waypoint paragraph (p09) now follows the eight-of-ten entry (p10), so the decision follows its reason; the one-sentence One Size Fits None paragraph (former p35) merged into the autonomy paragraph (p36), which also fixes its missing link; the signals section opens by saying it gathers the stage sections' ending signals (p40); p41 says the six 2026 signals marked the 2023 change long before the stage map named it; 'EDI heads the list' replaces 'often comes first'; 'Kestrel & Pine's 14-person technology team' (ledger: 14 in techn
