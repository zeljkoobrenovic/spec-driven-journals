<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published page (posts/where-commerce-platforms-go-wrong/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the published page, in its order; the tables, the eighteen figures and the two opening callouts are recorded as evidence or placement, not as units. Intent outcome, acceptance criteria AC-1 to AC-6, thesis and role are copied unchanged from the journal spec. It is a contract, not a description: the places where the published page does not do what the spec asks are listed under open_questions. Revised on 2026-11-12 from the flow rubric's notes: seven case units that held two ideas are split, the chains section gains a lead paragraph and a unit for the identity thread, and the conclusion gains two opening paragraphs; the published page was revised to match.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The sixteen pattern names, each with its warning sign and its family.\n- **Know:** What each family points to: a fact with two writers or no owner; a message with no key, contract or owner; a decision sized or copied for a different business, or made on one date; a dependency, deadline or actor nobody owns.\n- **Know:** The three chains (integration, governance, platform) and the stage at which a pattern is typically born and the stage at which it hurts.\n- **Believe:** A pattern accumulates from decisions that were each reasonable locally, so finding it is not finding someone to blame.\n- **Believe:** Repairing the symptom at the end of a chain rarely holds; naming the origin usually does, and the remedy is rarely a new platform.\n- **Be able to:** Name the pattern and family behind a described incident, and the chapter that addresses it.\n- **Be able to:** Ask for the number that would confirm a warning sign.\n- **Be able to:** Use the patterns as questions in a design review, a vendor demo and due diligence.\n\n**Audience:** Readers new to commerce architecture, most of all those who will sit in a design review, a vendor demo or a due-diligence exercise within weeks of joining: the engineer, product manager, analyst or leader who needs a name for what is going wrong before arguing about a fix.\n\n**Already knows:**\n\n- What buying, returning and waiting for a parcel are like from the shopper's side.\n- Roughly what an API, an app and a script are.\n- The book's claim that a failure is a promise one system made and another could not keep, the four scale stages, and the bare list of sixteen pattern names (introduction).\n\n**Does not yet know:**\n\n- Kestrel & Pine, its systems, people and incidents (the next page introduces them).\n- System of record, available-to-promise, idempotency key, reconciliation, dead-letter queue, reverse fulfillment order, disposition, tenant.\n- WMS, ERP, OMS, PIM, POS, iPaaS, EDI, Peppol, SKU, webhook.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a described incident the page does not contain, the reader names the pattern, its family and the upstream pattern to check first. *Probe:* After a timeout, a retry created a second shipment for 40 orders. Using only this page: which pattern is this, which family is it in, which upstream pattern would you check for, and what is the remedy direction? | `custom` | cold_reader | major |\n| AC-2 | The reader can say, for each of the four families, where it tells them to look. *Probe:* Using only this page: name the four families of patterns and say in one clause each what kind of thing has gone wrong. | `custom` | cold_reader | major |\n| AC-3 | Given a warning sign, the reader names a number or document to ask for before concluding the pattern is present. *Probe:* A colleague says 'we have a Spaghetti Junction'. Using only this page: what would you ask to see before agreeing? | `custom` | cold_reader | minor |\n| AC-4 | Every Kestrel & Pine example can be followed without the merchant page: each is labeled fictional and names its systems by role with a one-clause explanation. | `known_before_new` | rubric | major |\n| AC-5 | A reader of the opening alone (the two callouts and the three paragraphs before the first heading) can predict the page's sections. *Probe:* After reading only the callouts and the first three paragraphs: what will this page discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-6 | A reverse outline of the page, written without the spec, lists the same controlling ideas in the same order as the post spec's sections and paragraphs. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** In which recurring ways do commerce platforms fail, and what do the failures have in common?\n\n> **Claim:** Commerce platforms fail in sixteen recurring patterns in four families: a fact with two writers or no owner; a message with no key, contract or owner; a decision sized or copied for a different business, or made on one date; a dependency, deadline or actor nobody owns. Each grew from locally reasonable decisions, and they travel in chains starting at an unowned connector, an unwatched dependency or a decision copied without its reasons.\n\n**Disputed by:** The view that each commerce incident is a separate defect or a single bad decision in the system that showed the symptom, to be fixed in that system or by replacing it.\n\n**So what:** Faced with an incident, the reader names the pattern, looks upstream along its chain for the connector, dependency or copied decision that nobody owns, and assigns an owner there; a fix applied where the symptom appeared will have to be made again.\n\n**How and why:** Each app, script and connector was the fastest way to meet one need, and the risk shows only in their combined effect. Connectors without owners send messages that are trusted to arrive once; late, lost and duplicated messages leave stale stock, conflicting statuses and double refunds. A decision sized for the ordinary hour or for the business as it once was, or copied from a bigger company, carries that other business's assumptions without its reasons until peak load or an upgrade tests them, and a dependency nobody watches changes without warning. Kestrel & Pine's own stage map traces eight of its ten incidents to Growing-stage designs still running in 2026.\n\n**Supporting claims**\n\n- **S1** — The failures recur as sixteen recognizable patterns, each with a warning sign that a number can confirm, a mechanism, a cost and a remedy direction.\n- **S2** — The sixteen sort into four families, and the family says what kind of thing lacks an owner: a fact, a message, a decision, or a dependency, deadline or actor.\n- **S3** — Each pattern grew from decisions that were reasonable one at a time, which is why most are born at one scale stage and paid for at a later one.\n- **S4** — The patterns travel in chains that start at an unowned connector, an unwatched dependency or a decision copied without its reasons, so a repair holds at the origin of a chain and not at its last symptom.\n\n## Role in the part\n\nGives the book its shared names for failure: without it the merchant's incidents are ten anecdotes and no chapter can open by naming the patterns it works on. Supports PF-2 of part `preface`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `grouping` in sixteen-patterns: the patterns by family; how-the-patterns-reinforce: one chain per paragraph; `small_to_large` in sixteen-patterns to how-the-patterns-reinforce: single patterns, then their spread over the stages, then the chains that join them)\n\nThe catalog comes first because the stage table and the chains are written in pattern names and mean nothing to a reader who has not met them. The stage table follows because it adds one fact per pattern (when it starts, when it hurts) and prepares the idea that origin and symptom are apart in time; it is also where the merchant's ten incidents are first counted, so that the later count by cause has something to stand on. The chains come third because they say that origin and symptom are also apart in the landscape, and they need both the names and that idea. The closing section first says what the three sections add up to and returns to the opening sale, and only then gives the three uses, because each use (walk the handoffs, ask to see the pattern, ask for the owner's document) applies the lesson that the origin is something unowned upstream. Opening with the chains would give the reader a diagram of sixteen unknown names; opening with the uses would hand out questions before the reader knows what a bad answer looks like.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): The storefront accepts a sale, but the warehouse never receives the order. Both systems remain available while the customer waits for a parcel nobody is preparing.\n\n**Bridge:** Anyone who has waited for a parcel that never came, or been told an item was in stock when it was not, has met one of these failures from the outside. → Inside the merchant each is a price, a stock figure or a status that crossed a handoff incorrectly, and the ways that happens recur often enough to be named.\n\n**Thesis statement** (KEY POINTS callout (bullets 1 to 3) and paragraph p02): Nearly every pattern is a promise one system made and another could not keep. The sixteen fall into four families that tell you where to look, they accumulate through reasonable local decisions, and they travel in chains that start at an unowned connector, an unwatched dependency or a decision copied without its reasons.\n\n**Roadmap** (Paragraph p03 (last sentence), with the IN THIS SECTION and KEY POINTS callouts):\n\n- Sixteen named patterns in four families, each with its warning sign, mechanism, cost, remedy direction and the chapters that address it, shown at the fictional merchant and in a dated public case. *Kept in:* sixteen-patterns.\n- The scale stage at which each pattern starts and the stage at which it hurts. *Kept in:* where-the-patterns-strike.\n- The chains in which one pattern sets off another, and (in the closing section) three uses: a design review, a vendor demo and due diligence. *Kept in:* how-the-patterns-reinforce.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A storefront can accept a sale that the warehouse never receives while both systems stay available, and the other commerce failures have the same shape: a price, a stock figure or a status crosses a handoff, the point where one system passes a fact to the next, incorrectly. | scenario: A sale accepted by the storefront, an order the warehouse never receives, and a customer waiting for a parcel nobody is preparing. |  |\n| p02 | claim | Many patterns accumulate from decisions that were each reasonable locally, so the risk shows only in their combined effect, which travels in chains from an unowned connector, an unwatched dependency or a copied decision; finding that origin assigns responsibility, not blame. |  | `cause_effect`: The recurring failures at the handoffs. → Where they come from: an app, a script or a shortcut that each made sense alone. |\n| p03 | transition | The page gives sixteen entries of one shape (warning sign, mechanism, cost, remedy, reading links), with invented examples from the fictional Kestrel & Pine and dated public examples assigned by the author's interpretation, and then the stages, the chains and three uses. |  | `sequence`: The patterns as a way to find a combined effect. → The shape of each entry, the two kinds of example it uses, and what follows the sixteen entries. |\n\n## Sections\n\n### Sixteen Patterns to Recognize\n\n**Controlling idea** (`description`, id `sixteen-patterns`): Commerce platforms fail in sixteen recognizable patterns in four families, each with a warning sign a number can confirm, a mechanism made of locally reasonable choices, a cost, and a remedy that assigns an owner.\n\n**Advances the thesis** (S1, S2, S3): Names and sorts the sixteen, and shows for each one the mechanism, the cost and the remedy direction, once with an invented case and once with a dated public one.\n\n**Transition in:** `elaboration`: The introduction's promise of sixteen named patterns and the shape of each entry. → The four families, the table of names and warning signs, and then each pattern in turn.\n\n**Order of paragraphs** (`grouping`): The table comes first so the reader has all sixteen names and families before reading any one. The patterns then follow the table's order, family by family (five truth, three integration, five platform and change, three governance), so that a reader learns one kind of fault at a time and the family tells them where to look. Truth comes first because its symptoms (stock, status, refunds, prices) are the ones a newcomer has met as a customer; integration follows because it carries those facts; platform and change and governance come last because they are decisions and omissions with no symptom of their own until one of the earlier patterns appears. Every pattern has the same parts in the same order, sign before mechanism, mechanism before cost, cases before remedy, so that the reader can compare patterns and find a part again; moving the remedy ahead of the cases would hand out an answer before the reader has seen what it answers. Between one pattern and the next the transition is the parallel third-level sub-heading itself: it names the next row of the table, and the entry under it repeats the shape the reader has just finished. That is the declared form for the fifteen boundaries between patterns (relationship sequence, form phrase); no connective sentence is asked of the draft there, and the family of each pattern is given by the table, not repeated in the entry. How one pattern causes another is left to the chains section, which is where the page argues it. A Kestrel & Pine case that reports two incidents is two units, the second opening without a label, as the stock and price patterns already did.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | definition | The four families of the KEY POINTS (defined there by what has gone wrong) come in the order a newcomer meets them: truth first, because customers see its symptoms in stock, orders, returns and prices; integration, which carries those facts; then platform and change and governance, which stay silent until peak load, an upgrade or an earlier pattern shows them. | table: Sixteen rows: pattern name, warning sign and family (five truth, three integration, five platform and change, three governance). |  |\n| p05 | recommendation | A warning sign is a prompt to look and not a verdict, so the reader should ask for the number that would confirm it. |  | `contrast`: The warning signs in the table. → Their limit: a sign needs a number before it counts as a finding. |\n| p06 | example | The Phantom Stock sounds like a site that showed twelve units of an item the warehouse had been out of since seven o'clock. | scenario: Invented quote: \"The site said we had twelve. The warehouse had none since seven o'clock.\"; figure: Figure 1: every channel sells from an aging copy of a stock number, so the shelf can be empty while the screens still say \"in stock\". | `example`: The table's first row, and the rule that a warning sign has to be confirmed by a number. → The first truth pattern, The Phantom Stock, announced by its sub-heading and opened by its quote; the sub-heading is the transition. |\n| p07 | description | The storefront's stock number is a copy of unknown age, so click-and-collect can promise what the store sold that afternoon. |  | `elaboration`: The Phantom Stock: the quoted symptom. → The signs by which the pattern shows in general. |\n| p08 | cause_effect | The warehouse knows the physical stock while the channels sell from scheduled copies that extra apps and imports can also change. |  | `cause_effect`: The Phantom Stock: what the pattern looks like. → The mechanism that produces it. |\n| p09 | evidence | Phantom stock costs canceled orders, vouchers, marketplace penalties and seller ratings, and stock records are less accurate than merchants assume. | statistic: 65% of about 370,000 inventory records were inaccurate at one US retailer's stores. | `cause_effect`: The Phantom Stock: the mechanism. → What it costs, with public figures. |\n| p10 | example | On Black Friday 2026 Kestrel & Pine's channels went on selling the Ridgewalker for up to two hours after it sold out, because stock passed from the warehouse system to the ERP every 15 minutes and then hourly to the platform and the marketplaces. | scenario: Sell-out at Duiven at 19:40 on 27 November 2026; 1,340 units oversold, 1,120 orders canceled or delayed, about €96,000 in costs. | `example`: The Phantom Stock: the cost in general. → One invented case at Kestrel & Pine, labeled fictional. |\n| p11 | example | The store-pickup pilot in December repeated the problem with nightly store-stock updates. | scenario: 37 promised pickup items had already been sold in the store. | `additional_support`: The Phantom Stock: the first Kestrel & Pine case. → A second case of the same mechanism at the same merchant. |\n| p12 | evidence | commercetools documents that its available quantity follows stock changes with a delay of up to 10 seconds: even a vendor's own copy of stock lags behind the record. | source: commercetools documents its available quantity as following stock changes \"with a delay of up to 10 seconds\". | `additional_support`: The Phantom Stock: the fictional case. → A dated public example. |\n| p13 | recommendation | The remedy is one writer per location's stock, changes published as events (messages saying what changed), available-to-promise computed in one place and copies reconciled (compared with their source) so that drift is measured, which is the first decision (W1) of Kestrel & Pine's Waypoint program. |  | `problem_solution`: The Phantom Stock: the pattern as shown in the cases. → The direction of the remedy, without teaching it. |\n| p14 | transition | The inventory chapter owns available-to-promise, the systems-of-record chapter names the owner of each fact and the reconciliation chapter measures the drift. |  | `elaboration`: The Phantom Stock: the remedy direction. → The chapters that own each part of it. |\n| p15 | example | Schrödinger's Order sounds like an order the customer sees as delivered, the warehouse as in picking and finance as never invoiced. | scenario: Invented quote: \"The customer sees Delivered. The warehouse says In picking. Finance says it was never invoiced.\"; figure: Figure 2: each system keeps its own status for the same order, and each is honest and wrong at once. | `sequence`: The entry for The Phantom Stock, complete down to its chapters, and the order of the table. → The next row of the table, Schrödinger's Order (family: truth), announced by its parallel sub-heading and opened by its quote; the sub-heading is the transition and no connective sentence is asked for. |\n| p16 | description | The platform's status is set by the first message it received, the ERP waits for one that never came, and a split shipment has no status at all. |  | `elaboration`: Schrödinger's Order: the quoted symptom. → The signs by which the pattern shows in general. |\n| p17 | cause_effect | The money, each shipment and each return have their own state, so without one record that keeps them apart every system's status is honest and wrong. |  | `cause_effect`: Schrödinger's Order: what the pattern looks like. → The mechanism that produces it. |\n| p18 | evidence | An order nobody can place costs service load first and money second. | statistic: \"Where is my order\" is the largest single category of e-commerce support contacts, at 18% of incoming requests in one helpdesk vendor's data.; reasoning: Invoices that never post and duplicate shipments follow from statuses that disagree. | `cause_effect`: Schrödinger's Order: the mechanism. → What it costs, with public figures. |\n| p19 | example | A Kestrel & Pine order shipped in two parcels showed three statuses for six days, from the first parcel's delivery until the second shipped, because an agency flow marked the whole order fulfilled on the first warehouse confirmation. | scenario: Order #1052877, December 2026: fleece shipped 7 December and delivered 8 December, socks shipped 14 December; platform Delivered, WMS In picking, ERP Not invoiced for the six days between; one customer opened 11 support tickets (ledger, customer-service-and-notifications; consistency ruling 2). | `example`: Schrödinger's Order: the cost in general. → One invented case at Kestrel & Pine, labeled fictional. |\n| p20 | evidence | Shopify's own documentation keeps order, payment and fulfillment status as separate families on one order, so even the vendor models one order with several statuses. | source: Separate status families; without a tracking number \"no shipping updates are received\". | `additional_support`: Schrödinger's Order: the fictional case. → A dated public example. |\n| p21 | recommendation | The remedy is one order record for every channel, with separate states for money, each shipment and returns, and a summary computed from the least-advanced shipment. |  | `problem_solution`: Schrödinger's Order: the pattern as shown in the cases. → The direction of the remedy, without teaching it. |\n| p22 | transition | The order-management chapter owns the order record and its states, the customer-service chapter builds the service view and the ERP chapter stops the ERP from being a second order system. |  | `elaboration`: Schrödinger's Order: the remedy direction. → The chapters that own each part of it. |\n| p23 | example | The Familiar Stranger sounds like a merchant that can only guess whether its online customer and its store loyalty member are the same person. | scenario: Invented quote: \"Is the Eva who bought a jacket online the Eva on the store loyalty list? Probably.\"; figure: Figure 3: each channel keeps its own customer record, so one person becomes several strangers nobody can match. | `sequence`: The entry for Schrödinger's Order, complete down to its chapters, and the order of the table. → The next row of the table, The Familiar Stranger (family: truth), announced by its parallel sub-heading and opened by its quote; the sub-heading is the transition and no connective sentence is asked for. |\n| p24 | description | A store cannot see an online order, and a data-subject request becomes a search across nine systems. |  | `elaboration`: The Familiar Stranger: the quoted symptom. → The signs by which the pattern shows in general. |\n| p25 | cause_effect | Each channel's system keys its customer table on what it collects, and matching them is a project nobody owns because every system works without it. |  | `cause_effect`: The Familiar Stranger: what the pattern looks like. → The mechanism that produces it. |\n| p26 | evidence | Unmatched customer records cost duplicate marketing, blind service and a loyalty program built on a wrong count, and they put a legal deadline out of reach. | fact: Under the GDPR a data-subject request must be answered within one month, extendable by two. | `cause_effect`: The Familiar Stranger: the mechanism. → What it costs, with public figures. |\n| p27 | example | The customer the book follows at Kestrel & Pine exists as four unlinked records, so the store that takes her return cannot see her online order. | scenario: Eva Janssen is an online account, a store customer in the POS loyalty list, a newsletter subscriber and a returns-portal contact with no shared identifier; in 2027 the online loyalty program was postponed until the customer record is unified. | `example`: The Familiar Stranger: the cost in general. → One invented case at Kestrel & Pine, labeled fictional. |\n| p28 | evidence | Shopify marked its legacy customer accounts deprecated in February 2026, so a customer match built on the vendor's old customer model has to be built again. | source: Legacy customer accounts deprecated as of 26 February 2026. | `additional_support`: The Familiar Stranger: the fictional case. → A dated public example. |\n| p29 | recommendation | The remedy is a customer master with one identifier per person, written matching rules, channel records linked to it and privacy requests served from it. |  | `problem_solution`: The Familiar Stranger: the pattern as shown in the cases. → The direction of the remedy, without teaching it. |\n| p30 | transition | The identity chapter owns the customer master and matching, the privacy chapter serves data-subject requests and the promotions chapter explains why loyalty waits. |  | `elaboration`: The Familiar Stranger: the remedy direction. → The chapters that own each part of it. |\n| p31 | example | The Boomerang sounds like a refund that support sent and the returns portal then sent again. | scenario: Invented quote: \"We refunded it. Then the portal refunded it. The customer kept both, and who can blame her.\"; figure: Figure 4: a return touches goods, money and books with three owners, so the refund can be paid twice and the credit note made by hand. | `sequence`: The entry for The Familiar Stranger, complete down to its chapters, and the order of the table. → The next row of the table, The Boomerang (family: truth), announced by its parallel sub-heading and opened by its quote; the sub-heading is the transition and no connective sentence is asked for. |\n| p32 | description | Two systems can issue ney and stock are two records. | source: Return (the buyer's intent and the money) versus reverse fulfillment order (the warehouse's work), with four dispositions: restocked, processing required, not restocked, missing. | `additional_support`: The Boomerang: the two fictional cases. → A dated public example. |\n| p37 | recommendation | The remedy is one return record whose warehouse disposition is the single trigger for restock, refund and credit note, with one refunding system keyed on the return id and a daily refund match. |  | `problem_solution`: The Boomerang: the pattern as shown in the cases. → The direction of the remedy, without teaching it. |\n| p38 | transition | The returns chapter owns the return record and refund reconciliation, the payments chapter owns refunds and keys and the tax chapter books credit notes. |  | `elaboration`: The Boomerang: the remedy direction. → The chapters that own each part of it. |\n| p39 | example | The Price Nobody Can Explain sounds like one product at 179 in Germany and 199 everywhere else, with nobody able to say which was meant. | scenario: Invented quote: \"Germany is at 179. Everyone else is at 199. Which one did we mean?\"; figure: Figure 5: prices live in several systems with their own calendars and imports, so the same product carries several prices and nobody can say why. | `sequence`: The entry for The Boomerang, complete down to its chapters, and the order of the table. → The next row of the table, The Price Nobody Can Explain (family: truth, the last of its five), announced by its parallel sub-heading and opened by its quote; the sub-heading is the transition and no connective sentence is asked for. |\n| p40 | description | Prices live in five systems with five campaign calendars, discounts stack without anyone configuring it and a refund uses a price nobody paid. |  | `elaboration`: The Price Nobody Can Explain: the quoted symptom. → The signs by which the pattern shows in general. |\n| p41 | cause_effect | Several roles set prices under several rules, each selling system keeps its own number, imports fail silently and promotion settings outlive their campaign. |  | `cause_effect`: The Price Nobody Can Explain: what the pattern looks like. → The mechanism that produces it. |\n| p42 | evidence | An unexplained price costs margin and parity penalties and exposes the merchant to consumer-price law. | fact: Since 28 May 2022 the EU Omnibus rules require any price-reduction announcement to show the lowest price of at least the 30 days before.; fact: The Dutch regulator ACM announced supervision of those rules from 1 January 2023. | `cause_effect`: The Price Nobody Can Explain: the mechanism. → What it costs, with public figures. |\n| p43 | example | Kestrel & Pine's German storefront sold the Ridgewalker €20 under every other channel for nine days because a script logged a failed restore row and reported success. | scenario: October 2026: €179 instead of €199 for nine days, 410 orders, about €8,200 of margin, a marketplace price-parity warning. | `example`: The Price Nobody Can Explain: the cost in general. → One invented case at Kestrel & Pine, labeled fictional. |\n| p44 | example | In Black Friday week a discount and a welcome code stacked because a combination setting from October had never been reverted. | scenario: A 20% outerwear discount stacked with a 10% welcome code on 2,860 orders, about €52,000 in all.; scenario: About €52,000 in all, including the €3,000 of wrong refunds told under The Boomerang (consistency ruling 9; €43,000 is the margin share only and is never given as the total). | `additional_support`: The Price Nobody Can Explain: the first Kestrel & Pine case. → A second case of the same mechanism at the same merchant. |\n| p45 | evidence | No public incident is cited for the unexplained price; the public record is the law, which makes a 30-day price history per SKU and channel a requirement. | fact: The Omnibus rule (2022) and ACM's supervision (2023), as cited under the cost; SKU glossed here as one sellable variant. | `additional_support`: The Price Nobody Can Explain: the fictional case. → What the public record does and does not hold for this pattern. |\n| p46 | recommendation | The remedy is one owner per kind of price, price events with effective dates, campaigns as data, a 30-day history, promotions with an evaluation order and a stop rule, and prices frozen on the order. |  | `problem_solution`: The Price Nobody Can Explain: the pattern as shown in the cases. → The direction of the remedy, without teaching it. |\n| p47 | transition | The pricing chapter owns price ownership and history, the promotions chapter owns stacking and line allocation and the marketplaces chapter handles parity. |  | `elaboration`: The Price Nobody Can Explain: the remedy direction. → The chapters that own each part of it. |\n| p48 | example | The Spaghetti Junction sounds like a count of integrations in which a third have no owner and four write stock. | scenario: Invented quote: \"Thirty-four integrations. Thirteen have no owner. Four of them write stock.\"; figure: Figure 6: each connector was the fastest way to meet one need, until nobody can list them or say who owns them. | `sequence`: The entry for The Price Nobody Can Explain, complete down to its chapters, and the order of the table. → The next row of the table, The Spaghetti Junction (family: integration, the first of its three), announced by its parallel sub-heading and opened by its quote; the sub-heading is the transition and no connective sentence is asked for. |\n| p49 | description | Flows, agency scripts and vendor plugins move the same fact along several paths, and nobody can produce the list. |  | `elaboration`: The Spaghetti Junction: the quoted symptom. → The signs by which the pattern shows in general. |\n| p50 | cause_effect | Each connector was the fastest way to meet one need, and point-to-point is cheap the first ten times. |  | `cause_effect`: The Spaghetti Junction: what the pattern looks like. → The mechanism that produces it. |\n| p51 | evidence | A tangle of connectors costs incidents that cannot be diagnosed and upgrades that cannot be planned, a concern even the composable vendors' own association records. | statistic: 37% of 600 enterprise technology decision-makers cited integration complexity as a primary concern. | `cause_effect`: The Spaghetti Junction: the mechanism. → What it costs, with public figures. |\n| p52 | example | Kestrel & Pine's January 2027 integration inventory counted 34 integrations, of which 13 had no named owner and only 3 had a reconciliation job (consistency ruling 16). | scenario: 14 on the iPaaS, 9 agency scripts, 11 vendor connectors or plugins; none of the reconciliations covered stock or orders; four flows wrote stock into the platform and six writers of Duiven stock existed in all; a pre-order app (March 2026, told under The Secret Agent) is the pattern at its smallest. | `example`: The Spaghetti Junction: the cost in general. → One invented case at Kestrel & Pine, labeled fictional. |\n| p53 | evidence | Zalando replaced more than 100 disconnected interfaces with one developer portal: the first repair for a tangle is one place that lists every interface. | source: \"More than 100 disconnected interfaces\" replaced by one portal holding over 40,000 registered entities. | `additional_support`: The Spaghetti Junction: the fictional case. → A dated public example. |\n| p54 | recommendation | The remedy is an integration inventory with an owner and a contract per flow, shared facts moving as events through one place and a reconciliation for every copy. |  | `problem_solution`: The Spaghetti Junction: the pattern as shown in the cases. → The direction of the remedy, without teaching it. |\n| p55 | transition | The integration-styles chapter owns the styles and the inventory, the ERP chapter untangles the ERP's flows and the organization chapter assigns the owners. |  | `elaboration`: The Spaghetti Junction: the remedy direction. → The chapters that own each part of it. |\n| p56 | example | The Message in a Bottle sounds like a sender who considers an order delivered to the warehouse because it was sent. | scenario: Invented quote: \"We sent the order to the warehouse. If it didn't arrive, that's on them.\"; figure: Figure 7: messages between systems arrive once, twice, late or never, and a design that trusts them to arrive once finds the duplicates and gaps through customers. | `sequence`: The entry for The Spaghetti Junction, complete down to its chapters, and the order of the table. → The next row of the table, The Message in a Bottle (family: integration), announced by its parallel sub-heading and opened by its quote; the sub-heading is the transition and no connective sentence is asked for. |\n| p57 | description | A retry creates a second order or refund, and a dropped message leaves an order paid and never picked. |  | `elaboration`: The Message in a Bottle: the quoted symptom. → The signs by which the pattern shows in general. |\n| p58 | cause_effect | Delivery between systems is at least once, sometimes twice, late or never, and vendors say so, but integrations assume exactly once because on a quiet day it holds. | source: Shopify: an app \"might receive the same webhook more than once\", 8 retries over 4 hours, then the subscription is deleted; Stripe retries for up to three days; Mollie calls ten times over 26 hours and stops. | `cause_effect`: The Message in a Bottle: what the pattern looks like. → The mechanism that produces it. |\n| p59 | evidence | Trusted messages cost duplicates, lost orders, drifting copies and backlogs at peak. | case: Zalando's price and stock pipeline pushed every change as an event and reprocessed messages of which \"over 90%\" were unchanged; it delayed events \"by up to 30 minutes\" in Cyber Week, left the systems reading it with \"divergent versions of product data\", and was replaced on the critical path by an API the readers query directly (the event-pipeline vocabulary is put in plain words). | `cause_effect`: The Message in a Bottle: the mechanism. → What it costs, with public figures. |\n| p60 | example | On Black Friday 2026 the flow that created Kestrel & Pine's orders in the warehouse system one at a time was throttled; the messages arrived, but four hours late, and nothing watched their age, so about 8,000 orders missed the promised next-day delivery. | scenario: The WMS vendor's rate limit throttled the iPaaS flow; the queue backed up for four hours. | `example`: The Message in a Bottle: the cost in general. → One invented case at Kestrel & Pine, labeled fictional. |\n| p61 | evidence | Stripe tells integrators not to trigger fulfillment from the checkout landing page alone: a signal sent once from a page the shopper may never reach cannot carry the order. | quotation: \"You can't rely on triggering fulfillment only from your checkout landing page, because it's not guaranteed customers visit that page.\" | `additional_support`: The Message in a Bottle: the fictional case. → A dated public example. |\n| p62 | recommendation | The remedy is an idempotency key from the business event on every message, a record of handled events, state fetched from its owner, a dead-letter queue and a daily reconciliation. |  | `problem_solution`: The Message in a Bottle: the pattern as shown in the cases. → The direction of the remedy, without teaching it. |\n| p63 | transition | The events and reconciliation chapter owns idempotency, dead letters and reconciliation, the integration-styles chapter chooses the style and the payments chapter applies the rules to money. |  | `elaboration`: The Message in a Bottle: the remedy direction. → The chapters that own each part of it. |\n| p64 | example | The Pulled Rug sounds like a change announced in good time to a contact who left the year before. | scenario: Invented quote: \"They announced it in November. The e-mail went to someone who left in 2025.\"; figure: Figure 8: vendors announce their changes, but without a record of the dependency and someone reading the changelog, the integration breaks first and the news arrives later. | `sequence`: The entry for The Message in a Bottle, complete down to its chapters, and the order of the table. → The next row of the table, The Pulled Rug (family: integration, the last of its three), announced by its parallel sub-heading and opened by its quote; the sub-heading is the transition and no connective sentence is asked for. |\n| p65 | description | A script keeps calling a retired version, chargebacks arrive before the new mapping and changelogs reach a mailbox nobody reads. |  | `elaboration`: The Pulled Rug: the quoted symptom. → The signs by which the pattern shows in general. |\n| p66 | cause_effect | Vendors announce changes, but the merchant has no record of the dependency, no reader and no test, so the contract exists on one side only. |  | `cause_effect`: The Pulled Rug: what the pattern looks like. → The mechanism that produces it. |\n| p67 | evidence | A missed change costs stale stock, seller-account strikes, chargebacks and emergency rewrites, although the calendars are public. | fact: Amazon's Marketplace Web Service was \"no longer available\" from 1 April 2024, with migration to the Selling Partner API required by 31 March 2024.; fact: bol announced on 3 November 2026 that version 10 of its Offers API would be switched off on 1 February 2027. | `cause_effect`: The Pulled Rug: the mechanism. → What it costs, with public figures. |\n| p68 | example | In February 2027 a retired API version left Kestrel & Pine's bol stock stale for two days, because the announcement went to a contact who had left the agency. | scenario: 8 February 2027: the marketplace connector retired the API version a 2021 agency script used to push stock to bol, a Dutch marketplace; announced in November 2026 to a contact who had left in 2025; the script logged errors an opic and per country, nobody in a 14-person team reads the Official Journal, and each rule arrives without an owner. |  | `cause_effect`: The Long Fuse: what the pattern looks like. → The mechanism that produces it. |\n| p124 | evidence | A deadline found late costs fines, blocked invoices and emergency prices, although the dates are public years ahead. | fact: Belgium's structured B2B e-invoicing obligation applied from 1 January 2026, announced 18 September 2024, with fines of €1,500, €3,000 and €5,000.; fact: The European Accessibility Act applied to e-commerce services from 28 June 2025; PCI DSS requirements 6.4.3 and 11.6.1 became mandatory on 31 March 2025; Germany has required businesses to receive e-invoices since 1 January 2025. The PCI dates are attributed to the PCI Security Standards Council and the German date to the Federal Ministry of Finance in the text. | `cause_effect`: The Long Fuse: the mechanism. → What it costs, with public figures. |\n| p125 | example | Kestrel & Pine caught the fuse once: its Belgian business customers have received e-invoices over Peppol since January 2026. | scenario: E-invoices over Peppol (glossed as a European network for structured electronic invoices), issued and numbered in the ERP through the EDI provider as access point. | `example`: The Long Fuse: the cost in general. → One invented case at Kestrel & Pine, labeled fictional. |\n| p125a | example | Its 2027 regulatory calendar turns each remaining rule into a dated requirement with an owner. | scenario: Kept by the head of engineering with the finance director; covers accessibility of the three storefronts and the checkout widgets, the Dutch e-invoicing plan for 2030, packaging rules and the product passport. | `sequence`: The Long Fuse: the one rule caught in time. → What the merchant does about the rules still ahead. |\n| p126 | evidence | The Belgian mandate gave fifteen months of notice and then fines. | fact: Announced September 2024 for January 2026. | `additional_support`: The Long Fuse: the fictional case and its calendar. → A dated public example. |\n| p127 | recommendation | The remedy is a regulatory calendar with a named owner that lists each rule's countries, date and systems, with vendor conformance as a procurement item. |  | `problem_solution`: The Long Fuse: the pattern as shown in the cases. → The direction of the remedy, without teaching it. |\n| p128 | transition | The regulation chapter owns the calendar, the EDI and tax chapters implement e-invoicing and the security chapter covers the PCI requirements. |  | `elaboration`: The Long Fuse: the remedy direction. → The chapters that own each part of it. |\n| p129 | example | The Secret Agent sounds like 600 stock levels changed overnight by something the team can only guess at. | scenario: Invented quote: \"Something changed 600 stock levels on Tuesday night. We think it was the pre-order app.\"; figure: Figure 16: a script, app or AI agent that writes orders, stock, prices or money with no owner, no identity of its own and no approval changes the business in the dark. | `sequence`: The entry for The Long Fuse, complete down to its chapters, and the order of the table. → The next row of the table, The Secret Agent (family: governance, the last pattern), announced by its parallel sub-heading and opened by its quote; the sub-heading is the transition and no connective sentence is asked for. |\n| p130 | description | Scripts and apps share one admin's API key and write beside the official feeds. |  | `elaboration`: The Secret Agent: the quoted symptom. → The signs by which the pattern shows in general. |\n| p131 | cause_effect | Apps are easy to add, hard to see and broadly permitted by default, and AI agents arrive through the same door with more autonomy, as live agent-initiated payments show. | statistic: Visa reported 31 issuers and 4 merchants live with agent-initiated transactions in Europe (2 July 2026). | `cause_effect`: The Secret Agent: what the pattern looks like. → The mechanism that produces it. |\n| p132 | evidence | An unowned writer costs phantom stock and price drift and, at worst, a compromised checkout. | case: The `cdn.polyfill.io` script, embedded by more than 100,000 sites, was sold in February 2024 and was injecting malware. | `cause_effect`: The Secret Agent: the mechanism. → What it costs, with public figures. |\n| p133 | example | At Kestrel & Pine a pre-order app wrote stock beside the official feed unseen, as the price-import script of the earlier pattern wrote prices. | scenario: March 2026: two weeks of phantom reservations on 600 variants; the October 2026 price script, told under The Price Nobody Can Explain, is pointed to and not retold. | `example`: The Secret Agent: the cost in general. → One invented case at Kestrel & Pine, labeled fictional. |\n| p133a | explanation | Waypoint answers by giving every integration a named owner (W5) and by preparing for AI agents without deploying one (W8). |  | `problem_solution`: The Secret Agent: the two unseen writers. → The merchant's answer: W5 and W8. |\n| p134 | evidence | Polyfill.io is checkout code that changed hands unseen. | case: The Polyfill.io sale and malware injection, June 2024. | `additional_support`: The Secret Agent: the fictional case and the merchant's answer. → A dated public example. |\n| p135 | recommendation | The remedy is an owner, separate credentials and stated rights for every writing actor, least privilege, human approval over a threshold and a person at the gate for AI agents, whose protocols already carry an identity and a mandate for the agent. | source: OpenAI and Stripe's Agentic Commerce Protocol (releases through April 2026) and Google's Universal Commerce Protocol (launched 11 January 2026) carry an identity and a mandate for the agent. | `problem_solution`: The Secret Agent: the pattern as shown in the cases. → The direction of the remedy, without teaching it. |\n| p136 | transition | The extensibility chapter owns app governance and permissions, the security chapter covers API keys and script monitoring and the AI chapter covers agents, mandates and W8. |  | `elaboration`: The Secret Agent: the remedy direction. → The chapters that own each part of it. |\n\n### Where the Patterns Strike\n\n**Controlling idea** (`analysis`, id `where-the-patterns-strike`): Most patterns are born at the Growing stage and paid for at the Omnichannel stage, so the origin of a pattern and its cost are a stage apart.\n\n**Advances the thesis** (S3): Places each pattern's origin in an earlier stage than its cost, which is what 'reasonable when chosen' looks like over time.\n\n**Transition in:** `time`: The sixteen patterns, each described on its own. → When each one typically begins and when it hurts, across the four scale stages.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p137 | claim | Across the four scale stages (Starting, Growing, Omnichannel, Group) most patterns are born at Growing and paid for at Omnichannel, in the author's judgement. | table: Sixteen patterns by four stages (Starting, Growing, Omnichannel, Group), with the cell where each is born and the cell where it hurts marked. |  |\n| p138 | example | Kestrel & Pine enters Waypoint in March 2027 with ten incidents on record, listed on the next page; nine are met above under their patterns and the tenth, the Store Stock Mirage, is the Phantom Stock seen from a store; the stacking bug and the Black Friday backlog are not among the ten; its April 2027 stage map traces eight of the ten to Growing-stage designs still running in 2026. | scenario: Ten incidents on record when Waypoint starts (March 2027), nine met in the catalog (the Card-Testing Night under The First Snowfall), the tenth (the Store Stock Mirage) named as the Phantom Stock from a store; the stacking bug and the Black Friday backlog are not counted among the ten; the April 2027 stage map traces eight of the ten to Growing-stage (2019–2022) designs.; figure: Figure 17: seeds planted at the Growing stage grow into a thorny vine and a bill at Omnichannel; the caption now stops at 'paid for at the Omnichannel stage'. | `example`: The stage at which patterns are born and the stage at which they hurt. → The fictional merchant's ten incidents, all met above, sorted by the stage their designs came from. |\n\n### How the Patterns Reinforce Each Other\n\n**Controlling idea** (`cause_effect`, id `how-the-patterns-reinforce`): The patterns travel in three chains, which start at an unowned connector (integration), an unwatched dependency (governance) or a decision copied without its reasons (platform), so a repair holds at the origin of a chain and not at its last symptom.\n\n**Advances the thesis** (S4): Names the three chains and their origins and shows the fictional merchant ordering its program by them.\n\n**Transition in:** `cause_effect`: The stage table, which treats each pattern alone. → The patterns as causes of one another: three chains and where each starts.\n\n**Order of paragraphs** (`grouping`): A lead paragraph states the section's claim, then one chain per paragraph. The integration chain comes first because it is the longest and ends in the truth patterns, the symptoms the reader met first in the catalog. The governance chain comes second because it starts the same way, with something nobody owns; putting the platform chain between them would separate the two chains whose origins are alike and hide that likeness. The platform chain comes third because it starts differently, with a copied decision, and is the shortest. (This is not the order of the families in the catalog, which is truth, integration, platform and change, governance.) The identity thread follows the three chains because it belongs to none of them. The merchant's incidents traced to these origins come last: they are the reason for the order of the Waypoint decisions and would mean nothing before the chains are named.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p138a | claim | One pattern sets up the next, in three chains that cut across the families, so a repair holds where a chain starts and not where it ends. |  |  |\n| p139 | cause_effect | The integration chain starts at connectors nobody owns: a Spaghetti Junction produces Messages in a Bottle, which produce the truth patterns, and the First Snowfall, a platform pattern, makes all of them visible in one evening. |  | `example`: The claim that patterns set each other up in chains. → The first and longest chain, from connectors to messages to the truth patterns. |\n| p140 | cause_effect | The governance chain too starts with something nobody owns, a dependency nobody watches: a Lynchpin sets up the Pulled Rug, an integration pattern, and the same absence lets a Secret Agent write unseen and a Long Fuse burn down unread. |  | `sequence`: The first chain. → A second chain, and where it starts: with something nobody owns. The unit says so in its first sentence. |\n| p141 | cause_effect | The platform chain starts with a copied decision: the Giant's Boots lead to the Forked Platform or the Burned Bridge, and One Size Fits None is the same unmeasured decision at Group scale. | figure: Figure 18: the three chains drawn with twelve of the sixteen patterns, the First Snowfall amplifying whatever is already there. | `contrast`: Two chains that start with something unowned. → A third that starts with a copied decision; the unit says so before the colon. |\n| p141a | claim | The Familiar Stranger, the identity thread, runs under all three chains, because nobody owns the customer match, so each chain's repair still has to guess which records are one person. |  | `additional_support`: The three chains. → The one truth pattern that belongs to none of them and lies under all. |\n| p142 | analysis | Kestrel & Pine's incidents start at such origins (unowned scripts, an app writing stock, one EDI consultant), which is why Waypoint decides ownership first (W1 for stock, W5 for every integration), adds the hubs (W2, W3), makes the copies trustworthy and keeps the platform (W4). | scenario: The unowned bol stock script and German price-list export (among the five unowned integrations of April 2027), the pre-order app, the one EDI consultant; W5, W2 (OMS), W3 (PIM), W4. W1 (stock ownership) is named beside W5. | `cause_effect`: The three chains and the thread, and the ten incidents counted in the stage section. → The merchant's incidents traced to the chains' origins, and what that implies for the order of the repair. |\n\n## Conclusion: Using the Patterns\n\n**Synthesis:** The catalog, the stage table and the chains say one thing: a promise is broken somewhere other than where it was made, in time (born at one stage, paid for at the next) and in the landscape (at the end of a chain that began at a connector nobody owns, a dependency nobody watches or a decision copied without its reasons).\n\n**So what:** The remedy is rarely a new platform; it is ownership, contracts and reconciliation. Finding a pattern is not finding someone to blame, because each decision behind it was reasonable when made: the question is who owns the join now.\n\n**Callback:** The opening sale that the storefront accepted and the warehouse never received. The reader can now name it (a Message in a Bottle), look upstream for a connector with no owner, and ask who owns it now.\n\n**Takeaway** (`course_of_action`): Use the patterns as questions: in a design review at every handoff of one order, in a vendor demo by asking to see the pattern and not the feature, and in due diligence by asking for the inventory, the writers, the version register, the regulatory calendar and the reconciliation reports.\n\n**Hand-off** to [Meet Kestrel & Pine](meet-kestrel-and-pine.html): `example`: The sixteen pattern names, and the Kestrel & Pine incidents this page used one at a time as illustrations. → The merchant as a whole: its business lines, systems and people, and the ten incidents as one landscape's history.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p147 | claim | The catalog, the stage table and the chains say one thing, that a promise is broken somewhere other than where it was made (a stage later or at the end of a chain), so the remedy is rarely a new platform but ownership, contracts and reconciliation. |  |  |\n| p148 | analysis | The sale the page opened with can now be named a Message in a Bottle and traced upstream to an unowned connector, and the question to ask there is who owns it now, not who is to blame, asked in three situations before an incident does. |  | `example`: A failure shows somewhere other than where it began. → The opening sale, named and traced upstream; the question of ownership, not blame; a closing sentence that announces three situations. |\n| p143 | recommendation | In a design review, walk one order through the design and ask at every handoff which pattern could occur and what prevents it. |  | `elaboration`: The question of who owns the join, and the announcement of three situations. → The first situation: a design review, one order walked through every handoff. |\n| p144 | recommendation | In a vendor demo, ask to see the pattern and not the feature. |  | `similarity`: The patterns used as questions about one's own design. → The same questions put to a vendor: a split shipment's status, a refund sent twice, what an app may write. |\n| p145 | recommendation | In due diligence, ask for the documents that name owners, because each missing document is a pattern with no owner. |  | `similarity`: Questions put to a vendor. → Documents asked of a company: the integration inventory, the writers of stock, prices and money, the version register, the regulatory calendar, the last reconciliation reports. |\n| p146 | transition | The next page introduces the merchant the book follows, with the ten incidents used here as they were lived. |  | `example`: The patterns and the Kestrel & Pine incidents used one at a time. → The merchant as a whole, on the next page. |\n\n## Non-goals\n\n- Teaching any remedy in depth; every pattern links to the chapters that own it.\n- Introducing Kestrel & Pine as a company; the page uses the incidents only as illustrations. See [Meet Kestrel & Pine](meet-kestrel-and-pine.html).\n- A taxonomy of security threats; the Card-Testing Night is a trust failure, not one of the sixteen. See [Protecting the Shop: Card Data, Account Takeover, Bots and Skimmers](commerce-security.html).\n- Ranking the patterns by frequency; no survey supports it, and the stage table is labeled as the author's judgement.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Before print: some public examples (Shopify Scripts' end date, the Visa agentic-transactions release, the bol Offers API v10 switch-off) rest on brief entries tagged VERIFIED or WIDELY REPORTED with search-snippet provenance; a reviewer should spot-check the three URLs.\n\n## Decision log\n\n- **2026-11-13** — Auto-resolved by the author's instruction of 2026-11-13: One Size Fits None keeps its labelled illustrative scene, since multi-tenancy-and-isolation has no canonical scene to reuse; noted: One Size Fits None has no ledger incident; the page uses the three-storefronts-in-one-tenant situation and the deferred 2029 review as a labeled illustrative scene. If multi-tenancy-and-isolation adds a canonical scene, this page should reuse it.\n- **2026-11-13** — Auto-resolved in the cleanup pass, 2026-11-13, settling the round-3 escalation item by item. (a) p04: platform-and-change and governance 'stay silent until peak load, an upgrade or an earlier pattern shows them', which now fits The First Snowfall and The Forked Platform; the family definition itself is the journal spec's thesis and stays open for the author (rule 9 needs the journal-spec
