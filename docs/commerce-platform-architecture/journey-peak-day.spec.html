<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/40-journey-peak-day/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (the conclusion's chapter synthesis p40 and the part closing p45 to p47 under a 'Closing Part IX' heading); these are listed under decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Black Friday week 2026 at Kestrel & Pine: 31,000 D2C orders in the week, 2,300 in the peak hour of Friday 27 November (38 a minute, about 41 times an average hour's traffic); the order flow to the WMS, about seven orders a minute one at a time under the vendor's rate limit, falling behind at about 13:00 and four hours behind by 21:00; the 19:40 sell-out reaching the ERP at 19:45, the storefronts at about 20:30 and the marketplaces at about 21:35; and what each person saw and could do.\n- **Know:** The outcome (1,340 units oversold, 1,120 orders affected: 760 canceled and 360 delayed, about €96,000; about 8,000 orders that missed next-day delivery outside that figure) and the December 2026 post-mortem's five findings.\n- **Know:** The 2027 plan for 26 November 2027: a forecast of 60 orders a minute, every link tested at 80 and the OMS-to-WMS link at 120, the order path through the OMS (marketplaces from 15 September, D2C from 13 October, wholesale from 8 December, a freeze from 15 November to 5 December), stock events through the availability service within a minute, eight switches with owners and triggers, a runbook, a rehearsal and a reconciliation report at 08:00 on Saturday.\n- **Believe:** The evening was lost in the afternoon, by a queue nobody could see.\n- **Believe:** A stock chain of scheduled copies is harmless on an ordinary day and a two-hour blind spot at peak.\n- **Believe:** Most of a peak fix is visibility and switches rather than new systems.\n- **Be able to:** Write a peak plan as a journey hour by hour, with a capacity figure per link, a gauge on every queue and a name in every row.\n- **Be able to:** Build a degradation ladder whose switches each have an owner, a trigger and a rehearsal, with checkout, payment and the order path never switched off.\n\n**Audience:** Readers new to commerce architecture, in particular the engineer or product manager asked to make sure Black Friday does not happen again, and the operations or ecommerce lead who will own a row of the runbook.\n\n**Already knows:**\n\n- Kestrel & Pine, its people, its 2026 and January 2027 incidents in outline, the Waypoint decisions W1 to W8 and the names of the sixteen failure patterns.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines, 'system', 'the shop platform' for the hosted product, the four scale stages, system of record, single writer, events, idempotency and reconciliation.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Parts II to VIII: available-to-promise and per-channel buffers; promotions as data; checkout and payment; one order record; warehouse waves and cut-offs; integration styles, queues, events and reconciliation; peak load and reliability (capacity in orders per minute, controlled queues, degradation, incident teams).\n- From Part IX: Journeys 1 to 3 (Eva's order #1072455, its exchange, Bergzicht's EDI reorder), each walked through the late-2027 design and compared with the January 2027 landscape.\n\n**Does not yet know:**\n\n- Rate limit; dead-letter queue; stock event; degradation ladder; waiting room; p95 response time; game day; thundering herd and backoff with jitter; marked test orders.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a peak evening on which the storefront stayed up but orders oversold and deliveries slipped, the reader locates the failure in the chain behind the platform and lists what next year's plan needs, rather than a bigger platform. *Probe:* A brand's storefront stayed up all Black Friday evening, yet hundreds of orders were for a jacket that had already sold out and thousands missed next-day delivery. Its agency proposes a larger platform plan for next year. Using only this chapter: where did the evening go wrong, and what should next year's plan contain? | `custom` | cold_reader | major |\n| AC-2 | The reader can explain why a stock chain that works every other day oversells at peak. *Probe:* A merchant copies stock from its warehouse system to its ERP every 15 minutes, from the ERP to its shop hourly and from the shop to its marketplace connector hourly, and has never had an oversell. Using only this chapter: why not, and what happens when a jacket sells out at 38 orders a minute? | `custom` | cold_reader | major |\n| AC-3 | The reader can say what the team could and could not do on the evening, and what the plan gives it instead. *Probe:* At 20:20 on the peak evening the warehouse tells the ecommerce manager that a jacket is out and orders keep coming. Using only this chapter: what could the team do in 2026, and what does the 2027 plan give them? | `custom` | cold_reader | major |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What happened hour by hour on the 2026 peak day, and what does the 2027 plan change?\n\n> **Claim:** On 27 November 2026 the platform held while the chain behind it failed unseen: the order flow to the warehouse fell behind from about 13:00 under the WMS vendor's rate limit, and the 19:40 sell-out of the Ridgewalker jacket reached the channels 50 minutes to two hours late through scheduled stock copies. The 2027 plan changes that chain, not the platform: tested capacity per link, stock events, a gauged queue and eight degradation switches with owners.\n\n**Disputed by:** The view that peak readiness is the platform's scalability: if the storefront and checkout stay up the peak went well, and the remedy for an oversell is a larger platform plan or more servers.\n\n**So what:** A merchant that accepts the claim writes its peak plan as a journey hour by hour, tests its own order path rather than relying on the vendor's tests, and gives every queue a gauge and every switch an owner before buying anything. Kestrel & Pine's evening cost 1,340 oversold units and 1,120 affected orders (760 canceled, 360 delayed), about €96,000, and roughly 8,000 missed next-day deliveries; its post-mortem found no forecast, no capacity figure per link, a queue with no gauge, stock copied on a schedule and nobody with authority to flip anything. The 2027 plan forecasts 60 orders a minute, tests every link at 80 and the OMS-to-WMS link at 120 (which found a batch size that broke the rate limit), alarms at ten minutes of queue age, sends stock within a minute and closes the morning with an 08:00 reconciliation.\n\n**How and why:** A queue between the platform and the warehouse keeps checkout working when the warehouse link is slow, but it adds no capacity, so without a gauge it hides the delay: about four calls per order against a limit of about 30 a minute capped the flow near seven orders a minute, below the afternoon's arrival rate. Stock that travels by a 15-minute copy and two hourly copies is up to two hours late by design, which matters only when a product sells out inside the window, as the Ridgewalker jacket did at 38 orders a minute. The people who saw the problem had no switch to pull and no view to read, and a vendor's load tests find the vendor's bottleneck, so only the merchant's own test with marked orders finds its own.\n\n**Supporting claims**\n\n- **C1** — The evening was lost in the afternoon: the order flow to the WMS, creating orders one at a time under the vendor's rate limit, fell behind from about 13:00 in a queue with no gauge, alarm or owner and was four hours behind by 21:00.\n- **C2** — A stock chain of three scheduled copies, harmless on an ordinary day, let the 19:40 sell-out reach the storefronts at about 20:30 and the marketplaces at about 21:35, so the channels sold 1,340 units the warehouse did not have, and marketplace cancellations cost the most.\n- **C3** — The people who saw the problem had no gauge, no switch and no authority, and the clean-up was done by hand: 1,120 orders and about €96,000, plus roughly 8,000 missed next-day deliveries, with five post-mortem findings.\n- **C4** — The 2027 plan changes the chain, not the platform: a forecast of 60 orders a minute and a tested capacity figure per link, an order path through the OMS in batches keyed on the order number with a gauged queue, and stock events through the availability service within a minute.\n- **C5** — Eight switches with owners and triggers, a runbook, a rehearsal and an 08:00 reconciliation turn the 2026 evening's impossible actions into known moves, while checkout, payment and the order path are never switched off.\n\n## Role in the part\n\nWalks Black Friday 2026 through the same chain hour by hour, with what each system did and each person saw and could do, then lays out the 2027 plan built from it, and performs the part's closing (the published chapter does not yet do so: it ends with its questions and one paragraph handing off to Part X). Supports P9-4, P9-5 of part `part-9`.\n\n## Flow\n\n**Pattern:** `chronological` (also `problem_solution` in week, friday and weekend (the 2026 incident) against plan and wrong (the 2027 plan))\n\nThe evening is told twice in time order: the week, Friday hour by hour and the weekend's clean-up in 2026, then the plan for the same evening in 2027 and what it does when things still go wrong. The incident comes first because every part of the plan answers one of its mechanisms or one of the post-mortem's findings; putting the plan first would present switches and gauges for problems the reader has not yet seen, and putting the weekend before Friday would count a cost the reader cannot yet explain.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In Black Friday week 2026 Kestrel & Pine takes 31,000 orders, 2,300 of them in one hour; the storefront keeps accepting purchases while the integrations behind it cannot send orders to the warehouse or bring stock back fast enough, so customers buy jackets that have already sold out from a site that appears to be working.\n\n**Bridge:** The first three journeys' chain of handoffs on an ordinary April week, where a handoff takes minutes. → The same chain at about forty times its normal load, where the same handoffs take hours: what failed, who saw it, and what the 2027 plan changes.\n\n**Thesis statement** (KEY POINTS callout (bullets 1 to 3) and paragraph p01): The platform held while the chain behind it failed unseen: the order flow to the warehouse fell behind from about 13:00 under the vendor's rate limit, and the 19:40 sell-out reached the channels up to two hours late through scheduled copies; the 2027 plan changes the chain, not the platform, with tested capacity per link, stock events, a gauged queue and eight switches with owners.\n\n**Roadmap** (Paragraph p03):\n\n- The week before the evening and what the preparation missed. *Kept in:* week.\n- Friday 27 November 2026 hour by hour, then the three mechanisms behind it: the unseen queue, the two-hour sell-out and what the team could and could not do. *Kept in:* friday.\n- The weekend's clean-up, the cost and the post-mortem. *Kept in:* weekend.\n- The 2027 plan for the same evening: the rebuilt order path and stock events, forecast and capacity per link, the switches, the runbook and the rehearsal. *Kept in:* plan.\n- What the plan does when things still go wrong. *Kept in:* wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | In Black Friday week 2026 Kestrel & Pine takes 31,000 orders, 2,300 in one hour with storefront traffic about 41 times an average hour, and its shop platform keeps accepting purchases while the integrations cannot send orders to the warehouse or return stock fast enough, so customers buy sold-out jackets from a site that seems to work, which a measure of the page's availability would miss. | statistic: 31,000 orders in the week; 2,300 in the peak hour; storefront traffic about 41 times an average hour. |  |\n| p02 | context | In the order's journey, the product page, checkout, order export, picking and stock updates all run under peak pressure, so the handoffs that take minutes for the ordinary April orders of the first three journeys now take hours. |  | `emphasis`: The storefront that kept selling while the chain behind it fell behind; the first three journeys' ordinary April orders and the chain they crossed. → The same chain under peak pressure, where minutes become hours. |\n| p03 | transition | The chapter follows the evening twice, first the November 2026 incident (the week before, Friday hour by hour with its three mechanisms, the weekend's clean-up) and then the November 2027 plan (the rebuilt order path and stock events, forecast and capacity, switches, runbook, rehearsal, and what happens when things still go wrong), and closes Part IX; the scenario fixes the totals and the hourly figures are labelled reconstructions. |  | `sequence`: The chain under peak pressure. → The order in which the chapter tells the evening, and which figures are fixed. |\n| p04 | context | The methods the plan uses (capacity in orders per minute, controlled queues, optional work that can be paused, an incident team and checks after recovery) are explained in the peak-load chapter and drawn from dated public practice at Shopify, Zalando and AWS that the plan cites; this chapter applies them. |  | `elaboration`: The 2027 plan announced in the roadmap. → Where its methods are taught and what evidence they rest on. |\n\n## Sections\n\n### The Week Before the Evening\n\n**Controlling idea** (`context`, id `week`): The preparation for the week covered the promotion, the campaign pages and the warehouse staff, but not the integrations: no forecast, no load test, no gauge and no owner, and Thursday's busy evening hid how close the order flow was to its ceiling.\n\n**Advances the thesis** (C1, C3): Shows that nobody measured or owned the links that failed, before the day starts.\n\n**Transition in:** `sequence`: The roadmap's first item: the week before. → The plans made for the week.\n\n**Order of paragraphs** (`chronological`): The plans come first, then what they missed, then the week as it happened up to Thursday's warning; the warning only reads as a warning once the reader knows nobody measured the ceiling.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description | Milan Petrov plans a 20% outerwear discount for 23 to 29 November (the Ridgewalker from €199 to €159.20), the agency builds campaign pages, Daniel Okafor books temporary pickers and an extra PostNL collection, and the German marketplace stock has already been sent. | fact: 20% outerwear discount 23-29 November; €199 to €159.20; temporary pickers; extra PostNL collection. |  |\n| p06 | analysis | The preparation misses the integrations: there is no throughput forecast, load test, list of optional work to pause, integration owner on call or dashboard comparing accepted orders with warehouse intake, only the platform's status page, a process fitted to a smaller business. |  | `contrast`: What the business prepared. → What it did not prepare. |\n| p07 | evidence | The week built up day by day to 11,500 orders on Friday and 31,000 in the week (10.6% of the year's D2C orders), with the strain first showing in Wednesday's first 'where is my order' tickets. | table: Week table: Monday 2,100 to Sunday 4,600, Friday 11,500, total 31,000 (10.6%); daily figures illustrative, weekly total canonical. | `time`: The plans for the week. → The week as it happened, day by day. |\n| p08 | analysis | Thursday evening was the warning nobody read: the order flow kept up only because Thursday's rate was below a ceiling nobody knew. |  | `emphasis`: Thursday's row in the table. → Why it was a warning. |\n\n### Friday 27 November 2026, Hour by Hour\n\n**Controlling idea** (`process`, id `friday`): On Friday the order flow fell behind from about 13:00 in a queue nobody could see, the 19:40 sell-out reached the channels up to two hours late through scheduled copies, and the people who noticed had almost nothing they could switch.\n\n**Advances the thesis** (C1, C2, C3): Tells the evening hour by hour and then isolates the three mechanisms the 2027 plan is built against.\n\n**Transition in:** `time`: The week up to Thursday's warning. → Friday itself, hour by hour.\n\n**Order of paragraphs** (`chronological`): The clocks and the hour table give the whole day first, in the order the systems lived it; the three mechanisms are then pulled out of the table in the order they began (the queue at 13:00, the sell-out at 19:40, the team's response from 19:50). Explaining a mechanism before the table would describe an evening the reader has not yet seen.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | process (list) | Three clocks shape Friday's 11,500 orders: the order export that creates orders one at a time in the WMS, about four API calls per order against the vendor's limit of about 30 calls a minute, so about seven orders a minute, the stock updates that pass through three scheduled copies and take up to two hours, and the picking and collection times with the 22:00 next-day promise; the hour table then shows what the systems did and what the team saw. | table: Hour table, 00:00 to Saturday 03:00: orders per period (illustrative), queue about 500 at 17:00, 2,500 at 20:00, 4,400 at 21:00; 19:40 sell-out; 19:45 ERP; about 20:30 storefronts; 21:05 Milan zeroes the connector by hand; about 21:35 marketplaces sold out after the connector's next scheduled sync; 20:20, 20:35, 20:50 calls; ticket 21:30 answered 22:40; batch import at about 00:00, queue empty about 02:30. |  |\n| p10 | transition | Three things in the table are the mechanisms the 2027 plan is built against: the queue nobody could see, the two-hour sell-out, and what the team could and could not do. |  | `elaboration`: The hour table. → The three mechanisms pulled out of it. |\n| p11 | analysis | The queue kept checkout working and lost no orders, but it added no capacity, and with no gauge, alarm or owner it hid a delay that was four hours by 21:00, until Ruben Alves looked at 20:50. | fact: Ruben opens the iPaaS at 20:50; four hours behind at 21:00; 20:00 orders reach the WMS after midnight. | `elaboration`: The first mechanism named. → How the queue hid the delay. |\n| p12 | evidence | The limit sat in the integration, not the warehouse: the flow was capped by its calls per order against the vendor's rate limit, while picking capacity at Duiven stayed available and the afternoon waves were thin. | fact: Thin 15:00 and 16:00 pick waves at Duiven while the queue grew; picking never the limit.; figure: Figure 1: orders piling up in an unmonitored tunnel between a busy storefront and an idle warehouse. | `cause_effect`: The hidden delay. → What caused the ceiling. |\n| p13 | evidence | The sequence diagram shows the two hours in which the oversell happened, in which each arrow is a scheduled copy. | figure: Figure 2: the 19:40 sell-out reached the ERP in five minutes, the storefronts in about fifty and the marketplaces in about two hours. | `sequence`: The first mechanism, the queue. → The second, the sell-out. |\n| p14 | analysis | The two-hour window was the chain's design, not a fault: a chain of three scheduled copies is harmless on any day when nothing sells out inside it, and the inventory chapter explains why the copied number was also the wrong one. |  | `elaboration`: The diagram's arrows. → Why the window was by design. |\n| p15 | evidence | Three channels sold against the same zero: of the 1,340 oversold units the weekend later counted, about 790 were storefront and 550 marketplace orders, and the marketplace share cost more because a seller is measured on its cancellations, with about 160 marketplace orders affected, 140 canceled and a strike from bol. | statistic: 790 storefront and 550 marketplace units; 160 marketplace orders, 140 canceled; one bol strike. | `cause_effect`: The window by design. → What was sold inside it, channel by channel. |\n| p16 | evidence | By 20:50 four people knew something was wrong, and the table of what they could reach shows that most actions were impossible or possible only by hand. | table: What someone wanted to do / was it possible / what happened: zero the storefronts by hand (24 variants); edit marketplace listings by hand at 21:05; speed up the flow only with the vendor (ticket 21:30, answer 22:40); a mass e-mail Saturday 10:00; the theme sentence promising next day for orders before 22:00; no orders-per-minute view. | `sequence`: The second mechanism, the sell-out. → The third, what the team could do. |\n| p17 | analysis | The first and third rows say the most: the sell-out could have been stopped on the storefronts by hand at 19:50 if anyone had known to, the order flow could not be fixed by anyone at Kestrel & Pine before the vendor answered, and the 2027 plan is largely the table's 'No' and 'Only' cells turned into switches, gauges and contracts. |  | `emphasis`: The table's rows. → The two rows that matter most and what they lead to. |\n\n### Saturday to Monday: Finding Out What Was Sold\n\n**Controlling idea** (`cause_effect`, id `weekend`): The damage stayed invisible until support's tickets showed it, the clean-up was done by hand because no system linked the lists, and the cost and the post-mortem name the missing forecast, figures, gauge, events and authority.\n\n**Advances the thesis** (C3): Counts the cost of the unseen chain and records the five findings the plan answers.\n\n**Transition in:** `time`: Friday night and the queue drained by 02:30. → Saturday morning, when the damage was still invisible.\n\n**Order of paragraphs** (`chronological`): Saturday's discovery comes before the weekend's clean-up, the clean-up before the totals it produced, the hand reconciliations before the December post-mortem that named their cause; the post-mortem last hands the reader to the plan built on it. Giving the totals before the clean-up would present numbers nobody had yet been able to count, and putting the post-mortem earlier would separate the plan from the findings it answers.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | description | On Saturday morning the queue was empty but the damage was invisible: the platform showed 11,500 paid orders, the WMS 11,500 received with about 1,100 holding a Ridgewalker line it could not allocate, and support found the oversell from customers' tickets. |  |  |\n| p19 | evidence | The clean-up took three people the weekend and finance the week after, matching the WMS shortage list to orders by hand because marketplace orders had no shared identifier, and ended with 760 orders canceled and 360 delayed, 1,120 orders and 1,340 units in all. | table: Outcome table: canceled 760 orders, 900 units (refund, €15 voucher, seller cancellations); delayed 360 orders, 440 units (supplier delivery due 1 December); total 1,120 and 1,340. | `sequence`: The oversell found. → The work to find which orders it touched. |\n| p20 | evidence | The €96,000 breaks down, illustratively, into about €65,700 lost margin, €16,800 vouchers, about €6,500 marketplace penalties and about €7,000 support and re-shipping, while the roughly 8,000 orders placed between 17:00 and midnight that missed next-day delivery are not in that figure. | statistic: €65,700 + €16,800 + €6,500 + €7,000 ≈ €96,000; about 8,000 missed next-day deliveries. | `cause_effect`: The orders canceled and delayed. → What they cost, and what the figure leaves out. |\n| p21 | analysis | Three reconciliations ran by hand that weekend that should have been jobs: platform orders against WMS orders, WMS shortages against orders, and refunds against cancellations. |  | `elaboration`: The weekend's manual work. → The three checks it was, and what they should have been. |\n| p22 | analysis | The December post-mortem found five things (no forecast, no capacity figure for any link, a queue with no gauge, stock copied on a schedule, nobody with authority to flip anything) and recorded Milan's ten-unit marketplace buffer, and Noor Visser built the Waypoint proposal on it. | fact: Five findings; the December ten-unit connector buffer. | `conclusion_summary`: The weekend's cost and manual work. → What the post-mortem made of it. |\n\n### The 2027 Plan: The Same Evening, Rehearsed\n\n**Controlling idea** (`recommendation`, id `plan`): The 2027 plan answers each post-mortem finding in the chain, not the platform: a forecast and a tested capacity figure per link, an order path through the OMS in batches keyed on the order number with a gauged queue, stock events through the availability service, eight switches with owners and triggers, a runbook and a rehearsal.\n\n**Advances the thesis** (C4, C5): Lays out the plan link by link and switch by switch.\n\n**Transition in:** `problem_solution`: The post-mortem's five findings. → The plan for 26 November 2027 that answers them.\n\n**Order of paragraphs** (`problem_solution`): The rebuilt links come first, because every row of the capacity table and every switch trigger names them (the OMS, its batches and queue alarm, the stock events); the forecast and the capacity table then set the number each link is tested at; the switches act on those links; the runbook says who uses the switches and when; the rehearsal tests the whole. Putting the capacity table first would name links the reader has not met (both round-3 readers stumbled on exactly that); describing the switches before the links would name triggers (queue age, event lag) the reader has not met.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | context | Black Friday 2027 falls on Friday 26 November, and the plan for it answers the post-mortem's five findings one by one; approved with Waypoint in March 2027, it is owned by Noor as incident commander, and its figures are fictional and the public practices it borrows are cited in the peak-load chapter. | fact: 26 November 2027; peak week 22-28 November; Cyber Monday 29 November; approved March 2027; Noor incident commander. |  |\n| p25 | explanation | The order path now runs through a shared order management system (OMS) (marketplaces from 15 September after a parallel run in early September, D2C from 13 October), which sends warehouse work in batches sized to the API limit and keys each request on the order number so a repeat cannot create a second pick list, and the order flow gets first claim on the shop platform's per-app API budget, which nine apps and connectors share. | fact: The platform's API budget is granted per app; nine consumers shared it; the plan allocates the budget with the order flow first. | `problem_solution`: The plan announced as the answer to the post-mortem's findings. → The first answer: the order path rebuilt through the OMS. |\n| p26 | explanation | The queue now shows its oldest unsent order and alarms at ten minutes, failed messages go to a dead-letter queue that Ruben owns and the team has practiced replaying, wholesale and EDI orders move onto the OMS only after the peak (8 December), and changes freeze from 15 November to 5 December. |  | `additional_support`: The rebuilt order path. → The gauge, the dead-letter queue and the dates that protect it. |\n| p27 | explanation | The stock loop is replaced by stock events from the WMS to the availability service, which publishes available-to-promise per channel with buffers of three and one units within a minute, with a go/no-go on 15 October and a rehearsed fallback to the 2026 chain with the ten-unit buffer. | figure: Figure 3: the 2027 chain with orders through the OMS, stock events through the availability service and one dashboard. | `sequence`: The order path to the warehouse. → The stock path back from it. |\n| p24 | evidence | With the links rebuilt, the forecast of 60 orders a minute, about one and a half times 2026, sets the number they are tested against: every link the merchant runs at 80 and the OMS-to-WMS link alone at 120, the slowest link setting the promise and the waiting room (glossed here), and the capacity table gives each link's 2026 figure, its 2027 target and the proof. | source: Shopify Engineering, 2025: forecasting at roughly 150% of the previous year's load.; table: Capacity table: storefront and checkout, PSP (200 a minute), order into the OMS (150), OMS to WMS (120, alarm at 10 minutes), stock events (under a minute, 300 a minute), marketplace push, picking, ERP (daily batch, W5). | `sequence`: The rebuilt order path and stock path. → The forecast and the capacity each link is tested at. |\n| p28 | evidence | The degradation ladder has eight switches, each existing, flipped once in the October rehearsal and owned by one person who may flip it without a meeting, with a trigger for each, so that the essential functions (checkout, payment, order creation and the order path) keep working and are never switched off. | table: Switch table: eight rungs with owner, trigger and effect, and the 'never' row.; figure: Figure 4: the ladder standing on a locked checkout. | `sequence`: The rebuilt links and their tested capacity. → The switches that act on them. |\n| p29 | analysis | Rung 5, the widened delivery promise, is the one 2026 lacked most: the 2026 promise was a sentence in a theme file, Noor specified a promise service in May 2027 that widens the promise as the queue grows, and the switch is the override with an owner and a trigger. |  | `emphasis`: The eight rungs. → The one 2026 lacked most. |\n| p30 | transition | The runbook is a four-page document, written in September, rehearsed on 15 November and kept open in the situation room, in five parts. |  | `sequence`: The switches. → The runbook that says who uses them and when. |\n| p31 | description | Roles: Noor decides as incident commander, and each of Ruben, Milan, Daniel's shift lead, Sanne's team and an agency engineer owns named links, with the vendors' emergency contacts on the first page. |  | `sequence`: The runbook's five parts. → The first, who does what. |\n| p32 | description | The dashboard is one screen in business units, refreshed every minute, with orders per minute, queue age, event lag, dead-letter depth, checkout errors, PSP rates and rate-limit headroom, and an alarm for missing orders. |  | `sequence`: The roles. → What they watch. |\n| p33 | description | The cadence runs the situation room from 16:00 to midnight with check-ins every 30, then every 15 minutes, reading the dashboard against the switch thresholds. |  | `sequence`: The dashboard. → When it is read. |\n| p34 | description | Communication uses three templates written in advance, including a delay e-mail filled with order numbers from the OMS, and Mara is told at the first switch. |  | `sequence`: The cadence. → What is said to customers, marketplaces and the company. |\n| p35 | description | The morning after, an 08:00 reconciliation report compares orders, stock, payments and refunds across systems by key, each difference with an owner and a fix, produced by Hanna Berg's team under the W7 definition of an order. | fact: 08:00 Saturday 27 November 2027; four comparisons. | `sequence`: Friday evening's communication. → Saturday morning's check. |\n| p36 | evidence | Two load tests with marked orders that fulfillment skips and a game day preceded the freeze (with a last runbook walk-through on 15 November); the load tests, at 60 in September and at 80 and 120 in October, found the first real defect: a batch size that broke the WMS rate limit at 120 and retries that doubled the load, fixed with a smaller batch and jittered retries. | source: Zalando Engineering, 2020: order-flow simulators whose orders fulfillment skips.; source: AWS Architecture Blog, 2015: exponential backoff and jitter. | `cause_effect`: The plan as written. → The tests that tried it. |\n| p37 | evidence | The October game day rehearsed three failures (the WMS unreachable for thirty minutes, the availability service stopped, a payment method declining) and each exercise proved or rewrote a runbook page. | scenario: Queue to about 1,800, promise switch at minute 11, replay in 22 minutes; fallback chain for an hour; method off within eight minutes (illustrative). | `additional_support`: The load tests. → The rehearsal of failures. |\n\n### When It Goes Wrong in 2027\n\n**Controlling idea** (`counterargument`, id `wrong`): The plan does not promise a quiet evening; it gives each expected failure a known trace and a known fix, and deliberately leaves the ERP slow.\n\n**Advances the thesis** (C4, C5): Tests the plan against the failures it expects.\n\n**Transition in:** `contrast`: The plan and its rehearsal. → What happens when the evening still goes wrong.\n\n**Order of paragraphs** (`order_of_importance`): The failures the plan guards against come first because they are the risks to the evening; the delay it accepts on purpose comes last, as the one exception. Reversing them would open on what does not matter on the night.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | evidence | For each failure it expects on 26 November 2027 (a growing queue, lagging stock events, renewed throttling, a duplicate, a degraded PSP, a platform incident, a forecast wrong by two) the plan names the trace and the fix. | table: If / the plan says: seven rows. |  |\n| p39 | analysis | The plan deliberately leaves the ERP slow, because late invoices are the one delay the chain can afford. |  | `contrast`: The failures the plan guards against. → The delay it accepts on purpose. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** For the chapter: the 2026 evening was not lost to slow systems but to links nobody could see or touch, so most of the 2027 plan is visibility and switches. For the part: the Three-Status Order, the Double Refund, the ASN Chargeback and the Black Friday Oversell look like four failures in four areas, but in each every system did what it was built to do and the promise broke at a handoff where a fact had two writers or none, a message had no key or a link had no measure.\n\n**So what:** A merchant writes its peak plan as a journey hour by hour with a name in every row, and gives every queue a gauge and every switch an owner before buying anything; for the part, Waypoint's answer was mostly in the joins (three of eight decisions add a system; the rest set owners, contracts, keys, reconciliations, the despatch advice's source and one definition of an order), and the 2027 peak plan is mostly gauges and switches with owners.\n\n**Callback:** The chapter's opening storefront that kept accepting purchases while the chain behind it fell behind; and, for the part, the Part IX opening's warehouse that reports a parcel shipped while the storefront still shows it being prepared. p40 answers the chapter's opening: the page's availability was the wrong measure. p45, under the heading Closing Part IX, returns to the part opening's warehouse and storefront, names each journey's incident and shows they are one failure at a handoff; p46 and p47 perform the part closing's so-what and take-away.\n\n**Takeaway** (`course_of_action`): Walk one ordinary order, one return, one business order and last peak's busiest hour through your own landscape with a step table; at each row name the system of record and count the writers of each fact, and ask of each handoff its idempotency key, whether its style matches its clock and which reconciliation catches what it misses, starting where the promise and the system of record belong to different systems.\n\n**Hand-off** to [Part X — EVOLUTION: Decisions That Change With Scale](part-10.html): `time`: The landscape as it works at one moment, shown in the four journeys. → How the same decisions look different as the business moves through the four stages.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | synthesis | The opening's storefront that kept selling while the chain behind it fell behind shows that the page's availability was the wrong measure: the right ones were orders per minute against the warehouse's intake, the age of the oldest unsent order and the time a sell-out takes to reach each channel, and the 2027 plan puts each on a screen with an owner. | reasoning: The opening scenario set against the queue, the stock chain and the plan. |  |\n| p41 | synthesis (list) | Established: a queue between a platform and its warehouse system is right under peak load only with a gauge, an alarm, an owner and a replay procedure; stock copied on a schedule oversells in proportion to the sales rate and the delay; only a load test of the merchant's own path with marked orders finds its bottleneck. |  | `elaboration`: The chapter's answer. → The points it rests on, starting with what the sources establish. |\n| p42 | synthesis (list) | Depends on context: the ladder's order depends on what the business can afford to lose, a static but honest peak promise is the interim without a computed promise, and an OMS cutover belongs before the peak only when its parallel run and load test finished in time. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p43 | recommendation (list) | The author's synthesis: the lesson is not that the systems were too slow but that nobody could see or touch them, so most of the plan is visibility and switches, and a peak plan should be written as a journey hour by hour with a name in every row. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p44 | recommendation (list) | Eight questions let the reader find in their own company when the order flow fell behind, how long a sell-out takes to reach each channel, which switches were rehearsed and by whom, the promise change, vendor contacts, marked test orders, the Saturday reconciliations and the runbook's first row. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own company. |\n| p45 | synthesis | Part IX opened with a warehouse that reports a parcel shipped while the storefront still shows it being prepared; its four journeys' incidents (the Three-Status Order, the Double Refund, the ASN Chargeback, the Black Friday Oversell) look like four failures in four areas but are one: every system did what it was built to do, and the promise broke at a handoff where a fact had two writers or none, a message had no key or a link had no measure. | reasoning: The part opening's warehouse and storefront set against the four incidents: three statuses for one order (#1052877, six days, eleven tickets), two writers of one refund (212 returns, €19,400), a despatch advice written before the pallets were packed (€14,200), a stock copy two hours old behind a queue nobody watched (1,340 units). | `conclusion_summary`: This chapter's answer, the last of the part's four journeys. → A marked turn: this chapter also closes Part IX, and what the four journeys say together, set against the part opening. |\n| p46 | recommendation | Kestrel & Pine's answer was therefore mostly in the joins: three of Waypoint's eight decisions add a system (the availability service, the OMS, the PIM), while its integration standards, EDI rules and single definition of an order set owners, contracts, idempotency keys, reconciliations and the despatch advice's source, and the 2027 peak plan is mostly gauges and switches with owners. | case: W1-W3 add systems; W5, W6 and W7 set owners, contracts, keys, reconciliations and the despatch advice's source; the peak plan's gauges and switches. | `problem_solution`: The one failure behind the four incidents. → The answer Waypoint gave to it. |\n| p47 | recommendation | A reader can find next year's incidents in their own landscape before comparing any vendor by walking one ordinary order, one return, one business order and last peak's busiest hour through it with a step table, naming the system of record and counting writers at each row and asking each handoff for its key, its clock and its reconciliation. |  | `cause_effect`: Kestrel & Pine's answer in the joins. → The same walk for the reader's own landscape. |\n| p48 | transition | The journeys showed Kestrel & Pine's landscape at one moment; Part X follows the same decisions over time (buy or build, stay or replatform, how to organize the team) as questions every merchant faces, and how the answers change as a business moves through the four stages. |  | `time`: The landscape as it works at one moment, shown in the four journeys. → How the same decisions look different as the business moves through the four stages. |\n\n## Non-goals\n\n- The concepts (peak profiles, capacity planning, backpressure, waiting rooms, degradation, observability, SLOs, the four postures, the scale-stage table) and the public evidence behind them. See [Black Friday Every Year: Peak Load, Resilience and Recovery](peak-load-and-reliability.html).\n- Why the copied stock number was the wrong number and how available-to-promise is computed. See [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html).\n- The promotion settings and the stacking bug of the same week. See [Discounts, Coupons and Loyalty: Promotions Without Chaos](commerce-promotions.html).\n- Waves, cut-offs and warehouse staffing; the promise service. See [Pick, Pack, Ship: Warehouse Management and Fulfillment](warehouse-and-fulfillment.html), [Getting It There: Carriers, Labels, Tracking and the Delivery Promise](shipping-and-delivery.html).\n- The API-budget analysis in detail; the OMS cutover sequence. See [Many Merchants, One Platform: Multi-Tenancy, Pods and Isolation](multi-tenancy-and-isolation.html), [Moving Without Burning the Bridge: Replatforming and Migration](replatforming-and-migration.html).\n- Marketplace cancellation standards and the strike. See [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-07** — Told the evening in the order the people discovered it (warehouse at 19:50, operations at 20:20, ecommerce at 20:35, integration at 20:50) rather than in the order the problems began (13:00), so the reader feels the absence of a gauge; the 'could and could not do' table then map section's flow rewritten, the OMS glossed in p25 and the forward pointer 'described after the table' removed (rule 3); the roadmap p03 lists the plan's parts in the new order; (2) the 21:00-22:00 row tells Milan's 21:05 edit once, in the team column, and the systems column names the 21:15 push as the shop platform's push to the connector (rule 3). Cheap one-reader fixes: the stock-chain item says the connector passes the zero to the marketplaces at its own next sync (the ledger's connector sync), 'every link the merchant runs is tested at 80' (the storefront is the vendor's), the waiting-room gloss is given once. Not changed: the 11,500 platform orders against 1,100 unallocatable WMS orders (one reader; the ledger gives no figure that relates them), the forward jump to the Double Refund and the October rehearsal pointers (rule 10, current position). No further round, as the instruction prescribes; check-report.json (round 3) is stale after these edits. Rejected: Moving the capacity table out of p24 instead of reordering units.; A fourth round.\n- **2026-11-13** — Under the book-wide vocabulary ruling the hosted product is called 'the shop platform' where the text means Kestrel & Pine's platform; vendor-neutral uses of 'platform' stay. Rejected: Leaving 'the platform' throughout.\n\n## Sources\n\n- **Internal**\n  - _research/scenario-ledger.md (Peak; problem 1; W1-W8; lines journey-peak-day, peak-load-and-reliability, multi-tenancy-and-isolation, inventory-and-availability, marketplaces-and-channel-integration, warehouse-and-fulfillment, shipping-and-delivery, replatforming-and-migration, commerce-promotions) and _research/consistency-issues.md — Every figure, date, time and name of the 2026 evening and the 2027 plan.\n  - journal-spec.json (journey-peak-day; part-9 and its closing; part-10 transition_in) — Intent, thesis, role, acceptance criteria, the part closing and the hand-off.\n  - meet-kestrel-and-pine; peak-load-and-reliability; inventory-and-availability, warehouse-and-fulfillment, marketplaces-and-channel-integration, multi-tenancy-and-isolation, commerce-promotions, shipping-and-delivery, replatforming-and-migration; _research/brief-platform-engineering-scale.md, brief-shopify.md, brief-integration-and-data.md — The concepts applied and the sibling reconstructions this journey agrees with (from spec.md).\n- **External**\n  - Shopify Engineering, How we prepare Shopify for BFCM (2025) — The 150% forecast convention and Game Days.\n  - Zalando Engineering, How Zalando prepares for Cyber Week (2020) — Test orders that fulfillment skips; the Situation Room.\n  - AWS Architecture Blog, Exponential backoff and jitter (2015) — The thundering-herd finding in the October load test.\n  - AWS Builders' Library (2019), Amazon SQS documentation (n.d.), Google SRE book (2017), Hodgson (2017), Cloudflare (2021), Stripe rate-limit documentation (n.d.), Shopify 2018 and 2023 and webhook documentation, Zalando 2019 — As cited in the article's Sources.\n\n## Changelog\n\n- **2026-11-13** — Confirming draft check round 3: escalate on two corroborated flow points (the capacity table before the links it names, at fault in the spec; the doubled 21:05 event in the hour table), three minor; all fixed cheaply without another round (see decision_log): plan units reordered p23, p25, p26, p27, p24, p28-p37 with subheadings moved, hour-table row rewritten. check-report.json is stale after these edits.\n- **2026-11-13** — Draft check round 2: escalate (9 blocking: 7 corroborated flow points, 1 corroborated term, 1 transition; one at fault in the spec, the 1,900 throttles). Auto-resolved (see decision_log); p23, p24, p25, p29 and p36 redrafted in the same units, subheadings adjusted, open questions closed.\n- **2026-11-13** — Draft check round 1: escalate (13 blocking: 8 corroborated flow points, 1 corroborated term, AC-1, AC-4, AC-5 at p12 and its transition; one flow point at fault in the spec, p39's 2028 note). Spec: intro reordered (p02 where <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
