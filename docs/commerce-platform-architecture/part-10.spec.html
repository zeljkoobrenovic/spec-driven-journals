<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-13 from the published page (posts/part-10-intro/index.md, 462 words, ten units) and its former spec.md; the page was revised to match the same day (see decision_log). One spec paragraph per unit of the page; the KEY POINTS callout and Figure 3 (Kestrel & Pine's 2027 timeline) are evidence of the claim paragraph (p04), Figure 1 (growth in jumps) of p01 and Figure 2 (the five decisions as one loop) of p03.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part X takes five decisions in order: build, buy or assemble, with a full three-year cost; migration in limited, reversible steps; the scale stages and what invalidates an earlier design; ownership of systems, integrations and apps; and AI that recommends against AI authorized to act.\n- **Know:** Each chapter uses Kestrel & Pine's 2027 program, Waypoint, as its case: the platform review ending in stay and surround with a 2029 review; product publication moved gradually and order channels on separate dates with a freeze around Black Friday; the stage map; the January inventory with 13 of 34 integrations unowned; and better data and interfaces before any shopping agent.\n- **Know:** The five are decisions about ownership and timing rather than tools: build what customers choose you for, buy what every merchant needs and own the joins; cross a stage one seam at a time with the old owner kept through one peak; and give every system, integration, app and agent a named owner and every fact one writer.\n- **Be able to:** Pick the Part X chapter that matches the decision in front of them: a replatforming pitch, a migration plan, a board question about scale, an ownership gap or an AI proposal.\n\n**Audience:** Readers new to commerce architecture (engineers, product managers and leaders) who have read Parts I to IX and are about to start the decisions, or who arrive with a replatforming pitch, a migration plan, a board question about scale, an ownership gap or an AI proposal and want the chapter that answers it.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side.\n- Roughly what an API, a database and a queue are.\n- Part I: the thirteen steps of an order, promise and handoff, system of record, single writer, events, idempotency and reconciliation; the four scale stages (Starting, Growing, Omnichannel, Group); the capability map; the glosses for PSP, WMS, ERP, iPaaS, EDI, SKU, channel, marketplace connector, 3PL, OMS, availability service, PIM, D2C and B2B.\n- Parts II to IX: each capability, join and rule taught separately, and four journeys (a consumer order, its exchange, a wholesale reorder and Black Friday 2026) walked through Kestrel & Pine's systems.\n- Kestrel & Pine in outline: a fictional outdoor brand, its systems and incidents, and the Waypoint program with its decisions W1 to W8.\n\n**Does not yet know:**\n\n- What a seam is in a migration (a channel or a capability moved on its own date; glossed in p04, taught in replatforming-and-migration).\n- The ownership map as a table with one row per system, integration and app (glossed in p08, taught in organizing-commerce-engineering).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the five chapters' decisions in reading order. *Probe:* After reading only this page: what will each of the next five chapters decide, in order, and with which Kestrel & Pine case? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | A reader of this page alone can say why the part treats these as decisions about ownership and timing rather than about tools. *Probe:* Using only this page: why does a merchant have to take these decisions again as it grows, and why are they about ownership and timing rather than about choosing tools? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** When a growing merchant's business changes shape, which architecture decisions must it take again, and on what basis should it take them?\n\n> **Claim:** When a merchant adds a channel, a stock location or a brand, five decisions fall due again: what to build, buy or assemble; how to move a fact to a new owner; which systems from earlier stages to retire; who owns each system, integration and app; and what AI agents may do. Each is settled by naming who owns each shared fact (stock, order, product) and each join between systems, when the shape changes rather than after an incident.\n\n**Disputed by:** The view that growth is a tool problem: a merchant outgrows its platform, and the remedy is a larger or more modern stack (a composable assembly, a suite, an AI agent) chosen on features and subscription price, with team structure and ownership following from the tool chosen.\n\n**So what:** A merchant that accepts the claim answers a replatforming pitch, a board question about scale or an AI proposal by asking which owner it changes and whether the shape has changed, and spends on owners and joins before new systems. Kestrel & Pine declined a consultancy's composable rebuild (about €3.2M, about 18 months) and the agency's headless storefront rebuild (about €240,000, nine months), and chose stay and surround (about €1.33M over 2027–2029, reviewed in 2029); moved product data and orders to new hubs seam by seam around a Black Friday freeze; attributed eight of its ten incidents to Growing-stage designs; reduced its unowned integrations from 13 of 34 in January 2027 to 5 in April; and wrote W8 as agent readiness, not agents.\n\n**How and why:** A new channel or stock location multiplies the systems that must agree about the same stock, order and product facts. The systems bought for the earlier stage keep running with that stage's assumptions (an hourly sync, a one-channel agency script, the ERP as the stock hub), so the failures appear in the joins, not in the core, and replacing the core leaves them in place. Moving a fact's owner creates a period in which two systems hold it, which only a seam-by-seam move with a reconciliation keeps safe. A join is kept only if someone inside the merchant owns it, because agencies and vendors are paid to build and to keep the subscription. An agent that can order, refund or change stock is one more writer of the same facts.\n\n**Supporting claims**\n\n- **P10-1** — A merchant should build only what customers choose it for and nobody sells, buy what every merchant needs and own the joins, and compare options over three years on people, agency, migration, revenue at risk and exit, against which the subscription is usually the smallest line; when the failures live in the joins, keeping a hosted platform and buying hubs beside it is a deliberate architecture.\n- **P10-2** — A platform or a fact's owner is moved safely one seam (a channel, a capability or a slice of traffic) at a time, with a parallel run reconciled by cause, each kind of data migrated on its own plan, written go/no-go criteria, a rehearsed rollback and the old owner kept operable through one peak; one cutover date with no way back is the documented failure.\n- **P10-3** — A scale stage is a shape (how many channels sell, how many locations hold stock and, at the Group stage, how many brands or business units share them), not a revenue band; each stage leaves systems built for the one before, and those leftovers cause most of the next stage's incidents, so the decision at a transition is which leftovers to retire, and the signals of a transition arrive before the incidents.\n- **P10-4** — Ownership follows money unless it is designed: every system, integration and app needs a technical owner inside the merchant on one ownership map with one writer per fact; at ten to twenty people journey teams and an integration pair own the joins, agencies and vendors work under contracts that leave the repository, credentials and map with the merchant, and the team shape changes one stage before the systems do.\n- **P10-5** — An AI agent is a new writer and is admitted like an integration: assistants read and propose, agents act; agent readiness is correct product, availability, delivery-promise and order-status answers from one owner by API plus an identity and policy for each agent, which a European merchant should have in 2027 before any shopper-facing agent.\n\n## Role in the part\n\nPerforms the part's opening: states the part thesis in its three key points, sets the merchant's change of shape as the problem, ties each system's purchase date to its gaps, names the five 2027 decisions with their Kestrel & Pine cases, and gives the reading order.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in chapters: the five chapter paragraphs, in the part's reading order)\n\nThe page opens on the general problem (a merchant changes shape and its running systems must now share stock and orders), narrows to one merchant whose systems each date from an earlier shape, then to the five questions that merchant faces in 2027, then states what the five have in common (they are settled by owners and timing, not tools), and only then gives one paragraph per chapter and where to begin. The claim follows the five questions because it is a statement about them; put it before them and 'none of the five' has no referent. The history paragraph comes before the questions because it is why the questions arise; put the questions first and they read as a list without a cause. The chapter list comes after the claim so that each chapter is read as one application of it. The chapter list opens on why it starts with whether to rebuild (two pitches put that decision first in February 2027), because Figure 2 draws the five as a loop that starts at the stage and two readers in two rounds otherwise held two orders at once.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A merchant adds a store, a wholesale channel, a marketplace, a warehouse or a second brand. Its systems still run, but now they must share stock and coordinate orders in ways they were never designed for: leaving them unchanged oversells, and replacing everything exceeds the team.\n\n**Bridge:** Part IX, which walked four journeys through Kestrel & Pine's systems at one moment; the previous page hands over the questions Kestrel & Pine's 2027 answered in one way, as questions every merchant faces, and when each answer changes. → The same systems over time: each was introduced between 2016 and 2025 for the business of its year, which explains its jobs and gaps, and that history raises the five questions.\n\n**Thesis statement** (KEY POINTS bullets 1 to 3 and paragraph p04 (the claim)): The five decisions a merchant takes again when its business changes shape are about ownership and timing, not tools: who owns each shared fact (stock, an order, a product) and each join between systems, and when that owner changes, which is at the change of shape rather than after the incident that exposes the old design.\n\n**Roadmap** (paragraph p03 and the chapters section):\n\n- Five decisions Kestrel & Pine takes in 2027, in reading order: the platform review by full three-year cost, ending in keeping the shop platform with a 2029 review; product and order systems introduced one seam at a time with a freeze around Black Friday; the stage map; the ownership map from 13 of 34 integrations unowned; and AI that recommends against AI that acts, ending in data and interfaces before any shopping agent. *Kept in:* chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | When a merchant adds a store, wholesale channel, marketplace, warehouse or second brand, its running systems must share stock and coordinate orders they were not designed to; leaving them unchanged oversells and replacing everything exceeds the team, and since each addition changes the shape of the business, this part is about choosing and sequencing what follows. | figure: Figure 1: a four-step staircase of business growth with euro coins falling at each step edge; the caption says a merchant grows in jumps and the money is lost at the jumps. |  |\n| p02 | context | Part IX followed orders through Kestrel & Pine's systems at one moment; those systems arrived between 2016 and 2025, each bought for the business of its year, so each covers some jobs and leaves gaps. | scenario: Kestrel & Pine's systems introduced between 2016 (the shop platform, the PSP) and 2025 (the returns portal, the EDI provider) (fictional). | `time`: The merchant whose running systems must now share stock and orders; Part IX's journeys through Kestrel & Pine's systems at one moment. → The same systems over time: each bought at a different date for an earlier shape of the business. |\n| p03 | context | That history raises five questions for Kestrel & Pine in 2027 (whether to rebuild, how to introduce new order and product systems, which growth stage to design for, who owns the integrations, and whether to add shopping agents), and each chapter's case is its improvement program, Waypoint. | figure: Figure 2: the five decisions of Part X as one loop: a change of shape is read as a stage, answered by a platform review, carried out as a migration, held in place by an ownership map and extended to the newest writer, until the shape changes again. | `cause_effect`: Systems bought for the business of each year, with the jobs and gaps that explains. → The five questions that history raises for Kestrel & Pine in 2027, and Waypoint as the chapters' case. |\n| p04 | claim | None of the five is chiefly about tools: each is settled by deciding who owns each shared fact (stock, an order, a product) and each join between systems, and when that owner changes, which is at the change of shape d its ownership map needs the hubs of 41 and 42. Chapter 45 admits the newest writer, an AI agent, by giving it a row on chapter 44's map. Put 42 first and the reader learns how to move a system before knowing why a merchant that stays migrates; put 45 before 44 and 'an agent is an integration' has no map to land on.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description | Each chapter needs the one before, so the list starts with rebuilding, not with Figure 2's stage: the build-buy-or-assemble chapter compares bundled products, separate services and custom software by their full cost over three years (people, integration, migration and exit), and Kestrel & Pine's review ends in keeping the shop platform, adding missing capabilities and a 2029 review. | scenario: The two replatforming pitches of February 2027 (a consultancy's composable rebuild and the agency's headless storefront rebuild); the February 2027 platform review; W4 stay and surround, revisited at a 2029 review (fictional). |  |\n| p06 | description | Added capabilities need data and orders moved in, so the migration chapter plans limited transitions with comparison and recovery at every step, each seam moving while old and new run side by side and the old owner kept operable through one peak (backing KEY POINTS bullet 2), with order channels on separate dates and a freeze around Black Friday. | scenario: PIM consumers from August and September 2027; marketplace orders through the OMS from 15 September, D2C from 13 October, wholesale from 8 December, freeze 15 November to 5 December, old order paths retired January 2028 (fictional). | `cause_effect`: Keeping the shop platform and adding capabilities beside it. → How data and orders are moved into the added capabilities beside a running shop. |\n| p07 | description | The scale-stages chapter turns to the stage that made both decisions due and identifies the business changes (channels, stock ared fact and join? Each chapter asks it of one decision.\n\n**So what:** The reader can put that question to any proposal at their own merchant.\n\n**Callback:** The opening's merchant whose systems still run but must now share stock and coordinate orders (p01). The conclusion names a merchant that has just added a store or a channel, as the opening did, and states the question the five chapters answer for it.\n\n**Takeaway** (`course_of_action`): Begin with build-buy-or-assemble.\n\n**Hand-off** to [Build, Buy or Assemble: Choosing and Changing Platforms](build-buy-or-assemble.html): `elaboration`: The part introduction's first decision, the 2027 platform review compared by full cost over three years, and the instruction to begin with it. → The four shapes for covering the capability map, the rule for what to build, the total-cost lines vendors leave out, lock-in and exit, and Kestrel & Pine's three costed options ending in W4.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | synthesis | A merchant that has just added a store or a channel can ask of any proposal (after this change, who owns each shared fact and join?), each chapter asks it of one decision, and the reader begins with the build-buy-or-assemble chapter. |  |  |\n\n## Non-goals\n\n- Teaching any decision's mechanics; the chapters own them. See [Build, Buy or Assemble: Choosing and Changing Platforms](build-buy-or-assemble.html), [Moving Without Burning the Bridge: Replatforming and Migration](replatforming-and-migration.html), [What Changes at Each Scale: From First Store to Group](commerce-scaling-stages.html), [Who Builds and Who Owns: Teams, Vendors, Agencies and Governance](organizing-commerce-engineering.html), [Assistants and Agents: AI in Commerce and What Is Real in 2026](ai-and-agentic-commerce.html).\n- The Waypoint decisions themselves. See [Meet Kestrel & Pine](meet-kestrel-and-pine.html).\n- The failure patterns' definitions. See     (function () {

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {

                    }

                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {

                        const left = c.startsWith(':'), right = c.endsWith(':');

                    });
                    const cellOpen = function (tag, idx) {

                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {

                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';

                if (bullet.test(line) || ordered.test(line)) {

                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
