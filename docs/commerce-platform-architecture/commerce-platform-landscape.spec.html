<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Suites, SaaS, Open Source and Composable: The Platform Landscape in 2026\n\n## Intent\n\nGive a reader who has just joined a merchant, a vendor or an agency a map of the commerce platform market at the book's research cut-off (7 November 2026): the seven categories of platform, how each is priced, what changed between 2023 and 2026, and how to read a vendor's claims. The argument: the category decides where the integration work and the cost land; platforms are priced on the merchant's sales rather than on software; and the 2024–2026 market converged on selling layers beside an existing stack. After reading it, the reader can place any platform in a category, ask for the unit, date and definition behind any vendor number, and see why Kestrel & Pine's W4 (stay and surround) is the shape most Omnichannel-stage merchants end up with.\n\n## Audience\n\nReaders new to commerce architecture. The engineer or product manager who has inherited a platform and is about to sit through a replatforming pitch benefits most; the chapter is written at Noor Visser's altitude in February 2027, before she had the vocabulary to answer \"what kind of platform are we on?\". Analysts and leaders who must read vendor decks and analyst charts get the reading guide in the second half.\n\n## Success criteria\n\n- [x] The seven categories are defined in one table (what you buy, who runs it, where the integration work lands, examples) and each has a paragraph with at least one dated, sourced vendor example.\n- [x] Every vendor fact carries a year or an \"accessed 2026-11\" date in the sentence; every inference about a real company (Lightspeed's regional risk, Salesforce's GMV pricing, Katapull's unknowns) is labeled as inference or industry belief, and nothing is stated about any vendor's proprietary internals.\n- [x] The pricing section has a table of pricing models with dated examples, defines GMV, transaction fee and interchange, and includes a Kestrel & Pine illustration (labeled as an assumption) showing that the subscription line is the smallest line.\n- [x] The \"What changed, 2023 to 2026\" table is dated row by row and supports the chapter's reading that vendors now sell layers beside existing stacks.\n- [x] The \"How to read a vendor's claims\" table teaches unit, date and definition with examples used earlier in the chapter, and the W3Techs versus EHI contrast and the Eurostat EDI statistic are present with their caveats.\n- [x] A table says which platform categories fit which scale stage (Starting, Growing, Omnichannel, Group), with what becomes necessary and the warning signs of outgrowing an approach, followed by a judgement.\n- [x] A reader new to the field can define every term the chapter uses from the chapter alone; every acronym is expanded on first use.\n- [x] Kestrel & Pine figures (platform €2,300 a month, €2.6 million technology spend, 41 apps, 34 integrations, the 2026 incidents, W1–W5) match the ledger; the two February 2027 pitches follow consistency ruling 13 (an outside consultancy's composable rebuild at about €3.2 million; the agency's headless storefront rebuild at about €240,000).\n- [x] Two mermaid diagrams with captions; a trade-off table; the three take-away tiers; six to ten questions; grouped Sources and Evidence; the article stays within the 6,500-word cap including tables.\n\n## Non-goals\n\n- The decision method for choosing or changing a platform and the full cost model — [Build, Buy or Assemble: Choosing and Changing Platforms](build-buy-or-assemble.html); migration mechanics — [Moving Without Burning the Bridge: Replatforming and Migration](replatforming-and-migration.html).\n- Architecture styles as engineering (monolith, modular monolith, microservices, composable as a style) — [Monolith, Modular Monolith, Microservices, Composable: What the Evidence Says](commerce-architecture-styles.html).\n- Tenancy, pods and rate limits — [Many Merchants, One Platform: Multi-Tenancy, Pods and Isolation](multi-tenancy-and-isolation.html); apps, plugins and the Forked Platform mechanics — [Apps, Plugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html); storefront delivery — [Delivering the Storefront: Themes, Headless, Rendering and Performance](storefront-architecture.html).\n- The composable movement's history, commercetools and Shopware in depth, and the MACH survey data — [Case: commercetools, Shopware and the Composable Movement](case-composable-movement.html); Shopify in depth — [Case: Shopify, the Modular Monolith That Serves Millions of Merchants](case-shopify.html).\n- Agentic commerce protocols and their regional status — [Assistants and Agents: AI in Commerce and What Is Real in 2026](ai-and-agentic-commerce.html); ERP as hub versus commerce as hub — [The Back Office: ERP Integration and Who Is the Hub](erp-and-back-office-integration.html).\n- The capability map itself — [The Map of a Commerce Platform: Capabilities and Layers](commerce-capability-map.html); the scale stages as a model — [What Changes at Each Scale: From First Store to Group](commerce-scaling-stages.html).\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\n## Open questions\n\n- Salesforce Commerce Cloud's pricing model is stated only as an industry belief; if a Salesforce document confirms or denies GMV-based pricing, the pricing table should be updated.\n- SAP Commerce Cloud is described from Spartacus and one analyst note because sap.com refused automated fetching; a reviewer with access to SAP's product pages should check the \"cloud ERP edition\" wording.\n- The commercetools CEO sequence (founder to Andrew Burton in July 2024; Doug McNary signing results by April 2026) is documented at both ends but the handover itself was not found in a release.\n- Prices and plan names on every vendor page are volatile; the chapter should be re-dated at the next edition.\n\n## Decision log\n\n- **2026-11-07** — Chose seven categories (adding specialist layers and specialist groups to the usual five) because the ledger's merchant lives in the joins between a platform and its layers, and because the Dutch group model (Katapull) is a real third shape beside suite and composable.\n- **2026-11-07** — Put pricing before the timeline and the reading guide, because the price is the clearest public evidence of what a vendor's product really is, and the Kestrel & Pine fees-versus-subscription illustration is the chapter's most transferable lesson.\n- **2026-11-07** — Framed the Kestrel & Pine scene as two replatforming pitches (composable and ERP-centered) so the chapter shows the Giant's Boots and the Burned Bridge without naming a vendor; recorded the pitches in the ledger.\n- **2026-11-07** — Cut the draft from about 8,700 to under 6,500 words by removing a systems table that duplicated [Meet Kestrel & Pine](meet-kestrel-and-pine.html) and shortening every vendor paragraph to its dated facts.\n\n## Sources\n\n- **Internal**\n  - [Meet Kestrel & Pine](meet-kestrel-and-pine.html) — the systems landscape, the 41 apps, the 34 integrations and the Waypoint decisions.\n  - [The Map of a Commerce Platform: Capabilities and Layers](commerce-capability-map.html), [Who Owns the Truth: Boundaries, Bounded Contexts and Systems of Record](boundaries-and-systems-of-record.html) — the capabilities and the ownership rules the categories map onto.\n  - [Build, Buy or Assemble: Choosing and Changing Platforms](build-buy-or-assemble.html), [Monolith, Modular Monolith, Microservices, Composable: What the Evidence Says](commerce-architecture-styles.html), [Apps, Plugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html), [Case: Shopify, the Modular Monolith That Serves Millions of Merchants](case-shopify.html), [Case: commercetools, Shopware and the Composable Movement](case-composable-movement.html) — the chapters that own what this one only names.\n  - `_research/brief-platform-landscape.md` and `_research/brief-shopify.md` — the verified vendor facts, pricing, timeline and the claims-reading table; `_research/scenario-ledger.md` and `_research/style-guide.md` — figures and rules.\n- **External**\n  - Shopify FY2025 Form 10-K (2026) and pricing pages (accessed 2026-11); Commerce.com Q2 2026 SEC exhibit; Lightspeed strategic review (2025) and FY2026 results — the pricing and revenue-mix evidence.\n  - Adobe Experience League (2026), Shopware releases and pricing (2025–2026), commercetools releases (2026), TechCrunch (2025), Microsoft Learn (2026), Katapull and Dutch IT Channel (2025–2026) — the categories and the 2023–2026 timeline.\n  - MACH Alliance (2020, 2026), W3Techs (2026), Eurostat (2026) — definitions, usage shares and the EDI-versus-web statistic.\n\n## Changelog\n\n- **2026-11-07** — Initial spec and article. *(AI-mediated session)*\n- **2026-11-07** — Editorial review pass: reframed the February 2027 pitches per consistency ruling 13 (consultancy composable rebuild about €3.2M; agency headless storefront rebuild about €240,000; no ERP-partner pitch); moved the CCV Shop sentence out of the inference callout; completed the Katapull timeline (Transus undated, Picqer eighth label); pointed scale stages to their owning chapter. *(AI-mediated session)*\n- **2026-11-07** — Final consistency pass: ledger-as-document references rephrased as Kestrel & Pine's records. *(AI-mediated session)*\n- **2026-11-07** — Visual layer: redrew 2 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator). *(AI-mediated session)*\n"}]}]}</script>

                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
