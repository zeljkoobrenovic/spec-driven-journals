<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/05-commerce-platform-landscape/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter. It is a contract, not a description: after the reconstruction the order of ideas was changed from the flow rubric (see decision_log) and the chapter was revised to match.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Seven platform categories and where each puts the integration work and the cost.\n- **Know:** That most platforms are priced on the merchant's sales, with dated figures.\n- **Believe:** A platform category moves integration work; it does not remove it.\n- **Be able to:** Read a vendor's 2026 pitch as a layer to add or a move to make, and say who would carry the work afterwards.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer or product manager who has inherited a platform and is about to sit through a replatforming pitch. The chapter is written at the level of Noor Visser in February 2027, before she had the vocabulary to answer 'what kind of platform are we on?'. Analysts and leaders who must read vendor decks and analyst charts get the reading guide.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side.\n- Roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its 2026 incidents and the names of the failure patterns, in outline (meet-kestrel-and-pine, where-commerce-platforms-go-wrong).\n- From journey-of-an-order: the thirteen steps of an order, promise and handoff, the three status lines, that a system is any software or outside service that takes part in handling an order, 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems that make and keep promises, Kestrel & Pine's seven systems in the order walk and thirteen in its landscape.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub, availability service, D2C, B2B.\n- From commerce-business-models: the business models and the four scale stages (Starting, Growing, Omnichannel, Group).\n- From commerce-capability-map: the capability map.\n- From boundaries-and-systems-of-record: bounded contexts, system of record, single writer, events and reconciliation, and the Waypoint decisions W1 to W8.\n\n**Does not yet know:**\n\n- The category names and what separates them: hosted SaaS platform, enterprise suite, open source and fork, composable, headless, MACH, ERP-centered commerce, specialist layer, specialist group.\n- Deployment words: on-premises, platform-as-a-service, tenant, replatforming.\n- Pricing words: GMV as a pricing base, transaction fee, interchange, run-rate, trailing sales.\n- The layer acronyms as products one can buy: OMS, PIM, POS.\n- How to read a vendor's number (unit, date, definition) and a vendor's public record (revenue mix, strategic review, ownership).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given two platforms with the same feature list, the reader names three operating-model differences to ask about before comparing features. *Probe:* Two platforms both offer cart, catalog and checkout. What would you ask before comparing features? | `custom` | cold_reader | major |\n| AC-2 | Given a one-line description of a product, the reader places it in a category and says where the integration work lands. *Probe:* One vendor sells a storefront, cart and checkout that it hosts for many merchants, with an app store. A second vendor sells cart and catalog services reachable only through an API, with no storefront. Using only this chapter: which kind of platform is each, and with each, where does the work of connecting it to a merchant's other systems land? | `custom` | cold_reader | minor |\n| AC-3 | Given a platform's monthly list price, the reader says why it is not the cost and names the lines that move with sales. *Probe:* A hosted platform quotes a merchant €2,300 a month. Using only this chapter: why is that figure not what the platform will cost, and what would you ask for before comparing it with another vendor's price? | `custom` | cold_reader | minor |\n| AC-4 | Given a proposal to replace a platform after an incident, the reader says what the chapter advises and who would carry the work after the move. *Probe:* After a stock incident, a consultancy proposes that a merchant with stores, marketplaces and a small technology team replace its hosted platform with a composable set of separate products. Using only this chapter: what does the author advise, and who would carry the integration work after such a move? | `custom` | cold_reader | minor |\n| AC-5 | Given a number from a vendor's deck, the reader asks for its unit, its date and its definition, and can name one way such a number misleads. *Probe:* A vendor's presentation says '500+ customers' and '$100 billion GMV run-rate'. Using only this chapter: what would you ask about each number before comparing this vendor with another? | `custom` | cold_reader | minor |\n| AC-6 | A reader new to commerce meets no term in this chapter before it is explained, and every acronym is expanded on first use. | `known_before_new` | rubric | minor |\n\n## Thesis\n\n**Question:** What kinds of platforms exist, who sells them, how they are priced and how the market changed up to 2026?\n\n> **Claim:** The category of a commerce platform decides where the integration work and the cost land rather than whether they exist, so a merchant should choose by the work it can carry, and should read every 2026 pitch as a layer to add beside what it has, not a reason to move.\n\n**Disputed by:** Feature comparisons and vendor claims that one category (composable, suite, hosted) is the modern answer for everyone.\n\n**So what:** A merchant that replatforms to escape integration work finds the same work on the other side, under a different owner and price.\n\n**How and why:** Hosted platforms push variation to apps, suites keep integration inside one data model, open source moves hosting and upgrades to the merchant and composable moves integration to the merchant; by 2026 vendors in every category sell modules that sit beside an existing stack.\n\n**Supporting claims**\n\n- **S1** — Platforms with the same features differ in operating model: who runs each part, how the cost moves and what leaving costs.\n- **S2** — The market sells commerce platforms in seven categories, and each category puts the integration work in a different place; none removes it.\n- **S3** — Platforms are priced mainly on the merchant's sales and payments, so the subscription is the smallest line of the cost.\n- **S4** — Between 2023 and 2026 vendors in every category began selling layers that sit beside an existing stack, so a 2026 pitch is a layer to add.\n- **S5** — A vendor's numbers and public record can be read: every number has a unit, a date and a definition, and funding, upgrades, price and ownership change in ways a merchant can watch.\n- **S6** — A merchant should choose the category by the work its team can carry at its scale stage, which for Kestrel & Pine means keeping its shop platform and adding layers beside it.\n\n## Role in the part\n\nCloses the part by connecting the map and the ownership decisions to what a merchant can buy. Supports P1-5 of part `part-1`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `grouping` in tour, wrong: parallel categories and parallel failure modes; `problem_solution` in scene to place: two proposals posed, then tested once the map exists)\n\nThe scene poses three questions the reader cannot yet answer. The categories are named first because every later section uses their names. The reading guide comes before the vendor-by-vendor section because that section is where the reader meets the vendors' numbers; placed after it, the guide arrived when the numbers had already been taken at face value (round 1 of the draft check). Pricing follows the vendors because the price lists were met one by one and the cost-shape row of the trade-off table and the stage table's fee reviews need the pricing models; the trade-offs precede the stages because the stages apply the rule the trade-offs end on. The 2023–2026 record comes after the stages because its reading (vendors now sell what a merchant below the Group stage can absorb) needs the stage judgment, and it stands directly before the test of Kestrel & Pine's proposals because those are two such pitches. The test comes only then, since it uses the categories, the prices, the team rule and the stage. The failure modes could precede the test; they stay last because 'When It Goes Wrong' closes the body in every chapter of the book.\n\n## Introduction\n\n**Hook** (`intriguing_example`): Two commerce platforms can offer the same cart, catalog and checkout features while giving a merchant very different work to do: with one the vendor runs the servers and storefront; with another the merchant must operate a separate storefront and manage upgrades.\n\n**Bridge:** Anyone comparing two products starts with their feature lists. → The work a platform leaves to the merchant (running, upgrading, paying fees that grow with sales, leaving) is its operating model, and the categories of the market are different operating models.\n\n**Thesis statement** (KEY POINTS callout, first and third bullets; paragraph p02 names the operating model in prose): The category decides where the integration work and the cost land, not whether they exist; pick the category by who you have to carry that work, and read every 2026 pitch as a layer to add, not a reason to move.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p03, the last paragraph of the introduction):\n\n- Start from two proposals put to Kestrel & Pine in one week. *Kept in:* scene.\n- Name the seven categories and show how to read a vendor's numbers. *Kept in:* kinds, claims.\n- Go through the categories vendor by vendor, and through their prices. *Kept in:* tour, pricing.\n- Compare the categories and fit them to the four scale stages. *Kept in:* tradeoffs, stages.\n- Turn to what vendors pitched from 2023 to 2026. *Kept in:* changed.\n- Test the two proposals and list how a chosen category fails later. *Kept in:* place, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Two commerce platforms with the same cart, catalog and checkout features can leave a merchant with very different work, because who runs the servers, the storefront and the upgrades decides the team and budget needed after the purchase. | scenario: Two platforms with the same features: with one the vendor runs servers and storefront; with the other the merchant operates a separate storefront and manages upgrades. |  |\n| p02 | claim | Pricing and customization differ too and a feature comparison misses both, so a platform is evaluated by its operating model: who runs each part, how costs change and what the merchant would need to move elsewhere. |  | `additional_support`: Equal features, unequal work after the purchase. → Price and customization as two further differences, and the name for all of them: the operating model. |\n| p04 | context | In the running order, Eva buys from Kestrel & Pine, whose shop platform runs the storefront, cart and checkout; the category of that product determines which later jobs it can handle and which need separate systems. | scenario: Eva's €235 order of a jacket and socks from Kestrel & Pine. | `example`: The operating model of a platform. → The order the book follows, for which the operating model of Kestrel & Pine's shop platform decides which later jobs need separate systems. |\n| p03 | transition | The chapter starts from two proposals put to Kestrel & Pine, names the seven categories, shows how to read a vendor's numbers, goes through the categories vendor by vendor and through their prices, compares them and fits them to the scale stages, then turns to what vendors pitched from 2023 to 2026, tests the two proposals and lists how a chosen category fails later. |  | `sequence`: Kestrel & Pine's shop platform and the question of its category. → The order of the chapter, section by section, from the two proposals to the failure modes. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: Two Pitches in One Week\n\n**Controlling idea** (`context`, id `scene`): Kestrel & Pine runs a hosted shop platform among separate systems, and two proposals to replace or rebuild it raised a question its head of engineering could not yet answer: what kind of platform is it on?\n\n**Advances the thesis** (S1): Shows the operating-model questions (what kind of platform, what it costs in year three, what a move would fix) as questions a merchant is actually asked.\n\n**Transition in:** `example`: The roadmap's first step. → Kestrel & Pine's shop platform, its surroundings and the two proposals to replace or rebuild it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | Kestrel & Pine has run its three storefronts on a hosted software-as-a-service shop platform since 2016, for €2,300 a month plus payment and transaction fees, with 41 apps installed. | scenario: Hosted SaaS since 2016; €2,300 a month plus payment and transaction fees on the enterprise tier; three localized storefronts in one merchant account (tenant); 41 apps. |  |\n| p06 | context | Separate systems for finance and purchasing, the warehouse, the store tills, marketplaces, returns and integration surround the shop platform; a 14-person technology team looks after them, and total technology spend of about €2.6 million in 2026 makes the subscription only one part of the cost. | statistic: Technology spend 2026 about €2.6 million, 5.4% of revenue.; scenario: A technology team of 14, three of them on storefronts and apps. | `place`: The hosted shop platform and its fee. → The separate systems around it, the team that looks after them and what the whole costs. |\n| p07 | context | In February 2027 an outside consultancy proposed to replace the shop platform with a composable system of separate commerce, storefront, search, content and integration products, with its own availability service, estimated at €3.2 million over eighteen months. | scenario: The consultancy's composable rebuild: about €3.2 million, eighteen months (illustrative). | `time`: What Kestrel & Pine runs, with whom and at what cost. → The first proposal of February 2027: a composable replacement with its own availability service. |\n| p08 | context | The existing agency proposed a headless rebuild of the storefronts on the current shop platform for €240,000 over nine months, arguing that it would make the pages faster. | scenario: The agency's headless storefront rebuild: about €240,000, nine months. | `contrast`: The €3.2 million composable proposal. → The much smaller headless proposal and its speed argument. |\n| p08b | context | Both proposals cited the Black Friday Oversell, when stale stock figures caused 1,340 oversold units and about €96,000 in costs. | scenario: The Black Friday Oversell: 1,340 oversold units, about €96,000. | `similarity`: Two proposals of very different size. → The one incident both cited, the Black Friday Oversell. |\n| p09 | context | The CEO's three questions (what kind of platform are we on, what would each proposal cost in year three, what would a move fix that nothing else fixes) found Noor without the vocabulary for the first, and the map she drew to answer them is this chapter;  ERP-centered commerce, specialist layer, specialist group), each with examples, what you buy, who runs it and where the integration work lands. | `elaboration`: The product called a platform. → The seven categories in which the market sells it, in one table. |\n| p11 | definition | Four terms in the table need defining: SaaS is software the vendor runs for many customers at once, a suite is one vendor's modules designed to work together, headless separates the storefront from the commerce engine behind an API, and composable means buying commerce as separate services and assembling them. |  | `elaboration`: The category table. → Four terms in it that need defining. |\n| p12 | claim | The fourth column matters most: every category moves the integration work somewhere and none removes it, so the choice is who carries the work, at what price and with what freedom to change. | example: Kestrel & Pine's 34 integrations exist because it chose a hosted platform and bought specialist layers around it; a suite would have fewer joins and one larger contract, a composable assembly more joins, all its own.; figure: Figure 2: each category asks the merchant for a different kind of work and joins the specialist layers in a different place. | `emphasis`: The table's four columns. → The fourth, where the integration work lands, and the rule that it moves and is never removed. |\n\n### How to Read a Vendor's Claims\n\n**Controlling idea** (`explanation`, id `claims`): A vendor's number, and a market-share figure, can be compared only when its unit, date and definition are known.\n\n**Advances the thesis** (S5): Gives the reader the test to apply to every number in the vendor-by-vendor section and in any pitch.\n\n**Transition in:** `sequence`: The seven categories and the rule about where the work lands. → What to ask of the vendor numbers the next section is full of, before meeting them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | 12b | transition | Each of the seven kinds is described below from its vendors' public record. |  |  |\n| p13 | evidence | The hosted platform is the default for a merchant that starts online, and Shopify's filing and price list show its shape: a monthly plan plus fees that move with sales, with most merchants on the cheapest plans and most sales volume from the largest merchants. | statistic: Shopify FY2025: GMV $378.4 billion, revenue $11.56 billion; plans from Basic €28 to Plus from €2,100 a month; card rates 1.9% + €0.25 down to 1.4% + €0.25; 2% down to 0.2% on orders paid through another provider; a variable platform fee for larger Plus merchants. | `example`: The promise of a record per category. → The first category, hosted SaaS, through Shopify's filing and price list. |\n| p14 | evidence | BigCommerce, now under the parent Commerce.com, assigns plans by the merchant's trailing sales, which is a price on sales under a subscription's name, and its 2026 results report flat revenue and soft demand for replatforming. | statistic: Plans assigned by trailing-twelve-month GMV with 0.9% above $33,333 a month on the Scale plan; quarter ended 30 June 2026: revenue $84.5 million, up 0.1%; B2C replatforming 'remains softer than historically'. | `additional_support`: Shopify's plan-plus-fees pricing. → BigCommerce: plans assigned by sales, and soft replatforming demand. |\n| p15 | evidence | Lightspeed earns more than twice as much from transactions as from subscriptions and has named growth engines that exclude European online retail, which the author reads, as a labeled inference, as a vendor-risk signal for a Dutch merchant on its e-commerce product. | statistic: Strategic review closed 6 February 2025: 'focus on growing retail in North America and hospitality in Europe'; FY2026 transaction-based revenue $815.1 million against subscription revenue $370.7 million; Dutch eCom €68 to €259 a month.; reasoning: Callout 'INFERENCE, NOT DOCUMENTED': Lightspeed has announced no change to its European e-commerce product; the risk reading is the author's. | `additional_support`: Two listed hosted vendors. → A third, Lightspeed, whose revenue mix and strategy are a risk signal. |\n| p16 | evidence | Below the listed vendors sit smaller hosted products such as the Dutch CCV Shop, priced at a flat monthly fee and not as a share of sales, and the site builders. | fact: CCV Shop: €36 to €129 a month, 'not a percentage of your sales'. | `contrast`: Vendors that earn on the merchant's sales. → Small hosted products priced at a flat fee. |\n| p17 | evidence | Enterprise suites sell to large merchants through implementation partners at negotiated prices, so their public evidence is thin; SAP Commerce Cloud is described here only from its open-source storefront project and one analyst note. | source: The Spartacus storefront project (accessed November 2026) and an October 2026 analyst note reporting an 'SAP Commerce Cloud, cloud ERP edition' and warning buyers to 'separate products that are available now from forward-looking demonstrations'. | `contrast`: The hosted category and its public evidence. → Enterprise suites, sold through partners, with thinner evidence; SAP first. |\n| p18 | evidence | Salesforce sells one platform across consumer and business selling, point of sale and order management, now with AI agents connected to it, and publishes no price; that it charges a percentage of sales is industry belief, not a documented fact. | quotation: 6 July 2026: 'its biggest Agentforce Commerce release yet', three generally available agents 'natively connected to catalog, inventory, and orders'; pricing page shows 'Contact for pricing' for every edition. | `additional_support`: SAP, described from two public sources. → Salesforce: one connected platform and no public price. |\n| p19 | evidence | Adobe Commerce shows one product in three deployment shapes (on-premises, platform-as-a-service, fully managed SaaS), and the middle shape, where the vendor runs the servers and the merchant owns the code, is where deep customization can block every upgrade. | fact: Adobe's information center (updated 21 October 2026) lists Adobe Commerce on-premises, on cloud infrastructure and as a Cloud Service; Adobe Commerce Optimizer 'can work alongside an existing Adobe Commerce or third-party commerce backend'; partner reports place both launches in June 2025. | `contrast`: Suites with thin public evidence. → Adobe, the clearest public example: one product in three deployment shapes. |\n| p20 | definition | Open source means the code may be run and changed, not that it is free: hosting, upgrades, security patches and the agency that applies them are the recurring price, as the chain from an Adobe fix to a Mage-OS release to the merchant's own test shows. | example: Magento Open Source and the community fork Mage-OS: 4.0.0 shipped 30 October 2026; 3.6.0, two weeks earlier, was a security port of an Adobe patch. WooCommerce claims 'more than 4 million stores' and prices hosting at $25 to $350 a month. | `contrast`: Products a vendor runs or co-runs. → Open source: code the merchant runs and upgrades itself, with Magento's open edition and its fork. |\n| p21 | evidence | Shopware, the leader among large German shops, shows that an open-source platform can be free for the smallest merchants and priced on sales above that. | statistic: 12.5% of the 1,000 largest German B2C shops (EHI 2026), first for the fifth year; Community Edition free; Rise from €600 and Evolve from €2,400 a month 'based on your gross merchandise value'; a paid plan required above €1 million of GMV in a rolling year. | `example`: Open source and its recurring costs. → Shopware: free at small scale, priced on sales above it. |\n| p21b | evidence | Shopware is also absorbing payments and integration into the platform, with PayPal as a large shareholder. | fact: PayPal's stake above 40% (October 2025); Shopware Payments on PayPal's infrastructure and Nexus, an orchestration layer positioned as replacing middleware, launched 10 June 2026. | `additional_support`: Shopware's pricing. → Shopware absorbing payments and integration, with PayPal as shareholder. |\n| p22 | claim | Composable and headless vendors give the merchant a choice of what to replace and leave it responsible for connecting and operating every part it selects. |  | `contrast`: Categories built around one core product. → Composable and headless vendors, defined above, and what they leave to the merchant. |\n| p23 | evidence | commercetools, the best-known composable vendor, reports large volume, cut staff after missing growth targets, and since 2026 sells layers and standalone modules for stacks that are not composable. | fact: 22 April 2026: '$100B GMV run-rate', more than 600 million orders a year; 26 February 2025: about 10% of staff cut; 21 January 2026: AgenticLift 'on top of your existing commerce solution'; 15 July 2026: cart-and-order engine and product catalog as standalone modules. | `example`: What composable leaves to the merchant. → commercetools and Saleor. |\n| p23b | evidence | Saleor shows that API-only vendors price on the merchant's sales too. | fact: Saleor cloud from $1,599 a month up to $200,000 of monthly GMV, 0.8% above (November 2026). | `additional_support`: commercetools, which sells by the piece. → Saleor, an API-only vendor that prices on the merchant's sales. |\n| p24 | explanation | MACH is an acronym a vendor alliance coined in 2020 and has since loosened, so 'composable' and 'MACH' name a category and a sales argument, not a verdict. | fact: Coined June 2020 for Microservices, API-first, Cloud-native SaaS and Headless by founders commercetools, Contentstack, EPAM and Valtech; by November 2026 the principles page lists Open, Composable, Connected. | `elaboration`: The composable vendors. → MACH, the acronym their alliance coined. |\n| p25 | evidence | ERP-centered commerce makes the ERP the owner of products, stock and orders and treats the webshop as a front end, and Microsoft preinstalling a connector to a hosted platform shows the vendors expect this shape. | fact: Odoo's eCommerce app free within €19.90 or €35.90 per user per month; JTL, PlentyONE and NetSuite SuiteCommerce bundle shop and back office; Microsoft's documentation (22 September 2026): the Shopify Connector 'is preinstalled for all new sign-ups and trials' of Business Central. | `contrast`: Commerce assembled from separate services. → Commerce attached to the ERP that already owns stock, orders and finance. |\n| p27 | definition | Every category is surrounded by specialist layers, each owning one capability and selling to every platform (OMS, PIM, WMS, returns, search, channel integration, iPaaS and PSP); of these an OMS, which decides which location fulfills an order and what to promise, is easily confused with a WMS, which decides where goods sit and how to pick them. | table: Eight layers, each with what it owns in plain words and vendor examples with claims and prices (accessed November 2026). | `additional_support`: The five kinds of core platform. → The specialist layers that surround every one of them. |\n| p29 | definition | A specialist group is a third shape beside suite and composable: several specialist products under one owner, kept as separate brands and pre-integrated, which reduces the joins a merchant builds at the cost of one owner across several layers; the Dutch group Katapull is the public example. | case: Katapull's eight labels (Logic4, Vendit, Picqer, EffectConnect, DeliveryMatch, Returnista, Transus, Highbiza); five companies joined 31 March 2025, Returnista 16 February 2026, Picqer 7 October 2026; '4,500+ customers in 40+ countries'; no revenue, GMV or ownership figures public. | `contrast`: Layers bought one at a time. → A group that sells several, pre-integrated, under one owner. |\n| p36b | evidence | One official statistic puts the whole landscape of webshop vendors in proportion: by value, more European enterprise e-commerce runs over EDI messages than over webshops. | statistic: Eurostat 2024 data (published February 2026): web sales 8.39% of EU enterprise turnover, EDI-type sales 11.07%. | `emphasis`: The vendors of the seven kinds, the last of them a group that includes an EDI provider. → One official statistic that puts the webshop landscape in proportion: EDI carries more enterprise selling than webshops. |\n\n### How Platforms Are Priced, and What the Price Tells You\n\n**Controlling idea** (`analysis`, id `pricing`): Platforms are priced on what the vendor sits in the path of, mostly the merchant's sales and payments, so the subscription is the smallest line.\n\n**Advances the thesis** (S3): Turns the prices met category by category into seven models and one pattern, and shows the size of the fee lines on Kestrel & Pine's own numbers.\n\n**Transition in:** `elaboration`: The prices quoted vendor by vendor. → The pricing models that recur across all the categories and what a price reveals.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | claim | A platform's price tells what the vendor's product really is, and seven pricing models recur across the seven categories. | table: Seven pricing models (flat subscription tier, subscription with GMV thresholds, enterprise GMV share, payment fee share, per order/user/request, per payment transaction, free core with paid services), each with how it works, dated examples and what it means for the merchant. |  |\n| p31 | analysis | A vendor prices on the thing it sits in the path of: pricing on sales assumes it owns checkout, per-order pricing that it sees every order, per-request pricing that it is in the request path. | statistic: Shopify's FY2025 filing: 76% of revenue is 'merchant solutions' that are 'directionally correlated with the level of GMV', with 65.6% of GMV through its own payment service; Lightspeed's revenue mix. | `conclusion_summary`: The seven rows of the pricing table. → The pattern across them: a vendor prices on what it sits in the path of. |\n| p32 | example | For Kestrel & Pine the subscription is the smallest line: on an assumed €34.4 million of sales through the shop platform's checkout, a 0.2% fee is about two and a half times the €27,600 subscription and a 1% fee about twelve times. | scenario: Labeled assumption: €27.0 million D2C plus the 62% of the €12.0 million wholesale line ordered through the B2B portal, about €7.4 million: about €34.4 million GMV; 0.2% is about €69,000 a year, 1% about €344,000; neither is what Kestrel & Pine pays.; figure: Figure 3: an iceberg whose visible tip is the subscription, with larger fee bands below the waterline. | `example`: The pattern. → Kestrel & Pine's subscription set against fees on its sales. |\n\n### The Trade-offs Between Categories\n\n**Controlling idea** (`comparison`, id `tradeoffs`): The categories trade off on five checkable criteria, and the category to choose is the one the merchant's present team can staff.\n\n**Advances the thesis** (S1, S6): Puts the operating-model differences side by side, the price among them, and draws the rule for choosing.\n\n**Transition in:** `conclusion_summary`: The seven categories and the way each is priced. → The five criteria on which the categories can be compared side by side.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | comparison | The categories differ on five criteria a newcomer can check: time to first sale, who upgrades, the integration burden, the shape of the cost and the cost of leaving. | table: Six categories against five criteria (time to first sale, who upgrades, integration burden, cost shape, exit cost); the author's judgment. |  |\n| p38 | recommendation | The author's rule is to choose the category by the team the merchant has, not the team it wants, because each category needs different people and the one that cannot be staffed is the wrong one. |  | `cause_effect`: The trade-off table. → The author's rule: choose by the team you have. |\n\n### Across Scale Stages: Which Categories Fit Which Stage\n\n**Controlling idea** (`comparison`, id `stages`): Which category fits depends on the merchant's scale stage: ERP-centered commerce limits at the Omnichannel stage, and composable becomes realistic as a core only at the Group stage.\n\n**Advances the thesis** (S6): Applies the rule to the four stages the reader already knows.\n\n**Transition in:** `elaboration`: The rule of choosing by the team you have. → What that means at each of the four scale stages.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | comparison | Which category a team can carry depends on the merchant's scale stage: each of the book's four stages has categories that typically fit it, things that become necessary and warning signs of outgrowing the approach. | table: Four stages (Starting, Growing, Omnichannel, Group), each with typical category, what becomes necessary and warning signs. |  |\n| p26 | analysis | A category that fits one stage becomes a limit at the next, and ERP-centered commerce shows it plainly: strong at the Starting and Growing stages, where one system means no integration problem, and limited at the Omnichannel stage, when stores, marketplaces and a warehouse need stock faster than the ERP's batch updates. |  | `example`: The stage table's pattern of fit and outgrowing. → One category followed through it: ERP-centered commerce, strong early and limited at the Omnichannel stage. |\n| p40 | recommendation | At the Starting and Growing stages 'composable' is a vendor category and not an instruction, at the Omnichannel stage it is something done per capability around a kept core, and only at the Group stage, with a platform team, is an API-only core realistic. |  | `additional_support`: The ERP-centered category across the stages. → The same reading for composable: a vendor category early, a practice per capability later, a core only for a Group. |\n\n### What Changed, 2023 to 2026\n\n**Controlling idea** (`evidence`, id `changed`): From 2023 to 2026 vendors in every category moved toward selling layers beside a merchant's existing stack, which is what a merchant below the Group stage can absorb.\n\n**Advances the thesis** (S4): Dates the convergence that the thesis's last clause rests on, after the reader knows why a kept core suits most merchants.\n\n**Transition in:** `similarity`: The judgment that below the Group stage a merchant keeps its core and adds per capability. → The vendors' side of the same conclusion: what they began to sell between 2023 and 2026.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | evidence | In the three years before November 2026 the market moved in one direction: vendors retreated from physical logistics, pulled payments into the platform, and began selling layers beside a merchant's existing stack instead of replacing it. | table: Eight dated events from 6 June 2023 (Shopify sells most of Shopify Logistics to Flexport) to 6 August 2026 (Commerce.com reports B2C replatforming 'softer than historically'), each with what it tells a merchant. |  |\n| p34 | evidence | The newest thing vendors sell is the AI assistant as a sales channel, which for a merchant is one more channel, priced as a channel; like the other layers of 2026 it is an addition an Omnichannel-stage merchant can absorb without moving. | fact: Shopify's Agentic plan (accessed November 2026): 'no monthly fee', syndicates products to ChatGPT, Gemini, Copilot and Perplexity so shoppers 'check out in conversations', 'no Shopify online store required'. | `additional_support`: Eight dated events. → The newest offer, the AI assistant as a channel, read the same way. |\n\n### Kestrel & Pine's Place on the Map\n\n**Controlling idea** (`example`, id `place`): Placed on the map, Kestrel & Pine is a hosted shop platform with specialist layers; both proposals fail against its team and its measured problems, and it stays and adds the layers it lacks.\n\n**Advances the thesis** (S6, S4): Works the whole method on the running example and reaches W4.\n\n**Transition in:** `example`: The map: categories, prices, fit by stage and what vendors now pitch. → Kestrel & Pine placed on it, and the two proposals of the opening scene tested.\n\n**Order of paragraphs** (`problem_solution`): The place on the map answers the CEO's first question; the two proposals are then tested in the order the scene introduced them, which answers her third; the decision comes last because it depends on both tests.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | example | Kestrel & Pine is a hosted SaaS shop platform surrounded by specialist layers, with an ERP used as the back office and not as the hub; the two things it lacks, an OMS and a PIM, are specialist layers too, and Waypoint buys both (W2, W3). That answers the CEO's first question; her second, the cost in year three, needs the full cost model of a later chapter. | scenario: Shop platform €2,300 a month plus fees; ERP €3,900; WMS €2,100; marketplace connector €900; returns portal €650 plus €0.95 per return; iPaaS €1,200; POS, PSP, EDI provider and shipping service.; figure: Figure 4: Kestrel & Pine as a hosted platform surrounded by specialist layers, with Waypoint's two added layers beside it. |  |\n| p42 | analysis | The composable proposal asked the 14-person technology team to operate several new systems and their integrations, and only its availability service addressed the oversell, a capability that can be bought with an OMS and connected to the existing shop platform. | scenario: A 14-person technology team with three people on storefronts and apps; Waypoint's stock-ownership decision W1. | `sequence`: Kestrel & Pine's place on the map. → The composable proposal tested against the oversell and the team. |\n| p43 | analysis | The composable proposal also assumed one cutover date, so its operating burden and migration risk were two named failure patterns: The Giant's Boots, another organization's architecture without its capacity, and The Burned Bridge, a move without a route back. |  | `additional_support`: The operating burden of the composable proposal. → Its single cutover date, and the two failure patterns the proposal illustrates. |\n| p44 | analysis | The headless proposal left the stock chain untouched, and its speed argument weakened when Noor traced the slow pages to scripts from eleven apps, which three months of agency time later fixed. | scenario: Slow product pages traced to scripts from eleven apps; a quarter of agency time spent on performance fixed it. | `contrast`: The composable proposal. → The headless proposal, which left the stock chain untouched. |\n| p45 | recommendation | Noor declined both proposals because neither fixed anything that a smaller change could not, which answers the CEO's third question; W4 keeps the hosted shop platform, adds the OMS with its availability service and the PIM beside it and sets a review in 2029, and its cost is stated: the fee grows with sales, the platform contract constrains the PSP choice and every added layer is a join to govern. | scenario: Waypoint decisions W4 and W5; Noor's note: 'we are not choosing a platform; we are choosing which work we are willing to own.' | `cause_effect`: Two proposals tested and found to fix nothing a smaller change could not. → The refusal of both, and W4, stay and surround, with its cost. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`cause_effect`, id `wrong`): A chosen category fails slowly, through the vendor's funding, a core that cannot be upgraded, the price and the ownership, and each can be detected in advance.\n\n**Advances the thesis** (S5): Shows what in the vendor's public record and the merchant's own costs to watch after choosing.\n\n**Transition in:** `contrast`: A decision made and its cost named. → The ways a category that was chosen well can fail later.\n\n**Order of paragraphs** (`grouping`): Four parallel failure modes, each with detection and recovery.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | claim | A category chosen well can still fail, slowly, in four ways the public record illustrates. |  |  |\n| p47 | example | The vendor stops funding the merchant's region or product; yearly reading of the vendor's results, reviews, ownership and revenue mix detects it, and an exit plan written in advance is the recovery. | case: Lightspeed's February 2025 strategic review named two growth engines, neither of them European online retail. | `example`: Four slow failures. → The first: the vendor stops funding the region or product. |\n| p48 | example | The core is changed until it cannot be upgraded; the number of vendor releases the platform is behind detects it, and moving extensions to sandboxed or API-based mechanisms is the recovery. | case: Platform-as-a-service deployments and every open-source platform let the merchant or its agency change the core: the Forked Platform. | `additional_support`: Vendor funding. → The second: a core changed until it cannot upgrade. |\n| p49 | example | The price crosses several thresholds in one year as a merchant moves from Growing to Omnichannel; a yearly total-cost review of every line priced on sales, orders or requests detects it, and negotiating on actual sales, with the business-customer share separated, is the recovery. | example: The platform's GMV tier, the PSP's volume pricing and the per-order quotas of the WMS and channel tools crossed at about the same time; '€2,300 a month' was never the price. | `additional_support`: The upgrade path. → The third: the price crossing several thresholds at once. |\n| p50 | example | An acquisition changes what the product will push; ownership in the yearly vendor review detects it, and contracts that name the capability depended on and its support period are the recovery. | case: PayPal's stake in Shopware became Shopware Payments within eight months; Katapull added two labels in 2026. | `additional_support`: The price. → The fourth: an acquisition that changes the product. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The categories, the price lists and the vendors' 2023–2026 record describe the same three things from different sides: who runs the product, how its price moves with the merchant's sales and who carries the integration work. A move between categories changes the owner of that work and does not remove it, so the question to put to any pitch is what it would fix that an added layer would not.\n\n**So what:** A merchant that can say who carries the work in each category can refuse a move that would only change the work's owner and price; Kestrel & Pine stays on its shop platform and adds the layers it lacks.\n\n**Callback:** The introduction's two platforms with the same cart, catalog and checkout features; and, for the part, the part opening's single order whose promises depend on systems the shopper never sees. The first paragraph of the conclusion returns to the two platforms and says what separates them; the next-to-last paragraph returns to the part's single order and performs the part's closing.\n\n**Takeaway** (`course_of_action`): Choose the category by the work you can own, treat every 2026 pitch as a layer to add, and take the six questions to your own platform; before comparing platforms at all, map the capabilities and name one record per fact.\n\n**Hand-off** to [Part II — CATALOG: Products, Prices and Promises](part-2.html): `example`: Part I's rule of one record per fact and its capability map. → The first group of facts on the map, those a shopper sees before buying.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50a | synthesis | The two platforms of the opening, equal in features, differ in who runs them, how the price moves with sales and who carries the integration work, and those three answers, not the features, are what the categories, the price lists and the vendors' 2023–2026 record each describe; a move to another category changes who owns the work and does not remove it, which is why Kestrel & Pine's answer to its CEO was to stay and add layers. | reasoning: The opening's two platforms and the CEO's three questions set against the chapter's answer. |  |\n| p51 | synthesis (list) | Established: the market sells commerce in seven shapes that decide who runs the servers, who upgrades and where the integration work lands; platforms are priced mainly on sales and payments; and between 2023 and 2026 the leading vendors moved to selling layers beside existing stacks while replatforming demand softened. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what the public record establishes. |\n| p52 | synthesis (list) | Depends on context: which category fits depends on the stage and on what the merchant can staff, for the hosted platform with layers, ERP-centered commerce, a composable core and a specialist group alike. |  | `contrast`: What the public record establishes. → What changes with the merchant's situation. |\n| p53 | recommendation (list) | The author's synthesis: choose the category by the work you can own, and treat every 2026 pitch, 'composable' and 'agentic' included, as a layer to add beside the stack you have. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p54 | recommendation (list) | Six questions let the reader place their own platform in a category, total what it really costs, read its vendor's public record and name the layers that could be added beside it. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own platform. |\n| p55a | synthesis | Part I's five chapters are one line of reasoning: the order's journey, the business model, the capability map and the ownership table say what a merchant must be able to do before it can judge any product, which is why Kestrel & Pine keeps its shop platform and adds the missing capabilities (its problems were facts nobody owned, which no replacement product would have fixed); so before comparing platforms, map the capabilities, name one record per fact and choose by the integration work you can carry. | reasoning: The part opening's single order, whose promises depend on systems the shopper never sees, set against the five chapters. | `conclusion_summary`: This chapter's answer about what the market sells. → What the five chapters of Part I say together, and what to do before comparing platforms. |\n| p55 | transition | Part II applies the rule of one record per fact and the capability map to the first group of facts on the map, those a shopper sees before buying: the product record, the price, the promotion, the search result and the stock figure every channel shows. |  | `example`: Part I's rule of one record per fact and its capability map. → The first group of facts on the map, those a shopper sees before buying. |\n\n## Non-goals\n\n- The decision method for choosing or changing a platform and the full cost model; migration mechanics. See [Build, Buy or Assemble: Choosing and Changing Platforms](build-buy-or-assemble.html), [Moving Without Burning the Bridge: Replatforming and Migration](replatforming-and-migration.html).\n- Architecture styles as engineering (monolith, modular monolith, microservices, composable as a style). See [Monolith, Modular Monolith, Microservices, Composable: What the Evidence Says](commerce-architecture-styles.html).\n- Tenancy, pods and rate limits; apps, plugins and the Forked Platform mechanics; storefront delivery. See [Many Merchants, One Platform: Multi-Tenancy, Pods and Isolation](multi-tenancy-and-isolation.html), [Apps, Plugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html), [Delivering the Storefront: Themes, Headless, Rendering and Performance](storefront-architecture.html).\n- The composable movement's history, commercetools and Shopware in depth, and the MACH survey data; Shopify in depth. See [Case: commercetools, Shopware and the Composable Movement](case-composable-movement.html), [Case: Shopify, the Modular Monolith That Serves Millions of Merchants](case-shopify.html).\n- Agentic commerce protocols and their regional status; ERP as hub versus commerce as hub. See [Assistants and Agents: AI in Commerce and What Is Real in 2026](ai-and-agentic-commerce.html), [The Back Office: ERP Integration and Who Is the Hub](erp-and-back-office-integration.html).\n- The capability map itself; the scale stages as a model. See [The Map of a Commerce Platform: Capabilities and Layers](commerce-capability-map.html), [What Changes at Each Scale: From First Store to Group](commerce-scaling-stages.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Salesforce Commerce Cloud's pricing model is stated only as an industry belief; if a Salesforce document confirms or denies GMV-based pricing, the pricing table should be updated.\n- SAP Commerce Cloud is described from Spartacus and one analyst note because sap.com refused automated fetching; a reviewer with access to SAP's product pages should check the 'cloud ERP edition' wording.\n- The commercetools CEO sequence (founder to Andrew Burton in July 2024; Doug McNary signing results by April 2026) is documented at both ends but the handover itself was not found in a release.\n- Prices and plan names on every vendor page are volatile; the chapter should be re-dated at the next edition.\n- Thesis rubric (a reader given only the thesis object, 2026-11-12): FAIL on 'does the claim answer the question'. The question is a four-part survey (what kinds, who sells them, how priced, how the market changed) and the claim answers a different one (how a merchant should choose and how to read a 2026 pitch); it says nothing on 'who sells them'. The reader suggested changing the question (for example 'What does a platform's category decide for the merchant, and what did 2026 change?'). The other three tests passed, with the remark that disputed_by opposes only the first half of the claim. Nothing was changed: the thesis is the journal spec's.\n- Flow rubric note taken only in part: the CEO's second question (what would each proposal cost in year three) is answered nowhere in the chapter, and no ledger line gives year-three costs for the two proposals. The chapter now says that the second question needs the full cost model of build-buy-or-assemble. The author may prefer to drop the question from the scene or to add a ledger figure.\n- Flow rubric note not taken: merge the 'Established' and 'Depends on context' lists (p51, p52). Kept apart because the three-tier take-away is the book's house format.\n- Second flow run (sound with notes), notes not taken: move the acquisition failure (p50) next to the vendor-funding failure (p47), both being vendor-side; move 'When It Goes Wrong' before the test of the proposals so the decision is the body's climax; have the test of the proposals apply the unit-date-definition reading to the €3.2 million estimate and to the agency's speed claim, so the reading guide pays off in the scenario (this would need facts the ledger does not hold); trim the repetition of 'choose by the work you can carry' across the conclusion (p50a, p53, p55a), which is there because p55a performs the part's take-away as the journal spec words it.\n- Flow rubric note not taken: frame the six questions as the reader's version of the CEO's three. That would need a new lead-in unit; the callback is made in the conclusion's first paragraph instead.\n- Round 1 of the draft check, one reader, not acted on: the scene's first sentence (Kestrel & Pine runs a hosted SaaS product) answers the CEO's first question before the chapter says Noor could not answer it, so 'fits in one figure' later arrives as something already told. The scene needs the fact to describe the company; the author may prefer to hold the word 'hosted SaaS' back until the place on the map.\n- Round 1, one reader, not acted on: in the vendor paragraphs (hosted SaaS, Katapull) the dated detail crowds out 'where the work lands'. The detail is the chapter's evidence and no statement about a real vendor was cut.\n- Round 2 of the draft check, one reader each, not acted on: the link between Adobe Commerce (suites) and Magento (open source) is given only in the open-source paragraph; 'interchange' appears in a price example of the layer table before the pricing table explains it (the cell quotes a real vendor's price and was left as it is); the CEO's second question is deferred in one clause that is easy to miss.\n- The yearly review as the one detector of all four failure modes (first flow rubric) was written into the failure section's opening and taken out again after round 2 to hold the word limit; each failure paragraph names its own detection.\n- Round 3 of the draft check ended in ESCALATE (15 passed, 17 failed; the two-revision budget was spent). Cheap draft faults were fixed afterwards without a further round ('the same conclusion' reworded; the ERP's 'cadence' said as scheduled updates; middleware glossed; the €12.0 million wholesale total given beside the 62%), so the check report is stale and the chapter needs one more check before the spec can be accepted. What remains is listed in the entries that follow.\n- The Eurostat statistic (p36b: web sales 8.39% of EU enterprise turnover, EDI-type sales 11.07%, 'which is why Part V is not a side topic') has now been found out of place by both flow readers in three positions: inside the reading guide's market-share paragraph (round 1), as its own paragraph in the reading guide (round 2) and at the end of the vendor section (round 3); round 3's judge also found that it supports none of the chapter's supporting claims. It argues for Part V, not for this chapter's thesis. Options for the author: cut it here and let the Part V introduction or edi-and-e-invoicing carry it; move it to the 'Established' list of the take-away; or add a supporting claim about the size of the webshop market.\n- The CEO's second question (cost in year three) is now a corroborated fault (round 3, both readers; the judge also found p41 double because of the deferral clause). The ledger holds no year-three cost for the two proposals; its build-buy-or-assemble line gives illustrative incremental costs over 2027–2029 (composable rebuild about €3.2M; stay-and-surround about €1.33M). Options: drop the second question from the scene; reword it to the 2027–2029 cost and answer it from that ledger line; or give the deferral its own short paragraph.\n- The reading guide's table (p35) takes its examples from vendors the reader meets only in the next section (round 2 and round 3, both readers each time). The guide was moved before the vendors because round 1's readers had taken the vendors' numbers at face value before reaching it. Options: keep only the rule (unit, date, definition) and the GMV definition before the vendors and move the table after them as a recap; or restrict the table's examples to vendors named in the category table.\n- Round 3, judge, spec: the Adobe paragraph (p19) holds a second idea, Commerce Optimizer as a layer beside another backend, between the three deployment shapes and 'the middle option'. Dividing it would mean rearranging dated statements about a real vendor; left for the author.\n- Round 3, judge, draft, not fixed for lack of room under the word limit: the ERP-centered paragraph (p25) opens with the definition of ERP and does not set the category against composable, as its transition declares.\n- Round 3, one reader each, not acted on: 'Where Part I Ends' reads as a second ending not announced in the roadmap; most rows of the 2023–2026 table repeat, with the same dates, events already told in the vendor paragraphs; the 34 integrations (category section) are not distinguished from the 41 apps (scene); Shopify Plus 'starting at €2,100', the US-dollar base of $2,300 to $2,500 and Kestrel & Pine's own €2,300 a month look alike; 'tenancy and isolation', 'versioned contracts' and 'platform team' in the Group row of the stage table and 'orchestration' are not explained.\n- The draft stands at the word limit (6,500). Every further gloss or transition needs a cut elsewhere; the author may prefer to raise the limit or to cut a vendor paragraph.\n\n## Decision log\n\n- **2026-11-12** — Round 2 of the draft check escalated on spec faults (auto mode, same pre-approval). Both flow readers again found the Eurostat statistic out of place in the reading guide, so it now closes the vendor-by-vendor section, after the one vendor paragraph that names an EDI provider, with the author's original opening ('One official statistic reframes…'). Two paragraphs the reverse outliner found double were divided: the incident both proposals cited (p08b) and Shopware's absorption of payments and integration (p21b). Both readers stumbled on the four terms defined before the table they belong to, so the table (p10b) again precedes the terms (p11), as in the published chapter; and both read the vendor section's opening sentence as a statement about hosted platforms, so it is now its own unit under the section heading (p12b). Rejected: Keeping the Eurostat statistic in the reading guide with a different framing sentence.; Cutting the Eurostat statistic.\n- **2026-11-12** — Round 1 of the draft check escalated on spec faults (auto mode; changes to order, paragraph ideas and transitions were pre-approved by the author; intent, thesis, role and acceptance criteria untouched). Both flow readers found the position of 'How to Read a Vendor's Claims' unclear after the timeline, because the numbers it tests are met in the vendor paragraphs, so the reading guide now follows the category table and precedes the vendors, which form their own section, 'The Seven Kinds, Vendor by Vendor'. This reverses the 2026-11-07 decision to put pricing before the reading guide. Both readers found the Eurostat point outside the reading guide's subject: it is now its own paragraph (p36b), framed as the same question (what is counted) put to the market. Three paragraphs the reverse outliner found double were divided: Saleor leaves the commercetools paragraph (p23b), and the refusal of both proposals moves from the headless paragraph (p44) to the decision (p45). The transition into 'What Changed' is declared as similarity, which is what the prose says, not contrast. Rejected: Keeping the reading guide after the timeline and only signalling it in the vendor paragraphs.; Moving the Eurostat statistic into 'What Changed', where it is not a change.; Cutting the Saleor sentence, a dated vendor fact.\n- **2026-11-12** — The author asked for the flow rubric's notes to be taken without review (auto mode). Taken: the bridge to the running order (p04) precedes the roadmap (p03), which now announces every section; the trade-offs and the stages move up to follow pricing, so the comparison of categories sits next to their definition and price, and the 2023–2026 record and the reading guide move down to stand directly before the test of the two proposals; the four words (p11) come before the category table (p10 split, p10b new); the second definition of composable and headless (p22) keeps only the consequence; the OMS-versus-WMS distinction joins the layer table's paragraph (p27) and 'Kestrel & Pine lacks an OMS and a PIM' moves to its place on the map (p41), so p28 is gone; the ERP category's strength and limit by stage (p26) moves into the stages; the scene now states the team size, the 2026-11-07** — Put pricing before the timeline and the reading guide, because the price is the clearest public evidence of what a vendor's product really is, and the Kestrel & Pine fees-versus-subscription illustration is the chapter's most transferable lesson. Rejected: Pricing after the timeline and the reading guide.\n- **2026-11-07** — Framed the Kestrel & Pine scene as two replatforming pitches so the chapter shows the Giant's Boots and the Burned Bridge without naming a vendor; recorded the pitches in the ledger. (The same day's editorial review reframed them per consistency ruling 13: a consultancy's composable rebuild and the agency's headless storefront rebuild; no ERP-partner pitch.) Rejected: Naming a vendor in the scene.\n- **2026-11-07** — Cut the draft from about 8,700 to under 6,500 words by removing a systems table that duplicated meet-kestrel-and-pine and shortening every vendor paragraph to its dated facts. Rejected: Keeping the systems table.\n\n## Sources\n\n- **Internal**\n  - meet-kestrel-and-pine — The systems landscape, the 41 apps, the 34 integrations and the Waypoint decisions.\n  - commerce-capability-map, boundaries-and-systems-of-record — The capabilities and the ownership rules the categories map onto.\n  - build-buy-or-assemble, commerce-architecture-styles, extensibility-and-app-ecosystems, case-shopify, case-composable-movement — The chapters that own what this one only names.\n  - _research/brief-platform-landscape.md and _research/brief-shopify.md — The verified vendor facts, pricing, timeline and the claims-reading table.\n  - _research/scenario-ledger.md, _research/consistency-issues.md (ruling 13a) and _research/style-guide.md — Kestrel & Pine's figures, the two February 2027 pitches and the rules.\n  - journal-spec.json (part-1, commerce-platform-landscape) — Intent outcome, AC-1, thesis and role, copied unchanged; the part's closing, which this chapter carries; Part II's transition_in, which the hand-off follows.\n- **External lusion; ideas of p03, p06, p07, p08, p09, p34, p41, p42, p44, p46 revised; roadmap, flow rationale and the transitions of every moved unit rewritten. 57 paragraphs.\n- **2026-11-12** — Converted from spec.md to an outcome spec: intent outcome, AC-1, thesis and role copied from the journal spec; supporting claims, sections, paragraphs, transitions, introduction and conclusion reconstructed from the published chapter (55 units, published order); record-keeping sections carried over. Status draft.\n- **2026-11-07** — Visual layer: redrew 2 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator).\n- **2026-11-07** — Final consistency pass: ledger-as-document references rephrased as Kestrel & Pine's records.\n- **2026-11-07** — Editorial review pass: reframed the February 2027 pitches per consistency ruling 13 (consultancy composable rebuild about €3.2M; agency headless storefront rebuild about €240,000; no ERP-partner pitch); moved the CCV Shop sentence out of the inference callout; completed the Katapull timeline (Transus undated, Picqer eighth label); pointed scale stages to their owning chapter.\n- **2026-11-07** — Initial spec and article.\n"}]}]}</script>
