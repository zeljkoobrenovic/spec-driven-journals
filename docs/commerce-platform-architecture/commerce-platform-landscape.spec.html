<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/05-commerce-platform-landscape/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter. It is a contract, not a description: after the reconstruction the order of ideas was changed from the flow rubric (see decision_log) and the chapter was revised to match.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Seven platform categories and where each puts the integration work and the cost.\n- **Know:** That most platforms are priced on the merchant's sales, with dated figures.\n- **Believe:** A platform category moves integration work; it does not remove it.\n- **Be able to:** Read a vendor's 2026 pitch as a layer to add or a move to make, and say who would carry the work afterwards.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer or product manager who has inherited a platform and is about to sit through a replatforming pitch. The chapter is written at the level of Noor Visser in February 2027, before she had the vocabulary to answer 'what kind of platform are we on?'. Analysts and leaders who must read vendor decks and analyst charts get the reading guide.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side.\n- Roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its 2026 incidents and the names of the failure patterns, in outline (meet-kestrel-and-pine, where-commerce-platforms-go-wrong).\n- From journey-of-an-order: the thirteen steps of an order, promise and handoff, the three status lines, that a system is any software or outside service that takes part in handling an order, 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems that make and keep promises, Kestrel & Pine's seven systems in the order walk and thirteen in its landscape.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub, availability service, D2C, B2B.\n- From commerce-business-models: the business models and the four scale stages (Starting, Growing, Omnichannel, Group).\n- From commerce-capability-map: the capability map.\n- From boundaries-and-systems-of-record: bounded contexts, system of record, single writer, events and reconciliation, and the Waypoint decisions W1 to W8.\n\n**Does not yet know:**\n\n- The category names and what separates them: hosted SaaS platform, enterprise suite, open source and fork, composable, headless, MACH, ERP-centered commerce, specialist layer, specialist group.\n- Deployment words: on-premises, platform-as-a-service, tenant, replatforming.\n- Pricing words: GMV as a pricing base, transaction fee, interchange, run-rate, trailing sales.\n- The layer acronyms as products one can buy: OMS, PIM, POS.\n- How to read a vendor's number (unit, date, definition) and a vendor's public record (revenue mix, strategic review, ownership).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given two platforms with the same feature list, the reader names three operating-model differences to ask about before comparing features. *Probe:* Two platforms both offer cart, catalog and checkout. What would you ask before comparing features? | `custom` | cold_reader | major |\n| AC-2 | Given a one-line description of a product, the reader places it in a category and says where the integration work lands. *Probe:* One vendor sells a storefront, cart and checkout that it hosts for many merchants, with an app store. A second vendor sells cart and catalog services reachable only through an API, with no storefront. Using only this chapter: which kind of platform is each, and with each, where does the work of connecting it to a merchant's other systems land? | `custom` | cold_reader | minor |\n| AC-3 | Given a platform's monthly list price, the reader says why it is not the cost and names the lines that move with sales. *Probe:* A hosted platform quotes a merchant €2,300 a month. Using only this chapter: why is that figure not what the platform will cost, and what would you ask for before comparing it with another vendor's price? | `custom` | cold_reader | minor |\n| AC-4 | Given a proposal to replace a platform after an incident, the reader says what the chapter advises and who would carry the work after the move. *Probe:* After a stock incident, a consultancy proposes that a merchant with stores, marketplaces and a small technology team replace its hosted platform with a composable set of separate products. Using only this chapter: what does the author advise, and who would carry the integration work after such a move? | `custom` | cold_reader | minor |\n| AC-5 | Given a number from a vendor's deck, the reader asks for its unit, its date and its definition, and can name one way such a number misleads. *Probe:* A vendor's presentation says '500+ customers' and '$100 billion GMV run-rate'. Using only this chapter: what would you ask about each number before comparing this vendor with another? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** What separates the kinds of commerce platform on sale in 2026, how are they priced, and what changed in the market between 2023 and 2026?\n\n> **Claim:** The seven categories (hosted SaaS, enterprise suite, open source, composable, ERP-centered, specialist layer, specialist group) differ less in features than in who hosts, upgrades and integrates: each moves the integration work rather than removing it. Their prices follow the merchant's sales more than the software. From 2023 to 2026 suite and composable vendors began selling modules that sit beside an existing stack: layers to add, not reasons to move.\n\n**Disputed by:** Feature comparisons that rank platforms by what they can do, and vendor claims that one category (composable, suite or hosted) is the modern answer worth moving to.\n\n**So what:** A merchant that replatforms to escape integration work finds the same work on the other side, under a different owner and price; one that reads a pitch as a layer can add it without moving.\n\n**How and why:** Hosted platforms push variation to apps, suites keep integration inside one data model, open source moves hosting and upgrades to the merchant, composable moves integration to the merchant, ERP-centered commerce keeps it inside the ERP, and specialist layers and groups leave it on the connectors to the merchant's platform. Vendors charge where they sit in the payment path, through payment fees and plans set by gross merchandise value, so the bill follows sales. And when replatforming demand softened, as Commerce.com reported, suite and composable vendors repackaged their products as modules that attach to a stack the merchant already runs.\n\n**Supporting claims**\n\n- **S1** — Platforms with the same features differ in operating model: who runs each part, how the cost moves and what leaving costs.\n- **S2** — The market sells commerce platforms in seven categories, and each category puts the integration work in a different place; none removes it.\n- **S3** — Platforms are priced mainly on the merchant's sales and payments, so the subscription is the smallest line of the cost.\n- **S4** — Between 2023 and 2026 suite and composable vendors began selling modules that sit beside an existing stack, so their 2026 pitches are layers to add, not reasons to move.\n- **S5** — A vendor's numbers and public record can be read: every number has a unit, a date and a definition, and funding, upgrades, price and ownership change in ways a merchant can watch.\n- **S6** — A merchant should choose the category by the work its team can carry at its scale stage, which for Kestrel & Pine means keeping its shop platform and adding layers beside it.\n\n## Role in the part\n\nCloses the part by connecting the map and the ownership decisions to what a merchant can buy. Supports P1-5 of part `part-1`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `grouping` in tour, wrong: parallel categories and parallel failure modes; `problem_solution` in scene to place: two proposals posed, then tested once the map exists)\n\nThe scene poses three questions the reader cannot yet answer. The categories are named first because every later section uses their names. The vendor-by-vendor section opens with the rule for reading a vendor's number (unit, date, definition) and the meaning of GMV, so the numbers are not taken at face value (round 1 of the draft check); the reading guide's table follows the vendors because its examples are their numbers, which readers of rounds 2 and 3 could not hold before meeting the vendors. Pricing follows the reading guide because the price is the vendor number that says most about the product, and the cost-shape row of the trade-off table and the stage table's fee reviews need the pricing models; the trade-offs precede the stages because the stages apply the rule the trade-offs end on. The 2023–2026 record comes after the stages because its reading (vendors now sell what a merchant below the Group stage can absorb) needs the stage judgment, and it stands directly before the test of Kestrel & Pine's proposals because those are two such pitches. The test comes only then, since it uses the categories, the prices, the team rule and the stage, and it answers the CEO's three questions in the order she asked them. The failure modes could precede the test; they stay last because 'When It Goes Wrong' closes the body in every chapter of the book.\n\n## Introduction\n\n**Hook** (`intriguing_example`): Two commerce platforms can offer the same cart, catalog and checkout features while giving a merchant very different work to do: with one the vendor runs the servers and storefront; with another the merchant must operate a separate storefront and manage upgrades.\n\n**Bridge:** Anyone comparing two products starts with their feature lists. → The work a platform leaves to the merchant (running, upgrading, paying fees that grow with sales, leaving) is its operating model, and the categories of the market are different operating models.\n\n**Thesis statement** (KEY POINTS callout, first and third bullets; paragraph p02 names the operating model in prose): The seven categories differ less in features than in who hosts, upgrades and integrates, so each moves the integration work rather than removing it; their prices follow the merchant's sales more than the software; and from 2023 to 2026 suite and composable vendors began selling modules beside an existing stack, so read their pitches as layers to add, not reasons to move.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p03, the last paragraph of the introduction):\n\n- Start from two proposals put to Kestrel & Pine in one week. *Kept in:* scene.\n- Name the seven categories. *Kept in:* kinds.\n- Go through the categories vendor by vendor, show how to read the vendors' numbers, and go through their prices. *Kept in:* tour, claims, pricing.\n- Compare the categories and fit them to the four scale stages. *Kept in:* tradeoffs, stages.\n- Turn to what vendors pitched from 2023 to 2026. *Kept in:* changed.\n- Test the two proposals and list how a chosen category fails later. *Kept in:* place, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Two commerce platforms with the same cart, catalog and checkout features can leave a merchant with very different work, because who runs the servers, the storefront and the upgrades decides the team and budget needed after the purchase. | scenario: Two platforms with the same features l & Pine runs a hosted shop platform among separate systems, and two proposals to replace or rebuild it raised a question its head of engineering could not yet answer: what kind of platform is it on?\n\n**Advances the thesis** (S1): Shows the operating-model questions (what kind of platform, what it costs by 2029, what a move would fix) as questions a merchant is actually asked.\n\n**Transition in:** `example`: The roadmap's first step. → Kestrel & Pine's shop platform, its surroundings and the two proposals to replace or rebuild it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | Kestrel & Pine has run its three storefronts on a hosted software-as-a-service shop platform since 2016, for €2,300 a month plus payment and transaction fees, with 41 apps installed. | scenario: Hosted SaaS since 2016; €2,300 a month plus payment and transaction fees on the enterprise tier; three localized storefronts in one merchant account (tenant); 41 apps. |  |\n| p06 | context | Separate systems for finance and purchasing, the warehouse, the store tills, marketplaces, returns and integration surround the shop platform; a 14-person technology team looks after them, and total technology spend of about €2.6 million in 2026 makes the subscription only one part of the cost. | statistic: Technology spend 2026 about €2.6 million, 5.4% of revenue.; scenario: A technology team of 14, three of them on storefronts and apps. | `place`: The hosted shop platform and its fee. → The separate systems around it, the team that looks after them and what the whole costs. |\n| p07 | context | In the second week of February 2027 an outside consultancy proposed to replace the shop platform with a composable system of separate commerce, storefront, search, content and integration products, with its own availability service: about eighteen months of work and, illustratively, about €3.2 million of added cost over 2027–2029. | scenario: The consultancy's composable rebuild: about €3.2 million incremental over 2027–2029, about eighteen months (illustrative). | `time`: What Kestrel & Pine runs, with whom and at what cost. → The first proposal of February 2027: a composable replacement with its own availability service. |\n| p08 | context | The existing agency proposed a headless rebuild of the storefronts on the current shop platform, on the platform vendor's runtime with a separate content system, for about €240,000 over nine months plus a second runtime to operate, arguing that it would make the pages faster. | scenario: The agency's headless storefront rebuild: about €240,000, nine months, plus a second runtime to operate (illustrative). | `contrast`: The €3.2 million composable proposal. → The much smaller headless proposal and its speed argument. |\n| p08b | context | Both proposals cited the Black Friday Oversell, when stale stock figures caused 1,340 oversold units and about €96,000 in costs. | scenario: The Black Friday Oversell: 1,340 oversold units, about €96,000. | `similarity`: Two proposals of very different size. → The one incident both cited, the Black Friday Oversell. |\n| p09 | context | The CEO's three questions (what kind of platform are we on, what would each proposal cost us by 2029, what would a move fix that nothing else fixes) found Noor without the vocabulary for the first, and the map she drew to answer them is this chapter; it ends at Waypoint decision W4, stay and surround. | scenario: Mara Lindqvist's three questions to Noor Visser; W4 reached by March 2027.; figure: Figure 1: a fork with three paths: demolish and rebuild the shop, replace only its front, keep the shop and add two annexes. | `cause_effect`: The two proposals and the incident behind them. → The CEO's three questions, the vocabulary Noor lacked for the first, and the decision the chapter ends at. |\n\n### Seven Kinds of Platform\n\n**Controlling idea** (`definition`, id `kinds`): The market sells the shop platform in seven categories, and each puts the integration work in a different place without removing it.\n\n**Advances the thesis** (S2): Defines the product and the categories and states the rule that integration work moves and never disappears.\n\n**Transition in:** `problem_solution`: Mara's first question: what kind of platform are we on? → The seven kinds the market sells.\n\n**Order of paragraphs** (`prerequisite_order`): The product is defined, then the table of categories, then the four terms the table uses (readers of round 2 could not hold terms defined before the table they belong to), then the rule about the fourth column, which the vendor-by-vendor section illustrates.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition | In the market's vocabulary a commerce platform is the product a merchant buys to show products, hold a cart, take the order and the payment and hand the order on, which this book calls the shop platform; in this chapter 'platform' means that product, and 'commerce platform' in the book's sense stays the whole set of systems. |  |  |\n| p10b | definition | The market sells the product in seven overlapping categories that differ in what is bought, who runs it and where the integration work lands. | table: Seven categories (hosted SaaS platform, enterprise suite, open source and its forks, composable and headless vendor, ERP-centered commerce, specialist layer, specialist group), each with examples, what you buy, who runs it and where the integration work lands. | `elaboration`: The product called a platform. → The seven categories in which the market sells it, in one table. |\n| p11 | definition | Four terms in the table need defining: SaaS is software the vendor runs for many customers at once, a suite is one vendor's modules designed to work together, headless separates the storefront from the commerce engine behind an API, and composable means buying commerce as separate services and assembling them. |  | `elaboration`: The category table. → Four terms in it that need defining. |\n| p12 | claim | The fourth column matters most: each category moves the integration work somewhere and none removes it, so the choice is who carries the work, at what price and with what freedom to change. | example: Kestrel & Pine's 34 integrations exist because it chose a hosted platform and bought specialist layers around it; a suite would have fewer joins and one larger contract, a composable assembly more joins, all its own.; figure: Figure 2: each category asks the merchant for a different kind of work and joins the specialist layers in a different place. | `emphasis`: The table's four columns. → The fourth, where the integration work lands, and the rule that it moves and is never removed. |\n\n### The Seven Kinds, Vendor by Vendor\n\n**Controlling idea** (`evidence`, id `tour`): The public record of each category's vendors, read by unit, date and definition, shows who runs the product, how it is priced and where the integration work lands.\n\n**Advances the thesis** (S2, S3): Gives each category dated public evidence, read by unit, date and definition, and shows the work moving from category to category.\n\n**Transition in:** `example`: The seven categories and the rule that each moves the integration work. → Each category read from its vendors' filings, price lists and announcements, with the test to apply to their numbers.\n\n**Order of paragraphs** (`grouping`): One paragraph says how each vendor's numbers are read (unit, date, definition; GMV is not revenue); the categories then follow the rows of the category table, the specialist layers and the group last because they are defined by what surrounds the other five.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12b | transition | Each of the seven kinds is described below from its vendors' public record, whose numbers are compared only by their unit, date and definition; the unit met most often, GMV, is the value of orders through a platform, not the vendor's revenue. |  |  |\n| p13 | evidence | The hosted platform is the default for a merchant that starts online, and Shopify's filing and price list show its shape: a monthly plan plus fees that move with sales, with most merchants on the cheapest plans and most sales volume from the largest merchants. | statistic: Shopify FY2025: GMV $378.4 billion, revenue $11.56 billion; plans from Basic €28 to Plus from €2,100 a month; card rates 1.9% + €0.25 down to 1.4% + €0.25; 2% down to 0.2% on orders paid through another provider; a variable platform fee for larger Plus merchants. | `example`: The promise of a record per category. → The first category, hosted SaaS, through Shopify's filing and price list. |\n| p14 | evidence | BigCommerce, now under the parent Commerce.com, assigns plans by the merchant's trailing sales, which is a price on sales under a subscription's name, and its 2026 results report flat revenue and soft demand for replatforming. | statistic: Plans assigned by trailing-twelve-month GMV with 0.9% above $33,333 a month on the Scale plan; quarter ended 30 June 2026: revenue $84.5 million, up 0.1%; B2C replatforming 'remains softer than historically'. | `additional_support`: Shopify's plan-plus-fees pricing. → BigCommerce: plans assigned by sales, and soft replatforming demand. |\n| p15 | evidence | Lightspeed earns more than twice as much from transactions as from subscriptions and has named growth engines that exclude European online retail, which the author reads, as a labeled inference, as a vendor-risk signal for a Dutch merchant on its e-commerce product. | statistic: Strategic review closed 6 February 2025: 'focus on growing retail in North America and hospitality in Europe'; FY2026 transaction-based revenue $815.1 million against subscription revenue $370.7 million; Dutch eCom €68 to €259 a month.; reasoning: Callout 'INFERENCE, NOT DOCUMENTED': Lightspeed has announced no change to its European e-commerce product; the risk reading is the author's. | `additional_support`: Two listed hosted vendors. → A third, Lightspeed, whose revenue mix and strategy are a risk signal. |\n| p16 | evidence | Below the listed vendors sit smaller hosted products such as the Dutch CCV Shop, priced at a flat monthly fee and not as a share of sales, and the site builders. | fact: CCV Shop: €36 to €129 a month, 'not a percentage of your sales'. | `contrast`: Vendors that earn on the merchant's sales. → Small hosted products priced at a flat fee. |\n| p17 | evidence | Enterprise suites sell to large merchants through implementation partners at negotiated prices, so their public evidence is thin; SAP Commerce Cloud is described here only from its open-source storefront project and one analyst note. | source: The Spartacus storefront project (accessed November 2026) and an October 2026 analyst note reporting an 'SAP Commerce Cloud, cloud ERP edition' and warning buyers to 'separate products that are available now from forward-looking demonstrations'. | `contrast`: The hosted category and its public evidence. → Enterprise suites, sold through partners, with thinner evidence; SAP first. |\n| p18 | evidence | Salesforce sells one platform across consumer and business selling, point of sale and order management, now with AI agents connected to it, and publishes no price; that it charges a percentage of sales is industry belief, not a documented fact. | quotation: 6 July 2026: 'its biggest Agentforce Commerce release yet', three generally available agents 'natively connected to catalog, inventory, and orders'; pricing page shows 'Contact for pricing' for every edition. | `additional_support`: SAP, described from two public sources. → Salesforce: one connected platform and no public price. |\n| p19 | evidence | Adobe Commerce shows one product in three deployment shapes (on-premises, platform-as-a-service, fully managed SaaS), and the middle shape, where the vendor runs the servers and the merchant owns the code, is where deep customization can block every upgrade. | fact: Adobe's information center (updated 21 October 2026) lists Adobe Commerce on-premises, on cloud infrastructure and as a Cloud Service. | `contrast`: Suites with thin public evidence. → Adobe, the clearest public example: one product in three deployment shapes. |\n| p19b | evidence | Beside the three shapes Adobe sells Commerce Optimizer, a SaaS for storefront, catalog and merchandising that works alongside an existing Adobe Commerce or third-party backend: a suite vendor selling a layer for a stack it does not run. | fact: Adobe Commerce Optimizer 'can work alongside an existing Adobe Commerce or third-party commerce backend'; partner reports place its launch and that of Commerce as a Cloud Service in June 2025. | `additional_support`: Adobe's three deployment shapes of one product. → A fourth Adobe offer that is not a shape of the product but a layer beside another backend. |\n| p20 | definition | Open source means the code may be run and changed, not that it is free: hosting, upgrades, security patches and the agency that applies them are the recurring price, as the chain from an Adobe fix to a Mage-OS release to the merchant's own test shows. | example: Magento Open Source and the community fork Mage-OS: 4.0.0 shipped 30 October 2026; 3.6.0, two weeks earlier, was a security port of an Adobe patch. WooCommerce claims 'more than 4 million stores' and prices hosting at $25 to $350 a month. | `contrast`: Products a vendor runs or co-runs. → Open source: code the merchant runs and upgrades itself, with Magento's open edition and its fork. |\n| p21 | evidence | Shopware, the leader among large German shops, shows that an open-source platform can be free for the smallest merchants and priced on sales above that. | statistic: 12.5% of the 1,000 largest German B2C shops (EHI 2026), first for the fifth year; Community Edition free; Rise from €600 and Evolve from €2,400 a month 'based on your gross merchandise value'; a paid plan required above €1 million of GMV in a rolling year. | `example`: Open source and its recurring costs. → Shopware: free at small scale, priced on sales above it. |\n| p21b | evidence | Shopware is also absorbing payments and integration into the platform, with PayPal as a large shareholder. | fact: PayPal's stake above 40% (October 2025); Shopware Payments on PayPal's infrastructure and Nexus, an orchestration layer positioned as replacing middleware, launched 10 June 2026. | `additional_support`: Shopware's pricing. → Shopware absorbing payments and integration, with PayPal as shareholder. |\n| p22 | claim | Composable and headless vendors give the merchant a choice of what to replace and leave it responsible for connecting and operating every part it selects. |  | `contrast`: Categories built around one core product. → Composable and headless vendors, defined above, and what they leave to the merchant. |\n| p23 | evidence | commercetools, the best-known composable vendor, reports large volume, cut staff after missing growth targets, and since 2026 sells layers and standalone modules for stacks that are not composable. | fact: 22 April 2026: '$100B GMV run-rate', more than 600 million orders a year; 21 January 2026: AgenticLift 'on top of your existing commerce solution'; 15 July 2026: cart-and-order engine and product catalog as standalone modules. | `example`: What composable leaves to the merchant. → commercetools and Saleor. |\n| p23b | evidence | Saleor shows that API-only vendors price on the merchant's sales too. | fact: Saleor cloud from $1,599 a month up to $200,000 of monthly GMV, 0.8% above (November 2026). | `additional_support`: commercetools, which sells by the piece. → Saleor, an API-only vendor that prices on the merchant's sales. |\n| p24 | explanation | MACH is an acronym a vendor alliance coined in 2020 and has since loosened, so 'composable' and 'MACH' name a category and a sales argument, not a verdict. | fact: Coined June 2020 for Microservices, API-first, Cloud-native SaaS and Headless by founders commercetools, Contentstack, EPAM and Valtech; by November 2026 the principles page lists Open, Composable, Connected. | `elaboration`: The composable vendors. → MACH, the acronym their alliance coined. |\n| p25 | evidence | ERP-centered commerce makes the ERP the owner of products, stock and orders and treats the webshop as a front end, and Microsoft preinstalling a connector to a hosted platform shows the vendors expect this shape. | fact: Odoo's eCommerce app free within €19.90 or €35.90 per user per month; JTL, PlentyONE and NetSuite SuiteCommerce bundle shop and back office; Microsoft's documentation (22 September 2026): the Shopify Connector 'is preinstalled for all new sign-ups and trials' of Business Central. | `contrast`: Commerce assembled from separate services. → Commerce attached to the ERP that already owns stock, orders and finance. |\n| p27 | definition | Every category is surrounded by specialist layers, each owning one capability and selling to every platform (OMS, PIM, WMS, returns, search, channel integration, iPaaS and PSP); of these an OMS, which decides which location fulfills an order and what to promise, is easily confused with a WMS, which decides where goods sit and how to pick them. | table: Eight layers, each with what it owns in plain words and vendor examples with claims and prices (accessed November 2026). | `additional_support`: The five kinds of core platform. → The specialist layers that surround every one of them. |\n| p29 | definition | A specialist group is a third shape beside suite and composable: several specialist products under one owner, kept as separate brands and pre-integrated, which reduces the joins a merchant builds at the cost of one owner across several layers; the Dutch group Katapull is the public example. | case: Katapull's eight labels (Logic4, Vendit, Picqer, EffectConnect, DeliveryMatch, Returnista, Transus, Highbiza); five companies joined 31 March 2025, Returnista 16 February 2026, Picqer 7 October 2026; '4,500+ customers in 40+ countries'; no revenue, GMV or ownership figures public. | `contrast`: Layers bought one at a time. → A group that sells several, pre-integrated, under one owner. |\n\n### How to Read a Vendor's Claims\n\n**Controlling idea** (`explanation`, id `claims`): The vendor numbers just met, and market-share figures, can be compared only when their unit, date and definition are known, and each kind of unit has its own trap.\n\n**Advances the thesis** (S5): Turns the vendor numbers of the previous section into a test the reader can apply to any pitch.\n\n**Transition in:** `elaboration`: The vendor numbers of the seven kinds and the rule of unit, date and definition. → The trap in each kind of claimed unit, with examples taken from those vendors.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | explanation | The vendor paragraphs above were full of numbers, and none can be compared across vendors until its unit, its date and its definition are known; the table takes its examples from those paragraphs. | table: Four kinds of claimed unit (GMV; merchants, customers, brands, users; marketplaces, integrations, apps; surveys, analyst charts and performance claims), each with a dated example and the trap. |  |\n| p36 | evidence | Market-share data need the same care, because two true figures can rank the same vendor last and first when they count different populations. | statistic: W3Techs (7 November 2026): WooCommerce 47.3% of sites with a detectable e-commerce technology, Shopify 32.5%, Shopware 0.2%; EHI: Shopware first among the 1,000 largest German shops. | `similarity`: Vendor numbers and their traps. → Market-share data, which need the same care. |\n\n### How Platforms Are Priced, and What the Price Tells You\n\n**Controlling idea** (`analysis`, id `pricing`): Platforms are priced on what the vendor sits in the path of, mostly the merchant's sales and payments, so the subscription is the smallest line.\n\n**Advances the thesis** (S3): Turns the prices met category by category into seven models and one pattern, and shows the size of the fee lines on Kestrel & Pine's own numbers.\n\n**Transition in:** `elaboration`: The vendors' numbers and how to read them, including the prices quoted vendor by vendor. → The price as the vendor number that says most about the product, and the pricing models that recur across the categories.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | claim | A platform's price tells what the vendor's product really is, and seven pricing models recur across the seven categories. | table: Seven pricing models (flat subscription tier, subscription with GMV thresholds, enterprise GMV share, payment fee share, per order/user/request, per payment transaction, free core with paid services), each with how it works, dated examples and what it means for the merchant. |  |\n| p31 | analysis | A vendor prices on the thing it sits in the path of: pricing on sales assumes it owns checkout, per-order pricing that it sees every order, per-request pricing that it is in the request path. | statistic: Shopify's FY2025 filing: 76% of revenue is 'merchant solutions' that are 'directionally correlated with the level of GMV', with 65.6% of GMV through its own payment service; Lightspeed's revenue mix. | `conclusion_summary`: The seven rows of the pricing table. → The pattern across them: a vendor prices on what it sits in the path of. |\n| p32 | example | For Kestrel & Pine the subscription is the smallest line: on an assumed €34.4 million of sales through the shop platform's checkout, a 0.2% fee is about two and a half times the €27,600 subscription and a 1% fee about twelve times. | scenario: Labeled assumption: €27.0 million D2C plus the 62% of the €12.0 million wholesale line ordered through the B2B portal, about €7.4 million: about €34.4 million GMV; 0.2% is about €69,000 a year, 1% about €344,000; neither is what Kestrel & Pine pays.; figure: Figure 3: an iceberg whose visible tip is the subscription, with larger fee bands below the waterline. | `example`: The pattern. → Kestrel & Pine's subscription set against fees on its sales. |\n\n### The Trade-offs Between Categories\n\n**Controlling idea** (`comparison`, id `tradeoffs`): The categories trade off on five checkable criteria, and the category to choose is the one the merchant's present team can staff.\n\n**Advances the thesis** (S1, S6): Puts the operating-model differences side by side, the price among them, and draws the rule for choosing.\n\n**Transition in:** `conclusion_summary`: The seven categories and the way each is priced. → The five criteria on which the categories can be compared side by side.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | comparison | The categories differ on five criteria a newcomer can check: time to first sale, who upgrades, the integration burden, the shape of the cost and the cost of leaving. | table: Six categories against five criteria (time to first sale, who upgrades, integration burden, cost shape, exit cost); the author's judgment. |  |\n| p38 | recommendation | The author's rule is to choose the category by the team the merchant has, not the team it wants, because each category needs different people and the one that cannot be staffed is the wrong one. |  | `cause_effect`: The trade-off table. → The author's rule: choose by the team you have. |\n\n### Across Scale Stages: Which Categories Fit Which Stage\n\n**Controlling idea** (`comparison`, id `stages`): Which category fits depends on the merchant's scale stage: ERP-centered commerce limits at the Omnichannel stage, and composable becomes realistic as a core only at the Group stage.\n\n**Advances the thesis** (S6): Applies the rule to the four stages the reader already knows.\n\n**Transition in:** `elaboration`: The rule of choosing by the team you have. → What that means at each of the four scale stages.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | comparison | Which category a team can carry depends on the merchant's scale stage: each of the book's four stages has categories that typically fit it, things that become necessary and warning signs of outgrowing the approach. | table: Four stages (Starting, Growing, Omnichannel, Group), each with typical category, what becomes necessary and warning signs. |  |\n| p26 | analysis | A category that fits one stage becomes a limit at the next, and ERP-centered commerce shows it plainly: strong at the Starting and Growing stages, where one system means no integration problem, and limited at the Omnichannel stage, when stores, marketplaces and a warehouse need stock faster than the ERP's batch updates. |  | `example`: The stage table's pattern of fit and outgrowing. → One category followed through it: ERP-centered commerce, strong early and limited at the Omnichannel stage. |\n| p40 | recommendation | At the Starting and Growing stages 'composable' is a vendor category and not an instruction, at the Omnichannel stage it is something done per capability around a kept core, and only at the Group stage, with a platform team, is an API-only core realistic. |  | `additional_support`: The ERP-centered category across the stages. → The same reading for composable: a vendor category early, a practice per capability later, a core only for a Group. |\n\n### What Changed, 2023 to 2026\n\n**Controlling idea** (`evidence`, id `changed`): From 2023 to 2026 vendors retreated from physical logistics and pulled payments into the platform, and suite and composable vendors began selling modules beside a merchant's existing stack, which is what a merchant below the Group stage can absorb.\n\n**Advances the thesis** (S4): Dates the convergence that the thesis's last clause rests on, after the reader knows why a kept core suits most merchants.\n\n**Transition in:** `similarity`: The judgment that below the Group stage a merchant keeps its core and adds per capability. → The vendors' side of the same conclusion: what they began to sell between 2023 and 2026.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | evidence | Below the Group stage a merchant keeps its core and adds around it, and in the three years before November 2026 vendors began selling to that merchant: they retreated from physical logistics, pulled payments into the platform, and suite and composable vendors began selling layers beside a merchant's existing stack instead of replacing it. | table: Eight dated events from 6 June 2023 (Shopify sells most of Shopify Logistics to Flexport) to 6 August 2026 (Commerce.com reports B2C replatforming 'softer than historically'), each with what it tells a merchant. |  |\n| p34 | evidence | The newest thing vendors sell is the AI assistant as a sales channel, which for a merchant is one more channel, priced as a channel; like the other layers of 2026 it is an addition an Omnichannel-stage merchant can absorb without moving. | fact: Shopify's Agentic plan (accessed November 2026): 'no monthly fee', syndicates products to ChatGPT, Gemini, Copilot and Perplexity so shoppers 'check out in conversations', 'no Shopify online store required'. | `additional_support`: Eight dated events. → The newest offer, the AI assistant as a channel, read the same way. |\n\n### Kestrel & Pine's Place on the Map\n\n**Controlling idea** (`example`, id `place`): Placed on the map, Kestrel & Pine is a hosted shop platform with specialist layers; both proposals fail against its team and its measured problems, and it stays and adds the layers it lacks.\n\n**Advances the thesis** (S6, S4): Works the whole method on the running example and reaches W4.\n\n**Transition in:** `example`: The map: categories, prices, fit by stage and what vendors now pitch. → Kestrel & Pine placed on it, and the two proposals of the opening scene tested.\n\n**Order of paragraphs** (`problem_solution`): The place on the map answers the CEO's first question; the cost to 2029 answers her second; the two proposals are then tested in the order the scene introduced them, which answers her third; the decision comes last because it depends on the tests.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | example | Kestrel & Pine is a hosted SaaS shop platform surrounded by specialist layers, with an ERP used as the back office and not as the hub; the two things it lacks, an OMS and a PIM, are specialist layers too, and Waypoint buys both (W2, W3). That answers the CEO's first question. | scenario: Shop platform €2,300 a month plus fees; ERP €3,900; WMS €2,100; marketplace connector €900; returns portal €650 plus €0.95 per return; iPaaS €1,200; POS, PSP, EDI provider and shipping service.; figure: Figure 4: Kestrel & Pine as a hosted platform surrounded by specialist layers, with Waypoint's two added layers beside it. |  |\n| p41b | evidence | The CEO's second question had an answer by March from the platform review's illustrative figures over 2027–2029: the consultancy's rebuild about €3.2 million in added cost, staying and adding the two layers about €1.33 million, and the agency's rebuild about €240,000 plus a second runtime to operate. | scenario: Illustrative incremental cost over the running spend, 2027–2029: composable rebuild about €3.2M (18 months); stay-and-surround about €1.33M (inside the €1.1M Waypoint budget plus subscriptions); headless rebuild about €240,000, nine months, plus a second runtime. | `sequence`: The answer to the CEO's first question. → The answer to her second, the cost of each option to 2029. |\n| `cause_effect`: Two proposals tested and found to fix nothing a smaller change could not. → The refusal of both, and W4, stay and surround, with its cost. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`cause_effect`, id `wrong`): A chosen category fails slowly, through the vendor's funding, a core that cannot be upgraded, the price and the ownership, and each can be detected in advance.\n\n**Advances the thesis** (S5): Shows what in the vendor's public record and the merchant's own costs to watch after choosing.\n\n**Transition in:** `contrast`: A decision made and its cost named. → The ways a category that was chosen well can fail later.\n\n**Order of paragraphs** (`grouping`): Four parallel failure modes, each with detection and recovery.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | claim | A category chosen well can still fail, slowly, in four ways the public record illustrates. |  |  |\n| p47 | example | The vendor stops funding the merchant's region or product; yearly reading of the vendor's results, reviews, ownership and revenue mix detects it, and an exit plan written in advance is the recovery. | case: Lightspeed's February 2025 strategic review named two growth engines, neither of them European online retail. | `example`: Four slow failures. → The first: the vendor stops funding the region or product. |\n| p48 | example | The core is changed until it cannot be upgraded; the number of vendor releases the platform is behind detects it, and moving extensions to sandboxed or API-based mechanisms is the recovery. | case: Platform-as-a-service deployments and every open-source platform let the merchant or its agency change the core: the Forked Platform. | `additional_support`: Vendor funding. → The second: a core changed until it cannot upgrade. |\n| p49 | example | The price crosses several thresholds in one year as a merchant moves from Growing to Omnichannel; a yearly total-cost review of every line priced on sales, orders or requests detects it, and negotiating on actual sales, with the business-customer share separated, is the recovery. | example: The platform's GMV tier, the PSP's volume pricing and the per-order quotas of the WMS and channel tools crossed at about the same time; '€2,300 a month' was never the price. | `additional_support`: The upgrade path. → The third: the price crossing several thresholds at once. |\n| p50 | example | An acquisition changes what the product will push; ownership in the yearly vendor review detects it, and contracts that name the capability depended on and its support period are the recovery. | case: PayPal's stake in Shopware became Shopware Payments within eight months; Katapull added two labels in 2026. | `additional_support`: The price. → The fourth: an acquisition that changes the product. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The categories, the price lists and the vendors' 2023–2026 record describe the same three things from different sides: who runs the product, how its price moves with the merchant's sales and who carries the integration work. A move between categories changes the owner of that work and does not remove it, so the question to put to any pitch is what it would fix that an added layer would not.\n\n**So what:** A merchant that can say who carries the work in each category can refuse a move that would only change the work's owner and price; Kestrel & Pine stays on its shop platform and adds the layers it lacks.\n\n**Callback:** The introduction's two platforms with the same cart, catalog and checkout features; and, for the part, the part opening's single order whose promises depend on systems the shopper never sees. The first paragraph of the conclusion returns to the two platforms and says what separates them; the next-to-last paragraph returns to the part's single order and performs the part's closing.\n\n**Takeaway** (`course_of_action`): Choose the category by the work you can own, treat a 2026 pitch as a layer to add, and take the six questions to your own platform; before comparing platforms at all, map the capabilities and name one record per fact.\n\n**Hand-off** to [Part II — CATALOG: Products, Prices and Promises](part-2.html): `example`: Part I's rule of one record per fact and its capability map. → The first group of facts on the map, those a shopper sees before buying.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50a | synthesis | The two platforms of the opening, equal in features, differ in who runs them, how the price moves with sales and who carries the integration work, and those three answers, not the features, are what the categories, the price lists and the vendors' 2023–2026 record each describe; a move to another category changes who owns the work and does not remove it, which is why Kestrel & Pine's answer to its CEO was to stay and add layers. | reasoning: The opening's two platforms and the CEO's three questions set against the chapter's answer. |  |\n| p51 | synthesis (list) | Established: the market sells commerce in seven shapes that decide who runs the servers, who upgrades and where the integration work lands; platforms are priced mainly on sales and payments; and between 2023 and 2026 suite and composable vendors moved to selling layers beside existing stacks while replatforming demand softened. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what the public record establishes. |\n| p52 | synthesis (list) | Depends on context: which category fits depends on the stage and on what the merchant can staff, for the hosted platform with layers, ERP-centered commerce, a composable core and a specialist group alike. |  | `contrast`: What the public record establishes. → What changes with the merchant's situation. |\n| p53 | recommendation (list) | The author's synthesis: choose the category by the work you can own, and treat a 2026 pitch, 'composable' and 'agentic' included, as a layer to add beside the stack you have, because that is what suite and composable vendors now sell. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p54 | recommendation (list) | Six questions let the reader place their own platform in a category, total what it really costs, read its vendor's public record and name the layers that could be added beside it. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own platform. |\n| p55a | synthesis | Part I's five chapters are one line of reasoning: the order's journey, the business model, the capability map and the ownership table say what a merchant must be able to do before it can judge any product, which is why Kestrel & Pine keeps its shop platform and adds the missing capabilities (its problems were facts nobody owned, which no replacement product would have fixed); so before comparing platforms, map the capabilities, name one record per fact and choose by the integration work you can carry. | reasoning: The part opening's single order, whose promises depend on systems the shopper never sees, set against the five chapters. | `conclusion_summary`: This chapter's answer about what the market sells. → What the five chapters of Part I say together, and what to do before comparing platforms. |\n| p55 | transition | Part II applies the rule of one record per fact and the capability map to the first group of facts on the map, those a shopper sees before buying: the product record, the price, the promotion, the search result and the stock figure every channel shows. |  | `example`: Part I's rule of one record per fact and its capability map. → The first group of facts on the map, those a shopper sees before buying. |\n\n## Non-goals\n\n- The decision method for choosing or changing a platform and the full cost model; migration mechanics. See [Build, eport stale. Remaining findings under open_questions.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
