<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/13-order-management/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter. It is a contract, not a description: the places where the chapter did not yet do what the spec asks are listed under open_questions.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** What an order record holds (header, lines, money, promises, goods, references) and why the order number is the key for creating the order in every other system.\n- **Know:** The order's three status lines (money, goods per shipment, returns) and how the status the customer sees is computed from them.\n- **Know:** Routing, split shipments and backorders, and what an order management system holds and what it leaves to the shop platform and the ERP.\n- **Believe:** A single status word on an order hides facts that systems need, and is a fault, not a simplification.\n- **Believe:** The order's home is chosen by which system must answer the customer's question about a parcel.\n- **Be able to:** Decide whether a merchant needs an OMS by checking four conditions.\n- **Be able to:** Say what a split order's status should read and what the customer should be told.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer or product manager who owns, or is about to own, an integration between the shop platform, a warehouse system and an ERP and must decide which system is the order's home. Service and operations managers get the vocabulary to ask why 'Delivered' was wrong.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side.\n- Roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its 2026 incidents in outline and the names of the sixteen failure patterns (meet-kestrel-and-pine, where-commerce-platforms-go-wrong).\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines of an order (money, goods, returns), 'system' as any software or outside service that takes part in handling an order, 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, the business models and the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, and the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Part II: product, variant, SKU and GTIN; prices selected once at order placement and frozen; discounts allocated to lines; available-to-promise, one writer each for on hand and committed, per-channel buffers and an exact commit at checkout.\n- From the earlier chapters of Part III: checkout creates the order once, with its payment pending, keyed so that a retry does not create a second order; the payment provider's webhook marks it paid; authorization, capture, settlement and payout; one writing system and a business key for every action that moves money.\n\n**Does not yet know:**\n\n- State machine; the order lifecycle, money, goods and return machines; fulfillment order; the order-level summary and its two rules.\n- Edit window, calculated order, hold, cancellation request, compensation and the saga pattern's vocabulary.\n- Sourcing, routing, split shipment, backorder, child shipment.\n- Orchestration; the OMS's components; the two-of-four rule.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a two-parcel order whose systems show three different statuses, the reader says what the order should have shown and which design decision was missing. *Probe:* An order for a fleece and socks ships the fleece first; the socks wait for replenishment. The shop shows 'Delivered', the warehouse 'In picking' and the ERP 'Not invoiced'. Using only this chapter: what should the order have shown, and what was missing in its design? | `custom` | cold_reader | major |\n| AC-2 | Given a merchant's channels and locations, the reader decides whether it needs an OMS by the four conditions and says why an OMS rather than the ERP holds the order. *Probe:* A merchant sells through its own web shop and a marketplace and ships from two warehouses. A vendor offers it an OMS. Using only this chapter: does it need an order hub, and should that hub be the ERP or an OMS? | `custom` | cold_reader | major |\n| AC-3 | The reader can say what happens when support cancels an order that has already shipped. *Probe:* Support 'cancels' an order that has already shipped. Using only this chapter: what should happen instead? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** Where does the order live once it is placed, what states does it pass through, and when does a merchant need an order management system (OMS)?\n\n> **Claim:** Once placed, an order should live in one system that holds it as one record, under one order number, with three separate status lines (money: authorized, paid, refunded, moved by the payment provider's events; goods: requested, accepted, shipped, delivered, held per shipment and moved by the warehouse and the carrier; returns: requested, received, inspected, refunded or exchanged) and computes the status the customer sees from all its shipments, so that the order reads delivered only when every parcel has been delivered. While one channel creates orders and one location fulfils them, that system is the shop platform; a merchant needs an OMS as the order's home once at least two of four conditions hold (several channels create orders, several locations fulfil them, promises depend on the location, service agents cannot see one order across systems), because an OMS, unlike the ERP, can route lines between locations and answer a customer's question about a parcel.\n\n**Disputed by:** The view that an order has one status in whichever system took it, kept in step with the others by connectors, and that an OMS is a product for large retailers, needed by revenue or order volume rather than by how many systems create and fulfil orders.\n\n**So what:** Order #1052877 read 'Delivered' in the platform, 'In picking' in the warehouse and 'Not invoiced' in the ERP while the customer had a fleece and no socks, and produced 11 support tickets; with goods status per shipment it would have read 'Partially delivered: 1 of 2 parcels'. Kestrel & Pine meets all four conditions, so under W2 it makes a bought OMS the order hub, with the platform keeping the checkout and the ERP the books. A merchant that accepts the claim counts its order sources and fulfilling locations and names the order's home before it buys anything.\n\n**How and why:** Money, goods and returns are changed by different systems at different times (the payment provider, the warehouse and the carrier per parcel, the returns portal), so one status word lets the latest message overwrite the others: one parcel's delivery scan marked a two-parcel order delivered. Every system that copies the order receives it at least once, so the copies stay one order only through one number family with the order number as the key. With one channel and one location the platform's record sees every change; with several sources, each with its own connector to the warehouse and the books, no system sees the whole order; one condition alone can be handled by the platform plus a connector, but two make the joins between systems the problem, and choosing which location ships which line needs rules over stock, capacity, cut-off times and cost that the platforms' priority and distance rules do not hold. The ERP holds the financial record and runs in batches, so it cannot answer a parcel question.\n\n**Supporting claims**\n\n- **S1** — An order record has six parts (header, lines, money, promises, goods, references), and its number, drawn from one family for every channel, is the key that lets every other system receive the 'order placed' message more than once and still hold one order.\n- **S2** — Money, goods and returns are moved by different systems at different times, so the order keeps a separate state machine for each, the goods state lives on each shipment, and the status the customer sees is computed from the least-advanced shipment; one status word lets the latest message overwrite the others.\n- **S3** — Edits, holds and cancellations are changes to those state machines, not form updates: edits close once the warehouse accepts the work, and a cancellation after shipment becomes a return, a compensating step the order's home coordinates.\n- **S4** — Once several locations fulfil orders, choosing which location ships which line and whether to split is a cost decision over stock, capacity, cut-off times and carrier rates that the platforms' priority and distance rules do not make, and a split must be told to the customer.\n- **S5** — The order's home is chosen by which system must answer the customer's question about a parcel: the shop platform while one channel creates orders and one location fulfils them, and an OMS, not the ERP, once two of four conditions hold, with the platform keeping the checkout and the ERP the books.\n- **S6** — An order hub does not remove the joins between systems: messages are repeated, lost and reordered, so each join still needs the order or shipment id as its key, a state machine that refuses impossible moves and a daily comparison of the copies.\n\n## Role in the part\n\nGives the order one home and separate status lines, so that the payment outcome, each parcel and each return are kept without overwriting each other, and supplies the per-shipment record the ledger chapter invoices from. Supports P3-2, P3-4 of part `part-3`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to states: the Three-Status Order, then the record and the state machines that answer it; `comparison` in choices, trade-offs and stages: four homes for the order on the same criteria, then by stage)\n\nThe Three-Status Order comes first so that every term arrives as part of the answer to 'why did three systems give three answers'. The record's parts and its number come before the state machines, because the machines are fields of that record and the number is the key every later section relies on. The state machines come before changes to a placed order, since an edit or a cancellation is a move of one of those machines, and before routing, since a split creates the second fulfillment order whose state the summary rule reads. Routing needs several locations, which the reader meets there for the first time, and ends on the fuller decision OMS vendors describe. Several channels then follow as the other half of the joins problem, with the two-of-four rule for when the order needs one home; the need comes before the product, so the OMS is described next, and The Choices open with the three candidates in one table and their boundary, then weigh the four homes, the built service joining them as the fourth; W2 is named after the trade-off table and the author's judgement, as the outcome of that comparison rather than its premise, and the stages place the homes by scale. The worked example shows the chosen design (W2) at work: its rollout, the replay of #1052877 straight after it, and then the requirements of each interaction (with an order like Eva's traced through it). The failures come last, opening from the repeated messages every design receives, because every design, the chosen one included, must expect them. Moving the scene later would put five sections of vocabulary before the problem; moving routing before the state machines would describe a split before the reader knows that the goods state belongs to each shipment; describing the OMS between the candidates table and the choices would interrupt the comparison; naming W2 inside the choices would argue the comparison from its outcome; putting the requirements between the rollout and the replay would separate the replay from the design it uses.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): In December 2026 a Kestrel & Pine customer ordered a fleece and socks, and the fleece shipped first. The warehouse knew which item had left, the payment provider knew what was paid, and support had to explain when the socks would arrive, while the shop's status page said 'Delivered': one status word for an order whose parts moved separately misled both the customer and the team.\n\n**Bridge:** Anyone who has received half an order has seen a status page that said more, or less, than the box held; the previous chapter has just marked Eva's order paid, and the opening's December 2026 order is the chapter's case. → The facts about one order are known by different systems, so the question is which one record brings them together, how it keeps them apart, and which system holds it.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and paragraph p02): An order needs one record that keeps money, goods per parcel and returns as separate status lines and computes the customer's status from all its parcels; the shop platform can hold it while one channel creates orders and one location fulfils them, and an order management system should hold it once two of four conditions hold, because it can route lines between locations and answer a parcel question.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start from the opening's order, Kestrel & Pine's Three-Status Order, #1052877. *Kept in:* scene.\n- Say what an order record holds and why its number is the key, then take its status apart into separate state machines and say how the status the customer sees is computed. *Kept in:* record, states.\n- Show how edits, holds and cancellations change those machines, and how routing decides which location ships which line and when to split. *Kept in:* changes, routing.\n- Ask when every channel's orders need one home, describe the OMS, then ask which system the home should be and compare four homes by trade-off and scale stage. *Kept in:* channels, oms, choices, trade-offs, stages.\n- Show Kestrel & Pine's chosen design at work, with #1052877 replayed through it and its requirements, and list the ways order integrations fail. *Kept in:* in-practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | When the fleece of a Kestrel & Pine order ships before the socks, the warehouse, the payment provider and support each know part of the story, and a single 'Delivered' status misleads the customer and the team. | scenario: Kestrel & Pine's December 2026 fleece-and-socks order (#1052877, named in p04), whose items left at different times, with each fact held by a different party. |  |\n| p02 | claim | The merchant needs one record that brings those facts together and keeps money, goods per parcel and returns apart; the shop platform can hold it while one channel and one location are involved, and an order management system (OMS) should hold it once two of four named conditions hold, because it can route lines between locations and answer a parcel question. |  | `problem_solution`: The facts about one order held apart by the warehouse, the payment provider and support. → The record that brings them together and the system that should hold it: the chapter's claim. |\n| p03 | context | In Eva's order the payment provider's message has just marked #1072455 paid; in April 2027 the shop platform is still its home, because the OMS takes storefront orders only from 13 October 2027. |  | `time`: The order marked paid by the payment provider's confirmed message, with the money's status kept in the order's own payment vocabulary (previous chapter). → The rest of the order's life after 'paid': goods and returns, and the systems that hold copies of the order. |\n| p04 | transition | The chapter follows the order from 'paid' onward through an older case, the opening's #1052877, Kestrel & Pine's Three-Status Order; from it the chapter describes the order record and its number, its separate state machines, changes to a placed order, routing and splits, when every channel's orders need one home, the OMS as a product, which system the home should be, four homes by trade-off and stage, the chosen design at work with #1052877 replayed and its requirements, and the ways order integrations fail; its evidence is the Kestrel & Pine case and platform and OMS vendors' documentation. |  | `contrast`: Eva's order from 'paid' onward. → The opening's order, #1052877, as the chapter's case, then the order of the chapter and its evidence. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: Order #1052877\n\n**Controlling idea** (`example`, id `scene`): Order #1052877 showed three honest statuses in three systems because a partial shipment was collapsed into 'fulfilled' and the invoice waited for 'order complete', and nobody owned the combined view.\n\n**Advances the thesis** (S2, S5): Shows one status word overwritten by the latest message and no system holding the whole order, the two faults the thesis answers.\n\n**Transition in:** `example`: The roadmap's first promise: the Three-Status Order. → The order, its two items and what each system did.\n\n**Order of paragraphs** (`chronological`): The order, then what each system did as the days passed, then the tickets and the January review, then the decision; the decision makes sense only after the reader has seen that nobody owned the combined view.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description | Order #1052877, a €119 fleece and €18 socks, left Duiven in two parts: the fleece on 7 December, while the WMS kept the socks open as a second pick waiting for replenishment. | scenario: Order #1052877, €137, fleece shipped 7 December 2026, socks short in their pick location. |  |\n| p06 | cause_effect | The agency's shipment-confirmation integration could not represent a partial shipment, so the first parcel marked the whole shop platform order fulfilled and its delivery on 8 December triggered 'Delivered': one confirmation, sent once and trusted (the Message in a Bottle). |  | `cause_effect`: The fleece shipped and the socks still open. → What the integration did with the first shipment confirmation. |\n| p07 | evidence | Meanwhile the ERP waited for an 'order complete' message and showed 'Not invoiced', and the WMS showed 'In picking': each system exposed a different part of the situation. | table: Each system, what it held, its status and what the status was true of: the shop platform 'Delivered' (the first parcel), the WMS 'In picking' (the second pick), the ERP 'Not invoiced' (the invoice run), the customer 'Where are my socks?' (the order).; figure: Figure 1: the customer's box without socks among three screens. | `time`: The shop platform's 'Delivered'. → What the ERP and the WMS showed at the same time. |\n| p08 | cause_effect | Eleven tickets followed before the socks shipped on 14 December, the case the company calls the Three-Status Order (an instance of Schrödinger's Order), and the January review found no owner for the combined view: the shop platform, the WMS and the ERP each held one part, and other orders began in still other systems. |  | `cause_effect`: Three statuses about three objects. → What it cost (eleven tickets) and the review's finding that nobody owned the order. |\n| p09 | context | Noor and Mara answered with Waypoint decision W2: choose one home for every order and specify what it must explain. |  | `problem_solution`: No owner for the combined view. → The decision that gives the order one home. |\n\n### What an Order Record Holds\n\n**Controlling idea** (`definition`, id `record`): An order record has six parts that downstream systems read, is distinct from a cart, a shipment and an invoice, and carries one number from one family that every other system uses as the key for creating it.\n\n**Advances the thesis** (S1): Defines the record the thesis says needs one home, and the number that keeps its copies one order.\n\n**Transition in:** `elaboration`: W2's 'one home for every order'. → What that home holds: the order record, part by part.\n\n**Order of paragraphs** (`large_to_small`): The whole record first, then the three things it is not, then the one field every system shares; the identity rules need the reader to know what is being identified.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition | Stripped to what every downstream system needs, an order record has six parts: header, lines, money, promises, goods and references. | table: The six parts, what each holds and who reads it most. |  |\n| p11 | definition | A cart is not an order, an order is not a shipment and an order is not an invoice. |  | `contrast`: The six parts of the record. → Three neighbouring things it is often mistaken for. |\n| p12 | explanation | The order number is shared by every system, the customer and the carrier label, so it comes from one family for every channel and is the idempotency key for creating the order anywhere else. |  | `elaboration`: An order that may become several shipments and invoices. → The one identifier that ties them together, and its two rules. |\n\n### Several State Machines on One Record\n\n**Controlling idea** (`explanation`, id `states`): An order carries separate state machines for its lifecycle, money, goods per shipment and returns, as the platforms' own documentation shows, and the status the customer sees is a summary computed from them under two rules.\n\n**Advances the thesis** (S2): Shows the separate status lines in two vendors' models and gives the rule that makes a two-parcel order read 'partially delivered'.\n\n**Transition in:** `elaboration`: The record's money, goods and references parts. → The states those parts move through, and that there are several.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The term and the claim, then Shopify's and commercetools' models as evidence, then the summary rules that follow from them; the rules mean nothing before the reader knows the goods state lives on each shipment.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | definition | A state machine is a fixed set of states and allowed moves; the Three-Status Order came from assuming an order has one, when it has at least three, the status lines named in Part I. |  |  |\n| p14 | evidence | Shopify keeps three status families on one order: order, payment and fulfillment. | source: Order status Open, Archived or Canceled; eight payment statuses including Voided; six fulfillment statuses including Partially fulfilled. | `example`: The claim that an order has several machines. → The first platform's own model. |\n| p15 | evidence | Below the order, each fulfillment order, the instruction to one location to ship a group of lines, has statuses of its own and a request status for the handshake with the warehouse. | source: Seven fulfillment-order statuses plus a request status. | `place`: Shopify's statuses on the order. → The statuses one level below, on each fulfillment order. |\n| p16 | evidence | commercetools, a second platform, separates order, shipment and payment states as well, with return states and an optional custom state machine, so the two vendors agree on four machines that live in different places and are moved by different systems. | source: OrderState, ShipmentState with Partial and Backorder, PaymentState, custom states with unvalidated transitions when an external system runs the workflow, return item states.; table: Four machines (order lifecycle, money, goods, return), their typical states, where each lives and who moves it.; figure: Figure 2: the goods state machine on each fulfillment order. | `similarity`: Shopify's order-level and fulfillment-order statuses. → A second vendor's model, and the four machines both share. |\n| p17 | analysis | The words a customer sees are summaries computed from the machines below, and two rules keep them honest: 'fulfilled' is not 'delivered' unless carrier events are fed back, and a split order's summary is the state of its least-advanced shipment. | case: With the second rule, #1052877 would have read 'Partially delivered: 1 of 2 parcels', with the second parcel still in preparation.; table: What 'Delivered' on the order says, and what it does not say. | `cause_effect`: Machines that live on the order and on each shipment. → How the one word the customer sees is computed from them. |\n\n### Changing a Placed Order\n\n**Controlling idea** (`process`, id `changes`): Edits, holds and cancellations are moves against the money, goods and stock commitments, governed by the goods state: edits close when the warehouse accepts the work, and a cancellation after shipment becomes a return.\n\n**Advances the thesis** (S3): Shows that changing an order is a move of its state machines, and that the order's home coordinates the compensating steps.\n\n**Transition in:** `cause_effect`: Separate machines, with the goods state on each shipment. → What happens to them when a placed order is changed.\n\n**Order of paragraphs** (`grouping`): The general claim, then the three kinds of change in order of how far they reach: an edit changes work, a hold pauses it, a cancellation undoes it, and the last one defines compensation where it first needs it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | claim | Orders are edited, held or canceled more often than newcomers expect, and each change is a transaction against the money, goods and stock commitments, not a form update. |  |  |\n| p19 | process | An edit changes work other systems may have accepted, so it is checked against the goods state and the amount paid, allowed only on unfulfilled lines, turned into a request once the warehouse has accepted the work, and sent to every system that holds a copy. | source: Shopify's calculated order, committed edit and unfulfilled-lines-only rule. | `sequence`: Changes as transactions. → The first kind: edits. |\n| p20 | definition | A hold stops fulfillment without canceling, and the stock stays committed while it waits. | source: Shopify: an order on hold keeps its inventory reserved. | `sequence`: Edits. → The second kind: holds. |\n| p21 | process | A cancellation before acceptance releases stock and voids or refunds the payment, but after shipment it becomes a return, a compensation that whichever system is the order's home coordinates. | source: The saga pattern's compensation vocabulary. | `sequence`: Holds. → The third kind: cancellations, before and after shipment. |\n\n### Routing, Sourcing and Splits\n\n**Controlling idea** (`explanation`, id `routing`): With more than one location, sourcing, routing and splitting become decisions over stock, capacity, cut-off times and cost that the platforms' simple rules do not make, and a split must be told to the customer.\n\n**Advances the thesis** (S4): Shows the decision a single-location merchant never makes and that the platforms do not hold, one of the reasons an OMS becomes the home.\n\n**Transition in:** `elaboration`: The fulfillment order and the goods state per shipment. → How an order becomes more than one fulfillment order when it can ship from several locations.\n\n**Order of paragraphs** (`problem_solution`): The terms, then what the platforms decide and leave out, then what OMS vendors add, then the business trade-off in a split and its special case, the backorder; the vendors' fuller decision is read against the platforms' gaps.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | definition | Once an order can be fulfilled from more than one location, three decisions appear: sourcing chooses the location for each line, routing is the rule set that makes the choice, and a split shipment is one order in several parcels. |  |  |\n| p23 | evidence | Platforms route by simple rules over stock and geography, and do not know about capacity, cut-off times, carrier cost, marketplace fees or a maximum number of parcels. | source: Adobe Commerce source priority and distance priority; Shopify's assigned location, changeable only while the fulfillment order is open, scheduled or on hold. | `example`: Routing as a rule set. → The rules the platforms ship, and what they leave out. |\n| p24 | evidence | OMS vendors describe the fuller decision: candidates and suggestions with reasons, child shipments for what is not in stock, splits that maximise items and minimise shipments under cost caps, and assignment to the location that keeps the promise most profitably. | quotation: Kibo's candidates, suggestions and child shipments; Fluent's split logic and caps; Manhattan's 'most profitably'.; figure: Figure 3: routing turns one order into one or more fulfillment orders from stock per location, capacity, cut-off times and cost. | `contrast`: What the platforms' rules do not know. → What OMS vendors say the decision should take into account. |\n| p25 | analysis | A split is a cost decision whose inputs are the carrier rates, the promise and the customer's channel, and whichever system makes it must also tell the customer 'two parcels'. | case: The fleece now and the socks later against one late parcel; the message nobody at Kestrel & Pine could send in December 2026. | `cause_effect`: The vendors' inputs to the split decision. → The business trade-off inside one split and the message it requires. |\n| p26 | definition | A backorder is a split in time rather than space and needs the same honesty: a date from incoming stock and a message. |  | `similarity`: A split and the message it needs. → The same decision across time: the backorder. |\n\n### Many Channels, One Record\n\n**Controlling idea** (`claim`, id `channels`): When orders begin in several systems, each with its own connectors and vocabulary, the joins between them become the problem, and the order needs one record of its own once two of four conditions hold.\n\n**Advances the thesis** (S5): Gives the two-of-four rule for when the order needs one record of its own, before the product that can hold it and the candidates for it.\n\n**Transition in:** `additional_support`: Several locations and the routing decision the platforms do not make. → Several channels creating orders, the other half of the joins problem.\n\n**Order of paragraphs** (`problem_solution`): The Spaghetti Junction first, then the rule for when it needs one record of its own; the need comes before the product (the OMS section) and before the candidates (The Choices), so that the reader knows why a home is needed before meeting what could be one.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | example | Several channels creating orders are the other half of the joins problem: Kestrel & Pine's orders begin in four systems, each with its own connector to the warehouse, its own path to the books and its own status vocabulary, the Spaghetti Junction that adding one channel at a time produces. | scenario: Storefront and B2B portal orders in the shop platform, marketplace orders through the connector, EDI and 38% hand-keyed wholesale orders in the ERP, store sales as POS receipts. |  |\n| p33 | recommendation | The junction needs one record of its own once at least two of four conditions hold (several locations, several channels, promises that depend on location, service that cannot see one order), because one can be handled by the platform plus a connector and two make the joins between systems the problem; Kestrel & Pine has had all four since 2023. | figure: Figure 4: four condition cards, two ticked, leading to the order hub. | `cause_effect`: The Spaghetti Junction of four order sources. → The rule for when that junction needs one record of its own. |\n\n### The OMS as a Product\n\n**Controlling idea** (`description`, id `oms`): An OMS takes every channel's orders, routes them, tracks them and gives service one view, and owns the operational order while leaving checkout and the books alone.\n\n**Advances the thesis** (S5): Describes the system the thesis names as the home and its boundary with the platform and the ERP, after the rule that says when a home is needed and before the candidates are compared.\n\n**Transition in:** `problem_solution`: The junction's need for one record of its own, and the fuller routing decision OMS vendors describe. → The product those vendors sell for that record: what an OMS does, component by component.\n\n**Order of paragraphs** (`large_to_small`): The product as vendors describe it, then its components and their boundaries; it follows the two-of-four rule because the rule says when one record is needed, and it comes before The Choices so that the OMS is known when it is named as the third candidate.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | definition | An OMS takes orders from every channel, decides which location fulfils each line, tracks each order through delivery and returns, and gives service one view; orchestration is its job of sequencing those steps, and the vendors describe the same shape. | quotation: Manhattan's capability list, Kibo's 'distributed order orchestration', IBM Sterling's ship from store and call-center add-on. |  |\n| p31 | description | What the OMS owns, and what it leaves alone, is the point: it is the system of record for the operational order, the sourcing decision and the order's state, and not for checkout, picking, refund execution or invoices. | table: Six components (intake, availability, routing, orchestration, service view and edits, events out) with responsibility, what each is the system of record for and what not. | `elaboration`: The OMS's jobs as vendors list them. → Which of those it owns and which it leaves to other systems. |\n\n### The Choices\n\n**Controlling idea** (`comparison`, id `choices`): One order hub has three candidates among the systems a merchant runs or can buy, the platform, the ERP and an OMS, each holding a different truth about the order; with a built service as the fourth, the order can live in four homes, and each fits a different merchant.\n\n**Advances the thesis** (S5): Sets the three candidates and the four homes side by side; W2 is named only after the trade-offs.\n\n**Transition in:** `problem_solution`: The junction's need for one record and the OMS just described. → One hub, its three candidates and the four homes one by one.\n\n**Order of paragraphs** (`comparison`): The three candidates first, in one table, with the boundary between the truths they hold, so the candidates are described in one place; then the four homes from the least to the most new software: the platform's own record, the ERP as hub, a bought OMS, a built service, each described by what it covers, where it fits and what it costs. Kestrel & Pine's choice is not named here, so the comparison is not argued from its outcome.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | comparison | The alternative to the Spaghetti Junction is one order hub with one state model and one number family, and the real question is which of three candidates it should be (the platform, the ERP or the OMS just described), with building one's own as a fourth home weighed below. | table: The platform, the ERP and an OMS: what each is good at, what it lacks, and at which stage it is common. | `problem_solution`: The junction, the point at which it needs one record, and the OMS just described. → One hub, and three candidates for it, with a fourth announced. |\n| p29 | analysis | The three records are three truths about the same order, so the decision is which system owns which truth and how the others are told. | quotation: Fluent Commerce: 'your ERP stays the system of record' for finance. | `elaboration`: The three candidates and their strengths. → That they are not rivals but owners of different truths. |\n| p34 | description | The platform's order can be the record, with apps and a WMS or 3PL connector around it; Shopify's features cover this well, and the absence of documented rule-based sourcing on cost, capacity or cut-off is its limit. |  | `sequence`: The three candidates and the truth each owns. → The four homes one by one, starting with the platform's own record. |\n| p35 | description | The ERP can be the order hub where wholesale dominates and the ERP partner is strong, at the cost of speed, a customer-facing state it cannot show and a hub owned by the finance system's vendor. |  | `sequence`: The platform as the record. → The second option: the ERP. |\n| p36 | description | A bought OMS as the hub holds every channel's order and routes, orchestrates and serves, while the platform keeps checkout and the ERP keeps finance, priced as a third core system, its subscription and implementation (illustrated at Kestrel & Pine's size), and the work of re-pointing every order source and the warehouse. | statistic: Illustratively €4,500 a month including the availability module, about €320,000 one-time implementation. | `sequence`: The ERP as hub. → The third option, a bought OMS. |\n| p37 | description | A built order service, the fourth option announced in the channels section, is right for a vendor whose product is commerce or a group with unusual rules, and wrong for a 14-person technology team, because the order record is where custom code is most expensive to get wrong. |  | `sequence`: A bought OMS. → The fourth option: building one. |\n\n### Trade-offs\n\n**Controlling idea** (`recommendation`, id `trade-offs`): Set side by side in a table, the four options differ on channels, state model, routing, service view, time, cost, exit and failure; the author would stay with the platform's order until two of the four conditions hold, then choose by who should answer a parcel question, and applied to Kestrel & Pine the rule gives W2.\n\n**Advances the thesis** (S5): Turns the comparison into the thesis's decision rule (the two-of-four count, then the parcel question) and names W2 as its outcome for Kestrel & Pine.\n\n**Transition in:** `elaboration`: The four options one by one. → The same four on shared criteria, then the author's judgement.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38a | comparison | Set side by side on the criteria of the earlier sections, plus time, cost and how each breaks, the four options compare in one table. | table: Four options against orders from every channel, state model, routing and splits, service view, time to value, running cost, exit cost and what breaks them. |  |\n| p38 | recommendation | The author would stay with the platform's order until two of the four conditions hold, then choose between the ERP and an OMS by asking who should answer a customer's parcel question, and build only when order management is the product; Kestrel & Pine meets all four conditions and wants parcel questions answered outside the finance system, so its choice is W2 (the OMS becomes the order hub, every channel's order is created there, the shop platform keeps the checkout and the storefront order history, the ERP keeps the financial record). |  | `cause_effect`: The comparison. → What the author would do. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): The record's shape is the same at every stage; what changes is how many systems create and fulfil orders, and the order needs a hub once two of the four conditions hold.\n\n**Advances the thesis** (S5): Places the home decision on the scale stages and ties the change to the number of order sources and locations, not to revenue.\n\n**Transition in:** `elaboration`: The four options and when the author would move. → What is typical and necessary at each scale stage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39a | comparison | The same choice looks different at each of the four scale stages: what is typical, what becomes necessary and the warning signs. | table: Four stages (Starting 2016-2018, Growing 2019-2022, Omnichannel 2023-, Group) with what is typical, what becomes necessary and the warning signs. |  |\n| p39 | synthesis | An order has the same parts at every stage; what changes is how many systems create orders and how many fulfil them, and once two of the four conditions hold the order needs a hub. |  | `conclusion_summary`: The stage table. → What stays the same across stages and what changes. |\n\n### In Practice\n\n**Controlling idea** (`example`, id `in-practice`): Kestrel & Pine's W2 rollout and the replay of #1052877 show a two-parcel order with an honest summary and an invoice per shipment, which improves the explanation but not the stock, and each interaction with the OMS has its own requirements.\n\n**Advances the thesis** (S1, S2, S5): Shows the number family, the per-shipment state and the chosen home working on the opening case.\n\n**Transition in:** `example`: The Omnichannel stage and its hub. → Kestrel & Pine's rollout of the hub and the opening order replayed through it.\n\n**Order of paragraphs** (`chronological`): The rollout dates, then the replay of #1052877 day by day straight after them, then what it changes for support and what it does not, and last the requirements of each interaction with the rolled-out OMS (with an order like Eva's traced through it in Figure 5); the replay follows the rollout because it uses the design the rollout delivers, and the requirements close the section as the targets that keep the replayed behaviour true.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | description | W2 is implemented through 2027 seam by seam, from shadow copy in August to the retirement of the old order paths in January 2028, after which every order is created in the OMS by an event keyed on its order number from one family. | scenario: Shadow copy in August; parallel run 1-14 September (about 1.4% differences, illustrative); marketplace orders 15 September; storefront 13 October; Black Friday freeze; EDI and manual wholesale 8 December; old paths retired January 2028. |  |\n| p42 | example | Replayed through W2 as rolled out, #1052877 waits one working day under an illustrative routing rule, then splits into two fulfillment orders and tells the status page and notifications 'ships in two parcels'. | scenario: Illustrative rule: a consumer order under €150 may wait one working day for replenishment before splitting. | `example`: W2 rolled out source by source, every order created in the OMS. → The opening order replayed through it. |\n| p43 | example | Each parcel would move its own fulfillment order, the summary would read 'Partially delivered: 1 of 2 parcels', and each dispatch would trigger its own invoice keyed on the shipment id. | scenario: Fulfillment order 1052877-1; invoices on 7 and 14 December, both carrying the order number. | `time`: The split into two fulfillment orders. → What each parcel's dispatch and delivery change. |\n| p44 | analysis | Support can now see both parcels, but the customer still waits for the socks: the design improves the explanation, not the stock. |  | `contrast`: The honest summary and the invoices. → What the design does not fix. |\n| p32 | description | Behind that replay, each interaction with the OMS has its own freshness, consistency, speed and fallback: only order creation and edits must be exact and immediate, and the invoice trigger per shipment may run in a daily batch if it is idempotent; the figures are the author's illustrative targets, and Figure 5 shows how an order like Eva's would run once storefront orders pass through the OMS. | table: Five interactions (order creation, fulfillment order to the WMS, status back, edit or cancellation, invoice trigger) with freshness, consistency, speed and what happens if the OMS is down; assumptions labelled.; figure: Figure 5: Eva's order under Waypoint, from checkout to the status per parcel published to the storefront and the ERP. | `elaboration`: The replay and what it changes for support. → What each interaction with the OMS must achieve for that behaviour to hold, and an order like Eva's traced through it. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `wrong`): Order integrations fail in eight recurring ways, and most are recovered by an identity on every message, a state machine that refuses impossible moves and a daily comparison: a hub gives each join one key, one owner and one check.\n\n**Advances the thesis** (S6): Shows that the hub leaves the joins in place and says what each one needs.\n\n**Transition in:** `contrast`: The design working on the opening case. → That the same design still receives repeated, lost and reordered messages, and the ways order integrations fail.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Why failures are normal (repeated messages), with the table of eight failures attached to that paragraph, then what their recoveries share; the shared recovery is only visible after the rows.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | evidence | Even under the chosen design, order updates are messages, and repeating one must not repeat the order or shipment it describes, so the record must recognise a retry even when all systems work; the duplicate is one of eight ways order integrations fail. | statistic: Shopify's 13 billion webhooks for 2021 (2022-01-20), flagged as historical; Shopify warns an app may receive a webhook more than once.; table: Eight failures (duplicate order, lost confirmation, collapsed status, out-of-order events, edit after acceptance, cancel after shipment, routing nobody owns, stuck invoice trigger) with appearance, detection and recovery. |  |\n| p45 | synthesis | Most failures end with the same recovery: an identity on every message, a state machine that refuses impossible moves and a daily comparison between the copies, so a hub gives each join one key, one owner and one check rather than removing it. | reasoning: The recovery column of the failure table read across its rows. | `conclusion_summary`: The eight failures in the table. → What their recoveries have in common, and what a hub does to the joins. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The opening's fleece-and-socks order, the separate state machines, the split and the hub question are one answer: each fact about an order is first known by a different witness (the payment provider, the warehouse per parcel, the carrier, the returns portal), so only one record that keeps each witness's line apart and is the one place every channel's order is created can say 'two parcels, one delivered'; which system holds it follows from who must answer that parcel question.\n\n**So what:** A merchant can count its order sources and fulfilling locations against the four conditions, and write down the order's home, its number family and its per-shipment status, before any OMS is bought; Kestrel & Pine's remedy was that decision first and the purchase second.\n\n**Callback:** The opening's order, #1052877, whose fleece shipped before the socks while the status page said 'Delivered'. The first paragraph of the conclusion says what that order should read, who says it and which system holds it.\n\n**Takeaway** (`course_of_action`): Count the order sources and fulfilling locations against the four conditions, name the order's home and its number family, hold the goods state per shipment, and take the nine questions to your own company.\n\n**Hand-off** to [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html): `cause_effect`: The order with one home, one number and its goods status per shipment, accepted by the warehouse. → The tax it carries, the invoice each shipment produces and the entries those documents post in the books.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | synthesis | The opening's order, #1052877, whose fleece shipped before the socks, should have read 'Partially delivered: 1 of 2 parcels' with 'two parcels' told to the customer, and only a record that keeps money, each parcel and returns apart, and is the one place every channel's order is created, can say that; the system that holds it is the one that must answer the customer's parcel question. | reasoning: The opening's fleece-and-socks order set against the chapter's answer. |  |\n| p47 | synthesis (list) | Established: an order carries several state machines, the fulfillment order is the documented contract with the warehouse, and order management vendors converge on one boundary between the OMS, the ERP and the warehouse. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what documentation establishes. |\n| p48 | synthesis (list) | Depends on context: the platform's order suffices until two of the four conditions hold; the ERP or an OMS as hub depends on who asks about parcels; invoice per shipment wherever orders split; and a split rule needs an owner and a cap. |  | `contrast`: What is established. → What changes with the merchant's situation. |\n| p49 | recommendation (list) | The author's synthesis: choose the order's home by who answers the customer's parcel question, buy the OMS and keep checkout on the platform and the books in the ERP. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p50 | recommendation (list) | Nine questions let the reader find, in their own company, the order's home, its number family, its state machines, the split message, the edit window, the routing owner, the invoice trigger, the daily reconciliation and the fallback when the hub is down. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own company. |\n| p51 | transition | Because under W2 an order like #1052877 would have one home, one number, its goods status per shipment and a warehouse that has accepted the work, each shipment can produce its own invoice, and the next chapter follows the tax it carries, those invoices and the entries they post in the books. |  | `conclusion_summary`: The questions about the reader's own order flow. → The opening's order as this chapter leaves it, and what the next chapter does with it. |\n\n#             const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
