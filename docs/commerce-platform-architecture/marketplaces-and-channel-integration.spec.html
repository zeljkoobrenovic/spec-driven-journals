<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/20-marketplaces-and-channel-integration/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (a roadmap paragraph and a conclusion paragraph that answers the opening); these are listed under decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** What a marketplace offer, the buy box and commission are, and the two fulfillment models (seller-fulfilled and marketplace-fulfilled) with what each means for the order record and for stock.\n- **Know:** The metrics marketplaces grade sellers on (order defect, cancellation, late shipment, valid tracking, on-time delivery; bol's strikes) and the five flows through a channel connector (listings, stock, prices, orders, status back-flow) with the freshness each needs.\n- **Know:** The channel allocation policies (shared pool, fixed quantity, buffer, percentage split, computed available-to-promise per channel) and the four ways to connect (seller tools, the platform's channel app, a channel integration platform, direct integration).\n- **Believe:** The channel connector translates and owns nothing: not the product content, not the stock figure, not the order.\n- **Believe:** The stock number sent to a marketplace is a promise it will sell without asking again, and the marketplace's scorecard is a service level on the merchant's own integrations.\n- **Believe:** A marketplace's or connector's API deprecation schedule is a contract clause with a date that someone at the merchant must own.\n- **Be able to:** For their own marketplace channels, say which system computes the number each marketplace is told, where marketplace orders are created and under which key, which monitor would show stale stock, and who owns each API retirement date.\n- **Be able to:** Choose among the four ways to connect to marketplaces by scale stage and the number of order sources.\n\n**Audience:** Readers new to commerce architecture who have joined a merchant that sells on marketplaces or a vendor that connects to them; most of all the engineer or integration lead who inherits a channel connector and must decide what it may hold (Noor Visser at Kestrel & Pine). The ecommerce manager who owns the seller accounts (Milan Petrov) is the second reader, because the chapter turns the scorecard into integration requirements.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its 2026 and early 2027 incidents in outline and the names of the sixteen failure patterns.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines (money, goods, returns), 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, business models and the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Parts II and III: product, variant, SKU and GTIN with one owner per attribute; prices selected once at order placement and frozen; available-to-promise (on hand minus committed minus allocations) with one writer each for on hand and committed and per-channel buffers; checkout creating the order once; one order record with three status lines and an OMS once two of four conditions hold; invoices, credit notes and the monthly match.\n- From Part IV: the warehouse system as the only writer of on-hand stock, accepting or rejecting keyed fulfillment instructions; a normalizing carrier layer and a computed delivery promise; stores as order source and stock location; returns as request plus disposition with one refund writer; notifications and service screens as read models over one order record.\n- From the Part V introduction: orders that arrive from outside the shop, through an intermediary, from a party that scores or charges back; the two Amazon.de orders of 13 April 2027.\n\n**Does not yet know:**\n\n- Marketplace vocabulary: offer, buy box, commission, seller-fulfilled and marketplace-fulfilled, strike, order defect rate.\n- Channel integration platform, the five flows, channel allocation and its policies, external location.\n- Rate limit, feed, notification, restricted data, deprecation and API lifecycle.\n- Price parity, repricing, channel price and floor, shopping feed, retail media.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a peak-evening oversell and a stale feed after an API retirement, the reader names the scorecard cost and the prevention for each, not a faster connector. *Probe:* A brand sends each marketplace the platform's stock figure through a channel connector every hour. On a peak evening its warehouse sells out of a jacket and the marketplaces keep selling it for two hours; months later a script still calling a retired connector API version leaves one marketplace selling from two-day-old figures. Using only this chapter: what does each failure cost on the marketplace's scorecard, and what would have prevented each? | `custom` | cold_reader | major |\n| AC-2 | Given one seller-fulfilled and one marketplace-fulfilled order, the reader says where each is recorded, which metrics apply, and where the second order's stock figure comes from. *Probe:* On the same day one Amazon.de order for a jacket ships from the merchant's own warehouse, and another ships from stock the merchant sent to Amazon's warehouse in advance. Using only this chapter: where should each order be recorded, which scorecard metrics apply to each, and where does the stock figure for the second come from? | `custom` | cold_reader | major |\n| AC-3 | The reader can say what stops one marketplace order from becoming two shipments. *Probe:* Using only this chapter: a marketplace order is delivered once by a notification and again by a periodic poll. What keeps it from becoming two orders and two parcels? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What does it take to list, sell and fulfil on marketplaces, and how do marketplace orders fit into the order record?\n\n> **Claim:** To sell on a marketplace a merchant sends listings, a stock number, prices and shipment confirmations that the marketplace acts on and grades against published thresholds. A connector translates them and owns nothing: each marketplace's stock number comes from one available-to-promise calculation per channel, marketplace-held stock is an external location, and every marketplace order, seller- or marketplace-fulfilled, is created once in the merchant's order record under the marketplace's order id.\n\n**Disputed by:** The view that marketplace selling is the job of a channel app or connector: it holds the listings, its own stock copy and allocation rules, and the marketplace orders; the platform's stock figure is sent to every channel; and the marketplace's scorecard is the ecommerce manager's concern rather than a requirement on the integrations.\n\n**So what:** On 27 November 2026 the stock chain from the WMS through the ERP and the platform to the connector let the marketplaces sell sold-out Ridgewalker jackets for up to two hours: about 160 of the 1,120 canceled or delayed orders were marketplace orders, 140 of them seller cancellations, and bol issued a strike. In February 2027 an agency script still calling a retired connector API version left bol selling from two-day-old figures. A merchant that accepts the claim names the system that computes each channel's stock number, creates marketplace orders in its order record, monitors the age of the last accepted stock update per channel and gives each API retirement date an owner before it adds a marketplace.\n\n**How and why:** A marketplace sells the quantity it was last sent without asking again, and counts every oversold unit the merchant cancels as a seller cancellation and every confirmation that arrives late as a late shipment, so latency in the merchant's flows becomes a score. A connector that holds its own stock copy and rules, or the only copy of marketplace orders, becomes another system of record: its copy lags, its failures are silent, and its orders are invisible to support, the warehouse and finance. Marketplace APIs are rate-limited and asynchronous and retire versions on published dates, so stock and orders must move by events, imports must be idempotent on the marketplace order id, and each date needs an owner. Stock in a marketplace's warehouse is counted and sold by the marketplace, so the merchant learns its quantity from the marketplace's feed.\n\n**Supporting claims**\n\n- **S1** — A marketplace grades the seller against published thresholds (cancellations, late shipment, valid tracking, on-time delivery, defects; bol's strikes) computed from what the merchant's integrations send, so each threshold is a freshness requirement on one of the merchant's flows.\n- **S2** — The channel connector translates the five flows (listings, stock, prices, orders, status back-flow) and owns nothing: listings come from the product system of record and prices from the pricing source, bounded by a floor; a connector that keeps its own copies becomes another system of record.\n- **S3** — The stock number sent to a marketplace is a promise it sells without asking again, so it comes from one available-to-promise calculation per channel, with a buffer only as the interim fix, and marketplace-held stock is an external location whose quantity the merchant learns from the marketplace's feed.\n- **S4** — Every marketplace order, seller- or marketplace-fulfilled, is created once in the merchant's order record under the marketplace's order id: imported idempotently, acknowledged with the binding between the two numbers, and confirmed back with tracking before the marketplace's deadline.\n- **S5** — Marketplace and connector APIs are rate-limited and asynchronous and retire versions on published dates, so stock and orders move by events, every feed result is read, and each retirement date and the age of the last accepted update have an owner and a monitor.\n- **S6** — The way to connect (seller tools, the platform's channel app, a channel integration platform, direct integration) follows the scale stage and the number of order sources, and a rented connector is safe only when the merchant's order record and availability calculation stay the owners.\n\n## Role in the part\n\nGives the part its first outside party and intermediary: the marketplace's scorecard as freshness requirements on the merchant's flows, the connector that translates and owns nothing, one available-to-promise figure per channel, the API retirement calendar as an owned contract, and marketplace orders created in the order record under the marketplace's id. Supports P5-1, P5-2, P5-3, P5-4 of part `part-5`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene, then the rest: the two incidents and Noor's three questions, then the sections that answer them; `comparison` in choices and stages)\n\nThe two incidents come first so that every later term arrives as part of the answer to Noor's three questions. The marketplace and its two fulfillment models come next because the scorecard, the flows and the allocation rules all differ by model. The scorecard precedes the connector's flows because each flow's freshness requirement is derived from a metric; the flows, order import and API constraints precede channel allocation because allocation is the stock flow's policy and relies on events and external locations; the two Amazon.de orders follow allocation directly, since they use it and not prices (both round-3 readers); prices follow the example as their own section because they apply the same rule to a different value (both round-2 readers found them hidden under a stock heading). The two Amazon.de orders are worked there, while the two models, the flows and the external location are fresh, and before the choices, which they help judge (readers in round 1 found the promise of the two orders carried too long when the example sat at the end of In Practice). The choices come after the mechanisms they choose between, the stages after the choices because they say which choice fits when, and In Practice after both because its developments test the rules already stated. The failures come last because the table reads each against the rule that prevents it, all of which are stated by then. Moving allocation before the scorecard would present buffers without the cancellation threshold that justifies them; moving the choices first would compare options before the reader knows what the connector must not own.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): Listing a jacket on Amazon, bol or Zalando puts it in front of shoppers who never visit the merchant's own site, but the merchant pays a commission and must follow rules for prices, fulfillment and service that its own storefront does not control, and the marketplace grades it on every cancellation and late shipment.\n\n**Bridge:** Anyone who has bought from a marketplace has seen several sellers offer the same product and one of them win the 'add to basket' button. → For the seller that position depends on cancellations, late dispatch and tracking, which are computed from the data its integrations send, so the question becomes which system sends each value and where the marketplace's orders are recorded.\n\n**Thesis statement** (KEY POINTS callout and paragraph p03): A channel connector translates listings, stock, prices, orders and status between the merchant's systems and the marketplaces and owns none of them: each value it sends comes from the system that owns it, each marketplace's stock number from one available-to-promise calculation per channel, marketplace-held stock is a location the merchant does not control, and every marketplace order is created once in the merchant's order record under the marketplace's order id.\n\n**Roadmap** (Paragraph p05):\n\n- Start from Kestrel & Pine's two marketplace incidents and Noor Visser's three questions. *Kept in:* scene.\n- Explain what a marketplace is and the two ways to sell on one. *Kept in:* marketplace.\n- Show what the marketplace measures the seller on. *Kept in:* scorecard.\n- Follow the connector's five flows, the import of an order and what the marketplace APIs impose, including their retirement dates. *Kept in:* connector.\n- Decide how much stock each channel is told and how marketplace-held stock is treated. *Kept in:* allocation.\n- Work the two Amazon.de orders of 13 April 2027 through Kestrel & Pine's systems, then say how prices are bounded. *Kept in:* example, prices.\n- Compare the four ways to connect and how they change with scale. *Kept in:* choices, stages.\n- Look at current practice and at what goes wrong. *Kept in:* in-practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Listing a jacket on a marketplace buys reach to shoppers who never visit the merchant's site, in exchange for a commission and the marketplace's rules for prices, fulfillment and service, which the merchant's own storefront does not control. | example: Listing a jacket on Amazon, bol or Zalando; the commission as a share of the sale. |  |\n| p02 | cause_effect | The marketplace grades the seller's cancellations, late dispatch and tracking, and those measures depend on the data the merchant's integrations send, so an old stock figure can become a canceled order and a late message a late shipment. |  | `elaboration`: The marketplace's rules. → The grading of performance and its dependence on the merchant's data. |\n| p03 | claim | The chapter's answer is that a channel connector translates listings, stock, prices, orders and status between the merchant's systems and the marketplaces and owns none of them: each value comes from the system that owns it, the stock number from one available-to-promise calculation per channel, marketplace-held stock is a location the merchant does not control, and every marketplace order is created once in the order record under the marketplace's order id. |  | `problem_solution`: The data the integrations send decides the score. → The connector and what it may own, which is the thesis. |\n| p04 | context | In the book's running example Eva buys from the storefront on 13 April 2027 while two illustrative Amazon.de orders on the same day take the two marketplace routes, one shipped from Duiven and one from stock the marketplace holds, and both must reach the merchant's records. | scenario: Two Amazon.de orders of 13 April 2027, seller-fulfilled from Duiven and marketplace-fulfilled. | `example`: Marketplace orders created in the order record; marketplace-held stock. → The two Amazon.de orders that show both routes. |\n| p05 | transition | The chapter starts from Kestrel & Pine's two marketplace incidents, then explains the marketplace and its two fulfillment models, the scorecard, the connector's five flows with order import and API limits, channel allocation, works the two Amazon.de orders through, channel prices, compares the four ways to connect and how they change with scale, and ends with current practice and what goes wrong. |  | `sequence`: The thesis and the two Amazon.de orders. → The order of the sections. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: Two Days of Stale Stock\n\n**Controlling idea** (`example`, id `scene`): Kestrel & Pine's marketplace line runs through a rented connector fed by an hourly stock chain, and two incidents, the Black Friday Oversell and the Deprecated Endpoint, lead Noor Visser to ask which stock number each marketplace should be told, where a marketplace order lives and who owns a vendor's API calendar.\n\n**Advances the thesis** (S1, S3, S4, S5): Gives the case the chapter answers: a copied stock figure that became seller cancellations and a strike, a retired API version that left bol selling from old figures, and the three questions the thesis answers.\n\n**Transition in:** `example`: The roadmap's first item, Kestrel & Pine's two marketplace incidents. → The marketplace line, its connector and the incidents.\n\n**Order of paragraphs** (`problem_solution`): The line and its owner first, then the two incidents in date order, then the questions they raise: the questions only make sense once the reader has seen what went wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | description | Kestrel & Pine sells on bol, Amazon.de and Zalando through a connector rented for €900 a month; in 2026 those channels brought 43,000 orders and €3.0 million at €70 an order, and marketplace programs shipped about 40% of its German marketplace units. | scenario: €900 a month; 43,000 orders; €3.0 million; €70 against €92 on the storefronts; about 40% of German marketplace units fulfilled by marketplace programs. |  |\n| p07 | transition | Milan Petrov owns the connector and in March 2027 walks Noor Visser through two incidents. |  | `sequence`: The connector. → Its owner and the two incidents. |\n| p08 | example | In the Black Friday Oversell the Ridgewalker sold out at Duiven at 19:40 on 27 November 2026, and because the stock figure passed from the WMS through the ERP and the platform to the connector, the marketplaces kept selling it for up to two hours. | case: Sold out at 19:40; chain WMS, ERP, platform, connector; up to two hours. Figure 1: a relay of stock notes reaching a marketplace still selling. | `sequence`: Two incidents. → The first. |\n| p09 | evidence | About 160 of the 1,120 canceled or delayed orders were marketplace orders, Kestrel & Pine canceled 140 of them as seller cancellations, and bol issued a strike for the week, part of the incident's €96,000 cost. | scenario: 160 of 1,120; 140 seller cancellations; one bol strike; €96,000 total cost (illustrative). | `cause_effect`: Marketplaces selling stock that was gone. → The cancellations and the strike. |\n| p10 | example | In the Deprecated Endpoint of February 2027 the connector retired an API version on a date it had published months earlier, the agency script that pushed stock into the connector still used it, and for two days the connector kept sending bol the last figures it had. | case: Version retired on a published date; script not updated; two days of stale figures to bol. | `additional_support`: Stale stock on the marketplaces. → The second incident, caused by a retired API version. |\n| p11 | transition | Noor's questions are the chapter's: which stock number each marketplace should be told and who computes it, where a marketplace order lives so support, the warehouse and finance see the same record, and who owns the API calendar of a vendor the business depends on for €3.0 million. |  | `conclusion_summary`: The two incidents. → The three questions they raise. |\n\n### What a Marketplace Is, and the Two Ways to Sell on One\n\n**Controlling idea** (`definition`, id `marketplace`): Selling on a marketplace means publishing offers against its products under one of two fulfillment models, and the two models put the order and the stock in different places for the merchant's systems.\n\n**Advances the thesis** (S3, S4): Defines the offer and the two models whose difference decides where the order is recorded and where the stock figure comes from.\n\n**Transition in:** `elaboration`: Noor's questions, which start from what a marketplace is told. → What a marketplace is and the two ways to sell on one.\n\n**Order of paragraphs** (`large_to_small`): The offer and the buy box first, then the two models side by side, their sources, and their architectural difference, which the rest of the chapter uses.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | definition | Selling on a marketplace means publishing an offer (price, stock and delivery promise) against a product the marketplace knows by its GTIN, and the buy box shows one of the sellers offering it, chosen by performance and price. |  |  |\n| p13 | comparison | Every large marketplace offers the same two logistics models, seller-fulfilled and marketplace-fulfilled, under its own names. | table: Table of the two models: who holds stock, ships and handles returns, with Amazon's, bol's and Zalando's names. | `elaboration`: The offer's delivery promise. → Who fulfills it. |\n| p14 | evidence | The names come from the vendors' own pages, and bol's description of Logistics via bol shows what the marketplace-fulfilled model takes over: storage, shipping and returns, with stock counted daily and charged for. | source: bol partner platform and Zalando partner university pages (accessed November 2026); Amazon's order performance policy (2026); bol's 40% surcharge on stock costs in November and December. | `additional_support`: The table's names. → Their sources and bol's description. |\n| p15 | analysis | The architectural difference is larger than the operational one: a seller-fulfilled order, like the first of the two Amazon.de orders, must enter the merchant's order record and warehouse flow with the marketplace's deadline, while marketplace-fulfilled stock, which ships the second, sits in a location the merchant does not control and learns about from the marketplace's reports, as W1 (stock ownership) says. |  | `contrast`: The operational split of the two models. → What each means for the merchant's records. |\n\n### What the Marketplace Measures You On\n\n**Controlling idea** (`evidence`, id `scorecard`): Marketplaces grade sellers on published thresholds with consequences, and each threshold depends on how fresh the merchant's data is, so the scorecard is an integration specification.\n\n**Advances the thesis** (S1): Supplies the thresholds and turns them into freshness requirements on the flows.\n\n**Transition in:** `cause_effect`: Seller-fulfilled orders carry the marketplace's deadline. → The metrics that grade how those deadlines are kept.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The two marketplaces' published standards first, then the reading of them as an integration specification, which needs both tables in view.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | evidence | Amazon's published order performance policy grades sellers on order defects, cancellations, late shipments, valid tracking and on-time delivery, each with a threshold and a window. | table: Order Defect Rate under 1% (60 days); cancellation rate under 2.5% (7 days); late shipment under 4%; valid tracking above 95%; on-time delivery 90% expected on Amazon.de. |  |\n| p19 | evidence | bol sets service standards (90% items on time, at most 2% cancellations a week) enforced by a strike process that can close the shop, and it auto-cancels unconfirmed orders against the seller. | fact: Strikes count over 22 weeks; five close the shop pending an improvement plan; seven close the account for at least a year; auto-cancellation on the third day after the promised delivery date. | `similarity`: Amazon's thresholds. → bol's standards and strikes. |\n| p20 | analysis | Read as an integration specification, the table says an oversell becomes a seller cancellation and a confirmation that arrives a day late is a late shipment, so each row maps to a flow and a freshness requirement on it. |  | `cause_effect`: The thresholds of both marketplaces. → What they require of the integrations. |\n\n### How the Pieces Fit Together\n\n**Controlling idea** (`process`, id `connector`): A channel integration platform translates five flows between the merchant and the marketplaces, each with its own freshness; the order flow keeps two order records in step by acknowledgement, idempotent import and timely confirmation; and the marketplace APIs impose rate limits, asynchronous results and dated retirements.\n\n**Advances the thesis** (S2, S4, S5): Shows what the connector carries and must not own, how an order enters the order record, and why flows move by events with an owned calendar.\n\n**Transition in:** `cause_effect`: Each row of the scorecard maps to a flow. → The connector and its flows.\n\n**Order of paragraphs** (`large_to_small`): The connector and its five flows first, then the order flow in the order its steps happen, then the API constraints that every flow must respect, ending on the deprecation calendar that the Deprecated Endpoint ignored.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | definition | A channel integration platform sits between the merchant's systems and many marketplaces and translates listings, orders, stock and prices, plus the status that flows back, as vendors themselves describe it. | quotation: ChannelEngine: 'One platform for listings, orders, inventory, and pricing across 1,300+ channels'; Shopify's Marketplace Connect.; figure: Figure 2: the connector translates five flows between the systems of record and the marketplaces and owns none of the data. |  |\n| p22 | comparison | Each of the five flows (listings, stock, prices, orders, status back-flow) has its own direction, freshness, consistency rule and failure when late. | table: Five flows by direction, freshness, consistency and what goes wrong when late. | `elaboration`: The four kinds of data and the status back-flow. → The five flows and what each needs. |\n| p23 | analysis | The two fast flows, stock and orders, are why W5 moves them by events rather than periodic copies. |  | `cause_effect`: The freshness column. → Events for the fast flows. |\n| p24 | process | The marketplace order lifecycle has the same shape everywhere, and the connector's job is to keep two order records, the marketplace's and the merchant's, in step at three points that carry the chapter. | figure: Figure 3: a seller-fulfilled marketplace order created once, acknowledged with the binding between two numbers, and confirmed with tracking before the deadline. | `elaboration`: The order flow, one of the two fast flows. → Its lifecycle. |\n| p26 | process | Acknowledging an imported order links the marketplace's order id to the merchant's order number, so later shipment, cancellation, return and payout messages find the same purchase. | fact: ChannelEngine calls acknowledgement the critical binding step; bol auto-cancels unacknowledged orders on day three after the promised delivery date. | `sequence`: The three points of the lifecycle. → The first: acknowledgement. |\n| p27 | process | A retry or a poll can deliver an order already imported, so uniqueness on the marketplace order id makes repeated deliveries idempotent and stops a second shipment. |  | `sequence`: The binding of the two numbers. → The second point: repeated deliveries of the same order. |\n| p28 | process | The ship confirmation is a deadline, because the late shipment rate is computed from its timestamp, so the path from the warehouse to the marketplace must complete on the day of shipment. | case: On Black Friday 2026 Kestrel & Pine's WMS connector queue backed up for four hours. | `sequence`: The import. → The third point: the confirmation back. |\n| p30 | evidence | The marketplaces' documentation rules out a tight loop of calls: Amazon's Selling Partner API limits each operation by a token bucket and asks sellers to respond to events rather than poll. | fact: MWS retired 1 April 2024; HTTP 429 on throttling; getOrders at 0.0167 requests a second with a burst of 20; 'Respond to events rather than polling on a loop'. | `contrast`: What the merchant must send and when. → The limits the marketplace APIs place on how it is sent, starting with Amazon's. |\n| p31 | process | Listings, prices and stock go up as asynchronous feeds whose acceptance does not confirm the change, so the connector must check each outcome. |  | `additional_support`: Amazon's API. → Feeds and their results. |\n| p32 | process | Customer names and addresses are restricted data behind a separate token, so the order record keeps only the personal data fulfillment needs. |  | `additional_support`: Feeds. → Restricted personal data. |\n| p33 | evidence | bol's Retailer API is asynchronous, publishes its rate limits, asks for changes and events rather than large batches, and removes a deprecated major version twelve months after the next one is released. | quotation: 'most calls are asynchronous; confirm the result afterwards'; 'only changes that need synchronizing'; 'scheduled for removal in 12 months'; Offers API v10 stops 1 February 2027 (partner news, 3 November 2026). | `similarity`: Amazon's constraints. → bol's, including its lifecycle policy. |\n| p34 | analysis | A deprecation schedule is a contract clause with a date, and someone at the merchant must own the calendar even when the connector vendor does most of the work. |  | `cause_effect`: bol's published retirement date. → The owned deprecation calendar, the Deprecated Endpoint in public form. |\n\n### Channel Allocation: The Number You Send Is a Promise\n\n**Controlling idea** (`claim`, id `allocation`): The stock figure sent to a marketplace is the quantity it may sell, so how much each channel is told is a policy computed once from the system of record for physical stock, and marketplace-held stock is an external location.\n\n**Advances the thesis** (S3): Argues for one available-to-promise calculation per channel and the external location.\n\n**Transition in:** `elaboration`: The stock flow and its freshness requirement. → What number the stock flow should carry.\n\n**Order of paragraphs** (`large_to_small`): The rule and the policies first, then Kestrel & Pine's interim fix and target as the rule applied.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | claim | The stock figure a connector sends is not a report but the quantity the marketplace is now entitled to sell without asking again. | fact: Amazon's LISTINGS_ITEM_MFN_QUANTITY_CHANGE notification shows what Amazon believes the quantity is. |  |\n| p36 | comparison | Channel allocation decides how much of the available stock each channel may promise, and the five policies (shared pool, fixed quantity, buffer, percentage split, computed available-to-promise per channel) fit different stages and break in different ways. | table: Five policies: how each works, where it fits, when it breaks.; figure: Figure 4: one stock jar guarded by an available-to-promise counter that hands each channel a ticket. | `elaboration`: The figure is a promise. → The policies that decide it. |\n| p37 | claim | Available-to-promise is computed once from the system of record for physical stock and published to every channel, and a connector that keeps its own stock copy and rules is a fourth system of record, as Kestrel & Pine's is in January 2027. | scenario: In January 2027 the connector keeps a copy of product data for listings and a stock copy up to two hours old. | `elaboration`: The last row of the policy table. → The principle behind it and its violation. |\n| p38 | claim | Units in a marketplace's warehouse are an external location with its own feed, never a copy of the merchant's warehouse figure. | fact: Amazon's FBA_INVENTORY_AVAILABILITY_CHANGES notification. | `additional_support`: One calculation from the system of record. → The second rule, for marketplace-held stock. |\n| p39 | example | Kestrel & Pine's interim fix since December 2026 is a buffer of ten units per variant, which helps most variants but costs the last few units of each and would have held the Ridgewalker for only minutes on Black Friday. | scenario: Platform figure minus ten per variant, zero below ten; about 17,000 active variants (illustrative). | `example`: The buffer policy and the hourly chain. → Kestrel & Pine's buffer. |\n| p40 | recommendation | The target under W1 makes the WMS the system of record for Duiven stock and the marketplace's German stock a tracked external location, with the availability service publishing available-to-promise per channel by events and the hourly chain retired by Q4 2027. | scenario: W1; Q4 2027; changes forwarded within minutes as bol's rate-limit guidance asks. | `problem_solution`: The buffer's cost. → The target that shrinks it. |\n| p41 | example | Once the availability service owns the figure, a channel rule can hold the last units for the storefront, which is impossible when the connector only knows what the platform said an hour ago. | scenario: 'Hold the last 20 units of each variant for the storefront' (assumption). | `cause_effect`: The target. → What it makes possible. |\n\n### Kestrel & Pine: The Marketplace Variant, 13 April 2027\n\n**Controlling idea** (`example`, id `example`): The two Amazon.de orders of 13 April 2027 show the two fulfillment models running through Kestrel & Pine's systems, and the marketplace-fulfilled one is the order most merchants leave out of the order record.\n\n**Advances the thesis** (S3, S4): Works both models through the order record, the stock flows and the scorecard, before and after W1 and W2.\n\n**Transition in:** `example`: The flows, the scorecard, channel allocation and the external location. → The two orders the introduction promised, worked step by step.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p63 | example | Kestrel & Pine's two Amazon.de orders of 13 April 2027 take different paths before W1 (stock ownership) and W2 (one order record) land, and both end in the OMS afterwards, the seller-fulfilled one with a fulfillment order and the marketplace-fulfilled one recorded for finance and analytics. | table: Step by step for both orders: where the order appears, stock effect, shipment, scorecard, return, after W1 and W2. |  |\n| p64 | analysis | Most merchants get the marketplace-fulfilled order wrong: because the marketplace does all the work, the order never enters the order record and its revenue, returns and stock are reconstructed from statements at month-end. |  | `emphasis`: The table's second column. → Why it is the common mistake. |\n\n### Prices Across Channels\n\n**Controlling idea** (`claim`, id `prices`): Prices follow the same discipline as stock: the price sent to each marketplace is a channel price derived from the pricing source, moved by repricing only within a floor computed from cost and dated fees.\n\n**Advances the thesis** (S2): Applies the owns-nothing rule to prices: derived from the pricing source, bounded by a floor.\n\n**Transition in:** `similarity`: The owner and the single calculation behind the stock number, shown at work in the two orders. → The same discipline for prices.\n\n**Order of paragraphs** (`large_to_small`): Why price matters on a marketplace, then the rule for repricing, then the fees the floor needs, a worked floor, and what happens without it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | context | Prices follow the same discipline: price parity clauses are gone from Amazon in the EU since 2013, but marketplaces still compare prices to decide visibility. | source: Bundeskartellamt, 26 November 2013; Amazon's PRICING_HEALTH notification ('ineligible for the Featured Offer (Buy Box) because its price is uncompetitive'); bol on the buy box. |  |\n| p43 | claim | Repricing acts on a channel price derived from the merchant's pricing source, never on the base price list, and is bounded by a floor computed from cost and fees. | quotation: ChannelEngine: 'dynamic pricing, margin guardrails, and cost-based insights to adjust prices per channel'. | `elaboration`: Marketplaces comparing prices to decide visibility. → Repricing, the merchant's own price rule, and its bounds. |\n| p17 | evidence | The floor needs the fees, which differ by marketplace, category, price band and fulfillment model and change on published dates, so they are dated reference data from which margin per channel and the floor are computed. | fact: Amazon US: $39.99 a month plus referral fees of mostly 8-15% (clothing 5%, 10%, 17% by price band); bol: no subscription, fixed amount plus a percentage by category; Zalando publishes no figures (November 2026). | `elaboration`: The floor computed from cost and fees. → What the fees are and how to hold them. |\n| p44 | example | For the Ridgewalker at €199, an assumed 15% commission and €6 shipping leave about €128 against a €58 landed cost, so the floor sits well above cost. | scenario: €199 incl. 21% VAT; 15% commission (Amazon's most common US referral rate); €6 shipping; about €128; landed cost €58 (assumptions). | `example`: The floor and the dated fees. → A worked floor for the Ridgewalker. |\n| p45 | cause_effect | A connector rule allowed below the floor can undercut the brand's own storefront, which is one way a Price Drift happens, so the channel price is a derived price with a source, an effective date and a floor. | case: The Price Drift of October 2026: €179 in Germany for nine days and a parity warning from a marketplace. | `contrast`: The floor above cost. → What happens without it. |\n\n### The Choices\n\n**Controlling idea** (`comparison`, id `choices`): A merchant has four realistic ways to connect to marketplaces, and across all four the deciding question is whether the marketplace order is created in the merchant's order record or lives in the tool.\n\n**Advances the thesis** (S4, S6): Compares the ways to connect and states the two conditions under which renting a connector is safe.\n\n**Transition in:** `cause_effect`: The two worked orders and the channel price, which show what the connector must carry and must not keep. → The ways to connect.\n\n**Order of paragraphs** (`comparison`): The four options in order of growing capability, then the question that cuts across them, then the recommendation, which needs both.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | transition | There are four realistic ways to connect to marketplaces, and the order-record decision cuts across all four. |  |  |\n| p47 | comparison | The marketplace's own seller tools are right at a few orders a day on one marketplace and wrong when a second marketplace arrives or the late-shipment clock bites. |  | `sequence`: Four ways. → The first. |\n| p48 | comparison | The platform's native channel app is cheap and adequate at the Growing stage, but it treats the platform as the system of record for stock and orders, which stops being true at the Omnichannel stage. | fact: Marketplace Connect's listing: 4.1 rating, 15% one-star reviews citing sync and pricing errors (accessed November 2026). | `sequence`: Seller tools. → The platform's app. |\n| p49 | comparison | A channel integration platform, Kestrel & Pine's choice and the common one for Omnichannel merchants in Europe, makes tracking marketplace rules the vendor's business, at the risk that it holds the merchant's stock, prices and products. |  | `sequence`: The platform's app. → A specialist connector. |\n| p50 | comparison | Direct integration fits Group-stage merchants with the volume to keep engineers on marketplace APIs; below that the merchant inherits every deprecation, feed quirk and rate limit. |  | `sequence`: The connector. → Building it yourself. |\n| p51 | analysis | Across all four the question is where the marketplace order lives: created in the order record with status mirrored back, or held in the connector, which is cheaper at the Growing stage and produces the Three-Status Order once other order sources arrive; W2 chooses the first. | table: The four options by marketplaces covered, who tracks API changes, stock allocation, order record, cost and fit. | `conclusion_summary`: The four options. → The question that cuts across them. |\n| p52 | recommendation | The author recommends the channel integration platform at the Omnichannel stage under two written conditions: it creates orders in the order record and does not keep them, and the stock it publishes comes from the merchant's availability calculation. |  | `cause_effect`: The comparison and W2. → The recommendation and its conditions. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): The marketplace integration scales with the number of order sources, not with order volume.\n\n**Advances the thesis** (S6): Says which choice fits which stage and when the platform's order list stops being the order record.\n\n**Transition in:** `elaboration`: The four options and the stages named in them. → The options stage by stage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | synthesis | The mechanism scales with the number of order sources, not order volume: once a store, a wholesale portal or a second marketplace also creates orders, the platform's order list is no longer the order record and the marketplace integration must be re-pointed, a line Kestrel & Pine crossed in 2023 and noticed in December 2026. | table: Stages 1 to 4: what is typical, what becomes necessary, warning signs. |  |\n\n### In Practice\n\n**Controlling idea** (`example`, id `in-practice`): Four current developments test the chapter's rules: programs and interfaces retire on their own calendars, marketplaces become logistics providers, social channels switch between feed and order source, and some merchants go on to operate a marketplace, which is a different job.\n\n**Advances the thesis** (S3, S5, S6): Applies the rules to current cases: retirement dates, a third kind of stock location, channels that become order sources, and the operator's side reached at the Group stage.\n\n**Transition in:** `example`: The ways to connect and how they change with scale. → Four current developments that test the rules.\n\n**Order of paragraphs** (`grouping`): The developments grouped by what they change: dates (p54), stock locations (p55, p56), order sources (p57 to p60), the operator's side (p61, p62). The section's first sentence names the four so the reader knows why they sit together.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p54 | example | Four current developments test the chapter's rules, the first being that marketplaces and their programs retire interfaces on their own calendars, as bol's v10 does, so a merchant whose store stock is a location in its own availability service changes a connector when a program ends, while one built on the program's tool rebuilds. | fact: MWS unavailable from 1 April 2024; bol Offers API v10 stops 1 February 2027; Zalando's Connected Retail ends by the end of June 2027 (TextilWirtschaft, 24 April 2026). |  |\n| p55 | claim | A marketplace can store a merchant's stock and fulfill orders from other channels, including the merchant's own shop, which makes its warehouse network part of the merchant's fulfillment architecture. |  | `additional_support`: Programs changing. → The marketplace as logistics provider. |\n| p56 | evidence | Zalando's ZEOS shows it: marketplace-held but multi-channel stock, a third kind of location, and a dependency on the marketplace's APIs for the merchant's own storefront orders. | fact: ZEOS announced 17 October 2023 as 'one stock pool, one carrier integration and one user interface'; by December 2025 in 24 markets and 18 sales channels. | `example`: The marketplace as logistics provider. → ZEOS. |\n| p57 | comparison | A social channel either sends shoppers to the merchant's checkout, needing only product information, or takes orders itself, also needing an order import and a fulfillment report. |  | `additional_support`: Channels that change what they are. → Social channels. |\n| p58 | example | Meta moved Facebook and Instagram Shops to website checkout in 2025, so for most merchants it is again a shopping feed destination. | fact: Move to website checkout (trade press, June 2025). | `example`: The first route. → Meta. |\n| p59 | example | TikTok Shop went the other way, opening in-app checkout in several European countries in 2025 and 2026. | fact: Germany, France and Italy from 31 March 2025; the Netherlands, Belgium, Austria and Poland from 15 June 2026. | `contrast`: Meta's move to a feed. → TikTok's move to orders. |\n| p60 | recommendation | Either way the catalog comes from its system of record and incoming orders go through the marketplace import, while retail media adds a cost and a reporting stream but no order flow. |  | `conclusion_summary`: Both routes. → The rule for both, and retail media. |\n| p61 | comparison | Operating a marketplace means onboarding sellers, managing their offers, splitting orders and paying each seller, which needs records and controls beyond what a merchant needs to sell its own goods. |  | `contrast`: Selling through channels. → Operating one. |\n| p62 | evidence | Mirakl sells the operator side, and the Digital Services Act's Article 30 requires platforms to verify traders' identity before they sell, which is why every marketplace onboarding asks the merchant for identity documents and bank details; the operator's architecture is the subject of LISTED, the companion book on marketplace architecture. | fact: Mirakl serves over 450 companies; DSA Article 30 applies from 17 February 2024. | `example`: The operator's responsibilities. → A vendor and the legal core. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`cause_effect`, id `wrong`): Six failures each break a rule of the chapter, and the table pairs each with its detection and recovery; the age monitor and early cancellation are the cheapest controls.\n\n**Advances the thesis** (S1, S4, S5): Pairs each failure with its detection and recovery, read against the rules above.\n\n**Transition in:** `contrast`: The rules the developments test. → What goes wrong when a rule is broken.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p65 | recommendation | Each failure in the table breaks one of the chapter's rules, and two controls are cheapest: the age monitor, the time since each channel last accepted a stock update, which would have caught the Deprecated Endpoint within the hour, and early cancellation of a certain oversell, which costs less than waiting. | table: Six failures with how each shows, detection and recovery. |  |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Noor's three questions have one answer: the connector translates and owns nothing. The stock number comes from one available-to-promise calculation per channel, every marketplace order is created once in the order record under the marketplace's id, and the merchant owns the dates and the monitors; the oversell, the two stale days and the order the warehouse report cannot find are each a copy the connector was allowed to own.\n\n**So what:** The scorecard is a service level the merchant did not negotiate, so the freshness of each flow and the owner of each retirement date decide whether marketplace reach pays; a reader can name, for their own channels, the system behind each value, the key of each order, the monitor and the owner before adding a marketplace.\n\n**Callback:** The introduction's bargain of reach for rules and a scorecard, and Noor's three questions in the scene. Paragraph p66 answers the three questions and shows that the scorecard is kept by the merchant's own flows.\n\n**Takeaway** (`course_of_action`): For each marketplace channel, name the system that computes the stock number it is told, where its orders are created and under which key, the age monitor that would show stale stock and the owner of each API retirement date; start with the age monitor.\n\n**Hand-off** to [Selling to Businesses: Accounts, Contract Prices, Quotes and Approvals](b2b-commerce.html): `contrast`: Orders from outside the shop that arrive through a marketplace, whose buyer is a consumer and whose rules the marketplace sets. → Orders from Kestrel & Pine's 1,100 wholesale accounts, whose buyers are companies with contract prices, payment terms and credit limits that a consumer checkout cannot express.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p66 | synthesis | Noor's three questions have one answer, that the connector translates and owns nothing, so every value it carries and every date it depends on has an owner at the merchant; each incident in the chapter was a copy the connector was allowed to own, and the scorecard the marketplace keeps is kept by the merchant's own flows. |  |  |\n| p67 | synthesis (list) | Established: marketplaces grade sellers on published thresholds with consequences; their APIs are rate-limited, asynchronous and retire versions on dates; and the two fulfillment models differ architecturally. |  | `conclusion_summary`: The answer. → What is documented. |\n| p68 | synthesis (list) | Depends on context: the platform's channel app suffices while the platform is the only order source; a buffer suits hourly sync and computed available-to-promise suits events; direct integration needs volume. |  | `contrast`: What is settled. → What depends on the merchant. |\n| p69 | recommendation (list) | The author's synthesis: the connector translates and owns nothing, and the scorecard is an integration service level from which each flow's freshness requirement and the age monitor follow. |  | `sequence`: What depends on context. → The author's judgement. |\n| p70 | recommendation (list) | Eight questions let the reader find, at their own company, the system behind each marketplace value, where marketplace orders are created, who owns the scorecard and the deprecation calendar, and what is at risk if an account closes. |  | `cause_effect`: The take-aways. → Questions to apply them. |\n| p71 | transition | Marketplace orders come from consumers under rules the marketplace sets; the next chapter turns to the other kind of outside order, from 1,100 wholesale accounts whose buyers are companies with contract prices, payment terms and credit limits a consumer checkout cannot express. |  | `contrast`: The questions about marketplace channels. → Wholesale orders. |\n\n## Non-goals\n\n- The availability calculation itself, reservations and safety stock; this chapter uses available-to-promise per channel as an input. See [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html).\n- The order record's state model and the OMS; this chapter only decides where marketplace orders are created. See [The Order Record: Lifecycle, State and the Order Management System](order-management.html).\n- API versioning discipline in general; the chapter gives the marketplace case. See [Promises Between Systems: API Contracts, Webhooks and Versioning](api-contracts-and-versioning.html).\n- Store stock and ship-from-store programs. See [Stores Are Systems Too: Point of Sale and Omnichannel Fulfillment](stores-and-omnichannel.html).\n- Returns handling and refund reconciliation; the chapter only notes marketplace returns as an order-record event. See [The Way Back: Returns, Exchanges, Refunds and Reverse Logistics](returns-and-exchanges.html).\n- Operating a marketplace (seller onboarding, payouts, ranking): LISTED's territory; the chapter defines the terms and points onward. See [Rules of the Marketplace: DSA, DAC7 and Vertical Regulation](../listing-systems-architecture/marketplace-regulation.html), [Liquidity Is the Product: Network Effects, Local Markets and Marketplace Metrics](../listing-systems-architecture/liquidity-and-network-effects.html).\n- Fee economics and margin reporting per channel. See [Counting the Same Thing Everywhere: Data Platforms, Definitions and Analytics](commerce-data-and-analytics.html), [Who Sells What to Whom: Business Models and the Economics That Shape Architecture](commerce-business-models.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Needs the author (rule 12): round-3 points left open. The stage section opens on its table with no lead sentence (a lead would add a unit); the four-hour queue sentence in the scene (p08), asked for by both round-2 readers, reads to the round-3 outliner as a second idea (rule 10 keeps it); retail media at the end of p60 reads as an aside; the opening callout's failure-pattern names (The Phantom Stock, The Pulled Rug) are not repeated in the body; the failure table lists a retired API version both as a cause of stale stock and as its own row. The fact needed: whether the author wants these touched in the next sharpen pass.\n\n## Decision log\n\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: after the confirming round 3 (escalate: 17 passed, 18 failed; all four cold-reader criteria, the reverse outline, evidence, thesis trace, known_before_new and the introduction and conclusion checks pass), the cheap, plainly right fixes were made without another round: (rule 3, both round-3 readers) the prices section moves after the worked example, which uses allocation but not prices, with the roadmap, the example's and the choices' transitions rewritten; the fifth flow is named in p21 before Figure 2 and p22 is back to the author's 'The five flows and what each needs:'; p32 opens 'The APIs also restrict personal data'; p37 says the availability service under W1 is bought as a module of the OMS that W2 introduces; the unexplained '410' is dropped from p41; the Price Drift's parity warning is explained in p45; the floor arithmetic is shown (€164.46 before VAT, €29.85 commission, €6 shipping); In Practice's first sentence names its four developments; the 'show both sides' forward reference says the orders come later; 'unacknowledged (unconfirmed)' ties p26 to p19. To stay within 6,600 words, this pass's own additions (the answering paragraph, the openers of the example, prices and choices) were shortened; 6,600 words. Rejected: Starting a fourth round.; Moving the restricted-data paragraph into the order-import subsection (it describes an API rule; a lead sentence ties it to the API limits instead).\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: (rule 3) p16, 'The marketplace is also a competitor', is cut: readers in both rounds found it out of place, first in the marketplace section and then in the prices su         // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,

        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;

            function inline(s) {

                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {

                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');

                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
