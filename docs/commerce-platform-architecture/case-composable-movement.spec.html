<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/49-case-composable-movement/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have: a thesis paragraph and a roadmap in the introduction, a chapter synthesis that answers the opening, Part XI's closing (synthesis across chapters 46 to 49, so-what, callback to the part opening) and the journal's closing (Eva's five promises, the toolkit, the hand-off to the appendix tutorial). These are recorded in decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The 2020 promise: the MACH Alliance founded in June 2020 by commercetools, Contentstack, EPAM and Valtech around Microservices, API-first, Cloud-native and Headless; over 100 members by December 2023; what the promise did not say (who builds and runs the storefront, who owns the joins and what they cost each year, for which size of merchant the difference pays).\n- **Know:** commercetools' dated turn: a new CEO in July 2024; about 10% of staff cut in February 2025 after missed 'aggressive revenue growth targets'; AgenticLift (January 2026) 'on top of your existing commerce solution'; 'Autonomous Commerce' (June 2026); Core Commerce and Product Catalog sold as standalone modules 'without replacing their existing platforms' (July 2026); a Gartner Leader for the seventh year (October 2026); the April and July 2026 figures not reconciled by the vendor; the reasons for the turn only the chapter's labeled inference.\n- **Know:** The other paths: Shopware (first among the 1,000 largest German B2C shops in EHI's 2026 study at 12.5%, GMV-based plans with a paid plan required above €1 million of GMV, Nexus and Shopware Payments on PayPal's infrastructure from June 2026, PayPal holding more than 40%); Adobe Commerce's three deployment options and Commerce Optimizer beside any backend; the Mage-OS fork; BigCommerce renamed Commerce.com in July 2025 and reporting in August 2026 that B2C replatforming 'remains softer than historically'.\n- **Know:** The alliance's principles from four letters (2020, restated 2023) to five principles including Incremental (August 2025) to three, Open, Composable and Connected (November 2026), with microservices and headless gone; its February 2026 survey of 600 decision-makers, with 37% naming integration complexity a primary concern; the cost lines of an assembly (storefront, joins, upgrades, separate services, licenses, people, exit) and the conditions under which it fits.\n- **Know:** Where the evidence stops: no vendor reason for the turn, no published method behind Shopware's integration-cost claims, no independent study comparing the total cost of an assembly with a hosted platform plus layers.\n- **Believe:** Composable was right about properties (open APIs, replaceable capabilities, clear ownership) and wrong about prescriptions (rebuild as services, build your own storefront).\n- **Believe:** Open source and composable are independent choices: choose on who owns upgrades and joins, not on the license.\n- **Be able to:** Cost a composable proposal including the storefront, every join, upgrades on the vendors' schedules, people and exit.\n- **Be able to:** Decide whether a missing capability should be adopted as one service beside the current platform, and name its owner.\n\n**Audience:** Readers new to commerce architecture who will meet 'composable' in a replatforming pitch, an analyst chart or a conference talk: most of all engineers and product managers deciding whether to adopt a capability as a separate service; second, leaders who must judge a consultancy's composable proposal.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Parts I to X: the thirteen steps of an order, promise and handoff, the three status lines, 'system', 'the shop platform' for the hosted product, the four scale stages (Starting, Growing, Omnichannel, Group), system of record, single writer, events, idempotency and reconciliation; available-to-promise; the failure-pattern names (The Giant's Boots, The Burned Bridge, The Spaghetti Junction among them); agentic commerce from chapter 45.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order management system (OMS), availability service, D2C, B2B, PIM, POS.\n- Kestrel & Pine: a fictional outdoor brand with fourteen people in technology on a hosted shop platform, its 34 integrations, its agency, Eva's jacket order of 13 April 2027 and her five promises, the Black Friday 2026 incidents, the February 2027 pitches and the Waypoint decisions W1 to W8.\n- Part XI's method (dated public sources, documented versus inferred, each case ending where its evidence stops) and chapters 46 to 48: Shopify's kept monolith and its integration contract, Amazon's move to services after a 2001 wall and its cart and seller-of-record split, Zalando's 2015 split, later narrowing and 2025 read API.\n\n**Does not yet know:**\n\n- Composable commerce, the MACH Alliance and the four words (microservices, API-first, cloud-native, headless); headless as a narrower choice.\n- GMV and run-rate as vendor metrics; Gartner's Magic Quadrant and Forrester's Wave as analyst placements.\n- commercetools, Shopware, Adobe Commerce and Commerce Optimizer, Mage-OS, Commerce.com, Saleor as vendors and what each sells.\n- Fair-usage policy priced on GMV; orchestration layer; platform-as-a-service versus fully managed SaaS.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a composable replatforming proposal for a merchant with an integration-shaped team, the reader states what to ask and what to decide, grounded in the movement's own record. *Probe:* A consultancy proposes that a brand with about €60 million in revenue, twelve people in technology (mostly integration engineers), a hosted platform and about 30 integrations replace the platform with a composable stack: an API-only engine, a built storefront, search, content and an integration layer. Using only this chapter: what should the brand ask, and what should it decide? | `custom` | cold_reader | major |\n| AC-2 | The reader can read a vendor alliance's adoption figures critically and name the finding that runs against its interest. *Probe:* A vendor deck says: '78% of organizations with fully scaled MACH technology see clear AI ROI, and 85% of technology leaders increased their MACH share.' Using only this chapter: how should a reader treat these figures? | `custom` | cold_reader | major |\n| AC-3 | The reader can tell an open-source platform from a composable assembly. *Probe:* Using only this chapter: is moving to an open-source platform such as Shopware a move to composable commerce? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What did the composable movement promise, what does a full assembly cost a merchant, and what does the movement's own record from 2024 to 2026 show about when assembling commerce from parts is right?\n\n> **Claim:** The composable movement promised replaceable services in 2020 and asked the merchant to build the storefront and own every join between services, work for a product-engineering team before the first sale. By 2026 the MACH Alliance had dropped microservices and headless from its principles, 37% of its 2026 survey named integration complexity a primary concern, and commercetools sold modules for existing platforms. A full assembly fits multi-brand groups with platform teams; merchants without one add one owned service at a time.\n\n**Disputed by:** The 2020–2023 pitch that composable is where commerce is going: a merchant should replace its suite or hosted platform with best-of-breed services and a built storefront, because each capability can then be swapped and the merchant escapes a single vendor's release cycle.\n\n**So what:** A merchant that accepts the claim answers a composable proposal by asking which of the four 2020 words (microservices, API-first, cloud-native, headless) and the three 2026 principles (open, composable, connected) the proposer means, who builds and runs the storefront, who owns each join with its API version and renewal date, and whether the missing capability can be adopted as one service beside the current platform. Kestrel & Pine declined the consultancy's February 2027 composable rebuild (a separate engine, storefront, search, content system and integration layer for fourteen technology staff, about €3.2 million over three years, illustrative) and takes the per-capability path as Waypoint: an OMS, availability and a PIM beside the hosted platform, each integration with an owner and a contract, revisited at the 2029 review.\n\n**How and why:** Every capability bought as a separate service adds a join, a contract, an API version, a renewal and an owner, and an API-only engine ships no storefront, so the running cost of an assembly falls on the merchant's own team (storefront, integration, upgrades on the vendors' schedules) before the first sale, which a team shaped for integration rather than product engineering cannot carry. The vendors' 2026 products (commercetools' AgenticLift and standalone modules, Adobe Commerce Optimizer beside any backend, Shopware pulling integration and payments into its platform) are sold to merchants who keep their core; no release explains the turn, and its link to commercetools' 2025 cuts is the chapter's labeled inference.\n\n**Supporting claims**\n\n- **S1** — The 2020 MACH promise (microservices, API-first, cloud-native, headless) described how enterprises with product-engineering teams could build; it did not say who builds and runs the storefront, who owns the joins between services and what they cost each year, or for which size of merchant the difference pays.\n- **S2** — commercetools, the movement's flagship, turned between 2024 and 2026 from selling replacement to selling layers and standalone modules for platforms merchants keep, after a February 2025 staff cut tied to missed growth targets; no release gives the reason, so the link is a labeled inference.\n- **S3** — The other vendors absorbed the word rather than decomposing: Shopware pulled integration and payments into an open-source platform priced on GMV, Adobe sells composable layers beside any backend, the Magento forks lengthen the patch chain and Commerce.com adopted the vocabulary while reporting weak replatforming, which shows that open source and composable are independent choices.\n- **S4** — The alliance's own record states the correction: its principles dropped microservices and headless between 2020 and 2026, and 37% of respondents to its February 2026 survey named integration complexity a primary concern, the cost line the 2020 promise left out.\n- **S5** — A full assembly adds the storefront, every join, upgrades on the vendors' schedules, separate contracts, people and exit to the merchant's own bill, so it fits a Group-stage merchant with platform and product teams, while an Omnichannel merchant such as Kestrel & Pine adopts one owned capability at a time beside a kept platform.\n- **S6** — The public record stops short of the vendors' reasons and of any independent cost comparison, so the chapter's reasons are labeled inference and its costs are labeled judgment or Kestrel & Pine illustrations.\n\n## Role in the part\n\nTests the book's stay-and-surround recommendation against the vendors that sold the opposite, setting out the assembly's cost lines and the movement's own move to layers beside a kept core, and performs the part's closing followed by the journal's closing on the same page (the published chapter does neither: it ends with one sentence listing the four cases and a hand-off to domain-coverage). Supports P11-4, P11-5 of part `part-11`.\n\n## Flow\n\n**Pattern:** `assertion_evidence_reasoning` (also `chronological` in promise to commercetools: the 2020 promise before the 2024-2026 turn; `comparison` in commercetools, shopware and adobe: the flagship's turn to layers set against vendors that absorbed the word; `problem_solution` in costs to kp: the cost lines, then the conditions under which assembly fits, then the merchant's path)\n\nThe 2020 promise and its unsaid column come first, because every later section tests it. The vendors' record follows as evidence: the flagship first (it carried the promise furthest), then the vendors that went the other way or absorbed the word, so the turn is seen from several sides before the alliance's own wording is read. The alliance's principles and survey come after the vendors because they state, in the movement's own words, the correction the vendors' products already show. Only then are the costs and the conditions argued, because they rest on that record; Kestrel & Pine applies them; 'Where the Evidence Stops' closes the body because it bounds every case just read. Putting the costs before the record would state the author's judgment before the evidence; putting the alliance first would read a rewrite whose reason the vendors' turn supplies; moving 'Where the Evidence Stops' up to follow the survey would split the vendors' limits from the cost limits that the cost table and the Kestrel & Pine illustration add.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A merchant wants to replace its search service without replacing checkout and the catalog as well; buying separate services seems to offer that freedom, but each still depends on shared product identifiers, prices and stock updates, so replacement is practical only if those connections can be changed at an acceptable cost.\n\n**Bridge:** Chapters 47 and 48: two large retailers that built services for their own size and later corrected them; and the pitch the reader will hear that a merchant should assemble commerce from separate services. → The composable movement sold the services shape to every merchant from June 2020; its vendors' and its alliance's dated record from 2020 to 2026 shows what the promise left out and when assembly pays.\n\n**Thesis statement** (KEY POINTS callout and paragraph p05): The 2020 promise of replaceable services asked the merchant to build the storefront and own every join between services, work for a product-engineering team before the first sale; by 2026 the alliance had dropped microservices and headless from its principles, 37% of respondents to its own survey named integration complexity a primary concern, and commercetools sold modules for platforms merchants keep; a full assembly fits multi-brand groups with platform teams, and a merchant without one adds one owned service at a time.\n\n**Roadmap** (Paragraph p06):\n\n- Set out what the 2020 promise said and what it left unsaid. *Kept in:* promise.\n- Follow commercetools' dated turn from flagship to layers. *Kept in:* commercetools.\n- Read Shopware's opposite path of pulling integration and payments into its platform, then Adobe, the Magento forks and Commerce.com. *Kept in:* shopware, adobe.\n- Read the alliance's rewritten principles and its own survey. *Kept in:* alliance, data.\n- Cost a full assembly and set out when it fits. *Kept in:* costs, fit.\n- Say what Kestrel & Pine takes and where the evidence stops, then close Part XI and the book. *Kept in:* kp, evidence.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A merchant that wants to replace one service, such as search, still depends on shared product identifiers, prices and stock updates, so the cost of changing those connections decides whether composable commerce, assembling separate commerce services, pays. | scenario: A merchant replacing its search service without replacing checkout and the catalog. |  |\n| p03 | definition | Composable covers separate services for catalog, cart, checkout, search or content, while headless is a narrower choice: separating the storefront from the commerce engine through an API. |  | `elaboration`: Composable commerce as the hook defines it. → What the services may cover, and headless as a narrower choice. |\n| p02 | context | Unlike Amazon and Zalando, which built services for their own size, the MACH Alliance (founded June 2020 around microservices, API-first, cloud-native and headless; over 100 members by December 2023) sold that shape to every merchant, and its vendors' dated accounts show when assembly solves a merchant's problem. | fact: June 2020 founding around four words; more than 100 members by December 2023; dated accounts from commercetools, Shopware, Adobe and the alliance. | `contrast`: Composable and headless as choices a merchant makes. → The movement that sold assembly to every merchant, set against chapters 47 and 48. |\n| p04 | context | In Eva's jacket order, the storefront, cart, checkout and order record can come from one product or several, and the composable decision settles who must connect them and run those connections. | scenario: Eva's order at Kestrel & Pine, the fictional outdoor brand. | `example`: The pieces an assembly may separate. → Where they sit in Eva's order. |\n| p05 | claim | The chapter's claim: the 2020 promise asked the merchant to build the storefront and own every join, work for a product-engineering team; by 2026 the alliance had dropped microservices and headless, 37% of its survey named integration complexity a primary concern and commercetools sold modules for kept platforms, so a full assembly fits groups with platform teams and others add one owned service at a time. | reasoning: The thesis in the order the chapter argues it. | `cause_effect`: Who must connect and run the pieces of Eva's order. → The chapter's answer to when assembling them pays. |\n| p06 | transition | The chapter sets out the 2020 promise, follows commercetools, Shopware and then Adobe, the forks and Commerce.com, reads the alliance's principles and survey, costs an assembly and its fit, says what Kestrel & Pine takes and where the evidence stops, and closes Part XI and the book; the design method lives in other chapters. |  | `sequence`: The claim. → The order in which the chapter argues it, and which chapters own the design decisions. |\n\n## Sections\n\n### What Composable Promised, 2020–2023\n\n**Controlling idea** (`evidence`, id `promise`): The 2020 promise described how enterprises with product-engineering teams could build, and left unsaid who builds the storefront, who owns the joins and for which merchant it pays.\n\n**Advances the thesis** (S1): Establishes the promise the rest of the chapter tests and the cost lines it omitted.\n\n**Transition in:** `sequence`: The roadmap's first step. → The 2020 founding document.\n\n**Order of paragraphs** (`chronological`): The founding document (2020) comes before the 2023 restatement and adoption claims; the proposition and what it did not say follow once both dates are set, so the table of the unsaid closes the section and opens the rest of the chapter. Putting the four choices before the 2023 claims would leave the adoption figures after the analysis they qualify.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | evidence | EPAM's 24 June 2020 announcement names the founding members (commercetools, Contentstack, EPAM, Valtech) and spells MACH out as Microservices, API-first, Cloud-Native and Headless, the historical evidence of the original proposition. | source: EPAM release of 24 June 2020, more than three years old. |  |\n| p08 | evidence | The alliance's 13 December 2023 announcement (over 100 members; 85% of 500 surveyed technology leaders raising their MACH share; inconsistent applicant totals) is the alliance's own adoption claim and does not show that a merchant cut costs or raised sales. | statistic: Over 100 members; 85% of 500 technology leaders; two inconsistent applicant figures. | `time`: The 2020 definition, to be read against its date. → The 2023 restatement and its adoption claims. |\n| p09 | analysis | The original proposition combined four choices (small independently deployed services, documented APIs, vendor-operated cloud software, a separate storefront) and promised easier replacement and less dependence on a suite's release cycle, but a table of what it says and does not say shows it left out the storefront, the joins, the merchant's own running work and the merchant size at which it pays. | table: What the 2020 promise says / what it does not say, four rows. | `contrast`: Adoption claims that do not show merchant results. → What the proposition actually promised a merchant and what it left out. |\n| p10 | claim | The right-hand column is the subject of the rest of the chapter: the promise was true for large enterprises with product-engineering teams and said nothing about a merchant with fourteen technology staff, such as Kestrel & Pine. | figure: Figure 1: an iceberg of best-of-breed blocks above and storefront, joins, upgrades and people below. | `emphasis`: The unsaid column of the table. → Why it governs the rest of the chapter. |\n\n### commercetools: From Flagship to Layers\n\n**Controlling idea** (`evidence`, id `commercetools`): The movement's flagship turned between 2024 and 2026 from selling replacement to selling layers and modules beside platforms merchants keep, and its releases do not say why.\n\n**Advances the thesis** (S2): Documents the flagship's own move to the shape the book recommends.\n\n**Transition in:** `sequence`: The promise and its unsaid column. → The vendor that carried the promise furthest.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The engine's role and the company's standing come first so the reader knows why it is the flagship; the dated table is the evidence; three readings of it follow; the labeled inference and the gap in the record close the section. Putting the readings before the table would ask the reader to accept them before seeing the dates.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | In the composable model a commerce engine supplies pricing, carts and orders through APIs while the merchant chooses the storefront and other parts, which is the role commercetools plays. |  |  |\n| p12 | evidence | commercetools is the composable flagship: founded in 2006, funded at a $1.9 billion valuation in 2021, a founding alliance member, a Gartner Leader every year since 2020 and, by April 2026, past a $100 billion GMV run-rate. | fact: Founding, REWE, 2019 and 2021 funding (TechCrunch, February 2025); Gartner Leader since 2020; $100B GMV run-rate, 600 million orders, 36 countries (release, 22 April 2026); GMV and run-rate glossed. | `elaboration`: The engine role. → The company that plays it and its standing. |\n| p13 | evidence | commercetools' releases from July 2024 to October 2026 record the turn: a new CEO, a 10% staff cut after missed growth targets, AgenticLift on top of existing commerce solutions, 'Autonomous Commerce', standalone modules 'without replacing their existing platforms' and a seventh Gartner Leader placement. | table: Seven dated rows (10 July 2024 to 22 October 2026) with source and what changed; agentic commerce glossed. | `emphasis`: The flagship's standing. → Where its turn is recorded. |\n| p14 | analysis | First, the vendor's own products now describe the architecture the book recommends for Omnichannel-stage merchants: a kept core with layers beside it. | reasoning: AgenticLift and the July 2026 modules are built for stacks that are not composable. | `sequence`: The dated table. → The first of three readings. |\n| p15 | analysis | Second, the sales vocabulary moved from 'composable' to 'Autonomous Commerce' while the product's shape, API services the merchant assembles or attaches, did not change. | quotation: 'Autonomous Commerce' as 'the new category for the AI era' (June 2026 release). | `sequence`: The first reading. → The second: the vocabulary. |\n| p16 | analysis | Third, the numbers need their units: the April and July 2026 releases give customer, GMV and order figures that differ by about 10% in three months, and the vendor does not say whether the business grew or the units differ. | statistic: '500+ enterprises', $100B, 600 million orders (April) against 'more than 600', 'over $110 billion', 'over 700 million' (July). | `sequence`: The second reading. → The third: units. |\n| p17 | evidence | The public record has gaps, the CEO handover from Andrew Burton to Doug McNary and any stated reason for the turn, so the reason is only the author's labeled inference from missed targets followed by layers and modules. | reasoning: INFERENCE, NOT DOCUMENTED callout: missed targets then layers and modules, consistent with full replatforming onto an API-only core selling to fewer merchants than the 2020-2023 pitch assumed. | `additional_support`: The limits of the vendor's figures. → The gaps in its public record, and the labeled reason. |\n\n### Shopware: The Mid-Market Path\n\n**Controlling idea** (`comparison`, id `shopware`): Shopware answered the movement by pulling integration and payments into an open-source platform priced on GMV, which shows that open source and composable are different axes.\n\n**Advances the thesis** (S3): Gives the opposite path from commercetools and separates the license from the architecture.\n\n**Transition in:** `contrast`: The flagship's turn to layers. → A platform that went the other way.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The counter-case is stated first; ownership and market position establish who Shopware is; pricing and the June 2026 launches are the two clues; the vendor's claims, a plain restatement and a labeled inference read them; the open-source-versus-composable point closes the section because it needs all of them. Moving the market position after the clues would leave the reader judging a platform whose size is unknown.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | claim | Shopware is the counter-case: an open-source platform that answered the movement by pulling more into the platform, not less. |  |  |\n| p19 | evidence | Shopware's own releases document its finances and ownership: bootstrapped until a 2022 USD 100 million investment from Carlyle and PayPal, PayPal holding more than 40% since late 2025, and a CEO succession announced in August 2026 with the founders keeping a majority; PayPal's stake matters because Shopware Payments runs on PayPal's infrastructure. | fact: 2022 investment and 2021 GMV (flagged as older than three years); PayPal's stake from about 11% to more than 40%; Joachim Weber as Co-CEO then CEO; founders' new roles. | `elaboration`: The counter-case. → Who Shopware is: its ownership. |\n| p20 | evidence | Shopware's market position depends on the population counted: first among the 1,000 largest German B2C shops in EHI's 2026 study at 12.5%, 0.2% of sites in W3Techs' worldwide count, a Gartner Visionary and a Forrester Strong Performer for B2B. | statistic: EHI 2026: 12.5%, first for the fifth year, platform identified for 60.2%; W3Techs 0.2%; Gartner 2025 and 2026; Forrester Q3 2026. | `additional_support`: Ownership. → Market position. |\n| p21 | evidence | The first clue to Shopware's path is pricing: paid plans based on GMV and a fair-usage rule requiring a paid plan above €1 million of GMV make it a platform that wants to sit in the path of every order. | fact: Community Edition free; Rise from €600 and Evolve from €2,400 a month, 'based on your gross merchandise value'; paid plan above €1 million GMV (pricing page, November 2026). | `cause_effect`: A platform's size and standing. → The first sign of where it is heading. |\n| p22 | evidence | The second clue came on 10 June 2026: Nexus, an event-driven orchestration layer positioned as replacing middleware, and Shopware Payments on PayPal's infrastructure. | fact: Shopware Community Day, Cologne, 10 June 2026; Nexus; Shopware Payments live in Germany and Austria. | `sequence`: The first clue. → The second clue. |\n| p23 | evidence | Shopware's figures for integration effort (more than 15 tools, up to 52% of effort, 40% savings) are vendor claims without a published method, and Nexus is metered per execution. | statistic: 15 tools, 52% of implementation effort, 40% cost cut; €10 per extra 1,000 executions. | `elaboration`: Nexus. → The claims made for it and how it is charged. |\n| p24 | analysis | In plain words, the iPaaS and the PSP that a composable merchant buys separately became Shopware products, which the author reads, as a labeled inference, as a platform earning on orders and payments with the integration layer inside its own metering. | reasoning: iPaaS and PSP glossed; INFERENCE, NOT DOCUMENTED callout comparing the economic shape with a hosted SaaS platform (case-shopify). | `cause_effect`: Nexus, Payments and their metering. → What they mean for a merchant, plainly. |\n| p25 | claim | Shopware shows that open source and composable are different axes: its core is open, its commercial path is to be the hub, and the fair-usage line means the hub is paid for once the merchant grows. | reasoning: Open core; hub-shaped commercial path; OMS or PIM can still be bought beside it. | `conclusion_summary`: Pricing, Nexus, Payments and the inference. → What the case teaches a newcomer. |\n\n### Adobe, the Forks and Commerce.com: Composable as a Deployment Option\n\n**Controlling idea** (`evidence`, id `adobe`): Adobe, the Magento forks and Commerce.com absorbed the composable word as a deployment option, a fork or a rename rather than adopting decomposition.\n\n**Advances the thesis** (S3): Adds three more vendors whose record shows the word absorbed, not adopted.\n\n**Transition in:** `similarity`: Shopware absorbing integration and payments. → Three more vendors absorbing the word.\n\n**Order of paragraphs** (`grouping`): Three vendors with the same pattern follow one claim: the suite (Adobe), the open-source side it left (the forks) and the SaaS side (Commerce.com). The forks follow Adobe because they are forks of its open-source edition; Commerce.com comes last because its August 2026 report that replatforming is weak sets up the alliance's own rewrite. Putting the forks first would describe a fork of a product not yet introduced.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p26 | claim | Adobe, the community forks of its open-source edition and Commerce.com show the composable word being absorbed rather than adopted. |  |  |\n| p27 | evidence | Adobe Commerce now lists three deployment options and sells Commerce Optimizer to work alongside any backend, so composable has become a layer a suite vendor sells beside any backend. | fact: On-premises, cloud infrastructure (PaaS), Cloud Service (managed SaaS); Commerce Optimizer 'alongside an existing Adobe Commerce or third-party commerce backend'; partner reports for June 2025 launches. | `example`: The word absorbed. → The suite vendor. |\n| p28 | evidence | The Mage-OS fork gives a merchant the most freedom in the chapter and the longest patch chain: Adobe, then the distribution, then the agency, then the merchant. | fact: Organized 2021, incorporated 2022; releases 3.6.0 and 4.0.0 in October 2026; no shareholders; 216-plus financial contributors. | `contrast`: Adobe's managed options. → The community fork of its open-source edition. |\n| p29 | evidence | BigCommerce renamed itself Commerce.com in July 2025 with composable vocabulary and kept its engine, and a year later reported flat revenue and B2C replatforming 'softer than historically'. | fact: Rename 31 July 2025; Q2 2026 revenue $84.5 million, up 0.1%; 'remains softer than historically' (SEC exhibit, 6 August 2026). | `sequence`: The open-source side. → The SaaS side. |\n\n### The Alliance Rewrites Its Principles\n\n**Controlling idea** (`evidence`, id `alliance`): The alliance's own principles went from four words to five principles to three, dropping microservices and headless, the clearest evidence of the turn.\n\n**Advances the thesis** (S4): Records the correction in the movement's own words.\n\n**Transition in:** `emphasis`: Vendors absorbing the word. → The alliance rewriting it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | evidence | The alliance's stated principles changed from 'Microservices, API-first, Cloud-Native, and Headless' (2020, restated 2023) to five guiding principles, Composable, Connected, Incremental, Open and Autonomous (August 2025), to three, Open, Composable and Connected (November 2026). | table: Three dated rows quoting each formulation with its source. |  |\n| p31 | analysis | With microservices and headless gone and 'Incremental' added in 2025, the author's labeled reading is that the acronym outlived its expansion: what survives are properties a merchant can ask of any platform, and what was dropped were prescriptions about how the vendor's own software is built. | figure: Figure 2: an old signboard with two words crossed out beside a new board of three. | `cause_effect`: The three formulations. → What the change means for a merchant. |\n\n### What the Movement's Own Data Say\n\n**Controlling idea** (`evidence`, id `data`): The alliance's own 2026 survey, read as a commissioned survey, yields one finding against interest: 37% of respondents name integration complexity a primary concern.\n\n**Advances the thesis** (S4): Gives the cost line the promise left out from the movement's own data.\n\n**Transition in:** `additional_support`: The alliance's changed wording. → Its own survey data.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The survey's figures come first, then how to read them, then the vendor figures that point the same way with the same caveat and the absence of an independent study. Reading the survey before stating its figures would leave the caveats with nothing to qualify.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | evidence | The alliance's February 2026 report on a survey of 600 enterprise technology decision-makers gives favorable AI figures and also reports that 37% cite integration complexity as a primary concern. | statistic: 78% versus 13% clear AI ROI; 98% versus 33% AI at scale; 89% missing standards; 37% integration complexity; 45% privacy and security. |  |\n| p33 | analysis | Read as a survey commissioned by a vendor alliance with 'clear ROI' undefined, its usable finding is the one against interest: more than a third of respondents name integration complexity a primary concern, the cost line the 2020 promise left out. | reasoning: Commissioned; population includes adopters; ROI undefined. | `cause_effect`: The survey's figures. → How to read them. |\n| p34 | evidence | Shopware's integration figures point the same way with the same caveat, and no independent study with a stated method compares the total cost of an assembly with a hosted platform with layers, so the chapter's costs are judgment or illustration. | statistic: More than 15 tools; up to 52% of implementation effort. | `similarity`: The survey's finding against interest. → A vendor figure that points the same way, and the missing independent study. |\n\n### What Composable Actually Costs\n\n**Controlling idea** (`analysis`, id `costs`): A composable assembly carries the same bill as any platform plus lines the brochure assigns to nobody, all of which fall on the merchant's own team.\n\n**Advances the thesis** (S5): Turns the unsaid column into cost lines and shows who pays each.\n\n**Transition in:** `cause_effect`: No independent cost study. → The author's labeled cost table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | analysis | A cost table (the author's synthesis) sets a hosted platform with layers beside a composable assembly line by line, storefront, joins, upgrades, separate services, licenses, people and exit, and names who pays each. | table: Seven cost lines in two columns with who pays; 34 integrations at Kestrel & Pine; Saleor Cloud 0.8% above $200,000 a month.; figure: Figure 3: the merchant's own team at the centre owning the storefront and every join. |  |\n| p36 | example | Kestrel & Pine received such a proposal, an outside consultancy's composable rebuild of February 2027 at an illustrative three-year cost of about €3.2 million; with three storefront and app engineers of fourteen and a €14,000-a-month agency, a built storefront would need at least those engineers full time plus the agency before any of the 34 integrations were rebuilt, and the assembly would have more joins, all its own. | scenario: Ledger: fourteen in technology, three storefront and apps engineers, agency €14,000 a month, 34 integrations; the storefront staffing labeled an illustration. | `example`: The cost lines. → The February 2027 composable proposal to Kestrel & Pine, and its storefront line worked through. |\n\n### When Composable Is Right\n\n**Controlling idea** (`recommendation`, id `fit`): Composable is right under specific conditions, scale stage, differentiation, team shape, vendor count and reason to move, and a full assembly is a Group-stage choice while an Omnichannel merchant takes it one capability at a time.\n\n**Advances the thesis** (S5): States the conditions the record and the cost lines support.\n\n**Transition in:** `contrast`: The cost of a full assembly. → The conditions under which it is still right.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | claim | The record says composable was oversold to the wrong merchants, not that it is wrong, and a fit table gives the conditions under which it fits or limits. | table: Five situations: scale stage, differentiation, team shape, vendor count, reason to move. |  |\n| p38 | recommendation | The per-capability path, keeping the platform and adding a PIM, an OMS, search or an agentic layer as owned services, is what the vendors now sell and what an Omnichannel merchant can absorb; the full assembly is a Group-stage choice. | quotation: commercetools' July 2026 modules: 'without replacing their existing platforms'. | `conclusion_summary`: The fit table's conditions. → The path most merchants should take. |\n\n### What Kestrel & Pine Takes From It\n\n**Controlling idea** (`example`, id `kp`): Kestrel & Pine declined the consultancy's composable rebuild costed above and takes the per-capability path the vendors now sell, as Waypoint.\n\n**Advances the thesis** (S5): Applies the fit conditions to the book's merchant.\n\n**Transition in:** `example`: The per-capability path. → The book's merchant taking it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | example | Kestrel & Pine declined the proposal: Waypoint keeps the hosted platform (W4) while buying an OMS, availability and a PIM beside it, with the warehouse authoritative for stock and each integration owned under a contract (W5), the selective assembly the vendors now sell, revisited at the 2029 review. | scenario: W4 stay and surround; W1 stock ownership; W5 integration standards; 2029 review.; figure: Figure 4: the 2020 promise asked the merchant to build the storefront and own every join; the 2026 products from the same vendors attach a layer to a platform the merchant keeps. |  |\n\n### Where the Evidence Stops\n\n**Controlling idea** (`context`, id `evidence`): The record stops short of commercetools' and Shopware's reasons, Adobe's dates, the alliance's reasons, an independent cost study and some analyst placements.\n\n**Advances the thesis** (S6): Marks the limits of every case just read.\n\n**Transition in:** `contrast`: What Kestrel & Pine takes. → What the record could not establish.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | context (list) | Six limits: commercetools' reasons and unreconciled figures, Shopware's strategy and claims, Adobe's launch dates, the alliance's reasons and survey method, the absence of an independent cost study, and missing analyst placements. |  |  |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The movement's own record now answers the opening merchant: adopt search as one service beside the kept platform with a named owner for its joins; a full assembly replaces every join at once and pays only for a Group-stage merchant with platform and product teams, which is also what the movement's vendors sell by 2026.\n\n**So what:** A composable proposal is answered with questions about the storefront, each join's owner, version and renewal, reference customers within a factor of ten and the vendor's own products for kept platforms, before any product is compared; and, as Part XI's closing shows, any large-company example is tested by the discipline it shows and the size at which it was adopted.\n\n**Callback:** The hook's merchant that wants to replace its search service without replacing checkout and the catalog. p42 answers it: one service beside the kept platform with an owner for its joins to product identifiers, prices and stock; the full assembly is the Group-stage case.\n\n**Takeaway** (`course_of_action`): Ask the seven questions of any composable proposal; test any large-company example by its dated source, the discipline it shows and the machinery only that company needs; then start with the entity-owner table and the integration inventory from the toolkit for your own landscape.\n\n**Hand-off** to [Universal Commerce Protocol: A Beginner's Tutorial](ucp-beginners-tutorial.html): `example`: Part X's account of agentic commerce and the cases' evidence. → One protocol followed message by message.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | synthesis | The opening's merchant can now be answered from the movement's own record: adopt search as one service beside the kept platform, with an owner for its joins to product identifiers, prices and stock; a full assembly replaces every join at once and pays only for a Group-stage merchant, which is what the vendors themselves sell by 2026. | reasoning: The hook; commercetools' modules; the alliance's principles and survey; the cost and fit tables. |  |\n| p43 | synthesis (list) | Established: the 2020 definition and the 2026 principles without microservices or headless; the flagship's layers and modules after its 2025 cut; Shopware's move of integration and payments into a GMV-priced platform; the survey's 37%. |  | `elaboration`: The chapter's answer. → What is documented. |\n| p44 | analysis (list) | Depends on context: a full assembly fits a Group-stage merchant with product and platform teams; one capability as a separate service fits the Omnichannel stage when it has an owner; open source and composable are independent choices. |  | `contrast`: What is documented. → What depends on the merchant. |\n| p45 | synthesis (list) | The author's synthesis: the movement was right about properties and wrong about prescriptions, and the 2026 products of commercetools and Adobe, a kept core with layers beside it, are composable as it should have been sold. |  | `sequence`: What depends on context. → The author's view. |\n| p46 | recommendation (list) | Seven questions apply the chapter to a composable proposal: which words the proposer means, who runs the storefront, who owns each join, which capability can be one service beside the platform, which reference customer is near the merchant's size, what the vendor sells for kept platforms, and what stands behind each figure. |  | `cause_effect`: The take-aways. → The questions to ask of a proposal. |\n| p47 | synthesis | This chapter closes Part XI, which opened with the Giant's Boots: the four cases look like four architectures, but read for what each company wrote about its joins they give one answer, a contract at each join, one owner per fact and a reconciliation, with the shape around them sized to the company's own load, teams or customers. | reasoning: Shopify's webhook contract and dated withdrawals; Amazon's always-writeable cart and seller-of-record split; Zalando's 2025 read API and deprecation rules; the composable vendors' modules beside a kept platform. | `conclusion_summary`: The chapter's questions. → What the four cases of Part XI have in common. |\n| p48 | recommendation | Any large-company example cited in a design review can therefore be tested before it is copied: find the dated source, mark what it documents and what is inferred, and ask which discipline at a join it shows and at what size the company adopted the shape around it; for Kestrel & Pine each case's answer was a Waypoint decision already made (W1, W4, W5, W8) that changed none of its architecture. | scenario: W1 stock ownership, W4 stay and surround, W5 integration standards, W8 agent readiness (ledger). | `cause_effect`: The four cases' one answer. → The test for any example, and Kestrel & Pine's answers. |\n| p50 | synthesis | The book asked one question of a jacket order, a wholesale reorder, a peak day, an AI agent and four real companies, and got the same kind of answer each time: name the system that may make the promise and the system that must keep it. | reasoning: Parts IX to XI: the journeys, the decisions over time and the four cases. | `similarity`: The four companies' answer at their joins. → The same answer across the whole book. |\n| p51 | recommendation | Eva's five promises (this jacket, at this price, in stock, on Thursday, returnable) give the test for the reader's next decision before any product is compared: which promise is this, which system makes it and which system has to keep it; the place to start is the entity-owner table and the integration inventory in the toolkit. | scenario: Eva's five promises from the introduction; Tools 2 and 3 of the toolkit. | `example`: The book's one answer. → Eva's five promises as the test, and where to start. |\n| p52 | transition | For readers who want one join in full detail, the appendix takes Part X's account of agentic commerce and the cases' evidence down to one protocol followed message by message, and the reference pages follow it. |  | `sequence`: The book's closing. → The appendix and the reference pages. |\n\n## Non-goals\n\n- The platform categories, pricing models and the 2023-2026 timeline as a market map. See [Suites, SaaS, Open Source and Composable: The Platform Landscape in 2026](commerce-platform-landscape.html).\n- Composable as an engineering style, and the modular monolith and microservices evidence; Shopify's monolith; Zalando's microservices. See [Monolith, Modular Monolith, Microservices, Composable: What the Evidence Says](commerce-architecture-styles.html), [Case: Shopify, the Modular Monolith That Serves Millions of Merchants](case-shopify.html), [Case: Zalando, Microservices, Platform Strategy and the Return to Discipline](case-zalando.html).\n- The decision method and total cost of ownership; migration mechanics. See [Build, Buy or Assemble: Choosing and Changing Platforms](build-buy-or-assemble.html), [Moving Without Burning the Bridge: Replatforming and Migration](replatforming-and-migration.html).\n- Extension mechanisms and the Forked Platform; headless storefront delivery. See [Apps, Plugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html), [Delivering the Storefront: Themes, Headless, Rendering and Performance](storefront-architecture.html).\n- Agentic commerce protocols and their availability; the chapter names AgenticLift and 'Autonomous Commerce' only as evidence of the vendors' vocabulary. See [Assistants and Agents: AI in Commerce and What Is Real in 2026](ai-and-agentic-commerce.html), [Universal Commerce Protocol: A Beginner's Tutorial](ucp-beginners-tutorial.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-13** — Confirming round 3 ended ESCALATE (pass 20, fail 23, all remaining blocking failures draft faults). Cheap fixes applied after it without another round, so check-report.json is stale: the applicant figures tied to what they show (p08); a similarity lead-in for the Adobe section (p26); a lead-in sentence before the questions (p46); 'neither should you' replaced (p16); 'the other gap' clarified (p17); p40 points back to the costed proposal; Figure 4's caption names Waypoint. Remaining failures auto-resolved: the thesis paragraph after KEY POINTS and the 'Where we are in the order's journey' paragraph are house elements of every chapter (rule 10, the author's format stands); the <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
