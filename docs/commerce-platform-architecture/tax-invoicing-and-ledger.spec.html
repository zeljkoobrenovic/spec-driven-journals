<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/14-tax-invoicing-and-ledger/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (the thesis paragraph, a roadmap, a conclusion paragraph that answers the opening, and Part III's closing); these are listed under open_questions.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The three outcomes the commerce system owes finance (the right tax, a valid invoice, books that match the bank) and the documents that carry them, each with its owning system.\n- **Know:** The VAT rules that decide a rate: destination rates above the €10,000 One Stop Shop threshold, the reverse charge for EU business buyers with a valid VAT number, and tax-inclusive against tax-exclusive prices.\n- **Know:** The ledger entries for a consumer order paid through a payment provider, and why Kestrel & Pine recognizes revenue for goods at delivery.\n- **Believe:** The shop issues order confirmations; one system per legal entity issues invoices.\n- **Believe:** Nothing posts to the ledger from a webhook; the ledger is fed from documents.\n- **Be able to:** Split a tax-inclusive consumer total into net and VAT.\n- **Be able to:** Name the daily and monthly checks that prove the orders, the payouts and the bank agree.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer or integration lead who owns the connector between the shop and the ERP (Noor Visser and Ruben Alves at Kestrel & Pine). The finance director who closes the month (Sanne de Wit) is the second reader and should recognize her own problems.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its 2026 and January 2027 incidents in outline and the names of the sixteen failure patterns.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines (money, goods, returns), 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, business models and the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Part II: one owner per product attribute, prices selected once at order placement and frozen, discounts allocated to lines, gift cards and points as liabilities, available-to-promise and the exact commit at checkout.\n- From the earlier chapters of Part III: checkout creates the order once with its payment pending; the payment provider's four stages and its webhook; one writer and a key for every refund (the Double Refund); the order's one home with three status lines and goods status per shipment, split shipments (the Three-Status Order).\n\n**Does not yet know:**\n\n- VAT and its rates; tax-inclusive and tax-exclusive prices; the One Stop Shop and its €10,000 threshold; reverse charge and VIES; US sales tax and economic nexus; tax engine.\n- Invoice content, consecutive numbering, immutability, credit note, retention.\n- E-invoice, EN 16931, Peppol and its access points, the buyer reference (BT-10), state clearance.\n- Ledger, debit and credit, revenue recognition under IFRS 15, cut-off, refund liability, breakage, sub-ledger.\n- Payout report, settlement delay, three-way match, trace or batch reference.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given an order shipped in two parcels and invoiced only on 'order complete', the reader names what goes wrong and the invoicing rule that prevents it. *Probe:* An order of two items ships in two parcels a week apart; the ERP issues the invoice only when the warehouse reports the whole order complete. Using only this chapter: what goes wrong, and what is the rule? | `custom` | cold_reader | major |\n| AC-2 | Given a return of an invoiced and paid item, the reader names the documents that follow and says the invoice is not changed. *Probe:* A customer's €199 jacket was invoiced and paid; she returns it for a refund. Using only this chapter: which documents follow, and may the invoice be changed? | `custom` | cold_reader | major |\n| AC-3 | The reader can say why a payout differs from a day's sales and how finance shows that nothing is missing. *Probe:* The payment provider's payout for one sales day is smaller than that day's sales. Using only this chapter: why, and how does finance show that nothing is missing? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-6 | Given a tax-inclusive Dutch consumer total, the reader splits it into net and VAT. *Probe:* A Dutch consumer pays €60.50 for a jacket, price including VAT at the standard rate. Using only this chapter: what are the net amount and the VAT? | `custom` | cold_reader | minor |\n| AC-7 | The conclusion performs Part III's closing: it says what the part's four chapters show together (one problem, not four), why that matters before any product is bought, and returns to the part opening's shopper who has paid while the order still reads unpaid. | `custom` | rubric | minor |\n\n## Thesis\n\n**Question:** How does an order become tax, an invoice and entries in the books, and what does the commerce system owe finance?\n\n> **Claim:** An order becomes tax, an invoice and ledger entries through documents, not events: the tax is computed from three facts the shop owns (the ship-to address, the product's tax category, and whether the buyer is a consumer or a VAT-registered business) under rates kept in one place for every channel; the invoice is issued at dispatch for each shipment by one system per legal entity, numbered in one consecutive series, never edited and corrected only by a credit note that references it; and the ledger is posted from invoices, credit notes and the payment provider's payout reports. The commerce system owes finance the facts and identifiers those documents need (the tax basis frozen on the order, a shipment confirmation carrying the shipment id, the buyer references an e-invoice must carry, the order number passed to the payment provider, refunds from one writer), so that a monthly match of invoices, payouts and bank lines explains each difference.\n\n**Disputed by:** The view that the shop platform's order confirmation is the invoice, that tax is a rate the platform adds at checkout, and that the books can be posted from the platform's payment events as they arrive, with differences found by comparing monthly totals.\n\n**So what:** Order #1052877 sat 'Not invoiced' for six days because the invoice waited for an 'order complete' message that a short pick prevented and no report listed shipped orders without an invoice; the Double Refund's second refund referenced no credit note; Ardennes Trail Co. rejected a Peppol invoice for a buyer reference the B2B portal never asked for. A merchant that accepts the claim makes the ERP the only invoice issuer, invoices per shipment and builds the shipped-not-invoiced list and the refunds-against-credit-notes job first, before an OMS or a PIM.\n\n**How and why:** Rates depend on the destination country, the product category and the buyer's status, and change, so rates kept in several channels drift apart. A tax basis recomputed after the address or a rate changes no longer matches what the customer was shown, so the basis is frozen on the order and any difference listed. For goods the supply happens at dispatch, per shipment, so an invoice that waits for the whole order waits for the slowest line. The law requires a consecutive number unique to each invoice and an issued invoice kept unchanged for years, which only one issuing system per legal entity can guarantee. Where two systems can refund, both can refund the same return, so refunds come from one writer. A payout nets payments, refunds, fees and chargebacks from different days, so it never equals a day's sales and can be matched only line by line on identifiers carried from the order.\n\n**Supporting claims**\n\n- **S1** — The commerce system owes finance three outcomes (the right tax, a valid invoice, books that match the bank), carried by a handful of documents that each have one owning system: the shop issues order confirmations, not invoices, and nothing posts to the ledger from a webhook.\n- **S2** — Tax is decided by three facts the shop owns (ship-to address, product tax category, buyer status) under rates kept once for every channel; the figure shown at checkout is a promise and the figure on the invoice is the legal amount, so the basis is frozen on the order or recomputed, and any difference is listed, never left to drift.\n- **S3** — The invoice is a legal document: it has prescribed content and a consecutive number, is issued per shipment at dispatch by one system per legal entity, is never edited and is corrected only by a credit note that references it; for an e-invoice the same system holds the transmission status.\n- **S4** — The ledger is posted from documents and payout reports, not from payment events, and revenue for goods counts when control passes to the customer (at Kestrel & Pine, at delivery), with expected refunds and unredeemed gift cards held as liabilities.\n- **S5** — The books agree with the shop only when invoices and credit notes, payout reports and bank lines are matched line by line on identifiers the order passes along (the order number given to the payment provider, the batch or trace reference on the bank line), with two daily checks: shipped orders without an invoice, and provider refunds against credit notes.\n\n## Role in the part\n\nFollows the order into the documents that finance and the tax authorities rely on, extends the one-writer and key rules to invoices and credit notes, and performs the part's closing (the published chapter does not yet do so: it ends with the hand-off to Part IV only). Supports P3-3, P3-5, P3-6 of part `part-3`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene, then owes: Sanne's close and her two questions, then the outcomes and owners that answer them; `chronological` in vat to reconciliation: the documents in the order an order produces them (tax at checkout, invoice at dispatch, ledger entries, the monthly match); `comparison` in choices and stages)\n\nSanne's close comes first so every term arrives as part of the answer to her two questions. What the shop owes finance comes next because it names the documents and their owners, which every later section uses. VAT precedes tax at checkout and at invoice because the two moments apply the rules VAT supplies; tax at invoicing leads into the invoice, which must be understood as a legal document before the e-invoice, its structured form, and before the ledger, which is posted from it. Reconciliation follows the ledger because it proves the entries agree with the money. The choices come after all the rules because each choice is a way of applying them, and the stages after the choices because they say which answer fits when. The worked example comes after the choices so that it can show the recommended answers at work (before them, its daily batch, per-shipment invoice and refund-versus-credit-note job would be remedies with no names), and the failures come last because each is read against the rule that prevents it. Moving the owner table after VAT would leave the tax, invoice and ledger sections referring to owners not yet named; moving the invoice after the ledger would post entries from a document the reader has not met; moving reconciliation before the ledger would match entries that have not been explained.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A customer pays for an order, but the amount that reaches the merchant's bank is smaller, because the payment provider deducted a fee; a later refund changes it again, and finance has to explain the difference from the tax, the invoice, the fee, the refund and the bank receipt.\n\n**Bridge:** Anyone who has compared a payment with a bank statement knows that the two rarely show the same number on the same day. → For a merchant with hundreds of thousands of orders a year the difference can only be explained if each order leaves documents with identifiers, so the question becomes which documents, issued by which system, and how they are matched.\n\n**Thesis statement** (KEY POINTS callout and paragraph p04): An order reaches the books through documents, not events: tax decided by facts the shop owns under rates kept once, an invoice per shipment from one issuer that is never edited and corrected only by a credit note, and ledger entries posted from those documents and the payout reports; the shop owes finance the facts and identifiers those documents need, so that a monthly match of invoices, payouts and bank lines explains each difference.\n\n**Roadmap** (Paragraph p05):\n\n- Start from Sanne de Wit's April close and the two questions she asks. *Kept in:* scene.\n- Say what the shop owes finance and which system owns each document. *Kept in:* owes.\n- Explain VAT and the two moments at which tax is computed, at checkout and at invoicing. *Kept in:* vat, checkout-invoice.\n- Treat the invoice as a legal document, then the e-invoice. *Kept in:* invoice, e-invoicing.\n- Show what the ERP posts to the ledger and how invoices, payouts and the bank are matched. *Kept in:* ledger, reconciliation.\n- Compare the choices and say how they change with scale. *Kept in:* choices, stages.\n- Work Eva's order and Ardennes Trail Co.'s Peppol invoice through, then list what goes wrong. *Kept in:* example, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A payment that reaches the merchant's bank smaller than what the customer paid, and changed again by a later refund, can be explained only if finance can connect the tax, the invoice, the fee, the refund and the bank receipt; without those links it is rebuilt in spreadsheets. | scenario: One payment reduced by the provider's fee and later by a refund. |  |\n| p02 | evidence | Kestrel & Pine has to explain this for 293,000 online orders, 43,000 marketplace orders, 118,000 store transactions and 9,400 wholesale orders a year across three countries, which manual explanation cannot do. | statistic: 293,000 online orders, 43,000 marketplace orders, 118,000 store transactions, 9,400 wholesale orders a year, three countries. | `cause_effect`: Explaining a difference by connecting the documents of one payment. → The volume at which that must happen at Kestrel & Pine. |\n| p03 | context | The previous chapter left Eva's order with one home and its goods status per shipment; from dispatch onward each shipment produces financial records (an invoice, a payout, ledger entries and any return adjustments), which finance reconciles and reports in the Dutch VAT return. |  | `sequence`: The volume of orders whose money must be explained. → Where Eva's order stands in its journey, picking up the previous chapter's order with goods status per shipment. |\n| p04 | claim | The chapter's answer is that an order reaches the books through documents, not events: tax from three facts the shop owns under rates kept once, an invoice per shipment from one issuer that is never edited, ledger entries posted from those documents and the payout reports, and identifiers passed along so that a monthly match explains each difference. |  | `cause_effect`: The financial records each shipment produces. → The claim about how those records must be made so that the books agree with the shop. |\n| p05 | transition | The chapter starts from Sanne de Wit's April close, says what the shop owes finance, explains VAT and the two moments tax is computed, treats the invoice and the e-invoice, shows the ledger entries and the reconciliation, compares the choices and the scale stages, works Eva's order and a Belgian wholesale invoice over Peppol through and ends with what goes wrong; its evidence is EU and national tax rules, payment-provider and ERP documentation and Kestrel & Pine's month-end. | source: Links to commerce-payments, edi-and-e-invoicing, erp-and-back-office-integration, payments-to-ledger and designing-financial-ledgers for further detail. | `sequence`: The chapter's claim. → The order in which the chapter argues it and the kind of evidence it uses. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: Sanne's April Close\n\n**Controlling idea** (`example`, id `scene`): Sanne de Wit's April 2027 close has four payment routes to reconcile, two unresolved winter incidents and a new Peppol obligation, and it leads her to ask which system may issue an invoice and how the orders, payouts and bank can be proved to agree every month.\n\n**Advances the thesis** (S1, S3, S5): Gives the case the chapter answers: incidents caused by an invoice that waited, a refund that referenced nothing and an e-invoice missing a field, and the two questions the thesis answers.\n\n**Transition in:** `example`: The chapter's claim and roadmap, which start from Sanne's April close. → The close itself.\n\n**Order of paragraphs** (`chronological`): The routine of the close (four routes, each with its own matching rules) first, then the incidents in the order they matter to it, then what is new, then the rejection that turns all of it into two questions: the questions only make sense once the reader has seen what went wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | description (list) | Sanne de Wit closes April 2027 in the second week of May, and four payment routes must reconcile with the ERP, each with its own matching rules: the online payment service provider's daily batches, the store terminal provider, three marketplaces and 1,100 wholesale accounts on 30-day terms. | scenario: About thirty PSP batches of 800 orders (assumption); six stores; three marketplaces; 1,100 wholesale accounts, some paying short, twice or with unmatched references. |  |\n| p08 | example | January's Double Refund sent €19,400 twice across 212 returns, once through the portal and once through support, and nobody compared the ERP's credit notes (the documents that correct an invoice after a return), which were correct, with the actual refunds. | case: Double Refund: 212 returns, €19,400, portal plus support. | `contrast`: The four routes of the routine close. → The first of two unresolved incidents. |\n| p09 | example | December's Three-Status Order, #1052877, showed Delivered while the ERP waited six days to invoice, because the warehouse could not report 'order complete' until the missing socks were replenished and no report listed the dispatched fleece as uninvoiced. | case: Order #1052877, six days Not invoiced, 'order complete' trigger blocked by a short pick. | `additional_support`: The Double Refund. → The second incident. |\n| p10 | context | New since 1 January 2026, businesses established in Belgium must exchange invoices as structured documents over Peppol; whether that reaches a supplier without a Belgian establishment is not settled by the sources, but Kestrel & Pine's Belgian business customers expect it, so its ERP sends Peppol invoices through its EDI provider's access point. | fact: Belgian B2B e-invoicing mandate from 1 January 2026, hedged for a supplier without Belgian establishment. | `contrast`: Two old incidents. → Something new: the Peppol obligation. |\n| p11 | context | In April Ardennes Trail Co. rejected an invoice for a missing buyer reference, and Sanne asks Noor which system is allowed to issue an invoice and how to prove every month that orders, payouts and bank agree without reading them one by one. | case: Ardennes Trail Co., Namur, rejected an invoice for a missing buyer reference. | `example`: The Peppol obligation. → Its first failure, and Sanne's two questions. |\n\n### What the Commerce System Owes Finance\n\n**Controlling idea** (`claim`, id `owes`): The shop owes finance three outcomes (the right tax, a valid invoice, books that match the bank), each carried by documents with one owning system, from which two rules follow: the shop does not issue invoices, and nothing posts to the ledger from a webhook.\n\n**Advances the thesis** (S1): States the first supporting claim and the two rules the rest of the chapter applies.\n\n**Transition in:** `problem_solution`: Sanne's two questions. → The outcomes and owners that answer them.\n\n**Order of paragraphs** (`large_to_small`): Outcomes, then the documents that carry them, then the two rules the documents imply, then what the shop must supply to those documents; the rules cannot be stated before the table names the owners, and the inputs only make sense once the rules say the shop does not issue the documents itself.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | claim | In business terms the shop owes finance three outcomes, each enforced by someone outside it: the right tax (tax authorities), a valid invoice (auditors and business customers) and books that match the bank (auditors and the board). |  |  |\n| p13 | description | A handful of documents carry those outcomes, and each has one owning system: the order, the tax calculation, the invoice, the credit note, the payment event, the payout report and the ledger entries. | table: Document entity–owner table: created when, owner (system of record), references. | `elaboration`: The three outcomes. → The documents that carry them and their owners. |\n| p14 | claim | Two rules follow from the table and carry the rest of the chapter: the shop issues order confirmations, not invoices, and nothing posts to the ledger from a webhook, because the ledger is fed from documents in batches with traceable identifiers. |  | `cause_effect`: The entity–owner table. → The two rules it implies. |\n| p14a | claim | What the shop owes finance is therefore the facts and identifiers those documents need: the tax basis frozen on the order, a shipment confirmation carrying the shipment id, the buyer references an e-invoice must carry, the order number passed to the payment provider, and refunds from one writer. |  | `cause_effect`: The two rules: the ERP issues invoices and the ledger is fed from documents. → The inputs the shop must supply to those documents. |\n\n### VAT in Plain Words\n\n**Controlling idea** (`definition`, id `vat`): Five facts about VAT decide the rate on a sale: rates differ by country and category, prices are stored tax-inclusive or tax-exclusive, cross-border consumer sales are taxed at the destination, business sales to another EU country are reverse-charged, and the United States has state sales tax instead.\n\n**Advances the thesis** (S2): Supplies the rules that make the three facts the shop owns decisive and that make rates something to keep in one place.\n\n**Transition in:** `elaboration`: The right tax as the first outcome, and the tax calculation document. → What decides that tax.\n\n**Order of paragraphs** (`grouping`): The five facts are parallel; rate and basis come first because the cross-border and business rules change which rate and basis apply, and the US comes last as the contrast that explains tax engines.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | transition | Five facts about VAT carry the chapter. |  |  |\n| p16 | evidence | Rates differ by country and by product category: EU law sets a 15% minimum standard rate and allows reduced rates, and Kestrel & Pine's three markets charge 21%, 19% and 21% as standard. | table: VAT rates for the Netherlands, Germany and Belgium with sources. | `sequence`: The announcement of five facts. → The first fact. |\n| p17 | explanation | Kestrel & Pine's clothing and equipment carry the standard rate everywhere. |  | `example`: Rates by country and category. → Which rate applies to Kestrel & Pine's products. |\n| p18 | definition | Every stored price must declare whether it includes VAT (Eva's €199) or excludes it (the €95 wholesale price), so that checkout and invoicing compute the same total. | source: Stripe Tax documentation: inclusive common for B2C outside the US, exclusive for the US, Canada and B2B; tax behavior cannot be changed after creation. | `sequence`: The rate. → The second fact: the price's tax basis. |\n| p19 | explanation | Above €10,000 a year of cross-border EU consumer sales a merchant charges the destination country's VAT and reports it through the One Stop Shop, so Kestrel & Pine must know the destination rate per product category at checkout. | fact: OSS since 1 July 2021, €10,000 threshold; Kestrel & Pine's €8.5 million of Belgian and German online sales. | `sequence`: The price's basis. → The third fact: where a consumer sale is taxed. |\n| p20 | explanation | A business sale to another EU country to a buyer with a VIES-checked VAT number carries 0% VAT and the buyer accounts for it (the reverse charge), which is Ardennes Trail Co.'s case. | source: Your Europe cross-border VAT page: reverse charge and VIES. | `contrast`: Consumer sales taxed at the destination. → Business sales, where the buyer accounts for the VAT. |\n| p21 | comparison | The United States has no VAT but state sales taxes that a remote seller must collect above a state's threshold since Wayfair, across thousands of jurisdictions, which is why tax engines exist. | fact: South Dakota v. Wayfair (21 June 2018), $100,000 or 200 transactions; Avalara's '12,000+' jurisdictions claim. | `contrast`: The EU rules. → The US contrast. |\n\n### Tax at Checkout and Tax at Invoice\n\n**Controlling idea** (`explanation`, id `checkout-invoice`): The tax shown at checkout is a promise and the tax on the invoice is the legal amount, so the order system either recomputes at invoicing or freezes the checkout basis, and in both cases lists any difference instead of letting the two drift.\n\n**Advances the thesis** (S2): Shows why the tax basis is frozen on the order and differences are listed.\n\n**Transition in:** `cause_effect`: The facts that decide the rate. → The two moments at which they are applied.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | explanation | The checkout tax is a promise computed from the facts at that moment and the invoice tax is computed when the supply happens (for goods, at dispatch), so the order system must either recompute at invoicing (suited to addresses and baskets that change before dispatch) or freeze the checkout basis and reconcile (suited to a consumer shop that ships whole orders within a day; Kestrel & Pine freezes and lists any difference at invoicing), and never let the two drift silently. | table: Requirements of the two tax flows: freshness, consistency, speed and fallback.; figure: Figure 1: three facts the shop owns and one set of rules decide the tax, once as a promise at checkout and once as the legal amount on the invoice. |  |\n| p23 | explanation | When a cart mixes rates, shipping and basket-wide discounts must be split across lines, which decides what the credit note for one returned line is worth. | source: Stripe Tax: proportional allocation and the highest rate. | `elaboration`: Tax computed per order. → Tax split across lines with different rates. |\n\n### The Invoice as a Legal Document\n\n**Controlling idea** (`claim`, id `invoice`): An invoice has prescribed content and a consecutive number, is never edited, is corrected only by a credit note that references it, is issued per shipment and is kept for years, so one system per legal entity, outliving the shop platform, must issue it.\n\n**Advances the thesis** (S3): Derives each architectural rule for invoicing from the law's requirements.\n\n**Transition in:** `time`: Tax computed at invoicing. → The invoice it is computed for.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The law's content first, then each rule derived from it, ending with retention, which settles which system owns the invoice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | definition | An invoice's content is prescribed by law, and German law requires a consecutive number unique to the invoice. | source: Belastingdienst invoice requirements; § 14 UStG 'eine fortlaufende Nummer'. |  |\n| p25 | transition | Three properties follow from that content, and a fourth rule follows from the date of supply; each is an architectural rule. |  | `cause_effect`: The legal content of an invoice. → The rules it imposes on the system that issues it. |\n| p26 | claim | Because the number is sequential and gap-free within its series, the system of record assigns it when the invoice is posted, never pre-allocated by checkout or reused from an order sequence with cancellations. |  | `sequence`: The announcement of the rules. → The first: numbering. |\n| p27 | claim | An issued invoice is never edited, because finance needs a lasting record of what was billed; an ERP assigns the number on confirmation and then prevents edits. | source: Odoo 18.0 documentation: draft, number on confirmation, no edits. | `sequence`: Numbering. → The second rule: immutability. |\n| p28 | claim | A correction is a credit note that references the invoice, reverses some or all of its lines and has its own number, and a return produces a credit note and a refund that references both, which reconcile to zero. | quotation: Odoo: 'issuing a credit/debit note is the only legal method for canceling, refunding, or modifying a validated invoice'.; case: The Double Refund's second refund referenced nothing.; figure: Figure 2: locked invoice and its credit note. | `cause_effect`: An invoice that cannot be edited. → How it is corrected instead. |\n| p29 | claim | Kestrel & Pine issues one invoice per shipment, dated at its dispatch and keyed on the shipment id, because the supply happens per shipment and an invoice that waits for the whole order waits for the slowest line, as #1052877 did. | case: #1052877 Not invoiced for six days. | `sequence`: The three properties of the document. → The fourth rule, from the date of supply: when to issue it. |\n| p30 | evidence | Invoices are kept for seven to ten years, so the invoice must outlive the shop platform, one reason the ERP is its system of record. | fact: Seven years NL basic records; eight years invoices (§ 14b UStG); ten years books (§ 147 AO). | `additional_support`: Rules for issuing and correcting. → How long the invoice must be kept, and what that says about its owner. |\n\n### E-Invoicing at a Glance\n\n**Controlling idea** (`explanation`, id `e-invoicing`): An e-invoice is structured data sent over a network such as Peppol under dates that differ per country, and the system that issues it must also hold its transmission status and archive.\n\n**Advances the thesis** (S3): Extends the one-issuer rule to the e-invoice's transmission status.\n\n**Transition in:** `elaboration`: The invoice as a legal document. → The same document sent as structured data.\n\n**Order of paragraphs** (`prerequisite_order`): Definition, then dates, then ownership; ownership of the status makes sense only once the reader knows an e-invoice is sent and can be rejected.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | definition | An e-invoice is an invoice issued, sent and received as structured data defined by EN 16931, exchanged over Peppol through each side's access point; a PDF by e-mail is not one. | source: OpenPeppol. |  |\n| p32 | evidence | The mandate dates differ per country: Belgium from 1 January 2026, German receipt since 2025 and issuing from 2027 or 2028, a Dutch plan for 1 July 2030 and ViDA's cross-border reporting from 1 July 2030. | fact: einvoice.belgium.be 2024; BMF FAQ; Rijksoverheid 11 September 2026; European Commission ViDA. | `sequence`: What an e-invoice is. → When it becomes required where. |\n| p33 | claim | Because an e-invoice has a transmission status a PDF never had, the system that issues it, the ERP at Kestrel & Pine, must hold that status and the archive, and Ardennes Trail Co.'s rejection for a missing buyer reference was a checkout gap, not a finance one. | case: Ardennes Trail Co.'s rejection: BT-10 never asked for by the B2B portal. | `contrast`: Formats and dates. → What matters for this chapter: ownership. |\n\n### From Order to Ledger: What Gets Posted\n\n**Controlling idea** (`explanation`, id `ledger`): The ERP posts standard entries from documents, and three accounting rules sit under them: revenue counts when control passes (at Kestrel & Pine, at delivery), a right of return is a liability, and gift cards are liabilities until redeemed.\n\n**Advances the thesis** (S4): Shows the postings from documents and the rules that decide when revenue counts.\n\n**Transition in:** `sequence`: The documents: invoice, credit note, e-invoice. → What the ERP posts from them.\n\n**Order of paragraphs** (`large_to_small`): The entries first, then the rules that govern them; the cut-off follows the revenue rule because it is that rule applied to an invoice issued at dispatch.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | definition | The general ledger records every transaction as a debit and a credit, and the ERP posts a consumer order's invoice, payout, credit note, chargeback and gift-card sale as standard entries from documents; the invoice posts revenue at dispatch and a month-end cut-off aligns it with the revenue rule below. | table: Journal entries for invoice at dispatch, payout, credit note, chargeback, gift card sold. |  |\n| p35 | transition | Three accounting rules sit under the table. |  | `elaboration`: The entries. → The rules that decide their timing and nature. |\n| p36 | claim | Under IFRS 15, revenue is recognized when control of the goods passes to the customer, not when the order is placed or paid. | source: IFRS 15, effective 1 January 2018. | `sequence`: The announcement of three rules. → The first: when revenue counts. |\n| p37 | example | Kestrel & Pine recognizes consumer and wholesale revenue at delivery, so 'shipped' is the operational milestone, not the accounting one. | fact: Revenue at delivery (D2C) and at delivery to the customer's shop or DC (wholesale). | `example`: The IFRS 15 rule. → Kestrel & Pine's application of it. |\n| p38 | cause_effect | Because the invoice is issued at dispatch and revenue counts at delivery, finance adjusts at month end for parcels invoiced but not yet delivered, which is why the shop's daily sales and the ledger never agree to the euro. | example: Shipped 30 April, delivered 3 May: May revenue on an April invoice. | `cause_effect`: Revenue at delivery with the invoice at dispatch. → The month-end adjustment that gap requires. |\n| p39 | claim | A right of return is a liability: with a 19% order return rate, expected refunds are estimated at period end. | statistic: 19% order return rate. | `sequence`: The first rule and its consequences. → The second rule. |\n| p40 | claim | Gift cards are liabilities until redeemed, with breakage rules that depend on the jurisdiction, and only one system may change a gift-card balance. | example: A €50 gift card is €50 owed.; figure: Figure 3: documents, not events, feed the ledger. | `sequence`: The second rule. → The third rule. |\n\n### Reconciliation: Orders, Payouts and the Bank\n\n**Controlling idea** (`process`, id `reconciliation`): Reconciliation proves that the ERP's documents, the payment provider's payout reports and the bank statement agree line by line, which works only when the order number is passed to the provider and the batch or trace reference reaches the bank line.\n\n**Advances the thesis** (S5): Shows the match and the identifiers it needs, and the daily job that would have caught the Double Refund.\n\n**Transition in:** `cause_effect`: Entries posted from documents and payout reports. → The proof that those entries agree with the money.\n\n**Order of paragraphs** (`prerequisite_order`): Definition, the identifiers and mismatches, then the incident: the fix makes sense only once the reader has the row it belongs to.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | definition | Reconciliation is proving that two records of the same money agree line by line and explaining every difference; commerce matches three: invoices and credit notes, payout reports and the bank statement. | figure: Figure 4: three strips joined on shared keys with one unmatched line. |  |\n| p42 | evidence | Payment providers' payout reports list every transaction in a payout and carry the merchant's order reference and a batch or trace reference that matches the bank line, so a merchant that does not pass its order number can reconcile only totals. | source: Stripe payout reconciliation report and trace_id; Adyen batch-level reconciliation; Mollie settlement report.; table: What does not match, why, and how to catch it (five rows). | `elaboration`: The three-way match. → The identifiers it runs on. |\n| p43 | example | The Double Refund is the table's third row, and its fix had two parts: one writer for refunds and a daily comparison of provider refunds with credit notes. | case: Double Refund fix from February 2027. | `example`: The mismatch table. → The incident it explains and its fix. |\n\n### The Choices\n\n**Controlling idea** (`comparison`, id `choices`): Three decisions shape the handoff (where tax is computed, where the invoice is issued, how the ledger learns), each with a simplest, usual and scaled answer, and the usual answer fits Kestrel & Pine's stage.\n\n**Advances the thesis** (S2, S3, S4): Turns the rules into choices a merchant makes and recommends one per row.\n\n**Transition in:** `problem_solution`: The rules for tax, invoices, entries and the match. → The decisions a merchant makes to apply them.\n\n**Order of paragraphs** (`comparison`): Three decisions on the same three answers, then the recommendation; the table needs all three decisions named first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | transition | Three decisions shape the handoff, each with three realistic answers. |  |  |\n| p45 | comparison | Tax can be computed in the shop platform's rate tables, in a tax engine called from checkout and invoicing (necessary for the United States), or in the ERP at invoicing only, which is wrong for a consumer shop. |  | `sequence`: The announcement of three decisions. → The first: where tax is computed. |\n| p46 | comparison | The invoice can be issued by the shop platform, the ERP, or an invoicing service in front of several ERPs where some countries run state clearance. |  | `sequence`: Where tax is computed. → The second decision: where the invoice is issued. |\n| p47 | comparison | The ledger can learn from one posting per paid order, from documents in a daily idempotent batch, or from summary journals with detail in a sub-ledger. | table: Simplest, usual and scaled answer per decision, with risks. | `sequence`: Where the invoice is issued. → The third decision: how the ledger learns. |\n| p48 | recommendation | The author recommends the usual answer in each row for a merchant at Kestrel & Pine's stage, including a job that lists orders that should have been invoiced and were not, the job whose absence left the Three-Status Order uninvoiced. |  | `conclusion_summary`: The three decisions and their answers. → The recommended answer for this merchant. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): The shape of the handoff (documents, identifiers, one issuer, one match) does not change with scale; the number of feeds and legal entities does, and with it whether anyone can still match by eye.\n\n**Advances the thesis** (S1, S5): Shows that the documents and the match are constant and only their number grows.\n\n**Transition in:** `elaboration`: The recommended answers. → How the answers change from stage to stage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p49 | analysis | The shape of the handoff does not change with scale, only the number of feeds and legal entities, and Kestrel & Pine's answer is Waypoint's integration standard W5: finance by daily batch with a reconciliation job per flow. | table: Four stages: typical, necessary, warning signs. |  |\n\n### Eva's Order in the Books, and Ardennes Trail Co.'s Peppol Invoice\n\n**Controlling idea** (`example`, id `example`): Eva's order and Ardennes Trail Co.'s wholesale order show every rule at work: the tax basis frozen on the order, an invoice per shipment at dispatch, a payout matched on the batch reference, a credit note for the exchange, and a reverse-charge Peppol invoice with the buyer reference.\n\n**Advances the thesis** (S2, S3, S4, S5): Applies the chapter's rules to one consumer and one business order, step by step.\n\n**Transition in:** `example`: The rules and the recommended answers. → Two orders worked through with them.\n\n**Order of paragraphs** (`chronological`): Each order in the order its documents appear: tax, payment, invoice, payout, return; then the business order, which reuses the steps with a different tax rule and channel.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | example | Eva's €235 order #1072455, placed on 13 April 2027, includes 21% VAT, so its tax basis frozen at checkout is €194.21 net and €40.79 VAT. | table: Line split: jacket €164.46 + €34.54, socks €29.75 + €6.25, total €194.21 + €40.79. |  |\n| p51 | example | iDEAL moves the money when Eva confirms in her bank app and the provider's webhook marks the order paid, at an assumed fee of about €0.30. | scenario: PSP fee about €0.30 (assumption). | `time`: The tax basis at checkout. → The payment seconds later. |\n| p52 | example | On 14 April the warehouse confirms the shipment, the ERP connector's daily batch creates invoice 2027-041822 and posts it, and the revenue is April's because the parcel was delivered on 15 April. | scenario: Invoice 2027-041822 (illustrative); entries €235.00 / €194.21 / €40.79. | `time`: The payment. → The dispatch and invoice the next day. |\n| p53 | example | The provider's payout two business days after the sales day contains Eva's €235 among some 800 orders net of fees, is posted from the provider's report, and the bank line's batch reference ties the three records together at the May close. | scenario: Two-business-day payout (assumption); about 800 orders per batch.; figure: Figure 5: Eva's order to the ledger with the order number and batch reference as keys. | `time`: The invoice. → The payout. |\n| p54 | example | Eva's exchange is a credit note referencing invoice 2027-041822 for the jacket line plus a new invoice for size L, with no money moving; in the refund variant the returns portal refunds €199 and the daily job sees one refund and one credit note. | scenario: Exchange received 22 April; credit note €164.46 + €34.54. | `time`: The payout. → The return a week later. |\n| p55 | example | Ardennes Trail Co. orders 40 Ridgewalker jackets at €95 (€3,800 excluding VAT) on 21 April 2027; with its VAT number validated in VIES the order is an intra-EU business supply at 0% with the reverse-charge mention, on 30-day terms with no payment provider. | scenario: 40 × €95 = €3,800, Namur, bpost. | `contrast`: A consumer order paid through a provider. → A business order on terms, invoiced over Peppol. |\n| p56 | example | The ERP issues the invoice at dispatch on 23 April from the same Dutch sequence, with both VAT numbers, the buyer reference and the order number, and sends it as a Peppol BIS Billing 3.0 invoice, recording the delivery receipt. | scenario: Invoice of 23 April with both VAT numbers, BT-10 and the order number, Peppol BIS Billing 3.0, delivery receipt recorded. | `time`: The wholesale order. → Its invoice at dispatch. |\n| p57 | example | The entry is a €3,800 trade receivable against revenue with no VAT, cleared when the bank transfer quoting the invoice number arrives by 23 May, and the supply is reported in the intra-EU sales listing. | scenario: €3,800 trade receivable, no VAT, due 23 May; intra-EU sales listing. | `time`: The invoice. → Its posting and payment. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`evidence`, id `wrong`): Five failures recur (tax that differs, the invoice that never came, the invoice that came twice, the mandate discovered late, and the refund that doubled with the payout that does not match), and each is detected by a list or job and recovered by a document, never an edit.\n\n**Advances the thesis** (S3, S5): Shows that every failure is a document issued by the wrong system, twice or without a reference, and is caught by a comparison.\n\n**Transition in:** `contrast`: The two orders that went right. → What goes wrong and how it is detected.\n\n**Order of paragraphs** (`grouping`): Tax first, then the invoice, then the e-invoice, then the money: the order of the chapter's own sections, so each failure is read against the rule that prevents it, and the section ends on the reconciliation that catches what the rules miss.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p60 | process | When invoice VAT differs from checkout VAT, the frozen basis is compared with the invoice at posting; the invoice is right, and any promise of a lower gross price is a commercial discount. |  |  |\n| p58 | process | An invoice that waits for a trigger that never arrives leaves an order Delivered and Not invoiced for days; a daily list of shipped orders with no invoice detects it, and an idempotent per-shipment trigger recovers it. |  | `contrast`: The tax that differs. → The invoice that never came. |\n| p59 | process | A connector retry that creates two invoices for one order is detected as two invoices with one order number, recovered with a credit note rather than a deletion, and prevented with an idempotency key per shipment. |  | `contrast`: The invoice that never came. → The invoice that came twice. |\n| p62 | process | A mandate discovered late, when a customer rejects a PDF, is detected by a regulatory calendar with an owner, and an access point in front of the ERP is usually faster than the partner's quote; the Long Fuse is a governance failure. |  | `elaboration`: Invoices issued late or twice. → The e-invoice: a mandate discovered late. |\n| p61 | process | The doubled refund and the unmatched payout are the reconciliation table's rows: one refund writer, a daily comparison in both directions and every residual investigated in the same month. |  | `sequence`: Failures of the documents. → The money failures, already in the reconciliation table. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Sanne's two questions have one answer: the ERP alone issues invoices and credit notes, per shipment and with references, and the proof that orders, payouts and bank agree is a match on identifiers the order passes along; every failure in the chapter is a document issued by the wrong system, twice or without a reference. For the part: Eva's order created while its payment was pending, the Double Refund, the Three-Status Order and the invoice that waited six days look like four problems in four systems and are one: after the cart each fact about an order is first known by a system the merchant does not control and reaches the others by message, so the systems agree only where there is one home with three status lines, one writer per money action or document, a business key on every message and a comparison of every copy with its source.\n\n**So what:** The remedies are rules, not purchases: the ERP as the only invoice issuer, one invoice per shipment, a daily list of shipped orders without an invoice and a daily comparison of refunds with credit notes, built before an OMS or a PIM; for the part, a read-only provider console, the return id as the refund's key and a decision about the order's home before the OMS was bought. A reader can list the writers, keys and comparisons of their own order flow before any product is discussed.\n\n**Callback:** The introduction's payment that reaches the bank smaller than what the customer paid; and, for the part, the part opening's shopper who has paid while the order still reads unpaid, the warehouse that cannot tell whether to dispatch and support that cannot answer. Paragraph p63 explains the smaller payout from the documents and identifiers; p68 returns to the part opening's paid-but-unpaid order and, with p69, performs the part closing.\n\n**Takeaway** (`course_of_action`): For one order at your own company, name the system that creates it, the one that knows whether it is paid, the one that holds its status per shipment and the one that issues its invoice, with the key and the comparison at each handoff; start with the list of shipped orders without an invoice and the daily comparison of the provider's refunds with credit notes.\n\n**Hand-off** to [Part IV — FULFILLMENT: From Warehouse to Doorstep and Back](part-4.html): `sequence`: The order record and the payment taken. → The physical work that has to match the record: picking, shipping, delivery and the way back.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p63 | synthesis | The payout that reached the bank smaller than what the customer paid is explained when each order leaves documents with identifiers: the ERP alone issues invoices and credit notes per shipment, the payout report lists the fees and refunds, and the order number and batch reference let the monthly match show where every euro went, which is why the shop owes finance those facts and identifiers; that answers Sanne's two questions. | reasoning: The opening's smaller payout and Sanne's two questions set against the chapter's answer. |  |\n| p64 | synthesis (list) | Established: VAT follows the destination above the OSS threshold and is reverse-charged for EU business buyers; an invoice has prescribed content and a gap-free number, is immutable and corrected only by a credit note; revenue counts at transfer of control; and the e-invoicing dates are set. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what the sources establish. |\n| p65 | synthesis (list) | Depends on context: whether rate tables or a tax engine, which issuer, which ledger shape, and whether to recompute or freeze the tax basis depend on countries, categories, stage, volume and how often baskets change before dispatch. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p66 | recommendation (list) | The author's synthesis: the order-to-ledger handoff is a small set of documents with stable identifiers, and the shipped-not-invoiced list and the refunds-against-credit-notes job are worth more than any finance dashboard and should be built first. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p67 | recommendation (list) | Seven questions let the reader find, in their own company, the invoice issuer and its numbering, the invoice moment, the tax facts and rate copies, OSS, the order number at the provider, the payout feeds and their owners, and the e-invoicing mandates. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own company. |\n| p68 | synthesis | Part III opened with a shopper who had paid while the order still read unpaid, and its four chapters' cases (Eva's order created while her payment was pending, the Double Refund, the Three-Status Order, and Sanne's April close with its rejected Peppol invoice) are one problem: each fact about an order is first known by a system the merchant does not control and reaches the others by message. | reasoning: The part opening's paid-but-unpaid order set against the four chapters' cases. | `conclusion_summary`: This chapter's answer about invoices and the books, the last handoff of the order. → What the four chapters of Part III say together, set against the part opening. |\n| p69 | recommendation | The systems agree only where there is one home with three status lines, one writer per money action or document, a business key on every message and a comparison of every copy with its source, and most of Kestrel & Pine's remedies are such rules rather than purchases, so a reader can list them for one order of their own before any product is discussed. | reasoning: Kestrel & Pine's remedies: a read-only provider console, the return id as the refund's key, one invoice per shipment, a daily list of shipped orders without an invoice, the order's home decided before the OMS was bought. | `problem_solution`: The one problem behind the four incidents. → The four rules that answer it and the list a reader can make. |\n| p70 | transition | Part III has followed Eva's order as a record and as money; Part IV follows the physical work that has to match that record, picking, shipping, delivery and the way back, starting with the warehouse. |  | `sequence`: The order record and the payment taken. → The physical work that has to match the record: picking, shipping, delivery and the way back. |\n\n## Non-goals\n\n- Authorization, capture, settlement, refunds and chargebacks as payment operations. See [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html).\n- EN 16931, UBL, Peppol BIS, XRechnung, clearance models and the country-by-country mandate table. See [Documents Between Companies: EDI, Punchout and E-Invoicing](edi-and-e-invoicing.html).\n- The ERP's role as integration hub, connectors as products, master data. See [The Back Office: ERP Integration and Who Is the Hub](erp-and-back-office-integration.html).\n- Discount allocation and gift-card mechanics; return policies and the refund flow. See [Discounts, Coupons and Loyalty: Promotions Without Chaos](commerce-promotions.html), [The Way Back: Returns, Exchanges, Refunds and Reverse Logistics](returns-and-exchanges.html).\n- Metric definitions and why dashboards and the ledger differ. See [Counting the Same Thing Everywhere: Data Platforms, Definitions and Analytics](commerce-data-and-analytics.html).\n- The regulatory calendar as a tool. See [Rules Turned Into Requirements: Consumer, Payment, Invoicing and Platform Regulation](commerce-regulation.html).\n- Ledger design, sub-ledgers and reconciliation as disciplines. See [Payments-to-Ledger: Draining the Suspense Swamp](../finance-systems-architecture/payments-to-ledger.html), [Never Update, Only Append: Designing Custom Ledgers](../finance-systems-architecture/designing-financial-ledgers.html), [Reconciled by Design: Traceability and Audit Across Boundaries](../finance-systems-architecture/traceability-and-reconciliation.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Belgian VAT rates rest on PwC's summary because the FPS Finance page served a captcha; a reviewer with access should confirm the 21/12/6/0 structure. (carried over)\n- Avalara's sales-order versus sales-invoice document semantics were stated as inference in the first draft because the developer pages did not render; the published chapter now says only that 'tax engines are commonly used the same way'. Replace with a citation if one can be fetched. (carried over)\n- The chapter states that marketplaces may collect VAT as deemed supplier only as a warning sign; the rule's scope belongs to marketplaces-and-channel-integration and should be checked there. (carried over)\n- Whether Kestrel & Pine's PSP fee and payout delay should become canonical ledger facts for commerce-payments is for that writer; this chapter records them as assumptions, as the ledger does. (carried over)\n- The journal spec assigns Part III's closing to this chapter and the published chapter had only a hand-off to Part IV. Paragraphs p68 and p69 were added to the spec and the prose to perform it (synthesis across the four chapters, so-what, callback to the part opening's paid-but-unpaid order, take-away). They add no figure; the author should check their wording against the Part III introduction once that page has been through the same pass.\n- The next page, the Part IV introduction (part-4), is still at `outline` in the journal spec and has no transition_in of its own; the hand-off (p70) uses the part's transition_in (sequence: the order record and the payment taken, then the physical work that has to match the record). That is enough to write the hand-off but gives no hook to hand to; revisit p70 when Part IV is brought to full detail.\n- Flow rubric notes not taken (two runs, both 'sound with notes'; the author decides): (a) merge the one-paragraph 'Across Scale Stages' section into 'The Choices' (kept: the stage table and its heading are the house record shape in every chapter); (b) fold the announcing sentences ('Five facts about VAT carry the chapter', 'Three properties follow', 'Three accounting rules sit under the table', 'Three decisions shape the handoff') into the paragraphs after them (kept: they are short and tell the reader how many items follow); (c) merge 'Kestrel & Pine's clothing and equipment carry the standard rate everywhere' into the rates paragraph (kept: the rates table sits between them); (d) cut the gift-card paragraph, which no later section uses (kept: gift cards are a ledger rule the journal spec's outcome does not name but Part II established as a liability); (e) the 'Established' list names the e-invoicing dates although the Belgian reach for a non-Belgian supplier is hedged and the Dutch date is a plan (kept: the list item states each date as its source does; the author may move it to 'Depends on context'); (f) 'intra-EU sales listing' in the Ardennes Trail Co. example has no gloss (left: glossing it would state a filing rule the chapter's sources do not state); (g) the recommendation in The Choices mentions 'Kestrel & Pine's stage' before the stage table (kept: the stages were introduced in Part I).\n- Draft check after round 3 (escalate: 19 passed, 19 failed; 8 major, 11 minor). Fixed after the round without another check: Figure 5 moved beside the payout paragraph (p53); 'When It Goes Wrong' opens from the two orders; 'finality' now matches the table's 'How consistent'; VAT defined once (p03); the PIM comparison in p66 dropped; the part close's remedies marked as coming from across the part; 'committed document' reworded. Still failing: (a) spec, both readers: the entries table (p34) posts revenue at dispatch before the revenue rule and the cut-off (p36-p38) explain it; p34 now says so in one sentence, but reordering the ledger section (rules before the table) is the author's call; (b) spec, both readers: the worked example comes after the choices and the stage table, so the ledger and reconciliation tables stay abstract for several sections; moving 'Eva's Order in the Books' to follow the reconciliation section is the candidate, and the author decides; (c) draft, corroborated: 'marketplace VAT booked as if the merchant collected it' in the stage table is never explained, and explaining it needs the marketplace deemed-supplier rule this chapter's sources do not state (see the open question on marketplaces); (d) minor single-reader points: 'receivable while defended' and the 'highest rate' allocation are unexplained; Choices and the stage table overlap and Choices restates the invoice-issuer rule; the 'unresolved' incidents in the scene against the February fix of the Double Refund; the gift-card paragraph has no case; the US counted among 'facts about VAT'; why Germany's dates light the Long Fuse.\n- The published chapter had no paragraph stating the thesis, no roadmap announcing every section, and no conclusion paragraph that answers the opening; p04, p05 and p63 were added, built only from statements the chapter already makes.\n\n## Decision log\n\n- **2026-11-12** — Converted spec.md to spec.json (auto mode). Intent outcome, the five acceptance criteria, the thesis and role are copied unchanged from the journal spec. Two criteria were added, both minor, for the author to keep or drop: AC-6 (split a tax-inclusive total, the intent's can_do that no journal criterion tests) and AC-7 (the conclusion performs Part III's closing). The old success criteria were inventories and are not carried over: the opener format, the table list and the date-and-source list describe contents; 'every term defined' is covered by the standard known_before_new check; the Eva and Ardennes figures are kept by the ledger. The word limit stays at the old spec's 6,500 words. Rejected: Carrying the success criteria over as custom criteria.; Raising the word limit for the added closing units.\n- **2026-11-12** — Added an introduction paragraph that states the thesis (p04) and one that announces every section (p05), replacing the published paragraph that named only Eva's VAT and the Peppol example; p03 now picks up the previous chapter's order with goods status per shipment, as this chapter's transition_in asks. Rejected: Leaving the KEY POINTS callout as the only statement of the thesis.\n- **2026-11-12** — Added Part III's closing as two paragraphs after Questions to Ask (p68 synthesis and callback, p69 so-what and take-away), as chapter 10 did for Part II, and rewrote the hand-off (p70) to the Part IV part's transition_in. Rejected: A separate heading for the part closing (the conclusion runs to the Sources apparatus, and chapter 10 used none).; Folding the part closing into the chapter synthesis (two levels in one paragraph).\n- **2026-11-12** — Round 2 escalated on two spec faults that both flow readers reported, changed under the same pre-approval: p22 now says that Kestrel & Pine freezes the checkout basis and lists differences at invoicing (readers could not tell which of the two options the merchant uses, while p14a and the worked example assume freezing); p34 now says that the invoice posts revenue at dispatch and the cut-off aligns it with the revenue rule (the entries table seemed to contradict the delivery rule until p38). p68's April-close case no longer mentions the fleece, which belongs to December (single-reader minor, plainly right). The 'Four payout feeds' row left the mismatch table (it is a category, not a mismatch) to stay within the word limit. Rejected: Moving the cut-off paragraph (p38) before the entries table: it depends on the revenue rule (p36, p37).\n- **2026-11-12** — Round 1 of the draft check escalated on three spec faults, changed under the pre-approval for order, paragraph ideas and transitions (intent, thesis, role and criteria untouched): Figure 1 moves from the VAT section (p21) to the checkout/invoice section (p22), which it illustrates; p22 now states when to recompute and when to freeze the tax basis, so the conclusion's 'Depends on context' item is no longer new; p68 lists the four chapters' cases without counting #1052877 twice (the Three-Status Order for chapter 13, Sanne's April close for this one). Rejected: Cutting the recompute-or-freeze item from the conclusion.; Dropping Figure 1.\n- **2026-11-12** — Took the flow rubric's notes without review, as the author asked for this pass: merged p07 into p06, added p14a, reordered 'When It Goes Wrong' to the order of the chapter's sections, glossed credit note at first use and W5, and completed the rationale; see changelog and open_questions for the notes not taken. Rejected: Merging 'Across Scale Stages' into 'The Choices'.; Folding the announcing sentences into the paragraphs after them.\n- **2026-11-12** — In the invoice section the published 'Three properties follow' announced three rules and was followed by four; p25 now announces three properties of the document and a fourth rule from the date of supply, and the second rule's lead is a statement ('An issued invoice is never edited') like the others. Rejected: Moving 'one invoice per shipment' into the checkout section.\n\n## Sources\n\n- **Internal**\n  - _research/scenario-ledger.md and _research/consistency-issues.md (rulings 1, 2, 5, 14, 18, 19) — Eva's order and exchange, the Double Refund, the Three-Status Order, business lines, Peppol since January 2026, Ardennes Trail Co., invoice per shipment, revenue at delivery, Waypoint W5.\n  - journal-spec.json (tax-invoicing-and-ledger; part-3 closing; part-4 transition_in) — Intent, thesis, role, acceptance criteria, the part closing this chapter performs and the hand-off to Part IV.\n  - _research/brief-checkout-payments-tax.md (Parts 2, 4.4, 7, 8) and _research/brief-b2b-edi-erp.md (Parts 3, 4) — The factual base for payouts, reconciliation reports, VAT, invoices, revenue recognition, e-invoicing and the ERP connector.\n  - meet-kestrel-and-pine, cart-and-checkout, commerce-payments, order-management, edi-and-e-invoicing, erp-and-back-office-integration — Neighbouring contracts and the recurring order.\n- **External**\n  - European Commission (VAT rates, OSS, ViDA), Your Europe, business.gov.nl, Belastingdienst (invoice requirements, retention), UStG §§ 12, 14, 14b and AO § 147, PwC Belgium (accessed 2026-11) — Tax and invoice rules.\n  - IFRS 15 (IFRS Foundation); RevenueHub on breakage — Revenue recognition.\n  - OpenPeppol; FPS Finance Belgium (2024); German BMF FAQ; Rijksoverheid (2026-09-11) — E-invoicing dates.\n  - Stripe, Adyen and Mollie documentation (accessed 2026-11) — Payout reports, batch references, refund behavior, inclusive pricing.\n  - Odoo 18.0 documentation; Microsoft Learn (2026); Shopify (2026) — ERP invoice behavior and connector practice.\n  - South Dakota v. Wayfair (2018); Avalara and TaxJar pages — US sales tax and tax engines.\n\n## Changelog\n\n- **2026-11-12** — Round 3 (escalate: 19 passed, 19 failed, 8 major of which 2 spec faults). Closing fixes without another round: Figure 5 moved to p53 (spec evidence moved with it); 'When It Goes Wrong' opener; 'consistency' in p22; VAT defined once in p03; p66 no longer compares with the PIM; p69 'across the part'; p22 'recorded calculation'. 6,495 words (limit 6,500). Remaining failures are listed in open_questions. The check report is stale against these edits.\n- **2026-11-12** — Round 2 (escalate: 17 passed, 26 failed, 13 of them single-reader minor; two spec faults). Spec: p22 and p34 ideas, p68 case list, p42 table evidence. Draft fixes: the tax-flow table introduced; the fourth invoice rule marked; Choices and the worked example open from what precedes them; Eva's exchange request of 19 April set up; Peppol BIS Billing 3.0 glossed; Noor identified; earlier-chapter remedies in the part close given their reason; 'four places' explained. Trims to stay within 6,500 words: roadmap tightened, webhook and EDI glosses dropped (known from Part I), the 'Four payout feeds' table row, the US storefront sentence, the duplicate recompute-or-freeze wording in the conclusion. 6,490 words.\n- **2026-11-12** — Round 1 (escalate: 18 passed, 28 failed, 9 of them single-reader minor; three spec faults). Spec: Figure 1 moved to p22, p22 gains the recompute-or-freeze criterion, p68's case list changed. Draft fixes: section openings of owes, VAT, invoice and reconciliation now pick up the declared known information; ledger, economic nexus, W5 glossed at first use; 'access point' no longer used before its definition; the €95 introduced as the wholesale jacket price; the Peppol hedge split into three sentences; the Long Fuse's referent named; failure-pattern names mapped to incidents in the callout; 'May close' now 'Sanne's April close, done in May'; 'My recommendation' now 'The author's recommendation'; the stage paragraph moved above its table. Trimmed to 6,488 words.\n- **2026-11-12** — Flow rubric (run 1 sound with notes; run 2 after the changes sound with notes). Taken: the scene's one-sentence paragraph on matching rules merged into the four routes (p07 removed); p14a added (what the shop owes finance: the facts and identifiers the documents need) and named again in p63; 'When It Goes Wrong' reordered to follow the chapter's sections (tax, invoice, e-invoice, money) with its transitions rewritten; credit note glossed at first use (p08);
