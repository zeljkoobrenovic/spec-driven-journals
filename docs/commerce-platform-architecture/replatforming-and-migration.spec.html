<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/42-replatforming-and-migration/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (a thesis paragraph, a roadmap and a conclusion paragraph that answers the opening); these are recorded in decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Which reasons justify a platform change (the core itself limits the business: a vendor ending the product, a forked core, a B2B model no layer can express, a competitor running the platform) and which point to the joins instead (stock wrong across channels, support unable to find an order, an agency's recommendation alone).\n- **Know:** The Burned Bridge from three dated public failures (Target 2011, Finish Line 2012, reverted after 17 days at about $3M, Marks & Spencer 2014, M&S.com down 8.1% for a quarter) and one avoided case (Hobbycraft 2013); the strangler approach with seams by channel, capability and traffic slice; the phases from shadow to decommission; parallel runs against dual writes; the separate data migrations; the five parts of a cutover; and migrating the integrations.\n- **Know:** Kestrel & Pine's 2027 introductions: the PIM loaded in July (1,900 variants with conflicting attributes resolved before publishing), the DE storefront first in August, NL/BE and the connector in September; the OMS shadow in August, a parallel run from 1 to 14 September (differences on about 1.4% of orders in week one), marketplace orders from 15 September, D2C from 13 October, a freeze from 15 November to 5 December around Black Friday, EDI and wholesale from 8 December, the old paths retired in January 2028 and 2026 orders imported as read-only history.\n- **Believe:** The documented replatforming failures broke on load, timing and customer habit, not on missing features.\n- **Believe:** Every step must stay reversible through one peak, and the reconciliation job is the migration's main deliverable.\n- **Believe:** The migration technique does not change with scale; the thing being migrated does.\n- **Be able to:** Plan a migration backwards from the first peak the new owner must survive, as a sequence of seams with written go/no-go criteria and a rehearsed rollback.\n- **Be able to:** Write a separate plan and check for each kind of data and for every integration that reads or writes the fact being moved.\n\n**Audience:** Newcomers to commerce architecture; most of all the engineering lead or integration engineer who will plan or run a hub introduction or a replatforming (Noor Visser at Kestrel & Pine). Product managers, operations leads and finance partners who must sign off go/no-go criteria, gift-card balances and the change freeze are the second readers.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its 2026 and early 2027 incidents in outline (among them the App That Wrote Stock, the Price Drift and the Deprecated Endpoint) and the names of the sixteen failure patterns.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines, 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system (OMS), availability service, D2C, B2B, PIM, POS.\n- From Parts II and III: product, variant, SKU and GTIN with one owning system per attribute; prices frozen at order placement; gift cards and points as liabilities; available-to-promise; checkout creating the order once; one order record with an OMS once two of four conditions hold.\n- From chapter 41 (build-buy-or-assemble): the February 2027 platform review and W4, stay and surround: keep the shop platform, buy the hubs beside it, own the joins.\n\n**Does not yet know:**\n\n- Replatforming, the strangler fig, transitional architecture, event interception, divert the flow, legacy mimic, dark launch, canary release, feature parity.\n- Shadow copy, parallel run, dual write, cutover, go/no-go criteria, rollback, change freeze, decommissioning.\n- Redirects and the 404 and 410 responses; technical search-engine optimization (SEO).\n- The public replatforming cases (Target, Finish Line, Marks & Spencer, Hobbycraft) and Zalando's router-fronted rebuild.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a single-weekend migration plan with dual writes, the reader names its failures and replaces it with a seam-by-seam plan, rather than adding more testing to the same plan. *Probe:* A merchant plans to move to a new order system: create its historical orders in the new system over a weekend, switch every channel to it on the Monday before Black Friday, and have the integration write each new order to both the old path and the new system 'to be safe'. Using only this chapter: what is wrong, and what should the plan be? | `custom` | cold_reader | major |\n| AC-2 | The reader can sort the reasons given for a replatforming into those the core causes and those the joins cause. *Probe:* A team argues for a new platform because stock is wrong across channels, support cannot find orders, the site was slow on Black Friday, the vendor is ending the product, the core has been customized until it cannot be upgraded, and the agency recommends it. Using only this chapter: which are reasons to replatform, and what should be checked first for each? | `custom` | cold_reader | major |\n| AC-3 | The reader can say why a migration's data is several migrations and why a rollback has a time limit. *Probe:* Using only this chapter: why is moving a platform's data more than one export, and why is the old system kept operable through one peak but not forever? | `custom` | cold_reader | major |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** When a platform must change, how do you move without a big-bang cutover?\n\n> **Claim:** Move one seam at a time (a channel, a capability or a slice of traffic), so that each step changes the owner of one fact for one part of the business: copy the flow in shadow, run old and new in parallel with a reconciliation that explains differences by cause, migrate each kind of data on its own plan, cut over with written criteria and a rehearsed rollback, and keep the old owner operable through the first peak after cutover.\n\n**Disputed by:** The view that a migration is a project with one go-live date: build the new system to feature parity, move all the data over a weekend and switch everything at once, because running two systems side by side doubles the cost and a clean cut avoids confusion.\n\n**So what:** A merchant that accepts the claim plans every move backwards from the first peak the new owner must survive, and applies it when it introduces a hub such as a PIM or an OMS beside a running platform, not only when it replatforms. Kestrel & Pine's PIM found 1,900 variants with conflicting attributes at its July 2027 load and fixed them before publishing; the OMS parallel run from 1 to 14 September found differences on about 1.4% of orders in its first week, mostly status mapping and timing, plus one order the old path had fulfilled twice; marketplace orders moved on 15 September, D2C on 13 October, EDI and wholesale on 8 December, around a freeze from 15 November to 5 December. Target (2011), Finish Line (2012, reverted after 17 days) and Marks & Spencer (2014, online sales down 8.1% for a quarter) each moved on one date and broke on load, performance, timing or customer habit rather than on missing features, with no rehearsed way back.\n\n**How and why:** During a migration two systems hold the same fact and only one may be right. A seam limits that to one fact for one channel, so a parallel run can compare results before anything is acted on, while dual writes create two writers with no transaction across them. Each kind of data has its own identifiers and legal constraints (product identifiers feed every integration, customer consent must move with its proof, gift-card balances are liabilities), and re-created orders fire their side effects again. The longer the new system owns a seam, the more records exist only there, so a rollback is cheap only while the old path still receives the copies.\n\n**Supporting claims**\n\n- **S1** — A platform change is justified only when the core itself limits the business and no layer beside it can fix that; problems in the joins (wrong stock across channels, orders support cannot find, an agency's recommendation) call for owners and hubs, not a new platform.\n- **S2** — The documented replatforming failures (Target 2011, Finish Line 2012, Marks & Spencer 2014) moved on one date into or near a peak and broke on load, performance, timing or customer habit rather than on missing features; the one recovery depended on the old platform having been kept operable. This is the Burned Bridge.\n- **S3** — The strangler approach moves one seam (a channel, a capability or a slice of traffic) at a time, through phases from shadow to decommission in which one system owns each fact; a parallel run compares results before they are acted on, while dual writes create two writers that diverge silently.\n- **S4** — A platform's data is several migrations, not one export: products, prices, customers, orders, gift cards and credit, URLs and every integration each have their own identifiers, trap and check, and order history is imported as history, never re-created.\n- **S5** — Each cutover needs a window and a freeze, written go/no-go criteria, a rehearsed rollback, continuity of identifiers and a watch; because records accumulate in the new system, a rollback is cheap only while the old path still receives copies, so the old owner is kept operable through one peak.\n- **S6** — The migration technique does not change with scale; what changes is the thing being migrated (a shop, the owner of a fact, a brand) and the number of seams and integrations each move drags along.\n\n## Role in the part\n\nShows how a merchant moves a platform or a fact's owner without a single cutover date, using Kestrel & Pine's 2027 PIM and OMS introductions as the worked example. Supports P10-2 of part `part-10`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `assertion_evidence_reasoning` in failures: three dated cases and one avoided case, then the pattern they share (The Burned Bridge); `prerequisite_order` in strangler to cutover: the seam first, then what holds during each phase, then the data each seam carries, then the integrations re-pointed at the new owner, then the cutover that ends a phase; `chronological` in practice: the PIM from its July load to September, then the OMS from shadow to decommission)\n\n'Reasons to Replatform' comes first because it is the question every migration plan presupposes: whether the platform itself should change. 'Three Documented Failures' then shows the danger in how a move is made and names the Burned Bridge, which every later section is built to avoid. 'Setting the Scene' follows with Kestrel & Pine, which answered the first question by keeping its platform and still has two hubs to introduce, and Noor's three rules, each an answer to the Burned Bridge the reader has just met. 'The Strangler Approach' gives the published method the rules apply; 'How the Pieces Fit' names the five phases and separates the parallel run from dual writes; the data migrations need the phases, because each check is stated per phase; 'Migrating the Integrations' expands the data table's last row and sits beside it; 'Cutover and Rollback' comes once everything that moves has been planned, and its rollback limit needs the cutover. The worked example ('In Practice') follows the method directly, so every phase it names is fresh; 'Across Scale Stages' then generalizes from Kestrel & Pine's Omnichannel case to the other stages; 'When It Goes Wrong' comes last because each failure is read against the rule that prevents it. Putting the scene before the failures (the round-3 order) gave Noor's rules before the evidence that motivates them, as both round-3 readers reported; putting the scene before the reasons (the round-1 order) made the reasons read as a step back behind a plan already made, as readers in two rounds reported; moving the documented failures after the method would leave the strangler approach answering a danger the reader has not yet seen; moving the worked example before the method would use phase names, reconciliations and rollbacks before they are defined; putting the stage table between the method and the example separated the two, as both round-1 readers reported; putting the integrations after the cutover split them from the data table's row about them.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): During a move to a new order system, both the old and the new system may be able to send work to the warehouse: let both send the same order and two parcels leave; stop the old one too early and orders are missed.\n\n**Bridge:** Anyone who has changed a tool at work while the work continued knows the awkward period when the old and the new are both partly in use. → In commerce that period decides who is allowed to act on an order or a product while the shop keeps trading, so a migration is planned as a series of transfers of responsibility, each with a way to recover.\n\n**Thesis statement** (KEY POINTS callout and paragraph p05): Move one seam at a time (a channel, a capability or a slice of traffic), so that each step changes the owner of one fact for one part of the business: copy the flow in shadow, run old and new in parallel with a reconciliation that explains differences by cause, migrate each kind of data on its own plan, cut over with written criteria and a rehearsed rollback, and keep the old owner operable through the first peak after cutover.\n\n**Roadmap** (Paragraph p06):\n\n- Sort the reasons given for a new platform into those the core causes and those the joins cause. *Kept in:* reasons.\n- Show three documented failures and one avoided case, and name the pattern they share. *Kept in:* failures.\n- Start from the plan Noor Visser writes for the PIM and the OMS. *Kept in:* scene.\n- Explain the strangler approach, what holds in each phase, the separate data migrations, the integrations, and cutover and rollback. *Kept in:* strangler, pieces, data, integrations, cutover.\n- Follow Kestrel & Pine's 2027 timeline, say how the method changes with scale, and end with what goes wrong. *Kept in:* practice, stages, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | During a move to a new order system both systems may be able to send work to the warehouse, so two parcels can leave or orders can be missed; a migration changes who is allowed to act while the shop keeps trading, and each step needs a clear transfer of responsibility and a way to recover. | scenario: Old and new order systems both able to send the same order to the warehouse; the old one stopped too early. |  |\n| p02 | explanation | A migration plan therefore starts from one question, which system may act on a given fact (here, which system may send an order to the warehouse) and which integrations read or write it, and decides how the new system is populated, compared, allowed to act and recovered; smaller, reversible steps expose those questions before the whole business depends on the new path. |  | `problem_solution`: The risk of two systems acting on the same order. → The questions a plan answers for the fact whose owner changes. |\n| p03 | context | Kestrel & Pine keeps the shop platform after its February 2027 review (W4, stay and surround, adopted in March) and still introduces a PIM in Q3 and an OMS by Q4 while about 800 storefront orders a day keep arriving; in the order's journey, a jacket order is copied to the OMS for comparison before the OMS may send warehouse work, and product data is prepared in the PIM before publication switches. | fact: W4 decided in March 2027 after the February review; PIM in Q3 2027, OMS by Q4 2027; about 800 online orders a day. | `example`: The questions a migration plan answers. → The merchant whose two migrations the chapter follows. |\n| p05 | claim | The chapter's answer is to move one seam at a time, so each step changes the owner of one fact for one part of the business: copy the flow in shadow, run old and new in parallel with a reconciliation that explains differences by cause, migrate each kind of data on its own plan, cut over with written criteria and a rehearsed rollback, and keep the old owner operable through the first peak. |  | `cause_effect`: The two migrations and where they touch the order's journey. → The claim about how to reach that: one seam at a time. |\n| p06 | transition | The chapter first sorts the reasons given for a new platform, then shows three documented failures and Noor Visser's plan for avoiding them, explains the strangler approach, the phases, the data migrations, the integrations and cutover and rollback, follows Kestrel & Pine's 2027 timeline, says how the method changes with scale and ends with what goes wrong; its evidence is dated public reports, published patterns, Zalando's engineering posts and Kestrel & Pine's timeline. |  | `sequence`: The chapter's claim. → The order in which the chapter argues it, and the evidence. |\n\n## Sections\n\n### Reasons to Replatform, and Reasons That Are Not\n\n**Controlling idea** (`comparison`, id `reasons`): A platform change is justified when the core itself limits the business and no layer beside it can fix that, not when the problems live in the joins.\n\n**Advances the thesis** (S1): Settles whether a move of the core is needed before the chapter explains how to move anything.\n\n**Transition in:** `sequence`: The chapter's claim and roadmap, which start from the reasons for a new platform. → The question that comes before any migration plan.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | comparison | Before any migration plan comes the question whether a change of platform is justified at all, which Kestrel & Pine settled in February: it is justified when the core itself limits the business and no layer beside it can fix that, and not when the problems live in the joins, where most Omnichannel-stage problems live. | table: Eight reasons given for replatforming, each marked as a reason or not, with what to check first: stock wrong, support cannot find an order, a slow Black Friday, the vendor ending the product (Magento 1, 30 June 2020), a forked core, a B2B model, a competitor running the platform, the agency's recommendation. |  |\n\n### Three Documented Failures, and What They Share\n\n**Controlling idea** (`evidence`, id `failures`): Target, Finish Line and Marks & Spencer each moved on one date and broke on load, performance, timing or habit rather than features; Finish Line recovered because its old platform was kept operable, and Hobbycraft avoided the risk by not launching into a peak: together they define the Burned Bridge.\n\n**Advances the thesis** (S2): Grounds the danger the method avoids in dated, sourced cases and names the pattern.\n\n**Transition in:** `cause_effect`: The reasons that do justify a change of platform. → The danger in how a move is made, whether of a platform or of a fact to a new hub.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The limits of the evidence first, so the reader weighs the cases correctly; then the cases in date order, the avoided case, the comparison table and the pattern they share, so the definition of the Burned Bridge rests on all four.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | context | When a change of platform is justified, or a hub is introduced beside the platform, the danger is in how the move is made; the public record is thin because merchants do not publish post-mortems, three cases are documented well enough to use, and because all are older than a decade the lesson is in their shape, not their software. |  |  |\n| p12 | evidence | Amazon had run Target.com since 2001, and on 7 August 2009 Target announced it would build and manage its own online platform, to launch before the 2011 holiday season. | quotation: \"build and manage its own online platform\"; \"e-commerce technology platform, fulfillment and guest services operations\". | `example`: Three documented cases. → The first: Target's decision. |\n| p13 | evidence | The new site launched in August 2011; weeks later, on 13 September, the Missoni for Target launch crashed it for most of the day, and a second outage of about two and a half hours followed on 25 October. | quotation: Target's banner \"we are suddenly extremely popular\"; the outages of 13 September and 25 October 2011. | `time`: The 2009 decision. → The 2011 launch and outages. |\n| p14 | analysis | Because the press disagreed on the cause and Target never confirmed it, the verified chain is the decision, the launch and the two outages, and its shape is the First Snowfall on a new platform. |  | `cause_effect`: The two outages. → What can and cannot be concluded from them. |\n| p15 | evidence | Finish Line switched site technology on 19 November 2012 and reverted seventeen days later to the former platform it had kept operable, at a cost of about $3 million in quarterly sales; it is the one recovery, and the reason is that clause. | quotation: \"which it had kept operable\"; about $3 million \"despite a 25% increase in online sales for the quarter\". | `additional_support`: A new platform failing at its first peak. → A second case, with a way back. |\n| p16 | evidence | Marks & Spencer's 2014 relaunch crashed nothing, yet M&S.com sales fell 8.1% in the quarter because customers re-registered, search engines re-learned the site and habit broke: a migration can succeed technically and still cost a quarter. | statistic: M&S.com sales down 8.1% in the quarter (trading statement of 8 July 2014); \"settle in\" over four to six months; Retail Week's \"timely reminder\". | `contrast`: Two cases that broke on load or performance. → A case where nothing crashed. |\n| p17 | example | Hobbycraft delayed its relaunch past Christmas 2012 because launching in peak trading was too risky, a sourced example of the simplest rule: never cut over into a peak. | quotation: \"too risky to launch the website in peak trading\".; table: The four cases with date, what failed, cost and whether there was a way back. | `contrast`: Three cases that moved on one date. → The case that did not. |\n| p18 | synthesis | The cases share the Burned Bridge: everything moves on one date, into or near a peak, with the new system meeting real load in public and no rehearsed way back; Finish Line is the Burned Bridge without the burning, and the rest of the chapter generalizes its \"kept operable\", starting with Kestrel & Pine's plan. | figure: Figure 1: a collapsed new bridge with the old one burning, against an old bridge kept standing beside the new one. | `conclusion_summary`: The four cases and the table. → The pattern they share. |\n\n### Setting the Scene: Two Hubs Beside a Running Shop\n\n**Controlling idea** (`example`, id `scene`): Having kept its platform, Kestrel & Pine still has two hubs to introduce; a first stock comparison and two migration plans that name dates but not failure behavior lead Noor Visser to three rules: every step reversible for one peak, old and new side by side with a job that proves they agree, and the smallest channel first.\n\n**Advances the thesis** (S3, S5): Gives the case the chapter answers and states the seam-by-seam rules the rest of the chapter justifies.\n\n**Transition in:** `problem_solution`: The Burned Bridge and the first question, which Kestrel & Pine answered in February by keeping its platform. → Noor's plan for the two hubs it still has to introduce, whose rules answer the Burned Bridge.\n\n**Order of paragraphs** (`problem_solution`): The warning from the stock comparison first, then the plans that ignore it, then Noor's rules that answer both; the rules only make sense after the reader has seen what they guard against.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | evidence | Kestrel & Pine answered the first question by keeping the platform, and Noor Visser's plan for its two hubs starts from two warnings; the first is the May 2027 stock comparison, which finds differences on 2.3% of active variants, many caused by three apps that wrote stock, and since both hubs will be loaded from such records, loading a new hub from them also loads their disagreements. | statistic: 2.3% of active variants differ in the May 2027 stock reconciliation, most from the three apps that wrote stock. |  |\n| p08 | evidence | The second warning is the migration plans of Kestrel & Pine's two outside partners, the storefront and apps agency and the ERP implementation partner: both name dates, not failure behavior, and neither says how an order sent twice or not sent at all would be detected. | scenario: The agency: historical orders loaded over a weekend, order export redirected Monday, warehouse feed switched Tuesday; the ERP partner: export the catalog, import it into the PIM, redirect the storefronts. | `additional_support`: The warning that existing records disagree. → A second warning: the plans on the table ignore failure. |\n| p09 | claim | Noor's plan, which the chapter follows, has three rules (every step reversible for at least one peak, old and new side by side with a job that proves they agree, the smallest channel first), each an answer to the Burned Bridge, so the marketplace orders move first, the D2C storefronts next, EDI and manual wholesale last in December, and Black Friday falls inside a change freeze, a period in which no system or integration is changed. | statistic: Marketplace 43,000 orders a year (about 120 a day); D2C 293,000 a year; stores deferred to the 2028 POS evaluation. | `problem_solution`: Plans that name dates and not failure behavior. → Noor's three rules and the order of the seams. |\n\n### The Strangler Approach for Commerce\n\n**Controlling idea** (`explanation`, id `strangler`): The strangler approach replaces a system one seam at a time behind a router or a copied flow, using temporary transitional architecture and resisting feature parity; in commerce the seams are channels, capabilities and traffic slices, and Zalando's rebuild shows it in production.\n\n**Advances the thesis** (S3): Gives the method that replaces the single cutover date.\n\n**Transition in:** `elaboration`: Noor's three rules. → The published method they apply: the strangler approach.\n\n**Order of paragraphs** (`large_to_small`): The approach, then its named moves, then the warning it answers (feature parity), then the commerce seams, then a public example that uses all three kinds of seam.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | definition | Noor's rules apply a published method: the strangler approach replaces a system one piece at a time behind a routing layer, checking each transfer and retiring the old system when nothing depends on it, so the merchant keeps trading; Martin Fowler described it in 2004 and restated it in 2024, warning that wholesale replacement plans tend to fail. | quotation: Fowler's warning that wholesale replacement plans tend to \"go down in flames\". |  |\n| p20 | definition | Thoughtworks' Patterns of Legacy Displacement names the moves: transitional architecture, event interception, divert the flow, legacy mimic, dark launching and canary release. | source: Cartwright, Horn and Lewis, Patterns of Legacy Displacement (2021, revised 2024). | `elaboration`: The strangler approach. → Its named moves. |\n| p21 | cause_effect | The same authors warn that the alternatives to seams often end in feature parity and big-bang releases; rebuilding everything before switching postpones every risk to one date, which is how the Burned Bridge of the previous section comes about. | quotation: Defining \"as is\" functionality \"was a huge effort\"; alternatives \"all too often result in Feature Parity and Big Bang releases\". | `contrast`: The moves of seam-based displacement. → The alternative they warn against: feature parity. |\n| p22 | definition (list) | In commerce there are three kinds of seam: by channel (each with its own entry point and volume, so the smallest can go first), by capability (the stay-and-surround program), and by traffic slice (the canary, which needs a router in front of the storefront). |  | `elaboration`: Seam-based decomposition. → The seams commerce offers. |\n| p23 | example | Zalando's 2015–2016 rebuild of its Fashion Store behind the Skipper router, fragment by fragment, is the public example of the strangler in commerce: in production at a large retailer. | case: Zalando Engineering posts of 16 October 2015 and 5 October 2016: a Go-based router, Skipper, in front of the shop; header and footer first, then product pages and wish lists.; figure: Figure 2: a router or copied flow sends one seam at a time to the new owner; a reconciliation proves agreement; disagreement routes back. | `example`: The three kinds of seam. → A public example of all three. |\n\n### How the Pieces Fit During a Migration\n\n**Controlling idea** (`explanation`, id `pieces`): During a migration two systems hold the same fact and only one may be right, so each phase from shadow to decommission names the owner and the check, and a parallel run (both compute, one is used) is safe where dual writes (one actor writes to both) are not.\n\n**Advances the thesis** (S3): States what holds while a seam moves and separates the safe comparison from the dangerous double writer.\n\n**Transition in:** `elaboration`: Moving one seam at a time. → What holds while a seam is moving.\n\n**Order of paragraphs** (`prerequisite_order`): The phase table first, because both mechanisms are named by the phase they serve; then the parallel run, the safe mechanism; then dual writes, defined against it. Putting dual writes first would describe the danger before the reader has the safe alternative to compare it with.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | explanation | A migration is a period in which two systems hold the same fact and only one is allowed to be right, so each of five phases (shadow, parallel run, divert one seam, divert all, decommission) says who owns the fact, how fresh it must be, how agreement is checked and what must stay available. | table: Five phases (shadow, parallel run, divert one seam, divert all, decommission) with owner, freshness, consistency check, latency and availability; two values marked as assumptions. |  |\n| p26 | definition | Of the two mechanisms that carry these phases, a parallel run has both systems process the same input while only one result is acted on; it is the safest way to learn whether they agree, but its reconciliation must say which records differ and why. |  | `elaboration`: The parallel-run phase in the table. → The two mechanisms, starting with the parallel run. |\n| p27 | comparison | Dual writes, one actor writing the same change to both systems, sound like a parallel run but are the opposite in risk: two writers with no transaction across them diverge silently, as the App That Wrote Stock showed, so prefer one writer and a copied flow, and make unavoidable dual writes idempotent and reconciled. | case: The App That Wrote Stock (March 2026): a pre-order app and the WMS feed both wrote stock in the platform; two weeks of phantom reservations on 600 variants. | `contrast`: The parallel run, where only one result is used. → Dual writes, where both are written. |\n\n### Data Migration Is Seven Migrations\n\n**Controlling idea** (`explanation`, id `data`): A platform's data is seven migrations, not one export: products, prices, customers, orders, gift cards and credit, URLs and the integrations each have their own owner, identifiers, trap and check, and order history is imported as history.\n\n**Advances the thesis** (S4): Shows why each kind of data needs its own plan and check.\n\n**Transition in:** `elaboration`: The phases in which one system owns each fact. → The data the new owner must be loaded with.\n\n**Order of paragraphs** (`large_to_small`): The table of all seven first, then the two rows that need more than a cell, in the table's own order: the order history that must not be replayed, then the search presence that goes with the URLs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | explanation | A platform's data is not one export: each of seven kinds (products, prices, customers, orders, gift cards and credit, URLs, integrations) has its own owner, identifiers, legal constraints, trap and check, such as identical SKUs and GTINs or gift-card balances that sum to the cent, so each is planned separately. | table: Seven rows (products and variants; prices and promotions; customers; orders; gift cards, store credit and points; URLs and search presence; integrations and apps), each with what moves, the trap and the check; Kestrel & Pine's 3,400 products, 26,000 variants, the Price Drift's nine days, the 34 flows and the Deprecated Endpoint.; figure: Figure 3: five of the seven migrations as separate handcarts. |  |\n| p30 | cause_effect | Creating historical orders in the new system fires every side effect again (293,000 D2C orders would be 293,000 e-mails), so history is imported as history, flagged and read-only with its original numbers, or left in the old system behind a read-only link. | reasoning: Every created order fires a confirmation, a reservation, a fulfillment request and an invoice; 293,000 D2C orders a year. | `elaboration`: The orders row of the table. → Why history must not be re-created. |\n| p29 | explanation | Search visibility moves with the URLs: localized-page links, product markup and crawl rules move too, and a removed page without a replacement returns 404 or 410 rather than redirecting to the homepage. |  | `additional_support`: The rows that need more than a table cell. → The search signals that move with the URLs. |\n\n### Migrating the Integrations\n\n**Controlling idea** (`process`, id `integrations`): The flows around the system in the middle do not know it changed, so an inventory with owners, a legacy mimic with a removal date and deprecation with notice turn re-pointing them into a list of tasks.\n\n**Advances the thesis** (S4, S5): Treats every integration that reads or writes the moving fact as part of the migration and of each cutover.\n\n**Transition in:** `elaboration`: The seventh row of the data table: the integrations. → How the flows around the moving system are re-pointed.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | process (list) | The data table's last row needs its own section: about fourteen of Kestrel & Pine's thirty-four integrations must be re-pointed when the OMS and PIM arrive, and three rules from W5 (an inventory first, a legacy mimic where a flow cannot change in time, deprecation with notice in both directions, as in Zalando's announced retirement of Connected Retail) make that a list of tasks rather than a season of incidents. | statistic: About 14 of the 34 integrations re-pointed (illustrative); the Deprecated Endpoint of February 2027.; fact: FashionUnited, 23 April 2026: Zalando's Connected Retail technology discontinued by 30 June 2027. |  |\n\n### Cutover and Rollback\n\n**Controlling idea** (`process`, id `cutover`): Each small cutover needs a window and a freeze, written go/no-go criteria, a rehearsed rollback, continuity of identifiers and a watch, and the rollback has a time limit because records accumulate in the new system.\n\n**Advances the thesis** (S5): Says how one seam changes owner safely and why the old owner is kept operable through one peak and not forever.\n\n**Transition in:** `sequence`: The data loaded and the integrations listed. → The moment a seam's traffic moves to the new owner.\n\n**Order of paragraphs** (`prerequisite_order`): The five parts of a cutover first, including the rehearsed rollback; then the rollback's time limit, which follows from records accumulating in the new system and explains why the old system is kept through one peak and not forever.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | process (list) | A cutover routes a seam's traffic to the new owner, and even small ones need five things: a window and a freeze, written go/no-go criteria, a timed and rehearsed rollback, continuity of identifiers, and a watch through the first hours and the first peak. | figure: Figure 4: one seam's cutover at Kestrel & Pine: marketplace orders copied to the OMS in shadow, reconciled against the WMS for two weeks, then routed through the OMS; a difference routes the seam back. |  |\n| p32 | cause_effect | The longer the new system owns a seam, the more records exist only there, so a rollback gets more expensive; the parallel run narrows the gap but does not close it, which is why the old system stays operable through one peak and not forever. |  | `contrast`: The rehearsed rollback. → Its limit in time. |\n\n### In Practice: The OMS and PIM Introductions at Kestrel & Pine\n\n**Controlling idea** (`example`, id `practice`): Kestrel & Pine introduces the PIM consumer by consumer from July to September 2027 and the OMS seam by seam from August 2027 to January 2028 around a Black Friday freeze, and the parallel run finds an existing defect before the new owner takes over.\n\n**Advances the thesis** (S3, S4, S5): Shows every part of the method applied with dates, figures and recovery steps.\n\n**Transition in:** `example`: The method from seams to cutover and rollback. → Kestrel & Pine's two 2027 migrations, which use every step.\n\n**Order of paragraphs** (`chronological`): The PIM first because it starts first (July); then the OMS phases in date order; then what the parallel run found and how the history was imported, which close the OMS story.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | context | The figures that follow are illustrations, and the dates follow Waypoint's timeline (W3: a PIM in Q3 2027; W2: an OMS as the order hub by Q4 2027). |  |  |\n| p36 | evidence | The PIM's first load in July 2027 combines four copies of product data and exposes 1,900 variants with conflicting attributes, the same kind of disagreement as May's stock comparison, which Teun Baas's team resolves before publication, keeping every SKU and GTIN. | statistic: 1,900 variants with conflicting attributes (illustrative); platform, ERP, spreadsheet and marketplace data. | `sequence`: Waypoint's timeline. → The first migration: the PIM load. |\n| p37 | process | The German storefront becomes the PIM's first consumer in August, with a fallback copy in the platform and a nightly comparison; the Dutch and Belgian storefronts and the marketplace listings follow in September, and the spreadsheets become read-only. |  | `time`: The July load. → The consumers in August and September. |\n| p38 | analysis | At each PIM step recovery means stopping publication and keeping the platform's last copy, so a catalog correction never needs a weekend switch for every channel. |  | `cause_effect`: Consumers moved one at a time with a fallback copy. → What recovery means at each step. |\n| p39 | process | The OMS table follows the phase table in 'How the Pieces Fit': shadow, the parallel run, one row per diverted seam (marketplace, D2C and wholesale, smallest first) with the change freeze between them, then decommissioning in January 2028, and its last column says how each step could be reversed: shadow in August, a parallel run from 1 to 14 September, marketplace orders from 15 September, D2C from 13 October, a freeze from 15 November to 5 December in which the old path still receives copies through Black Friday, wholesale from 8 December. | table: Seven rows: phase, dates, what happened and what reverses it; order numbers continue the platform's sequence; the freeze over Black Friday (26 November 2027). | `sequence`: The PIM's consumer-by-consumer move. → The OMS's seam-by-seam move. |\n| p40 | evidence | In its first week the parallel run found differences on about 1.4% of orders, nearly all status mapping and timing, plus one order the connector had delivered twice, which the old path had fulfilled twice and the OMS created once: the migration found an existing defect before it caused a new one. | statistic: About 1.4% of orders differ in week one (illustrative): the WMS's 'packed' with no platform equivalent, orders created just before the nightly comparison, one order delivered twice by the connector. | `emphasis`: The parallel-run phase in the table. → What it found. |\n| p41 | example | The 2026 orders were imported into the OMS as flagged, read-only history with no side effects, while the platform kept its own history for the account pages, so support looked in one place from October. | example: 2026 orders imported with original numbers, dates and statuses, flagged as imported, no side effects; the platform keeps its own history for account pages (W2). | `additional_support`: The new orders reconciled in the parallel run. → The old orders imported as history. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): The migration technique does not change with scale, but the thing being migrated does: a shop, the owner of a fact, a brand.\n\n**Advances the thesis** (S6): Shows the method holds at every stage and what grows with scale.\n\n**Transition in:** `elaboration`: Kestrel & Pine's migrations, those of an Omnichannel merchant moving the owner of a fact. → How the same method applies at the other stages.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | synthesis | Kestrel & Pine's migrations are an Omnichannel merchant's; across all four stages the technique does not change but the thing being migrated does: a Starting merchant moves a shop, an Omnichannel merchant moves ownership of a fact, a Group moves brands, and what grows is the number of seams and the integrations each drags along. | table: Four stages with what a migration usually is, what becomes necessary and the warning signs. |  |\n\n### When It Goes Wrong\n\n**Controlling idea** (`evidence`, id `wrong`): Eight failures recur across a seam's move (duplicates, the gap, stale copies, the rollback that cannot roll back, a vendor outage, the redirect map with holes, unbalanced gift cards, the forgotten integration), and each has a detection and a recovery.\n\n**Advances the thesis** (S3, S4, S5): Shows each failure is caught by a reconciliation, inventory or watch and recovered without a big bang.\n\n**Transition in:** `contrast`: Kestrel & Pine's migrations that went to plan, and the method at every stage. → The failures that recur when a migration does not go to plan, with detection and recovery.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | evidence (list) | Eight failures recur, each with its detection and recovery: duplicates across the seam, the gap, stale copies downstream, the rollback that cannot roll back, the vendor outage mid-cutover, the redirect map with holes, gift cards that do not balance, and the agency script still pointing at the old endpoint. | example: Eight failures, each with Detect and Recover: duplicates, the gap, stale copies, the rollback that cannot roll back, the vendor outage, redirect holes (the M&S quarter), unbalanced gift cards, the agency script (the Deprecated Endpoint in reverse). |  |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Every part of the method answers one question for each fact: which system may act on it now. Kestrel & Pine never let two systems send the same order to the warehouse: in shadow and in the parallel run only the old path sent work, from each seam's date only the OMS did, and the old path kept receiving copies so it could take a seam back through Black Friday. The documented failures skipped those steps; they did not lack features.\n\n**So what:** A migration is planned backwards from the first peak the new owner must survive, as a sequence of seams with a reconciliation that explains differences, written criteria and a rehearsed rollback, and the same plan applies to introducing a hub beside a running platform, not only to replatforming.\n\n**Callback:** The introduction's old and new order systems that could both send work to the warehouse: two parcels, or missed orders. Paragraph p43 says how Kestrel & Pine kept one sender per seam and notes that the parallel run found an order the old path had already sent twice.\n\n**Takeaway** (`course_of_action`): Plan the next migration backwards from the first peak, and ask the ten questions: the smallest seam, the rehearsed way back, the role of the old system, the reconciliation, any second writer, how orders are imported, the gift-card sums, the redirect map, the integrations that touch the moving fact, and the freeze around the next peak.\n\n**Hand-off** to [What Changes at Each Scale: From First Store to Group](commerce-scaling-stages.html): `elaboration`: The migrations of this chapter, named as the moments a merchant moves from one scale stage to the next and feels it. → The stages themselves: which decisions change at each, the signals that a stage is ending, and Kestrel & Pine's own path from a web shop to an omnichannel brand.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | synthesis | The opening's risk of two parcels or missed orders is answered by giving each seam one system that may act: at Kestrel & Pine only the old path sent work in shadow and the parallel run and only the OMS from each seam's date, and the parallel run even found an order the old path had sent twice; the documented failures skipped these steps rather than lacking features. | reasoning: The hook's two senders; the OMS phases; the order fulfilled twice; the failures of Target, Finish Line and Marks & Spencer. |  |\n| p44 | synthesis (list) | Established: the documented failures broke on capacity, performance, timing and habit and the one recovery needed a kept-operable platform; the strangler fig and the patterns of legacy displacement are the alternative to the big bang; history is imported as history, balances must match to the cent, and identifiers do not change. |  | `conclusion_summary`: The chapter's answer in one paragraph. → The points that are established. |\n| p45 | synthesis (list) | Depends on context: whether a parallel run is worth its cost, how long the old system stays operable, which seam moves first, and which risk dominates at the Starting and Group stages. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p46 | recommendation (list) | The author's synthesis: plan every migration backwards from the first peak the new owner must survive, move no seam until the previous one is reconciled and its route back rehearsed, and treat the reconciliation job as the main deliverable because it stays in production and makes the next migration cheaper. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p47 | recommendation (list) | Ten questions let the reader test a migration plan: the smallest seam, the way back, the old system's role, the reconciliation, second writers, order import, gift-card sums, the redirect map, the integrations touching the moving fact, and the next peak and its freeze. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own plan. |\n| p48 | transition | Migrations are the moments a merchant moves from one scale stage to the next and feels it; the next chapter steps back to the stages themselves, the decisions that change at each, the signals that one is ending and Kestrel & Pine's own path. |  | `elaboration`: The migrations of this chapter. → The scale stages they move a merchant between. |\n\n## Non-goals\n\n- Whether to replatform at all, the three-year cost of the options and exit cost. See [Build, Buy or Assemble: Choosing and Changing Platforms](build-buy-or-assemble.html).\n- The OMS's and PIM's own design (state models, availability computation, product model). See [The Order Record: Lifecycle, State and the Order Management System](order-management.html), [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html), [What Are We Selling? Products, Variants and the Catalog](product-information.html).\n- Reconciliation and idempotency mechanics in depth; API deprecation practice. See [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html), [APIs, Events, Files and Middleware: How Commerce Systems Talk](integration-styles.html), [Promises Between Systems: API Contracts, Webhooks and Versioning](api-contracts-and-versioning.html).\n- Peak planning and load testing for the migrated system. See [Black Friday Every Year: Peak Load, Resilience and Recovery](peak-load-and-reliability.html), [Journey 4: Black Friday, Hour by Hour](journey-peak-day.html).\n- The architectural histories of Amazon and Zalando beyond the migration shape. See [Case: Amazon, From Monolith to Services to the Everything Store](case-amazon.html), [Case: Zalando, Microservices, Platform Strategy and the Return to Discipline](case-zalando.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Needs the author (rule 12): consistency ruling 4 says 'PIM live 15 September 2027', while the replatforming-and-migration ledger line, which ruling 4 itself names as canonical, has the PIM loaded in July, the DE storefront its first consumer in August and NL/BE and the connector in September. The chapter states the PIM's dates only as the ledger line does. The fact needed: whether ruling 4's '15 September' means the iew', which the page and the ledger no longer support.\n\n## Sources\n\n- **Internal**\n  - _research/scenario-ledger.md and _research/consistency-issues.md (rulings 4, 10, 13a, 16) — The replatforming-and-migration line (PIM and OMS dates, 1,900 variants, 1.4%, 14 of 34 integrations), Waypoint W2–W5, volumes, the May 2027 stock reconciliation, the App That Wrote Stock, the Price Drift, the Deprecated Endpoint.\n  - journal-spec.json (replatforming-and-migration; commerce-scaling-stages transition_in; part-10) — Intent, thesis, role, acceptance criteria and the hand-off to chapter 43.\n  - _research/brief-commerce-business-models.md (Part 5.2–5.4) and _research/brief-cases-amazon-zalando.md (B1, B4, Part C); PLAN.md contract 42; _research/style-guide.md — Replatforming stories, strangler and legacy displacement, the Data Act, Zalando's fragment-by-fragment rebuild and Connected Retail wind-down.\n  - build-buy-or-assemble, order-management, product-information, events-consistency-and-reconciliation, integration-styles, api-contracts-and-versioning, peak-load-and-reliability, meet-kestrel-and-pine — Cross-references and the facts other chapters establish.\n- **External**\n  - InternetNews (2009-08-07); MPR News/AP (2011-09-13, 2011-10-25) — Target's build decision and outages.\n  - Retail Dive (2013-01-08) — Finish Line's reversion to a platform 'kept operable'.\n  - CNBC/Reuters (2014-07-08); Retail Week (2014-07-10, 2013-02-19) — Marks & Spencer's 8.1% fall; Hobbycraft's deferred launch.\n  - Martin Fowler, Strangler Fig Application (2024, orig. 2004); Cartwright, Horn, Lewis, Patterns of Legacy Displacement (2021, rev. 2024) — The method and its named moves.\n  - Zalando Engineering (2015-10-16, 2016-10-05); FashionUnited (2026-04-23) — The public commerce example and the channel retired with notice.\n  - Help Net Security (2020); Shopify Enterprise blog (2026-03-18); Regulation (EU) 2023/2854 — Magento 1 end of life; migration costs; exportable data.\n\n## Change         // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();

                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
