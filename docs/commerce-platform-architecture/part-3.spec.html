<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published page (posts/part-3-intro/index.md, 443 words, ten units) and its former spec.md, then reordered the same day (see decision_log); the page was revised to match. One spec paragraph per unit of the page (nine since p05 was cut on 2026-11-12); the KEY POINTS callout, Figure 1 (the relay of four systems) and Figure 2 (the shape Part III recommends) are evidence of the claim paragraph (p03).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part III answers four questions in order: how checkout creates one order from final answers despite retries, how money moves and who may move it, where the order lives and which states it keeps, and how it becomes tax, invoices and ledger entries matched with the bank.\n- **Know:** After checkout the facts about an order arrive as messages from the payment provider, the warehouse and the carrier, which can be late or repeated.\n- **Be able to:** Pick the Part III chapter that answers the decision in front of them.\n\n**Audience:** Readers new to commerce architecture (engineers, product managers and leaders joining a checkout, payments, order or finance-integration team) who have read Parts I and II and are about to start the order chapters, or who arrive with one checkout, payment, order or invoicing decision in hand and want the chapter that answers it.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side.\n- Roughly what an API, a database and a queue are.\n- Part I: the thirteen steps of an order, promise and handoff, the three status lines (money, goods, returns), the capability map, system of record, single writer, events, idempotency and reconciliation; the glosses for PSP, WMS, ERP, webhook, OMS, SKU, channel and 3PL.\n- Part II: product, price, discount and stock each with one owner; prices frozen at order placement; available-to-promise and the exact commit at checkout.\n- Kestrel & Pine in outline: a fictional outdoor brand, its systems, its incidents and the Waypoint program; Eva's jacket order of 13 April 2027 as the book's worked order.\n\n**Does not yet know:**\n\n- Authorization, collection and settlement as stages of a payment (owned by commerce-payments; glossed here in one clause each, with payout).\n- Peppol, the network for structured e-invoices (owned by tax-invoicing-and-ledger; glossed in a clause here).\n- The order's state model, split shipments and the ledger's posting rules: each is owned by a Part III chapter and only named here.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the four chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next four chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | A reader of this page alone can say why a paid order can still read unpaid and what the part says the order needs. *Probe:* Using only this page: why can an order the shopper has paid still read unpaid in the shop, and what does the order need? | `custom` | cold_reader | minor |\n| AC-3 | Given two problems, the reader names the Part III chapter that answers each. *Probe:* Two problems are in front of you: (a) some returns were refunded twice, once by the returns portal and once by support in the payment provider's console; (b) an order shows 'Delivered' to the customer while one of its items has not left the warehouse. Using only this page: which chapter of this part do you open for each, and why? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** How does a shopper's cart become an order, and what keeps the systems that hold the order, its money and its books in agreement afterwards?\n\n> **Claim:** A cart becomes an order once, at checkout, which asks each system that owns a fact for a final answer, writes those answers (price, tax, availability, delivery promise) into the order and creates it exactly once; afterwards the order, its money and its books stay in agreement only under four rules: the order has one home with three status lines (money, goods per shipment, returns), moved only by messages from the systems that witnessed each payment, shipment or return; every message and request about the order carries a business key that makes a repeat harmless, and whatever is still unresolved is checked with its source on a schedule; every action that moves money or issues a legal document has one writing system; and invoices, payout reports and bank lines are matched line by line every month on identifiers the order passes along.\n\n**Disputed by:** The view that the order is the shop platform's record with one status, that the thank-you page, the payment connector and the ERP connector between them keep the order, the money and the books in agreement, and that a disagreement is fixed by a better connector, a second payment provider or an order management system.\n\n**So what:** Kestrel & Pine's Three-Status Order (#1052877: 'Delivered', 'In picking' and 'Not invoiced' for six days, 11 support tickets) and its Double Refund (212 returns, €19,400 refunded twice) were not faults inside any one product: each was a missing status line, writer, key or comparison. A merchant that accepts the claim writes down the order's home, the writer and the key of each money action and the monthly match before it buys an order management system or adds a payment provider.\n\n**How and why:** From the moment the shopper leaves for her bank's app, the merchant's own systems no longer witness what happens: the payment provider knows whether money moved, the warehouse which lines left, the carrier which parcel arrived, and each reports by message, which can be late, out of order, repeated or lost. One status word lets the latest message overwrite the others; a request without a business key cannot be told from a retry, so a second writer or one retry moves money twice; and an invoice, which must be numbered consecutively and never edited, can come from only one system. A payout nets payments, refunds and fees from different days, so only a line-by-line match on shared identifiers shows that nothing was lost.\n\n**Supporting claims**\n\n- **P3-1** — Checkout owns none of the facts it writes into the order: it asks each owning system for a final answer at the moment of commitment, so an answer taken from an out-of-date copy becomes an error that every later system inherits.\n- **P3-2** — After checkout the order's systems learn what happened from messages sent by the systems that witnessed it (the payment provider, the warehouse, the carrier), which arrive late, out of order, twice or not at all; every message and request therefore carries a business key that makes a repeat harmless, and a scheduled job asks the source about everything still unresolved.\n- **P3-3** — Every action that moves money or issues a legal document has exactly one writing system: one system may refund, one may capture, and one system per legal entity issues invoices and credit notes.\n- **P3-4** — An order is one record with three status lines (money, goods per shipment, returns) from which the status the customer sees is computed, and once orders are created and fulfilled in several places one system must hold that record as the order's home.\n- **P3-5** — Tax is computed from facts the shop owns (ship-to address, product tax category, buyer status) under rates kept once for every channel, and the invoice is issued per shipment at dispatch, never edited and corrected only by a credit note that references it.\n- **P3-6** — The ledger is posted from documents and payout reports, not from payment events, and the books agree with the shop only when invoices, payout reports and bank lines are matched line by line on shared identifiers.\n\n## Role in the part\n\nPerforms the part's opening: states the part thesis, places the part between Eva's click on 'pay' and the May close, and gives the reading order.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in chapters: the four chapter paragraphs, in the part's reading order)\n\nThe page opens on one Kestrel & Pine order that is paid but still reads unpaid, to which the closing returns, and narrows: from why it happens (after the click on 'pay' the facts arrive as messages from other systems, and the order reads unpaid until the PSP's message arrives), to the part's four rules and the system that handles each, with the relay and the shape figures beside the rules they picture, to Eva's one order on which the rules work, in contrast to the opening order, to one paragraph per chapter, each opening on one of the company's failures; it ends on the explained opening order and where to start. The messages come before the rules because each rule answers a property of the messages (late, repeated, from several systems); the rules come before Eva's order because her order shows the four systems at work in time; the chapter list follows Eva's order because each chapter takes one of its systems. A separate paragraph on the company's other failures was cut: readers found it out of place after Eva's order (round 3) and between the opening scene and its cause (round 4), and each chapter paragraph already names its own case. Put the rules first and they answer a problem the reader has not been shown; put the advice first and it points at chapters the reader has not met.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A shopper pays, but the order still appears unpaid because the confirmation has not reached the shop; the warehouse cannot tell whether to dispatch it, and support cannot give a clear answer.\n\n**Bridge:** The shopper's side, where clicking 'pay' feels like the end of the purchase, and Part II's catalog facts (price, discount, the unit that can be sold), which the previous page hands over. → The merchant's side, where checkout writes those facts into an order once and every later fact (paid, dispatched, delivered) arrives as a message from another system; and Eva's €235 order #1072455, created at 21:14 on 13 April 2027 with its payment pending, confirmed seconds later, invoiced on 14 April and reconciled at the May close.\n\n**Thesis statement** (KEY POINTS bullets 1 to 3, paragraph p02 (the messages) and paragraph p03 (the four rules)): After checkout the facts about an order arrive as messages that may be late, out of order or repeated, so the part sets rules, one chapter for each of the order's four owners: checkout creates the order once despite retries; every message carries a key so a repeat changes nothing, and each action that moves money has one writing system; the order record keeps separate states for money, shipments and returns; and invoices, payouts and the bank are matched every month.\n\n**Roadmap** (paragraph p03):\n\n- Four chapters, one for each of the order's four owners in the sequence the order meets them: checkout creating the order once despite retries; the payment provider, with a key on every message and one writing system for each action that moves money; the order record with separate states for money, shipments and returns; the ledger, with the monthly match of invoices, payouts and the bank. *Kept in:* chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | At Kestrel & Pine, the fictional outdoor brand, a shopper can have paid while the shop still shows the order unpaid, so the warehouse cannot tell whether to dispatch and support cannot answer. | example: A paid order that reads unpaid because the confirmation has not reached the shop; a warehouse that cannot decide; support with no clear answer. |  |\n| p02 | context | Once the shopper clicks 'pay' and checkout creates the order, the shop learns what happened only from messages (the payment service provider's webhook, the warehouse's dispatch, the carrier's delivery) that may arrive late, out of order or twice; until the PSP's message arrives, the order reads unpaid. | reasoning: The PSP glossed as the system that handles the money and reports through a webhook (a server-to-server notification); the warehouse reports dispatch, the carrier delivery. | `cause_effect`: The paid order that still reads unpaid, and Part II's hand-off (the click at which the catalog's facts are fixed into an order and money is taken). → Why it happens: after the click on 'pay', the facts arrive as messages from other systems, and the order reads unpaid until the PSP's message arrives. |\n| p03 | claim | Part III's claim and roadmap: because of those messages, the part sets rules, one chapter for each of four systems that handle the order in turn: checkout creates the order once; every message carries a key so a repeat changes nothing, and at the payment provider each money movement has one writer; the order record keeps separate states for money, shipments and returns; finance's ledger (its book of accounts) is written from invoices and payout reports of the provider's transfers to the merchant, and these are matched with the bank every month. | reasoning: KEY POINTS callout: checkout is the moment the shop starts owing and creates the order exactly once; the truth arrives by message, so the order keeps separate states and every message carries a key; the order ends as documents, each issued by one system, with a monthly match.; figure: Figure 1: a relay of four stations (checkout, payment, order record, ledger) passing one order from hand to hand; caption says 'four systems', matching p03.; figure: Figure 2: the shape Part III recommends: checkout creates the order once; the order is one hub fed by messages from the payment provider, the warehouse and the ending payment through its four stages and makes the key and the single writer the rule for every action that moves money; the order chapter needs the money status line the payments chapter defined and adds the goods line per shipment, the returns line and split shipments; the ledger chapter comes last because it invoices per shipment, which needs split shipments, and matches payout reports, which need the payments chapter's stages. Putting payments first would explain a webhook for an order the reader has not seen created; putting the order chapter before payments would name a money status line before the reader knows what moves it; putting the ledger before the order chapter would ask for one invoice per shipment before the reader knows that an order can leave in two parcels.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | description | The checkout chapter explains how checkout coordinates its dependencies and creates one order despite retries: Eva's payment redirect to her bank's app shows why order creation cannot depend on the thank-you page. | scenario: Eva's payment redirect to her bank's app (fictional). |  |\n| p07 | description | The payments chapter follows the pending payment through authorization, collection, settlement and payout, glossed in one clause each (reserved, taken, moved to the provider, paid to the merchant): January 2027's 212 duplicate refunds, costing €19,400, show why a refund needs one authorized writer and an identifier shared across retries, its key. | scenario: 212 returns refunded twice in January 2027, €19,400 (fictional). | `sequence`: The order checkout created with its payment pending. → What happens to that payment, stage by stage, and who may move money. |\n| p08 | description | The order chapter then gives the order a shared home with separate payment, shipment and return states: a fleece delivered before its socks left one customer with three contradictory statuse                 // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
