<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/02-commerce-business-models/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter. It is a contract, not a description: the places where the chapter does not yet do what the spec asks are listed under open_questions.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The commerce business models and what each changes: who captures the order, sets the price, is the legal seller, holds the stock and ships.\n- **Know:** The four scale stages (Starting, Growing, Omnichannel, Group), defined by shape.\n- **Believe:** Systems follow from the business model and its unit economics, not from the technology.\n- **Be able to:** Place their own company in a business model and a scale stage, and say which numbers pull hardest on its architecture.\n\n**Audience:** Readers new to commerce architecture; most of all the product manager, analyst or consultant who has to turn a business plan into system requirements, and the engineer who has only ever seen one business line. Leaders deciding whether business lines or brands should share a stack get the trade-off and its conditions.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side.\n- Roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people and its 2026 incidents, in outline (meet-kestrel-and-pine), and the names of the failure patterns (where-commerce-platforms-go-wrong).\n- From journey-of-an-order: the thirteen steps of an order, promise and handoff, the three status lines, what a system is, 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, the seven systems at Kestrel & Pine, the names of the four scale stages, and PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and availability service.\n\n**Does not yet know:**\n\n- The model names: B2C, D2C, wholesale, B2B e-commerce, B2B2C, marketplace selling and operating, omnichannel, subscription.\n- Seller of record, GMV, EDI-type sales, VAT, punchout, parity rules, repricing, tenancy, POS, OMS, PIM, ASN.\n- Commerce finance vocabulary: conversion rate, cart abandonment, average order value, gross margin, landed cost, contribution, interchange, chargeback, customer acquisition cost.\n- Scale stage as a shape; the three arrangements (one stack, a stack per line, a shared core with line-specific edges).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a short description of a merchant, the reader assigns it a scale stage and justifies the choice by channels, locations and brands, not by revenue. *Probe:* A brand sells online in two countries, has opened three stores and has just started on one marketplace. Which stage is it in, and what told you? | `custom` | cold_reader | major |\n| AC-2 | Given one way of selling, the reader says who captures the order, who sets the price, who is the seller of record, who holds the stock and who ships. *Probe:* A brand lists its jacket on someone else's marketplace and sends each order from its own warehouse. Using only this chapter: who captures the order, who sets the price, who is the seller of record, who holds the stock and who ships? | `custom` | cold_reader | major |\n| AC-3 | Given two of a merchant's numbers, the reader names the part of the architecture each pulls on. *Probe:* A merchant finds that 24% of the items it sells online come back and that its busiest hour carries about 41 times the traffic of an average hour. Using only this chapter: which parts of its systems do these two numbers say must be strongest, and why? | `custom` | cold_reader | major |\n| AC-4 | Given a merchant with several lines, the reader says which of the three arrangements the chapter recommends and what is shared and what is kept per line. *Probe:* A merchant runs its web shop and a small wholesale line on one system. A second system has now started writing prices that the first one also writes. Using only this chapter: what does the author recommend, and what would be shared between the lines and what kept separate? | `custom` | cold_reader | major |\n\n## Thesis\n\n**Question:** Why do a D2C brand, a wholesaler, a retailer with stores, a marketplace seller and a marketplace operator need different systems, and why do a merchant's needs change as it grows?\n\n> **Claim:** They need different systems because a business model decides who captures the order, sets the price, is the legal seller, holds the stock and ships: a merchant needs a system for each promise it keeps itself and a connection for each it leaves to a partner. Growth changes the need by shape, not revenue: each added channel, stock location, country or brand adds systems holding copies of the same orders and stock.\n\n**Disputed by:** The view that commerce is one problem with one best platform, and that merchants differ only in size.\n\n**So what:** A merchant that copies the architecture of a company with a different model or shape buys problems it does not have and leaves its own unsolved.\n\n**How and why:** A promise needs a system that can keep it: the legal seller must issue invoices and refunds, the stock holder must keep availability true, the shipper must book carriers and report tracking. Who holds each role therefore sets which systems a merchant runs and which partner systems it connects to, and each copy added by growth is one more join that must be kept in step.\n\n**Supporting claims**\n\n- **S1** — Lines that sell the same product ask different things of the systems, because each carries a different business obligation.\n- **S2** — The business models are distinct in ways that can be defined and counted, and a merchant usually runs several at once.\n- **S3** — A business model is a decision about who makes and keeps each promise of an order, and those answers decide what the systems must do.\n- **S4** — Each number in the unit economics of an order, the peak included, pulls on a different part of the platform.\n- **S5** — A scale stage is a shape of business, set by channels, stock locations, countries and brands, and each transition adds joins between systems.\n- **S6** — What the lines share should be owned once and what differs kept at the edges; lines forced together or kept apart without that fail in ways particular to each model.\n\n## Role in the part\n\nExplains why the same journey needs different systems for different merchants, and defines the four scale stages every later chapter compares against. Supports P1-2 of part `part-1`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `grouping` in in-practice and when-it-goes-wrong: parallel findings and parallel incidents; `problem_solution` in when-it-goes-wrong then choices: the incidents, then the arrangement that prevents them)\n\nThe scene gives four different requests and so poses the question of what the lines share. The models come next because the requests cannot be compared until the lines have names. The public record follows the definitions directly, as readers in two rounds asked: its findings confirm the definitions while they are fresh, refer back to the table's figures instead of repeating them, and establish marketplace operating as a different business before the promise table and the recommendation rely on it. The promise table follows because it needs the model names as its columns, and the economics follow it directly because a number means nothing until the reader knows whose promise it pays for; the worked example applies promises and numbers to one jacket, and the peak closes the numbers as the one no single order shows. The stages come after the models and numbers because a stage is defined by how many models, channels and locations a merchant runs; before them 'three or four models on one stock' would name things the reader has not met. The stages end on the hubs the Omnichannel stage makes necessary, and the incidents follow because they are what that stage costs when the hubs are missing; their opening sentence says what merchants now compete on. The incidents come directly before the choices: they are the problem the three arrangements answer. The choices come last because they are the chapter's answer and need everything before them.\n\n## Introduction\n\n**Hook** (`intriguing_example`): A brand's web shop sells a jacket to a shopper; its wholesale team sells the same jacket to a retail chain. Software built for the first sale can accept the second order yet fail to meet its conditions.\n\n**Bridge:** Anyone can picture the same product sold to a person and to a shop. → The two sales carry different obligations (an agreed price, a delivery date and a return right against a contract price, labeled pallets and a readable invoice), and so do selling on a marketplace and running one: the differences are the business models.\n\n**Thesis statement** (KEY POINTS callout, first and third bullets; paragraph p02 states the premise in prose): A business model decides who makes which promise (who captures the order, sets the price, is the legal seller, holds the stock and ships), and the systems follow from which promises the merchant keeps itself and which it leaves to a partner; growth changes the need by shape, not revenue, because each added channel, stock location, country or brand adds systems holding copies of the same orders and stock.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p03):\n\n- Start from what the people running Kestrel & Pine's four lines asked of technology. *Kept in:* scene.\n- Define the business models, check them against the public record, and show who keeps which promise in each. *Kept in:* models, in-practice, promise-chain.\n- Follow the money an order earns and costs, through one jacket in three lines and through the peak. *Kept in:* unit-economics, worked-example, seasonality.\n- Define the four scale stages: how a business changes shape as it grows, and what that adds to its systems. *Kept in:* stages.\n- Show how the lines failed over facts they shared and nobody owned, and answer what four lines should share and what must stay separate. *Kept in:* when-it-goes-wrong, choices.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A brand sells the same jacket to a shopper and to a retail chain, and software built for the first sale can accept the second order yet fail its conditions, because the chain may require a contract price, labeled pallets and an invoice its systems can read. | scenario: One jacket sold by the web shop to a shopper and by the wholesale team to a retail chain. |  |\n| p02 | claim | Marketplace sellers and operators carry yet other obligations; orders that look alike differ because each way of selling decides who captures the order, sets the price, is the legal seller, holds the stock and ships, so a merchant needs a system for each promise it keeps itself and a connection for each it leaves to a partner, and growth changes that need by shape, not revenue. |  | `additional_support`: The two sales of one jacket and their different conditions. → Two further cases, selling on a marketplace and operating one, and the general point that similar orders differ in obligation. |\n| p04 | context | Eva's jacket from the previous chapter is a consumer purchase; the same jacket also leaves Kestrel & Pine, the fictional outdoor brand, by a wholesale reorder, a marketplace order or a store sale, and these are the company's four business lines, each needing a different route from order to payment and delivery. |  | `example`: Orders that look alike and carry different obligations. → The four routes one jacket takes out of the running example's company, its four business lines. |\n| p03 | transition | The chapter starts from what the people running the four lines asked of technology, defines the business models, checks them against the public record and shows who keeps which promise in each, follows the money an order earns and costs through one jacket in three lines and through the peak, defines the four scale stages as how a business changes shape and what that adds to its systems, shows how the lines failed over facts they shared and nobody owned, and ends on the practical question of what four business lines should share and what must stay separate. |  | `sequence`: Kestrel & Pine's four business lines. → The order in which the chapter takes them and the practical question it ends on. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: One Jacket, Four Ways to Sell It\n\n**Controlling idea** (`context`, id `scene`): Asked what they needed from technology, the people who run Kestrel & Pine's four lines each named a different obligation, so the task is to find what the lines can share and what each must keep.\n\n**Advances the thesis** (S1): Shows in one company that lines selling the same product ask different things of the systems.\n\n**Transition in:** `example`: One jacket leaving the company by four routes. → The company's four lines in figures and what the people running them asked for.\n\n**Order of paragraphs** (`chronological`): The accounts, the question, the answers, then what the answers have in common: the reader hears the requests before being told they are different obligations.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | In February 2027 Noor Visser and the finance director reviewed the accounts before proposing Waypoint: €48.0 million of 2026 revenue from four lines that share one warehouse and one catalog. | scenario: 2026 revenue €48.0 million at 54% gross margin: €27.0 million online, €12.0 million wholesale, €6.0 million through six stores, €3.0 million through three marketplaces; one warehouse in Duiven, 3,400 products. |  |\n| p06 | transition | Noor then asked the people who run the four lines what they needed from technology in 2027. |  | `time`: The review of the four lines' accounts. → The question put to the people who run them. |\n| p07 | example | The storefront and marketplace manager asked for completed checkouts, credible delivery dates and fresher marketplace stock, while the wholesale lead asked for correct contract prices, fewer hand-typed orders and an end to chargebacks, the deductions a retailer takes from an invoice when a delivery breaks its rules. | scenario: 38% of wholesale orders were still typed from email into the ERP. | `example`: The question Noor asked. → The answers of the two people who sell. |\n| p08 | example | Operations asked that pallets and parcels stop competing for the same pickers and that the web shop see store stock, and finance asked for one definition of an order. | scenario: Daniel Okafor's and Sanne de Wit's requests. | `additional_support`: The answers of the two selling leads. → The answers of the two people who serve every line. |\n| p09 | claim | Each request exposed a different business obligation, so Noor's proposal had to identify the facts the four lines could share and the rules each needed to keep. |  | `cause_effect`: The four sets of requests. → What they have in common, and the task that follows: separate shared facts from line-specific rules. |\n\n### The Business Models, Defined by the People Who Report Them\n\n**Controlling idea** (`definition`, id `models`): The model names have exact definitions in statistics and annual reports, and a merchant usually runs several models at once.\n\n**Advances the thesis** (S2): Gives each model a definition that can be counted, so the later sections can say what each one changes.\n\n**Transition in:** `elaboration`: The four lines and their different requests. → The names of the business models those lines are instances of, with exact definitions.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition | Marketing uses the model names loosely, while statistics agencies and annual reports define them precisely because they have to count something, and their definitions distinguish nine models. | table: Nine models (B2C, D2C, wholesale, B2B e-commerce, B2B2C, marketplace selling, marketplace operating, omnichannel, subscription), each with a working definition and the report or agency that uses it.; figure: Figure 1: nine small scenes, one per model. |  |\n| p11 | definition | Three terms in the table need plain words: the seller of record is the party that legally sells to the customer, GMV is the value of orders passing through a platform including what it does not keep, and EDI-type sales are orders received as structured messages between systems. | quotation: Shopify's 2025 annual report defines GMV as 'the total dollar value of orders facilitated through our platform' net of refunds; Amazon states it is not the seller of record for third-party sales.; figure: Figure 2: the invoice links shopper and seller, a GMV stack with a small fee kept, EDI at 11.07% against web sales at 8.39%. | `elaboration`: The table of definitions. → The three terms in it that a newcomer has not met. |\n| p12 | claim | The models are not exclusive: Kestrel & Pine's four lines run four models (D2C through web shop and stores, wholesale, marketplace selling, and omnichannel where stores and web shop share stock and orders), and most merchants that have outgrown a single channel run at least two. | scenario: Kestrel & Pine's four lines. | `contrast`: Nine models defined one by one. → That a merchant runs several of them together. |\n\n### In Practice: What the Public Record Says\n\n**Controlling idea** (`evidence`, id `in-practice`): Annual reports and official statistics confirm that the models differ in ways an architecture has to serve, and that one of them, marketplace operating, is a different business.\n\n**Advances the thesis** (S2, S3): Checks the definitions against what companies and agencies publish, directly after them, and establishes marketplace operating as a different business before the promise table and the recommendation rely on it.\n\n**Transition in:** `additional_support`: The models by definition, and the four Kestrel & Pine runs. → What annual reports and official statistics say the differences mean at full scale.\n\n**Order of paragraphs** (`grouping`): One finding per model: stores, the direct channel, marketplace operating, and business ordering last. Figures already in the definitions table are referred back to, not repeated.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32a | transition | The definitions come from reports and the four lines from one fictional company; the same reports and official statistics show what the differences mean at full scale, in four findings. |  |  |\n| p33 | evidence | For a retailer with stores, the stores are still the larger channel, and the architecture must treat them as one. | statistic: Online sales were 13.5% of German retail (2025) and 17.1% of US retail in the second quarter of 2026; Target's stores fulfilled 97.6% of its merchandise sales, including digital orders. | `example`: The announcement of four findings from the public record. → The first: stores as the larger channel. |\n| p34 | evidence | A brand's mix of direct and wholesale sales moves from year to year, so the platform must serve both without a replatform each time. | statistic: NIKE Direct revenue of $17.7 billion against $18.8 billion a year earlier, 'primarily driven by a decrease in traffic'; VF's direct-to-consumer share is 44%. | `additional_support`: Stores as a channel in the record. → The direct channel in the record, and that its share can fall. |\n| p35 | evidence | Marketplace operating is a different business, built around sellers, listings, fees and payouts, which is why this book leaves it to other chapters and another book. | statistic: Amazon's $172.2 billion from seller services (in the definitions table); Marketplace Pulse's estimate of the third-party share of Amazon's units and GMV; Zalando's partner business at 32.1% of its GMV. | `contrast`: Models a brand runs itself. → The one model a brand should not take as its pattern. |\n| p36 | evidence | Business ordering runs on two routes, the web shop and structured messages sent from the buyer's system, and the message route is the larger, so a wholesale architecture has to consider both. | statistic: Forrester's 2022 forecast expected US B2B e-commerce to reach about $3 trillion by 2027 and tracked EDI separately at about a fifth of all US B2B transactions; US and EU figures are measured differently; the Eurostat comparison is in the models table. | `additional_support`: The consumer-facing models in the record. → The business-to-business route in the record. |\n\n### What Each Model Changes in the Promise Chain\n\n**Controlling idea** (`comparison`, id `promise-chain`): A business model is a decision about who makes and keeps each promise of an order, and those answers decide what the systems must do.\n\n**Advances the thesis** (S3): States the chapter's definition of a business model and shows, promise by promise, how the answers differ per model.\n\n**Transition in:** `cause_effect`: The models by definition and in the public record. → What a model means for the systems: who makes and keeps each promise an order carries.\n\n**Order of paragraphs** (`large_to_small`): The whole table, with clause-length glosses of its new terms in the cells, then fuller definitions of three of them, then the two rows that matter most: the reader cannot weigh a row before the words in it are plain.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | claim | A business model is a decision about who makes and keeps each of the promises an order carries, and the answers, shown for the four models Kestrel & Pine runs and for the marketplace operator, decide what its systems must do. | table: Seven promises (who captures the order, sets the price, is seller of record, holds the stock, ships, handles returns, invoices) across five models, with the architectural consequence of each model in the last row. |  |\n| p14 | definition | Three terms in the table need more than the short glosses in its cells: punchout, repricing and a marketplace's fulfillment program. |  | `elaboration`: The promise table. → The three words in it that need more than a cell gloss. |\n| p15 | analysis | Two rows deserve emphasis: who captures the order decides where the order record is born, and who holds the stock decides how many locations the availability calculation must cover. | figure: Figure 3: Kestrel & Pine's four lines capture orders in four systems and draw on one stock and one profit-and-loss statement. | `emphasis`: The rows of the promise table. → The two rows with the largest consequences for systems. |\n\n### The Unit Economics of an Order\n\n**Controlling idea** (`analysis`, id `unit-economics`): Each number in the unit economics of an order pulls on a different part of the platform.\n\n**Advances the thesis** (S4): Ties each metric to the part of the architecture where it is won or lost.\n\n**Transition in:** `cause_effect`: Who makes which promise, per model. → What keeping those promises earns and costs per order, and where each number presses on the systems.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | claim | How much money one order makes decides which promises a merchant can afford, and each number in that calculation pulls on a different part of the architecture. | table: Eight metrics (conversion rate, cart abandonment, average order value, gross margin, return rate, shipping cost and threshold, payment fees, customer acquisition cost), each with a plain definition, a dated public benchmark, Kestrel & Pine's 2026 figure and the part of the platform it pulls on. |  |\n| p18 | analysis | Two of the numbers that look like design and finance matters are architecture matters: the reasons shoppers abandon carts are failures of a system to make a promise early and keep it, and payment fees depend on which provider the platform lets the merchant use. | reasoning: At €27 million of online revenue the gap between 1.9% and 1.4% plus a fixed fee is six figures a year. | `emphasis`: The table of metrics. → The two rows a newcomer is most likely to file under another department. |\n\n### The Same Jacket in Three Lines: A Worked Example\n\n**Controlling idea** (`example`, id `worked-example`): One jacket sold through three lines is three businesses with three sets of promises.\n\n**Advances the thesis** (S3, S4): Works the promises and the numbers through one product, so the reader sees both differ by line.\n\n**Transition in:** `example`: The metrics one by one. → One jacket's numbers in three lines.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | example | One Ridgewalker jacket, worked through the online, wholesale and marketplace lines, earns a different contribution (what is left of the price after the costs that come with each unit sold) in each and asks different things of the platform; the store line, which carries no parcel and no return parcel per order, is left out. | table: One unit through three lines: price, net revenue, landed cost €58, gross profit, fees, shipping, returns, marketing, an illustrative contribution of about €79, €36 and €62, and what each line needs from the platform; assumptions are marked. |  |\n| p20 | analysis | Read across, the table explains why the people Noor asked wanted different things: one jacket is three businesses with three sets of promises, and the architecture has to serve all three without pretending they are the same. | figure: Figure 4: one jacket travelling to a consumer, a retailer and a marketplace, earning about €79, €36 and €62. | `cause_effect`: The worked table. → What it explains about the requests in the opening scene. |\n\n### Seasonality and the Peak\n\n**Controlling idea** (`analysis`, id `seasonality`): The peak is the last of the numbers: the load the whole chain of systems must be designed for, and the date that sets the calendar for change.\n\n**Advances the thesis** (S4): Adds the one number the metrics table does not hold, the one that pulls on capacity; the conclusion and the questions use it.\n\n**Transition in:** `additional_support`: The numbers of one order, per line. → The number no single order shows: how orders bunch in time, which pulls on capacity.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The claim with public figures, Kestrel & Pine's own peak, then the two architectural facts the case shows.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | evidence | Every consumer model has a peak, and the peak is the load the systems must be designed for. | statistic: US e-commerce was 18.3% of retail sales in the fourth quarter of 2025 against 15.8% in the third; $44.2 billion of US online spending in Cyber Week 2025 with $16 million a minute at the peak; Shopify $14.6 billion over the Black Friday weekend with $5.1 million a minute. |  |\n| p22 | example | Kestrel & Pine's own peak was smaller and no gentler: at 38 orders a minute the shop platform held, and the stock sync chain and the warehouse queue behind it did not. | scenario: Black Friday week 2026: 31,000 online orders, 10.6% of the year's; a peak hour of 2,300 orders, 38 a minute, at about 41 times an average hour's traffic; the Black Friday Oversell followed. | `example`: The peak in public figures. → The running example's peak and which part of the chain failed. |\n| p22a | analysis | Two architectural facts come out of the peak: capacity is a property of the whole chain, every integration included, and the peak sets the calendar for change. | quotation: Hobbycraft postponed a website relaunch because 'we felt it was too risky to launch the website in peak trading'.; scenario: Bergzicht's spring reorder in April. | `cause_effect`: What failed at Kestrel & Pine's peak. → The two facts an architect takes from it. |\n\n### The Four Scale Stages\n\n**Controlling idea** (`definition`, id `stages`): A scale stage is a shape of business, not a revenue band, and each transition adds joins between systems until the joins are the problem.\n\n**Advances the thesis** (S5): Defines the four stages by shape and shows what each makes necessary.\n\n**Transition in:** `time`: One merchant's models and numbers at one moment. → How the shape of the business changes as it grows, in four stages.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The definition, the running example's path, outside confirmation from vendors' price lists, then the second question the stages raise, when the hub systems arrive: what public sources say and the author's judgement. The section ends on the hubs that the Omnichannel stage makes necessary, which is where the next section's incidents sit.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | definition | A scale stage is a shape of business, described by how many channels create orders, how many locations hold stock, how many countries and brands are served and who runs the technology; revenue bands are only rough markers. | table: Four stages (Starting, Growing, Omnichannel, Group) with typical size, shape, models run, what becomes necessary and the warning signs of outgrowing each. |  |\n| p24 | example | Kestrel & Pine passed through the first three stages, and its 2027 problems live in the Omnichannel stage, where three or four models share one stock and one catalog and the joins between a dozen systems become the business. | scenario: Starting in 2016–2018, Growing in 2019–2022, Omnichannel from 2023.; figure: Figure 5: each stage transition adds a channel or a location and a join between systems. | `example`: The four stages. → Where the running example stands and why its problems belong to that stage. |\n| p25 | evidence | Vendors confirm the stages in their price lists: the fee cliffs and feature gates in the tiers map the decisions the vendor expects at each size; Shopware's cliff comes early, and in the author's reading the step to a multi-year contract comes at about the Growing-to-Omnichannel transition. | source: Shopify from Basic at €28 a month to Plus 'from €2,100', with the third-party gateway fee falling from 2% to 0.2%; Shopware free until €1 million of GMV a year, then 'from €600' a month, priced on GMV; most Shopify merchants on its two smallest plans while most GMV comes from Plus and enterprise. | `additional_support`: The stages as defined and as Kestrel & Pine lived them. → Outside confirmation from vendors' price lists. |\n| p26 | evidence | Public sources give no revenue threshold for buying an order, product or warehouse management system; they point to the work instead: scattered content, slow channel launches, several sales channels and stock locations. | source: Akeneo's signs that a PIM is needed; practitioner guides for order management systems. | `contrast`: What vendors' price lists mark: sizes and the decisions expected at each. → What no public source marks: a revenue threshold for the three hub systems; the sources point to the work instead. |\n| p27 | recommendation | The author's judgement is to consider a PIM when a third channel brings another content format, an OMS when orders need allocation across a second stock location and a WMS when warehouse work outgrows the ERP's stock module, as reasons to investigate and not thresholds. | scenario: Waypoint adds a PIM, an OMS and availability management at Kestrel & Pine's Omnichannel stage. | `cause_effect`: The lack of a public threshold. → The author's own triggers, labelled as judgement. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`example`, id `when-it-goes-wrong`): Kestrel & Pine's lines share facts (a price, an order, a stock figure, a refund) that more than one system holds and nobody owns, each line has failed there in its own way, and every failure was found and repaired the same way.\n\n**Advances the thesis** (S6): Shows the cost of leaving the shared facts unowned, in four incidents.\n\n**Transition in:** `example`: The Omnichannel stage, where the joins between systems become the problem. → Where Omnichannel merchants now compete in a slow market, and Kestrel & Pine's losses there: four incidents over facts that several systems hold and nobody owns.\n\n**Order of paragraphs** (`grouping`): Four incidents in the same shape (a fact held in two places, a difference somebody noticed), then what they share: the common remedy is only visible after all four.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | claim | At the Omnichannel stage the joins become the problem, and with online growth in single digits merchants compete on margin, returns and operations; Kestrel & Pine has been losing money at those joins: its lines share facts that more than one system holds and nobody owns, and each line has failed there in its own way. | statistic: Dutch online consumer spending €35.7 billion in 2025, down 1%; German online goods sales €83.1 billion, up 3.2%. |  |\n| p39 | example | The Price Drift: two lines sold one jacket at two prices for nine days because a price-list sync failed silently, and a marketplace noticed before the merchant did. | scenario: October 2026: €179 on the German storefront against €199 elsewhere for nine days; 410 orders, about €8,200 of margin and a price-parity warning. | `example`: The claim that models fail where they share systems. → The first case, a price shared by channels. |\n| p40 | example | Wholesale on a consumer platform: over a third of wholesale orders are born in a system the consumer line never sees, and the documents that leave with the goods are the same kind of gap: the retailer compared the pallet labels with the despatch advice, found they did not match and deducted the difference, a promise no consumer system knows how to make. | scenario: 62% of wholesale orders through the platform's B2B features and 38% keyed into the ERP; the ASN Chargeback of Q3 2026, €14,200 deducted by Bergzicht. | `additional_support`: The price case. → The wholesale case. |\n| p41 | example | The store as an afterthought: store stock never reached the platform, so a click-and-collect pilot promised items the store had already sold. | scenario: The Store Stock Mirage: 37 items promised in December 2026 by the Utrecht pilot. | `additional_support`: The wholesale case. → The store case. |\n| p42 | example | Returns bolted on: a 24% return rate is a fact of the business model, and two tools that could each refund without seeing the other refunded 212 returns twice, found by finance at month-end from two credits per order. | scenario: The Double Refund of January 2027: 212 returns refunded by the returns portal and again by hand in the PSP's console; Sanne de Wit found them at month-end from two credits per order in the ERP. | `additional_support`: The store case. → The returns case. |\n| p43 | synthesis | In every case the failure was found by comparing two copies of the same fact, twice by an outsider before the company itself, and repaired the same way: decide who owns the fact and make the others consumers of it. |  | `conclusion_summary`: The four cases. → What they share in detection and recovery. |\n\n### The Choices: One Stack, Many Stacks or a Shared Core\n\n**Controlling idea** (`comparison`, id `choices`): A merchant with several models can run one stack, a stack per line or a shared core with line-specific edges, and should own the shared facts once from the moment the joins start to cost money.\n\n**Advances the thesis** (S6): Answers the chapter's practical question: what the lines share is owned once, what differs stays at the edges.\n\n**Transition in:** `problem_solution`: Four incidents with one remedy: decide who owns each fact. → The three ways to arrange systems for several models, and the one that owns shared facts once.\n\n**Order of paragraphs** (`comparison`): The three arrangements in the order a merchant meets them, then the author's choice: the recommendation needs all three described first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | claim | A stack is the set of systems a business line runs on, and a merchant running several business models has three realistic ways to arrange its stacks, each right somewhere. |  |  |\n| p29 | description | One stack for every line is the simplest to run and the cheapest to integrate, and it fits until one line's promises do not fit the platform's model. |  | `example`: The three arrangements. → The first, with where it fits and where it limits. |\n| p30 | description | A stack per line gives each line the best fit for its promises at the cost of the joins: four order records, four prices and four stock figures. | scenario: Kestrel & Pine in January 2027; the Price Drift and the Store Stock Mirage of the previous section and the Three-Status Order of the previous chapter began here. | `contrast`: One shared stack. → The opposite arrangement and its cost. |\n| p31 | description | A shared core with line-specific edges owns the facts every line shares once, in the hub systems the Omnichannel stage makes necessary, and makes the promises that differ at the edges; it costs more systems and discipline, and pays only once the joins have become the problem. | figure: Figure 6: one stack, a stack per line with tangled joins, a shared core with an edge per line.; table: The three arrangements compared on number of order records, fit of each line's promises, integration load, typical stage, warning sign and Kestrel & Pine's years in each, which follow the ledger's stage years (one stack while Starting, 2016–2018; a stack per line from the separate till system of 2019 to 2026; Waypoint from 2027). | `problem_solution`: The joins that a stack per line multiplies. → The arrangement that owns shared facts once. |\n| p32 | recommendation | The author's recommendation is to stay on one stack as long as every line's promises fit it, to move to a shared core the moment a second system starts writing a fact the shop platform also writes, never to choose a stack per line on purpose, and not to copy a marketplace operator, whose different business the public record showed. |  | `cause_effect`: The comparison of the three arrangements. → The author's choice among them and its conditions. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The models, the numbers and the stages answer one question from three sides: what the lines of a business can share. They can share facts (the product, the price list, the stock, the order record) and cannot share promises, and a stage is the count of promises a merchant makes at once; so the same table that tells the models apart also says which facts need one owner and when.\n\n**So what:** A merchant that has filled in who makes which promise for each line, and measured its numbers, can say where its architecture must be strong and can refuse an architecture copied from a company with a different model or shape.\n\n**Callback:** The jacket sold by the web shop to a shopper and by the wholesale team to a retail chain, where software built for the first sale failed the conditions of the second. The reader can now say what that software lacked: the two sales can share the product, the price list, the stock and the order record, and each needs its own promises kept at its own edge.\n\n**Takeaway** (`course_of_action`): Fill in the who-makes-which-promise table for each line, measure the numbers nobody has measured, and take the eight questions to the business.\n\n**Hand-off** to [The Map of a Commerce Platform: Capabilities and Layers](commerce-capability-map.html): `sequence`: The business models and unit economics, which say what a platform must do. → The parts a platform is made of and what each one owns.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43a | synthesis | The jacket sold to a shopper and to a retail chain can share one product record, price list, stock and order record, and cannot share the promise each sale makes; so Kestrel & Pine's four lines share the facts and keep their edges, and the stage, a shape and not a revenue figure, says when owning the facts once starts to pay. | reasoning: The opening's two sales set against the chapter's answer. |  |\n| p44 | synthesis (list) | Established: the models are defined operationally by those who report them and a merchant usually runs several, business electronic ordering is mostly by structured message, and each number in an order's economics is measurable against a public benchmark. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, sorted by how settled they are, starting with what the public record establishes. |\n| p45 | synthesis (list) | Depends on context: whether one stack can serve several lines, whether a merchant has reached the Omnichannel stage, and whether payment fees are worth negotiating. |  | `contrast`: What the public record settles. → What changes with the merchant's situation. |\n| p46 | recommendation (list) | The author's synthesis: a business model is the answer to 'who makes which promise', and the unit-economics table is a map of where the architecture must be strong. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p47 | recommendation (list) | Eight questions let the reader apply the chapter to their own company's lines, numbers, stage and vendor. |  | `cause_effect`: The take-aways. → Questions that apply them. |\n| p48 | transition | The models and the numbers say what a commerce platform must do, not yet what its parts are; the next chapter lays out the capability map. |  | `sequence`: The business models and unit economics, which say what a platform must do. → The parts a platform is made of and what each one owns. |\n\n## Non-goals\n\n- The capability map and the suite versus best-of-breed question. See [The Map of a Commerce Platform: Capabilities and Layers](commerce-capability-map.html).\n- The system-of-record decision per fact. See [Who Owns the Truth: Boundaries, Bounded Contexts and Systems of Record](boundaries-and-systems-of-record.html).\n- The platform vendors and their pricing models in depth. See [Suites, SaaS, Open Source and Composable: The Platform Landscape in 2026](commerce-platform-landscape.html).\n- The mechanics of each model's systems: B2B accounts, contract prices and approvals; EDI; marketplace listings, orders and fees; POS and omnichannel fulfillment; promotions and loyalty. See [Selling to Businesses: Accounts, Contract Prices, Quotes and Approvals](b2b-commerce.html), [Documents Between Companies: EDI, Punchout and E-Invoicing](edi-and-e-invoicing.html), [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html), [Stores Are Systems Too: Point of Sale and Omnichannel Fulfillment](stores-and-omnichannel.html), [Discounts, Coupons and Loyalty: Promotions Without Chaos](commerce-promotions.html).\n- The scale-stage transitions as decisions (what to change when); build, buy or assemble and replatforming; peak engineering. See [What Changes at Each Scale: From First Store to Group](commerce-scaling-stages.html), [Build, Buy or Assemble: Choosing and Changing Platforms](build-buy-or-assemble.html), [Moving Without Burning the Bridge: Replatforming and Migration](replatforming-and-migration.html), [Black Friday Every Year: Peak Load, Resilience and Recovery](peak-load-and-reliability.html).\n- Marketplace operating as a business (liquidity, ranking, regulation); the Amazon and Zalando cases. See LISTED, [Case: Amazon, From Monolith to Services to the Everything Store](case-amazon.html), [Case: Zalando, Microservices, Platform Strategy and the Return to Discipline](case-zalando.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-12** — Auto-resolved: 'In Practice' stays directly after the definitions. Round 3's readers asked for that position and round 4's readers asked for the old one; when readers in successive rounds ask for opposite moves, the current position stands. Rejected: Moving it back after the promise chain.\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: AC-1's expected answer changed in the journal spec first and copied here (rule 1). Rejected: Keeping an expected answer the ledger does not support.\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: after the confirming round 4 (ESCALATE: 14 passed, 11 failed), its cheap draft fixes were applied without a further round: p18's topic sentence names the common idea; p38 opens from the Omnichannel joins before the market figures; p12 maps the four lines onto the four models; 'treat them as one' now 'as a channel'; 'order management decision' now 'a decision about where each order is fulfilled'; the Forrester sentence simplified; p02 no longer repeats KEY POINT 1 word for word. To stay within 6,500 words, the agent-added stage sentence <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
