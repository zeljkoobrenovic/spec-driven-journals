<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Who Sells What to Whom: Business Models and the Economics That Shape Architecture\n\n## Intent\n\nExplain to a reader new to commerce why a brand selling to consumers, a wholesaler, a retailer with stores, a marketplace seller and a marketplace operator need different systems, and give them the two tools the rest of the book assumes: the unit economics of an order (conversion, basket, margin, returns, shipping, payment fees, acquisition cost, the peak) with what each number pulls on in the architecture, and the four scale stages (Starting, Growing, Omnichannel, Group) defined by the shape of the business rather than its revenue. The chapter owns **business model** (defined for architecture as \"who makes which promise\"), **scale stage** and **unit economics of an order**. After reading, the reader can fill in a who-makes-which-promise table for their own company's lines, read a vendor's price tiers as a map of expected decisions, and say which of the three arrangements (one stack, a stack per line, a shared core with line-specific edges) their merchant is in and should be in.\n\n## Audience\n\nReaders new to commerce architecture, with the product manager, analyst or consultant who has to turn a business plan into system requirements benefiting most, and the engineer who has only ever seen one business line close behind. Leaders deciding whether business lines or brands should share a stack get the trade-off table and the conditions. No commerce or finance vocabulary is assumed; seller of record, GMV, EDI-type sales, interchange, AOV and the model names are each explained once.\n\n## Success criteria\n\n- [x] Every business model (B2C, D2C, wholesale, B2B e-commerce, B2B2C, marketplace selling, marketplace operating, omnichannel, subscription) is defined in a table using a dated company or statistical source, and \"seller of record\", \"GMV\" and \"EDI-type sales\" are explained in plain words.\n- [x] A promise-chain table says, per model, who captures the order, sets the price, is seller of record, holds stock, ships, handles returns and invoices, with the architectural consequence.\n- [x] A unit-economics table gives each metric a plain definition, a dated public benchmark, Kestrel & Pine's ledger figure (or \"not in the ledger\") and the part of the platform it pulls on; every non-ledger, non-documented number is labeled *(assumption)*.\n- [x] A worked example takes the Ridgewalker jacket (€199 consumer incl. 21% VAT, €95 wholesale excl. VAT, €58 landed cost) through the D2C, wholesale and marketplace lines to an illustrative contribution per unit, with assumptions labeled and the arithmetic correct.\n- [x] The four scale stages are defined by shape, in a table with typical size, shape, models run, what becomes necessary and warning signs, matching the ledger's bands and Kestrel & Pine's 2016–2018 / 2019–2022 / 2023– path; vendor tiers (Shopify, Shopware) are cited as confirmation, dated n.d., accessed 2026-11.\n- [x] Three arrangements (one stack, a stack per line, shared core with line-specific edges) are compared in a trade-off table with a conditional recommendation, tied to Waypoint's shape.\n- [x] A reader new to the field can define every term the chapter uses from the chapter alone; every acronym is expanded on first use; two mermaid diagrams with captions.\n- [x] The three take-away tiers are present; 6–10 questions to ask; closes with a hand-off to [The Map of a Commerce Platform: Capabilities and Layers](commerce-capability-map.html); the article is at or under 6,500 words including tables.\n\n## Non-goals\n\n- The capability map and the suite vs best-of-breed question — [The Map of a Commerce Platform: Capabilities and Layers](commerce-capability-map.html); the system-of-record decision per fact — [Who Owns the Truth: Boundaries, Bounded Contexts and Systems of Record](boundaries-and-systems-of-record.html); the platform vendors and their pricing models in depth — [Suites, SaaS, Open Source and Composable: The Platform Landscape in 2026](commerce-platform-landscape.html).\n- The mechanics of each model's systems: B2B accounts, contract prices and approvals — [Selling to Businesses: Accounts, Contract Prices, Quotes and Approvals](b2b-commerce.html); EDI — [Documents Between Companies: EDI, Punchout and E-Invoicing](edi-and-e-invoicing.html); marketplace listings, orders and fees — [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html); POS and omnichannel fulfillment — [Stores Are Systems Too: Point of Sale and Omnichannel Fulfillment](stores-and-omnichannel.html); promotions and loyalty — [Discounts, Coupons and Loyalty: Promotions Without Chaos](commerce-promotions.html).\n- The scale-stage transitions as decisions (what to change when) — [What Changes at Each Scale: From First Store to Group](commerce-scaling-stages.html); build, buy or assemble and replatforming — [Build, Buy or Assemble: Choosing and Changing Platforms](build-buy-or-assemble.html), [Moving Without Burning the Bridge: Replatforming and Migration](replatforming-and-migration.html); peak engineering — [Black Friday Every Year: Peak Load, Resilience and Recovery](peak-load-and-reliability.html).\n- Marketplace operating as a business (liquidity, ranking, regulation) — LISTED; the Amazon and Zalando cases — [Case: Amazon, From Monolith to Services to the Everything Store](case-amazon.html), [Case: Zalando, Microservices, Platform Strategy and the Return to Discipline](case-zalando.html).\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\n## Open questions\n\n- The worked example's per-order costs (parcel €5.50, cross-border parcel €7.50, return handling €7.50, marketing 12% and 5%, pallet share €0.60, iDEAL about €0.30) are labeled assumptions and are not in the ledger; if another chapter needs them canonically it should append them, and this chapter should then cite the ledger.\n- Amazon's 15% referral fee is taken from its US pricing page; the German fee schedule was not verified. The chapter labels the marketplace line's fee as an assumption of the same order; [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html) should replace it with a verified Amazon.de figure if one is found.\n- No primary benchmark exists for retail technology spend as a share of revenue or for team size per stage; the chapter avoids both. The ledger's 5.4% is not presented as a benchmark.\n\n## Decision log\n\n- **2026-11-07** — Defined the models from annual reports and Eurostat rather than from vendor marketing, because the reader needs definitions that can be counted and checked; B2B2C is defined operationally from Zalando's partner-business description since no statistical definition exists.\n- **2026-11-07** — Chose \"who makes which promise\" as the chapter's definition of a business model, so that the chapter builds directly on [Follow the Order: What Happens Between “Buy” and “Delivered”](journey-of-an-order.html) and feeds [Who Owns the Truth: Boundaries, Bounded Contexts and Systems of Record](boundaries-and-systems-of-record.html) rather than standing as a business-school detour.\n- **2026-11-07** — Worked one jacket through three lines rather than giving a whole-company P&L, because contribution per unit is what makes the four heads of business lines' different requests legible to a newcomer; store economics are mentioned, not tabulated, to hold the length cap.\n- **2026-11-07** — Folded the \"Across Scale Stages\" requirement (optional in Part I) into the section that defines the stages, with the required columns (typical, becomes necessary, warning signs), instead of adding a second stage table.\n- **2026-11-07** — Cut the European market-size paragraph to two national series after the first draft exceeded the cap; the three series measure different things and the chapter's argument needs only \"growth has normalized\".\n\n## Sources\n\n- **Internal**\n  - [Follow the Order: What Happens Between “Buy” and “Delivered”](journey-of-an-order.html) — the promises and handoffs the models are defined against.\n  - [Meet Kestrel & Pine](meet-kestrel-and-pine.html) and `_research/scenario-ledger.md` — the four business lines, prices, margins, return rates, peak figures, the Price Drift, the ASN Chargeback, the Store Stock Mirage, the Double Refund, the scale-stage bands.\n  - `PLAN.md` contract 2 — scope, owned terms, neighbours.\n  - `_research/brief-commerce-business-models.md` — definitions, market statistics, unit economics, seasonality, vendor tiers, PIM/OMS/WMS triggers.\n  - `_research/brief-checkout-payments-tax.md` — VAT rates for the worked example.\n- **External**\n  - VF, Nike, Columbia, Target, Amazon, Shopify, Warby Parker annual reports (SEC, 2026); Zalando SE Annual Report 2025 — model definitions, margins, channel shares, GMV definition.\n  - Eurostat, *E-commerce statistics (enterprises)*; US Census Bureau, *Quarterly Retail E-Commerce Sales*; HDE Online-Monitor; Thuiswinkel Markt Monitor; bevh — market shares and seasonality.\n  - Littledata, Baymard Institute, NRF and Happy Returns, Coresight — conversion, abandonment, returns.\n  - Regulation (EU) 2015/751; Stripe, Mollie, Adyen, Shopify Payments and Amazon pricing pages — payment and channel fees.\n  - Shopify and Shopware pricing pages; Akeneo and an OMS vendor guide — tiers and hub triggers.\n  - Adobe Analytics and Shopify BFCM releases; Retail Week on Hobbycraft — the peak.\n\n## Changelog\n\n- **2026-11-07** — Initial spec and article. *(AI-mediated session)*\n- **2026-11-07** — Editorial review pass: corrected Shopify's Basic price (€28, €21 paid yearly), moved Germany (2022) into the Growing stage, defined punchout, parity rules, repricing, tenancy and ASN, fixed the wholesale-contribution comparison and the Double Refund attribution. *(AI-mediated session)*\n- **2026-11-07** — Final consistency pass: \"Not in the ledger\" cells and note rephrased so the reader is not pointed to the scenario ledger. *(AI-mediated session)*\n- **2026-11-07** — Visual layer: redrew 2 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator). *(AI-mediated session)*\n"}]}]}</script>

                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
