<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-13 from the published page (posts/domain-coverage/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the page, in its order; tables are recorded as evidence of the paragraph they follow. Intent, acceptance criteria and role are copied unchanged from journal-spec.json; the journal spec gives a reference page no thesis, so the thesis here is the page's own and only orders its sections. A light pass for a lookup page: the entries were checked for consistency, not rewritten.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Which chapter covers each capability of the three Productscape model families (merchant platform, retail marketplace, nine specialist products), by capability and by model.\n- **Know:** Which capabilities are covered only briefly, left out or left to the ERP or to LISTED, and why; where the book departs from the models.\n- **Know:** That the models are architectural models inferred from public product behavior with modeled seed values: planning maps, never a source for a fact about a company.\n- **Be able to:** Find the chapter for a system they own by the job it does, and a reading route for their role.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader finds the chapter that covers a capability, or learns that it is left out and why. *Probe:* Using only this page: where does the book cover reviews and ratings, where does batch and lot traceability stand, and is route planning for an own delivery fleet in the book? | `custom` | cold_reader | major |\n| AC-2 | A reader says what the planning models are, why they are not evidence, and what the book adds that they lack. *Probe:* Using only this page: what are the models behind the book's planning, may a claim about Shopify's internal systems be sourced to them, and name two things the book covers that the models do not? | `custom` | cold_reader | major |\n| AC-3 | A reader uses the persona table as a reading route. *Probe:* Using only this page: an IT, ERP and integration lead joins a merchant. Which Kestrel & Pine seat matches the role, and which chapters should they start with? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict what the page contains and the kind of evidence or material it uses. *Probe:* After reading only the introduction: what will this page give you, in what order, and from what kind of material? | `intro_predicts_content` | cold_reader | major |\n\n## Thesis\n\n**Question:** Which research models stand behind the book, and which chapters cover them?\n\n> **Claim:** Eleven Productscape models in three families, inferred from public product behavior, stand behind the book's plan; each of their capabilities is sent to the chapter that covers it, or named as thin or left out with a reason, and the book adds the joins the models lack, so the models serve as a planning map and never as evidence about a company.\n\n**Disputed by:** The view that a coverage page only records the author's planning: a reader searches the chapters for a topic, and a model drawn from a real product's behavior is good enough evidence of how that product is built.\n\n**So what:** A reader finds the chapter for the system they own by the job it does, checks the left-out list against their business before relying on the book as a complete map, and never cites a model for a fact about Shopify, Amazon or a specialist vendor.\n\n**How and why:** The digest lists 152 distinct capabilities across the models; the rows were placed from the chapter contracts and checked by text search against the written chapters, which moved three gaps into chapters and found six more thin spots. The models were drawn one product at a time, so they have no integration layer, scale stages, failure patterns or cross-product journeys; the book's Parts VI, IX and X and its failure patterns supply them.\n\n**Supporting claims**\n\n- **S1** — The models are capability inventories inferred from public product behavior with seed values, so they are planning maps and never a source for a fact about a company.\n- **S2** — Every capability of the models is sent to a primary chapter, read either by capability, grouped by the book's parts, or by model.\n- **S3** — The capabilities the book covers thinly or leaves out are named, each with the reason.\n- **S4** — The book departs from the models' product-by-product shape and adds the joins between products.\n- **S5** — The models' personas map to the book's reader roles, a Kestrel & Pine seat and starting chapters, so the page doubles as a reading route.\n\n## Role in the part\n\nOpens the reference part and sends a reader from a capability to its chapter, saying plainly what is left out and that the planning models are not evidence. Supports PR-1 of part `reference`.\n\n## Flow\n\n**Pattern:** `large_to_small`\n\nWhat the models are comes first, because every table that follows is read under the rule that they are maps, not evidence. The full map by capability and then by model follows; the gaps, the departures and the personas each narrow it to one question a reader brings (is my job left out, why does the book not copy the models, where do I start). Putting the gaps before the map would list exceptions to a map the reader has not seen.\n\n## Introduction\n\n**Hook** (`direct_statement`): Commerce spans more business jobs than one book can cover equally: these pages show where each one is covered, what is left out, and where the records, terms and sources live.\n\n**Bridge:** The reader has met cards, terms and sources in the chapters, each introduced where it was needed, and arrives with a business job or system to look up. → The reference pages gather that material for lookup, and this one sends a job to its chapter and says what the book leaves out.\n\n**Thesis statement** (KEY POINTS callout and paragraph p01): Every capability of the eleven models has a home or a stated reason for its absence; the book adds the joins the models lack; the models are maps, not evidence.\n\n**Roadmap** (IN THIS SECTION callout and paragraph p01):\n\n- What the planning models are and the rules for reading them. *Kept in:* models.\n- Tables tracing each capability to the chapter that covers it, by capability and by model. *Kept in:* by-capability, by-model.\n- Which topics are outside the book's scope, and why. *Kept in:* uncovered.\n- How the coverage differs from the models. *Kept in:* departures, personas.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Use this page to find the chapter that covers a business job, or to learn that the book leaves it out, by looking the job up by what it does; its tables also record how coverage differs from the eleven Productscape models used in planning. |  |  |\n| p02 | transition | This page opens the four reference pages, which gather for lookup what the chapters introduce: domain coverage sends a capability to its chapter, the toolkit gives sixteen cards, the glossary gives each term one meaning and an owning chapter, the bibliography lists each cited source with its date and citing pages. |  | `elaboration`: This page's purpose. → The other three reference pages and what each is for. |\n| p03 | transition | For the architectural argument behind the map, the reader goes to commerce-capability-map and boundaries-and-systems-of-record. |  | `contrast`: The four lookup pages. → Where the argument lives instead. |\n\n## Sections\n\n### Where the Models Come From\n\n**Controlling idea** (`definition`, id `models`): The models are capability inventories inferred from public product behavior, so four rules govern how the book uses them and how the tables are read.\n\n**Advances the thesis** (S1): Fixes what the models are before any table relies on them.\n\n**Transition in:** `elaboration`: The eleven models named in the opening. → What a model is and where these came from.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | definition | A Productscape domain model describes customers, needs, capabilities called bricks and their supporting modules and data; the digest of 7 November 2026 supplied the book's planning map. | table: Family, model and short code, inspiration, brick count and root groups for MCP (29), ORM (30) and the nine specialist models. |  |\n| p05 | claim (list) | Four rules follow from what the models are: nothing in a model is a fact about a company, every number is a seed value, the specialist models are used for capabilities only, and the running example is fictional. |  | `cause_effect`: What the models are. → The rules that follow for the book. |\n| p06 | explanation | In each row the codes name the source models, the first linked chapter gives the main treatment and chapters in parentheses a related one; placements came from the chapter contracts, checked against the written chapters. |  | `sequence`: The rules. → How to read the tables that follow. |\n| p07 | explanation | Three broad chapters (the capability map, boundaries, scale stages) are left out of repeated rows. |  | `additional_support`: How a row is read. → Which chapters the rows omit. |\n\n### Coverage by Capability\n\n**Controlling idea** (`description`, id `by-capability`): The 152 capabilities, merged into topic rows grouped by the book's parts, each name their models and their chapter.\n\n**Advances the thesis** (S2): Gives the map from capability to chapter.\n\n**Transition in:** `sequence`: How to read a row. → The rows, grouped by part.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | description | The models contain 152 distinct capabilities, and a row is a topic group rather than one model entry. | table: Tables for Parts II (catalog) and III (order), each row a capability group, its models and its chapters. |  |\n| p09 | description | The warehouse chapter also covers automation beyond the models, and the remaining parts' tables complete the map. | table: Tables for Parts IV, V, VI, VII, VIII and X in the same format. | `additional_support`: The catalog and order tables. → Fulfillment, channels, integration, platform, trust and evolution. |\n\n### Coverage by Model\n\n**Controlling idea** (`description`, id `by-model`): The same map read from each model, by root group, with brick ids kept for cross-checking.\n\n**Advances the thesis** (S2): Lets a reader who starts from a product's model find its chapters.\n\n**Transition in:** `contrast`: The map by capability. → The same map read from the models' side.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | description | Brick ids are the models' keys, kept for cross-checking; they describe capabilities, not products. | table: MCP and ORM tables: root group, bricks with ids, chapters. |  |\n| p11 | description | The nine specialist models are shown by capability only. | table: One row per specialist model (B2B, RET, EDI, MKT, ERP, POS, SHP, WMS, HUB): capabilities summarized and chapters, with what is left out. | `sequence`: The two large models. → The nine specialist models. |\n\n### Is Anything Uncovered?\n\n**Controlling idea** (`analysis`, id `uncovered`): Seventeen capabilities are covered only briefly, left out or left elsewhere, each with a reason.\n\n**Advances the thesis** (S3): Names what the map does not reach and why.\n\n**Transition in:** `contrast`: A map in which most capabilities have a chapter. → The ones that do not, or only thinly.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | analysis | The digest flagged eleven capabilities without an owning chapter; checking the written chapters moved three into one and found six more thin spots. | table: Capability, models, where it stands, why: reviews, membership, fiscalization (covered); retail media and CRM (mentioned); lending, emissions, own-fleet routing, repair, VMI, collaboration, dropshipping (left out); lots and KYC (thin); forecasting (ERP); brand registry (LISTED); hosting (a duty). |  |\n\n### Where the Book Departs From the Models\n\n**Controlling idea** (`comparison`, id `departures`): Drawn one product at a time, the models lack the joins between products, and the book deliberately does not copy their shape.\n\n**Advances the thesis** (S4): Says what the book adds and where it disagrees, with the chapter that argues each.\n\n**Transition in:** `contrast`: What the book leaves out of the models. → What the book adds that the models lack.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | comparison | The models were drawn product by product, which gives them a shape the book does not copy. | table: The models as drawn, the book's position, where argued: no integration layer, no scale stages, stressors not failure patterns, no cross-product journey, nothing on choosing or organizing; an order record in seven models, a stock ledger in five, checkout with payments, fraud with payments, pricing in five, returns as a product, regulation as stressors. |  |\n\n### The Models' Personas and the Book's Readers\n\n**Controlling idea** (`description`, id `personas`): The models' personas group into eleven roles, each matched to a reader, a Kestrel & Pine seat and starting chapters.\n\n**Advances the thesis** (S5, S4): Turns the models' customers into reading routes and states the question the book adds.\n\n**Transition in:** `additional_support`: How the book departs from the models' products. → How it uses the models' customers.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | description | About sixty customer descriptions group into eleven roles, mapped to readers and Kestrel & Pine seats as archetypes. | table: Persona cluster, wants, reader, Kestrel & Pine seat, starting chapters (e.g. IT, ERP and integration lead: Noor Visser and Ruben Alves; integration-styles, events-consistency-and-reconciliation, api-contracts-and-versioning, erp-and-back-office-integration). |  |\n| p15 | synthesis | Four needs recur, and the failure guide shows what happens when they go unmet. |  | `conclusion_summary`: The eleven roles. → What they have in common. |\n| p16 | claim | The models describe each product's customer; the book adds how the products should work together. |  | `contrast`: The products' customers' needs. → The architect's question the book adds. |\n\n## Conclusion: How to Use This Map\n\n**Synthesis:** The capability rows, the gaps, the departures and the personas are four ways into one map: by the job, by what is missing, by what the book changes, by the reader's seat.\n\n**So what:** A reader who matches by meaning and checks the left-out list knows whether the book answers their question before relying on it.\n\n**Callback:** The opening's point that commerce spans more jobs than one book covers equally. The reader now has the left-out list to check that claim against their own business.\n\n**Takeaway** (`course_of_action`): Match each owned system by the job it does, read the departures before copying a decomposition, check the left-out list, and start with the persona row's chapters.\n\n**Hand-off** to [Toolkit: Cards and Templates for Commerce Architecture Decisions](toolkit.html): `sequence`: The map from capability to chapter. → The cards and templates those chapters introduce, with a filled example each.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | recommendation (list) | Four steps use the map: match by meaning, read the departures first, check the left-out list, and use the persona row as a reading route. |  |  |\n| p18 | transition | For practical records the reader continues to the toolkit, with the glossary for terms and the bibliography for sources. |  | `sequence`: How to use the map. → The next reference page. |\n\n## Non-goals\n\n- The capability map itself and how to place a vendor on it See [The Map of a Commerce Platform: Capabilities and Layers](commerce-capability-map.html).\n- The entity-owner table and the rule for choosing a system of record See [Who Owns the Truth: Boundaries, Bounded Contexts and Systems of Record](boundaries-and-systems-of-record.html).\n- The scale-stage map and the failure patterns See [What Changes at Each Scale: From First Store to Group](commerce-scaling-stages.html), [Out of Stock, Out of Sync: Sixteen Ways Commerce Platforms Go Wrong](where-commerce-platforms-go-wrong.html).\n- Any fact about Shopify, Amazon or a specialist vendor See [Part XI — PRACTICE: How Others Built It](part-11.html), the chapters, from dated public sources.\n- Templates and cards; definitions; sources See [Toolkit: Cards and Templates for Commerce Architecture Decisions](toolkit.html), [Glossary: Plain-Language Definitions](glossary.html), [Bibliography: Every Source the Book Cites](bibliography.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Emissions reporting on deliveries and lot traceability are listed as left out or thin; if a later edition adds a sidebar to shipping-and-delivery or warehouse-and-fulfillment, move the row to covered.\n- The brick counts per model were taken from the digest on 7 November 2026; if the models change, the counts and the 152-capability total will drift.\n- The title says 'Forty-Nine Chapters'; the journal spec now has 42 chapters, 4 walkthroughs, 4 cases and 1 tutorial besides intros and reference pages. Needs the author: which count the title means, or a title without a count (permalink unaffected).\n- Needs the author (draft-check round 2, fault spec): both flow readers wanted 'How to Use This Map' before the tables it explains; the spec declares it as the conclusion. Keep it as the conclusion or move it up.\n- Round 2 left unfixed: the introduction's third paragraph repeats the first (both flow readers); trimming it changes spec paragraph p03.\n\n## Decision log\n\n- **2026-11-13** — Auto-resolved by the author's standing instruction of 2026-11-12: the 'How to Read the Tables' rows that followed their contracts were re-checked against the written security, regulation, return journey, AI commerce and Shopify case chapters (rule 1, the chapters are the facts). commerce-regulation covers neither fiscal receipts nor recalls nor customs, so fiscal receipts point to stores-and-omnichannel, the shipping row drops its regulation link, and lot traceability names no chapter for recalls; commerce-security covers certifications under shared responsibility, not penetration tests or data centers; the consumer app appears only in case-shopify. The sentence now says the placements were checked against the written chapters. erp-and-back-office-integration added to the IT, ERP and integration lead row because that chapter serves that reader. Rejected: Keeping the contract placements; Adding recall and fiscal coverage to the chapters\n- **2026-11-13** — Converted spec.md to spec.json in a light pass for a lookup page: one spec paragraph per draft unit, tables as evidence; the thesis is the page's own because the journal spec gives a reference page none. length.max_words is the published length plus 10% (4,456 words as check_draft counts them, tables and Sources excluded; 5,561 by wc). Rejected: Specifying each table row as a paragraph; Carrying the old inventory-style success criteria over\n- **2026-11-13** — Added the Reference part's opening as one short paragraph (p02) naming the four reference pages and what each is for, and made the first sentence say what the page is for and how to use it, as the journal spec's part opening requires. Rejected: A separate part-intro page\n- **2026-11-07** — Merged the digest's 152 capabilities into topic rows per part rather than reproducing the inventory; the per-model tables keep brick ids for cross-checking.\n- **2026-11-07** — Showed the nine specialist models by capability only, with no vendor labels, so Productscape files stay research maps and never sources about a company.\n- **2026-11-07** — Verified gap placements against the written chapters by text search and added six thin spots the digest did not flag.\n- **2026-11-07** — Mapped personas to reader roles and Kestrel & Pine seats with starting chapters, so the page doubles as a reading route.\n\n## Sources\n\n- **Internal**\n  - _research/productscape-digest.md — Model inventories, the cross-model capability table and GAP list, personas and residuality notes.\n  - PLAN.md — Provenance rules, chapter contracts ('Owns') and the Reference entry.\n  - _research/style-guide.md — Reference page format and the Katapull and Productscape rule.\n  - meet-kestrel-and-pine — The cast used for the persona seats.\n- **External**\n  - The author's Productscape model families (merchant platform, online retail marketplace, Katapull Group), 2026, read through the digest — The capabilities, bricks and personas mapped on the page.\n\n## Changelog\n\n- **2026-11-13** — AC-1 and AC-3 copied from the journal spec after it was aligned with the page.\n- **2026-11-13** — Draft-check round 2 (ESCALATE, 59 pass / 23 fail, 0 waived). Cheap fixes after the round, report left stale: callout order now matches the page and mentions the reading route; glosses for Productscape, chapter contracts, LISTED and RECONCILED, residue and stressors, the failure-pattern names and the scenario's agency; the 'labels not named' rule reworded to brand names; a note on why Parts I and IX have no rows; which uncovered rows are the digest's eleven and which the six found later; opening sentences linking the departures and personas sections to their predecessors.\n- **2026-11-13** — Placements re-checked against the written chapters; persona row for the IT, ERP and integration lead extended; open question on the contract placements closed.\n- **2026-11-13** — spec.md converted to spec.json; Reference part opening paragraph and a use-this-page first sentence added to index.md.\n- **2026-11-07** — Editorial review pass: hand-off to toolkit added, timetoread.\n- **2026-11-07** — Initial spec and article.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
