<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/30-multi-tenancy-and-isolation/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (a roadmap announcing every section and a conclusion paragraph that answers the opening); these are listed in the decision log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Multi-tenancy, isolation and the pool, silo and bridge models; the mechanisms vendors document (a tenant identifier on every row, routing, shards, pods, governor limits, regions), with dates and where the public record stops.\n- **Know:** Four published rate-limit models (Shopify, Amazon SP-API, BigCommerce, commercetools; November 2026, volatile) and the rules that follow: budgets per app and store, tiered by plan, which the vendor may lower; buyers and checkout protected before integrations; webhook subscriptions that can be deleted after repeated failures.\n- **Know:** The options for one tenant or several per market or brand, and the four questions to ask every SaaS vendor (unit of isolation, limits and their changes, region, busiest day).\n- **Believe:** Tenancy is the vendor's design; its consequences are the merchant's.\n- **Believe:** The rate limit is the tenancy mechanism a merchant meets, and its own apps are often its noisiest neighbors.\n- **Believe:** Every SaaS a merchant rents is a tenancy arrangement whose busiest day is shared with its other customers.\n- **Be able to:** List the spenders of each API budget and set an order of priority for a peak, with the order flow first.\n- **Be able to:** Decide whether several markets or brands belong in one tenant, and question each vendor about its isolation, limits, region and busiest day.\n\n**Audience:** Readers new to commerce architecture; most of all the integration engineer or engineering lead preparing a peak plan on a hosted platform (Ruben Alves at Kestrel & Pine); next, the product manager or executive deciding between one tenant and several for new countries or brands.\n\n**Already knows:**\n\n- Roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its 2026 and January 2027 incidents in outline, the sixteen failure-pattern names and the Waypoint decisions W1 to W8.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines, 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, business models and the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Parts II to V: one owner per product attribute; prices frozen at order placement; available-to-promise; checkout creating the order once; payment stages; one order record with three status lines; invoices, payouts and the monthly match.\n- From Part VI: an integration style per flow with an owner, a reconciliation job, pinned API versions and sunset dates.\n- From chapter 29: one deployment unit per team that must release independently, boundaries around systems of record, and the line between the vendor's inside and the merchant's own layer.\n\n**Does not yet know:**\n\n- Tenant, multi-tenancy, isolation, SaaS as a tenancy arrangement.\n- Pool, silo and bridge; noisy neighbor.\n- Shard, pod, router, shop move; governor limit; region and data residency.\n- Rate limit, query cost, leaky bucket and token bucket, HTTP 429 and throttled responses, bulk operations.\n- App (any program that talks to the store through its API), merchant of record, platform-as-a-service.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given an order flow throttled at both ends on a peak evening, the reader explains why the storefront held while the flow did not and plans the budget, rather than buying a higher tier. *Probe:* On a brand's busiest evening its storefront works, but orders reach the warehouse hours late. Its order flow creates warehouse orders one at a time with four API calls each; the warehouse vendor allows about 30 calls a minute per customer; on the platform, three stock-writing apps and a marketplace connector's hourly full-catalog sync account for most of the recorded API calls. Using only this chapter: why did the storefront hold while the order flow did not, and what should the brand plan for next year? | `custom` | cold_reader | major |\n| AC-2 | The reader can say what decides one tenant or several for several countries. *Probe:* A merchant runs three country storefronts in one tenant and asks whether to split into one tenant per country. Using only this chapter: what decides it, and what does each answer cost? | `custom` | cold_reader | major |\n| AC-3 | The reader can state the questions to ask every SaaS vendor and why. *Probe:* Using only this chapter: what should a merchant ask the vendor of its warehouse system, returns portal or marketplace connector about tenancy, and why? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How do SaaS commerce platforms serve many merchants on shared systems, and why should a merchant care?\n\n> **Claim:** Vendors pool merchants on shared servers and databases, kept apart by a tenant identifier on every row, routing, isolated database groups and regions. The merchant meets the rate limits: budgets per app, store or customer, fixed by plan and lowerable under load, at the platform and every SaaS it rents. So it plans its share: who spends each budget, in what order at peak, and whether its country or brand storefronts share a tenant.\n\n**Disputed by:** The view that tenancy is the vendor's concern: a hosted platform scales on demand, so a merchant need not count API calls, rank its apps and connectors or ask its warehouse and returns vendors about their limits, and a throttled flow is fixed by a higher plan tier.\n\n**So what:** A merchant that accepts the claim lists the spenders of every budget with an owner, puts the order flow first, replaces polling with events and batches within each limit, asks every vendor about its isolation, limits, region and busiest day, and stays in one tenant while the platform can vary its markets. Ruben Alves's June 2027 analysis of Black Friday 2026 (illustrative) found that the WMS vendor allowed about 30 calls a minute per customer and the order flow made four calls per order, one order at a time, so it carried about seven orders a minute against 38 arriving; on the platform, nine consumers drew on the API, the stock-writing apps and the connector's full-catalog sync took about 55% of the recorded usage between 20:00 and 22:00 and the order flow about 20%, and the order flow was throttled about 1,900 times. The 2027 plan puts the order flow first (orders through the OMS, sent to the WMS in batches within its limit), moves stock to events and the ERP to a daily batch, keeps the three storefronts in one tenant and records the region of every SaaS component.\n\n**How and why:** Pooling spreads infrastructure cost across tenants, so one tenant's load, data or failure can reach the others; the vendor isolates them with identifiers, routing and pods the merchant cannot see, and caps each caller with a budget it can shrink to protect the pool, serving buyers and checkout before integrations. The shared pool smooths the platform's own peak across tenants, but a budget per app, store or customer is fixed and meets the merchant's spike in full, and a warehouse or returns vendor's other customers peak on the same Friday. A larger plan raises one bucket but not the warehouse vendor's or the marketplace's, so the order flow keeps moving only when the merchant knows who spends each budget, ranks the spenders and fits its flows (events, batches) inside each limit.\n\n**Supporting claims**\n\n- **S1** — Vendors pool merchants because one fleet and one version serve everyone cheaply, which lets one tenant's load, data or failure reach the others; they arrange tenants as pool, silo or bridge.\n- **S2** — Vendors keep tenants apart with a tenant identifier on every row, routing, isolated groups of databases (shards and pods), governor limits and regions; the merchant cannot see or change these, and the largest vendor's public record of them stops in 2021.\n- **S3** — The mechanism the merchant meets is the rate limit: budgets per app, store or customer, tiered by plan and lowerable under load, with buyers and checkout served first, so the platform's own peak is smoothed while the merchant's integrations meet fixed limits at its own spike.\n- **S4** — Every specialist SaaS the merchant rents is a tenancy arrangement with its own limits, metering and region and a busiest day shared with its other customers, so each vendor is asked about its isolation, limits, region and busiest day.\n- **S5** — The merchant plans its share before buying more: it lists who calls each API with an owner, puts the order flow first, replaces polling with events and fits its flows in batches within each limit; a higher tier raises one limit and none of the others.\n- **S6** — Several countries or brands stay in one tenant while the platform can vary what differs by market and the shared limits carry every market's peak, and split only when a legal entity, assortment or operations team differs, with the PIM and OMS beneath all tenants.\n\n## Role in the part\n\nNames what the merchant shares with its vendors: capacity metered by rate limits at the platform and at every SaaS it rents, planned as a budget with the order flow first, plus the decision on one tenant or several and the four questions to put to every vendor. Supports P7-2 of part `part-7`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in why-share to saas: tenancy, then the vendor's isolation mechanisms, then the one the merchant meets, at the platform and at every vendor; `order_of_importance` in choices to stages: the merchant's responses ranked, then the one it decides itself, then by size)\n\nThe Friday evening comes first so that every later section explains part of it: two rate limits met with nobody having decided how the calls were spent. Tenancy and its models come next because the isolation mechanisms are described in their terms; the vendor's mechanisms before the rate limit because the rate limit is the one mechanism the merchant meets, and its rules explain why the storefront held and the order flow did not. The other SaaS the merchant rents follow the rate limit directly because they meter the same way and close the loop on the WMS limit of the opening evening. The merchant's responses come next, ranked; splitting tenants, the response the merchant decides alone, is weighed after them; the stage table sizes all of it, and Kestrel & Pine's 2027 plan applies it to the opening evening. The failures come last because each is read against a mechanism already explained. Putting the rate limit before tenancy would present a vendor rule without the reason for it; putting the one-tenant decision before the ranked responses would weigh a split before the reader knows it ranks last; putting the plan before the choices would give decisions without the options they were chosen from.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): During a sale, a merchant's order export may be delayed because the platform refuses further requests until its usage allowance resets, while the shop keeps accepting purchases.\n\n**Bridge:** Anyone who has rented a hosted shop assumes the vendor handles capacity. → The vendor does handle its own capacity, by sharing it among merchants and limiting each one, so the question becomes what the sharing is and what the merchant must plan.\n\n**Thesis statement** (KEY POINTS callout and paragraph p02): Vendors pool merchants on shared servers and databases, kept apart by a tenant identifier on every row, routing, isolated database groups and regions. The merchant meets the rate limits: budgets per app, store or customer, fixed by plan and lowerable under load, at the platform and every SaaS it rents. So it plans its share: who spends each budget, in what order at peak, and whether its country or brand storefronts share a tenant.\n\n**Roadmap** (Paragraph p03):\n\n- Start from Kestrel & Pine's Black Friday evening, when its order flow met two rate limits. *Kept in:* friday.\n- Explain why platforms share and how vendors keep tenants apart, from dated vendor accounts. *Kept in:* why-share, keep-apart.\n- Treat the rate limit as the mechanism a merchant meets, at the platform and at warehouse and returns vendors. *Kept in:* rate-limits, saas.\n- Turn to the merchant's decisions: its choices, one tenant or several, and how they change with scale. *Kept in:* choices, one-tenant, stages.\n- Apply them in Kestrel & Pine's 2027 plan and say what goes wrong. *Kept in:* in-practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | During a sale a merchant's order export can wait because the platform refuses further requests until a usage allowance resets, while the shop keeps accepting purchases; hosted platforms limit use to protect shared capacity, so renting one does not remove the merchant's need to plan how its integrations use that capacity. | scenario: An order export delayed by the platform's allowance while purchases continue. |  |\n| p02 | claim | Sharing one running system among several customers is multi-tenancy; it spreads cost but needs isolation, which vendors build with shards, pods and rate limits, and the rate limits are what a merchant meets, at the platform and at every SaaS it rents, so the merchant must plan who spends each budget and in what order. | source: Shopify's FY2025 annual report (February 2026): millions of merchants on one codebase. | `cause_effect`: The limit that holds the order export back. → The design that makes the limit necessary, and the chapter's claim about what the merchant must do. |\n| p03 | transition | The chapter starts from Kestrel & Pine's Black Friday evening, explains why platforms share and how vendors keep tenants apart from dated vendor accounts, treats the rate limit as the mechanism a merchant meets at the platform and at its warehouse and returns vendors, then turns to the merchant's decisions (its choices, one tenant or several, how they change with scale), Kestrel & Pine's 2027 plan and what goes wrong. |  | `sequence`: The chapter's claim. → The order in which the chapter argues it and the kind of evidence it uses. |\n| p04 | context | Eva's jacket order, once the platform records it, has to be fetched and sent to the warehouse within both the platform's and the warehouse system's API limits; an ordinary evening leaves spare capacity, Black Friday can exhaust it. |  | `place`: The chapter's plan. → Where Eva's order stands in its journey: after the platform records it, on its way to the warehouse. |\n\n## Sections\n\n### Two Rate Limits on One Friday Evening\n\n**Controlling idea** (`example`, id `friday`): On Black Friday 2026 Kestrel & Pine's order flow met two rate limits, the WMS vendor's per customer and the platform's, and neither was a fault: both vendors did what their documentation said, and the merchant had not decided how its own calls were spent.\n\n**Advances the thesis** (S3): Gives the case the chapter explains: an order flow throttled at both ends while the storefront held.\n\n**Transition in:** `example`: The chapter's plan, which starts from Kestrel & Pine's Black Friday evening. → The evening itself.\n\n**Order of paragraphs** (`problem_solution`): The symptom (the backlog) first, then who analysed it, then the two ends in the order the orders travel back from (the warehouse limit that capped the flow, then the platform's calls), then the reading that turns both into the chapter's question.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | example | At the 2026 peak Kestrel & Pine's shop platform took 38 orders a minute and the storefront kept taking orders, while its export flow created warehouse orders one at a time with several calls each; the WMS vendor throttled those calls and the backlog reached four hours by 21:00. | statistic: 38 orders a minute; a four-hour backlog by 21:00. |  |\n| p06 | context | In June 2027 Ruben Alves, the lead integration engineer, examined the logs of both ends before planning the next peak; the quantities that follow are illustrative. |  | `sequence`: The backlog. → Who analysed it, when, and the status of the figures. |\n| p07 | analysis | On the WMS side the vendor allows each customer about 30 calls a minute and the order flow made four calls per order one at a time, so it could carry about seven orders a minute on any day against 38 arriving; the limit is how that multi-tenant vendor keeps one customer's peak from slowing its other customers. | statistic: About 30 calls a minute per customer; four calls per order; about seven orders a minute against 38. | `elaboration`: Ruben's analysis. → Its first finding, at the warehouse end. |\n| p08 | description | On the platform side the store had 41 installed apps, and Ruben's analysis names the nine integration consumers that drew on its API that evening: order export, finance, marketplaces, returns, three stock-writing apps, reviews and e-mail. |  | `contrast`: The warehouse end, where one limit per customer applied. → The platform end, with nine consumers and limits whose scope differs. |\n| p09 | evidence | The stock apps and the marketplace connector's full-catalog sync made about 55% of the recorded API calls between 20:00 and 22:00 and the order flow about 20%, and the order flow was throttled at the platform about 1,900 times: most of the evening's API use went on stock no customer was waiting for, the one flow with customers waiting made a fifth of the calls and was still throttled, and nobody had set priorities or checked the limits. | statistic: About 55% stock apps and catalog sync, about 20% order flow; about 1,900 throttles with one-second waits.; figure: Figure 1: nine consumers' shares of the recorded API calls on Black Friday 2026, and the WMS limit at the other end. | `elaboration`: The nine consumers. → How the recorded calls were shared among them, and what that did to the order flow. |\n| p10 | analysis | Neither finding was a bug: the rate limit is how a shared platform stays fair, and the merchant's job is to decide how its own share is spent; the rest of the chapter explains the machinery behind the error code. |  | `conclusion_summary`: The two findings. → What they mean, and the question the rest of the chapter answers. |\n\n### Why Platforms Share: Tenancy in Plain Words\n\n**Controlling idea** (`definition`, id `why-share`): Vendors pool tenants because one fleet and one version serve everyone cheaply, and they arrange tenants as pool, silo or bridge, trading cost against the noisy-neighbor risk that pooling creates.\n\n**Advances the thesis** (S1): Defines tenancy and the three models the rest of the chapter uses, and ties the noisy-neighbor problem to pooling.\n\n**Transition in:** `cause_effect`: The rate limit as the machinery behind the error code. → Why the machinery exists: what tenancy is and why vendors choose it.\n\n**Order of paragraphs** (`large_to_small`): The term and the reason for it first, then the three arrangements, then the risk the cheapest arrangement carries, then how a merchant can see the arrangements in what vendors sell.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | Rate limits exist because the platform is shared: at a commerce platform the tenant is one shop, and vendors choose multi-tenancy for cost and for a single version that every merchant runs. | quotation: Shopify FY2025 annual report: 'single branch' software, 'all of our merchants use the latest version'. |  |\n| p12 | definition | The AWS SaaS Lens names three arrangements: silo (dedicated resources per tenant), pool (shared resources with a tenant identifier on each row) and bridge (some parts siloed, some pooled). | quotation: SaaS Lens definitions of silo, pool and bridge. | `elaboration`: Multi-tenancy as a design. → The three ways it can be arranged. |\n| p13 | cause_effect | The pool creates the noisy-neighbor risk, a tenant whose load harms others: in a pool one tenant's flash sale is everyone's load unless the vendor meters it, while a silo confines the harm at a cost per tenant few commerce subscriptions can carry. | quotation: SaaS Lens definition of noisy neighbor.; figure: Figure 2: pool, silo and bridge. | `cause_effect`: The pool, the cheapest arrangement. → The risk it creates. |\n| p14 | example | Merchants can see the spectrum in what vendors sell: Adobe Commerce's three deployment options run from a silo the merchant operates to a pool, and Shopware's cloud refuses plugins that touch the database, which is why pooled platforms extend by API. | source: Adobe Experience League (October 2026): on-premises, on cloud infrastructure, Cloud Service.; quotation: Shopware: plugins 'have direct access to the database' and 'are not supported by Shopware cloud'. | `example`: The three arrangements. → Products a merchant can buy that sit at each point. |\n\n### How a Shared Platform Keeps Tenants Apart\n\n**Controlling idea** (`explanation`, id `keep-apart`): Vendors keep tenants apart with a tenant identifier on every row, a router, isolated groups of databases, governor limits and regions, which the merchant cannot see or change and whose public record for the largest vendor stops in 2021.\n\n**Advances the thesis** (S2): Shows the vendor-side mechanisms from dated accounts, and that they are invisible to the merchant except at a few points.\n\n**Transition in:** `sequence`: Why vendors pool and the risk that creates. → How they keep tenants apart in practice.\n\n**Order of paragraphs** (`chronological`): Shopify's account is told in the order it happened (sharding, pods, the 2021 balancing and moves), because each step answers a problem the previous one left; Salesforce and commercetools follow as contrasts, and the mechanism table, attached to the commercetools paragraph, closes the section by naming what the merchant sees of each mechanism.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | transition | A shared platform must route each request to the right tenant's data and stop one tenant's workload exhausting shared capacity; the vendor accounts that follow show identifiers, placement and resource limits working together. |  |  |\n| p16 | example | By 2015 Shopify's database could no longer be scaled on one server, so it sharded (split one database into many, each holding a set of shops), which on its own reduced resilience. | quotation: Shopify Engineering 2018: 'could no longer be scaled by buying a bigger server'. | `example`: The two jobs of isolation. → Shopify's first step, sharding. |\n| p17 | explanation | In 2016 Shopify reorganized into pods, sets of shops on fully isolated datastores under shared application servers, with a router (Sorting Hat) sending each request to its pod; each pod had an active and a recovery data center and could be moved between them in about a minute, in an account now eight years old that describes a pre-cloud topology. | quotation: 'A pod consists of a set of shops that live on a fully isolated set of datastores'; 'all shared resources can only ever communicate to a single pod at a time'. | `problem_solution`: Sharding's loss of resilience. → Pods as the answer. |\n| p18 | explanation | The 2021 shard-balancing post shows the tenant mechanics: one shard per pod, the shop as the sharding unit with a shop_id on every table, and an unsharded routing table. | source: Shopify Engineering 2021, MySQL shard balancing. | `time`: The 2018 account of pods and their moves. → The later, 2021 account. |\n| p19 | cause_effect | Shops land on shards arbitrarily and grow unevenly, so before rebalancing the least- and most-loaded shards differed by almost four times. | quotation: 'almost four times'. | `cause_effect`: Shops as the unit placed on shards. → Why placement drifts out of balance. |\n| p20 | process | Shops are moved live with Ghostferry and a short write lock at cutover, the documented case being two flash-sale merchants on one pod, one of which was moved; whether pods survived the move to Google Cloud after 2021 is undocumented. | quotation: 'the only opportunity for downtime is during the cutover'.; case: Two flash-sale merchants on one pod with coinciding bursts; one moved.; fact: INFERENCE, NOT DOCUMENTED callout: a pod is a bridge; nothing public after 2021 gives pod or shard counts. | `problem_solution`: The imbalance. → How shops are moved to correct it. |\n| p21 | comparison | Salesforce runs the purest pool, every tenant's data in shared tables keyed by an OrgID, and protects it with governor limits, published caps on one tenant's code: in a pool, limits are the isolation. | quotation: Salesforce Architects: the kernel 'uses this unique identifier to ensure that each org's activities are private'. | `contrast`: Shopify's isolated groups of databases. → A vendor that isolates by identifier and limits alone. |\n| p22 | comparison | commercetools isolates each merchant in a Project with published limits and hosts in five Regions that share no data, so data residency is chosen at sign-up and changed only by migration. | source: commercetools General Concepts and API Limits: Projects, 25 API Extensions, 50 Subscriptions, five Regions.; table: Mechanism table: identifier, router, pod or shard, governor limits, region, rate limit, with what each keeps apart and what the merchant sees.; figure: Figure 3: a request routed to its pod and checked against the app's budget for the shop. | `contrast`: Isolation by identifier and limits. → Isolation by project and by region. |\n\n### Rate Limits: The Tenancy Tool You Meet\n\n**Controlling idea** (`explanation`, id `rate-limits`): The rate limit is the tenancy mechanism a merchant meets: vendors meter callers per app, store, project or seller, tier the limits by plan, may lower them under load and serve buyers and checkout before integrations, so the platform's own peak is smoothed while the merchant's integrations meet fixed limits.\n\n**Advances the thesis** (S3): States the vendors' published models and the rules a merchant lives by, and explains why the storefront held and the order flow did not.\n\n**Transition in:** `emphasis`: The mechanism table, whose last row is the rate limit. → The one mechanism the merchant meets, in detail.\n\n**Order of paragraphs** (`large_to_small`): Definition and the four models first, then the rules that follow for a merchant, then the four flows of Eva's order, which apply the rules to the Friday evening, then webhooks as the way to spend less, which ends the section on the platform's own limit on calling the merchant.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | definition | A rate limit caps the API calls or query cost one caller may spend in a window, the caller usually an app, and four vendors publish four different models (November 2026, volatile); the bucket, points, burst and bulk operations they share are explained before the table. | table: Shopify, Amazon SP-API, BigCommerce and commercetools: model and published figures, November 2026. |  |\n| p24 | explanation (list) | Whatever the model, the limits belong to the merchant's store or account (on Shopify divided further per app), so every app and connector adds calls against them; Shopify's documentation gives three rules (limits per app per store tiered by plan, under which one app cannot use up another's, so Kestrel & Pine's shares show where the calls went and not that the stock apps took the order flow's quota; limits the vendor may lower; buyers and checkout protected before integrations). | quotation: 'Shopify may temporarily reduce API rate limits to protect platform stability'; 'requests from real buyers aren't subject to a fixed request-per-minute limit'. | `cause_effect`: The four models. → What they mean for a merchant, in three rules. |\n| p26 | analysis | Four flows make up Eva's order and its stock (browsing, checkout, the order to the warehouse, stock sync); the platform's own peak (browsing, checkout) is shared across every tenant and smoothed, which is why the storefront held, while the integrations draw on limits per app, store or customer that are fixed, which is why the order flow did not. | table: Four flows of Eva's order: who owns the capacity, what is metered, what the merchant controls, peak behaviour.; figure: Figure 4: a shared water main and one apartment's narrow tap. | `cause_effect`: The limits and the three rules. → Where they bite in the four flows of Eva's order and on the Friday evening. |\n| p25 | explanation | Webhooks let a merchant avoid spending calls on polling, and they work in the other direction: the platform spends its capacity calling the merchant, does not guarantee delivery or order, retries a failed endpoint eight times over four hours and can then delete the subscription. | fact: Eight retries over four hours; deletion after eight consecutive failures. | `additional_support`: The flows that draw on fixed limits, including polling for stock and orders. → Webhooks, the way to spend less of the budget, and the platform's own limit on calling the merchant. |\n\n### Tenancy in the SaaS You Also Rent\n\n**Controlling idea** (`explanation`, id `saas`): Every specialist SaaS a merchant rents is a tenancy arrangement whose busiest day is shared, whose price says what it meters and whose region was set at sign-up, so the merchant asks every vendor the same four questions.\n\n**Advances the thesis** (S4): Extends the rate-limit lesson from the platform to the WMS, returns portal, PIM and connector, and gives the four questions.\n\n**Transition in:** `similarity`: The platform's rate limits and where they bite in Eva's order. → The same limits at every other SaaS the merchant rents, and the questions to ask each vendor.\n\n**Order of paragraphs** (`grouping`): The claim that the platform is not the only tenancy arrangement first, then its three consequences, then the questions that follow from them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | claim | Kestrel & Pine's WMS, returns portal, marketplace connector, iPaaS, shipping service and, from 2027, OMS and PIM are each multi-tenant SaaS in which it is one tenant among others, with three consequences. |  |  |\n| p28 | cause_effect | The peak day is shared: a WMS vendor's other customers peak on the same Friday, and its per-customer limit, the one Kestrel & Pine met, is its tool for fairness. |  | `elaboration`: Three consequences. → The first: the shared peak. |\n| p29 | example | The pricing unit shows what the vendor meters: a per-order price, such as Picqer's, means a peak day costs money as well as calls. | fact: Picqer: from EUR 379 a month including 3,000 orders, EUR 0.28 per extra order (accessed November 2026). | `additional_support`: The shared peak. → The second consequence: what the price meters. |\n| p30 | explanation | Residency is per component: each SaaS was provisioned in a region at sign-up, so a European merchant records which region holds its data at each vendor. |  | `additional_support`: What the price meters. → The third consequence: where the data is. |\n| p31 | recommendation | The questions for every vendor are four: the unit of isolation and whether the tenant can be moved or restored alone; the limits, per what, and whether they change under load; the region; and what happened on the busiest day last year. |  | `conclusion_summary`: The three consequences. → The questions they lead to. |\n\n### The Merchant's Choices and Their Trade-Offs\n\n**Controlling idea** (`comparison`, id `choices`): A merchant has four responses to sharing (govern the budget, buy a larger share, rent or run a silo, split tenants), and should govern first and buy second.\n\n**Advances the thesis** (S5, S6): Compares the responses and ranks them, against the view that a higher tier fixes a throttled flow.\n\n**Transition in:** `conclusion_summary`: The limits the merchant meets at the platform and at every vendor. → What a merchant can do about sharing.\n\n**Order of paragraphs** (`order_of_importance`): The responses in the order the author recommends them, then the table that compares them, then the recommendation that the order encodes.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p32 | transition | A merchant cannot change how its vendor pools tenants but has four realistic responses. |  |  |\n| p33 | recommendation | Accept the pool and govern the budget: inventory the callers, set an order of priority, replace polling with webhooks and events, use bulk operations (background jobs for large reads and writes) and remove unused apps; it is cheap and where Kestrel & Pine starts. |  | `sequence`: Four responses. → The first and cheapest. |\n| p34 | comparison | Buy a larger share through a higher plan or an enterprise agreement, a subscription line that does nothing for the WMS vendor's or the marketplace's limit. |  | `contrast`: Governing what the merchant already has. → Paying for more. |\n| p35 | comparison | Rent or run a silo (a platform-as-a-service or on-premises edition) for dedicated capacity, at the cost of running upgrades, capacity and security yourself. |  | `sequence`: Paying for a larger share of the pool. → Leaving the pool. |\n| p36 | comparison | Split tenants, one per country or brand, weighed in the next section. | table: The four responses by cost, what each protects against, what it does not, and when it is right. | `sequence`: Leaving the pool. → Splitting one's own tenant. |\n| p37 | recommendation | The recommendation is the table's order, govern first and buy second, with silos and splits as decisions with their own costs, assuming the merchant can measure its own consumption. |  | `conclusion_summary`: The four responses compared. → The order in which to use them. |\n\n### One Tenant or Many\n\n**Controlling idea** (`recommendation`, id `one-tenant`): A merchant with several countries or brands chooses one tenant or several, and should stay in one while the platform can vary what differs by market and the shared limits carry every market's peak.\n\n**Advances the thesis** (S6): Turns tenancy into a decision the merchant itself takes, with a stated rule.\n\n**Transition in:** `elaboration`: The fourth response, splitting tenants. → The tenancy decision of the merchant's own, weighed in full.\n\n**Order of paragraphs** (`problem_solution`): The decision and Kestrel & Pine's position first, then what platforms offer to keep one tenant, then the rule that weighs the options.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | context | Splitting tenants is a decision the merchant takes alone: with several countries or brands it chooses between one tenant and several; Kestrel & Pine runs three storefronts in one tenant, and the choice has costs both ways. | fact: Three storefronts (NL, BE in Dutch and French, DE) in one tenant. |  |\n| p39 | comparison | Platforms have built features to keep multi-country merchants in one tenant, such as Shopify Markets, though its merchant-of-record variant is not offered in the EU, and each option shares and multiplies different things. | source: Shopify Markets and Managed Markets (accessed November 2026).; table: One tenant with markets, one per country, one per brand: what is shared, what multiplies, fits when, breaks when. | `elaboration`: The choice. → What platforms offer to support one tenant, and the options compared. |\n| p40 | recommendation | The author's rule: stay in one tenant while the platform can vary what differs by market and the shared limits carry every market's peak; split when a legal entity, assortment or operations team makes sharing a fiction, with the PIM and OMS beneath all tenants. | figure: Figure 5: one house with three storefronts beside three houses with tripled cabling. | `conclusion_summary`: The options and their costs. → The rule that chooses among them. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`analysis`, id `stages`): Tenancy changes how much a merchant must do, not what: at every stage the first move is to know who spends each budget and put the order flow first, and what grows is the number of budgets, markets and, at Group stage, the merchant's own duty to isolate its brands.\n\n**Advances the thesis** (S5, S6): Shows the same rule applying from a starting merchant to a group.\n\n**Transition in:** `elaboration`: The ranked responses and the one-tenant rule. → How they apply by scale stage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | analysis | The ranked responses and the one-tenant rule apply at every size: tenancy changes how much a merchant must do rather than what, the first move is always to know who spends each budget and put the order flow first, and what grows is the number of budgets, markets and, at Group stage, the duty to isolate its own brands. | table: Four scale stages: what is typical, what becomes necessary, warning signs. |  |\n\n### In Practice: Kestrel & Pine's API Budget for 2027\n\n**Controlling idea** (`example`, id `in-practice`): Kestrel & Pine's 2027 plan puts the order flow first, moves stock to events and finance to a daily batch, keeps one tenant and records the region of every SaaS component.\n\n**Advances the thesis** (S5, S6): Applies the chapter's rules to the Friday evening it started from.\n\n**Transition in:** `example`: The rules by stage. → Kestrel & Pine at stage 3 applying them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | example | Kestrel & Pine is at stage 3 and its 2027 plan follows that row: the plan forecasts 60 orders a minute and tests every link at 80 and the OMS-to-WMS link at 120, with test orders the WMS ships nothing for, and Ruben's analysis turns each 2026 consumer of the platform's API into a 2027 rule, with the order flow first and orders sent to the WMS in batches within its limit. | table: Each consumer of the platform's API (and the WMS limit): Black Friday 2026 and the 2027 plan. |  |\n| p43 | recommendation | Two decisions carry over: the three storefronts stay in one tenant because governing the callers, not splitting markets, was what the order flow needed, and the plan records the region of every SaaS component. | fact: One tenant confirmed in 2027; the platform in an EU region. | `elaboration`: The rules per consumer. → The two decisions that outlast the peak plan. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`description`, id `wrong`): Tenancy fails in six recognizable ways, from a neighbor on your pod to the shared peak at a specialist vendor, each with a detection and a recovery.\n\n**Advances the thesis** (S2, S3, S4): Shows each mechanism of the chapter as a failure the merchant can detect and recover from.\n\n**Transition in:** `contrast`: Kestrel & Pine's plan working. → What goes wrong when the mechanisms meet a peak.\n\n**Order of paragraphs** (`grouping`): In the order the chapter introduced the mechanisms: the vendor's placement of tenants (a neighbor on the pod, a shop move), then the rate limit (one's own callers, a lowered limit), then webhooks, then the specialist vendors.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | description | Even with a plan, tenancy fails in six ways, listed in the order the chapter introduced the mechanisms; the first, a neighbor's flash sale on your pod, can slow your shop when your own demand is normal, the documented case is Shopify's 2021 pair of merchants, and the merchant can only detect it, report it and ask about the isolation unit. | case: Shopify 2021: two flash-sale merchants on one pod; one moved. |  |\n| p45 | description | The shop move takes a short write lock at cutover, seen as a brief burst of write failures and recovered by idempotent retries. |  | `similarity`: A neighbor on the merchant's pod. → The vendor moving the merchant's shop between shards, the other pod-level event. |\n| p46 | description | A noisy neighbor inside your tenant: your own stock app makes most of your store's calls while the order flow is throttled; where apps share a quota it takes the order flow's capacity, where each has its own it is still the largest load and the first place to look; detect it from throttles in the order flow's logs and recover by pausing it (a switch in chapter 33's degradation ladder) and redesigning it to events and bulk operations. |  | `contrast`: Failures from the vendor's placement of tenants. → A noisy neighbor inside the merchant's own tenant. |\n| p47 | description | The vendor lowers the limit, as Shopify's documentation allows; detect it as throttles at call rates that worked yesterday and recover with flows that read the budget headers and slow themselves. |  | `sequence`: The merchant's own callers using up the limit. → The vendor changing the limit. |\n| p48 | description | The webhook that unsubscribed itself after eight failures is detected only by a reconciliation job and recovered by re-subscribing and replaying from the API. |  | `sequence`: Limits on calls the merchant makes. → Calls the platform makes to the merchant. |\n| p49 | description | The shared peak at a specialist vendor shows as throttles and latency that follow the calendar rather than your load, and is met by batching within the limit, queuing behind the order and taking the vendor's busiest-day record into the next contract. |  | `sequence`: Failures at the platform. → The same failure at the SaaS the merchant also rents. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The order export that waited while the shop kept selling is the whole chapter in one case: the platform's own capacity is pooled and smoothed, so the storefront and checkout held, while the integrations met limits per app, store and customer that are fixed and met the merchant's spike in full. The vendors' designs worked and could not be changed by the merchant; what it could change was its own side, which flows call each API, how often and in what order.\n\n**So what:** A merchant that accepts this lists the callers of every API with an owner, puts the order flow first, replaces polling with events and batches within each limit, asks every vendor four questions, and stays in one tenant while the platform can vary its markets, before it buys a higher tier.\n\n**Callback:** The introduction's order export that waits for an allowance to reset while the shop keeps accepting purchases. Paragraph p50 explains that case from the chapter: why the shop held and the export did not, and what the merchant controls.\n\n**Takeaway** (`course_of_action`): List every app and connector that calls your platform's API and every vendor limit your order flow crosses, with an owner and an order of priority for the peak, the order flow first; then ask each vendor the four questions.\n\n**Hand-off** to [Apps, Plugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html): `elaboration`: The previous chapter's finding that the API budget a merchant spends on a shared platform is spent mostly by apps and connectors, with nobody ranking them. → The apps themselves: how platforms let other people's code in, what each mechanism may touch, and how a merchant with 41 apps, 6 unused and 3 writing stock should govern them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | synthesis | The order export that waited while the shop kept selling is explained: the platform's pooled capacity smoothed its own peak, so storefront and checkout held, while the integrations met fixed limits per app, store and customer; the vendors' designs worked, and what the merchant could change was its own side. | reasoning: The opening's delayed export set against the chapter's answer. |  |\n| p51 | synthesis (list) | Established: the pool, silo and bridge models and the noisy-neighbor problem; the documented isolation mechanisms; rate limits granted per caller and tenant, tiered by plan and lowerable, with buyers and checkout first; webhooks without a delivery guarantee. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what the sources establish. |\n| p52 | synthesis (list) | Depends on context: one tenant for several countries, buying a larger budget, and a silo are each right only under stated conditions. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p53 | recommendation (list) | The author's synthesis: the API limits on the merchant's store are capacity the merchant plans, with the order flow first and an owner for every caller, and every SaaS should be asked the four questions because a vendor's tenancy is a promise about the merchant's peak day. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p54 | recommendation (list) | Eight questions let the reader find, in their own company, the callers of each API and their priority, the limits and whether they read the headers, each vendor's limits, isolation unit and region, the tenant decision, polling flows, and the reconciliation that catches a deleted webhook. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own company. |\n| p55 | transition | Most of the API calls a merchant's store receives come from apps and connectors that nobody has ranked, and apps are the next chapter's subject: how platforms let others extend them, what an app may touch, and how a merchant with 41 apps, 6 unused and 3 writing stock should govern them. |  | `elaboration`: The questions, the first of which is who calls the store's API. → The apps that make most of those calls. |\n\n## Non-goals\n\n- Peak planning, load testing, queues, backpressure and the degradation ladder. See [Black Friday Every Year: Peak Load, Resilience and Recovery](peak-load-and-reliability.html), [Journey 4: Black Friday, Hour by Hour](journey-peak-day.html).\n- Apps, scopes, app review and app governance. See [Apps, Plugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html).\n- API versioning and webhook contracts in depth. See [Promises Between Systems: API Contracts, Webhooks and Versioning](api-contracts-and-versioning.html).\n- Theme performance and how the storefront is delivered. See [Delivering the Storefront: Themes, Headless, Rendering and Performance](storefront-architecture.html).\n- Internal architecture styles (monolith, microservices, composable). See [Monolith, Modular Monolith, Microservices, Composable: What the Evidence Says](commerce-architecture-styles.html).\n- GDPR, controller and processor roles, cross-border transfers. See [Whose Data Is It? Privacy, Consent and Retention](privacy-and-customer-data.html).\n- The multi-brand platform decision as a strategy question. See [What Changes at Each Scale: From First Store to Group](commerce-scaling-stages.html).\n- Shopify as a full case. See [Case: Shopify, the Modular Monolith That Serves Millions of Merchants](case-shopify.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Figure redraw (needs the author's approval to run image generation): Figure 1 (fig03-black-friday-2026-nine-consumers-spent.jpeg) must show the nine consumers calling one store's API with the source box labelled 'share of recorded API calls' instead of 'Kestrel and Pine API budget on the platform, per app per store', and the order-flow edge labelled 'about 20 percent of recorded API calls' instead of '20 percent of the budget' (consistency ruling 24); the caption and alt text already match.\n- Before print: Shopify's pod topology after the Google Cloud migration and current pod or shard counts are undocumented (last first-party description 2021); the chapter labels this as an inference. Re-check for a first-party Shopify post after 2021 on pods or shards.\n- Before print: all rate-limit figures are volatile and dated to November 2026; re-check the Shopify, Amazon SP-API, BigCommerce and commercetools pages.\n\n## Decision log\n\n- **2026-11-07** — Opened with the merchant's side (two rate limits on one evening) rather than with the vendor's mechanisms, because the contract asks the chapter to explain why a merchant should care; vendor mechanisms follow as the machinery behind the error code. (from spec.md)\n- **2026-11-07** — Treated the rate limit as the central tenancy concept for merchants and gave it a four-vendor table, rather than organizing the chapter around pods, which merchants cannot see or influence. (from spec.md)\n- **2026-11-07** — Aligned the Kestrel & Pine thread with chapter 33's canonical account and added only illustrative shares and the per-component region list, rather than inventing a separate incident. (from spec.md)\n- **2026-11-07** — Included specialist SaaS tenancy (WMS, returns portal, PIM) as a section of its own, with Picqer's public per-order pricing as the example of volume metering. (from spec.md)\n- **2026-11-12** — Converted spec.md to spec.json, reconstructed unit by unit from the published chapter. Intent outcome, acceptance criteria AC-1 to AC-5, thesis and role copied unchanged from the journal spec. The old success criteria were inventories (term list, table and diagram counts, section names, word limit) and were dropped; the outcomes they pointed at are carried by AC-1 to AC-4 and the audience's does_not_know list. No criteria added. Word limit kept at 6,500. Rejected: Rewriting the inventory criteria as minor criteria of this post: AC-1 to AC-4 already cover the outcomes.\n- **2026-11-12** — Fixed the known inconsistency between 'budgets per app per store' and 'everything you install spends from it' / 'nine consumers spent one store's budget': the vendor's limits are now stated only as the cited sources state them (per tenant; on Shopify per app on each <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');

            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }

            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {

            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));

        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
