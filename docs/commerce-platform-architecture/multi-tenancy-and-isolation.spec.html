<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Many Merchants, One Platform: Multi-Tenancy, Pods and Isolation\n\n## Intent\n\nExplain to a reader new to commerce architecture how a hosted commerce platform serves thousands of merchants on shared systems (pool, silo and bridge models; tenant identifiers, routing, pods and shards; governor limits; regions) and, above all, why a merchant should care: the rate limit is the tenancy mechanism a merchant meets, every app and connector spends from one per-store budget, the noisiest neighbour on a peak day is often the merchant's own app, and every specialist SaaS the merchant rents is a tenancy arrangement whose peak day is shared. After reading, the reader can inventory the spenders of their API budget, decide whether several markets or brands belong in one tenant or several, and put four questions to every vendor: unit of isolation, limits and their changes, region, busiest day.\n\n## Audience\n\nNewcomers to commerce architecture. The integration engineer or engineering lead preparing a peak plan on a hosted platform benefits most; the product manager or executive deciding between one tenant and several for new countries or brands benefits next. The chapter assumes general software literacy and defines tenant, multi-tenancy, isolation, sharding, pod, rate limit, noisy neighbour, pool, silo, bridge, governor limit, data residency, webhook, app, merchant of record, WMS, OMS, PIM, PSP and iPaaS where they first appear.\n\n## Success criteria\n\n- [x] A reader new to the field can define every term the chapter uses from the chapter alone; every acronym is expanded on first use.\n- [x] The three tenancy models are defined from the AWS SaaS Lens, with a diagram, before any vendor example; the noisy-neighbour problem is tied to pooling.\n- [x] Shopify's pods and shard balancing (2018, 2021), Salesforce's metadata-driven pool and governor limits, and commercetools' projects and regions are reported with dates, evidence ages and a labeled inference where the public record stops (post-2021 pod topology).\n- [x] Rate limits are presented as a tenancy tool with a table of four published models (Shopify, Amazon SP-API, BigCommerce, commercetools) dated November 2026 and flagged volatile, and the merchant consequence (per app per store; the vendor may lower limits; checkout and buyers protected first) is explicit.\n- [x] A requirements table covers four flows of Eva's order (browsing, checkout, order to WMS, stock sync) with who owns capacity, what is metered, what the merchant controls and peak behaviour.\n- [x] The one-tenant-or-many decision has an options table and a stated rule; specialist SaaS tenancy (WMS, returns, PIM, connector) and residency per component are covered; the four vendor questions are stated.\n- [x] The Kestrel & Pine thread agrees with the ledger and with [Black Friday Every Year: Peak Load, Resilience and Recovery](peak-load-and-reliability.html): the order flow throttled by the WMS vendor's limit and sharing the platform's per-app-per-store budget with the apps, the 2027 plan's 60 orders a minute forecast, W1, W2, W5, the app audit; new illustrative figures (budget shares, the WMS limit, the EU region, one tenant confirmed) are labeled and appended to the ledger.\n- [x] \"Across Scale Stages: When It Fits and When It Limits\" with a specific table and judgement; three mermaid diagrams with captions; \"When it goes wrong\" with detection and recovery; the three take-away tiers; eight Questions to ask; a hand-off to [Apps, Plugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html); article at or under 6,500 words including tables.\n\n## Non-goals\n\n- Peak planning, load testing, queues, backpressure and the degradation ladder — [Black Friday Every Year: Peak Load, Resilience and Recovery](peak-load-and-reliability.html) and [Journey 4: Black Friday, Hour by Hour](journey-peak-day.html).\n- Apps, scopes, app review and app governance — [Apps, Plugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html); API versioning and webhook contracts in depth — [Promises Between Systems: API Contracts, Webhooks and Versioning](api-contracts-and-versioning.html).\n- Internal architecture styles (monolith, microservices, composable) — [Monolith, Modular Monolith, Microservices, Composable: What the Evidence Says](commerce-architecture-styles.html).\n- GDPR, controller and processor roles, cross-border transfers — [Whose Data Is It? Privacy, Consent and Retention](privacy-and-customer-data.html); the multi-brand platform decision as a strategy question — [What Changes at Each Scale: From First Store to Group](commerce-scaling-stages.html).\n- Shopify as a full case — [Case: Shopify, the Modular Monolith That Serves Millions of Merchants](case-shopify.html).\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\n## Open questions\n\n- Shopify's pod topology after the Google Cloud migration and current pod or shard counts are undocumented (last first-party description 2021); the chapter labels this as an inference and a reviewer should check for newer posts.\n- All rate-limit figures are volatile; the chapter dates them to November 2026. A revision should re-check Shopify, Amazon SP-API, BigCommerce and commercetools pages.\n- The illustrative WMS limit (about 60 calls a minute per customer) and budget shares (about 55% stock sync and apps, 20% order flow, about 1,900 throttles) were chosen to agree with chapter 33's account; if [Journey 4: Black Friday, Hour by Hour](journey-peak-day.html) quantifies the evening differently, the ledger line should be reconciled.\n\n## Decision log\n\n- **2026-11-07** — Opened with the merchant's side (two rate limits on one evening) rather than with the vendor's mechanisms, because the contract asks the chapter to explain why a merchant should care, not only how vendors build it; vendor mechanisms follow as the machinery behind the error code.\n- **2026-11-07** — Treated the rate limit as the central tenancy concept for merchants and gave it a four-vendor table, rather than organizing the chapter around pods, which merchants cannot see or influence.\n- **2026-11-07** — Aligned the Kestrel & Pine thread with chapter 33's canonical account (the order flow throttled by the WMS vendor's limit, sharing the platform budget with every installed app) and added only illustrative shares and the per-component region list, rather than inventing a separate incident.\n- **2026-11-07** — Included specialist SaaS tenancy (WMS, returns portal, PIM) as a section of its own, with Picqer's public per-order pricing as the example of volume metering, because the contract names \"tenancy in specialist SaaS\" and the Black Friday throttle came from the WMS side.\n\n## Sources\n\n- **Internal**\n  - [Meet Kestrel & Pine](meet-kestrel-and-pine.html) and `_research/scenario-ledger.md` — the systems landscape, the Black Friday figures, the apps, W1, W2, W5.\n  - [Black Friday Every Year: Peak Load, Resilience and Recovery](peak-load-and-reliability.html) — the canonical account of the order flow and the 2027 peak plan this chapter must agree with.\n  - `_research/brief-platform-engineering-scale.md` (Part 2 and 5.1) and `_research/brief-shopify.md` (Parts 1, 2.3, 4.6, 5.4, 5.6) — the dated vendor evidence; `_research/brief-platform-landscape.md` (1.2, 1.6, Part 2) — Adobe's deployment options, Shopware's plugin rule and Picqer's pricing.\n- **External**\n  - AWS Well-Architected SaaS Lens, *Silo, pool, and bridge models* and *Noisy neighbor* (accessed 2026-11) — the tenancy vocabulary.\n  - Shopify Engineering, *A Pods Architecture to Allow Shopify to Scale* (2018) and *MySQL Database Shard Balancing at Terabyte Scale* (2021); Shopify 10-K FY2025 (2026) — pods, shards, shop moves, \"single branch\", the merchant definition.\n  - Shopify developer documentation on rate limits, the Storefront API, webhooks and Markets (accessed 2026-11); the 2018 flash-sale changelog — the merchant-facing mechanisms.\n  - Salesforce Architects, *Platform Multitenant Architecture* (accessed 2026-11); commercetools *General Concepts* and *API Limits* (accessed 2026-11); Amazon SP-API *Usage Plans and Rate Limits* (accessed 2026-11); BigCommerce *API rate limits* (accessed 2026-11) — the other vendors' models.\n  - Adobe Experience League (2026), Shopware developer documentation (accessed 2026-11), Picqer pricing (accessed 2026-11) — the silo-to-pool spectrum and volume metering.\n\n## Changelog\n\n- **2026-11-07** — Initial spec and article. *(AI-mediated session)*\n- **2026-11-07** — Editorial review pass: expanded SaaS, AWS, ERP, OMS, PIM, 3PL and HTTP 429, corrected the Shopify stability quote ('may'), aligned the 2027 fallback with the ten-unit marketplace buffer, FY2025 report naming, American spelling, timetoread. *(AI-mediated session)*\n- **2026-11-07** — Visual layer: redrew 3 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator). *(AI-mediated session)*\n"}]}]}</script>

        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;

                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
