<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-13 from the published page (posts/toolkit/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the page, in its order; tables are recorded as evidence of the paragraph they follow. Intent, acceptance criteria and role are copied unchanged from journal-spec.json; the journal spec gives a reference page no thesis, so the thesis here is the page's own and only orders its sections. A light pass for a lookup page: entries were checked for consistency with the ledger and rulings, not rewritten.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The sixteen cards and templates, the question each answers and the chapter that teaches it.\n- **Know:** That every card names an owner, a system of record and a date, and that the cards meet at the entity–owner table.\n- **Be able to:** Pick the card for the question on their desk, copy its fields and fill it with their own facts.\n- **Be able to:** Keep the cards current: review on a calendar, let incidents add fields, drop fields nobody reads.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a question from their own work, the reader picks the card that answers it and the chapter that teaches it. *Probe:* Using only this page: a vendor has announced a new API version for the flow that sends stock to a marketplace, and support sees three different statuses for one order. Which cards do you fill in, which chapters teach them, and which three fields does every card carry? | `custom` | cold_reader | major |\n| AC-2 | The reader explains how the cards connect and what a decision record must name. *Probe:* Using only this page: which record do the other cards meet at, and what must an architecture decision record state beyond Nygard's original fields? | `custom` | cold_reader | major |\n| AC-3 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict what the page contains and the kind of evidence or material it uses. *Probe:* After reading only the introduction: what will this page give you, in what order, and from what kind of material? | `intro_predicts_content` | cold_reader | major |\n\n## Thesis\n\n**Question:** Which cards and templates do the chapters introduce, and where is each one used?\n\n> **Claim:** Sixteen cards, one per recurring question, each taken from the chapter that teaches it and naming an owner, a system of record and a date, let a reader record a decision without rereading the chapter; they meet at the entity–owner table, so a change to one row says which other cards to update.\n\n**Disputed by:** The view that templates belong in a team's own tools and a book needs only the reasoning, so a gathered set of cards duplicates the chapters.\n\n**So what:** A reader with a question from their own work picks one card, copies its fields and fills it with their facts, and knows which other cards a change touches.\n\n**How and why:** Each card's fields come from the chapter that teaches it, are filled once with ledger facts, and cite each other by identifier through the entity–owner table.\n\n**Supporting claims**\n\n- **S1** — A question from the reader's work leads through one table to the card that answers it and the chapter that teaches it.\n- **S2** — Each card states its purpose, its fields, how to use it and one filled Kestrel & Pine example, and names an owner, a system of record and a date.\n- **S3** — The cards meet at the entity–owner table, so a change to one row tells the reader which other cards to update.\n\n## Role in the part\n\nGives the part the working records: one card per recurring question, so a decision taught in a chapter can be recorded without rereading it. Supports PR-2 of part `reference`.\n\n## Flow\n\n**Pattern:** `large_to_small`\n\nThe lookup table and the map of connections come first, so a reader arriving with a question finds the card and sees where it sits before reading any card. The sixteen cards follow in the order of the chapters that teach them, from the capability map to the decision record, which changes rows in all the others; the closing says how to keep them current.\n\n## Introduction\n\n**Hook** (`direct_statement`): A design discussion can end with agreement about a new system while leaving its data owner or recovery process undecided.\n\n**Bridge:** The reader has met cards in the chapters, each introduced where it was needed, and now has a question from their own work. → This page gathers the sixteen cards for lookup, each with a filled example and its chapter.\n\n**Thesis statement** (KEY POINTS callout and paragraph p01): Every card names an owner, a system of record and a date; the cards point at each other; most fields were paid for by an incident.\n\n**Roadmap** (IN THIS SECTION callout and paragraph p01):\n\n- Find the card for the question on your desk. *Kept in:* find.\n- How the cards point at each other through the entity–owner table. *Kept in:* connect.\n- Sixteen cards from a capability map to a migration plan and decision record, each with instructions, a filled Kestrel & Pine example and its chapter. *Kept in:* tool-1, tool-2, tool-3, tool-4, tool-5, tool-6, tool-7, tool-8, tool-9, tool-10, tool-11, tool-12, tool-13, tool-14, tool-15, tool-16.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Use this page to find the card for the question on your desk, copy its fields and fill them; the sixteen cards make an undecided owner or recovery process visible by recording the business fact, owner, systems and expected result, and each links to the chapter that supplies the reasoning. |  |  |\n| p02 | explanation | The worked examples use the fictional Kestrel & Pine, whose names and figures the reader replaces with their own. |  | `sequence`: The cards and their chapters. → How to read the filled examples. |\n| p03 | recommendation (list) | Three conventions run through all sixteen cards: keep them with the work, link them by identifier, investigate consequential blanks. |  | `sequence`: How to adapt the examples. → The conventions every card follows. |\n\n## Sections\n\n### Find the Template for the Question on Your Desk\n\n**Controlling idea** (`description`, id `find`): A question from the reader's work leads through one table to the card that answers it and the chapter that teaches it.\n\n**Advances the thesis** (S1): Gives the lookup from question to card and chapter.\n\n**Transition in:** `sequence`: The conventions. → The lookup table from question to card.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p04 | description | Sixteen recurring questions map to sixteen cards and their teaching chapters; two fuller records stay in their own chapters. | table: Question, tool anchor and teaching chapter for Tools 1-16. |  |\n\n### How the Records Connect\n\n**Controlling idea** (`explanation`, id `connect`): The cards meet at the entity–owner table, so a change to one row says which other cards to update.\n\n**Advances the thesis** (S3): Shows how the cards cite each other.\n\n**Transition in:** `sequence`: The sixteen cards found by question. → How they connect.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | claim | Most changes touch several cards, and the cards meet at the entity–owner table. | figure: Figure 1: capability map, decision records and every flow, partner, app, peak plan and migration written against the entity–owner table. |  |\n| p06 | explanation | Start at the entity–owner table: a fact with no row, or a row with no owner, is the problem. |  | `elaboration`: The figure. → The rule it implies in plain words. |\n\n### <a id=\"tool-1\"><\/a>Tool 1: Capability Map\n\n**Controlling idea** (`description`, id `tool-1`): The Capability Map card: purpose, template, use, a filled example and the chapters that use it.\n\n**Advances the thesis** (S2): One card with its owner, system of record and date, filled once.\n\n**Transition in:** `sequence`: How the records connect. → Tool 1.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | definition | A capability map lists the business's jobs independently of today's systems, so empty and overlapping boxes show missing capability and undecided responsibility. |  |  |\n| p08 | description | The template records per capability its layer, natural fact, systems today, writers, system of record, status with evidence, an owner and the date it was checked. | table: Fields of the capability map. | `elaboration`: The card's purpose. → Its fields. |\n| p09 | recommendation | Draw the map before any vendor's diagram and review it yearly and after a new channel or country. |  | `sequence`: The fields. → How to use them. |\n| p10 | example | Kestrel & Pine's February 2027 inventory-and-availability row shows an empty box for availability, six writers of Duiven stock and no agreed system of record, with the Black Friday Oversell as evidence. | scenario: Noor Visser's February 2027 row for inventory and availability. | `example`: The card and its use. → A filled Kestrel & Pine example. |\n| p11 | explanation | The whole map had about two dozen capabilities, thirteen systems and four empty boxes. |  | `elaboration`: The preceding unit. → A detail that completes it. |\n| p12 | transition | The 'Used in' line links the chapters that use the capability map. |  | `sequence`: The card. → The chapters that use it. |\n\n### <a id=\"tool-2\"><\/a>Tool 2: Entity–Owner Table\n\n**Controlling idea** (`description`, id `tool-2`): The Entity–Owner Table card: purpose, template, use, a filled example and the chapters that use it.\n\n**Advances the thesis** (S2): One card with its owner, system of record and date, filled once.\n\n**Transition in:** `sequence`: The previous card. → Tool 2.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | definition | The entity–owner table names the system of record for each business fact, who may write it and how disagreements are found. |  |  |\n| p14 | description | The template has one row per fact with system of record, writers, copies, how copies learn and how disagreement is found. | table: Fields of the entity–owner table. | `elaboration`: The card's purpose. → Its fields. |\n| p15 | recommendation | Write the table before buying any hub and check it with a quarterly write audit. |  | `sequence`: The fields. → How to use them. |\n| p16 | example | Kestrel & Pine's rows for Duiven stock, consumer price and order name the WMS, the platform's market price lists and the OMS as systems of record. | scenario: Three rows from the March 2027 review. | `example`: The card and its use. → A filled Kestrel & Pine example. |\n| p17 | explanation | Store stock and marketplace stock have rows of their own, and the review behind the table found six systems holding a stock number for one jacket. |  | `elaboration`: The preceding unit. → A detail that completes it. |\n| p18 | transition | The 'Used in' line links the chapters that use the entity–owner table. |  | `sequence`: The card. → The chapters that use it. |\n\n### <a id=\"tool-3\"><\/a>Tool 3: Integration Inventory\n\n**Controlling idea** (`description`, id `tool-3`): The Integration Inventory card: purpose, template, use, a filled example and the chapters that use it.\n\n**Advances the thesis** (S2): One card with its owner, system of record and date, filled once.\n\n**Transition in:** `sequence`: The previous card. → Tool 3.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | definition | The integration inventory lists every flow between two systems with owner, style and failure handling, turning integration debt into rows. |  |  |\n| p20 | description | The template has one row per flow with source and target, style, system of record, owner, contract version, volume, failure handling and reconciliation. | table: Columns of the integration inventory. | `elaboration`: The card's purpose. → Its fields. |\n| p21 | recommendation | No flow goes live without a row and no row without an owner; review quarterly. |  | `sequence`: The fields. → How to use them. |\n| p22 | example | Kestrel & Pine's February 2027 inventory had 34 integrations, 3 with reconciliation; one row shows the WMS-to-ERP stock flow with no dead-letter queue. | scenario: One row of Noor's inventory. | `example`: The card and its use. → A filled Kestrel & Pine example. |\n| p23 | transition | The 'Used in' line links the chapters that use the integration inventory. |  | `sequence`: The card. → The chapters that use it. |\n\n### <a id=\"tool-4\"><\/a>Tool 4: Integration Contract Card\n\n**Controlling idea** (`description`, id `tool-4`): The Integration Contract Card card: purpose, template, use, a filled example and the chapters that use it.\n\n**Advances the thesis** (S2): One card with its owner, system of record and date, filled once.\n\n**Transition in:** `sequence`: The previous card. → Tool 4.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | definition | A contract card is the written agreement for one flow, giving each inventory row a person, a version, a date, an alarm and a check. |  |  |\n| p25 | description | The template records flow and owners, style, pinned contract and sunset, system of record, idempotency key, failure handling, reconciliation and rate. | table: Fields of the contract card. it. → A detail that completes it. |\n| p95 | transition | The 'Used in' line links the chapters that use the architecture decision record. |  | `sequence`: The card. → The chapters that use it. |\n\n## Conclusion: Keeping the Cards True\n\n**Synthesis:** The cards stay useful only while they match the systems, so the same owner-and-date discipline that fills them also keeps them current.\n\n**So what:** A stale card is worse than none because readers trust it; three habits keep the set current and small.\n\n**Callback:** The KEY POINT that most fields were paid for by an incident. Incidents keep adding fields, and fields nobody reads are removed.\n\n**Takeaway** (`course_of_action`): Review each card on its calendar, add a field when an incident asks a question no card answers, and drop fields nobody reads.\n\n**Hand-off** to [Glossary: Plain-Language Definitions](glossary.html): `sequence`: The toolkit's cards and its closing pointer to the plain-language definitions of the terms they use (ATP, SSCC, idempotency, system of record). → Every term the book uses, defined and linked to its owning chapter.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p96 | recommendation (list) | Three habits keep the cards current: review on a calendar, let incidents add fields, keep the set small. |  |  |\n| p97 | transition | The terms the cards use are defined in the glossary, and the bibliography lists the sources behind them. |  | `sequence`: Keeping the cards current. → The next reference pages. |\n\n## Non-goals\n\n- Re-teaching why each field exists See the owning chapters linked in each tool.\n- The system and vendor ownership map and vendor card See [Who Builds and Who Owns: Teams, Vendors, Agencies and Governance](organizing-commerce-engineering.html).\n- The W7 metric definitions See [Counting the Same Thing Everywhere: Data Platforms, Definitions and Analytics](commerce-data-and-analytics.html).\n- Definitions of terms See [Glossary: Plain-Language Definitions](glossary.html).\n- The full source list See [Bibliography: Every Source the Book Cites](bibliography.html).\n- New Kestrel & Pine facts: every example uses ledger facts or values the chapters mark as illustrative\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-13** — Converted spec.md to spec.json in a light pass for a lookup page: one spec paragraph per draft unit, tables as evidence; the old inventory-style success criteria were not carried over (the journal spec's acceptance criteria replace them). length.max_words is the published length plus 10%. Rejected: Specifying each table row as a paragraph; Carrying the old success criteria over\n- **2026-11-13** — After draft-check round 1 (REVISE), applied the cheap fixes only, with no second round: the introduction puts the motivation before the instruction and glosses Waypoint, W1-W8 = KP-001-KP-008, Duiven, Eva, the marketplaces and the newcomer abbreviations (WMS, OMS, PIM, PSP, EDI, SKU) with a glossary pointer; 'write unknown' moved to the conventions; KEY POINTS field names match the templates; Tool 3's first-person 'I would adopt' made impersonal; bol, Eva, the Tiel 3PL and hero SKUs glossed in place; Tool 12 shows rung 4, which Tool 9 cites (chapter journey-peak-day's ladder); Tool 16 names confirmation among the ADR's additions (AC-2); the closing says why a stale card matters. Rejected: A second check round (the brief allows one); Splitting Tool 5's how-to paragraph, which would change the unit count and the spec\n- **2026-11-13** — Consistency fixes only: the stock sync chain in Tool 6 is 'up to two hours end to end' with no hop intervals (scenario-ledger line 71; RESOLVE rule 1); Tool 7's invoice trigger is one invoice per shipment with no per-order alternative (consistency ruling 18); Tool 13's Belgian e-invoicing row hedges whether the mandate binds a Dutch supplier (rulings 5 and 17, chapter 36's row); KP-004 and Tool 1 say 'the shop plat (ruling 28).\n- **2026-11-13** — Open questions closed at the author's instruction: no new templates; owner, system-of-record and date fields added to Tools 1, 7 and 14 (templates and examples, from ledger facts only); Drivers and Vendors added to the KP-004 example; Tool 5's how-to paragraph split (new p32a).\n- **2026-11-13** — Draft-check round 2 (ESCALATE, 18 pass / 22 fail, 0 waived). Cheap fixes after the round, report left stale: W1-W8 key, Bergzicht Outdoor, Mara Lindqvist and Hanna Berg introduced in the cast paragraph; the intro sentence that fused two lists split and the chapter order of the cards stated; gloss for the App That Wrote Stock in KEY POINTS and for the iPaaS in Tool 3.\n- **2026-11-13** — spec.md converted to spec.json; consistency fixes in Tools 1, 2, 6, 7, 13 and 16. Cheap fixes from draft-check round 1 (glosses, rung 4, ADR confirmation, closing so-what).\n- **2026-11-07** — Visual layer: one mermaid diagram redrawn as an illustration (article-illustrator).\n- **2026-11-07** — Initial spec and article.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
