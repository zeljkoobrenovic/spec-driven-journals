<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/34-commerce-security/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for that the published chapter did not have: a roadmap p05 that announces every section and a conclusion paragraph p56 that answers the opening; see decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** What attackers take from a shop, in rough order of preference: card testing, credential stuffing and account takeover, web skimming, coupon and refund abuse, inventory hoarding, admin compromise and supply-chain risk, with OWASP identifiers where they exist; half of them policy abuse rather than intrusion.\n- **Know:** Where PCI DSS draws its line: the SAQ by integration pattern (a PSP-hosted page or hosted fields for SAQ A, a merchant form for SAQ A-EP, raw card data for SAQ D), the dates of v4.0 and v4.0.1, requirements 6.4.3 and 11.6.1 mandatory since 31 March 2025 and removed from SAQ A in favor of an eligibility statement, and requirements 12.8 and 8.4.2.\n- **Know:** The controls for card testing (the control ladder up to a decline-rate alert and a kill switch), for takeover (rate limits, challenges for risky logins, notification of change), for skimmers (script inventory, CSP, SRI, tamper detection) and for identities (enforced MFA, one restricted key per integration in a vault, signed webhooks), and the four security postures by scale stage.\n- **Believe:** Attackers do not break in; they use the payment form, the login and the admin as built.\n- **Believe:** The hosted platform removes the patching burden and never the identity, script and endpoint burden.\n- **Believe:** For a merchant renting its platform, security is an inventory of identities, keys, apps, scripts and endpoints with owners before it is a technology.\n- **Be able to:** Place their checkout on the SAQ table and say what the SAQ A eligibility statement asks them to know about the scripts on their payment page.\n- **Be able to:** Audit their landscape as a list of identities and keys, each with an owner, a scope and a way to rotate it, and move one posture rung when the landscape gains what the rung protects.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer or product manager who inherits a storefront with an agency, apps and integrations and is asked \"are we secure?\" (Milan Petrov and Noor Visser at Kestrel & Pine); next, the finance or operations lead who sees PSP fees for declined payments or a paused account, and the architect choosing between a hosted checkout and a custom one.\n\n**Already knows:**\n\n- Roughly what an API, a database, a login and a web page's scripts are.\n- Kestrel & Pine, its people (Noor Visser, Milan Petrov), its 2026 and January 2027 incidents in outline (including the Card-Testing Night and the Double Refund), the sixteen failure-pattern names and the Waypoint decisions W1 to W8.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines, 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, system of record, single writer, events, idempotency and reconciliation.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Parts II to VI: checkout creating the order once with payment pending until the provider's signed message; authorization, capture, settlement, refunds as new payments; an integration inventory with an owner per flow (13 of 34 integrations unowned in January 2027).\n- From Part VII: the vendor's inside reaches the merchant as limits (API budgets, dated extension points, a checkout it cannot replace); promises are kept or broken in the merchant's own layer; app governance with an owner, scopes and API version per app; orders per minute as the peak health signal.\n- From the Part VIII introduction: a checkout that accepts a real purchase also accepts 48,000 attempts with stolen cards by the same behavior; each chapter of the part adds a column to the ownership map, this one credentials with their owners.\n\n**Does not yet know:**\n\n- Card testing, credential stuffing, account takeover, web skimming, inventory hoarding, scraping, OWASP and its automated-threat identifiers.\n- PCI DSS, acquirer, PAN, SAQ (A, A-EP, D), hosted fields, token, attestation of compliance, requirements 6.4.3, 11.6.1, 12.8 and 8.4.2.\n- CSP, SRI, tamper detection, MFA, passkey, restricted key, secrets vault, bot management, rate limit, velocity rule, kill switch, decline rate, dunning, shared responsibility, SCA and 3-D Secure in one clause.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given an overnight wave of declined payments on a hosted platform, the reader names the attack and the controls that stop it, rather than relying on the platform's certification or an IP block. *Probe:* A merchant on a hosted platform with a hosted checkout wakes to payment-provider fees for tens of thousands of declined authorizations made overnight through its guest checkout, a payment account paused for 40 minutes, and a few hundred real orders with nonsense names. Its agency says the platform is PCI certified, so security is handled, and proposes blocking the IP addresses involved. Using only this chapter: what happened, and what should the merchant put in place? | `custom` | cold_reader | major |\n| AC-2 | The reader can say how much of PCI DSS applies to a merchant with hosted fields and what it still owns on the payment page. *Probe:* A merchant takes cards through its PSP's hosted fields inside its own checkout page, which also loads a tag manager and two app scripts. Using only this chapter: how much of PCI DSS applies to it, and what does it still own? | `custom` | cold_reader | major |\n| AC-3 | The reader can say what a merchant's list of identities and keys should hold and why. *Probe:* A merchant's platform admin has about thirty staff accounts, some shared and MFA optional; its agency uses one shared login; and it runs dozens of integrations whose keys sit in scripts and never rotate, some with no named owner. Using only this chapter: what should change, and why does it matter more than another security product? | `custom` | cold_reader | major |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What do attackers want from a commerce platform, and what controls matter most?\n\n> **Claim:** Attackers want the payment form, the login and the admin, and send ordinary requests through them as designed rather than break in. For a merchant renting its platform the controls that matter most are a hosted checkout that keeps card numbers out of its systems; challenges, rate limits and a decline-rate alert on every endpoint that can pay or log in; an owned inventory of checkout scripts; and one identity, scoped key and named owner per person, app and integration.\n\n**Disputed by:** The view that on a hosted, PCI-certified platform security is the vendor's job, so the merchant's part is a firewall or a bot-management product, and card testing is stopped by blocking the IP addresses it comes from.\n\n**So what:** A merchant that accepts the claim keeps its checkout hosted, switches on the controls it already pays for, watches the decline rate beside the order rate, keeps its checkout scripts on a list, and gives every identity and key an owner who can rotate it. On the night of 18 to 19 August 2026 a script made 48,000 guest-checkout attempts on Kestrel & Pine's NL storefront between about 23:40 and 04:10; the PSP charged €2,900 in fees for declined authorizations and paused the account for 40 minutes from 02:05, with its e-mail unread until 07:30; about 260 cards were live, 21 orders came back as disputes, and the issuer decline rate on genuine card payments rose from about 4% to about 7% for two weeks. At the time the platform had 31 admin accounts (4 shared, MFA optional), keys sat in scripts and the integration platform and were never rotated, and 13 of 34 integrations had no named owner in January 2027 (5 were still unowned in April 2027). The April 2027 baseline confirmed SAQ A with the acquirer, added a challenge on session-less payment requests, a decline-rate alert at three times the 30-day median, a guest-card kill switch tested quarterly, enforced MFA with no shared accounts, one identity and restricted key per integration in a vault, a checkout script inventory with CSP enforcing from September 2027, and three runbooks.\n\n**How and why:** Card testing and credential stuffing send normal requests to the checkout and the login from rotating addresses, so a single filter fails and only the count, the pace and the decline rate reveal them; the PSP charges for every authorization, pauses accounts that look abused, and issuers decline more of the merchant's genuine payments afterwards. A hosted checkout or hosted fields sends the card number straight to the PSP, which puts the merchant in SAQ A, but a skimmer runs in the shopper's browser on a page the merchant serves, which is why PCI DSS requirements 6.4.3 and 11.6.1 apply since 31 March 2025 and SAQ A asks the merchant to state that its page is not susceptible to script attacks. An admin login or a leaked key needs no other technique, and the vendors' published shared-responsibility statements (Adobe, Shopify, Stripe) leave identities, keys, apps, scripts and integrations to the merchant, so a key with no owner is a door nobody can close.\n\n**Supporting claims**\n\n- **S1** — Attackers do not break in: card testing, credential stuffing, coupon and refund abuse and inventory hoarding send ordinary requests through the payment form, the login, the cart and the merchant's own rules, so only the count, the pace and the decline rate reveal them and the controls sit where the abused function lives.\n- **S2** — The vendors' published shared-responsibility statements agree: the vendor secures, patches and certifies its service, and the merchant secures the identities, keys, apps, scripts and integrations it adds.\n- **S3** — A hosted checkout or hosted fields keeps the card number out of the merchant's systems and puts it in SAQ A, but a skimmer runs in the shopper's browser on the merchant's page, so since 31 March 2025 the scripts on the payment page are the merchant's to inventory, or at least to vouch for in the SAQ A eligibility statement.\n- **S4** — Card testing and account takeover are stopped by layered controls on every endpoint that can pay or log in (the hosted checkout's defaults, bot protection and velocity rules, a session requirement and risk-triggered challenges, MFA, a decline-rate alert and a kill switch), not by one filter or an IP block.\n- **S5** — An admin login or a leaked key needs no other technique, so every person, app and integration gets its own identity, a narrow key in a vault and a named owner who can rotate it, with the posture raised one rung when the landscape gains what that rung protects.\n\n## Role in the part\n\nNames what attackers take from a shop and where the card-data standard draws its line, and turns the merchant's side of shared responsibility into a list of identities, keys, scripts and endpoints, each with an owner, an alert and a runbook. Supports P8-1 of part `part-8`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to in-practice: the August night and Noor's question first, the 2027 baseline that answers it last)\n\nThe night and Noor's question come first so every later section answers part of it. The threat list follows because it names the doors; shared responsibility follows because it says which of those doors the hosted platform already guards and which stay with the merchant; card data comes next because it is the first and largest decision in the merchant's share, and the skimmer section follows it because hosted fields leave the page around the fields exposed; that section gives the attack first and the standard's script requirements after it, so no rule waits for its reason. The attacks that use the shop's own doors follow (payment form, login and cart, then the admin and keys); the request-path requirements then gather the challenge, login and webhook controls of those three sections, the postures and the stage table size the controls, and the book's fixed closing order (in practice, when it goes wrong) applies them to Kestrel & Pine. Putting the controls before the threat list would give answers before the reader knows the doors; putting the script requirements before the skimmer attack sends the reader forward and lists the controls twice, which readers in two rounds found hard to follow. The cost of this order is that the scene's own attack, card testing, waits until after card data and skimmers; the reader accepts that because the card-testing controls build on the hosted checkout and the PSP that those sections introduce. Policy abuse (refunds and coupons) is settled inside the threat section because it needs no endpoint control, so When It Goes Wrong holds intrusions only.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A checkout must accept payment attempts from strangers; an attacker uses that same behavior to test stolen cards, automated logins try stolen passwords and bot carts reserve stock, and the shop processes every request exactly as designed.\n\n**Bridge:** Anyone who runs a web shop knows its checkout, login and cart are open to the public by design. → The step from that openness to the chapter's question: which of those public functions an attacker uses, and which controls stay with a merchant that rents its platform.\n\n**Thesis statement** (KEY POINTS callout and paragraphs p01 and p03): Attackers want the payment form, the login and the admin and use them as built; a merchant renting its platform protects itself with a hosted checkout that keeps card numbers out, challenges and a decline-rate alert on every endpoint that can pay or log in, an owned list of checkout scripts, and one identity, scoped key and owner per person, app and integration.\n\n**Roadmap** (Paragraph p05, the last paragraph of the introduction (with the IN THIS CHAPTER callout)):\n\n- Open on the Card-Testing Night and Noor Visser's question about doors and keys. *Kept in:* scene.\n- Rank what attackers want. *Kept in:* threats.\n- Draw the line between vendor and merchant. *Kept in:* shared.\n- Place the checkout on the card-data standard's table and describe the skimmers its script rules were written for. *Kept in:* pci, skimmers.\n- Take card testing, account takeover and bots, and admin accounts and keys in turn. *Kept in:* card-testing, takeover, identity.\n- Set out what each control on the request path must meet, then compare four security postures and their fit by scale stage. *Kept in:* control-points, choices, stages.\n- End with Kestrel & Pine's 2027 baseline and what to do when each attack succeeds. *Kept in:* in-practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A checkout must accept payment attempts from strangers, so the same behavior lets an attacker test stolen cards, a login try stolen passwords and bot carts hold stock, with the shop processing every request as designed; security therefore has to tell a purchase from misuse of the same functions, not only keep intruders out. | scenario: The checkout, the login and the cart each used by a script as built. |  |\n| p02 | cause_effect | The damage shows up as money and access rather than as an intrusion: fees for declined payments, a paused payment account, stolen customer access, stock held in bot carts and, from a malicious checkout script, stolen card details, as the British Airways case described later shows. | case: British Airways: a 2018 breach through checkout scripts, a £20 million penalty in 2020. | `cause_effect`: Requests the shop processes as designed. → What they cost the merchant. |\n| p03 | claim | Much of that damage stays the merchant's to prevent even when it rents its platform: it still holds access, integrations, custom scripts and abuse controls; this chapter covers payment-page exposure, card testing, account takeover and keys, and leaves personal data, the wider rules and fraud models to their own chapters. |  | `contrast`: The damage a shop can suffer. → Which part of preventing it stays with a merchant that rents its platform, and what the chapter leaves to other chapters. |\n| p04 | context | Eva's iDEAL payment for her jacket in April 2027 goes through the same checkout that took 48,000 abusive attempts one night in August 2026, so the chapter asks how a checkout tells the two apart. | scenario: Eva's order (April 2027, iDEAL) and the 48,000 attempts of August 2026. | `example`: The merchant's share of security. → The order this book follows and the night that tested its checkout. |\n| p05 | transition | The roadmap: the chapter opens on that night and Noor Visser's question of which doors are open to a script and who holds each key, then ranks what attackers want, draws the line between vendor and merchant, places the checkout on the card-data standard's table and describes the skimmers its script rules were written for, takes card testing, account takeover and bots, and admin keys in turn, sets out what each control on the request path must meet, compares four security postures and their fit by scale stage, and ends with Kestrel & Pine's 2027 baseline and what to do when each attack succeeds. |  | `sequence`: Eva's checkout and the August night. → The order in which the chapter answers the question the night raised. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: The Card-Testing Night\n\n**Controlling idea** (`context`, id `scene`): On the night of 18 to 19 August 2026 a script used Kestrel & Pine's guest checkout as built to test 48,000 stolen cards, the PSP noticed before the merchant did, and the lesson Noor Visser draws is a question about doors and keys, not about one attack.\n\n**Advances the thesis** (S1): Shows an attack that used the checkout as designed and cost fees, a paused account and raised declines.\n\n**Transition in:** `elaboration`: The part's checkout that accepts a purchase and 48,000 attempts by the same behavior, and Noor Visser's question named in the roadmap. → The night itself, hour by hour.\n\n**Order of paragraphs** (`chronological`): The night is told in the order it happened (the attempts, what they are called, what followed, why no challenge fired and what was done afterwards), so Noor's question lands after the reader has seen the whole incident.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | context | The Card-Testing Night ran from 18 to 19 August 2026; its figures belong to the fictional scenario and its mechanism is an illustrative reconstruction. | fact: 18 to 19 August 2026; scenario figures, mechanism illustrative. |  |\n| p07 | description | Between about 23:40 and 04:10 a script made 48,000 guest-checkout attempts with stolen card numbers and the cheapest item to find which cards still worked, which is card testing. | scenario: 48,000 attempts, 23:40 to 04:10, cheapest catalog item. | `elaboration`: The night's date. → What the script did. |\n| p08 | definition | OWASP lists card testing as the automated threat OAT-001, which makes a successful-looking payment form a testing service for attackers. | source: OWASP Automated Threats, OAT-001 Carding (n.d., accessed November 2026). | `elaboration`: The attack Kestrel & Pine saw. → Its name in OWASP's list. |\n| p09 | cause_effect (list) | Three consequences followed that the shop was not built to notice: €2,900 in PSP fees for declined authorizations, a 40-minute account pause whose e-mail went unread until 07:30, and about 260 live cards that became real orders, 21 disputes and two weeks of a decline rate raised from about 4% to about 7%. | scenario: €2,900 fees; pause from 02:05 for 40 minutes, e-mail read 07:30; about 260 live cards, 21 disputes, issuer declines about 4% to about 7% for two weeks.; source: Stripe, Protect yourself from card testing (n.d., accessed November 2026). | `cause_effect`: The attempts. → What they cost. |\n| p10 | analysis | No challenge fired because most cards were issued outside Europe, where strong customer authentication (SCA, glossed in one clause) does not bind the issuer; the agency switched on bot protection and velocity rules but wrote no runbook, and in March 2027 Noor Visser turns the incident into a wider question: which doors are open to a script, and who holds the key to each. | scenario: Cards issued outside Europe; bot protection and velocity rules switched on, no runbook; Noor's question in March 2027. | `cause_effect`: The consequences. → Why nothing stopped it and the question it leaves. |\n\n### What Attackers Want From a Shop\n\n**Controlling idea** (`comparison`, id `threats`): Attackers want the payment form, the login and the admin, and about half of what they do is abuse of the shop's own rules rather than intrusion, so each threat's control lives where the abused function lives, for policy abuse in the money flows.\n\n**Advances the thesis** (S1): Ranks the threats and places each control on the function it abuses.\n\n**Transition in:** `elaboration`: Noor's question about doors. → The full list of doors attackers use, beyond card testing.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | comparison | Noor's question covers every door, where many visitors are programs, and eight threats, ranked roughly by the attacker's preference with OWASP identifiers where they exist, each have a different loser and a different place where the control lives. | table: Card testing, credential stuffing and account takeover, web skimming, coupon abuse, refund abuse, inventory hoarding and scalping, admin compromise, supply-chain risk: what each is, who loses, where the control lives.; statistic: Imperva: automated traffic about half of web requests (2025, measuring its own customers). |  |\n| p12 | analysis | The rows differ most in where their control lives: admin compromise and supply-chain risk bypass every other control, and three rows (coupon abuse, refund abuse, inventory hoarding) are policy abuse of the shop's own rules, controlled in the promotion, returns, order and cart systems, which an edge control cannot see. |  | `elaboration`: The table of threats. → What the rows have in common and which controls cover which rows. |\n| p13 | process | The policy-abuse rows need controls in the money flows rather than at the edge: refunds only to the original method, inspection above a threshold, codes bound to a customer and a refund-only key, the Double Refund's lesson of one writer per money movement. |  | `elaboration`: Half the rows are policy abuse controlled in the order, promotion and returns systems. → What those controls are. |\n\n### Shared Responsibility: What the Platform Does and What You Must Do\n\n**Controlling idea** (`claim`, id `shared`): Vendors publish the line between their work and the merchant's: the vendor secures, patches and certifies its service, and the merchant secures the code, scripts, apps, accounts and keys it adds.\n\n**Advances the thesis** (S2): States the vendor's and the merchant's shares from the vendors' own words.\n\n**Transition in:** `cause_effect`: Threats whose controls sit on the merchant's functions. → Which of those controls the hosted platform already provides.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The division is asserted first, then three vendors' statements support it, then the reading of all three draws the line the rest of the chapter works on.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | claim | Buying a hosted platform divides security work between vendor and merchant, because the vendor can secure its infrastructure while an unsafe app, an exposed key or a poorly managed staff account still opens a route into the shop. |  |  |\n| p15 | evidence | Adobe's shared-responsibility model is the most explicit: Adobe keeps core code, operating system, firewall rules and infrastructure certification, and the merchant secures its custom code and integrations, applies patches, manages user access and handles its incidents. | quotation: The merchant secures \"custom code and integrations with third-party applications\". | `example`: The division of work. → The most explicit published version of it. |\n| p16 | evidence | Shopify states that its Level 1 PCI DSS certification extends to all stores by default while the merchant still has steps of its own. | quotation: \"certified Level 1 PCI DSS compliant\"; \"extends by default to all stores powered by Shopify\"; \"there are also steps you will need to take on your own\". | `similarity`: Adobe's division. → Shopify's version. |\n| p17 | evidence | Stripe says the same about payments: PCI compliance is a shared responsibility of Stripe and the business. | quotation: \"PCI compliance is a shared responsibility and applies to both Stripe and your business\". | `similarity`: Two platforms' statements. → The payment provider's. |\n| p18 | synthesis | Read together, the vendor covers the service's code, hosting, patching, certification and default tools, and the merchant covers what it adds, who holds an admin account and whether MFA is enforced, which keys exist and incident response: the hosted platform removes the patching burden and never the identity, script and endpoint burden. | figure: Figure 1: a layered stack, vendor at the bottom, the merchant's scripts, apps, identities and keys on top. | `conclusion_summary`: Three vendors' statements. → The one line they draw together. |\n\n### Card Data: Where PCI DSS Draws Its Line\n\n**Controlling idea** (`explanation`, id `pci`): PCI DSS asks least of a merchant whose systems never see the card number, so the integration pattern sets how much of the standard applies, and two requirements (provider attestations and MFA) apply to every hosted merchant.\n\n**Advances the thesis** (S3): Places each integration pattern on the SAQ table and states the script requirements and the SAQ A statement as the Council wrote them.\n\n**Transition in:** `elaboration`: The vendor's certification covers its service. → The standard that certification refers to and where it draws the merchant's line.\n\n**Order of paragraphs** (`large_to_small`): From what the standard is and when it changed, to which questionnaire applies by integration pattern, to what card data the merchant may keep, to the two requirements every hosted merchant meets; the script requirements wait for the next section, after the attack they answer.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | definition | PCI DSS is the card brands' contractual security standard, enforced through the acquirer, and a modern checkout's design goal is to keep its scope, the systems that touch card data, as small as possible, ideally none of the merchant's own. |  |  |\n| p20 | evidence | The standard changed recently: v4.0 in March 2022, v3.2.1 retired 31 March 2024, v4.0.1 published 11 June 2024, v4.0 retired 31 December 2024, and the requirements v4.0 introduced as best practice mandatory since 31 March 2025. | fact: The five dates. | `elaboration`: The standard. → Its recent dates. |\n| p21 | comparison | How much of the standard applies depends on how the card number reaches the PSP, because the self-assessment questionnaire follows the integration pattern, from SAQ A for a PSP-hosted page or hosted fields to SAQ D for raw card data, with the acquirer deciding. | table: Four integration patterns: who sees the card number, typical SAQ, what the merchant still owns. | `cause_effect`: The standard in force. → How much of it applies to a given checkout. |\n| p22 | analysis | Hosted platforms with their own checkout put every merchant in the first two rows, which makes this the largest security decision a merchant makes, usually by default; a custom checkout that collects card numbers moves it down the table. | figure: Figure 2: with hosted fields the card number goes from the browser to the PSP and the merchant holds a token. | `cause_effect`: The SAQ table. → Where hosted platforms put the merchant and what moves it. |\n| p23 | definition | The brand, last four digits and expiry may be stored, and everything else is replaced by a token the PSP issues to charge or refund the card again. | source: Stripe integration security guide, n.d. | `elaboration`: The card number going straight to the PSP. → What the merchant holds instead. |\n| p24 | explanation | Two requirements apply to every hosted merchant whatever its checkout: 12.8 makes it responsible for its service providers and their attestations, and 8.4.2 requires MFA for access into the cardholder-data environment, which for a hosted merchant means the PSP console and the platform admin. | quotation: \"Adyen is solely responsible for the security of cardholder data only as soon as Adyen receives the data\". | `additional_support`: The card data a hosted merchant may keep. → The two requirements every hosted merchant meets whatever its checkout. |\n\n### Skimmers: The Attack in the Shopper's Browser\n\n**Controlling idea** (`cause_effect`, id `skimmers`): A skimmer runs in the shopper's browser on a page the merchant serves, through a stolen login, a third-party script or an unpatched flaw, and PCI DSS answers it with two script requirements that stay in the standard even where SAQ A asks only for a statement, so the page's scripts are the merchant's to know.\n\n**Advances the thesis** (S3, S5): Shows with dated public cases why the payment page's scripts are the merchant's, and states the script requirements and the SAQ A statement as the Council wrote them.\n\n**Transition in:** `contrast`: Hosted fields that keep the card number out of the merchant's systems. → The page around the fields, where a skimmer runs, and the requirements written for it.\n\n**Order of paragraphs** (`problem_solution`): The attack first (definition, the British Airways case and its lessons, the supply-chain cases), then the standard's answer (the two script requirements, their removal from SAQ A, what the statement means, the controls behind it), so every rule arrives after the attack that explains it and the controls are listed once.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p25 | definition | Hosted fields keep the card number away from the merchant's systems but not from the page around the fields, where a web skimmer, malicious code that copies payment or personal data as the shopper types it, can steal data before the PSP receives it. |  |  |\n| p26 | example | The British Airways breach of 2018 is the clearest public record: a third-party login without MFA, a saved privileged credential, 22 lines of JavaScript on the payment pages, about 429,612 people affected and a £20 million penalty in 2020. | case: BA: entry 22 June 2018; script 14 to 25 August 2018; about 429,612 people; ICO penalty £20 million on 16 October 2020. | `example`: The skimmer defined. → The clearest public case. |\n| p27 | analysis | Two lessons survive: the skimmer ran in the shopper's browser on a page the merchant served without breaking the PSP, and its entry was an identity, a third-party login without MFA. |  | `cause_effect`: The BA case. → What it teaches a merchant today. |\n| p28 | example | The supply-chain version needs no action by the merchant: Polyfill's compromised script reached more than 100,000 sites in 2024, and unpatched self-hosted stores were breached through CosmicSting the same year. | case: Polyfill: sold February 2024, reported 25 June 2024, more than 100,000 sites. CosmicSting (CVE-2024-34102): fixed 11 June 2024, thousands of unpatched stores breached in October and November.; quotation: \"Including JavaScript from other sites makes your security dependent on theirs.\" | `additional_support`: A skimmer added through a stolen login. → Skimmers that arrive through third-party scripts and unpatched code. |\n| p29 | explanation | PCI DSS answers these attacks with two requirements on the page around the card fields, 6.4.3 (every payment-page script authorized, integrity-checked and inventoried with a reason) and 11.6.1 (detect and alert on unauthorized page and header changes), required since 31 March 2025. | source: PCI SSC, 26 March 2025. | `problem_solution`: Skimmers that arrive through stolen logins, third-party scripts and unpatched code. → The standard's two requirements on the page around the card fields. |\n| p30 | explanation | The Council removed 6.4.3 and 11.6.1 from SAQ A and added an eligibility criterion instead: the merchant confirms its site is not susceptible to script attacks, itself, through a third party or with its processor's confirmation. | quotation: \"is not susceptible to attacks from scripts that could affect the merchant's e-commerce systems\". | `contrast`: The two requirements in the standard. → Their removal from SAQ A and the eligibility statement that replaced it. |\n| p31 | analysis | The requirements remain in the standard, so a merchant on a hosted checkout no longer proves a script inventory but must state that its page cannot be skimmed and should know why the statement is true. | quotation: \"these requirements were only removed from SAQ A, and they are still in the standard\". | `emphasis`: The eligibility statement. → What it means for the merchant in plain words. |\n| p32 | process | Adyen's guidance describes the work behind the statement (a Content Security Policy in report-only then enforcing mode, an inventory with business reasons, Subresource Integrity on the PSP's scripts, violation reports as indicators of compromise, and tamper detection), and on a hosted platform the merchant's exposure is the scripts it adds through the theme, apps and tag managers. | quotation: Violation reports as \"valid alerts and 'indicators of compromise'\". | `elaboration`: The statement the merchant must be able to back. → The controls that back it. |\n\n### Card Testing: The Attack and the Controls\n\n**Controlling idea** (`process`, id `card-testing`): Card testing looks like normal checkouts from rotating addresses, so it is stopped by a ladder of layered controls and a decline-rate alert, not by one filter.\n\n**Advances the thesis** (S1, S4): Explains the attack from the PSP's documentation and gives the control ladder with its budgets.\n\n**Transition in:** `contrast`: Skimmers, which steal card numbers as shoppers type them. → The attack of the August night, which brings its own stolen cards and needs only a checkout that will try them.\n\n**Order of paragraphs** (`problem_solution`): The attack and why single filters fail come first; the ladder of controls answers it; the cost of false challenges then sets a limit on the ladder. The per-control requirements table is its own section after the identity section, because it also covers the login and webhook controls.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | definition | Unlike a skimmer, card testing needs none of the merchant's card data: it uses the payment or card-saving interface to discover which stolen cards still work, and the merchant pays in fees and disruption even when no genuine order results. |  |  |\n| p34 | evidence | Stripe's documentation describes the attack: card saving preferred to payment because it does not show on statements, symptoms of failed payments, 402 responses and nonsense names, and a high decline rate damaging the merchant's standing with issuers. | quotation: \"don't typically show up on cardholder statements\"; \"often with nonsensical customer names and emails\"; \"a high decline rate might damage the reputation of your business with card issuers and card networks\".; figure: Figure 3: the night as a sequence of normal checkouts and authorizations. | `elaboration`: Card testing defined. → How it works and what it looks like, from the PSP's documentation. |\n| p35 | analysis | Single filters such as IP blocks fail because attackers rotate addresses, and a leaked secret key lets testers create payments with no checkout at all. | quotation: \"simple firewall rules or filters based on a single heuristic such as IP addresses are usually not sufficient\"; \"card testers can create payments and set up cards using your secret key\". | `cause_effect`: The attack's symptoms. → Why the obvious response fails and the worst version. |\n| p36 | process (list) | The controls form a ladder chosen by how much of the checkout the merchant built: keep the hosted checkout, switch on the bot protection and velocity rules already paid for, require a session before a payment, alert on the decline rate, keep a kill switch, and never retry the cards the attacker saved. | fact: Six rungs; Kestrel & Pine's night visible at 23:55 as a 99% decline rate against a usual 4%. | `problem_solution`: Single filters fail. → The layered controls that work. |\n| p37 | analysis | A challenge shown to 2% of genuine shoppers costs more than most card-testing nights, so challenges are triggered by risk signals rather than shown to everyone. |  | `cause_effect`: The ladder's challenges and session requirement. → Why a challenge is triggered by risk rather than shown to everyone. |\n\n### Account Takeover, Bots and Scraping\n\n**Controlling idea** (`process`, id `takeover`): The login, the cart and the catalog are abused at machine speed in the same way as the checkout, and each has its own control: login limits, challenges and change notices, a short cart hold, and a selective scraping policy.\n\n**Advances the thesis** (S1, S4): Extends the endpoint controls from the payment form to the login, the cart and the catalog.\n\n**Transition in:** `similarity`: Card testing at the payment form. → The same machine-speed abuse at the login, the cart and the catalog.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | definition | Credential stuffing tries passwords leaked elsewhere on the shop's login, and in commerce it ends with an attacker ordering with a customer's saved card to a new address. | quotation: \"the automated injection of stolen username and password pairs\"; MFA as a primary countermeasure. |  |\n| p39 | process | Customer MFA is rarely enforced because it costs conversion, so three other controls carry the weight against takeover: rate limits and bot management on the login, a challenge for new devices and risky logins, and notification of change. |  | `problem_solution`: The takeover sequence. → The controls that stop or catch it. |\n| p40 | process | The cart and the catalog are the other doors bots use and are not guarded at the login: inventory hoarding is controlled by the reservation model, and scraping is tolerated selectively (product pages allowed, cart and checkout challenged, the storefront API rate-limited). |  | `additional_support`: Controls on the login. → The cart and the catalog as further endpoints. |\n\n### Admin Accounts, Keys and the Apps\n\n**Controlling idea** (`recommendation`, id `identity`): The admin login and the keys of apps and integrations need no other technique, so the merchant gives every person, app and integration its own identity, a narrow key and a named owner who can rotate it.\n\n**Advances the thesis** (S2, S5): Turns the merchant's share of responsibility into identities, keys and owners, with Kestrel & Pine's inventory as evidence.\n\n**Transition in:** `contrast`: Customer logins attacked by credential stuffing. → Staff logins and the keys of apps and integrations, the bigger target.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The admin's value first, then how platforms leave MFA to the merchant, then keys and webhook secrets, then Kestrel & Pine's inventory, then the rule that follows.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | claim | Customer logins are one target and staff logins the bigger one: the commerce admin can change the payout account, add checkout scripts, install apps, export customers and issue refunds, so an attacker with it needs no other technique. |  |  |\n| p42 | evidence | Platforms make MFA available but leave enforcement to the merchant, on many plans as a policy to police rather than a switch to flip, and for staff it is never optional. | quotation: Staff \"can set up two-step authentication for their own individual accounts\"; the owner \"can't activate two-step authentication for any other staff member\"; without it \"your payouts might be placed on hold\". | `example`: The admin's value. → How one platform handles MFA for it. |\n| p43 | process | Keys are the other half: no secrets in source code, a vault, restricted least-privilege keys, rotation and audit, any exposure treated as compromise, and a webhook's signing secret treated as a key whose signature check comes before the message is believed. | quotation: \"bad actors continuously scan public repositories\". | `additional_support`: Staff logins. → The keys apps and integrations hold. |\n| p44 | evidence | Kestrel & Pine's January 2027 inventory found 34 integrations, 13 without owners, and 41 apps, three of them writing stock, with five integrations still unowned in April, and each credential needs someone who can explain, limit and replace it. | fact: 34 integrations, 13 without a named owner in January 2027, 5 still unowned in April 2027; 41 apps, 3 with stock-writing permission. | `example`: The rules for keys. → Kestrel & Pine's own count of keys and owners. |\n| p45 | recommendation | The author's rule is one identity per integration, narrow permissions and a named owner who can rotate its key, recorded in the inventory, because separate identities can be traced and revoked one at a time, narrow permissions limit what a stolen key can change, and an app that asks for more than its job needs is refused at installation. | figure: Figure 4: a key cabinet, 34 integrations, 13 with blank owner tags. | `problem_solution`: Keys without owners. → The rule that closes the gap. |\n\n### Requirements per Control Point\n\n**Controlling idea** (`explanation`, id `control-points`): The controls of the last three sections (the challenge at the payment step, the login limits and the webhook check) sit on the request path and need budgets like any other call: how fast each must answer, how many genuine users it may wrongly stop, what state it keeps, and whether it fails open where another check still stands or closed where it is the only check.\n\n**Advances the thesis** (S4): Turns the request-path controls of three sections into engineering requirements with budgets and failure behavior.\n\n**Transition in:** `elaboration`: The challenge, login and webhook controls of the last three sections. → The requirements each of them must meet on the request path.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | explanation | The controls of the last three sections (the challenge at the payment step, the login limits and the webhook check) sit on the request path and need budgets like any other call: how fast each must answer, how many genuine users it may wrongly stop, what state it keeps, and whether it fails open where another check still stands or closed where it is the only check. | table: Challenge on guest checkout, login rate limit and MFA, webhook signature check: latency, false positives, consistency, failure behavior (figures are assumptions). |  |\n\n### The Choices: Four Security Postures\n\n**Controlling idea** (`comparison`, id `choices`): Four postures, from platform defaults to a security function, close progressively more of the merchant's share, and the merchant moves one rung when its landscape gains what that rung protects.\n\n**Advances the thesis** (S5): Sets the controls into postures with costs and the trigger for each.\n\n**Transition in:** `conclusion_summary`: The controls and their requirements, with the inventories of the earlier sections. → How much of them a given merchant should take on, as four postures.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | comparison | The four postures, platform defaults, defaults plus paid tools, edge policy and identity management, and a security function, differ in cost, in what they close and leave open, and in when each is right; the last suits a group or a software vendor and is the Giant's Boots for a merchant of Kestrel & Pine's size. | table: Four postures: cost (illustrative), what each closes and leaves open, when it is right. |  |\n| p48 | recommendation | The author's recommendation is to move up one posture when the landscape gains what that posture protects: the first integration key, the first custom checkout, the first store terminal (a card reader in a shop). |  | `cause_effect`: The four postures. → When to move between them. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): The controls do not change with scale; the number of identities, keys, scripts and endpoints does, and with it whether anyone can still list them.\n\n**Advances the thesis** (S5): Places the postures on the four scale stages with warning signs, including Kestrel & Pine's.\n\n**Transition in:** `elaboration`: The postures and their triggers. → The posture typical of each scale stage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p49 | comparison | Which posture fits depends mostly on the scale stage, and each stage has a typical posture, controls that become necessary and signs that the merchant has outgrown it. | table: Four stages: typical posture, what becomes necessary, warning signs (Kestrel & Pine's 07:30 pause notice and 13 of 34 unowned integrations in January 2027). |  |\n| p50 | analysis | The shape of the control barely changes with scale; what changes is how many identities, keys, scripts and endpoints there are and whether anyone has a list, which is why an Omnichannel merchant with 34 integrations and 41 apps meets the Lynchpin. |  | `conclusion_summary`: The stage table. → What changes with scale and what does not. |\n\n### In Practice: Kestrel & Pine's 2027 Security Baseline\n\n**Controlling idea** (`example`, id `in-practice`): Kestrel & Pine's April 2027 baseline turns every gap of the August night into a control with an owner, and read backwards it would have stopped the night within minutes.\n\n**Advances the thesis** (S3, S4, S5): Applies the chapter's controls to one merchant, before and after.\n\n**Transition in:** `example`: The posture typical of an Omnichannel merchant. → The posture Kestrel & Pine chose.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | example | In April 2027 Noor Visser and Milan Petrov write a one-page baseline, the second posture plus the parts of the third the integration inventory demands, set against what was true in August 2026. | table: Eight items before and after: card-data scope, guest checkout, decline alert and kill switch, staff and vendor identity, integration identities, apps (6 unused uninstalled in April, stock-write access withdrawn by June, 34 apps in July 2027), checkout scripts, runbooks. |  |\n| p52 | analysis | Read backwards, the baseline stops the Card-Testing Night: the alert fires at 23:55, the challenge stops most attempts, the kill switch ends the rest and a named person is called, because the cost that mattered was the paused account and the raised declines, not the €2,900. |  | `cause_effect`: The baseline. → What it would have done on the August night. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`process`, id `wrong`): Each intrusion has a detection signal and a response in a fixed order, and the merchant that can name its keys and scripts responds narrowly instead of rotating everything.\n\n**Advances the thesis** (S4, S5): Gives the runbook outline for each failure.\n\n**Transition in:** `contrast`: The baseline working. → What to do when an attack gets through anyway.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | process | A card-testing wave is detected by the decline-rate alert and answered with the kill switch, canceled orders, key rotation if the checkout was not the route, weeks of watching the decline rate and no retries of the attacker's cards. |  |  |\n| p54 | process | A skimmer found on checkout is removed through whatever loaded it, the evidence is kept and the entry traced, and because card numbers are personal data the incident is also a privacy breach the merchant must report within a deadline, which the next chapter names (72 hours) where it sets out a vendor's duties to the merchant. |  | `sequence`: The card-testing response. → The skimmer response. |\n| p55 | process | A compromised admin account or key is revoked first and investigated second, and a merchant that cannot say which integration a leaked key belonged to must rotate everything. |  | `sequence`: The skimmer response. → The compromised identity. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** Card testing, takeover, skimmers and leaked keys look like four attacks needing four products. Read together they are one gap: every door the chapter examined (the payment form, the login, the cart, the checkout's scripts, the admin and each integration's key) was open by design and worked as the vendor promised; what Kestrel & Pine lacked in August 2026 was a list of its keys and their owners, of the scripts on its checkout, and a signal, the decline rate, that showed the doors being used.\n\n**So what:** A merchant with those lists sees an attack in the count, closes a door with a setting rather than a deploy, rotates one key rather than all of them, and can sign the SAQ A statement knowing why it is true; one without them learns of the next night from a PSP e-mail in a shared mailbox.\n\n**Callback:** The opening's checkout that must accept strangers' payments and Noor Visser's question of which doors are open to a script and who holds each key. p56 answers it with Eva's April 2027 payment set beside one of the 48,000 attempts: the checkout cannot tell them apart one request at a time, but a merchant that watches the decline rate and knows its keys, owners and scripts can.\n\n**Takeaway** (`course_of_action`): Keep the checkout hosted; switch on the controls already paid for; alert on the decline rate beside orders per minute; keep the checkout scripts on a list with owners; give every person, app and integration its own identity and a narrow key with an owner who can rotate it; move one posture rung when the landscape gains what it protects.\n\n**Hand-off** to [Whose Data Is It? Privacy, Consent and Retention](privacy-and-customer-data.html): `similarity`: The previous chapter's question of who may act on the shop, answered by a list of identities and keys with owners. → The mirror question about the data the shop holds on people: who may use it, for what and for how long, answered by a list of systems with legal roles, actions and retention clocks.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p56 | synthesis | Noor's question has one answer: every door in the chapter was open by design and worked as promised, and Eva's payment and one of the 48,000 attempts look the same to the checkout one request at a time, so they are told apart only in the decline rate, by a merchant that also knows its keys, their owners and its checkout scripts. | reasoning: The opening checkout and Noor's question set against the sections' controls. |  |\n| p57 | synthesis (list) | Established: keep the card number out of the merchant's systems; the payment page's scripts are the merchant's under 6.4.3, 11.6.1 and the SAQ A statement; card testing and credential stuffing need layered controls; vendors publish the same shared-responsibility line. | source: Stripe, Adyen, PCI SSC 2024 and 2025, OWASP, Adobe, Shopify. | `elaboration`: The chapter's answer in one paragraph. → What is settled, with sources. |\n| p58 | synthesis (list) | Depends on context: how far up the posture ladder to go, whether to challenge guest checkout given the payment mix, and whether patch cadence or identities deserve the effort, depending on self-hosted or SaaS. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p59 | recommendation (list) | The author's synthesis: for a merchant renting its platform, security is an inventory problem before a technology problem, and the decline rate belongs beside orders per minute on the dashboard. |  | `sequence`: What depends on context. → The author's own judgement. |\n| p60 | recommendation (list) | Eight questions turn the chapter into a review of the reader's own shop: the SAQ and attestations, the checkout's scripts, unprotected endpoints, enforced MFA, identities and keys per integration, who would notice a PSP pause, the decline rate and kill switch, and app scopes. |  | `cause_effect`: The author's judgement. → Questions the reader can ask of its own shop. |\n| p61 | transition | Security decides who may act on the shop; the next chapter asks the mirror question about the data the shop holds on people: who may use it, for what and for how long. |  | `similarity`: Who may act on the shop, answered by a list of identities and keys with owners. → The mirror question about the data held on people. |\n\n## Non-goals\n\n- SCA, 3-D Secure, authorization and capture, refunds. See [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html).\n- Personal data, consent, retention, data subject requests, breach notification clocks. See [Whose Data Is It? Privacy, Consent and Retention](privacy-and-customer-data.html).\n- The legal instruments (NIS2, Cyber Resilience Act, PSD3) and the regulatory calendar. See [Rules Turned Into Requirements: Consumer, Payment, Invoicing and Platform Regulation](commerce-regulation.html).\n- Fraud scoring, device fingerprinting and machine-learned risk models. See fraud-prevention (LISTED).\n- App scopes and app governance in depth; integration inventory and ownership. See [Apps, Plugins and Functions: Extensibility and Ecosystem Governance](extensibility-and-app-ecosystems.html), [APIs, Events, Files and Middleware: How Commerce Systems Talk](integration-styles.html), [Who Builds and Who Owns: Teams, Vendors, Agencies and Governance](organizing-commerce-engineering.html).\n- Reservation rules against inventory hoarding. See [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Needs the author: the ledger records 41 apps in January 2027, the 6 unused apps uninstalled in April 2027 and 34 apps remaining in July 2027 (extensibility-and-app-ecosystems line; consistency ruling 10), which leaves one removal unexplained (41 - 6 = 35). The page states the ledger's three figures and no subtraction; the one fact needed is which seventh app was removed, and when. Readers in rounds 1 and 2 stopped on the arithmetic.\n\n## Decision log\n\n- **2026-11-07** — Chose the Card-Testing Night as the spine and \"security as an inventory of identities, keys, scripts and endpoints\" as the thesis, over a tour of security products, because a merchant on a hosted platform owns lists more than technology. (from spec.md)\n- **2026-11-07** — Gave PCI DSS one section with exact dates and the SAQ A change explained precisely, rather than a summary of all twelve requirements, because the SAQ A statement is the one decision a hosted merchant actually faces. (from spec.md)\n- **2026-11-07** — Kept bot statistics to one labeled vendor figure; the chapter's argument does not depend on them. (from spec.md)\n- **2026-11-07** — Cut a separate \"dated public examples\" list after a length pass; the examples (BA 2018/2020, Polyfill 2024, CosmicSting 2024, Stripe and Shopify documentation) are cited inline instead. (from spec.md)\n- **2026-11-12** — Converted spec.md to spec.json from the published c n budget is spent), the cheap, plainly right fixes were applied without another round: a linking sentence in the scene's last paragraph before Noor's question; the Adyen quotation tied to what it shows and 'attestation of compliance' glossed; the token paragraph opens on hosted fields; the Double Refund sentence says what happened and states the lesson plainly; the repeated automated-traffic clause trimmed; 'order of preference' explained as how often a threat is tried; the CosmicSting sentence says what is equivalent; Eva's April 2027 and the August 2026 night ordered with 'eight months earlier'; the control-point lead split into one sentence per column; 3-D Secure glossed at first use in the scene; glosses for PCI DSS in KEY POINTS, Bancontact, Magecart, the Plus plan, the PSP secret key and the PCI Security Standards Council (rule 6). max_words raised from 6650 to 6750 for these glosses (rule 4, within 7150). Left as they stand: the app count gap (needs the author, see open_questions); one-reader notes on the two pairs of requirements, the hosted merchant's cardholder-data environment, scraping missing from the table, the 2% claim, Kestrel & Pine's stage and the Lynchpin (rule 10). Rejected: A fourth round.\n\n## Sources\n\n- **Internal**\n  - journal-spec.json (commerce-security; part-8; privacy-and-customer-data transition_in) — Intent, acceptance criteria, thesis, role and the hand-off.\n  - _research/scenario-ledger.md (incident 8; commerce-security, integration-styles, organizing-commerce-engineering, extensibility-and-app-ecosystems and commerce-payments lines; systems table) and _research/consistency-issues.md (rulings 10 and 16) — The Card-Testing Night and its reconstruction, the April 2027 baseline, the 34 integrations (13 unowned in January, 5 in April 2027), the 41 apps (6 unused, 3 writing stock, 34 by July 2027), the kill switch and the Double Refund.\n  - meet-kestrel-and-pine — The Card-Testing Night, the 41 apps, the 34 integrations. (from spec.m n automated traffic.\n\n## Changelog\n\n- **2026-11-12** — Closing fixes after the confirming round 3 (ESCALATE, 14 pass, 32 fail, all draft-fault): linking sentences, glosses and the control-point lead split; max_words 6750. The round 3 check report is stale after these edits.\n- **2026-11-12** — Resolution after round 2: script requirements moved into Skimmers after the attack (duplicate controls paragraph merged); Requirements per Control Point made its own section; stage lead paragraph added; glosses and disambiguations; KEY POINTS script bullet aligned with the body; max_words 6650; open questions auto-resolved except the app count gap. The round 2 check report is stale.\n- **2026-11-12** — After draft-check round 1 (ESCALATE, spec-fault flow failures): Skimmers moved after Card Data; control-point table moved to the end of the identity section; transitions and controlling ideas revised in spec and prose for the introduction's damage, scope and roadmap paragraphs, both threat paragraphs, the script-requirements paragraph, the openings of Skimmers, Card Testing and Admin, the key rule, both posture paragraphs and the skimmer response; glosses added. The round 1 check report is stale.\n- **2026-11-12** — Converted spec.md to spec.json (outcome-spec pass): reconstructed from the published chapter; roadmap p05 and synthesis p56 added; canonical-fact fixes (Spaghetti Junction callout, apps row, pointer to the next chapter); spec.md removed.\n- **2026-11-07** — Visual layer: redrew 2 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator). (from spec.md)\n- **2026-11-07** — Final consistency pass: dated the unowned-integration count (13 of 34 as of January 2027; 5 still unowned in April 2027, consistency item 16); \"the ledger's\" numbers now read as Kestrel & Pine's records. (from spec.md)\n- **2026-11-07** — Editorial review pass: WHY IT MATTERS shortened and corrected, acronyms and terms expanded, integration description aligned with
