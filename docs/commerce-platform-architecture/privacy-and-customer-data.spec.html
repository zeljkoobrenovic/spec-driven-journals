<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/35-privacy-and-customer-data/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (the opening pick-up of the previous chapter in p01, a thesis paragraph p05, a roadmap p06 and a conclusion paragraph that answers the opening, p59); see decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The GDPR vocabulary the design rests on: personal data, controller and processor (the EDPB's purposes and essential means), the data processing agreement, the four lawful bases that matter in commerce (contract, legal obligation, legitimate interests, consent, with the ePrivacy soft opt-in), data subject requests and the one-month deadline extendable by two.\n- **Know:** Which systems hold a person in a commerce estate and in which role, as the chapter reads it: the platform, WMS, OMS, integration platform, returns portal, data warehouse and most apps as processors; the PSP for the payment, carriers and marketplaces as independent controllers; and what Shopify's compliance webhooks and protected-customer-data rules do on the merchant's behalf.\n- **Know:** The consent rules for devices and profiles (GDPR Articles 4(11) and 7(1), ePrivacy Article 5(3), the EDPB and the Dutch and Belgian regulators), the retention periods the chapter cites (at least seven years in the Netherlands; ten, eight or six in Germany; ten in Belgium pending confirmation), transfers under the Data Privacy Framework and standard contractual clauses, and the pending Digital Omnibus proposal and DPF appeal.\n- **Believe:** The order and the marketing profile describe one person but are two things in law: the order is kept for years under contract and tax law; the profile goes when the person asks.\n- **Believe:** Every integration is also a data flow with a legal role, and the integration inventory is the data-flow inventory.\n- **Believe:** A deletion request is a fan-out with a deadline; without an identity index and an orchestrator it is a hunt.\n- **Be able to:** Write a privacy map for their own landscape: per system, its legal role, the data it holds, the action a request requires (erase, pseudonymize, retain, refer) and its retention clock.\n- **Be able to:** Design the data model so that an order can outlive its customer, and say how consent reaches every tag, tool, till and app.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer or integration lead who inherits the first deletion request and the product manager asked whether a tracking tag or a customer data platform is allowed; next the operations or finance lead who must reconcile 'delete my data' with 'keep the invoice for seven years'.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its thirteen systems, its incidents in outline and the names of the sixteen failure patterns, including the Familiar Stranger, the Secret Agent and the Long Fuse.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines, 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, the four scale stages, the capability map, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Parts II to VI: one invoice per shipment and credit notes as the only correction; the integration inventory with an owner per flow (13 of 34 integrations had no named owner in January 2027); chapter 27's customer master, owned cross-reference and the June 2027 identity rule (the shop platform as master for consumers, the ERP for business customers), with consent read from the master.\n- From chapter 34: attackers act through the payment form, the login and the admin; one identity and scoped key with an owner per person, app and integration; a skimmer found on the checkout starts a legal clock because card numbers are personal data.\n\n**Does not yet know:**\n\n- Personal data, GDPR, controller, processor, data processing agreement (DPA), lawful basis, data subject request (DSR), retention.\n- Consent as the GDPR defines it, the ePrivacy device rule, the soft opt-in, cookie walls, consent management platform (CMP), server-side tagging, customer data platform (CDP).\n- Erasure, pseudonymization, identity index, request orchestrator, per-system action table, backup exception.\n- Adequacy decision, standard contractual clauses (SCCs), the EU-US Data Privacy Framework (DPF), transfer inventory, the breach-notification clock.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a deletion request from a customer who appears in several channels, the reader plans a fan-out with a decided action per system, rather than deleting the storefront account. *Probe:* A customer who bought on a brand's web shop and on a marketplace, returned an item, subscribes to its newsletter and joined a store loyalty program asks the brand to delete her data and stop e-mailing her. The team plans to delete her web shop account. Using only this chapter: is that enough, and what should happen? | `custom` | cold_reader | major |\n| AC-2 | The reader can explain why storing the person on the order blocks deletion and what design fixes it. *Probe:* A merchant's ERP and platform store the customer's name, address and e-mail on every order, and its customer list is simply the people who have ordered. Using only this chapter: why does this stop the merchant deleting anyone, and what design fixes it? | `custom` | cold_reader | major |\n| AC-3 | The reader can say what consent requires and how it must travel. *Probe:* A merchant's analytics and advertising tags fire as soon as a page loads, its newsletter list is built from everyone who ever ordered, and store staff sign up loyalty members on a tablet. Using only this chapter: what is wrong, and what should be in place? | `custom` | cold_reader | major |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What personal data does a commerce platform hold, what may it do with it, and how do you build consent and retention in?\n\n> **Claim:** A shop holds one person in many systems for different purposes: the order and invoice rest on the contract and tax law and are kept for years; the marketing profile rests on consent and goes when the person asks. Build consent and retention in by mapping each system's legal role, request action and retention clock, keeping consent with its evidence on the customer master, splitting the person from the transaction, and answering requests through an identity index and an orchestrator.\n\n**Disputed by:** The view that privacy compliance is a cookie banner, a privacy notice and the platform's delete button: the hosted platform handles the personal data, so deleting the customer's account answers a deletion request.\n\n**So what:** A merchant that accepts the claim keeps a privacy map beside its integration inventory, records consent where every outbound tool can read it, models orders so that they outlive the customer, and answers requests with a flow and a record rather than a search. On 10 May 2027 Lotte Claes, a fictional customer in Ghent, asked Kestrel & Pine to delete her data: she was in nine of the thirteen systems, and three people with a shared spreadsheet took seventeen working days to answer, on 4 June 2027, six days inside the one-month limit. Thirteen of its 34 integrations had no named owner in January 2027, thirteen data flows nobody was accountable for (5 were still unowned in April 2027). In October 2027 a request orchestrator, an integration-platform flow with a human verification step and a per-system action table, went live on the identity index of June and July 2027; the second request, in November 2027, took two working days, and the privacy map became a column of Noor Visser's ownership map, reviewed quarterly.\n\n**How and why:** The GDPR makes the merchant the controller, because it decides why and how the data is used, and the systems it chose (platform, WMS, OMS, integration platform, most apps) its processors under contracts, while carriers, marketplaces and the PSP for the payment decide for themselves; so every integration copies a person into a system with its own role. Each use needs its own lawful basis and runs on its own clock, and tax law keeps invoices for years, so where the invoice is the customer record a deletion either breaks the tax rule or does not happen. A request must be answered within one month, extendable by two, and consent must be demonstrable and withdrawable everywhere, so without an index of where each person is held and a decided action per system every request starts with a search of every system, and every withdrawal misses a tool.\n\n**Supporting claims**\n\n- **S1** — Every integration copies a person into another system with its own legal role: the merchant decides why and how the data is used and is the controller; the shop platform, the WMS, the OMS, the iPaaS, the returns portal, the data warehouse and most apps are processors under a contract; carriers, marketplaces and the PSP for the payment decide for themselves. So the system-of-record map needs a legal-role column and the integration inventory is also the inventory of data flows, with transfers and partners on it.\n- **S2** — Each use of the data needs its own lawful basis and runs on its own clock: the order rests on the contract and on legal obligations, marketing on consent or the soft opt-in; consent must be given before tags read the device, be demonstrable per person and purpose, and travel from the customer master to every tag, tool, till and app, with a withdrawal reaching all of them.\n- **S3** — Tax law keeps invoices and accounting records for years (at least seven in the Netherlands; ten, eight or six in Germany; ten in Belgium pending confirmation), so where the invoice is the customer record a deletion either breaks the tax rule or does not happen; splitting the person from the transaction (order and invoice carry a reference, the profile is a separate erasable record, analytics carry a hash) makes retention a property of each record type, with backups under a bounded exception.\n- **S4** — A data subject request must be answered within one month, extendable by two, by every system that holds the person; that takes an identity index of where each person is held, a request orchestrator that verifies the requester and records each answer, and a per-system action table decided in advance (erase, pseudonymize, retain, with refer and except outside the merchant's reach).\n- **S5** — The duties do not change with scale; where the data lives does: below the Omnichannel stage the platform's DPA, banner, consent box and app rules do most of the work, and from the Omnichannel stage the merchant must own the privacy map, the identity index, the orchestrator and a transfer inventory, as Kestrel & Pine did after the request from Ghent.\n\n## Role in the part\n\nReads the integration inventory as a map of data flows with legal roles, separates the order from the person in law and in the data model, and turns consent, retention and deletion requests into state and a flow the merchant owns. Supports P8-2 of part `part-8`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in data, roles, sharing, bases, consent, retention and dsr: the vocabulary, then who decides and who receives, then on what basis, then consent, then how long records are kept and how the person is split from the transaction, then the request that uses all of them; `comparison` in choices and stages: the options compared on the same criteria, then by scale stage)\n\nThe request from Ghent comes first so that every term arrives as part of the answer to why one customer took seventeen working days. The vocabulary and the data inventory follow, because every later section uses them; then the roles, because the action a request takes in a system depends on whether the merchant controls it, and at once the recipients beyond the merchant's systems (partners, other countries, software vendors), because they are the same roles applied to data that leaves. The lawful bases and consent follow, because they decide which records may go and which must stay; consent precedes retention because the profile that consent governs is the record the retention split makes erasable. Retention and the split come before the request flow, because the request's action table (erase, pseudonymize, retain) applies that split; the requirements of the four privacy flows follow the request, the last of them, so all four can be set side by side. Only then are the ways to run requests compared, by option and by stage; Kestrel & Pine's design applies the chosen option, and the failures come last because each is read against the rules that detect and recover from it. Putting the request flow before retention would ask the reader to pseudonymize and retain before knowing why; putting the options before the parts would compare designs on properties not yet explained.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A customer asks a merchant to remove her data; her account is in the shop platform, but her addresses, purchases and contacts have reached warehouse, carrier, payment, marketing and support systems, and removing the storefront profile does not settle those copies.\n\n**Bridge:** The previous chapter's question of who may act on the shop, answered by a list of identities and keys with owners; anyone who has handled a 'delete my account' e-mail knows the account is not the only copy. → The mirror question about the data the shop holds on people: who may use it, for what and for how long, answered by a map of systems with legal roles, actions and retention clocks.\n\n**Thesis statement** (KEY POINTS callout and paragraph p05): A shop holds one person in many systems for different purposes: the order and invoice rest on the contract and tax law and are kept for years, the marketing profile rests on consent and goes when the person asks; consent and retention are built in by mapping each system's legal role, request action and retention clock, keeping consent with its evidence on the customer master, splitting the person from the transaction and answering requests through an identity index and an orchestrator.\n\n**Roadmap** (Paragraph p06):\n\n- Start from a deletion request that found one customer in nine of Kestrel & Pine's thirteen systems. *Kept in:* scene.\n- Give the vocabulary and what personal data a merchant holds. *Kept in:* data.\n- Say who is controller and who is processor, and follow the data to partners, other countries and software vendors, with the breach clock. *Kept in:* roles, sharing.\n- Separate the lawful bases of the order and of marketing, and set out consent for cookies, tracking and the store's till. *Kept in:* bases, consent.\n- Show retention and the split of person from transaction, then a request across many systems. *Kept in:* retention, dsr.\n- Set the requirements of the four privacy flows side by side. *Kept in:* requirements.\n- Compare the ways to run requests, and the stage at which each fits. *Kept in:* choices, stages.\n- Follow Kestrel & Pine's autumn 2027 design and end with what goes wrong. *Kept in:* practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | The previous chapter asked who may act on the shop; the mirror question is who may use the data the shop holds on people, and it becomes concrete when a customer asks a merchant to remove her data: her account is in the shop platform but copies have reached warehouse, carrier, payment, marketing and support systems, so the merchant needs a map of the copies, their purposes and retention, and a request that reaches every copy with a result it can verify; the chapter is an architect's reading of the rules, not legal advice. | scenario: A customer asking for removal whose account is in the shop platform and whose details have reached warehouse, carrier, payment, marketing and support systems. |  |\n| p05 | claim | The chapter's answer: a shop holds one person in many systems for different purposes; the order and the invoice rest on the contract and tax law and are kept for years, the marketing profile rests on consent and goes when the person asks, and consent and retention are built in by mapping each system's legal role, request action and retention clock, keeping consent with its evidence on the customer master, splitting the person from the transaction and answering requests through an identity index and an orchestrator. |  | `problem_solution`: Copies of one person in many systems and the map they need. → The chapter's answer, stated before the evidence for it. |\n| p06 | transition | The roadmap: the chapter explains who decides the use of data (the controller) and who processes it (the processor), how consent is recorded, how long records are kept and how requests are handled; it starts from a deletion request that found one customer in nine of Kestrel & Pine's thirteen systems, then gives the vocabulary and the data a merchant holds and the two roles, follows the data to partners, other countries and software vendors with the breach clock, then the lawful bases and consent (including at a store's till), retention and the split of person from transaction, the request across many systems and the requirements of the four privacy flows; it compares the ways to run requests and the stage at which each fits, follows Kestrel & Pine's autumn 2027 design and ends with what goes wrong, using the scenario and dated primary sources. |  | `sequence`: The chapter's answer. → The order in which the chapter argues it, and its evidence. |\n| p04 | context | In the order's journey, Eva's jacket order of 13 April 2027 spreads her details through fulfillment, payment and invoicing; order messages need her e-mail, the newsletter needs its own basis, and her 19 April exchange adds the returns portal, so every copy needs a purpose and a retention rule; the chapter's case is a different customer with a longer history. | scenario: Eva's order #1072455 of 13 April 2027, her newsletter enrollment and her 19 April exchange. | `example`: The roadmap's opening case and the parts of the answer. → The book's running order, Eva's, as the everyday version of the same spread, before the chapter turns to a different customer, Lotte. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: The Request From Ghent\n\n**Controlling idea** (`context`, id `scene`): On 10 May 2027 a Belgian customer asked Kestrel & Pine to delete her data; she was in nine of its thirteen systems, each needing a different action, and three people with a shared spreadsheet took seventeen working days to answer, on 4 June 2027, with nothing written down for the next request.\n\n**Advances the thesis** (S4, S1): Shows one request fanned out by hand across nine systems, each with a different right answer, before any term is introduced.\n\n**Transition in:** `example`: Eva's details spread across systems, and the roadmap's opening case. → The request from Ghent of 10 May 2027, a customer with a longer history.\n\n**Order of paragraphs** (`chronological`): The request, then her relationships, then the hunt through the nine systems in the table, then what lay outside the table and the reply: the reader sees the hunt in the order it happened, and the section ends on what it left behind, nothing written down for the next request.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | context | On 10 May 2027 Lotte Claes, a Belgian customer in this fictional example, asks Kestrel & Pine to delete her data and stop e-mailing her. | scenario: The request of Monday 10 May 2027 from Lotte Claes in Ghent. |  |\n| p08 | analysis | Lotte's relationships (two storefront orders, a marketplace order, a return, a newsletter subscription and an Antwerp store loyalty entry) mean Noor Visser must find the records behind each and decide the action for each system, so deleting the storefront account alone will not complete the request. | scenario: Two BE storefront orders, one bol order, one return, a newsletter subscription and an Antwerp loyalty sign-up. | `elaboration`: The request. → What Lotte's relationships with the company are and why one deletion is not enough. |\n| p09 | evidence | Ruben Alves and application support took seventeen working days to find her in nine of the thirteen systems, and in each the right action, and what could not be done, differed. | table: Nine systems (the shop platform, the marketplace connector, the ERP, the WMS, the shipping service, the PSP, the POS, the returns portal, the data warehouse), with what each held, what was done and what could not be done. | `cause_effect`: The need to find every record. → How long it took and what was found in each system. |\n| p10 | analysis | The newsletter tool, the iPaaS logs and unchecked backups complete the picture, and the reply went out on 4 June 2027, six days inside the one-month limit, after three people and a shared spreadsheet; the request was answered, but nobody had written down how to answer the next. | fact: Reply on 4 June 2027, inside the one-month limit with six days to spare; three people and a shared spreadsheet.; figure: Figure 1: thirteen filing drawers, nine open with the same person's card, three workers and a calendar marked 17 working days. | `additional_support`: The nine systems in the table. → The copies outside the table, the reply date and what the hunt left behind. |\n\n### What Personal Data a Commerce Platform Holds, and Under Which Rules\n\n**Controlling idea** (`definition`, id `data`): Personal data is any information relating to an identifiable person; the GDPR gives the person rights and the merchant duties, and a merchant holds the same person in several rows, each with its own purpose, lawful basis and retention clock.\n\n**Advances the thesis** (S1, S2): Supplies the vocabulary the rest of the chapter uses and shows that one person's data has several bases and clocks.\n\n**Transition in:** `elaboration`: The words used in Lotte's request (controller, the one-month limit, what could be kept). → The vocabulary that names them.\n\n**Order of paragraphs** (`prerequisite_order`): The terms first (personal data and the GDPR, then the roles and bases), then the inventory that uses the terms, then what the inventory shows, then the stakes. The inventory's columns cannot be read before lawful basis and retention are defined, and the fines mean more once the reader has seen what the duties cover.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | Personal data is any information relating to an identified or identifiable person, and the GDPR, applying across the EU since 25 May 2018, gives the person rights (access, rectification, erasure, objection, portability) and the organizations that handle the data duties. | source: Regulation (EU) 2016/679, applying from 25 May 2018. |  |\n| p12 | definition | The controller decides why and how personal data is used, the processor acts only on its instructions under a data processing agreement, a lawful basis is the legal reason for a use (four of Article 6's six matter here), a data subject request is a person exercising a right, and retention is pulled two ways: no longer than the purpose needs and at least as long as tax law demands. | source: GDPR Articles 4(7), 4(8), 6 and 28. | `sequence`: Personal data and the GDPR. → The roles, bases, requests and retention the design rests on. |\n| p14 | evidence | A merchant like Kestrel & Pine holds four kinds of personal data by purpose, each in several systems, with its own usual lawful basis and its own retention need. | table: Name and addresses; e-mail and phone; order history, returns and refunds; browsing and behavior, each with where it lives, purpose, usual basis and how long it is needed. | `example`: The vocabulary. → What a merchant actually holds, described in it. |\n| p15 | analysis | The table's right-hand columns are the design: the same person appears in every row, but the order record and the marketing profile need separate lawful bases, separate retention clocks and separate deletion behavior. |  | `conclusion_summary`: The inventory table. → What its columns mean for the design. |\n| p13 | evidence | Getting the separation wrong has a price: the fine ceiling for core infringements is €20 million or 4% of worldwide annual turnover, whichever is higher, so for Kestrel & Pine (4% of €48.0 million is about €1.9 million) the ceiling is €20 million, though commoner sanctions are orders to stop processing and the public finding. | statistic: Article 83(5): €20 million or 4% of worldwide annual turnover, whichever is higher; 4% of €48.0 million is about €1.9 million, so the €20 million figure applies. | `cause_effect`: The order and the profile as separate duties. → What getting them wrong can cost. |\n\n### Controller, Processor and the Commerce Supply Chain\n\n**Controlling idea** (`analysis`, id `roles`): The merchant is the controller because it decides why and how the data is used; most of the systems it chose are processors under contract, while carriers, marketplaces and the PSP for the payment decide for themselves, so the system-of-record map needs a legal-role column.\n\n**Advances the thesis** (S1): Assigns a legal role to each system of the estate and turns the integration inventory into a data-flow inventory.\n\n**Transition in:** `elaboration`: The controller and processor named in the vocabulary. → The test that tells them apart and who is which.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The test (who decides purposes and essential means), then its application to each system, then a platform that encodes it, then the consequence for the map. The consequence cannot be drawn before the roles are assigned.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | explanation | The merchant is the controller for Lotte's data, and the EDPB's guidelines draw the line: purposes and the essential means (which data, how long, who receives it) are the controller's, while non-essential means such as the software and detailed security measures may be left to the processor. | quotation: EDPB Guidelines 07/2020 (version 2.0, July 2021): purposes 'are clearly always for the controller to make'; essential and non-essential means. |  |\n| p17 | analysis | Applied to the commerce supply chain, as the author reads it, the platform, WMS, OMS, iPaaS, returns portal, data warehouse and most apps are processors, the PSP is a processor for the order data but usually an independent controller for the payment, carriers and marketplaces are independent controllers, and advertising platforms are often joint or independent controllers. | table: Role per system with the reason. | `example`: The test. → Its usual outcome system by system. |\n| p18 | example | Platforms encode this in their app rules: Shopify requires every App Store app to handle three compliance webhooks within 30 days and gates name, address, phone and e-mail behind its protected-customer-data program, which is a platform acting as the merchant's processor and policing sub-processors. | source: Shopify's compliance webhooks (customers/data_request, customers/redact sent 10 days after the request, shop/redact 48 hours after uninstall; 30 days to act) and protected customer data.; figure: Figure 2: the merchant as controller, most systems as processors, carriers, payment providers and marketplaces deciding for themselves. | `example`: The role table. → A platform that builds the processor role into its app rules. |\n| p19 | cause_effect | The consequence: the system-of-record map needs a column for each system's legal role and the integration inventory is also the inventory of data flows, so the thirteen integrations with no named owner in January 2027 were thirteen data flows nobody was accountable for, five of them still unowned in April 2027. | statistic: 13 of 34 integrations with no named owner in January 2027; 5 still unowned in April 2027. | `cause_effect`: Roles assigned per system. → What that means for the map and the inventory. |\n\n### Sharing and Transfers\n\n**Controlling idea** (`explanation`, id `sharing`): Data that leaves the merchant's own systems, to partners, to other countries and through vendors, needs minimization, a recorded role and mechanism per recipient, and processor duties including breach notification, which runs on a clock of hours, not the request's month.\n\n**Advances the thesis** (S1): Extends the data-flow inventory to partners, transfers, the store and the vendor's side.\n\n**Transition in:** `elaboration`: The roles assigned to the merchant's own systems. → The same roles applied to the data that leaves them: partners, other countries and software vendors.\n\n**Order of paragraphs** (`grouping`): Three kinds of recipient beyond the core systems, each with its own rule: partners, other countries, the software vendor. Transfers come right after partners because both are rows of the same inventory; the vendor comes last because it is a processor of the kind the roles section just named, and its breach duty sets the first legal clock of the chapter.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | recommendation | The roles reach beyond the merchant's own systems because much of the data leaves them: sharing with partners follows minimization, a recorded role per recipient and a contract that covers the transfer, and Kestrel & Pine's marketplace connector, which copied everything the marketplace sent, now copies only what the warehouse needs. | scenario: The marketplace connector's copy before and after Lotte's request. |  |\n| p40 | explanation | International transfers, which most commerce stacks make to the United States, need an adequacy decision, standard contractual clauses or binding corporate rules; the EU-US Data Privacy Framework is the adequacy decision for certified US companies and Decision (EU) 2021/914 sets the modern clauses. | source: Commission Implementing Decision (EU) 2023/1795 of 10 July 2023; Decision (EU) 2021/914. | `additional_support`: Data shared with partners. → Data sent to other countries. |\n| p41 | evidence | The DPF survived Philippe Latombe's challenge before the General Court on 3 September 2025, an appeal is pending as of November 2026, and law firms advise keeping SCCs as a fallback. | source: Lewis Silkin, 2025-09-03; Case C-703/25 P. | `contrast`: The DPF as the lawful route. → The challenge that could remove it. |\n| p42 | recommendation | The architectural asset is a transfer inventory keyed to the integration map, per vendor where the data goes and under which mechanism, so that a court decision on the DPF becomes a filter on a list, answered in an afternoon, rather than a discovery project. |  | `cause_effect`: A route that a court could remove. → The list that makes the response quick. |\n| p44 | explanation | The vendors on the map are recipients too: a commerce software vendor has a processor's obligations (a DPA, listed sub-processors, data in the promised regions, per-customer export and erasure, evidenced security) and must notify the merchant of a breach without undue delay, because the merchant as controller must notify its supervisory authority without undue delay and, where feasible, within 72 hours of becoming aware of it unless the breach is unlikely to put people at risk: a clock of hours from the breach, separate from the one-month clock for a person's request, which the chapter reaches later. | source: GDPR Article 33(1) and 33(2). | `additional_support`: Partners and other countries as recipients. → The software vendors themselves as recipients, with their duties and the breach clock. |\n\n### Lawful Bases: The Order Versus the Marketing\n\n**Controlling idea** (`comparison`, id `bases`): The order rests on the contract and on legal obligations, fraud screening on legitimate interests and marketing on consent or the soft opt-in, so the order's e-mail address and the marketing permission are two facts and the second must be recorded with its basis.\n\n**Advances the thesis** (S2): Separates the order from marketing in law, which is what lets the profile go while the order stays.\n\n**Transition in:** `contrast`: Who holds and receives the data. → Why each use is allowed at all: the lawful bases.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | comparison | In commerce terms the four bases divide the work: the contract covers taking, delivering and supporting the order, legal obligation covers invoices and accounting records, legitimate interests cover fraud screening and security, and consent or the soft opt-in covers newsletters, profiling and tracking. | table: Use, basis and what it means in practice, for four groups of uses. |  |\n| p21 | explanation | The ePrivacy soft opt-in lets a business market its own similar products to an existing customer's e-mail provided the customer can object free of charge at collection and in every message; national transpositions differ, but the order's e-mail and the marketing permission are two facts either way. | quotation: ePrivacy Directive Article 13(2): 'in the context of the sale of a product or a service' ... 'for direct marketing of its own similar products or services'. | `elaboration`: The consent row of the table. → The soft opt-in every merchant asks about. |\n\n### Consent, Cookies and Tracking\n\n**Controlling idea** (`explanation`, id `consent`): Consent must be given before tags read the device, be demonstrable per person and purpose, and travel from the customer master to every tag, tool, till and app, so it is state the merchant must move, not a banner.\n\n**Advances the thesis** (S2): Turns the consent basis into requirements on the tag layer, the master and every outbound tool.\n\n**Transition in:** `elaboration`: Consent as the basis for marketing. → What consent requires for cookies and tracking.\n\n**Order of paragraphs** (`large_to_small`): The problem, then the two laws, then what they mean for cookies and what the regulators say, then the tool that enforces the choice, then how the rules may change in the EU and how the US differs, then the till as the hardest place to ask, and last the design consequence that all of them lead to: consent kept on the customer master and sent everywhere. The consequence needs every rule before it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p22 | claim | A consent choice must control what the shop and its connected tools actually do; a preference recorded in a banner is not enough if tracking scripts ignore it or another system keeps marketing to someone who declined. |  |  |\n| p23 | definition | Consent lives in two laws: the GDPR defines it as a freely given, specific, informed and unambiguous indication that the controller must be able to demonstrate, and the ePrivacy Directive allows storing or reading information on a device only with consent, except what is strictly necessary. | source: GDPR Articles 4(11) and 7(1); ePrivacy Article 5(3) as amended in 2009. | `elaboration`: Consent that must control what tools do. → The two laws that define it. |\n| p24 | evidence (list) | In plain words the cart cookie and the language choice need no consent while analytics, advertising and personalization tags do before they fire, and the EDPB, the Dutch regulator and the Belgian regulator agree on the substance (no cookie walls, no scrolling or pre-ticked boxes as consent, purposes grouped). | source: EDPB Guidelines 05/2020 (May 2020) and 2/2023 (version 2.0, October 2024); Autoriteit Persoonsgegevens (n.d.); Gegevensbeschermingsautoriteit (November 2023). | `example`: The device rule. → What it means for the cart, the tags and the regulators' readings. |\n| p25 | explanation | A consent management platform stores each visitor's choices per purpose and tells each tag whether it may run, and server-side tagging changes who receives the data first, not whether consent is needed, so it is a governance improvement, never a consent bypass (the author's reading of the EDPB's technical-scope guidelines). |  | `elaboration`: Tags that may fire only after consent. → The tool that records and enforces the choice, and what server-side tagging does not change. |\n| p26 | context | The EU consent rules are still moving: the Digital Omnibus proposal of November 2025 would move the device rule into the GDPR with four no-consent purposes, a one-click refusal and machine-readable browser signals, but is a proposal, not law, as of November 2026. | source: Osborne Clarke (December 2025) on the Omnibus; California's CCPA page; the IAPP's 2025 chart. | `contrast`: The rules as they stand and the tool that enforces them. → The EU proposal that would change them. |\n| p51 | example | The United States uses an opt-out model in which consumers can refuse the sale or sharing of their data, including through the Global Privacy Control browser signal, and Sephora's 2022 settlement with California's Attorney General (US$1.2 million) shows that model enforced on the tag layer: trackers counted as a sale and the signal had to be honored. | source: California's CCPA page and the IAPP's 2025 chart (nineteen state laws).; case: California Attorney General, Sephora settlement, 24 August 2022. | `contrast`: The EU model, consent before tracking, and how it may change. → The US opt-out model and the case that enforced it. |\n| p43 | recommendation | The store is where consent is easiest to ask badly: a sign-up at the till leaves no evidence, so from mid-2027 Kestrel & Pine's POS loyalty sign-up shows the web's purposes and wording, records the time and store, and carries the master's consent once matched. | scenario: Kestrel & Pine's mid-2027 POS loyalty sign-up rule. | `example`: Rules for consent online, here and in the US. → Consent asked at the store's till, where it is easiest to ask badly. |\n| p27 | recommendation | Consent is state that must travel from the CMP to the tag layer, the newsletter tool, the CDP, the POS and every app, recorded on the customer master with its time, place, wording and source so the merchant can demonstrate it per person and purpose and withdraw it everywhere at once. | figure: Figure 3: a consent record on the customer master fanning out to the banner, tags, newsletter tool, till and apps. | `cause_effect`: The rules, their readings and the till. → The design consequence that ties consent to the customer master of the identity chapter. |\n\n### Retention: The Person Versus the Transaction\n\n**Controlling idea** (`analysis`, id `retention`): Tax law makes the merchant keep what privacy law makes it release, and splitting the person from the transaction reconciles them: the order and invoice keep a reference, the profile is an erasable record, and retention becomes a property of each record type.\n\n**Advances the thesis** (S3): Shows why an order that carries the person blocks deletion and gives the data-model change that fixes it.\n\n**Transition in:** `cause_effect`: Consent that decides which marketing may run and must travel. → How long the records of a sale must be kept, and what that means for deleting a person.\n\n**Order of paragraphs** (`problem_solution`): The retention rules first, then the conflict they create when the invoice is the customer record, then the split that resolves it, then backups as the one bounded exception. The fix cannot be read before the conflict is clear.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | evidence (list) | Tax law makes the merchant keep what privacy law makes it release; the retention rules the chapter relies on are at least seven years in the Netherlands, ten, eight or six years in Germany by record type, and ten years in Belgium, which is widely cited but not verified here and treated by Sanne de Wit, the Finance Director, as the rule pending confirmation. | source: business.gov.nl ('must keep your business records for at least 7 years'); §147 Abgabenordnung (ten, eight, six years); the Belgian ten years, unverified. |  |\n| p36 | cause_effect | Lotte's November 2026 invoice therefore stays until at least the end of 2036 under the Belgian reading, and the conflict arises only where the invoice is the customer record, as in many ERPs and platforms: deleting the person then means deleting the order, which tax law forbids, so nothing is deleted. | scenario: Lotte's invoice of November 2026, kept to the end of 2036. | `cause_effect`: Records kept for years. → The conflict with a deletion request when the invoice is the customer record. |\n| p37 | recommendation | One design move reconciles the two laws, splitting the person from the transaction: the order and invoice carry a customer reference and the delivery address for the fiscal period, the profile (e-mail, phone, preferences, consent, browsing, loyalty) is a separate erasable record, analytics carry a hash, and a nightly job purges what has expired, so retention is a property of each record type, not of the person. | figure: Figure 4: profiles erasable, transactions kept with a reference that no longer points to a person. | `problem_solution`: Nothing can be deleted while the invoice is the customer record. → The data-model split that resolves it. |\n| p38 | explanation | Backups are the one place a deletion cannot reach, so the accepted practice is a bounded, documented exception: kept for a stated period, never used to resurrect erased data, and the deletion log replayed after any restore. |  | `contrast`: Records the split can erase or keep. → Backups, which it cannot reach. |\n\n### Data Subject Requests Across Many Systems\n\n**Controlling idea** (`process`, id `dsr`): A request must be answered within one month across every system that holds the person, and three parts make that a job rather than a hunt: an identity index, a request orchestrator and a per-system action table decided in advance.\n\n**Advances the thesis** (S4): Specifies the three parts that turn the request from Ghent from a seventeen-day hunt into a repeatable flow.\n\n**Transition in:** `cause_effect`: Records kept, pseudonymized or erased by record type. → How a request reaches every system that holds the person.\n\n**Order of paragraphs** (`problem_solution`): The problem and the deadline first, then the three parts in the order a request uses them (find the person, run the request, apply the actions), then the actions outside erase, pseudonymize and retain, then the reply. The action table cannot come before the index has found the systems.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p29 | claim | When a customer asks to see, correct or delete personal data, the GDPR gives the merchant one month, extendable by two, and what makes it hard is the fan-out (one person, many systems and vendors, a different right answer in each), which three parts turn into a job. | quotation: Article 12(3): 'without undue delay and in any event within one month', extendable by two months. |  |\n| p30 | explanation | An identity index records which systems hold the person under which identifiers; it is the cross-reference the identity chapter built, and without it every request starts with a search of every system, which is where Lotte's seventeen days went. |  | `sequence`: Three parts announced. → The first: the identity index. |\n| p31 | explanation | A request orchestrator is a small workflow that verifies the requester, fans the request out, records each answer and produces the reply; Shopify's compliance webhooks are the platform-side half, and the merchant builds or buys the other half for systems outside the platform. |  | `sequence`: Where the person is held. → The second part: the workflow that runs the request. |\n| p32 | explanation | A per-system action table, decided in advance, applies the retention split: erase where the purpose has ended, pseudonymize where the record must stay but need not identify the person, retain where a legal obligation applies or a claim is possible. | table: Erase, pseudonymize and retain, each with when it applies and Kestrel & Pine examples. | `sequence`: The workflow that fans out. → The third part: what each system does. |\n| p33 | explanation | Two answers fall outside erase, pseudonymize and retain: refer, because the carrier, the marketplace and the PSP are controllers the person must ask too, and except, for backups under the bounded exception the retention section described. | figure: Figure 5: a request verified once, resolved against the identity index, fanned out with a predetermined action per system and answered with a record. | `contrast`: The three answers the merchant applies. → The two it cannot apply itself. |\n| p34 | recommendation | The reply says in plain words what was erased, what was kept and why, and whom else to ask, and the record behind it is what a regulator asks for. |  | `conclusion_summary`: All five answers. → What the reply and the record must say. |\n\n### Requirements per Flow\n\n**Controlling idea** (`comparison`, id `requirements`): The four privacy flows (consent capture, consent withdrawal, the request and the retention purge) differ in how fresh, consistent, fast and available each must be, and the consent flows must fail toward no consent.\n\n**Advances the thesis** (S2, S3, S4): Turns consent, retention and requests into requirements an integration can be built to.\n\n**Transition in:** `conclusion_summary`: The request flow, the last of the four privacy flows the chapter describes. → The requirements of all four side by side.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34b | evidence | With the request described, the chapter has covered four privacy flows (consent capture and withdrawal, the retention purge and the request), which differ in how fresh, consistent, fast and available each must be, with the consent flows failing toward no consent. | table: Requirements per flow: consent capture, consent withdrawal, data subject request and retention purge, each by freshness, consistency, speed and availability. |  |\n\n### The Choices\n\n**Controlling idea** (`comparison`, id `choices`): A merchant can run requests by a runbook, through the platform, through an orchestrator on an identity index or with a privacy management product, and should map the data before choosing any product.\n\n**Advances the thesis** (S4, S5): Sets the ways to run requests side by side on fit, strengths, limits and warning signs.\n\n**Transition in:** `sequence`: The parts of a privacy design and their requirements. → The ways to put them together.\n\n**Order of paragraphs** (`comparison`): The four options named first, then compared on the same criteria with the author's rule. The comparison needs the options named.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | comparison (list) | For the data subject request there are four realistic designs, chosen by the number of systems and requests: a runbook, platform-led handling with a runbook for outside systems, an integration flow (Kestrel & Pine's choice in autumn 2027) and a privacy management product. | example: The four designs with when each suits. |  |\n| p46 | recommendation | Map the data before choosing a product, because automation still needs to know which systems and records it must reach; the table compares the four options on fit, strengths, costs and limits, and the warning sign of each. | table: Runbook, platform-centered, orchestrator plus identity index and privacy management product by fit, strengths, costs and limits, and warning sign. | `elaboration`: The four options. → The author's rule and the comparison table. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): The duties do not change with scale; where the data is does: below the Omnichannel stage the platform does most of the work, and from it the merchant must own the map, the index and the orchestrator.\n\n**Advances the thesis** (S5): Says from which stage the merchant must own each part of the design.\n\n**Transition in:** `elaboration`: The four options for running requests. → Which fits at which scale stage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | evidence | Across the book's four scale stages, the practices a merchant needs grow with the number of systems that hold a person; the table shows what is typical, what becomes necessary and the warning signs of outgrowing each stage. | table: Four stages by what is typical, what becomes necessary and warning signs. |  |\n| p49 | analysis | The judgement: a Starting-stage merchant is as much a controller as a Group, but below the Omnichannel stage the platform's DPA, banner and app rules do most of the work, and from it the person is in a dozen systems and the merchant must own the map, the index and the orchestrator; Kestrel & Pine learned this from one request. |  | `conclusion_summary`: The stage table. → The judgement it supports. |\n\n### In Practice\n\n**Controlling idea** (`example`, id `practice`): Kestrel & Pine's autumn 2027 design applies the chapter's parts: the identity index of June and July 2027, the October orchestrator with a per-system action table, referrals and a backup exception, and a second request answered in two working days.\n\n**Advances the thesis** (S4, S5): Shows the design at work in Kestrel & Pine's estate and what it changed.\n\n**Transition in:** `example`: The stage judgement: from Omnichannel the merchant owns the map, the index and the orchestrator. → How Kestrel & Pine did so after the request from Ghent.\n\n**Order of paragraphs** (`chronological`): Kestrel & Pine's design in the order it was built (index, orchestrator, per-system actions, referrals and backups, the second request); each step uses the previous one.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | example | Kestrel & Pine built the parts after Lotte's request in two steps, first the index: the June 2027 identity rule linked every system's record to the customer master and the July matching run produced the identity index. | scenario: The June 2027 identity rule and the July 2027 matching run. |  |\n| p54 | process | In October 2027 Ruben Alves built the request orchestrator as an iPaaS flow with a human verification step: the request is logged, the requester verified, the index queried and the action table applied. | scenario: The October 2027 orchestrator. | `time`: The index of June and July. → The orchestrator of October. |\n| p55 | process | Each system has its action: the shop platform deletes the account and anonymizes the orders, the OMS pseudonymizes its order copies, the WMS and shipping service purge addresses after a twelve-month claims window (an assumption), the ERP keeps invoices and marks the reference erased, the POS deletes the loyalty entry, the returns portal the contact, and the data warehouse hashes the identifiers. | scenario: The per-system actions, with the twelve-month claims window labeled an assumption. | `elaboration`: The orchestrator applies the action table. → What the table says for each system. |\n| p56 | process | The carrier, the marketplace and the PSP are notified and the customer told to ask them directly, and backups are kept for 35 days (an assumption) with the deletion log replayed after any restore. | scenario: Referrals and the 35-day backup assumption. | `contrast`: Actions inside the merchant's systems. → Referrals and backups outside them. |\n| p57 | evidence | The second request through the flow, in November 2027, took two working days, and the privacy map (one row per system with its legal role, data, action and retention clock) is now the legal-role column on Noor's ownership map, reviewed quarterly. | statistic: Two working days for the second request, November 2027 (illustrative), against seventeen for the first. | `cause_effect`: The finished design. → What it changed and where the map now lives. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `wrong`): Privacy designs fail through a missed copy, a resurrected customer, an impostor, an over-deletion, consent without evidence and an invalidated transfer; the missed copy recurs because systems are added after the map was made, so the map lives with the integration inventory.\n\n**Advances the thesis** (S3, S4): Shows each failure with detection and recovery read against the chapter's rules.\n\n**Transition in:** `contrast`: What the design achieved. → How it fails when one of its rules is skipped.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p58 | analysis | Six failures recur, each with a detection and a recovery the chapter's rules supply, and the missed copy recurs most because its cause is a system added after the map was made, which is why the privacy map lives with the integration inventory and is reviewed when a row is added. | table: Six failures with how each shows, detection and recovery. |  |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The request from Ghent took seventeen working days for three reasons the sections give separately: every integration had copied Lotte into a system with its own role, her orders carried her as the person so they could not simply go, and nothing listed where she was or what each system should do. One map answers all three: a legal role, a request action and a retention clock per system, kept beside the integration inventory.\n\n**So what:** A merchant that keeps that map, records consent on the master and splits the person from the transaction answers a request in days with a record, instead of a hunt that only just meets the month; Kestrel & Pine's second request took two working days.\n\n**Callback:** The introduction's customer whose account is in the shop platform while copies of her data sit in other systems, and the request from Ghent (p01, p07 to p10). p59 says why the request took seventeen days and what made the second take two.\n\n**Takeaway** (`course_of_action`): Write a privacy map: per system, its legal role, the data it holds, the action a request requires there and its retention clock; keep it with the integration inventory and review it when a row is added.\n\n**Hand-off** to [Rules Turned Into Requirements: Consumer, Payment, Invoicing and Platform Regulation](commerce-regulation.html): `additional_support`: The one-month deletion clock: one legal duty with a date that a merchant discovers late without a map. → The other rules with dates, how to read each as a requirement, and Kestrel & Pine's 2027 regulatory calendar.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p59 | synthesis | The request from Ghent took seventeen working days because every integration had copied Lotte into a system with its own role, her orders carried her as the person, and nothing listed where she was or what each system should do; one map with a legal role, request action and retention clock per system answers all three, and with consent on the master, the split and an orchestrator on the identity index the second request took two working days, as a request about Eva's jacket order would. | reasoning: The scene's nine systems and seventeen days set against the design. |  |\n| p60 | synthesis (list) | Established: the merchant is the controller and most of its systems are processors; orders rest on the contract and tax law and marketing on consent or the soft opt-in; requests have one month, extendable by two, and business records must be kept for years; platforms have operationalized the fan-out. |  | `elaboration`: The answer in one paragraph. → What it rests on, starting with what is established. |\n| p61 | synthesis (list) | Depends on context: from which stage the merchant must own the map, the index and the orchestrator; the soft opt-in by country; the retention period per record type as a legal and finance decision. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p62 | recommendation (list) | The author's synthesis: privacy in a commerce estate is an integration problem, and the person should be split from the transaction before the first request. |  | `contrast`: Established and context-dependent points. → The author's own judgement, labeled as such. |\n| p63 | recommendation (list) | Eight questions let the reader check, at their own company, roles and contracts, consent and its reach, tags and the CMP, finding a person, the data model, transfers and backups. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own company. |\n| p64 | transition | A deletion request is one legal clock among many, and the next chapter lays out the others and how Kestrel & Pine turned them into a regulatory calendar for 2027 so that no deadline is discovered only months before it applies. |  | `additional_support`: The last question, on backups, and the one-month clock behind the chapter. → The other rules with dates, handed to the next chapter. |\n\n## Non-goals\n\n- Customer identity, matching, survivorship and the cross-reference itself (this chapter only reuses the index). See [One Customer, One Product: Identity and Master Data Across Systems](identity-and-master-data.html).\n- Security controls: card data, PCI DSS, account takeover, bots, skimming, admin MFA. See [Protecting the Shop: Card Data, Account Takeover, Bots and Skimmers](commerce-security.html).\n- The regulatory calendar beyond privacy: consumer law, e-invoicing, accessibility, DSA, product safety, AI Act. See [Rules Turned Into Requirements: Consumer, Payment, Invoicing and Platform Regulation](commerce-regulation.html).\n- App governance and the app inventory; the integration inventory itself. See [A om spec.md)\n\n## Changelog\n\n- **2026-11-13** — Converted spec.md to spec.json (reconstructed from the published chapter); added the previous-chapter pick-up in p01, the thesis paragraph p05, the roadmap p06 (absorbing p03) and the conclusion answer p59; breach clock stated as Article 33(1) states it. Flow rubric run 1 (sound with notes): Retention before Data Subject Requests; requirements table moved to the end of the requests section; consent section reordered with Sephora moved in; In Practice reduced to Kestrel & Pine's design; consent ladder moved to the stages; Choices lead-ins merged; When It Goes Wrong lead paragraph. Run 2 (sound with notes): store paragraph into the consent section, section renamed 'Sharing and Transfers'; p28 merged into p29; consent ladder folded into the stage lead; ePrivacy glossed; flow reasons rewritten. Run 3 (sound with notes): roadmap wording, glosses for the one-month limit and sub-processors, the regulator's record in p59. Round 1 (ESCALATE, spec faults fixed under the brief): introduction reordered and p02 merged into p01; fine ceiling after the data table; new section 'Requirements per Flow'; stage lead shortened; glosses, transitions and wording fixed in the draft. Round 2 (ESCALATE): resolved by the standing instruction: Sharing and Transfers moved after the roles section; consent section reordered to end on the design consequence, Omnibus and US split; fine ceiling stated as Article 83(5) states it; Lotte in p16; glosses and wording fixed. Round 3 (confirming, ESCALATE): closing fixes (Eva link, nine-system count and OMS note, forward pointer to the regulators, consent sentence, anonymize versus pseudonymize, Long Fuse, Figure 4 after p37); report stale.\n- **2026-11-07** — Visual layer: redrew 3 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator).\n- **2026-11-07** — Final consistency pass: dated the unowned-integration count (13 of 34 as of January 2027; 5 still unowned in April 2027,
