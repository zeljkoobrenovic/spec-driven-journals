<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/21-b2b-commerce/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (a roadmap paragraph, p05, and a conclusion paragraph that answers the opening, p47); these are listed in decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The B2B object model the platforms share (an organization with locations, people and roles, with prices, assortments and terms attached to the organization or location) and the differences from a consumer purchase: contract and tiered prices excluding VAT, quotes, payment terms, credit limits, pre-season orders and the buyer's own approval rules.\n- **Know:** The price layers (list, tier, contract, quote), the rule that the most specific wins, and why a quote freezes the price the order and the invoice use.\n- **Know:** The four ways to give business customers a channel (a B2C platform's B2B features, a dedicated B2B platform, an ERP-driven web store, the buyer's own system through EDI or punchout) and where each fits.\n- **Believe:** The ERP owns the money facts (company identity, wholesale and contract prices, payment terms, credit limits, invoices) and publishes them; the platform owns the session facts (logins, roles, the buyer's approval rules).\n- **Believe:** The share of wholesale orders keyed in by hand measures the facts the portal cannot see: it is a list of missing integrations, not of missing features.\n- **Be able to:** Write the ownership table for the company account, contacts, prices, quotes, terms and credit, approval rules, orders and invoices at their own company.\n- **Be able to:** Decide whether a credit check at order placement should ask the ERP synchronously or accept the order and hold it, and choose among the four channel options by the buyers and the facts the checkout needs.\n\n**Audience:** Newcomers who have joined a brand, wholesaler, manufacturer or commerce vendor with a business-customer channel; most of all the engineer or architect asked to 'move wholesale onto the portal', who must decide what the portal reads from the ERP. Product managers choosing between a consumer platform's B2B features and a dedicated B2B platform come next.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its 2026 incidents in outline and the names of the sixteen failure patterns.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines (money, goods, returns), 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, business models and the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Parts II and III: product, variant, SKU and GTIN with one owning system per attribute; prices selected once at order placement and frozen, dated copies compared daily; available-to-promise and per-channel buffers; checkout creating the order once; one order record with three status lines; tax from three facts, one invoice per shipment, credit notes as the only correction.\n- From the previous chapter: a marketplace connector owns nothing, each channel gets one available-to-promise figure, and every marketplace order is created in the order record under the marketplace's id.\n\n**Does not yet know:**\n\n- Company account, contact, location, roles; contract pricing, tiered pricing, customer-specific assortment; prices excluding VAT for business buyers.\n- Quote, quote validity, draft order; payment terms (net 30), credit limit, open balance, credit check; the buyer's approval workflow, budgets and cost centers.\n- Pre-season and in-season orders; punchout, cXML, OCI; B2B2C; ERP-driven web store; Peppol.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a steady share of e-mailed wholesale orders, the reader names the facts the portal cannot see and the integrations that would bring those orders in, not a new B2B platform. *Probe:* A brand's B2B portal takes 62% of its wholesale orders; the rest arrive by e-mail or phone and are keyed into the ERP, and that share has not fallen in two years. The larger accounts have pre-season discounts agreed per account, and finance holds some portal orders by hand a day after they are placed. Using only this chapter: why do these buyers keep e-mailing, and what would bring their orders into the portal? | `custom` | cold_reader | major |\n| AC-2 | Given an invoice priced from a changed price list after a quote was accepted, the reader names the rule that was broken and the design that prevents it. *Probe:* A business buyer accepts a quote at a negotiated price; before the goods ship, the seasonal price list changes, and the invoice shows the new list price. Using only this chapter: what went wrong, and how should quotes, orders and invoices be designed? | `custom` | cold_reader | major |\n| AC-3 | The reader can say whether a punchout cart is an order and where the eventual order goes. *Probe:* Using only this chapter: a corporate buyer's procurement system opens the supplier's shop, the buyer fills a cart, and the cart returns to the procurement system. Is that an order, and where should the eventual order be created? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What is different when the buyer is a company?\n\n> **Claim:** When the buyer is a company, the customer is an organization with locations, people and roles, the price is a stack of dated agreements, and payment is terms within a credit limit. A portal can replace e-mail and phone orders only if it reads those agreements at checkout from the system that owns them (the ERP for terms, credit and wholesale prices) and every wholesale order, however it arrives, is created in one order record.\n\n**Disputed by:** The view that B2B is a feature set to switch on: a platform's company accounts, price lists and net terms let business customers order like consumers, the share still ordering by e-mail or phone reflects buyers' habits or features the portal lacks, and the remedy is a richer B2B platform.\n\n**So what:** In 2026, 38% of Kestrel & Pine's 9,400 wholesale orders were keyed into the ERP by hand, a share unchanged since 2024, because the larger accounts' pre-season terms lived in the ERP's customer price lists, the portal could not check credit, and portal and keyed orders were two records. On 25 February 2027 De Kaap Buitensport e-mailed a pre-season order worth €6,384 because the portal showed €6,720 at list, and the ERP held it over its €15,000 credit limit until Lea Moreau approved it by e-mail. A merchant that accepts the claim decides who owns the company account, the price and the credit limit before it chooses or configures a B2B platform, and reads its keyed-order share as a list of missing integrations.\n\n**How and why:** Every platform can hold company accounts, price lists, terms and credit, so when nobody names an owner each system keeps its own copy and the copies drift. A wholesale invoice must match the price the buyer was shown for the same date and quantity, so the layering rule (quote over contract over tier over list) and the frozen quote are implemented once in the pricing source and published with effective dates. What a customer owes is known only to receivables, so a credit check against a nightly copy accepts orders finance later holds, and a portal that cannot check credit sends larger orders back to e-mail, where the ERP checks them at entry. Orders that enter through different doors land in different systems unless all are created in one record keyed on the buyer's purchase order number.\n\n**Supporting claims**\n\n- **S1** — A business buyer is an organization with locations, people and roles, to which prices, assortments, payment terms and a credit limit are attached, and every major platform models it that way under different names.\n- **S2** — Every platform can hold the company account, the prices and the credit, so each fact needs one named owner: the ERP owns the money facts (company identity, wholesale and contract prices, terms, credit, invoices) and publishes them as events; the platform owns the session facts (logins, roles, the buyer's approval rules).\n- **S3** — A B2B price is a stack of dated layers (list, tier, contract, quote) in which the most specific wins; the rule is implemented once in the pricing source, and a quote freezes the price the order and the invoice use.\n- **S4** — Payment terms and the credit limit are receivables facts, so the credit check at order placement asks the ERP, synchronously or by accepting and holding the order with an event-driven release, never a nightly copy; the buyer's own approval rules are the opposite control and live in the platform.\n- **S5** — The four ways to give business customers a channel (a consumer platform's B2B features, a dedicated B2B platform, an ERP-driven web store, the buyer's own system through EDI or punchout) fit different buyers and differ in which system answers at checkout; whichever is chosen, every wholesale order is created in one order record keyed on the buyer's purchase order number.\n- **S6** — The share of wholesale orders keyed in by hand counts the facts the portal cannot see, so it is a list of missing integrations, not of missing features.\n\n## Role in the part\n\nGives the part its business buyers: the agreements (prices, terms, credit) the checkout must read from the ERP that owns them, one order record for portal, keyed, EDI and punchout orders, and the keyed-order share as the measure of what the portal cannot see. Supports P5-1, P5-3, P5-5 of part `part-5`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene: the 38% and the three reasons behind it, then W2; `comparison` in choices and stages)\n\nThe 38% comes first so every term arrives as part of explaining why those orders are keyed by hand. What differs for a business buyer comes next because it names the objects (account, price, terms, credit, approvals) that every later section assigns or checks. Ownership follows because the price and credit sections then explain facts whose owner the reader already knows; the price layers precede credit because a credit check adds the new order's value, built from those layers, to the open balance before comparing it with the limit; the flow requirements follow both, because they move the facts those sections explain. The choices come once the reader knows which facts the checkout must read, because each option is defined by where those facts live; the stages say which option fits when, and the recommendation comes at their end, once the reader knows both the options and Kestrel & Pine's stage. The worked order follows the choices so that its after-Waypoint column shows the recommendation's three integrations at work, and the failures come last because each is read against the rule that prevents it. Moving ownership after pricing and credit would leave both sections without the owner they rely on; moving the choices before ownership would compare options by features, the view the thesis disputes.\n\n## Introduction\n\n**Hook** (`intriguing_example`): A consumer buys a jacket and pays before dispatch; an outdoor shop orders sixty jackets at a negotiated price, for delivery to two locations, and pays thirty days after the invoice, with buyer, approver and bookkeeper as different people.\n\n**Bridge:** The previous chapter's marketplace orders came from consumers under rules the marketplace sets; anyone who has bought for a company knows that a business purchase comes with an agreement. → Checkout must check that agreement (price, terms, credit, approvals) before it promises, so the question becomes which system owns each part of it.\n\n**Thesis statement** (KEY POINTS callout and paragraph p03): Every platform can hold company accounts, prices, terms and credit, so the copies drift unless each has an owner; a portal can replace e-mail and phone orders only if it reads those agreements at checkout from the system that owns them (the ERP for wholesale prices, terms and credit) and every wholesale order, however it arrives, is created in one order record.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p05):\n\n- Start from the 38% of Kestrel & Pine's wholesale orders still keyed in by hand. *Kept in:* scene.\n- Set out what differs when the buyer is a company and the records every B2B platform shares. *Kept in:* different.\n- Say who should own each of those facts and what the checkout needs from them. *Kept in:* ownership.\n- Explain how a price is layered and frozen by a quote, how terms, credit and the buyer's approvals work, and what each flow to the checkout must achieve. *Kept in:* pricing, credit, flows.\n- Compare four ways to give business customers a channel and how the answer changes with scale. *Kept in:* choices, stages.\n- Work one shop's pre-season order through the portal before and after Waypoint, and end with what goes wrong. *Kept in:* in-practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A business purchase differs from a consumer's: after the previous chapter's consumer orders through marketplaces, an outdoor shop orders sixty jackets at a negotiated price, to two locations, on thirty-day terms, with different people buying, approving and paying, and B2B commerce must represent that agreement or checkout accepts orders the seller cannot fulfil on the promised terms. | example: A consumer's jacket paid before dispatch against a shop's sixty jackets at a negotiated price, two delivery locations, payment thirty days after the invoice. |  |\n| p02 | definition | The agreement includes an account price, quantity breaks, payment terms, a credit limit, approvals and pre-season delivery in agreed size combinations, and checkout must check those conditions before it commits. |  | `elaboration`: The agreement a business order carries. → Its parts: price, quantity breaks, terms, credit limit, approvals, pre-season orders. |\n| p03 | claim | Those checks depend on who owns the company account, contacts, prices, terms, credit and orders; because every platform can hold all of them, unowned copies drift, and a portal can replace e-mail and phone only if it reads the agreements at checkout from their owner (the ERP for wholesale prices, terms and credit) and every wholesale order is created in one order record. |  | `cause_effect`: The conditions checkout must check. → The ownership question they depend on and the chapter's claim. |\n| p04 | context | Kestrel & Pine sells to consumers such as Eva and to wholesale customers; the chapter follows independent shops ordering through its portal or by e-mail, and leaves Bergzicht Outdoor's EDI orders to the next chapter and the wholesale journey. |  | `place`: The chapter's claim about business buyers. → Where Kestrel & Pine's wholesale orders stand in the order's journey and which of them this chapter follows. |\n| p05 | transition | The chapter starts from the 38% of Kestrel & Pine's wholesale orders keyed in by hand, then sets out what differs for a business buyer and the records every platform shares, who owns each fact, price layers and quotes, terms, credit and approvals, what each flow to the checkout needs, four channel options and how they change with scale, one shop's pre-season order before and after Waypoint, and what goes wrong; its evidence is Kestrel & Pine's wholesale figures and the platforms' own B2B documentation. |  | `sequence`: The shops this chapter follows. → The order of the chapter and its evidence. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: The 38%\n\n**Controlling idea** (`example`, id `scene`): Kestrel & Pine's portal takes 62% of 9,400 wholesale orders and the other 38% are keyed into the ERP, because the portal cannot see pre-season terms, cannot check credit and keeps a different order record from the ERP; W2 answers the last point.\n\n**Advances the thesis** (S2, S6): Gives the case the chapter answers: a keyed-order share that has not fallen because the facts the portal needs live in the ERP and the orders live in two records.\n\n**Transition in:** `example`: The chapter's order and its starting point, the 38%. → Kestrel & Pine's wholesale channel in figures.\n\n**Order of paragraphs** (`problem_solution`): The channel's size, then the two doors orders come through, then why the second door stays busy, then the chapter's problem stated and Waypoint's answer; the reasons only make sense once the reader knows what the portal and the ERP each hold.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | evidence | Lea Moreau, Head of Wholesale, manages 1,100 active accounts in three countries that produced €12.0 million in 2026 through 9,400 orders averaging €1,277 on 30-day terms; Bergzicht is the one retail chain on EDI. | statistic: 1,100 accounts (NL 640, BE 210, DE 250); €12.0M; 9,400 orders; €1,277 average; 30-day terms. |  |\n| p07 | evidence | Since 2023 shops have ordered through the platform's B2B portal, with company accounts, price lists and payment terms in the same platform account as the consumer storefronts, and it takes 62% of wholesale orders. | statistic: Portal since 2023; 62% of wholesale orders. | `elaboration`: The wholesale channel's size. → The first door: the portal. |\n| p08 | evidence | The other 38% arrive by e-mail or phone and are keyed into the ERP, where Sanne de Wit's finance team manages terms, credit limits and invoices, facts the portal needs to take more of the work. | statistic: 38% keyed into the ERP. | `contrast`: The portal's 62%. → The 38% keyed into the ERP. |\n| p09 | cause_effect (list) | Asked by Noor Visser in February 2027 why the 38% has not fallen since 2024, Lea's answer is that the portal cannot express what those shops agreed: the larger accounts' pre-season terms live in the ERP and in e-mail, the portal cannot check credit, and a portal order and a keyed order are two records. | case: Three illustrative reasons: one price list per country against per-account pre-season terms; no credit check, so finance holds portal orders a day later and larger orders are keyed because the ERP checks at entry; two order records for one shop. | `cause_effect`: The 38% and the ERP that holds terms and credit. → Why the share has not fallen. |\n| p10 | claim | The portal is good at what the platform owns and weak at what the ERP owns, and neither holds the order record for the whole channel; W2 creates every wholesale order in the OMS from Q4 2027 while the ERP keeps finance. | figure: Figure 1: portal orders in the platform and keyed orders in the ERP today; every wholesale order created once in the OMS under W2. | `conclusion_summary`: The three reasons. → The chapter's problem in one company and Waypoint's answer for the order record. |\n\n### What Is Different When the Buyer Is a Company\n\n**Controlling idea** (`definition`, id `different`): A business purchase adds facts a consumer purchase lacks (a company account with people and roles, negotiated and tiered prices, quotes, terms and credit, pre-season orders, the buyer's approvals), and every platform models them as an organization with places, people and permissions, with prices and terms attached to the organization or the place.\n\n**Advances the thesis** (S1): Defines the objects the rest of the chapter assigns owners to and shows that the platforms agree on their shape.\n\n**Transition in:** `elaboration`: The facts behind the 38%: terms, credit, negotiated prices. → The general differences between a business and a consumer purchase.\n\n**Order of paragraphs** (`large_to_small`): The contrasts with a consumer purchase first, then the three facts the systems fight over, then the vendors' shared vocabulary, then two vendors' own definitions; the vendor table needs the vocabulary the contrast table defines.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | The contrasts between a consumer and a business purchase, which are industry practice, define the vocabulary: company account, contract and tiered pricing excluding VAT, quote, payment terms and credit limit, order size, pre-season and in-season orders, approval workflow and the invoice as the document that matters. | table: Consumer against business: who buys, price, how the price is agreed, payment, order size, when orders are placed, who may commit, the document that matters. |  |\n| p12 | analysis | Each row is a fact that must live somewhere and be readable by the checkout at the moment of the promise, and three of them, the company account, the price and the credit limit, are the ones the ERP and the platform contest. |  | `cause_effect`: The rows of the contrast table. → Why they matter to the architecture: each needs a home, and three are contested. |\n| p13 | comparison | The documented object models of Shopify, commercetools, SAP Commerce, Adobe Commerce, BigCommerce and OroCommerce converge on the same shapes, in a table that is the author's synthesis as of November 2026. | table: Six vendors against six concepts: buying organization, who may do what, customer-specific prices and assortment, negotiation, spending control, pay later; blank cells mean not verified. | `sequence`: The vocabulary of a business purchase. → How the platforms name it. |\n| p14 | evidence | Shopify's and commercetools' own definitions show the common structure: organization, places, people and permissions, with prices and terms attached to the organization or the place, not to the person. | quotation: Shopify's Company, CompanyLocation and CompanyContact definitions; commercetools' Business Units and Associates.; figure: Figure 2: the B2B object model every platform shares. | `example`: The converging table. → Two vendors' definitions that show the shared structure. |\n\n### Who Owns What\n\n**Controlling idea** (`claim`, id `ownership`): Because both the ERP and the platform can hold the company account, the prices and the credit, each fact needs one owner: the ERP owns the money facts and publishes wholesale and contract prices as events, and the platform owns the session facts.\n\n**Advances the thesis** (S2): States the ownership rule and the requirements each flow must meet, with the credit check as the decisive one.\n\n**Transition in:** `cause_effect`: The three contested facts and the shared object model. → Which system should own each of them.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The conflict, then the connector documentation that names it and the platforms that leave it open, then the ownership table, then the pattern it shows; the pattern can only be read off a table the reader has seen. The flow requirements wait until the price and credit sections have explained the facts they move.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | claim | The company account is the first place two systems claim the customer: the shop platform needs the company, its contacts and its catalog to run the portal, the ERP needs the customer, its terms and its credit to invoice, and either can hold all of it, so neither should. |  |  |\n| p16 | evidence | Microsoft's Business Central connector documentation and Shopify's ERP-integration guidance both say to decide the system of record for each field, and most businesses keep customers, payment terms and credit limits in the ERP. | quotation: Microsoft Learn (14 October 2026): 'decide which system is the system of record for customer data. Most businesses manage customer records, payment terms, and credit limits in Business Central…'; Shopify enterprise blog (28 August 2026): 'name the system of record for each'. | `additional_support`: Two systems that can both hold the account. → Vendors' advice to pick one owner per field. |\n| p42 | analysis | The advice to pick one owner comes from connector documentation because no platform resolves ownership: consumer platforms added B2B objects and B2B-first platforms brought RFQs and budgets, and all can hold terms and credit. |  | `additional_support`: The connector vendors' advice to name one owner per field. → Why that advice comes from connectors: every platform can hold the same facts. |\n| p17 | description | The author's ownership table names a system of record, readers and a reason for each fact: company identity, contacts and roles, list and tiered prices, contract and pre-season agreements, quotes, terms and credit, the buyer's approval rules, orders and invoices. | table: Nine facts with system of record, readers and why there. | `sequence`: Platforms that can all hold the facts and leave the owner open. → The author's table that names one. |\n| p18 | analysis | The pattern is that the ERP owns the money facts and the platform the session facts, with wholesale and contract prices published by the ERP as price events with effective dates to the OMS and the platform's B2B catalogs, feeding no channel directly; SAP describes the same split for its own suite. | source: SAP Learning: master data replicated from the ERP to commerce, storefront orders sent to the ERP. | `conclusion_summary`: The rows of the ownership table. → The pattern they show and what each flow needs. |\n| p26 | explanation | VAT follows the buyer: one fact in the ownership table's first row, the VAT number, decides the tax treatment of every invoice (B2B prices shown and invoiced excluding VAT; a cross-border EU business customer with a valid VAT number commonly invoiced without Dutch VAT), so it must be master data with an owner and a validation date. |  | `elaboration`: The ownership table's first row (company identity and VAT number) and the money facts the ERP owns. → Why the VAT number in particular needs an owner. |\n\n### How a Price Becomes a Promise\n\n**Controlling idea** (`explanation`, id `pricing`): A B2B price is a stack of layers (list, tier, contract, quote) in which the most specific wins under one rule implemented in the pricing source, and a quote freezes the price the order and invoice use.\n\n**Advances the thesis** (S3): Explains the layering rule and the frozen quote that keep the portal price and the invoice price equal.\n\n**Transition in:** `elaboration`: Wholesale and contract prices sourced once by the ERP and published as events (ownership section). → How that price is built from layers.\n\n**Order of paragraphs** (`large_to_small`): The layers, then which wins, then the top layer, the quote, in general and on three platforms, then the decision common to all of them; the quote can only be read as 'the most specific layer' after the stack is shown.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | description (list) | B2B pricing has four layers, list wholesale price, tiered or volume price, contract or customer-group price and quote, and each must say whether it beats or adds to the one below. | example: Kestrel & Pine's list wholesale prices: Ridgewalker €95, Trailhead fleece €57, merino socks €8.50; Shopify's price breaks; Adobe's shared catalogs; OroCommerce's scheduled adjustments. |  |\n| p21 | claim | The rule that matters is which layer wins, usually the most specific without stacking, written down and implemented once in the pricing source so the portal, the OMS and the invoice compute the same price. | figure: Figure 3: four stacked layers with the quote on top setting the price used by portal, order and invoice. | `emphasis`: The four layers. → The rule that decides between them. |\n| p22 | claim | A quote freezes the price: it records a negotiated offer and how long the buyer may accept it, and the accepted price must survive later price-list changes. |  | `elaboration`: The quote as the top layer. → What a quote does to the price. |\n| p23 | evidence | commercetools models negotiation as three objects and calls quotes legally binding, and Adobe's purchase-order flow keeps the original price if the item's price changes. | quotation: commercetools: 'Quotes are legally binding custom offers presented to a Buyer'; Adobe: 'If the price of an item changes after the PO is created, the original price is used'. | `example`: The frozen quote. → Two vendors that implement it. |\n| p24 | evidence | On Shopify no native request-a-quote page was found in November 2026; the documented mechanism is the draft order that quote apps fill. | source: Shopify developer documentation: draft orders created 'for contacts to review and approve'. | `contrast`: Vendors with a quote object. → A vendor without one. |\n| p25 | synthesis | Under every name the decision is the same: a price stated to a named buyer with a validity date is stored as an object the order is created from, not recomputed later from the price list. |  | `conclusion_summary`: Three vendors' ways of handling quotes. → The one design decision they share. |\n\n### Credit, Terms and the Buyer's Own Controls\n\n**Controlling idea** (`explanation`, id `credit`): Payment terms and the credit limit are the seller's receivables facts, which the ERP owns and the checkout must check against today's balance at order placement, while the buyer's approval workflow is the buyer's own control, held in the platform.\n\n**Advances the thesis** (S4): Defines terms, credit and approvals and says which system holds and checks each.\n\n**Transition in:** `sequence`: The price an order carries. → How and when the buyer pays for it, and who may let it through.\n\n**Order of paragraphs** (`grouping`): The seller's two controls, terms then credit, because the credit check uses the open balance the terms create, then the buyer's control as the contrast.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | definition | Payment terms say when the buyer must pay and must be stored as structured data with a trigger; the ERP owns the invoice date and tracks what is overdue, and the platform needs a copy to show the agreement and let the buyer order without a card. | source: Shopify Admin API 2026-10 payment terms types: NET, FIXED, RECEIPT, FULFILLMENT, UNKNOWN. |  |\n| p28 | definition | The credit limit is the seller's control: a credit check at order time compares the open balance plus the new order with the limit and accepts, holds or rejects; a nightly copy of the balance keeps finance holding orders by hand, asking the ERP at order time or receiving balance changes as events lets the portal answer at once, and a copy of the limit on the platform is a mirror, not a check. | source: BigCommerce B2B Edition's available credit and net terms; Microsoft's connector carrying credit limits to Shopify as metafields. | `sequence`: The terms that set when a buyer pays. → The limit on how much the buyer may owe. |\n| p29 | definition | The buyer's approval workflow is the opposite control, the buyer's own rule that an order above an amount needs a manager; commercetools, SAP Commerce and Adobe model it, and it matters for chains and corporate buyers more than for independent shops. | quotation: commercetools' tiered Approval Rules and 'a single instance of rejection will lead to the rejection of the entire Approval Flow'; SAP's cost centers, budgets and purchase limits; Adobe's administrators who 'bypass all approval rules'.; figure: Figure 4: a portal order at the Omnichannel stage, with prices from the pricing source, the credit decision from the ERP and the order in the order record. | `contrast`: The seller's credit control. → The buyer's own control. |\n\n### What the Flows Need\n\n**Controlling idea** (`analysis`, id `flows`): Once price and credit are explained, each flow from its owner to the checkout has a freshness, consistency and latency requirement; the credit check decides whether the portal can replace e-mail, and stock follows the same rule.\n\n**Advances the thesis** (S2, S3, S4): Turns the ownership rule into requirements on each flow and names the one that decides the 38%.\n\n**Transition in:** `conclusion_summary`: The owners, the price layers and the credit controls of the three previous sections. → What each flow between those owners and the checkout must achieve.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | analysis | With the price and the credit explained, the four flows between their owners and the checkout (price lookup, credit check, order creation, invoice) each have a freshness, consistency and latency requirement, and the credit check decides whether the portal can replace e-mail. | table: What the flows need: price lookup, credit check, order creation, invoice, with freshness, consistency, latency and failure. |  |\n| p55 | explanation | Stock, which the table leaves out, follows the same ownership logic: wholesale is promised from available-to-promise with a wholesale allocation, so wholesale and consumer channels do not sell the same units. |  | `additional_support`: The four flows the table lists. → One flow it leaves out: stock. |\n\n### The Choices\n\n**Controlling idea** (`comparison`, id `choices`): A merchant has four realistic ways to give business customers a channel, and the choice depends on who the buyers are and which system can answer at checkout; whichever is chosen, rep orders and B2B2C use the same order object.\n\n**Advances the thesis** (S5, S2): Compares the channel options by where prices, credit and orders live, and recommends one with the integrations that make it work.\n\n**Transition in:** `problem_solution`: The facts and flows the checkout must read. → The ways to build a channel that reads them.\n\n**Order of paragraphs** (`comparison`): The four options in order of how far they move from the consumer platform, each with what it is, evidence and where it fits; then the comparison table with the punchout rule, and the two variations (sales reps, B2B2C) that apply to any option. The recommendation waits for the stage table, so the reader knows which option fits when before hearing the choice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | claim | A merchant that sells to businesses has four realistic ways to give them a channel, chosen less by features than by who the buyers are and which system can answer at checkout. |  |  |\n| p31 | description | The first option, a consumer platform's B2B features, adds company accounts, buyer-specific catalogs and payment terms to the platform that serves consumers and reuses its catalog and checkout, if it can represent the agreements. |  | `sequence`: Four options. → The first. |\n| p32 | evidence | Shopify runs B2B on all its plans with a catalog cap below Plus, Adobe ships a B2B module and BigCommerce serves B2B APIs from a separate domain. | source: Shopify Help Center; Adobe B2B guide (1 October 2026); BigCommerce B2B Edition documentation.; fact: BigCommerce deprecated its older B2B authentication token on 30 September 2025. | `example`: The first option. → Three platforms that offer it. |\n| p33 | analysis | It is Kestrel & Pine's choice and fits a brand selling the same products to many small shops and consumers; it limits when terms, credit and negotiated prices must come from the ERP in real time and the platform cannot express them. |  | `example`: The first option on three platforms. → Kestrel & Pine's use of it and where it fits and limits. |\n| p34 | description | The second option, a dedicated B2B platform such as OroCommerce or SAP Commerce, fits a wholesaler or manufacturer whose whole business is B2B with quotes and buyer controls, at the cost of a second platform and catalog copy beside a consumer storefront. | source: OroCommerce documentation (version 7.0); SAP Commerce's budgets and cost centers. | `contrast`: Adding B2B to a consumer platform. → A platform built for B2B. |\n| p35 | description | The third option, an ERP-driven web store such as Sana Commerce, reads prices, terms, stock and orders from the ERP directly and suits a B2B-first company with one ERP and modest traffic, until ERP response times, consumer traffic or new channels make the dependency a limit. | source: sana-commerce.com, accessed November 2026. | `contrast`: A separate B2B platform with its own copies. → A store that keeps no copies and reads the ERP. |\n| p36 | definition | The fourth option is the buyer's own system: large buyers send EDI orders or punch out, opening the supplier's catalog from their procurement system and returning the cart to it as a requisition. |  | `contrast`: Options in which the buyer comes to the seller's store. → The option in which the seller comes to the buyer's system. |\n| p37 | evidence | The cXML User's Guide describes punchout as a button that opens the supplier's catalog and returns the order information to the procurement application, and SAP's OCI is the equivalent for SAP procurement. | quotation: cXML User's Guide 1.2.037 (2018): 'procurement applications display a button instead of product or pricing details … they click a button that returns the order information to the procurement application.' | `example`: Punchout described in general. → The standard that defines it. |\n| p38 | claim | A punchout cart is not an order: the supplier waits for the cXML OrderRequest or EDI ORDERS and creates it in the same order record as a portal order, and builds punchout only for buyers whose approval workflow requires it; a table then compares the four options by where each keeps prices, the credit check and the order record. | table: Four options against fits, where prices live, credit check, order record, limits and Kestrel & Pine's use. | `cause_effect`: The cart returned to the buyer's procurement system. → What that means for when an order exists and where it goes. |\n| p40 | explanation | Whichever option is chosen, two variations must fit the same model: a sales rep's order is the same order object as the shop's own with a different creator, and B2B2C names two flows, a brand feeding a retailer and a business's own end users buying under its terms. |  | `additional_support`: The four options compared. → Two variations any option must cover: orders placed by sales reps and B2B2C. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): The B2B channel outgrows the platform's features not when the account count grows but when the facts the checkout needs stop living in the platform; for Kestrel & Pine those facts can be published into the platform, so the author recommends staying with its B2B features and adding three integrations.\n\n**Advances the thesis** (S5, S6, S2, S4): Shows which channel design each stage needs, reads the keyed share as the signal, and recommends the integrations that answer it.\n\n**Transition in:** `elaboration`: The four options compared and the variations they must cover. → How the fit of each changes from stage to stage.\n\n**Order of paragraphs** (`problem_solution`): The stage table, then its judgement, then the recommendation that answers the signal it names; the recommendation needs both the options and the stage at which Kestrel & Pine stands.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | comparison | The four options do not fit equally at every stage, and a table shows for each stage what is typical, what becomes necessary and the warning signs of outgrowing the channel. | table: Four stages against what is typical, what becomes necessary and warning signs of outgrowing it. |  |\n| p41 | synthesis | The judgement from the stage table: the channel outgrows the platform's features when the facts the checkout needs stop living in the platform; Kestrel & Pine's 38% has held since 2024 because those facts live in the ERP and were never brought to the platform, which is a signal of missing integrations so long as the platform can carry them once published. |  | `conclusion_summary`: The stage table. → The judgement it supports, with Kestrel & Pine's 38% as the signal. |\n| p39 | recommendation | The author recommends that a brand like Kestrel & Pine keep the platform's B2B features and fix the three gaps behind the 38%: ERP price events for contract and pre-season lists, a credit check at placement against the ERP's open balance, and every wholesale order created in the OMS, provided the ERP exposes prices and balances by API. |  | `problem_solution`: The 38% as the signal that the facts were never brought to the platform. → The author's recommendation: bring them, on the platform Kestrel & Pine already has. |\n\n### In Practice\n\n**Controlling idea** (`example`, id `in-practice`): De Kaap Buitensport's pre-season order shows why one Kestrel & Pine order stays off the portal in February 2027 and how the recommendation's three integrations bring it on, under assumptions to test.\n\n**Advances the thesis** (S3, S4, S6): Applies the ownership rule, the frozen price and the credit check to one real-sized order before and after Waypoint.\n\n**Transition in:** `example`: The recommendation's three integrations. → One order worked through as it is and as it should be after Waypoint.\n\n**Order of paragraphs** (`chronological`): The order as it runs in February 2027, then as it should run after Waypoint (both in the table), then the assumptions the second column rests on; the order is read against the recommendation just made.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | example | De Kaap Buitensport's pre-season order of 25 February 2027 (60 Ridgewalker jackets and 120 pairs of socks, €6,720 at list, €6,384 with its 5% terms, a €15,000 credit limit) is e-mailed, held over the limit, approved by e-mail in expectation of a payment due on 2 March and keyed in today, and priced, checked and created once in the OMS after Waypoint. | table: Price, credit, approval, order record, stock and invoice in February 2027 against after Waypoint. |  |\n| p45 | analysis | The after-Waypoint column assumes the ERP answers a credit check in under a second at the portal's volume and the platform's catalogs carry per-account, effective-dated lists; both should be tested before the 38% is promised to fall. |  | `contrast`: The after-Waypoint column. → The assumptions it depends on. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`evidence`, id `wrong`): Six failures recur (portal price differing from invoice, stale credit balance, duplicate orders, wrong unit, invalid VAT number, expired quote), each detectable and cheaper to prevent in the object model than to fix at month-end.\n\n**Advances the thesis** (S2, S3, S4): Shows each failure as a fact read from the wrong place or not modelled, with its detection and recovery.\n\n**Transition in:** `contrast`: De Kaap's order as it should run. → The ways B2B orders go wrong.\n\n**Order of paragraphs** (`order_of_importance`): The table first, then which failures Kestrel & Pine has already met and why all are cheaper to prevent in the object model.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p54 | evidence | Six failures recur in B2B channels, and a table gives for each how it shows, how to detect it and how to recover. | table: Six failures with how each shows, detection and recovery. |  |\n| p46 | analysis | The first two failures in the table are the Kestrel & Pine story, the others arrive with scale, and all are cheaper to prevent in the object model than to fix at month-end. |  | `conclusion_summary`: The failure table. → Which rows are Kestrel & Pine's story and why prevention is cheaper. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The outdoor shop of the opening, De Kaap's held order and the 38% are one problem: every platform can store the agreement, and what decides whether a business buyer uses the portal is whether the checkout reads price, terms and credit from the ERP that owns them and creates the order in the one record every wholesale order shares.\n\n**So what:** The remedy for a keyed-order share is integration work on the platform already in place (prices published from the ERP, a credit check at placement, one order record), not a richer B2B platform.\n\n**Callback:** The opening's outdoor shop ordering sixty jackets at a negotiated price, on thirty-day terms, within a credit limit. Paragraph p47 says what the checkout must read for that shop's order to go through the portal, and reads the 38% as the count of orders where it did not.\n\n**Takeaway** (`course_of_action`): Write the ownership table for your own company account, prices, terms and credit, count the wholesale orders keyed by hand and name the missing fact behind each reason, and take the eight questions to your own channel.\n\n**Hand-off** to [Documents Between Companies: EDI, Punchout and E-Invoicing](edi-and-e-invoicing.html): `elaboration`: The wholesale portal as the self-service path of the business channel, and the fourth channel option this chapter only named: the buyer's own system, sending EDI orders or punching out. → The documents the largest buyers send and expect (order, despatch advice, invoice), the system each must come from, and the e-invoicing mandates that now reach business invoices.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | synthesis | The opening's shop orders through the portal only if the checkout reads its price, terms and credit from the ERP that owns them and creates the order in the one record every wholesale order shares; every platform can store the agreement, Kestrel & Pine's 38% counts the orders for which those reads did not happen, and so the remedy is integration work on the platform already in place, not a richer platform. | reasoning: The opening's sixty-jacket order and the 38% set against the chapter's answer. |  |\n| p48 | synthesis (list) | Established: every major platform's B2B model has the same shape, a quote freezes a price and the order is created from it, and payment terms and credit limits are receivables facts managed in the ERP. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what the sources establish. |\n| p49 | synthesis (list) | Depends on context: the consumer platform's B2B features fit many small resellers if prices come from one source and credit reaches the ERP; a synchronous credit check needs a fast ERP, otherwise accept and hold; punchout and EDI only for buyers who require them, with their orders in the same record. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p50 | recommendation (list) | The author's synthesis: the keyed-order share is the best single measure of a B2B architecture and a list of missing integrations, and ownership of the account, the price and the credit limit is decided before any B2B platform is chosen. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p51 | recommendation (list) | Eight questions let the reader find, at their own company, the owner of the account, where contract prices live, which price wins, how fresh the credit check is, why orders arrive outside the portal, whether quotes are objects, how invoices are priced and whether punchout and EDI orders reach the same record. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own company. |\n| p52 | transition | Portal orders are the channel's self-service path, but the largest buyers send documents from their own systems, the fourth option; the next chapter opens the EDI envelope, from the ORDERS message to the despatch advice whose labels cost Kestrel & Pine €14,200, and the e-invoicing mandates now reaching business invoices, which Kestrel & Pine's Belgian customers' bookkeeping already expects. |  | `conclusion_summary`: The questions about the reader's own channel. → What this chapter leaves to the next: the buyers who send documents. |\n\n## Non-goals\n\n- EDI messages, transports, identifiers, chargebacks and e-invoicing mandates. See [Documents Between Companies: EDI, Punchout and E-Invoicing](edi-and-e-invoicing.html).\n- The ERP's role, the hub debate and batch versus event integration with ERPs. See [The Back Office: ERP Integration and Who Is the Hub](erp-and-back-office-integration.html).\n- Price computation, price lists and the pricing engine in general; this chapter covers only the B2B layering rule and the quote. See [What Does It Cost? Price Lists, Contract Prices, Currencies and Tax](pricing-architecture.html).\n- VAT rules, invoice numbering and the ledger. See [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html).\n- Wholesale fulfillment (cartons, pallets, SSCC labels). See [Pick, Pack, Ship: Warehouse Management and Fulfillment](warehouse-and-fulfillment.html).\n- Customer identity matching across systems. See [One Customer, One Product: Identity and Master Data Across Systems](identity-and-master-data.html).\n- The end-to-end wholesale order. See [Journey 3: A Chain Reorders by EDI, From Order to Invoice](journey-wholesale-order.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: after the confirming round 3 (escalate: 14 passed, 26 failed, 16 of them minor; round 3 is past the revision budget), the cheap, plainly right fixes were made without another round: 'punchout' glossed in the failure-pattern callout ('a punchout session from its procurement system'); Business Central glossed as Microsoft's ERP product and 'one tenant' as one account on the shop platform (rule 2, rule 6); the BigCommerce token-deprecation sentence moved from p42, where both readers found it a non sequitur, to option 1's BigCommerce evidence (p32), replacing 'the trace of a partner-built origin' with plain words; 'Both can hold all of it; neither should' made explicit. 6,581 words against 6,700. Rejected: Starting a fourth round.\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: ( tion to stay on the platform; p42 no longer repeats that the platforms converge (said in p13), only that none resolves ownership. Rejected: Folding the stages section into 'The Choices': its heading is house format; moving the recommendation achieves the same order.; Moving the market-size paragraph (p43) to the scene or cutting it (asked by both runs): it would split the scene's 62%/38% sequence; kept as the lead into De Kaap's order. Logged in open_questions.; Adding a unit-of-measure rule before 'When It Goes Wrong': the contrast table's 'cartons, inner packs and size runs' row and the failure row's recovery cover it; adding a paragraph would be new material.\n- **2026-11-12** — Known inconsistencies fixed: Lea Moreau is 'Head of Wholesale' (scenario ledger, cast table), not 'Wholesale lead'; the hand-off's 'the e-invoicing mandates that now reach every business customer in Belgium' is hedged as consistency item 5 requires ('the e-invoicing mandates now reaching business invoices; the bookkeeping of Kestrel & Pine's Belgian customers already expects a Peppol invoice'); where the page means the hosted product it says 'the shop platform' (book-wide vocabulary). The page already follows consistency item 3 (the ERP owns wholesale list and contract prices, business terms and credit limits, publishes them as events and feeds no channel directly).\n- **2026-11-07** — Built the chapter around ownership (who holds the company, the price, the credit) rather than around a feature comparison, because every platform surveyed can hold all three and the reader's decision is which one should. (from spec.md)\n- **2026-11-07** — Used the 38% of hand-keyed orders as the organizing measure and invented ledger-consistent reasons for it (pre-season terms in the ERP, no credit check, two order records), so that the recommendation is a list of integrations the reader can check. (from spec.md)\n- **2026-11-07** — Added a second fictional wholesale account (De Kaap Buitensport) because Be         // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();

                if (t.endsWith('|')) t = t.slice(0, -1);

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');

            while (i < lines.length) {

                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
