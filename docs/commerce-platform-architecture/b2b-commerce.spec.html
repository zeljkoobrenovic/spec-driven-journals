<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Selling to Businesses: Accounts, Contract Prices, Quotes and Approvals\n\n> Working doc for the post in this folder. The spec drives the post; the post is the artifact.\n\n## Intent\n\nChapter 21 of *ORDERED* (Part V, CHANNELS) teaches a reader new to commerce architecture what changes when the buyer is a company: the customer becomes an organization with locations, people and roles; the price becomes a layered, negotiated promise with a validity date; payment becomes a terms-and-credit decision; and the order can arrive by portal, e-mail, EDI or punchout. The reader should leave able to name the B2B objects every platform shares, to say which system should own the company account, the prices and the credit limit, and to read a merchant's share of hand-keyed wholesale orders as a list of missing integrations rather than missing features.\n\n## Audience\n\nNewcomers who have joined a brand, wholesaler, manufacturer or commerce vendor with a business-customer channel. The role that benefits most is the engineer or architect asked to \"move wholesale onto the portal\" and who must decide what the portal reads from the ERP; product managers choosing between a B2C platform's B2B features and a dedicated B2B platform benefit next.\n\n## Success criteria\n\n- [ ] A reader new to the field can define every term the chapter uses from the chapter alone: B2B, company account, contract pricing, tiered pricing, quote, approval workflow, payment terms, credit limit, pre-season order, assortment, punchout, cXML, OCI, B2B2C, system of record, idempotent.\n- [ ] The business problem comes first (the 38% of orders keyed by hand and why) and each object or flow is tied to a money or time consequence.\n- [ ] The shared object model is shown with a sourced cross-platform table (Shopify, commercetools, SAP, Adobe, BigCommerce, OroCommerce) and a diagram; the ownership table names a system of record per fact with the reason; a requirements table covers price lookup, credit check, order creation, stock promise and invoice.\n- [ ] Price layering and \"which wins\" is explained, with the quote as a frozen price sourced to commercetools and Adobe; VAT treatment is stated as practice and handed to [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html).\n- [ ] Kestrel & Pine's thread matches the ledger: 1,100 accounts, €12.0M, 9,400 orders, €1,277 average, 62% portal and 38% keyed, the ERP owning terms and credit, W2 as the target; the reasons behind the 38% and the De Kaap Buitensport example (credit limit €15,000, 5% pre-season terms, the February 2027 order) are added to the ledger as illustrative facts.\n- [ ] EDI detail is kept to a link to [Documents Between Companies: EDI, Punchout and E-Invoicing](edi-and-e-invoicing.html); punchout is one paragraph with the rule that a punchout cart is not an order.\n- [ ] The \"Across Scale Stages: When It Fits and When It Limits\" table is specific per stage and ends with the judgement that the channel outgrows the platform when the facts the checkout needs stop living in the platform.\n- [ ] The three take-away tiers are present and honest; Questions to Ask has at least eight entries; the article stays within 4,000–6,500 words.\n\n## Non-goals\n\n- EDI messages, transports, identifiers, chargebacks and e-invoicing mandates: [Documents Between Companies: EDI, Punchout and E-Invoicing](edi-and-e-invoicing.html).\n- The ERP's role, the hub debate and batch versus event integration with ERPs: [The Back Office: ERP Integration and Who Is the Hub](erp-and-back-office-integration.html).\n- Price computation, price lists and the pricing engine in general: [What Does It Cost? Price Lists, Contract Prices, Currencies and Tax](pricing-architecture.html); this chapter covers only the B2B layering rule and the quote.\n- VAT rules, invoice numbering and the ledger: [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html).\n- Wholesale fulfillment (cartons, pallets, SSCC labels): [Pick, Pack, Ship: Warehouse Management and Fulfillment](warehouse-and-fulfillment.html).\n- Customer identity matching across systems: [One Customer, One Product: Identity and Master Data Across Systems](identity-and-master-data.html).\n- The end-to-end wholesale order: [Journey 3: A Chain Reorders by EDI, From Order to Invoice](journey-wholesale-order.html).\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\nArticle only for now.\n\n## Open questions\n\n- Whether Shopify offers a native quote object in late 2026 could not be confirmed; the chapter states that none was found and that draft orders are the documented mechanism.\n- The date of Shopify's B2B plan expansion beyond Plus is not given on the help page; the chapter says \"recent and undated\".\n- No European B2B e-commerce market figure meeting the sourcing standard was found; the chapter cites US figures with their differing definitions.\n- The intra-EU VAT treatment of business supplies is stated as common practice without a linked official source (the Commission's VIES and cross-border VAT pages returned 404 in this session); chapter 14 should carry the citation.\n\n## Decision log\n\n- **2026-11-07** — Built the chapter around ownership (who holds the company, the price, the credit) rather than around a feature comparison, because every platform surveyed can hold all three and the reader's decision is which one should.\n- **2026-11-07** — Used the 38% of hand-keyed orders as the organizing measure and invented ledger-consistent reasons for it (pre-season terms in the ERP, no credit check, two order records), so that the recommendation is a list of integrations the reader can check.\n- **2026-11-07** — Added a second fictional wholesale account (De Kaap Buitensport) because Bergzicht is the EDI example owned by chapter 22 and the portal path needed its own worked order with a credit-limit hold.\n- **2026-11-07** — Kept punchout to one paragraph and a row in the trade-off table rather than a section, since the contract says \"briefly\" and chapter 22 owns procurement integration.\n\n## Sources\n\n- **Internal**\n  - [Meet Kestrel & Pine](meet-kestrel-and-pine.html) — the wholesale line, the portal, the 38%, the ERP's role, W2.\n  - [Documents Between Companies: EDI, Punchout and E-Invoicing](edi-and-e-invoicing.html) — the document channel this chapter hands off to.\n  - [The Back Office: ERP Integration and Who Is the Hub](erp-and-back-office-integration.html) — ERP ownership and the hub debate.\n  - [What Does It Cost? Price Lists, Contract Prices, Currencies and Tax](pricing-architecture.html) — the pricing source the B2B layers sit on.\n  - [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html) — VAT and invoices.\n  - `_research/brief-b2b-edi-erp.md` — the verified platform, market and procurement facts.\n- **External**\n  - Shopify Help Center and developer documentation (B2B, catalogs, payment terms), accessed 2026-11 — the native B2B model and plan constraints.\n  - commercetools documentation (Business Units, Quotes, Approval Rules and Flows), accessed 2026-11 — the most explicit public object model for quoting and approval.\n  - Adobe Commerce B2B guide (2026-10-01) and purchase-order flow — purchase orders and the frozen-price rule.\n  - BigCommerce B2B Edition documentation, accessed 2026-11 — net terms, available credit, API deprecation.\n  - SAP Spartacus B2B documentation — budgets, cost centers and approval (with an evidence-age note).\n  - Microsoft Learn, Business Central Shopify connector (2026-10-14) — the system-of-record advice for customers, terms and credit.\n  - OroCommerce and Sana Commerce pages — dedicated B2B and ERP-driven alternatives.\n  - cXML User's Guide (2018) and TradeCentric (2026) — punchout.\n  - Forrester (2022) and Digital Commerce 360 (2024, 2026) — market size with definitions.\n\n## Changelog\n\n- **2026-11-07** — Initial spec and article. *(AI-mediated session)*\n- **2026-11-07** — Editorial review pass: WHY IT MATTERS cut to two sentences, ERP publishes wholesale and contract prices as events and feeds no channel directly (item 3), credit-check figure corrected to the discounted order, acronyms expanded, timetoread corrected. *(AI-mediated session)*\n- **2026-11-07** — Final consistency pass: dropped \"recorded in the ledger\" from illustrative labels. *(AI-mediated session)*\n- **2026-11-07** — Visual layer: redrew 2 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator). *(AI-mediated session)*\n"}]}]}</script>

                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
