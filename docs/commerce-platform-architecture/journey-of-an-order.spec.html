<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Follow the Order: What Happens Between \"Buy\" and \"Delivered\"\n\n## Intent\n\nGive a reader who has never worked in commerce a complete, concrete picture of what happens to one online order between \"buy\" and \"delivered\" and back: the thirteen steps, the systems that touch each one, the promise the merchant makes at each step and which system has to keep it, and the handoffs between systems where the promises are lost. The chapter owns three words the whole book leans on, **the order's journey**, **promise** and **handoff**, and fixes the vocabulary (SKU, cart, order, PSP, webhook, fulfillment order, WMS, shipment, return, invoice, credit note, idempotency, reconciliation, system of record) at first-contact depth. After reading it, the reader can follow any later chapter's worked example, can draw the order's path through their own company's systems, and understands why the book spends its energy on the joins rather than the boxes.\n\n## Audience\n\nReaders new to commerce architecture: engineers, product managers, analysts, consultants and leaders in their first weeks at a merchant, a vendor or an agency. The engineer or product manager who has been handed \"the order flow\" without a map benefits most, as does anyone who has to answer \"where is my order\" for a living. No commerce or architecture vocabulary is assumed; every term is explained when it first appears.\n\n## Success criteria\n\n- [x] The thirteen steps (discovery, product page, cart, checkout, payment, order creation, fulfillment, shipping, delivery, service, return, refund or exchange, accounting) appear in one table with what happens, the promise made and who must keep it.\n- [x] \"Promise\" and \"handoff\" are defined in plain words, and a commerce platform is defined as the whole set of systems that make and keep promises.\n- [x] A reader new to the field can define every term the chapter uses from the chapter alone; every acronym (SKU, PSP, ERP, WMS, iPaaS, 3PL, SaaS, VAT, IFRS) is expanded on first use.\n- [x] Eva's jacket is walked system by system with every ledger fact intact (13 April 2027 21:14, €199 + 2 × €18 = €235, iDEAL, #1072455, picked 14 April, PostNL, delivered 15 April, exchange request 19 April, received and inspected 22 April, exchange ships 22 April; refund variant €199 by iDEAL reversal and a credit note), plus a table of what each system knows at each moment.\n- [x] Three mermaid diagrams with captions: the journey as handoffs (flowchart), the goods status line (state diagram), and Eva's jacket across systems (sequence diagram).\n- [x] A requirements table (freshness, consistency, speed, availability) for the main handoffs; a \"when it goes wrong\" table per step with detection and recovery; the four ways a message fails (late, lost, duplicated, misread), each tied to a ledger incident with matching numbers.\n- [x] Dated, sourced public evidence for the asynchronous payment handoff (Stripe, commercetools), duplicate and unordered webhooks (Stripe, Mollie), the fulfillment handshake and three status families (Shopify), status enumerations (commercetools), invoice immutability (Odoo) and the three legal promises (Directive 2011/83/EU); no inferred internals of any real company.\n- [x] The three take-away tiers are present; 6–10 questions to ask; a short \"Across Scale Stages\" paragraph (optional in Part I); closes with a hand-off to [Who Sells What to Whom: Business Models and the Economics That Shape Architecture](commerce-business-models.html); article at or under 6,500 words including tables.\n\n## Non-goals\n\n- How checkout is orchestrated and protected — [From Cart to Confirmation: Checkout Orchestration](cart-and-checkout.html); authorization, capture, SCA and refunds in depth — [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html).\n- The order state machine, order edits, sourcing and routing, and when an OMS is needed — [The Order Record: Lifecycle, State and the Order Management System](order-management.html).\n- Available-to-promise, reservations and the oversell problem — [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html); the warehouse's own steps — [Pick, Pack, Ship: Warehouse Management and Fulfillment](warehouse-and-fulfillment.html); carriers and the computed delivery promise — [Getting It There: Carriers, Labels, Tracking and the Delivery Promise](shipping-and-delivery.html); the return data model and dispositions — [The Way Back: Returns, Exchanges, Refunds and Reverse Logistics](returns-and-exchanges.html); notifications and the service view — [Where Is My Order? Notifications, Service and the Customer Record](customer-service-and-notifications.html).\n- Tax, invoicing and the ledger — [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html); integration styles, idempotency and reconciliation in depth — [APIs, Events, Files and Middleware: How Commerce Systems Talk](integration-styles.html) and [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html); the system-of-record decision — [Who Owns the Truth: Boundaries, Bounded Contexts and Systems of Record](boundaries-and-systems-of-record.html).\n- The four journeys in full, hour by hour — [Part IX — JOURNEYS: One Order, End to End](part-9.html); business models and the economics of an order — [Who Sells What to Whom: Business Models and the Economics That Shape Architecture](commerce-business-models.html).\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\n## Open questions\n\n- The chapter uses the ledger's canonical mechanism for the Three-Status Order (a two-parcel order and an integration flow without a notion of partial shipment, recorded under \"Additions by chapter\" by [Where Is My Order? Notifications, Service and the Customer Record](customer-service-and-notifications.html)); if that entry changes, the \"One Order, Three Status Lines\" section must follow.\n- The exchange flow assumes the exchange order for size L is created at request time and held until the return is inspected; [The Way Back: Returns, Exchanges, Refunds and Reverse Logistics](returns-and-exchanges.html) may prefer \"create on inspection\". Both match the ledger's dates; the book should pick one.\n- The chapter's January 2027 whiteboard scene is a local detail not in the ledger; later chapters may reuse it but need not. \"The five tabs\" follows the ledger's list (platform order screen, WMS, shipping service, PSP console, returns portal).\n\n## Decision log\n\n- **2026-11-07** — Chose a thirteen-step table with a \"promise made / who must keep it\" pair per step over a prose walk, because the pair is the chapter's thesis (promises made early by one system, kept late by another) and a table lets a newcomer see it at once.\n- **2026-11-07** — Opened with a scene of four people drawing four different orders rather than with an incident, because the chapter's problem is not a failure but the absence of a shared map; the ledger incidents appear later as the four ways a message fails.\n- **2026-11-07** — Walked Eva's jacket in the body rather than leaving it to Part IX, because this is the reader's first chapter and the book's vocabulary is easier to fix on one concrete order; the Part IX journeys add the detail each system's chapter supplies.\n- **2026-11-07** — Kept the \"Across Scale Stages\" section as a short paragraph, not the full table, since the steps do not change with scale and the chapter is in Part I where the section is optional; the length cap was the deciding constraint.\n- **2026-11-07** — Cut iDEAL, PostNL and returns-rate statistics from the \"In practice\" section after the first draft exceeded the cap; the owning chapters carry them.\n\n## Sources\n\n- **Internal**\n  - [Meet Kestrel & Pine](meet-kestrel-and-pine.html) and `_research/scenario-ledger.md` — Eva's jacket, the systems landscape, the stock sync chain, the Three-Status Order, the Double Refund, the Deprecated Endpoint, the Black Friday Oversell, the May 2027 reconciliation.\n  - `PLAN.md` contract 1 — scope, owned terms, neighbours.\n  - `_research/brief-checkout-payments-tax.md` — checkout as orchestration, PSP flow, iDEAL, webhooks, idempotency, invoice rules, VAT rate.\n  - `_research/brief-inventory-fulfillment-returns.md` — order status models, fulfillment-order handshake, notifications, order status page, WISMO, consumer-law clauses.\n  - `_research/brief-commerce-business-models.md` — cart abandonment figures.\n- **External**\n  - Stripe, *Checkout fulfillment*, *Webhooks*, *Idempotent requests* — asynchronous payment handoff, duplicates, retries.\n  - Mollie, *Webhooks*, *iDEAL* — identifier-only webhook, iDEAL properties.\n  - commercetools, *Payments lifecycle*, *Orders* — order pending before payment result; separate state enumerations.\n  - Shopify, *Order status*, *Build for fulfillment services*, *Customer notifications*, *Understanding order status pages* — three status families, handshake, notifications, tracking.\n  - Odoo, *Customer invoices*, *Credit notes and refunds* — invoice numbering and immutability.\n  - Directive 2011/83/EU — delivery, withdrawal and refund clauses.\n  - business.gov.nl, *VAT rates and exemptions* — 21% Dutch standard rate.\n  - Baymard Institute, cart abandonment statistics; Gorgias, WISMO share; IFRS 15.\n\n## Changelog\n\n- **2026-11-07** — Initial spec and article. *(AI-mediated session)*\n- **2026-11-07** — Editorial review pass: added the missing definitions (3PL, theme, marketplace connector, bol), corrected Eva's delivery promise (promised Wednesday                     while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
