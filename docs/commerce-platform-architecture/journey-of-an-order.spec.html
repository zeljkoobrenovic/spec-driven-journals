<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/01-journey-of-an-order/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the published chapter, in its order. It is a contract, not a description: the places where the published chapter does not yet do what the spec asks are listed under open_questions.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The thirteen steps of an order and the system that holds the order at each one.\n- **Know:** The three status lines of an order: money, goods and returns.\n- **Believe:** An order is a chain of promises, and it breaks at the handoffs between systems, rarely inside one.\n- **Be able to:** Given a late, lost, duplicated or misread order, name the handoff at which it went wrong.\n\n**Audience:** Readers new to commerce architecture in their first weeks at a merchant, a vendor or an agency; most of all the engineer or product manager who has been handed 'the order flow' without a map, and anyone who answers 'where is my order' for a living.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side.\n- Roughly what an API, a database and a queue are.\n- Kestrel & Pine and its 2026 incidents, in outline (meet-kestrel-and-pine).\n- The names of the sixteen failure patterns (where-commerce-platforms-go-wrong).\n\n**Does not yet know:**\n\n- Promise, handoff, entity, fulfillment order, status line, idempotency, reconciliation, system of record.\n- SKU, PSP, ERP, WMS, iPaaS, 3PL, SaaS, EDI, VAT, IFRS, webhook, theme, marketplace connector.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a description of an order that support cannot explain, the reader names the handoff and the two systems on either side of it. *Probe:* An order shows 'Delivered' in the shop and 'In picking' in the warehouse. Using only this chapter: which handoff would you inspect first, and why? | `custom` | cold_reader | major |\n| AC-2 | Every term the rest of Part I relies on (handoff, promise, status line, system) is defined here before it is used. | `known_before_new` | rubric | major |\n| AC-3 | Given a refund that went out twice, the reader names which of the four message failures it is and the two capabilities that contain it. *Probe:* A customer returned a jacket and was refunded twice. Using only this chapter: what kind of failure is this, and what two things would a merchant need to be able to do to catch it and stop it happening again? | `custom` | cold_reader | major |\n| AC-4 | A reader of the introduction alone (callouts and paragraphs p01 to p04) can predict the chapter's sections. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What has to happen, in which systems, for one online order to be found, bought, paid, shipped, delivered, returned and accounted for?\n\n> **Claim:** For one order to be found, bought, paid, shipped, delivered, returned and accounted for, thirteen steps must each complete in a system that keeps its own copy of the order and learns of changes only by message; the order is therefore a chain of promises between systems, and a break in that chain is a message that arrived late, was lost, was duplicated or was misread.\n\n**Disputed by:** The view that an order is one record with one status, and that failures are bugs inside the system that holds it.\n\n**So what:** If failures live in handoffs, a merchant looks for them between systems and gives each handoff an owner, instead of replacing the system that reported the symptom.\n\n**How and why:** Each system holds its own copy of the order and learns of changes only by message; money, goods and returns move through separate states, so one status word cannot be true in every system at once.\n\n**Supporting claims**\n\n- **S1** — Each team sees only the part of an order its own system holds, and nobody owns the path between the systems.\n- **S2** — The journey has the same thirteen steps for every order, and its promises are made early by one system and kept late by another.\n- **S3** — Every handoff is a message with requirements (freshness, consistency, speed, availability) that someone has to set.\n- **S4** — Money, goods and returns move through separate status lines, so one status word cannot be true in every system at once.\n- **S5** — A single order becomes several copies in several systems, each correct about its own part.\n- **S6** — A message fails in only four ways (late, lost, duplicated, misread), and comparison and safe resending contain all four.\n\n## Role in the part\n\nSupplies the journey and the vocabulary (promise, handoff, status line) that every later chapter places itself on. Supports P1-1 of part `part-1`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `chronological` in evas-jacket and in-practice: both follow the order of the journey's steps; `grouping` in joins: four failure modes in the same shape)\n\nThe scene poses the problem (no shared map) and names the systems, so that no later section uses one the reader has not met; the steps, the two words, the entities and the status lines are the vocabulary the walk needs, in that order: the steps table shows promises made and kept, so the two words are defined directly after it; the entities come next because a handoff is a message about them; and the status lines come last because they need the difference between an order and a shipment. The walk supplies the arrows the failure analysis points at; the failure analysis opens with the four ways a message fails, one incident each, and then states the requirements each handoff must meet, which the incidents have just shown being missed; the two failure sections sit together, the four modes first and the per-step table second, because the table applies the modes and their two remedies and would repeat them if it stood apart; public evidence, gathered in one section and not spread through the earlier ones, comes after the reader has seen the handoffs and how they fail, because before that its warnings about repeated and out-of-order messages would answer a question the reader has not yet asked; the scale stages come last because they add no new idea, only more of the same handoffs, and before the failure sections the reader could not say what multiplies. Putting the walk first would stop every sentence for a definition; putting the failure analysis first would name incidents on arrows the reader has not yet seen. One incident, the Three-Status Order, is told before the walk on purpose: it is the evidence that one status word fails, it needs only the systems named in the scene and the difference between an order and a shipment, and the failure analysis later refers back to it in a line instead of retelling it.\n\n## Introduction\n\n**Hook** (`intriguing_example`): After a shopper pays, the warehouse sees a pick list, finance an invoice and support a service ticket. When those records disagree, the shopper waits while every team believes its part is complete.\n\n**Bridge:** Anyone who has waited for a parcel, or been asked where one is, knows an order from the outside as one thing with one status. → Inside the merchant it is thirteen steps across several systems, joined by handoffs that each have to carry a promise another system can keep.\n\n**Thesis statement** (KEY POINTS callout, first and second bullets, and paragraph p02): An order is thirteen steps, each completed in a system that keeps its own copy and learns of changes only by message: a chain of promises between systems, in which a break is a message that arrived late, was lost, was duplicated or was misread.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p03):\n\n- Start from four colleagues' four drawings of one order. *Kept in:* scene.\n- Name what an order needs: its steps, the words promise and handoff, the things it is made of, and its three status lines. *Kept in:* thirteen-steps, promises-handoffs, order-entities, status-lines.\n- Follow one order through the systems that hold those records. *Kept in:* evas-jacket.\n- Show the four ways the messages between systems fail, the failure to expect at each step, and the checks that let a merchant explain what happened. *Kept in:* joins, when-it-goes-wrong.\n- Confirm the account against what vendors and the law document, and show what changes as a merchant grows. *Kept in:* in-practice, scale-stages.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | After a shopper pays, the warehouse, finance and support each work from a different record of the same order, and when the records disagree the shopper waits while every team believes its part is done. | scenario: A pick list, an invoice and a service ticket for one order. |  |\n| p02 | claim | An order passes through thirteen steps and several systems, and each handoff between them must carry a promise another system can keep. |  | `elaboration`: The teams and their separate records. → The steps and handoffs that connect them, and the promise each handoff carries. |\n| p03 | transition | The chapter starts from four drawings of one order, names what an order needs (its steps, the words promise and handoff, its entities, its three status lines), follows one order through the systems that hold it, shows how the messages between them fail and the checks that explain what happened, sets that against what vendors and the law document, and ends with what changes as a merchant grows. |  | `sequence`: The handoffs and their promises. → The order in which the chapter takes them. |\n| p04 | context | The order followed throughout is Eva Janssen's jacket and socks from Kestrel & Pine, from search to delivery and return. |  | `example`: The chapter's subject. → The one order used to show it. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: Four Drawings of One Order\n\n**Controlling idea** (`example`, id `scene`): Four colleagues drew four correct pictures of one order, each centred on their own system, and nobody drew the path between the boxes because nobody owned it.\n\n**Advances the thesis** (S1): Shows the chapter's problem before any vocabulary: the absence of a shared map, not a failure of any one system.\n\n**Transition in:** `example`: The introduction's teams with their separate records. → One company where four people were asked to draw the whole order.\n\n**Order of paragraphs** (`chronological`): The request, the four drawings, what they share, the systems the drawings contain, then the response: the reader reaches the gap between the boxes the way Noor did and knows the boxes by name before any later section uses them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | In January 2027 the new head of engineering asked four colleagues to draw what happens to an online order. |  |  |\n| p06 | example | The storefront owner put the commerce platform at the centre and the head of operations put the warehouse system there. | scenario: Milan Petrov's drawing centred on the platform; Daniel Okafor's on Duiven's warehouse system. | `example`: The request to draw the order. → The first two drawings. |\n| p07 | example | The finance director centred the ERP, the system that keeps the books and the stock ledger; the integration engineer drew thirty-four boxes and ran out of time; and each had drawn the part they could see. | scenario: Sanne de Wit's drawing centred on the ERP; Ruben Alves's thirty-four boxes. | `additional_support`: Two drawings with two centres. → Two more, and what all four have in common. |\n| p08 | claim | None of the four drawings was wrong; what nobody had drawn, because nobody owned it, was the order's path between the boxes. | figure: Figure of the four drawings. | `conclusion_summary`: Four drawings with four centres. → What is missing from all of them. |\n| p24a | context | The boxes in the four drawings come down to seven systems on the order's path, a system being any software or outside company's service that takes part in handling an order; the company runs more, and a few appear in the failure stories. Six keep their own record of the order or of their part of it (the shop platform, the payment provider, the warehouse system, the ERP, the carrier and the returns portal), and the seventh, the integration platform, carries the messages between them and keeps none. | scenario: Kestrel & Pine's systems, each with a one-clause gloss of what it does: platform (takes the order), payment provider (collects the money), warehouse management system (picks and ships), ERP (books and stock ledger), carrier (delivers and reports tracking), returns portal (accepts return requests), integration platform (iPaaS, carries messages). | `elaboration`: The boxes of the four drawings and the undrawn path between them. → What the boxes are: the seven systems, named once for the whole chapter. |\n| p09 | transition | The response was to follow one order through every system, and before doing that the reader needs the thirteen steps, the two words for how an order moves, the things it is made of, and the reason it has three status lines and not one. |  | `problem_solution`: The seven systems and the undrawn path between them. → The method that draws the path, and the vocabulary it needs first. |\n\n### The Journey in Thirteen Steps\n\n**Controlling idea** (`description`, id `thirteen-steps`): Every consumer order passes through roughly the same thirteen steps, in which promises are made early by one system and kept late by another.\n\n**Advances the thesis** (S2): Gives the journey its fixed shape and puts the made-early, kept-late pattern in front of the reader as a table.\n\n**Transition in:** `sequence`: The need for the steps before the walk. → The steps themselves.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | description | The steps are the same on every platform, and each one carries a promise, a statement to the customer that some system later has to make true. | table: Thirteen steps: what happens, the promise made, who usually has to keep it. |  |\n| p11 | analysis | Three things in the table matter before any technology: promises are made in minutes and kept over days, the system that makes a promise is rarely the one that keeps it, and the return and accounting steps are routine, not exceptions. | statistic: 24% of items Kestrel & Pine sold online in 2026 came back, and every order became an invoice. | `emphasis`: The table of steps. → The three patterns in it that the rest of the chapter depends on. |\n\n### Promises and Handoffs\n\n**Controlling idea** (`definition`, id `promises-handoffs`): A promise is a statement to the customer that some system must later make true, and a handoff is the accepted message by which responsibility for the order passes from one system to the next.\n\n**Advances the thesis** (S2, S3): Defines the two words the thesis is stated in; the requirements a handoff carries follow once the walk has shown the handoffs.\n\n**Transition in:** `elaboration`: The table's two columns: the promise made at each step and who has to keep it. → The two words those columns rest on, promise and handoff, defined.\n\n**Order of paragraphs** (`prerequisite_order`): Promise first, because a handoff is defined as what carries a promise to the system that must keep it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | transition | The table and the introduction have already used two words for the pairing, promise and handoff, and this section defines them because they carry the book's argument. |  |  |\n| p15 | definition | Because a promise is made in one system and kept in others, a commerce platform in this book's sense is the whole set of systems that make and keep promises; the shop platform, the product that takes the order, is one of them. | example: 'In stock', '€199', 'ordered before 22:00, delivered tomorrow', 'free returns within 14 days'. | `sequence`: The announcement of two words. → The first word, promise, already defined with the steps table: here its examples and what it implies for the word platform, without defining it a second time. |\n| p16 | definition | A handoff is the moment responsibility passes from one system to another; it is always carried by a message, and it is complete only when the receiver has accepted that message. | example: 'Charge €235', 'paid', 'pick these three lines'; API call, file, webhook, queue entry, EDI document; figure of the journey as handoffs. | `sequence`: Promises and who keeps them. → The second word: how the order reaches the system that must keep the promise. |\n\n### The Things an Order Is Made Of\n\n**Controlling idea** (`definition`, id `order-entities`): Commerce systems keep records of a small set of entities, and a cart, an order and a shipment are three different ones.\n\n**Advances the thesis** (S2, S5): Names the records the systems hold, so that the walk can say which system holds which.\n\n**Transition in:** `sequence`: Handoffs as messages that pass responsibility for the order. → What those messages are about: the things an order is made of.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | definition | The entities of commerce are the nouns every platform keeps records of, under its own names. | table: The entities of an order and what each one is. |  |\n| p13 | explanation | A cart is a draft and not an order, and an order is not a shipment: the fulfillment order is the warehouse's unit of work in between. | statistic: 70.22% average cart abandonment across fifty studies published 2006 to 2025. | `contrast`: The list of entities. → The two pairs newcomers merge. |\n\n### One Order, Three Status Lines\n\n**Controlling idea** (`explanation`, id `status-lines`): An order's money, goods and returns move through separate states, so reducing them to one status word makes systems disagree.\n\n**Advances the thesis** (S4): Removes the newcomer's assumption that an order has one status, which the walk and the failure analysis both depend on.\n\n**Transition in:** `additional_support`: The entities, and the difference between an order and a shipment. → The reason one status word cannot describe an order made of several things that move separately.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The claim, its plain-words reading with the goods line drawn, then the incident: the reader meets the incident already knowing what the lines are. The vendors' versions of the same lines are gathered with the other public evidence in 'In Practice'.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | claim | One status per order does not work, because the money, the goods and the return move independently; each moves through its own sequence of states, a status line, and an order has three. |  |  |\n| p21 | explanation | Combinations such as paid and not shipped, or returned and not yet refunded, are normal states, not errors. | figure: The goods status line for a simple order. | `elaboration`: The claim that an order has three status lines. → What that means in plain words, and the goods line on its own. |\n| p22 | example | Kestrel & Pine's Three-Status Order shows the cost: an integration that could not represent a partial shipment marked the whole order fulfilled when the first parcel left. | scenario: Order #1052877: fleece shipped 7 December 2026, socks waited a week; platform showed Delivered after the carrier's scan. | `example`: Separate status lines as the norm. → One order where they were flattened into one. |\n| p23 | analysis | Each system's status described part of the order, and nobody could give the customer the useful answer, that the order ships in two parcels. | scenario: WMS In picking until the socks shipped; ERP waiting for 'order complete'; eleven support tickets. | `cause_effect`: The platform's Delivered. → What the other systems showed and what the customer was left without. |\n\n### Eva's Jacket, System by System\n\n**Controlling idea** (`example`, id `evas-jacket`): Followed step by step, one order ends up as several copies in several systems, each correct about its own part.\n\n**Advances the thesis** (S5, S2): Performs the walk the scene called for, so every later claim about handoffs can point at a named arrow.\n\n**Transition in:** `example`: The steps, promises, handoffs, entities and status lines. → One order followed through all of them.\n\n**Order of paragraphs** (`chronological`): The order as placed, then the thirteen steps in the sequence they happened, one or two numbered steps per paragraph, so the reader can match each paragraph to rows of the thirteen-step table; the per-system table and its question come only after the last step. Accounting (step 13) starts at dispatch and is told last, with the date said.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | transition | The walk uses one fictional order whose numbers are fixed for the whole book. |  |  |\n| p25 | context | On Tuesday 13 April 2027 at 21:14, Eva orders a €199 jacket and two €18 pairs of socks, pays €235 by iDEAL, and is promised delivery the next day. | scenario: Order #1072455; free shipping over €75; 22:00 cut-off; figure of the order across systems. | `sequence`: The announcement of the walk. → The order itself and the promise it carries. |\n| p26 | example | Steps 1 and 2: the product page's price, stock and delivery promise each came from a different source, the stock figure up to an hour and a quarter old. | scenario: Price from the platform's price list; stock from the platform's inventory field fed by the ERP and the WMS; delivery promise from a static rule in the theme. | `sequence`: The order as placed. → Where the promises on the product page came from. |\n| p27 | example | Steps 3 and 4: at checkout the platform calls pricing, promotions, tax, availability, shipping rates and the payment provider within seconds and turns the answers into one total. | scenario: The jacket and two pairs of socks, free shipping, €235 including 21% Dutch VAT, several payment methods offered. | `sequence`: The product page's promises. → The checkout that fixes them. |\n| p28 | example | Step 5: the payment provider collects the money and tells the platform by a webhook, a message it pushes when the payment changes state. | source: iDEAL as an instant charge, captured automatically, with no chargeback and a 15-minute session timeout. | `sequence`: The total fixed at checkout. → How the money is taken and how the platform learns of it. |\n| p29 | example | Step 6: the platform creates the order with payment pending a moment before the result arrives, commits stock from its own figure, and publishes an order event; the order now exists in one system. | scenario: Order created pending, then marked paid; confirmation e-mail; event to the iPaaS. | `sequence`: The payment message. → The order record it marks as paid. |\n| p30 | example | Step 7: the integration platform creates a fulfillment order in the warehouse system, which picks, packs and reports the shipment back to the platform and the ERP. | scenario: Picked in a morning wave on Wednesday 14 April, one box, tracking number returned through the iPaaS. | `sequence`: The order in one system. → Its first copy in a second. |\n| p31 | example | Steps 8 and 9: the carrier delivers on Thursday, a day later than promised, because the storefront's delivery promise is static: a fixed cut-off rule that dates from a previous warehouse and does not ask the current one. | scenario: PostNL collected Wednesday evening, delivered Thursday 15 April; the 'before 22:00' rule dates from the third-party warehouse in Tiel. | `sequence`: The parcel leaving the warehouse. → Its delivery, and the promise it broke. |\n| p32 | example | Step 10: a service agent asked about the order would have worked from five separate screens. | scenario: 'The five tabs': platform order screen, WMS, shipping tracking page, PSP console, returns portal; ERP visible only to finance. | `sequence`: The delivery. → What service could have seen during it. |\n| p33 | example | Step 11: the returns portal, a separate product, accepts an exchange request and in doing so makes two promises on the merchant's behalf. | scenario: Exchange for size L requested Monday 19 April; PostNL return label issued; platform told to expect a return and an exchange for size L.; source: A consumer may withdraw within 14 days of receiving the goods. | `sequence`: Service after delivery. → The return, which starts in yet another system. |\n| p34 | example | Step 12: the warehouse receives and grades the return, the platform closes it, and the exchange order for size L ships the same day. | scenario: Received at Duiven 22 April, graded resellable; refund variant: €199 by iDEAL reversal and a credit note. | `sequence`: The exchange request. → The goods coming back and the replacement going out. |\n| p35 | example | Step 13: the ERP invoices the order on dispatch, matches the payout (the provider's transfer of the collected money to the merchant), and records the exchange as a credit note and a new invoice. | scenario: €235 gross: €194.21 net and €40.79 VAT at 21%; credit note for size M and new invoice for size L, netting to zero.; source: Revenue is recognized when the goods are delivered, not when the customer pays. | `sequence`: The exchange shipped. → What finance records for all of it. |\n| p36 | analysis | Set side by side, what each system that held the order knew at each moment (the carrier, which knew only the parcel, left out) explains why the four colleagues drew four pictures. | table: What each system knew at each moment of the order. | `conclusion_summary`: The thirteen steps of the walk. → The same walk read per system. |\n| p37 | claim | Each system holds its own copy of the order, or of its part, each correct about that part, and the open question is which copy to believe when two disagree. |  | `cause_effect`: The table of what each system knew. → The question it leaves, which another chapter answers. |\n\n### Why the Joins Are Where Things Break\n\n**Controlling idea** (`analysis`, id `joins`): A message between systems can fail in only four ways (late, lost, duplicated, misread), all four have happened at Kestrel & Pine, and each failure missed a requirement the business had set for that handoff.\n\n**Advances the thesis** (S3, S6): Turns the walk's arrows into the chapter's main claim about where failures live.\n\n**Transition in:** `cause_effect`: Copies of the order in several systems, joined by messages. → The ways those messages fail.\n\n**Order of paragraphs** (`grouping`): The four failure modes first, in the same shape, one incident each, because they are the simple part and their incidents are then known when the requirements table names them; then the requirements each handoff must meet, which the incidents showed being missed; then the remedies that cover all four.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38 | claim | Every arrow in the walk is a message, as is every arrow like it elsewhere in the company, and a message can go wrong in only four ways, all of which have happened at Kestrel & Pine. |  |  |\n| p39 | example | Late: the stock figure that was up to an hour and a quarter old on Eva's product page took one more hop to reach the marketplaces, the other channels that sell the same stock, and that let them sell a sold-out jacket for up to two hours. | scenario: Black Friday 2026: sold out at 19:40; 1,340 units oversold, 1,120 orders cancelled or delayed, about €96,000; order queue to the WMS backed up four hours. | `sequence`: The count of four. → The first. |\n| p40 | example | Lost: when the marketplace connector retired a version of its interface that a script still used, a stock update stopped being sent, and a message that is not sent produces no error. | scenario: February 2027: the marketplace connector kept sending bol its last figures for two days. | `sequence`: The late message. → The second way. |\n| p41 | example | Duplicated: at the return step that Eva's exchange passed through, two senders refunded the same returns, with no shared record of what had already been done. | scenario: January 2027: 212 returns refunded twice, €19,400, most recovered. | `sequence`: The lost message. → The third way. |\n| p42 | example | Misread: the Three-Status Order, recalled in a line and not retold, was three systems reading the same two-parcel order differently. | scenario: 'Shipped' meant 'all shipped' to one system and 'first parcel shipped' to another; figure of the four failures. | `sequence`: The duplicated message. → The fourth way. |\n| p17 | claim | Each of those failures missed a requirement the business sets for a handoff, usually without writing it down: how fresh, how consistent, how fast, and what happens when the receiver is down. | table: Freshness, consistency, speed and availability targets for the main handoffs of a consumer order; targets illustrative. | `cause_effect`: The four failures, each at one handoff of the walk. → The requirements each handoff must meet, which those failures missed. |\n| p43 | definition | The field's answer is two ideas: idempotency, so a repeated message has no second effect whoever sends it, and reconciliation, so two systems' copies are compared and the late, the lost and the misread show up as differences. | scenario: The first weekly stock reconciliation, May 2027: 2.3% of active variants differed between the WMS and the shop platform. | `problem_solution`: The four ways a message fails and the requirements they miss. → The two ideas that contain them. |\n\n### When It Goes Wrong at Each Step\n\n**Controlling idea** (`analysis`, id `when-it-goes-wrong`): Every stretch of the journey has an ordinary failure, and most are detected by comparing two systems' copies and recovered by sending a message again safely; the rest are caught by a check at the point of work.\n\n**Advances the thesis** (S6): Extends the four failure modes along the whole journey, with the detection and the recovery for each, and says how far the two remedies reach.\n\n**Transition in:** `elaboration`: The four ways a message fails, and idempotency and reconciliation as the two remedies. → The failure to expect at each of the thirteen steps, with how it is detected and recovered.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | analysis | Each stretch of the journey has an ordinary failure, and none needs a disaster: each happens in a normal week. | table: Per step: what goes wrong, how it is detected, how it is recovered. |  |\n| p54 | synthesis | Most detections in the table are reconciliations and most recoveries are safe resends; the rest are checks at the point of work, such as scanning at the packing bench, so a merchant that can compare and safely resend is most of the way to a reliable journey. |  | `conclusion_summary`: The per-step detections and recoveries. → How many of them are the two remedies just defined, and what the others are; without defining the remedies again. |\n\n### In Practice: What the Public Record Says\n\n**Controlling idea** (`evidence`, id `in-practice`): Vendor documentation and regulation describe the journey's handoffs precisely: each is a message that can be delayed or repeated, responsibility passes only when the receiver accepts it, and the order's three status lines are kept apart; the chapter's vendor evidence is gathered here.\n\n**Advances the thesis** (S6, S3, S4): Shows that the chapter's account is what payment providers, platforms and the law themselves document, not the author's construction.\n\n**Transition in:** `additional_support`: The failures and their two remedies, shown at one fictional company. → What real vendors and the law say about the same handoffs.\n\n**Order of paragraphs** (`chronological`): The evidence follows the journey's own order: payment, warehouse, the order record's status families (whose 'fulfilled' is not 'delivered'), the carrier's tracking, the law's deadlines, the books.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | transition | Vendor documentation and regulation describe the journey's steps with precision, and this section gathers that public record in the journey's order. |  |  |\n| p45 | evidence | The vendors confirm what the walk showed, that the payment result reaches the shop as a separate message, and add that the message may arrive more than once (duplicated) or after a newer one (late); the same providers document the payment details the walk relied on and the idempotency key. | source: Stripe's checkout guide warns against relying on the landing page; commercetools creates the order with payment pending.; quotation: Retries 'for up to three days'; 'doesn't guarantee the delivery of events in the order that they're generated'; endpoints 'might occasionally receive the same event more than once'.; source: Mollie's webhook carries only a payment identifier and no status.; source: iDEAL as an instant charge, captured automatically, with no chargeback and a 15-minute session timeout.; source: A client sends an idempotency key with each request, and a retry with the same key returns the saved result. | `example`: The public record in general. → Its first case: the payment handoff. |\n| p47 | evidence | The vendors confirm that a handoff needs acceptance: a warehouse must accept an order before it is responsible for it, after acceptance a cancellation needs its agreement, and since the warehouse may also refuse, a refusal is an answer within the handoff, not a fifth way for a message to fail. | source: A fulfillment request that the warehouse service accepts or rejects; fulfillment cannot be created before acceptance. | `similarity`: The payment handoff, where the receiver must be ready for a repeated message. → The warehouse handoff, where the receiver must accept the message before it is responsible. |\n| p20 | evidence | The major shop platforms keep separate status families on one order, which match the book's money, goods and returns lines, and neither's 'fulfilled' means delivered. | source: Shopify: order, payment and fulfillment status families. commercetools: OrderState, PaymentState, ShipmentState and per-item return states. | `additional_support`: The warehouse handoff and its fulfillment. → How two shop platform vendors record the order's status lines that these handoffs move. |\n| p48 | evidence | Tracking events are the customer's view of the journey, and without them the merchant cannot answer where the order is. | quotation: 'If you fulfill an order without a tracking number, then no shipping updates are received.'; statistic: 'Where is my order' requests were about 18% of incoming support contacts in one helpdesk vendor's customer base. | `additional_support`: The vendors' 'fulfilled', which is not 'delivered'. → The carrier's messages back. |\n| p49 | evidence | The law fixes the outer bounds of three promises: delivery, withdrawal and refund. | quotation: Delivery 'not later than 30 days from the conclusion of the contract'; 14 days to withdraw; reimbursement 'not later than 14 days'. | `additional_support`: What vendors document. → What the law requires. |\n| p50 | evidence | A return is recorded as a new linked document, never as an edit of the original invoice. | source: An invoice is numbered on confirmation and then locked; a credit note is the legal way to cancel or adjust it. | `additional_support`: The legal bounds on promises. → The accounting rule for corrections. |\n\n### Across Scale Stages\n\n**Controlling idea** (`analysis`, id `scale-stages`): The thirteen steps stay the same as a merchant grows; what grows is the number of systems, channels and stock locations between them.\n\n**Advances the thesis** (S3): Explains why the same journey breaks more often as the business grows: the handoffs multiply.\n\n**Transition in:** `time`: The journey and its handoffs as documented for any merchant. → How the number of handoffs changes over a merchant's four stages.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | analysis (list) | Across the four stages (starting, growing, omnichannel, group) the steps are unchanged and the number of systems, channels and locations holding copies increases. | scenario: Kestrel & Pine in 2016 to 2018 as one hosted platform with an outside payment provider, warehouse and carrier. |  |\n| p52 | example | Kestrel & Pine reached the third stage, omnichannel, in 2023, and its 2027 problems are all handoffs between systems. | scenario: Omnichannel since 2023. | `example`: The four stages. → Where the running example stands. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The steps, the entities, the status lines and the walk all show the same thing from different sides: an order is never in one place, so its reliability is a property of the messages between systems, not of any system. A merchant that can compare two copies and safely resend a message has the two capabilities every later chapter builds on.\n\n**So what:** The cheapest architecture document a newcomer can produce is the table of what each system knows at each moment for one real order; it shows where to look before any system is blamed or replaced.\n\n**Callback:** The four colleagues who each drew the part of the order their own system holds. The reader can now draw what none of them drew, the path between the boxes: the message that carries each handoff, what it promises and who owns it.\n\n**Takeaway** (`course_of_action`): Follow one real order through every system with a notebook, write down what each system knows at each moment, and take the questions that follow into your first week, a design review or a vendor demo.\n\n**Hand-off** to [Who Sells What to Whom: Business Models and the Economics That Shape Architecture](commerce-business-models.html): `contrast`: The thirteen-step journey, which is the same for every merchant. → The systems that run the journey differ sharply by who sells what to whom.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55 | synthesis (list) | Established: money, goods and returns move through separate states; a message between systems fails in four ways, which idempotency and reconciliation contain; payment outcomes arrive as unreliable messages; and the major vendors and the law document all of it. |  |  |\n| p56 | synthesis (list) | Depends on context: which system should hold the order record, and whether a static delivery promise is acceptable. |  | `contrast`: What the field agrees on. → What changes with the situation. |\n| p57 | recommendation (list) | The author's synthesis: a platform is the whole set of systems that make and keep promises and should be judged by its handoffs, and the first step is to follow one real order with a notebook. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p58 | recommendation (list) | A short list of questions lets the reader test the order's path in their own company. |  | `cause_effect`: The take-aways. → Questions that apply them. |\n| p59 | transition | The journey is the same for every merchant, but the systems that run it differ by who sells what to whom. |  | `contrast`: The one journey of this chapter. → The differences between merchants that the next chapter explains. |\n\n## Non-goals\n\n- How checkout is orchestrated and protected; authorization, capture, strong customer authentication and refunds in depth. See [From Cart to Confirmation: Checkout Orchestration](cart-and-checkout.html), [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html).\n- The order state machine, order edits, sourcing and routing, and when an order management system is needed. See [The Order Record: Lifecycle, State and the Order Management System](order-management.html).\n- Available-to-promise, reservations and the oversell problem; the warehouse's own steps; carriers and the computed delivery promise; the return data model; notifications and the service view. See [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html), [Pick, Pack, Ship: Warehouse Management and Fulfillment](warehouse-and-fulfillment.html), [Getting It There: Carriers, Labels, Tracking and the Delivery Promise](shipping-and-delivery.html), [The Way Back: Returns, Exchanges, Refunds and Reverse Logistics](returns-and-exchanges.html), [Where Is My Order? Notifications, Service and the Customer Record](customer-service-and-notifications.html).\n- Tax, invoicing and the ledger; integration styles, idempotency and reconciliation in depth; the system-of-record decision. See [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html), [APIs, Events, Files and Middleware: How Commerce Systems Talk](integration-styles.html), [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html), [Who Owns the Truth: Boundaries, Bounded Contexts and Systems of Record](boundaries-and-systems-of-record.html).\n- The four journeys in full, hour by hour; business models and the economics of an order. See [Part IX — JOURNEYS: One Order, End to End](part-9.html), [Who Sells What to Whom: Business Models and the Economics That Shape Architecture](commerce-business-models.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: after the round-4 confirming check (ESCALATE), cheap fixes applied: callout says the storefront's stock can be more than an hour old (rule 1, matches the walk); 'thirteen steps' in the introduction in place of 'about a dozen'; the Three-Status Order is tied to Schrödinger's Order and its name explained as three readings of the goods line; 'the carrier PostNL' without a comma; the requirements table's Double Refund cell names the manual second path; forward reference to 'Accepting warehouse work' removed; false causal 'So' fixed; payout and event glossed at first use (rule 6); 'This chapter owns their definitions' replaced by a sentence that acknowledges the earlier uses; the 'do not map one to one' sentence, which both readers stumbled on, removed (it was an agent addition). Rejected: A further check round.; Making section moves after the confirming round without checking them.\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: the count of systems follows rule 1: the seven systems are kept because the cast paragraph lists all seven, but 'six of the seven hold a copy of every order nt paragraph, and the opener says the section gathers the record. Rejected: Keeping the vendor paragraph in the status-lines section.; Leaving the citations where they were and only rewording the opener.\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: the marketplace connector and the agency script appearing after the cast was fixed: the cast paragraph now says the company runs more systems than the seven on Eva's path and that a few appear in the failure stories (rule 6, a clause where the reader stumbled). Rejected: Adding the connector to the cast as an eighth system.\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: 'not a fifth way for a message to fail' is kept, because the author's second-review decision frames a refusal as part of the handoff; it is reworded to follow from the warehouse's ability to refuse, so it answers a question the paragraph has just raised. Rejected: Dropping the sentence.\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: rule 6: 'the Card-Testing Night' gets a clause at first use: bots trying stolen card numbers, after which the PSP paused the account for 40 minutes (ledger, problem 8). Rejected: Removing the name.\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: rule 8: the heading 'Across Scale Stages' is already the short form and stays. Rejected: A longer heading.\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: rule 1: the exchange order for size L is no longer said to be created at request time and held; the page states only what the ledger states (exchange requested 19 April, shipped 22 April after inspection). The open question on 'create at request' versus 'create on inspection' is closed for this chapter. Rejected: Keeping 'created and held'.; Choosing 'create on inspection' without a ledger fact.\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: rule 1: the Three-Status Order follows the ledger's mechanism (customer-service-and-notifications, order-management); the note that the section must follow any change is removed, since the ledger is never edited. Rejected: Keeping the note as an open question.\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: the January 2027 whiteboard scene is consistent with the ledger (Noor Visser joined in January 2027) and stays a local detail; closed. Rejected: Adding it to the ledger.\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: the conclusion's callback to Noor's notebook and the four drawings passed conclusion_calls_back_to_introduction in all three rounds; no change; closed. Rejected: Rewriting the conclusion to return to the three records.\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: rule 1: 'The cart held three lines' becomes the jacket and the two pairs of socks (the ledger gives no line count; a reader could not tell why it was three), and the fulfillment order's 'lines' becomes 'items'. Rejected: Defining an order line.\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: rule 6: glosses added where round-3 readers stumbled: handoff at its first use in the introduction, reserving money (authorization), and 'distance sale' and 'posting' replaced by plain words. Rejected: Leaving the terms to later chapters.\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: rule 7: all acceptance criteria are kept: AC-1 and AC-2 come from the journal spec, AC-4 (intro_predicts_content) and AC-5 (reverse_outline_matches_spec) are kept by rule, and AC-3, an agent-added cold-reader probe, passed in all three rounds. Rejected: Dropping AC-3.\n- **2026-11-12** — After the round 1 draft check escalated on five spec faults, the author took the recommended changes: the han dings, for a later sharpen pass: Needs the author: both round-4 flow readers marked 'When It Goes Wrong at Each Step' partly unclear after the remedies, but proposed different moves (A: merge into the joins section before the remedies; B: put it before the joins section); rule 3 does not apply. Also corroborated and not changed: the 'Where we are in the order's journey' paragraph (both readers would move Eva's introduction to the end of the scene; it is the book's house element), step 6 correcting the order of steps 5 and 6, the status-lines subsection breaking the journey order of 'In Practice', and the steps table's last column naming functions rather than systems. Rejected: Another draft-check round now.\n\n## Sources\n\n- **Internal**\n  - meet-kestrel-and-pine and _research/scenario-ledger.md — Eva's jacket, the systems landscape, the stock sync chain, the Three-Status Order, the Double Refund, the Deprecated Endpoint, the Black Friday Oversell.\n  - PLAN.md, contract 1 — Scope, owned terms, neighbours.\n  - _research/brief-checkout-payments-tax.md — Checkout as orchestration, PSP flow, iDEAL, webhooks, idempotency, invoice rules, VAT rate.\n  - _research/brief-inventory-fulfillment-returns.md — Order status models, the fulfillment-order handshake, notifications, the order status page, 'where is my order', consumer-law clauses.\n  - _research/brief-commerce-business-models.md — Cart abandonment figures.\n- **External**\n  - Stripe, Checkout fulfillment, Webhooks, Idempotent requests — The asynchronous payment handoff, duplicates, retries.\n  - Mollie, Webhooks, iDEAL — The identifier-only webhook; iDEAL's properties.\n  - commercetools, Payments lifecycle, Orders — Order pending before the payment result; separate state enumerations.\n  - Shopify, Order status, Build for fulfillment services, Customer notifications, Understanding order status pages — Three status families, the fulfillment handshake, notifications, tracking.\n  - Odoo, Customer invoices, Credit notes and refunds — Invoice numbering and immutability.\n  - Directive 2011/83/EU — Delivery, withdrawal and refund clauses.\n  - business.gov.nl, VAT rates and exemptions — The 21% Dutch standard rate.\n  - Baymard Institute, cart abandonment statistics; Gorgias; IFRS 15 — Cart abandonment; the share of 'where is my order' contacts; revenue recognition on delivery.\n\n## Changelog\n\n- **2026-11-12** — Round-4 confirming check (ESCALATE); cheap fixes applied to p02, p14, p17, p22, p24a, p28, p29, the steps and requirements tables and the failure table; remaining corroborated order points recorded as open questions for the author.\n- **2026-11-12** — Escalation of round 3 auto-resolved under the author's standing instruction: joins section reordered (four ways, then requirements, then remedies); p20 and the Stripe and Mollie citations gathered in 'In Practice'; counts of copies and the marketplace hop interval dropped per the ledger; cast paragraph, p27, p33, p34, p36, p37, p45, p47 revised; open questions settled except the book-wide name of the hosted product.\n- **2026-11-12** — After round 3: in the status-lines section the plain-words paragraph (p21) now precedes the vendor paragraph (p20), as both flow readers proposed; p11 and p43 reworded; the round's draft faults fixed in the chapter.\n- **2026-11-12** — p24a: a system is defined as anything that takes part in handling an order, so that the definition covers the integration platform, which keeps no copy (round 2 judge's remark).\n- **2026-11-12** — Round 1 escalation resolved: p17 moved to the joins section, p24a to the scene; p15, p19, p53, p54 and the joins, promises-handoffs and when-it-goes-wrong section ideas revised; scale heading shortened; flow rationale updated.\n- **2026-11-12** — Chapter revised to match the spec (58 units); p40 corrected to say the connector, not a marketplace, retired the interface version.\n- **2026-11-12** — Third flow run's notes taken: promise defined once (p10), p15 carrie s moved to decision_log. No page change.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
