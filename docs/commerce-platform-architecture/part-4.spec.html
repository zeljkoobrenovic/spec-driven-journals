<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published page (posts/part-4-intro/index.md, 479 words by check_draft's count, ten units: four lead paragraphs, five chapter paragraphs and 'Begin with ...') and its former spec.md, then reordered the same day (see decision_log); the page was revised to match. One spec paragraph per unit; the KEY POINTS callout and Figures 2 and 3 are evidence of the claim paragraph (p04), Figure 1 of Eva's paragraph (p03). The one-line 'Begin with' unit became the headed closing (p10).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part IV answers five questions in order: what the warehouse system must receive and report, how carriers are connected and a delivery date computed, what a store adds and how its cross-channel services work, how a return moves money and stock, and how the customer and the agent learn the order's status.\n- **Know:** After checkout, the physical facts (stock on the shelf, the parcel's whereabouts, store stock, what came back) are known first by the system on the spot.\n- **Be able to:** Pick the Part IV chapter that answers the decision in front of them.\n\n**Audience:** Readers new to commerce architecture (engineers, product managers and operations leads joining a fulfillment, logistics, store, returns or customer-service team) who have read Parts I to III and are about to start the fulfillment chapters, or who arrive with one warehouse, delivery, store, return or 'where is my order' decision and want the chapter that answers it.\n\n**Already knows:**\n\n- What buying and receiving a parcel is like from the shopper's side.\n- Roughly what an API, a database and a queue are.\n- Part I: the thirteen steps of an order, promise and handoff, the three status lines (money, goods, returns), system of record, single writer, events, idempotency and reconciliation; the glosses for WMS, ERP, POS, 3PL, iPaaS, OMS and webhook; the Waypoint program and its decisions W1 to W8; the incidents in outline.\n- Parts II and III: available-to-promise and one writer each for on hand and committed; checkout creating the order once; refunds as new payments with one writer; one order record with three status lines; one invoice per shipment.\n- Kestrel & Pine in outline (a fictional outdoor brand) and Eva's jacket order of 13 April 2027 as the book's worked order.\n\n**Does not yet know:**\n\n- The returns bench (where returned items are inspected and graded); glossed by context here, owned by returns-and-exchanges.\n- Pick waves, cut-off and backlog as inputs to a delivery promise; named here, owned by warehouse-and-fulfillment and shipping-and-delivery.\n- The fulfillment order and its accept-or-reject answer; owned by warehouse-and-fulfillment, only named here as 'the work instruction and response'.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the five chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next five chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | A reader of this page alone can say why a shop can promise 'tomorrow' and deliver a day later although nobody was slow. *Probe:* Using only this page: why was Eva promised Wednesday and delivered Thursday, and what should the promise have been based on? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** Once the order is placed, how are the promises made about it (a delivery date, a collection, a return and its refund, the status the customer sees) kept?\n\n> **Claim:** Promises about a placed order are kept only where each physical fact has one system that witnesses and writes it (the warehouse system, the store's till, the carrier, the returns bench) and that applies each instruction once, as a keyed request it accepts or rejects; where each promise is computed from that system's events or released by its confirmation; and where the customer and the service agent read one status built from those events.\n\n**Disputed by:** The view that fulfillment is operations' work rather than architecture: once checkout has taken the order and the money, promises are kept by enough pickers, reliable carriers and helpful agents, and the storefront's delivery sentence, the shop platform's order status and its default refund flow are enough.\n\n**So what:** Kestrel & Pine's four Part IV incidents were promises made without the witness's facts or acted on by more than one system: the Queue That Waited (roughly 8,000 Black Friday orders missed next-day delivery while the page promised it), the Store Stock Mirage (37 collection items already sold), the Double Refund (212 returns, €19,400) and the Three-Status Order (11 tickets). A merchant that accepts the claim names the witness and the writer of each physical fact, and the event each promise reads, before it buys a faster warehouse, a new till or more service capacity.\n\n**How and why:** The storefront promises in seconds; the physical work happens hours or days later in buildings and vans the order record cannot see, and its facts (an empty pick location, a unit sold at the till, a parcel scan, a worn jacket on the bench) are known first by the system on the spot and reach the others by message, late or twice. A promise read from a copy or a static sentence is wrong whenever the copy lags or the queue grows; a status set by one integration overwrites what others know; and an action that two systems can take, such as a refund, is taken twice.\n\n**Supporting claims**\n\n- **P4-1** — Each physical fact has one system that witnesses it and is its only writer: the warehouse system for on-hand stock at the warehouse, the till for store stock and store sales, the carrier's scans for the parcel's whereabouts and the returns bench's disposition for what came back; every other system holds a copy fed by that system's events.\n- **P4-2** — The order record instructs the place that does the work through a fulfillment order that the place accepts or rejects and that carries a key, so a repeated instruction creates no second pick; after acceptance a cancellation or an edit is a request the place answers, and self-service and agents' actions check that state first.\n- **P4-3** — A promise about time or place is computed from the warehouse's cut-off, capacity and backlog, the stock's location and the carrier's measured transit time per lane, with a buffer and a margin, and a promise against store stock becomes a commitment only when a person at the store confirms it.\n- **P4-4** — On the way back, the warehouse's disposition is the event that releases the refund and the restock, and one system issues the refund with the return id as its key, whether the return started in the portal, at a store counter or on a marketplace.\n- **P4-5** — The customer and the agent see one status, derived from these events and kept in one order record as separate goods (per shipment), money and return states; the notifications, the status page and the agent's view are read models over that record.\n\n## Role in the part\n\nPerforms the part's opening: states the part thesis, places the part on Eva's jacket from Duiven on 14 April 2027 to the exchange shipped on 22 April, and gives the reading order.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in chapters: the five chapter paragraphs, in the part's reading order)\n\nThe page opens where Part III left the order (recorded and paid) on the gap between a confirmation in seconds and physical work that can slip a day, and narrows to Eva's one jacket out and back, delivered a day late, then to the company she bought from and its volumes; it then widens once, from her order to who knows each physical fact first and the three rules that follow for every order (with Figure 2, which pictures the systems), then gives the roadmap in its own paragraph, before narrowing again to one paragraph per chapter in the order of Eva's parcel, each opening on one case, with Figure 3 after them mapping the named incidents onto the promises; it ends by naming the cause of the opening's day-late delivery and sending the reader to the warehouse. Eva's order comes directly after the opening because it is the sequence the opening describes; the company comes after her order because it is where she bought; the rules come after both because they name the places her order passes through; Figure 3 comes after the chapter list because its caption names incidents the chapter paragraphs introduce. Put the rules first and they name systems the reader has not been shown; put the company between the opening and Eva's order and 'the sequence' loses its referent (round 1 readers); put Figure 3 before the chapters and its incident names come before the text introduces them (round 1 readers).\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): Checkout confirms an order in seconds, but someone still has to pick and pack the goods before the carrier's collection, and a late instruction or an empty shelf can push delivery back a day.\n\n**Bridge:** Part III's hand-off, the order recorded and paid, as the shopper sees it: checkout confirms and charges in seconds. → The physical work that follows over days in a warehouse, a van, a store and on a returns bench; Kestrel & Pine's scale; and Eva's jacket, bought on 13 April 2027, picked and packed at Duiven on 14 April, delivered on 15 April a day later than promised, size L requested on 19 April, return inspected and replacement shipped on 22 April, with store pickup and a counter exchange as other routes.\n\n**Thesis statement** (KEY POINTS bullets 1 to 3 and paragraph p04): After checkout each physical fact is known first by the system on the spot, so a promise holds only when the system that knows a fact is its only writer, each promise is computed from that writer's events (a refund waits for the returns bench), and messages, the status page and support read one order record.\n\n**Roadmap** (paragraph p05):\n\n- Five chapters following Eva's parcel out and back: the warehouse, the carrier and the delivery date, a side trip to the stores, the return and its refund, and the status the customer sees. *Kept in:* chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | Checkout confirms and charges an order in seconds, but the goods still have to be picked and packed before the carrier's collection, so an order that reaches the warehouse late or an empty shelf can push delivery back a day, and returns and store collections depend on the same work. | example: A confirmation and charge in seconds against picking and packing before the carrier's collection; an order that reaches the warehouse late or an empty shelf pushing delivery back a day. |  |\n| p02 | example | Eva's jacket order shows the sequence: ordered at 21:14 on Tuesday 13 April 2027 with delivery promised for Wednesday, picked and packed at Duiven, the warehouse, on 14 April, delivered by PostNL on Thursday 15 April a day late, size L requested on 19 April, the return inspected and the replacement shipped on 22 April. | scenario: Eva's jacket, 13 to 22 April 2027 (fictional).; figure: Figure 1: timeline of Eva's jacket, packed at Duiven on 14 April, delivered in Nijmegen on 15 April, size L requested on 19 April, exchange shipped on 22 April. | `example`: The physical work after checkout and a delivery that can slip a day. → One order that goes through that work out and back, delivered a day late. |\n| p03 | context | Eva bought from Kestrel & Pine, a fictional outdoor brand that makes such promises at scale: 336,000 parcels and 9,400 wholesale shipments a year from its one warehouse, four carriers, six stores on separate till software and 72,000 return parcels. | scenario: 336,000 parcels, 9,400 wholesale shipments, one warehouse (Duiven), four carriers, six stores on their own POS, 72,000 return parcels in 2026 (fictional). | `elaboration`: Eva's order. → The company she bought from, its warehouse, carriers, stores and returns, and their volume. |\n| p04 | claim | At each step a system on the spot knows the facts first, so the company's Waypoint improvement program draws three rules: the system that knows a fact is its only writer (for returns, the returns bench, where they are inspected); a promise such as a delivery date or a refund is computed from that writer's events; and messages, the status page and the support agent read one order record. | reasoning: KEY POINTS callout: the physical world has its own systems of record; a promise about it is a computation, not a sentence; one writer per fact, one source per view.; figure: Figure 2: the order record instructs the warehouse and the stores; the warehouse and carriers move the parcel; every physical fact returns as an event to the one record that notifications, the status page and the agent read. | `cause_effect`: The places Eva's order and Kestrel & Pine's volumes pass through. → Who knows each physical fact first, the rules that follow and the chapters that take each place. |\n| p05 | transition | The five chapters follow Eva's parcel out and back: the warehouse, the carrier and the delivery date, a side trip to the stores, the return and refund, and the status the customer sees. |  | `sequence`: The three rules and the places they apply to. → The order in which the chapters take those places. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the five chapters decides one question about keeping the order's promises and opens on one Kestrel & Pine case, in the order of Eva's jacket out and back.\n\n**Advances the thesis** (P4-1, P4-2, P4-3, P4-4, P4-5): Each paragraph introduces the chapter that argues one or more of the part's supporting claims, so the list is the part's argument in outline.\n\n**Transition in:** `elaboration`: The roadmap's five places in the order of Eva's parcel. → One paragraph per chapter: the question in bold and the case it opens on.\n\n**Order of paragraphs** (`prerequisite_order`): Each chapter uses what the one before it fixed. The warehouse comes first because it defines the fulfillment order, the warehouse system as the writer of on-hand stock, and the cut-off, capacity and backlog; the shipping chapter computes the delivery promise from those three and adds the carrier's events and one vocabulary for them; the stores chapter reuses the fulfillment order, labels and carrier pickup for ship-from-store and the computed promise for collection, and adds the till as a second witness of stock and orders; the returns chapter needs the carrier's 'delivered' event, which starts the 14-day clock, the warehouse's receiving and stock events, and the store-return rule the stores chapter set, and adds the returns bench's disposition as the witness of what came back; the service chapter comes last because its messages, status page and agent view read the events every earlier chapter defined. Putting shipping before the warehouse would ask the reader to compute a promise from a cut-off and backlog not yet explained; putting stores before shipping would describe ship-from-store and the collection promise before labels, carrier pickup and the computed promise exist; putting returns before stores would leave its store-return section pointing forward; putting service earlier would describe messages for events whose emitters the reader has not met and would leave the part without the chapter that joins its events into one status.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | description | First, the warehouse chapter defines the work instruction and response between order management and the warehouse: the Queue That Waited, a four-hour Black Friday backlog, shows a warehouse with spare picking capacity while customers wait for orders that never reached it. | scenario: Black Friday 2026: a four-hour backlog in the order feed to the WMS (fictional). |  |\n| p07 | description | Then the shipping chapter explains carrier integration and credible delivery dates: Eva's Wednesday promise came from a fixed storefront rule that ignored that her order missed Duiven's last picking batch at 21:00, so the promise must read collection schedules, backlog, location and carrier performance. | scenario: Eva's 21:14 order after Duiven's last wave at 21:00; 'ordered before 22:00' rule; promised Wednesday 14 April, delivered Thursday 15 April (fictional). | `sequence`: The warehouse, where the parcel is picked and packed. → The carrier that takes it and the date promised for it. |\n| p08 | description | Off Eva's route, the stores chapter treats the store till as another source of orders, stock and customer records: in the Store Stock Mirage, Utrecht's trial of collection in store promised 37 items already sold. | scenario: Utrecht's click-and-collect pilot promised 37 items already sold (the Store Stock Mirage, December 2026; fictional). | `contrast`: Eva's parcel route from warehouse to door. → The other routes, through a store, and the store's till. |\n| p09 | description | On the way back, the returns chapter separates the return request, inspection, stock decision and money movement: Eva's size exchange and January 2027's 212 double refunds (the Double Refund) show why each needs its own state and authorized owner; refund and restock wait for inspection, and one system issues refunds. | scenario: Eva's exchange (19 to 22 April 2027); the Double Refund, 212 returns refunded twice in January 2027 (fictional).; reasoning: Refund and restock wait for the warehouse's inspection; one system issues refunds. | `sequence`: The routes out to the customer, by parcel or through a store. → The way back: the return and its refund. |\n| p10 | description | Last, the service chapter aligns messages, the status page and the support view: the Three-Status Order drew eleven tickets because no system could say that the order ships in two parcels. | scenario: Order #1052877, two parcels, eleven tickets (the Three-Status Order, December 2026; fictional).; figure: Figure 3: the four promises of Part IV ('delivered tomorrow', 'ready for collection', 'your order was delivered', 'your refund is on its way') and the inputs each needs; the Queue That Waited, the Store Stock Mirage, the Three-Status Order and the Double Refund in the same order, are the four made without them. | `sequence`: The events of the warehouse, the carrier, the store and the returns bench. → The status that the customer and the agent see, built from them. |\n\n## Conclusion: Where to Begin\n\n**Synthesis:** Read together, the cases need no faster work: each promise came from the wrong place, and the opening's late delivery is one more such case. No chapter paragraph says this of all of them.\n\n**So what:** The reader knows the part's problems are settled by where a promise reads its facts, not by faster work, and starts where the order first meets the work: the warehouse.\n\n**Callback:** The opening's order whose delivery can slip a day (p01) and Eva's day-late delivery (p02). The closing names the late delivery as one more promise taken from the wrong place.\n\n**Takeaway** (`course_of_action`): Begin with warehouse-and-fulfillment.\n\n**Hand-off** to [Pick, Pack, Ship: Warehouse Management and Fulfillment](warehouse-and-fulfillment.html): `elaboration`: The part introduction's first question, the work instruction and response between order management and the warehouse, and Eva's paid order waiting for Duiven. → What happens to the order inside the warehouse and what the warehouse system must receive and report.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | synthesis | None of the cases needed faster work: each promise came from the wrong place, as did the opening's late delivery; begin with the warehouse chapter, where Eva's paid order reaches Duiven. |  |  |\n\n## Non-goals\n\n- Teaching any chapter's content (the fulfillment order, carrier events, store stock, dispositions, the status read models); the page summarizes and does not re-argue. See [Pick, Pack, Ship: Warehouse Management and Fulfillment](warehouse-and-fulfillment.html), [Getting It There: Carriers, Labels, Tracking and the Delivery Promise](shipping-and-delivery.html), [Stores Are Systems Too: Point of Sale and Omnichannel Fulfillment](stores-and-omnichannel.html), [The Way Back: Returns, Exchanges, Refunds and Reverse Logistics](returns-and-exchanges.html), [Where Is My Order? Notifications, Service and the Customer Record](customer-service-and-notifications.html).\n- The Waypoint decisions in detail. See [Meet Kestrel & Pine](meet-kestrel-and-pine.html).\n- The availability calculation and the order state machines, which Parts II and III own. See [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html), [The Order Record: Lifecycle, State and the Order Management System](order-management.html).\n- The part's closing (the incidents read together as one fault, set against the opening). See [Where Is My Order? Notifications, Service and the Customer Record](customer-service-and-notifications.html).\n- Scale-stage comparisons (each chapter has its own table).\n- External factual claims; the page makes none of its own.\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-12** — Confirming draft-check round 3: escalate (54 pass, 20 fail; 5 blocking: three judged spec faults, two draft). Cheap, plainly right fixes applied without another round, within 571 words: p04 puts the ret n, and one system issues refunds'). Rejected: Keeping 900 (rule 4 sets part intros at the published length plus 15%).\n- **2026-11-12** — Order of ideas changed from the published page, without the author's review (the author asked for this pass to run unattended): (1) p01 opens on Part III's hand-off ('Part III left the order recorded and paid') and drops the scope sentence 'This part explains how the systems planning that physical work supply dates and statuses the customer can rely on' (vague; p04 now states the claim). (2) Kestrel & Pine's facts (p02) move before Eva's order (p03), so her order runs through a warehouse, carrier and stores already named; Duiven is named as the warehouse. (3) The Waypoint paragraph becomes the claim (p04): who knows each fact first, the three rules, and a roadmap of the five chapters, which the published intro did not have; its sentences 'Customer messages must reflect those records' and 'The chapters below show why each decision matters' are folded into it. (4) Figures 2 and 3 stay with the claim. (5) Chapter paragraphs open on what the previous one hands on; p06 says why Eva's promise failed (21:14 order after Duiven's last wave at 21:00, the static 'before 22:00' rule; ledger, warehouse-and-fulfillment line and editor-review line on Part III item 5) so AC-2 can be answered from the page; p08 backs KEY POINTS bullet 3; incident names from Figure 3 are used where they cost few words (the Queue That Waited, the Three-Status Order). (6) 'Begin with [Pick, Pack, Ship: Warehouse Management and Fulfillment](warehouse-and-fulfillment.html).' becomes the one-paragraph headed closing 'Where to Begin' with the callback and the hand-off. Rejected: A separate witnesses paragraph before the claim (75 words over the limit).; Keeping the published order (company facts after Eva's order).\n- **2026-11-12** — Rule 5: the author's sentence 'The chapter builds that explanation from shared facts.' (service chapter) is cut for length; the page is at <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
