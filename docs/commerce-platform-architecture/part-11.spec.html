<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-13 from the published page (posts/part-11-intro/index.md, 367 words, nine units) and its former spec.md, then revised the same day (see decision_log). One spec paragraph per unit; the KEY POINTS callout carries the thesis; Figures 1 to 3 are evidence of the Kestrel & Pine paragraph (p04), after which they stand on the page.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part XI reads four cases in order: Shopify (modularity, tenant isolation, checkout extensions and integration contracts), Amazon (services, cart design, fulfillment and the delivery promise), Zalando (team autonomy, shared API standards and later corrections, including a 2025 price-and-stock example where direct queries replaced a delayed event stream), and the composable movement (how its vendors' promises and offerings changed, and separate services added beside an existing platform).\n- **Know:** How each case is read: public filings, papers, engineering posts and documentation researched on 7 November 2026; claims carry dates; older posts may describe replaced systems; unsupported internal explanations are labeled INFERENCE, NOT DOCUMENTED; each case ends with what the evidence could not establish.\n- **Know:** Each company's engineering answered a different business and size, so copying its shape is The Giant's Boots; for Kestrel & Pine, with fourteen technology staff, the useful question is which practice helps its order flow and what operating burden it adds, and each lesson it takes confirms a Waypoint decision already made.\n- **Be able to:** Say which kind of lesson from a large company transfers to a merchant of their size: discipline (dated API versions, reconciled integrations, one owner per fact), not machinery (pods, a hundred services).\n\n**Audience:** Readers new to commerce architecture (engineers, architects, product managers and leaders) who have read Parts I to X, or who hear 'Amazon did microservices' or 'go composable' in a design review and want to know how to read a company case and which kind of lesson transfers to a merchant of their size.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Parts I to X: the thirteen steps of an order, promise and handoff, the three status lines, system of record, single writer, events, idempotency and reconciliation; the failure-pattern names (The Giant's Boots among them); the four scale stages; the glosses for PSP, WMS, ERP, iPaaS, webhook, API call, SKU, channel, marketplace connector, 3PL and OMS.\n- Kestrel & Pine: a fictional outdoor brand with fourteen technology staff on a hosted shop platform, and the Waypoint program's decisions W1 to W8.\n\n**Does not yet know:**\n\n- The four companies' records: each chapter owns its facts and sources; the page only names what each chapter examines.\n- Tenant isolation and Shopify's pods (glossed in a clause in p05: each shop kept apart in database pods); checkout extensions as Shopify uses them (owned by case-shopify; named only, as one of the chapter's subjects).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the four cases in reading order, what each examines, and how the evidence is read. *Probe:* After reading only this page: what will each of the four chapters examine, in order, and how is the evidence in them read? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | A reader of this page alone can say why a small merchant should not copy these companies' architectures and what it should take from them instead. *Probe:* Using only this page: why should a merchant with fourteen technology staff not copy these companies' architectures, and what should it take from them? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** What does the dated public record of Shopify, Amazon, Zalando and the composable vendors show about the book's argument, and which of their practices should a growing merchant adopt?\n\n> **Claim:** The four cases' dated public records show the promises a merchant makes (price, stock, delivery date, refund) kept or broken at the joins between systems, and kept, between them, with contracts, one owner per fact, reconciliation and dated deprecation; each company in them sized its architecture to its own load, teams or customers. A growing merchant should adopt those disciplines, not Shopify's pods, Amazon's hundreds of services and delivery network, Zalando's thousands of applications or an all-composable rebuild.\n\n**Disputed by:** The view that the leading companies' architectures are models to adopt: Amazon and Zalando show that a serious commerce platform is built from microservices, Shopify that a modular monolith with enforced domains scales, and the composable vendors that the future is an assembly of best-of-breed services, so a growing merchant should move toward the architecture of the company it wants to become.\n\n**So what:** A merchant that accepts the claim answers 'Amazon did microservices' or 'go composable' in a design review by asking which documented discipline the example shows and at what size the company adopted the shape around it, and demands the disciplines of its vendors before copying any shape. Kestrel & Pine takes from the four cases lessons that each match a Waypoint decision already made (W1, W4, W5, W8) and changes none of its architecture; it declined the consultancy's February 2027 composable rebuild (about €3.2M, illustrative), a shape the composable vendors' own 2026 products no longer require.\n\n**How and why:** Every merchant's systems meet at the same kinds of joins as these companies' (a webhook, a stock copy, an API version, a seller-of-record split), so the rules a company wrote for its joins work at any size: Shopify's webhook contract and Zalando's deprecation rules are written for any consumer of an API, however small. The shapes answered problems a fourteen-person team does not have: a front end that stopped scaling in 2001, 85-plus teams blocked by one codebase, millions of shops on one database fleet, enterprise customers with product-engineering teams. The companies' own later documents confirm this where a shape was corrected: Shopify's 2024 retrospective on domain boundaries, Zalando's 2025 move from events to a read API, the alliance dropping microservices and headless, commercetools selling modules for existing platforms.\n\n**Supporting claims**\n\n- **P11-1** — A hosted platform's own record shows the change cadence a renting merchant must plan for: Shopify documents at-least-once, unordered webhooks whose subscription is deleted after eight consecutive failures, expects consumers to run reconciliation jobs, supports each API version for at least twelve months and withdrew checkout extension points on published dates, while its 2024 retrospective concedes that its domain boundaries did not match how its code works; the merchant adopts inventory, pinning, testing and reconciliation, not the pods or the renderer.\n- **P11-2** — Amazon's record ties each move to a business problem: services after a front end that stopped scaling in 2001, a cart that accepts every add because a refused add is a lost sale, Prime and Fulfillment by Amazon opening its operations so that a third-party seller's item carries Amazon's promise while Amazon is not the seller of record, and investment in the network that keeps the delivery promise; the contract as the only door, availability for the cart but consistency for stock and payment, operability as a test for adoption and a computed promise transfer, while the network and the service count do not.\n- **P11-3** — Zalando split its shop in 2015 for team autonomy, then narrowed choices for a decade and in 2025 replaced a price-and-stock event stream that lagged up to 30 minutes at Cyber Week and bred divergent copies with a read API; its written API guidelines on compatibility and deprecation, maintained in 2026 while its account-per-team platform tooling is archived, are what a merchant demands of every vendor, and events propagate change while a read API on the owner answers what a value is now.\n- **P11-4** — The composable movement's 2020 promise did not say who builds the storefront or owns the joins between services; by 2026 its alliance had dropped microservices and headless from its principles, its own survey found 37% naming integration complexity a primary concern, and its vendors sold layers and modules beside platforms merchants keep, so a full assembly fits a Group-stage merchant with product and platform teams and an Omnichannel merchant adopts one owned capability at a time.\n- **P11-5** — Read with dates and with documented facts kept apart from inference, each case divides into disciplines that transfer to a fourteen-person team (contracts, one owner per fact, reconciliation, dated deprecation) and machinery sized to the company; each lesson Kestrel & Pine takes matches a Waypoint decision already made, and each case ends where its public evidence stops, short of the company's current internals.\n\n## Role in the part\n\nPerforms the part's opening: states the part thesis in three key points, sets the rules for reading the evidence, names The Giant's Boots as the risk and what Kestrel & Pine asks of each case, and gives one paragraph per case in reading order.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in chapters: the four case paragraphs, in the part's reading order)\n\nThe page moves from the whole book to one merchant's first chapter. It opens where Part X hands over (the argument made so far with a fictional merchant) and names the four real companies and why their businesses differ; then how their records are read, with the figure of the reading method beside the rules; then what the records, read that way, show (promises kept or broken at the handoffs, kept with four disciplines); then the merchant who applies them, the risk of copying shapes (The Giant's Boots) and what it asks of each case; then one paragraph per case in reading order; it ends on the opening's point and where to begin. The reading rules come before the finding because the finding is stated as what dated, labeled evidence shows; the merchant comes after the finding because its question (which practice helps, at what operating burden) applies the finding; the chapter list comes after both because each paragraph names what the merchant can adopt from its case. Put the chapter list first and its 'merchant lessons' would point at a merchant and a test the reader has not met. The chapter list opens on Shopify as the kind of platform Kestrel & Pine rents, so the reader sees why it comes first before the list, not after it.\n\n## Introduction\n\n**Hook** (`direct_statement`): The documented record is narrower than the folklore, and more useful: in the companies' own dated words, the slogans ('Amazon did microservices', 'go composable') shrink to rules a small team can use.\n\n**Bridge:** Part X's close: the book's argument made so far with a fictional merchant, Kestrel & Pine, and dated examples. → Four real companies cited in design reviews in slogans such as 'Amazon did microservices' and 'go composable', each answering a different business: Shopify operates a platform for merchants, Amazon and Zalando are retailers that also host sellers and fulfil orders, and composable vendors sell separate services that merchants assemble.\n\n**Thesis statement** (KEY POINTS bullets 1 to 3 and paragraph p03): In the companies' own dated words the slogans shrink to rules a small team can use: the four records show the promises on price, stock, delivery and refunds kept or broken at the handoffs between systems, and kept with contracts, one owner per fact, reconciliation and dated deprecation; each company sized its answer to itself, so what transfers to a merchant is discipline, not machinery (dated API versions, reconciled integrations and one owner per fact, not pods or a hundred services).\n\n**Roadmap** (paragraph p01 (the four companies in chapter order) and the chapter list):\n\n- Four cases in reading order, each read from dated public sources with inferences labeled and ending where the evidence stops: Shopify (modularity, tenant isolation, checkout extensions and integration contracts), Amazon (services, cart design and fulfillment), Zalando (team autonomy, shared API standards and later corrections) and the composable movement (how vendors' promises and offerings changed); each says what Kestrel & Pine can take from it. *Kept in:* chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | Part XI reads the argument the book has made with Kestrel & Pine against four real companies that design reviews cite in slogans such as 'Amazon did microservices' and 'go composable', taking them in chapter order: Shopify, a platform for merchants; Amazon and Zalando, retailers that also host other sellers and fulfil orders; the composable vendors, which sell services merchants assemble. | reasoning: Shopify operates a platform for merchants; Amazon and Zalando are retailers that also host other sellers and fulfil orders; composable vendors sell separate services that merchants assemble. |  |\n| p02 | process | Each case is read from public filings, papers, engineering posts and documentation researched on 7 November 2026, with every claim dated, older posts flagged as possibly describing replaced systems, unsupported internal explanations labeled INFERENCE, NOT DOCUMENTED, and a closing account of what the evidence could not establish. | figure: Figure 1: how tting chapter 49 first would judge the vendors' pitch before the reader has seen what the shape cost the companies that built it; putting 48 before 47 would lose the comparison with Amazon's dated sequence that makes Zalando's motive and corrections legible; putting 46 later would open the part with a retailer's machinery, far from the renting merchant, and leave the Shopware comparison pointing forward. Swapping 46 and 47 breaks no dependency of chapter 47; its cost is that the part would open with a retailer's machinery before the reader has the hosted platform's contract terms that each later case is measured against.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description | First, the Shopify chapter, on the kind of hosted platform Kestrel & Pine rents, examines modularity, tenant isolation (each shop kept apart in database pods), checkout extensions and integration contracts, and shows that a merchant can adopt dated API versions and reconciliation without copying the vendor's infrastructure. | source: case-shopify's dated record (summarized, not cited here). |  |\n| p06 | description | The Amazon chapter reads dated accounts of services, cart design and fulfillment and draws merchant lessons on reliable contracts, stock that a marketplace holds, kept as its own location, and delivery promises computed from operations. |  | `sequence`: The first case, a platform for merchants. → The company most cited for services, a retailer that also hosts sellers. |\n| p07 | description | The Zalando chapter follows team autonomy, shared API standards and later corrections to that autonomy, with a 2025 price-and-stock example in which direct queries replaced a delayed event stream for a particular need, not as a universal preference for either mechanism. |  | `sequence`: Amazon's dated move to services. → A European retailer's later split and its corrections. |\n| p08 | description | Last, the composable-moveme         function renderMarkdown(src) {

            const out = [];

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;

                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {

                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

                const fence = line.match(/^```(\w*)\s*$/);

                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
