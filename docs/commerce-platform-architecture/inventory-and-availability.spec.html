<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/10-inventory-and-availability/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter. It is a contract, not a description: the places where the chapter did not yet do what the spec asks are listed under open_questions.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The five stock numbers (on hand, committed, reserved, held back, incoming) and the available-to-promise figure derived from them.\n- **Know:** The three moments at which a unit can become promised (cart, order, fulfillment) and what each costs.\n- **Know:** The parts of an availability service and which system writes which number.\n- **Believe:** 'Available' is a computation that no system should store as a fact and let another overwrite.\n- **Believe:** Oversells come from several writers and from scheduled copying, not from a system that cannot count.\n- **Be able to:** Compute available-to-promise from on hand, committed, reserved and held-back units.\n- **Be able to:** Name, for their own company, the system of record for on hand at each location and the only writer of committed.\n- **Be able to:** Say when a merchant needs a separate availability service.\n\n**Audience:** Readers new to commerce architecture; most of all the integration or back-end engineer who inherits a stock synchronization and needs to know which system should own which number before touching it. Operations and e-commerce managers get the vocabulary for a conversation about buffers and oversells.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side.\n- Roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its 2026 incidents in outline and the names of the failure patterns (meet-kestrel-and-pine, where-commerce-platforms-go-wrong).\n- From Part I: the thirteen steps of an order, promise and handoff, 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, the business models and the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, and the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From the earlier chapters of Part II: who owns product content, prices and discounts, and that the search index is a copy that showed the Ridgewalker 'in stock' from a stock figure up to two hours old.\n\n**Does not yet know:**\n\n- The stock numbers: on hand, committed (allocated), reserved, held back, safety stock, incoming, and available-to-promise (ATP).\n- Reserve-on-cart, reserve-on-order and allocation at fulfillment; the consistency window.\n- Location, per-channel buffer, sourcing, allocation for a customer, backorder, pre-order, inventory valuation.\n- Stock event, snapshot against change, synchronous call, atomic commit, eventual consistency in plain words.\n- Cycle counting and inventory record inaccuracy.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given the stock numbers for one product at one location, the reader computes what a channel may still sell and names the result as derived. *Probe:* A warehouse has 10 jackets on the shelf. 3 belong to placed orders that have not shipped, 1 is reserved in a cart, and 2 are held back as a buffer. Using only this chapter: how many may a channel still sell, and what is that number called? | `custom` | cold_reader | major |\n| AC-2 | Given two channels that sold the same last unit, the reader names several writers and scheduled copying as causes and does not accept a shorter sync interval as the whole remedy. *Probe:* Two channels sold the same last unit. Using only this chapter: which causes would you look for, and would copying stock every five minutes instead of every hour fix it? | `custom` | cold_reader | major |\n| AC-3 | The reader can say which interaction must get an exact answer from the availability service and which may read a slightly stale copy. *Probe:* Using only this chapter: which step of a purchase must ask the availability service and wait for the answer, and which steps may show a slightly old figure? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-6 | A reader new to commerce meets no term in this chapter before it is explained, and every acronym is expanded on first use. | `known_before_new` | rubric | minor |\n\n## Thesis\n\n**Question:** What does \"in stock\" mean, who computes it, and how do you avoid selling what you do not have?\n\n> **Claim:** 'In stock' means available-to-promise: units on hand minus three amounts: units committed to orders, units held temporarily for carts, and units held back as a buffer. This figure is computed in one place and published to each channel: by the shop platform while the shop platform is the only system that takes orders and counts stock, and, once a second system takes orders or counts stock, by one service that receives every count and every commitment. A merchant avoids selling what it does not have by giving on hand and committed one writer each, sending each stock change as an event when it happens instead of copying totals on a schedule, holding back a buffer per channel, and committing a unit to exactly one order at checkout.\n\n**Disputed by:** The view that stock is one number which each system holds and synchronizes with the others, so that an oversell is cured by synchronizing more often.\n\n**So what:** On Black Friday 2026 Kestrel & Pine oversold 1,340 units on 1,120 orders, at a cost of about €96,000, while every system was up and reporting its own number. A merchant that accepts the claim writes down who owns each stock number before it builds the first connector.\n\n**How and why:** A stored 'available' figure can be overwritten by any system that copies it, so two writers, or one copy made on a schedule, leave channels selling from different answers; at Kestrel & Pine's peak of 38 orders a minute, a one-hour copy interval can hide up to about 2,300 orders from the other channels. Deriving the figure in one place, from one counted fact and one list of commitments, leaves one answer for every channel, and only the commit at checkout has to be exact.\n\n**Supporting claims**\n\n- **S1** — 'In stock' is a derived figure, available-to-promise: on hand, the one counted fact, minus the units committed to orders, reserved for carts and held back on purpose; a system that stores it as a fact and lets another system overwrite it has prepared an oversell.\n- **S2** — The moment a unit becomes promised (cart, order or fulfillment) is a business choice with a cost on each side, and only the commit at checkout has to be exact: there the last unit must go to exactly one order.\n- **S3** — The figure is computed in one place and published per channel: by the shop platform while it is the only system that takes orders and counts stock, and by one availability service, with a buffer per channel, once a second system takes orders or counts stock.\n- **S4** — Oversells come from several writers of one number and from totals copied on a schedule, so the remedy is one writer each for on hand and committed and stock changes sent as events when they happen, not a shorter copying interval.\n- **S5** — The counted fact is itself often wrong and events are sometimes lost or repeated, so the design is finished only with a deliberate buffer and a scheduled comparison of every copy with the system that counts.\n\n## Role in the part\n\nApplies the part's argument to the fastest-changing fact, where a stale copy costs most, and performs the part's closing before handing the committed unit to the cart. Supports P2-5, P2-6 of part `part-2`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene then five-numbers to service: the Oversell, then the terms and the arrangement that answer it; `comparison` in choices, trade-offs and stages: four options on the same criteria, then by stage)\n\nThe Oversell comes first so that every term arrives as part of the answer to 'why did the website not know'. The five numbers follow because nothing can be said about ownership until the reader knows which number is counted and which is derived; the moment of promise follows the numbers because it is the moment a unit moves from one of them to another. Locations and channels come after both: 'available per channel' needs 'available', and the wholesale allocation is explained by contrast with the warehouse's allocation of a unit to an order, which the moment of promise introduces. The service needs all three (numbers, moments, channels), since its component table says which system writes which number and its requirements table says which interaction must be exact. The choices come after the service because the service is one of the four and the other three are judged against it; the trade-offs come before the stages because the stage table uses the criteria the trade-offs name (lag, writers, buffers) as its warning signs. Kestrel & Pine's W1 is named in the scene and shown in the service section before the choices; the reader knows it from Part I as a decision already taken, and the choices then say what it was chosen over. The worked example comes after the choices and the stages because it applies the chosen option (W1) to the opening case at the Omnichannel stage; before the choices it would be a list of remedies with no names. The failures come last because every design must expect them, the recommended one included, and the section ends on the count's own accuracy, the one failure a reconciliation cannot find; the reconciliation and the buffer are what the conclusion and the part closing start from. Moving the scene later would put four sections of vocabulary before the problem; moving the failures before the choices would describe faults of a design the reader has not met.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A web shopper and a store customer try to buy the last jacket within the same minute. Both channels show it as available, but there is only one unit on the shelf.\n\n**Bridge:** Anyone has seen 'in stock' on a product page, and the search results of the previous chapter have just shown Eva that label. → A shelf count cannot produce that label: some units belong to unshipped orders and others are held back, so the label is a calculation, and the question is who makes it and how every channel gets the same answer.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and paragraph p02): Availability is computed from the count, the claims against it and the units held back, in one place, before a channel commits to a sale; copying a stock number along a chain of scheduled updates leaves channels selling from different answers.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p03):\n\n- Start from Kestrel & Pine's worst evening of 2026, the Black Friday Oversell. *Kept in:* scene.\n- Take 'in stock' apart into the numbers behind it, and say when a unit becomes promised. *Kept in:* five-numbers, promised.\n- Add several locations and channels, and describe the availability service: which system writes which number, what each step of a purchase needs, and why stock changes should travel as events and not as scheduled copies. *Kept in:* locations, service.\n- Compare four ways of computing availability, weigh their trade-offs and say which fits which scale stage. *Kept in:* choices, trade-offs, stages.\n- Work the Oversell through with the remedy in place, list the ways stock integrations fail, and check the count itself against a study of inventory records. *Kept in:* in-practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A web shopper and a store customer who try to buy the last jacket in the same minute can both succeed if each channel relies on its own stock count, so the channels need a shared way to decide which sale gets the unit. | scenario: Two channels, one unit on the shelf, two sales within a minute. |  |\n| p02 | claim | A shelf count alone cannot say whether a unit may be sold, because some units already belong to orders and others are held back, so availability has to combine those facts before a channel commits to a sale, and copying a number along scheduled updates leaves channels with different answers. |  | `cause_effect`: The need for a shared way to decide which sale gets the last unit. → Why a count is not that answer: the claims and holds a count leaves out, and the chapter's claim that availability is a calculation. |\n| p04 | context | In Eva's order the search results have just shown the Ridgewalker 'in stock', and availability is what supplies that label, the cart's stock check and the commitment at checkout that keeps another shopper from buying her unit. |  | `example`: Availability as a calculation made before a channel commits to a sale. → Where that calculation is used in Eva's order, starting from the 'in stock' label the previous chapter's search results showed. |\n| p03 | transition | The chapter starts from Kestrel & Pine's Black Friday Oversell, takes 'in stock' apart into its numbers, says when a unit becomes promised, adds locations and channels, describes the availability service, compares four ways of computing availability with their trade-offs and by scale stage, works the Oversell through with the remedy in place and ends with the ways stock integrations fail and the accuracy of the count itself; its evidence is the Oversell, vendors' platform documentation and a study of inventory records. |  | `sequence`: The three places in Eva's order where availability is used. → The order in which the chapter explains how that answer is computed, and its evidence: the Oversell, platform documentation and a study of inventory records. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: Friday 27 November 2026, 19:40\n\n**Controlling idea** (`example`, id `scene`): On Black Friday 2026 Kestrel & Pine oversold 1,340 jackets while every system was up, because stock counts were copied along a chain of scheduled updates and nobody had decided who owned the number.\n\n**Advances the thesis** (S4): Gives the case the chapter explains: an oversell caused by scheduled copying and several writers, with no system down.\n\n**Transition in:** `example`: The claim that copying a stock number along scheduled updates leaves channels selling from different answers. → The evening on which that happened at Kestrel & Pine.\n\n**Order of paragraphs** (`chronological`): The chain as it was built, the lag it produced, the evening minute by minute, what made it worse, then the CEO's question: the reader needs the chain before the timeline can be read, and the question only after seeing that nothing was broken.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | context | In January 2027 Noor Visser asked Ruben Alves and Daniel Okafor to reconstruct the Black Friday Oversell minute by minute, and what they drew was a chain. |  |  |\n| p06 | description | In 2026 the warehouse management system sent counts to the ERP every 15 minutes, the ERP copied them to the shop platform hourly, and the platform copied them hourly to the marketplace connector. | scenario: WMS to ERP every 15 minutes, ERP to shop platform hourly, shop platform to marketplace connector hourly. | `elaboration`: The chain on the whiteboard. → Its three hops and the schedule of each. |\n| p07 | cause_effect | A sale on one channel therefore reached the other channels only after picking and the scheduled updates, up to two hours later. | scenario: Up to two hours for a sale to reduce the stock shown elsewhere. | `cause_effect`: The three scheduled hops. → The lag they add up to for a sale on one channel. |\n| p08 | example | On Friday 27 November the Ridgewalker sold out in the warehouse at 19:40 and the channels went on selling it, the marketplaces until after 21:05, so 1,340 units were oversold on 1,120 orders, about 790 of the units on the storefronts and 550 on the marketplaces. | table: Timeline of 27 November 2026: 19:40 last units picked; 19:45 the WMS tells the ERP; 20:00-21:00 peak hour of 2,300 orders, 38 a minute; about 20:30 the ERP tells the platform (illustrative time); 21:05 the Ridgewalker set to zero by hand in the connector; Saturday 1,340 units oversold, 1,120 orders affected.; scenario: Of the 1,340 oversold units about 790 were storefront orders and 550 marketplace orders (illustrative split); the marketplace share carried the penalties.; figure: Figure 1: the Oversell as a relay. | `example`: The chain and its lag of up to two hours. → The evening the lag met a peak hour, as a timeline. |\n| p09 | cause_effect | Two things made it worse: the order queue to the warehouse backed up for four hours, and three of the shop platform's 41 apps could write inventory, one of which had already caused two weeks of phantom reservations in March 2026. | scenario: Four-hour backlog of the order queue to the WMS; the App That Wrote Stock, March 2026, about 600 variants for two weeks. | `additional_support`: The timeline of the evening. → Two aggravating facts: a queue backlog and apps that wrote the same number as the warehouse feed. |\n| p10 | claim | The CEO asked why the website did not know, and Noor's answer, which became Waypoint decision W1, was that it could not know because nobody had decided who owned the number and nothing carried changes fast enough. |  | `cause_effect`: The lag and the several writers. → The question they raise and the answer the rest of the chapter gives in full. |\n\n### What \"In Stock\" Means: Five Numbers, Not One\n\n**Controlling idea** (`definition`, id `five-numbers`): 'In stock' is not one number: on hand is a counted fact, committed, reserved and held-back units are claims against it, and what a channel may sell is derived from them.\n\n**Advances the thesis** (S1): Defines the numbers and the derivation the thesis names, and shows four vendors separating them in the same way.\n\n**Transition in:** `elaboration`: 'Nobody had decided who owned the number.' → That the number is five numbers and a calculation, which is why ownership had not been decided.\n\n**Order of paragraphs** (`prerequisite_order`): The five numbers, then the formula that needs them, then the vendors' names for the same things, then one vendor stating the arithmetic and changing a state's meaning, then who owns which number: the ownership rule needs the reader to know which numbers are counted and which are derived.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition (list) | Every system that tracks stock separates the units physically present from the units it may still promise, using five numbers: on hand, committed, reserved, held back and incoming. |  |  |\n| p12 | definition | The number a channel may sell, available-to-promise, is derived: on hand minus committed, minus reserved, minus held back, plus incoming only if the merchant promises against it. | reasoning: available-to-promise = on hand − committed − reserved − held back (+ incoming, only if you promise against it), stated as industry practice.; figure: Figure 2: on hand as the one counted fact, the claims against it and what remains. | `cause_effect`: The five numbers. → The figure derived from them and its formula. |\n| p13 | evidence | Shopify, commercetools, Adobe Commerce and SAP Commerce all separate physical units, units promised to orders and units sellable now, under different names; three of them say 'reserved' for what this chapter calls committed. | table: The author's alignment of four vendors' terms for physical units, promised units, sellable units, deliberate holds and location. | `additional_support`: The formula as industry practice. → Four vendors' vocabularies aligned to it. |\n| p14 | evidence | Shopify's documentation states the arithmetic outright: on hand is the sum of the available, committed, reserved and held-back states, and incoming is not part of it. | quotation: On hand \"equals the sum of inventory quantities that are in the available, committed, reserved, damaged, safety_stock, and quality_control states\"; POS gained 'On hand' and 'Unavailable' states on 9 February 2023. | `example`: The four vendors' vocabularies. → One vendor's own statement of the sum. |\n| p14a | example | On 5 August 2026 Shopify moved some holds from reserved to committed, so an integration that subtracted reserved in its own calculation changed behavior without a code change: the meaning of a stock state can move under the systems that read it. | fact: Draft-order and transfer holds moved from `reserved` to `committed`; `available` and `on_hand` unchanged. | `additional_support`: Shopify's states and their sum. → A dated change to what one state means. |\n| p15 | claim | Each number has an owner except the derived one: the ERP keeps what the stock is worth, the warehouse owns on hand, the order-taking system owns committed, and nobody should own 'available', because it is a computation; most oversells begin when a system stores it as a fact and lets another overwrite it. |  | `cause_effect`: The numbers, the formula and the vendors' practice. → Who owns which number, and why the derived one has no owner. |\n\n### When a Unit Becomes Promised: Reservations and Allocations\n\n**Controlling idea** (`comparison`, id `promised`): A unit can leave the available number at add-to-cart, at order creation or at fulfillment; the choice is a business one with a cost on each side, and each leaves a window in which two buyers can get the same unit.\n\n**Advances the thesis** (S2): Sets out the three moments and their costs, and shows that even the common default leaves a window of seconds.\n\n**Transition in:** `elaboration`: Committed and reserved as claims against on hand. → The moment at which a claim is made, which the definitions left open.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The claim that the moment is a choice, the vendors' configuration as evidence, the three moments compared, then what the published window means at peak: the comparison table needs the vendors' modes, and the window is the cost of the row most merchants choose.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | claim | The platforms disagree about when a unit leaves the available number (in the cart, at order creation or at the warehouse's allocation), and expose the choice as configuration because it is a business choice with a cost on each side. |  |  |\n| p17 | evidence | commercetools offers three inventory modes per cart and publishes a delay of up to 10 seconds, Adobe Commerce reserves when an order is submitted, and Shopify commits at order creation. | source: commercetools: TrackOnly, ReserveOnOrder, ReserveOnCart (expiry 1 to 44,640 minutes), eventual consistency of up to 10 seconds; Adobe Commerce: reservation at order submission, compensating reservation on cancellation; Shopify: committed at order creation and while on hold. | `example`: The choice exposed as configuration. → Three vendors' documented settings. |\n| p17a | comparison | Each of the three moments protects something different and costs something different: the cart protects the shopper and ties up stock, order creation uses stock best and leaves a window of seconds, and allocation at fulfillment keeps the warehouse flexible and accepts orders it may not fill. | table: Three moments (add to cart, order creation, allocation at fulfillment) against protects, costs and fits.; figure: Figure 3: a unit's life from available through reserved or committed to shipped. | `conclusion_summary`: The vendors' settings. → The three moments side by side: what each protects, what it costs and where it fits. |\n| p18 | analysis | A window of 10 seconds is six orders at Kestrel & Pine's peak rate, enough to oversell a hot item; every platform has such a window and most do not publish it. | reasoning: 38 orders a minute for 10 seconds is about six orders. | `emphasis`: The 'window of seconds' in the order-creation row. → What that window is worth at 38 orders a minute. |\n\n### Many Locations, Many Channels\n\n**Controlling idea** (`explanation`, id `locations`): With stock in several places and promises made in several channels, one physical pool is promised many times, so availability is published per channel with a buffer, and sourcing, allocations and promises against incoming stock become separate decisions.\n\n**Advances the thesis** (S3): Shows why, with more than one location and channel, one figure per channel has to be derived from a shared pool, which is the case for computing it in one place.\n\n**Transition in:** `contrast`: Everything so far: one shelf and one shop. → Several shelves and several shops, as at Kestrel & Pine.\n\n**Order of paragraphs** (`prerequisite_order`): Kestrel & Pine's several stock places first, then the two definitions (location, channel) the rules are stated in, then the three rules, then the two cases that promise stock not on hand: the rules cannot be read before 'per channel' and 'location' mean something.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | context | Kestrel & Pine has neither one shelf nor one shop: its stock sits at Duiven, in six stores and in a marketplace's fulfillment program warehouse. | scenario: Duiven; six stores of about 1,800 variants each; a marketplace fulfillment program warehouse in Germany holding about 40% of the units sold on that marketplace there. |  |\n| p20 | definition | A location is any place from which stock can be promised and shipped, each with its own count and its own counting system; a marketplace's warehouse is the hardest case because the merchant sees its count and cannot check it. |  | `elaboration`: The places where Kestrel & Pine's stock sits. → The term for such a place, and the one the merchant cannot count. |\n| p21 | definition | A channel is a place where a promise is made, availability is published per channel, and one physical pool may be promised to several channels at once. |  | `contrast`: Where stock sits. → Where it is promised, and that one pool serves several such places. |\n| p22 | explanation | Each channel gets its own buffer, largest where an oversell costs most, and because a buffer withholds sellable units it is a business setting. | reasoning: A marketplace oversell brings a seller-performance penalty and, repeated, a suspended listing.; figure: Figure 4: one pool, many promises, with a buffer layer. | `cause_effect`: One pool promised to several channels. → The first rule: availability per channel, with a buffer per channel. |\n| p23 | explanation | Which location fulfills a line is a separate decision from whether the unit is available, and once it needs capacity, cut-off times or carrier cost it belongs to an order management system. | source: Adobe Commerce's source priority and distance priority algorithms; Shopify's fulfillment order. | `additional_support`: The first rule, about channels. → The second rule, about locations: sourcing. |\n| p24 | explanation | Wholesale needs allocations in a second sense of the word: not the warehouse assigning a unit to a placed order, but part of the pool set aside in advance for a customer, a season or a channel, which none of the four platforms holds per customer. | example: A wholesale buyer who ordered 240 jackets for spring should not compete with Friday-evening shoppers. | `additional_support`: The first two rules. → The third rule: an advance claim on the pool for a wholesale customer. |\n| p25 | definition | A backorder and a pre-order promise stock that is not on hand, which is legitimate only if the incoming quantity is tracked and the date is honest. | source: Directive 2011/83/EU, Article 18: delivery within 30 days unless agreed otherwise. | `contrast`: Rules for promising stock that is on hand. → Two cases that promise stock that is not. |\n\n### How the Pieces Fit: The Availability Service\n\n**Controlling idea** (`explanation`, id `service`): The arrangement that keeps one answer per channel separates counting, order-taking and deriving, gives each number one writer, asks for an exact answer only at checkout, and carries stock changes as events instead of scheduled snapshots.\n\n**Advances the thesis** (S3, S4, S2): Describes the one place that computes the figure, the single writer of each number, the exact commit at checkout and the event in place of the scheduled copy.\n\n**Transition in:** `problem_solution`: One pool, several locations and channels, buffers and allocations: several things to combine for every channel. → The arrangement that combines them in one place.\n\n**Order of paragraphs** (`large_to_small`): The components and their writers, then Kestrel & Pine's W1 as that arrangement, then what each interaction needs from it, then the one interaction that must be exact, then how changes should reach it and public examples of both ways: the requirements per interaction presuppose the service, and the event-against-sync comparison presupposes knowing which interactions tolerate lag.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p26 | description | With several locations and channels, counting, order-taking and deriving availability are three responsibilities with one writer per number, connected by stock events, and a reconciliation job compares the service's copies with the systems that count and commit, on a schedule. | table: Four components (stock-counting systems, order-taking systems, the availability service, the reconciliation job) with what each is responsible for, writes and never writes.; figure: Figure 5: the Waypoint target. |  |\n| p27 | example | This arrangement is Waypoint decision W1: the WMS is the system of record for Duiven's physical stock, the POS for store stock, the marketplace program's stock is a tracked external location, and the availability service, which holds a buffer per channel and is reconciled with the WMS on a schedule, is bought as a module of the order management system. | scenario: W1; the service bought as a module of the OMS introduced under W2; the hourly chain retired by Q4 2027. | `example`: The general arrangement. → Kestrel & Pine's version of it, system by system. |\n| p28 | comparison | Different interactions need different freshness from the service, from a cached badge on a listing page to a commit at checkout, and each has a fallback if the service is down. | table: Five interactions (listing badge, add to cart, checkout, marketplace push, click-and-collect) against how fresh, how consistent, how fast and what happens if the service is down; latency targets labeled as the author's assumptions. | `elaboration`: The service that publishes available per channel. → What each step of a purchase needs from it. |\n| p29 | analysis | Checkout is the only interaction where the last unit must go to exactly one order, so it alone asks the service and waits, with an atomic commit; everything else can read a slightly stale copy. |  | `emphasis`: The table of interactions. → The one row the design depends on, and the rule it gives. |\n| p30 | comparison | A stock event differs from a scheduled sync in kind, not only in speed: a sync copies a snapshot that must be applied carefully to a system with its own claims, and an event describes one change that can be applied in order and applied once. |  | `contrast`: Interactions that tolerate a slightly stale copy. → How the copy is kept current: a change sent when it happens against a total copied on a schedule. |\n| p31 | evidence | Public documentation shows both ends and a middle: Shopify polls a fulfillment service hourly, Picqer offers a stock-changed webhook, and Microsoft's Business Central sync compares before it sends. | source: Shopify fulfillment service polling (hourly); Picqer `products.free_stock_changed` webhook; Microsoft Business Central and Shopify inventory sync (2026-10-14). | `example`: Event against scheduled sync. → Three documented products along that range. |\n| p32 | evidence | At group scale the same design appears as one ordered stream of changes per SKU and location, as a 2020 account of Walmart's inventory backend describes. | quotation: \"Each item-store combination always maps to one specific partition, so only one consumer processes it\"; more than ten event sources normalized into one inventory event. | `additional_support`: Small and mid-size examples. → The same idea at the largest scale. |\n\n### The Choices\n\n**Controlling idea** (`comparison`, id `choices`): A growing merchant has four ways to compute availability (the platform's own stock, a stock master with periodic sync, an event-driven availability service, a fulfillment provider's shared pool), and each is right for a stage and a limit at the next.\n\n**Advances the thesis** (S3): Places 'computed by the shop platform' and 'computed by one service' among the realistic options and says when each holds.\n\n**Transition in:** `contrast`: The availability service as the clean arrangement. → That it is one of four options, and not the right one for every merchant.\n\n**Order of paragraphs** (`chronological`): The four options in the order a growing merchant meets them, which is also Kestrel & Pine's own history; the provider's pool comes last because it hands the problem to someone else.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p33 | claim | There are four realistic ways to compute availability, each right for a stage and a limit at the next. |  |  |\n| p34 | description | The platform's own stock fields work while there is one location and the platform is the only system that takes orders. | scenario: Kestrel & Pine in 2016-2018 with its Tiel 3PL. | `sequence`: Four ways. → The first, where most merchants start. |\n| p35 | description | An ERP or WMS as stock master with periodic sync is the common arrangement at the Growing stage, and its limit is structural: the copy is a snapshot, the schedule is a lag, and each hop adds its own clock. | scenario: Kestrel & Pine's January 2027 landscape; the Oversell is what it does at peak. | `sequence`: The platform's own stock. → The second option, which Kestrel & Pine ran in January 2027. |\n| p36 | description | An event-driven availability service, bought or built, costs integration work on every counting and ordering system and the discipline of one writer per state. |  | `sequence`: The stock master with periodic sync. → The third option, W1, and what it costs. |\n| p37 | description | A fulfillment provider's shared pool moves the availability problem to the provider, at the price of the merchant's control over the count and the buffer. | source: Zalando's ZEOS and NEXT, November 2024: \"a unified stock pool and an advanced order management system\"; 24 markets and 18 sales channels by March 2026. | `sequence`: The availability service a merchant runs. → The fourth option, where someone else runs it. |\n\n### Trade-offs\n\n**Controlling idea** (`recommendation`, id `trade-offs`): The four options differ in lag, in the number of writers of 'available', in buffers and allocations, in integration cost and in how they break; keep platform stock until a second system takes orders or counts stock, name the owners before building a connector, and consider a separate service when two of four conditions hold.\n\n**Advances the thesis** (S3, S4): States the condition under which the platform stops being the one place, and why owners are named before a connector is built.\n\n**Transition in:** `elaboration`: The four options one by one. → The same four compared on the criteria that decide between them, then the author's recommendation.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p38a | comparison | The four options compare on five things: how long other channels take to learn of a sale, how many systems write 'available', whether buffers and allocations are possible, what integration costs and how each option breaks. | table: Four options against lag, number of writers of 'available', per-channel buffers and wholesale allocations, integration cost and when it breaks. |  |\n| p38 | recommendation | The author would keep platform stock until another system starts taking orders or counting stock, and then assign owners for physical and committed stock before building the connector, because a connector without that agreement copies two incompatible answers. |  | `cause_effect`: The comparison. → What the author would do, and in which order. |\n| p39 | recommendation | A separate availability service is worth considering when any two of four conditions apply (multiple locations, multiple order channels, location-specific promises, wholesale allocations); Kestrel & Pine met that test in 2023 and built the copying chain instead. | scenario: Kestrel & Pine met the test in 2023; W1 replaces the chain. | `additional_support`: When to leave platform stock. → When to go further, to a separate service, and when a provider's pool suits. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): What is typical, what becomes necessary and what warns that an approach is outgrown change at each of the four scale stages, while three things do not change: one system counts on hand per location, available is derived, and the last unit at checkout is committed atomically.\n\n**Advances the thesis** (S3): Shows the shop platform as the one place at the Starting stage and the service at the Omnichannel stage, with the same three rules at both.\n\n**Transition in:** `elaboration`: 'Each is right for a stage' and the conditions for moving on. → The same advice laid out stage by stage, with warning signs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | analysis | Stock handling changes with scale more than most topics because stock is the fact most systems copy, but at every stage on hand is counted by one system per location, available is derived, and the last unit at checkout is committed atomically. | table: Four stages (Starting, Growing, Omnichannel, Group) against what is typical, what becomes necessary and the warning signs, with Kestrel & Pine's years. |  |\n\n### In Practice\n\n**Controlling idea** (`example`, id `in-practice`): Kestrel & Pine's reconstruction finds three causes of the Oversell (lag by design, several writers, no buffer and no reconciliation), each of which W1 answers without bringing oversells to zero.\n\n**Advances the thesis** (S4, S5): Works the thesis's remedy through the opening case cause by cause, and shows that a buffer and a reconciliation remain necessary.\n\n**Transition in:** `example`: The Omnichannel stage, where a merchant must arrange deliberately what a Starting merchant gets from the platform. → Kestrel & Pine as the merchant at that stage that had not, and the Oversell worked through cause by cause.\n\n**Order of paragraphs** (`problem_solution`): The three causes, each with W1's answer, then the evening replayed with W1 in place. The replay needs all three remedies, and its last sentence (not zero) is what the next section starts from.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | transition | Kestrel & Pine is the Omnichannel merchant that had not arranged these things: the January 2027 reconstruction of the opening scene gave Noor three causes of the Oversell, and W1 answers each. |  |  |\n| p44 | cause_effect | The first cause was lag by design: three hops on their own clocks, up to two hours end to end, which W1 replaces with stock events from the WMS to the availability service. | scenario: 38 orders a minute makes one hour of blindness 2,300 orders. | `sequence`: Three causes. → The first, and W1's answer to it. |\n| p45 | cause_effect | The second cause was several writers: six could change Duiven stock, four of them automated flows into the shop platform, and W1 names one writer per state. | scenario: Six writers: the WMS feed (through the ERP's hourly sync), hand adjustments in the ERP, hand edits in the platform admin, three apps; four automated flows into the platform: the hourly sync and the three apps. | `sequence`: The first cause. → The second, and W1's answer to it. |\n| p46 | cause_effect | The third cause was no buffer and no reconciliation: every channel sold to the last unit and nobody compared the WMS with the platform, as the first weekly reconciliation showed when it ran in May 2027; W1 adds a per-channel buffer and a weekly reconciliation. | scenario: First weekly reconciliation, May 2027: 2.3% of active variants with a different quantity; buffers of 3 units per SKU for marketplaces and 1 for the storefronts (illustrative); reconciliation weekly, daily in November. | `sequence`: The second cause. → The third, and W1's answer to it. |\n| p47 | analysis | Had W1 existed on 27 November 2026, the oversell would have shrunk from 1,340 units to the few that pass through the marketplace's own push interval: no availability design reaches zero, and the goal is a window seconds wide and a deliberate buffer. |  | `conclusion_summary`: The three causes and their remedies. → The evening replayed with all three remedies in place, and what remains. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`explanation`, id `wrong`): Stock integrations fail in a small number of recurring ways, each with a detection and a recovery; the reconciliation job detects most of them, so an integration without one is not finished, and the one failure it cannot detect, a wrong count, needs controls of its own.\n\n**Advances the thesis** (S5): Shows that events and single writers still fail in known ways and that a scheduled comparison of copy with source is what finds the failures.\n\n**Transition in:** `cause_effect`: 'No availability design reaches zero oversells.' → The ways in which even the event-driven design fails, and how each is found and repaired.\n\n**Order of paragraphs** (`large_to_small`): All seven failures, then the control most of them share, then the one failure that control cannot find, with the research that measures it and the two controls that answer it: the count-accuracy paragraphs need the table's last row and the reconciliation job before them, and read earlier (they once opened 'In Practice') they were a topic the section then left.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | description | Seven failures recur in stock integrations (duplicated events, out-of-order events, snapshot overwrite, two writers, a counting system outage, identifier mismatch, a wrong count), and each has a detection and a recovery. | table: Seven failures against what each looks like, how it is detected and how it is recovered. |  |\n| p49 | claim | The reconciliation job recurs in the detection column, and a stock integration without one is not finished, because every delivery mechanism delivers at least once and sometimes not at all. | quotation: Delivery \"isn't always guaranteed\"; \"use reconciliation jobs to periodically fetch data\". Waypoint W5 makes a reconciliation job a condition of every integration. | `conclusion_summary`: The detection column of the table. → The one control most of the failures share, and the vendor instruction and Waypoint decision that require it. |\n| p41 | evidence | A reconciliation compares every copy with the count and cannot tell whether the count itself is right, and published research finds it often is not: a 2008 study of one US retailer found 65% of nearly 370,000 inventory records inaccurate, and later reviews report 20% to 67%. | statistic: 65% of nearly 370,000 records inaccurate across 37 stores of one US retailer; 20% to 67% across later studies. | `contrast`: The reconciliation job, which compares copies with the systems that count. → The one failure in the table it cannot find: a wrong count, and how common that is. |\n| p42 | explanation | Count accuracy therefore needs its own controls beside the integration: cycle counting, which checks part of the physical stock on a rolling schedule, and safety buffers for the uncertainty that remains. |  | `problem_solution`: How often the counted fact is wrong. → The two controls that answer it: cycle counting and a buffer. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The five numbers, the moment of promise, the per-channel figure and the failures are one answer seen from four sides: there is one counted fact per location and everything else is a claim on it or a calculation from it, so the only decisions are who writes each number, how fast a change travels and what compares the copies. For the part: the season typed four times, the Price Drift, the Stacking Bug, the jacket nobody could find and the Oversell are one problem, a value shown or used by a system that did not own it with nothing comparing it to the system that did, and each chapter's remedy has the same three parts.\n\n**So what:** A merchant can write the ownership of each stock number down before any product is bought, and the same list (owner, who may write, how each channel learns of a change, what compares the copy with the source) can be made for product content, price and discount; none of Kestrel & Pine's 2027 remedies replaces the shop platform.\n\n**Callback:** The introduction's web shopper and store customer who try to buy the last jacket in the same minute; and, for the part, the part opening's product page where a description, a price and a stock badge sit side by side and change at different speeds. The first paragraph of the conclusion returns to the two buyers and says what decides which of them gets the jacket; paragraph p54a returns to the part's product page and, with p54b, performs the part's closing.\n\n**Takeaway** (`course_of_action`): Write down who owns each stock number before the first connector is built, size the buffer per channel from measurement, and take the eight questions to your own company; then, for product content, price, discount and stock, write down the owner, who may write, how each channel learns of a change and what compares the copy with the source, starting with stock.\n\n**Hand-off** to [Part III — ORDER: Cart, Checkout, Payment and the Order Record](part-3.html): `sequence`: The catalog's facts: product, price, promotion and availability. → The step at which those facts are fixed into an order and money is taken.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50a | synthesis | The web shopper and the store customer of the opening can both be told 'yes' only while each channel keeps its own number; with one counted fact per location, one writer for each claim on it, one place that derives what each channel may sell and a commit at checkout that gives the unit to exactly one order, one of them gets the jacket and the other is told in time. | reasoning: The opening's two buyers of one jacket set against the chapter's answer. |  |\n| p50 | synthesis (list) | Established: on hand is a counted fact owned by one system per location and available is derived; when a unit becomes promised is a configurable business choice; counted stock is often wrong and delivery of stock changes is at least once at best. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what vendor documentation and research establish. |\n| p51 | synthesis (list) | Depends on context: whether platform stock, a periodic sync, reserve-on-cart or a bought, built or provider-run availability service fits depends on how many systems take orders and count stock, on the interval and on the kind of sale. |  | `contrast`: What is established. → What changes with the merchant's situation. |\n| p52 | recommendation (list) | The author's synthesis: who owns the stock number must be answered in writing before the first connector is built, and the per-channel buffer should be sized from measured count error and lag. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p53 | recommendation (list) | Eight questions let the reader find, in their own company, the owner and writers of each stock number, the moment of promise, the path and lag between channels, the buffer, the last reconciliation and the fallback at checkout. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own company. |\n| p54a | synthesis | Part II opened with a product page where a description, a price and a stock badge sit side by side, and its five incidents (the season typed four times, the Price Drift, the Stacking Bug, the jacket nobody could find, the Oversell) are one problem: a value shown or used by a system that did not own it, with nothing comparing it to the system that did. | reasoning: The part opening's product page set against the five chapters' incidents. | `conclusion_summary`: This chapter's answer about stock, the fastest-changing of the catalog's facts. → What the five chapters of Part II say together, set against the part opening's product page. |\n| p54b | recommendation | Each chapter's remedy has the same three parts (one writer per fact, a declared path to each channel, a comparison of every copy with its source), none of which replaces the shop platform, so a reader can write down, for product content, price, discount and stock, the owner, who may write, how each channel learns of a change and what compares the copy with the source, starting with stock. | reasoning: Kestrel & Pine's 2027 remedies: an ownership table per fact, events in place of scheduled copies, and reconciliations. | `problem_solution`: The one problem behind the five incidents. → The remedy the five chapters share, and the list the reader can make for their own company. |\n| p54 | transition | Eva's unit will be committed to her order and to nobody else's, and Part III follows that click: the step at which the product, the price, the discount and the available unit are fixed into an order and money is taken. |  | `sequence`: The catalog's facts: product, price, promotion and availability. → The step at which those facts are fixed into an order and money is taken. |\n\n## Non-goals\n\n- Cart and checkout orchestration, including what the cart calls and when. See [From Cart to Confirmation: Checkout Orchestration](cart-and-checkout.html).\n- Order sourcing and routing rules in depth, split shipments and the order management system as a product category. See [The Order Record: Lifecycle, State and the Order Management System](order-management.html).\n- Warehouse operations: receiving, picking, cycle counting mechanics, the fulfillment order contract. See [Pick, Pack, Ship: Warehouse Management and Fulfillment](warehouse-and-fulfillment.html).\n- Store stock, click-and-collect and ship-from-store mechanics; marketplace stock allocation mechanics and fulfillment programs as channels. See [Stores Are Systems Too: Point of Sale and Omnichannel Fulfillment](stores-and-omnichannel.html), [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html).\n- Idempotency, outbox, retries and reconciliation design in depth; bounded contexts and the entity-owner table. See [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html), [Who Owns the Truth: Boundaries, Bounded Contexts and Systems of Record](boundaries-and-systems-of-record.html).\n- Inventory valuation and purchasing; wholesale commercial terms. See [The Back Office: ERP Integration and Who Is the Hub](erp-and-back-office-integration.html), [Selling to Businesses: Accounts, Contract Prices, Quotes and Approvals](b2b-commerce.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The Shopify changelog adding `safety_stock`, `damaged` and `quality_control` (2023) could not be fetched; the chapter says so. Re-verify when the page is available.\n- The ASCM/APICS ATP definition is paraphrased as industry practice, not quoted; replace with a quotation if the dictionary becomes fetchable.\n- The illustrative per-channel buffers (3 marketplace, 1 storefront) and the 790/550 channel split of the Oversell are ledger additions of this chapter; later chapters (marketplaces, peak-day journey) should reuse rather than restate them.\n- The stock chain's hops as the ledger gives them (WMS to ERP every 15 minutes, ERP to shop platform hourly, shop platform to connector hourly) add up to 2 hours 15 minutes, more than the stated 'up to two hours'. This is an open ledger question and was not resolved here: the chapter keeps the published wording ('up to two hours') in the scene, Figure 1's caption, the failure-pattern callout and Cause 1. The author decides in the ledger first.\n- The journal spec assigns Part II's closing to this chapter and the published chapter had no such paragraph. Paragraph p54a was added to the spec and the prose to perform it (synthesis, so-what, callback to the part opening's product page, take-away). It names the five incidents as the journal spec's closing does and adds no figure. The author should check its wording against the Part II introduction once that page has been through the same pass.\n- The next page, the Part III introduction (part-3), is still at `outline` in the journal spec and has no transition_in of its own; the hand-off uses the transition_in of the part (sequence: the catalog's facts, then the step at which they are fixed into an order and money is taken). That is enough to write the hand-off but gives no hook to hand to; revisit p54 when Part III is brought to full detail.\n- The published chapter had no conclusion paragraph that synthesizes and returns to the opening; p50a was added, built only from statements the chapter already makes.\n- Flow rubric, first run (sound with notes), notes not taken. (a) The scene's four-hour order queue is not among the three causes of the worked example; it is answered by the 'counting system outage' row of the failure table, and was left there. (b) Merge the vendor table paragraph (p13) with Shopify's arithmetic (p14): kept apart, because p14 sets up the dated change in p14a. (c) Cut the inventory valuation paragraph (p25a) as a boundary remark: kept, it is the author's text and says which stock number the commerce side should not hold. (d) The one-paragraph stages section repeats the three constants: kept, the stage table is the book's house format. (e) The 'Where we are in the order's journey' paragraph (p04) interrupts the line from the claim to the roadmap: it is a fixed element of every chapter and was placed before the roadmap, as in chapters 1 and 2. (f) The vendor paragraph p17 gives no documented example of allocation at fulfillment; none is in the sources, so none was added. (g) The lag of the three hops is restated in the choices (p35) and the worked example (p44): kept, each is one clause.\n- Flow rubric, second run (sound with notes), notes not taken. (a) Move the Walmart account (p32) to the one-paragraph stages section: kept with the other public examples of events against scheduled sync. (b) Shorten the stock-master option (p35) to a pointer back to the scene: kept as the author wrote it. (c) The first reconciliation is dated May 2027, after the January 2027 reconstruction that opens the scene; both dates are the ledger's, and the worked example is told from after W1.\n- Flow rubric, third run (sound with notes), notes not taken: move the Walmart account (p32) to the stages section (asked a second time; kept with the public examples of events and scheduled sync); merge the signpost paragraph p43 into the first cause (kept: it now carries the link from the stages to the worked example); 'allocation' at fulfillment is used in the promised section before the locations section sets the wholesale sense against it; the marketplace's own push interval in the replay (p47) is given only in the requirements table.\n- Round 1 of the draft check, single-reader findings left as they are: the four-hour queue backlog is not placed on the scene's timeline; the scene says three apps could write inventory and gives a March incident, not what the app .; A new subheading for the count-accuracy paragraphs.\n- **2026-11-12** — Second flow run (sound with notes), taken without review as the author asked: the valuation paragraph (p25a) moves from the locations section to the end of the five-numbers section, where it is the third ownership statement after on hand and committed (the first run had found it the weakest fit in the locations section); the W1 paragraph (p27) says the service holds a per-channel buffer and is reconciled with the WMS on a schedule, so the worked example replays W1 and does not extend it; the flow rationale says why the moment of promise precedes locations, why the stages precede the practice section, and where the count-accuracy research sits. Rejected: Cutting the valuation paragraph.; Moving the Walmart account to the stages section.\n- **2026-11-12** — The author asked for the flow rubric's notes to be taken without review (auto mode). Before the first run: the 'Where we are' paragraph (p04) was put before the roadmap (p03) and now starts from the search result of the previous chapter, as this chapter's transition_in asks; the roadmap announces every section; Shopify's arithmetic and its dated change of a state's meaning are two paragraphs (p14, p14a); the comparison of the three moments has its own lead-in (p17a), as does the trade-off table (p38a); inventory valuation is its own paragraph (p25a); a synthesis paragraph that returns to the opening (p50a) and the part closing were added to the conclusion. From the first run: in 'In Practice' the research on count accuracy now comes before the controls that answer it (p41, p42); the reconciliation job is said in a sentence where the service is introduced (p26); the second sense of 'allocation' is flagged where it appears (p24); the part closing is two paragraphs, the diagnosis (p54a) and the remedy with the take-away (p54b); the roadmap names the trade-offs; the flow rationale says why trade-offs precede stages, why W1 appears before the choices, and no longer calls the failures those of the recommended design only. In this chapter Kestrel & Pine's hosted product is 'the shop platform'. Rejected: Changing any section heading or the order of sections.; Renaming one of the two senses of 'allocation'.; Cutting the valuation paragraph or the one-paragraph stages section.\n- **2026-11-12** — Reconstructed the spec from the published chapter, one paragraph per unit (check_draft.py units). Intent outcome, acceptance criteria AC-1 to AC-5, thesis and role are copied from the journal spec unchanged. Of the old spec.md's eight success criteria, the first (every term defined from the chapter alone, every acronym expanded) is kept as AC-6, a known_before_new criterion at minor severity, for the author to keep or drop; the second (business problem before any component) is met by the section order and dropped as a criterion; the other six were inventories of tables, diagrams and sections and are dropped. The length limit is 6,500 words, the cap the old spec referred to (writer brief and style guide); the published text had 5,600. Rejected: Carrying the inventory criteria over as custom criteria.; Setting the limit to the published length.\n- **2026-11-07** — Made the Oversell reconstruction (an illustrative timeline with ledger totals) the opening scene rather than a vocabulary lecture, so the business problem precedes every term. Rejected: Opening with the ATP formula.\n- **2026-11-07** — Chose four options (platform stock, stock master plus sync, availability service, provider pool), because the Growing-stage reader's real choice is the second option and the Group-stage reader's is the fourth. Rejected: A two-way 'sync vs events' framing.\n- **2026-11-07** — Kept the vendor evidence inside the explanatory sections and reduced 'In Practice' to the one empirical finding (DeHoratius and Raman) plus the worked example, to stay within the length cap without dropping evidence.\n- **2026-11-07** — Left sourcing rules, split shipments and the OMS to chapter 13, and idempotency and reconciliation design to chapter 25, naming both at the handoff points rather than re-teaching them.\n\n## Sources\n\n- **Internal**\n  - meet-kestrel-and-pine and _research/scenario-ledger.md — The systems landscape, the sync chain, the Oversell and the App That Wrote Stock, W1; the 790/550 split, the buffers, the May 2027 reconciliation.\n  - _research/consistency-issues.md, ruling 22 — Six writers of Duiven stock in January 2027, four of them automated flows into the shop platform.\n  - journal-spec.json (part-2 closing; part-3 transition_in) — The part closing this chapter performs and the hand-off to Part III.\n  - boundaries-and-systems-of-record — The system-of-record idea the chapter uses for on hand.\n  - order-management — Sourcing, split shipments and the OMS whose module hosts the availability service.\n  - events-consistency-and-reconciliation — Idempotency, ordering and reconciliation, referenced not re-taught.\n  - _research/brief-inventory-fulfillment-returns.md (Part 1), _research/brief-integration-and-data.md (Parts 1-2, 5.3), _research/brief-shopify.md (4.4, 5.4) — The factual base.\n- **External**\n  - Shopify developer documentation and changelogs (inventory quantities; POS states 2023-02-09; reserved to committed 2026-08-05; fulfillment services; webhooks) — Vocabulary, arithmetic, semantics change, hourly polling, delivery not guaranteed.\n  - commercetools API documentation (inventory, carts, inventory APIs overview) — Inventory modes, reservation expiry, 10-second window.\n  - Adobe Commerce Inventory Management documentation (2026-08) — Sources, stocks, reservations, sourcing algorithms.\n  - SAP Commerce 2205 StockService Javadoc (2022) — Reserve and release per warehouse.\n  - Microsoft Learn, Business Central and Shopify inventory sync (2026-10-14) — Compare-then-send sync.\n  - Picqer API documentation — Stock-changed webhook.\n  - Confluent blog, Walmart inventory (2020-05-04 n the connector, corrected the ZEOS quote, removed the internal research-brief citation and ledger references, confirmed the 41-app count (ruling 10), made the post-Waypoint stock path explicit (WMS events via the iPaaS, not the ERP).\n- **2026-11-07** — Initial spec and article.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);

                sectionEl.appendChild(document.createTextNode(postId));

        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
