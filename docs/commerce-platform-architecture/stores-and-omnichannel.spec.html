<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/17-stores-and-omnichannel/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (a thesis paragraph, a roadmap, and a conclusion paragraph that answers the opening); these are listed in decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The four things a store adds (an order source, a stock location, a customer list, a payment path) and the two constraints a web shop lacks: offline operation and fiscal rules, with how those rules differ in Germany, Belgium, Italy and the Netherlands.\n- **Know:** The four cross-channel services and the three problems they share: availability, sourcing and staff tooling.\n- **Know:** The four ways to connect stores (the platform's POS, a specialist POS by events through the order hub, a specialist POS by nightly batch through the ERP, the ERP's POS) and where each fits.\n- **Believe:** Store stock may be promised only with a buffer, a confirmation or a count behind it; the store's confirmation, not the online promise, is the commitment.\n- **Believe:** 'Unified commerce' is a goal state that one platform or an order hub with an identity layer can reach, not a product.\n- **Be able to:** Look at a click-and-collect pilot and say where the promise is made, where the commitment is made and how old the store stock behind it is.\n- **Be able to:** Choose between the platform's POS and a specialist POS by the number of fiscal regimes and the weight of the stores.\n\n**Audience:** Readers new to commerce architecture; most of all the product manager or engineer asked to 'add click-and-collect' to a web shop, the head of operations who owns stores and is being sold 'unified commerce' (Daniel Okafor at Kestrel & Pine), and the architect weighing a POS replacement (Noor Visser).\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its six stores, its 2026 and January 2027 incidents in outline (the Store Stock Mirage, the Double Refund, the Price Drift among them) and the names of the sixteen failure patterns.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines (money, goods, returns), 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, business models and the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Part II: available-to-promise (on hand minus committed minus allocations), one writer each for on hand and committed, per-channel buffers; one pricing source.\n- From Part III: checkout creates the order once; one writer and a key for every refund; the order's one home with three status lines, goods status per shipment, routing and sourcing, and the fulfillment order.\n- From the earlier chapters of Part IV: the warehouse system as the only writer of on-hand stock, the fulfillment order it accepts or rejects, its cut-off, capacity and backlog; one normalizing layer for carriers, each parcel booked once, scans mapped to one vocabulary, and a delivery promise computed from cut-off, backlog, stock location and lane transit plus a margin.\n\n**Does not yet know:**\n\n- Offline capture at the till and who carries the risk of an offline card payment; the terminal provider.\n- Fiscalization; the German technical security device (TSE) and sequential transaction numbers; Belgium's registered cash register (GKS); telematic receipts in Italy.\n- Click-and-collect (BOPIS), ship-from-store, return-in-store, endless aisle as named services; staff tooling.\n- Store inventory record accuracy; RFID; exception-driven cycle counting.\n- Unified commerce as vendors define it; P2PE, semi-integrated terminal and PCI DSS scope.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a collection promise made from a nightly copy of store stock, the reader explains the broken promises and names the fixes that need no new system. *Probe:* A web shop offers 'available for collection today' at one store, based on store stock copied to the back office every night, and in one month promises 37 items the store had already sold. Using only this chapter: why did this happen, and what would have prevented most of it before any new system? | `custom` | cold_reader | major |\n| AC-2 | Given a first store in a new country and a platform vendor's POS offer, the reader names the check that comes first and what decides between the two kinds of POS. *Probe:* A Dutch brand with stores in the Netherlands and Belgium plans its first store in Germany, and its platform vendor offers its own POS. Using only this chapter: what must be checked first, and what decides between the platform's POS and a specialist POS? | `custom` | cold_reader | major |\n| AC-3 | The reader can say what prevents a web order returned at a store counter from being refunded twice. *Probe:* A web order is returned at a store counter; the till refunds the card, and the returns portal, seeing the item received, refunds it as well. Using only this chapter: what rule prevents this? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What does a physical store add to the architecture, and how do click-and-collect, ship-from-store, return-in-store and endless aisle work?\n\n> **Claim:** A store adds an order source, a stock location, a customer list and a payment path that must keep working offline and meet each country's fiscal rules. Click-and-collect, ship-from-store, return-in-store and endless aisle act on another channel's stock or orders, so all four need store stock sent to availability as events, net of a per-variant buffer, a location chosen by the order hub, and staff tools; a promise against store stock is committed only when staff confirm it.\n\n**Disputed by:** The view that a store is a sales channel with a till, that omnichannel services are features switched on in the platform or bought as 'unified commerce', and that the first step is to replace the stores' POS with the platform's own.\n\n**So what:** In December 2026 Utrecht's click-and-collect pilot promised 37 items the store had already sold, because the platform read the ERP's nightly copy of store stock and the e-mail to the store was the only commitment. The interim fix (a two-unit threshold per variant, a staff confirmation and 'collection today, we confirm within two hours') costs nothing to build, and Waypoint's W4 decision defers the till choice to 2028, when availability and the order hub are in place and only the till product remains to choose. A merchant that accepts the claim decides who owns store stock and where the commitment sits before its first cross-channel promise, and chooses the till by its countries and the stores' share of sales.\n\n**How and why:** A till must keep selling when its connection drops, so for those hours the store is its own system of record and its sales reach the other systems late; and some countries prescribe how a sale is recorded (Germany requires a certified security device and sequential numbers), which can rule a POS product out. Store stock records are often wrong (65% of nearly 370,000 records in a 2008 study of 37 stores) and a nightly copy makes them older, so a promise at face value breaks; a buffer absorbs the lag and a person's confirmation catches the missing unit before the customer travels. Each service sends work to a location and hands it to staff, so availability, sourcing and staff tooling are needed whichever POS runs.\n\n**Supporting claims**\n\n- **S1** — A store adds four things the architecture must model, each with a named owner: an order source, a stock location, a customer list and a payment path.\n- **S2** — Two constraints make a till a different product from a web checkout: it must keep selling offline, which makes the store its own system of record for those hours, and it must meet each country's fiscal rules, which can rule a POS product out.\n- **S3** — Click-and-collect, ship-from-store, return-in-store and endless aisle each act on another channel's stock or orders, so all four need the same three things: store stock sent to availability as events, a location chosen by the order hub, and tools for store staff.\n- **S4** — Store stock records are often wrong and a nightly copy makes them older, so store stock may be promised only with a buffer, a confirmation or a count behind it, and the commitment is the store's confirmation, not the online promise.\n- **S5** — The POS is chosen by the number of fiscal regimes and the stores' weight, and the joins come before the till: they are the same work whichever POS runs, which is why Waypoint's W4 defers the till to 2028.\n\n## Role in the part\n\nAdds the store as a witness of stock and sales that works offline and under fiscal rules, and separates the promise against store stock from the commitment a person at the store makes. Supports P4-1, P4-3, P4-4 of part `part-4`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to the body: the Store Stock Mirage and the deferred till decision first, then what a store adds and how the joins answer the Mirage; `comparison` in choices and stages: four ways to connect stores on the same criteria, then by scale stage)\n\nThe Utrecht pilot and W4 come first so that every later term arrives as part of the answer to 'why did the shop promise 37 items the store had already sold, and why not just change the till'. What a store adds, with its two constraints, comes next because the components, the services and the POS choices all refer to the store as order source, stock location, customer list and payment path, and the offline and fiscal rules are what later limit the platform's POS. How the pieces fit follows: the components and the four services need the store's four contributions, and the section ends on what store stock is worth as a promise and the interim fix, which closes the Mirage opened in the scene. The four ways to connect stores come after the joins, because the comparison is about which arrangement provides the joins and the fiscal and offline rules already explained; W4's deferral is named after the comparison table as its outcome, and the section ends on 'unified commerce', the vendor term under which the first two options are sold. The stages place the choices by scale; In Practice shows them with outside programs and documentation and ends on the Utrecht pilot before and after; the failures come last because every arrangement, the chosen one included, meets them. Moving the choices before the joins would compare tills before the reader knows what they must connect to; moving the store-stock evidence before the services would justify a buffer before the reader has met the promise it protects. The stages come before In Practice so that the examples can be read against a stage the reader already has.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A shopper brings a web order to a nearby store for an exchange. The store's point of sale (POS), its till software and hardware, must find the purchase, work out the amount paid and record the returned item; if the online platform holds those facts separately, staff may have to reconstruct the transaction by hand.\n\n**Bridge:** Anyone who has returned an online purchase at a shop counter has seen the till either find the order at once or not at all; the previous chapter has just delivered Eva's jacket to her door from the warehouse. → A store is a second system with its own orders, stock, customers and payments, and the services that cross channels depend on what it tells the other systems and how fast.\n\n**Thesis statement** (KEY POINTS callout and paragraph p04): A store adds an order source, a stock location, a customer list and a payment path that must keep working offline and meet each country's fiscal rules. Click-and-collect, ship-from-store, return-in-store and endless aisle act on another channel's stock or orders, so all four need store stock sent to availability as events, net of a per-variant buffer, a location chosen by the order hub, and staff tools; a promise against store stock is committed only when staff confirm it.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p05):\n\n- Start from Kestrel & Pine's Utrecht pilot, the Store Stock Mirage and the deferred till decision. *Kept in:* scene.\n- Show what a store adds to the architecture and its two constraints, offline operation and fiscal rules. *Kept in:* adds.\n- Show how the pieces fit, how the four cross-channel services work and what store stock is worth as a promise. *Kept in:* pieces.\n- Compare the four ways to connect stores, say what 'unified commerce' means, and show how the answer changes by scale stage. *Kept in:* choices, stages.\n- Show the practice and the Utrecht pilot before and after, and how stores fail. *Kept in:* in-practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A shopper who brings a web order to a store for an exchange needs the till to find the purchase, the amount paid and the returned item; if the shop platform holds those facts separately, staff rebuild the transaction by hand, so a service that sounds simple needs systems to cooperate. | scenario: A web order brought to a nearby store for an exchange. |  |\n| p02 | explanation | Separate store and online records work while each channel sells only its own stock; store pickup, shipping from a store or a counter exchange makes one channel act on another channel's stock or order, and those facts must arrive before the next commitment, or the merchant sells the same unit twice or refunds the wrong amount. |  | `contrast`: The exchange at the counter that needs the online facts. → When separate records are enough and the moment they stop being enough. |\n| p03 | context | So far Eva's order has stayed within one channel: her jacket travels from the Duiven warehouse to her Nijmegen door on a promise computed from the warehouse's cut-off and the carrier's lane; Kestrel & Pine's Nijmegen store could have offered other routes (pickup, dispatch from its shelf, a counter exchange from M to L), and this chapter explains what those routes would require. |  | `contrast`: One channel acting on another channel's stock or order. → Eva's order, delivered from the warehouse on a computed date, against the routes that would run through a store. |\n| p04 | claim | A store adds an order source, a stock location, a customer list and a payment path that must keep working offline and meet each country's fiscal rules; the four cross-channel services all need store stock sent to availability as events net of a per-variant buffer, a location chosen by the order hub and tools for staff, and a promise against store stock is committed only when staff confirm it. |  | `problem_solution`: Eva's routes through a store and what they would require. → The chapter's answer: what a store adds and what every cross-channel service needs. |\n| p05 | transition | The chapter starts from Kestrel & Pine's Utrecht pilot and its deferred till decision, then shows what a store adds and its two constraints, how the pieces fit and what store stock is worth as a promise, the four ways to connect stores and what 'unified commerce' means, how the answer changes with scale, the practice and the failures, with evidence from Kestrel & Pine's stores, vendor documentation, four countries' fiscal rules and store-inventory research; neighbouring chapters own available quantities, order coordination and customer records. |  | `sequence`: The answer stated in general. → The order in which the chapter develops it. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: The Utrecht Pilot and a Deferred Decision\n\n**Controlling idea** (`context`, id `scene`): Kestrel & Pine's stores sell from a POS whose stock reaches the shop platform only through a nightly ERP copy, so the Utrecht click-and-collect pilot promised 37 items already sold, and Waypoint fixes what the store tells the other systems before changing the tills.\n\n**Advances the thesis** (S4, S5): Gives the case the thesis answers: a promise from a nightly copy with no commitment, and a till decision deferred behind the joins.\n\n**Transition in:** `elaboration`: The roadmap's first promise: the Utrecht pilot and the deferred decision. → Kestrel & Pine's stores as they stood in January 2027.\n\n**Order of paragraphs** (`chronological`): The stores and their systems as they stood, the 2026 pilot, December's broken promises, then February 2027's decision, which says what the decision has in common; each step depends on the one before.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | context | Kestrel & Pine's six stores hold about 1,800 variants each, produced €6.0 million from 118,000 transactions in 2026 (about €51 per receipt), and run a cloud POS chosen in 2019 with a separate card-terminal provider. | fact: Six stores, 1,800 variants each, 118,000 transactions, €6.0 million, about €51 per receipt; a cloud POS since 2019 and a separate terminal provider. |  |\n| p07 | context | Store stock reaches the ERP once a night, and no integration connects the POS to the shop platform. |  | `elaboration`: The stores' own POS. → How, and how slowly, its stock reaches the other systems. |\n| p08 | description | The Utrecht click-and-collect pilot relied on people: the shop platform checked last night's ERP copy of store stock and e-mailed the store, and staff checked the shelf and contacted the customer. |  | `cause_effect`: Store stock that reaches the shop platform only through a nightly copy. → A pilot that promises store stock on that copy. |\n| p09 | example | In December 2026 the pilot promised 37 items the store had already sold: the Store Stock Mirage, a stale-stock failure in which the shop platform accepted orders without knowing what the till had sold that day. | case: The Store Stock Mirage: 37 promised items already sold, December 2026. | `cause_effect`: The pilot's nightly copy and e-mail. → What it produced in December. |\n| p10 | context (list) | In February 2027 Noor Visser and Daniel Okafor considered replacing the POS with the shop platform's own till; Waypoint instead fixes what the store tells the other systems before committing to new tills: W1 makes the POS the owner of store stock sending changes as they happen to an availability service, W2 brings channel orders into a bought OMS with stores later, and W4 keeps the shop platform and evaluates its POS in 2028. | fact: W1, W2 and W4 as they bear on stores. | `problem_solution`: The Mirage. → The obvious fix, a new till, and the decision Kestrel & Pine took instead. |\n\n### What a Store Adds to the Architecture\n\n**Controlling idea** (`definition`, id `adds`): A store adds four things the architecture must model (an order source, a stock location, a customer list, a payment path) and two constraints a web shop lacks: it must keep selling offline and it must meet each country's fiscal rules.\n\n**Advances the thesis** (S1, S2): Defines the store's four contributions and the two constraints that make a till a different product.\n\n**Transition in:** `elaboration`: What the store tells the other systems. → Everything a store adds to the architecture, and its two constraints.\n\n**Order of paragraphs** (`large_to_small`): The whole list first, then why the two constraints matter, then each constraint in turn with its evidence and its consequence; the fiscal rule last because it leads straight to the POS choice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | In plain words, a store adds four things the online architecture must take into account (a second order source, a stock location per store, a second customer list, a second payment path) and two constraints it has never had to live with (offline operation and fiscal rules). | table: What the store adds, what it means for the architecture, and the chapter that owns each concept. |  |\n| p12 | explanation | The two constraints make a POS a different kind of product from a web platform: a web checkout can refuse to work when a dependency is down and a till cannot, and in some countries, Germany among them, a store sale must be signed by a certified device and numbered, so 'just use the platform's POS' is sometimes not available. | figure: Figure 1: a store and a web shop side by side, the store with an unplugged cable and an official seal. | `elaboration`: The two constraints in the table. → Why they make a till a different product. |\n| p13 | explanation | When a till loses its connection it may record sales locally and upload them later, so the merchant must know which sales it may accept, which payment results stay uncertain and how long records can wait. |  | `sequence`: The first constraint, offline operation. → What a till does without a connection. |\n| p14 | evidence | Vendors document what their POS does offline: Shopify captures offline card payments after reconnection, with a daily limit and declines that surface only later, and Square's offline payments expire after 72 hours with the merchant responsible for them. | quotation: Shopify help pages: offline card payments 'captured after your device reconnects', reconnect 'ideally within 24 hours'; Square: offline payments 'expire after 72 hours', 'You're responsible for any expired, declined, or disputed payments'. | `example`: The questions an offline till raises. → What two vendors document. |\n| p15 | analysis | For the hours a store is offline it is an independent system of record for sales and stock: its transactions need identifiers that never collide, its stock changes arrive late in a batch, the merchant carries the risk of a declined card, and any online promise against its stock is a guess. |  | `cause_effect`: Offline capture and its limits. → What that makes the store for those hours. |\n| p16 | definition | Fiscalization is a legal requirement that every sale be recorded in a way the tax authority can verify; its form differs by country (Germany, Belgium, Italy, the Netherlands), and the differences decide which POS products can be used where. | table: Fiscal mandates for retail stores in Germany, Belgium, Italy and the Netherlands, with mechanisms, dates and sources. | `sequence`: The first constraint, offline operation. → The second, fiscal rules. |\n| p17 | analysis | For Kestrel & Pine the fiscal point is specific: its Dutch stores and Antwerp face no certified-register mandate, but a first German store would need a POS with a registered TSE, so a store opening in a new country is a POS decision as much as a logistics one. |  | `cause_effect`: The fiscal table. → What it means for Kestrel & Pine's stores and a German one. |\n\n### How the Pieces Fit Together\n\n**Controlling idea** (`explanation`, id `pieces`): The four cross-channel services are the same three problems (availability, sourcing, staff tooling) solved against store stock, and because store stock records are often wrong and a nightly copy older, the online promise needs a buffer and the store's confirmation is the commitment.\n\n**Advances the thesis** (S3, S4): Shows what all four services need and why a promise against store stock is committed only by the store.\n\n**Transition in:** `sequence`: The four things a store adds and its two constraints. → How they connect to the rest of the landscape, now and in the target.\n\n**Order of paragraphs** (`large_to_small`): The landscape as it is and as it should be, then the four services and their shared problems, then the click-and-collect flow where the commitment sits, then the evidence that justifies the buffer and the confirmation, ending on Utrecht's interim fix.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | description | Kestrel & Pine's January 2027 landscape is the shape many Growing-stage merchants have when they open stores: a POS chosen for the stores, an ERP as the meeting point, and the shop platform on the other side of a nightly copy. | figure: Figure 2: Kestrel & Pine's stores in January 2027. |  |\n| p19 | description | The target shape differs in two places, store stock as events into one availability calculation and every store order through one order hub, and gives each component (POS, terminal provider, availability service, OMS, staff tooling, customer record) one responsibility and one owned record; these connections between the store and the other systems are what the chapter calls the joins. | table: Components, responsibilities, what each owns and the state at Kestrel & Pine. | `contrast`: The January 2027 landscape. → The target and its components. |\n| p20 | definition | Click-and-collect, ship-from-store, return-in-store and endless aisle differ in where the order is placed, which stock is used and where the goods are handed over, and each needs specific things from the architecture. | table: The four services: order placed, stock used, handover and what each needs. | `sequence`: The target components. → The services they serve, vocabulary first. |\n| p21 | analysis | Each service is a promise against stock somewhere else, and all four are the same three problems in a different order (availability, sourcing, staff tooling), with requirements for freshness, consistency, speed and offline behaviour that differ by service. | table: Requirements per flow: freshness of store stock, consistency, speed, behaviour when the link is down. | `elaboration`: Four services and their needs. → The three problems they share and how the requirements differ. |\n| p22 | claim | With the OMS and the availability service in place, click-and-collect runs from till sales as stock events through a buffered promise and an order the hub routes to the store; the storefront's 'available for collection' is the promise, the store's 'picked and confirmed' is the commitment, and the customer hears 'ready' only after the second, the order the Utrecht pilot lacked. | figure: Figure 3: click-and-collect with the joins in place. | `example`: The three shared problems. → One service, click-and-collect, traced through the target. |\n| p23 | evidence | Store inventory records are wrong far more often than people assume: DeHoratius and Raman found 65% of nearly 370,000 records from 37 stores inaccurate, and because the data come from one US retailer before RFID, the reader should take the mechanism rather than the number. | statistic: 65% of nearly 370,000 inventory records from 37 stores of one retailer inaccurate (Management Science, 2008). | `cause_effect`: A promise with a buffer and a store confirmation. → Why both are needed: what store stock records are worth. |\n| p24 | evidence | Auburn's 2018 RFID study found barcode-based order audits wrong in 69% of cases against under 0.01% with RFID; both sources are old and nothing newer with an open method was found. | statistic: 69% of audited orders with barcode-data errors against under 0.01% with RFID (Auburn RFID Lab, Project Zipper, 2018). | `additional_support`: One old study and the warning about its age. → A second, on what RFID changes. |\n| p25 | recommendation (list) | There are four ways to make a store-stock promise honest, in rising order of cost: a per-store safety threshold, a confirmation step, exception-driven cycle counting and RFID. |  | `problem_solution`: Store records that are often wrong. → The ways to promise against them honestly. |\n| p26 | example | Kestrel & Pine's interim fix for Utrecht, until the availability service arrives, is the first two (a threshold of two units per variant per store and a staff confirmation before 'ready'), which costs nothing to build and would have prevented most of the 37. | figure: Figure 4: the Store Stock Mirage and its interim fix. | `example`: The four ways. → The two Kestrel & Pine applies at Utrecht. |\n\n### The Choices\n\n**Controlling idea** (`comparison`, id `choices`): A merchant with stores has four realistic ways to connect them (the platform's POS, a specialist POS by events through the order hub, a specialist POS by nightly batch through the ERP, the ERP's POS), and chooses by the number of fiscal regimes and the weight of the stores; 'unified commerce' is the goal state either of the first two reaches.\n\n**Advances the thesis** (S5): Compares the arrangements that can provide the joins and gives the rule that decides between them, with W4 as its outcome.\n\n**Transition in:** `sequence`: The joins every service needs and Utrecht's interim fix. → The four arrangements that can provide them.\n\n**Order of paragraphs** (`comparison`): Each option with its evidence and limits, the table across all four, the rule and Kestrel & Pine's place, then the vendor term the options are sold under.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | claim | A merchant with stores has four realistic ways to connect them to the rest of the landscape, each a real product category and each right somewhere. |  |  |\n| p28 | description | The platform's own POS puts the till on the web platform's back end with one catalog, one stock record per location, one order list and one customer list, as Shopify's POS pages describe and the Dutch vendor Vendit promises from the POS side, so the joins disappear. | source: Shopify POS pages: pickup in store, ship to customer, staff roles, returns at any location; POS Pro €79 per location per month.; quotation: 'if you sell the last item at the till, the article is immediately at zero in your webshop' (translated). | `sequence`: Four ways. → The first, the platform's POS. |\n| p29 | analysis | The platform's POS must be available and fiscally certified in every country the merchant has stores in, inherits the platform's offline rules and couples the tills to the platform contract. |  | `contrast`: The joins that disappear. → What the first option costs. |\n| p30 | description | A specialist POS integrated by events through the order hub keeps a store-grade till and connects it by three integrations (stock events, store receipts into the OMS, fulfillment orders to a store app); this is where Waypoint takes Kestrel & Pine, at the cost of three contracts and their reconciliation. |  | `sequence`: The first option and its limits. → The second. |\n| p31 | description | A specialist POS integrated by nightly batch through the ERP is Kestrel & Pine's January 2027 state, and it works until someone promises store stock outside the store, when it produces the Mirage. |  | `contrast`: The same POS connected by events. → Connected by a nightly batch. |\n| p32 | description | The ERP's POS makes store stock, store sales and the books one record, which suits a wholesaler with outlet stores better than a brand whose stores are growing. | table: The four options compared on store stock online, store orders, fiscal coverage, offline, integrations, exit cost and best fit. | `sequence`: Three options. → The fourth, and the comparison of all four. |\n| p33 | recommendation | The author's rule is to choose by the number of countries and the weight of the stores, not by the vendor's demo; Kestrel & Pine sits between (six stores, two countries, 12.5% of revenue, lenient fiscal regimes), which is why W4 defers the till to 2028, when the question has shrunk to 'which till'. | fact: Six stores in two countries, 12.5% of revenue (€6.0M of €48.0M); W4's 2028 evaluation. | `conclusion_summary`: The table. → The rule that decides, and where Kestrel & Pine sits. |\n| p34 | definition | 'Unified commerce' is a vendor term for online and store operations sharing core systems or records, and Shopify and Adyen define it differently; no independent analyst definition was obtained. | source: Shopify's 2026 definition (sales channels, inventory and customer data on one back end) and Adyen's (online and in-person payments on one platform with shopper recognition). | `elaboration`: Options sold as one platform or as connected parts. → The term both are sold under. |\n| p35 | recommendation | The author uses 'unified commerce' for the goal state (one record per order, stock unit and customer, visible to every channel in near real time), reachable with one platform or with an OMS and an identity layer, and the reader should ask a vendor which they mean. |  | `contrast`: Vendors' definitions. → The author's: a goal state, not a product. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): The store joins the architecture at the Growing stage with the first omnichannel promise, so store-stock ownership is decided before that promise, and the POS itself changes only when a new country's fiscal rules or the stores' weight demand it.\n\n**Advances the thesis** (S5, S4): Places the joins and the till decision by scale, and says when the till must change.\n\n**Transition in:** `elaboration`: The rule that chooses the POS by countries and the stores' weight. → How that rule plays out stage by stage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | comparison | Across the four stages, the store joins the architecture at Growing with the first omnichannel promise, the cheapest moment to decide who owns store stock is before that promise, and the POS changes only for a country whose fiscal rules it cannot meet or when the stores' weight justifies one record; Kestrel & Pine has reached the first point with its joins and not the second with its till. | table: Stages: what is typical, what becomes necessary and the warning signs of outgrowing it. |  |\n\n### In Practice\n\n**Controlling idea** (`example`, id `in-practice`): Outside programs and documentation show the joins at work (a store-stock feed for ship-from-store, store orders that keep their own identifiers, routing separate from stock deduction, a terminal kept out of card scope), and the Utrecht pilot before and after shows the commitment moving to the store's confirmation.\n\n**Advances the thesis** (S1, S3, S4): Shows each join in real products and in Kestrel & Pine's pilot.\n\n**Transition in:** `example`: The stages and Kestrel & Pine's position. → The joins in practice, starting with the ownership question every store service raises.\n\n**Order of paragraphs** (`grouping`): The ownership question first (whose sale it is), because every later example assumes it is settled; then one topic per bold lead (marketplace ship-from-store, store orders, routing, payments), each a claim with its evidence, then the worked Utrecht example that applies them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | claim | Before a store ships its first web order the merchant must settle whose sale it is (whether the revenue and any later refund count for the store or the web shop); the only open adoption figures are old and UK-weighted (27% of European retailers using stores for online fulfilment in 2016; 47% of UK stores offering click-and-collect in 2018), and their lasting finding is that store managers did not know whether online refunds came off their sales. | statistic: UPS 2016: 27%; Savills 2018: 47% click-and-collect, about one in ten ship-from-store, nearly one in three managers in one category unsure how online refunds were booked. |  |\n| p38 | example | Zalando's Connected Retail let shops ship marketplace orders from store stock (more than 3,400 stores in 2021) and ends by June 2027, showing that ship-from-store works with a proper stock feed and return path and that a merchant's own store-stock feed survives a program's end. | case: Zalando Connected Retail: 3,400 active stores in nine markets in early 2021; ending by the end of June 2027. | `sequence`: The ownership question to settle before a store ships a web order. → Ship-from-store at scale on a marketplace. |\n| p39 | claim | A common order model can carry store and web sales into finance only if it keeps the identifiers specific to each channel, such as the receipt number and the staff member. |  | `sequence`: Store stock exposed to a marketplace. → Store orders in the merchant's own order model. |\n| p40 | evidence | Microsoft's Business Central connector maps Shopify POS orders' staff identifier to a salesperson: on a platform with its own POS a store sale travels to the ERP like a web order, while a separate POS needs an import that carries the store's own identifiers. | source: Microsoft Learn, Shopify connector for Business Central (an ERP product), 14 October 2026: POS orders carry a staff identifier. | `example`: Orders that keep their channel identifiers. → One documented case. |\n| p41 | claim | Routing chooses the location that prepares an order and must weigh available stock and the promise before it becomes an instruction to do the work. |  | `sequence`: Store orders in the order model. → Which location does the work. |\n| p42 | evidence | Adobe Commerce, Shopify and Kibo show a ladder from simple routing rules in the platform to an explainable routing decision separate from the deduction of stock, which is the OMS's job once stores, cost and capacity enter the rule. | source: Adobe Commerce source priority and distance rules; Shopify's fulfillment order whose location can change only before work starts; Kibo's routing suggestion that 'does not create shipments or deduct inventory'. | `example`: Routing as a decision. → How three products implement it. |\n| p43 | explanation | A point-to-point encrypted, semi-integrated terminal keeps the POS out of PCI DSS scope, and the terminal provider's transaction reference on the receipt later matches the payout file. |  | `sequence`: Stock and orders. → The store's payment path. |\n| p44 | example | The Utrecht pilot before and after: from a promise at order placement on an ERP copy up to a day old, to a two-unit threshold and staff confirmation from April 2027, to POS stock events and a fulfillment order in the store app from Q4 2027. | table: December 2026, interim fix from April 2027 and target from Q4 2027: stock seen, promise shown, how the store learns, commitment, broken promises, handover receipt. | `example`: The joins in other merchants' programs, products and payment paths. → Kestrel & Pine's own pilot, worked. |\n| p45 | analysis | The €0 till sale makes the collection order exist three times (Schrödinger's Order with a store in it), and the interim promise is deliberately weaker than the original because a window kept every time beats 'today' broken. |  | `elaboration`: The worked table. → Two of its details explained. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`cause_effect`, id `wrong`): Stores fail in ways online systems do not (a race for the last unit, duplicate offline uploads, a silent nightly job, a double refund at the counter, a different store price, unlinked customers, a fiscal rule met too late), and each has a detection and a recovery that rests on the joins.\n\n**Advances the thesis** (S1, S2, S3, S4): Shows each store contribution and constraint failing, and the join that recovers it.\n\n**Transition in:** `contrast`: The Utrecht pilot working with a buffer and a confirmation. → The ways stores still fail.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | cause_effect (list) | Seven store failures, each with how to notice it and how to recover: the till and the web sell the same last unit; offline replay creates duplicates; the nightly job fails silently; return-in-store refunds twice; the store charges a different price; the loyalty list and the web account never meet; a fiscal rule arrives with a store. | case: The Double Refund (212 returns, €19,400, January 2027) and the Price Drift (€179 against €199, October 2026) in their store versions; Eva as the Familiar Stranger. |  |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The opening's exchange at the counter, the Utrecht Mirage and the deferred till decision have one answer: what makes a store work with the other channels is what it tells them and how fast, not which till it runs. Store stock as events net of a buffer, store orders recorded in one hub, one refund path and a person's confirmation as the commitment are the same joins under every POS option, so they come first and the till follows the countries and the stores' weight.\n\n**So what:** A merchant can decide who owns store stock and where the commitment sits before its first cross-channel promise, at no build cost (a threshold and a confirmation), and leave the till choice until the joins are in place, as Kestrel & Pine does with W4's 2028 evaluation.\n\n**Callback:** The opening's shopper who brings a web order to a store for an exchange. The first paragraph of the conclusion says what the till needs to serve that shopper and that each need is a join, not a till feature.\n\n**Takeaway** (`course_of_action`): Name the owner of store stock and the age of the copy the storefront promises from, put a threshold and a confirmation in front of the first collection promise, settle one refund path per order, check each country's fiscal rules before a lease, and take the eight questions to your own company.\n\n**Hand-off** to [The Way Back: Returns, Exchanges, Refunds and Reverse Logistics](returns-and-exchanges.html): `time`: A web order brought back to a store counter, and the one refund path per order that a return at the till requires. → The return as it travels back through the portal, the carrier, the warehouse bench, the payment provider and the ERP, and the event on which money, stock and books each move.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | synthesis | The opening's exchange at the counter works when the till finds the web order, the refund has one path and the promised stock was there; each is a join rather than a till feature, the same joins Utrecht lacked and every POS option needs, which is why Kestrel & Pine fixes them first and leaves the till to 2028. | reasoning: The opening's exchange set against the chapter's answer. |  |\n| p48 | synthesis (list) | Established: the POS is a system of record for store transactions and, offline, for store stock; store records are far less accurate than assumed; fiscalization differs by country and constrains the POS; routing is separate from stock deduction and a fulfillment order binds work to a location. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what the evidence establishes. |\n| p49 | synthesis (list) | Depends on context: the platform's POS against a specialist POS by the stores' weight and fiscal regimes; how much a click-and-collect or ship-from-store promise needs before an availability service; whether store sales enter the OMS from day one. |  | `contrast`: What is established. → What changes with the merchant's situation. |\n| p50 | synthesis (list) | The author's synthesis: fix what the store tells the other systems, and how fast, before changing the till, and promise only what a person has confirmed. |  | `sequence`: What depends on context. → The author's own judgement. |\n| p51 | recommendation (list) | Eight questions let the reader find, in their own company, the owner of store stock and the age of its copy, the till's offline rules, the fiscal fit per country, the moment of commitment, how store receipts reach the order record, the refund paths, the price source and the tills' exit cost. |  | `sequence`: The take-aways. → The questions to ask at the reader's own company. |\n| p52 | transition | A web order brought back to a store counter needs one refund path per order; the next chapter follows the return after that, as it travels through the portal, the carrier, the warehouse bench, the payment provider and the ERP, and the event on which money, stock and books each move. |  | `time`: The questions, the last of which counts the refund paths. → What happens to a return after it leaves the counter or the customer's door. |\n\n## Non-goals\n\n- The availability calculation, buffers per channel and oversell mechanics in general. See [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html).\n- The order state machine and the OMS as a product category. See [The Order Record: Lifecycle, State and the Order Management System](order-management.html).\n- Return policies, dispositions and refund reconciliation; only return-in-store's refund-path risk is covered here. See [The Way Back: Returns, Exchanges, Refunds and Reverse Logistics](returns-and-exchanges.html).\n- Customer matching and the golden record; this chapter only names the join keys a store can offer. See [One Customer, One Product: Identity and Master Data Across Systems](identity-and-master-data.html).\n- Terminal payments, settlement and payout reconciliation; PCI scope in depth. See [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html), [Protecting the Shop: Card Data, Account Takeover, Bots and Skimmers](commerce-security.html).\n- The regulatory calendar as a practice. See [Rules Turned Into Requirements: Consumer, Payment, Invoicing and Platform Regulation](commerce-regulation.html).\n- Marketplace programs that use store stock as a channel business. See [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-07** — Chose the Store Stock Mirage and the deferred POS decision (W4) as the spine rather than a feature tour of POS products, because the chapter's job is to show how a store joins the architecture, and the deferral is the clearest example of 'fix the joins before the till'.\n- **2026-11-07** — Framed the four omnichannel services as three shared problems (availability, sourcing, staff tooling) rather than four separate how-tos, so that a newcomer sees one design rather than four features.\n- **2026-11-07** — Included a country fiscalization table even though Kestrel & Pine has no German store, because fiscal rules are the strongest reason the platform's POS is sometimes p36 names its two moments; p43 opens with its transition; p44 drops the unexplained '(local detail)' label; p45 uses the ledger's 37 in a month instead of 'once in thirty'.\n- **2026-11-12** — Converted from spec.md to an outcome spec: intent, thesis and role copied from the journal spec; supporting claims, sections, paragraphs, transitions, introduction and conclusion reconstructed from the published chapter; record-keeping sections carried over; thesis paragraph (p03), roadmap (p05) and conclusion synthesis (p51) added; p04 and p56 aligned with the journal spec's transitions. Status draft. Flow rubric (sound with notes): intro reordered (bridge before thesis); p11 merged into p10, p24 into p23, p26 into p25, p32 into p31; paragraphs renumbered. Second flow rubric (sound with notes): 'the joins' named in p19, p12's German case marked as an example, rationale corrected; no order change.\n- **2026-11-07** — Visual layer: redrew 2 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator).\n- **2026-11-07** — Final consistency pass: ledger-as-document references rephrased.\n- **2026-11-07** — Editorial review pass: WHY IT MATTERS cut to two sentences, SaaS/RFID/PCI DSS/ELSTER defined at first use, KassenSichV amendment date verified, source headings normalized.\n- **2026-11-07** — Initial spec and article.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
