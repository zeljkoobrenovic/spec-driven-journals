<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Case: Zalando, Microservices, Platform Strategy and the Return to Discipline\n\n## Intent\n\nPresent Zalando as the fullest public record of a European retailer's architecture decisions and their corrections, using only its own dated posts and filings: the 2015 \"Jimmy\" and Radical Agility posts for the split made for team autonomy; the 2015 business-intelligence post and Nakadi for the cost of distributed data; the API Guild (2015), the guidelines (2016, active 2026) and the Tech Radar for API governance; the 2018, 2020, 2023 and 2025 posts for the return to discipline, with the 2025 event-to-API reversal worked in detail as the Black Friday Oversell told from a platform's side; the 2011–2026 partner program, Connected Retail, ZFS, ZEOS, SCAYLE and ABOUT YOU record for a retailer becoming a platform; and the 2023 assistant and 2026 identity broker for AI. After reading, a newcomer can say what team-sized modularity costs after the split, which platform pieces survived and why, what a written API standard should contain, when an event stream is the wrong source of current state, and where the public evidence stops.\n\n## Audience\n\nReaders new to commerce architecture. The integration engineer or architect who must write contracts with vendors and marketplaces benefits most (the guidelines table is written as a list of demands); the leader deciding how far to decentralize a growing team benefits from the discipline timeline; the product manager running a marketplace channel benefits from the platform-strategy timeline. Every term (monolith, microservices, autonomous team, internal platform-as-a-service, fragments, event, event bus, schema, API First, compatible extension, versioning, deprecation, sunset, tolerant reader, paved road, synchronous read API, partner program, seller of record, ship-from-store, logistics as a service, delegated access, token exchange) is explained in one plain clause on first use.\n\n## Success criteria\n\n- [x] Every company fact carries its year in the sentence and a source in Sources and Evidence; secondary or unfetched items (team sizes of three to seven, the 2019 leadership change, the \"expanded too much\" wording, the Connected Retail wind-down from trade press) are labeled as such.\n- [x] Every statement about Zalando's internals beyond its own posts is inside a `> **INFERENCE, NOT DOCUMENTED:**` block; the chapter states that no source announces the end of Radical Agility or a 2019 reorganization.\n- [x] A reader new to the field can define every term the chapter uses from the chapter alone; every acronym is expanded on first use.\n- [x] The chapter contains the guidelines table (rule number, plain words, what to demand of a vendor), the discipline timeline table (year, what Zalando published, what narrowed), the open-source status table, the platform-strategy timeline, the lessons table, and three mermaid diagrams (fragments behind the router; the deprecation lifecycle; the 2025 before-and-after) with captions.\n- [x] The 2025 Product Read API post is worked as the central example and tied to Kestrel & Pine's stock sync chain and the two-hour lag of 27 November 2026, with the 30-minute figure attributed to Zalando.\n- [x] A \"Where the evidence stops\" section precedes \"What to Take Away\"; the three take-away tiers are present and honest; 6–10 questions to ask; the closing hands off to [Case: commercetools, Shopware and the Composable Movement](case-composable-movement.html).\n- [x] One short paragraph says what Kestrel & Pine takes from the case, tied to W1 and W5 and to the Deprecated Endpoint of February 2027.\n- [x] No \"Across Scale Stages\" section (Part XI); length 4,500–6,000 words.\n\n## Non-goals\n\n- Architecture styles compared in general — [Monolith, Modular Monolith, Microservices, Composable: What the Evidence Says](commerce-architecture-styles.html).\n- The book's contract, versioning, webhook and deprecation rules — [Promises Between Systems: API Contracts, Webhooks and Versioning](api-contracts-and-versioning.html); this chapter supplies the Zalando specimen only.\n- Events, outbox, idempotency and reconciliation as techniques — [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html); the chapter uses the 2025 post as evidence, not as a tutorial.\n- Marketplace selling mechanics and the Zalando partner API as a channel — [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html).\n- Team topologies and governance for a merchant — [Who Builds and Who Owns: Teams, Vendors, Agencies and Governance](organizing-commerce-engineering.html); multi-brand and acquisition questions — [What Changes at Each Scale: From First Store to Group](commerce-scaling-stages.html).\n- Agentic commerce protocols and the merchant's readiness list — [Assistants and Agents: AI in Commerce and What Is Real in 2026](ai-and-agentic-commerce.html).\n- Any description of Zalando's current service inventory, order or pricing architecture, or ZEOS internals.\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\n## Open questions\n\n- McKinsey's 2018 interview with Eric Bowman timed out on 7 November 2026; it may contain a first-hand account of the 2018–2019 reorganization that would let the \"return to discipline\" framing cite a declared program rather than a sequence of posts.\n- The reconciliation between \"over 60\" fulfillment merchants (December 2025) and \"over 600\" B2B partners (annual report) is the brief's reading; a reviewer with access to Zalando investor relations could confirm the scopes.\n- The open-source status table will drift; re-check archive and last-change dates before any print edition.\n\n## Decision log\n\n- **2026-11-07** — Gave the 2025 event-to-API post its own section and diagram rather than one row in the discipline table, because it is the single Zalando document most useful to a merchant and maps directly onto Kestrel & Pine's stock sync chain; rejected treating it as a footnote to the Nakadi story.\n- **2026-11-07** — Wrote the guidelines as a three-column table with a \"what to demand of a vendor\" column, because the chapter's reader is a merchant on the receiving end of APIs, not a platform publishing them; rejected quoting the rules as a list.\n- **2026-11-07** — Framed the 2018–2026 changes as \"narrowing a choice each time\" and stated explicitly that Zalando never declared the end of Radical Agility, rejecting the commissioned framing of a 2019 \"reorganization\" that no source supports.\n- **2026-11-07** — Included the open-source status table as evidence of what survived, because archive notices are dated primary statements and the pattern (pieces with outside users survived) is a transferable warning.\n\n## Sources\n\n- **Internal**\n  - `_research/brief-cases-amazon-zalando.md` (Part B, Part C, key numbers, open questions) — every Zalando fact and its tag.\n  - `_research/scenario-ledger.md` — the Zalando channel, the stock sync chain, the Black Friday figures, the Deprecated Endpoint, W1, W5, W7, W8, the team of fourteen.\n  - [Case: Amazon, From Monolith to Services to the Everything Store](case-amazon.html) — the companion case; the chapter reads the two agent stories together.\n  - [Promises Between Systems: API Contracts, Webhooks and Versioning](api-contracts-and-versioning.html), [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html), [Monolith, Modular Monolith, Microservices, Composable: What the Evidence Says](commerce-architecture-styles.html), [Who Builds and Who Owns: Teams, Vendors, Agencies and Governance](organizing-commerce-engineering.html), [What Changes at Each Scale: From First Store to Group](commerce-scaling-stages.html), [Assistants and Agents: AI in Commerce and What Is Real in 2026](ai-and-agentic-commerce.html) — owning chapters linked rather than re-taught.\n- **External**\n  - Zalando Engineering blog posts 2015–2026 (Radical Agility on AWS; On APIs and the API Guild; Data Integration in a World of Microservices; From Jimmy to Microservices; Four Lessons; Tech Radar; One Year Later; Third Generation Microservices; Principles over Frameworks; Tech Radar Update 2020; Sunrise; From Event-Driven to API; Agentic Identity Broker) — the architecture record.\n  - Zalando RESTful API and Event Guidelines; Tech Radar; GitHub repositories (Skipper, Patroni, Nakadi, Zalenium, STUPS) — governance rules and project status.\n  - Zalando corporate pages 2020–2025, FY2025 fact sheet and Annual Report 2025; ABOUT YOU press release 2025 — the platform strategy and figures.\n  - InfoQ (2016, 2016, 2018), Diginomica (2016), ChannelX (2023), Retail Gazette (2023), FashionUnited (2026) — secondary accounts where primary pages were absent.\n\n## Changelog\n\n- **2026-11-07** — Initial spec and article. *(AI-mediated session)*\n- **2026-11-07** — Visual layer: redrew 3 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator). *(AI-mediated session)*\n"}]}]}</script>

        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');

                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');

                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
