<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/48-case-zalando/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (a thesis paragraph, a roadmap that announces every section, and a synthesis that answers the opening question). Two units were moved inside their sections (the Tech Radar paragraph before the change rules; the terms paragraph before the discipline timeline); these are recorded in decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The 2015 split: the monolith Jimmy blocked teams through slow startup and deployments; Radical Agility and autonomous teams, 85-plus teams by February 2016 and about 110 by December 2016, each with its own AWS account on STUPS, an audited internal platform-as-a-service; the shop rebuilt as fragments behind the Skipper router; the September 2015 statement that distributed data needs an event stream (Kafka, then the Nakadi event bus).\n- **Know:** The API Guild (2015) and the RESTful API and Event Guidelines (open since 2016, maintained in 2026): API first in OpenAPI; never break consumers; prefer compatible extension to versioning; tolerant readers; no shutdown without client consent on a sunset date; deprecation in the specification, Deprecation and Sunset headers, usage monitoring; no new use of deprecated APIs.\n- **Know:** The narrowing that followed, which no Zalando post names as such: alignment over raw autonomy (2018), technology selection principles and fewer languages (2020, with 1,200-plus developers and 4,000-plus applications), the Sunrise developer portal replacing more than 100 interfaces (2023), and in March 2025 a synchronous Product Read API replacing a price-and-stock event stream that reprocessed payloads over 90% unchanged, lagged up to 30 minutes at Cyber Week and led teams to divergent copies of product data.\n- **Know:** Which open-source pieces survived (Skipper, Patroni, the guidelines) and which were archived (STUPS's Senza, Nakadi, Zalenium); the platform built through logistics (partner program 2011, Connected Retail 2018 to be discontinued by 30 June 2027, ZEOS fulfillment for any channel 2023, SCAYLE, ABOUT YOU in 2025, partners at 32.1% of 2025 GMV); the 2023 assistant and the 2026 Agentic Identity Broker.\n- **Know:** Where the evidence stops: no published service inventory, order or pricing architecture, or account of how the read API and event streams coexist.\n- **Believe:** Events say what happened; a read API on the owner says what a value is now; a reconciliation says whether the copies still agree.\n- **Believe:** Ownership is decided before decomposition, and a written rule for change outlives the architecture it was written for.\n- **Be able to:** Write compatibility and deprecation demands into a vendor contract.\n- **Be able to:** Name, for price and stock, which system answers 'what is it now' and how far each copy lags on the peak hour.\n\n**Audience:** Newcomers to commerce architecture; most of all the integration engineer or architect who must write contracts with vendors and marketplaces (the guidelines table is written as a list of demands). The leader deciding how far to decentralize a growing team reads the discipline timeline; the product manager running a marketplace channel reads the platform timeline.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Kestrel & Pine, its fourteen-person technology team, its thirteen systems, its ten incidents in outline (among them the Black Friday Oversell and the Deprecated Endpoint) and the names of the sixteen failure patterns (among them the Giant's Boots, the Pulled Rug and the Message in a Bottle).\n- From Part I: the thirteen steps of an order, promise and handoff, 'system', 'the shop platform' for the hosted product Kestrel & Pine rents and 'commerce platform' for the whole set of systems, the four scale stages (Starting, Growing, Omnichannel, Group), bounded context, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From the Part XI introduction and chapters 46 and 47: the cases are read from dated sources researched on 7 November 2026, with documented, widely reported and inferred claims kept apart; Shopify as the hosted platform; Amazon's move from one application to services after a scaling wall and from retailer to platform, its internals documented only up to 2007.\n\n**Does not yet know:**\n\n- Monolith, microservices, autonomous team, internal platform-as-a-service, fragments, GMV.\n- Event bus, schema, Kafka, Nakadi.\n- API First, OpenAPI, compatible extension, versioning, deprecation, sunset, tolerant reader, technology radar.\n- Paved road, technology radar with teeth, synchronous read API, Product Read API.\n- Partner program, seller of record, wholesale, ship-from-store, logistics as a service, ZEOS, SCAYLE.\n- Delegated access, token exchange.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a proposal to replace a chain of stock copies with an event stream that every consumer rebuilds its own copy from, the reader explains what Zalando's 2025 experience shows and what to build instead. *Probe:* A merchant's stock reaches its storefront and marketplaces as a chain of copies: the warehouse system to the ERP every 15 minutes, then hourly to the platform and hourly to a marketplace connector. Its integration partner proposes an event stream to which every system subscribes and from which each keeps its own copy. Using only this chapter: what does Zalando's experience say about that design, and what should the merchant build instead? | `custom` | cold_reader | major |\n| AC-2 | The reader can state what to demand of a vendor about API change and show how it would have caught a retired-version incident. *Probe:* Using only this chapter: what should a merchant demand of a marketplace connector vendor about API changes, and how would that have prevented a stale-stock incident caused by a script calling a retired API version? | `custom` | cold_reader | major |\n| AC-3 | The reader can correct the claim that Zalando shows microservices failed, from the chapter's sources. *Probe:* A board member says: 'Zalando shows microservices failed.' Using only this chapter: is that what the record shows? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What does Zalando's public record from the 2015 microservices split to 2026, including the later corrections, show a merchant about modularity, API contracts and the source of current state?\n\n> **Claim:** Zalando split its shop in 2015 for team autonomy, not load, then narrowed choices for a decade: alignment over raw autonomy, fewer languages, one developer portal, and in 2025 a read API replacing a price-and-stock event stream that lagged up to 30 minutes at Cyber Week. A merchant should take its written rules for API compatibility and deprecation, and ask the system that owns each price and stock figure for it, not copy Zalando's thousands of applications.\n\n**Disputed by:** The view that Zalando's 2015 shape is the model for a modern commerce platform: autonomous teams with free choice of technology, many small services and event streams between them, so that a merchant modernizing its stack should move toward that shape.\n\n**So what:** A merchant that accepts the claim adopts compatibility and deprecation rules (no breaking changes, tolerant readers, a sunset only with consent, a date, headers and usage monitoring) as the baseline for every vendor contract, and asks for price and stock which system can answer 'what is it now' rather than which copy an event feeds. Kestrel & Pine takes two such lessons, both already in Waypoint: W5's tracking of API versions and retirement notices, which would have caught the Deprecated Endpoint of February 2027, and W1's availability service, answering current availability through an API with stock events and reconciliation behind it, in place of the chain of copies that kept selling the Ridgewalker for two hours after it sold out on 27 November 2026.\n\n**How and why:** Autonomy multiplied what each team chose (languages, tools, integration styles), so the cost arrived later as software that was hard to support and tools nobody could find, which Zalando reduced by narrowing one choice at a time. An event that carries the whole record is the right way to say that something changed and the wrong way to be the only source of the current value: every consumer becomes a copy that can lag, the lag is largest in the busiest week, and teams that fell behind used other sources until the copies diverged. A written rule for change binds the interface, which outlives any implementation behind it: the guidelines are maintained in 2026 while STUPS and Nakadi are archived.\n\n**Supporting claims**\n\n- **S1** — Zalando split its shop in 2015 because its teams shared one codebase with slow startup and complicated deployments; the fix was organizational first (autonomous teams, an AWS account each on the audited STUPS platform) and architectural second (fragments behind a router), so the service count followed the team count.\n- **S2** — Zalando stated the cost of distributed data in the same year: once each service owns its data there is no single place to query, so analytics and reconciliation need an event stream (Kafka, then the Nakadi event bus).\n- **S3** — The durable export is a written API standard: the API Guild (2015) and the guidelines (open since 2016, maintained in 2026) set compatibility and deprecation rules a merchant can demand of every vendor, and the standard outlived the platform tooling only Zalando needed (STUPS and Nakadi archived).\n- **S4** — From 2018 to 2025 Zalando narrowed one choice at a time (alignment, languages, one developer portal) and in 2025 replaced a price-and-stock event stream that lagged up to 30 minutes at Cyber Week with a read API: events propagate change, but must not be the only source of the current value.\n- **S5** — Zalando became a platform through logistics (partner program, ship-from-store, fulfillment for any channel, then shop software), with one stock pool serving several channels and consolidation following; its AI work moved from a discovery assistant to a published identity model for agents.\n- **S6** — Read with dates and with inference labeled, the case divides into disciplines that transfer to a fourteen-person team (written change rules, an owner with a read API, reconciliation), which Kestrel & Pine already has as W5 and W1, and machinery sized to Zalando; the public record stops short of Zalando's current internals.\n\n## Role in the part\n\nGives the part the fullest public record of a split and its corrections, with the written API rules a merchant can demand of vendors and the 2025 evidence that an event stream must not be the only source of current state. Supports P11-3, P11-5 of part `part-11`.\n\n## Flow\n\n**Pattern:** `chronological` (also `grouping` in pieces after api (what the 2015 work left in 2026), and platform and ai: subjects read across the whole decade)\n\nThe architecture record is told in date order (the 2015 split, the cost of distributed data stated the same year, the API standard begun in 2015, the narrowing from 2018 starting from the 2016 radar, the 2025 event stream in detail) because each correction only makes sense after the decision it corrects. What survived of the 2015 open-source pieces follows the API standard directly, because the guidelines are the survivor the section is about and STUPS, Skipper and Nakadi have just been introduced; putting it later breaks the 2018-2025 run with a jump back to 2015. The 2025 section follows the discipline timeline because it is that timeline's last row worked in detail. The business and AI threads come after the architecture story because they share no single date with it and each needs terms the architecture sections supply (the stock pool needs events and read APIs; the identity broker needs API contracts). 'What Zalando Teaches' needs all of the evidence, and 'Where the Evidence Stops' bounds it before the take-away. Putting the 2025 section before the discipline timeline would present the read API without the decade of narrowing that explains it; putting the lessons first would assert them before their evidence.\n\n## Introduction\n\n**Hook** (`direct_statement`): A merchant listing products on Zalando depends on a platform that serves shoppers, connects sellers and offers fulfillment, at a scale of €17.6 billion GMV, 62 million active customers and 278.6 million orders in 2025; a merchant such as Kestrel & Pine needs to know which of its engineering lessons apply to a much smaller operation.\n\n**Bridge:** The previous case, Amazon, moved from one application to services after a scaling wall and from retailer to platform, with its internals documented only up to 2007. → Zalando made similar moves and has published ten years of its decisions, including the ones it later reversed, which the chapter reads as dated history.\n\n**Thesis statement** (KEY POINTS callout and paragraph p05): Zalando split its shop in 2015 for team autonomy, not for load, then narrowed choices for a decade: alignment over raw autonomy, fewer languages, one developer portal and, in 2025, a read API in place of a price-and-stock event stream that lagged up to 30 minutes at Cyber Week. A merchant should take Zalando's written rules for API compatibility and deprecation, and get each price and stock figure from the system that owns it, not copy Zalando's thousands of applications.\n\n**Roadmap** (Paragraph p06):\n\n- The 2015 split and the cost of spreading data across services, stated the same year. *Kept in:* split, data.\n- The API standard that came out of that work, and which of the 2015 pieces survived. *Kept in:* api, pieces.\n- The decade of narrowing choices and, in detail, the 2025 event stream that fell behind. *Kept in:* discipline, event2025.\n- The retailer becoming a platform through logistics, and its AI work. *Kept in:* platform, ai.\n- What transfers to a merchant, including what Kestrel & Pine takes, and where the evidence stops. *Kept in:* teaches, evidence.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A merchant listing on Zalando depends on a platform that serves shoppers, connects sellers and offers fulfillment at a large scale, so a merchant such as Kestrel & Pine needs to know which of Zalando's engineering lessons apply to its smaller operation. | statistic: €17.6 billion GMV, 62 million active customers, 278.6 million orders in 2025. |  |\n| p04 | context | In the order's journey a merchant listing a jacket on Zalando needs correct price and stock, an imported order and a maintained API contract, which the linked chapters explain from the merchant's side. | example: The jacket listed on Zalando; links to marketplaces-and-channel-integration, inventory-and-availability and api-contracts-and-versioning. | `elaboration`: A merchant listing on Zalando and the scale it depends on. → What that merchant needs at each step of the order's journey. |\n| p02 | context | Like Amazon, Zalando moved from one application to services and from retailer to platform; unlike Amazon it has published ten years of its decisions, from the 2015 move to independent services and autonomous teams through shared standards, fewer technologies and common tools to a 2025 replacement of an event integration with direct API calls, so the case shows the costs of earlier decisions as well as their reasons. | fact: The 2015 move, the later posts on standards, technologies and tools, and the 2025 account. | `similarity`: Zalando as the platform the merchant depends on, and the previous case, Amazon. → Zalando's similar moves and its ten years of published decisions, including the reversed ones. |\n| p03 | context | The 2015-2017 accounts are read as history beside newer filings, each claim is dated, inferences are labeled, and 'return to discipline' is the chapter's own interpretation, not a program Zalando announced. |  | `elaboration`: The published decisions of different ages. → How the chapter reads them. |\n| p05 | claim | The chapter's claim: Zalando split its shop in 2015 for team autonomy, not for load, then narrowed choices for a decade, ending in 2025 with a read API in place of a price-and-stock event stream that lagged up to 30 minutes; a merchant should take its written rules for API compatibility and deprecation and get each price and stock figure from the system that owns it, not copy its thousands of applications. |  | `cause_effect`: The dated record and how it is read. → What the record shows the merchant. |\n| p06 | transition | The roadmap: the 2015 split and the cost of distributed data, the API standard and which 2015 pieces survived, the decade of narrowing with the 2025 event stream in detail, the retailer becoming a platform, AI, and finally what transfers to a merchant and where the evidence stops; the evidence is Zalando's dated posts, filings and repositories, with trade press where primary pages were missing. |  | `sequence`: The chapter's claim. → The order in which the chapter tests it and the evidence it uses. |\n\n## Sections\n\n### 2015: Jimmy, Radical Agility and the Split\n\n**Controlling idea** (`evidence`, id `split`): Zalando split its shop in 2015 because teams sharing one codebase could not move quickly, and it did so organization first: autonomous teams, an AWS account each on an audited platform, then a page assembled from separately deployed fragments.\n\n**Advances the thesis** (S1): Establishes the stated motive and the organization-first order of the split.\n\n**Transition in:** `sequence`: The roadmap's first step. → The 2015 split, with the terms it needs.\n\n**Order of paragraphs** (`chronological`): Terms first, then the monolith's problem (2015), the rebuild (May 2015), the organization (March 2015 to December 2016), the platform that made accounts per team possible, the fragments one year in (October 2016) and a team's first-months lessons (April 2016), ending on the inference about the order of operations.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | definition | A monolith is one deployed application, microservices are separately deployed programs talking over a network, and an autonomous team owns its services in production; the question is how much independence helps teams without making coordination harder. |  |  |\n| p08 | evidence | Zalando's monolith, Jimmy, was shared by all the shop teams and slowed them through slow startup and complicated deployments, so the stated problem was release speed and shared code rather than traffic. | quotation: The October 2015 post: the shop teams shared the same code base and could not move quickly because of slow startup and complicated deployments. | `example`: The monolith and the question of independence. → Zalando's monolith and the problem it stated. |\n| p09 | evidence | In May 2015 a small team began rebuilding the Fashion Store as services whose teams own programming, testing, deployment and operations, with a router, Skipper, that it open-sourced. | fact: Seven engineers and a designer; fifteen country sites, over sixteen million active customers; Skipper. | `cause_effect`: The monolith's problem. → The rebuild that answered it. |\n| p10 | evidence | The organizational side, Radical Agility, made small autonomous teams the unit of trust, and the team count grew from 85-plus in February 2016 to about 110, each with its own AWS account, by December 2016. | quotation: Bowman, July 2015: 'We think of teams as a unit of trust'; 85+ teams (February 2016); about 110 teams, 1,400 people, an AWS account per team (InfoQ, December 2016); teams of three to seven (trade accounts, 2016). | `additional_support`: The rebuild's teams owning their services. → The organizational program behind them and its size. |\n| p11 | evidence | STUPS, an internal platform-as-a-service, gave every team its own cloud account and made that auditable. | quotation: 'a convenient and audit-compliant Platform-as-a-Service'; nearly administrative access with audit reporting for card-industry, financial-reporting and German rules; production-ready for every team in May 2015. | `cause_effect`: Each team's own AWS account. → The platform that made it possible. |\n| p12 | evidence | The shop was rebuilt as fragments, pieces of a page owned and deployed by different teams, and one year in (October 2016) the effort turned from prototyping to stable components other teams could depend on. | quotation: Project Mosaic; header and footer fragments live; 'from prototyping to performance optimization'; 'stable components that other teams can depend on'.; figure: Figure 1: router in front, fragments per team, a cloud account per team on a shared audited platform. | `sequence`: Teams and their platform. → How the shop itself was rebuilt. |\n| p13 | analysis | A team's April 2016 account shows the first months: two services became eight once boundaries were modeled, and weekly goals replaced a failed upfront plan; the labeled inference draws the lesson that ownership is decided before decomposition and that the service count followed the team count. | case: The Dortmund team's two services that became eight.; reasoning: INFERENCE callout: 85-plus teams (2016), about 110, then 4,000+ applications for 1,200+ developers (2020); Kestrel & Pine's fourteen people are below that count; the order of operations transfers. | `example`: The rebuild as Zalando described it. → One team's first months and the lesson the chapter draws. |\n\n### The Cost of Distributed Data, Stated Early\n\n**Controlling idea** (`evidence`, id `data`): Zalando said in 2015 that once each service owns its data, analytics and reconciliation need an event stream, and built one.\n\n**Advances the thesis** (S2): Shows the event stream as the answer to distributed data, the premise the 2025 correction later qualifies.\n\n**Transition in:** `cause_effect`: Services owned by separate teams. → What spreading data across them cost.\n\n**Order of paragraphs** (`chronological`): The September 2015 statement of the cost, the terms, the October 2015 event bus, the 2017 intent, then the inference for a merchant.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | evidence | When services own separate databases, reports must bring their facts back together, and Zalando's September 2015 post said so and answered with Kafka and a planned data lake. | quotation: 'consolidation of data in a single place makes business intelligence fairly simple'; article and order data across eight PostgreSQL databases; Kafka 'to make our event data available for downstream systems'. |  |\n| p15 | definition | An event is a message sent when something happens, and an event bus is the shared channel on which services publish and subscribe to events. |  | `elaboration`: Event data made available downstream. → The two terms the rest of the chapter needs. |\n| p16 | evidence | Zalando's event bus, Nakadi (October 2015), put a REST interface over Kafka-like queues and validated every event against a registered schema. | quotation: 'a distributed event bus that implements a RESTful API abstraction on top of Kafka-like queues'; schema registry. | `example`: The event bus as a term. → Zalando's own event bus. |\n| p17 | analysis | By 2017 Zalando described event streaming as the intended style of its services; the labeled inference reads this as the book's reconciliation rule, met by Kestrel & Pine without a single microservice. | quotation: Services 'process incoming events and data from other services'; streaming 'a central part of the service fabric'.; reasoning: INFERENCE callout: thirteen systems, orders and product data each in four places, three definitions of an order (W7). | `time`: Nakadi in 2015. → The event-driven intent of 2017. |\n\n### The API Guild and the Guidelines\n\n**Controlling idea** (`evidence`, id `api`): Zalando's API standard, begun by a guild in 2015 and maintained in 2026, writes down how APIs may change, and its compatibility and deprecation rules are what a merchant should demand of every vendor.\n\n**Advances the thesis** (S3): Gives the rules that transfer and ties them to a Kestrel & Pine incident.\n\n**Transition in:** `contrast`: Many teams and services, each with its own data and events. → The shared rules that kept their interfaces consistent.\n\n**Order of paragraphs** (`chronological`): Why shared rules matter, the 2015 guild, API First and the 2016 open guidelines, then the change rules in detail and the incident they would have caught, so the section ends on the merchant.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | context | Shared API rules let teams and partners integrate without relearning each interface and catch incompatibilities before release. |  |  |\n| p19 | evidence | The API standard began in March 2015 as an API Guild that reviewed rather than approved, because Zalando's open platform depended on partners and it could not afford to break its APIs. | quotation: 'a sounding board and review resource, not an approval board'; 'We cannot afford to break our APIs'; 'all Zalando APIs should look like the same author created them'. | `example`: Shared API rules in general. → Zalando's guild that began them. |\n| p20 | evidence | The principle is API First: the interface is designed and reviewed as an OpenAPI document before code, open-sourced in 2016 and still required in the current guidelines. | quotation: 'a source truth, part of a contract between a service provider and consumers' (2016); 'must define APIs first, before coding its implementation' (current guidelines). | `elaboration`: The guild's standard. → Its principle and its open publication. |\n| p22 | evidence | The rules that matter most to a merchant are those about change: extend compatibly instead of versioning, tolerate unknown fields, and retire an API only with client consent on a date, machine-readable deprecation, headers and usage monitoring. | table: Rules #106-#115 and #185-#191 with plain words and what Kestrel & Pine should demand of a vendor.; figure: Figure 2: announce, obtain consent, signal in headers, monitor, sunset. | `elaboration`: API First and the guidelines as a contract. → The guidelines' rules on change, the ones that matter most to a merchant. |\n| p23 | example | Kestrel & Pine's Deprecated Endpoint of February 2027 shows the cost of lacking these rules: every row of the table describes a step that would have caught the script still calling a retired version. | scenario: The marketplace connector retired an API version on a published date; the agency script was not updated; stock to bol was stale for two days (fictional). | `example`: The change rules. → The incident they would have prevented. |\n\n### The Platform Pieces: What Survived\n\n**Controlling idea** (`evidence`, id `pieces`): The open-source pieces with users outside Zalando survived and the ones tied to its own 2015 model were archived, a warning against platform tooling only one company needs.\n\n**Advances the thesis** (S3): Shows the written standard outliving the tooling built for one company.\n\n**Transition in:** `time`: The guidelines and the 2015 platform pieces met so far (STUPS, Skipper, Nakadi). → Their status in November 2026: what survived and what was archived.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | evidence | The November 2026 status of what Zalando open-sourced from 2015 is itself evidence: the router (Skipper), a PostgreSQL failover template (Patroni) and the written standard are active, while STUPS, Nakadi and a test grid (Zalenium) are archived. | table: STUPS (Senza archived), Skipper (active), Patroni (active), Nakadi (archived June 2024), guidelines (active), Tech Radar (active), Zalenium (archived 2021).; reasoning: INFERENCE callout: pieces with a life outside Zalando survived; archiving Nakadi says nothing about internal use. |  |\n\n### The Return to Discipline, 2018 to 2026\n\n**Controlling idea** (`evidence`, id `discipline`): No post declares the autonomy era over, but from 2018 each post narrows a choice, and the record supports not 'microservices failed' but autonomy that produced too many technologies, too many tools and one integration that could not keep up.\n\n**Advances the thesis** (S4): Lays out the decade of narrowing that the thesis names.\n\n**Transition in:** `time`: What the 2015 work left behind by 2026. → What changed from 2018, starting from the advisory radar of 2016.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The 2016 radar as the baseline first, then the terms the timeline uses, then the timeline (2018 to 2026, each row naming what narrowed), then what it does and does not support. The radar sits here, not in the API section, because its 2020 change is a row of this timeline; in the API section it pointed forward to a change the reader had not met.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p21 | evidence | From 2018 Zalando's posts narrow what 2015 left open, and the starting point for technology choices was the 2016 Tech Radar, which rated technologies by ring as one input to each team's choice, wording the 2020 row of the timeline replaces. | quotation: ADOPT, TRIAL, ASSESS, HOLD; 'Teams must use the Tech Radar as one input source'. |  |\n| p24 | definition | Three terms help read the timeline: a paved road is one supported way to build, deploy and find services; a technology radar with teeth is a list teams must follow, as Zalando's radar became in 2020; a synchronous read API answers 'what is the price now' when asked. |  | `elaboration`: The advisory radar of 2016. → The terms the timeline of its narrowing uses. |\n| p25 | evidence | No single Zalando post declares that the autonomy era ended, but the posts that follow each narrow a choice and, read in order, tell one story: alignment over raw autonomy and principles over one method (2018), technology selection principles and fewer languages (2020), one developer portal and fewer overhead roles (2023), a read API (2025) and Connected Retail folded into the partner program (2026). | table: 2018 alignment (Bowman), 2018 principles over frameworks, 2020 language set, 2023 Sunrise, 2023 overhead roles, 2025 Product Read API, 2026 Connected Retail folded in. | `sequence`: The three terms. → The timeline that uses them. |\n| p26 | analysis | The evidence does not support 'microservices failed at Zalando'; it supports that autonomy produced too many technologies, too many tools and one integration that could not keep up, each fixed by narrowing a choice at a company that is still large. | statistic: More than 17,000 employees, around 3,000 in technology, more than 7,000 in fulfillment centers.; figure: Figure 3: scattered paths merging past 2018, 2020, 2023 and 2025 into one paved road. | `conclusion_summary`: The timeline. → What it supports and what it does not. |\n\n### 2025: When the Event Stream Fell Behind\n\n**Controlling idea** (`evidence`, id `event2025`): Zalando's 2025 account shows that an event stream must not be the only source of the current price and stock, because every consumer becomes a copy that lags most on the busiest day.\n\n**Advances the thesis** (S4): Works the timeline's 2025 row in detail and ties it to Kestrel & Pine's stock chain.\n\n**Transition in:** `elaboration`: The 2025 row of the timeline and the term 'synchronous read API'. → That correction in detail, starting from the mechanism.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The mechanism, then Zalando's evidence, then the rule and Kestrel & Pine's version of the same failure.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | explanation | Publishing every change as an event gives each receiving system a copy to keep, so if receivers fall behind an answer can be stale while the source is correct. |  |  |\n| p28 | evidence | Zalando's March 2025 post reports that its price and stock event stream reprocessed mostly unchanged payloads, fell up to 30 minutes behind at Cyber Week and led teams to divergent copies, and was replaced by a synchronous Product Read API. | quotation: 'over 90% of each payload unchanged'; 'could be delayed by up to 30 minutes'; 'divergent versions of product data'; Product Read API (PRAPI).; figure: Figure 4: before, every consumer rebuilds its own copy; after, consumers ask the owner. | `example`: Copies that can fall behind. → Zalando's price and stock stream that did. |\n| p29 | analysis | An event is the right way to say that something changed and the wrong way to be the only source of the current value; Kestrel & Pine's hourly stock chain is a slower version of the same design, and W1 is the rule the chapter draws: an owner answering through an API, events for change, reconciliation for agreement. | scenario: WMS to ERP every 15 minutes, ERP to the shop platform hourly, the shop platform to the connector hourly; the Ridgewalker sold for up to two hours after it sold out at 19:40 on 27 November 2026 (fictional).; figure: Figure 5: the chain of copies.; reasoning: INFERENCE callout: PRAPI internals unpublished; W1's system of record, availability service and reconciliation. | `cause_effect`: Zalando's lagging copies. → The rule they show and the merchant's version of the failure. |\n\n### A Retailer Becoming a Platform\n\n**Controlling idea** (`evidence`, id `platform`): Zalando became a platform through logistics, one stock pool serving several sellers and channels, and consolidated what a general program could do.\n\n**Advances the thesis** (S5): Gives the business side of the case and its architectural consequence.\n\n**Transition in:** `contrast`: The architecture story told so far. → The business story that runs beside it.\n\n**Order of paragraphs** (`chronological`): The link between the two stories, the terms and the 2011-2026 timeline, then the 2025 figures and the inference.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | transition | Zalando's business story runs beside its architecture story, and the two meet at the warehouse. |  |  |\n| p32 | evidence | In the partner program a brand is the seller of record and Zalando takes a commission, against wholesale; ship-from-store and logistics as a service extend it, and the 2011-2026 timeline shows each step with its documented figures, ending with Connected Retail folded into the partner program and its technology discontinued by June 2027. | table: Partner Program 2011; Connected Retail 2018; ZFS by 2021; ZEOS 2022-2023; ABOUT YOU 2025; B2B segment 2025; Connected Retail folded in 2026. | `elaboration`: The warehouse as the meeting point. → The terms and the timeline. |\n| p33 | analysis | The FY2025 figures give the scale around this, with reported growth inflated by ABOUT YOU, a falling partner share and two partner counts Zalando has not reconciled; the labeled inference reads the timeline as Amazon's path in European form, with one stock pool for several channels and two cautions. | statistic: GMV €17,560.2 million, revenue €12,346.1 million, adjusted EBIT €590.7 million; 2026 pro-forma guidance 5-10%; partner share 32.1% from 34.2%; 'over 60' fulfillment merchants.; reasoning: INFERENCE callout: marketplace, ship-from-store, fulfillment, software; Connected Retail consolidated; a merger imports its model mix. | `additional_support`: The timeline of moves. → The 2025 figures and what they mean. |\n\n### AI at Zalando: Discovery First, Then Identity\n\n**Controlling idea** (`evidence`, id `ai`): Zalando's AI record moves from a 2023 shopping assistant for discovery to a 2026 identity model that lets agents act for users without holding their credentials.\n\n**Advances the thesis** (S5): Adds the latest thread of the record and its link to W8.\n\n**Transition in:** `sequence`: The platform's business thread. → The newest thread beside it, AI.\n\n**Order of paragraphs** (`chronological`): The distinction between helping and acting, the 2023 assistant, the 2026 broker, its terms and its consent rule, then the inference.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | context | An assistant that helps a customer search differs from software that acts for the customer, which must carry the customer's permissions without exposing credentials. |  |  |\n| p35 | evidence | Zalando's 2023 assistant was a discovery feature used by over 6 million customers in 2025, and its annual report sees agentic commerce as both an opportunity and a gatekeeping risk. | fact: Beta 'fashion assistant powered by ChatGPT', 19 April 2023, four countries; 'used by over 6 million customers'; agents as 'digital gatekeepers'. | `example`: Helping a customer search. → Zalando's assistant. |\n| p36 | evidence | In September 2026 Zalando open-sourced an Agentic Identity Broker that lets agents act for users without holding provider tokens. | quotation: 'lets agents act on behalf of users without ever holding provider tokens'. | `time`: The 2023 discovery feature. → The 2026 engineering for agents that act. |\n| p37 | definition | Delegated access is the intersection of the user's and the agent's permissions, and token exchange swaps the agent's identity for a short-lived credential scoped to one action. |  | `elaboration`: The broker. → The two mechanisms it uses. |\n| p38 | analysis | The post adds that consent should name a business capability rather than a raw scope, and that stronger approval is planned for high-risk transactions; the labeled inference ties this to W8. | reasoning: INFERENCE callout: Amazon's rule for external agents beside Zalando's identity model for internal ones; W8's agent identity, named person and readable scope. | `additional_support`: Delegated access and token exchange. → How consent is presented and its lesson for the merchant. |\n\n### What Zalando Teaches\n\n**Controlling idea** (`synthesis`, id `teaches`): Each lesson of the case names its evidence and its size, and Kestrel & Pine takes two of them, both already Waypoint decisions (W5 and W1).\n\n**Advances the thesis** (S6): Separates what transfers from what does not and shows the merchant's two lessons.\n\n**Transition in:** `conclusion_summary`: The evidence of all the preceding sections. → The lessons drawn from it.\n\n**Order of paragraphs** (`large_to_small`): All lessons first, then the two Kestrel & Pine takes, in the order of the sections that gave them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | synthesis | The lessons table is the author's synthesis, each row naming its evidence and whether it transfers to a merchant. | table: Eight lessons with evidence and transfer: ownership before decomposition, the written standard, deprecation, the event stream for analytics, not as the only source, alignment, tooling only one company needs, logistics to platform. |  |\n| p40 | recommendation | Kestrel & Pine's first lesson is W5: integration owners track API versions and retirement notices, which addresses the Deprecated Endpoint. |  | `example`: The lessons that transfer. → The first that Kestrel & Pine takes. |\n| p41 | recommendation | Its second lesson is W1: stock events feed an availability service that answers through an API with reconciliation behind it, so neither lesson needs Zalando's scale. |  | `additional_support`: The first lesson. → The second, and what neither requires. |\n\n### Where the Evidence Stops\n\n**Controlling idea** (`context`, id `evidence`): The public record stops short of Zalando's current architecture, any declared end of Radical Agility, stable open-source status, comparable growth figures and the primary Connected Retail notice.\n\n**Advances the thesis** (S6): Bounds every claim the chapter has made.\n\n**Transition in:** `contrast`: The lessons drawn. → The limits of the evidence behind them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p42 | context (list) | The lessons rest on public sources that stop short in five places: no current architecture published; no source ending Radical Agility or describing a reorganization (the 'return to discipline' rests on posts and Bowman's 2019 departure); open-source status dated 7 November 2026; 2025 figures including ABOUT YOU and partner counts Zalando has not reconciled; the Connected Retail wind-down known from trade press. |  |  |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The split, the guidelines, the decade of narrowing and the 2025 read API give one answer to the opening question: Zalando's lasting results are written rules for the joins between systems (how an API may change, which system answers for the current price and stock), while the shape around them (the teams, the services, the account-per-team tooling) was sized to Zalando and corrected as it grew.\n\n**So what:** A merchant takes the rules and leaves the shape: it makes compatibility and deprecation rules the baseline of every vendor contract and gets current price and stock from their owner, without copying Zalando's thousands of applications.\n\n**Callback:** The opening question: which of Zalando's engineering lessons apply to a much smaller merchant. p43 answers it: the rules for the joins apply at any size; the shape does not.\n\n**Takeaway** (`course_of_action`): Adopt the compatibility and deprecation rules for every vendor contract, name the system that answers 'what is it now' for price and stock, measure how far each copy lags at peak, and check the questions to ask.\n\n**Hand-off** to [Case: commercetools, Shopware and the Composable Movement](case-composable-movement.html): `contrast`: Large companies that built services for their own size and then corrected them over a decade, Amazon and Zalando, read beside the hosted platform of chapter 46. → Vendors that sold the services shape to every merchant as composable commerce, what it costs the merchant, and their 2025-2026 turn toward working beside the systems merchants already have.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | synthesis | The record answers the opening question: Zalando's lasting results are written rules for the joins between systems, while the shape around them was sized to Zalando and corrected as it grew, so a merchant takes the rules and leaves the shape. | reasoning: The opening question, the sections' findings, the thesis. |  |\n| p44 | synthesis (list) | Established: the 2015 split for team autonomy on an audited platform; the guidelines' compatibility and deprecation rules; a decade of narrowing ending with the 2025 read API; the platform built through logistics. |  | `conclusion_summary`: The chapter's answer. → The points that are established, with their sources. |\n| p45 | analysis (list) | Depends on context: team-sized modularity at the Group stage, an event bus at the Omnichannel stage but not as the source of current state, the change rules at every stage in different directions, and a channel-specific technology only until the general program can serve it. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p46 | synthesis (list) | The author's synthesis: Zalando's most valuable export is a habit of writing down the rules for change and publishing corrections, and its 2025 post states the book's thesis that a copy is not a system of record. |  | `sequence`: Established and context-dependent points. → The author's own reading. |\n| p47 | recommendation (list) | Eight questions turn the chapter into checks a merchant runs: vendor deprecation policies, logged headers, who answers 'what is it now', copy lag at peak, tolerant readers, an API standard, channel-specific technology, and agent identity. |  | `cause_effect`: What the chapter establishes and the author's reading. → The questions a merchant asks of its own systems and vendors. |\n| p48 | transition | The three cases so far are a hosted platform and two large companies that built services for their own size and corrected them over a decade; the next case contrasts them with vendors that sold that shape to every merchant as composable commerce, its costs and its 2025-2026 turn toward working beside the systems merchants already have. |  | `contrast`: Amazon and Zalando, read beside Shopify. → The composable movement. |\n\n## Non-goals\n\n- Architecture styles compared in general. See [Monolith, Modular Monolith, Microservices, Composable: What the Evidence Says](commerce-architecture-styles.html).\n- The book's contract, versioning, webhook and deprecation rules; this chapter supplies the Zalando specimen only. See [Promises Between Systems: API Contracts, Webhooks and Versioning](api-contracts-and-versioning.html).\n- Events, outbox, idempotency and reconciliation as techniques; the chapter uses the 2025 post as evidence, not as a tutorial. See [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html).\n- Marketplace selling mechanics and the Zalando partner API as a channel. See [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html).\n- Team topologies and governance for a merchant; multi-brand and acquisition questions. See [Who Builds and Who Owns: Teams, Vendors, Agencies and Governance](organizing-commerce-engineering.html), [What Changes at Each Scale: From First Store to Group](commerce-scaling-stages.html).\n- Agentic commerce protocols and the merchant's readiness list. See [Assistants and Agents: AI in Commerce and What Is Real in 2026](ai-and-agentic-commerce.html).\n- Any description of Zalando's current service inventory, order or pricing architecture, or ZEOS internals.\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-13** — Converted spec.md to spec.json from the published chapter, one spec paragraph per unit. Intent outcome, the five acceptance criteria, thesis and role copied unchanged from journal-spec.json; md and _research/consistency-issues.md — The Zalando channel, the stock sync chain, the Black Friday figures, the Deprecated Endpoint, W1, W5, W7, W8, the team of fourteen.\n  - journal-spec.json (case-zalando; part-11; case-composable-movement transition_in) — Intent, thesis, role, acceptance criteria and the hand-off.\n  - case-amazon, api-contracts-and-versioning, events-consistency-and-reconciliation, commerce-architecture-styles, organizing-commerce-engineering, commerce-scaling-stages, ai-and-agentic-commerce — The companion case and the owning chapters, linked rather than re-taught.\n- **External**\n  - Zalando Engineering blog posts 2015-2026 — The architecture record (Radical Agility on AWS; API Guild; Data Integration; From Jimmy to Microservices; Four Lessons; Tech Radar; One Year Later; Third Generation Microservices; Principles over Frameworks; Tech Radar Update 2020; Sunrise; From Event-Driven to API; Agentic Identity Broker).\n  - Zalando RESTful API and Event Guidelines; Tech Radar; GitHub repositories (Skipper, Patroni, Nakadi, Zalenium, STUPS) — Governance rules and project status.\n  - Zalando corporate pages 2020-2025, FY2025 fact sheet and Annual Report 2025; ABOUT YOU press release 2025 — The platform strategy and figures.\n  - InfoQ (2016, 2016, 2018), Diginomica (2016), ChannelX (2023), Retail Gazette (2023), FashionUnited (2026) — Secondary accounts where primary pages were absent.\n\n## Changelog\n\n- **2026-11-13** — AC-3 expected answer copied from the journal spec (85-plus teams dated to February 2016).\n- **2026-11-13** — After the confirming round 3: closing fixes to transitions, the survival table, the 2020 row and the evidence list; final length 6,249 words against 6,300.\n- **2026-11-13** — After draft-check round 2: Tech Radar paragraph moved into the discipline section; transitions and lead-ins fixed; open questions auto-resolved under the standing instruction of 2026-11-12.\n- **2026-11-13** — After draft-check round 1: journey paragraph and the open-source section moved; roadmap, flow and transitions rewritten; length.max_words 6,300.\n- **2026-11-13** — Converted spec.md to spec.json (outcome-spec pass): reconstructed from the published chapter; added thesis, roadmap and synthesis units, the similarity with Amazon and the corrected hand-off; two units moved inside their sections; facts checked against the cited sources. Flow rubric notes taken (sound with notes).\n- **2026-11-07** — Visual layer: redrew 3 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator).\n- **2026-11-07** — Initial spec and article.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
