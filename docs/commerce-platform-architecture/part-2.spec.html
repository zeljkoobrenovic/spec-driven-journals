<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published page (posts/part-2-intro/index.md, 448 words, nine units) and its former spec.md, then reordered the same day (see decision_log); the page was revised to match. One spec paragraph per unit of the page (p02a was added after check round 2); the KEY POINTS callout and Figure 2 are evidence of the claim paragraph (p02), Figure 1 of the opening example (p01).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part II answers five questions in order: who owns product content and identifiers, who selects a price and how channels receive it, how offers combine and reach invoices and refunds, what feeds the search index, and what 'in stock' means.\n- **Know:** The facts on one product page change at different speeds and have different owners.\n- **Be able to:** Pick the Part II chapter that answers the decision in front of them.\n\n**Audience:** Readers new to commerce architecture (engineers, product managers and leaders in their first weeks at a merchant, a vendor or an agency) who have read Part I and are about to start the catalog chapters, or who arrive with one catalog, pricing or stock decision in hand and want the chapter that answers it.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side.\n- Roughly what an API, a database and a queue are.\n- Part I: the thirteen steps of an order, promise and handoff, the capability map, the rule of one record per fact with every other value a copy, channel, the shop platform, PIM in a clause.\n- Kestrel & Pine in outline: a fictional outdoor brand, its systems, its incidents and the Waypoint program; Eva's jacket order of 13 April 2027 as the book's worked order.\n\n**Does not yet know:**\n\n- SKU and GTIN as the names of the internal stock code and the global barcode identifier (owned by product-information; described in plain words here).\n- The search index as a copy of catalog data that search reads (owned by commerce-search-and-discovery; glossed in a clause here).\n- Price selection, discount allocation and availability arithmetic: each is owned by a Part II chapter and only named here. Commitments and effective-dated prices are glossed in a clause where the chapter list uses them.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the five chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next five chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | A reader of this page alone can say why the facts on one product page are not updated on one schedule. *Probe:* Using only this page: why should a product's description and its stock badge not be updated on the same schedule? | `custom` | cold_reader | minor |\n| AC-3 | Given two problems, the reader names the Part II chapter that answers each. *Probe:* Two problems are in front of you: (a) two discounts were applied together on some orders, and the refunds for those orders came out at the wrong amount; (b) shoppers who type a common word for something you sell get no results. Using only this page: which chapter of this part do you open for each, and why? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** Which system should own each fact a shopper reads before buying (the product's description, its price, a discount, its stock status), and how should each fact reach the channels and the search results that show it?\n\n> **Claim:** The four facts need four owners, not one catalog, because they do not change together (content changes by the season, a price by the day, a discount with each cart, stock by the second): product content is owned attribute by attribute in the system where its producing team works, a price by the system whose rule selects it, a discount by the cart that computes it, and stock status by one service that derives it from counted stock and commitments. A channel that can ask the owner at the moment of sale asks it; the search index and every other channel receive a copy of each fact, and a copy is safe to show only if it names its source and is compared with that source on a schedule set by how fast the fact changes.\n\n**Disputed by:** The view that the catalog is one record in one product, the shop platform or a product information system, which holds description, price, discount and stock together and pushes them to every channel on one schedule.\n\n**So what:** A merchant that accepts the claim answers four ownership questions before it buys a product information system, a pricing service, a search service or a faster connector, and adds a comparison of copy against source to every feed it keeps; Kestrel & Pine's Price Drift ran for nine days, and its Black Friday Oversell for an evening, because no such comparison existed.\n\n**How and why:** A description may be a day old without harm, a price that is a day old is charged to real orders, a discount depends on a cart that does not exist until the shopper builds it, and the last unit can be sold in seconds; one update schedule is therefore too slow for stock or needlessly strict for content. A channel that holds its own listing cannot ask the owner at the moment of sale, so it shows a copy, and a pushed update that is lost raises no error anywhere: only a comparison finds it.\n\n**Supporting claims**\n\n- **P2-1** — Product data needs one owning system per attribute, not per product, and identifiers (SKU, GTIN) that are never changed or reused, because orders, warehouses and marketplaces are keyed on them.\n- **P2-2** — A price is selected from several valid candidates by one written rule, once, at order placement, and frozen on the order; the invoice and any refund copy that frozen price.\n- **P2-3** — A discount is computed once, in the cart, in a declared order of evaluation with a stop rule, and is finished only when it is allocated to the order lines that invoices and refunds read; gift cards and loyalty points are balances the merchant owes, not discounts.\n- **P2-4** — The search index owns no fact: it is a copy of product, price, availability and review data, so what a shopper can find is decided by what is fed into the index and how fresh each feed is.\n- **P2-5** — 'In stock' is a number derived from counted stock and commitments, each with one writer; it is computed in one place and published to the channels, not stored as a fact by each of them.\n- **P2-6** — A channel that cannot ask the owning system at the moment of sale shows a copy, and a copy is safe to show only with a named source and a scheduled comparison against it.\n\n## Role in the part\n\nPerforms the part's opening: states the part thesis, places the part before 'add to cart' in Eva's order and gives the reading order.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in chapters: the five chapter paragraphs, in the part's reading order)\n\nThe page opens on one product page as the hook, to which the closing returns, and then narrows: from the part's claim about the facts on that page, to the place of those facts in one order (Eva's, before she adds the jacket to her cart), to the one company whose disagreements between copies open the chapters, to the five questions the part asks, to one paragraph per chapter; it ends on what the five answers add up to and where to start. The claim stands directly after the hook because the hook is its example; Eva's order stands before Kestrel & Pine's failures because it shows what the facts are needed for, and the failures are the cases in which one of them was wrong; (this one pair runs from a single order to the whole company, as a prerequisite step and not a narrowing: put the company first and its failures arrive before the reader knows what the facts are needed for); the five questions stand directly before the chapter list because they are the principle that orders it; the reading advice comes last because a reader can choose a chapter only after seeing what each one decides. Put the chapter list first and its cases (the €179 price, the Black Friday orders) arrive with no company and no claim to belong to; put the five questions before the claim and they have nothing to be questions about; put the advice first and it points at chapters the reader has not met.\n\n## Introduction\n\n**Hook** (`intriguing_example`): A shopper reads a jacket's description, price and stock badge on the same page. The description may stay unchanged for a season; the last sellable unit can disappear while the page is open.\n\n**Bridge:** The shopper's side, where the description, the price and the badge sit side by side on one page. → The merchant's side, where each of them changes at its own speed and comes from a different system, so that one update schedule cannot serve them all; and Eva's order, which needs all of them to be right before she adds the jacket to her cart on 13 April 2027.\n\n**Thesis statement** (KEY POINTS bullets 1 and 2, and paragraph p02; bullet 3 and paragraph p02a carry the claim's last step): Part II argues that product content, price, discount and stock status need four owners, not one catalog, because they do not change together. A channel that can ask the owner at the moment of sale should ask it. A channel that cannot shows a copy, and so does search, which owns none of the four facts; a copy is safe to show only if it names its source and is compared with that source on a schedule.\n\n**Roadmap** (paragraph p05):\n\n- Five chapters answer five questions in order: who owns product content and identifiers, who selects a price and how channels receive it, how discounts and other offers combine and reach invoices and refunds, what feeds the search index, and what 'in stock' means. Each chapter starts with one Kestrel & Pine disagreement between copies. *Kept in:* chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | The facts a shopper reads side by side on one product page change at very different speeds, so updating them on one schedule can leave the page right about the product and wrong about whether it can be bought. | example: A jacket's page: the description may stay unchanged for a season; the last sellable unit can disappear while the page is open.; figure: Figure 1: a product page whose description, price, discount and stock indicator connect to a season calendar, a daily calendar, a cart and a stopwatch. |  |\n| p02 | claim | Part II's claim: applying Part I's rule of one record per fact to the facts a shopper reads before buying, product content, price, discount and stock status need four owners, not one catalog, because they do not change together, and a channel that cannot ask the owner at the moment of sale, like search, which owns none of the four, shows a copy that is safe only with a named source and a scheduled comparison. | reasoning: KEY POINTS callout: catalog facts have different owners and different clocks; every channel shows a copy, and a copy needs a source and a reconciliation; a promise is computed once, in one place, and then frozen.; figure: Figure 2: the shape Part II recommends: four kinds of catalog fact with four owners and four clocks, a search index (the copy of the catalog that search reads) that is openly a copy of all of them, every channel receiving those facts, and a reconciliation that compares each copy to its source on a schedule. | `elaboration`: The product page whose facts change at different speeds, and Part I's rule of one record per fact (the previous page's hand-off). → The claim the part draws: four owners, not one catalog, and the condition under which a copy is safe to show. |\n| p02a | claim | The claim's last step: once an order is placed, the price, the discount and the unit promised to it are fixed on that order, so invoices and refunds read the same values. |  | `additional_support`: The claim about owners and copies. → Its last step, which KEY POINTS bullet 3 names: what is promised to an order is computed once and fixed on it. |\n| p03 | context | In the order's journey all of these facts are needed before 'add to cart': before Eva orders on 13 April 2027 her jacket needs a description, an image and identifiers, search must find it, pricing must select €199, availability must confirm a unit can be sold, and the discount rules must find that her €235 basket qualifies for free shipping. | scenario: Eva's order of 13 April 2027 (fictional): the Ridgewalker women's M in moss at €199; a €235 basket that qualifies for free shipping. | `place`: The four facts, their owners and the order on which the promised values are fixed. → Where they sit in the order's journey: before the cart, in the order of Eva that chapter 1 followed. |\n| p04 | example | The part tests its claim on cases in which one of those facts was wrong, at Kestrel & Pine, the fictional outdoor brand that sells Eva's jacket; each chapter starts with one disagreement between its copies. | scenario: Kestrel & Pine (fictional): copies of product, price and stock data that disagreed across systems, one disagreement per chapter. | `contrast`: Eva's order, which needs each of those facts to be right. → The company that sells the jacket and the cases in which one of the facts was wrong, which open the chapters. |\n| p05 | transition | Part II asks five questions in a fixed order, one chapter each (who owns product content and identifiers, who selects a price and how channels receive it, how discounts and other offers combine and reach invoices and refunds, what feeds the search index, what 'in stock' means); four concern the four facts and the fourth concerns search; each chapter uses what earlier ones settled, and stock follows search because the search chapter leaves open what 'in stock' on a results page means. |  | `sequence`: Kestrel & Pine's disagreements between copies, one per chapter. → The five questions the chapters answer, in order, and the reason for the order. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the five chapters decides one question and opens on one Kestrel & Pine disagreement, and each builds on chapters before it.\n\n**Advances the thesis** (P2-1, P2-2, P2-3, P2-4, P2-5, P2-6): Each paragraph introduces the chapter that argues one of the part's supporting claims, so the list is the part's argument in outline; the pricing, search and inventory paragraphs name the comparison of copy against source that P2-6 asks for.\n\n**Transition in:** `elaboration`: The five questions in order. → One paragraph per chapter: the question in bold, the Kestrel & Pine case it opens on and what the chapter does about it.\n\n**Order of paragraphs** (`prerequisite_order`): The part's own reading order, as the journal spec declares it. Prices are stored per variant, so the product chapter's identifiers come first; a discount is subtracted from a selected price, so pricing precedes promotions; the search index is a copy of product, price and stock data, so it follows the chapters that say who owns the first two and names stock only as one of the things it copies. Availability comes last although search copies it: the stock figure the index shows is the question the search chapter leaves open, and the inventory chapter's last step, committing one unit to one order at checkout, is where Part III begins. Put inventory fourth and that one forward reference goes, but the part then ends on search and not on the unit committed at checkout. Move search first and a copy is described before the reader knows what it copies; move inventory before pricing and the price-to-discount sequence is cut in two.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | description | The product chapter decides which system owns product content and identifiers: at Kestrel & Pine four teams entered one season four times and no version was the owner's, which motivates a product information management system, and the chapter separates the product, its sellable variants, internal stock codes and global barcode identifiers. | scenario: Kestrel & Pine's season entered four times by four teams (fictional). |  |\n| p07 | description | The pricing chapter decides who selects a price for a variant and how channels receive it: a failed update left the German storefront at €179 instead of €199 for nine days, and ownership, prices with a start date, and a comparison of each copy with its source address the failure. | scenario: The German storefront at €179 for nine days instead of €199, losing about €8,200 (fictional). | `sequence`: The variants the product chapter identified. → The price each variant carries: who selects it and how channels receive it. |\n| p08 | description | The promotions chapter starts from the selected price and decides how offers combine and how discounts reach invoices and refunds: a setting changed for one campaign and never changed back let two discounts combine on 2,860 Black Friday orders at a cost of about €52,000, part of it in wrong refunds, because nobody owned how offers combine; the chapter also separates discounts from gift-card and loyalty balances, which are money the merchant owes. | scenario: A setting changed for one campaign and never reverted let two discounts combine on 2,860 Black Friday orders, costing about €52,000 in all, about €3,000 of it in refunds at the wrong amount (fictional). | `sequence`: The price the pricing chapter selects. → What is subtracted from that price, and how the result reaches invoices and refunds. |\n| p09 | description | The search chapter treats the search index as a maintained copy of product, price, stock and review data, owning none of them: missing attributes and synonyms made a waterproof jacket hard to find, and correcting what is fed in improves the results without replacing the engine. | scenario: A waterproof jacket that searches could not find because attributes and synonyms were missing (fictional). | `contrast`: Product content, price and discount, each with an owner. → A system that owns none of them and shows copies of all of them: the search index. |\n| p10 | description | The inventory chapter comes last and solves a problem the search chapter leaves open, a results page that says 'in stock' from an old copy of the stock figure: it distinguishes physical stock from what a channel may still sell, the Black Friday oversell of 1,340 jackets shows the cost of delayed copies, and the remedy assigns owners to stock and to commitments (units already promised to orders) and calculates availability from both. | scenario: The Black Friday oversell of 1,340 jackets (fictional). | `problem_solution`: The stock data the search index copies, which a results page can show from an old copy. → What 'in stock' means and who computes it. |\n\n## Conclusion: What the Five Answers Add Up To, and Where to Begin\n\n**Synthesis:** The five chapters are one account of the product page the part opened on: the description, the price, the discount and the stock badge each get an owner and a path to every channel, and each copy of them, the search result that led to the page included, gets a named source and a comparison with it. No chapter says this of the whole page; each says it of one fact.\n\n**So what:** When a product page or a listing is wrong, a reader with the five answers first asks which fact is wrong and who owns it, and then opens the chapter for that fact, before asking for a faster synchronization.\n\n**Callback:** The opening's product page (p01), where a jacket's description, price and stock badge sit side by side. The reader can now see the page as separate facts, each with its own chapter, instead of one record.\n\n**Takeaway** (`course_of_action`): With one decision in hand, open the chapter for the fact it concerns; otherwise read the five in order, beginning with product information.\n\n**Hand-off** to [What Are We Selling? Products, Variants and the Catalog](product-information.html): `elaboration`: The part's claim that the facts on one product page have different owners and change at different speeds. → The slowest-changing of them, product content, and the identifiers on which every other catalog fact is keyed.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | synthesis | Together the five answers give each fact on the opening's product page an owner and a path to every channel, and each copy, the search result included, a named source and a comparison, so a reader faced with a wrong page first asks which fact is wrong and who owns it. |  |  |\n| p12 | recommendation | A reader with one decision in hand can start at the chapter for the fact it concerns; everyone else reads the chapters in order, beginning with product information, the slowest-changing fact, whose identifiers every other catalog fact is keyed on. |  | `cause_effect`: The five answers as one account of the page, fact by fact. → How to read them: from the chapter a decision points to, or in order, starting with product content and identifiers. |\n\n## Non-goals\n\n- Teaching the product model, price selection, promotion stacking, indexing or availability arithmetic; the page summarizes and does not re-argue. See [What Are We Selling? Products, Variants and the Catalog](product-information.html), [What Does It Cost? Price Lists, Contract Prices, Currencies and Tax](pricing-architecture.html), [Discounts, Coupons and Loyalty: Promotions Without Chaos](commerce-promotions.html), [Finding the Product: Search, Navigation and Merchandising](commerce-search-and-discovery.html), [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html).\n- Scale-stage comparisons (each chapter has its own table).\n- The part's closing (what the five cases have in common, read back from the end of the part). See [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html).\n- External factual claims; the page makes none of its own.\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Draft-check round 3 (escalate, budget spent): 14 passed, 7 failed, of which 5 major and 2 minor. Fixed after the round without a further check, so check-report.json is stale and a re-check should confirm them: p02a now opens 'The claim has one more part' (transition, draft); p03 opens 'All four facts' (see next item); p05 says 'The fourth question concerns search; the other four take one fact each'; p04 says 'that company's copies'; p02 says 'A channel that cannot ask'.\n- For the author (order, at fault in the spec in round 3, both flow readers): p02a, the claim's last step (values fixed on the order), stands between the four facts and Eva's paragraph, whose first sentence points back at the facts. Only the wording was changed after the round. The readers' alternatives: move p02a after Eva's paragraph or into the closing. Putting it back into p02 was tried in round 2 and failed as two ideas in one paragraph. If p02a moves, rerun the flow rubric.\n- For the author (KEY POINTS callout, left as written in all three rounds): bullet 2's 'the marketplace selling an empty shelf' is not recognisable as the Black Friday oversell of the chapter list (one flow reader in each round); bullet 3's 'the discount allocated to every line' uses 'allocated' and 'line' unexplained (round 3, corroborated); bullet 1's 'Content tolerates a day's lag' sits beside 'content changes by the season' (round 1, one reader).\n- For the author (length): the page is at ent's first 'know' is the five questions in order and AC-1 is checked on the introduction. For the author: cut the list from p05 if the repetition reads heavy.\n- Flow rubric, minor note not taken: 'review data' in the search paragraph (p09) has no owner anywhere on the page. It is the author's wording and the part thesis's (P2-4).\n\n## Decision log\n\n- **2026-11-12** — After draft-check round 2 (escalate: 12 passed, 10 failed, of which 5 major and 5 minor; one major failure at fault in the spec), under the author's standing approval. Spec: p02 held two ideas after round 1's addition, so the claim's last step (values fixed on the order) is now a paragraph of its own, p02a, after Figure 2; p02 says where search stands (it owns none of the four facts); p05 gives the list first, then says which question is about search and why stock follows search; p04 and the roadmap promise 'one disagreement' per chapter, not its 'business cost', because the search chapter's case has no cost figure on this page; p08 says what the Black Friday case shows and why gift-card and loyalty balances are set apart; 'discount' is the one name for the fact (Eva's paragraph, p08), with 'offers' kept in the bolded question. Draft revised in the same units; the closing's first two sentences merged to stay within 900 words. Rejected: Renaming the case in KEY POINTS bullet 2 ('the marketplace selling an empty shelf') to match the oversell in the chapter list (one reader, both rounds): the callout is the author's wording; see open_questions.; Adding the frozen promise to the closing's synthesis (one reader): the word limit, and the part's closing belongs to inventory-and-availability.\n- **2026-11-12** — After draft-check round 1 (escalate: 11 passed, 16 failed, of which 10 major and 6 minor; two major failures at fault in the spec), under the author's standing approval to change paragraph ideas and transitions. Spec: p02's idea gains the claim's last step (what is promised to an order is fixed on nd The First Snowfall are left to the chapters that own them. (Carried from spec.md; the FAILURE PATTERNS block it refers to was dropped on 2026-11-08.)\n- **2026-11-07** — Added a five-row table (what the shopper sees, the fact, the owner, how fast it changes, the chapter) because the part's argument is the difference in clocks, and a table shows that faster than prose. (Carried from spec.md; the published page no longer has the table, and Figure 1 carries the four clocks.)\n\n## Sources\n\n- **Internal**\n  - journal-spec.json (part-2 and its post entry part-2) — Intent, AC-1, AC-2 and role (post entry); thesis, supporting claims, opening hook, bridge and roadmap (part); the transitions between the five chapters; product-information's transition_in for the hand-off.\n  - product-information, pricing-architecture, commerce-promotions, commerce-search-and-discovery, inventory-and-availability — The chapters summarized, in their words and numbers: their callouts, scene-setting sections and closing paragraphs.\n  - config.yaml, PLAN.md, _research/scenario-ledger.md, _research/consistency-issues.md and _research/INTRO-BRIEF.md — Reading order, the fictional facts and their rulings, and the shape and length of a part introduction.\n\n## Changelog\n\n- **2026-11-12** — Draft-check round 3: escalate (14 pass, 7 fail: 5 major, 2 minor; one major at fault in the spec). Five wording fixes applied to the draft afterwards with no further round, so check-report.json is stale. (AI-mediated session)\n- **2026-11-12** — Draft-check round 2: escalate (12 pass, 10 fail: 5 major, 5 minor). Spec: p02 split (p02a added), p04, p05, p08, roadmap, synthesis wording. Draft revised in the same units. (AI-mediated session)\n- **2026-11-12** — Draft-check round 1: escalate (11 pass, 16 fail: 10 major, 6 minor). Spec: p02, p05, p06, p07, p10 ideas, thesis statement, synthesis. Draft revised in the same units. (AI-mediated session)\n- **2026-11-12** — Converted spec.md to spec.json (outcome spec) and reordered the page; status draft. Numbers checked against the ledger at conversion: 13 April 2027, Ridgewalker women's M in moss, €199, €235 and free shipping (Eva's jacket); €179 for nine days, about €8,200 (incident 4); 2,860 orders, about €52,000 (commerce-promotions line, ruling 9); 1,340 jackets (incident 1). (AI-mediated session)\n- **2026-11-08** — Openers: dropped IN THIS PART and FAILURE PATTERNS blocks; tightened KEY POINTS (author request). (AI-mediated session)\n- **2026-11-07** — Visual layer: redrew 1 mermaid diagram as illustrations and added 1 conceptual figure (article-illustrator). (AI-mediated session)\n- **2026-11-07** — Final consistency pass: 'the scenario ledger's' figures rephrased. (AI-mediated session)\n- **2026-11-07** — Editorial review pass: tightened the chapter list and lead, defined SKU, GTIN, PIM and system of record on first use. (AI-mediated session)\n- **2026-11-07** — Initial spec and article. Status accepted. (AI-mediated session)\n"}]}]}</script>

        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;

                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {

                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');

                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
