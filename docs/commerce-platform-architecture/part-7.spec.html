<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published page (posts/part-7-intro/index.md, ten units) and its former spec.md; the page was revised to match (see decision_log). One spec paragraph per unit of the page; p04a (the five questions) was split from p04 and p02 on 2026-11-12. The KEY POINTS callout and Figure 2 (rented and owned layers) are evidence of the claim paragraph (p04); Figure 1 (the strong link and the weak joins) belongs to the Kestrel & Pine paragraph (p03) and Figure 3 (the five questions) to the roadmap paragraph (p04a). The published page's closing line 'Begin with [Monolith, Modular Monolith, Microservices, Composable: What the Evidence Says](commerce-architecture-styles.html)' became the headed conclusion (p10).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part VII answers five questions in order: how software is divided into separately deployed programs and when a split pays; how vendors share infrastructure between customers and how API call budgets limit integrations; who owns each extension and what it may change; whether pages are rendered by the platform or by a separate headless application; and how to prepare the whole order path for a peak.\n- **Know:** Kestrel & Pine's starting point: two early-2027 rebuild proposals (about €3.2M for separate commerce services, €240,000 for a separate storefront) while the platform held 2,300 orders in the 2026 peak hour, order export managed about seven a minute and stock lagged up to two hours.\n- **Know:** That a merchant on a hosted platform rents the renderer, the checkout and a share of a multi-tenant system, and owns the theme, the apps and the integration code around them.\n- **Be able to:** Pick the Part VII chapter that answers the decision in front of them.\n\n**Audience:** Readers new to commerce architecture (engineers, product managers and leaders at a merchant on a hosted platform) who have read Parts I to VI and are about to start the platform chapters, or who have just been handed a rebuild, headless or 'are we behind?' proposal and want the chapter that answers it.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Part I: the thirteen steps of an order, promise and handoff, the three status lines, the capability map, system of record, single writer, events, idempotency and reconciliation; the glosses for PSP, WMS, ERP, iPaaS, API call, SKU, channel, marketplace connector, OMS, availability service and PIM; 'the shop platform' as Kestrel & Pine's hosted product; the Waypoint decisions W1 to W8 and the incidents in outline.\n- Parts II to V: one owner per product, price, discount and stock fact; checkout creating the order once; one order record; the warehouse as the only writer of on-hand stock; the ERP for finance.\n- Part VI: an integration style per flow with an owner; repeats made harmless and a reconciliation job; pinned versions and sunset dates; one master and cross-reference per entity; one owned definition per metric.\n- Kestrel & Pine in outline: a fictional outdoor brand, Noor Visser as Head of Engineering, Black Friday 2026 and the Oversell, Eva's jacket order of 13 April 2027.\n\n**Does not yet know:**\n\n- Deployment units and architecture styles (named here as 'separately deployed programs'; owned by commerce-architecture-styles).\n- Multi-tenancy and API call budgets (rate limits); glossed in a clause here, owned by multi-tenancy-and-isolation.\n- App scopes and extension mechanisms (named here as 'permission boundary'; owned by extensibility-and-app-ecosystems).\n- Headless storefronts (glossed in a clause here; owned by storefront-architecture) and peak-load measures (owned by peak-load-and-reliability).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the five chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next five chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | A reader of this page alone can say what failed at Kestrel & Pine's 2026 peak and why the rebuild proposals were aimed at the wrong part. *Probe:* Using only this page: Kestrel & Pine's platform held on Black Friday 2026. What failed, and why does the part argue that the rebuild proposals were aimed at the wrong part? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** How does the way a bought platform is built limit what a merchant can promise, and what is left for the merchant to decide?\n\n> **Claim:** The vendor builds and runs the inside (architecture style, pooled tenancy, extension points, renderer, peak capacity), which reaches the merchant as limits: API budgets the vendor may lower, extension points with retirement dates, a checkout the merchant cannot replace. Within them, the merchant's promises are kept or broken in what it owns around the platform: its integration code, its share of each budget, its apps, its page scripts and its order chain.\n\n**Disputed by:** The view that the platform's architecture decides what a merchant can promise, so a merchant whose promises fail should move to a more modern architecture: microservices, composable commerce, a headless storefront or a higher plan tier.\n\n**So what:** A merchant that accepts the claim answers rebuild, headless and 'are we behind?' proposals with measurements of its own layer, and governs what it owns before it replaces what it rents. On Black Friday 2026 Kestrel & Pine's platform held 2,300 orders in the peak hour while its order flow carried about seven orders a minute and stock reached the channels up to two hours late. In 2027 it declined a composable rebuild (about €3.2M) and a headless storefront (about €240,000), stayed on the platform (W4), kept its own code in one integration service, put the order flow first in its API budget, cut 41 apps to 34 with no app writing stock, brought INP from 310 ms to 180 ms for about €38,000 of agency time, and wrote a peak plan that tests every link at 80 orders a minute.\n\n**How and why:** The vendor deploys the core for many merchants, so a merchant can neither change nor verify its internal style. What the merchant shares is capacity, which the vendor protects with fixed budgets it may shrink; the shared pool smooths the platform's own peak across tenants while each budget meets one merchant's spike in full. Extension points and API versions are retired on the vendor's dates, the platform keeps checkout, and every script the merchant adds to a page slows it. Everything the merchant adds (integration code, apps, scripts, flows) spends from those limits, and no vendor review sees how the merchant's additions combine, so each Kestrel & Pine failure this part examines crossed the merchant's own layer while the platform did what its vendor designed.\n\n**Supporting claims**\n\n- **P7-1** — An architecture style is a choice of deployment units, data ownership and boundary enforcement; the documented splits were made at a traffic wall or at hundreds of teams and took years, so a merchant's own code gets one deployment unit per team that must release independently, with boundaries drawn around systems of record.\n- **P7-2** — A hosted platform and every SaaS a merchant rents pool tenants and protect shared capacity with rate limits per app, store or customer that the vendor may lower; the merchant plans its share: who spends each budget, the order flow first at peak, and one tenant for several markets while the platform can vary what differs.\n- **P7-3** — Extension mechanisms differ by where the code runs, what it may touch and how tightly it is tied to the vendor's releases; app review cannot see two apps writing one fact, so the merchant keeps an owner, scopes and API version per app, one writer per fact, and custom behavior out of the core.\n- **P7-4** — The storefront renders facts other systems own and leaves checkout on the platform under every rendering model; content is cached and promises are fetched or validated live, and headless pays only for a need the theme cannot meet, with a team to run it, never for speed alone.\n- **P7-5** — The platform smooths its peak across merchants while the merchant's chain meets its own spike alone; the merchant measures every link in orders per minute, tests above the forecast, protects checkout with gauged queues and a written switch-off order, and reconciles its systems the morning after.\n\n## Role in the part\n\nPerforms the part's opening: states the part thesis in its three key points, places the part on the machinery behind Eva's jacket purchase, recalls Kestrel & Pine's two rebuild proposals against the platform that held and the joins that did not, and gives the reading order.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in chapters: the five chapter paragraphs, in the part's reading order)\n\nThe page states a problem and the part's answer. It opens on a hosted platform that keeps taking orders while the merchant's connector falls behind (the problem: which part limits the order flow); places the part inside the platforms Part VI's joins attach to; gives Kestrel & Pine's case, two rebuild proposals aimed at the shop platform that held while the merchant's joins failed; then the claim, that the vendor's inside reaches the merchant as limits and the promises are kept or broken in the merchant's own layer; then the five questions the chapters ask, one per layer, with their figure; then one paragraph per chapter; and a closing that reads the opening scene along the part's line and says where to start. The case comes before the claim because the claim answers it; the five questions come after the claim because each asks where the vendor's limits end and the merchant's layer begins for one layer, and they sit directly before the chapter list that answers them. Put the claim first and it answers a problem the reader has not seen; put the questions before the claim and their reading order arrives before the reader knows what is being read (both round 2 flow readers).\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A hosted commerce platform keeps accepting orders while the merchant's warehouse connector falls behind: renting the core transfers some operating work to the vendor, but extensions, storefront customizations and integrations can still interrupt sales or fulfillment.\n\n**Bridge:** Part VI's joins between the merchant's own systems (chapter 28 hands off with 'Part VII moves inside the platforms the merchant buys'), and Eva's jacket purchase, the book's running example. → The platforms those joins attach to, along the machinery behind Eva's purchase; then Kestrel & Pine's two early-2027 rebuild proposals (about €3.2M for separate commerce services, €240,000 for a separate storefront) set against a shop platform that held 2,300 orders in the Black Friday peak hour while order export managed about seven a minute and stock lagged up to two hours.\n\n**Thesis statement** (KEY POINTS bullets 1 to 3 and paragraph p04): The vendor builds and runs the platform's inside, which reaches the merchant as limits (API call budgets the vendor may lower, extension points with retirement dates, a checkout the merchant cannot replace); within those limits the merchant's promises are kept or broken in what it owns around the platform: its integration code, its share of each budget, its apps, its page scripts and its order chain.\n\n**Roadmap** (paragraph p04a and Figure 3):\n\n- Five chapters, one question each, from the inside of the platform outward to the day it is tested: how the software is divided into separately deployed programs, how vendors share infrastructure between merchants and meter capacity, who owns each extension and what it may change, how pages are delivered (platform-rendered or headless), and how the whole order path survives a peak. *Kept in:* chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | A hosted commerce platform can keep accepting orders while the merchant's warehouse connector falls behind, because renting the core moves some operating work to the vendor but leaves the extensions, storefront customizations and integrations that can still interrupt sales or fulfillment; the part separates those responsibilities so the merchant can invest where the order flow is actually limited. | example: A hosted platform still taking orders while the warehouse connector falls behind. |  |\n| p02 | context | Where Part VI dealt with the joins between the merchant's own systems, this part looks inside the platforms those joins attach to, along the machinery behind Eva's jacket purchase (the order the book follows), separating at each step the vendor's decisions from the merchant's. | reasoning: Part VI's joins against the platforms they attach to; Eva's purchase as the order the book follows. | `place`: The hosted platform and the merchant's own layer around it; Part VI's joins between the merchant's systems. → Where the part sits: inside the platforms those joins attach to, along the machinery behind Eva's purchase. |\n| p03 | example | Kestrel & Pine, the fictional outdoor brand, faces two rebuild proposals in early 2027 (about €3.2 million to replace the shop platform with separately deployed services of its own, €240,000 for a separate storefront), put to Noor Visser, its Head of Engineering; both aim at the shop platform, which had held (on Black Friday 2026 the shop platform handled 2,300 orders in the peak hour, about 38 a minute), while what failed sat around it (order export to the warehouse at about seven a minute, stock updates up to two hours late) and the proposals left those weak joins for a later phase two. | scenario: The composable rebuild (about €3.2M) and the headless storefront (about €240,000), February 2027; 2,300 orders in the peak hour of 27 November 2026; the order flow at about seven orders a minute; stock up to two hours late (fictional).; figure: Figure 1: a chain whose large platform link holds while the thin order-flow and stock-copy links fray, and a consultant aims a hammer at the strong link. | `example`: The vendor's decisions and the merchant's, inside the platforms the merchant rents. → Kestrel & Pine's case: two rebuild proposals against a shop platform that held and joins that did not. |\n| p04 | claim | Part VII's claim: Noor Visser directs attention to the measured failures because both failures lay in the merchant's own layer: the vendor builds and runs the platform's inside (one multi-tenant system shared by many merchants, including the checkout and the renderer that draws the pages), which reaches the merchant as limits (API call budgets, the number of calls the vendor allows each app or customer in a given time, which the vendor may lower; extension points, the places where apps plug in, with retirement dates; a checkout it cannot replace), and within them the merchant's promises to shoppers (in stock, delivered on time) are kept or broken in what it owns around the platform (integration code, its share of each budget, apps, page scripts, the order chain). | reasoning: KEY POINTS callout: the platform's internals are the vendor's and the code around it is the merchant's; renting a shared system means governing one's share of it (API limits per app, an owner, restricted writes); the storefront renders facts it does not own, and the peak shows it.; figure: Figure 2: a merchant on a hosted platform rents the renderer, the checkout and a share of a multi-tenant system, and owns the theme, the apps and the integration code around them. | `cause_effect`: The two measured failures (about seven orders a minute, stock up to two hours late) and the proposals aimed at the platform. → Why attention belongs on those failures: they sit in the merchant's own layer, within limits the vendor sets. |\n| p04a | description | Part VII's roadmap: the five chapters ask one question each, from the platform's inside outward to the day it is tested (how its software is divided into programs, how it shares infrastructure between merchants, who owns each extension, how its pages are delivered, how the whole order path survives a peak), and together show how to judge rebuild proposals like these without taking on more systems than the team can run. | figure: Figure 3: the five questions of Part VII in reading order, from the inside of the platform outward to the day it is tested. | `elaboration`: The line between the vendor's inside and the merchant's own layer, and the rebuild proposals. → The five questions the chapters ask, one per layer, in reading order. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the five chapters decides one question about the platform, from its inside outward to the peak day, and names the Kestrel & Pine case it works through.\n\n**Advances the thesis** (P7-1, P7-2, P7-3, P7-4, P7-5): Each paragraph introduces the chapter that argues one supporting claim, so the list is the part's argument in outline.\n\n**Transition in:** `elaboration`: The five questions asked in p04a and drawn in Figure 3. → One paragraph per chapter: the question in bold and the Kestrel & Pine case.\n\n**Order of paragraphs** (`prerequisite_order`): The chapters move from the platform's inside outward to the day it is tested, and each uses what the one before fixed: architecture styles separates the vendor's inside from the merchant's own code; tenancy names what the merchant does share, capacity metered by API call budgets, and finds apps and connectors spending it; extensibility governs those apps; the storefront chapter needs the apps' scripts to explain the slow pages and gives the cache rule the peak relies on; the peak chapter tests every earlier answer at once. Putting the peak earlier would size a chain whose budgets, apps and caches the reader has not met; putting the storefront before extensibility would leave the eleven apps' scripts unexplained.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description | The architecture-styles chapter compares how software is divided into separately deployed programs: large companies' published accounts of their own splits show why a split can pay when teams must release without waiting for each other and why each service adds operating work; because each account is dated and describes a company far larger than most merchants, for a merchant's own code the chapter recommends one deployment unit per team that must release on its own, and ends on the line between the vendor's inside and the merchant's own code. | reasoning: Dated company accounts of splits, and the cost each extra service adds. |  |\n| p06 | description | The tenancy chapter turns to what the merchant does share, with other merchants: the vendor's capacity; how vendors share infrastructure while separating customers, how those API call budgets can hold up order export while the storefront is healthy, and how Kestrel & Pine's peak logs show apps and connectors taking most of the budget so that both ends call for capacity checks at both ends of an integration (the platform and the warehouse system). | scenario: Kestrel & Pine's peak logs: stock-writing apps and the connector's full sync took about 55% of the platform budget, and the order flow was throttled at both ends on Black Friday 2026 (fictional). | `contrast`: The vendor's inside, which the previous chapter leaves to the vendor. → What the merchant does share, with the vendor's other customers: the platform's capacity, metered by API call budgets. |\n| p07 | description | The extensibility chapter establishes an owner and a permission boundary for each extension: an inventory of 41 apps finds six unused and three that change stock levels, and the chapter follows the permission and maintenance decisions that stop two writers (such as an app and the warehouse feed) from changing the same stock figure. | scenario: 41 installed apps, 6 unused, 3 writing stock (fictional). | `elaboration`: The apps and connectors that spend the budget. → The apps themselves, governed: who owns each and what it may change. |\n| p08 | description | The storefront chapter compares platform-rendered pages with a separate, headless application (one that draws the pages itself and fetches data from the platform); measurements trace slow interaction to scripts from eleven apps, and removing that cause improves the existing theme (the templates the platform draws the pages from) and weakens the case for a rebuild. | scenario: Slow interaction on product pages traced to scripts from eleven apps (fictional, February 2027). | `place`: The apps of the previous chapter. → The storefront, the surface where most of their code lands. |\n| p09 | description | The peak chapter prepares the entire order path behind the storefront for concentrated demand: Kestrel & Pine's 2027 plan forecasts 60 orders a minute, tests every link at 80, and includes monitored queues, optional features that can be switched off, named responders and reconciliation after the peak. | scenario: The 2027 peak plan: 60 orders a minute forecast, every link tested at 80, gauged queues, eight switches with owners, a reconciliation report the morning after (fictional). | `contrast`: The storefront, whose cached pages survive a peak. → The chain behind it, which meets the merchant's spike alone. |\n\n## Conclusion: Where to Begin\n\n**Synthesis:** The opening's platform kept accepting orders because its inside is the vendor's and did what the vendor designed; the warehouse connector fell behind in the merchant's own layer. Each chapter draws that line for one layer. No chapter paragraph says this of the opening's scene.\n\n**So what:** A rebuild proposal is answered first with a measurement of the merchant's own layer, and the reader starts with the line between the vendor's inside and the merchant's code.\n\n**Callback:** The opening's hosted platform that keeps accepting orders while the warehouse connector falls behind (p01). The reader can now say which side of the line each half of the scene sits on.\n\n**Takeaway** (`course_of_action`): Begin with commerce-architecture-styles.\n\n**Hand-off** to [Monolith, Modular Monolith, Microservices, Composable: What the Evidence Says](commerce-architecture-styles.html): `elaboration`: The part introduction's first question, how software is divided into separately deployed programs, and Kestrel & Pine's €3.2M composable rebuild proposal against a platform that held. → The four styles defined by deployment unit, data ownership and boundary, the dated accounts behind them, and the rule that sizes a merchant's own code to its teams.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | synthesis | The scene at the start of the page splits along the part's line (the platform held because its inside is the vendor's, the connector fell behind in the merchant's own layer), each chapter draws that line for one layer, so a rebuild proposal is answered first by measuring the merchant's own layer; begin with the architecture-styles chapter. |  |  |\n\n## Non-goals\n\n- Teaching any chapter's content (styles, tenancy models, extension mechanisms, rendering models, peak measures); the page summarizes and does not re-argue. See [Monolith, Modular Monolith, Microservices, Composable: What the Evidence Says](commerce-architecture-styles.html), [Many Merchants, One Platform: Multi-Tenancy, Pods and Isolati         function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');

                    while (i < lines.length && tableRow.test(lines[i])) {

                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
