<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Journey 2: The Jacket Comes Back\n\n## Intent\n\nFollow the recurring order back: Eva's exchange of the Ridgewalker jacket from size M to size L, as the ledger states it, through Kestrel & Pine's late-2027 target architecture (availability service, OMS with its own return state machine, PIM), as one step table and one sequence diagram, so that each step names the system, the data, the promise, the failure that belongs to that step and the chapter that owns it. The chapter's argument is that a return is three flows (stock, money, books) released by one event (the warehouse's disposition), that the refund has one writer and one key, and that an exchange is a return plus a new order at the frozen price. The refund is the alternative path, the Double Refund of January 2027 is the failure path, and marketplace and store returns are variants. A short section shows how the same return ran on the January 2027 landscape, before Waypoint.\n\n## Audience\n\nReaders new to commerce architecture. The engineer or product manager who has read Part IV and Part III and now needs to see returns, refunds and credit notes as one path benefits most; finance and operations readers get the money-and-books half in plain words. Every term (returns portal, RMA, reverse fulfillment order, disposition, right of withdrawal, idempotency key, credit note, available-to-promise, system of record) is explained in one clause where it first appears.\n\n## Success criteria\n\n- [x] Every ledger fact of Eva's exchange (dates 15, 19 and 22 April 2027, items, prices, reason, \"graded resellable\", exchange ships 22 April, refund variant €199 by iDEAL booked as a credit note) is stated exactly; times within a day, ids and carrier scans are labeled illustrative.\n- [x] The chapter says it is set in the late-2027 target architecture and includes a short \"same return in January 2027\" comparison.\n- [x] A step table with the columns step, system, data, promise made, what could fail here and chapter, covering request, label, carrier, receiving, inspection, disposition, exchange order, refund, credit note, stock, notifications and reconciliation.\n- [x] A sequence diagram and one further mermaid diagram, each with a caption that states a point; the sequence diagram shows both the exchange and the refund variant.\n- [x] The Double Refund is told with mechanism, detection, recovery and the February 2027 fix; marketplace and store returns are treated as variants with their own first step.\n- [x] A requirements table (freshness, consistency, latency, availability) for the handoffs, with illustrative figures labeled as assumptions.\n- [x] A reader new to the field can define every term the chapter uses from the chapter alone; every acronym is expanded on first use.\n- [x] Every company-specific claim carries a source and a date (Shopify, commercetools, Adyen, Stripe, Mollie, Odoo, Amazon, Zalando, NRF, Coresight, Directive 2011/83/EU); no invented internals.\n- [x] The three take-away tiers are present; \"When it goes wrong\" gives detection and recovery per failure; 6–10 questions to ask; a hand-off to [Journey 3: A Chain Reorders by EDI, From Order to Invoice](journey-wholesale-order.html).\n- [x] Body at or under 7,000 words including tables (it runs about 6,700, above the 6,500 target; the step table, the two variants and the January comparison are all required).\n\n## Non-goals\n\n- Teaching returns, refunds or credit notes in depth: [The Way Back: Returns, Exchanges, Refunds and Reverse Logistics](returns-and-exchanges.html) owns RMA, disposition, exchange and refund reconciliation; [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html) owns refund mechanics and webhooks; [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html) owns credit notes and the ledger; [Rules Turned Into Requirements: Consumer, Payment, Invoicing and Platform Regulation](commerce-regulation.html) owns the right of withdrawal; [Stores Are Systems Too: Point of Sale and Omnichannel Fulfillment](stores-and-omnichannel.html) and [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html) own the variants' home systems.\n- The forward path ([Journey 1: Eva's Jacket, From Search to Doorstep](journey-consumer-order.html)), the wholesale path ([Journey 3: A Chain Reorders by EDI, From Order to Invoice](journey-wholesale-order.html)) and the peak day ([Journey 4: Black Friday, Hour by Hour](journey-peak-day.html)).\n- An \"Across Scale Stages\" section; journeys do not carry one.\n- Return fraud models and returns-portal vendor comparison.\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\n## Open questions\n\n- The ledger's February 2027 rule makes the returns portal the single refund writer through the platform's API; this chapter has the writer move to the OMS when the OMS takes over return records in Q4 2027, through the same platform API, and records that in the ledger. [The Way Back: Returns, Exchanges, Refunds and Reverse Logistics](returns-and-exchanges.html) (being written in parallel) should use the same reading.\n- The Double Refund mechanism follows the ledger line added by [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html) (support refunding by hand after a carrier scan, the portal refunding again on inspection, no key naming the return); the chapter adds nothing to it.\n- The return policy (free returns within 14 days of delivery), the exchange as a held order #1072455-X1 created at request time and released by the disposition, and the return id R-20270419-1 follow the ledger line added by [The Way Back: Returns, Exchanges, Refunds and Reverse Logistics](returns-and-exchanges.html); the delivery of the exchange on 23 April and the credit-note figures are this chapter's additions.\n\n## Decision log\n\n- **2026-11-07** — Made the WMS disposition event the hinge that releases stock, settlement and the credit note, rather than the return request or the carrier scan, because that single ordering is what makes the three flows agree and is the clearest answer to the Boomerang.\n- **2026-11-07** — Told the Double Refund with the ledger's mechanism (two writers, no key, no single view) and spent the words on the fix (one writer, one key, read-only console, daily match), since [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html) owns the incident's payment side.\n- **2026-11-07** — Treated the exchange as a held order at the frozen price, created at request time and released by the disposition, with a credit note and a new invoice netting to zero, following the returns chapter's held-order model, the pricing chapter's \"exchanges copy frozen prices\" rule and the ERP's invoice immutability, rather than as an order edit.\n- **2026-11-07** — Kept marketplace and store returns as two short variants on the same step table rather than two further walks, to stay within the length cap.\n\n## Sources\n\n- **Internal**\n  - `_research/scenario-ledger.md` — Eva's exchange, the refund variant, the Double Refund, the returns figures, W1–W5 and the additions by chapter (one refund writer since February 2027, the OMS state machines, the Black Friday stacking refunds, the May 2027 reconciliation).\n  - `PLAN.md` — the Part IX contract for chapter 38.\n  - `_research/style-guide.md` — page format, evidence discipline, valid permalinks.\n  - `_research/brief-inventory-fulfillment-returns.md`, `_research/brief-checkout-payments-tax.md`, `_research/brief-security-privacy-regulation.md` — return data models, refund behavior, credit notes, the 14-day right of withdrawal, marketplace return obligations.\n  - [Journey 1: Eva's Jacket, From Search to Doorstep](journey-consumer-order.html) and [Meet Kestrel & Pine](meet-kestrel-and-pine.html) — the forward path, the invoice figures and the January 2027 landscape.\n- **External**\n  - Shopify returns documentation; commercetools order states — the return versus reverse-fulfillment-order split, dispositions, return item states.\n  - Adyen, Stripe and Mollie refund and idempotency documentation — asynchronous refunds, late failures, duplicate blocking, idempotency keys.\n  - Odoo credit-note documentation; FPS Finance Belgium e-invoicing pages; IFRS 15 — invoice immutability, credit notes, revenue reversal.\n  - Directive 2011/83/EU — Articles 9, 13, 14 and 16.\n  - Amazon seller-fulfilled returns guidance (2025); Zalando partner logistics overview — marketplace return obligations and fees.\n  - NRF (2024, 2025) and Coresight (2023) — return rates, fraud share, free-returns preference.\n\n## Changelog\n\n- **2026-11-07** — Initial spec and article. *(AI-mediated session)*\n- **2026-11-07** — Editorial review pass: trimmed under 6,500 words, Belgian mandate hedged, orphaned sources removed. *(AI-mediated session)*\n- **2026-11-07** — Visual layer: redrew 2 mermaid diagrams as illustrations and added 2 conceptual figures (article-illustrator). *(AI-mediated session)*\n"}]}]}</script>

        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;

            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');

                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');

                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
