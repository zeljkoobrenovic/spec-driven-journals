<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/38-journey-return-and-exchange/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (the thesis paragraph p03, the roadmap p04 and the conclusion's synthesis p61); these are listed under decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Which system owns each fact of a return in the late-2027 design (the OMS the order, eligibility and the return record; the WMS inspection, disposition and physical stock; the availability service what may be sold again; the PSP the refund; the ERP the credit note and the new invoice), and the twelve steps from request to reconciliation.\n- **Know:** The EU clocks a return runs on (14 days to withdraw from possession, a refund within 14 days of the notice, the right to withhold until the goods or evidence of sending arrive), the four dispositions, the three release policies for an exchange, and why refunds are asynchronous and can fail days after acceptance.\n- **Know:** Kestrel & Pine's cases on this path: Eva's exchange (requested 19 April 2027, inspected and graded resellable 22 April, size L shipped that day; a credit note of −€199 against the original invoice and a new invoice of €199), the Double Refund of January 2027 (212 returns, €19,400 refunded twice) and its February 2027 fix, the 190 Black Friday returns refunded about €3,000 too much, and the marketplace and store variants.\n- **Believe:** A return is finished only when stock, money and books agree.\n- **Believe:** The refund belongs to the warehouse's disposition event, with one writer and one key.\n- **Believe:** An exchange is a return plus a new order, never an edit.\n- **Be able to:** Count the systems that can call the PSP's refund API in their own landscape and name the key on the request.\n- **Be able to:** Design an exchange and a refund so that a returned unit raises sellable stock only on its disposition and the books record a credit note.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer or product manager who has read the capability chapters and Journey 1 and now needs to see returns, refunds and credit notes as one path. Finance and operations readers get the money-and-books half in plain words.\n\n**Already knows:**\n\n- What returning something bought online is like from the customer's side; roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its 2026 and January 2027 incidents in outline and the names of the sixteen failure patterns.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines (money, goods, returns), 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, business models and the four scale stages, the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Parts II and III: product, variant, SKU and GTIN with one owning system per attribute; prices frozen at order placement; promotions as data, discounts allocated to lines; available-to-promise, one writer each for on hand and committed; authorization, capture, settlement and payout, refunds as new payments; one order record with three status lines; tax from three facts, one invoice per shipment, credit notes as the only correction, the monthly match of invoices, payouts and bank lines.\n- From Journey 1 (chapter 37): Eva's order #1072455 of 13 April 2027, paid by iDEAL, invoiced by the ERP and delivered on 15 April; the entity-owner table, the step table and the handoff-requirements table as reading devices; 'operations by event, finance by batch'.\n\n**Does not yet know:**\n\n- Returns portal; RMA; reverse fulfillment order; disposition and the four dispositions; held exchange order and its release policies.\n- The EU right of withdrawal and its clocks; 'evidence of having sent back the goods'; refunded-reversed; 'refunded externally'.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given refunds paid twice, the reader names two writers and no key as the cause and plans one writer, one key and a daily match, rather than retraining support. *Probe:* A brand's returns app refunds customers through the shop platform after the warehouse inspects a return, which takes two to five days. Support agents, seeing a carrier scan at the warehouse and no refund yet, refund impatient customers in the payment provider's console. At month-end finance finds hundreds of returns credited twice. Using only this chapter: what went wrong, and what should change? | `custom` | cold_reader | major |\n| AC-2 | The reader can say why an exchange is not an edit and when a returned unit may be sold again. *Probe:* A customer exchanges a €199 jacket in size M for size L. The team proposes to change the original order line from M to L, ship the L once the parcel is scanned at the dock, and add the M back to stock at that scan. Using only this chapter: what is wrong with the plan, and what should happen? | `custom` | cold_reader | major |\n| AC-3 | The reader can compute a return's legal dates and say what changes when the return comes through a marketplace or a store. *Probe:* Goods are delivered on 15 April; the customer gives notice of withdrawal on 19 April and drops the parcel at a carrier point on 20 April. Using only this chapter: by when must the merchant refund, from when may it no longer withhold the refund, and what changes if the same jacket was bought through a marketplace or is returned in a store? | `custom` | cold_reader | major |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How does a return and exchange travel back through the systems, and where do the money, the stock and the books part ways?\n\n> **Claim:** A return travels back on one path until the warehouse's disposition event, which alone releases three flows with three owners: stock in the warehouse system, money through the payment provider (or, for an exchange, a held new order at the price on the original order line) and books through a credit note in the ERP. Exactly one system calls the refund API, keyed on the return id, and an exchange is never an edit of the original order or invoice.\n\n**Disputed by:** The view that a return is a refund button: the returns app or support refunds when the customer asks or the carrier scans the parcel, stock goes back on the shelf when the parcel arrives, and an exchange is an edit of the original order line.\n\n**So what:** A merchant that accepts the claim lets exactly one system call the refund API, keys every refund on the return, raises stock and settlement only on the disposition, and matches refunds to credit notes daily. In January 2027 Kestrel & Pine refunded 212 returns twice, €19,400, because the returns portal and support in the PSP console could both refund with no key naming the return, and finance found it at month-end; in February it made the portal the single writer, set support's console access to read-only and started a daily match. Eva's exchange, requested on 19 April 2027 and graded resellable on 22 April, ships size L the same day and leaves a credit note of −€199 and a new invoice of €199 that net to zero.\n\n**How and why:** EU law gives the consumer 14 days to withdraw from possession and the merchant 14 days from the notice to refund, withholdable only until the goods or evidence of sending arrive, so the return needs dates per line from the order record. Refunds are asynchronous and can fail days after acceptance, and a PSP accepts two requests that carry no shared key, so the count of writers and the key decide whether money goes out once. Only inspection knows whether a unit is sellable (39% of Kestrel & Pine's returned items in 2026 were not graded new), so stock raised at the dock scan promises units in a repair bin; and an issued invoice is immutable, so the books change only by credit note.\n\n**Supporting claims**\n\n- **S1** — Many systems hold a piece of one return, and that is normal: each fact (the order and the return record, eligibility, inspection and disposition, physical stock, sellable stock, the refund, the credit note) has exactly one system of record, and the return follows one path from request to inspection that each of them sees.\n- **S2** — The warehouse's disposition event, and nothing earlier, releases the three flows: a returned unit raises sellable stock only when inspection grades it restockable, the held exchange or the refund is released by the same event, and the books follow it.\n- **S3** — Exactly one system may call the refund API, with the return id as its idempotency key, inside the EU's 14-day refund clock; because refunds are asynchronous and can fail days later, the money state is driven by the PSP's webhooks and a fetched status, never assumed.\n- **S4** — An exchange is a return plus a new order at the price frozen on the original order, never an edit: the books record a credit note against the original invoice and a new invoice that net to zero, and a daily match ties every refund to a return, a credit note and an invoice.\n- **S5** — Marketplace and store returns are the same flow with a different first step: the OMS accepts returns it did not create and refunds it did not issue, and a store return lands stock in the store and refunds the original payment through the same single writer.\n- **S6** — Each handoff on the way back needs a key and a delivery style matched to its clock, and on the January 2027 landscape, where one return lived in three records and the refund had two writers and no key, the path broke at those handoffs: the Double Refund paid 212 returns twice while every system did what it was built to do.\n\n## Role in the part\n\nWalks Eva's exchange, with the refund as its alternative and the Double Refund as its failure path, back through the late-2027 design, separates the goods, money and books flows released by one disposition event, and compares the January 2027 path. Supports P9-2, P9-5 of part `part-9`.\n\n## Flow\n\n**Pattern:** `chronological` (also `grouping` in handoffs to wrong: the main path read back as requirements, then two variants, a comparison and failures)\n\nThe return's facts and owners come first because every step refers to them; the step table then gives the whole way back, and the sections walk it in the order the return lives it (request, transit, inspection, then the exchange, the refund alternative and the books that the inspection releases), closing the main path with what each of its handoffs requires. Only then do the last three sections step outside it: two variants that change only the first step, the same return on the January 2027 landscape (to which the store variant's January gap leads), and four failures with their detection. Moving the variants before the walk would change a first step the reader has not seen; moving the failures or the January comparison earlier would describe joins the reader has not yet met; putting the requirements after the variants would separate them from the path they describe.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A customer returns a jacket and asks for a larger size. Receiving the parcel does not tell the merchant whether the original can be sold again, whether the replacement is reserved or whether a financial adjustment is due; those decisions belong to different systems, and if each treats its own step as the completed return, the customer can be refunded twice or wait for a replacement that was never secured.\n\n**Bridge:** A return that looks to the customer like one parcel sent back. → At 72,000 return parcels a year, the several systems that each decide part of it and the order of events that makes their decisions agree.\n\n**Thesis statement** (KEY POINTS callout (bullets 1 to 3) and paragraph p03): The return travels one path until the warehouse's disposition event, which alone releases stock, money (or the held exchange order) and the books, each with its own owner; exactly one system calls the refund API, keyed on the return id, and an exchange is never an edit of the original order or invoice.\n\n**Roadmap** (Paragraph p04):\n\n- Set out the return, the replay through the late-2027 design and the owner of each fact. *Kept in:* order.\n- Give the twelve steps in one table. *Kept in:* steps.\n- Follow the jacket through the request, the way back, inspection at the dock, the exchange order, the refund alternative and the books. *Kept in:* request, wayback, dock, exchange, refund, books.\n- State what each handoff on that path requires. *Kept in:* handoffs.\n- Show the marketplace and store returns as variants. *Kept in:* variants.\n- Run the same return through the January 2027 landscape. *Kept in:* january.\n- End with four failures, the Double Refund first, and how each is caught. *Kept in:* wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | When a customer returns a jacket and asks for a larger size, receiving the parcel does not decide whether it can be resold, whether the replacement is reserved or whether money is due; those decisions belong to different systems, and if each treats its own step as the finished return the customer can be refunded twice or wait for a replacement that was never secured. | figure: Figure 1: three paths labeled goods, money and books, each with its own clock, converging on a seal labeled agree. |  |\n| p02 | evidence | Returns are a main road at Kestrel & Pine, the book's fictional brand, because the scattered decisions are made tens of thousands of times a year: 72,000 return parcels in 2026, 24% of items and 19% of orders, 28% exchanges and 61% resold as new, beside the NRF's 19.3% online return rate and 9% fraudulent returns, measures whose definitions differ. | statistic: 72,000 return parcels after 336,000 shipped; 24% of items, 19% of orders; 28% exchanges; 61% resold as new.; statistic: NRF: 19.3% online return rate for 2025, 9% of returns fraudulent (October 2025). | `cause_effect`: One return's decisions spread across systems. → Why that matters at Kestrel & Pine's volume. |\n| p03 | claim | The chapter's answer in short: the return travels one path until the warehouse's disposition event, which alone releases stock, money (or the held exchange order) and the books, each with its own owner; exactly one system calls the refund API, keyed on the return id, and an exchange is never an edit of the original order or invoice. |  | `problem_solution`: Decisions spread across systems at a volume where failures recur. → The order of events that makes them agree, stated as the chapter's claim. |\n| p04 | transition | The chapter first sets out the return, the replay and the owner of each fact, gives the twelve steps in one table, follows the jacket through the request, the way back, inspection, the exchange order, the refund alternative and the books, and states what each handoff on that path requires; it then shows the marketplace and store variants, runs the same return through the January 2027 landscape and ends with four failures, using Eva's exchange, vendor documentation and the EU consumer rights directive as evidence. |  | `sequence`: The claim. → The order in which the chapter argues it. |\n| p05 | context | In the order's journey this chapter takes Journey 1's delivered order #1072455, paid by iDEAL and invoiced in the ERP, back the other way from Eva's request on 19 April, with a credit note where the invoice was and, in the refund branch, a refund where the payment was; the returns chapter examines the choices behind each step. |  | `place`: The chapter's plan. → Where it sits after Journey 1 and beside the returns chapter. |\n\n## Sections\n\n### The Return, the Setting and the Rules of This Walk\n\n**Controlling idea** (`description`, id `order`): The walk replays Eva's April 2027 exchange, with the ledger's dates and amounts, through the late-2027 Waypoint design, in which each fact of the return has one named system of record.\n\n**Advances the thesis** (S1): Fixes the return, the design it runs through and the owner of each fact before the walk starts.\n\n**Transition in:** `elaboration`: The roadmap's first item: the return, the replay and the owner of each fact. → The return itself.\n\n**Order of paragraphs** (`prerequisite_order`): The return's facts come first, then the design it is replayed through and why the replay keeps the real dates, then the owners in that design; the walk needs all three, and the owner table cannot be read before the reader knows which design it describes.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | description | Eva exchanges her €199 Ridgewalker women's M jacket in moss for an L because it is too small, keeps the socks, and Duiven receives, inspects and grades it resellable on 22 April and sends the replacement that day. | fact: Exchange requested 19 April 2027 (reason: too small); received, inspected and graded resellable 22 April; exchange ships 22 April; the two €18 pairs of socks kept. |  |\n| p07 | context | The refund of €199 through iDEAL with a credit note is a separate branch of the example, and times within a day, identifiers and carrier scans are illustrative. |  | `contrast`: The exchange. → The refund alternative and what in the walk is illustrative. |\n| p08 | context | The walk replays the return through the late-2027 design, in which Waypoint gives physical stock to the WMS with an availability service beside it (W1), adds an order management system with its own return states (W2) and a product information management system (W3). |  | `sequence`: The return's facts. → The design the return is walked through. |\n| p09 | context | None of these systems was live for Eva's real April return, when portal, shop platform and warehouse each held a piece and only the refund had been fixed (the portal as single writer since February, after the January Double Refund), so the walk keeps her dates in the late-2027 design and a later section runs the return through the January 2027 landscape, where this path's incidents happened. |  | `contrast`: The late-2027 design. → The fact that the real return ran before it. |\n| p10 | definition | An owner table names, for each fact of the return, the system of record whose value is trusted when copies disagree, and the systems that hold copies. | table: Eight facts (the original order, eligibility, the return record, inspection and disposition, physical stock, sellable stock, the refund, the credit note and new invoice) with their system of record in late 2027 and who holds copies. | `sequence`: The replay's design. → The owner of each fact in it. |\n| p11 | analysis | A fact with two writers is the problem, and in January 2027 the refund had two: the portal and support in the PSP console both refunded without naming the return, and 212 returns, €19,400, were paid twice, the Double Refund taken apart near the end. |  | `conclusion_summary`: The owner table. → What to read from it: count writers, not systems. |\n\n### Twelve Steps in One Table\n\n**Controlling idea** (`process`, id `steps`): The way back takes twelve steps, each with a system, the data it moves, the promise made, the failure that belongs to it and the chapter that owns it, and one event, the disposition, releases stock, money and books.\n\n**Advances the thesis** (S1, S2): Lays out the whole path before the walk and marks the disposition as the hinge.\n\n**Transition in:** `sequence`: The owners of each fact. → The steps in which they act.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | process | The step table gives the whole way back at a glance (step, system, data, promise made, what could fail and the owning chapter) and runs ahead of the walk, whose sections explain its new terms. | table: Twelve steps from the return request on 19 April to reconciliation, with the held exchange order, the label, transit, receiving, disposition, the exchange release or refund, notifications, credit note and the daily match. |  |\n| p13 | analysis | Rows 7, 9 and 11 are stock, money and books, and none happens before the inspection: the WMS reports the disposition as two events at once, the stock event (row 7) and the disposition event (row 8), which releases the exchange or refund (row 9) and the books (row 11). | figure: Figure 2: the way back in the late-2027 architecture, from the returns portal to one disposition event that releases stock, the exchange or refund, and the credit note. | `conclusion_summary`: The twelve rows. → The hinge among them. |\n\n### The Request: Eligibility, Reason and the Choice\n\n**Controlling idea** (`process`, id `request`): The request fixes, from facts the OMS and the PIM own and from the law, whether and until when Eva may return the jacket, and turns her choice of an exchange into a held order that reserves size L at once.\n\n**Advances the thesis** (S1, S3, S4): Shows eligibility and the legal dates computed from owned facts, and the exchange created as a new held order.\n\n**Transition in:** `sequence`: Step 1 of the table. → The request in detail.\n\n**Order of paragraphs** (`chronological`): The portal is defined before it acts; eligibility comes before the law that sits under the policy; the choice comes after eligibility; the release policy explains the held order the choice created; the record is created last, at 20:40, as it was. The release policy cannot be read before the held order it releases.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | definition | A returns portal is the customer-facing page for requesting a return, and in the target design it owns only the conversation with Eva while the facts it shows and the return it creates live in the OMS; the industry's RMA is this book's return record. | fact: Rented since 2025 at €650 a month plus €0.95 per return. |  |\n| p15 | explanation | Eligibility is computed from three facts with three owners: the delivery date on the OMS's order, the merchant's policy, and the product's returnability attributes from the PIM. | fact: Delivered 15 April (PostNL scan); free returns within 14 days of delivery in all three countries; the EU exemptions for made-to-specification, perishable and unsealed hygiene goods. | `elaboration`: The portal reads its facts from the OMS. → Which facts decide eligibility and who owns them. |\n| p16 | explanation | Under the policy sits the EU directive's clocks (14 days from possession to withdraw, 14 days from the notice to refund by the same means of payment, withholdable until the goods or evidence of sending arrive), so four dates must be computable per order line. | source: Directive 2011/83/EU, Articles 9, 13 and 14: Eva's window to 29 April; sending back within 14 days of notice; refund within 14 days of notice, withholdable until goods or evidence of sending; return cost on the consumer only as the directive allows. | `place`: The merchant's policy. → The law beneath it. |\n| p17 | process | Eva chooses an exchange, and Kestrel & Pine models it as a held order: at request time the OMS commits one L moss through the availability service and creates order #1072455-X1 at a €0 balance, held until the return is graded. | fact: 28% of returns are exchanges; held order #1072455-X1 created at request time. | `sequence`: An eligible request. → Eva's choice and how it is modelled. |\n| p18 | comparison | When the held order is released is a policy with three settings (on disposition, on scan, instant exchange), and Kestrel & Pine releases on disposition until inspection results are measured per SKU. | source: Shopify's returns model: 'release the exchange and collect a balance'. | `elaboration`: The held order. → When it is released. |\n| p19 | process | At 20:40 on 19 April the portal creates return R-20270419-1 in the OMS, linked to the order, its line and the held order, with the reason, the outcome and the four dates, as the third state machine on the order record beside money and goods. |  | `time`: The choice and its policy. → The record that holds them. |\n\n### The Way Back: Label, Drop-off and the Scan That Ends a Right\n\n**Controlling idea** (`process`, id `wayback`): The label and the warehouse's notice carry the return reference, and the carrier's acceptance scan is a legal event that ends the merchant's right to withhold the refund.\n\n**Advances the thesis** (S1, S3): Shows the reference carried on every handoff and the scan that moves the legal clock.\n\n**Transition in:** `sequence`: An approved return record. → The parcel's way back to Duiven.\n\n**Order of paragraphs** (`chronological`): Label, warehouse notice, drop-off and arrival in the order they happen.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | process | The return label from the shipping service must carry the return reference, or the parcel arrives as a jacket from nobody. |  |  |\n| p21 | definition | In the same minute the OMS tells the WMS to expect the return with a reverse fulfillment order, separating the return (the OMS's intent and money) from the warehouse's work, and the return reference makes a repeated message harmless. | quotation: Shopify: a return 'represents the intent of a buyer to ship one or more items from an order back'; a reverse fulfillment order 'represents the work that's required to process a return'.; source: commercetools keeps goods-side and money-side return states apart. | `time`: The label. → The warehouse's notice. |\n| p22 | cause_effect | Eva's drop-off scan on 20 April is evidence of having sent back the goods under Article 13(3), so from then the merchant may no longer withhold the refund, while the refund deadline of 3 May still runs from her notice and transit time eats into it. | source: Directive 2011/83/EU, Article 13(3): 'evidence of having sent back the goods'. | `sequence`: The parcel labelled and announced. → The drop-off and its legal weight. |\n| p23 | transition | PostNL delivers the parcel to Duiven on Thursday 22 April, but a parcel on the dock is not yet a return. |  | `time`: The parcel in transit. → Its arrival and the step it still needs. |\n\n### At the Dock: Receiving, Inspection and Disposition\n\n**Controlling idea** (`process`, id `dock`): Only inspection knows whether a returned unit can be sold again, so its result, the disposition, is the event that raises stock and releases the rest of the return.\n\n**Advances the thesis** (S2): Establishes the disposition as the hinge and why stock may not rise before it.\n\n**Transition in:** `problem_solution`: A parcel on the dock that is not yet a return. → The step that makes it one.\n\n**Order of paragraphs** (`chronological`): Receiving and inspection, then the dispositions it can produce, then Eva's grade and the two events it emits.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | process | Returns receiving is a separate flow with one rule, nothing is restocked that has not been looked at: the reference finds the reverse fulfillment order, the GTIN confirms the item, and the inspection checks its condition. |  |  |\n| p25 | definition | A disposition is the warehouse's decision about a returned unit, one of four, and since 39% of Kestrel & Pine's returned items were not graded new, a WMS that raises on-hand at the dock scan promises jackets that are in a repair bin. | source: Shopify's four dispositions: restocked, processing required, not restocked, missing.; statistic: 2026: 61% resold as new, 27% after processing, 9% recycled or donated, 3% missing or wrong item (split illustrative). | `elaboration`: The inspection. → Its result and why stock waits for it. |\n| p26 | process | At 10:15 on 22 April Eva's jacket is graded resellable and the WMS emits a stock event to the availability service and a disposition event to the OMS, and the second is the hinge of the journey. | figure: Figure 3: the inspector's bench with four bins: restocked 61%, processing 27%, not restocked 9%, missing 3%.; fact: The returns bench handles about 280 parcels a day with two people (illustrative). | `example`: The four dispositions. → Eva's grade and the two events it triggers. |\n\n### The Exchange Order\n\n**Controlling idea** (`process`, id `exchange`): The disposition releases the held exchange order at the price frozen on the original order, which then ships on the normal path, because an exchange is a return plus a new order and never an edit.\n\n**Advances the thesis** (S2, S4): Shows the exchange released by the disposition and why it is a new order.\n\n**Transition in:** `cause_effect`: The disposition event reaching the OMS. → What it releases for Eva.\n\n**Order of paragraphs** (`chronological`): The release, then the shipment, then why the alternative (an edit) would fail.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | process | On the disposition event the OMS releases the held order #1072455-X1 for size L at the frozen €199 and a €0 balance, because an exchange is a return plus a new order. | fact: Frozen price rule adopted April 2027 ('invoices and exchanges copy them'); a €119 fleece would leave −€80 for the refund path. |  |\n| p28 | process | From the release the exchange follows Journey 1's path from the fulfillment order onwards: 13:00 wave, PostNL label, evening collection, a shipping confirmation when the WMS reports the shipment, and delivery on 23 April, with the original order, its return and the exchange each keeping its own state. | fact: 13:00 wave on 22 April; delivered 23 April (illustrative). | `sequence`: The released exchange order. → Its way to Eva. |\n| p29 | refutation | Editing the line from M to L would leave an invoice for a jacket Eva no longer has, because the M was picked, invoiced and paid for. |  | `contrast`: The exchange as a new order. → Why the edit is wrong. |\n\n### The Refund Alternative: One Writer, One Key\n\n**Controlling idea** (`process`, id `refund`): Had Eva asked for her money, the same disposition would release one refund request from one writer, keyed on the return id, whose result arrives later and may still fail.\n\n**Advances the thesis** (S2, S3): States the trigger, the writer, the key and the asynchronous money state.\n\n**Transition in:** `contrast`: The exchange released by the disposition. → The refund the same event would release.\n\n**Order of paragraphs** (`prerequisite_order`): The branch, then the trigger, then who writes, then with what key, then what happens after the request is accepted and the state that tracks it: each answer assumes the one before.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | context | If Eva asks for her money, everything up to the disposition event is the same, and the event releases a €199 refund instead. |  |  |\n| p31 | comparison | The refund is triggered by the disposition, not the request or the scan, which keeps money and goods in one causal chain and leaves eleven days of margin to the 3 May deadline. | reasoning: Notice 19 April, deadline 3 May, inspection 22 April: eleven days of margin. | `elaboration`: The refund released by the disposition. → Why the disposition and not an earlier event. |\n| p32 | claim | In the target design exactly one system, the OMS, raises the refund through the shop platform's refund API to the PSP; support, the portal and the ERP cannot, and support's console access is read-only. | fact: The OMS as the single refund writer once it holds return records (Q4 2027); support's PSP console read-only. | `sequence`: When the refund is raised. → Who may raise it. |\n| p33 | explanation | The request carries the return id as its idempotency key so that a retry does nothing twice; the PSP's own duplicate protection is a backstop, not the design. | quotation: Stripe saves the first response to a key; Mollie 'blocks duplicate refunds made in a short time frame' and asks merchants to 'do not retry automatically'. | `additional_support`: One writer. → One key. |\n| p34 | evidence | Refunds are asynchronous and can fail late: accepting a request starts work that continues, and Adyen and Stripe document refunds that fail days after a success message and reach the customer days later, while for iDEAL the refund is a new transfer to the shopper's bank account. | quotation: Adyen: 'the refund process is asynchronous', a refund 'can fail after you received' the success webhook, refunded-reversed for iDEAL; Stripe: 'approximately 5-10 business days', fees not returned. | `sequence`: A single keyed request. → What happens after it is accepted. |\n| p36 | process | So the return's money state is a small machine of its own, requested, accepted, refunded or failed, driven by webhooks and confirmed by a fetched status, and Eva's messages follow it. | figure: Figure 4: one writer and one key, the PSP's answer by webhook confirmed by a fetch, the ERP matching credit notes to payout lines, and the dotted second writer the Double Refund closed. | `cause_effect`: Refunds that fail late. → The state machine that tracks it. |\n\n### The Books: Credit Note, New Invoice, Reconciliation\n\n**Controlling idea** (`process`, id `books`): The books change only by credit note: an exchange is a credit note and a new invoice that net to zero, a refund pairs the credit note with a PSP refund, and a daily three-leg match ties them together.\n\n**Advances the thesis** (S4): Shows the third flow and the reconciliation that makes the three agree.\n\n**Transition in:** `sequence`: The money flow. → The books, the third flow.\n\n**Order of paragraphs** (`prerequisite_order`): The rule (no edit), then the exchange's two documents, then the refund variant, then the match that checks all of them. The match cannot be read before the documents it matches.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p37 | process | The third flow is the books: the original invoice stays as it is, so when the OMS reports the return settled the ERP issues a credit note of −€199 against it for the jacket line. | fact: Original invoice net €194.21, VAT €40.79, gross €235.00; credit note −€199.00 (net −€164.46, VAT −€34.54). |  |\n| p38 | explanation | An exchange is two documents that net to zero: the credit note and a new €199 invoice for #1072455-X1, so Eva's bank statement shows nothing while the ledger shows the whole history. |  | `elaboration`: The credit note. → Its partner document for the exchange. |\n| p39 | comparison | The refund variant pairs the same credit note with a refund at the PSP, reversing the revenue recognized at delivery. |  | `contrast`: The exchange's two documents. → The refund variant's pair. |\n| p40 | process | Reconciliation is daily, not monthly: since February 2027, after the Double Refund, a daily job matches PSP refunds to the shop platform's to catch any duplicate the key lets through, and in the target design the match has three legs (refund to return, return to credit note, credit note to invoice). | fact: Daily job from February 2027 matching PSP refunds on order number and amount, exceptions to finance. | `conclusion_summary`: Documents and refunds in two systems. → The check that they agree. |\n\n### What Each Handoff Requires\n\n**Controlling idea** (`analysis`, id `handoffs`): Each handoff on the way back has its own freshness, consistency, latency and availability, so stock and disposition must move by event while the credit note may move by daily batch.\n\n**Advances the thesis** (S6): States the key and style each join needs.\n\n**Transition in:** `conclusion_summary`: The main path's joins, from the request to the books. → What each of them requires.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | analysis | The requirements table gives, for each join of the walk just followed, freshness, consistency, latency, availability and style, with figures labelled as the author's assumptions. | table: Six handoffs from portal to OMS through OMS to ERP, each with its key and style under W5. |  |\n| p51 | analysis | The stock and disposition events cannot be batch because a returned unit and Eva's exchange wait on them, while the credit note can: operations by event, finance by batch. |  | `conclusion_summary`: The table. → The rule it shows. |\n\n### Two Variants: The Marketplace Return and the Store Return\n\n**Controlling idea** (`comparison`, id `variants`): A return through a marketplace or a store changes the first step and who sets the rules, while the rest of the path, the one writer and the books stay as they are.\n\n**Advances the thesis** (S5): Shows the same flow with different first steps.\n\n**Transition in:** `contrast`: The handoffs of the main path through the portal and Duiven. → Two other doors the jacket can come back through.\n\n**Order of paragraphs** (`grouping`): The marketplace return first (policy, fees, what the OMS must accept), then the store return (lookup, inspection, stock, refund); each group follows the path in order.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | transition | The handoffs above serve the main path, but the same jacket can come back through two other doors, and only the first step changes. |  |  |\n| p42 | claim | On a marketplace, illustrated by two Amazon.de buyers of 13 April, the return policy is the marketplace's, not the seller's. | scenario: One Ridgewalker seller-fulfilled from Duiven, one shipped by the marketplace's fulfillment program. | `example`: Two other doors. → The marketplace door. |\n| p43 | evidence | Amazon's US guidance for seller-fulfilled returns sets a 30-day window, a 24-hour response and a two-day refund, or Amazon may refund automatically. | quotation: Refund 'within two days of receiving returns, or Amazon may issue an automatic refund' (15 April 2025; European terms not verified). | `example`: The marketplace's policy. → The seller-fulfilled rules. |\n| p44 | evidence | For marketplace-fulfilled goods the marketplace receives, grades and refunds, and charges the seller for it. | source: Zalando's return shipping and processing fees; Amazon's FBA returns processing fee. | `contrast`: Seller-fulfilled returns. → Marketplace-fulfilled returns. |\n| p45 | cause_effect | The OMS must therefore accept returns it did not create and refunds it did not issue, keyed on the marketplace's return id with the money state 'refunded externally'. |  | `cause_effect`: The marketplace's policy and refunds. → What the OMS must accept. |\n| p46 | context | A store return of a web order could not be handled in January 2027, because the POS had no link to the shop platform. |  | `contrast`: The marketplace door. → The store door, as it was in January 2027. |\n| p47 | process | In the target design the store looks the order up in the OMS and the POS records the return against it, while store sales themselves reach the OMS only from 2028. |  | `contrast`: The January store with no link. → The target-design store return. |\n| p48 | process | Against the online return two things differ, both on the goods side: inspection happens at the counter with the same four dispositions, and the stock lands in the Nijmegen store location, whose system of record is the POS. |  | `contrast`: The store return recorded against the order. → The two differences from the online return, both on the goods side. |\n| p49 | process | One thing deliberately does not differ: the refund still goes to Eva's original iDEAL payment through the same single writer, never as cash from the till, because the directive's same-means rule and the reconciliation depend on it. |  | `contrast`: The goods-side differences. → The money, which stays the same. |\n\n### The Same Return in January 2027\n\n**Controlling idea** (`comparison`, id `january`): On the January 2027 landscape the same return kept its dates but lived in three records, committed the L in a stale copy, had two refund writers without a key and restocked through an hourly chain: the failures were in the joins.\n\n**Advances the thesis** (S6): Holds the dates constant and changes only the joins.\n\n**Transition in:** `time`: The store variant's January 2027 gap and the late-2027 joins. → The same return on the whole January 2027 landscape.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | comparison | Run through the January 2027 landscape, the return keeps its dates while four things change: one return record becomes three, the exchange commits a unit in a stock copy up to two hours stale, the refund has two writers and no key, and returned stock reaches the shop platform through an hourly chain. | table: Late 2027 against January 2027 for the return record, the exchange, the refund and the stock from returns; in the May 2027 stock count about 90 of the roughly 390 variants whose shop-platform stock differed from the WMS's were returns not yet carried through the hourly chain. |  |\n| p53 | analysis | The jacket still came back and the L still shipped on 22 April; what the January landscape could not do was show one agent that the refund had already been sent. |  | `conclusion_summary`: The four differences. → The one that cost money. |\n\n### When It Goes Wrong Along This Path\n\n**Controlling idea** (`analysis`, id `wrong`): Four failures on the way back each have a mechanism at a join, a detection and a recovery, and the Double Refund shows what two writers and no key cost.\n\n**Advances the thesis** (S3, S6): Gives each failure's mechanism, detection and recovery, each at a join.\n\n**Transition in:** `example`: An agent who could not see that the refund had been sent. → Four failures with their detection and recovery.\n\n**Order of paragraphs** (`order_of_importance`): The Double Refund first, because it is the chapter's incident and the January comparison has just led to it; then the late refund failure, the premature restock and the wrong amount, each smaller and each mapped to a step of the table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p54 | transition | The step table names a failure per step, and four deserve the mechanism, the detection and the recovery. |  |  |\n| p55 | example | In January 2027, 212 returns were refunded twice, €19,400; in the illustrative mechanism support refunded by hand after the carrier's warehouse scan while the portal refunded again on inspection. | case: The Double Refund: 212 returns, €19,400, January 2027; the illustrative mechanism of support and portal both refunding. | `example`: Four failures. → The first and largest. |\n| p56 | cause_effect | Neither request named the return, so the PSP accepted both, and the duplicates were found only at month-end by Sanne de Wit and mostly recovered by asking customers to pay back. |  | `cause_effect`: Two refunds for one return. → Why the PSP paid both and how it was found. |\n| p57 | recommendation | From February 2027 the returns portal is the only refund writer with the return id as key, support's console is read-only and a daily job matches refunds; the single writer moved to the OMS with the return records in Q4 2027, and support can see which of receipt, inspection and refund has happened. | fact: February 2027 fix: one writer, return id as key, read-only console, daily refund reconciliation to finance; the writer moves to the OMS in Q4 2027. | `problem_solution`: Duplicates found at month-end. → The February fix. |\n| p58 | example | A refund the PSP accepted can fail days later, so it is detected by the failure webhook or a daily list of refunds not in a terminal state and recovered by a service case, never a blind retry. | scenario: Eva's refund accepted, then a refund-failed or refunded-reversed webhook three days later because the bank account could not take the transfer (illustrative). | `additional_support`: A refund paid twice. → A refund that does not arrive. |\n| p59 | example | Stock raised at the dock scan, the mechanism described under inspection, promises a jacket in a repair bin; it is detected by matching restocks to dispositions and cured by emitting the stock event only on the disposition. | scenario: On-hand raised at the dock scan, 'processing required' an hour later, a shopper's order short-picked (illustrative). | `additional_support`: A money failure. → A stock failure. |\n| p60 | example | During Black Friday 2026, 190 returned jackets were refunded at €159.20 instead of the €143.28 paid, about €3,000, because the order-level discount was not allocated to lines in the order export; the export now carries the allocated net price per line. | case: 190 returns, €159.20 against €143.28, about €3,000; allocated net price per line added under W5. | `additional_support`: A stock failure. → An amount failure. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The parcel at Duiven told nobody whether the jacket could be sold, whether the L was reserved or whether money was due; walked back step by step, each answer has one owner and waits for one event. The L was committed when Eva asked, the disposition released it with the stock and the credit note, and no refund was involved. On the January 2027 landscape the same systems held the same pieces, but three return records and two refund writers without a key paid 212 returns twice.\n\n**So what:** A merchant that makes the disposition the only trigger, allows one refund writer with the return id as key and matches refunds to credit notes daily closes each return in agreement instead of reconciling it by hand at month-end.\n\n**Callback:** The introduction's hook: a returned jacket whose arrival does not say whether it can be resold, whether the replacement is reserved or whether money is due, with a double refund or an unsecured replacement as the risk. The reader can now name the owner and the event behind each of the three answers, and the joins where the two risks arise.\n\n**Takeaway** (`course_of_action`): Count the systems that can call the refund API; if the answer is not one, fix that first, then make the disposition the only trigger for stock, money and the books and measure the time from dock scan to disposition every day.\n\n**Hand-off** to [Journey 3: A Chain Reorders by EDI, From Order to Invoice](journey-wholesale-order.html): `contrast`: Journeys 1 and 2: a consumer who orders at a checkout, pays at once and receives a parcel, and the same Duiven stock and systems behind her. → A buyer that is a company: an order that arrives as a message nobody typed, goods that leave on pallets with a despatch advice, and money that arrives thirty days later against an invoice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p61 | synthesis | The parcel at Duiven answered none of the opening's three questions by itself; walked back, each answer has one owner and waits for the disposition, which on the January 2027 landscape had three return records and two refund writers behind it, so a merchant that makes the disposition the only trigger, allows one refund writer with one key and matches daily closes returns in agreement instead of at month-end. | reasoning: The opening's three questions set against Eva's late-2027 exchange and the January 2027 Double Refund. |  |\n| p62 | synthesis (list) | Established: a return is three flows with three owners, as Shopify, commercetools and every ERP model it; refunds are asynchronous and can fail late, as Adyen, Stripe and Mollie document; and EU law fixes the clocks. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what the sources establish. |\n| p63 | synthesis (list) | Depends on context: whether the refund waits for inspection, whether the OMS owns the return record, and whether stores take online returns. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p64 | recommendation (list) | The author's synthesis: count the systems that can call the refund API and stop the review if the answer is not one, and make the disposition event the only trigger for stock, settlement and the credit note, measuring the time from dock scan to disposition daily. |  | `contrast`: What depends on context. → The author's own reading. |\n| p65 | recommendation (list) | Seven questions let a reader check their own return path: refund writers and key, the refund trigger, when stock rises, the four legal dates, exchange as new order, external returns and refunds, and last month's refund match. |  | `sequence`: The author's reading. → The questions that apply it to the reader's own landscape. |\n| p66 | transition | Eva has her L and the books net to zero; the next journey turns from a consumer to a buyer that is a company, whose order of 6 April arrived as a message nobody typed, leaves on pallets with a despatch advice and is paid thirty days after the invoice. |  | `sequence`: The questions about one return. → The wholesale order, in the next chapter. |\n\n## Non-goals\n\n- Teaching returns, refunds or credit notes in depth: RMA, disposition, exchange and refund reconciliation; refund mechanics and webhooks; credit notes and the ledger; the right of withdrawal; the variants' home systems. See [The Way Back: Returns, Exchanges, Refunds and Reverse Logistics](returns-and-exchanges.html), [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html), [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html), [Rules Turned Into Requirements: Consumer, Payment, Invoicing and Platform Regulation](commerce-regulation.html), [Stores Are Systems Too: Point of Sale and Omnichannel Fulfillment](stores-and-omnichannel.html), [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html).\n- The forward path, the wholesale path and the peak day. See [Journey 1: Eva's Jacket, From Search to Doorstep](journey-consumer-order.html), [Journey 3: A Chain Reorders by EDI, From Order to Invoice](journey-wholesale-order.html), [Journey 4: Black Friday, Hour by Hour](journey-peak-day.html).\n- An 'Across Scale Stages' section; journeys do not carry one.\n- Return fraud models and returns-portal vendor comparison.\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-13** — After the confirming round 3 (ESCALATE: 2 transitions and 6 corroborated flow points, one of them at fault in the spec, plus one corroborated term), the cheap, plainly right fixes were applied without another round: p09 opens on the contrast with the late-2027 design, glosses the returns portal and says why the comparison is January 2027 (the landscape of this path's incidents); p52 opens on the store's January gap and says the old chain still ran in May 2027 (events-consistency-and-reconciliation line); p40 marks the February 2027 match as the interim fix and glosses RECONCILED; p48 and p49 now say two things differ and the refund deliberately does not (spec ideas of p09, p48, p49 updated); minor: p25's split marked illustrative beyond the ledger's 61%, p22 points to the refund section, p28's confirmation now comes before the evening collection, p31 'after a peak' instead of 'in January', p56 'two credits per order in the ERP' as the ledger says. Not changed: the repeated forward mentions of the Double Refund (judge: at fault in the spec; p11's one-sentence gloss was the round-1 readers' corroborated request and the KEY POINTS and step-table row 12 are the author's; rule 10, the current position stands); 'Why not edit' after the shipment (one reader; rule 10). Rejected: A fourth round.; Cutting the Double Refund gloss from p11.\n- **2026-11-13** — Auto-resolved by the author's standing instruction of 2026-11-12, after round 2 (ESCALATE: one spec fault, 13 corroborated or fixed-question draft faults, 7 minor): (1) p47 at fault in the spec (two ideas, three differences split over three paragraphs): p47 now holds only how the store return is recorded and when store sales reach the OMS; p48 states the goods-side differences (counter inspection and store stock) and p49 the money; transitions rewritten (rule 3; brief's pre-approval of paragraph ideas). (2) Draft faults fixed in the named units, ledger lines cited: p02 says what the NRF comparison shows; p03 glosses the held order; p09 lists the three dates (January 2027 two writers; February fix and Eva's April return; late-2027 replay) (problem 3, commerce-payments line, ruling 4); p13 says plainly the disposition is reported as two events and releases rows 9 and 11; p18 glosses 'hero products' (rule 6); p28 drops Journey 1's step number; p40 names the shop platform's refunds and why a match runs beside the key (events-consistency-and-reconciliation line); p42 introduces the two marketplace buyers; p44 expands FBA (rule 6); p50 ties the table to the walk; p52 states the May 2027 count as the ledger does (about 90 of roughly 390 variants); p55 marks which details are illustrative; p60 glosses the order export and rewrites the detection sentence; row 9b of the step table now names the wrong amount, so p54's claim holds. Minor points fixed cheaply: p31 'enough to cover a parcel that spends a week in transit', p45 the US clocks named as such, p48 W1 glossed for store stock. Not changed: p46's January aside (one reader; rule 10, the current position stands). Rejected: Escalating to the author.\n- **2026-11-13** — Draft check round 1 ended in ESCALATE because three corroborated flow points were at fault in the spec; the brief pre-approves changing paragraph ideas to fix them, so: p09 now states which landscape Eva's April return really ran on (before the Waypoint systems, with the refund already fixed in February) and that the comparison is with January 2027, before the fix (the timeline readers found contradictory; ledger: problem 3, commerce-payments, W-seam dates in ruling 4); p13 and its prose say the disposition is sent as two events at once, the stock event and the disposition event, instead of 'row 8 releases all three' (p26's mechanism unchanged; thesis wording unchanged); p21 now cites commercetools, so the conclusion's Esta r the reorder (fresh agent, verdict 'sound with notes'); the author asked for the rubric notes to be taken without review. Taken: p05 frames the exchange as a credit note and the refund as the branch; p40 says the daily match came after the Double Refund told later; p59 points back to the dock mechanism instead of repeating it; p52's idea names the four January changes the table shows; rationales of 'request' and 'books' say what would break. Not taken: splitting the January section into one paragraph per change or merging it into the failures (the table carries the four changes within the length; rule 10, the author's structure stands); dropping the prescription from p61 or p64 (p64 is the author's own list). Rejected: Merging 'The Same Return in January 2027' into 'When It Goes Wrong'.\n- **2026-11-13** — Converted spec.md to spec.json from the published chapter, one spec paragraph per unit; intent, thesis and role copied unchanged from the journal spec, with its five acceptance criteria and no added criteria. spec.md's success criteria are inventories (step-table columns, diagram counts, take-away tiers, term coverage, source list, word count) and are dropped; the outcomes they aimed at are carried by the journal spec's AC-1 to AC-4. The old spec's limit (at or under 7,000 words, target 6,500) is kept as length.max_words 7,000 and target_words 6,500. Rejected: Rewriting the inventory criteria as minor custom criteria.\n- **2026-11-13** — Added the units the contract asks for and the published chapter lacked: a short thesis paragraph (p03) and a roadmap (p04) in the introduction, the roadmap announcing every section, and a synthesis paragraph (p61) at the head of 'What to Take Away' that calls back to the opening's three questions and answers so-what. The sentence 'We follow authorization, transport back, inspection, replacement and accounting' moves from p05 into the roadmap, and p05 now carries over Journey 1's delivered, paid and invoiced order as the journal spec's transition_in asks. The hand-off p66 now says what the journal spec's next transition_in introduces (pallets with a despatch advice, payment thirty days after the invoice). Rejected: Stating the thesis only in KEY POINTS.; A conclusion of lists only.\n- **2026-11-13** — Under the book-wide vocabulary ruling the hosted product is called 'the shop platform' where the text means Kestrel & Pine's platform; vendor-neutral uses of 'platform' stay. W1 and W5 are glossed at first use in the chapter. Rejected: Leaving 'the platform' throughout.\n- **2026-11-13** — p28: the exchange parcel's shipping confirmation is stated as sent when the WMS reports the shipment, the April 2027 rule; the later first-scan target rule is not mentioned. Rejected: Leaving 'that afternoon' without the trigger.\n- **2026-11-13** — Auto-resolved by the author's standing instruction of 2026-11-12: spec.md's open questions are closed. (1) The single refund writer moving from the returns portal to the OMS in Q4 2027 through the same platform refund API is the ledger's journey-return-and-exchange line (rule 1). (2) The Double Refund's mechanism follows the commerce-payments ledger line, which the page already follows (rule 1). (3) The returns policy, the held order #1072455-X1, the return id R-20270419-1, the 23 April delivery and the credit-note figures are all in the returns-and-exchanges and journey-return-and-exchange ledger lines (rule 1). Rejected: Leaving them open for the author.\n- **2026-11-07** — Made the WMS disposition event the hinge that releases stock, settlement and the credit note, rather than the return request or the carrier scan, because that single ordering is what makes the three flows agree and is the clearest answer to the Boomerang. (from spec.md)\n- **2026-11-07** — Told the Double Refund with the ledger's mechanism (two writers, no key, no single view) and spent the words on the fix (one writer, one key, read-only console, daily match), since commerce-payments owns the incident's payment side. (from spec.md)\n- **2026-11-07** — Treated the exchange as a held order at the frozen price, created at request time and released by the disposition, with a credit note and a new invoice netting to zero, following the returns chapter's held-order model, the pricing chapter's 'exchanges copy frozen prices' rule and the ERP's invoice immutability, rather than as an order edit. (from spec.md)\n- **2026-11-07** — Kept marketplace and store returns as two short variants on the same step table rather than two further walks, to stay within the length cap. (from spec.md)\n\n## Sources\n\n- **Internal**\n  - _research/scenario-ledger.md (Eva's jacket; the marketplace variant; problem 3; W1-W5; lines returns-and-exchanges, journey-return-and-exchange, commerce-payments, events-consistency-and-reconciliation, tax-invoicing-and-ledger, commerce-promotions, pricing-architecture, stores-and-omnichannel) and _research/consistency-issues.md (rulings 1, 4, 9, 18) — Every figure, date and time of the return, the exchange and the refund variant, the Double Refund and its fix, the returns figures, the Black Friday refunds and the May 2027 reconciliation.\n  - journal-spec.json (journey-return-and-exchange; part-9; journey-wholesale-order transition_in) — Intent, thesis, role, acceptance criteria and the hand-off.\n  - PLAN.md (Part IX contract for chapter 38); _research/style-guide.md; _research/brief-inventory-fulfillment-returns.md, brief-checkout-payments-tax.md, brief-security-privacy-regulation.md; journey-consumer-order; meet-kestrel-and-pine — Scope, page format, return data models, refund behaviour, credit notes, the 14-day right of withdrawal and the forward path's figures (from spec.md).\n- **External**\n  - Shopify returns documentation; commercetools order states (n.d., accessed 2026-11) — The return versus reverse-fulfillment-order split, dispositions, return item states.\n  - Adyen, Stripe and Mollie refund and idempotency documentation (n.d., accessed 2026-11) — Asynchronous refunds, late failures, duplicate blocking, idempotency keys.\n  - Odoo 18.0 credit-note documentation; IFRS 15 — Invoice immutability, credit notes, revenue reversal.\n  - Directive 2011/83/EU, Articles 9, 13, 14 and 16 — The withdrawal and refund clocks, withholding until goods or evidence of sending, return costs, diminished value, exemptions.\n  - Amazon seller-fulfilled returns guidance (2025-04-15); Fulfillment by Amazon; Zalando partner logistics overview — Marketplace return obligations and fees.\n  - NRF with Happy Returns, 2025 Retail Returns Landscape (2025-10-15) — Return rate and fraud share.\n\n## Changelog\n\n- **2026-11-13** — Draft check round 3 (confirming): escalate (9 major incl. 1 spec fault, 9 minor; AC-1 to AC-5 pass). Closing fixes applied to p09, p22, p25, p28, p31, p40, p48, p49, p52, p56 (see decision_log); check-report.json is now stale.\n- **2026-11-13** — Draft check round 2: escalate (15 major incl. 1 spec fault, 7 minor). Auto-resolved per RESOLVE.md: p47-p49 regrouped in the spec; p02, p03, p09, p13, p18, p28, p40, p42, p44, p50, p52, p55, p60 and the step table revised; minor fixes in p31, p45, p48.\n- **2026-11-13** — Draft check round 1: escalate (15 major: 3 at fault in the spec, 12 draft). Spec ideas of p02, p09, p11, p12, p13, p16, p19, p21, p22, p37, p47 revised; prose revised to match (see decision_log).\n- **2026-11-13** — Flow rubric notes taken: handoffs section moved before the variants, refund-writer history moved to the Double Refund fix, p34 and p35 merged, p37 and p22 reworded; index.md revised to match, with 'the shop platform', W1 and W5 glosses, the shipping-confirmation trigger and the Article 14 cost sentence as the directive states it.\n- **2026-11-13** — spec.md converted to spec.json (reconstructed from the published chapter); thesis paragraph, roadmap and conclusion synthesis added; spec.md's open questions auto-resolved; status draft.\n- **2026-11-07** — Visual layer: redrew 2
