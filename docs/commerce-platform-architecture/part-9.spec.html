<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-13 from the published page (posts/part-9-intro/index.md, 509 words, ten units) and its former spec.md, then reordered the same day from the flow rubric (see decision_log); the page was revised to match. One spec paragraph per unit of the page; the KEY POINTS callout and Figure 3 (the before-Waypoint comparison) are evidence of the claim paragraph (p04), Figure 1 (the relay) of p01 and Figure 2 (four journeys, one chain) of p02.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part IX follows four journeys in order: a consumer purchase from search to accounting, the same jacket coming back as an exchange, a retail chain's EDI reorder through order, pallet notice, invoice and payment, and a Black Friday evening followed by the next year's plan.\n- **Know:** The first three replay April 2027 orders through the late-2027 Waypoint design (an availability service, an OMS, a PIM, and warehouse packing records for wholesale notices), keeping their dates and amounts, and compare each with the earlier landscape; the peak chapter reconstructs the 2026 incident and then presents the 2027 plan.\n- **Know:** An order is a chain of promises, each with one owner: many systems holding a piece of one order is normal, a fact with two writers is not, and every join needs a key and a daily reconciliation.\n- **Be able to:** Pick the Part IX journey that matches the order, return, business order or peak they need to trace.\n\n**Audience:** Readers new to commerce architecture (engineers, product managers and leaders) who have read Parts I to VIII and are about to start the journeys, or who arrive with one order, return, wholesale order or peak to trace and want the journey that matches it.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side.\n- Roughly what an API, a database and a queue are.\n- Part I: the thirteen steps of an order, promise and handoff, the three status lines (money, goods, returns), system of record, single writer, events, idempotency and reconciliation; the glosses for PSP, WMS, ERP, iPaaS, EDI, webhook, SKU, channel, 3PL, OMS, availability service, PIM, D2C and B2B.\n- Parts II to VIII: each capability, join and rule taught separately (catalog, price, stock, checkout, payment, order record, invoice, warehouse, shipping, returns, B2B and EDI, integration, security, privacy, regulation).\n- Kestrel & Pine in outline: a fictional outdoor brand, its systems, its incidents (among them the Three-Status Order, the Double Refund, the ASN Chargeback and the Black Friday Oversell), Bergzicht Outdoor as its largest wholesale customer and the Waypoint program; Eva's jacket order of 13 April 2027 as the book's worked order.\n\n**Does not yet know:**\n\n- The step table, the entity–owner table and the handoff requirements as one chapter shape (introduced here, taught in journey-consumer-order).\n- The despatch advice's details and the four-way match (owned by journey-wholesale-order; 'pallet notice' is used here).\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the four chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next four chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | A reader of this page alone can say why the journeys run the same orders through two architectures and what to look for in them. *Probe:* Using only this page: why does each journey compare two architectures, and what should a reader look for while following one? | `custom` | cold_reader | minor |\n\n## Thesis\n\n**Question:** What do four complete journeys through the same systems show about where commerce promises break, and what keeps them?\n\n> **Claim:** An order, its return, a wholesale reorder and a peak evening cross one chain of systems, each keeping a different promise. On Kestrel & Pine's January 2027 landscape (Black Friday 2026 for the peak) every journey broke at a handoff, not inside a system; each holds when every fact has one writer and every handoff carries an idempotency key, moves by event or daily batch as its promise's clock requires, and is reconciled.\n\n**Disputed by:** The view that commerce failures are defects inside a system, so that a merchant which picks a strong product for each slot (shop platform, warehouse system, ERP, returns app) and keeps each running has a working landscape, and an order's journey is simply the sum of its steps.\n\n**So what:** A merchant that accepts the claim reviews its landscape by walking orders through it rather than by grading products, and spends on owners, keys, gauges and reconciliations before new systems. Kestrel & Pine's four incidents sat on these four paths: the Three-Status Order (#1052877, December 2026: three statuses for six days, eleven tickets), the Double Refund (January 2027: 212 returns, €19,400 refunded twice), the ASN Chargeback (Q3 2026: €14,200 in deductions) and the Black Friday Oversell (27 November 2026: 1,340 units, 1,120 orders, about €96,000). Of Waypoint's eight decisions, three add a system (the availability service, the OMS and the PIM), while its integration standards, its EDI rules and its single definition of an order set owners, contracts, idempotency keys, reconciliations and the source of the despatch advice; the 2027 peak plan is mostly gauges and switches with owners.\n\n**How and why:** Each system keeps its own fact on its own clock (checkout in seconds, the warehouse in pick waves, the carrier overnight, the ERP in a daily batch, the bank in days) and learns the other systems' facts as copies, through messages that arrive at least once and sometimes twice, late or not at all. A step can therefore be right in its own system and wrong at the next: a stock copy two hours old, a refund written by two systems, a despatch advice written before the pallets were packed, a queue nobody measured. Running the same dates and amounts through the January 2027 landscape and the late-2027 design holds the main systems constant (the shop platform, the WMS, the ERP, the PSP and the carriers all stay) and changes only owners and joins, which shows that the failures were in the joins.\n\n**Supporting claims**\n\n- **P9-1** — A consumer order crosses about fifteen handoffs among eight systems that each hold a piece of it; it holds when each fact (product, price, physical stock, sellable stock, order, payment, parcel, invoice) has one system of record, the order number is the idempotency key on every join, and stock and orders move by event while invoices and payouts move by daily batch under a reconciliation.\n- **P9-2** — A return is three flows with three owners (the goods through the warehouse's inspection, the money through the payment provider, the books through a credit note in the ERP), released by one event, the warehouse's disposition; the refund has one writer and one key, and an exchange is a return plus a new order at the original frozen price.\n- **P9-3** — A wholesale order is a chain of contractual documents, each written by the system that knows the fact it states: the order record by the OMS, keyed on the buyer's location number and purchase-order number; the despatch advice by the warehouse system from the pallets as packed; the invoice by the ERP from the shipped lines. E-invoicing mandates change an invoice's format and transport, not its owner.\n- **P9-4** — Under peak load the chain fails at the links nobody measured: a queue that hides a growing backlog and stock copied on a schedule. A peak plan sets a capacity figure per link, tests it with marked orders, gauges and alarms the queue, sends stock as events, and gives each degradation switch an owner and a trigger, while checkout, payment and the order path are never switched off.\n- **P9-5** — Run on the same dates through the January 2027 landscape (and Black Friday 2026 for the peak), each journey breaks at a handoff where a fact had two writers or no owner, a message had no key or a link had no gauge, while every system did what it was built to do.\n\n## Role in the part\n\nPerforms the part's opening: states the part thesis in its three key points, places the four journeys on one chain of systems, says that the first three replay April 2027 orders through the late-2027 design with a comparison to the earlier landscape and that the peak is told twice, and gives the reading order.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in chapters: the four chapter paragraphs, in the part's reading order)\n\nThe page opens on one puzzle (a warehouse that reports a parcel shipped while the storefront shows it being prepared, each right about its own fact) and states at once what following orders across the handoffs shows: every journey broke at a handoff, and what makes one hold. It then narrows to the four stories that show it; to the setting they are told in and how each chapter is laid out (the late-2027 design, each chapter ending on the January 2027 landscape, the peak told as Black Friday 2026 and then the 2027 plan); to the one rule of style the comparison pictures (events for stock and orders, a daily batch for finance), beside Figure 3; then one paragraph per chapter; it ends on the opening's parcel as a question to check and where to begin. The claim follows the hook directly because both round-1 flow readers read it as the answer to the hook and the relay figure, and found it unclear after the method; the stories come before the setting because the setting is a property of the stories; the event-and-batch rule comes after the setting because it contrasts the two architectures the setting names. Put the setting first and the reader meets three time frames before knowing what they are for; put the chapter list before the setting and the January comparison each chapter ends with is unexplained.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A warehouse can report a parcel shipped while the storefront still shows it being prepared: each system is right about its own fact, and nothing in either says whether the customer's promise is being kept.\n\n**Bridge:** Parts II to VIII, which taught each capability, join and rule separately; the previous page hands over 'four journeys followed through all of them at once'. → The same systems in motion: four walkthroughs that follow one purchase, one exchange, one wholesale shipment and one peak day across the handoffs, where information or responsibility can be lost.\n\n**Thesis statement** (KEY POINTS bullets 1 to 3, paragraph p02 (the claim) and paragraph p05 (event versus batch)): An order is a chain of promises, each with one owner; in the January 2027 landscape every journey broke at a handoff, not inside a system, and each holds when every fact has one writer, every handoff carries an idempotency key, stock and orders move as events while invoices and payouts move in a daily batch, and a reconciliation catches what the messages miss.\n\n**Roadmap** (paragraphs p03 and p04):\n\n- Four journeys in order: Eva's jacket from search to accounting, the same jacket back as an exchange, Bergzicht's EDI reorder from the same warehouse stock, and Black Friday 2026 at 2,300 orders an hour followed by the 2027 plan; the first three share one shape ending in the January 2027 comparison. *Kept in:* chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | A warehouse can report a parcel shipped while the storefront still shows it being prepared, each right about its own fact; knowing how each system works, as Parts II to VIII taught, does not show whether their combined answers keep the customer's promise, so four walkthroughs at fictional Kestrel & Pine follow the order across the handoffs. | example: A parcel reported shipped by the warehouse while the storefront shows it being prepared.; figure: Figure 1: five relay runners (platform, OMS, WMS, carrier, ERP) passing one order parcel in marked handoff zones. |  |\n| p02 | claim | Run on the systems Kestrel & Pine had in January 2027, and on Black Friday 2026, each of these four walkthroughs broke at a handoff, not inside a system: each system did its job, and the journey failed where a fact had two writers or none, a message had no key or nobody watched a queue; a journey holds when every fact has one writer and every handoff has an idempotency key, a reconciliation and a speed that matches its promise. | reasoning: KEY POINTS callout: an order is a chain of promises, each with one owner; the same four stories run on two architectures; operations by event, finance by batch, and every join with a key and a net. | `cause_effect`: Walkthroughs that follow the order across the handoffs, where information or responsibility can be lost. → What following them shows: every journey broke at a handoff, and what makes a journey hold. |\n| p03 | context | Four stories show it, one sentence each: Eva's jacket goes from search to accounting; it comes back as an exchange for a larger size; retail chain Bergzicht reorders from the same warehouse stock by EDI; Black Friday 2026 puts the shared order path under 2,300 orders an hour. | scenario: Eva's jacket; Bergzicht's reorder from the same Duiven stock; Black Friday 2026's peak hour of 2,300 orders (fictional).; figure: Figure 2: four journeys, one chain: a consumer, a return, a retail chain and a peak evening enter the same systems through different doors, and every arrow is a handoff with one sender and one owner. | `example`: The claim that every journey broke at a handoff. → The four stories that show it. |\n| p04 | context | The first three journeys keep the dates and amounts of April 2027 orders but run them on the systems Kestrel & Pine has from late 2027 (Waypoint's availability service, OMS and PIM, and wholesale shipment notices written by the warehouse from its packing records); each chapter names the owner of each fact, traces the steps, messages and failure recovery, and ends by running the same order through the January 2027 landscape, while the fourth tells Black Friday 2026, then the 2027 plan. | reasoning: Waypoint W1 (availability service), W2 (OMS), W3 (PIM) and W6 (despatch advice from the warehouse's pack confirmation); the January 2027 baseline's stock sync chain and the four places orders lived.; reasoning: The chapter shape: entity–owner table, step table, handoff requirements table, failures and their recovery, the January 2027 comparison. | `elaboration`: The first three stories, which are April 2027 orders. → The design they are told in, how each chapter is laid out, the earlier landscape it ends with, and the peak journey's two settings. |\n| p05 | claim | The comparison shows which handoffs must be fast (the speed p02 asks to match each promise): in January 2027 scheduled stock copies ran up to two hours late (Figure 3); stock and orders must move as events because a shopper is waiting, while invoices and payouts can wait for a daily batch. | reasoning: Waypoint W5: stock, orders and prices move by events, finance by daily batch; every integration has an owner, idempotent handling and a reconciliation job.; figure: Figure 3: the before-Waypoint comparison: in January 2027 orders went to the warehouse one at a time and stock came back through three scheduled copies up to two hours late; in late 2027 orders move as keyed events and stock returns as events within a minute. The paragraph refers to it. | `elaboration`: The comparison with the January 2027 landscape, and p02's speed that matches each promise. → Which handoffs that comparison shows must be fast (events) and which can wait (a daily batch), with Figure 3. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the four chapters follows one Kestrel & Pine order, return, wholesale reorder or peak evening through every system, and each uses what the one before it established.\n\n**Advances the thesis** (P9-1, P9-2, P9-3, P9-4, P9-5): Each paragraph introduces the chapter that argues one supporting claim and its January 2027 comparison, so the list is the part's argument in outline.\n\n**Transition in:** `elaboration`: The four stories and the chapter shape. → One paragraph per chapter: its case in bold, its dates and amounts, and what it shows.\n\n**Order of paragraphs** (`prerequisite_order`): Journey 1 sets up the reading device and leaves the payment, invoice and order record that Journey 2 reverses (its refund is a new iDEAL transfer, its credit note drawn against Journey 1's invoice). Journey 3 changes the buyer and is read against Journey 1, drawing on the same Duiven stock. Journey 4 puts Journey 1's path under forty times its load and tells the incident before the plan. Putting the return first would reverse a payment and an invoice the reader has not seen made; putting the peak first would present an incident at links the reader has not walked one order through; putting wholesale first would teach the despatch advice without the consumer order it is contrasted with.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | description | The consumer-order chapter follows order #1072455 from search to accounting (Eva's €199 jacket and two €18 pairs of socks at 21:14 on 13 April 2027, paid by iDEAL, delivered 15 April) and names who owns each fact and how the next system learns it. | scenario: Order #1072455: €199 jacket, 2 × €18 socks, 21:14 on 13 April 2027, iDEAL, delivered 15 April (fictional). |  |\n| p07 | description | The return chapter follows the M-to-L exchange requested on 19 April, whose inspection on 22 April decides what is restocked and releases the replacement, and a refund branch shows how one authorized request avoids January's Double Refund of 212 returns. | scenario: Exchange requested 19 April, inspected 22 April; January 2027's duplicate refunds (fictional). | `sequence`: Eva's order #1072455. → Its jacket coming back as an exchange. |\n| p08 | description | The wholesale chapter follows Bergzicht's 240-unit, €19,860 reorder through structured order, pallet notice, invoice and payment (three pallets on 9 April 2027, payment due 9 May), and the ASN Chargeback, €14,200 deducted for notices that did not match the pallets, explains why the notice must describe the actual packing. | scenario: 240 units, €19,860, three pallets delivered 9 April, payment due 9 May; the ASN Chargeback's €14,200 (fictional). | `contrast`: The consumer order and its return. → A business buyer whose order is a chain of documents. |\n| p09 | description | The peak chapter reconstructs Black Friday 2026, where a four-hour order backlog and delayed stock updates produced 1,340 oversold units and about €96,000 in costs, and then the 2027 plan that tests capacity, monitors queues and gives each protective action and recovery check an owner. | scenario: Four-hour backlog, 1,340 units oversold, about €96,000 (fictional, illustrative). | `sequence`: The consumer order's path, walked in the first chapter. → The same path under peak load. |\n\n## Conclusion: Where to Begin\n\n**Synthesis:** Each journey turns the opening's parcel, shipped yet being prepared, into a question that can be checked: which system owns that fact, and how the other learns it. No chapter paragraph says this of the opening's parcel.\n\n**So what:** The question can be checked in any landscape, not only Kestrel & Pine's, so the reader takes the journeys as a method for their own systems.\n\n**Callback:** The opening's warehouse that reports a parcel shipped while the storefront shows it being prepared (p01). The conclusion names the parcel again and states the question the journeys ask of it.\n\n**Takeaway** (`course_of_action`): Begin with journey-consumer-order.\n\n**Hand-off** to [Journey 1: Eva's Jacket, From Search to Doorstep](journey-consumer-order.html): `elaboration`: The part introduction's first journey, order #1072455, and its reading device: the owner of each fact, the step table and the comparison with the January 2027 landscape. → The fifteen steps from search to payout, the system of record of each fact on the order, the requirements of each handoff and the failures along the path.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | synthesis | Each journey turns the opening's parcel, shipped yet being prepared, into a question for any landscape (which system owns that fact, and how the other learns it); begin with the consumer-order chapter, which walks order #1072455 to its January 2027 comparison. |  |  |\n\n## Non-goals\n\n- Teaching any journey's mechanics; the intro summarizes, it does not re-walk the steps. See [Journey 1: Eva's Jacket, From Search to Doorstep](journey-consumer-order.html), [Journey 2: The Jacket Comes Back](journey-return-and-exchange.html), [Journey 3: A Chain Reorders by EDI, From Order to Invoice](journey-wholesale-order.html), [Journey 4: Black Friday, Hour by Hour](journey-peak-day.html).\n- The Waypoint decisions themselves. See [Meet Kestrel & Pine](meet-kestrel-and-pine.html).\n- The failure patterns' definitions. See [Out of Stock, Out of Sync: Sixteen Ways Commerce Platforms Go Wrong](where-commerce-platforms-go-wrong.html).\n- The part's closing (the four incidents read together against the opening's parcel). See [Journey 4: Black Friday, Hour by Hour](journey-peak-day.html).\n- The dated public sources (Shopify, Stripe, Mollie, Adyen, Jumbo, GS1, Peppol, Zalando); the chapters cite them. The page makes no external factual claim of its own.\n\ <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
