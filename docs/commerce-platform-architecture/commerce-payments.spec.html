<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/12-payments/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter (check_draft.py units). It is a contract, not a description: where the published chapter did not yet do what the spec asks (a roadmap that names every section, a conclusion that returns to the opening, a hand-off that names the payment vocabulary and the goods and returns status lines), the units were added or rewritten here and the prose follows them.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The parties to a payment (shopper, issuer, scheme, acquirer, payment provider) and its four stages: authorization, capture, settlement, payout; refunds and chargebacks as payments flowing back.\n- **Know:** How payment methods differ by country (iDEAL, Bancontact, PayPal and purchase on account) and what each difference changes in the design.\n- **Know:** What strong customer authentication, 3-D Secure, the liability shift and PCI DSS scope require of the payment design.\n- **Believe:** Only the payment provider knows whether money moved; the order records the provider's confirmed outcome in its own small payment vocabulary.\n- **Believe:** A refund is a new payment, not an undo, and needs one writer and one key.\n- **Be able to:** Name, for their own company, every system that holds a credential to refund, capture or create a payment, and the business key each request carries.\n- **Be able to:** Say what a daily payment reconciliation compares and what it finds.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer or product manager who must connect a returns portal, an order system or a checkout to a payment provider, and next the finance and operations leaders who need to see why a refund is not an undo and why payouts never equal sales.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side.\n- Roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its incidents in outline and the names of the sixteen failure patterns (meet-kestrel-and-pine, where-commerce-platforms-go-wrong).\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines (money, goods, returns), 'system' for any software or outside service that handles an order, 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, the business models and the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, and the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Part II: one owning system per product attribute, prices frozen at order placement, promotions as data, gift cards and points as liabilities, available-to-promise and an exact commit at checkout.\n- From cart-and-checkout: checkout creates the order exactly once with its payment pending, and the PSP's webhook marks it paid; a daily job asks the PSP about orders still pending.\n\n**Does not yet know:**\n\n- Issuer, scheme, acquirer; authorization, capture, settlement, payout; authorization window.\n- iDEAL, Bancontact, purchase on account, buy-now-pay-later; interchange.\n- Strong customer authentication (SCA), PSD2, 3-D Secure, exemptions, liability shift, merchant-initiated transaction (MIT).\n- Refund as a new payment, cancel, chargeback and dispute ratio.\n- Idempotency key in the PSP's sense; the order's own payment vocabulary.\n- PCI DSS, self-assessment questionnaire (SAQ), hosted fields; card testing and a kill switch.\n- Receivable; payout feed; payments sub-ledger.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given returns refunded twice by two systems, the reader explains why the provider accepted the second refund and names the three controls that prevent it, before naming a new provider. *Probe:* A returns portal refunds customers after inspection; support agents can also refund in the payment provider's console. Over three weeks some 200 returns are refunded twice. Using only this chapter: why did the provider accept the second refund, and what prevents it? | `custom` | cold_reader | major |\n| AC-2 | Given a card order shipped after its authorization window, the reader says what happens to the money and what should have prevented it. *Probe:* A shop takes card payments and captures them when the order ships. The warehouse ships one order on day eight after the purchase. Using only this chapter: what happens to the payment, and what should have been in place? | `custom` | cold_reader | major |\n| AC-3 | The reader can say why a card payment design cannot be reused unchanged for iDEAL. *Probe:* Using only this chapter: why can a Dutch shop not reuse its card payment design unchanged for iDEAL? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n| AC-6 | A reader new to commerce meets no term in this chapter before it is explained, and every acronym is expanded on first use. | `known_before_new` | rubric | minor |\n\n## Thesis\n\n**Question:** How does money move from the shopper to the merchant, and what can go wrong?\n\n> **Claim:** Money moves in four stages that the merchant only requests and the shopper's bank, the card or bank scheme and the payment provider carry out: authorization reserves the amount, capture takes it, settlement moves it between banks, and payout pays the merchant net batches on the provider's schedule, typically one per sales day; a refund or a chargeback is a new payment in the opposite direction, and each payment method changes the stages (an iDEAL payment is taken at once and cannot be charged back; a card authorization expires after about seven days). The failures that land on the merchant's own systems are acting on an outcome it did not see or moving money twice: an order marked paid or unpaid without the provider's confirmed message, a capture attempted after the authorization has expired, and one refund sent by two systems with no shared key.\n\n**Disputed by:** The view that payments are the payment provider's concern: once a provider is integrated, 'paid' is a flag set at checkout, a refund is an undo anyone with console access may perform, and the main payment decision is which provider to use or whether to add a second one.\n\n**So what:** Kestrel & Pine refunded 212 returns twice in January 2027, €19,400, because the returns portal and support in the provider's console could both refund and neither request carried a key; bank-transfer refunds could not be recalled. Its fix was one writer, the return id as the key and a daily comparison, not a new provider. A merchant that accepts the claim lists who holds a credential to move money and with what key before it compares providers, and keeps one provider with that discipline until volume, countries or resilience require more.\n\n**How and why:** The issuer and the provider decide whether money moved and report it by webhook, which arrives at least once, in no guaranteed order, and stops retrying after 26 hours (Mollie) or three days (Stripe), so only the provider's record, fetched when the decision matters, and a daily job for pending payments give the order the true state. A provider executes every valid request it receives; a refund that names only an order and an amount cannot be recognized as a repeat, whereas a request carrying the return id as its idempotency key returns the first result. An authorization lapses on the issuer's clock whatever the order's status, so a capture must be scheduled against that deadline; and each method fixes its own windows, so a design built on one method's stages misses another's deadlines.\n\n**Supporting claims**\n\n- **S1** — The merchant only requests: the issuer, the scheme and the payment provider carry the money through authorization, capture, settlement and payout, and a refund or a chargeback is a new payment in the opposite direction with its own state, failures and fees.\n- **S2** — Each payment method bends the stages differently (an iDEAL payment is instant and cannot be charged back, a card authorization expires after about seven days, a German invoice purchase is a receivable or a loan), so a design built on one method's stages misses another's deadlines.\n- **S3** — Only the payment provider knows whether money moved, and it reports by webhook, at least once and in no guaranteed order; the order therefore keeps its own small payment vocabulary moved only by confirmed events, fetches the provider's record when the decision matters, and asks the provider daily about every payment still pending.\n- **S4** — A provider executes every valid request it receives, so every action that moves money needs one writing system and one business key, and a daily comparison of the provider's records with the merchant's finds what the rule missed.\n- **S5** — Authentication and card-data rules shape the design: the order stores the authentication result and the liability flag, fraud screening and a kill switch act before authorization, and hosted fields keep every card number out of the merchant's systems.\n- **S6** — How a merchant takes payments, and how many payout feeds finance must match, change with scale; a merchant of Kestrel & Pine's size gains more from one provider used with discipline than from an orchestration layer over several.\n\n## Role in the part\n\nFollows the money the order is waiting for through stages the merchant does not control and makes the single writer and the business key the rule for every action that moves money. Supports P3-2, P3-3 of part `part-3`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene to refunds: the Double Refund is the problem; the stages, the authentication step and the message supply the terms its fix (one writer, one key, one daily check) needs; `comparison` in choices, feeds and stages: four ways to take payments on the same criteria, then the four payout feeds, then the stage table; `chronological` in psp, sca, fraud, message, refunds: the order in which one payment meets each step, from the parties and the stages through the checks before the request leaves the shop, the outcome message after it, and the money flowing back)\n\nThe Double Refund comes first so that each term arrives as part of the answer to 'who may move money, with what key, and how does the order learn what the PSP did'. The parties and the four stages follow because every later section names a stage: authentication happens before authorization, the webhook reports the stages' outcomes, a refund is only possible after capture, and a payout is what finance matches. Authentication, fraud screening and card data come before the message because the shopper leaves for her bank or a 3-D Secure challenge before the outcome can arrive, and the message section starts from that departure; putting it after the message would leave '3-D Secure' unexplained where it is first needed. The message section comes before refunds because the refund fix reuses its two habits: applying a repeated event once (an event id) becomes sending a repeated request once (an idempotency key), and the daily job for pending payments becomes the daily refund comparison; the requirements table also previews the refund flow that the next section explains. Fraud and card data follow authentication because all three act before the payment request leaves the shop, and the section ends with the dated rules that govern all three; the choices table later compares PCI scope, which the reader then already has. The four ways to take payments come before the payout feeds, and both before the scale-stage section, whose table uses the options and the feeds in its rows; Shopify's payments are told with the option they exemplify, not among the parties. Eva's payment is worked through after the reader has every term, and the failures come last, each one a rule of the chapter seen from detection, recovery or prevention. Moving the scene later would put a vocabulary lecture before the problem; moving refunds before the message would present the refund key and the daily refund comparison without the event-id rule and the pending-payments job they are modelled on.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A shopper approves a payment in a bank app and returns to the web shop. That return alone does not tell the merchant whether the money was reserved, collected or still pending.\n\n**Bridge:** Anyone who has paid online has been sent to a bank app or a card check and back to a thank-you page; the previous chapter left Eva's order created at that point with its payment pending. → The merchant's own systems do not see what happens at the bank, so the question is how the money moves, how the order learns the outcome, and what goes wrong when it guesses or when money is moved twice.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and paragraph p02): The shopper's bank, the scheme and the payment provider move the money; the merchant only asks. The failures that land on the merchant's own systems come from acting on an outcome it did not see confirmed, or from moving money twice: a paid order left unpaid, a reservation that expires before capture, a refund sent by two systems with no shared key.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p03):\n\n- Start from three weeks in January 2027 when Kestrel & Pine refunded 212 returns twice. *Kept in:* scene.\n- Explain what a payment provider does: the parties, the four stages of a payment and how methods differ by country. *Kept in:* psp.\n- Explain the checks made before the money is reserved: customer authentication, fraud screening and keeping card numbers out of the merchant's systems. *Kept in:* sca, fraud.\n- Explain the message that tells the order what happened, and refunds and chargebacks as money flowing backward. *Kept in:* message, refunds.\n- Compare four ways to take payments, add the stores', wholesale and marketplace payout feeds, and say which setup fits which scale stage. *Kept in:* choices, feeds, stages.\n- Work Eva's payment through and list the ways payment integrations fail. *Kept in:* in-practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | When a shopper returns from her bank app, the shop still does not know whether the money was reserved, collected or is still pending, and it needs the provider's confirmation to release the order without asking her to pay twice. | scenario: A shopper approves a payment in her bank app and comes back to the web shop. |  |\n| p02 | claim | Because the bank, the scheme and the payment provider move the money and the merchant only asks, the merchant's failures come from acting on an outcome it did not see confirmed or from moving money twice, and checking unresolved payments against the provider's records makes them visible early. | reasoning: A paid order left unpaid by a missing confirmation, a reservation that expires before capture, a refund sent by two systems with no shared key. | `cause_effect`: The shop does not know what happened at the bank. → Who does move the money, and the two kinds of failure that follow for the merchant. |\n| p04 | context | Eva, the book's shopper, was sent to her bank's app at 21:13 on 13 April 2027 to pay €235 by iDEAL and her order exists with its payment pending, so from here only the payment provider's message can say whether the money moved; the chapter follows that message and the money to payout, and ends by asking what a refund would have done in place of her later exchange of the jacket. | scenario: Eva's €235 iDEAL payment at 21:13 on 13 April 2027; order #1072455 pending (cart-and-checkout). | `example`: The shopper of the opening, waiting for the provider's confirmation. → Eva's order, created with its payment pending at the end of checkout, and the webhook as the only source of its outcome. |\n| p03 | transition | The chapter starts from the Double Refund, explains the payment provider's parties, stages and methods, then the checks before the money is reserved (authentication, fraud screening, card data), the outcome message, refunds and chargebacks, compares four ways to take payments, adds the other payout feeds and the scale stages, and ends with Eva's payment worked through and the ways payment integrations fail; its evidence is Kestrel & Pine's incidents, payment providers' documentation and EU payment law. |  | `sequence`: Eva's order waiting for the money's outcome. → The order in which the chapter follows the money, and its evidence. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: Three Weeks in January\n\n**Controlling idea** (`context`, id `scene`): Kestrel & Pine refunded 212 returns twice because two systems could refund and neither sent a key naming the return, and its Card-Testing Night showed that one provider carried every online sale.\n\n**Advances the thesis** (S4, S6): States the chapter's problem in Kestrel & Pine's own incidents: two writers and no key, and one provider for every sale.\n\n**Transition in:** `sequence`: The roadmap's first promise: the Double Refund. → Kestrel & Pine's payment routes and the January 2027 incident.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): Told in the order Noor Visser's team assembled the evidence: the payment routes first, so the reader knows which systems could act; then the January 2027 discovery, the reconstruction and the diagnosis; the Card-Testing Night of August 2026 last although it happened earlier, because it is a second incident that raises a second question (one provider for every sale), which the choices and the failures answer.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description | Kestrel & Pine takes money by three routes, its online payment provider, a separate terminal provider for the stores, and bank transfers from wholesale customers, and finance must account for all three. | fact: The PSP offers iDEAL, cards, PayPal, Klarna, Bancontact and Apple Pay and pays a net daily amount; six stores on a terminal provider; wholesale on 30-day terms. |  |\n| p06 | evidence | In January 2027 the Finance Director found that 212 returns had been refunded twice over three weeks, once by the returns portal and once by support in the PSP console, and €19,400 had gone out a second time: the Double Refund, Kestrel & Pine's case of the Boomerang. | case: The Double Refund: 212 returns, €19,400, January 2027, found from duplicate credits in the ERP. | `time`: The routes finance must account for. → What finance found in January 2027. |\n| p07 | evidence | Bank-transfer refunds could not be recalled, and Noor Visser's reconstruction shows an ordinary sequence: a helpful agent refunds in the console after the carrier's 'delivered' scan, and the returns portal refunds again after inspection. | table: Day-by-day reconstruction: day 0 parcel arrives; days 0–3 the customer asks support; day 1 the agent refunds €199 in the PSP console; days 2–5 the portal refunds on inspection through the platform; day 31 finance finds two credits per order. | `cause_effect`: The €19,400 refunded a second time. → What could be recovered, and how the double refunds came about. |\n| p08 | analysis | Two systems could refund, neither sent a key that named the business event, and the two paths met only in the ledger, which gives the chapter its question: who may move money, with what key, and how does the order find out what the PSP actually did? |  | `conclusion_summary`: The reconstructed sequence. → The diagnosis and the chapter's question. |\n| p09 | evidence | Kestrel & Pine's other payment incident, the Card-Testing Night of August 2026 (48,000 stolen card numbers, €2,900 in fees, a 40-minute pause of the PSP account), raises a second question the chapter answers near its end: what happens when the one provider that carries every online sale stops. | case: 48,000 attempts, €2,900 in fees for declined authorizations, a 40-minute account pause. | `additional_support`: Noor's question about who may move money. → A second, earlier incident and the second question it raises: one provider for every sale. |\n\n### What a Payment Service Provider Does\n\n**Controlling idea** (`explanation`, id `psp`): A payment service provider stands in front of the issuer, the scheme and the acquirer and carries every payment through four stages, authorization, capture, settlement and payout, whose windows and costs differ by method and country.\n\n**Advances the thesis** (S1, S2): Names the parties and the four stages the thesis rests on, and shows from provider documentation and dated usage figures that methods change the stages.\n\n**Transition in:** `elaboration`: The question of how the order finds out what the PSP did. → What a PSP is and who stands behind it when Eva pays.\n\n**Order of paragraphs** (`large_to_small`): Parties first, then the four stages they carry out, then what each stage leaves in the order record, then the windows and payout timing of those stages, then how the methods of each country bend them and what they cost, and last a dated caveat on iDEAL's semantics: the windows need the stages, the country methods generalize what the windows began to show, the costs need the methods, and the caveat qualifies the method the chapter's example uses without interrupting the move from methods to costs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition | When Eva pays, at least five parties take part: the shopper, the issuer, the scheme, the acquirer and the PSP. | table: The five parties in plain words and in Eva's iDEAL payment. |  |\n| p11 | explanation | A PSP hides the other parties behind one contract, and the providers' documentation describes the same four-stage flow, authorization, capture, settlement and payout, with refunds and chargebacks flowing back. | source: Adyen, Stripe and Mollie documentation, n.d., accessed November 2026. | `elaboration`: The five parties. → What the PSP does with them: one contract and four stages. |\n| p12a | explanation | Each stage has a different actor and leaves something different in the order record: the authorization's reference and expiry, the capture's amount and shipment, nothing for settlement, and the payout's batch, matched by finance. | figure: Figure 1: the four stages, with the webhook, capture and refunds through one path, and the payout matched by finance.; table: Stage, who acts, in plain words, what the order record keeps; Adyen's line on manual capture at shipment. | `elaboration`: The four stages named from the providers' documentation. → The stages one by one: who acts and what the order record keeps. |\n| p13 | evidence | A card authorization is valid for about seven days and Klarna must be captured within 28, so capture on shipment is a promise with a deadline: a parcel shipped after the window leaves unpaid. | quotation: Stripe: seven days for Visa, Mastercard, American Express and Discover for customer-initiated online payments; on expiry \"the funds are released and the payment status changes to canceled\"; Klarna 28 days at Stripe and Mollie. | `emphasis`: Authorization and capture as separate stages. → The windows between them. |\n| p14 | evidence | Payout follows its own schedule, days later and net of refunds and fees, so a payout never equals one day's sales, and the batch report is what finance matches against orders. | quotation: Adyen's default \"sales day payout\" with a two-business-day delay; Stripe's initial EU settlement timing of seven calendar days moving to three business days. | `contrast`: The authorization and capture windows. → Payout timing, which is separate. |\n| p15 | comparison | Cards lead across the euro area, but in each of Kestrel & Pine's three countries a different method leads, iDEAL in the Netherlands, Bancontact (which works like a card) in Belgium, PayPal and purchase on account in Germany, and each difference changes the design. | statistic: Cards at 48% of euro-area online payments by number (ECB SPACE 2024).; table: Country, dominant method, dated evidence (Dutch Payments Association 2025-02; Bancontact Payconiq Company 2025-02; EHI via Ecommerce News 2024) and what each means for the design. | `contrast`: The four stages as the providers describe them. → That methods by country bend those stages. |\n| p17 | evidence | Methods also cost different amounts: on a €100 sale a buy-now-pay-later payment can cost ten times an iDEAL payment, a pricing decision before it is a technical one. | statistic: Adyen's indicative prices: \"$0.13 + €0.22\" for iDEAL, \"$0.13 + Interchange++ + 0.60%\" for Visa and Mastercard, \"$0.13 + 2.99%\" for Klarna in Germany; interchange capped at 0.2% (debit) and 0.3% (credit) by Regulation (EU) 2015/751. | `additional_support`: Methods differ in their stages, country by country. → Methods also differ in cost. |\n| p16 | explanation | One caveat on the running example: iDEAL is changing its name under the European Payments Initiative's wallet, so the chapter relies on Mollie's documented iDEAL semantics, dated, and flags the name as in motion. | fact: The scheme's site brands itself \"iDEAL \\| Wero\" as of November 2026; Mollie: instant charge, automatic capture, partial refunds for 365 days, no chargeback, 15-minute session. | `contrast`: The methods' stages and costs as documented today. → A caveat that iDEAL's own name is changing, and which semantics the chapter relies on. |\n\n### Strong Customer Authentication and 3-D Secure\n\n**Controlling idea** (`explanation`, id `sca`): EU law requires strong customer authentication before most online payments; for cards 3-D Secure performs it, whether it ran decides who bears a fraud dispute, and a later merchant-initiated charge depends on it, so the order must store its result.\n\n**Advances the thesis** (S5): Shows that the authentication step before authorization leaves facts (the result, the liability flag, the MIT flag) the order must keep.\n\n**Transition in:** `sequence`: The methods and their stages, starting with authorization. → The check that comes before authorization: who is paying.\n\n**Order of paragraphs** (`large_to_small`): What authentication is in plain words, then the law that requires it and its exemptions, then the card protocol, its liability rules and the merchant-initiated charge that depends on it: the reader needs the requirement before the protocol that meets it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p23 | definition | Before authorization, payment authentication checks that the person paying may use the method; strong customer authentication combines independent checks, and checkout must let it finish before treating the payment as confirmed. |  |  |\n| p24 | evidence | PSD2 gives strong customer authentication its legal definition (two of knowledge, possession and inherence) and requires it when a payer starts an electronic payment, and its detailed rules set the exemptions. | source: Directive (EU) 2015/2366, Article 4(30) and Article 97, applied from 13 January 2018; Delegated Regulation (EU) 2018/389, applied from 14 September 2019: contactless up to €50, trusted beneficiaries, recurring after the first, low-value remote up to €30, transaction risk analysis up to €500. | `elaboration`: Strong customer authentication in plain words. → The law that defines and requires it. |\n| p25 | explanation | For cards 3-D Secure 2 performs the check; an exemption trades conversion for fraud liability, so the order stores the authentication result and the liability flag; and a later merchant-initiated charge is allowed only if the first payment was authenticated and flagged for it. | quotation: EMVCo: frictionless and challenge flows; Stripe: \"Exemptions aren't guaranteed\"; \"If a cardholder disputes a 3DS payment as fraudulent, the liability typically shifts from you to the card issuer\"; with an exemption \"liability shift doesn't apply\". | `elaboration`: The legal requirement. → The card protocol that meets it, and what follows for the order. |\n\n### Fraud and Card Data: Keep the Attack Out and the Card Number Out\n\n**Controlling idea** (`recommendation`, id `fraud`): Besides authentication, two decisions act before the payment request leaves the shop: screen attacks with a kill switch in reserve, and keep every card number out of the merchant's systems with hosted fields; and the rules behind all three are still moving.\n\n**Advances the thesis** (S5): Shows the two decisions, fraud screening and PCI scope, that decide what the merchant's systems may see and do.\n\n**Transition in:** `similarity`: Authentication as one check before the money is reserved. → Two other decisions that act before the request leaves the shop: keeping attackers out and card numbers out.\n\n**Order of paragraphs** (`grouping`): The section's scope first, then the attack (fraud screening, with the Card-Testing Night as its case), then card data in three steps (the standard, the mechanism, the 2025 change), then the dated rules that are still moving: the two decisions are grouped, card data needs its standard before its mechanism, and the regulatory outlook comes last because it covers authentication, fraud liability and payment rails together.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | transition | Authentication is one check before the money is reserved; two other decisions also act before the request leaves the shop, and other chapters own their depth, so this section keeps to what shapes the payment design. |  |  |\n| p32 | recommendation | Fraud screening and request limits before authorization stop card testing, the Card-Testing Night's attack, before it costs fees or a provider pause, and a kill switch lets the merchant pause one method while the rest keep trading. | source: Stripe's card-testing guidance: spikes in failed payments, small amounts, implausible details; risk models, rate limits, CAPTCHA, login, limits per address. | `sequence`: The section's two decisions. → The first: keeping the attack out. |\n| p33 | claim | Card data is a scope decision: PCI DSS obligations depend on which systems can see a card number, and the design goal is that none of the merchant's can. | fact: PCI DSS v4.0.1 published 11 June 2024; future-dated requirements effective 31 March 2025. | `sequence`: Keeping the attack out. → The second decision: keeping the card number out. |\n| p34 | explanation | Hosted fields keep the card number away from the merchant's code and servers, which keeps the merchant at the smallest self-assessment questionnaire. | quotation: Stripe's mapping: hosted checkout or fields to SAQ A, merchant-hosted form to SAQ A-EP, raw card data to SAQ D, \"more than 300 security controls\"; Adyen: \"solely responsible for the security of cardholder data only as soon as Adyen receives the data\". | `elaboration`: The goal that no merchant system sees a card number. → The mechanism that achieves it. |\n| p35 | recommendation | Since January 2025 every script on the payment page remains the merchant's risk, so the rule is never to store, log or send a card number, to use the PSP's token and to keep a list of every script on the payment page. | quotation: SAQ A eligibility that the site \"is not susceptible to attacks from scripts\", replacing two script requirements on 30 January 2025. | `contrast`: Hosted fields as the mechanism. → What remains the merchant's risk, and the rule. |\n| p26 | context | The rules around authentication and fraud are still moving, so the payment design needs someone who tracks them: PSD3 and the Payment Services Regulation are agreed but not yet law, and the Instant Payments Regulation is in force and makes instant transfer a plausible checkout and refund rail. | fact: Provisional agreement 27 November 2025 (European Parliament press release 21 November 2025); Council compromise texts 23 April 2026, files open on 29 October 2026; not in the Official Journal as of 7 November 2026. Regulation (EU) 2024/886: receive by 9 January 2025, send by 9 October 2025, free payee verification. | `emphasis`: The rules on authentication and card data that apply today. → That these rules are still moving: PSD3 and the Payment Services Regulation coming, instant payments in force, so the design needs someone who tracks them. |\n\n### The Order Depends on a Message It Does Not Control\n\n**Controlling idea** (`claim`, id `message`): Nothing in the merchant's own systems knows whether a payment succeeded; the provider says so by webhook, at least once and in no guaranteed order, so the order applies each event once, fetches the provider's record when the decision matters, runs a daily job for what is pending, and keeps its own small payment vocabulary.\n\n**Advances the thesis** (S3): States the rule and the three consequences from the providers' own documentation, and the vocabulary that lets the order change provider without changing every system.\n\n**Transition in:** `cause_effect`: The checks made before the payment request leaves the shop. → That once the request has left, the merchant cannot see the outcome and must wait for the provider's message.\n\n**Order of paragraphs** (`assertion_evidence_reasoning`): The rule first, then the documentation that proves the message is unreliable, then the three consequences, then the vocabulary that holds the result, then the requirements of each flow: each step depends on the one before.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | claim | Once the checks are passed and the request has left, nothing in the merchant's own systems knows whether the payment succeeded: the shopper left for her bank's app or a 3-D Secure challenge, and the PSP tells the merchant by webhook, so the order must wait for that message and be safe when it arrives twice or not at all. |  |  |\n| p19 | evidence | The providers' documentation says the message can come out of order, twice or forged, and stops retrying after a time. | quotation: Stripe: \"Stripe doesn't guarantee the delivery of events in the order that they're generated\"; \"Webhook endpoints might occasionally receive the same event more than once\"; signing because \"an attacker could send fake webhook events\". Mollie: id-only webhooks, so \"fake calls to your webhook will never result in orders being processed without being actually paid\"; ten retries over 26 hours. | `additional_support`: The webhook as the only source of the outcome. → What the providers say about it. |\n| p20 | recommendation (list) | Three consequences belong in the integration contract of any order system: treat a repeated event as a no-op, fetch the provider's record when the decision matters, and run a daily job for every payment still pending. | figure: Figure 2: the webhook as a doorbell; the clerk checks the PSP's record and a daily job checks pending orders. | `cause_effect`: The message's documented properties. → What the order system must do about them. |\n| p21 | recommendation | The order records each confirmed event in its own small payment vocabulary (pending, authorized, paid, refunded, disputed), translating the PSP's statuses inside an adapter, so changing PSP changes an adapter, not every downstream system. | fact: Mollie has seven payment statuses, Stripe's PaymentIntent six.; figure: Figure 3: the order's few payment states, moved only by confirmed events, with the PSP's raw status beside them. | `elaboration`: Confirmed events, each applied once. → Where the order records them: its own payment vocabulary. |\n| p22 | analysis | Each flow between the order and the PSP (outcome in, capture out, refund out, payout report in) has its own needs for freshness, consistency, speed and behavior when the other side is down. | table: Four flows by freshness, consistency, speed and what happens if the other side is down; latencies marked as assumptions. | `elaboration`: The order's payment vocabulary and the outcome message. → All four flows between the order and the PSP, side by side. |\n\n### Refunds, Cancels and Chargebacks: Money Flowing Backward\n\n**Controlling idea** (`claim`, id `refunds`): A refund is a new payment in the opposite direction, so it needs one writer and one key, which is the fix of the Double Refund; a chargeback is a backward payment the merchant does not decide.\n\n**Advances the thesis** (S1, S4): Shows from provider documentation that a refund is a payment, uses the Double Refund to show why it needs one writer and one key, and adds the chargeback as the backward flow the merchant does not control.\n\n**Transition in:** `elaboration`: The requirements table: requests going out to the PSP need a key and a deadline, and exactly one refund per return. → Why the refund row needs the most care: a refund is a new payment, not an undo.\n\n**Order of paragraphs** (`problem_solution`): What a refund is, then how the Double Refund happened with that knowledge, then the three-part fix, then the other backward flow: the fix cannot be understood before the reader sees a refund as a new payment.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | claim (list) | A refund must happen exactly once per return because it is a new payment in the opposite direction: possible only after capture (before capture the authorization is canceled instead), asynchronous and able to fail later, and only to the original method. | quotation: Adyen: \"You can only refund a payment after it has been captured\"; a refund can fail after success, funds \"up to 40 business days\"; Stripe: fees \"aren't returned\"; credit \"approximately 5-10 business days later\". |  |\n| p28 | example | The Double Refund, drawn as a sequence, shows two writers on two paths with no shared key, so the PSP could not refuse the second request and the paths met only in the ledger. | figure: Figure 4: the Double Refund as a sequence of two writers and two paths. | `example`: A refund as a new payment. → The Double Refund seen as two such payments. |\n| p29 | recommendation | Waypoint's fix of February 2027 has three parts: one writer per money action, the return id as the refund's idempotency key, and a daily comparison of the PSP's refunds with the shop platform's. | case: Support's console access read-only; refunds only from the returns portal through the shop platform; the return id as key; a daily check by order number and amount to Sanne de Wit's team.; quotation: Stripe \"saves the status code and body of the first request made with a given idempotency key\" and may prune keys after 24 hours.; figure: Figure 5: two desks refunding the same parcel against one desk whose key makes the provider refuse the repeat. | `problem_solution`: Two writers and no shared key. → The three-part fix. |\n| p30 | explanation | Chargebacks are the other backward flow and not the merchant's decision: the issuer reverses the payment, the dispute ratio is watched for months, and a slow refund path pushes customers to dispute instead. | quotation: Stripe: a dispute \"occurs when a cardholder questions your payment with their card issuer\", the issuer \"immediately reverses the payment\", up to 120 days; Adyen's dispute stages and auto-defense of refunded disputes; Visa's monitoring threshold lowered to 150 basis points on 1 April 2026. | `contrast`: Refunds, which the merchant issues. → Chargebacks, which it does not. |\n\n### The Choices: Four Ways to Take Payments\n\n**Controlling idea** (`comparison`, id `choices`): A merchant can take payments through the platform's own payments, one PSP through a connector, a custom integration with hosted fields, or its own payment service over several PSPs; at Kestrel & Pine's size the second, run with discipline, is the right choice.\n\n**Advances the thesis** (S6): Compares the four options on the criteria the chapter has built (PCI scope, capture control, who may move money, resilience), shows that even a platform's own payments run over PSPs, and gives the author's rule.\n\n**Transition in:** `sequence`: The parts of the payment design: stages, checks before authorization, the message and refunds. → The four ways to put them together.\n\n**Order of paragraphs** (`comparison`): Four options from least to most control, the first with the Shopify case that shows what lies under it, then the comparison table attached to the fourth option, then the author's rule: the rule needs the comparison, and the Shopify case belongs with the option it explains.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p36 | description | The platform's built-in payments need nothing integrated, but the method mix and fees are the platform's and any second system that moves money must go through its API. |  |  |\n| p12 | example | Shopify Payments, the public example of the first option, runs over Stripe, PayPal and Adyen in the Netherlands, Belgium and Germany, so a platform's own payments are a commercial wrapper over licensed PSPs and the four stages apply underneath. | quotation: Shopify's processor list names Stripe, PayPal and Adyen; its European payment terms state that no Shopify entity is \"licensed as a bank, payment institution, or money services business\". | `example`: The platform's built-in payments as the first option. → Shopify Payments as the public case, and what sits underneath it. |\n| p37 | description | One external PSP through the platform's connector, Kestrel & Pine's setup since 2016, gives local methods, pricing and risk tools and ownership of the webhook endpoint and of who else may call the PSP. |  | `sequence`: The first option, a wrapper over PSPs. → The second: contracting a PSP directly. |\n| p38 | description | A custom integration with hosted fields gives full control of capture and merchant-initiated charges, and leaves every property of the webhook to the checkout team. |  | `sequence`: The second option. → The third. |\n| p39 | description | A payment service of the merchant's own over several PSPs routes and reconciles across them, and is worth its complexity only when volume, countries or resilience demand it. | table: The four options by time to first sale, method mix, PCI scope, capture control, who else may move money, resilience and fit. | `sequence`: The third option. → The fourth, and the table that compares all four. |\n| p40 | recommendation | The table shows that only an own payment service over several PSPs keeps selling through a provider outage, at the highest running cost; for a merchant of Kestrel & Pine's size the author's rule is to stay on one PSP, spend the effort on discipline, and rehearse a fallback for one method instead. |  | `conclusion_summary`: The comparison table. → The author's recommendation for Kestrel & Pine's size. |\n\n### Stores, Wholesale and Marketplaces: Four Feeds, Not One\n\n**Controlling idea** (`explanation`, id `feeds`): Online is only one of four ways money reaches Kestrel & Pine; stores, wholesale and marketplaces each bring their own payout feed, so finance reconciles four feeds by daily batch.\n\n**Advances the thesis** (S6): Shows that the number of feeds finance must match grows beyond the PSP, which explains W5's daily batch and a payments sub-ledger.\n\n**Transition in:** `contrast`: The choices for taking online payments. → That online is only one of four feeds.\n\n**Order of paragraphs** (`grouping`): The claim, then the three other feeds one by one, then online and the conclusion: the four-feeds conclusion needs all four named.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p41 | claim | Online is one of four ways money reaches Kestrel & Pine. |  |  |\n| p42 | description | Stores take cards through the terminal provider with different authentication, a different PCI questionnaire and a separate payout feed, and a web order refunded at the till is the store's version of the Double Refund. |  | `sequence`: The four ways. → The first: stores. |\n| p43 | description | Wholesale customers do not pay at checkout: their payment is a receivable tracked in the ERP and settled by a bank transfer finance matches to the invoice. | scenario: Bergzicht's spring reorder invoiced on 9 April 2027 and due on 9 May. | `sequence`: Stores. → Wholesale. |\n| p44 | description | Marketplaces collect the shopper's money and pay the seller out net of fees on their own schedule, a third payout feed. |  | `sequence`: Wholesale. → Marketplaces. |\n| p45 | synthesis | With the PSP's daily batch as the fourth, four feeds need four reconciliations, which is why Waypoint's W5 moves finance by daily batch and where a payments sub-ledger earns its place. |  | `conclusion_summary`: Stores, wholesale and marketplaces. → Online as the fourth feed and what the four together require. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`analysis`, id `stages`): The payment mechanism does not change with scale; what changes is how many systems can move money and how many feeds finance must match, and the Growing stage is where the Double Refund happens.\n\n**Advances the thesis** (S6, S4): Places the options, the feeds and the one-writer rule on the four scale stages.\n\n**Transition in:** `elaboration`: The four ways to take payments and the four feeds. → Which setup fits which scale stage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p46 | analysis | The payment mechanism does not change with scale; the number of systems that can move money and of feeds to match does, and stage 2 is where the Double Refund happens because the first integration beyond the platform gets a PSP key. | table: Four stages by what is typical, what becomes necessary and the signs the stage is ending. |  |\n\n### In Practice\n\n**Controlling idea** (`example`, id `in-practice`): Eva's €235 shows the stages, the message and the payout in one iDEAL payment, and its refund variant shows one writer and one key at work.\n\n**Advances the thesis** (S1, S3, S4): Applies the chapter's terms to the running example: pending until the webhook, payout matched by line, a refund keyed on the return id.\n\n**Transition in:** `example`: The whole payment design and the one-writer rule by stage. → Eva's payment worked through.\n\n**Order of paragraphs** (`chronological`): The payment, then the same payment by card for contrast while the payment is fresh, then its payout, then the refund variant later in April: the order in which the money moves.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p47 | example | Eva's iDEAL payment is requested at 21:13, the order is created pending at 21:14, and the PSP's webhook marks it paid seconds later; iDEAL has no separate capture and no card chargeback. | scenario: Order #1072455, €235, 13 April 2027. |  |\n| p49 | comparison | With a card, the payment would be authorized on Tuesday and captured on Wednesday at label print, inside the seven-day window, with the fulfillment order id as the capture's key. |  | `contrast`: The iDEAL payment, with no capture. → The same order paid by card. |\n| p48 | example | Under labelled assumptions the payout arrives on 15 April in a batch net of fees and refunds, and finance matches it to orders by the PSP reference. | scenario: An assumed €0.30 fee and payout on Thursday 15 April, two business days later; the cited Adyen price is $0.13 + €0.22. | `time`: The iDEAL payment confirmed (and its card alternative). → Its payout. |\n| p50 | example | Had Eva asked for a refund, the returns portal would refund €199 after inspection with the return id as the key, through the shop platform and the PSP, and support would issue nothing in the console; the refund shows up as a deduction in a later batch, which is why matching is by line. | scenario: Refund variant: request 19 April, inspection 22 April, €199 by a new iDEAL transfer, credit note in the ERP. | `time`: The payment and its payout. → The refund that a different choice on 19 April would have produced. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `wrong`): Four failures, the duplicate refund, the lost outcome, the expired authorization and the provider outage, each come with a way to detect them and a way to recover or prevent them, most drawn from the chapter's rules.\n\n**Advances the thesis** (S3, S4, S2): Turns the chapter's rules into detection, recovery and prevention for the failures the thesis names.\n\n**Transition in:** `contrast`: Eva's payment going right. → The ways it can go wrong.\n\n**Order of paragraphs** (`order_of_importance`): The duplicate refund first, because it is the chapter's case; then the lost outcome and the expired authorization, the other two failures the thesis names; then the outage, which the Card-Testing Night raised.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p51 | analysis | The duplicate refund is detected by a daily list of the PSP's refunds against the shop platform's, recovered by asking for the money back, and prevented by one writer and the return id as key. |  |  |\n| p52 | analysis | The lost outcome is detected by the daily job for payments pending beyond their method's expiry, recovered by asking the PSP, and prevented by a webhook endpoint that is owned and verified. |  | `sequence`: A failure of moving money twice. → A failure of not seeing the outcome. |\n| p53 | analysis | The expired authorization is detected by an alert before the window closes, recovered only by a merchant-initiated charge where the first payment was set up for one, and prevented by capture at label print and a fulfillment hold. |  | `sequence`: The lost outcome. → A capture after the deadline. |\n| p54 | analysis | The provider outage or account pause, as on the Card-Testing Night, is detected by watching the PSP's error rate, met with a rehearsed fallback and a kill switch, and prevented by limits before authorization. |  | `sequence`: Failures inside one payment. → A failure that stops every payment. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The stages, the methods, the message and the refund rules are one answer seen from four sides: the merchant only asks, so its systems must record what the provider confirms, give every action that moves money one writer and one key, and compare their records with the provider's every day. Every failure in the chapter breaks one of those three, and none of the fixes is a different provider.\n\n**So what:** A reader can list, before comparing providers, which systems hold a credential that can move money, the key each request carries and what the daily comparison checks; that list is what stopped the Double Refund, and it is the same for one provider or several.\n\n**Callback:** The introduction's shopper returning from her bank app to a shop that does not know whether the money moved, and the Double Refund of the scene. The first paragraph of the conclusion returns to the shopper and to the 212 returns and says what the order should have relied on in each: the provider's confirmed message, and one writer with one key.\n\n**Takeaway** (`course_of_action`): Name the systems that may refund, capture or create a payment, give each request a business key, run a daily comparison with the provider's records, and take the seven questions to your own company.\n\n**Hand-off** to [The Order Record: Lifecycle, State and the Order Management System](order-management.html): `time`: The order marked paid by the payment provider's confirmed message, with the money's status kept in the order's own payment vocabulary. → The rest of the order's life after 'paid': the goods and returns that move on their own status lines, the systems that hold copies of the order, and which of them is its home.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55a | synthesis | The shopper's return from her bank app and the 212 double refunds have one answer: the merchant only asks, so the order relies on the provider's confirmed message, every action that moves money has one writer and one key, and a daily comparison finds what slips through, none of which needs a new provider. | reasoning: The opening's shopper and the scene's Double Refund set against the chapter's three rules. |  |\n| p55 | synthesis (list) | Established: money moves in four stages with refunds and chargebacks flowing back, capture must happen inside a window of days and a refund can fail later; the outcome arrives by webhook at least once and in no guaranteed order, so the merchant persists event ids, fetches the object and runs a daily pending job. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what provider documentation establishes. |\n| p56 | synthesis (list) | Depends on context: capture on shipment suits cards with frequent cancellations but not instant methods, and one PSP with discipline suits merchants up to the Omnichannel stage while orchestration suits Group scale. |  | `contrast`: What is established. → What changes with the merchant's situation. |\n| p57 | recommendation (list) | The author's synthesis: treat payments as a problem of writers and keys before a problem of providers, and keep the order's payment vocabulary the merchant's own. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p58 | recommendation (list) | Seven questions let the reader find, in their own company, who may move money, with what key, where the authentication result is stored, the authorization windows, the fallback, the payout feeds and the regulatory calendar. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own company. |\n| p59 | transition | The provider's message has moved Eva's order to 'paid' in the order's own payment vocabulary; money is one of the order's three status lines, and the next chapter follows the goods and returns lines, the systems that hold copies of the order and which of them is its home. |  | `time`: The order marked paid by the payment provider's confirmed message, with the money's status kept in the order's own payment vocabulary. → The rest of the order's life after 'paid': the goods and returns that move on their own status lines, the systems that hold copies of the order, and which of them is its home. |\n\n## Non-goals\n\n- The cart, the checkout steps, the authentication detour inside checkout and creating the order before the PSP's answer; this chapter starts at the payment request. See [From Cart to Confirmation: Checkout Orchestration](cart-and-checkout.html).\n- VAT, the invoice, the credit note, revenue recognition and what the ERP posts. See [Tax, Invoices and the Books: From Order to Ledger](tax-invoicing-and-ledger.html).\n- Returns policy, RMAs, inspection, dispositions and refund timing from the returns side; this chapter only fixes the refund's writer and key. See [The Way Back: Returns, Exchanges, Refunds and Reverse Logistics](returns-and-exchanges.html).\n- Card-testing defenses in depth, account takeover, skimming and the shared-responsibility model; fraud scoring. See [Protecting the Shop: Card Data, Account Takeover, Bots and Skimmers](commerce-security.html), fraud-prevention (LISTED).\n- Interchange economics, payment orchestration, tokens and the payments sub-ledger in depth; the chapter links rather than re-teaches. See [Payments for Finance Architects: Eleven Reasons the Numbers Disagree](../finance-systems-architecture/payments-fundamentals.html), [Adyen: One Platform from Checkout to Settlement](../finance-systems-architecture/adyen.html), [Stripe: Every Movement Is a Balance Transaction](../finance-systems-architecture/stripe.html), [Payments-to-Ledger: Draining the Suspense Swamp](../finance-systems-architecture/payments-to-ledger.html), [Never Update, Only Append: Designing Custom Ledgers](../finance-systems-architecture/designing-financial-ledgers.html).\n- Terminal selection and store refunds; credit limits and payment terms; marketplace payouts. See [Stores Are Systems Too: Point of Sale and Omnichannel Fulfillment](stores-and-omnichannel.html), [Selling to Businesses: Accounts, Contract Prices, Quotes and Approvals](b2b-commerce.html), [Selling on Someone Else's Platform: Marketplaces and Channel Integration](marketplaces-and-channel-integration.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- The Double Refund's day-by-day mechanism (support refunding in the PSP console in response to 'where is my refund' contacts between carrier delivery and inspection) is appended to the ledger as an illustration; returns-and-exchanges and journey-return-and-exchange should reuse it rather than invent a different trigger.\n- Kestrel & Pine's PSP fees and payout schedule are assumptions modeled on Adyen's public documentation; if a later chapter needs exact fee lines, they should be added to the ledger once.\n- Whether iDEAL's transition to Wero changes refund or session semantics for merchants is not documented on the scheme's site as of November 2026; revisit before the 2027 edition.\n- PSD3/PSR adoption and application dates should be re-checked against the Official Journal before publication.\n- AC-6 (every term explained before use, every acronym expanded) was carried over from the old spec's success criteria as a minor known_before_new criterion; the author may keep or drop it.\n- In Practice has the shop platform request Eva's iDEAL payment at 21:13 and create the order at 21:14; the ledger fixes only 21:14 for the order. The chapter keeps both times as published; the author may confirm that the request-then-create order matches cart-and-checkout.\n- Flow rubric note not taken: merge the one-paragraph scale-stage section into the choices or the conclusion. Kept because every chapter of the book has the stage section; its table is the paragraph's evidence.\n- Flow rubric note not taken: cut the Double Refund sequence paragraph (p28) to a back-reference. It is already two sentences plus Figure 4; kept.\n- Flow rubric note not taken: 'cards with frequent cancellations' in the Depends-on-context list is not set up earlier; left as the author's wording.\n- Flow hanging any section heading.; Moving fraud and card data next to authentication: the choices table compares PCI scope and needs it close by.; Moving the four feeds before the choices.\n- **2026-11-12** — Reconstructed the spec from the published chapter, one paragraph per unit (check_draft.py units). Intent outcome, acceptance criteria AC-1 to AC-5, thesis and role are copied from the journal spec unchanged. Of the old spec.md's nine success criteria, the second (every term defined from the chapter alone, every acronym expanded) is kept as AC-6, a known_before_new criterion at minor severity, for the author to keep or drop; the word limit is kept as length.max_words (6,500; the published text had 5,513 by the checker's count); the others were inventories of callouts, tables, diagrams, examples, sources and sections and are dropped. The opener criterion named a WHY IT MATTERS callout that consistency ruling 11 has since dropped. Rejected: Carrying the inventory criteria over as custom criteria.; Setting the limit to the published length.\n- **2026-11-07** — Made 'one writer, one key' and the webhook-as-external-truth rule the spine, rather than a tour of PSP products, because the newcomer's decisions are about who may call the PSP and how the order learns the result; Adyen, Stripe and Mollie documentation were chosen as evidence because they publish precise, quotable semantics, not as recommendations.\n- **2026-11-07** — Told the Double Refund from the money side with a sequence diagram and left the returns-side fix (one refund path, refund on inspection) to chapter 18, to avoid two chapters teaching the same scene.\n- **2026-11-07** — Kept SCA, PCI DSS and fraud to what shapes the architecture (the detour, the liability flag, SAQ scope, the kill switch) and linked chapter 34 and RECONCILED for depth. Rejected: A full PCI requirements walkthrough, outside a newcomer's altitude.\n- **2026-11-07** — Added the 'four feeds' section (stores, wholesale, marketplaces, online) so the chapter explains why Waypoint's W5 makes finance a daily batch, rather than leaving payouts to chapter 14 alone.\n\n## Sources\n\n- **Internal**\n  - journal-spec.json (part-3; commerce-payments; order-management transition_in) — Intent, acceptance criteria AC-1 to AC-5, thesis and role, copied unchanged; the hand-off's relationship.\n  - PLAN.md contract 12 and the neighbouring contracts 11, 13, 14, 18, 34 — The chapter's original scope and its boundaries with its neighbours.\n  - _research/scenario-ledger.md and _research/consistency-issues.md — The PSP and terminal provider, the Double Refund and its illustrative mechanism, the Card-Testing Night, Eva's jacket and its refund variant, Bergzicht's reorder, Waypoint W5; ruling 11 on the opener format.\n  - _research/brief-checkout-payments-tax.md, _research/brief-security-privacy-regulation.md, _research/brief-shopify.md — PSP stages, methods by country, SCA and PSD3, idempotency and webhooks, PCI DSS, fraud basics; PCI scope and PSD2/PSD3 status; Shopify Payments as a wrapper over licensed PSPs.\n  - meet-kestrel-and-pine, cart-and-checkout, events-consistency-and-reconciliation, erp-and-back-office-integration, stores-and-omnichannel, journey-consumer-order — What the reader already knows and where the chapter links instead of re-teaching.\n- **External**\n  - Adyen, Stripe and Mollie developer documentation, n.d., accessed 2026-11 — Authorization and capture windows, refunds, disputes, webhooks, idempotency, payouts, PCI guides, card testing.\n  - Shopify payment terms and processor list (n.d., accessed 2026-11) and Form 10-K for fiscal 2025 (2026-02-11) — A platform's payments as a wrapper over PSPs.\n  - Dutch Payments Association (2025-02-18), Bancontact Payconiq Company (2025-02-12), EHI via Ecommerce News (2024), ECB SPACE 2024 (2024-12) — Method usage by country.\n  - Directive (EU) 2015/2366, Delegated Regulation (EU) 2018/389, Regulation (EU) 2015/751, Regulation (EU) 2024/886, European Parliame
