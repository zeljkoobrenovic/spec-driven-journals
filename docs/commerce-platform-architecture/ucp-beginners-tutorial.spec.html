<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-13 from the published page (posts/ucp-beginners-tutorial/index.md, 4,770 words, 81 prose and list units after the three opening callouts) and its former spec.md; one spec paragraph per unit. The opening callouts (IN THIS CHAPTER, KEY POINTS, failure patterns) are evidence of the introduction; code blocks belong to the paragraph that introduces them; tables and figures are evidence of the paragraph they follow. Three units were added for the part closing and the hand-off (p78, p83's take-away, p84), see decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** UCP's participants and vocabulary: Platform (the application consuming commerce capabilities) and Business (the merchant exposing them), the credential provider and the payment service provider; profiles, capabilities, extensions, payment handlers and transports, agreed by version before a purchase.\n- **Know:** One illustrative lab purchase of a €199 Ridgewalker jacket followed through discovery, item choice, checkout session, address and delivery, payment, completion and the first order update, against UCP's published 2026-08-25 documentation checked on 9 November 2026; separate from Eva's €235 order and from Kestrel & Pine's decision not to launch a shopper-facing agent in 2027.\n- **Know:** The six checkout states and that only `completed` with an order reference confirms an order; what to do when a completion response is lost.\n- **Believe:** A shopping protocol carries the merchant's promises; it does not make them, so the merchant's existing price, stock and order rules stay authoritative.\n- **Believe:** A first integration is proven by recovering one uncertain purchase, not by a successful demonstration.\n- **Be able to:** Read a UCP message exchange and say at each step what the application knows and what it may tell the shopper.\n- **Be able to:** Scope a first integration and the proofs it needs before review.\n\n**Audience:** Engineers, product managers and architects who understand an API but have not implemented agentic commerce; no earlier chapter is required, though readers of the book arrive from chapter 45 and Part XI.\n\n**Already knows:**\n\n- What an API is, roughly what HTTP, JSON and a request header are.\n- What buying something online is like from the shopper's side.\n- If they have read the book: Kestrel & Pine, Eva's €235 order, the failure-pattern names, idempotency and reconciliation, the PSP and webhook glosses, authorization and capture, and chapter 45's assistants and agents and W8 (agent readiness, not agents).\n\n**Does not yet know:**\n\n- UCP and its roles (Platform, Business), profile, service, capability, extension, transport, schema, REST, namespace names.\n- ACP, MCP, AP2 and mandates; credential, credential provider, payment instrument, payment handler, token, identity linking, OAuth 2.0, scopes.\n- Checkout session versus cart, variant, minor units, the six checkout states, continue_url, correlation record.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a lost completion response, the reader says how the application recovers the outcome without a second order or payment. *Probe:* An assistant sent the completion request and the connection dropped before the merchant's answer arrived. Using only this tutorial: what does the application know, what does it do next, and when may it retry? | `custom` | cold_reader | major |\n| AC-2 | The reader tells which checkout states permit which message to the shopper. *Probe:* Using only this tutorial: the merchant returns `ready_for_complete`. May the application tell the shopper 'Purchased'? Which status allows that, and what does `requires_escalation` ask of the application? | `custom` | cold_reader | major |\n| AC-3 | The reader scopes a first UCP integration and says what stays with the merchant. *Probe:* Using only this tutorial: a merchant wants to accept purchases from shopping assistants through UCP. What should its first integration include, what should wait, and which rules must remain the merchant's? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict what the page contains and the kind of evidence or material it uses. *Probe:* After reading only the introduction: what will this page give you, in what order, and from what kind of material? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** How does one purchase run through the Universal Commerce Protocol, step by step?\n\n> **Claim:** One purchase runs through UCP in seven steps (discover the merchant's profile, choose an exact item, create a checkout session, supply address and delivery, arrange payment, complete, follow the order), and at each step the application may report only the state the merchant returned: a ready checkout is not an order and a lost completion response is resolved by reading the existing checkout, not by buying again.\n\n**Disputed by:** The view that an agent purchase is one API call after a conversation: once the assistant has found the item, completing it is a single request whose success or failure the assistant can report at once, and a retry after a timeout is harmless.\n\n**So what:** A team learning UCP traces requests, responses, customer messages and identifiers on a local sample before it adds a conversational layer, and makes the lost-response recovery its first failure exercise; a merchant scopes its first integration to one product type, one market, one payment route and explicit approval.\n\n**How and why:** Each step returns identifiers and a status that the next step needs: the profile fixes the agreed version and capabilities, the session id carries the checkout through updates, and the status tells the application what work remains. Payment credentials, application authentication and buyer authorization are separate, so approval of the terms cannot be inferred from a payment token. Completion may succeed at the merchant while its response is lost; only a read of the same checkout, and a retry under the same idempotency key, avoids a second order or charge.\n\n**Supporting claims**\n\n- **S1** — UCP separates the roles in a purchase (Platform, Business, credential provider, payment service provider), and each participant's profile declares the capabilities and versions it supports, so a purchase uses only what both sides declared, with matching versions and dependencies.\n- **S2** — Each step returns an identifier or a term the next step needs: the agreed profile, the exact variant identifier, the checkout session identifier, and the delivery options and total the merchant calculates and the application only selects from.\n- **S3** — The checkout status tells the application what work remains: a ready checkout is not an order, only `completed` with an order reference lets it tell the shopper the order is placed, and afterwards the order record, not the conversation, answers the shopper's questions.\n- **S4** — Payment credentials, application authentication and buyer authorization are separate: a payment token is not a receipt, and approval of the terms cannot be inferred from it.\n- **S5** — A lost completion response leaves the outcome uncertain; the application reads the existing checkout and retries only the identical completion under the same idempotency key, never with a fresh checkout, and a team practises this first.\n- **S6** — A first integration puts UCP in front of the merchant's existing price, stock and order rules, starts with one product type, one market, one payment route and explicit approval, and is proven by recovering one uncertain purchase.\n\n## Role in the part\n\nCarries the whole appendix: works one protocol message by message so the part's claims about agreed capabilities, separate states and recovery rest on a traced purchase. Supports PA-1, PA-2, PA-3 of part `appendix`.\n\n## Flow\n\n**Pattern:** `chronological` (also `prerequisite_order` in purchase to vocabulary: the purchase, its participants and the vocabulary come before the first message that uses them; `problem_solution` in lost-response to comparison: the failure, the other failures, the exercise that practises the recovery, the scope it proves, then the protocols beside UCP)\n\nThe part has one page, which follows one purchase in the order a shopping application meets it: participants and vocabulary, then discovery, item choice, checkout session, address and delivery, the checkout states, payment, completion and the order update, then the lost response, an exercise and what to implement first. Each step uses an identifier or a state the previous step returned, so a step read early would refer to a session, a status or a key the reader has not seen; the recovery section comes after completion because it re-reads the checkout that completion created. Inside the walkthrough, 'Read the Checkout State' stands between Step 4 and Step 5 because Step 4 returns the first ready_for_complete and Step 5 must not treat it as a purchase; 'Three Permissions' follows payment and precedes completion, because the token answers who pays and completion needs the shopper's approval. The comparison with ACP, MCP and AP2 comes after What a Merchant Should Implement First as its own section, because no step needs it, Step 5 explains AP2 mandates where it uses them, and its advice on supporting two protocols assumes the first integration. The technical reference opens Step 1, where the first message is read, and the handoff is explained before the table of states that names it. The conclusion returns to the opening shopper, then gives the take-aways, the review questions and the hand-off to the Reference part. 'Other Things That Go Wrong' follows the lost response as the same rule applied to other outcomes. The exercise follows because it practises that recovery, and what to implement first comes last because its proofs are the exercise's results;\n\n## Introduction\n\n**Hook** (`intriguing_example`): A shopper asks an assistant to find a waterproof jacket for less than €200 and to ask before buying; finding it is only the beginning, because the assistant must still pick the size, get a delivered price, present the terms, arrange payment and learn whether an order exists.\n\n**Bridge:** Chapter 45's account of agentic commerce, where Kestrel & Pine prepares its data and order APIs rather than launching a shopping agent, and the cases of Part XI; the reader needs only a basic understanding of an API. → The messages one protocol, UCP, exchanges for a single purchase, and what the application may tell the shopper after each of them.\n\n**Thesis statement** (KEY POINTS bullets 1 to 3 and paragraph p03): Trace one purchase through UCP's seven steps, including a lost response: at each step the application may tell the shopper only what the merchant returned, so a ready checkout is not an order, and a lost completion response is resolved by reading the existing checkout, not by buying again; the merchant keeps its products, prices and orders.\n\n**Roadmap** (paragraph p04):\n\n- The purchase we will follow, and who takes part in it. *Kept in:* purchase, participants.\n- The vocabulary before the messages. *Kept in:* vocabulary.\n- Seven steps from discovering the merchant's profile to the first order update, with the checkout states between address and payment and the three permissions between payment and completion. *Kept in:* step-1, step-2, step-3, step-4, states, step-5, permissions, step-6, step-7.\n- A completion response lost and recovered, and the other things that go wrong. *Kept in:* lost-response, other-failures.\n- A learning exercise on the official samples. *Kept in:* try-it.\n- What a merchant should implement first, and how UCP compares with other protocols. *Kept in:* implement-first, comparison.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A shopper asks an assistant to find a waterproof jacket for less than €200; finding one is only the beginning, because to buy it the assistant must identify the size, obtain a current delivered price, present the terms, arrange payment and learn whether an order exists, and each merchant may expose these steps differently. | scenario: The waterproof jacket under €200 and the five things the assistant must still do. |  |\n| p02 | definition | Universal Commerce Protocol (UCP) defines shared messages and rules for these exchanges: a shopping application learns what a merchant supports and uses it through a common interface, while the merchant keeps responsibility for its products, prices and orders. |  | `elaboration`: The steps a purchase needs and that merchants expose them differently. → UCP as the shared messages for those steps, with the merchant still in charge. |\n| p03 | claim | The way to learn UCP is to trace one purchase through its seven steps and then lose its completion response: at each step the application may tell the shopper only what the merchant returned, so a ready checkout is not an order and a lost completion response is resolved by reading the existing checkout, not by buying again; a successful demonstration shows only that two systems can exchange messages. |  | `cause_effect`: What UCP is and that the merchant keeps its records. → How to learn it: one purchase traced, including the uncertain outcome. |\n| p04 | transition | This appendix follows one illustrative purchase from discovery to the first order update for a reader who knows what an API is: the purchase, its participants and the vocabulary, seven steps with stops for the checkout states and three permissions, a lost completion response and other failures, an exercise, what a merchant should implement first and how UCP compares with other protocols; the business decision stays with chapter 45. |  | `sequence`: The method: one purchase traced. → The route the page takes and where the broader business choice is made. |\n\n## Sections\n\n### The Purchase We Will Follow\n\n**Controlling idea** (`context`, id `purchase`): The tutorial follows one hypothetical lab purchase of a €199 Ridgewalker jacket, separate, for readers of the book, from Eva's €235 order and from Kestrel & Pine's 2027 decision, and the shopper asks to approve before buying.\n\n**Advances the thesis** (S2): Fixes the purchase, the shopper's instruction and the dated reference every later step uses.\n\n**Transition in:** `example`: The roadmap's one purchase. → The purchase itself: the jacket, the lab conditions and the shopper's instruction.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | example | In a separate learning environment Kestrel & Pine, the book's fictional outdoor brand, offers its Ridgewalker shell jacket, women's M in moss, at €199 including tax, which qualifies for the brand's €75 free-shipping threshold. | scenario: Ridgewalker shell jacket, women's M, moss, €199 including tax; €75 free-shipping threshold. |  |\n| p06 | context | Availability, a supported delivery address and Thursday delivery are illustrative lab conditions, not evidence that a real service supports the purchase; for readers of the book, the lab purchase is separate from Eva's €235 order, the book's running example, and from Kestrel & Pine's decision not to launch a shopper-facing agent in 2027. |  | `elaboration`: The jacket and its price. → The assumptions of the lab and what the lab purchase is not. |\n| p07 | example | The test shopper says 'Find this jacket, show me the delivered total, and ask before buying', and that last instruction means permission to search has not authorized an order. | scenario: The shopper's instruction: find, show the delivered total, ask before buying. | `example`: The lab conditions. → The shopper's own instruction. |\n\n### Who Talks to Whom?\n\n**Controlling idea** (`definition`, id `participants`): Several participants perform the purchase, UCP calls the consuming application the Platform and the merchant the Business, and the UCP interface belongs in front of the merchant's existing commerce operations.\n\n**Advances the thesis** (S1, S6): Names the roles whose agreement and whose separate responsibilities the steps depend on.\n\n**Transition in:** `sequence`: The purchase and the shopper. → The participants who carry it out.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | In UCP the Platform is the application consuming commerce capabilities and the Business is the participant exposing them, roles that do not depend on whether either runs an AI model; with the shopper, a credential provider and a payment service provider they perform the purchase. | table: Five participants (shopper, Platform, Business, credential provider, payment service provider), each with its job and the question to ask about it. |  |\n| p10 | definition | A credential lets a system prove identity or exercise an authority and a payment service provider processes the payment attempt; one company can fill several roles, but each role must be explainable separately. | figure: Figure 1: the application exchanges UCP requests and status with the merchant, receives a payment token from a wallet, and the merchant calls its commerce systems and payment provider. | `elaboration`: The five participants. → Glosses for credential and PSP, and the rule that roles stay distinct. |\n| p11 | recommendation | For Kestrel & Pine the UCP interface belongs in front of existing commerce operations, asking the same price service and availability rules as the website, because an interface that calculates its own discount or invents a delivery date creates another source of contradictory promises. |  | `cause_effect`: The merchant's role as the Business. → Where the interface sits in the merchant's systems, and why. |\n\n### The Vocabulary, Before the Messages\n\n**Controlling idea** (`definition`, id `vocabulary`): Profiles, services, capabilities, extensions, transports and schemas describe what each participant supports before a purchase is attempted, under precise names, carried in this tutorial over REST.\n\n**Advances the thesis** (S1): Gives the terms with which participants declare and agree what a purchase may use.\n\n**Transition in:** `elaboration`: The participants. → The words they use to describe what they support.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | definition | Because merchants differ in what they support, UCP describes those differences before a purchase with six terms: profile, service, capability, extension, transport and schema. | table: Six terms with a plain meaning and an example in the jacket purchase (profile at /.well-known/ucp, shopping service, checkout capability, shipping extension, REST over HTTP, checkout schema). |  |\n| p14 | explanation | Profiles declare services, capabilities and extensions under precise reversed-domain names such as dev.ucp.shopping.checkout, which identify a namespace and are not URLs to call. |  | `elaboration`: The six terms. → How profiles write the names of services and capabilities. |\n| p13 | definition | REST, the API style using HTTP methods such as GET and POST, carries the tutorial's examples so the reader can follow the exchange without learning an agent framework. |  | `elaboration`: Transport in the table and the names a profile declares. → The transport the tutorial uses: REST. |\n\n### Step 1: Discover What the Merchant Supports\n\n**Controlling idea** (`process`, id `step-1`): Against UCP's dated 2026-08-25 documentation and with illustrative excerpts, the application first reads the merchant's profile, and a feature is usable only when both profiles support a compatible version and its parent capability.\n\n**Advances the thesis** (S1): Shows capability agreement as the first message of the purchase.\n\n**Transition in:** `sequence`: The vocabulary of profiles and capabilities. → First the source behind the messages, then the first message: reading the merchant's profile.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | context | The walkthrough uses UCP's published 2026-08-25 documentation, checked on 9 November 2026 against an inspected source revision, and its message fragments are illustrative: invented identifiers, reserved .example addresses, omitted fields and authentication, not requests for a live payment service. | source: UCP 2026-08-25 documentation checked 9 November 2026; inspected source revision 7dd79ea. |  |\n| p19 | process | Before creating anything the application reads the merchant's profile with GET /.well-known/ucp, the API's entrance sign. | example: GET /.well-known/ucp on kestrel-pine.example. | `sequence`: The dated reference and the caveat on excerpts. → The first message: reading the merchant's profile. |\n| p20 | evidence | The profile excerpt shows only the REST service and the checkout capability; the physical-goods flow also needs fulfillment support, and payment configuration and keys are omitted. | example: Profile excerpt: version 2026-08-25, the dev.ucp.shopping REST service and the dev.ucp.shopping.checkout capability. | `elaboration`: The discovery request. → The response, labelled as an excerpt. |\n| p21 | explanation | The profile reads from the outside in: the version identifies the contract, the service entry says how to reach the API, and the capability entry names the behavior and its message definition; the checkout path is appended to the service endpoint. |  | `elaboration`: The profile excerpt. → How to read it. |\n| p22 | explanation | The application identifies its own profile with each request so the merchant can determine the shared capabilities, and under UCP's negotiation rules names alone are insufficient: versions and extension dependencies must match, and a profile grants no permission to purchase. | figure: Figure 2: merchant and application capabilities; their agreement includes checkout and shipping when versions match, with shipping depending on checkout. | `elaboration`: The merchant's profile. → The application's profile and the negotiation between them. |\n| p23 | example | In the lab both profiles support checkout and its fulfillment extension; an application without shipping support must not invent a shipping field but use a supported alternative such as the merchant's own checkout. | scenario: Both lab profiles support checkout and fulfillment. | `example`: The negotiation rules. → The lab's agreement and what to do without it. |\n\n### Step 2: Choose an Exact Item\n\n**Controlling idea** (`process`, id `step-2`): Checkout needs the merchant's identifier for the exact variant, recorded as returned, not the parent product.\n\n**Advances the thesis** (S2): Supplies the first identifier the next step needs.\n\n**Transition in:** `sequence`: The agreed capabilities. → Choosing the exact item to buy.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | definition | A purchase needs the merchant's identifier for the exact variant, the product with a particular combination of options, because a parent product identifier does not say which jacket to ship. |  |  |\n| p25 | explanation | UCP's catalog capabilities separate searching for candidates from looking up identified products, and a platform may arrive with an item from another agreed discovery channel; checkout does not require every catalog capability. |  | `elaboration`: The need for an exact variant. → How UCP's catalog helps find it. |\n| p26 | example | In the lab lookup returns ridgewalker-w-m-moss, which the application records exactly rather than constructing from a title, and the checkout response, not the listing price, sets the terms. | scenario: Variant identifier ridgewalker-w-m-moss. | `example`: Catalog lookup. → The lab's returned identifier. |\n| p27 | definition | A cart collects intended items while the shopper decides and a checkout session gathers what is needed to place an order; the tutorial creates checkout directly with one item. | figure: Figure 3: sizes S, M and L; the medium leads to ridgewalker-w-m-moss, which goes into checkout; the parent product is crossed out. | `contrast`: The chosen identifier. → Cart versus checkout session, and why the tutorial skips the cart. |\n\n### Step 3: Create a Checkout Session\n\n**Controlling idea** (`process`, id `step-3`): Creating a checkout session asks the merchant to work out a purchase without placing it, and the response's status and messages, not the HTTP code, tell the application what remains.\n\n**Advances the thesis** (S2, S3): Introduces the session identifier and the business status every later step reads.\n\n**Transition in:** `sequence`: The exact variant. → The request that starts the checkout.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | explanation | Creating a session has not placed the order, which gives the merchant somewhere to collect the address, calculate delivery and report missing information before money is committed. |  |  |\n| p29 | evidence | The checkout REST binding defines the endpoint, and the illustrative POST /ucp/checkout-sessions request carries the variant and omits authentication headers. | example: POST /ucp/checkout-sessions with UCP-Agent, Idempotency-Key and Request-Id headers and one line item. | `elaboration`: What a session is for. → The request that creates it. |\n| p30 | definition | UCP-Agent points to the application's profile and is not a password, Request-Id traces the attempt, and Idempotency-Key identifies the logical operation so a retry is recognised; idempotency means repeating the operation creates no second purchase or session. |  | `elaboration`: The request. → Its three headers and the term idempotency. |\n| p31 | evidence | The merchant could return a response excerpt with the checkout id chk_lab_001, status incomplete and a recoverable message that the email is missing. | example: Response excerpt: chk_lab_001, incomplete, EUR, a missing $.buyer.email message. | `sequence`: The request. → The merchant's response. |\n| p33 | context | Full responses also carry the ucp metadata, items, totals and other required fields, and the checkout schema, not the excerpt, is the implementation contract. |  | `contrast`: The fields the response excerpt shows. → The full response and the schema the excerpt leaves out. |\n| p32 | analysis | The application now has a checkout identifier and a task, because status incomplete means the merchant needs more information: the merchant has communicated a business state, and an API request can succeed while the purchase stays incomplete. | figure: Figure 4: the app asks for a checkout; the merchant returns chk_lab_001, incomplete, email missing; no order exists yet. | `cause_effect`: The response and its full contract. → What the application now knows: a business status, not just HTTP success. |\n\n### Step 4: Supply the Address and Choose Delivery\n\n**Controlling idea** (`process`, id `step-4`): The application supplies the address and selects from the delivery options the merchant creates, sends the whole writable state on update, and presents the merchant's recalculated total for approval.\n\n**Advances the thesis** (S2): Shows the merchant, not the application, setting delivery terms and the total.\n\n**Transition in:** `sequence`: An incomplete checkout. → Supplying what it lacks: the address and the delivery choice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | process | A jacket cannot be quoted for delivery without an address, so the application collects the details, submits them and lets the merchant return the choices, never inferring Thursday delivery from a product page. |  |  |\n| p35 | explanation | The fulfillment extension describes methods, destinations, groups and options; the merchant creates the groups and options and the application selects from the returned identifiers. | table: Method, destination, group, option and selection, each with its meaning in the jacket example.; figure: Figure 5: the app sends an address, the merchant returns options, the app selects standard free Thursday delivery, the merchant recalculates to €199. | `elaboration`: Supplying the address. → The vocabulary of the returned delivery choices. |\n| p36 | process | Update Checkout, PUT /checkout-sessions/{id}, is a replacement operation in this release, so the request is built from the latest state and keeps previously supplied writable information. |  | `sequence`: The delivery choices. → How the application sends its choice back. |\n| p37 | example | In the lab the application submits the buyer details, keeps the jacket line and selects the returned destination and option, and the merchant returns an assumed €199 total with free shipping and Thursday delivery and nothing preventing completion. | scenario: €199 total, free shipping, Thursday delivery. | `example`: The replacement update. → The lab's update and result. |\n| p38 | evidence | UCP expresses money in minor units, so 19900 means €199.00, as a quote fragment with status ready_for_complete shows. | example: Quote fragment: chk_lab_001, ready_for_complete, EUR, total 19900. | `elaboration`: The €199 total. → How the total is written. |\n| p39 | explanation | The fragment omits tax and fulfillment fields, a tax-inclusive price must not have its tax added again, and the app presents the merchant's total and delivery terms and asks the shopper to approve them. |  | `elaboration`: The quote fragment. → What it omits and what the app does with it. |\n\n### Read the Checkout State Before Taking the Next Step\n\n**Controlling idea** (`explanation`, id `states`): The checkout status tells the application what work remains: of six states only completed with an order reference confirms an order, and a handoff to the merchant is a normal outcome.\n\n**Advances the thesis** (S3): States the rule the remaining steps apply: report only the state the merchant returned.\n\n**Transition in:** `cause_effect`: The status ready_for_complete just returned. → What each checkout status means before the next step acts on one.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | claim | The checkout status tells the application what kind of work remains, not whether the shopper is happy, a parcel has shipped or money has settled. |  |  |\n| p43 | recommendation | A handoff is a normal outcome: the merchant can supply a continue_url for the buyer to finish required work, and a first integration should keep that route rather than force every exception through chat. |  | `elaboration`: Work that remains. → Work that belongs to the buyer: the handoff and its continue_url. |\n| p41 | definition | UCP's checkout lifecycle defines six states, from incomplete through requires_escalation, ready_for_complete and complete_in_progress to completed and canceled. | table: The six statuses and what the application should understand from each.; figure: Figure 6: missing details, ready, processing, order placed; a buyer handoff; canceled or expired sessions stop. | `elaboration`: What a status says, including a handoff. → The six statuses. |\n| p42 | analysis | Displaying 'Purchased' after ready_for_complete is the mistake to avoid, because that state is a form ready for its final button: the shopper must still authorize and the merchant still accept. |  | `example`: The six states. → The most common misreading of one of them. |\n\n### Step 5: Arrange Payment Without Giving the Model Card Details\n\n**Controlling idea** (`process`, id `step-5`): Payment uses a handler agreed by the participants, and the application carries a credential it cannot treat as a receipt, keeping card details out of the model and handling any extra buyer interaction.\n\n**Advances the thesis** (S4): Separates the payment credential from approval and from the order.\n\n**Transition in:** `sequence`: Terms ready for approval and the rule that only the merchant's states count. → Arranging payment for those terms.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p44 | definition | Before a payment is attempted the participants agree how credentials are obtained and passed: a payment instrument describes what pays and a payment handler defines the procedure for working with it. |  |  |\n| p45 | example | In the lab a supported wallet returns a token after the shopper confirms, a protected reference whose restrictions and lifetime come from the handler and provider, not from the word 'token'. | scenario: A supported wallet returning a token. | `example`: Instrument and handler. → The lab's wallet and its token. |\n| p46 | claim | The application passes the credential as the handler specifies and the merchant processes it, so the token is not a receipt: it proves neither an accepted order nor a successful payment. | figure: Figure 7: the wallet supplies a token to the app, which sends it to the merchant; the merchant processes payment with its provider. | `sequence`: The token. → What happens to it and what it does not prove. |\n| p47 | recommendation | Raw card details stay out of prompts, model context and ordinary logs, and a payment form or wallet component handles the sensitive interaction through the provider's integration. |  | `cause_effect`: The token, not the card, travels between the systems. → So raw card details can stay out of prompts, model context and logs. |\n| p48 | explanation | Payment can require additional buyer interaction such as a cardholder challenge, which the application handles or hands off; an earlier chat message does not prove every payment requirement is met. |  | `additional_support`: Keeping card details out. → Extra buyer interaction during payment. |\n\n### Three Permissions That Are Easy to Confuse\n\n**Controlling idea** (`comparison`, id `permissions`): A payment token answers who pays, but authenticating the application, accessing the buyer's account and authorizing the purchase are three further, separate permissions, and the first exercise uses a person approving the final purchase.\n\n**Advances the thesis** (S4): Separates application authentication, account access and purchase authorization from the payment credential.\n\n**Transition in:** `contrast`: The payment credential, which proves neither an order nor approval. → The three other permissions a purchase involves, before the shopper approves and completes.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p49 | comparison | Trusting the application, accessing the buyer's account and authorizing a purchase are different decisions, and conflating them gives an assistant more authority than the customer intended. | table: Three questions (who is calling, may this app use my account, may this purchase proceed), what answers each and what it does not establish. |  |\n| p50 | definition | Identity linking lets a shopper authorize account access through OAuth 2.0 with limited scopes, and a guest checkout need not link an account. |  | `elaboration`: Account access in the table. → How UCP grants it. |\n| p51 | context | An AP2 mandate can provide a signed record of authority for a more autonomous flow, but the first exercise uses a person reviewing the final purchase. |  | `contrast`: Account authorization. → Signed purchase authority, and why the lab does without it. |\n\n### Step 6: Complete the Checkout and Keep the Order Reference\n\n**Controlling idea** (`process`, id `step-6`): Completion places the agreed purchase under a new idempotency key, and only a completed response with an order reference lets the application tell the shopper the order is placed.\n\n**Advances the thesis** (S3): Shows the one state that confirms an order.\n\n**Transition in:** `sequence`: The shopper's approval as a separate permission and the payment credential. → The completion request.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | process | With the shopper's approval of one moss jacket in M for €199 and the credential, the application requests completion with POST /checkout-sessions/chk_lab_001/complete and a new idempotency key for this operation. | example: POST /checkout-sessions/chk_lab_001/complete with idempotency key d717c14e-…. |  |\n| p53 | explanation | The completion body carries the payment data the selected handler requires, so the application invents no generic token format. |  | `elaboration`: The completion request. → Its body. |\n| p54 | explanation | Completion places the agreed purchase and is not the place to change price, address or quantity; a change of size means updating and rechecking the checkout first. |  | `contrast`: What completion carries. → What it must not change. |\n| p55 | evidence | After successful synchronous completion the response excerpt shows status completed and an order with id ord_lab_001 and a permalink. | example: Response excerpt: chk_lab_001, completed, order ord_lab_001 with permalink_url. | `sequence`: The completion request. → The merchant's completed response. |\n| p56 | analysis | Only now is 'Your order has been placed' supported, and the application keeps both identifiers: the checkout for the negotiation, the order for the accepted purchase. | figure: Figure 8: the app sends complete with a key; the merchant returns completed with chk_lab_001 and ord_lab_001, both kept. | `cause_effect`: The completed response. → What the application may now say and keep. |\n| p57 | explanation | A complete_in_progress response means the purchase is still processing and must not be hurried by repeated completion, and authorization, capture and fulfillment are later activities an order confirmation does not collapse. |  | `contrast`: The completed response. → The in-progress response and the activities still to come. |\n\n### Step 7: Follow the Order After Checkout\n\n**Controlling idea** (`process`, id `step-7`): After checkout the answers come from the merchant's order records, by webhook or authorized retrieval, linked through a small correlation record and protected by access checks.\n\n**Advances the thesis** (S3): Shows the order, not the conversation, as the source of later answers.\n\n**Transition in:** `sequence`: A confirmed order and its reference. → Following that order after checkout.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p58 | claim | 'When will it arrive?' is answered by the order and its fulfillment records, not by the assistant's last sentence. |  |  |\n| p59 | explanation | UCP's order capability represents purchased lines, fulfillment expectations, actual fulfillment events and adjustments, so a Thursday promise and a 'delivered' event are different kinds of information. |  | `elaboration`: The order as the source of answers. → What the order capability holds. |\n| p60 | process | Order updates arrive by webhook, an HTTP notification from merchant to platform, or by authorized retrieval with GET /orders/{id}. |  | `sequence`: What the order holds. → How updates reach the platform. |\n| p61 | example | The lab keeps a small correlation record of the checkout, the completion key, the order and the provider's payment reference, an implementation recommendation rather than a UCP message format, so support can connect 'the assistant says I bought it' to a concrete order and payment. | table: Checkout chk_lab_001, completion key d717c14e-…, order ord_lab_001, provider payment reference, each with why it is kept.; figure: Figure 9: webhook and retrieval; a correlation record links checkout, completion key, order and payment reference. | `example`: Updates by webhook or retrieval. → The record that ties them to the lab purchase. |\n| p63 | explanation | An order API needs access checks: knowing ord_lab_001 must not reveal the address, and a refund adjustment grants no permission to initiate refunds. |  | `additional_support`: The correlation record and retrieval of the order. → The access checks retrieval needs. |\n\n### When the Completion Response Disappears\n\n**Controlling idea** (`process`, id `lost-response`): When the completion response is lost the outcome is uncertain, so the application reads the existing checkout and retries only the identical completion with the same idempotency key, never with a fresh checkout.\n\n**Advances the thesis** (S5): Shows the recovery that proves a first integration.\n\n**Transition in:** `problem_solution`: The successful completion and the correlation record. → The completion whose response never arrives.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p64 | context | If the merchant creates the order but the connection drops before the response arrives, the application can conclude neither 'failed' nor 'purchased': the outcome is uncertain. |  |  |\n| p65 | process | Reconciliation, comparing records to establish what happened, starts by reading the existing checkout: completed means recover the order reference, in progress means wait and check with a bounded delay, expiry stops automatic attempts for investigation, and a fresh checkout is never created to escape uncertainty. | figure: Figure 10: the merchant creates one order, the response is lost, the app retrieves the checkout and receives the same order. | `problem_solution`: An uncertain outcome. → Reconciliation by reading the checkout. |\n| p66 | evidence | UCP's completion contract directs the caller to retrieve state first and only then retry the identical completion with the same idempotency key; a genuinely new completion uses a new key. | source: UCP completion contract. | `additional_support`: The reconciliation steps. → The specification's own rule. |\n| p67 | explanation | UCP's signature and replay rules separate the logical operation's identity from each attempt's authentication material, so the implementation generates a random, unique operation key and persists its result. |  | `elaboration`: The same-key retry. → The operation key versus per-attempt authentication. |\n| p68 | recommendation | Disconnecting after the merchant accepts completion and then recovering the order should be a team's first failure exercise, because it forces the interface, storage, payment integration and customer message to agree about the same event. |  | `cause_effect`: The recovery rules. → Making recovery the first exercise, with the other failure situations. |\n\n### Other Things That Go Wrong\n\n**Controlling idea** (`recommendation`, id `other-failures`): Besides a lost response, a vanished item, a changed total, a required buyer step and a missed update each need a merchant-backed action and an honest customer message, which depend on the negotiated capabilities.\n\n**Advances the thesis** (S3, S5): Extends 'report only what the merchant returned' to the other uncertain or changed outcomes.\n\n**Transition in:** `similarity`: Recovery from a lost completion response. → The other situations in which the application must not invent an outcome.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p68a | recommendation | A lost response is one of five situations in which the application must not invent an outcome, each with what to do and what the customer needs to hear. | table: Five situations (stock disappears, total changes, buyer interaction, unknown outcome, missed update), what to do and what the customer hears. |  |\n| p69 | context | These responses are design recommendations for the application; the exact errors and recovery actions depend on the negotiated capabilities, merchant and payment handler. |  | `elaboration`: The table of situations. → What kind of advice it is. |\n\n### Try It: A Small Learning Exercise\n\n**Controlling idea** (`recommendation`, id `try-it`): A reader learns the message flow on the official samples with an ordinary API client and test credentials, through six exercises that end in a deliberately lost response and a trace for review.\n\n**Advances the thesis** (S5): Lets the reader perform the purchase and the recovery.\n\n**Transition in:** `cause_effect`: The recovery and the other failure situations. → A hands-on exercise that practises them.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p70 | recommendation | The recovery and the other situations are learnt best on a test system without a language model, with an ordinary API client that shows which state changed after each request. |  |  |\n| p71 | context | The official UCP samples repository provides REST server and client examples, whose pinned dependencies and advertised version should be checked before comparison with this appendix. | source: UCP samples repository and its Python server instructions. | `elaboration`: Learning with an API client. → Where to get a server and client. |\n| p72 | process (list) | Six exercises in order: read both profiles, create a session with missing information, supply the fields and choose delivery, approve and complete, lose the response deliberately, and exercise a boundary. |  | `sequence`: The samples. → The exercises to run on them. |\n| p73 | recommendation | The output is a short trace of request, response, customer message and recorded identifiers, more useful in a first design review than a polished chat demo. |  | `cause_effect`: The six exercises. → What they produce. |\n\n### What a Merchant Should Implement First\n\n**Controlling idea** (`recommendation`, id `implement-first`): A first integration adapts dependable merchant APIs, starts narrow with explicit approval and the recovery path, and proves six responsibilities while the merchant's own rules stay authoritative.\n\n**Advances the thesis** (S6): Turns the traced purchase into a scope and its proofs.\n\n**Transition in:** `cause_effect`: The trace from the exercise. → What a merchant builds first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p74 | claim | The trace shows what a first integration must prove; a merchant with dependable checkout and order APIs can begin by adapting them, but stale stock given in UCP format is still stale. |  |  |\n| p75 | recommendation | A first integration takes one product type, one market, one payment route and explicit shopper approval, establishes the recovery path before loyalty, split shipments or unattended purchases, and proves six responsibilities, each with a first proof. | table: Profile and contract, product and availability, checkout, payment, recovery, operations, each with a first proof. | `elaboration`: Starting from existing APIs. → The narrow first scope and its proofs. |\n| p76 | comparison | A hosted commerce vendor may provide much of this, but the merchant still verifies its behavior, while a custom implementation gives control and takes on version changes, credential handling and recovery. |  | `contrast`: What to build. → Whether to build it or rely on a vendor. |\n| p77 | explanation | Learning UCP does not require adopting every capability, but a purchase must be honest about the capabilities it depends on, as a download and a jacket differ in fulfillment. |  | `contrast`: Relying on a vendor or building the interface. → Which capabilities a given purchase actually needs. |\n\n### How UCP Differs from ACP, MCP and AP2\n\n**Controlling idea** (`comparison`, id `comparison`): UCP overlaps with ACP, can be carried over MCP and may use AP2 mandates as an option, so a merchant that supports more than one protocol maps them onto one checkout and order logic.\n\n**Advances the thesis** (S1, S6): Places capability agreement among the neighbouring protocols and keeps one business truth when there are two.\n\n**Transition in:** `additional_support`: A first integration of UCP. → The other protocols a merchant may be asked to support.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | comparison | A merchant may be asked to support more than one protocol, so it needs to know how UCP differs from ACP, MCP and AP2, which appear together because a purchase needs both commerce rules and a way to carry out authorized actions. | table: ACP (commerce interface by OpenAI and Stripe, overlaps with UCP), MCP (tools for AI applications; UCP can be exposed through it), AP2 (signed mandates; UCP can use its extension). |  |\n| p16 | refutation | ACP's April 2026 specification covers cart, order and product-feed work as well as checkout and payment, so teaching ACP as 'payments' and UCP as 'everything else' would mislead. | source: ACP's April 2026 specification. | `elaboration`: The comparison table. → ACP's actual scope. |\n| p17 | explanation | UCP makes discoverable capabilities and agreement central, carries its operations as MCP tools through its MCP binding, and treats AP2 as an optional authorization mechanism that is neither the payment processor nor required for every flow. |  | `contrast`: ACP's scope. → What is distinctive to UCP and how it uses MCP and AP2. |\n| p18 | recommendation | A merchant that needs both ACP and UCP should map both interfaces onto shared checkout and order logic, because two adapters are manageable and two competing definitions of what a customer owes are not. |  | `cause_effect`: The overlap between ACP and UCP. → What a merchant supporting both should do. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The profiles, the checkout states and the recovery path answer one question together: what does the application actually know at each step? Capabilities agreed in advance say what may be asked, the checkout status says what work remains, and reading the existing checkout after a lost response says whether the order exists.\n\n**So what:** A first integration is judged by whether it can explain and recover one uncertain purchase while the merchant's existing price, stock and order rules stay authoritative; a polished demonstration that hides the trace proves less.\n\n**Callback:** The opening's shopper who asked the assistant to find the jacket, show the delivered total and ask before buying. p78 returns to that instruction: the reader can now say which message carried each part of it, that permission to search was not authority to place an order, and that a request was not a confirmed purchase.\n\n**Takeaway** (`course_of_action`): Run the six-exercise trace on a local sample with test credentials, including a deliberately lost completion response, and bring the trace and the first-review questions to the design review.\n\n**Hand-off** to [Domain Coverage: From Three Model Families to the Book's Chapters](domain-coverage.html): `conclusion_summary`: The cards, terms and sources introduced chapter by chapter. → The same material gathered for lookup.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p78 | synthesis | The opening shopper's 'ask before buying' is now readable message by message: capabilities agreed in advance say what may be asked, the checkout status says what work remains, and reading the existing checkout after a lost response says whether the order exists, so permission to search was never authority to buy and a request was never a confirmed purchase. | reasoning: The shopper's instruction from p07; profiles (step 1), states (p40-p43), completion (step 6), recovery (p64-p66). |  |\n| p79 | synthesis (list) | Established: UCP defines profiles, capabilities and message contracts agreed by version; checkout state and order state differ; payment credentials, application authentication and buyer authorization serve different purposes. |  | `conclusion_summary`: The synthesis. → The points that are established. |\n| p80 | synthesis (list) | Depends on context: REST as the first learning path, adapting existing APIs or relying on the platform vendor, and account linking, AP2 mandates and further extensions where the flow needs them. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p81 | recommendation (list) | The author's synthesis: judge the first integration by whether it can explain and recover one uncertain purchase, and keep the merchant's existing price, stock and order rules authoritative. |  | `contrast`: Established and context-dependent points. → The author's own judgement, labelled as such. |\n| p82 | recommendation (list) | Eight questions for a first review test the roles, the agreed version and capabilities, the source of the price, the approval, the payment handler, the visible states, the lost response and support's access to the order. |  | `cause_effect`: The take-aways. → Questions that apply them, under the heading Questions for Your First Review. |\n| p83 | recommendation | Before the design review, run the six exercises on a local sample with test credentials, including a deliberately lost completion response, and bring the trace and these questions; the wider decision about shopping agents stays with chapter 45, and the mechanics that make any integration dependable with chapters 25 and 26. |  | `cause_effect`: The review questions. → What to do before the review, and where the related chapters are. |\n| p84 | transition | This appendix ends the book's chapters; the cards, terms and sources they introduced one at a time are gathered for lookup in the Reference part, starting with the coverage map that sends a capability to the chapter that covers it. |  | `conclusion_summary`: The cards, terms and sources introduced chapter by chapter. → The same material gathered for lookup. |\n\n## Non-goals\n\n- A production-ready payment server, a live purchase, or a claim that an example merchant or consumer program supports UCP.\n- A forecast of protocol adoption or a survey of vendor marketing. See [Assistants and Agents: AI in Commerce and What Is Real in 2026](ai-and-agentic-commerce.html).\n- Changing Kestrel & Pine's established 2027 decision to prepare its data and APIs without launching a shopping agent. See [Assistants and Agents: AI in Commerce and What Is Real in 2026](ai-and-agentic-commerce.html).\n- Idempotency, events and reconciliation in general; API contracts and versioning in general. See [Built to Disagree and Recover: Events, Eventual Consistency and Reconciliation](events-consistency-and-reconciliation.html), [Promises Between Systems: API Contracts, Webhooks and Versioning](api-contracts-and-versioning.html).\n- Authorization, capture and settlement as payment stages. See [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Before print: protocol and sample revisions must be checked again before a later edition; the one fact needed is the UCP release current at that edition.\n\n## Decision log\n\n- **2026-11-09** — Use the published 2026-08-25 UCP documentation and record the inspected source revision. Keep excerpts small and explicitly incomplete; a runnable production-looking mock would hide the authentication and payment integration work.\n- **2026-11-09** — Use a hypothetical lab purchase of one €199 jacket, separate from Eva's canonical €235 storefront order. This teaches the protocol without changing the scenario ledger.\n- **2026-11-09** — Place the tutorial in a new Appendix section before Reference, preserving the numbered chapter sequence and existing permalinks.\n- **2026-11-13** — Converted spec.md to spec.json from the published page, one spec paragraph per unit. Intent outcome, the five acceptance criteria, thesis and role copied unchanged from journal-spec.json (appendix part); audience and the six supporting claims written for this page. The old success criteria were inventories (terms explained, protocols distinguished, figures present, sources dated, navigation wired) and are dropped as criteria: their outcomes are covered by AC-1 to AC-5, the audience's does_not_know list and the evidence items. No criterion was added. Rejected: Keeping the inventory criteria as minor criteria (rule 7 of the author's standing instruction would drop them).\n- **2026-11-13** — The page carries the appendix's opening and closing (journal spec). Added what the published page lacked: the thesis sentence in p03 (each step reports only the state the merchant returned), a roadmap in p04 announcing every section, a bridge from chapter 45, p78 returning to the opening shopper as the part closing's synthesis and callback, the closing take-away in p83, and p84, a hand-off to domain-coverage (relationship conclusion_summary, as the Reference part declares). The pointers to chapters 45, 25 and 26 stay in p83 because they help; the hand-off now leads into the reference pages. Rejected: Ending on chapters 25 and 26 (the journal spec's order puts domain-coverage next).\n- **2026-11-13** — Word limit: the old spec set none, so the published length (4,770 words) is the basis and max_words is 5,250 (+10%, the author's allowance of 2026-11-12) to hold the added thesis sentence, roadmap, callback, take-away and hand-off; no new material beyond these.\n- **2026-11-13** — Flow rubric (fresh agent, --flow output only): sound with notes. Taken, as the author asked on 2026-11-12 for the rubric notes to be taken without review: REST (p13) moved after the namespace paragraph (p14) so the six terms and the profile names read together; the ACP-and-UCP mapping advice (p18) moved from the vocabulary to What a Merchant Should Implement First; in Step 3 the full-contract note (p33) moved before the analysis (p32) so the section ends on its lesson; p61 and p62 merged (the correlation record and why it exists); glosses where a status, expiry, the update path or per-attempt signatures first appear; the table of other failure situations named in p68; the declared reason now justifies the tail order. Rejected: Merging p16 (ACP's actual scope) into p15: p16 refutes a specific misreading and is a different point.; Listing the six responsibilities and the 'boundary' exercise earlier: both are spelled out in the table and the list where they are used.; Changing paths in the code examples: the brief keeps examples exactly; a gloss in Step 4 says paths are relative to the service endpoint.\n- **2026-11-13** — Round 1 (ESCALATE: two corroborated flow failures at fault in the spec) fixed under the pre-approved rule for spec-fault failures: both flow readers found the ACP/MCP/AP2 comparison out of place in the vocabulary, so it moved (p15-p17) into What a Merchant Should Implement First, before the ACP-and-UCP advice (p18); both found the table of other failures out of place under the lost-response heading, so it became its own section 'Other Things That Go Wrong' (new unit p68a with the table, and p69); both found Three Permissions unclear inside the payment step, so it became its own section between Step 5 and Step 6 (p49-p51). Roadmap, flow rationale and the invalidated transitions rewritten. Intent, thesis, role and criteria unchanged. Rejected: Keeping the comparison in the vocabulary (two readers and the flow rubric found it a detour).; A new heading for the lost-response section to cover the table (a separate section keeps the heading true).\n- **2026-11-13** — Auto-resolved by the author's standing instruction of 2026-11-12 (rule 3, a move asked for by readers in two rounds): the ACP/MCP/AP2 comparison, with the advice on supporting both (p15-p18), became its own section after What a Merchant Should Implement First (both round-2 flow readers; a round-1 reader also asked for it there); the Technical reference paragraph (p08) moved to the start of Step 1 (flow reader B in rounds 1 and 2); the handoff paragraph (p43) moved before the table of states (flow reader B in rounds 1 and 2). Round 2 (REVISE) glosses applied under rule 6: recoverable, handoff, fulfillment extension in the vocabulary table, request signature, payment authorization versus approval, the two identities of a retry, payment handlers in the full profiles, the €235 aside framed for readers of the book; the bridge into the comparison now says why a merchant needs it. Word limit held at 5,250 by cutting agents' own additions and one figurative sentence ('the entrance sign for the API'). Rejected: Moving the lost-response section directly after Step 6 (one reader in one round; rule 10: the current position stands).; Raising max_words above 5,250 (the 10% allowance is used).\n- **2026-11-13** — Confirming round 3 (ESCALATE, 16 pass / 13 fail, 7 blocking). Cheap, plainly right fixes applied without another round: a lead-in on the Technical reference so Step 1 opens on its source and then the first message (p08); Step 4 opens on the still-incomplete checkout (p34); Eva glossed as the book's running example (p06); 'request signature' glossed (p49); mples) — The optional local learning exercise.\n  - ACP specification (https://github.com/agentic-commerce-protocol/agentic-commerce-protocol) — Comparison and overlapping scope.\n\n## Changelog\n\n- **2026-11-13** — Open questions settled at the author's instruction of 2026-11-13 (see decision_log); before-print entries relabelled; no change to the page.\n- **2026-11-13** — Round 3 (ESCALATE) closing fixes: glosses and transitions in p06, p08, p34, p49, p67, p70; check-report.json is stale after these edits.\n- **2026-11-13** — Round 2 REVISE fixed and resolved by the standing rules: comparison as its own section, technical reference to Step 1, handoff before the states table, glosses; confirming round 3 follows.\n- **2026-11-13** — Round 1 ESCALATE: comparison moved to implement-first, Three Permissions and Other Things That Go Wrong made sections, transitions and glosses fixed; round 2 follows.\n- **2026-11-13** — Flow rubric notes taken: two moves in the vocabulary, p18 to implement-first, p33 before p32, p61+p62 merged, glosses; transitions rewritten.\n- **2026-11-13** — Converted spec.md to spec.json (reconstructed from the published page); added the thesis sentence, roadmap, callback, take-away and hand-off to domain-coverage; status draft.\n- **2026-11-09** — Added an opening hero illustration of shopper approval, the UCP connection and the merchant's order, matching the journal's visual style.\n- **2026-11-09** — Illustrated every step: added Figures 3, 4, 5, 8 and 9 for Steps 2, 3, 4, 6 and 7; Steps 1 and 5 already had Figures 2 and 7. Figures renumbered 1–10.\n- **2026-11-09** — Status accepted; completed the illustrated tutorial, checked message excerpts against the dated specification, and verified the built appendix and entry links.\n- **2026-11-09** — Initial spec, status draft; requested illustrated beginner's appendix tutorial.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);

        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
