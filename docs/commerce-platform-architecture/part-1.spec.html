<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-12 from the published page (posts/part-1-intro/index.md, 451 words, ten units) and its former spec.md, then reordered the same day (see decision_log); the page was revised to match. One spec paragraph per unit of the page; the KEY POINTS callout and the three figures are evidence of the paragraph they stand with (Figure 3 with the roadmap, p04).\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Part I answers five questions in order: what happens to an order, who sells what to whom, what the parts are, who owns each fact, and what the market sells.\n- **Be able to:** Pick the Part I chapter that answers the decision in front of them.\n\n**Audience:** Readers new to commerce architecture in their first weeks at a merchant, a vendor or an agency (engineers, product managers and leaders) who have read the preface and are about to start Part I, or who arrive with one decision in hand and want the chapter that answers it.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side.\n- Roughly what an API, a database and a queue are.\n- The preface's claim that a commerce platform is the set of systems that make and keep promises (introduction).\n- Kestrel & Pine in outline: a fictional outdoor brand, its thirteen systems, its incidents, Noor Visser and the Waypoint program (meet-kestrel-and-pine).\n\n**Does not yet know:**\n\n- Shop platform, as the book's name for the hosted product that runs the webshop (defined in journey-of-an-order).\n- Writer, capability, record and copy, scale stage, platform category: each is owned by a Part I chapter and is only named or glossed in a clause here.\n- Eva's order as the journey's worked example.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader of this page alone can name the five chapters' subjects in reading order. *Probe:* After reading only this page: what will each of the next five chapters tell you, in order? | `intro_predicts_content` | cold_reader | major |\n| AC-2 | Given two decisions, the reader names the Part I chapter that answers each. *Probe:* Two decisions are in front of you: (a) your webshop and your warehouse show different stock for the same item, and you must decide which number is right; (b) a vendor proposes replacing your shop software. Using only this page: which chapter of this part do you open for each, and why? | `custom` | cold_reader | major |\n| AC-3 | The reader can say why the order's journey comes first and the platform landscape last. *Probe:* Using only this page: why does this part start with the chapter that follows one order, and end with the chapter on what the market sells? | `custom` | cold_reader | major |\n\n## Thesis\n\n**Question:** What is a commerce platform, before any technology is chosen?\n\n> **Claim:** A commerce platform is the whole set of systems that make and keep promises to a customer, and nearly every commerce failure is a promise one system made and another could not keep.\n\n**Disputed by:** The everyday meaning of 'commerce platform' as the product a merchant buys to run its web shop.\n\n**So what:** A merchant that treats the platform as one product looks for failures inside that product and replaces it; a merchant that sees the set of systems looks at the joins and fixes ownership.\n\n**How and why:** The storefront makes the promises in seconds while the warehouse, carrier, payment provider and finance system keep them over days, each from its own copy of the facts.\n\n**Supporting claims**\n\n- **P1-1** — An order is a chain of promises handed from system to system, and it breaks at the handoffs.\n- **P1-2** — Who sells what to whom decides which promises are made and therefore which systems are needed.\n- **P1-3** — The platform is a map of capabilities, each owning one kind of fact, and no vendor covers the whole map.\n- **P1-4** — For each fact exactly one system must be the record; every other value is a copy.\n- **P1-5** — Buying a platform moves the integration work to a different owner; it does not remove it.\n\n## Role in the part\n\nPerforms the part's opening: states the part thesis and the reading order.\n\n## Flow\n\n**Pattern:** `large_to_small` (also `prerequisite_order` in chapters: the five chapter paragraphs, in the part's reading order)\n\nThe page opens on one shopper's order as the hook, to which the closing returns, and then narrows from the part's claim, to the one company the claim is tested on, to the five questions that take that company apart, to one paragraph per chapter, and ends on what the five answers add up to and where to start. The company stands before the chapter list because the chapter paragraphs name its cases and its Waypoint program, and each introduces its own person (Eva, Noor Visser) in a clause; the five questions stand directly before the list because they are the principle that orders it; the reading advice comes last because a reader can choose a chapter only after seeing what each one decides. Put the list first and Kestrel & Pine and Waypoint arrive unexplained; put the five questions before the company and they have nothing to be asked of; put the advice first and it points at chapters the reader has not met.\n\n## Introduction\n\n**Hook** (`intriguing_example`): A shopper places one order, but the warehouse, carrier, payment provider and finance team each have work to do before it is complete.\n\n**Bridge:** The reader's experience as a shopper: one click, one confirmation, one order. → The merchant's side of that order, where the storefront's promises about product, price, stock, delivery and returns depend on answers from other systems; hence the question of what a commerce platform is.\n\n**Thesis statement** (KEY POINTS bullet 1 and paragraph p02): Part I argues that a commerce platform is the whole set of systems that make and keep those promises, and that nearly every failure is a promise one system made and another could not keep. The product a merchant buys to run its webshop, the shop platform, is only one of them.\n\n**Roadmap** (paragraph p04):\n\n- Five chapters answer five questions in order: what happens to an order, who sells what to whom, what the parts of a platform are, who owns each fact, and what the market sells. *Kept in:* chapters.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | example | One order placed by a shopper is finished only when the warehouse, the carrier, the payment provider and the finance team have each done their work, so the storefront's promises depend on systems the shopper never sees. | example: One order: the storefront promises product, price, stock, delivery and returns; the warehouse, carrier, payment provider and finance team have work to do before it is complete.; figure: Figure 1: a ticket of promises carried from the online shop to a warehouse, a delivery van, a payment terminal and a ledger. |  |\n| p02 | claim | Part I's claim: a commerce platform is the whole set of systems that make and keep those promises, of which the product that runs the webshop (the shop platform) is only one, and nearly every failure is a promise one system made and another could not keep; knowing who keeps each promise locates a failure. | figure: Figure 2: the order's journey as a chain of promises, the storefront making them early and the other systems keeping them late. | `elaboration`: The one order and the storefront's promises that other systems must keep. → The claim the part draws from it and the name 'shop platform' for the product that is only one of those systems. |\n| p03 | example | The part tests the claim on Kestrel & Pine, a fictional outdoor brand whose thirteen systems hold orders and product data in four places each and let six writers change warehouse stock, and whose Waypoint program starts by deciding who owns what. | scenario: Kestrel & Pine (fictional): €48 million revenue in 2026, thirteen systems, 34 integrations, 41 apps; orders and product data each in four places; six writers of warehouse stock; Waypoint begins in March 2027. | `example`: The claim that failures are promises one system made and another could not keep. → The one company on which every chapter of the part tests it. |\n| p04 | transition | Part I examines that company with five questions in a fixed order (what happens to an order, who sells what to whom, what the parts are, who owns each fact, what the market sells), one chapter each, because each answer is the vocabulary the next question needs. | figure: Figure 3: the five questions of Part I in reading order. | `sequence`: Kestrel & Pine's landscape and its unowned facts. → The five questions the part asks of it, in order, and the reason for the order. |\n\n## Sections\n\n### Chapters in this part\n\n**Controlling idea** (`description`, id `chapters`): Each of the five chapters decides one question and tests the answer on one Kestrel & Pine case, and each builds on the chapter before it.\n\n**Advances the thesis** (P1-1, P1-2, P1-3, P1-4, P1-5): Each paragraph introduces the chapter that argues one of the part's five supporting claims, so the list is the part's argument in outline.\n\n**Transition in:** `elaboration`: The five questions in order. → One paragraph per chapter: the question in bold, what the chapter does with it and its Kestrel & Pine case.\n\n**Order of paragraphs** (`prerequisite_order`): The part's own reading order. The journey names the steps that the business models vary; the models say what a merchant must be able to do, which the capability map lays out; the map names the facts whose ownership the fourth chapter assigns; and only with jobs mapped and owners named can the reader judge what the market sells. Move the landscape chapter earlier and products are compared before the reader knows what they must do.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description | Chapter 1 follows one purchase through thirteen steps, and its two orders show the normal path and why one status word cannot describe an order. | scenario: Eva's jacket order (the normal path) and another order marked delivered, in picking and uninvoiced at once. |  |\n| p06 | description | Chapter 2 shows that the shape of the business decides the systems: with the same steps, who buys and through which channel changes who sets the price, who is the seller, who holds the stock and who ships; and as a merchant grows, its shape changes through four scale stages, by adding channels, stock locations, countries and brands rather than revenue. | scenario: One jacket sold to a consumer, a wholesale customer, a marketplace customer or a store visitor.; fact: Four scale stages, from Starting to Group; a merchant moves between them by adding channels, stock locations, countries and brands, not by passing a revenue threshold. | `contrast`: The thirteen steps of the journey, which stay the same. → What changes around them with the buyer and the sales channel. |\n| p07 | description | Chapter 3 maps the jobs a merchant must perform, which the book calls capabilities, before any software is chosen, and placing Kestrel & Pine's systems on that map exposes missing capabilities and overlapping writers. | scenario: Head of Engineering Noor Visser places Kestrel & Pine's systems against the jobs. | `sequence`: The ways of selling, which say what a merchant must be able to do. → The jobs themselves, laid out as a map before any software is chosen. |\n| p08 | description | Chapter 4 assigns one authoritative owner to each fact, which the map alone cannot do when two systems hold the same fact and disagree. | scenario: Six competing answers about Kestrel & Pine's stock, resolved in the worked example; systems meaning different things by 'order'. | `contrast`: The capability map, which says which job should hold a fact. → What the map cannot settle: two systems holding the same fact and disagreeing. |\n| p09 | description | Chapter 5 comes last, once jobs are mapped and owners named: its seven platform categories differ less in features than in who hosts, upgrades and integrates, each moving the integration work rather than removing it, and two proposals to rebuild Kestrel & Pine's webshop end in keeping the shop platform and adding the missing capabilities. | scenario: Two rebuild proposals tested against Kestrel & Pine's actual problems; the company keeps its shop platform and adds missing capabilities.; fact: Seven platform categories that differ in who hosts, upgrades and integrates, with dated evidence through 2026. | `sequence`: The jobs mapped and the owners of facts named. → What the market sells to do those jobs, and what it costs to operate. |\n\n## Conclusion: Where to Begin\n\n**Synthesis:** Kestrel & Pine's problems were facts nobody owned, at the handoffs between systems, which no replacement product would have fixed.\n\n**So what:** A reader looks for a failure at the handoffs and asks who owns the fact before asking which product to buy.\n\n**Callback:** The shopper's one order of the opening (p01). Its promises are kept or broken at those handoffs, and the first chapter follows it through them.\n\n**Takeaway** (`course_of_action`): Read the chapters in order, beginning with the order's journey; with one decision to make, start at the chapter that answers it.\n\n**Hand-off** to [Follow the Order: What Happens Between “Buy” and “Delivered”](journey-of-an-order.html): `example`: The part's claim that a commerce platform is the set of systems that make and keep promises. → One order followed through thirteen steps, as the concrete case of that claim.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | synthesis | Kestrel & Pine's problems are unowned facts at the handoffs, where the shopper's one order breaks and which no product fixes; read the chapters in order from the order's journey, or, with one decision to make, start at the chapter that answers it. |  |  |\n\n## Non-goals\n\n- Teaching any chapter's content; the page summarizes and does not re-argue. See [Follow the Order: What Happens Between “Buy” and “Delivered”](journey-of-an-order.html), [Who Sells What to Whom: Business Models and the Economics That Shape Architecture](commerce-business-models.html), [The Map of a Commerce Platform: Capabilities and Layers](commerce-capability-map.html), [Who Owns the Truth: Boundaries, Bounded Contexts and Systems of Record](boundaries-and-systems-of-record.html), [Suites, SaaS, Open Source and Composable: The Platform Landscape in 2026](commerce-platform-landscape.html).\n- The Waypoint decisions in detail. See [Meet Kestrel & Pine](meet-kestrel-and-pine.html).\n- The failure patterns' definitions. See [Out of Stock, Out of Sync: Sixteen Ways Commerce Platforms Go Wrong](where-commerce-platforms-go-wrong.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- needs the author: the page sits at the part-intro limit (530 = 451 + 15% + the one KEY POINT sentence), so three corroborated round-4 findings that each need words stay open: 'writer' is not glossed in p03 (both flow readers; needs about 3 words, e.g. 'six writers, systems or people,'), the p05->p06 contrast ('the steps stay the same') is not stated (judge; about 4 words), and 'six answers about stock' in p08 is not tied to the six writers (both readers; about 3 words). Settling them needs either about 10 more words than rule 4 allows or the author's choice of something of theirs to cut.\n\n## Decision log\n\n- **2026-11-12** — Auto-resolved by the author's standing instruction of 2026-11-12: after the confirming round 4 (escalate  No unit was moved. Rejected: Cutting the 'comes last' clause from p09 and shortening p11 (see open_questions).\n- **2026-11-12** — The post entry in the journal spec has a question and no thesis. A part intro performs the part's opening, so this spec uses the part's thesis (question, claim, disputed_by, so_what, how_why) and its five supporting claims P1-1 to P1-5 unchanged; each chapter paragraph introduces the chapter that argues one of them. Intent outcome, AC-1 and role are copied from the post entry; hook from the part's opening. Rejected: Writing a separate thesis for the page from its question ('What does Part I argue, and in what order should its chapters be read?'): it would restate the part's claim and add a claim about reading order that the journal spec does not make.\n- **2026-11-12** — Conversion of spec.md, taken without review at the author's request (auto mode). The seven success criteria were inventories and are not carried as criteria: three KEY POINTS then <br> (house format, kept on the page); a lead of 2 to 4 paragraphs that names Kestrel & Pine as fictional once (now paragraphs p01 to p04); one or two mermaid diagrams (obsolete since the figures were redrawn as illustrations on 2026-11-07); the format of the chapter list (kept on the page; its outcome is AC-1 and the new AC-2); numbers matching the ledger (checked at conversion, see changelog; not a reader outcome); 500 to 900 words (now length.max_words 900); a one-line Sources and Evidence (apparatus, kept). The old Audience line ('leave knowing the five questions in order, and why the order's journey comes first') became AC-3. The open question about generated illustrations was answered by the visual pass of 2026-11-07 and is closed. Rejected: Carrying the checklist over as acceptance criteria: they say what the page contains, not what a reader can do.\n- **2026-11-12** — Order of ideas changed from the published page. (1) The opening paragraph is split: the one order (p01), then the part's claim stated in prose (p02); it was stated only in the KEY POINTS and the excerpt. (2) Kestrel & Pine (p03) moves before the roadmap (p04), so that the five questions stand directly before the chapter list they order. (3) Figure 2 (the chain of promises) moves from after the Kestrel & Pine paragraph to the claim it illustrates. (4) The page gets a short closing under a new heading, 'Where to Begin': a synthesis with Figure 3 (p10) and the reading advice (p11). The advice 'start with the decision you need' moves there from the roadmap, next to 'Begin with journey-of-an-order', which it used to contradict from six paragraphs away. (5) The roadmap gives the five questions and the reason for their order instead of a one-line summary of each chapter, which the list repeats. Rejected: Keeping 'Begin with [Follow the Order: What Happens Between “Buy” and “Delivered”](journey-of-an-order.html).' as the last line of the chapter list with no closing section: the schema requires a conclusion, and the page had no place that said what the five chapters add up to.; Putting Figure 3 after the roadmap: three figures would stand in the first four paragraphs.\n- **2026-11-12** — Terms: chapter 1 now calls the hosted product 'the shop platform' and keeps 'commerce platform' for the whole set of systems. The page follows: p02 names the shop platform as one of the systems, and Kestrel & Pine 'keeps its shop platform'. 'Platform categories' stays for chapter 5's subject, as in the journal spec. 'Four growth stages' becomes 'four scale stages' (the book's term) and 'purchase thresholds' becomes 'revenue thresholds' (chapter 2: stages are defined by shape, not revenue). 'Writer' is glossed where it first appears, from chapter 4's definition.\n- **2026-11-07** — Figure 2 shows the part as five questions in reading order rather than Kestrel & Pine's systems, because commerce-capability-map already draws the systems and the intro's job is orientation. (Carried from spec.md; after the visual ed session)\n- **2026-11-12** — Draft-check round 1: escalate (14 pass, 4 fail). Closing heading changed in the spec; three local fixes in the draft. (AI-mediated session)\n- **2026-11-12** — Converted spec.md to spec.json (outcome spec) and reordered the page; status draft. Numbers checked against the ledger and the chapters at conversion: €48 million, thirteen systems, 34 integrations, 41 apps, four places, six writers, March 2027, thirteen steps, four scale stages, six answers about stock, seven categories, two proposals. (AI-mediated session)\n- **2026-11-08** — Openers: dropped IN THIS PART and FAILURE PATTERNS blocks; tightened KEY POINTS (author request). (AI-mediated session)\n- **2026-11-07** — Visual layer: redrew 2 mermaid diagrams as illustrations and added 1 conceptual figure (article-illustrator). (AI-mediated session)\n- **2026-11-07** — Editorial review pass: described the February 2027 pitches per consistency ruling 13. (AI-mediated session)\n- **2026-11-07** — Initial spec and part introduction. Status accepted. (AI-mediated session)\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
