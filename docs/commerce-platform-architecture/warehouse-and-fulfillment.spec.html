<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/15-warehouse-and-fulfillment/index.md) and its former spec.md, whose Non-goals, Modalities, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus a roadmap paragraph in the introduction and a synthesis paragraph at the head of the conclusion, which the published page lacked. It is a contract, not a description: places where the chapter did not yet do what the spec asks are listed under open_questions or in the decision log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The warehouse steps (receiving, put-away, slotting, wave or continuous release, picking, packing, shipping confirmation, cycle counting) and what each changes; where automation and robots sit beneath the warehouse system.\n- **Know:** The fulfillment order and its lifecycle (requested, accepted or rejected, in progress, shipped, closed incomplete, with cancellation as a request), the warehouse's four interfaces, and the four ways to get warehouse execution (ERP module, dedicated WMS, 3PL, marketplace fulfillment program).\n- **Know:** Why the SSCC label and the despatch advice (DESADV) are generated from pack confirmation.\n- **Believe:** The warehouse system is the only writer of on-hand stock; every other system derives from its events.\n- **Believe:** Whether an order ships on time depends on when it reaches the warehouse and on the cut-off and backlog, not only on how fast people pick.\n- **Be able to:** Specify the platform-to-WMS integration: what the fulfillment order carries, its key, the accept-or-reject answer, cancellation after acceptance, shipment confirmations, stock events and the reconciliation behind them.\n- **Be able to:** Say which warehouse facts (cut-off, capacity, backlog) the delivery promise must read.\n\n**Audience:** Readers new to commerce architecture; most of all the engineer or architect who must integrate a shop platform, an OMS or a 3PL with a warehouse system (Noor Visser and Ruben Alves at Kestrel & Pine); operations leaders who need to see why 'send the order to the WMS' is not a specification come next (Daniel Okafor).\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its 2026 and January 2027 incidents in outline and the names of the sixteen failure patterns.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines (money, goods, returns), 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, business models and the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- From Part II: one owner per product attribute, SKU and GTIN, available-to-promise (on hand minus committed minus allocations), one writer each for on hand and committed, per-channel buffers.\n- From Part III: checkout creating the order once with payment pending; one order record with three status lines and an OMS once two of four conditions hold; the fulfillment order named as the order record's instruction to the warehouse; one invoice per shipment.\n- From the Part IV introduction: the system on the spot witnesses each physical fact; Eva's jacket was promised for Wednesday and delivered on Thursday; the Queue That Waited in outline.\n\n**Does not yet know:**\n\n- Warehouse steps: location, put-away, slotting, wave, cluster and batch picking, cartonization, shipping confirmation, cycle counting.\n- Automation: autonomous mobile robot, goods-to-person, robotic picking, sortation, warehouse execution system, warehouse control system, robot fleet management.\n- The fulfillment order's lifecycle and its accept-or-reject and cancellation-request handshake.\n- Cut-off, capacity and release policy as the warehouse's day.\n- SSCC, despatch advice (DESADV, ASN), EDIFACT.\n- Marketplace fulfillment programs and a stock location the merchant can see but not count.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given a peak evening on which orders reached an adequately staffed warehouse hours late, the reader places the fault in the order feed and the promise, not in the warehouse, and names the four remedies. *Probe:* On a peak evening the warehouse had staff to spare, but orders placed at 20:00 reached the warehouse system after midnight while the storefront kept promising next-day delivery for orders before 22:00. Using only this chapter: where was the fault, and what would have prevented it? | `custom` | cold_reader | major |\n| AC-2 | Given a duplicated instruction and a late cancellation, the reader says what the fulfillment-order contract does in each case. *Probe:* A timeout makes the integration send the same order to the warehouse twice; the next morning support cancels another order in the shop after the warehouse had already accepted it. Using only this chapter: what should happen in each case? | `custom` | cold_reader | major |\n| AC-3 | The reader can say which system must generate the pallet label and the despatch advice for a retail customer, and from what. *Probe:* A retail customer deducts money because the pallet labels do not match the despatch advice it received. Using only this chapter: which system should generate the SSCC label and the DESADV, and from what? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** What happens to an order inside the warehouse, and what must the warehouse system receive from, and report to, the rest of the platform?\n\n> **Claim:** Inside the warehouse an order becomes work that is released, picked, packed and confirmed as a shipment within the building's capacity and before the carrier's collection. The warehouse system must receive a fulfillment order it can accept or reject, carrying only what to ship and a key, so that a retried request creates no second pick list. As the only writer of on-hand stock, it must report shipment confirmations built from what was packed, every stock change as an event, and its cut-off, capacity and backlog.\n\n**Disputed by:** The view that 'send the order to the WMS' is the whole specification: the warehouse receives the order as the shop holds it, any system may correct stock figures, and on-time dispatch is a matter of warehouse staffing and speed.\n\n**So what:** On Black Friday 2026 Duiven had the staff, but orders took four hours to reach its warehouse system and roughly 8,000 orders placed between 17:00 and midnight missed next-day delivery while the storefront promised it; the remedy was a queue, batches, a monitor on the oldest order and a moving cut-off, not a faster warehouse. Bergzicht deducted €14,200 because the despatch advice was built from the ERP's order rather than from what was packed. A merchant that accepts the claim writes the fulfillment-order contract, names the one writer of on-hand stock and feeds the cut-off to the promise before it buys a WMS, a 3PL or robots.\n\n**How and why:** Physical work cannot be undone by changing a status: once the warehouse has accepted an instruction, picking may have started, so a cancellation needs the warehouse's answer. Prices, payments and customer history change for reasons the warehouse cannot act on and add data it must protect, so the instruction carries only what to ship. A request retried after a timeout arrives twice and, without a key, creates a second pick list. Only the warehouse counts shelves, so any second writer of on-hand stock produces phantom stock. An order that reaches the warehouse after the last wave ships the next day whatever the page said, so the promise must read the cut-off and the backlog. A pallet's SSCC and contents exist only at pack time, so the despatch advice must come from pack confirmation.\n\n**Supporting claims**\n\n- **S1** — Inside the warehouse an order becomes work that is released in waves or continuously, picked, packed and confirmed as a shipment within the building's capacity and before the carrier's collection; automation changes how the work is executed, not the need to confirm its physical results.\n- **S2** — The warehouse system must receive a fulfillment order it accepts or rejects, carrying only what to ship and an identity, so that a retried request creates no second pick list and a cancellation after acceptance is a request the warehouse answers.\n- **S3** — The warehouse system is the only writer of on-hand stock and reports every change as an event, with a daily snapshot and a reconciliation to catch what is lost.\n- **S4** — What the warehouse reports about a shipment must be built from what was packed: the shipment confirmation per parcel, and for wholesale the SSCC label and the despatch advice generated at pack time.\n- **S5** — Whether an order ships on time depends on when it reaches the warehouse and on the cut-off, capacity and backlog, so the delivery promise must read those facts, not a static sentence.\n- **S6** — Whoever runs the warehouse software (an ERP module, a dedicated WMS, a 3PL or a marketplace program) changes the operator, not the contract, and the integration must keep pace with the operation's complexity.\n\n## Role in the part\n\nGives the part its warehouse side: the fulfillment order as the contract between the order record and the warehouse, the warehouse system as the only writer of on-hand stock, and the cut-off, capacity and backlog that every later promise must read. Supports P4-1, P4-2, P4-3 of part `part-4`.\n\n## Flow\n\n**Pattern:** `prerequisite_order` (also `problem_solution` in scene, then in-practice: the Black Friday queue posed at Duiven and resolved once the contract is known; `comparison` in choices and stages)\n\nThe Duiven scene comes first so that every term arrives as part of the answer to Noor's question about the Black Friday queue. What a WMS does comes next because the steps and the three facts of warehouse work (release policy, capacity, physical facts) are what every later section uses. The interfaces follow: the fulfillment order before stock because stock events and confirmations are results of the instruction, the warehouse's day after stock because the promise needs both, and wholesale last because it applies the confirmation rule to pallets. The four execution choices come after the contract because each is a different operator behind the same contract, and the stages after the choices because they say how the setup and its warning signs change as the merchant grows; both come before the worked cases because the cases show Kestrel & Pine at stage 3 with a stage-1 connection, which the stage table names. Automation follows the stages, whose Group row adds it, because it repeats the contract one level down (task identity, confirmed outcome, capacity fed to the promise) and is hypothetical for Duiven; placed before the contract it relied on the fulfillment order and the promise before either was explained (two flow-rubric runs), and placed between the contract and the choices it interrupted the move from what the warehouse exchanges to who runs it (both round-3 flow readers). The worked cases come after the contract and the choices so that Eva's late parcel and the Black Friday queue can be read against the cut-off and the order feed, and the failures come last because each is read against the part of the contract that prevents it. Moving the interfaces before the steps would introduce confirmations and stock events before the reader knows the work that produces them; moving the worked cases before the capacity facts would leave Eva's late parcel unexplained.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A picker walks to the shelf for a paid order and finds no jacket. The storefront has already confirmed the sale, but the warehouse now needs to investigate, find a replacement unit or report a failed pick, and those steps may push the parcel past its dispatch cut-off: a stock error has become a delivery problem.\n\n**Bridge:** Anyone who has had a parcel arrive a day late, or the wrong size in a box, has met a promise the warehouse could not keep; the Part IV introduction has just left Eva's paid order waiting for Duiven. → Whether the warehouse can keep a promise depends on the instruction it receives and the facts it reports, so the question is what those must be.\n\n**Thesis statement** (KEY POINTS callout (all three bullets) and paragraph p02): The warehouse system must receive a fulfillment order it can accept or reject, carrying only what to ship and a key so that a retry creates no second pick list; as the only writer of on-hand stock it must report shipment confirmations built from what was packed, every stock change as an event, and its cut-off, capacity and backlog, from which the delivery promise is computed.\n\n**Roadmap** (IN THIS CHAPTER callout and paragraph p04):\n\n- Start at Duiven with the Black Friday evening on which orders reached an adequately staffed warehouse four hours late. *Kept in:* scene.\n- Describe what a WMS does, step by step, and the facts about warehouse work that shape every integration. *Kept in:* wms.\n- Set out the warehouse's interfaces: the fulfillment order it accepts or rejects, the stock count it alone writes, its working day of cut-off, capacity and release, and the wholesale label and despatch advice. *Kept in:* connects.\n- Compare the four ways to get warehouse software run: ERP module, dedicated WMS, 3PL and marketplace program. *Kept in:* choices.\n- Say how the warehouse setup and its warning signs change across the four scale stages. *Kept in:* stages.\n- Show where automation and robots fit beneath the warehouse system and what each automated task must carry. *Kept in:* automation.\n- Work Eva's order and the Black Friday queue through the warehouse. *Kept in:* in-practice.\n- List the ways the warehouse interface fails, with detection and recovery. *Kept in:* wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | A picker who finds no jacket for a paid order turns a stock error into a delivery problem: the search for a replacement unit or the report of a failed pick takes people and time and can push the parcel past its dispatch cut-off. | scenario: A picker at the shelf for a paid order finds no jacket; the storefront has already confirmed the sale. |  |\n| p02 | claim | A missed edit or an unrealistic delivery date fails the same way, so the warehouse management system (WMS) must receive a fulfillment order it can accept or reject, carrying only what to ship and a key, and, as the only writer of on-hand stock, must report what it packed, every stock change and its cut-off, capacity and backlog; accurate instructions and timely results let the shop make promises the warehouse can keep. |  | `similarity`: A stock error that became a delivery problem. → Other wrong or late instructions that fail the same way, and the chapter's claim about what the warehouse system must receive and report. |\n| p03 | context | In Eva's order, bought at 21:14 on 13 April 2027 and paid through iDEAL, Duiven's warehouse picks, packs and confirms the shipment on 14 April and prints a PostNL label; the next chapter follows the parcel onward. |  | `time`: The warehouse system and the fulfillment order, named in the claim. → Where Eva's order stands in its journey: paid, and waiting for Duiven. |\n| p04 | transition | The chapter starts at Duiven with the Black Friday queue, describes what a WMS does, then the four interfaces between the warehouse and the order record (the fulfillment order, the stock count, the warehouse's day and the wholesale pallet label), the four ways to run warehouse software and how they change with scale, then where automation and robots fit beneath the WMS, and ends with Eva's order and the Black Friday evening worked through and the ways the interface fails; its evidence is Kestrel & Pine's Duiven warehouse and vendor and standards documentation. |  | `sequence`: Eva's paid order waiting for Duiven. → The order of the chapter and the kind of evidence it uses. |\n\n## Sections\n\n### Setting the Scene: Duiven's Day\n\n**Controlling idea** (`example`, id `scene`): Duiven had the people and the space on Black Friday 2026, yet orders reached its warehouse system four hours late while the storefront kept promising next-day delivery, which leaves Noor to establish what the warehouse must receive and report.\n\n**Advances the thesis** (S1, S5): Gives the case the chapter answers: a warehouse with spare capacity whose promise broke because the order feed and the promise ignored its queue.\n\n**Transition in:** `example`: The chapter's claim and roadmap, which start at Duiven. → The warehouse itself and the Black Friday evening that frames the chapter.\n\n**Order of paragraphs** (`chronological`): The building and its history first, then its normal day, then the walk through the work, then the Black Friday chart: the incident only reads as a feed problem once the reader has seen a warehouse that runs to a schedule with capacity to spare.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | description | Kestrel & Pine has run its own 8,500-square-meter Duiven warehouse near Arnhem since 2023, with 88 staff and a standalone cloud WMS under Daniel Okafor; before that a third-party logistics provider (3PL) in Tiel shipped its online orders, so owning the building brought direct control and responsibility for its daily capacity. | scenario: Duiven: 8,500 m², opened 2023, 88 warehouse staff, standalone cloud WMS; the Tiel 3PL before 2023. |  |\n| p06 | evidence | Noor Visser visits Duiven in April 2027, and an ordinary working day there ships about 1,300 parcels and 35 wholesale shipments in waves released from 06:30 to a final wave at 21:00, before carrier collections between 18:00 and 22:30. | table: Duiven's normal April 2027 day: about 1,300 parcels, 35 wholesale shipments, 7,500 units, six waves from 06:30 to 21:00, collections 18:00 to 22:30, 4 to 8 inbound trucks, about 280 returns (illustrative rhythm). | `time`: The warehouse Kestrel & Pine owns. → Noor's visit and the building's normal rhythm. |\n| p07 | description | Daniel walks Noor through receiving, put-away, picking, packing and daily counts, with purchase orders arriving from the enterprise resource planning system (ERP) and the WMS grouping work so one picking route serves several orders. |  | `elaboration`: The day's figures. → The work behind them, step by step, and where the ERP feeds it. |\n| p08 | example | Daniel's Black Friday chart shows that the warehouse had enough staff but orders took four hours to reach the WMS, so an order placed at 20:00 arrived after midnight and missed the 21:00 wave while the storefront kept promising next-day delivery for orders before 22:00. | case: Black Friday 2026: a four-hour backlog into the WMS; 20:00 orders reached it after midnight; the storefront still promised next day before 22:00; the same evening stock shown elsewhere lagged by up to two hours, a separate fault. | `contrast`: A warehouse that runs to a schedule with the staff it needs. → The evening it still missed its promises. |\n| p09 | transition | Daniel calls the incident the Queue That Waited, because the promise ignored the warehouse's actual work queue; why the feed fell behind is left to In Practice, and first Noor needs to establish what the warehouse must receive and what it must report back. |  | `conclusion_summary`: The four-hour backlog and the promise that ignored it. → The incident's name and the question the chapter answers. |\n\n### What a Warehouse Management System Does\n\n**Controlling idea** (`definition`, id `wms`): A WMS directs the warehouse's steps and records their results, and three facts about that work (a release policy, finite capacity and physical facts only the WMS sees) shape every integration with it.\n\n**Advances the thesis** (S1): Defines the work an order becomes and the three facts the later contract, stock and promise sections rest on.\n\n**Transition in:** `elaboration`: Noor's question: what the warehouse must receive and report. → What the warehouse system does, step by step.\n\n**Order of paragraphs** (`small_to_large`): The steps first, then how picking is organized, then how products differ, then the three facts generalized from the work: the facts are drawn from the steps, so they cannot come first.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition | A WMS directs warehouse work and records its results, and each of its steps, from receiving to cycle counting, changes what the building holds or what can ship. | table: Eight steps (receiving, put-away, slotting, wave or batch release, picking, packing and cartonization, shipping confirmation, cycle counting), each with a plain definition and what it changes. |  |\n| p11 | explanation | Picking methods organize the pickers' travel differently, by collecting several orders in one trip (cluster picking) or their items together for separation at packing (batch picking), as Odoo and Picqer document, while larger products such as Manhattan's also release different order types together. | source: Odoo (waves, cluster and batch picking), Picqer (batch pick lists and routes), Manhattan's Order Streaming (n.d., accessed November 2026). | `elaboration`: Wave or batch release and picking as steps. → How picking routes are organized. |\n| p12 | context | WMS products also serve buildings of different complexity, from basic location tracking to highly automated warehouses, and Duiven uses locations, waves and scanning with no automation. | source: Infios, formerly Körber Supply Chain Software, complexity levels (n.d., accessed November 2026). | `additional_support`: How products organize picking. → How products differ by the building they serve, and where Duiven sits. |\n| p13 | claim (list) | Three facts about warehouse work shape every integration decision in the chapter: work has a release policy, the building has finite capacity, and its facts are physical, which makes the WMS the system of record for stock. | source: DeHoratius and Raman, Management Science 2008: 65% of nearly 370,000 stock records inaccurate across 37 stores of one retailer (older, pre-RFID). | `cause_effect`: The steps and the different buildings products serve. → The three facts that follow from them and that the rest of the chapter uses, stated as their consequence. |\n\n### How the Warehouse Connects to Everything Else\n\n**Controlling idea** (`explanation`, id `connects`): Seen from outside the warehouse has four interfaces, and each needs its own contract: a fulfillment order it accepts or rejects, on-hand stock it alone writes and reports as events, a working day whose cut-off, capacity and release policy the promise must read, and wholesale labels and despatch advices generated from what it packed.\n\n**Advances the thesis** (S2, S3, S4, S5): Argues each of the chapter's contract claims in turn.\n\n**Transition in:** `elaboration`: The three facts about warehouse work and the WMS as the system of record for stock. → The warehouse seen from outside: its interfaces to the rest of the landscape.\n\n**Order of paragraphs** (`grouping`): The four interfaces and their requirements first, then one group per thing the warehouse receives or owns: the instruction, the stock, the day and the wholesale documents. The instruction comes first because the stock and confirmations are its results; the day follows stock because the promise needs both; wholesale comes last because it applies the confirmation rule to pallets.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | claim | Seen from outside, a warehouse has four interfaces (instructions in, confirmations out, stock events out and inbound goods in), and its instructions come from whichever system holds the orders: the shop platform today and the order management system (OMS) from Q4 2027; the section takes the instruction and its shipment confirmation first, then the stock the warehouse reports, then its working day, which no interface carries yet, and last the wholesale pallet's label and despatch advice, while inbound receipts are only listed. | figure: Figure 1: the four interfaces around the physical steps. |  |\n| p15 | analysis | Each interface has different requirements for freshness, consistency, speed and availability, stated for a merchant of Kestrel & Pine's shape with assumed latencies. | table: Five flows (fulfillment order in, shipment confirmation out, stock events out, cancellation request in, inbound receipt) by freshness, consistency, speed and availability; latencies marked as assumptions. | `elaboration`: The four interfaces. → What each requires. |\n| p16 | definition | A fulfillment order instructs the warehouse to ship specific order lines from a location, excludes prices, payment and history, and has its own lifecycle: requested, accepted or rejected, in progress, shipped (possibly in several parcels) or closed incomplete. |  | `elaboration`: The instruction interface and its exactly-once requirement. → The instruction itself: the fulfillment order. |\n| p17 | evidence | Shopify documents this contract for third-party warehouses: each fulfillment service maps to a location, receives fulfillment and cancellation requests, and must accept before it can create a fulfillment. | source: Shopify developer documentation (FULFILLMENT_REQUEST, CANCELLATION_REQUEST; request statuses SUBMITTED, ACCEPTED, REJECTED, CANCELLATION_REQUESTED/ACCEPTED/REJECTED; n.d., accessed November 2026). | `example`: The fulfillment order and its lifecycle. → A documented implementation of it. |\n| p18 | evidence | Kibo documents a similar sequence (Accept Shipment, Validate Stock, Ready and Fulfilled) with transfer or reassignment between locations. | source: Kibo fulfillment documentation (n.d., accessed November 2026). | `similarity`: Shopify's documented handshake. → A second vendor's version of the same acceptance step. |\n| p19 | analysis | After acceptance picking or packing may already have started, so changing a storefront status cannot stop physical work and the warehouse must confirm a cancellation before support promises that nothing will ship. |  | `cause_effect`: Acceptance as a step two vendors document. → Why a cancellation after it is a request the warehouse answers. |\n| p20 | example | Waypoint's design for late 2027, with Eva's order as the example, shows the handshake carried by the iPaaS with an idempotency key and a cancellation that arrives too late. | figure: Figure 2: the fulfillment-order handshake. | `example`: The documented handshake and why a late cancellation is a request. → Kestrel & Pine's own version of it, with a cancellation that arrives too late. |\n| p21 | analysis (list) | This contract prevents four practical problems: unnecessary data reaching the warehouse, ambiguous splits, unconfirmed changes and duplicate shipments after a retry. |  | `cause_effect`: The handshake at work. → What it prevents. |\n| p22 | claim | What comes back for each fulfillment order is one shipment confirmation per parcel, built from what was packed and carrying its tracking number, with a partial shipment reported as partial rather than as a fulfilled order. |  | `sequence`: The instruction and the four problems its contract prevents. → The shipment confirmation that answers it. |\n| p23 | analysis | The contract, instruction and confirmation, stays the same under Waypoint decision W2, in which an OMS replaces the shop platform as the sender in Q4 2027 without changing the warehouse's responsibilities. |  | `additional_support`: The contract both ways: the instruction and its confirmation. → Why it survives the coming change of sender. |\n| p24 | definition | Stock has three meanings here (on hand, committed and available), and the chapter concerns the first, the number of units physically in the building. |  | `sequence`: The instruction the warehouse receives, the confirmation it sends back and the change of sender they survive. → What the warehouse owns: stock. |\n| p25 | claim | Each stock state has one writer (the WMS writes on hand, the order system committed, and the availability service derives available), and Kestrel & Pine's App That Wrote Stock and its May 2027 reconciliation show what happens when the rule is broken. | case: The App That Wrote Stock (March 2026: a pre-order app and the WMS feed both adjusted the platform's inventory); the first reconciliation of May 2027 found 2.3% of active variants differing between WMS and platform.; figure: Figure 3: one writer per stock state. | `elaboration`: The three meanings of stock. → Who may write each. |\n| p26 | comparison (list) | On hand changes constantly inside the warehouse, and the rest of the landscape learns of it either by a periodic full sync, as in Shopify's hourly polling and Kestrel & Pine's chain that took up to two hours, or by stock events, as Picqer's webhook and Waypoint decision W1 provide. | source: Shopify fulfillment-service docs (hourly stock polling); Picqer API products.free_stock_changed webhook (n.d., accessed November 2026).; case: Kestrel & Pine's chain WMS to ERP to platform to marketplace connector: a sale took up to two hours to reduce the stock shown elsewhere on Black Friday. | `cause_effect`: The WMS as the only writer of on hand. → How its changes reach the systems that hold copies. |\n| p27 | analysis | Events are better once order volume makes lag visible but harder, because a lost event leaves a stale copy until a reconciliation catches it, so the warehouse emits every change with a reason and publishes a daily full snapshot as the baseline. |  | `contrast`: The two patterns. → Their trade-off and the warehouse's part in making events safe. |\n| p28 | claim (list) | Besides its stock, the warehouse owns its day, and three facts every timing promise rests on rarely appear in any API: the cut-off (at Duiven the 21:00 final wave before the 22:30 PostNL collection, while the storefront's 22:00 line dates from the Tiel 3PL), capacity and the release policy. | case: Duiven's 21:00 final wave and 22:30 PostNL collection (illustrative times); the storefront's 'ordered before 22:00' line from the Tiel era, not updated in 2023. | `sequence`: Stock, the second thing the warehouse owns. → The third: its working day. |\n| p29 | claim | Cut-off, capacity and release policy belong in the data the delivery promise is computed from, and until they are, the promise is a sentence. |  | `cause_effect`: The three facts of the warehouse's day. → Where they must go: the delivery promise. |\n| p30 | context | A parcel and a wholesale pallet leave the same building through different processes, and a large retail customer expects a label on each logistics unit and an electronic message announcing what is on it. |  | `contrast`: The consumer parcel and its promise. → The wholesale pallet and what retail customers expect. |\n| p31 | definition | The SSCC is the GS1 identifier of a logistics unit, the 18-digit number on the pallet label, and the despatch advice (DESADV, also called an ASN) tells the receiver what is coming pallet by pallet. | quotation: GS1 General Specifications, Release 26.0 (January 2026): the SSCC is 'the GS1 identifier for an individual logistics unit' and 'the only GS1 key that SHALL be used as the identifier of a logistic unit'. | `elaboration`: A label and a message. → What each is. |\n| p32 | evidence | Retailers enforce these rules: bol requires GS1 labels and the SSCC in DESADV messages, and Jumbo refuses deliveries without a matching DESADV and charges €70 per non-compliant message. | source: bol SSCC page (since 31 December 2021; n.d., accessed November 2026); Jumbo mechanized-DC guidelines (2025) and purchasing conditions (9 April 2026, €70 per message). | `additional_support`: The SSCC and the DESADV. → Retailers that enforce them, with penalties. |\n| p33 | comparison | Retail chargebacks come in two families, delivery performance (a logistics problem) and data and label compliance (an architecture problem), as Jumbo's delivery-performance penalty shows beside its message fee. | source: Jumbo purchasing conditions (€250 per order below 90% on time and in full on an order line). | `contrast`: Jumbo's fee for a non-compliant message. → Its separate penalty for late or incomplete deliveries, and the two families of chargebacks. |\n| p34 | claim | The DESADV must be generated from what the warehouse actually packed, never from the order, as Kestrel & Pine's €14,200 ASN Chargeback and Waypoint decision W6 show, with Bergzicht's April 2027 reorder as the first cycle under the new rule. | case: ASN Chargeback (Q3 2026): €14,200 deducted by Bergzicht because the DESADV came from the ERP's view of the order while the WMS packed something different; W6 moves SSCC generation to the WMS at pack time; Bergzicht's spring reorder (240 units, 18 SKUs, three pallets, delivered to Zwolle on 9 April 2027). | `cause_effect`: Data and label compliance as the architecture family of chargebacks. → Where the message must be generated to avoid them. |\n\n### The Choices: Who Runs the Warehouse Software\n\n**Controlling idea** (`comparison`, id `choices`): A merchant has four ways to get warehouse execution (an ERP module, a dedicated WMS, a 3PL or a marketplace fulfillment program), each fitting different conditions, and whichever it chooses the integration stays the same contract and the warehouse system must not become a second order system.\n\n**Advances the thesis** (S6): Shows the contract is independent of who runs the warehouse software.\n\n**Transition in:** `contrast`: The contract the warehouse system needs with the rest of the landscape. → The choice of who runs the warehouse software.\n\n**Order of paragraphs** (`comparison`): The four options in rising order of how much the merchant hands over, then the shared-pool variant of the last, then what that stock is for the merchant (the paragraph the comparison table follows), then the recommendation that follows from the table.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p35 | claim | A merchant has four realistic ways to get warehouse execution, and most use two at once. |  |  |\n| p36 | description | The ERP's warehouse module is one system and one integration fewer and fits one building with modest volume and simple routes, but strains when waves, labor or several companies must be managed. | source: Odoo Inventory (n.d., accessed November 2026). | `sequence`: The four ways. → The first: the ERP's module. |\n| p37 | description | A dedicated WMS ranges from small cloud products to enterprise products with labor planning, automation and multiple sites, and should be chosen against the building's workflow and integration requirements. | source: Picqer (about 25 to 5,000+ orders daily); Manhattan, Blue Yonder, Infios (n.d., accessed November 2026). | `sequence`: The ERP's module. → The second: a dedicated WMS. |\n| p38 | description | A 3PL runs the building on its own WMS and is integrated exactly like the merchant's own WMS, so it fits when volume, geography or season does not justify a building and fails when the merchant's process is the product. |  | `sequence`: Software the merchant runs. → The third: a provider that runs the building. |\n| p39 | description | A marketplace's fulfillment program stores and ships the seller's stock for fees per unit, order and storage period, delegating operations while making the seller dependent on that network's rules. | source: Amazon FBA (n.d.); Zalando ZFS (launched autumn 2017, 100+ partner brands by June 2019, older source); ZFS invoice structure updated 16 February 2026 (€0.15 peak surcharge per outbound order from 15 October to 31 January). | `sequence`: A provider that runs one building for the merchant. → The fourth: a marketplace's network. |\n| p40 | example | Zalando's ZEOS extends the program to brands' other channels through a single shared stock pool, which is the availability problem run by the provider instead of the merchant. | source: Zalando: ZEOS announcement (October 2023), NEXT partnership (November 2024), letter to shareholders of 12 March 2026 (24 markets, 18 sales channels). | `elaboration`: The marketplace fulfillment program. → Its extension to other channels. |\n| p41 | analysis | For the merchant, marketplace-held stock is a location it can see but not count, a separate location with its own buffer fed by an inbound flow; Kestrel & Pine sends about 40% of its German marketplace units to such a program. | fact: About 40% of Kestrel & Pine's German marketplace units go to the marketplace's program.; table: Five rows (ERP module, small or mid-sized WMS, enterprise WMS, 3PL, marketplace program) by fits when, limits when and what the integration looks like. | `cause_effect`: A provider-run stock pool. → What that stock is in the merchant's own availability model. |\n| p42 | recommendation | Read across the table, the integration is the same contract in every row except that marketplace stock cannot be counted, so the author's recommendation follows the requirements, not the product (platform or ERP for one location and channel, a dedicated WMS for one building with several channels, an enterprise WMS or capable 3PL for several buildings or wholesale), always behind the same contract and never letting the warehouse system become a second order system, which is how Kestrel & Pine came to count orders three ways. |  | `conclusion_summary`: The four choices side by side. → Which to choose when, and the one rule for all of them. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): Warehouse integration must grow with operational complexity through the four stages, and Kestrel & Pine bought an Omnichannel-stage WMS in 2023 but kept a Starting-stage connection.\n\n**Advances the thesis** (S6): Shows that the integration, not the software, is what falls behind as a merchant grows.\n\n**Transition in:** `sequence`: Which execution choice fits which situation. → How the setup and its warning signs change across the four scale stages.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | comparison | Which execution setup fits changes as a merchant grows, and a table follows the typical setup, what becomes necessary and the warning signs through the four scale stages. | table: Four stages (Starting, Growing, Omnichannel, Group) by typical setup, what becomes necessary and warning signs. |  |\n| p44 | analysis | Software can be bought, rented or outsourced, but integration still needs to match operational complexity, and Kestrel & Pine bought its WMS in 2023 while keeping an early-stage connection (orders pushed one by one, status pulled by the ERP, stock copied hourly). | case: Kestrel & Pine's 2023 WMS with orders pushed one by one, status pulled by the ERP and stock copied hourly. | `example`: The stage table's setups and warning signs. → Kestrel & Pine as a case of software and integration at different stages. |\n\n### Warehouse Automation and Robotics\n\n**Controlling idea** (`explanation`, id `automation`): Automation and robots sit beneath the WMS and change how work is executed, not the need to confirm physical results: each automated task needs an identity, a confirmed outcome and a recovery path, and equipment downtime belongs in the delivery promise.\n\n**Advances the thesis** (S1): Shows that adding automation keeps the chapter's contract (instructions with identity, confirmed results, capacity fed to the promise) one level down.\n\n**Transition in:** `elaboration`: The stage table, whose Group stage adds automation, and the contract the WMS keeps whatever runs it. → The layers beneath the WMS in an automated warehouse, where the same contract applies one level down.\n\n**Order of paragraphs** (`large_to_small`): Why automation is attractive and what it costs, then the four uses, then the software responsibilities and their documented division, then the task contract, then a hypothetical failure that tests it, then the advice to measure first: the contract only makes sense once the reader knows which layers send and confirm tasks.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p45 | claim | As a warehouse grows it may add automation, and moving goods automatically can free pickers' walking time, but it adds coordination work: deciding which movement happens next, confirming that it happened and recovering when equipment stops. |  |  |\n| p46 | definition | The main uses of automation differ: mobile transport (autonomous mobile robots) moves containers, goods-to-person brings stock to a stationary picker, robotic picking grasps individual items and sortation routes items or parcels to their next lane. | source: Dematic's mobile-robot and robotic-picking pages (n.d., accessed November 2026).; figure: Figure 4: four uses of warehouse automation. | `elaboration`: Automation in general. → Its four main uses. |\n| p47 | definition | Automated warehouses commonly divide the software into four responsibilities (WMS, warehouse execution system, warehouse control system and robot fleet management); the names describe jobs that products may combine. | table: WMS owns stock and tasks; WES releases and sequences work; WCS commands equipment; fleet management assigns robot tasks. | `sequence`: The physical equipment. → The software layers that direct it. |\n| p48 | evidence | Dematic's software overview and SAP's 2023 integration guide document this division, with warehouse orders becoming robot tasks and notifications returning to confirm the warehouse work. | source: Dematic software overview (n.d., accessed November 2026); SAP Warehouse Robotics, End-User Information for Integration via Fleet Management Systems (2023-12-20).; figure: Figure 5: the WMS, WES, WCS and fleet stack. | `additional_support`: The four software responsibilities. → Public documentation of the division and of confirmations flowing back. |\n| p49 | recommendation (list) | The author recommends keeping the order system connected to the WMS through fulfillment orders (the instruction to ship specified in the previous section) and requiring, inside the warehouse, an explicit contract for each automated task: a stable identity and instruction, a confirmed outcome from which the WMS updates stock, and recovery that queries the existing task before retrying. | source: SAP's guide on exception queues and physical checks before closing stalled tasks. | `cause_effect`: Work sent down and confirmations returned. → What each automated task must carry for that to be safe. |\n| p50 | example | If Daniel later added robots, a robot that accepted a transfer, lost connectivity and delivered anyway would need the integration to recover that transfer's result rather than issue a new one, and the container reaching packing would still not prove the parcel shipped. | scenario: Hypothetical: a robot transfer at Duiven times out and is delivered anyway (labelled 'Suppose').; figure: Figure 6: task T-4711 and its timeout story. | `example`: The task contract. → A hypothetical Duiven failure that tests it. |\n| p51 | recommendation | Before buying automation, measure where work waits, because faster transport helps only while packing and dispatch can absorb it, and feed queue age, equipment availability and reduced capacity into the delivery promise. | figure: Figure 7: faster transport, same bottleneck. | `contrast`: Automation's coordination risks. → Whether it helps at all, and what it changes in the promise. |\n\n### In Practice\n\n**Controlling idea** (`example`, id `in-practice`): Kestrel & Pine's own orders show its early-stage connection at work: Eva's late parcel and the Black Friday queue are one gap between the promise and the warehouse, closed by a queue, batches, a backlog monitor and a moving cut-off.\n\n**Advances the thesis** (S5, S2): Works the promise-versus-warehouse gap through two Kestrel & Pine cases and names the remedy.\n\n**Transition in:** `contrast`: Automation as a hypothetical for Duiven, after Kestrel & Pine's stage-3 WMS behind an early-stage connection. → Back at manual Duiven, Kestrel & Pine's own orders worked through that connection.\n\n**Order of paragraphs** (`small_to_large`): One order (Eva's) first, then the same gap at Black Friday scale, then its remedy: the evening reads as Eva's problem multiplied, so Eva comes first, and the remedy can only be named once the gap is seen at scale.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | example | Eva's order, created in the WMS at 21:16 after the 21:00 final wave, is picked in the 06:30 wave on 14 April, confirmed at 08:40 and delivered on Thursday 15 April against a promise of Wednesday, because the promise was not computed from the warehouse. | case: Order #1072455: placed 21:14, in the WMS 21:16 (illustrative), 06:30 wave with about 180 other orders (illustrative), 1.1 kg box, confirmed 08:40 with tracking number and stock event, collected that evening, delivered 15 April; promised 14 April. |  |\n| p53 | example | Black Friday 2026 is the same gap at scale: 2,300 orders in the peak hour against an iPaaS flow, falling behind since the early afternoon, that created orders one at a time with several calls each and was throttled by the WMS vendor's rate limit, a four-hour backlog by 21:00 and roughly 8,000 orders that missed next-day delivery while the storefront promised it. | case: Peak hour 20:00 to 21:00: 2,300 orders (38 a minute); the iPaaS flow created orders one at a time with several API calls each and was throttled (illustrative mechanism); backlog four hours by 21:00; roughly 8,000 orders between 17:00 and midnight missed next-day delivery (assumption); Picqer publishes an API limit of about 500 requests per minute (n.d., accessed November 2026) as an example of a vendor rate limit. | `similarity`: Eva's single order that missed its promise. → The same gap for thousands of orders. |\n| p54 | recommendation | What would have prevented it is not a faster warehouse but a queue allowed to grow without failing checkout, batched order creation within the rate limit, a monitor on the age of the oldest unprocessed order and a cut-off that moves with that age, all on Waypoint's list under W2 and W5. | figure: Figure 8: the Queue That Waited and its cure. | `problem_solution`: The four-hour backlog and the broken promise. → The four remedies. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`analysis`, id `wrong`): Beyond the Black Friday queue, the warehouse interface fails in seven recognizable ways, each with a detection and a recovery that the contract makes possible.\n\n**Advances the thesis** (S2, S3, S5): Shows each element of the contract by what happens without it.\n\n**Transition in:** `contrast`: The remedies for the Black Friday queue. → The other ways the warehouse interface fails.\n\n**Order of paragraphs** (`grouping`): Failures of the instruction first (duplicates, late cancellations), then of what comes back (confirmations and the short picks behind partial ones, then stock events), then of shared identifiers, then of availability: the order the earlier sections built the contract in.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p55 | claim | Beyond the Black Friday queue, the warehouse interface fails in a small number of other recognizable ways, each with a detection and a recovery. |  |  |\n| p56 | analysis | A retried instruction creates two pick lists and two jackets unless every message carries a fulfillment-order identity and the WMS creates idempotently, alerting instead of picking twice. |  | `sequence`: Failures with detections and recoveries. → The first: duplicate fulfillment orders. |\n| p57 | analysis | A cancellation made in the shop platform after the WMS accepted the order ships anyway unless the cancellation is a request with an answer the platform shows, so the order stays in progress and the item comes back as a return. |  | `sequence`: A duplicated instruction. → An instruction withdrawn too late. |\n| p58 | analysis | A shipment confirmation that is lost, or that marks a whole order fulfilled when only one of its parcels has left, leaves the shop platform, the WMS and the ERP telling different stories, as Kestrel & Pine's Three-Status Order shows; a per-shipment reconciliation detects it and a replay from the WMS repairs it. | case: Order #1052877 (December 2026): the fleece shipped first; the iPaaS flow, with no notion of a partial shipment, marked the whole order fulfilled on that first confirmation, so the platform showed Delivered, the WMS In picking while the socks waited, and the ERP, which invoiced only on 'order complete', Not invoiced for six days. | `sequence`: Failures of the instruction. → Failures of what comes back: the shipment confirmation. |\n| p59 | analysis | A short pick, where the record said one and the shelf has none, is recorded against the fulfillment order, which then ships partially or closes incomplete while the order system decides what to do with the line. |  | `cause_effect`: A confirmation that must report a partial shipment as partial. → The commonest cause of a partial shipment: an empty location at pick time. |\n| p60 | analysis | Stock events that arrive out of order or not at all leave the available figure wrong until sequence numbers and a reconciliation catch them and the daily snapshot is reapplied. | case: Kestrel & Pine's May 2027 reconciliation (2.3% of active variants differing). | `sequence`: Failures of the shipment confirmation, including the short pick behind a partial one. → The other message that comes back: stock events. |\n| p61 | analysis | A SKU that differs between the shop platform and the WMS by a suffix, case or leading zero rejects or misroutes the fulfillment order until one identifier family is owned by the product system and published to both. | source: Shopify: SKU strings are case-sensitive (n.d., accessed November 2026). | `sequence`: Stock figures that drift between the warehouse and its copies. → A failure in the identifiers both sides share. |\n| p62 | analysis | A WMS outage on a peak evening is detected by the age of the oldest queued order and recovered with the same remedies as the Black Friday queue: queue rather than fail checkout, release in batches within the rate limit, move the cut-off while the backlog is old. |  | `sequence`: Failures of single messages and identifiers. → The failure of the whole warehouse system. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The missing jacket, Eva's Wednesday promise and the Black Friday queue look like a stock error, a storefront sentence and an integration fault; read together they are one failure, a promise made from a copy or a sentence instead of from the warehouse's own facts, and the chapter's contract (a keyed fulfillment order with an answer, one writer of on hand, confirmations from what was packed, a cut-off read from the queue) is the one remedy for all three.\n\n**So what:** A merchant can write the fulfillment-order contract, name the one writer of on-hand stock and feed the cut-off and backlog to the promise before it buys a WMS, a 3PL or robots; Kestrel & Pine's Black Friday remedy was a queue, batches, a monitor and a moving cut-off, not a faster warehouse.\n\n**Callback:** The opening's picker who finds no jacket for a paid order. The first paragraph of the conclusion names the warehouse fact each failure ignored and what the warehouse must receive and report so the shop's promise holds.\n\n**Takeaway** (`course_of_action`): Write the fulfillment-order contract with its key and its answer, name the one writer of on-hand stock, feed the cut-off and backlog to the delivery promise, and take the ten questions to your own warehouse.\n\n**Hand-off** to [Getting It There: Carriers, Labels, Tracking and the Delivery Promise](shipping-and-delivery.html): `sequence`: The parcel packed and confirmed at Duiven, and the cut-off, capacity and backlog that the storefront's promise ignored. → The carrier's part: labels, manifests and tracking events, and a delivery promise computed from the warehouse's facts and the carrier's transit time.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p63 | synthesis | The opening's missing jacket, Eva's day-late parcel and the Black Friday queue are one failure: a promise made from a sentence or a copy instead of from the warehouse's own facts; a fulfillment order with a key and an answer, one writer of on-hand stock, confirmations built from what was packed and a cut-off read from the queue let the shop promise only what the warehouse can do. | reasoning: The opening's picker who finds no jacket, set against the chapter's contract. |  |\n| p64 | synthesis (list) | Established: warehouses have finite capacity and carrier deadlines, documented fulfillment models have an acceptance step, stock records drift without counting, and large retail customers require SSCC-labelled units announced by a matching DESADV. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what the sources establish. |\n| p65 | synthesis (list) | Depends on context: an ERP module suits a simple building, outsourcing suits seasonal or regional volume, periodic sync works while its lag is shorter than a sell-out, and DESADV generation from packing matters only for merchants with retail customers. |  | `contrast`: What is established. → What changes with the merchant's situation. |\n| p66 | recommendation (list) | The author's synthesis: keep fulfillment instructions and confirmed results stable when changing vendors or adding robots, and compute delivery promises from remaining capacity, queues and carrier deadlines. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p67 | recommendation (list) | Ten questions let the reader check, in their own company, what the warehouse receives, the acceptance step, timeout recovery, who writes on hand, how stock changes travel, reconciliation, the cut-off, the order feed's capacity, wholesale labels and the outage plan. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own company. |\n| p68 | transition | With Eva's parcel packed and confirmed at Duiven, the carrier takes over, and the next chapter follows carrier selection, labels and tracking and builds a delivery promise from the warehouse's cut-off, capacity and backlog that the storefront's sentence ignored. |  | `conclusion_summary`: The questions about the reader's own warehouse. → The packed parcel handed to the carrier and the promise the next chapter computes. |\n\n## Non-goals\n\n- Robot selection, mechanical design, motion planning and machinery safety engineering; the automation section covers integration responsibilities and operational consequences.\n- Available-to-promise, reservations, allocation, safety stock and the availability service as such; this chapter uses on hand, committed and available only to say what the warehouse writes. See [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html).\n- The order state machine, order splits, sourcing and routing, and the OMS as a product. See [The Order Record: Lifecycle, State and the Order Management System](order-management.html).\n- Carrier selection, labels, manifests, tracking events and the computed delivery promise; this chapter only exposes cut-off, capacity and the release policy as its inputs. See [Getting It There: Carriers, Labels, Tracking and the Delivery Promise](shipping-and-delivery.html).\n- EDI messages, Peppol, mapping and partner onboarding; this chapter decides only where the SSCC and the DESADV are generated. See [Documents Between Companies: EDI, Punchout and E-Invoicing](edi-and-e-invoicing.html).\n- Returns receiving, grading and dispositions. See [The Way Back: Returns, Exchanges, Refunds and Reverse Logistics](returns-and-exchanges.html).\n- Store stock, click-and-collect and ship-from-store. See [Stores Are Systems Too: Point of Sale and Omnichannel Fulfillment](stores-and-omnichannel.html).\n- Peak planning, queues and backpressure in general; the chapter shows the Black Friday queue from the warehouse's side only. See [Black Friday Every Year: Peak Load, Resilience and Recovery](peak-load-and-reliability.html), [Journey 4: Black Friday, Hour by Hour](journey-peak-day.html).\n\n## Modalities\n\nArticle only.\n\n## Open questions\n\n- Check finding: both flow readers found Warehouse Automation and Robotics a detour between the Black Friday setup (Setting the Scene) and its payoff (In Practice) and would place it after In Practice; the order is the spec's (round 4, fault spec).\n- Check finding: the failure-patterns callout names The First Snowfall, Schrödinger's Order and The Phantom Stock while the body uses the Queue That Waited, the Three-Status Order and the App That Wrote Stock without linking them; both flow readers had to map them. The fix spans several units (round 4, fault draft).\n- Check finding: both flow readers found the vendor paragraphs in What a WMS Does (¶2–¶4, 'Products also serve different buildings') out of place or loosely tied to the three facts (round 4, fault unclear).\n- Check finding: both flow readers found the Zalando ZFS/ZEOS history in Choices ¶5–¶6 a digression before the point 'a location it can see but not count'; trimming it spans two units (round 4, fault draft).\n- Check finding: 'short pick' also appears in the Figure 1 caption before Connects ¶9 glosses it (round 4); the page is at its 6,500-word cap.\n\n## Decision log\n\n- **2026-11-12** — After the confirming round 3 (escalate: 17 passed, 9 failed, 5 corroborated, 1 of them a spec fault), cheap, plainly right fixes without another round, auto-resolved by the author's standing instruction of 2026-11-12: (rule 3) the automation section moves after Across Scale Stages, the move both round-3 flow readers asked for; its opener, The Choices' opener, In Practice's opener, the roadmap and the flow ration
