<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/44-organizing-commerce-engineering/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (a thesis paragraph, a roadmap, a conclusion paragraph that answers the opening); these are recorded in decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The five duties of an owner (decide the contract, change, watch, fix, retire), why ownership follows money (an agency is paid to build and, on a platform's partner program, for keeping the merchant on the platform; a vendor to keep the subscription), and the ownership map's columns and its two rules (every row has a technical owner inside the company; no fact has two writers).\n- **Know:** Four team shapes (by system, by journey, by layer, agency-led) in Team Topologies' terms and the recommendation for ten to twenty people; the rules for agencies and partners; the vendor card; light governance (decision records, standing rules checkable from the map, a weekly architecture hour); the merchant's product manager; environments, release management, feature flags and AI coding tools; and team shape by scale stage.\n- **Know:** Kestrel & Pine before and after: in January 2027 thirteen systems, 34 integrations of which 13 had no named owner and 41 apps of which three wrote inventory; the Deprecated Endpoint of 8 February 2027; five integrations still unowned in April 2027, among them the scripts behind the Deprecated Endpoint, the Price Drift and the App That Wrote Stock; and from April 2027 two journey teams, an integration pair, a data pair, decision records KP-001 to KP-008 for W1–W8 and a weekly architecture hour.\n- **Believe:** Most incidents at a merchant on rented software trace to code with no owner rather than to bad code.\n- **Believe:** A team per vendor reproduces the integration problem in the organization chart.\n- **Believe:** The team shape should change one stage before the system landscape does, because the owner must exist before the connector is built.\n- **Be able to:** Draw an ownership map with one row per system, integration and app and check it for blank owners and duplicate writers.\n- **Be able to:** Choose a team shape for their size and write the agency and vendor clauses that keep the repository, credentials, map and decision records with the merchant.\n\n**Audience:** Newcomers to commerce architecture; most of all the new engineering lead or head of digital who inherits an agency, a partner-built connector and a dozen vendor contracts (Noor Visser at Kestrel & Pine). Product managers and operations leads who must decide who to call when a flow fails are the second readers.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its 2026 and early 2027 incidents in outline (among them the App That Wrote Stock, the Price Drift and the Deprecated Endpoint) and the names of the sixteen failure patterns (among them the Lynchpin, the Secret Agent, the Spaghetti Junction, the Pulled Rug).\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines, 'system', 'the shop platform' for the hosted product and 'commerce platform' for the whole set of systems, the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system (OMS), availability service, D2C, B2B, PIM, POS.\n- From chapters 41 to 43: W4 (stay and surround), migration one seam at a time, and the stage map of April 2027 that sorts decisions by stage, including who builds and runs at each stage.\n\n**Does not yet know:**\n\n- Owning as five duties; the ownership map; the vendor card; integration contract; ADR (architecture decision record); statement of work.\n- Sandbox; API version and deprecation; rate limit; scope; SLO and SLA; feature toggle.\n- Conway's observation; Team Topologies' team types (stream-aligned, platform, enabling, complicated-subsystem) and interaction modes; GMV as used in partner programs.\n- The public evidence on agencies, Zalando's and Uber's autonomy lessons, and the DORA and METR findings on AI coding tools.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given an incident in which a published vendor change broke an unowned script, the reader names the missing owner and the map row that prevents it, rather than blaming the vendor or the agency. *Probe:* A marketplace connector retires an API version on its published date; an agency script written years earlier stops sending stock to the marketplace, and nobody notices for two days. The agency says the script is outside its retainer; the e-commerce manager did not know it existed. Using only this chapter: what was missing, and what would have prevented it? | `custom` | cold_reader | major |\n| AC-2 | The reader can say why a team organized by vendor fails at a merchant and what shape replaces it at their size. *Probe:* A merchant with twelve engineers has one person or small team per vendor system: the platform, the ERP, the WMS, the marketplace connector. Using only this chapter: what is wrong with that shape, and what should replace it? | `custom` | cold_reader | major |\n| AC-3 | The reader can list the contract terms that keep an agency or partner from becoming a Lynchpin. *Probe:* A merchant is about to renew its agency's statement of work. Using only this chapter: which terms keep the agency from becoming a single point of failure? | `custom` | cold_reader | major |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** Who should own each part of a commerce platform, and how do small teams work with vendors and agencies?\n\n> **Claim:** Every system, integration and app needs a technical owner inside the merchant who decides, changes, watches, fixes and retires it, recorded on one ownership map with exactly one system writing each fact, because agencies and vendors are paid to build and to keep the subscription, not to own a connector after launch. At the Omnichannel stage, with ten to twenty people, the rule is met by journey teams, an integration pair, and agency and vendor contracts that leave the repository, credentials and map with the merchant.\n\n**Disputed by:** The view that a merchant on rented software can leave ownership with its suppliers: the vendor runs the platform, the agency owns the theme and scripts on retainer, partners own their connectors, and the merchant's own team is organized one person per vendor to manage them.\n\n**So what:** A merchant that accepts the claim makes the ownership map its first governance artifact and fills its blank cells before adding systems. In January 2027 Kestrel & Pine had 34 integrations, 13 with no named owner; on 8 February a 2021 agency script stopped sending stock to bol for two days after the connector retired an API version. By April five were still unowned, among them that script, the German price-list export behind the Price Drift (€179 instead of €199 for nine days, about €8,200 of margin) and the pre-order app's inventory write: three of the ten incidents of 2026 and early 2027 sat in blank cells of one spreadsheet. From April 2027 two journey teams, an integration pair and a data pair own the rows, and the agency's statement of work lists each of its nine scripts with an owner and a pinned version.\n\n**How and why:** An agency is paid by the merchant to build, and by the platform's partner program to keep the merchant on the platform; a vendor is paid to keep the subscription. Neither is paid to decide, watch or retire a connector after launch, so those duties fall to nobody unless assigned. Because organizations produce designs that copy their communication structures, a team per vendor leaves the flows between vendors without an owner, while journey teams own the flows end to end and an integration pair owns the shared layer. The map turns the rules into checks that need no meeting: no blank owner, no fact with two writers, every API version pinned with its retirement date.\n\n**Supporting claims**\n\n- **S1** — Most incidents at a merchant on rented software trace to code with no owner rather than to bad code; owning means five duties (decide the contract, change, watch, fix, retire), and because agencies are paid to build and vendors to keep the subscription, ownership must be designed by the merchant.\n- **S2** — The ownership map, one row per system, integration and app with business owner, technical owner, builder and vendor, what it may write, contract, dependencies and monitoring, is the merchant's first governance artifact; its two rules are that every row has a technical owner inside the company and that no fact has two writers.\n- **S3** — A team per vendor reproduces the integration gaps in the organization chart; at ten to twenty people one or two journey teams, an integration pair that owns the integration layer as an internal product, a small data function and vendors and agencies as services under contract fit, with a shared integration standard; below eight engineers, one journey team and one integration engineer.\n- **S4** — Agency and vendor contracts must keep the repository, accounts, credentials, map and decision records with the merchant, name the API versions and a deprecation clause, write down ownership after launch before launch, and record each vendor's versioning, limits, exit terms and service levels on a vendor card.\n- **S5** — Governance light enough for fourteen people to follow keeps the ownership decisions true: decision records, standing rules checkable from the map and a weekly architecture hour, product managers who own the order's journey, and engineering practices (sandboxes, pinned versions, feature flags, AI tools under tests and review) that suit rented software.\n- **S6** — The team shape should change one stage before the system landscape does, because the owner must exist before the connector is built.\n\n## Role in the part\n\nAnswers who takes and keeps the part's decisions: the ownership map, team shapes for a small merchant, agency and vendor terms and light governance, with Kestrel & Pine's January and April 2027 maps. Supports P10-4 of part `part-10`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in owning to map to teams: the definition of owning before the map that records owners, and the map before the teams that fill its rows; `comparison` in team shapes: four options compared, then a recommendation)\n\nThe scene states the problem as Kestrel & Pine meets it (an incident in an unowned script, a map with blank cells). 'What Owning Means' defines the term the map records and explains why suppliers will not carry it; 'The Ownership Map' then specifies the artifact. Team shapes (with the product manager each journey team needs), agency rules and the vendor card are the ways the rows get filled, from inside to outside the company; governance and engineering practices keep them filled over time. The merchant's product manager is a paragraph of 'Team Shapes', right after the recommendation, because it staffs the journey teams that recommendation names; as a separate section (the earlier order) it split the recommendation from the stage table that extends it, as both round-2 readers reported. 'Across Scale Stages' follows at once because its table extends the team-shape comparison across the four stages; placed later (the earlier order) it split the Kestrel & Pine story just before the case resolves and left the reader asking why a team-shape table came after the practices, as both round-1 readers reported. 'In Practice' then follows the practices directly, so the case runs without a detour; 'In Practice' then shows the case before and after and replays the opening incident; 'When It Goes Wrong' comes last because each failure is read against the artifacts already defined. Putting team shapes before the map would leave the teams without the rows they are meant to own; putting the incident replay before the map and the vendor card would replay it with tools the reader has not met.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): An order appears in checkout but never reaches the warehouse, while the platform vendor, the connector partner and the agency each confirm that their own component is working.\n\n**Bridge:** Anyone who has reported a problem to several suppliers and been referred from one to the next. → In commerce, the flows between suppliers belong to nobody unless the merchant assigns them, so ownership is designed, not inherited.\n\n**Thesis statement** (KEY POINTS callout and paragraph p05): Every system, integration and app needs a technical owner inside the merchant, recorded on one ownership map with one writer per fact, because agencies and vendors are paid to build and to keep the subscription; at ten to twenty people the rule is met by journey teams, an integration pair, and contracts that leave the repository, credentials and map with the merchant.\n\n**Roadmap** (Paragraph p06):\n\n- Start from Kestrel & Pine's ownership map and the incident behind it. *Kept in:* scene.\n- Define owning and set out the map. *Kept in:* owning, map.\n- Compare team shapes, place the merchant's product manager in them, and show how the shape changes by scale stage. *Kept in:* teams, stages.\n- State the agency rules and the vendor card. *Kept in:* agencies, vendors.\n- Describe light governance and engineering practices on rented software. *Kept in:* governance, practices.\n- End with Kestrel & Pine before and after, and what goes wrong. *Kept in:* practice, wrong.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | An order can appear in checkout and never reach the warehouse while the platform vendor, the connector partner and the agency each confirm that their own part works; supplier contracts do not necessarily assign the whole path, so the merchant must own it explicitly. | scenario: An order in checkout that never reaches the warehouse; three suppliers each reporting their component working. |  |\n| p02 | explanation | The owner needs authority and information to follow a flow across supplier boundaries, so the chapter asks who defines, watches, changes and recovers a flow, so that an incident does not become referrals between vendors. |  | `problem_solution`: The order lost between suppliers. → The owner who can follow the flow, and what the chapter covers to create one. |\n| p03 | context | After the previous chapter's stage map recorded who builds and runs at each stage, this chapter takes the people at one stage: a merchant with about a dozen engineers, an agency and several vendors, whose job is to coordinate suppliers and integrations, unlike the platform vendors whose much larger teams build the products (Part XI). |  | `sequence`: The previous chapter's stage map and its row on who builds and runs at each stage. → The setting: a small merchant team coordinating suppliers, not a vendor building a product. |\n| p04 | context | Eva's jacket purchase and exchange at Kestrel & Pine are an example of such a flow: they cross several systems between 13 and 22 April 2027, each handoff is a row on the ownership map, and at each someone must own the contract, monitoring, changes and recovery; 'probably the agency' is an unresolved responsibility. |  | `example`: The small merchant setting. → Eva's order as the flow whose handoffs need owners. |\n| p05 | claim | The chapter's answer: every system, integration and app needs a technical owner inside the merchant, recorded on one ownership map with one writer per fact, because agencies and vendors are paid to build and to keep the subscription, not to own a connector; at ten to twenty people this is met by journey teams, an integration pair, and contracts that leave the repository, credentials and map with the merchant. |  | `problem_solution`: Handoffs that need an owner. → The chapter's thesis. |\n| p06 | transition | The chapter starts from Kestrel & Pine's ownership map and the incident behind it, defines owning, sets out the map, compares team shapes, places the product manager in them and shows team shape by scale stage, states the agency rules and the vendor card, describes light governance and engineering practices on rented software, and ends with Kestrel & Pine before and after and what goes wrong; it names its evidence: the case, a platform's partner payments, Conway and Team Topologies, Zalando and Uber, decision records and dated AI studies. |  | `sequence`: The thesis. → The order in which the chapter argues it. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: The Ownership Map\n\n**Controlling idea** (`example`, id `scene`): At Kestrel & Pine in early 2027 a published vendor change broke an agency script nobody owned, and Noor Visser's ownership map found 13 of 34 integrations unowned in January and 5 still unowned in April, three of them behind three of the ten incidents.\n\n**Advances the thesis** (S1, S2): Gives the case the chapter answers: incidents caused by code with no owner, and the map that finds them.\n\n**Transition in:** `example`: The roadmap's first promise: Kestrel & Pine's ownership map and the incident behind it. → Noor Visser's first weeks in 2027.\n\n**Order of paragraphs** (`chronological`): The incident first, then the map it prompted, then the tallies and what the blank cells held; the conclusion that incidents come from unowned code needs the tallies before it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | example | When Noor Visser becomes Head of Engineering in January 2027, her first inventory counts thirteen systems, 34 integrations and 41 apps; on 8 February a marketplace connector retires an API version, a 2021 agency script stops sending stock to bol, and nobody acts for two days. | case: 8 February 2027: the connector retires an API version; the 2021 agency script stops sending stock to bol; seller support escalates canceled orders two days later. |  |\n| p08 | analysis | The agency says the script is outside its retainer and the ecommerce manager did not know it existed: the Deprecated Endpoint is a published change meeting an unowned dependency. |  | `cause_effect`: The two stale days. → Why nobody acted: no one owned the script. |\n| p09 | description | To find every such dependency Noor turns that January inventory into an ownership map with a business owner and a technical owner for every system, integration and app (the full columns follow in the map section); the iPaaS belongs to the integration team under Ruben Alves, and the planned OMS and PIM need owners too. |  | `problem_solution`: An unowned dependency. → The map that names an owner for every item. |\n| p10 | evidence | The January inventory had found 13 of 34 integrations unowned; the map gave eight of them owners and five were still unowned in April 2027, the date of the table; of the 41 apps, counted separately, the agency installed 22, six were unused and three could write inventory, and five of the 13 systems had no internal technical owner. | table: April 2027 tallies: integrations 14 integration team, 9 agency, 6 vendor or partner, 5 no named owner; 41 apps, 22 installed by the agency, 6 unused, 3 writing inventory; 13 systems, technical owner known for 8. | `sequence`: The map's columns. → What the map found, dated January and April. |\n| p11 | analysis | The five still unowned in April included the bol stock script, the German price-list export behind the Price Drift and the pre-order app's inventory write, so three of the ten incidents sat in blank cells of one spreadsheet: the incidents were caused by code with no owner, not by bad code. | case: The Deprecated Endpoint (February 2027), the Price Drift (October 2026: €179 instead of €199 for nine days, about €8,200 of margin), the App That Wrote Stock (March 2026). | `example`: The five unowned integrations. → The incidents they caused and the conclusion drawn. |\n\n### What Owning Means\n\n**Controlling idea** (`definition`, id `owning`): Owning is five duties (decide, change, watch, fix, retire) that agencies and vendors are not paid to carry, so the merchant must design ownership rather than inherit it.\n\n**Advances the thesis** (S1): Defines owner and explains why ownership falls to nobody unless assigned.\n\n**Transition in:** `elaboration`: Code with no owner. → What 'owner' means, starting from the terms the definition needs.\n\n**Order of paragraphs** (`prerequisite_order`): The two terms come first because the definition of owning uses them (both round-2 readers asked for them before the duties); the definition comes before the money argument because that argument says which of the five duties suppliers do not carry.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | definition | Before owning is defined, two terms it relies on: a system of record and an integration contract. |  |  |\n| p12 | definition | To own a system, integration or app is to carry five duties (decide its contract, change it, watch it, fix it, retire it); an agency can change and, under contract, fix, but rarely decides, watches or retires. | figure: Figure 1: the five duties in a loop around one integration. | `sequence`: The two terms. → The definition of owning that uses them. |\n| p13 | cause_effect | Suppliers rarely carry the deciding, watching and retiring duties because ownership follows money unless it is designed: Shopify's partner program pays a partner a share of the platform fee and of GMV for keeping the merchant on the platform, the merchant pays for building, and nothing pays for owning a connector after launch. | fact: Shopify partner page (accessed November 2026): 20% of the monthly platform fee plus 0.1% of eligible GMV for four years; $2,500 per Plus or enterprise referral; tiers Silver to Diamond, older tiers retire 1 January 2027. | `cause_effect`: The duties an agency rarely carries. → Why: what agencies and vendors are paid for. |\n\n### The Ownership Map\n\n**Controlling idea** (`description`, id `map`): The ownership map is a table with one row per system, integration and app and columns for owners, builder, writes, contract, dependencies and monitoring, made more than documentation by two rules: every row has an internal technical owner, and no fact has two writers.\n\n**Advances the thesis** (S2): Specifies the map and its two rules.\n\n**Transition in:** `problem_solution`: Ownership that must be designed, and its five duties. → The artifact that records it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | description | The map is a table kept beside the integration inventory and reviewed quarterly, with columns for item, business owner, technical owner, builder and vendor, what it may write, contract, dependencies and monitoring, each with its reason. | table: Eight columns, what goes in each and why (for example 'what it may write' is the Secret Agent check; 'depends on' is the Pulled Rug check). |  |\n| p16 | claim | Two rules make the map more than documentation: every row has a technical owner inside the company, and no fact has two writers; at Kestrel & Pine the second rule removed the pre-order app's inventory permission and became the organizational half of W1, the decision that the WMS owns stock. | figure: Figure 2: Kestrel & Pine's ownership map in outline.; example: The pre-order app loses its inventory write; W1. | `emphasis`: The map's columns. → The two rules that make it enforceable. |\n\n### Team Shapes for a Commerce Merchant\n\n**Controlling idea** (`comparison`, id `teams`): A team per vendor copies the vendor landscape's gaps into the organization; for ten to twenty people, journey teams with their own product managers plus an integration pair, with a shared integration standard, fit best.\n\n**Advances the thesis** (S3, S5): Compares four team shapes, recommends one by size and places the merchant's product manager in it.\n\n**Transition in:** `sequence`: The map that names an owner per row. → The teams those owners belong to.\n\n**Order of paragraphs** (`comparison`): Why team boundaries matter (Conway) and the vocabulary (Team Topologies) come before the options, which are described one by one, compared in a table, and then a recommendation is made; the public cautions bound the recommendation and so follow it.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | claim | Team boundaries decide where changes can be made independently and where people must coordinate; with one team per vendor system, a customer-facing change needs a handoff at every integration. |  |  |\n| p18 | cause_effect | Conway observed that organizations copy their communication structures into their designs; in a merchant the vendor landscape is copied into the organization, so its gaps become the organization's. | quotation: Conway (1968): organizations 'are constrained to produce designs which are copies of the communication structures of these organizations.' | `cause_effect`: Handoffs at every integration. → Conway's observation, applied in reverse to a merchant. |\n| p19 | definition | Team Topologies gives the vocabulary for a small team: four team types, three interaction modes and the premise that a team can handle only so much complexity; the mapping to a merchant is the author's. | source: Skelton and Pais, Team Topologies (2019): stream-aligned, platform, enabling and complicated-subsystem teams; collaboration, X-as-a-service, facilitation. | `sequence`: The problem of copying the vendor landscape. → A vocabulary for a better shape. |\n| p20 | description | By system: the default a vendor landscape produces, cheap and matching support contracts, but every integration gap becomes an organizational gap and nobody owns the order's journey. |  | `sequence`: The vocabulary. → The first of four options. |\n| p21 | description | By journey: one team owns 'buy' and one 'fulfill and return', each touching several vendors with one owner per handoff inside a journey, and a contract between the teams for the joins between journeys. |  | `contrast`: Nobody owning the journey. → Teams that each own one journey. |\n| p22 | description | By layer: storefront, integration and data teams fit common hiring and make the integration layer a product, but the integration team risks becoming the bottleneck and nobody owns a journey. |  | `contrast`: Journey teams. → Teams by technical layer. |\n| p23 | description | Agency-led: the agency owns the storefront and apps, the merchant the accounts and a backlog; right at Starting, workable at Growing, and the origin of most Omnichannel-stage incidents when the joins stay with the agency. | table: The four shapes compared on who owns the journey and the integration layer, team size, how handoffs happen, main risk and when each fits. | `sequence`: Three in-house shapes. → The fourth, agency-led. |\n| p24 | recommendation | The author's recommendation for ten to twenty people: one or two journey teams, an integration pair (not a team, to avoid the bottleneck) that owns the integration layer, the map and the reconciliation jobs as an internal product, a small data function (the by-layer option's data team, kept small), two application support specialists shared by both journeys, and vendors and the agency as services under written contracts; below eight engineers, one journey team and one integration engineer. |  | `conclusion_summary`: The four options and their table. → The recommended combination and its size conditions. |\n| p39 | explanation | The vendor's product manager optimizes the platform's GMV, tenancy and app ecosystem; the merchant's product manager owns the order's journey and its metrics (conversion, order value, on-time delivery, returns, time to answer 'where is my order?'), so Kestrel & Pine places one product manager per journey team and treats vendor roadmaps as input. | example: Kestrel & Pine's two product managers, one per journey team. | `elaboration`: The recommended journey teams. → Each journey team's product manager, who owns the journey as a product. |\n| p25 | evidence | The first public caution: Zalando's team autonomy over technology produced similar services in six languages, which hurt productivity at scale. | quotation: Henning Jacobs (March 2020): services 'written in six languages', which 'hurts productivity at scale'; a standard stack would have been 'a major win'. | `contrast`: Autonomous journey teams with their own product managers. → A caution on how much autonomy to give them. |\n| p26 | evidence | The second caution: Uber's 2020 account describes about 2,200 microservices where a root-cause investigation could cross fifty services owned by twelve teams. | fact: Uber Engineering (July 2020): about 2,200 microservices; investigations across fifty services and twelve teams. | `additional_support`: Zalando's caution. → Uber's. |\n| p27 | analysis | Both cases are old and far larger, but the lesson scales down: journey teams need a shared integration standard or each builds its own connector to the same ERP, and the team that changes a flow is paged when it fails ('you build it, you run it'). | quotation: Werner Vogels (2006): 'you build it, you run it'.; figure: Figure 3: Kestrel & Pine's 2027 team shape. | `conclusion_summary`: The two cautions. → What they mean for a merchant. |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): Team shape and integration ownership change by stage, and the team shape should change one stage before the system landscape does, because the owner must exist before the connector is built.\n\n**Advances the thesis** (S6, S3): Generalizes the recommendation across the four stages and states the timing judgement.\n\n**Transition in:** `elaboration`: The recommended shape, its product managers and the cautions, which fit the Omnichannel stage. → How the team shape and the ownership of integrations differ at each stage.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p49 | analysis | The recommended shape fits the Omnichannel stage, and the table shows how shape and integration ownership change by stage; the team shape should change one stage before the system landscape does, and Kestrel & Pine hired its lead integration engineer in 2022, a year after the marketplace connector and the iPaaS arrived in 2021, so the thirteen unowned integrations of January 2027 are the cost of that year. | table: Per stage: typical shape, who owns integrations, what becomes necessary, warning signs, and Kestrel & Pine's row. |  |\n\n### Working With Agencies and Implementation Partners\n\n**Controlling idea** (`recommendation`, id `agencies`): Agencies build what the merchant cannot staff, so the merchant keeps the repository, accounts, credentials, map and decision records, puts every agency deliverable on the map, and separates paying for building from staffing the keeping.\n\n**Advances the thesis** (S4): States the agency rules and applies them at Kestrel & Pine.\n\n**Transition in:** `contrast`: The teams inside the company at each stage, with vendors and the agency as services under written contracts. → The outside parties who do some of the building at every stage, and what the agency contracts must say.\n\n**Order of paragraphs** (`problem_solution`): What agencies do and what the evidence shows comes first, then the rules, then Kestrel & Pine's statement of work as the rules applied.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p28 | context | An agency or implementation partner builds what the merchant cannot staff; the public evidence reports builds rather than outcomes, and vendors' mechanisms (Shopify development stores, Salesforce cartridges) are built for agency work. | case: Hobbycraft's 2022 move to Salesforce Commerce Cloud, built by an agency, reported by a trade site without an outcome.; fact: Shopify development stores let a partner build a store and transfer it, with real transactions disabled until transfer. |  |\n| p29 | recommendation (list) | The author's rules, stated as judgement: the merchant owns repository, accounts, credentials, map and decision records; every agency deliverable is a row with scopes, pinned version, tested release and exit plan; the statement of work names versions and a deprecation clause; ownership after launch is written before launch; building is separated from keeping. |  | `problem_solution`: Agencies paid to build. → Rules that keep ownership with the merchant. |\n| p30 | example | At Kestrel & Pine the agency (since 2017, €14,000 a month) gets a 2027 statement of work listing each of its nine scripts with an owner and pinned version, three stock- or price-writing scripts move in-house to the integration pair, and the ERP partner keeps maintaining its connector while the pair owns its contract, monitor and reconciliation. | example: Agency retained since 2017 at €14,000 a month; nine scripts; three moved in-house; the ERP partner's 2023 platform-to-ERP connector. | `example`: The rules. → Kestrel & Pine's agency and ERP partner under them. |\n\n### Vendor Management: What the Contract Must Say\n\n**Controlling idea** (`recommendation`, id `vendors`): A merchant cannot govern its vendors' terms but can govern its dependence on them, by recording each vendor's term, versioning and deprecation, limits, exit, service levels and residency on a vendor card whose deprecation dates go on a calendar.\n\n**Advances the thesis** (S4): Specifies the vendor card and ties its versioning row to the Deprecated Endpoint.\n\n**Transition in:** `similarity`: Contracts with the agency, whose terms the merchant writes. → Contracts with vendors, whose terms the merchant cannot write.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p31 | evidence | A merchant on rented software is governed by its vendors' terms, which promise little: Shopify's terms provide the services 'as is' and allow changes without notice, so ask for the actual service agreement rather than a marketing uptime figure. | quotation: Shopify Terms of Service (20 October 2026): 'as is', 'as available', no warranty that services 'will be uninterrupted, timely, secure, or error-free', modifiable 'for any reason, without notice and at any time'. |  |\n| p32 | description | What the merchant can govern is its dependence, recorded on a vendor card per vendor: term and notice, versioning and deprecation, rate limits, export and exit, extension retirement, service levels in the merchant's units, residency. | table: Vendor card fields with dated examples: Shopify quarterly API versions with twelve-month support; Adobe three-year support and enforcement from 1 June 2027; WooCommerce compatibility 'not guaranteed'; rate limits 100 to 2,000 points a second; Data Act switching from 12 January 2027 (applicability open); Scripts retired 30 June 2026; SLO and SLA (Google SRE, 2017); commercetools regions. | `contrast`: Terms the merchant cannot change. → The dependence it can record. |\n| p33 | analysis | The versioning row is the Pulled Rug's calendar: the Deprecated Endpoint was a published date nobody had put on a calendar, and the card plus the map say who updates which row by when. |  | `emphasis`: The vendor card's rows. → The one row that would have prevented the Deprecated Endpoint. |\n\n### Governance That Fourteen People Will Follow\n\n**Controlling idea** (`recommendation`, id `governance`): Governance keeps ownership decisions true after the meeting, and for fourteen people that means decision records, standing rules checkable from the map, and one weekly architecture hour.\n\n**Advances the thesis** (S5): Describes the three governance mechanisms sized for a small team.\n\n**Transition in:** `sequence`: The map, the agency rules and the vendor card. → How they are kept true over time.\n\n**Order of paragraphs** (`grouping`): The purpose first, then the three mechanisms from the most durable (records) to the most frequent (the weekly hour).\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | claim | Governance has one purpose, keeping the ownership decisions true after the meeting ends; heavy process will not survive fourteen people and a peak season, light specific process can. |  |  |\n| p35 | definition | A decision record preserves a choice, its reasons and its consequences so someone joining later can judge whether it still holds. |  | `sequence`: Light, specific process. → Its first mechanism, the decision record. |\n| p36 | evidence | Nygard's ADR (context, decision, status, consequences) prevents blind acceptance or blind change; in a merchant the records worth writing are ownership, vendor and app decisions, and Kestrel & Pine's W1–W8 became its first eight records. | quotation: Nygard (November 2011): context 'described as neutral facts, often in tension'; without a record a newcomer can only 'blindly accept the decision' or 'blindly change it'.; example: Waypoint W1–W8 numbered as the first eight records; the 2029 review re-opens W4. | `elaboration`: What a decision record does. → Its standard form and which decisions deserve one. |\n| p37 | description | Standing rules need no meeting because they can be checked from the map, each mapped to the failure pattern it prevents. | table: Five rules (one writer per fact; owner, contract card, idempotent handling and reconciliation per integration (W5); app scopes reviewed quarterly, 41 apps becoming 34 by July 2027; pinned API versions with retirement dates; a four-week pre-peak freeze), with their checks and the patterns they prevent. | `sequence`: Decision records. → The second mechanism, standing rules. |\n| p38 | description | A weekly 45-minute architecture hour with a standing agenda (new rows, proposed ADRs, deprecations in the next ninety days, one incident replayed) produces edits to the map and the records; at Kestrel & Pine it replaced three vendor status meetings, and the practices of the next section keep day-to-day changes within these rules. |  | `sequence`: Standing rules. → The third mechanism, the weekly review. |\n\n### Engineering Practices on Rented Software\n\n**Controlling idea** (`recommendation`, id `practices`): On rented software the engineering practices that matter are sandboxes and a test chain across vendors, pinned versions, feature flags, and AI coding tools used under the tests and rules that protect stability.\n\n**Advances the thesis** (S5): Shows the daily practices that keep the ownership rules true.\n\n**Transition in:** `sequence`: Governance that keeps ownership decisions true. → How the teams make changes safely on rented software.\n\n**Order of paragraphs** (`grouping`): Environments, release management, feature flags and AI tools, each a group; the AI evidence is ordered from adoption figures to the trial to the conclusion for commerce.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | description | Test environments let a team try changes without moving real money, but what each vendor's sandbox reproduces differs. | fact: Shopify development stores (no real transactions, cap of 250); Stripe sandboxes; Adobe Commerce Cloud Pro integration, staging and production (accessed November 2026). |  |\n| p41 | evidence | No vendor offers a sandbox of the whole chain (platform, PSP, ERP, WMS), and Zalando's 2020 answer was marked test orders that fulfillment skips, run in production. | case: Zalando Engineering (2020): order-flow simulators placing marked test orders that fulfillment skips. | `contrast`: Sandboxes per vendor. → The gap: no sandbox of the whole chain. |\n| p42 | recommendation | A small team can copy the pattern with a test customer, a test SKU, an order flag the WMS and ERP recognize, and a weekly run through the chain. |  | `example`: Zalando's marked test orders. → The small-merchant version. |\n| p43 | recommendation | Vendors set the release calendar, so the cheapest control is to pin the API version in every connector and record it in the map. |  | `sequence`: Environments. → Release management. |\n| p44 | definition | Hodgson's toggle types give the team a vocabulary: release toggles for unfinished checkout changes, ops toggles for the peak switch-off list, permissioning toggles for staff-only or B2B-only features. | source: Pete Hodgson, Feature Toggles (October 2017). | `sequence`: Release management. → Feature flags. |\n| p45 | context | AI coding tools help developers write and revise code; for an integration team the question is whether that help produces dependable changes faster, including review and recovery. |  | `sequence`: Feature flags. → AI coding tools and the question to ask of them. |\n| p46 | evidence | DORA's 2024 report associates wider AI adoption with small quality gains but lower delivery throughput and stability, and its 2025 report calls AI an amplifier of existing strengths and weaknesses. | statistic: DORA 2024: over 75% rely on AI daily; a 25% increase in adoption associated with 1.5% lower throughput and 7.2% lower stability. DORA 2025: AI 'an amplifier'. | `elaboration`: The question to ask. → The dated evidence. |\n| p47 | evidence | METR's 2025 randomized trial found experienced developers 19% slower with early-2025 tools while believing they were faster, and Shopify's CEO made AI use a baseline expectation in April 2025. | statistic: METR (July 2025): 16 developers, 246 tasks, 19% longer completion time, perceived 20% faster.; quotation: Shopify CEO memo (April 2025): 'reflexive AI usage' as a baseline expectation. | `additional_support`: DORA's findings. → A trial and an employer's expectation. |\n| p48 | analysis | For commerce the stability finding matters most: AI raises output on the code that touches stock and prices, so sandbox tests, small batches, review and the one-writer rule are preconditions, and AI moves the bottleneck from writing a connector to owning it. |  | `conclusion_summary`: The mixed evidence. → What it means for a commerce team. |\n\n### In Practice: Kestrel & Pine, Before and After\n\n**Controlling idea** (`example`, id `practice`): Kestrel & Pine went from an agency, a partner and one lead integration engineer holding whatever nobody owned to journey teams, an integration pair, records, vendor cards and a weekly hour, and with the map the Deprecated Endpoint would not have happened.\n\n**Advances the thesis** (S2, S3, S4): Applies the map, team shape and contracts to the case and replays the incident.\n\n**Transition in:** `example`: The chapter's recommendations on teams, contracts, governance and practices. → Kestrel & Pine before and after applying them.\n\n**Order of paragraphs** (`chronological`): Before, after, then the incident replayed under the after state.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p50 | description | Before (January 2027): thirteen of 34 integrations unowned, three apps writing inventory, the agency holding theme, apps and scripts, the ERP partner holding its connector, the integration team under Ruben Alves owning the iPaaS flows and Ruben informally holding everything else, and no calendar of deprecation dates. | fact: €14,000 retainer; technology spend about €2.6 million a year; support answering from five tabs. |  |\n| p51 | description | After (from April 2027): the map in use with five integrations still to be owned, two journey teams, the integration pair, the data pair and application support, ADRs KP-001 to KP-008 for W1–W8, vendor cards, the agency's statement of work and the Tuesday architecture hour. | example: Buy (three engineers and a PM, Milan); Fulfil and Return (two engineers and a PM, Daniel and Lea); integration pair (Ruben and one back-end engineer); data pair under Hanna Berg; two application support specialists.; figure: Figure 4: before and after. | `contrast`: Before. → After. |\n| p52 | analysis | Replayed with the map, the bol script has an owner, a pinned version, a retirement date ninety days ahead and a monitor, so it is updated or retired the week the retirement is announced and the two stale days do not happen. |  | `example`: The after state. → The opening incident replayed under it. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`process`, id `wrong`): Ownership fails in five recognizable ways (a Lynchpin leaves, the agency contract ends, a vendor retires a mechanism, the Secret Agent returns, two teams build two connectors), each detected and recovered through the map.\n\n**Advances the thesis** (S1, S2, S4): Shows detection and recovery for each failure through the chapter's artifacts.\n\n**Transition in:** `contrast`: The map working. → Ways ownership still fails.\n\n**Order of paragraphs** (`grouping`): One failure per paragraph, people first, then contracts, vendors, apps and teams.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p53 | process | The Lynchpin leaves: one name on many rows is the signal, and the recovery is a second name and a documented integration contract for every critical row. |  |  |\n| p54 | process | The agency contract ends: if the merchant cannot deploy without the agency, the recovery is transfer of repository and credentials written into every statement of work and a row-by-row handover. |  | `sequence`: A person leaving. → A contract ending. |\n| p55 | process | The vendor retires the mechanism an extension depends on, as Shopify did with Scripts on 30 June 2026 and Adobe will with unsupported cloud versions in June 2027; the vendor card's calendar detects it and the row's owner plans the migration a year ahead. | fact: Shopify Scripts retired 30 June 2026 (replaced by Functions); Adobe enforcement from June 2027. | `sequence`: The agency leaving. → The vendor withdrawing an interface. |\n| p56 | process | The Secret Agent returns when a new app gets an inventory-write scope; the quarterly review or an install rule detects it, and the scope is revoked and the touched stock reconciled. | statistic: The May 2027 reconciliation found 2.3% of active variants different, most from such apps. | `sequence`: Vendor retirement. → An app gaining a write scope. |\n| p57 | process | Two journey teams build two connectors to the ERP; two rows with the same target reveal it, and the integration pair owns one flow the other team consumes. |  | `sequence`: An unowned writer. → Duplicate connectors. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The team shape, the agency rules, the vendor card and the governance are all ways of keeping the map's rows filled: an order lost between suppliers is found by an owner inside the company who has a row, a monitor and a calendar, and Kestrel & Pine's incidents in blank cells were failures of ownership, not of any one supplier's code.\n\n**So what:** A merchant that writes the map first knows who follows a broken flow across suppliers before it breaks, and can then choose its team shape and contract terms to keep every row owned.\n\n**Callback:** The opening's order that reaches checkout but never the warehouse while each supplier reports its own part working. Paragraph p58 says who would trace that order with the map in place.\n\n**Takeaway** (`course_of_action`): Draw the map, check it for blank owners and duplicate writers, and ask the nine questions about owners, writers, logins, deprecation dates, the statement of work, journey ownership, decision records, change paths and single-name rows.\n\n**Hand-off** to [Assistants and Agents: AI in Commerce and What Is Real in 2026](ai-and-agentic-commerce.html): `example`: The ownership map's rule that every writer of a fact, whether a system, an integration or an app, has a row and a named owner. → AI assistants and agents as the newest actors that read and write the merchant's facts, and what the systems and owners must provide before an agent can buy.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p58 | synthesis | The opening's order lost between suppliers is the case the map is built for: with a row per system, integration and app, the flow has an owner inside the company who can trace it, and the team shape, contracts and governance exist to keep those rows filled; Kestrel & Pine's three incidents in blank cells were failures of ownership, not of a supplier's code. | reasoning: The hook's lost order; the five duties; the three incidents in blank cells. |  |\n| p59 | synthesis (list) | Established: Conway's mirroring, partner programs paying for building and retention, Nygard's decision records, and the cost of autonomy without standards. |  | `conclusion_summary`: The chapter's answer in one paragraph. → The points that are established. |\n| p60 | synthesis (list) | Depends on context: the team shape by size and stage, agency-led work by stage, vendor management by the vendors' versioning policies, and the value of AI tools by the tests and governance in place. |  | `contrast`: What is established. → What depends on context. |\n| p61 | recommendation (list) | The author's synthesis: the ownership map is the first architecture artifact and the only one that prevents incidents on its own, and the team shape changes one stage before the landscape. |  | `sequence`: What depends on context. → The author's judgement. |\n| p62 | recommendation (list) | Nine questions let the reader test their own organization: map and owners, duplicate writers, who holds logins, deprecation dates, the statement of work, journey ownership, system-of-record decisions, the change path, single-name rows. |  | `sequence`: The author's judgement. → Questions to apply it. |\n| p63 | transition | The map's rule that every writer of a fact has a row and a named owner applies to the newest writers too: the last chapter of the part asks what AI assistants and agents need from these systems and owners before an agent can buy. |  | `example`: The map's one-writer, one-owner rule. → AI agents as the next writers. |\n\n## Non-goals\n\n- The integration inventory and integration styles; contracts, idempotency and reconciliation mechanics; API versioning and ame line names the bol stock script, an agency script, among the five unowned. A round-3 judge read this as a double count. The fact needed: whether the nine agency scripts include the bol script (then the column should read 'built by the agency') or not.\n- Remaining round-3 findings not fixed (draft faults, would need another round): p28 joins the Hobbycraft evidence and the vendors' agency mechanisms (one reader saw two ideas); p49's 'the thirteen integrations ... are the cost of that year' was read by both flow readers as an asserted link; p50's technology spend is not used later; '*(illustrative)*' is not explained in the chapter (a book-wide convention).\n\n## Decision log\n\n- **2026-11-13** — After the confirming round 3 (escalate: budget spent; 15 passed, 23 failed, 15 major, no spec fault), cheap and plainly right fixes applied without another round: the stage table's later terms replaced by plain words ('a test store and marked test orders that fulfillment skips', 'a weekly review of the map', 'a named owner for the peak season'); the scene says once that the integration team is reshaped as a pair from April 2027, and the After paragraph says the two Waypoint engineers join the journey teams 'rather than the integration pair, which stays at two people'; p25 opens from the journey teams' autonomy; p27 ties Uber's slow investigations to Vogels' line; 'marketplaces listings' corrected. The check report is stale after these edits. Rejected: Cutting the Hobbycraft example or the technology-spend figure (author's text with cited source / ledger fact; rule 5).; Splitting p27 or p28 into two units (the spec's units stay; their controlling ideas join both points).\n- **2026-11-13** — Auto-resolved by the author's standing instruction of 2026-11-12: (rule 3) both round-2 flow readers asked for the two terms (system of record, integration contract) before the definition of owning, which uses 'contract': p14 now opens 'What Owning Means' and the API version gloss sta <script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);

            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));

        }

        const tagsHost = document.getElementById('tags');

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';

                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });

                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
