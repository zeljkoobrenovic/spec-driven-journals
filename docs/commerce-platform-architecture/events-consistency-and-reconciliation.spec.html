<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed from the published chapter (posts/25-events-consistency-and-reconciliation/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the chapter, plus the units the contract asks for and the published chapter did not have (the thesis paragraph, a roadmap and a conclusion paragraph that answers the opening); these are listed in decision_log.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** Eventual consistency and at-least-once delivery in plain words, and why a database transaction cannot span a hosted platform, another vendor's warehouse system, the ERP and a payment provider.\n- **Know:** The five mechanisms: idempotency keys, the transactional outbox (or webhook plus sweep for a SaaS merchant), retries with backoff and a dead-letter queue, sagas with compensation (choreography or orchestration), and reconciliation as a component.\n- **Know:** The reconciliation card's fields (the two sets compared, the matching key, the tolerance, the cadence, the recipient of the exceptions, the fix) and the idempotency key for common commerce actions.\n- **Believe:** Exactly once is built by the receiver; no queue or webhook provides it.\n- **Believe:** Reconciliation is part of the integration, not its audit: the other mechanisms reduce disagreement and only a comparison shows what remains.\n- **Believe:** Most drift has a writer that should not have been writing, so the first question about a difference is who else writes the fact.\n- **Be able to:** State the idempotency key of a flow and say what happens when its message arrives twice.\n- **Be able to:** Write a reconciliation card for a flow that creates, moves or pays, and say in which direction its differences are fixed.\n- **Be able to:** Decide whether an order process needs an orchestrator (the OMS) or can be left to listeners.\n\n**Audience:** Readers new to commerce architecture; most of all the integration or back-end engineer who inherits connectors without keys or checks (Ruben Alves's position at Kestrel & Pine), and next the operations, finance or support lead who has lived through a double refund or a stock drift and needs the questions to ask in a design review.\n\n**Already knows:**\n\n- What buying something online is like from the shopper's side; roughly what an API, a database and a queue are.\n- Kestrel & Pine, its people, its thirteen systems, its 2026 and January 2027 incidents in outline and the names of the sixteen failure patterns.\n- From Part I: the thirteen steps of an order, promise and handoff, the three status lines, 'system', 'the shop platform' and 'commerce platform', business models and the four scale stages (Starting, Growing, Omnichannel, Group), the capability map, bounded context, system of record, single writer, events, idempotency and reconciliation as the two remedies, the Waypoint decisions W1 to W8.\n- Glosses already given: PSP, WMS, ERP, iPaaS, EDI, webhook, API call, SKU, channel, marketplace connector, 3PL, order hub and order management system, availability service, D2C, B2B, PIM, POS.\n- Parts II to V: one owner per product, price, discount and stock fact; available-to-promise with one writer each for on hand and committed; checkout creating the order once; refunds as new payments; one order record with three status lines and an order management system; one invoice per shipment and the monthly match; the WMS as the only writer of on-hand stock.\n- From chapter 24: the four integration styles and five triggers, polling and change data capture, webhook plus sweep, the integration inventory and its named owners, and that only 3 of the 34 integrations had a reconciliation job, none for stock or orders.\n\n**Does not yet know:**\n\n- Copy against system of record as a consistency question; eventual consistency; at-least-once, at-most-once and exactly-once delivery; ordering per partition.\n- Idempotent operation and idempotency key; versions per entity.\n- The dual-write problem, transactional outbox and relay.\n- Exponential backoff and jitter; dead-letter queue and redrive.\n- Transaction, saga, compensating action, choreography and orchestration.\n- Reconciliation as a component and its card; tolerance; the four golden signals.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | Given refunds paid twice by two writers, the reader explains why the payment provider accepted both and names the design that prevents and detects it. *Probe:* A brand's returns portal refunds customers through the platform's API when a return is inspected; support agents can also refund in the payment provider's console, and some do when customers ask where their refund is. Over three weeks some returns are refunded twice. Using only this chapter: why did the payment provider accept both refunds, and what design prevents and detects this? | `custom` | cold_reader | major |\n| AC-2 | Given a first stock reconciliation that finds differences, the reader says which way to fix them, what to look for first and what the job's card must state. *Probe:* A brand's first comparison of warehouse stock with the storefront's available quantity finds 2.3% of active variants different. Using only this chapter: which side is corrected, what should the team look for first, and what should the comparison job's card say? | `custom` | cold_reader | major |\n| AC-3 | The reader can say how an order is undone after it has shipped, and which system coordinates it. *Probe:* Using only this chapter: a paid order has already left the warehouse when the customer cancels. Can it be rolled back, and which system should coordinate what happens? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict the chapter's sections and the kind of evidence it uses. *Probe:* After reading only the introduction: what will this chapter discuss, in what order, and with what kind of evidence? | `intro_predicts_content` | cold_reader | major |\n| AC-5 | A reverse outline of the draft, written without the spec, lists the same controlling ideas in the same order as sections[].paragraphs[]. | `reverse_outline_matches_spec` | reverse_outline | blocker |\n\n## Thesis\n\n**Question:** If systems can only be eventually consistent, how do you keep them from drifting apart for good?\n\n> **Claim:** Assume every message may arrive late, twice or out of order, and add five mechanisms: an idempotency key naming the business action, so a repeat does nothing; an outbox, or a webhook plus a periodic sweep, so no event is lost; retries with backoff and a dead-letter queue; compensations that undo partial work; and a reconciliation job that finds the remaining differences, which are fixed from the system of record.\n\n**Disputed by:** The view that a reliable queue, an integration platform's retries or 'exactly-once' delivery keeps copies in agreement, so drift is fixed by making the sync faster and reconciliation is an occasional cleanup for finance.\n\n**So what:** A merchant that accepts the claim requires, before any flow that creates, moves or pays goes live, a stated idempotency key and a reconciliation card (the two sets compared, key, tolerance, cadence, recipient and fix), and asks who else writes a fact when its copies differ. Kestrel & Pine's first stock reconciliation, in May 2027, found about 390 of some 17,000 active variants (2.3%) with a different figure in the WMS and the platform: about 240 changed by three apps that wrote stock, 90 by returned units still in flight, 40 by manual edits and 20 unexplained. In January 2027, 212 returns were refunded twice (€19,400) by two writers with no shared key and no comparison; from February 2027 refunds have one writer, the return id as key and a daily match.\n\n**How and why:** No transaction spans a hosted platform, another vendor's warehouse system, the ERP and a payment provider, so each completes or fails alone. Queues and webhooks would rather repeat a message than lose it; a receiver that remembers the business key turns the repeat into a no-op. Saving the event with the change closes the gap in which a database commit succeeds and the send fails. Retries spaced out with backoff stop a recovering receiver from being flooded, and a dead-letter queue keeps what still fails visible. A step that cannot be rolled back, such as a shipped parcel, is undone by a business action. These mechanisms reduce disagreement but cannot show it is gone; only comparing both ends against the system of record shows the remainder, and the remainder leads to the writers that do not own the fact.\n\n**Supporting claims**\n\n- **S1** — No transaction spans separate systems and every delivery mechanism a merchant meets delivers at least once and in no guaranteed order, so copies of a fact disagree for a while; the window is normal, and the design must make it safe and visible.\n- **S2** — Exactly once is built by the receiver: an idempotency key that names the business action, not the attempt, makes a repeat do nothing, and a version per entity or a tolerant handler deals with messages that arrive out of order.\n- **S3** — No event is lost when it is saved in the same transaction as the change it describes (the outbox) or, for a merchant on a SaaS platform, when a webhook is backed by a polling sweep; retries spaced with backoff and jitter end in a dead-letter queue that has an alarm, an owner and a replay procedure.\n- **S4** — Work that cannot be rolled back is undone by compensating business actions in a saga; for the order, the OMS orchestrates the saga once more than three systems sit in the order's path, and choreography suits listeners that never have to be undone.\n- **S5** — Reconciliation is a component of the integration, written on a card (the two sets, key, tolerance, cadence, recipient and fix): it is the only mechanism that shows what the others missed, its differences are fixed from the system of record, and they lead to writers that should not have been writing.\n\n## Role in the part\n\nGives the part its recovery mechanisms: the idempotency key, the outbox or webhook plus sweep, retries, compensation with the OMS as the order's orchestrator, and reconciliation as a component whose card every flow carries and whose fixes run from the system of record. Supports P6-2 of part `part-6`.\n\n## Flow\n\n**Pattern:** `problem_solution` (also `prerequisite_order` in consistency to reconciliation: what delivery guarantees, then the five mechanisms in dependency order (the key that makes any repeat harmless, then the outbox, retries, compensation, and the comparison that checks them all); `comparison` in flows, choices and stages)\n\nThe two Kestrel & Pine scenes come first because they are the problem the mechanisms answer: a stock copy that nobody compared and a refund paid twice by two writers. Eventual consistency and at-least-once delivery come next because every mechanism assumes them: a reader who expects exactly-once delivery has no reason for a key. The mechanisms come in dependency order: the receiver's key first, because the outbox's relay and every retry may repeat a message and are safe only once repeats are harmless; then the outbox (a loss), retries and the dead-letter queue (a failure), compensation (partial work across several steps), and reconciliation last because it checks what the other four left behind. Per-flow needs, the choices and the scale stages compare the mechanisms once all five are known (the choreography-orchestration comparison stays in the sagas section, beside the terms it uses); In Practice shows them in vendors' products and on Eva's refund; When It Goes Wrong reads each failure against the mechanism that detects it. Moving reconciliation before the other mechanisms would ask the reader to check results of mechanisms not yet explained; moving the choices before the mechanisms would compare options the reader cannot yet name. Per-flow needs come before the choices because the choices table compares whole approaches the flow table has just shown in use; the stages follow the choices because they say which choice fits when. In Practice comes before the failures because Eva's refund shows the mechanisms working before the chapter lists how they fail. Compensation follows retries because it handles what a retry cannot finish: a step that has failed for good after earlier steps succeeded.\n\n## Introduction\n\n**Hook** (`puzzling_scenario`): A warehouse accepts an order, but its reply is lost; the sender cannot tell whether the work started, so it tries again, and unless the warehouse recognizes the repeated instruction one purchase becomes two shipments.\n\n**Bridge:** The previous chapter chose an asynchronous style per flow; anyone who has resent an e-mail because no reply came knows the sender cannot tell a lost message from a slow one. → Between separate systems with no shared transaction, the question becomes how each system recovers from that uncertainty without repeating or losing the business action.\n\n**Thesis statement** (KEY POINTS callout and paragraphs p03 (the five mechanisms) and p05 (the claim)): Assume every message may arrive late, twice or out of order, and build in all five mechanisms (idempotency, the outbox or a webhook plus a sweep, retries with backoff into a dead-letter queue, compensation, reconciliation); the key names the business action so a repeat does nothing, and the differences reconciliation finds are fixed from the system of record.\n\n**Roadmap** (Paragraph p06):\n\n- Start from Kestrel & Pine's first stock reconciliation and the Double Refund. *Kept in:* scene.\n- Explain eventual consistency and why every delivery is at least once. *Kept in:* consistency, at-least-once.\n- Take the five mechanisms in turn: idempotency, the outbox, retries and the dead-letter queue, sagas and compensation, and reconciliation with its card. *Kept in:* idempotency, outbox, retries, sagas, reconciliation.\n- Say which mechanisms each flow needs, compare the ways to keep systems in agreement and how they change with scale. *Kept in:* flows, choices, stages.\n- Follow Eva's refund through the fixed design and say how a flow is monitored, then list what goes wrong and what detects it. *Kept in:* practice, wrong.\n- Follow Eva's refund through the fixed design and say how a flow is monitored, then list what goes wrong and what detects it. *Kept in:* scene, at-least-once, idempotency, outbox, sagas, reconciliation, practice.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | When a warehouse's reply to an order is lost, the sender cannot tell whether the work started and tries again, so one purchase can become two shipments; the asynchronous styles chosen per flow in the previous chapter all bring such repeats, delays and half-finished handoffs, and this chapter is about recovering from them. | example: The lost reply and the retried order instruction. |  |\n| p02 | explanation | A database transaction keeps changes together inside one system but cannot span a hosted storefront, another vendor's warehouse software, a finance system and a payment provider, so each completes or fails alone and the merchant must find which steps succeeded and finish or undo the rest. |  | `cause_effect`: The sender's uncertainty. → Why no shared transaction removes it. |\n| p03 | claim | Five jobs do that recovery (recognize repeated messages, save an outgoing event with its fact, retry without overwhelming the receiver, reverse completed actions, compare records to find gaps), named idempotency, the outbox, retries with backoff, compensation and reconciliation. |  | `problem_solution`: Steps that succeed or fail alone. → The five jobs that recover from it. |\n| p04 | example | Eva's jacket order of 13 April 2027 sends order, payment and warehouse messages at different times, and her later exchange adds return and stock messages; each may repeat or fail to arrive. | scenario: Eva's order on 13 April 2027 and her later exchange (illustrative). | `example`: The five jobs in general. → The order they will protect. |\n| p05 | claim | The chapter's answer: assume every message may arrive late, twice or out of order and build all five mechanisms in, with two rules carrying most of the weight: the idempotency key names the business action, not the attempt, so a repeat does nothing, and the differences reconciliation finds are fixed from the system of record, the first question about any difference being who else writes the fact. |  | `problem_solution`: Eva's messages that may repeat or not arrive. → The chapter's answer. |\n| p06 | transition | The chapter starts from Kestrel & Pine's first stock reconciliation and the Double Refund, explains eventual consistency and at-least-once delivery, takes the five mechanisms in turn, then says what each flow needs, compares the choices and the scale stages, follows a refund of Eva's jacket through the fixed design and monitoring, and lists what goes wrong, using the vendors' documentation and the original papers as evidence. |  | `sequence`: The answer. → The order in which the chapter argues it. |\n\n## Sections\n\n### Setting the Scene at Kestrel & Pine: The First Reconciliation\n\n**Controlling idea** (`example`, id `scene`): Kestrel & Pine's first stock reconciliation found differences nobody knew about, most from systems writing stock they did not own, and the older Double Refund shows the same shape for money: two writers, no shared key, no comparison.\n\n**Advances the thesis** (S5, S2): Gives the two cases the mechanisms answer: a copy nobody compared and a money action with two writers and no key.\n\n**Transition in:** `example`: The roadmap, which starts from the first stock reconciliation. → The stock chain before anyone compared it.\n\n**Order of paragraphs** (`problem_solution`): The assumed alignment, then the first run and its causes, then what Noor concluded and what Waypoint changed, then the author's dissent on cadence; the older Double Refund last, out of time order, because it carries the same lesson to money and leads into the toolkit.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | context | Kestrel & Pine had never compared warehouse and storefront stock: the WMS sent counts to the ERP every fifteen minutes and the ERP copied them to the shop platform hourly, and people assumed the chain kept the figures aligned. | scenario: The fifteen-minute and hourly chain from WMS through ERP to the shop platform. |  |\n| p08 | evidence | In May 2027, under W5's integration standards, Ruben Alves ran the first weekly reconciliation of WMS on-hand against platform available per active variant, and about 390 of some 17,000 (2.3%) differed: about 240 from three apps that wrote stock, 90 in-flight returns, 40 manual edits and 20 unexplained. | table: Cause of the difference, variants and what it was (May 2027, illustrative). | `contrast`: The assumption that the chain kept figures aligned. → The first comparison that tested it. |\n| p09 | analysis | Noor Visser concluded that nobody had known about the differences and that many came from systems writing stock they did not own, which faster messaging would not fix. |  | `cause_effect`: The causes in the table. → What they meant. |\n| p10 | description | W1 gives the WMS authority over physical stock with an availability service in Q4 2027, the three apps lose stock-writing permission (the pre-order app gets an allocation), and the comparison stays as a check, weekly and daily through November. |  | `problem_solution`: Writers that did not own stock. → The fix Waypoint chose. |\n| p11 | recommendation | Against Waypoint's weekly cadence the author would run the comparison daily all year, because a week is long enough for such differences to cause overselling while Noor invests in the event feed: faster propagation reduces drift, while frequent comparison reveals what still escaped. |  | `contrast`: Waypoint's weekly cadence. → The author's dissent and the trade-off behind it. |\n| p12 | example | In January 2027, 212 returns were refunded twice (€19,400), once by the returns portal through the platform's API and once by support in the PSP's console: two writers, no shared key and no job comparing refunds issued with refunds due. | case: The Double Refund: 212 returns, €19,400, January 2027, most of it recovered.; figure: Figure 1: one returned parcel triggers two refunds from two writers to the same provider. | `similarity`: Stock differences from writers that did not own the fact. → The same shape in money, four months earlier. |\n\n### Eventual Consistency in Plain Words\n\n**Controlling idea** (`definition`, id `consistency`): Copies of a fact across separate systems can only promise to agree eventually; the window of disagreement is normal, and the recoveries for it are write-off, retry and compensation.\n\n**Advances the thesis** (S1): Defines the window the mechanisms make safe.\n\n**Transition in:** `elaboration`: Stock and refund copies that differed. → The vocabulary for why copies differ at all.\n\n**Order of paragraphs** (`prerequisite_order`): The definition first, then Hohpe's analogy that shows it at work in a shop, then the one-line rule the rest of the chapter applies, which needs both.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | definition | A copy is consistent with its system of record when both show the same value; across systems joined by messages they cannot always, and eventual consistency (Vogels, 2008) is the promise that if updates stop, all copies will eventually show the last value. | source: Werner Vogels, 'Eventually Consistent' (2008). |  |\n| p14 | example | Hohpe's Starbucks essay (2004) shows a shop that maximizes throughput by working asynchronously instead of by two-phase commit (several systems committing together or not at all) and recovers by write-off, retry or compensating action, which still cover what a business can do about a failed step; this chapter's five mechanisms are how separate systems carry them out. | analogy: Gregor Hohpe, 'Starbucks Does Not Use Two-Phase Commit' (2004): name on the cup, write-off, remake, refund. | `example`: The definition. → An everyday analogy for it. |\n| p15 | claim | The window of disagreement is normal; a window that never closes, or that nobody can see, is not. |  | `conclusion_summary`: Eventual consistency and its recoveries. → The rule the chapter applies. |\n\n### At Least Once: Why Duplicates Are the Default\n\n**Controlling idea** (`evidence`, id `at-least-once`): Every delivery mechanism a merchant meets would rather repeat a message than lose it and none guarantees order, so exactly once is something the receiver builds.\n\n**Advances the thesis** (S1, S2): Shows from the vendors' own words that duplicates and reordering are the default.\n\n**Transition in:** `cause_effect`: A window that must close and be visible. → Why messages repeat inside that window.\n\n**Order of paragraphs** (`grouping`): The vendors' statements about duplicates first, then what at-least-once means and how the receiver builds exactly once, then the second thing not to expect, ordering.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | evidence | Kafka, Shopify, Stripe and Mollie all document that their delivery repeats rather than loses messages. | quotation: Kafka 4.4 'at-least-once delivery by default'; Shopify 'might receive the same webhook more than once'; Stripe 'might occasionally receive the same event more than once'; Mollie up to ten calls over 26 hours. |  |\n| p17 | definition | At-least-once means a message arrives one or more times, the alternative at-most-once may lose an order or refund, and exactly once is built by a receiver that recognizes repeats, as CloudEvents' source plus id allows. | source: CloudEvents 1.0 (CNCF, graduated January 2024): source and id identify duplicates. | `elaboration`: The vendors' statements. → What at-least-once means and who builds exactly once. |\n| p18 | evidence | Ordering is not guaranteed either: Shopify and Stripe say so, Kafka orders only within a partition, so a design that assumes 'shipped' follows 'allocated' will one day see them reversed. | quotation: Shopify 'doesn't guarantee ordering within a topic'; Stripe 'doesn't guarantee the delivery of events in the order that they're generated'. | `additional_support`: Duplicates. → The second thing not to expect: order. |\n\n### Idempotency: Making a Repeat Harmless\n\n**Controlling idea** (`explanation`, id `idempotency`): An idempotency key that names the business action, not the attempt, makes a repeated request do nothing; a receiver that cannot say what its key is cannot be made safe, and out-of-order events need a second defense.\n\n**Advances the thesis** (S2): Explains the first mechanism and the rule for choosing its key.\n\n**Transition in:** `problem_solution`: Repeats as the default. → The mechanism that makes a repeat harmless.\n\n**Order of paragraphs** (`prerequisite_order`): Definition, then the vendors' implementation, then the rule for choosing a key with the table of keys, then the Double Refund read against that rule, then the separate case of out-of-order events, which a key alone does not solve.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | definition | An operation is idempotent when doing it twice has the same effect as once; creating an order, refunding or subtracting stock are not unless an idempotency key, remembered by the receiver, lets a second request be recognized and answered without doing the work again. | figure: Figure 2: the same order event delivered twice; the WMS is safe because it remembers the order number. |  |\n| p20 | evidence | The PSPs and Shopify document the mechanism best: Stripe saves and replays the first response per key and rejects mismatched retries, Shopify takes an idempotencyKey on mutations, and both give each webhook delivery an id the receiver stores and skips. | source: Stripe idempotent requests (saved response, parameter check, 24-hour pruning); Shopify GraphQL Admin API idempotencyKey; X-Shopify-Webhook-Id and Stripe event id. | `example`: The definition. → How the vendors implement it. |\n| p21 | recommendation | The key must name the business action, not the attempt (a random identifier works only if created once per action and reused on every retry), and for common commerce actions it is the order number, the return id, the order plus 'capture', (SKU, location, event id), (order, shipment id) and, with care, the customer's e-mail or external id. | table: Action, idempotency key and why that key, for six commerce actions. | `elaboration`: The vendors' mechanism. → The rule for choosing the key and the keys per action. |\n| p22 | example | The Double Refund failed this test twice: the PSP accepted both refunds because neither request named the return, and Waypoint's fix is one writer per money action (support's console read-only) and the return id as the key on every refund request. | case: The Double Refund's two writers and the February 2027 fix. | `example`: The rule and the refund row of the table. → The case that broke it. |\n| p23 | process | Out-of-order events need a second defense because a stale update is not a duplicate: a tolerant handler, a version per entity, or one consumer per entity; Stripe's simplest advice is to fetch the current object, and Mollie builds that into an id-only webhook. | example: Walmart's inventory design on Confluent's blog (May 2020, six years old), one partition per item and store; Stripe's advice to fetch the object; Mollie's id-only webhook ('fake calls to your webhook will never result in orders being processed without being actually paid'). | `contrast`: Keys that stop duplicates. → Stale updates, which keys do not stop. |\n\n### The Outbox: Never Losing the Event Between the Database and the Queue\n\n**Controlling idea** (`explanation`, id `outbox`): Saving the change and the event to send in one transaction stops an event being lost between the database and the queue; a SaaS merchant gets the same effect from a webhook plus a polling sweep.\n\n**Advances the thesis** (S3): Explains the mechanism that stops events being lost, and its SaaS equivalent.\n\n**Transition in:** `contrast`: Messages that arrive twice or out of order at the receiver. → A message that is never sent at all.\n\n**Order of paragraphs** (`problem_solution`): The dual-write problem first, then the outbox that solves it, then what a merchant who cannot build an outbox uses instead.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p24 | explanation | Saving the order and then publishing the event can lose the event, and the reverse can announce an order never saved; this dual-write problem cannot be fixed by retrying because the sender does not know which half failed. |  |  |\n| p25 | explanation | The transactional outbox writes the business change and the event to send in one transaction and lets a relay publish it; the relay may repeat, so the outbox and the consumer's idempotency are two halves of one design. | source: Chris Richardson, Transactional outbox (microservices.io): 'a message consumer must be idempotent'.; figure: Figure 3: the order and the promise to announce it saved together; the relay may repeat. | `problem_solution`: The dual-write problem. → The outbox that solves it. |\n| p26 | explanation | A merchant on a SaaS platform cannot build or inspect the platform's outbox; the webhook plus a polling sweep of everything changed since the last run plays the same role from outside. |  | `contrast`: An outbox inside the service. → The merchant who cannot build one. |\n\n### Retries, Backoff and the Dead-Letter Queue\n\n**Controlling idea** (`explanation`, id `retries`): Retries spaced with exponential backoff and jitter stop a recovering system being flooded, and retries end in a dead-letter queue that is harmless only if it has an alarm, an owner and a replay procedure.\n\n**Advances the thesis** (S3): Explains how failed deliveries are retried and kept visible.\n\n**Transition in:** `sequence`: An event that is sent. → An event whose delivery fails.\n\n**Order of paragraphs** (`prerequisite_order`): How to retry, then where retries end, then the operational rule that keeps that end from becoming a silent loss.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p27 | explanation | Naive retries make an outage worse; exponential backoff spaces them, and jitter (randomness in the wait) stops clients clustering, as Brooker's 2015 simulation and Stripe's and Shopify's rate-limit guidance show. | source: Marc Brooker, 'Exponential Backoff And Jitter' (2015): jitter cut total calls by more than half with 100 clients; Stripe's 429 guidance; Shopify's one-second backoff. |  |\n| p28 | definition | A dead-letter queue holds a message after a set number of failures so it is neither lost nor retried forever, and Amazon SQS documents the count, the retention advice and redrive. | source: AWS SQS dead-letter queues: maxReceiveCount, longer retention, redrive. | `sequence`: Retries. → Where they end. |\n| p29 | recommendation | A dead-letter queue nobody watches loses orders silently, so every one needs an alarm, an owner and a written replay procedure; on Black Friday 2026 Kestrel & Pine had no DLQ on any flow. | scenario: Black Friday 2026: no order lost, but no flow had a DLQ (chapter 24's inventory). | `contrast`: The DLQ as a mechanism. → The DLQ nobody watches. |\n\n### Sagas and Compensation: Undoing What Cannot Be Rolled Back\n\n**Controlling idea** (`explanation`, id `sagas`): A process across systems cannot be rolled back, so it is written as a saga whose completed steps are undone by compensating business actions; for the order the OMS orchestrates the saga once more than three systems sit in its path, and choreography suits listeners.\n\n**Advances the thesis** (S4): Explains compensation and names the order's orchestrator.\n\n**Transition in:** `contrast`: Single messages that are repeated, lost or retried. → A process of several steps that fails halfway.\n\n**Order of paragraphs** (`problem_solution`): The problem in the place-order flow, the saga and its two coordination styles, the three commerce sagas, the component that runs them for a merchant, then the comparison of orchestration with choreography and the judgement, kept beside the definitions they use.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p30 | explanation | Single messages aside, a process of several steps can fail halfway: placing an order touches the availability service, the PSP and the OMS, and with no transaction across them a reservation made before a declined payment must be released by a second, deliberate action. |  |  |\n| p31 | definition | A saga (Garcia-Molina and Salem, 1987) is a sequence of smaller transactions with compensating actions that amend a partial execution, coordinated either by choreography (each step's event triggers the next) or by orchestration (one component directs each participant). | quotation: Garcia-Molina and Salem, Sagas (1987): 'either all the transactions in a saga are successfully completed or compensating transactions are run'; Richardson's choreography and orchestration.; figure: Figure 4: the place-order saga, each failing step triggering compensations for the steps before it. | `elaboration`: The release as a deliberate action. → The name and definition of the pattern. |\n| p32 | example | Three commerce sagas are worth naming: place order; cancel after shipment, whose compensation is a return and a refund on receipt, a business process rather than a database operation; and split shipment, with one step per location; between steps reserved-but-unpaid stock is visible, which is why availability counts reservations. | example: Place order, cancel after shipment (parcel with PostNL), split shipment; Richardson's 'lack of isolation'. | `example`: The saga in general. → The three a merchant has. |\n| p33 | claim | For a merchant the order saga's orchestrator is the OMS, the one place that holds every order and steers it through payment, fulfillment, delivery and return, which is much of what W2 buys. |  | `conclusion_summary`: The three sagas. → The component that runs them. |\n| p41 | comparison | Orchestration and choreography, the two ways to run a saga, differ in who decides the next step, visibility, coupling and fit. | table: Choreography against orchestration. | `contrast`: The OMS as orchestrator. → Choreography, compared with orchestration in a table. |\n| p42 | recommendation | Orchestration by the OMS wins once more than three systems sit in the order's path, because support must answer 'where is this order' from one screen; choreography is right for listeners that never have to be undone. |  | `conclusion_summary`: The two saga styles. → The author's judgement. |\n\n### Reconciliation as a First-Class Component\n\n**Controlling idea** (`claim`, id `reconciliation`): Reconciliation is the only mechanism that shows whether the others worked; every job is written on a card, the system of record decides which side is fixed, and each tolerance is a choice.\n\n**Advances the thesis** (S5): Makes reconciliation a component with a card and a direction of fix.\n\n**Transition in:** `contrast`: Four mechanisms that reduce disagreement. → The one that shows what remains.\n\n**Order of paragraphs** (`prerequisite_order`): Why it is needed, then how vendors build it, then the card that specifies one, then the two design rules the card's rows apply, then where the finance version lives.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p34 | definition | The other mechanisms reduce the chance of disagreement but none proves there is none; reconciliation compares two systems' records on a schedule and reports or repairs the differences. | figure: Figure 5: two ledgers matched line by line; about 390 of some 17,000 variants on an exception list to a named owner. |  |\n| p35 | evidence | Vendors give reconciliation a precise shape: Stripe's payout reconciliation report, Shopify's periodic sweeps and Business Central's continuous compare-and-send for stock. | source: Stripe payout reconciliation report; Shopify sweeps with updated_at; Microsoft Learn, Business Central Shopify connector (October 2026). | `example`: The definition. → How vendors build it. |\n| p36 | recommendation | Every reconciliation job can be written on one card (the two sets compared, matching key, tolerance, cadence, who gets the exceptions and the fix), required before the job goes live, as filled for stock, refunds, orders and PSP payouts. | table: The card for stock (from May 2027), refunds (from February 2027), orders (from Q4 2027) and PSP payouts. | `elaboration`: Reconciliation as vendors build it. → The card that specifies one. |\n| p37 | analysis | The system of record decides the direction of the fix (the platform is overwritten from the WMS and its writer hunted), a zero tolerance is a choice, and the 2.3% has no public benchmark. | figure: Figure 6: a reconciliation loop with a recipient: the copy corrected from the system of record and the exception list leading to the writer. | `elaboration`: The card's rows. → The two design rules behind them. |\n| p38 | context | The finance version of reconciliation for ledgers is covered in the sibling book RECONCILED, and the PSP's reports in the payments chapter. |  | `place`: Reconciliation in integration. → Where its finance version is covered. |\n\n### What Each Flow Needs\n\n**Controlling idea** (`comparison`, id `flows`): The mechanisms are chosen per flow, from how long disagreement is tolerable and what each flow must never do.\n\n**Advances the thesis** (S2, S3, S5): Applies the mechanisms flow by flow.\n\n**Transition in:** `sequence`: All five mechanisms. → Which of them each flow needs.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p39 | comparison | For stock, orders, refunds, shipments, prices and payment status, the table states the tolerable window, freshness (how current a copy must be), consistency on arrival (what must hold when a message lands), availability (what the flow does while the other side is down) and the mechanisms that earn their place, as the author's recommendation with illustrative Kestrel & Pine cadences. | table: Flow, tolerable window, freshness, consistency on arrival, availability, mechanisms. |  |\n\n### The Choices and Their Trade-Offs\n\n**Controlling idea** (`comparison`, id `choices`): Of four ways to keep systems in agreement, events with idempotent consumers and reconciliation fit what crosses vendors, scheduled compare-and-send is the safety net, two-phase commit is unavailable across SaaS vendors and manual correction is the last resort.\n\n**Advances the thesis** (S5): Compares the alternatives to the chapter's design and places reconciliation as its safety net.\n\n**Transition in:** `contrast`: The per-flow table, which assumed events with idempotent consumers. → The other ways to keep systems in agreement.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p40 | comparison | The per-flow table assumed events with idempotent consumers, one of four ways to keep systems in agreement with two-phase commit, scheduled compare-and-send and manual correction, which differ in window, coupling, cost and fit; a merchant uses more than one. | table: Four ways to keep two systems in agreement, with how it works, window, coupling, cost, fits and limits. |  |\n\n### Across Scale Stages: When It Fits and When It Limits\n\n**Controlling idea** (`comparison`, id `stages`): Idempotency and reconciliation do not change with scale; what changes is who builds them: bought inside products below the Omnichannel stage, written down and owned from it.\n\n**Advances the thesis** (S2, S5): Shows that the mechanisms hold at every stage and says when the merchant must own them.\n\n**Transition in:** `elaboration`: The choices. → Which of them a merchant must make itself at each of the four scale stages.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p43 | comparison | At each of the book's four stages the table gives what is typical, what becomes necessary and the warning signs of outgrowing it. | table: Starting, Growing, Omnichannel and Group: typical, necessary, warning signs. |  |\n| p44 | analysis | Idempotency and reconciliation are needed at every stage, from the PSP and 3PL at Starting to the merchant's own bus at Group; what changes is who builds them, and from the Omnichannel stage the discipline must be written down and owned, which is what W5 is. |  | `conclusion_summary`: The stage table. → The judgement it supports. |\n\n### In Practice\n\n**Controlling idea** (`example`, id `practice`): Eva's refund shows the mechanisms working together after the Double Refund's fix, and the four golden signals show how a flow is watched while it runs.\n\n**Advances the thesis** (S2, S5): Shows the key and reconciliation on the book's running order, and how a flow is monitored.\n\n**Transition in:** `example`: The mechanisms compared in the abstract. → Eva's refund through the fixed design.\n\n**Order of paragraphs** (`chronological`): The refund path in time order (request, notification, morning match), then monitoring, which watches the flow while it runs rather than after the fact.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p48 | example | If Eva chooses a refund, inspection on 22 April triggers the portal's refund request, and the return id identifies it all the way to the provider, so a retry cannot send another €199. | scenario: Eva's refund in the illustrative design from February 2027. |  |\n| p49 | process | The provider's success notification is stored once, finance receives the credit note in its nightly batch, and support can inspect the refund but its console access is read-only. |  | `sequence`: The refund request. → What follows it. |\n| p50 | process | Each morning a job matches provider and platform refunds by order and amount and sends unmatched entries to finance, so January's 212 duplicates would have appeared the next morning. |  | `sequence`: The refund recorded. → The morning check. |\n| p51 | recommendation | Google's SRE book names four golden signals (latency, traffic, errors, saturation); per flow they become lag, events per minute against the expected rate, failed deliveries and DLQ depth, and rate-limit headroom, with reconciliation variance as the black-box check and an alert for traffic at zero while the shop is busy. | source: Google SRE book (2017), Monitoring Distributed Systems. | `contrast`: The morning job, which checks results after the fact. → Monitoring, which watches the flow while it runs. |\n\n### When It Goes Wrong\n\n**Controlling idea** (`evidence`, id `wrong`): Six failures recur (duplicates, gaps, retry storms, partial failures, stale copies and vendor outages), and each has a mechanism that detects or prevents it and a recovery.\n\n**Advances the thesis** (S2, S3, S4, S5): Reads each failure against the mechanism that detects or prevents it.\n\n**Transition in:** `contrast`: The mechanisms working. → What goes wrong and what catches it.\n\n**Order of paragraphs** (`grouping`): In the order of the mechanisms: duplicates (one writer and a key), gaps (outbox, sweep, DLQ), retry storms (backoff), partial failures (sagas), stale copies (reconciliation), and vendor outages last because they combine gaps with a sweep as the net.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p52 | process | Duplicates, like the Double Refund, are prevented by one writer and a key, detected by the daily refund reconciliation and recovered by a reversal and a block on the second writer. |  |  |\n| p53 | process | Gaps (a webhook dropped, a subscription deleted, an event stuck in a DLQ) are detected by the sweep and the DLQ alarm and recovered by replay, which is safe only because of idempotency. |  | `contrast`: Messages that arrive twice. → Messages that never arrive. |\n| p55 | process | Retry storms against a recovering ERP are prevented by backoff with jitter on every caller and a circuit breaker (stop calling after repeated failures, try again later) on the calls that matter at peak. |  | `sequence`: Messages that never arrive. → Retries that overwhelm. |\n| p56 | process | Partial failures are handled by the saga's compensations or found by the nightly order reconciliation; one nobody designed for becomes the Three-Status Order. |  | `sequence`: Retry storms. → Processes that stop halfway. |\n| p54 | process | Stale copies, like the 390 variants and the Price Drift (a silently failed price sync), are detected by the reconciliation job and the alert on a missed run and recovered by overwriting from the system of record and finding the writer. |  | `sequence`: Failures inside one flow's messages and steps. → Copies that have drifted, which only a comparison finds. |\n| p57 | process | Vendor outages, like the PSP's 40-minute pause in August 2026, stop webhooks too; retries resume only within the vendor's window, so a daily sweep of orders not in a terminal payment state is the net under the net. | case: The PSP paused Kestrel & Pine's account for 40 minutes in August 2026 (the Card-Testing Night). | `sequence`: Failures inside the merchant's flows. → Failures at the vendor. |\n\n## Conclusion: What to Take Away\n\n**Synthesis:** The five mechanisms are of two kinds: four reduce disagreement (the key, the outbox or sweep, retries into a watched queue, compensation) and one measures what is left (reconciliation), so the comparison belongs to the integration from its first day rather than to a later audit.\n\n**So what:** A flow that creates, moves or pays goes live only with a stated key and a reconciliation card, and a difference is answered by asking who else writes the fact, not by buying a faster sync; a reader can ask both questions of any integration in a design review.\n\n**Callback:** The introduction's lost warehouse reply and the order instruction sent again. Paragraph p58 says what now makes that repeat safe (the order number as key), what ensures the instruction was sent at all (the outbox or sweep) and what shows the next morning that warehouse and shop agree (the nightly order reconciliation).\n\n**Takeaway** (`course_of_action`): For each flow that creates, refunds, captures or adjusts stock at your company, name its idempotency key and write its reconciliation card; when the card's job finds differences, ask first who else writes the fact.\n\n**Hand-off** to [Promises Between Systems: API Contracts, Webhooks and Versioning](api-contracts-and-versioning.html): `contrast`: The recovery mechanisms of this chapter, which protect a flow against messages that repeat, arrive late or go missing. → What those mechanisms cannot protect against: the other side changing the shape, meaning or lifetime of its interface (a field renamed, a version retired, a webhook format revised on a date the vendor chose), with the Deprecated Endpoint as the worked example.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p58 | synthesis | The warehouse whose reply was lost is safe when it recognizes the order number as the key, the instruction is certain to have been sent when it was saved with the order or swept, and the nightly order reconciliation shows the next morning whether both sides agree; four mechanisms reduce disagreement and only the comparison shows what remains, which is why it belongs to the integration from the first day. | reasoning: The opening's lost reply set against the chapter's mechanisms; the stock reconciliation and the Double Refund. |  |\n| p59 | synthesis (list) | Established: delivery is at least once and unordered, as the vendors' own documentation says; the idempotency key identifies the business action; the outbox, sagas with compensation and backoff with jitter are the standard answers. |  | `elaboration`: The chapter's answer in one paragraph. → The points it rests on, starting with what the sources establish. |\n| p60 | synthesis (list) | Depends on context: who builds the mechanisms by stage, when orchestration by an OMS is right, and how often each reconciliation runs, following the cost of a wrong copy. |  | `contrast`: What is established. → What depends on the merchant's situation. |\n| p61 | recommendation (list) | The author's synthesis: the reconciliation card is part of the integration, required before any flow that creates, moves or pays goes live, and most drift has a writer that should not have been writing. |  | `contrast`: What is established and what depends on context. → The author's own judgement, labelled as such. |\n| p62 | recommendation (list) | Eight questions let the reader find, in their own company, each flow's key, its behaviour on duplicates and reordering, its DLQ and owner, the writers of each money action, the reconciliation jobs and their direction of fix, what would notice stopped webhooks, and the order saga's orchestrator and compensations. |  | `cause_effect`: The take-aways. → Questions that apply them to the reader's own company. |\n| p63 | transition | These mechanisms protect a flow against the messages it receives but not against the other side changing the shape of those messages, which the next chapter takes up with the Deprecated Endpoint as its example. |  | `contrast`: The questions about messages that repeat, arrive late or go missing. → What the mechanisms do not cover. |\n\n## Non-goals\n\n- Integration styles, triggers, iPaaS and the integration inventory. See [APIs, Events, Files and Middleware: How Commerce Systems Talk](integration-styles.html).\n- API contracts, versioning, deprecation and webhook signatures. See [Promises Between Systems: API Contracts, Webhooks and Versioning](api-contracts-and-versioning.html).\n- The order state machine, order sourcing and the OMS as a product; available-to-promise and reservations. See [The Order Record: Lifecycle, State and the Order Management System](order-management.html), [Is It in Stock? Inventory, Availability and the Promise You Can Keep](inventory-and-availability.html).\n- Payment flows, PSP status models and payout reports in depth. See [Taking the Money: Payment Providers, Authorization, Capture and Refunds](commerce-payments.html), [Reconciled by Design: Traceability and Audit Across Boundaries](../finance-systems-architecture/traceability-and-reconciliation.html).\n- Peak-day capacity, backpressure and circuit breakers in depth; observability. See [Black Friday Every Year: Peak Load, Resilience and Recovery](peak-load-and-reliability.html).\n- Customer and product identity matching. See [One Customer, One Product: Identity and Master Data Across Systems](identity-and-master-data.html).\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-07** — Made reconciliation the spine (scene, card, diagram, synthesis) rather than idempotency, because the contract's Kestrel & Pine thread is the stock reconciliation and because reconciliation is the mechanism newcomers most often omit; idempotency and the outbox are taught as what reconciliation then verifies. Rejected: Idempotency as the spine.\n- **2026-11-07** — Taught the outbox with the honest caveat that a SaaS merchant cannot build or inspect the platform's outbox and that webhook-plus-sweep is its external equivalent, rather than presenting the outbox as something every reader will implement. Rejected: Presenting the outbox as something every reader builds.\n- **2026-11-07** — Explained sagas through three named commerce sagas (place order, cancel after shipment, split shipment) and named the OMS as the orchestrator, rejecting a generic microservices treatment, because the reader's decision is whether W2's OMS earns its place. Rejected: A generic microservices treatment of sagas.\n- **2026-11-07** — Kept monitoring to one paragraph applying the four golden signals per flow, since peak-load-and-reliability owns observability. Rejected: A monitoring section of its own.\n- **2026-11-12** — Converted spec.md to spec.json from the published chapter. Intent outcome, acceptance criteria AC-1 to AC-5, thesis and role copied unchanged from the journal spec. The old success criteria were inventories (term list, tables, diagrams, sections, word count) and are dropped; the outcomes they aimed at are covered by AC-1 to AC-5 and the length limit. Units the contract asks for and the published chapter lacked were added: a thesis paragraph (p05), a roadmap (p06) and a conclusion paragraph answering the opening (p58). The one-line '(The author's recommendation; the Kestrel & Pine cadences are illustrative.)' after the per-flow table is folded into p39's lead sentence so the table's label belongs to its paragraph. Word limit kept at 6,500. Rejected: Carrying the success criteria over as written.; Adding criteria of my own beyond the journal spec's.\n- **2026-11-12** — Flow rubric (sound with notes) taken without review, as the author asked for this pass: the flow rationale now gives the real reason the key precedes the outbox (the relay and every retry repeat messages) and why flows, choices, stages and In Practice sit where they do; 'When It Goes Wrong' reordered to the order of the mechanisms (stale copies after partial failures); In Practice no longer repeats evidence given earlier (Stripe's idempotent requests, Business Central and Stripe's payout report cut there; p46 and p47 dropped, Walmart's age caveat merged into p45); the SRE golden signals moved into the monitoring paragraph, removing a forward reference; the Price Drift glossed; section patterns for consistency and at-least-once corrected; the conclusion's opening paragraph no longer repeats the 'writers that should not have been writing' point, which stays in the author's synthesis. Rejected: Shortening p33 (the OMS as orchestrator) to leave the judgement to p42: both are the author's and p33 states the role, p42 the threshold.; Shortening p03 or p05 so the five mechanisms are not listed twice in the introduction: p03 names the jobs, p05 states the claim the contract requires.; Adding Eva to a mechanism section: new material.\n- **2026-11-12** — Second flow rubric (sound with notes) taken without review: scene section's pattern relabelled problem_solution; 'When It Goes Wrong' controlling idea lists the failures in their new order; two-phase commit glossed in p40; the rationale says why compensation follows retries. Rejected: Cutting the Duplicates paragraph (p52) to a pointer: it is the author's and gives the recovery step.; Moving the monitoring paragraph (p51) to open 'When It Goes Wrong': the rubric said leaving it also works, and a section move would need new headings and
