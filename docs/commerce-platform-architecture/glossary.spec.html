<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "> Reconstructed on 2026-11-13 from the published page (posts/glossary/index.md) and its former spec.md, whose Non-goals, Open questions, Decision log, Sources and Changelog are carried over. One spec paragraph per unit of the page, in its order; each section's lead paragraph and its table are one list-form unit with the table as evidence, and the callouts stand before p01 as the house format. Intent, acceptance criteria and role are copied unchanged from journal-spec.json; the journal spec gives a reference page no thesis, so the thesis here is the page's own and only orders its sections. A light pass for a lookup page: entries were checked for consistency against the ledger, the rulings and the chapters' settled definitions, not rewritten.\n\n## Intent\n\n**After reading, the reader should:**\n\n- **Know:** The book's terms in one or two plain sentences each, grouped by part, with standards and regulations and Kestrel & Pine names in their own tables, dated as of November 2026.\n- **Be able to:** Look up a term met in a chapter, read it beside the terms it is confused with, and follow the link to the chapter that owns it.\n\n**Acceptance criteria**\n\n| Id | Criterion | Check | Method | Severity |\n| --- | --- | --- | --- | --- |\n| AC-1 | A reader finds the definition of a contrasted term pair used in the payment chapters and the chapter that owns it. *Probe:* Using only this page: what is the difference between authorization and capture, which chapters explain them, and why is 'capture on shipment' a promise with a deadline? | `custom` | cold_reader | major |\n| AC-2 | A reader of chapter 25 finds the meaning of a term and of a Waypoint decision it uses. *Probe:* Using only this page: chapter 25 uses 'idempotency' and 'W5'. What does each mean, and which chapters explain them? | `custom` | cold_reader | major |\n| AC-3 | A reader comparing GMV figures across chapters 41 and 46 learns why they may not match. *Probe:* Using only this page: chapter 41 discusses GMV-based pricing and chapter 46 reports Shopify's GMV. What is GMV, and why might the two figures be defined differently? | `custom` | cold_reader | minor |\n| AC-4 | A reader of the introduction alone (the callouts and the paragraphs before the first section heading) can predict what the page contains and the kind of evidence or material it uses. *Probe:* After reading only the introduction: what will this page give you, in what order, and from what kind of material? | `intro_predicts_content` | cold_reader | major |\n\n## Thesis\n\n**Question:** What does each commerce and architecture term used in the book mean?\n\n> **Claim:** Each term the book uses has one plain definition that follows its owning chapter, set beside the terms it is confused with and linked to that chapter; standards are dated and defer to their source, and Kestrel & Pine's names are labelled fictional.\n\n**Disputed by:** The view that a reader can search the chapter or the web for a term, so a separate glossary only duplicates the chapters and drifts from them.\n\n**So what:** A reader who meets a term out of order gets the owning chapter's meaning in one place, with the neighbours it is confused with, and a writer or AI tool that finds a row and a chapter disagreeing has a defect to fix.\n\n**How and why:** The definitions were harvested from each chapter's bold first-use definitions and definition tables and checked against the scenario ledger and the consistency rulings; slash rows set contrasted terms side by side, and every row links to its chapter.\n\n**Supporting claims**\n\n- **G1** — A reader can find any term, alias or abbreviation by part or through the alphabetical index.\n- **G2** — Each definition follows its owning chapter, sits beside its confusable neighbours and links to that chapter.\n- **G3** — Standards, protocols and regulations carry their scope and a date and defer to the official source.\n- **G4** — Kestrel & Pine's names are labelled fictional and agree with the scenario ledger.\n\n## Role in the part\n\nGives the book one vocabulary: each term's meaning, its confusable neighbors and the chapter that owns it, so a chapter can be read out of order. Supports PR-3 of part `reference`.\n\n## Flow\n\n**Pattern:** `large_to_small`\n\nHow to use the page comes first; the terms follow in the book's own order, from the reading conventions of the preface through Parts I to XI, so a reader who knows the chapter finds its section; the cross-cutting standards and the fictional names come after the parts they serve, and the alphabetical index closes the lookup for a reader who knows only the word.\n\n## Introduction\n\n**Hook** (`direct_statement`): A storefront's 'order' can differ from an invoice or a warehouse shipment, and 'in stock' may mean physical stock, sellable stock or a stale copy.\n\n**Bridge:** The reader has met a term in a chapter, often read out of order, and the toolkit's cards closed by pointing to the definitions of the terms they use. → Those differences in meaning change system behaviour and the conclusions drawn from reports, so each term needs one meaning and an owning chapter.\n\n**Thesis statement** (IN THIS SECTION and KEY POINTS callouts and paragraph p01): This page gives every term the book uses one plain definition and a link to the chapter that owns it; read the rows around a term for the terms it is confused with.\n\n**Roadmap** (IN THIS SECTION callout, paragraph p01 and the How to Use section):\n\n- How to find a term and read a row. *Kept in:* how-to-use.\n- The terms for reading the book's claims. *Kept in:* reading.\n- The terms of each part, beside their confusable neighbours. *Kept in:* commerce, catalog, order, fulfillment, channels, integration, platform, trust, journeys, evolution, practice.\n- Standards and regulations, dated. *Kept in:* standards.\n- The fictional company's names. *Kept in:* kestrel.\n- An alphabetical index of every term and alias. *Kept in:* index.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p01 | context | This page gives each term one plain definition and an owning chapter, to be looked up by part or index and read beside its neighbours, because terms like 'order' and 'in stock' mean different things in different systems. |  |  |\n\n## Sections\n\n### How to Use This Glossary\n\n**Controlling idea** (`explanation`, id `how-to-use`): The page can be browsed by part or searched through the alphabetical index, its rows are short teaching definitions with slash rows for contrasted terms, and its fictional and legal entries are labelled as such.\n\n**Advances the thesis** (G1, G2): Tells the reader how to find a term and how to read a row.\n\n**Transition in:** `elaboration`: The page's purpose stated in the opening. → How to find a term and read a row.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p02 | explanation | Browse by the book's parts or jump to the alphabetical index; an opening section explains how to read the book's claims, and separate tables hold standards and the fictional names. |  |  |\n| p03 | explanation | The rows give short teaching definitions linked to fuller treatment, with slash rows defining contrasted terms together and acronyms expanded. |  | `elaboration`: Where to look. → What a row holds. |\n| p04 | context | Kestrel & Pine is fictional, and legal, standards and vendor entries are summaries that defer to the cited source. |  | `additional_support`: What a row holds. → How far a row can be trusted. |\n\n### <a id=\"g-reading\"><\/a>Preface — Evidence Labels, Take-Away Tiers and Failure Patterns\n\n**Controlling idea** (`definition`, id `reading`): The terms for reading the book's claims come first: evidence labels, take-away tiers, scale stages and the sixteen failure patterns.\n\n**Advances the thesis** (G2): Defines this group's terms beside their confusable neighbours, each linked to its owning chapter.\n\n**Transition in:** `sequence`: How to use the page. → The next group of terms, in the book's order.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p05 | definition | The terms for reading the book's claims come first: evidence labels, take-away tiers, scale stages and the sixteen failure patterns. | table: Evidence labels, take-away tiers, the four scale stages and the sixteen failure patterns, linked to the introduction and where-commerce-platforms-go-wrong. |  |\n\n### <a id=\"g-commerce\"><\/a>Part I — COMMERCE: What a Commerce Platform Is\n\n**Controlling idea** (`definition`, id `commerce`): Part I's terms define the order, its promises, handoffs and status lines, business models, capabilities, systems of record and platform categories.\n\n**Advances the thesis** (G1, G2): Defines this group's terms beside their confusable neighbours, each linked to its owning chapter.\n\n**Transition in:** `sequence`: The previous group of terms. → The next group of terms, in the book's order.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p06 | definition | Part I's terms define the order, its promises, handoffs and status lines, business models, capabilities, systems of record and platform categories. | table: Promise, handoff, order, status line, system, system of record, copy and writer, commerce platform and shop platform, GMV and the business-model terms. |  |\n\n### <a id=\"g-catalog\"><\/a>Part II — CATALOG: Products, Prices and Promises\n\n**Controlling idea** (`definition`, id `catalog`): Part II's terms define products and variants, prices, promotions, discovery and sellable stock.\n\n**Advances the thesis** (G1, G2): Defines this group's terms beside their confusable neighbours, each linked to its owning chapter.\n\n**Transition in:** `sequence`: The previous group of terms. → The next group of terms, in the book's order.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p07 | definition | Part II's terms define products and variants, prices, promotions, discovery and sellable stock. | table: Product / variant / SKU, price lists, promotions, search, on hand / committed / reserved and available-to-promise. |  |\n\n### <a id=\"g-order\"><\/a>Part III — ORDER: Cart, Checkout, Payment and the Order Record\n\n**Controlling idea** (`definition`, id `order`): Part III's terms follow the cart into checkout, payment, order coordination and the financial record.\n\n**Advances the thesis** (G1, G2): Defines this group's terms beside their confusable neighbours, each linked to its owning chapter.\n\n**Transition in:** `sequence`: The previous group of terms. → The next group of terms, in the book's order.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p08 | definition | Part III's terms follow the cart into checkout, payment, order coordination and the financial record. | table: Checkout, idempotency key, authorization / capture, settlement / payout, order management and invoicing terms. |  |\n\n### <a id=\"g-fulfillment\"><\/a>Part IV — FULFILLMENT: From Warehouse to Doorstep and Back\n\n**Controlling idea** (`definition`, id `fulfillment`): Part IV's terms define warehouse work, delivery, stores, returns and the customer-facing status record.\n\n**Advances the thesis** (G1, G2): Defines this group's terms beside their confusable neighbours, each linked to its owning chapter.\n\n**Transition in:** `sequence`: The previous group of terms. → The next group of terms, in the book's order.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p09 | definition | Part IV's terms define warehouse work, delivery, stores, returns and the customer-facing status record. | table: Picking and waves, carriers and labels, click-and-collect, returns and dispositions, WISMO and the order status page. |  |\n\n### <a id=\"g-channels\"><\/a>Part V — CHANNELS: Selling Everywhere\n\n**Controlling idea** (`definition`, id `channels`): Part V's terms cover channels where an outside party sets the rules: marketplaces, business buyers, trading partners and the back office.\n\n**Advances the thesis** (G1, G2): Defines this group's terms beside their confusable neighbours, each linked to its owning chapter.\n\n**Transition in:** `sequence`: The previous group of terms. → The next group of terms, in the book's order.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p10 | definition | Part V's terms cover channels where an outside party sets the rules: marketplaces, business buyers, trading partners and the back office. | table: Listings and channel allocation, B2B terms, EDI messages (ORDERS, DESADV, INVOIC, SSCC), Peppol and ERP integration. |  |\n\n### <a id=\"g-integration\"><\/a>Part VI — INTEGRATION: Making Separate Systems Behave Like One\n\n**Controlling idea** (`definition`, id `integration`): Part VI's terms explain how systems exchange facts, survive missing or repeated messages, keep contracts, match identities and produce comparable metrics.\n\n**Advances the thesis** (G1, G2): Defines this group's terms beside their confusable neighbours, each linked to its owning chapter.\n\n**Transition in:** `sequence`: The previous group of terms. → The next group of terms, in the book's order.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p11 | definition | Part VI's terms explain how systems exchange facts, survive missing or repeated messages, keep contracts, match identities and produce comparable metrics. | table: Integration styles, idempotency, outbox, retries, reconciliation job, API contracts, master data and analytics terms. |  |\n\n### <a id=\"g-platform\"><\/a>Part VII — PLATFORM: How Commerce Platforms Are Built\n\n**Controlling idea** (`definition`, id `platform`): Part VII's terms describe how the software is structured, shared, extended, delivered to the browser and kept up on the busiest day.\n\n**Advances the thesis** (G1, G2): Defines this group's terms beside their confusable neighbours, each linked to its owning chapter.\n\n**Transition in:** `sequence`: The previous group of terms. → The next group of terms, in the book's order.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p12 | definition | Part VII's terms describe how the software is structured, shared, extended, delivered to the browser and kept up on the busiest day. | table: Monolith / modular monolith, tenants, apps and extensions, headless storefronts, caching and peak-load terms. |  |\n\n### <a id=\"g-trust\"><\/a>Part VIII — TRUST: Security, Privacy and Regulation\n\n**Controlling idea** (`definition`, id `trust`): Part VIII's terms name what attackers try, what the law asks of customer data and how rules become requirements.\n\n**Advances the thesis** (G1, G2): Defines this group's terms beside their confusable neighbours, each linked to its owning chapter.\n\n**Transition in:** `sequence`: The previous group of terms. → The next group of terms, in the book's order.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p13 | definition | Part VIII's terms name what attackers try, what the law asks of customer data and how rules become requirements. | table: Card testing, PCI scope, skimming, controller / processor, lawful basis and the regulation-to-requirement terms. |  |\n\n### <a id=\"g-journeys\"><\/a>Part IX — JOURNEYS: One Order, End to End\n\n**Controlling idea** (`definition`, id `journeys`): Part IX adds only the few terms the journeys introduce, since their vocabulary is defined in earlier parts.\n\n**Advances the thesis** (G1, G2): Defines this group's terms beside their confusable neighbours, each linked to its owning chapter.\n\n**Transition in:** `sequence`: The previous group of terms. → The next group of terms, in the book's order.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p14 | definition | Part IX adds only the few terms the journeys introduce, since their vocabulary is defined in earlier parts. | table: Happy path / variant path and the journey terms. |  |\n\n### <a id=\"g-evolution\"><\/a>Part X — EVOLUTION: Decisions That Change With Scale\n\n**Controlling idea** (`definition`, id `evolution`): Part X's terms cover choosing, changing and organizing platforms, and where AI fits.\n\n**Advances the thesis** (G1, G2): Defines this group's terms beside their confusable neighbours, each linked to its owning chapter.\n\n**Transition in:** `sequence`: The previous group of terms. → The next group of terms, in the book's order.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p15 | definition | Part X's terms cover choosing, changing and organizing platforms, and where AI fits. | table: Build, buy or assemble, total cost of ownership, shadow / parallel run, scale-stage, team and agentic-commerce terms. |  |\n\n### <a id=\"g-practice\"><\/a>Part XI — PRACTICE: How Others Built It\n\n**Controlling idea** (`definition`, id `practice`): Part XI's terms are the public names and programs the four case studies rely on, described only as their dated sources describe them.\n\n**Advances the thesis** (G1, G2): Defines this group's terms beside their confusable neighbours, each linked to its owning chapter.\n\n**Transition in:** `sequence`: The previous group of terms. → The next group of terms, in the book's order.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p16 | definition | Part XI's terms are the public names and programs the four case studies rely on, described only as their dated sources describe them. | table: Shopify, Amazon, Zalando and composable-movement names and programs. |  |\n\n### <a id=\"g-standards\"><\/a>Standards, Protocols and Regulations\n\n**Controlling idea** (`definition`, id `standards`): The laws, standards and protocols the chapters cite are listed with their scope and a one-line meaning dated November 2026, deferring to the official source.\n\n**Advances the thesis** (G3): Defines this group's terms beside their confusable neighbours, each linked to its owning chapter.\n\n**Transition in:** `sequence`: The previous group of terms. → The next group of terms, in the book's order.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p17 | definition | The laws, standards and protocols the chapters cite are listed with their scope and a one-line meaning dated November 2026, deferring to the official source. | table: Each row gives term, scope (EU, NL, BE, DE, US or global), short name, meaning and chapter. |  |\n\n### <a id=\"g-kestrel\"><\/a>Kestrel & Pine Names (Fictional)\n\n**Controlling idea** (`definition`, id `kestrel`): Kestrel & Pine's names, systems, people, decisions W1–W8 and incidents are labelled fictional and agree with the scenario ledger.\n\n**Advances the thesis** (G4): Defines this group's terms beside their confusable neighbours, each linked to its owning chapter.\n\n**Transition in:** `sequence`: The previous group of terms. → The next group of terms, in the book's order.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p18 | definition | Kestrel & Pine's names, systems, people, decisions W1–W8 and incidents are labelled fictional and agree with the scenario ledger. | table: The company, Waypoint and W1–W8, its systems by role, its people, its customers and orders, and its named incidents. |  |\n\n### <a id=\"g-index\"><\/a>Alphabetical Index\n\n**Controlling idea** (`description`, id `index`): Every term and alias is listed alphabetically with a link to the section that defines it.\n\n**Advances the thesis** (G1): Lets a reader with one term find its row without knowing which part owns it.\n\n**Transition in:** `conclusion_summary`: Every table above. → One alphabetical list of their terms and aliases.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p19 | description (list) | After a one-sentence lead-in, every term and alias of the tables above is listed alphabetically with a link to the section that defines it. |  |  |\n\n## Conclusion: Where to Go Next\n\n**Synthesis:** The tables and the index are two ways into one vocabulary whose every row points back to the chapter that owns it.\n\n**So what:** A reader can check a term against its chapter without rereading it, and a disagreement between the two is a defect to fix.\n\n**Callback:** The opening's 'order' and 'in stock' that mean different things in different systems. Each now has one row and one owning chapter.\n\n**Takeaway** (`course_of_action`): Use the toolkit for working records, domain coverage for the chapter map, and the bibliography for the dated sources behind each definition.\n\n**Hand-off** to [Bibliography: Every Source the Book Cites](bibliography.html): `sequence`: The glossary's definitions and its closing pointer to the sources behind them, with their publication dates. → The register of every cited source by topic and by chapter.\n\n| Id | Function | Controlling idea | Evidence | Transition in |\n| --- | --- | --- | --- | --- |\n| p20 | transition | The tables and the index are two ways into one vocabulary in which each term has one owning chapter, so a disagreement is a defect; the toolkit holds the working records, domain coverage the chapter map, and the bibliography, the book's last page, the dated sources behind every definition. |  |  |\n\n## Non-goals\n\n- Teaching any concept in depth; the linked chapter does that, with sources and the worked example.\n- Authoritative legal, tax or standards definitions; the official source wins.\n- Templates, the model-to-chapter map and sources See [Toolkit: Cards and Templates for Commerce Architecture Decisions](toolkit.html), [Domain Coverage: From Three Model Families to the Book's Chapters](domain-coverage.html), [Bibliography: Every Source the Book Cites](bibliography.html).\n- Every term the book mentions: failure-handling table rows, one-off vendor features and narrow mechanisms stay in their chapters.\n\n## Modalities\n\nArticle only.\n\n## Decision log\n\n- **2026-11-13** — Converted spec.md to spec.json in a light pass for a lookup page: one spec paragraph per draft unit, each section's lead paragraph and table as one list-form unit with the table as evidence; the thesis is the page's own because the journal spec gives a reference page none. length.max_words is the published length plus 10%: 16,733 words as check_draft counts them (tables and Sources excluded; derived from the 16,993 after this pass less the 260 words it added), so 18,406; 19,095 by wc. Rejected: Specifying each table row as a paragraph; Carrying the old inventory-style success criteria over\n- **2026-11-13** — Auto-resolved by the author's standing instruction of 2026-11-12: the GMV open question is settled by consistency ruling 20 (in this book GMV is before refunds and returns; a company's reported GMV follows its own definition); the row now says so and keeps Shopify's net-of-refunds definition as the example. Rejected: Leaving the row saying only that definitions differ\n- **2026-11-13** — Auto-resolved by the author's standing instruction of 2026-11-12: the SKU open question is settled by consistency ruling 21 (the glossary follows chapter 06; 'a SKU' for the variant is accepted shorthand); the row already does both. Rejected: Changing the row to the ledger's wording\n- **2026-11-13** — Consistency fixes to book-wide vocabulary and the ledger, entries otherwise unchanged: 'Commerce platform' row now gives chapter 1's meaning (the whole set of systems that make and keep promises) and chapter 5's market sense, named the shop platform; 'The platform' row renamed 'The shop platform' with 41 apps in January 2027 and 34 by July 2027 (ruling 10); 'System' takes chapter 1's definition; added 'Status line' (chapter 1's definition) and 'single writer' to the copy / writer row (chapter 4's ownership test); system of record and ATP aligned with chapters 4 and 10; handoff adds chapter 1's acceptance rule; stock sync chain says 'up to two hours' with no hop intervals; 'commerce platform' and 'SaaS platform' meaning the hosted product changed to 'shop platform' in two rows; a first sentence saying what the page is for and how to use it added to p01; index entries added for the new and renamed rows. Rejected: Rewriting entries beyond the contradictions; Adding terms no chapter defines\n- **2026-11-13** — After draft-check round 1 (REVISE), cheap fixes applied without a second round: the opening paragraph states its purpose once with the 'order' / 'in stock' examples as the reason and now names the preface, slash rows, standards table and fictional names (AC-4); the preface is described the same way in How to Use and its own paragraph; Part V's lead is a sentence that no longer calls the back office an outside party; Duiven and Waypoint W6 link to the Kestrel & Pine section; the Build / buy / assemble row maps the four shapes onto the three verbs (chapter 41's table); the standards column 'Short name' renamed 'Name'; the Kestrel lead says the scenario runs into 2028; a blank line and a one-sentence lead-in (part of p19's list unit) added before the index; fifteen 'X' index entries that duplicated 'The X' at the same anchor removed; the conclusion gains the synthesis, callback and so-what sentence nsistency-issues.md — Kestrel & Pine facts and the rulings the rows follow.\n  - bibliography — The external sources cited in the owning chapters.\n\n## Changelog\n\n- **2026-11-13** — spec.md converted to spec.json; consistency fixes to vocabulary rows, Status line added, use-this-page first sentence added to index.md.\n- **2026-11-07** — Initial spec and article.\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
