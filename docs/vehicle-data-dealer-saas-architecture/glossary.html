<script id="data" type="application/json">{"meta": {"title": "Glossary", "date": "2026-10-22", "author": "Željko Obrenović", "excerpt": "Plain-language definitions of the book's vehicle-data, dealer-workflow, SaaS, distribution, operations and leadership terms, grouped by part, with a table of Dutch, Belgian, German, UK and US register terms, Axleby's fictional names in their own section, an alphabetical index and a link from every term to the chapter that owns it.", "permalink": "glossary", "timetoread": "84 min read", "icon": "assets/icons/glossary.png", "logo": "assets/images/glossary/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": [], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **IN THIS SECTION, YOU WILL:** Find the book's vocabulary in one place: read a short definition grouped with the other terms of the same part, decode a Dutch, German, UK or US register word, follow the link to the chapter that owns the term, or look a term or abbreviation up in the alphabetical index at the end.\n\n> **KEY POINTS:**\n>\n> * **Look a term up, then read its neighbors.** Each section collects one part's terms, so the rows around a term carry the contrasts that cause real design errors: vehicle versus stock item versus channel listing versus market vehicle, plate versus VIN versus vehicle key, stand-time versus days-to-turn, damage estimate versus reconditioning cost, issued versus live artifact.\n> * **One term, one meaning, one owning chapter.** Every row links to the chapter that owns or best explains the term, and the definitions follow how those chapters define them. When a chapter and this page disagree, one of them needs correcting.\n> * **Register, regulatory and company terms date quickly.** Registers, laws, standards, products and their status are given as of 2026, following the sources cited in the chapters. Check the current source before a definition here goes into a contract, a license, a register integration or a design decision.\n\n> **[FAILURE PATTERNS THIS SECTION ADDRESSES](where-vehicle-platforms-go-wrong.html):**\n>\n> * **The Cloned Identity** — the same failure at the level of words: when \"vehicle\" means the physical car in one system, the dealer's stock stay in another and an advert in a third, records of different cars get merged and one car gets several records.\n> * **The Acquisition Archipelago** — acquired products bring their own words for vehicle, customer and \"sold\"; one shared vocabulary, with one owner per term, is where one platform starts.\n\n<br>\n\nThe words that matter most in this book are ordinary ones. **\"Sold\" means five different things** to market data, the dealer's dossier, the DMS, the register and a business-to-business trade, and **\"customer\" means a paying organization, a tenant, an enquirer, a buyer and a DMS customer number** depending on who is speaking ([Drawing the Lines: Bounded Contexts, Entities and Sources of Truth](vehicle-bounded-contexts.html)). This glossary pins each term to one definition and one owning chapter, so that the chapters, their readers and the AI tools that read them use the words the same way.\n\n## How to Use This Glossary\n\nThe sections follow the book's structure. The first collects the **six evidence labels** every chapter uses and the **fifteen failure patterns** from the Preface; the next nine follow **Parts I to IX**, from the business of vehicle data through identity, value, the dealer workflow, tenancy and billing, distribution and operations to the end-to-end journeys and the Chief Architect's agenda; **Part X** collects the public products and programs the case studies rely on. Then come two reference tables: the **register terms** of the Netherlands, Belgium, Germany, the United Kingdom and the United States, and **Axleby's fictional names**. The **alphabetical index** at the end lists every term, alias and abbreviation with a link to the section that defines it.\n\nEach section opens with the chapters that own its terms, then a `| Term | Definition | Chapter |` table with 399 rows in all. The definitions are short teaching descriptions, not legal text, standards or vendor documentation; the chapter in the last column gives the full treatment, the sources and the worked example. Rows that combine two or more terms with a slash define all of them, because the difference between them is the point. Acronyms are expanded in the term or the definition. Axleby, named in some rows and in its own section, is the fictional vehicle-data and dealer-software group this book follows ([Meet Axleby: A Data Business and a Software Business Under One Roof](meet-axleby.html)); its names and numbers are illustrations, not facts about any real company.\n\n## <a id=\"g-reading\"><\/a>Preface — Evidence Labels and Failure Patterns\n\nEvery chapter marks what kind of statement it is making, and names the recurring ways vehicle platforms fail. [Introduction: Architecture for Decisions About One Car](introduction.html) explains the six evidence labels; [Wrong Car, Wrong Price: Fifteen Ways Vehicle Platforms Go Wrong](where-vehicle-platforms-go-wrong.html) tells each of the fifteen failure patterns with its warning signs, mechanism, cost and the half it hits hardest. The last column names the guide and the chapter that does most of the repair work.\n\n| Term | Definition | Chapter |\n| --- | --- | --- |\n| **Documented fact** | A company's public statement, a filing, a regulation, a standard, a date or an official statistic, linked inline with the year of publication in the sentence. Company evidence older than about three years may describe systems that have since been replaced. | [Introduction: Architecture for Decisions About One Car](introduction.html) |\n| **Industry practice** | What vehicle-data and dealer-software businesses commonly do, phrased as \"commonly\" or \"a typical pattern is\", with no invented percentages. | [Introduction: Architecture for Decisions About One Car](introduction.html) |\n| **Reference-architecture inference** | How a system like this is plausibly built, reasoned from engineering principles. When it concerns a real company it is labeled INFERENCE, NOT DOCUMENTED and is never a description of that company's systems. | [Introduction: Architecture for Decisions About One Car](introduction.html) |\n| **Recommendation (evidence label)** | The author's judgement as a Chief Architect, in the first person, with the reasoning and the conditions under which it does not hold. | [Introduction: Architecture for Decisions About One Car](introduction.html) |\n| **Illustration** | An example set at Axleby, the fictional group the book follows. It is labeled fictional in each chapter, and its numbers agree across the book through one scenario ledger. | [Introduction: Architecture for Decisions About One Car](introduction.html), [Meet Axleby: A Data Business and a Software Business Under One Roof](meet-axleby.html) |\n| **Labeled assumption** | An illustrative volume, latency target or cost that is neither documented nor an Axleby fact, marked \"assume…\" in the text or *(assumption)* in a table. Follow the reasoning; do not use it as a benchmark. | [Introduction: Architecture for Decisions About One Car](introduction.html) |\n| **Failure pattern** | A named, recurring way a vehicle platform goes wrong, with warning signs that can be checked in a design review and a note on which half (data services, dealer SaaS or both) it hits hardest. The book uses fifteen. | [Wrong Car, Wrong Price: Fifteen Ways Vehicle Platforms Go Wrong](where-vehicle-platforms-go-wrong.html) |\n| **The Cloned Identity** | Vehicles are keyed by plate or by a product's own stock id, so one record mixes two cars or one car appears as several. Hits the data half hardest. | [Wrong Car, Wrong Price: Fifteen Ways Vehicle Platforms Go Wrong](where-vehicle-platforms-go-wrong.html), [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html) |\n| **Spec Guesswork** | Edition and options are inferred from model names or dealer input, so adverts, valuations and reports disagree about what the car is. Hits both halves. | [Wrong Car, Wrong Price: Fifteen Ways Vehicle Platforms Go Wrong](where-vehicle-platforms-go-wrong.html), [What Exactly Was Built: Specification, Trim and Equipment Data](specification-and-equipment.html) |\n| **Provenance Amnesia** | Facts are stored without source, observation date, license or confidence, so nobody can say where a number came from or whether it may be shown. Hits the data half hardest. | [Wrong Car, Wrong Price: Fifteen Ways Vehicle Platforms Go Wrong](where-vehicle-platforms-go-wrong.html), [Where Did This Fact Come From? Provenance, Freshness and Data Quality](provenance-and-data-quality.html) |\n| **The Sticky Error** | A corrected fact lives on in caches, reports, valuations, adverts and clients' copies, because nobody knows where it spread. Hits both halves. | [Wrong Car, Wrong Price: Fifteen Ways Vehicle Platforms Go Wrong](where-vehicle-platforms-go-wrong.html), [A Fact Was Wrong: Propagating a Vehicle Data Correction](journey-data-correction.html) |\n| **The Confident Valuation** | Valuations come without confidence, comparables or back-testing, and keep being trusted after the market moves. Hits the data half hardest. | [Wrong Car, Wrong Price: Fifteen Ways Vehicle Platforms Go Wrong](where-vehicle-platforms-go-wrong.html), [What Is It Worth? Building and Governing a Valuation Engine](valuation-engine.html) |\n| **The Zombie Listing** | Sold or withdrawn cars stay live on portals because deletes are fire-and-forget and channel state is never reconciled. Hits dealer SaaS hardest. | [Wrong Car, Wrong Price: Fifteen Ways Vehicle Platforms Go Wrong](where-vehicle-platforms-go-wrong.html), [One Stock, Sixty Channels: Listing Syndication to Portals](listing-syndication.html) |\n| **Feed Roulette** | Dozens of channel and supplier adapters run without contracts, status feedback or monitoring, so every format change is discovered by a dealer. Hits dealer SaaS hardest. | [Wrong Car, Wrong Price: Fifteen Ways Vehicle Platforms Go Wrong](where-vehicle-platforms-go-wrong.html), [One Stock, Sixty Channels: Listing Syndication to Portals](listing-syndication.html) |\n| **The Leaky Lead** | Leads are lost, duplicated or misrouted between portals, inboxes, CRMs and DMS, and every hop reports success. Hits dealer SaaS hardest. | [Wrong Car, Wrong Price: Fifteen Ways Vehicle Platforms Go Wrong](where-vehicle-platforms-go-wrong.html), [Every Enquiry Counts: Lead Capture, Routing and CRM](leads-and-crm.html) |\n| **DMS Hostage** | Critical dealer workflows depend on brittle or unsanctioned DMS access, so when the DMS vendor changes terms or goes down, the dealer stops. Hits dealer SaaS hardest. | [Wrong Car, Wrong Price: Fifteen Ways Vehicle Platforms Go Wrong](where-vehicle-platforms-go-wrong.html), [Living With the DMS: Dealer Management System Integration](dms-integration.html) |\n| **The Tenant Blur** | Dealer groups, rooftops and users are bolted onto a single-dealer model; permissions are shared logins and tenant ids are optional. Hits dealer SaaS hardest. | [Wrong Car, Wrong Price: Fifteen Ways Vehicle Platforms Go Wrong](where-vehicle-platforms-go-wrong.html), [Dealers, Groups and Rooftops: Tenancy Models for Dealer SaaS](tenancy-and-dealer-groups.html) |\n| **The Unmetered Call** | Billable events are reconstructed from logs at month-end; no-hit rules, bundles and credits differ by product and nobody can explain an invoice. Hits both halves. | [Wrong Car, Wrong Price: Fifteen Ways Vehicle Platforms Go Wrong](where-vehicle-platforms-go-wrong.html), [Subscriptions, Lookups and No-Hit-No-Fee: Billing and Metering](billing-and-metering.html) |\n| **License Blindness** | Data is cached, combined or resold beyond what its source license and the client's purpose allow, and nobody can prove what was used for what. Hits the data half hardest. | [Wrong Car, Wrong Price: Fifteen Ways Vehicle Platforms Go Wrong](where-vehicle-platforms-go-wrong.html), [Allowed to Use It? Data Licensing, Purpose and Governance](data-licensing-and-governance.html) |\n| **Borrowed Uptime** | The platform's availability is the product of every register, supplier, portal and DMS it calls synchronously, so one outage stops the dealer. Hits both halves. | [Wrong Car, Wrong Price: Fifteen Ways Vehicle Platforms Go Wrong](where-vehicle-platforms-go-wrong.html), [When the Register Is Down: Reliability With External Dependencies](reliability-and-dependencies.html) |\n| **The Acquisition Archipelago** | Acquired products keep their own logins, vehicle keys, billing and data; customers re-type plates and the group cannot see one customer. Hits both halves. | [Wrong Car, Wrong Price: Fifteen Ways Vehicle Platforms Go Wrong](where-vehicle-platforms-go-wrong.html), [One Dossier, One Account: Integrating an Acquired Product Portfolio](one-platform-from-many-products.html) |\n| **Customization Creep** | Large customers get code forks, special fields and bespoke workflows instead of configuration and extension points, until every release is a migration. Hits dealer SaaS hardest. | [Wrong Car, Wrong Price: Fifteen Ways Vehicle Platforms Go Wrong](where-vehicle-platforms-go-wrong.html), [From Signed Contract to First Sale: Onboarding, Migration and Configuration](onboarding-and-configuration.html) |\n\n## <a id=\"g-market\"><\/a>Part I — Market\n\nThe business vocabulary: who knows what about a car, how dealers, data providers and software vendors make money, and how the platform is decomposed. [Who Knows What About a Car: The Vehicle Data and Dealer Software Ecosystem](vehicle-data-ecosystem.html) owns the participants and the value chain; [Margins, Days and Lookups: The Economics of Dealers, Data and SaaS](dealer-and-data-economics.html) owns the unit economics; [Mapping the Business: A Capability Map From Identify to Insight](vehicle-capability-map.html) and [Drawing the Lines: Bounded Contexts, Entities and Sources of Truth](vehicle-bounded-contexts.html) own the two decompositions.\n\n| Term | Definition | Chapter |\n| --- | --- | --- |\n| **Vehicle data services (data half)** | The half of the platform that sells identity, specification, history, condition, valuation and market data as APIs, reports, files and dashboards. At Axleby: Axleby Data and Odolo. | [Who Knows What About a Car: The Vehicle Data and Dealer Software Ecosystem](vehicle-data-ecosystem.html) |\n| **Dealer SaaS (workflow half)** | Software that dealers use to buy, stock, price, advertise, sell and register cars, sold as a subscription. At Axleby: Lotwise, Showroomly and Axleby Trade. | [Who Knows What About a Car: The Vehicle Data and Dealer Software Ecosystem](vehicle-data-ecosystem.html) |\n| **Vehicle data provider** | An organization that assembles facts about vehicles (identity, specification, history, valuations, market data) from registers, manufacturers, insurers, workshops and portals and sells them on. Providers are the platform layer of the ecosystem: they buy from everyone above them. | [Who Knows What About a Car: The Vehicle Data and Dealer Software Ecosystem](vehicle-data-ecosystem.html) |\n| **Register (vehicle register)** | An official vehicle register, never a commercial provider: the Dutch RDW, the Belgian DIV, the German KBA, the UK's DVLA and DVSA, and the US state departments of motor vehicles linked by NMVTIS. The book never calls a register a \"provider\". | [Who Knows What About a Car: The Vehicle Data and Dealer Software Ecosystem](vehicle-data-ecosystem.html), [The Authoritative Source: Vehicle Registers and Official Data Access](registers-and-official-data.html) |\n| **Dealer** | A business that sells vehicles. An **independent** dealer sells used cars without a manufacturer franchise; a **franchised** dealer holds a manufacturer franchise, and its DMS is also its channel to the manufacturer for orders, warranty and reporting. | [Who Knows What About a Car: The Vehicle Data and Dealer Software Ecosystem](vehicle-data-ecosystem.html) |\n| **Rooftop** | One physical dealership location, and what most dealer software is built around: stock sits there, portal accounts and franchise agreements name it, and subscriptions are priced per rooftop. The usual billing and tenancy unit. | [Who Knows What About a Car: The Vehicle Data and Dealer Software Ecosystem](vehicle-data-ecosystem.html), [Dealers, Groups and Rooftops: Tenancy Models for Dealer SaaS](tenancy-and-dealer-groups.html) |\n| **Dealer group** | A company that owns two or more rooftops, often under several legal entities and brands. | [Who Knows What About a Car: The Vehicle Data and Dealer Software Ecosystem](vehicle-data-ecosystem.html), [Dealers, Groups and Rooftops: Tenancy Models for Dealer SaaS](tenancy-and-dealer-groups.html) |\n| **Lessor** | A lease or rental company. Its remarketing desk sells returned and de-fleeted cars, usually to the trade. | [Who Knows What About a Car: The Vehicle Data and Dealer Software Ecosystem](vehicle-data-ecosystem.html), [Trader to Trader: B2B Exchanges, Auctions and Lease Remarketing](b2b-trade-and-remarketing.html) |\n| **Trader** | A business-to-business buyer or seller of vehicles, including exporters. | [Who Knows What About a Car: The Vehicle Data and Dealer Software Ecosystem](vehicle-data-ecosystem.html), [Trader to Trader: B2B Exchanges, Auctions and Lease Remarketing](b2b-trade-and-remarketing.html) |\n| **Data client** | An organization that buys vehicle data by API, file or license: an insurer, lessor, fleet manager, software vendor or portal. | [Who Knows What About a Car: The Vehicle Data and Dealer Software Ecosystem](vehicle-data-ecosystem.html), [Data as a Product: Designing Vehicle Data APIs](vehicle-data-apis.html) |\n| **Portal** | A consumer advertising marketplace for vehicles, such as mobile.de, AutoScout24, Auto Trader UK, Marktplaats or Cars.com. | [Who Knows What About a Car: The Vehicle Data and Dealer Software Ecosystem](vehicle-data-ecosystem.html), [One Stock, Sixty Channels: Listing Syndication to Portals](listing-syndication.html) |\n| **Value chain (vehicle)** | The sequence of decisions a platform supports about one car, from the first plate lookup to the market insight its sale produces: Identify, Check, Value, Stock, Advertise, Sell, Register, Trade, Insight. | [Who Knows What About a Car: The Vehicle Data and Dealer Software Ecosystem](vehicle-data-ecosystem.html) |\n| **Gross per unit (GPU)** | The profit on one retailed car before overheads, often called gross profit per unit. | [Margins, Days and Lookups: The Economics of Dealers, Data and SaaS](dealer-and-data-economics.html) |\n| **Front-end gross** | A used car's retail price minus everything capitalized into the car: acquisition cost, reconditioning, transport and fees. | [Margins, Days and Lookups: The Economics of Dealers, Data and SaaS](dealer-and-data-economics.html), [The Stock Book: Inventory Management and the Vehicle Dossier](inventory-and-vehicle-dossier.html) |\n| **Days-to-turn** | The number of days from stock-in (the moment a car enters the dealer's stock) to sale. Not the same as stand-time, which is a market measure computed from adverts. | [Margins, Days and Lookups: The Economics of Dealers, Data and SaaS](dealer-and-data-economics.html) |\n| **Holding cost** | What each day in stock costs: depreciation, the cost of the money tied up, and smaller costs for space and insurance. | [Margins, Days and Lookups: The Economics of Dealers, Data and SaaS](dealer-and-data-economics.html) |\n| **Days' supply (dealer)** | Stock divided by daily sales over a stated window. The market-wide version, computed from adverts, is market days' supply. | [Margins, Days and Lookups: The Economics of Dealers, Data and SaaS](dealer-and-data-economics.html), [Reading the Market: Advert Harvesting, Sale Detection and Transaction Data](market-data.html) |\n| **Floorplan finance** | Credit that funds a dealer's stock. A **curtailment** is a required principal repayment at a fixed age, so a floorplanned car's age is a contractual deadline. | [Margins, Days and Lookups: The Economics of Dealers, Data and SaaS](dealer-and-data-economics.html), [Cox Automotive: Building a Portfolio Into a Platform](case-cox-automotive.html) |\n| **Rooftop pricing** | Charging a monthly subscription per physical dealership location, usually per module, regardless of the number of users. | [Margins, Days and Lookups: The Economics of Dealers, Data and SaaS](dealer-and-data-economics.html) |\n| **Gross revenue retention (GRR) / net revenue retention (NRR)** | GRR is this year's revenue from last year's customers, excluding expansion, divided by their revenue last year; it measures what leaks away. NRR is the same including expansion (modules, rooftops, price increases); above 100%, the base grows without new customers. | [Margins, Days and Lookups: The Economics of Dealers, Data and SaaS](dealer-and-data-economics.html) |\n| **Business capability** | What the business must be able to do to deliver value, described independently of the people, processes and systems that currently do it. \"Value a used car\" is a capability; a valuation engine is a system that implements it. | [Mapping the Business: A Capability Map From Identify to Insight](vehicle-capability-map.html) |\n| **Capability map** | An arrangement of capabilities in levels, usually two or three: level 1 domains group capabilities that serve one part of the value chain; level 2 capabilities are the unit of ownership, investment and sharing decisions; level 3 is drawn only where a decision needs it. | [Mapping the Business: A Capability Map From Identify to Insight](vehicle-capability-map.html) |\n| **Heat map** | A capability map with each capability colored by a judgement: how much it differentiates, how well it works, who owns it. | [Mapping the Business: A Capability Map From Identify to Insight](vehicle-capability-map.html) |\n| **Differentiating / parity / commodity** | The three investment classes on the heat map. Differentiating decides whether a customer chooses the group and earns build as the default; parity must match competitors and deserves exactly one good implementation; commodity is standardized and is bought, rented or delegated. | [Mapping the Business: A Capability Map From Identify to Insight](vehicle-capability-map.html) |\n| **Shared capability** | A capability that both halves of the platform, the data half and the workflow half, consume, with one implementation and one owner. | [Mapping the Business: A Capability Map From Identify to Insight](vehicle-capability-map.html) |\n| **Bounded context** | An explicit boundary within which a model and its language are consistent. The language inside it is the **ubiquitous language**, in Eric Evans's term. | [Drawing the Lines: Bounded Contexts, Entities and Sources of Truth](vehicle-bounded-contexts.html) |\n| **Subdomain (core, supporting, generic)** | A part of the business problem, where a bounded context is a part of the solution. The core domain is where the business wins; supporting subdomains are specific to the business but not where it wins; generic subdomains are factored out or bought. | [Drawing the Lines: Bounded Contexts, Entities and Sources of Truth](vehicle-bounded-contexts.html) |\n| **Entity–owner table** | The table that states, for each principal entity, which context may change it, what its key is, which copies may exist and who moves it through its lifecycle. Axleby's version 1 covered 29 entities. | [Drawing the Lines: Bounded Contexts, Entities and Sources of Truth](vehicle-bounded-contexts.html) |\n| **Source of truth / system of record** | The source of truth is the one context whose committed state is the answer and which alone may change it; the system of record is the store where it keeps that answer. | [Drawing the Lines: Bounded Contexts, Entities and Sources of Truth](vehicle-bounded-contexts.html) |\n| **Copy kinds (reference, decision snapshot, observation, projection)** | The four allowed kinds of copy of another context's data: a reference (the owner's key), a decision snapshot (id and version of a fact used for a decision), an observation (another party's claim kept as evidence) and a projection (a read model rebuilt from the owner's events). A cache is a projection with a time limit. | [Drawing the Lines: Bounded Contexts, Entities and Sources of Truth](vehicle-bounded-contexts.html) |\n| **Context map** | A diagram of the contexts that shows, for each pair that integrates, who is upstream, who is downstream and which pattern governs the seam. | [Drawing the Lines: Bounded Contexts, Entities and Sources of Truth](vehicle-bounded-contexts.html) |\n| **Anti-corruption layer (ACL)** | In domain-driven design, a translation boundary that keeps a foreign model out of your own. The book puts one toward every register, supplier, portal and DMS. | [Drawing the Lines: Bounded Contexts, Entities and Sources of Truth](vehicle-bounded-contexts.html), [Living With the DMS: Dealer Management System Integration](dms-integration.html) |\n\n## <a id=\"g-vehicle\"><\/a>Part II — Vehicle\n\nWhich car this is, what the registers say, what was built, what happened to it, and how many sources become one record. [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html) owns identifiers and the identity graph; [The Authoritative Source: Vehicle Registers and Official Data Access](registers-and-official-data.html) owns register access; [What Exactly Was Built: Specification, Trim and Equipment Data](specification-and-equipment.html) owns what was built; [What Happened to This Car: Damage, Odometer, Title and Service History](vehicle-history.html) owns events and judgements; [From Many Sources to One Record: Ingestion, Normalization and Entity Resolution](ingestion-and-entity-resolution.html) and [Where Did This Fact Come From? Provenance, Freshness and Data Quality](provenance-and-data-quality.html) own the pipeline and the facts' envelope.\n\n| Term | Definition | Chapter |\n| --- | --- | --- |\n| **Vehicle identification number (VIN)** | The 17-character code that the manufacturer assigns to one vehicle and stamps into its structure. It is the strongest evidence of identity, but it can be mistyped, re-stamped or cloned, so the book does not use it as the platform's key. | [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html) |\n| **World manufacturer identifier (WMI)** | The first three characters of the VIN: a code for a manufacturer or one of its divisions, issued through a national body under ISO 3780. | [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html) |\n| **Registration plate** | The mark a register issues to a **registration**, the legal record that a vehicle may use public roads in one jurisdiction, with a keeper responsible for insurance, tax and inspection. Also registration mark, license plate, *kenteken*, *Kennzeichen*. | [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html) |\n| **Plate assignment** | This book's name for the fact that a given plate was attached to a given vehicle in a given jurisdiction for a given period, with its source and evidence. A time-bounded edge, not an attribute of the car. | [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html) |\n| **Registration episode** | One period of a vehicle's registration in one jurisdiction in the identity graph; plate assignments attach to it, and an import or export starts or ends one. | [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html) |\n| **Vehicle key** | An internal surrogate identifier that the platform assigns to one physical vehicle when it first sees it and never reuses. The VIN is the strongest evidence attached to it, not the key itself. At Axleby it is the AVK. | [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html) |\n| **Identity graph** | The data structure that records which identifiers, registrations and records belong to which physical vehicle, over time, with the evidence for each link. Axleby's is Anchor. | [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html) |\n| **Identity confidence tier** | How far a vehicle's identity is trusted: **Confirmed** (from a register or a checked official document), **Corroborated** (a non-official source agreed by an independent second one), **Asserted** (one non-official source) or **Suspect** (conflicting signals, so new facts are held). | [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html) |\n| **Plate cloning** | Putting copies of another car's legitimate plates on a vehicle, usually of the same make, model and color, to avoid fines and tolls or to hide a stolen car. | [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html) |\n| **Type keys** | Identifiers of a type of vehicle, not of one vehicle: the EU type-approval number with variant and version, and the German HSN/TSN manufacturer and type key numbers. Used for specification and insurance classes. | [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html), [What Exactly Was Built: Specification, Trim and Equipment Data](specification-and-equipment.html) |\n| **Vehicle register (official)** | An official record, kept by a public body or under a statutory mandate, of the vehicles admitted to the roads of a jurisdiction and the people responsible for them. | [The Authoritative Source: Vehicle Registers and Official Data Access](registers-and-official-data.html) |\n| **Authorized information provider** | This book's term for an organization that holds a contractual relationship with a register to carry register information and transactions to the trade. Axleby Data has been one for the Dutch register since 1999. | [The Authoritative Source: Vehicle Registers and Official Data Access](registers-and-official-data.html) |\n| **Open data (register)** | Register data published free and without restriction for every user; it excludes data that is privacy-, fraud- or competition-sensitive, so stolen and missing status, for example, is not released. | [The Authoritative Source: Vehicle Registers and Official Data Access](registers-and-official-data.html) |\n| **Register gateway** | The one component through which every read from and write to an official register passes. Axleby's is Turnstile. | [The Authoritative Source: Vehicle Registers and Official Data Access](registers-and-official-data.html) |\n| **Register mirror** | A local, queryable copy of the register data the platform may hold in bulk, with the source dataset, its version and the observation time on each fact. Theft and awaiting-inspection status are asked live, never mirrored. | [The Authoritative Source: Vehicle Registers and Official Data Access](registers-and-official-data.html) |\n| **Mutation feed** | A stream of changes to register records, applied to the mirror and emitted as events. | [The Authoritative Source: Vehicle Registers and Official Data Access](registers-and-official-data.html) |\n| **Large-customer interface (GKS)** | Germany's machine-to-machine interface (*Großkundenschnittstelle*) that, since 1 September 2023, lets any company with more than 500 registration transactions a year submit them. | [The Authoritative Source: Vehicle Registers and Official Data Access](registers-and-official-data.html), [Making It Official: Registration Transactions, Import, Export and Trade Documents](registration-and-trade-services.html) |\n| **Specification resolver** | The component that turns identity plus sourced facts into a resolved specification with a state, a confidence and an explanation. | [What Exactly Was Built: Specification, Trim and Equipment Data](specification-and-equipment.html) |\n| **Specification hierarchy** | Make (the brand), model (the commercial line), generation (a design period, German *Baureihe*), body, version or derivative (engine, power, gearbox, drivetrain and usually the edition), edition, and factory options and packs. | [What Exactly Was Built: Specification, Trim and Equipment Data](specification-and-equipment.html) |\n| **Edition (trim)** | The named equipment level of a version: the standard content the manufacturer bundled under a marketing name, such as Life, Style or R-Line. | [What Exactly Was Built: Specification, Trim and Equipment Data](specification-and-equipment.html) |\n| **Factory option / pack** | An item of equipment fitted at the factory on top of the edition's standard content, ordered alone or in a **pack** whose content can change over time. | [What Exactly Was Built: Specification, Trim and Equipment Data](specification-and-equipment.html) |\n| **As-built data** | What one VIN actually received, from a per-VIN build record. Licensed build data is bought per request, so the platform buys it only when a decision depends on it, once per car. | [What Exactly Was Built: Specification, Trim and Equipment Data](specification-and-equipment.html) |\n| **Specification catalog** | The platform's versioned reference data of makes, models, generations, versions, editions, standard equipment and available options, with the crosswalk to every provider's and portal's keys. | [What Exactly Was Built: Specification, Trim and Equipment Data](specification-and-equipment.html) |\n| **Resolution state (specification)** | Where a car's specification stands: Identified, Candidates, Edition unknown, Edition resolved, Dealer-confirmed, As-built confirmed or Disputed. Products show and value the car according to the state. | [What Exactly Was Built: Specification, Trim and Equipment Data](specification-and-equipment.html) |\n| **History event** | One dated observation about one vehicle from one source, such as an inspection reading, an insurer's total-loss declaration or a first registration after import. | [What Happened to This Car: Damage, Odometer, Title and Service History](vehicle-history.html) |\n| **Odometer reading** | A distance shown on a given date, from an inspection, register, workshop, manufacturer, auction, advert or appraisal. A reading is an event; a judgement is computed over readings. | [What Happened to This Car: Damage, Odometer, Title and Service History](vehicle-history.html) |\n| **Odometer judgement** | A conclusion computed over the series of readings: is it consistent with a vehicle that was driven normally and never had its odometer turned back? The Dutch register publishes its own (*tellerstandoordeel*). | [What Happened to This Car: Damage, Odometer, Title and Service History](vehicle-history.html) |\n| **Title brand** | A permanent label on a vehicle's legal status, such as salvage, flood, rebuilt, junk or \"not actual mileage\", issued by US state titling agencies and reported through NMVTIS. | [What Happened to This Car: Damage, Odometer, Title and Service History](vehicle-history.html) |\n| **Write-off category** | The UK insurers' classification of a written-off vehicle under an industry code of practice: categories A and B (scrap or break for parts), S (structural damage, repairable) and N (non-structural). | [What Happened to This Car: Damage, Odometer, Title and Service History](vehicle-history.html) |\n| **History report** | A rendered, dated snapshot of a vehicle's events and judgements for one product, market and requester. Corrections create a superseding report; a report is never edited in place. | [What Happened to This Car: Damage, Odometer, Title and Service History](vehicle-history.html) |\n| **Ingestion** | How external facts enter the platform. **Entity resolution** decides which physical car each fact is about; **survivorship** decides, attribute by attribute, which fact to believe. | [From Many Sources to One Record: Ingestion, Normalization and Entity Resolution](ingestion-and-entity-resolution.html) |\n| **Ingestion pipeline** | The path every external fact takes into the platform: receive, land raw, validate, normalize, resolve to a vehicle, store as a per-source record and publish a change. One pipeline with per-source adapters, not one pipeline per product. | [From Many Sources to One Record: Ingestion, Normalization and Entity Resolution](ingestion-and-entity-resolution.html) |\n| **Landing zone** | Immutable storage of exactly what arrived (file, message or API response), with a batch or message id, a content hash, the arrival time and the source. Nothing downstream edits it. | [From Many Sources to One Record: Ingestion, Normalization and Entity Resolution](ingestion-and-entity-resolution.html) |\n| **Quarantine** | A holding area for records or whole batches that failed a contract check. Quarantined data is kept, visible, counted and releasable after a fix; it is neither dropped nor passed on. | [From Many Sources to One Record: Ingestion, Normalization and Entity Resolution](ingestion-and-entity-resolution.html) |\n| **Source record** | One source's statement about one vehicle at one time, normalized, linked to its landing batch and to the vehicle it was resolved to. | [From Many Sources to One Record: Ingestion, Normalization and Entity Resolution](ingestion-and-entity-resolution.html) |\n| **Entity resolution** | Deciding which real-world entity, here a physical vehicle identified by its vehicle key, a source record is about: deterministic when a trustworthy key exists, probabilistic otherwise. | [From Many Sources to One Record: Ingestion, Normalization and Entity Resolution](ingestion-and-entity-resolution.html) |\n| **Match decision** | The stored outcome of resolution for one source record: the vehicle key, the rule or model and version that decided, the score, and who confirmed it if a human did. | [From Many Sources to One Record: Ingestion, Normalization and Entity Resolution](ingestion-and-entity-resolution.html) |\n| **Survivorship rule** | A per-attribute rule that chooses the current value from competing source records by source class, recency, plausibility and tie-breakers, with a version number. | [From Many Sources to One Record: Ingestion, Normalization and Entity Resolution](ingestion-and-entity-resolution.html) |\n| **Golden record** | The resolved current view of one vehicle: for each attribute, the surviving value plus a pointer to the source record it came from. A view computed from source records, rebuildable at any time, never the place where facts are written. | [From Many Sources to One Record: Ingestion, Normalization and Entity Resolution](ingestion-and-entity-resolution.html) |\n| **Provenance** | Information about the entities, activities and people involved in producing a piece of data, used to assess its quality, reliability or trustworthiness (W3C PROV). For a vehicle fact: who observed it, who supplied it and how it reached the platform. | [Where Did This Fact Come From? Provenance, Freshness and Data Quality](provenance-and-data-quality.html) |\n| **Provenance envelope** | The fields stored with every fact, as part of the fact: source, source class, source record and batch, observed-at, recorded-at, license, confidence, derivation, status and version. | [Where Did This Fact Come From? Provenance, Freshness and Data Quality](provenance-and-data-quality.html) |\n| **Fact version** | One immutable version of one fact. A correction creates a new version that supersedes the old one; it never edits it. Artifacts reference versions, never \"the fact\". | [Where Did This Fact Come From? Provenance, Freshness and Data Quality](provenance-and-data-quality.html), [A Fact Was Wrong: Propagating a Vehicle Data Correction](journey-data-correction.html) |\n| **Valid time / transaction time** | Valid time is when a fact was true in the world (Fowler's \"actual\" time); transaction time is when the platform recorded, and so believed, that version (Fowler's \"record\" time). | [Where Did This Fact Come From? Provenance, Freshness and Data Quality](provenance-and-data-quality.html) |\n| **Bitemporal fact** | A fact stored with both valid time and transaction time, so the platform can answer what was true at any date, as known at any date. | [Where Did This Fact Come From? Provenance, Freshness and Data Quality](provenance-and-data-quality.html) |\n| **Freshness SLO** | A target for the age of a fact at the moment a decision uses it, set per data class and decision context, with a defined behavior when it is breached. SLO is service level objective. | [Where Did This Fact Come From? Provenance, Freshness and Data Quality](provenance-and-data-quality.html) |\n| **Data contract (vehicle)** | The agreement with a data supplier, part commercial and part machine-readable, that fixes the schema, the semantics (units, codes, time zones), the provenance fields, delivery times, quality thresholds, correction duties and the license reference. | [Where Did This Fact Come From? Provenance, Freshness and Data Quality](provenance-and-data-quality.html) |\n| **Source scorecard** | A periodic, per-source measurement of delivery, contract compliance, accuracy against ground truth, coverage and correction behavior. | [Where Did This Fact Come From? Provenance, Freshness and Data Quality](provenance-and-data-quality.html) |\n\n## <a id=\"g-value\"><\/a>Part III — Value\n\nReading the market, valuing a car honestly, and pricing condition, battery health and connected-car data. [Reading the Market: Advert Harvesting, Sale Detection and Transaction Data](market-data.html) owns the market measures; [What Is It Worth? Building and Governing a Valuation Engine](valuation-engine.html) owns value types, the ledger and back-testing; [Condition Changes Everything: Inspection, Damage Estimation and Reconditioning Cost](condition-and-damage.html), [The Battery Question: EV State of Health and Battery Data](ev-battery-health.html) and [Data From the Car Itself: Connected Vehicles, Telematics and the EU Data Act](connected-vehicle-data.html) own their evidence.\n\n| Term | Definition | Chapter |\n| --- | --- | --- |\n| **Market observation** | One sighting of one advert or market event from one source at one time, with provenance (source, method, observed-at, terms version). Append-only. | [Reading the Market: Advert Harvesting, Sale Detection and Transaction Data](market-data.html) |\n| **Listing (market data)** | One advert on one channel under one listing id, from first to last observation. A car can have many listings over its life. | [Reading the Market: Advert Harvesting, Sale Detection and Transaction Data](market-data.html) |\n| **Market vehicle** | A cluster of listings believed to be the same physical car on offer, across portals, relists and rooftops of one group; resolved to a vehicle key when identity allows, otherwise a cluster id. | [Reading the Market: Advert Harvesting, Sale Detection and Transaction Data](market-data.html) |\n| **Market data lake** | The store of market observations and everything derived from them (listings, market vehicles, inferred sales, segment statistics), with per-observation provenance and rights tags, so any figure can be traced to, and rebuilt without, any source. | [Reading the Market: Advert Harvesting, Sale Detection and Transaction Data](market-data.html) |\n| **Sale detection** | Inferring that a market vehicle left the market because it was sold, with an outcome state, a confidence and a confirmation source where one exists. A de-listing is evidence of a sale, not a sale. | [Reading the Market: Advert Harvesting, Sale Detection and Transaction Data](market-data.html) |\n| **Stand-time** | Days from the first observation of a market vehicle on any channel to its inferred sale. A market measure, not the dealer's own days-to-turn. | [Reading the Market: Advert Harvesting, Sale Detection and Transaction Data](market-data.html) |\n| **Market days' supply** | Market vehicles currently on offer in a segment divided by the average daily inferred sales in that segment over a trailing window, usually 30 days. | [Reading the Market: Advert Harvesting, Sale Detection and Transaction Data](market-data.html) |\n| **Segment** | A versioned grouping of vehicles for statistics (make, model, generation, fuel, body, power band, age band, mileage band and region), arranged as a hierarchy with fallbacks. | [Reading the Market: Advert Harvesting, Sale Detection and Transaction Data](market-data.html) |\n| **Coverage** | The share of the real market a statistic is based on, estimated per segment, market and source. | [Reading the Market: Advert Harvesting, Sale Detection and Transaction Data](market-data.html) |\n| **Value type** | Which price a valuation estimates: retail asking, retail transaction, trade-in (part-exchange), trade (wholesale), private, dealer selling or purchase value, maximum purchase price, or future (residual). A valuation without its value type is dangerous. | [What Is It Worth? Building and Governing a Valuation Engine](valuation-engine.html) |\n| **Maximum purchase price (MPP)** | The most a dealer can pay for a car and still earn its target margin, sometimes called the buy box: retail target minus costs and margin. | [What Is It Worth? Building and Governing a Valuation Engine](valuation-engine.html), [Buying Right: Trade-In Appraisal, Sourcing and Maximum Purchase Price](vehicle-acquisition.html) |\n| **Valuation confidence** | The engine's statement of how far a value can be trusted, returned with the value as a range and confidence flags. | [What Is It Worth? Building and Governing a Valuation Engine](valuation-engine.html) |\n| **Range (valuation)** | An interval expected to contain the realized price with a stated probability; an 80% range should contain 80% of outcomes. | [What Is It Worth? Building and Governing a Valuation Engine](valuation-engine.html) |\n| **Confidence flag** | The reason a range is wide or a value is unusual: few comparables, a fallback model, an unresolved edition, a stale market surface, or a segment under a drift warning. | [What Is It Worth? Building and Governing a Valuation Engine](valuation-engine.html) |\n| **Comparables** | Market observations of similar cars returned with a valuation as its evidence; Vantage returns the eight nearest Pulse observations (as ids where licenses forbid copying). | [What Is It Worth? Building and Governing a Valuation Engine](valuation-engine.html) |\n| **Valuation ledger** | The immutable record of every valuation the engine issued, with its inputs, the versions of those inputs and of the model, the answer, who saw it, and links to the decisions and outcomes that followed. | [What Is It Worth? Building and Governing a Valuation Engine](valuation-engine.html) |\n| **Back-test** | A measurement of how well valuations issued in the past matched what happened next, using only information available on the valuation date. Reports error, signed bias and range coverage per segment. | [What Is It Worth? Building and Governing a Valuation Engine](valuation-engine.html) |\n| **Segment status (watch, restricted)** | A drift monitor's verdict on a segment whose valuations have moved away from realized prices; it widens ranges, raises flags and can restrict automated use until a retrain. | [What Is It Worth? Building and Governing a Valuation Engine](valuation-engine.html) |\n| **Inspection (condition)** | One capture session on one vehicle, keyed by the vehicle key, with a purpose (appraisal, stock-in, lease return, trade listing, pre-delivery), a location, an inspector, a device and a time. | [Condition Changes Everything: Inspection, Damage Estimation and Reconditioning Cost](condition-and-damage.html) |\n| **Observation (condition)** | A raw, immutable piece of evidence from an inspection: a photo, video, measurement, checklist answer or diagnostic readout. | [Condition Changes Everything: Inspection, Damage Estimation and Reconditioning Cost](condition-and-damage.html) |\n| **Finding (damage item)** | A claim about the car, located on a **panel map** (a fixed vocabulary of components and zones), with a damage type, a size or severity, and links to the observations that support it. | [Condition Changes Everything: Inspection, Damage Estimation and Reconditioning Cost](condition-and-damage.html) |\n| **Condition report** | A versioned, read-only document derived from one inspection's confirmed findings for a stated purpose and audience (a trade report, a return report, an appraisal report). It names the rubric version it was produced under. | [Condition Changes Everything: Inspection, Damage Estimation and Reconditioning Cost](condition-and-damage.html) |\n| **Condition grade** | A summary score computed from findings by a published rubric. It is a view, never the source. | [Condition Changes Everything: Inspection, Damage Estimation and Reconditioning Cost](condition-and-damage.html) |\n| **Damage estimate** | A priced repair plan for a set of findings (operations, parts, labor, paint) from a repair-cost catalog or an assessor. It answers \"what does it cost to restore this to pre-damage condition?\" | [Condition Changes Everything: Inspection, Damage Estimation and Reconditioning Cost](condition-and-damage.html) |\n| **Reconditioning cost** | The estimated, and later actual, cost to make a car ready for retail at a given dealer, priced at that dealer's methods and rates. It differs from a damage estimate because a dealer repairs to a retail standard, not to pre-damage condition. | [Condition Changes Everything: Inspection, Damage Estimation and Reconditioning Cost](condition-and-damage.html) |\n| **State of health (SoH)** | The ratio of a battery's current ability to store energy or charge to its ability when new, as a percentage. Energy or capacity, gross or usable, and the chosen reference all change the number. | [The Battery Question: EV State of Health and Battery Data](ev-battery-health.html) |\n| **Battery certificate** | A document issued by a named party that states a battery's SoH for a specific vehicle at a specific time, with the method used. | [The Battery Question: EV State of Health and Battery Data](ev-battery-health.html) |\n| **Battery passport** | The electronic record that the EU Battery Regulation (Regulation (EU) 2023/1542) requires for every electric-vehicle battery placed on the market or put into service from 18 February 2027. | [The Battery Question: EV State of Health and Battery Data](ev-battery-health.html) |\n| **Battery management system (BMS)** | The vehicle's on-board battery controller. Since 18 August 2024 the EU Battery Regulation has required SoH data in it, with read-only access for the owner and those acting for them. | [The Battery Question: EV State of Health and Battery Data](ev-battery-health.html) |\n| **Battery-electric vehicle (BEV)** | A car powered only by a battery. The fall in used BEV prices is the backdrop of Axleby's EV Overvaluation. | [The Battery Question: EV State of Health and Battery Data](ev-battery-health.html), [What Is It Worth? Building and Governing a Valuation Engine](valuation-engine.html) |\n| **Connected-vehicle data** | Data a vehicle generates about its use and condition and sends through an electronic communications service or exposes on a physical port. | [Data From the Car Itself: Connected Vehicles, Telematics and the EU Data Act](connected-vehicle-data.html) |\n| **EU Data Act** | Regulation (EU) 2023/2854, applicable since 12 September 2025, which gives users of connected products, including cars, rights to the data those products generate and to have it shared with third parties they choose. | [Data From the Car Itself: Connected Vehicles, Telematics and the EU Data Act](connected-vehicle-data.html) |\n| **User / data holder / third party (Data Act)** | The user owns or has contractual rights to use the connected car (owner, lessee or renter); the data holder has the right or obligation to make the data available, in practice the manufacturer or its backend; the third party is the recipient the user chooses. | [Data From the Car Itself: Connected Vehicles, Telematics and the EU Data Act](connected-vehicle-data.html) |\n| **Readily available data** | Under the Data Act, data the data holder lawfully obtains or can obtain without disproportionate effort; the guidance treats data reaching a manufacturer's backend under the \"extended vehicle\" concept as readily available. | [Data From the Car Itself: Connected Vehicles, Telematics and the EU Data Act](connected-vehicle-data.html) |\n| **Consent grant (vehicle)** | This book's term for the platform's record of one right to receive one vehicle's data: vehicle, granting user, data holder and route, recipient, purpose, data categories, legal basis, validity and state. | [Data From the Car Itself: Connected Vehicles, Telematics and the EU Data Act](connected-vehicle-data.html) |\n| **Consumer consent / fleet clearance** | The two connected-data routes through aggregators: consumer consent is a person granting a scope for a car they drive, in one session; fleet clearance is a business registering a car it owns, approved by the manufacturer over days. | [Data From the Car Itself: Connected Vehicles, Telematics and the EU Data Act](connected-vehicle-data.html) |\n| **On-board diagnostics (OBD) port** | The car's diagnostic connector. An aftermarket dongle or reader on it reads the car directly, under the ePrivacy consent of whoever controls the car at that moment. | [Data From the Car Itself: Connected Vehicles, Telematics and the EU Data Act](connected-vehicle-data.html), [The Battery Question: EV State of Health and Battery Data](ev-battery-health.html) |\n\n## <a id=\"g-dealer\"><\/a>Part IV — Dealer\n\nThe dealer's used-car workflow as software, from buying a car to trading it on. Each chapter from [Buying Right: Trade-In Appraisal, Sourcing and Maximum Purchase Price](vehicle-acquisition.html) to [Trader to Trader: B2B Exchanges, Auctions and Lease Remarketing](b2b-trade-and-remarketing.html) owns the terms of its step; the dossier and stock item in [The Stock Book: Inventory Management and the Vehicle Dossier](inventory-and-vehicle-dossier.html) tie them together.\n\n| Term | Definition | Chapter |\n| --- | --- | --- |\n| **Appraisal** | The dealer's structured assessment of one car for a possible purchase: identify it, check it, inspect it, value it and make an offer. | [Buying Right: Trade-In Appraisal, Sourcing and Maximum Purchase Price](vehicle-acquisition.html) |\n| **Trade-in (part-exchange)** | A car the buyer hands over as part of buying another car from the same dealer: two transactions that happen to settle together. | [Buying Right: Trade-In Appraisal, Sourcing and Maximum Purchase Price](vehicle-acquisition.html), [Closing the Sale: Quotes, Contracts, Financing and Margin VAT](deals-and-sales-documents.html) |\n| **Purchase offer** | The price a dealer commits to pay for a specific car, to a specific seller, under stated conditions, until a stated limit. | [Buying Right: Trade-In Appraisal, Sourcing and Maximum Purchase Price](vehicle-acquisition.html) |\n| **Stock item** | One tenant's ownership of one vehicle for one **stay**: from the moment the dealer commits to buy it until the moment the dealer no longer carries its risk. A car traded twice has two stock items. | [The Stock Book: Inventory Management and the Vehicle Dossier](inventory-and-vehicle-dossier.html), [Drawing the Lines: Bounded Contexts, Entities and Sources of Truth](vehicle-bounded-contexts.html) |\n| **Vehicle dossier** | The stock item together with everything the dealer needs to manage that stay: references to vehicle facts and to the versions used for decisions, documents, module action results and a timeline. | [The Stock Book: Inventory Management and the Vehicle Dossier](inventory-and-vehicle-dossier.html), [Drawing the Lines: Bounded Contexts, Entities and Sources of Truth](vehicle-bounded-contexts.html) |\n| **Stock lifecycle** | The state machine behind a stock item: one small commercial lifecycle owned by the dossier (Appraised to Delivered or Written off) plus parallel tracks, such as preparation and advertising, owned by other modules. | [The Stock Book: Inventory Management and the Vehicle Dossier](inventory-and-vehicle-dossier.html) |\n| **Timeline (dossier)** | An append-only list of what happened to the stock item: state transitions, price changes, cost lines, documents, module actions, notes, DMS updates and corrections to facts the dealer relied on. | [The Stock Book: Inventory Management and the Vehicle Dossier](inventory-and-vehicle-dossier.html) |\n| **VAT regime (stock item)** | A stock-item attribute fixed at purchase that decides how VAT is charged at sale, for example under the EU margin scheme when the car was bought from a private seller. | [The Stock Book: Inventory Management and the Vehicle Dossier](inventory-and-vehicle-dossier.html), [Closing the Sale: Quotes, Contracts, Financing and Margin VAT](deals-and-sales-documents.html) |\n| **Target margin** | The planned front-end gross for a car, set at purchase from the appraisal's maximum purchase price and revised by pricing. | [The Stock Book: Inventory Management and the Vehicle Dossier](inventory-and-vehicle-dossier.html), [Pricing to Turn: Market-Based Pricing, Signals and Repricing](used-car-pricing.html) |\n| **Asking price / transaction price** | The asking price is the price at which the dealer offers a car to consumers; the transaction price is what the buyer finally pays after negotiation and trade-in, recorded on the deal. | [Pricing to Turn: Market-Based Pricing, Signals and Repricing](used-car-pricing.html) |\n| **Price position** | The asking price divided by a **market reference value** for the same car, as a percentage: a car at 97% is asked 3% below the market reference. | [Pricing to Turn: Market-Based Pricing, Signals and Repricing](used-car-pricing.html) |\n| **Stand-time signal** | A per-car alert that a car has stood longer than it should, given its segment, its price position and the market's current pace. | [Pricing to Turn: Market-Based Pricing, Signals and Repricing](used-car-pricing.html) |\n| **Repricing rule** | A versioned, declarative instruction that, for cars matching a scope and a signal, computes a proposed new asking price within guardrails, and either proposes it to a person or applies it. | [Pricing to Turn: Market-Based Pricing, Signals and Repricing](used-car-pricing.html) |\n| **Merchandising** | The first sale: producing complete, accurate and attractive adverts for every car in stock, quickly, and keeping them true while the car and its facts change. | [Making the Car Sellable Online: Photos, Descriptions and Equipment](merchandising.html) |\n| **Advert** | The channel-independent offer content for one stock item: title, description, equipment text, ordered media, price presentation, disclosures and availability. | [Making the Car Sellable Online: Photos, Descriptions and Equipment](merchandising.html) |\n| **Vehicle media pipeline** | The path a car's photos and video take from capture to channel, with the rights and retention rules that govern them. | [Making the Car Sellable Online: Photos, Descriptions and Equipment](merchandising.html) |\n| **Listing quality score** | A per-advert measure of completeness and correctness, computed from explicit checks and delivered with a ranked list of actions. | [Making the Car Sellable Online: Photos, Descriptions and Equipment](merchandising.html) |\n| **Claim checker** | The gate that rejects any statement in a generated description that the car's fact sheet, with each fact's source and resolution state, does not support. | [Making the Car Sellable Online: Photos, Descriptions and Equipment](merchandising.html) |\n| **Disclosure rules** | Versioned, effective-dated rule sets per market that say what an advert must disclose, evaluated on every draft revision. | [Making the Car Sellable Online: Photos, Descriptions and Equipment](merchandising.html) |\n| **Listing syndication** | Publishing one dealer's stock to many advertising channels and keeping each copy in step with the stock record. | [One Stock, Sixty Channels: Listing Syndication to Portals](listing-syndication.html) |\n| **Channel** | One destination where a dealer's stock is advertised under one contract: a portal in one country, a classifieds site's car category, an advertising catalog, a dealer website or a B2B exchange. | [One Stock, Sixty Channels: Listing Syndication to Portals](listing-syndication.html) |\n| **Channel listing** | One car on one channel: a stock item paired with a channel, plus the identifiers both sides use, the content last sent and the state the channel reports. | [One Stock, Sixty Channels: Listing Syndication to Portals](listing-syndication.html) |\n| **Platform listing key / portal listing id / creation key** | The three identifiers of a channel listing: the platform's own join key, the id the portal assigns for updates and deletes, and a per-attempt key that makes a retried create safe. | [One Stock, Sixty Channels: Listing Syndication to Portals](listing-syndication.html) |\n| **Publish queue** | The queue of channel operations (inserts, updates, deletes) waiting for adapters. In a naive queue a stuck update blocks the delete behind it. | [One Stock, Sixty Channels: Listing Syndication to Portals](listing-syndication.html) |\n| **Desired-state sync** | Syndication that stores what each channel listing should look like now (present or absent, and with which content) and converges each channel to it, instead of replaying operations. | [One Stock, Sixty Channels: Listing Syndication to Portals](listing-syndication.html) |\n| **Reconciler (syndication)** | The comparison of desired and actual channel state, with drift classification, repair and alerts. | [One Stock, Sixty Channels: Listing Syndication to Portals](listing-syndication.html) |\n| **Channel adapter** | The translation to one channel's contract, with its idempotency, error classification and observers. It holds no business rules about which cars to publish. | [One Stock, Sixty Channels: Listing Syndication to Portals](listing-syndication.html) |\n| **Lead** | The commercial unit of the dealer's marketing: a buyer's interest in a vehicle, or a kind of vehicle, at one rooftop, with a lifecycle from new to won or lost. | [Every Enquiry Counts: Lead Capture, Routing and CRM](leads-and-crm.html) |\n| **Enquiry event / interaction / prospect** | An enquiry event is one inbound message from a source; an interaction is each message, call or status change attached to a lead; a prospect is the person behind one or more leads, as known to one dealer legal entity. | [Every Enquiry Counts: Lead Capture, Routing and CRM](leads-and-crm.html) |\n| **Lead routing** | The assignment of a lead to the rooftop, team, queue and person who should answer it, by rules the dealer configures and the platform evaluates. | [Every Enquiry Counts: Lead Capture, Routing and CRM](leads-and-crm.html) |\n| **Lead attribution** | The record of which channels, adverts and campaigns touched a lead and its eventual sale, and the rule that decides which of them gets credit. | [Every Enquiry Counts: Lead Capture, Routing and CRM](leads-and-crm.html) |\n| **Auto-lead Data Format (ADF)** | An XML format, usually sent by e-mail, for passing a car-buying lead from whoever captured it to whoever must answer it. | [Every Enquiry Counts: Lead Capture, Routing and CRM](leads-and-crm.html) |\n| **Customer relationship management system (CRM)** | Where salespeople work their leads and customers: tasks, calls, appointments, follow-up sequences and pipeline reports. | [Every Enquiry Counts: Lead Capture, Routing and CRM](leads-and-crm.html) |\n| **Time to first human response** | Measured from a lead's arrival to the first outbound message or answered call by a person, not to an auto-reply. | [Every Enquiry Counts: Lead Capture, Routing and CRM](leads-and-crm.html), [From Portal Enquiry to Dealer System: Routing a Lead End to End](journey-lead-to-dms.html) |\n| **STAR (Standards for Technology in Automotive Retail)** | The US dealer-software standards body, publisher of XML message formats and, from June 2025, a Sales Lead API. | [Every Enquiry Counts: Lead Capture, Routing and CRM](leads-and-crm.html), [Drawing the Lines: Bounded Contexts, Entities and Sources of Truth](vehicle-bounded-contexts.html) |\n| **Deal** | The commercial agreement to sell one or more vehicles to one buyer, together with everything settled with it: trade-ins, add-ons, payments and financing. | [Closing the Sale: Quotes, Contracts, Financing and Margin VAT](deals-and-sales-documents.html) |\n| **Margin scheme** | The EU's special VAT arrangement for second-hand goods sold by a taxable dealer: VAT is charged on the dealer's margin (selling price minus purchase price), not on the full selling price. | [Closing the Sale: Quotes, Contracts, Financing and Margin VAT](deals-and-sales-documents.html) |\n| **Financing referral** | The dealer presenting a lender's credit product to the buyer and passing the application to the lender. | [Closing the Sale: Quotes, Contracts, Financing and Margin VAT](deals-and-sales-documents.html) |\n| **Finance and insurance (F&I)** | The dealer's finance and insurance desk, where credit applications and contracts are prepared. | [Cox Automotive: Building a Portfolio Into a Platform](case-cox-automotive.html), [Closing the Sale: Quotes, Contracts, Financing and Margin VAT](deals-and-sales-documents.html) |\n| **Register transaction** | A request, submitted by a party with the legal authority to make it, that changes a vehicle's official record in a government register and produces proof that it did. | [Making It Official: Registration Transactions, Import, Export and Trade Documents](registration-and-trade-services.html) |\n| **Transaction authority** | The chain of legal permissions that allows a particular submission: which legal entity acts, under which recognition, through which credential, operated by which person, on behalf of which customer. | [Making It Official: Registration Transactions, Import, Export and Trade Documents](registration-and-trade-services.html) |\n| **Proof (register transaction)** | The evidence that the register accepted the act: the confirmation stored verbatim, the transaction code and timestamp, and the documents produced from them, such as a release certificate. | [Making It Official: Registration Transactions, Import, Export and Trade Documents](registration-and-trade-services.html) |\n| **Registration tax engine** | A component that computes the one-off taxes due when a car is registered (or the refund when it leaves) from versioned, dated rule sets, recording every input and rule version so the result can be reproduced for the tax authority. | [Making It Official: Registration Transactions, Import, Export and Trade Documents](registration-and-trade-services.html) |\n| **Dealer management system (DMS)** | The transactional core of a dealership, its enterprise resource planning system: the software that records what the business owns, sells, repairs and owes. | [Living With the DMS: Dealer Management System Integration](dms-integration.html), [Who Knows What About a Car: The Vehicle Data and Dealer Software Ecosystem](vehicle-data-ecosystem.html) |\n| **Certified interface** | An access channel that the DMS vendor documents, licenses and tests for a named third party, under a partner agreement. | [Living With the DMS: Dealer Management System Integration](dms-integration.html) |\n| **DMS adapter** | The component on your side that speaks one DMS family's transport and model, translates it into your canonical model and back, and enforces that DMS's contract terms. | [Living With the DMS: Dealer Management System Integration](dms-integration.html) |\n| **Reynolds Certified Interface (RCI) / 3PA** | Reynolds and Reynolds' certified-interface program (2003) and CDK's Third Party Access program, the two US DMS access programs at the center of CDK's 2015 move to closed access. | [Living With the DMS: Dealer Management System Integration](dms-integration.html), [CDK Global: The DMS as Platform, Gatekeeper and Single Point of Failure](case-cdk-global.html) |\n| **De-fleet** | The planned disposal of fleet vehicles at contract end or at the end of a holding period. | [Trader to Trader: B2B Exchanges, Auctions and Lease Remarketing](b2b-trade-and-remarketing.html) |\n| **Digital return** | The handover of a lease or rental car recorded electronically at the moment it happens: identity check, odometer, keys, documents, guided photographs, findings against a return standard, battery SoH and the lessee's acknowledgement. | [Trader to Trader: B2B Exchanges, Auctions and Lease Remarketing](b2b-trade-and-remarketing.html) |\n| **Trade listing** | An offer of one vehicle to a defined professional audience, on trade terms. | [Trader to Trader: B2B Exchanges, Auctions and Lease Remarketing](b2b-trade-and-remarketing.html) |\n| **Sale-right register** | One active, time-bounded right-to-sell lease per vehicle and seller, with grant, renew, release and expiry and fencing tokens; no channel may accept a binding sale without holding it. | [Trader to Trader: B2B Exchanges, Auctions and Lease Remarketing](b2b-trade-and-remarketing.html) |\n| **Auction hand-off** | The transfer of the right to sell one vehicle to an auction partner, with the evidence the partner needs, a reserve, a time limit, and an obligation to report status and the result. | [Trader to Trader: B2B Exchanges, Auctions and Lease Remarketing](b2b-trade-and-remarketing.html) |\n\n## <a id=\"g-saas\"><\/a>Part V — SaaS\n\nTenants, access and the commercial model. [Dealers, Groups and Rooftops: Tenancy Models for Dealer SaaS](tenancy-and-dealer-groups.html) owns the tenant and its hierarchy; [Who May Do What: Identity, Authorization and Entitlements](identity-access-and-entitlements.html) owns identities, rights and authority; [From Signed Contract to First Sale: Onboarding, Migration and Configuration](onboarding-and-configuration.html) owns setup and configuration; [Subscriptions, Lookups and No-Hit-No-Fee: Billing and Metering](billing-and-metering.html) owns usage and invoices; [Allowed to Use It? Data Licensing, Purpose and Governance](data-licensing-and-governance.html) owns licenses and purposes.\n\n| Term | Definition | Chapter |\n| --- | --- | --- |\n| **Tenant** | The unit of data ownership and isolation: the boundary inside which data may flow freely subject to permissions, and across which data may flow only through explicit, audited features. Usually the contracting organization. | [Dealers, Groups and Rooftops: Tenancy Models for Dealer SaaS](tenancy-and-dealer-groups.html) |\n| **Tenant hierarchy (organization, legal entity, region, rooftop, department)** | The levels inside a tenant: the contracting organization, legal entities with their own registration and VAT numbers, optional regions for management, rooftops, and departments within a rooftop. Users are not a level. | [Dealers, Groups and Rooftops: Tenancy Models for Dealer SaaS](tenancy-and-dealer-groups.html) |\n| **Tenant context** | The verified answer, for one unit of work, to \"on behalf of which tenant, and which node within it, is this happening?\": tenant id, active node, acting user or client, and the hierarchy version. | [Dealers, Groups and Rooftops: Tenancy Models for Dealer SaaS](tenancy-and-dealer-groups.html) |\n| **Pool / silo / bridge** | Tenancy models: pool shares resources among tenants; silo gives tenants dedicated resources on a shared identity, onboarding and operations; bridge mixes the two per service, decided by the data's regulatory profile and noisy-neighbor behavior. | [Dealers, Groups and Rooftops: Tenancy Models for Dealer SaaS](tenancy-and-dealer-groups.html) |\n| **Cell** | A complete deployment of the application plane serving a defined set of tenants, with its own databases, queues, credentials and network boundary; also a security boundary. | [Dealers, Groups and Rooftops: Tenancy Models for Dealer SaaS](tenancy-and-dealer-groups.html), [Protecting Dealers and Data: Security for a Vehicle Data Platform](vehicle-platform-security.html) |\n| **Row-level security (RLS)** | A database feature that filters rows by policy; in PostgreSQL, with no policy, a default-deny applies. Used beside the application filter to enforce tenant isolation. | [Dealers, Groups and Rooftops: Tenancy Models for Dealer SaaS](tenancy-and-dealer-groups.html) |\n| **Identity / user / API client** | An identity is a person or software that can authenticate; a user is a person; an API client is a registered piece of software that belongs to one organization and calls the platform on its own behalf or on a dealer's. | [Who May Do What: Identity, Authorization and Entitlements](identity-access-and-entitlements.html) |\n| **Entitlement** | A right a tenant or rooftop has bought: a module, a feature, a quota or an allowance, with effective dates and the contract it came from. | [Who May Do What: Identity, Authorization and Entitlements](identity-access-and-entitlements.html) |\n| **Role-based access control (RBAC) / relationship-based authorization (ReBAC)** | RBAC decides by the user's role and suffers role explosion in dealer groups; ReBAC decides from a graph of relationships between identities and objects (manager of a region that groups a rooftop that holds this stock item). | [Who May Do What: Identity, Authorization and Entitlements](identity-access-and-entitlements.html) |\n| **Register authority** | The legal capacity of an organization to perform an official transaction with a vehicle register, with the credential that proves it and, where required, the owner's authorization for the specific transaction. | [Who May Do What: Identity, Authorization and Entitlements](identity-access-and-entitlements.html) |\n| **SCIM (System for Cross-domain Identity Management)** | The standard by which a dealer group's own identity provider provisions and disables users in the platform. | [Who May Do What: Identity, Authorization and Entitlements](identity-access-and-entitlements.html) |\n| **Onboarding** | Everything between a signed contract and a customer using the product for its core job without the vendor's help: verification, authority, migration, channel activation and go-live. | [From Signed Contract to First Sale: Onboarding, Migration and Configuration](onboarding-and-configuration.html) |\n| **Time to first advert** | The elapsed time from provisioning a rooftop to its first advert being confirmed live by a channel, not merely queued by the platform. | [From Signed Contract to First Sale: Onboarding, Migration and Configuration](onboarding-and-configuration.html) |\n| **Tenant configuration** | The set of typed values, rules and templates that change a tenant's product behavior inside limits the product defines, and that the product stores, validates and versions as data. | [From Signed Contract to First Sale: Onboarding, Migration and Configuration](onboarding-and-configuration.html) |\n| **Customization** | Any change to behavior the product did not anticipate. | [From Signed Contract to First Sale: Onboarding, Migration and Configuration](onboarding-and-configuration.html) |\n| **Extension point** | A documented, versioned place where code the vendor does not own may change or observe behavior without running inside the vendor's process: a webhook, a partner API call, a callout to a customer-hosted rule, a document template. | [From Signed Contract to First Sale: Onboarding, Migration and Configuration](onboarding-and-configuration.html) |\n| **Fork (customer)** | Vendor code that runs only for one customer: a branch, a tenant-conditional code path or a customer-specific build. | [From Signed Contract to First Sale: Onboarding, Migration and Configuration](onboarding-and-configuration.html) |\n| **Market pack** | Configuration the provider owns per market, such as Dutch registration-tax fields, Belgian language and e-invoicing rules, German registration data or UK document formats. | [From Signed Contract to First Sale: Onboarding, Migration and Configuration](onboarding-and-configuration.html) |\n| **Usage event** | An immutable record that one billable thing happened, written by the service that did it at the business moment. \"Billable\" is decided by the product catalog: a no-hit lookup is a usage event with a price of zero. | [Subscriptions, Lookups and No-Hit-No-Fee: Billing and Metering](billing-and-metering.html) |\n| **Business moment** | The point at which the platform has done the thing it will charge for: the report is delivered, the register has confirmed the transaction, the subscription period has started. | [Subscriptions, Lookups and No-Hit-No-Fee: Billing and Metering](billing-and-metering.html) |\n| **Outcome (usage)** | The service's classification of a result from a closed list per product: `hit`, `partial`, `no_hit`, `failed`, plus the billing-only `cached_reopen`. | [Subscriptions, Lookups and No-Hit-No-Fee: Billing and Metering](billing-and-metering.html) |\n| **No-hit-no-fee** | The commercial promise that a lookup returning nothing useful is not charged; it must be defined once, in the catalog, not per API stack. | [Subscriptions, Lookups and No-Hit-No-Fee: Billing and Metering](billing-and-metering.html), [Margins, Days and Lookups: The Economics of Dealers, Data and SaaS](dealer-and-data-economics.html) |\n| **Rating engine** | The component that turns usage events into rated usage: priced lines, each referencing its events, the price-book version, the contract terms and every rule that changed the price. | [Subscriptions, Lookups and No-Hit-No-Fee: Billing and Metering](billing-and-metering.html) |\n| **Price book** | The versioned, effective-dated catalog of list prices: SKU, unit, currency, market, tiers and the outcome-to-price map. | [Subscriptions, Lookups and No-Hit-No-Fee: Billing and Metering](billing-and-metering.html) |\n| **Credit (billing)** | A negative rated line with a reason code, an actor, an approval and links to the disputed events; never a quiet edit of an invoice. | [Subscriptions, Lookups and No-Hit-No-Fee: Billing and Metering](billing-and-metering.html) |\n| **Source license / license class** | A source license is the set of conditions under which the platform obtained a fact; a license class is the platform's label for a family of identical conditions. | [Allowed to Use It? Data Licensing, Purpose and Governance](data-licensing-and-governance.html) |\n| **Purpose** | An enumerated reason for using data, such as `trade-in-appraisal` or `consumer-history-report`, with its legal basis per jurisdiction and its retention rule. | [Allowed to Use It? Data Licensing, Purpose and Governance](data-licensing-and-governance.html) |\n| **License register** | The system of record for source licenses, license classes, purposes and client grants, each a machine-readable, effective-dated rule linked to its contract clause. | [Allowed to Use It? Data Licensing, Purpose and Governance](data-licensing-and-governance.html) |\n| **Purpose check** | The per-request decision: given caller, product, purpose and market, which sources and fields may be returned and which obligations travel with them. | [Allowed to Use It? Data Licensing, Purpose and Governance](data-licensing-and-governance.html) |\n| **Access audit** | The append-only record of decisions and deliveries: who received what, for which purpose, under which decision and rule versions. | [Allo
