wed to Use It? Data Licensing, Purpose and Governance](data-licensing-and-governance.html) |\n| **Data protection impact assessment (DPIA)** | The GDPR assessment each purpose references before high-risk processing such as ownership-change scoring. | [Allowed to Use It? Data Licensing, Purpose and Governance](data-licensing-and-governance.html), [Plates Are Personal: Privacy, Retention and Data Subject Rights](privacy-and-retention.html) |\n\n## <a id=\"g-distribution\"><\/a>Part VI — Distribution\n\nVehicle data as an API product, events that keep systems in step, data products and the consumer door. [Data as a Product: Designing Vehicle Data APIs](vehicle-data-apis.html) owns the response and the contract; [Keeping Everyone in Step: Events, Webhooks and Synchronization](events-webhooks-and-sync.html) owns events and reconciliation; [Selling Insight: Enrichment, Market Insight and Predictive Data Products](data-products-and-insights.html) and [The Consumer Door: Plate Checks, Reports and B2C Services](consumer-vehicle-checks.html) own the products.\n\n| Term | Definition | Chapter |\n| --- | --- | --- |\n| **Category block** | The unit of a vehicle data response that is sold, licensed, sourced and failed independently: identity, registration, specification, history, valuation, market, tax, battery health. | [Data as a Product: Designing Vehicle Data APIs](vehicle-data-apis.html) |\n| **Response composer** | The stateless service that turns one client request into one answer, block by block, with a per-block outcome. | [Data as a Product: Designing Vehicle Data APIs](vehicle-data-apis.html) |\n| **API contract registry** | The system of record for what the API promises: block definitions, canonical schemas, dated versions with the change class of every difference, legacy serializations, each client's version pin and deprecation dates. | [Data as a Product: Designing Vehicle Data APIs](vehicle-data-apis.html) |\n| **Lookup / report / batch / change feed** | The four API product shapes: a plate or VIN in and facts out in milliseconds; an immutable stored document; a list processed asynchronously; and a subscription that delivers events when a vehicle's facts change. | [Data as a Product: Designing Vehicle Data APIs](vehicle-data-apis.html) |\n| **Version pin** | A client credential's fixed, dated API version; the platform transforms newer responses for it until the version's support ends. | [Data as a Product: Designing Vehicle Data APIs](vehicle-data-apis.html), [Changing the Engine While Dealers Drive: Modernizing Legacy APIs and Monoliths](modernizing-the-platform.html) |\n| **Domain event (vehicle)** | An immutable statement, published by the context that owns a fact, that something happened to one business entity: a vehicle, a stock item, a channel listing, a lead, a deal or a register transaction. | [Keeping Everyone in Step: Events, Webhooks and Synchronization](events-webhooks-and-sync.html) |\n| **Command / change-data event / flow event** | Neighbors of the domain event: a command asks another system to do something and can be rejected; a change-data event is a row change captured from a database log, whose contract is the schema; a flow event records that a unit of work passed a stage, for monitoring. | [Keeping Everyone in Step: Events, Webhooks and Synchronization](events-webhooks-and-sync.html) |\n| **Outbox** | A table in the producing service's own database, written in the same transaction as the state change and relayed to the event backbone, so a committed change cannot be lost before publication. | [Keeping Everyone in Step: Events, Webhooks and Synchronization](events-webhooks-and-sync.html) |\n| **Change data capture (CDC)** | Capturing row-level changes from a database log. A migration tool; exposed to other teams, it turns your schema into their contract. | [Keeping Everyone in Step: Events, Webhooks and Synchronization](events-webhooks-and-sync.html), [Changing the Engine While Dealers Drive: Modernizing Legacy APIs and Monoliths](modernizing-the-platform.html) |\n| **Webhook subscription** | A registered, authorized request by an external party to receive selected event types at an HTTPS endpoint, with a secret, a filter, a delivery state and a delivery log. | [Keeping Everyone in Step: Events, Webhooks and Synchronization](events-webhooks-and-sync.html) |\n| **Reconciliation job** | A scheduled comparison of what one system believes with what another holds, for a defined set of entities, producing discrepancies as tickets or corrective events and never overwriting silently. | [Keeping Everyone in Step: Events, Webhooks and Synchronization](events-webhooks-and-sync.html) |\n| **Enrichment job** | A data product: a file of identifiers (plates or VINs) in, the same rows with requested attributes and a status per row out, priced per record. | [Selling Insight: Enrichment, Market Insight and Predictive Data Products](data-products-and-insights.html) |\n| **Insight cube** | A data product that answers a question by segment, region and period with aggregated counts, shares, stand-times and prices, as a dashboard, report or file. | [Selling Insight: Enrichment, Market Insight and Predictive Data Products](data-products-and-insights.html) |\n| **Propensity score (vehicle)** | A probability band per vehicle, or an aggregate forecast, that an event such as an ownership change will happen; returned as bands, not raw probabilities, and expired after a fixed period. | [Selling Insight: Enrichment, Market Insight and Predictive Data Products](data-products-and-insights.html) |\n| **Match-in** | Scoring or enriching only the customers a client already has a declared relationship with, instead of selling lists of other people's cars. | [Selling Insight: Enrichment, Market Insight and Predictive Data Products](data-products-and-insights.html) |\n| **Plate check** | A free, anonymous lookup by registration plate (or VIN) that identifies the vehicle and shows a few basic facts. | [The Consumer Door: Plate Checks, Reports and B2C Services](consumer-vehicle-checks.html) |\n| **Consumer report** | A paid, rendered, dated snapshot of one vehicle's identity, register status, history judgements and value range, issued to one consumer under one purpose. | [The Consumer Door: Plate Checks, Reports and B2C Services](consumer-vehicle-checks.html) |\n| **Unfair Commercial Practices Directive (UCPD)** | The EU directive under which an advert or report is misleading if it gives false information about a product's main characteristics; as amended by the Omnibus Directive, it requires paid placement to be disclosed. | [Making the Car Sellable Online: Photos, Descriptions and Equipment](merchandising.html), [The Consumer Door: Plate Checks, Reports and B2C Services](consumer-vehicle-checks.html) |\n\n## <a id=\"g-operations\"><\/a>Part VII — Operations\n\nRunning the platform when registers, suppliers and partners fail, at a known cost, observed, secured and lawful. [When the Register Is Down: Reliability With External Dependencies](reliability-and-dependencies.html), [Volumes, Peaks and Paid Lookups: Scalability and Operating Cost](scale-and-cost.html), [Seeing the Platform: Observability, Data Quality Operations and Support](observability-and-data-operations.html), [Protecting Dealers and Data: Security for a Vehicle Data Platform](vehicle-platform-security.html) and [Plates Are Personal: Privacy, Retention and Data Subject Rights](privacy-and-retention.html) own these terms.\n\n| Term | Definition | Chapter |\n| --- | --- | --- |\n| **Dependency** | Any system outside the team's control that a journey relies on: a register, a data supplier, a portal, a DMS, a payment provider, another cloud or another team's product. | [When the Register Is Down: Reliability With External Dependencies](reliability-and-dependencies.html) |\n| **Service level indicator (SLI) / service level objective (SLO)** | An SLI is a carefully defined quantitative measure of some aspect of the level of service; an SLO is a target for it. | [When the Register Is Down: Reliability With External Dependencies](reliability-and-dependencies.html) |\n| **Journey SLO** | An objective set on an end-to-end dealer or client journey rather than on a service. | [When the Register Is Down: Reliability With External Dependencies](reliability-and-dependencies.html) |\n| **Error budget** | The amount of failure a journey's SLO allows; the book attributes its use to the platform or to upstream dependencies. | [When the Register Is Down: Reliability With External Dependencies](reliability-and-dependencies.html) |\n| **Dependency budget** | The share of a journey's error budget allotted to one external dependency, with the rule that limits how many synchronous dependencies a critical journey may carry. | [When the Register Is Down: Reliability With External Dependencies](reliability-and-dependencies.html) |\n| **Degraded mode** | A named, tested way for a journey to keep working, or to fail honestly, while a dependency is impaired. | [When the Register Is Down: Reliability With External Dependencies](reliability-and-dependencies.html) |\n| **Dependency tier** | How badly losing a dependency hurts: tier 1 blocks a legal or commercial act and no copy can substitute; tier 2 degrades a decision that can continue with older, partial or labeled data. | [When the Register Is Down: Reliability With External Dependencies](reliability-and-dependencies.html) |\n| **Labeled copy / honest queue** | Two degraded-mode answers: a labeled copy serves the last known fact with source and observation time; an honest queue accepts an act, orders it and shows it as pending at the authority, never as done. | [When the Register Is Down: Reliability With External Dependencies](reliability-and-dependencies.html) |\n| **Workload shape** | The profile of one kind of demand over time, such as month-end register peaks or a Saturday insurer batch. | [Volumes, Peaks and Paid Lookups: Scalability and Operating Cost](scale-and-cost.html) |\n| **Unit cost** | The cost of one unit of business output: a lookup, a report, a publish, a rooftop-month. | [Volumes, Peaks and Paid Lookups: Scalability and Operating Cost](scale-and-cost.html) |\n| **Cost per lookup** | The fully loaded unit cost of one billable data call (upstream data, compute and storage, shared platform and people), reported as an average and, more usefully, per call path. | [Volumes, Peaks and Paid Lookups: Scalability and Operating Cost](scale-and-cost.html), [Margins, Days and Lookups: The Economics of Dealers, Data and SaaS](dealer-and-data-economics.html) |\n| **Cost to serve** | The fully loaded cost of one customer over a period: a rooftop-month, an API client's year, a dealer group's contract. | [Volumes, Peaks and Paid Lookups: Scalability and Operating Cost](scale-and-cost.html) |\n| **Cost per publish / cost per report** | The cost of one channel operation (insert, update or delete of one advert on one portal), and of one report, which is dominated by its sources. | [Volumes, Peaks and Paid Lookups: Scalability and Operating Cost](scale-and-cost.html) |\n| **Pass-through cost** | An upstream fee the platform passes on to the client explicitly, as a surcharge or a separate line, instead of absorbing it in a blended price. | [Volumes, Peaks and Paid Lookups: Scalability and Operating Cost](scale-and-cost.html) |\n| **Upstream budget broker** | The component that rations paid upstream calls by lane and priority and coalesces concurrent fetches of the same VIN and source; the component most platforms lack. | [Volumes, Peaks and Paid Lookups: Scalability and Operating Cost](scale-and-cost.html) |\n| **Business-flow monitor** | A monitor that follows one unit of business work (one advert operation on one channel, one lead, one register transaction) from the event that starts it to the confirmed outcome that ends it. | [Seeing the Platform: Observability, Data Quality Operations and Support](observability-and-data-operations.html) |\n| **Publish lag** | The time from a stock change in the dealer system to its confirmed state on a channel; what can be measured depends on whether the channel confirms, accepts, takes files or allows read-back. | [Seeing the Platform: Observability, Data Quality Operations and Support](observability-and-data-operations.html) |\n| **Data observability checks** | Freshness (age of the newest record from a source), volume (records against a trailing baseline), distribution (whether values still look as they did per segment) and linkage (whether records still resolve to vehicles). | [Seeing the Platform: Observability, Data Quality Operations and Support](observability-and-data-operations.html) |\n| **OpenTelemetry (OTel)** | The instrumentation standard for traces, metrics and logs; asynchronous hops are joined by a **span link**. | [Seeing the Platform: Observability, Data Quality Operations and Support](observability-and-data-operations.html) |\n| **Support console** | The tool that shows a support agent the evidence about one vehicle, advert, lead or transaction, with access tied to a ticket and every view audited. | [Seeing the Platform: Observability, Data Quality Operations and Support](observability-and-data-operations.html) |\n| **Enumeration defense** | The controls that make walking an identifier space (plates, VINs, stock ids, lead ids) expensive, slow, visible and low-yield. | [Protecting Dealers and Data: Security for a Vehicle Data Platform](vehicle-platform-security.html) |\n| **Scoped credential** | A credential bound to one client, one environment, named products and purposes, rate, quota and spend limits and a lifetime, revocable on its own. | [Protecting Dealers and Data: Security for a Vehicle Data Platform](vehicle-platform-security.html) |\n| **Broken object-level authorization (BOLA)** | First in OWASP's 2023 API Security Top 10: reaching an object the caller has no relationship with. The control is a check on every access; licensed lookups of any plate need enumeration defense instead. | [Protecting Dealers and Data: Security for a Vehicle Data Platform](vehicle-platform-security.html) |\n| **NIS2** | The EU's NIS2 Directive (Directive (EU) 2022/2555, applicable through national laws from 18 October 2024), which sets risk-management and incident-reporting duties for medium and large entities in listed sectors, including cloud service providers. | [Protecting Dealers and Data: Security for a Vehicle Data Platform](vehicle-platform-security.html) |\n| **Controller / processor** | A controller decides the purposes and essential means of processing; a processor processes on the controller's documented instructions (GDPR Arts. 4(7), 4(8), 28). A platform is decided per product and data class, not per company. | [Plates Are Personal: Privacy, Retention and Data Subject Rights](privacy-and-retention.html) |\n| **General Data Protection Regulation (GDPR)** | The EU regulation on personal data that governs leads, customers, plates and VINs linked to people; the UK applies UK GDPR. | [Plates Are Personal: Privacy, Retention and Data Subject Rights](privacy-and-retention.html) |\n| **Retention schedule / retention rule** | The schedule sets a retention rule per data class; a rule is a period, a trigger (a business event, not the row's creation date) and an action: delete, anonymize or aggregate. A **legal hold** suspends it. | [Plates Are Personal: Privacy, Retention and Data Subject Rights](privacy-and-retention.html) |\n| **Erasure propagation** | Making an erasure reach every derived copy (warehouse, search, caches, backups and recomputation jobs) through an erasure ledger replayed on restore and a suppression list. | [Plates Are Personal: Privacy, Retention and Data Subject Rights](privacy-and-retention.html) |\n| **Erasure ledger / suppression list** | The append-only log of every erasure, keyed by a salted hash of the subject key; and the part of it that recomputation jobs must consult before producing output. | [Plates Are Personal: Privacy, Retention and Data Subject Rights](privacy-and-retention.html) |\n| **Unregistered store** | A cache, bucket or table holding personal data without a registration and retention class; the failure that undoes all the others, blocked at deployment. | [Plates Are Personal: Privacy, Retention and Data Subject Rights](privacy-and-retention.html) |\n\n## <a id=\"g-journeys\"><\/a>Part VIII — Journeys\n\nFour flows followed across every boundary they cross. Two journeys add terms; the others apply what earlier parts define.\n\n| Term | Definition | Chapter |\n| --- | --- | --- |\n| **Correction case** | The unit of work and accountability for a correction: the cause, the superseded or disputed versions, the decision per artifact class, the notices sent, each consumer's completion and the closure. One supplier error is one case. | [A Fact Was Wrong: Propagating a Vehicle Data Correction](journey-data-correction.html) |\n| **Disputed (fact status)** | A status on a fact version suspected wrong but not yet corrected: excluded from current values and new derivations, while issued artifacts are not yet touched. | [A Fact Was Wrong: Propagating a Vehicle Data Correction](journey-data-correction.html) |\n| **Correction event** | `vehicle.fact.corrected`: an immutable, per-vehicle, thin event, published by the context that owns the fact, saying that fact versions were superseded or retracted, naming the case, attribute, old and new version ids and the window served. | [A Fact Was Wrong: Propagating a Vehicle Data Correction](journey-data-correction.html) |\n| **Impact edge / impact graph** | An impact edge, written by a consumer when it uses a fact version, links the version to the artifact built on it and the artifact to its recipient. The impact graph is all edges together; a correction's **impact set** is the forward closure from the superseded versions. | [A Fact Was Wrong: Propagating a Vehicle Data Correction](journey-data-correction.html) |\n| **Issued artifact / live artifact** | An issued artifact left the platform's control or was relied on (a valuation returned, a report delivered) and is never edited; a live artifact is still rendered and can change (an advert, a dossier view) and is recomputed. | [A Fact Was Wrong: Propagating a Vehicle Data Correction](journey-data-correction.html) |\n| **Lead acknowledgement** | The evidence, from the system where people work, that a lead reached a person. | [From Portal Enquiry to Dealer System: Routing a Lead End to End](journey-lead-to-dms.html) |\n| **Dead-letter review** | The governed process for every lead that could not be routed, delivered or confirmed. | [From Portal Enquiry to Dealer System: Routing a Lead End to End](journey-lead-to-dms.html) |\n| **Source-count match** | Leads per rooftop and source in the platform divided by the portal's own count, where the portal exposes one; the only check made by a party outside the journey. | [From Portal Enquiry to Dealer System: Routing a Lead End to End](journey-lead-to-dms.html) |\n| **Conditional write (stock)** | The strongly consistent write on the stock item, checked against its version, that reserves the car when the contract is signed; the deal's only hard dependency on stock, and it must work with every external system down. | [From Signed Contract to New Owner: Sale, Registration and Delisting](journey-sale-to-registration.html), [Closing the Sale: Quotes, Contracts, Financing and Margin VAT](deals-and-sales-documents.html) |\n\n## <a id=\"g-leadership\"><\/a>Part IX — Leadership\n\nThe Chief Architect's agenda: sourcing, integration of acquisitions, organization, modernization, AI and long-term evolution. Each chapter in [Part IX — LEADERSHIP: The Chief Architect's Agenda](part-9.html) owns the terms of its decision.\n\n| Term | Definition | Chapter |\n| --- | --- | --- |\n| **Sourcing decision** | A recorded choice of one sourcing route for one capability (build, adopt open source, buy, license or partner; acquiring a company is a sixth route), with the requirement that drove it, its assumptions, what stays in-house to make an exit possible, the review trigger and the decision owner. | [Build, Buy or Partner: Sourcing Vehicle Data and Platform Capabilities](build-buy-or-partner.html) |\n| **Data-rights test** | The questions a licensed data source, or a vendor receiving the platform's data, must answer before it is contracted: what may be stored, derived, shown and resold, and on what exit terms. | [Build, Buy or Partner: Sourcing Vehicle Data and Platform Capabilities](build-buy-or-partner.html) |\n| **Portfolio integration** | The deliberate, sequenced work of making acquired products share identity, data, metering and contracts while each keeps serving its customers, until the group can retire what it no longer needs. | [One Dossier, One Account: Integrating an Acquired Product Portfolio](one-platform-from-many-products.html) |\n| **Shared kernel (portfolio)** | The smallest set of capabilities whose answers every product must take from one place: who (person, organization, legal entity, rooftop), which car (vehicle key), what was used (usage event) and whether it was allowed (entitlement, authority and license). | [One Dossier, One Account: Integrating an Acquired Product Portfolio](one-platform-from-many-products.html) |\n| **Capability map v2** | Axleby's December 2027 revision of the capability map, which answers who owns each capability, at which tier, and how far each product has adopted it. | [One Dossier, One Account: Integrating an Acquired Product Portfolio](one-platform-from-many-products.html) |\n| **Team Topologies** | Matthew Skelton and Manuel Pais's vocabulary (2019) of four team types (stream-aligned, platform, complicated subsystem, enabling) and three interaction modes (collaboration, X-as-a-Service, facilitation). | [Who Owns What: Organizing Engineering for a Data and SaaS Platform](organizing-engineering.html) |\n| **Data-product team** | A stream-aligned team whose stream is a vehicle-data domain (specification, history, market data) and whose customers are internal products and external data clients. | [Who Owns What: Organizing Engineering for a Data and SaaS Platform](organizing-engineering.html) |\n| **Journey owner / dependency owner** | The journey owner is the stream-aligned team that owns a dealer or client outcome end to end; the dependency owner owns one external party (a portal, register channel, DMS family or supplier). | [Who Owns What: Organizing Engineering for a Data and SaaS Platform](organizing-engineering.html) |\n| **Adapter ownership** | The rule that an adapter has two owners: the integration team owns the adapter, the partner relationship and the dependency's health; the stream-aligned team owns the journey outcome and its SLO. | [Who Owns What: Organizing Engineering for a Data and SaaS Platform](organizing-engineering.html) |\n| **Architecture decision record (ADR)** | A short, dated record of an architecture decision, its context, options and consequences; the book puts sourcing and billing decisions in ADRs, not tickets. | [Who Owns What: Organizing Engineering for a Data and SaaS Platform](organizing-engineering.html), [Build, Buy or Partner: Sourcing Vehicle Data and Platform Capabilities](build-buy-or-partner.html) |\n| **Strangler fig** | Martin Fowler's name for gradual modernization that begins with small additions built on top of, yet separate from, the legacy code base, so the business gets value before the old system is retired. | [Changing the Engine While Dealers Drive: Modernizing Legacy APIs and Monoliths](modernizing-the-platform.html) |\n| **Writer flip (system-of-record switch)** | The moment one record set stops being written by the old system and starts being written by the new one; in a dealer platform the natural unit is the rooftop, so no car has two writers. | [Changing the Engine While Dealers Drive: Modernizing Legacy APIs and Monoliths](modernizing-the-platform.html) |\n| **Parallel run (vehicle)** | Sending the same real request through the old and the new path, serving the old answer, and comparing the two under declared rules with pinned inputs, classifying every difference before the new path takes over. | [Changing the Engine While Dealers Drive: Modernizing Legacy APIs and Monoliths](modernizing-the-platform.html) |\n| **Client sunset policy** | The published, contract-backed rules by which a provider ends an interface that external clients depend on: notice ladder, freeze, migration paths, switch-off evidence, levers (brownouts, prices, extensions) and exceptions. | [Changing the Engine While Dealers Drive: Modernizing Legacy APIs and Monoliths](modernizing-the-platform.html) |\n| **Autonomy ladder** | The classification of AI output by what it does when nobody intervenes: 0 inform, 1 draft, 2 propose, 3 act within an envelope, 4 bind without limits. A tier belongs to an action, not to a product. | [AI on the Forecourt: Agents, Assistants and Automation](ai-in-dealer-workflows.html) |\n| **Agent permission model** | Who an agent acts for, with which rights, inside which limits: principal, agent, delegation and envelope. An agent's effective rights are the intersection of the principal's rights, the agent's registered scopes and, for unattended actions, the envelope. | [AI on the Forecourt: Agents, Assistants and Automation](ai-in-dealer-workflows.html) |\n| **AI governance (vehicle)** | Governance for AI in a vehicle platform: one register of AI uses, tiers by consequence and shared release gates, using the same machinery as valuation model governance. | [AI on the Forecourt: Agents, Assistants and Automation](ai-in-dealer-workflows.html) |\n| **Model Context Protocol (MCP)** | An open protocol through which an AI application discovers and calls tools and data on a server. | [AI on the Forecourt: Agents, Assistants and Automation](ai-in-dealer-workflows.html) |\n| **EU AI Act** | The EU regulation that sets transparency duties and a few hard boundaries for AI systems; the AI register records each use's classification under it. | [AI on the Forecourt: Agents, Assistants and Automation](ai-in-dealer-workflows.html), [What Is It Worth? Building and Governing a Valuation Engine](valuation-engine.html) |\n| **Stressor / attractor / residue** | Residuality-theory terms: a stressor is anything that could happen to the business; an attractor is the state the business is pushed into when it hits; a residue is what remains of the architecture after it, and the change that lets the platform survive. | [Built for the Next Shock: Evolving the Platform Over a Decade](evolving-the-vehicle-platform.html) |\n| **Residual architecture** | The naive design plus the residues that survive the stressors considered. | [Built for the Next Shock: Evolving the Platform Over a Decade](evolving-the-vehicle-platform.html) |\n| **Fitness function (vehicle)** | From evolutionary architecture, an objective, preferably automated check that an architecture still has a property it was designed to have, such as \"no vehicle record without an AVK\". | [Built for the Next Shock: Evolving the Platform Over a Decade](evolving-the-vehicle-platform.html) |\n\n## <a id=\"g-practice\"><\/a>Part X — Practice\n\nThe case studies apply the book's terms to real companies. These rows name the public products and programs the cases rely on, as described in their dated sources; they are not descriptions of anyone's internals.\n\n| Term | Definition | Chapter |\n| --- | --- | --- |\n| **Fortellis** | CDK Global's API directory and marketplace, launched in 2018 as successor to 3PA and its partner program; an API contract can have several providers. | [CDK Global: The DMS as Platform, Gatekeeper and Single Point of Failure](case-cdk-global.html), [Living With the DMS: Dealer Management System Integration](dms-integration.html) |\n| **CDK Unify** | CDK Global's cloud single sign-on with multifactor authentication and role-based dashboards; CDK publishes no further detail. | [Who May Do What: Identity, Authorization and Entitlements](identity-access-and-entitlements.html), [CDK Global: The DMS as Platform, Gatekeeper and Single Point of Failure](case-cdk-global.html) |\n| **Bridge ID** | Cox Automotive's single sign-on, rolled out across its dealer products from late 2020, which works by linking each product's existing account; the most detailed public description of identity unification across an acquired portfolio. | [Cox Automotive: Building a Portfolio Into a Platform](case-cox-automotive.html), [Who May Do What: Identity, Authorization and Entitlements](identity-access-and-entitlements.html) |\n| **vAuto** | Cox Automotive's used-car inventory and pricing software, acquired with Kelley Blue Book and HomeNet in 2010; Cox estimates US retail sales from its stock observations. | [Cox Automotive: Building a Portfolio Into a Platform](case-cox-automotive.html) |\n| **Manheim Used Vehicle Value Index (MUVVI)** | A monthly measure of US wholesale used-vehicle prices with a published method; it reached a record 236.2 in December 2021. | [Cox Automotive: Building a Portfolio Into a Platform](case-cox-automotive.html) |\n| **Manheim Market Report (MMR)** | Manheim's wholesale value per vehicle; a value needs at least six transactions in the past year and two in the past 90 days for a trim, otherwise it falls back with a \"Small Sample Size\" flag. | [Cox Automotive: Building a Portfolio Into a Platform](case-cox-automotive.html), [Reading the Market: Advert Harvesting, Sale Detection and Transaction Data](market-data.html) |\n| **Autotrader Connect** | Auto Trader UK's partner API product (stock, search, valuations, deals) through which third-party software works on retailers' behalf. | [Auto Trader UK: From Classifieds Portal to Data and Software Platform for Retailers](case-auto-trader-uk.html) |\n| **Co-Driver / Deal Builder** | Auto Trader UK modules: Co-Driver, generative-AI tools for adverts (2025 financial year); Deal Builder, which lets buyers value a part-exchange, apply for finance and reserve a car, and whose bundling in November 2025 led to a retailer dispute. | [Auto Trader UK: From Classifieds Portal to Data and Software Platform for Retailers](case-auto-trader-uk.html) |\n| **MijnVWE** | VWE's workspace that holds its dealer modules together: advertising to many channels, register transactions, damage history, maintenance, battery SoH certificates and damage calculation (read October 2026). | [VWE: A Dutch Vehicle Data Company Becomes a Dealer Platform](case-vwe.html) |\n| **Occasion Manager / Finnik Zakelijk** | VWE's stock and pricing module, and its appraisal app with plate or VIN lookup, damage and recall warnings, register status and odometer history (read October 2026). | [VWE: A Dutch Vehicle Data Company Becomes a Dealer Platform](case-vwe.html) |\n| **Interdata** | VWE's XML interface for using vehicle data in a customer's own application: an XML request, often keyed by plate, and an XML response. | [VWE: A Dutch Vehicle Data Company Becomes a Dealer Platform](case-vwe.html) |\n| **Marktinzicht** | VWE's market-insight product built on official RDW register statistics (fleet, sales, inspections, export, scrapping, import). | [VWE: A Dutch Vehicle Data Company Becomes a Dealer Platform](case-vwe.html) |\n\n## <a id=\"g-registers\"><\/a>Register Terms: Netherlands, Belgium, Germany, United Kingdom, United States\n\nRegister, tax and inspection words the chapters keep in the original language or as official acronyms. Dutch and German terms appear in italics with an English gloss on first use in each chapter; this table collects them. Procedures and fees change: check the register's current documentation before relying on a row.\n\n| Term | Market | English | Meaning | Chapter |\n| --- | --- | --- | --- | --- |\n| ***tenaamstellen*** | NL | Registration in a new name | The Dutch register transaction that puts a vehicle in the buyer's name; the dealer gives the seller a release certificate as proof. | [Making It Official: Registration Transactions, Import, Export and Trade Documents](registration-and-trade-services.html) |\n| ***vrijwaren* / *vrijwaringsbewijs*** | NL | Indemnify / indemnification certificate | Releasing the seller from liability for the car; when a dealer takes a car into trade stock, the seller receives the *vrijwaringsbewijs*. | [Making It Official: Registration Transactions, Import, Export and Trade Documents](registration-and-trade-services.html), [Buying Right: Trade-In Appraisal, Sourcing and Maximum Purchase Price](vehicle-acquisition.html) |\n| ***bedrijfsvoorraad*** | NL | Trade stock | A recognized dealer's register status for cars bought to sell: no motor-vehicle tax, no APK obligation, and no parking on the public road. | [The Stock Book: Inventory Management and the Vehicle Dossier](inventory-and-vehicle-dossier.html), [Buying Right: Trade-In Appraisal, Sourcing and Maximum Purchase Price](vehicle-acquisition.html) |\n| ***erkenning*** | NL | Recognition | The register's recognition of a company for specific acts (such as trade stock or registration in a customer's name), built on a basic recognition that needs a certificate of conduct and a Chamber of Commerce entry. | [The Authoritative Source: Vehicle Registers and Official Data Access](registers-and-official-data.html) |\n| **APK (*Algemene Periodieke Keuring*)** | NL | Periodic roadworthiness inspection | The Dutch periodic inspection; its result and odometer reading are recorded in the register. | [What Happened to This Car: Damage, Odometer, Title and Service History](vehicle-history.html) |\n| **NAP (*Nationale AutoPas*)** | NL | National car pass | The industry odometer-registration scheme whose role the register took over from 1 January 2014; Dutch adverts commonly still show the NAP result. | [What Happened to This Car: Damage, Odometer, Title and Service History](vehicle-history.html), [Making the Car Sellable Online: Photos, Descriptions and Equipment](merchandising.html) |\n| ***tellerstandoordeel*** | NL | Odometer judgement | The Dutch register's verdict on a car's series of recorded odometer readings, such as \"logical\" or \"illogical\". | [The Authoritative Source: Vehicle Registers and Official Data Access](registers-and-official-data.html), [What Happened to This Car: Damage, Odometer, Title and Service History](vehicle-history.html) |\n| **WOK (*Wacht Op Keuren*)** | NL | Awaiting inspection | A register status for heavily damaged vehicles that must be re-inspected; withheld from RDW open data for every record. | [What Happened to This Car: Damage, Odometer, Title and Service History](vehicle-history.html) |\n| **BPM (*belasting van personenauto's en motorrijwielen*)** | NL | Registration tax | The one-off Dutch tax due when a car is first registered in the Netherlands, including imported used cars; computed by a registration tax engine. | [Making It Official: Registration Transactions, Import, Export and Trade Documents](registration-and-trade-services.html) |\n| ***meldcode*** | NL | Report code | The last four digits of the VIN, used by insurers and usable to corroborate a dealer-typed VIN. | [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html) |\n| ***koerslijst*** | NL | Price list | A valuation guide's published value list; Dutch courts have treated one as accepted evidence for BPM on imported used cars. | [Who Knows What About a Car: The Vehicle Data and Dealer Software Ecosystem](vehicle-data-ecosystem.html) |\n| **RDW (*Rijksdienst voor het Wegverkeer*)** | NL | Netherlands Vehicle Authority | The Dutch vehicle register, which publishes open data and runs information and transaction channels for recognized companies. | [The Authoritative Source: Vehicle Registers and Official Data Access](registers-and-official-data.html) |\n| **DIV (*Directie Inschrijvingen Voertuigen*)** | BE | Vehicle Registration Service | The Belgian vehicle register, reached by platforms through partners; a Belgian plate follows the owner to the next car. | [The Authoritative Source: Vehicle Registers and Official Data Access](registers-and-official-data.html) |\n| **Car-Pass** | BE | Car-Pass | The non-profit that Belgian law charges with recording odometer readings; its document is mandatory at a used-car sale and can carry a battery SoH. | [What Happened to This Car: Damage, Odometer, Title and Service History](vehicle-history.html), [The Authoritative Source: Vehicle Registers and Official Data Access](registers-and-official-data.html) |\n| **BIV (*belasting op de inverkeerstelling*)** | BE | Tax on putting into use | Belgium's regional registration tax, the equivalent of BPM. | [Making It Official: Registration Transactions, Import, Export and Trade Documents](registration-and-trade-services.html) |\n| ***handelaarsplaat*** | BE | Dealer plate | A Belgian Z-prefix plate, valid one year, for vehicles a dealer owns with a view to their sale. | [The Stock Book: Inventory Management and the Vehicle Dossier](inventory-and-vehicle-dossier.html) |\n| **KBA (*Kraftfahrt-Bundesamt*)** | DE | Federal Motor Transport Authority | Keeper of the German central vehicle register (ZFZR); private access is limited to legal claims under §39 StVG. | [The Authoritative Source: Vehicle Registers and Official Data Access](registers-and-official-data.html) |\n| ***Zulassung* / *Zulassungsstelle*** | DE | Registration / registration office | German vehicle registration, handled by local registration offices (about 400, an analyst estimate), registration services, i-Kfz online portals or the large-customer interface (GKS). | [Making It Official: Registration Transactions, Import, Export and Trade Documents](registration-and-trade-services.html), [Dealers, Groups and Rooftops: Tenancy Models for Dealer SaaS](tenancy-and-dealer-groups.html) |\n| ***Zulassungsbescheinigung Teil I / Teil II*** | DE | Registration certificate Part I / Part II | Part I is carried with the car and holds fields such as the VIN (field E) and HSN/TSN; Part II is the ownership document that passes to the dealer at purchase. | [Buying Right: Trade-In Appraisal, Sourcing and Maximum Purchase Price](vehicle-acquisition.html), [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html) |\n| **HSN / TSN (*Herstellerschlüsselnummer* / *Typschlüsselnummer*)** | DE | Manufacturer and type key numbers | Keys for a type of vehicle on the registration certificate, used for specification and insurance classes; not identifiers of one car. | [What Exactly Was Built: Specification, Trim and Equipment Data](specification-and-equipment.html), [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html) |\n| ***Hauptuntersuchung*** | DE | Main inspection | The German periodic roadworthiness test. | [What Happened to This Car: Damage, Odometer, Title and Service History](vehicle-history.html) |\n| **§39 StVG** | DE | Road Traffic Act, section 39 | The provision limiting private access to German register data to legal claims. | [The Authoritative Source: Vehicle Registers and Official Data Access](registers-and-official-data.html), [Who May Do What: Identity, Authorization and Entitlements](identity-access-and-entitlements.html) |\n| **DVLA (Driver and Vehicle Licensing Agency)** | UK | Driver and Vehicle Licensing Agency | The UK vehicle register; keeper data needs \"reasonable cause\", and its vehicle status API was closed to new sign-ups as of October 2026. | [The Authoritative Source: Vehicle Registers and Official Data Access](registers-and-official-data.html) |\n| **DVSA (Driver and Vehicle Standards Agency)** | UK | Driver and Vehicle Standards Agency | Holder of MOT results, published through an MOT history API with weekly bulk files and daily deltas. | [The Authoritative Source: Vehicle Registers and Official Data Access](registers-and-official-data.html) |\n| **MOT** | UK | Annual roadworthiness test | The UK's periodic test, whose history (with odometer readings) is available by registration or VIN. | [What Happened to This Car: Damage, Odometer, Title and Service History](vehicle-history.html) |\n| **V5C** | UK | Vehicle log book | The UK registration certificate; its reference is used to tell DVLA of a sale to or from the trade, and its serial is proof of authority, never identity. | [Making It Official: Registration Transactions, Import, Export and Trade Documents](registration-and-trade-services.html), [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html) |\n| **KADOE (Keeper At Date Of Event)** | UK | Keeper at date of event | DVLA's electronic keeper-data channel for organizations with reasonable cause, such as parking companies; its name is the question every plate lookup really asks. | [The Authoritative Source: Vehicle Registers and Official Data Access](registers-and-official-data.html), [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html) |\n| **V778 / Q plate** | UK | Retention document / Q plate | A V778 holds a private registration taken off a vehicle (renewed every 10 years); a Q plate replaces a registration whose identity is in doubt. | [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html) |\n| **VED (Vehicle Excise Duty)** | UK | Vehicle tax | UK vehicle tax paid at first registration and yearly afterwards; it does not transfer with the car. | [Making It Official: Registration Transactions, Import, Export and Trade Documents](registration-and-trade-services.html) |\n| **DMV (department of motor vehicles)** | US | State vehicle agency | Each US state's registration and titling agency; dealers often work through dealer service providers. | [Making It Official: Registration Transactions, Import, Export and Trade Documents](registration-and-trade-services.html) |\n| **NMVTIS** | US | National Motor Vehicle Title Information System | The federal system that links state title records; states report each VIN's brands, titled owner and odometer disclosures, and insurers report total losses. | [What Happened to This Car: Damage, Odometer, Title and Service History](vehicle-history.html), [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html) |\n| **Title / title brand / title washing** | US | Ownership certificate / status label / re-titling to drop a brand | A US title records legal ownership and any permanent brand (salvage, flood, rebuilt, junk, not actual mileage); title washing re-titles a car across states to lose a brand. | [What Happened to This Car: Damage, Odometer, Title and Service History](vehicle-history.html), [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html) |\n| **ELT (electronic lien and title)** | US | Electronic lien and title | The electronic channel through which lenders record and release liens on titles. | [Making It Official: Registration Transactions, Import, Export and Trade Documents](registration-and-trade-services.html) |\n| **DPPA (Driver's Privacy Protection Act)** | US | Driver's Privacy Protection Act | The federal law that restricts personal data from state motor-vehicle records to permissible uses. | [The Authoritative Source: Vehicle Registers and Official Data Access](registers-and-official-data.html) |\n\n## <a id=\"g-axleby\"><\/a>Axleby Names (Fictional)\n\n**Axleby is fictional, and so is every name below.** No row describes a real company's system, product or person; the names recur across chapters, so they are collected here. [Meet Axleby: A Data Business and a Software Business Under One Roof](meet-axleby.html) introduces the group, its brands, cast and systems; the canonical facts behind them come from the book's scenario ledger.\n\n| Term | Definition | Chapter |\n| --- | --- | --- |\n| **Axleby Group** | The fictional vehicle-data and dealer-software group the book follows, headquartered in Utrecht and majority owned since 2022 by the fictional fund Harrowgate Capital: €214 million revenue and about 1,150 employees in 2026. | [Meet Axleby: A Data Business and a Software Business Under One Roof](meet-axleby.html) |\n| **Axleby Data** | Axleby's vehicle data services brand (founded 1996): identity, specification, history reports, valuations, market data, enrichment and insight; an authorized information provider for the Dutch register since 1999. | [Meet Axleby: A Data Business and a Software Business Under One Roof](meet-axleby.html) |\n| **Lotwise** | Axleby's dealer SaaS for the Netherlands, Belgium and Germany (founded 2009 in Ghent, acquired 2019), sold as monthly modules per rooftop on about 7,200 rooftops. | [Meet Axleby: A Data Business and a Software Business Under One Roof](meet-axleby.html) |\n| **Showroomly** | Axleby's UK dealer websites, leads and syndication product (founded 2014 in Leeds, acquired 2023), on about 1,350 rooftops. | [Meet Axleby: A Data Business and a Software Business Under One Roof](meet-axleby.html) |\n| **Axleby Trade** | Axleby's business line for official Dutch register transactions, import and export documents, BPM calculations, plates and trade materials, and Tradefloor. | [Meet Axleby: A Data Business and a Software Business Under One Roof](meet-axleby.html), [Making It Official: Registration Transactions, Import, Export and Trade Documents](registration-and-trade-services.html) |\n| **Odolo** | Axleby's consumer vehicle-check app and website in the Netherlands, Belgium and the UK: a free basic check by plate and a paid full report. | [Meet Axleby: A Data Business and a Software Business Under One Roof](meet-axleby.html), [The Consumer Door: Plate Checks, Reports and B2C Services](consumer-vehicle-checks.html) |\n| **Wertlauf** | Axleby's valuation and market-data business in Munich (founded 2015, acquired 2021), whose models power Vantage. | [Meet Axleby: A Data Business and a Software Business Under One Roof](meet-axleby.html) |\n| **Tradefloor** | Axleby Trade's business-to-business trade exchange, with hand-off to auction partners; Axleby never holds buyers' money. | [Trader to Trader: B2B Exchanges, Auctions and Lease Remarketing](b2b-trade-and-remarketing.html) |\n| **One Dossier** | Axleby's 2027–2029 program (€38 million, approved March 2027) for one login, one vehicle key, one dossier, metered usage and request-path license checks, then events, desired-state syndication and JSON API v2. | [Meet Axleby: A Data Business and a Software Business Under One Roof](meet-axleby.html) |\n| **Connect XML** | Axleby's legacy SOAP/XML data API and report back-end (since 2006, .NET on SQL Server in Utrecht), carrying 38% of API calls in 2026 and due for sunset on 31 December 2029. | [Meet Axleby: A Data Business and a Software Business Under One Roof](meet-axleby.html), [Changing the Engine While Dealers Drive: Modernizing Legacy APIs and Monoliths](modernizing-the-platform.html) |\n| **JSON API v1 / v2** | Axleby's newer data APIs: v1 (Kotlin on AWS, since 2022) and v2, a block-based lookup API with per-block outcomes and, later, webhooks. | [Data as a Product: Designing Vehicle Data APIs](vehicle-data-apis.html) |\n| **Anchor** | Axleby's VIN-keyed identity graph (built 2024) with time-bounded plate assignments; it issues the AVK. | [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html) |\n| **Axleby Vehicle Key (AVK)** | Anchor's opaque 26-character internal surrogate key for one physical vehicle; the only vehicle key across products under One Dossier. | [Which Car Is This? VINs, Plates and the Vehicle Identity Graph](vehicle-identity.html) |\n| **Turnstile** | Axleby's register gateway: adapters to the Dutch register's information and transaction channels, to the Belgian register through a partner and to DVLA and DVSA, with the register mirror and a session, , are listed in [Bibliography](bibliography.html).\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
