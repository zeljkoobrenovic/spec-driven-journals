<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Allowed to Use It? Data Licensing, Purpose and Governance\n\n## Intent\n\nShow how a vehicle data and dealer SaaS platform enforces the conditions under which each fact may be used: the terms of its sources (registers, suppliers, portals, dealers, Data Act rights) and the purposes its clients have contracted for. The chapter's argument: license terms are rules, so they belong in a license register as clause-linked, effective-dated data; a purpose check evaluated next to every enforcement point decides which sources and fields a client receives for its purpose and audience; obligations travel with the response and flow down in contracts; and an append-only recipient audit, cross-checked against the meter, is the evidence suppliers, registers and regulators ask for. Misuse is detected by comparing traffic with the declared purpose, not by waiting for complaints.\n\nThe chapter owns **license register**, **purpose check** and **access audit**.\n\nProductscape bricks covered: `dgov` (Data Licensing and Compliance Governance: license-check API, compliance console, license register; the `data-licence-and-consent-register` asset and `compliance-audit-log` store), plus the license-check edges from `vapi`, `fenr` and `cool`.\n\n## Audience\n\nChief architects, principal engineers, data-governance leads and DPOs at vehicle-data companies and groups that resell register, supplier and partner data through APIs, reports and insight products. They know authorization and policy engines; they need the vehicle-data license landscape, the rule types real licenses contain, and the decisions that make license enforcement fast, auditable and owned.\n\n## Success criteria\n\n- [x] The License Breach is worked with numbers (Lintvelt Leads: 71,400 calls, €135,700 paid, €145,000 supplier settlement, ~€230,000 total cost) and the four questions Axleby could not answer.\n- [x] Real license clauses (RDW CC0 non-attribution, RDW per-plate access, DVLA KADOE contract clauses, DPPA § 2721(c), Data Act Art. 6) are quoted with dates and mapped to rule types.\n- [x] Charter's components, the PEP/PDP split, rules-as-data (ODRL-style example), the license block in responses and a requirements table are specified, with fail-closed/fail-open policy per license class.\n- [x] Caching and retention bound by license, including derivative rights, are consistent with `scale-and-cost` (30-day build-data retention before July 2027) and `billing-and-metering` (`licence_ref`, 30-day re-open).\n- [x] Downstream obligations, misuse detection (signals, watermarking, trap records, Database Directive Art. 7(5)) and the two-level access audit (Data Act Art. 4(5) ceiling) are covered.\n- [x] Failure handling, a trade-off table with a conditional recommendation, Across Markets (NL/BE, DE, UK, US) and the Chief Architect's view are present.\n- [x] Three mermaid diagrams (architecture, sequence, grant lifecycle).\n\n## Non-goals\n\n- Register access regimes and provider obligations in depth ([The Authoritative Source: Vehicle Registers and Official Data Access](registers-and-official-data.html)).\n- Fact-level provenance and the provenance envelope ([Where Did This Fact Come From? Provenance, Freshness and Data Quality](provenance-and-data-quality.html)).\n- Authentication, API clients and entitlements ([Who May Do What: Identity, Authorization and Entitlements](identity-access-and-entitlements.html)).\n- Lawful basis, DPIA content, retention schedules for personal data, data subject rights ([Plates Are Personal: Privacy, Retention and Data Subject Rights](privacy-and-retention.html)).\n- Gateway design, rate limits and quotas ([Data as a Product: Designing Vehicle Data APIs](vehicle-data-apis.html)); enumeration and scraping defense ([Protecting Dealers and Data: Security for a Vehicle Data Platform](vehicle-platform-security.html)).\n- Data Act access flows for connected-vehicle data ([Data From the Car Itself: Connected Vehicles, Telematics and the EU Data Act](connected-vehicle-data.html)).\n- Cost effects of caching ([Volumes, Peaks and Paid Lookups: Scalability and Operating Cost](scale-and-cost.html)).\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\nArticle only for now.\n\n## Open questions\n\n- No commercial specification or history supplier license was read; supplier clauses are modeled on public register contracts and labeled as such.\n- The KADOE contract read is the 2014 parking-company version; current history-sector DVLA terms were not verified.\n- DVSA MOT History API data-reuse terms beyond the documentation's OGL notice were not verified.\n- The UK database right after Brexit is stated without checking the current UK text.\n- Belgian DIV business access terms were not verified.\n\n## Decision log\n\n- **2026-10-22** — Opened with a worked License Breach (Lintvelt Leads) whose cost to Axleby exceeded the client's payments, to show that the real loss was the inability to prove what any client received. Rejected opening with a regulation survey.\n- **2026-10-22** — Grounded the rule model in published license texts (RDW, DVLA KADOE, DPPA, Data Act) rather than invented supplier clauses, since no commercial license is public.\n- **2026-10-22** — Recommended embedded policy evaluation with pushed bundles, a built license register and an adopted engine, plus physical separation for keeper data; recorded the single-source exception.\n- **2026-10-22** — Kept privacy law to the audit-sizing limits (GDPR Art. 5, Data Act Art. 4(5)) and DPIA linkage; depth handed to `privacy-and-retention`.\n\n## Sources\n\n- **Internal**\n  - [Meet Axleby: A Data Business and a Software Business Under One Roof](meet-axleby.html), [Wrong Car, Wrong Price: Fifteen Ways Vehicle Platforms Go Wrong](where-vehicle-platforms-go-wrong.html) — the License Breach and License Blindness.\n  - [Subscriptions, Lookups and No-Hit-No-Fee: Billing and Metering](billing-and-metering.html) (`licence_ref`, re-open rule), [Volumes, Peaks and Paid Lookups: Scalability and Operating Cost](scale-and-cost.html) (build-data retention), [What Exactly Was Built: Specification, Trim and Equipment Data](specification-and-equipment.html), [From Many Sources to One Record: Ingestion, Normalization and Entity Resolution](ingestion-and-entity-resolution.html), [What Happened to This Car: Damage, Odometer, Title and Service History](vehicle-history.html), [What Is It Worth? Building and Governing a Valuation Engine](valuation-engine.html), [Seeing the Platform: Observability, Data Quality Operations and Support](observability-and-data-operations.html), [From Signed Contract to First Sale: Onboarding, Migration and Configuration](onboarding-and-configuration.html), [Living With the DMS: Dealer Management System Integration](dms-integration.html) — Charter's enforcement points and prior references.\n  - `_research/brief-connected-data-privacy-regulation.md` Parts 1, 5–8; `_research/brief-identity-registers.md` Parts 3–7 and 9; `_research/brief-specification-history.md` 2.8 and 3.4; `_research/brief-platform-apis-operations.md` 4.3 and 6.2; `_research/productscape-digest.md` (`dgov`).\n- **External**\n  - RDW open-data terms, paid access and privacy pages; DVLA KADOE fee-paying contract v4.0 (2014) and INF266 (2022); 18 U.S.C. § 2721; NMVTIS provider list.\n  - Regulation (EU) 2023/2854 (Data Act); Regulation (EU) 2016/679 (GDPR); Directive 96/9/EC; § 39 StVG; *Feist* (1991); FTC GM order (2026).\n  - W3C ODRL Information Model 2.2 (2018); NIST SP 800-162; Open Policy Agent documentation.\n\n## Changelog\n\n- **2026-10-22** — Initial spec and article. *(AI-mediated session)*\n- **2026-10-22** — Editorial review pass: report-snapshot retention aligned to 5 years (privacy-and-retention), the four places of supplier terms aligned to the ecosystem map, acronyms expanded. *(AI-mediated session)*\n- **2026-10-22** — Visual layer: converted 3 mermaid diagrams to illustrations and added 2 conceptual figures (article-illustrator). *(AI-mediated session)*\n"}]}]}</script>

        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;

            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped

                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');

                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');

                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
