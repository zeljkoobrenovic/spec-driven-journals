<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Field Kit: Templates for the Vehicle Platform Architect\n\n## Intent\n\nGive the reader a set of practical, copyable templates for the records a Chief Architect keeps when one group sells vehicle data (identity, specification, history, valuation, market data) and runs dealer SaaS (stock, pricing, syndication, leads, deals, register transactions). Each template comes from the chapter that teaches it, keeps that chapter's terms and fields, says where a field differs between the data half and the workflow half or between markets, and is filled in once with a short Axleby example whose numbers, names and dates match the owning chapter and the scenario ledger. A reader should be able to start from the design or decision on their desk, copy one record, see which fields carry identity, provenance, ownership and money, and know which mistakes make the record useless.\n\nProductscape bricks covered: none directly. The page is the working form of decisions taught across Parts I–IX; the brick-by-brick mapping lives in [Domain Coverage: From the Productscape Model to Chapters](domain-coverage.html).\n\n## Audience\n\nChief and enterprise architects of vehicle-data companies and dealer-software vendors, principal engineers, and the leads of data and valuation, partner integrations (channels, DMS, suppliers), platform and SRE, billing, and data governance. Product, commercial and legal leaders use Tools 1, 10, 11, 12 and 15 as discussion documents.\n\n## Success criteria\n\n- [x] Opens with IN THIS SECTION, YOU WILL; three KEY POINTS; three failure patterns with exact names; `<br>`; a lead on how to use the templates; a table of contents (Tool | Use it when | Chapter).\n- [x] Contains the sixteen templates in the PLAN contract, in that order, each as a `## Tool N` section with purpose and \"use it when\", a copyable table, checklist or fill-in block, an Axleby example, common mistakes and a Learn more `[[link]]` to the owning chapter.\n- [x] Every template's fields come from the owning chapter: investment class, condition, scope and market flag ([Mapping the Business: A Capability Map From Identify to Insight](vehicle-capability-map.html)); identifier, source of truth, four kinds of copy and contested rows ([Drawing the Lines: Bounded Contexts, Entities and Sources of Truth](vehicle-bounded-contexts.html)); envelope v1 fields and confidence tiers ([Where Did This Fact Come From? Provenance, Freshness and Data Quality](provenance-and-data-quality.html)); four validation layers and the Kilometra v2 clauses ([From Many Sources to One Record: Ingestion, Normalization and Entity Resolution](ingestion-and-entity-resolution.html)); model governance gates and segment status ([What Is It Worth? Building and Governing a Valuation Engine](valuation-engine.html)); the channel profile list ([One Stock, Sixty Channels: Listing Syndication to Portals](listing-syndication.html)); routing order and read-back ([Every Enquiry Counts: Lead Capture, Routing and CRM](leads-and-crm.html)); authority chain, Ambiguous state and probe ([Making It Official: Registration Transactions, Import, Export and Trade Documents](registration-and-trade-services.html)); Hitch components and partner checklist ([Living With the DMS: Dealer Management System Integration](dms-integration.html)); R1–R8 and the July 2027 record ([Dealers, Groups and Rooftops: Tenancy Models for Dealer SaaS](tenancy-and-dealer-groups.html)); five gates and entitlement rows ([Who May Do What: Identity, Authorization and Entitlements](identity-access-and-entitlements.html)); license classes, rule schema and grant lifecycle ([Allowed to Use It? Data Licensing, Purpose and Governance](data-licensing-and-governance.html)); category blocks, outcome/freshness and version lifecycle ([Data as a Product: Designing Vehicle Data APIs](vehicle-data-apis.html)); three-outcome journey SLOs and the dependency budget ([When the Register Is Down: Reliability With External Dependencies](reliability-and-dependencies.html)); five sourcing options, four gates and the data-rights test ([Build, Buy or Partner: Sourcing Vehicle Data and Platform Capabilities](build-buy-or-partner.html)); team versus forum records, decision rights and vetoes ([Who Owns What: Organizing Engineering for a Data and SaaS Platform](organizing-engineering.html)).\n- [x] Axleby examples use ledger and chapter figures exactly: capability map v1 (39 capabilities; 13/21/5; 18/6/14; A3 specification P, Amber, Shared); entity–owner table v1 of 3 June 2027 (29 entities); build-data 28.5M fetches ≈€13.1M, 41% repurchases, ≈€0.58 first fetch, Q4 2027 13.5M ≈€7.8M; Kilometra 410,000 readings, 02:30 CET, €95,000 push quote, 91/92 batches, 96.8% of 4,100 pairs; EV replay week 3/week 5 at +5.8%, +2.4% by week 7, €1.1M → €0.3M; Velto hubs and the 1,460 leads; Brandsma's Corolla, 90 s timeout, 41 ambiguous outcomes on 30 June 2027; DriveDesk 1,900 rooftops and the 9–21 November 2027 outage; July 2027 tenancy decision; Lintvelt grant and €230,000; Fleetmoor €5.22 lookup; the 21 October 2027 sourcing register (flat fee €6.9M declined, review below 9M fetches); appraisal budget 0.83% vs 0.3%; event backbone record of 14 December 2027.\n- [x] One mermaid diagram shows how the records reference each other; cross-links use only valid permalinks.\n- [x] Short Sources and Evidence section with dated sources and the closing fictional-Axleby sentence; article at or under about 8,000 words excluding table separators.\n\n## Non-goals\n\n- Re-teaching the reasoning behind each template; each tool summarizes and links to its chapter.\n- The event catalog ([Keeping Everyone in Step: Events, Webhooks and Synchronization](events-webhooks-and-sync.html)), the impact graph ([A Fact Was Wrong: Propagating a Vehicle Data Correction](journey-data-correction.html)) and metric definitions ([Margins, Days and Lookups: The Economics of Dealers, Data and SaaS](dealer-and-data-economics.html)), which are linked, not reproduced.\n- Definitions of terms ([Glossary](glossary.html)), the source list by topic ([Bibliography](bibliography.html)) and the brick-to-chapter map ([Domain Coverage: From the Productscape Model to Chapters](domain-coverage.html)).\n- Downloadable file formats (spreadsheets, document templates).\n\n## Modalities\n\n- [ ] `checklist.md` — operational checklist\n- [ ] `summary.md` — management summary\n- [ ] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic\n\n## Open questions\n\n- [Mapping the Business: A Capability Map From Identify to Insight](vehicle-capability-map.html), [Drawing the Lines: Bounded Contexts, Entities and Sources of Truth](vehicle-bounded-contexts.html), [Build, Buy or Partner: Sourcing Vehicle Data and Platform Capabilities](build-buy-or-partner.html) and [Who Owns What: Organizing Engineering for a Data and SaaS Platform](organizing-engineering.html) were being written in parallel; Tools 1, 2, 15 and 16 were first drafted from their PLAN contracts and then aligned with the finished chapters in the same session. Re-check field names if those chapters are revised.\n- Tool 6's example uses AutoScout24's public documentation as accessed in October 2026; portal contracts change often and should be re-checked at each revision.\n\n## Decision log\n\n- **2026-10-22** — Chose the sixteen templates in the PLAN contract and no others, ordered by the book's parts, with the sourcing card and ADR last because they cite the others.\n- **2026-10-22** — Replaced BOOKED's hotel-versus-home columns with a \"which half, which market\" convention stated once and applied where a field differs, rather than a column in every template, to stay inside the length cap.\n- **2026-10-22** — Chose the One Dossier event backbone record as the ADR example because it changes owners and delivery paths across both halves and has a dated quarter-by-quarter consequence plan; the tenancy record already fills Tool 10.\n- **2026-10-22** — Used a real portal (AutoScout24) for the channel adapter example because the chapter's profile fields are documented from its public API; all facts carry the access date, and no Axleby incident is attributed to it.\n\n## Sources\n\n- **Internal**\n  - [Where Did This Fact Come From? Provenance, Freshness and Data Quality](provenance-and-data-quality.html), [From Many Sources to One Record: Ingestion, Normalization and Entity Resolution](ingestion-and-entity-resolution.html), [What Exactly Was Built: Specification, Trim and Equipment Data](specification-and-equipment.html), [Volumes, Peaks and Paid Lookups: Scalability and Operating Cost](scale-and-cost.html) — envelope v1, Inlet, Kilometra contract v2, build-data purchase gate and cost.\n  - [What Is It Worth? Building and Governing a Valuation Engine](valuation-engine.html), [One Stock, Sixty Channels: Listing Syndication to Portals](listing-syndication.html), [Every Enquiry Counts: Lead Capture, Routing and CRM](leads-and-crm.html), [Making It Official: Registration Transactions, Import, Export and Trade Documents](registration-and-trade-services.html), [Living With the DMS: Dealer Management System Integration](dms-integration.html) — model governance, channel profiles, routing, register transactions, Hitch.\n  - [Dealers, Groups and Rooftops: Tenancy Models for Dealer SaaS](tenancy-and-dealer-groups.html), [Who May Do What: Identity, Authorization and Entitlements](identity-access-and-entitlements.html), [Allowed to Use It? Data Licensing, Purpose and Governance](data-licensing-and-governance.html), [Data as a Product: Designing Vehicle Data APIs](vehicle-data-apis.html), [When the Register Is Down: Reliability With External Dependencies](reliability-and-dependencies.html), [Keeping Everyone in Step: Events, Webhooks and Synchronization](events-webhooks-and-sync.html) — tenancy record, gates and entitlements, Charter, Folio and v2, journey SLOs, event backbone.\n  - `_research/scenario-ledger.md` and `PLAN.md` — canonical Axleby facts and the toolkit contract.\n- **External**\n  - AutoScout24 Listing Creation API documentation and changelog; mobile.de Seller API documentation (n.d., accessed 2026-10).\n  - RDW information pack for recognized companies (2026); Regulation (EU) 2023/2854; W3C ODRL 2.2 (2018); Bitol Open Data Contract Standard; RFC 9457 (2023); Standard Webhooks; CloudEvents; Google SRE book (2016); AWS SaaS Lens (2023).\n  - Michael Nygard, *Documenting Architecture Decisions* (2011); Andrew Harmel-Law (2021); Mitchell et al., *Model Cards for Model Reporting* (2019); Pang et al., *Zanzibar* (2019).\n  - The BOOKED toolkit (`stays-marketplace-architecture/posts/toolkit/`) — page format and tool structure.\n\n## Changelog\n\n- **2026-10-22** — Initial spec and article. *(AI-mediated session)*\n- **2026-10-22** — Editorial review pass: aligned the Sold rule (issues 24 and 31), DMS field ownership (issue 31a) and the fitness-function list with their owning chapters; corrected reading time. *(AI-mediated session)*\n- **2026-10-22** — Final editorial pass: data-contract example calls the median batch gate insufficient and the per-workshop-chain check the fix (item 38); corrected redelivery unit to miles in the envelope example. *(AI-mediated session)*\n- **2026-10-22** — Visual layer: converted 1 mermaid diagram to illustrations and added 0 conceptual figures (article-illustrator). *(AI-mediated session)*\n"}]}]}</script>

                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
