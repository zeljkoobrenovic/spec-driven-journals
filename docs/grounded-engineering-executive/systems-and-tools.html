<script id="data" type="application/json">{"meta": {"id": "EXEC-SYSTEMS-AND-TOOLS", "status": "draft:gray", "title": "Management Systems and Tools", "date": "2026-07-26", "author": "Željko Obrenović", "permalink": "systems-and-tools", "timetoread": "10 min", "excerpt": "I manage through systems, not heroics. I model problems as stocks and flows and fix the real constraint, I run internal work as a product with discovery, selection, and validation, I align my leaders through explicit controls instead of standing meetings, and I size my own work backward from the time I actually have. The tools are how my judgment scales beyond the rooms I am in.", "tags": "engineering executive, systems thinking, migrations, metrics, delegation, leadership controls", "icon": "assets/icons/systems-and-tools.png", "logo": "assets/images/systems-and-tools/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "systems thinking", "migrations", "metrics", "delegation", "leadership controls"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I manage through systems, not heroics. I model management problems as stocks and flows and go after the real constraint, not the loudest symptom. I run internal work as a product — discovering problems, selecting them deliberately, validating solutions cheaply before building. I align my leaders through explicit controls with agreed degrees of alignment, so autonomy is designed rather than assumed. And I protect my own leverage: I size work backward from available time, finish the migrations I start, and delegate work into systems I then trust.\n\n## Statement\n\nThe fifteen tools behind this record collapse into four commitments:\n\n- **See the system before touching it.** Every management problem is stocks, flows, and feedback loops. I find the real constraint and refuse to optimize a rate whose downstream stock is already empty. Metrics follow the same discipline: every goal carries a target, a baseline, a trend, and a time frame, with investment goals counterbalanced by baseline goals.\n- **Run internal work as a product.** Platform teams, process changes, and migrations have users too. I discover their real problems, select against three horizons — survive this round, survive the next round, win rounds — and validate cheaply: write the launch announcement before building, prefer experiments over analysis, never build the whole thing to validate it.\n- **Align with explicit controls, not presence.** Metrics, visions, strategies, organization design, headcount, roadmaps, and performance reviews are my controls — and for each one, each leader and I agree on a degree of alignment, from \"I'll do it\" through preview, review, and notes, down to \"no surprises\" and \"let me know.\" Alignment becomes a designed interface instead of an ambient anxiety.\n- **Protect time and finish what you start.** I size work backward from the hours actually available and delegate work *in the system* — building the mechanism that handles it, not handing off one task at a time. Migrations get the same discipline: de-risk, enable with self-service tooling, then finish — stop the bleeding, drive to 100%, reserve recognition for completion.\n\n![Stocks-and-flows diagram of tanks connected by pipes, with one narrowed pipe highlighted in amber as the constraint and a feedback loop returning upstream.](assets/images/systems-and-tools/stocks-flows-constraint.jpeg)\n**Figure 1:** *See the system first: stocks, flows, feedback loops — and one real constraint worth fixing.*\n\n## How to Read This\n\nThis is an **appendix record**: it is grounded not in *The Engineering Executive's Primer*, like the core records of this journal, but in Will Larson's earlier, manager-focused book *An Elegant Puzzle: Systems of Engineering Management*, read here through an executive lens. The tools it catalogs are things I now mostly *charter and inspect* rather than run hands-on. It complements the Primer-grounded records rather than repeating them: strategy has its own record in [Engineering Strategy](engineering-strategy.html), metrics in [Measuring Engineering Organizations](measuring-engineering-organizations.html); this record places both inside the wider toolbox. The full fifteen-section working checklist lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Heroics don't scale; systems do.** An executive who fixes problems personally becomes the constraint of their own organization. Modeling a problem as stocks and flows — how fast we hire managers, how fast we train them, where work queues — lets me test a hypothesis before committing an organization to it, and tells me when an intervention is pointless because the bottleneck is elsewhere.\n\n**Internal work fails for product reasons, not engineering reasons.** Most failed platforms and process rollouts were built competently for a problem nobody selected carefully. Treating internal work as a product imports the missing discipline: discover pain points and hidden cohorts, select against explicit horizons, validate before building — the launch announcement written first is the cheapest falsification test I know. Change itself follows the same rule: **model, document, share** beats top-down mandate whenever slow adoption of a great approach is better than fast adoption of a good-enough one.\n\n**Implicit alignment is the expensive kind.** Without explicit controls, alignment is bought with meetings, escalations, and surprise. Naming the controls — and agreeing per leader, per control, on the degree of alignment required — converts that into a cheap, inspectable interface, and gives me an honest micromanagement detector: if I cannot delegate a control to a strong leader at \"no surprises,\" the problem is usually mine. The same explicitness applies to centralized decision groups: authoritative or advisory, decided deliberately, watching the four failure modes — domineering, bottlenecked, status-oriented, inert.\n\n![Six-step staircase from doing the work yourself at the bottom to full trusted delegation at the top, with small icons for preview, review, notes, and no surprises on the middle steps.](assets/images/systems-and-tools/alignment-degrees-ladder.jpeg)\n**Figure 2:** *The degrees of alignment: from \"I'll do it\" to \"let me know\" — agreed explicitly, per leader, per control.*\n\n**Unfinished migrations are the silent tax.** Migrations are effectively the only way to pay down technical debt at scale, and their value arrives almost entirely at completion — a migration at 80% pays most of its cost and delivers little of its benefit, because the organization still carries both systems. So the executive's job is the *finish*: stop the bleeding so no new work lands on the old path, make the path incremental and self-service, and celebrate completion rather than launch.\n\n**Time is the stock everything else draws from.** Every tool above consumes executive attention, and attention is finite in a way ambition is not. Sizing work backward from available hours, protecting two-hour focus blocks, decoupling meeting attendance from productivity, and hiring before I am overwhelmed keep the rest of this record from being fiction.\n\n![Three-stage migration funnel from de-risking through self-service enablement to a finish line with a 100 percent flag, with the legacy pipe sealed off underneath.](assets/images/systems-and-tools/migration-funnel-finish.jpeg)\n**Figure 3:** *Migrations pay out at the end: de-risk, enable, then finish — stop the bleeding and drive to 100%.*\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| I model the system and fix the constraint. | I never act without a model. Some fires you fight first. |\n| Internal work is run as a product. | Every internal effort needs a full product process. Cheap validation is the point. |\n| Alignment degrees are agreed explicitly per leader and control. | The degree is fixed. It moves as trust and context change. |\n| I delegate work into systems and then trust them. | I disengage. The systems I build stay inspected — see [Inspected Trust](inspected-trust.html). |\n| Migrations are driven to 100% and celebrated at completion. | Every migration must run to the end. Killing a bad one early is also finishing. |\n| I size work backward from available time. | Ambition shrinks. The portfolio shrinks; the standard does not. |\n\nIn day-to-day terms: before chartering an initiative, I ask which stock or flow it moves and whether that is the constraint. Before funding an internal platform, I ask for the launch announcement and the reference users. When onboarding a new leader, we walk the controls and set an alignment degree for each. Each quarter I run a time retrospective. And when I present up, I start with the conclusion, make an explicit ask, and return to it at the end — prepare a lot, practice a little.\n\n## Anti-Patterns\n\n- **Optimizing the loudest rate.** Speeding up a flow whose downstream stock is already blocked — more hiring into an organization that cannot onboard.\n- **Internal products without users.** Platforms built because the technology was interesting, validated by the team that built them, adopted by nobody.\n- **Alignment by presence.** Substituting attendance at every meeting for explicit controls — the executive as a human broadcast protocol.\n- **The 80% migration graveyard.** Launching migrations with fanfare and abandoning them once the exciting part ends, leaving the organization to run both systems forever.\n- **Delegating tasks, not systems.** Handing off individual exceptions one at a time while remaining the routing layer for all of them.\n- **Reorg as avoidance.** Reaching for structural change to route around a people problem or a broken relationship.\n- **The heroic calendar.** Sizing commitments to ambition instead of available hours, then wondering why nothing finishes.\n\n## Related Records\n\n- [Engineering Strategy](engineering-strategy.html) — strategy in depth; this record supplies the diagnosis-policies-actions toolbox it draws on.\n- [Measuring Engineering Organizations](measuring-engineering-organizations.html) — metrics in depth; here they appear as one leadership control among several.\n- [Internal Communication](internal-communication.html) — the machinery that carries visions, strategies, and migration status through the organization.\n- [Managing Priorities and Energy](managing-energy.html) — the personal-energy counterpart to this record's time discipline.\n- [Organizational Design](organizational-design.html) — appendix sibling: team sizing, states of teams, and reorg planning in full.\n- [Management Approaches](management-approaches.html) — appendix sibling: the management philosophy these tools serve.\n\n## Scope and Revisiting\n\nThis principle governs how I select, charter, and inspect management work across my organization — and how I spend my own time. I revisit it when the tools stop earning their keep: models built but ignored in decisions, alignment degrees documented but surprises still arriving, a time retrospective showing the same imbalance two quarters in a row. Any of those means I am performing the system rather than running it.\n\n## Authoritative References\n\n- Will Larson, *An Elegant Puzzle: Systems of Engineering Management* (Stripe Press, 2019) — the book whose systems-and-tools checklist this record distills.\n- Many of the book's chapters began as freely available essays on [lethain.com](https://lethain.com/), where Larson continues to publish.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "8 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle — the full fifteen-tool inventory from* An Elegant Puzzle. *The Article tab carries the rationale, implications, and anti-patterns.*\n\n## 1. Use Systems Thinking for Management Problems\n\n- [ ] Identify the **stocks** in the system: accumulated quantities such as managers, trained managers, pull requests, incidents, technical debt, or available time.\n- [ ] Identify the **flows** that change those stocks: hiring, training, departures, coding, review, deployment, recovery, debugging.\n- [ ] Label every flow as a **rate**, not a quantity.\n- [ ] Look for **feedback loops** where downstream outcomes affect upstream work.\n- [ ] Separate **causal relationships** from mere correlations.\n- [ ] Identify which stock or flow is currently the real constraint.\n- [ ] Avoid optimizing a rate that does not matter because its downstream stock is already empty or blocked.\n- [ ] Use the model to test hypotheses before committing to work.\n\n## 2. Manage Product Work Through Exploration, Selection, and Validation\n\n### Problem discovery\n\n- [ ] Explore users' pain points: what problems do they actually experience?\n- [ ] Explore users' purpose: what are users trying to accomplish?\n- [ ] Benchmark against similar companies or industries.\n- [ ] Look for hidden cohorts with unusual or surprising needs.\n- [ ] Identify areas where your company has unusual strengths.\n- [ ] Identify competitive moats or advantages.\n- [ ] Look for compounding leverage: work that becomes more valuable over time.\n\n### Problem selection\n\n- [ ] Ask what is needed to **survive the current round**.\n- [ ] Ask what is needed to **survive the next round**.\n- [ ] Ask what would help you eventually **win rounds**, not only survive them.\n- [ ] Consider different time frames: six months, two years, five years.\n- [ ] Consider industry trends and where they are heading.\n- [ ] Estimate return on investment, especially for quick or easy wins.\n- [ ] Identify experiments that will make future selection easier.\n\n### Solution validation\n\n- [ ] Write a customer letter or launch announcement before building.\n- [ ] Identify prior art and how peers have approached the problem.\n- [ ] Find reference users who are willing to be early users.\n- [ ] Prefer experiments over analysis when validation is cheap.\n- [ ] Find the fastest path to learning whether the solution works.\n- [ ] Test switching costs for users moving to the solution.\n- [ ] Avoid building the whole solution merely to validate it.\n\n## 3. Create Strategies and Visions\n\n### Strategy\n\n- [ ] Define the specific challenge the strategy addresses.\n- [ ] Write a diagnosis that clearly explains the challenge.\n- [ ] Identify constraints and trade-offs.\n- [ ] Define guiding policies for addressing the challenge.\n- [ ] Translate policies into concrete actions.\n- [ ] Keep the strategy practical, specific, and detailed.\n- [ ] Write as many strategies as are useful, but avoid unnecessary documents.\n\n### Vision\n\n- [ ] Define the future state where today's trade-offs are no longer mutually exclusive.\n- [ ] Write a short vision statement.\n- [ ] Define the value proposition for users and the company.\n- [ ] Identify capabilities needed to deliver the value proposition.\n- [ ] Name current constraints that the future state resolves.\n- [ ] Name future constraints that may appear.\n- [ ] Link relevant plans, metrics, and reference materials.\n- [ ] Synthesize the vision into a short narrative.\n- [ ] Test the document with others and iterate.\n- [ ] Refresh the vision periodically.\n- [ ] Use present tense.\n- [ ] Write simply.\n- [ ] Prefer one unified vision for each complete area.\n\n## 4. Define Useful Metrics and Goals\n\n- [ ] Ensure every goal has a **target state**.\n- [ ] Include a **baseline** showing where you are today.\n- [ ] Include a **trend** showing current velocity.\n- [ ] Include a **time frame** for the change.\n- [ ] Check whether someone unfamiliar with the area can judge the goal's difficulty.\n- [ ] Check whether success can be evaluated afterward.\n- [ ] Distinguish **investment goals** from **baseline goals**.\n- [ ] Pair investment goals with counterbalancing baseline metrics.\n- [ ] Keep investment goals few enough to drive planning discussions.\n- [ ] Carry baseline goals across planning cycles where useful.\n- [ ] Treat some baselines as contracts, especially when tied to SLOs.\n\n## 5. Use Metrics to Guide Broad Organizational Change\n\n- [ ] Start by exploring the data in a usable format.\n- [ ] Dive into the largest contributors or drivers.\n- [ ] Attribute each metric to the teams that can affect it.\n- [ ] Build context around each team's performance.\n- [ ] Benchmark teams against relevant peers.\n- [ ] Nudge teams with contextual information, not just dashboards.\n- [ ] Agree on baseline metrics with key teams.\n- [ ] Review performance monthly or quarterly.\n- [ ] Advocate for prioritization when teams lack agreed-upon baselines.\n- [ ] Minimize top-down orchestration where self-correction is possible.\n\n## 6. Run Technical Migrations Well\n\n### Decide whether migration is needed\n\n- [ ] Confirm the migration is the best path to reduce technical debt.\n- [ ] Confirm the migration creates technical leverage or capacity.\n- [ ] Recognize that large migrations often trade short-term contribution for long-term capacity.\n- [ ] Avoid pretending technical debt can be solved only through isolated teamwork.\n\n### De-risk\n\n- [ ] Write a design document.\n- [ ] Test the design with teams likely to have the hardest migration.\n- [ ] Iterate with edge cases and atypical patterns.\n- [ ] Test against the next six to twelve months of roadmap.\n- [ ] Embed with one or two challenging teams before broader rollout.\n- [ ] Get endorsement from a team that completed the migration.\n\n### Enable\n\n- [ ] Build self-service tooling where possible.\n- [ ] Make the migration incremental and reversible.\n- [ ] Document the process clearly.\n- [ ] Test documentation with real teams.\n- [ ] Prefer programmatic migration for the easy 90%.\n- [ ] Improve tools and docs before scaling the migration.\n\n### Finish\n\n- [ ] Stop the bleeding by ensuring new work uses the new approach.\n- [ ] Avoid generating tracking tickets too early.\n- [ ] Add visibility into migration status for teams and management.\n- [ ] Push status to teams that need to migrate.\n- [ ] Reserve recognition for successful completion, not only starting.\n- [ ] Drive to 100% adoption when deprecating the legacy system.\n\n## 7. Plan an Engineering Reorg\n\n### Validate that a reorg is the right tool\n\n- [ ] Confirm the problem is structural.\n- [ ] Make sure you are not avoiding a people-management issue.\n- [ ] Confirm the problem already exists.\n- [ ] Check whether the conditions are temporary.\n- [ ] Avoid reorgs that merely work around broken relationships.\n\n### Project headcount\n\n- [ ] Estimate an optimistic number based on what is barely possible.\n- [ ] Estimate a natural-size number for each team and role if they were fully staffed.\n- [ ] Estimate a realistic number based on historical hiring rates.\n- [ ] Merge these into one planning number.\n- [ ] Avoid overfitting the design to today's exact individuals.\n\n### Set manager-to-engineer ratio\n\n- [ ] Decide whether managers are expected to do hands-on technical work.\n- [ ] Use a lower ratio if managers do substantial technical work.\n- [ ] Otherwise target roughly five to eight engineers per manager.\n- [ ] Pick a ratio deliberately, probably in the six-to-eight range.\n\n### Define teams and groups\n\n- [ ] Write a crisp mission statement for each team.\n- [ ] Check whether each team would be exciting to join and manage.\n- [ ] Put teams that need to work together close to each other.\n- [ ] Define clear interfaces for each team.\n- [ ] List ownership areas for each team.\n- [ ] Create a gapless ownership map.\n- [ ] Avoid implicit holes of ownership.\n- [ ] Prepare compelling candidate pitches for each team.\n- [ ] Check whether the design over-optimizes for individuals.\n\n### Staff the structure\n\n- [ ] Identify people ready to fill roles now.\n- [ ] Identify people who can grow into roles in time.\n- [ ] Identify possible internal transfers.\n- [ ] Identify external hires needed.\n- [ ] Prefer people who already know the culture.\n- [ ] Maintain a spreadsheet of every person, current team, and future team.\n- [ ] Make sure nobody is accidentally omitted.\n\n### Commit and roll out\n\n- [ ] Confirm the changes are meaningfully net positive.\n- [ ] Check whether the structure will last at least six months.\n- [ ] Name the problems discovered during design.\n- [ ] Identify what might trigger the next reorg.\n- [ ] Identify who will be most impacted.\n- [ ] Explain the reasoning behind the reorganization.\n- [ ] Document how each person and team will be impacted.\n- [ ] Provide availability and empathy for impacted individuals.\n- [ ] Speak privately with those most heavily impacted first.\n- [ ] Prepare managers and key individuals to explain the reasoning.\n- [ ] Send written documentation.\n- [ ] Be available for discussion.\n- [ ] Prefer small-group discussion over large all-hands when emotions are high.\n- [ ] Double down on skip-level one-on-ones.\n\n## 8. Identify Your Leadership Controls\n\n- [ ] Decide where you need to engage and where you should hang back.\n- [ ] Choose controls appropriate to the team size and the leader-relationship.\n- [ ] Use metrics to align on outcomes while preserving flexibility.\n- [ ] Use visions to align on long-term direction.\n- [ ] Use strategies to align on constraints and approaches.\n- [ ] Use organization design to align wider sub-organizations.\n- [ ] Use headcount and transfers as a prioritization mechanism.\n- [ ] Use roadmaps to align on problem selection and solution validation.\n- [ ] Use performance reviews to coordinate culture and recognition.\n- [ ] Agree on the required degree of alignment for each control:\n  - [ ] \"I'll do it.\"\n  - [ ] Preview.\n  - [ ] Review.\n  - [ ] Notes.\n  - [ ] No surprises.\n  - [ ] Let me know.\n- [ ] Establish clear interfaces with the leaders you support.\n- [ ] Use inability to delegate as a signal that you may be micromanaging.\n\n## 9. Build Career Narratives\n\n- [ ] Avoid reducing career development to promotion ladders.\n- [ ] Help people identify broad long-term goals.\n- [ ] Identify gaps between current capabilities and future aspirations.\n- [ ] Translate goals into projects, research, relationships, and skills.\n- [ ] Use the manager's business context to find opportunities.\n- [ ] Ask the individual to participate actively rather than outsource the thinking.\n- [ ] Refresh the narrative quarterly or periodically.\n- [ ] Prioritize goals for the next three to six months.\n- [ ] Focus on disproportionate opportunities, not only contested career-path steps.\n\n## 10. Communicate with Media or Public Audiences\n\n- [ ] Answer the question you want to be asked.\n- [ ] Reframe difficult questions into ones you can answer constructively.\n- [ ] Stay positive.\n- [ ] Avoid being pulled into negative framing.\n- [ ] Speak in threes.\n- [ ] Repeat the same three concise points as your refrain.\n\n## 11. Use Model, Document, Share\n\n- [ ] Model the practice locally with your own team first.\n- [ ] Measure team health and throughput before changing the process.\n- [ ] Iterate until you are confident the approach works.\n- [ ] Document the problem, learning process, and adoption details.\n- [ ] Make the document specific enough for another team to adopt.\n- [ ] Ask others to review the documentation for clarity.\n- [ ] Share the approach and your rollout experience.\n- [ ] Do not lobby for change prematurely.\n- [ ] Avoid using this approach to circumvent organizational authority.\n- [ ] Use it when slow adoption of a great approach is better than fast adoption of a good-enough one.\n\n## 12. Design Centralized Decision-Making Groups\n\n### Decide whether to centralize\n\n- [ ] Identify the consistency problem you are trying to solve.\n- [ ] Decide whether the group should be **authoritative** or **advisory**.\n- [ ] Understand which positive freedoms the group creates.\n- [ ] Understand which negative freedoms the group removes.\n- [ ] Avoid centralizing merely because inconsistency feels uncomfortable.\n\n### Design the group\n\n- [ ] Define the group's influence.\n- [ ] Define how teams interact with the group.\n- [ ] Choose a size small enough to operate effectively.\n- [ ] Decide expected time commitment.\n- [ ] Decide whether members should identify primarily with the group.\n- [ ] Define a structured selection process.\n- [ ] Define term length.\n- [ ] Decide whether terms are fixed or permanent.\n- [ ] Decide how representative the group must be.\n- [ ] Include the right functions, teams, tenures, and perspectives.\n\n### Watch failure modes\n\n- [ ] Avoid **domineering** groups that reduce both positive and negative freedoms.\n- [ ] Avoid **bottlenecked** groups that try to do too much.\n- [ ] Avoid **status-oriented** groups whose value becomes recognition rather than contribution.\n- [ ] Avoid **inert** groups that do little.\n- [ ] Embed a manager who is responsible for iterating on the group's format.\n\n## 13. Present to Senior Leadership\n\n- [ ] Start with the conclusion.\n- [ ] Tie the topic to business value.\n- [ ] Explain why anyone should care in one or two sentences.\n- [ ] Establish historical narrative: how things are going, how you got here, and what is planned next.\n- [ ] Make an explicit ask.\n- [ ] Provide a data-driven diagnosis.\n- [ ] Show enough raw data for others to follow your analysis.\n- [ ] State decision-making principles.\n- [ ] Explain how principles lead to the proposed actions.\n- [ ] Explain what is next and when it will be done.\n- [ ] Return to the explicit ask at the end.\n- [ ] Prepare for detours.\n- [ ] Answer directly.\n- [ ] Go deep enough in the data to handle unexpected questions.\n- [ ] Discuss details when needed, but avoid getting trapped in irrelevant detail.\n- [ ] Prepare a lot; practice a little.\n- [ ] Make the goal of the meeting clear.\n\n## 14. Manage Time Deliberately\n\n- [ ] Run a quarterly time retrospective.\n- [ ] Categorize the past three months of calendar time.\n- [ ] Use the retrospective to adjust next quarter's allocation.\n- [ ] Prioritize long-term success over short-term quality when trade-offs are necessary.\n- [ ] Finish small, leveraged things.\n- [ ] Stop doing work that should be dropped, recategorized, or delegated.\n- [ ] Size work backward from available time.\n- [ ] Decide how many hours can be spent, then fit the work to that limit.\n- [ ] Delegate work \"in the system,\" not only individual tasks.\n- [ ] Build systems that allow others to handle the work.\n- [ ] Trust the systems you build.\n- [ ] Stop handling exceptions forever.\n- [ ] Decouple meeting attendance from productivity.\n- [ ] Do not assume attendance equals value.\n- [ ] Hire before you are overwhelmed.\n- [ ] Calendar-block focused work.\n- [ ] Add several two-hour focus blocks each week.\n- [ ] Get administrative support when complexity justifies it.\n\n## 15. Build Communities of Learning\n\n- [ ] Prefer facilitation over lecturing.\n- [ ] Keep presentations brief.\n- [ ] Leave most time for discussion.\n- [ ] Use small breakout groups.\n- [ ] Give each group a clear discussion prompt.\n- [ ] Regroup and share learning from each breakout.\n- [ ] Choose topics people already know about or encounter in daily work.\n- [ ] Encourage senior or tenured people to attend.\n- [ ] Provide optional pre-reads for people who dislike public first exposure.\n- [ ] Start with a short check-in when useful.\n- [ ] Ask each person for their name, team, and one sentence about what is on their mind.\n- [ ] Keep the format lightweight and repeatable.\n- [ ] Design the group so participants learn from each other, not only from the facilitator.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Manage through systems, not heroics — why effort that doesn't scale isn't leadership, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Leo rushes between several small desk fires with an extinguisher while Vera watches calmly from the doorway.](assets/images/systems-and-tools/comic-01-firefighter-leo.jpeg)\n**Panel 1:** *The hook: every problem gets a hero. The same hero.*\n\n![Comic panel: an exhausted Leo slumps under a wall of sticky notes and a flat chart while Vera comments.](assets/images/systems-and-tools/comic-02-effort-wall.jpeg)\n**Panel 2:** *The problem: effort doesn't scale. Ever.*\n\n![Comic panel: Vera draws a stocks-and-flows diagram on a whiteboard and circles one narrow pipe while Leo leans in.](assets/images/systems-and-tools/comic-03-see-the-system.jpeg)\n**Panel 3:** *The principle: see the system — and fix the constraint, not the symptom.*\n\n![Comic panel: Leo holds up a mock launch announcement page while Vera nods and two engineers look on curiously.](assets/images/systems-and-tools/comic-04-internal-product.jpeg)\n**Panel 4:** *Internal work is a product: discover, select, validate — before building.*\n\n![Comic panel: Vera turns a six-position alignment dial from a meetings icon toward a handshake icon as Leo watches.](assets/images/systems-and-tools/comic-05-alignment-dial.jpeg)\n**Panel 5:** *Alignment is a dial, agreed explicitly — from 'I'll do it' to 'let me know'.*\n\n![Comic panel: Leo plants a 100 percent flag on migrated blocks while Vera seals off an old faded pipe.](assets/images/systems-and-tools/comic-06-finish-the-migration.jpeg)\n**Panel 6:** *Migrations pay out at the finish line — so finish.*\n\n![Comic panel: Vera shows a calendar with two amber focus blocks and feeds task cards into a small gear machine as Leo hands one over.](assets/images/systems-and-tools/comic-07-size-backward.jpeg)\n**Panel 7:** *Time is the scarcest stock: size backward, block focus time, delegate in the system.*\n\n![Comic panel portrait: Vera and Leo stand calmly in front of a small tidy machine running on its own.](assets/images/systems-and-tools/comic-08-trust-the-system.jpeg)\n**Panel 8:** *The closer: build the system, then trust the system.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
