<script id="data" type="application/json">{"meta": {"id": "EXEC-ONBOARDING-PEER-EXECUTIVES", "status": "draft:gray", "title": "Onboarding Peer Executives", "date": "2026-07-25", "author": "Željko Obrenović", "permalink": "onboarding-peer-executives", "timetoread": "8-10 min", "excerpt": "When a new peer executive joins, I treat their onboarding as my job, not HR's. I commit personally to their success, share my mental framework of the company in their first two weeks, make role expectations and escalation paths explicit rather than implicit, and invest in a durable partnership cadence. Early, deliberate support is the cheapest way to prevent a mediocre peer from lingering.", "tags": "engineering executive, onboarding, peer executives, partnership, trust, leadership", "icon": "assets/icons/peer-onboarding.png", "logo": "assets/images/onboarding-peer-executives/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "onboarding", "peer executives", "partnership", "trust", "leadership"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: When a new peer executive joins, their onboarding is my job, not HR's. I commit personally to their success: I share my mental framework of the company in their first two weeks — the real data, the urgent problems, what's working, the power map, the processes, the cultural quirks — and I make our mutual role expectations and escalation paths explicit rather than letting them fester as assumptions. Executive onboarding is chronically ad hoc, and mediocre-but-pleasant executives can linger for years; early, deliberate support is the cheapest prevention available.\n\n## Statement\n\nWhen a peer executive joins a company where I work, I take deliberate ownership of their onboarding. Concretely, this means four commitments:\n\n- **I commit personally to their success.** Executive onboarding is ad hoc and often neglected — there is rarely a program, a buddy, or a curriculum. I fill that gap myself, and where possible I align with the CEO on shared expectations for the new hire and what success looks like in their first 90 days.\n- **I share my mental framework in their first two weeks.** Not a slide deck — the working model I actually operate from: where the real data lives, the top urgent problems, budget and headcount norms, what is working well, an honest assessment of their team, the power and influence map, the company's processes, and the cultural quirks that surprise newcomers.\n- **I make implicit expectations explicit.** We independently write down what we expect of each other's roles, compare the documents, and resolve the accidental misalignments before they become conflicts. We agree in advance how we handle public disagreement and when and how we escalate to the CEO.\n- **I invest in a durable partnership cadence.** Non-transactional time, a weekly structured 1:1 with a shared agenda, joint presence in the forums where our teams intersect — trust built through repeated, small commitments.\n\n![Four labeled pillars — Commit, Share the framework, Explicit expectations, Cadence — supporting a platform with an upward arrow.](assets/images/onboarding-peer-executives/four-commitments.jpeg)\n**Figure 1:** *The four commitments of peer-executive onboarding: personal commitment, the shared mental framework, explicit expectations, and a durable cadence.*\n\n\n## How to Read This\n\nThis record tells a new peer executive what they can expect from me, and tells CEOs how I support new executive hires. It is a vision of how I operate, not a program I impose. The concrete moves — the full briefing agenda, the role-definition exercise, the cadence — live in the **Checklist** tab of this post. This covers the onboarding window from the incumbent's side; my own ramp as the incoming executive is [First 90 Days](first-90-days.html), and the steady-state peer relationship is [Working with Your CEO, Peers, and Engineering](working-with-your-ceo-peers-and-engineering.html).\n\n## Rationale\n\n**Executive onboarding is neglected precisely because everyone assumes executives don't need it.** Engineers get onboarding buddies, starter tasks, and documentation. Executives get a laptop and a calendar full of meetings — the assumption being that seniority implies self-sufficiency. But an executive's job is to make consequential decisions early, with far less context than anyone else in the room. The onboarding they need is different in kind, not unnecessary: they need the company landscape — business, team, product, process — and the current critical issues, before they need any tooling.\n\n**A mental framework transfers context faster than discovery does.** A new executive can spend a quarter reconstructing where the real data lives, which processes work, who the unofficial influencers are, and why their team's performance history looks the way it does — or I can hand them my working model in two weeks and let them validate it against reality. I explicitly encourage validation over narratives: the framework is a map to check, not a doctrine to adopt. The honest parts matter most — the transparent team assessment, the historical context behind performance issues, and the steer away from \"fixing\" what isn't broken.\n\n![A map of the company divided into labeled regions such as real data, urgent problems, power map, and quirks, handed over in two weeks instead of a crossed-out quarter-long discovery path.](assets/images/onboarding-peer-executives/mental-framework-map.jpeg)\n**Figure 2:** *The mental framework: a two-week transfer of the working model a newcomer would otherwise spend a quarter reconstructing.*\n\n\n**Implicit role expectations fester; explicit ones get resolved.** Most executive conflict I have seen traces back to two reasonable people holding different unstated assumptions about who owns what. Writing expectations down independently and comparing them surfaces those misalignments while they are still cheap — and pre-agreeing the escalation path removes the ambiguity around decision ownership before the first real disagreement, per [Working with Your CEO, Peers, and Engineering](working-with-your-ceo-peers-and-engineering.html).\n\n**Mediocre but pleasant executives can linger — early support is the prevention.** Organizations are slow to correct an executive hire who is likable but ineffective; the cost compounds quietly for years. The cheapest intervention is at the start: watch for the red flags (inaction on key issues, changing what's already working, reverting to old-company playbooks prematurely), give candid feedback early, and address missteps before they compound. Preventing mistakes is far cheaper than recovering from them — the same logic that drives [Inspected Trust](inspected-trust.html).\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| I own my part of a new peer's onboarding personally. | HR and the CEO have no role — I align with the CEO on expectations where possible. |\n| I share my mental framework, including honest team assessments. | The new executive must adopt my views — I encourage validation over narratives. |\n| We write role expectations independently and reconcile them. | One conversation settles roles forever — we debrief disagreements as they occur. |\n| I give candid feedback early and address missteps before they compound. | I stop investing once things feel \"fine\" — I continue investing anyway. |\n| I steer them away from \"fixing\" what isn't broken. | Nothing may change — urgent problems are exactly where I want their attention. |\n\nIn practice, the arc is: **align on why it matters** (personal commitment, shared expectations with the CEO) → **transfer the mental framework** (first two weeks: data, urgent problems, budget norms, what works, team assessment, power map, processes, cultural norms) → **define roles explicitly** (written expectations, conflict norms, escalation path) → **establish the cadence** (rapport, weekly structured 1:1, joint forums) → **monitor progress** (first three to six months: early signals, candid feedback, public reinforcement). Where an executive assistant is in the picture, I treat that as a two-way partnership too — delegation with investment in their growth, not just offloading.\n\n![A five-node timeline labeled Align, Framework, Roles, Cadence, and Monitor, with brackets marking the first two weeks and months three to six.](assets/images/onboarding-peer-executives/onboarding-arc-timeline.jpeg)\n**Figure 3:** *The onboarding arc: align, transfer the framework, define roles, set the cadence, and keep monitoring into month six.*\n\n\n## Anti-Patterns\n\n- **Leaving it to HR.** Treating executive onboarding as a people-team deliverable. HR can schedule sessions; only a peer can transfer the power map, the honest team assessment, and the cultural quirks.\n- **The polite information vacuum.** Sharing only the flattering version of the company with a new peer — hiding the friction areas and performance history — and letting them discover the real state months later, at the cost of their credibility and my trustworthiness.\n- **Implicit role expectations.** Assuming we both \"obviously\" know where Product ends and Engineering begins, then discovering the overlap in front of the executive team during the first contentious decision.\n- **Ignoring red flags.** Watching a new peer stay inactive on key issues, rip up what's working, or replay their old company's playbook — and saying nothing because it feels premature to intervene. Early candid feedback is the kind thing, not the harsh thing.\n- **Declaring victory at \"fine\".** Winding down the investment after month one because nothing is visibly wrong. Mediocre-but-pleasant lingers precisely because \"fine\" is where scrutiny stops.\n\n## Related Records\n\n- [First 90 Days](first-90-days.html) — the same handshake from the other side: how I ramp when I am the incoming executive.\n- [Working with Your CEO, Peers, and Engineering](working-with-your-ceo-peers-and-engineering.html) — the steady-state peer and CEO relationship this onboarding window sets up.\n- [Gelling Your Engineering Leadership Team](gelling-your-engineering-leadership-team.html) — the team-level version of turning individual executives into a functioning group.\n- [Engineering Onboarding](engineering-onboarding.html) — why executive onboarding differs from the engineer onboarding my own organization runs.\n- [Inspected Trust](inspected-trust.html) — early observation and candid feedback as the trust-building move, not the trust-violating one.\n\n## Scope and Revisiting\n\nThis principle applies whenever a new peer executive joins a company where I hold an executive role — and, with light adaptation, when a new senior leader joins my own organization. I revisit it after each onboarding I run: what the framework briefing missed, which expectations still ended up implicit, and whether the monitoring window was long enough.\n\n## Authoritative References\n\n- Will Larson, *The Engineering Executive's Primer* (O'Reilly, 2024) — the \"Onboarding Peer Executives\" chapter this record's checklist distills; the principle above is my operating commitment to it.\n- Will Larson, [Onboarding peer executives](https://lethain.com/onboarding-peer-executives/) — the freely available companion essay.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle, grouped the way the onboarding unfolds — from commitment, through the mental-framework briefing, to the ongoing cadence. The Article tab carries the rationale, implications, and anti-patterns.*\n\n### Align on Why Onboarding Matters\n\n- [ ] Acknowledge that onboarding executives is ad hoc and often neglected.\n- [ ] Commit personally to helping the new executive succeed.\n- [ ] Align with the CEO (if possible) on shared expectations for the new hire.\n- [ ] Clarify what success looks like in the first 90 days.\n\n### Understand the Difference (Executive vs. Engineer Onboarding)\n\n- [ ] Help them understand the company landscape (business, team, product, process).\n- [ ] Emphasize current critical issues and priorities.\n- [ ] Encourage broad learning before big changes.\n- [ ] Watch for red flags:\n  - [ ] Inaction on key issues.\n  - [ ] Changing what's already working.\n  - [ ] Reverting to old-company playbooks prematurely.\n\n### Share Your Mental Framework (First 2 Weeks Priority)\n\n**Data & Reality**\n\n- [ ] Show where to find real data (dashboards, board reports, analytics).\n- [ ] Encourage validation over narratives.\n\n**Immediate Focus**\n\n- [ ] Clarify the top 2–3 urgent problems.\n- [ ] Explain current friction areas across teams.\n\n**Budget & Headcount**\n\n- [ ] Discuss norms around budget and hiring requests.\n- [ ] Explain tradeoffs and historical context.\n\n**What's Working Well**\n\n- [ ] Identify strong processes and high-functioning areas.\n- [ ] Steer them away from \"fixing\" what isn't broken.\n\n**Honest Team Assessment**\n\n- [ ] Provide transparent strengths and gaps on their team.\n- [ ] Clarify the historical context behind performance issues.\n\n**Power & Influence Map**\n\n- [ ] Introduce long-tenured employees.\n- [ ] Identify unofficial influencers.\n- [ ] Clarify implicit power structures.\n\n**Company Processes**\n\n- [ ] Walk through planning cadence (quarterly/annual).\n- [ ] Explain the budgeting & headcount process.\n- [ ] Review performance management systems.\n- [ ] Outline recurring business reviews.\n\n**Surprises & Cultural Norms**\n\n- [ ] Flag unique company quirks.\n- [ ] Explain documentation expectations.\n- [ ] Prepare them for recurring rituals.\n\n### Define Roles Explicitly\n\n**Role Clarity**\n\n- [ ] Independently write expectations of each other's roles.\n- [ ] Compare and discuss differences.\n- [ ] Resolve accidental misalignments.\n\n**Handling Conflict**\n\n- [ ] Agree on how to manage public disagreement.\n- [ ] Define when to resolve privately.\n\n**Escalation Path**\n\n- [ ] Explicitly define the escalation process.\n- [ ] Agree on when/how to involve the CEO.\n- [ ] Remove ambiguity around decision ownership.\n\n### Establish Ongoing Partnership Cadence\n\n**Relationship Investment**\n\n- [ ] Schedule non-transactional time (lunch/dinner).\n- [ ] Build personal rapport.\n\n**Structured 1:1**\n\n- [ ] Schedule weekly 60-min structured 1:1.\n- [ ] Use the shared doc for the agenda.\n- [ ] Review 2–3 meaningful issues deeply.\n\n**Joint Forums**\n\n- [ ] Identify recurring meetings where your teams intersect.\n- [ ] Attend key planning/review sessions together.\n- [ ] Debrief disagreements afterward.\n\n### Executive Assistant Partnership (If Applicable)\n\n**Hiring & Timing**\n\n- [ ] Evaluate when an EA is needed.\n- [ ] Align on the scope of support.\n\n**Delegation**\n\n- [ ] Offload calendar management.\n- [ ] Delegate communications drafting.\n- [ ] Delegate recurring meeting coordination.\n- [ ] Use EA support for offsites & all-hands.\n\n**Partnership Mindset**\n\n- [ ] Treat the EA relationship as a two-way partnership.\n- [ ] Support their growth and success.\n\n### Monitor Progress (First 3–6 Months)\n\n- [ ] Observe early signals of effectiveness.\n- [ ] Provide candid feedback early.\n- [ ] Reinforce strengths publicly.\n- [ ] Address missteps before they compound.\n- [ ] Continue investing even if things feel \"fine\".\n\n### Guiding Principles\n\n- [ ] Go broad before going deep.\n- [ ] Make implicit expectations explicit.\n- [ ] Prevent mistakes rather than recover from them.\n- [ ] Build trust through repeated, small commitments.\n- Reminder: mediocre but pleasant executives can linger — early support matters.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why a new peer executive's onboarding is my job, not HR's — and what I actually hand them.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: a new executive stands at an empty desk with just a laptop and a crowded calendar while Vera tells Leo there is no onboarding program.](assets/images/onboarding-peer-executives/comic-01-laptop-and-a-calendar.jpeg)\n**Panel 1:** *The hook: executives get a laptop and a calendar, not an onboarding.*\n\n![Comic panel: a new executive faces a large decision lever in fog while others hold thick folders, and Vera notes she has the biggest decisions with the least context.](assets/images/onboarding-peer-executives/comic-02-big-calls-least-context.jpeg)\n**Panel 2:** *The problem: consequential decisions arrive before context does.*\n\n![Comic panel: a colleague hands the new executive a glossy brochure while a drawer labeled Real issues is pushed shut, and Vera warns about the polite vacuum.](assets/images/onboarding-peer-executives/comic-03-the-polite-vacuum.jpeg)\n**Panel 3:** *Anti-pattern: the polite information vacuum costs the newcomer their credibility.*\n\n![Comic panel: Vera shakes the new executive's hand and declares that the onboarding is her job.](assets/images/onboarding-peer-executives/comic-04-my-job-not-hrs.jpeg)\n**Panel 4:** *The principle: a new peer's onboarding is my job, not HR's.*\n\n![Comic panel: Vera unrolls a hand-drawn map with small icons for data, problems, power, and quirks, telling the new executive it is a map to check, not doctrine.](assets/images/onboarding-peer-executives/comic-05-the-map-not-doctrine.jpeg)\n**Panel 5:** *First two weeks: hand over the mental framework and encourage validation.*\n\n![Comic panel: Vera and the new executive write role expectations separately, then hold up two sheets whose one mismatched section is highlighted.](assets/images/onboarding-peer-executives/comic-06-write-then-compare.jpeg)\n**Panel 6:** *Make it explicit: independent write-ups surface misalignments while they are cheap.*\n\n![Comic panel: over coffee, Vera points at a small warning flag on a chart and calls early candid feedback the kind thing.](assets/images/onboarding-peer-executives/comic-07-early-candid-feedback.jpeg)\n**Panel 7:** *Keep the cadence — and name the red flags early, before they compound.*\n\n![Comic panel: Vera closes her notebook beside Leo while the new executive confidently leads a meeting behind them.](assets/images/onboarding-peer-executives/comic-08-cheapest-prevention.jpeg)\n**Panel 8:** *Closer: early, deliberate support is the cheapest prevention available.*\n"}]}]}</script>

                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
