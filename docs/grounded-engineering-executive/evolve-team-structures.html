<script id="data" type="application/json">{"meta": {"id": "EXEC-EVOLVE-TEAM-STRUCTURES", "status": "draft:gray", "title": "Evolve Team Structures", "date": "2026-07-26", "author": "Željko Obrenović", "permalink": "evolve-team-structures", "timetoread": "8 min", "excerpt": "I treat the team topology as a living design, not a finished org chart. Teams are my organization's sensors, and interaction friction is signal — so I evolve structures on defined triggers, such as software outgrowing its team, delivery cadence slowing, or too many teams waiting on one. Collaboration is temporary and purposeful; once a boundary is stable, it matures into a service. And I review boundaries every few months — not every week, and not never.", "tags": "engineering executive, team topologies, organizational sensing, evolution, triggers", "icon": "assets/icons/evolve-team-structures.png", "logo": "assets/images/evolve-team-structures/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "team topologies", "organizational sensing", "evolution", "triggers"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I treat the team topology as a living design: teams are the organization's sensors, interaction friction is signal, and I evolve structures on defined triggers — software outgrowing its team, slowing delivery cadence, too much work waiting on one team — rather than on a reorg calendar. Collaboration exists for discovery and learning, is timeboxed with exit criteria, and matures into X-as-a-Service once the boundary is stable. I review team boundaries every few months, not every day or week — and not never.\n\n## Statement\n\nMy operating model for evolving team structures has five parts:\n\n- **Map before moving.** I keep a current map of every team's topology and every team-to-team interaction, with the mode labeled — collaboration, X-as-a-Service, or facilitating — and I check that each mode matches the work being done right now.\n- **Treat collaboration as temporary and purposeful.** Every ongoing collaboration must be doing valuable discovery, capability building, or deficiency-fixing — timeboxed, with exit criteria toward a clearer service boundary.\n- **Evolve on triggers, not on a calendar.** Three trigger families tell me the topology needs to change: software has grown too large for one team, delivery cadence is slowing, and many business services rely on many lower-level services.\n- **Use teams as sensors.** Teams and their interactions are my richest signal about organizational health; I read them alongside operational data, customer signals, and delivery metrics, looking for weak signals before they become structural problems.\n- **Review regularly, at the right frequency.** Team boundaries get reviewed every few months — often enough that structure tracks reality, rarely enough that teams can gel and deliver between reviews.\n\n![Three side-by-side snapshots of the same team topology at different times, with team shapes and connections gradually changing.](assets/images/evolve-team-structures/living-topology-snapshots.jpeg)\n**Figure 1:** *A living design: the same teams over three snapshots — shapes, groupings, and interaction lines evolve as the work does.*\n\n## How to Read This\n\nThis is an **appendix record**: unlike the core records in this journal, grounded in Will Larson's *The Engineering Executive's Primer*, this one is grounded in Matthew Skelton and Manuel Pais's *Team Topologies* — read here through an executive lens, complementing the Primer-grounded records. The sibling records [Static Team Topologies](static-team-topologies.html) and [Team Interaction Modes](team-interaction-modes.html) define the vocabulary of team types and interaction modes; this record is about changing the arrangement over time. The working checklist — all ten sections, triggers included — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**A topology that cannot change is already wrong.** The org chart that perfectly fits today's product, technology, and market stops fitting the moment any of the three moves — and all three move constantly. The choice is not between a stable structure and a changing one; it is between deliberate evolution and silent decay. So I never declare the topology finished. I declare it *current*, and I keep the map that makes the next change legible.\n\n**Collaboration is a mode of discovery, not a way of life.** Close collaboration between two teams is expensive — it blurs boundaries, raises cognitive load, and couples delivery. That price is worth paying for discovery, capability building, or fixing a real deficiency; it is waste when it quietly substitutes for better APIs, platforms, or ownership. So every collaboration has a stated purpose, a timebox, and exit criteria. The healthy lifecycle runs from close collaboration during discovery, to limited collaboration as the interface emerges, to X-as-a-Service once the boundary is stable and predictable delivery matters most — with the providing team owning the reliability and usability of what it now serves.\n\n![Three-stage arc showing two overlapping teams gradually separating into a clean provider-consumer service relationship.](assets/images/evolve-team-structures/collaboration-to-service-arc.jpeg)\n**Figure 2:** *The lifecycle: close collaboration for discovery, limited collaboration as the interface emerges, X-as-a-Service once the boundary is stable.*\n\n**Defined triggers beat both restlessness and neglect.** Reorganizing on a calendar churns teams that were working; never reorganizing lets structure strangle delivery. Triggers resolve the dilemma. When software has grown too large for one team, the symptoms show: other teams waiting on one team for changes, the same changes landing on the same few people, bottlenecks forming around \"who knows what.\" When delivery cadence is slowing, releases feel slower, throughput trends down year over year, work in progress rises, and changes wait on another team's action. When many business services rely on many lower-level services, stream-aligned teams lose end-to-end visibility, integration slows flow, and nobody can diagnose where problems occur. Each trigger names a structural response — split the team, remove the dependency, platformize the lower-level services — so the reorg conversation starts from evidence, not appetite.\n\n![Instrument panel with three gauges representing software outgrowing a team, slowing delivery cadence, and teams queuing behind one team.](assets/images/evolve-team-structures/evolution-trigger-gauges.jpeg)\n**Figure 3:** *Triggers, not a calendar: software too big for one team, cadence slowing, work queuing behind a single team — when a gauge enters the warning zone, the topology changes.*\n\n**Platforms are how I buy back flow.** When many teams depend on the same lower-level services, the fix is rarely more coordination — it is a platform: consistent developer experience, self-service access, documentation, service-level expectations, and real telemetry. Where the lower-level services are fragmented, an \"outer platform\" wrapper can present a coherent surface. The test is simple: the platform must be easier to consume than building a custom one-off.\n\n**Sensing is the organ that makes evolution possible.** An organization that cannot sense cannot adapt — it just lurches. My sensors are the teams themselves: I regularly ask whether interaction modes still fit, whether collaboration is still effective, whether work flows smoothly, whether the platform provides what consumers actually need, and whether promises between teams are still realistic. Operations is a first-class sensory input, which is why I do not split \"new work\" teams from maintenance teams in ways that break learning: teams own both new services and existing systems where practical, production telemetry feeds design, and operational pain stays visible to the people who can remove it.\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| The topology is a living design; evolution is expected. | Constant restructuring is healthy — permanent flux is a failure mode, not agility. |\n| Collaboration is purposeful, timeboxed, and has exit criteria. | Collaboration is bad — it is the right mode for discovery and learning. |\n| Structures change when a defined trigger fires. | Structures change when an executive gets restless or a calendar says so. |\n| Teams and their friction are the organization's sensors. | Sensing replaces judgment — signals inform the decision; they do not make it. |\n| Stable boundaries mature into X-as-a-Service. | Every interaction should be a service contract from day one. |\n| Boundaries are reviewed every few months. | Boundaries are renegotiated weekly — teams need time to gel and deliver. |\n\nConcretely: every proposed topology change must name the trigger that fired and the symptoms behind it. Every collaboration older than its timebox gets reassessed — continue, create a platform or service model, reorganize ownership, or split or merge teams. And interaction modes are explicit and written down, so people understand why different teams work together differently at the same time.\n\n## Anti-Patterns\n\n- **The laminated org chart.** Treating the topology as finished — until the structure that once served delivery quietly starts strangling it.\n- **The reorg calendar.** Restructuring on a schedule or a whim, paying full re-gelling costs with no trigger and no evidence.\n- **Permanent collaboration.** Two teams \"collaborating\" for years because nobody defined exit criteria — a standing substitute for the API, platform, or ownership change actually needed.\n- **The bottleneck nobody names.** Every change queuing behind one team or one expert while the organization treats the wait as weather rather than as a trigger.\n- **Sensing without acting.** Collecting metrics and feedback, seeing the weak signals, and filing them — sensing only counts if it can reshape structure.\n- **Build-vs-run separation.** Splitting new-work teams from maintenance teams so thoroughly that operational learning never reaches design decisions.\n- **Platform by decree.** Declaring a platform without self-service, documentation, or telemetry — harder to consume than the one-off it replaced.\n\n## Related Records\n\n- [Static Team Topologies](static-team-topologies.html) — appendix sibling defining the four fundamental team types this record evolves between.\n- [Team Interaction Modes](team-interaction-modes.html) — appendix sibling on the three interaction modes; this record governs when a mode should change.\n- [Organizational Design](organizational-design.html) — sizing and staffing the system; this record reshapes its boundaries and interactions.\n- [Inspected Trust](inspected-trust.html) — organizational sensing echoes inspection: trusting teams and still going to the work to see what is really happening.\n- [Engineering Strategy](engineering-strategy.html) — topology evolution is strategy made structural; triggers tell me when the current structure no longer serves the strategy.\n\n## Scope and Revisiting\n\nThis principle governs how I change team boundaries, interaction modes, and platform investments over time. I revisit it at every boundary review (every few months), whenever a trigger fires between reviews, and whenever I catch a collaboration outliving its purpose. The final health check in the Checklist tab is the standing test: clear purposes, explicit interactions, intentional collaboration, platforms that reduce cognitive load, operations feeding development, measured and improving flow — and an organization that can sense, adapt, and reshape itself as conditions change.\n\n## Authoritative References\n\n- Matthew Skelton & Manuel Pais, *Team Topologies: Organizing Business and Technology Teams for Fast Flow* (IT Revolution Press, 2019) — the evolution, sensing, and platform chapters this record's checklist distills.\n- The authors maintain further materials, training, and case studies at [teamtopologies.com](https://teamtopologies.com/).\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "5 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle. The Article tab carries the rationale, implications, and anti-patterns.*\n\n## Map the Current Team System\n\n- [ ] Identify each team's primary topology: stream-aligned, platform, enabling, or complicated-subsystem.\n- [ ] Map the key team-to-team interactions.\n- [ ] Label each interaction mode: collaboration, X-as-a-Service, or facilitating.\n- [ ] Check whether each interaction mode matches the work being done right now.\n- [ ] Identify unclear ownership, blurred boundaries, or hidden dependencies.\n\n## Decide How Much Collaboration Is Needed\n\n- [ ] Confirm that every ongoing collaboration has a clear purpose.\n- [ ] Classify the purpose of collaboration as one of:\n  - [ ] Valuable discovery\n  - [ ] Valuable capability building\n  - [ ] Valuable deficiency-fixing\n- [ ] Remove or reduce collaboration that is not clearly valuable.\n- [ ] Timebox collaboration where possible.\n- [ ] Define exit criteria for moving from collaboration to a clearer service boundary.\n- [ ] Watch for collaboration becoming a permanent substitute for better APIs, platforms, or ownership.\n\n## Move Toward X-as-a-Service When Appropriate\n\n- [ ] Identify services, platforms, or capabilities that other teams should consume with low effort.\n- [ ] Define clear APIs, interfaces, documentation, and support expectations.\n- [ ] Reduce the cognitive load required for consuming teams.\n- [ ] Ensure the providing team owns the reliability and usability of the service.\n- [ ] Move from close collaboration to limited collaboration once discovery is complete.\n- [ ] Move to X-as-a-Service when the boundary is stable and predictable delivery matters most.\n\n## Use Collaboration for Learning and Adoption\n\n- [ ] Use temporary collaboration when one team has valuable practices another team needs.\n- [ ] Pair teams to accelerate adoption of new tools, testing practices, automation, or platform capabilities.\n- [ ] Use collaboration to expose hidden constraints, such as hardware limits, testing gaps, or operational complexity.\n- [ ] Reassess after the learning period to decide whether to:\n  - [ ] Continue collaboration\n  - [ ] Create a platform/service model\n  - [ ] Reorganize ownership\n  - [ ] Split or merge teams\n\n## Watch for Triggers That Team Topologies Need to Evolve\n\n### Software has grown too large for one team\n\n- [ ] The product or system has grown beyond what one team can understand well.\n- [ ] Other teams wait on one team for changes.\n- [ ] Specific changes are repeatedly assigned to the same people.\n- [ ] Team members complain about missing or poor documentation.\n- [ ] Bottlenecks are forming around \"who knows what.\"\n\n### Delivery cadence is slowing\n\n- [ ] Releases feel slower than they used to.\n- [ ] Velocity or throughput is trending downward compared with the previous year.\n- [ ] Teams complain that the delivery process has become more complex.\n- [ ] Work in progress is increasing.\n- [ ] Changes are waiting for another team's action.\n- [ ] New dependencies, handoffs, or silos are reducing autonomy.\n\n### Many business services rely on many lower-level services\n\n- [ ] Stream-aligned teams lack end-to-end visibility.\n- [ ] Integration across subsystems is slowing flow.\n- [ ] Reusing shared services or subsystems is becoming harder.\n- [ ] Teams cannot easily diagnose where problems occur.\n- [ ] Lower-level systems lack consistent telemetry, logging, or correlation IDs.\n\n## Platformize Where It Improves Flow\n\n- [ ] Identify lower-level services or APIs that many teams depend on.\n- [ ] Decide whether these should become a platform capability.\n- [ ] Provide a consistent developer experience for consuming teams.\n- [ ] Add documentation, self-service access, health checks, test harnesses, and service-level expectations.\n- [ ] Create useful telemetry: logs, metrics, dashboards, correlation IDs, and tracing.\n- [ ] Consider an \"outer platform\" or wrapper when lower-level services are inconsistent or fragmented.\n- [ ] Make the platform easier to consume than building custom one-off solutions.\n\n## Build Organizational Sensing\n\n- [ ] Treat teams and team interactions as signals about organizational health.\n- [ ] Regularly ask:\n  - [ ] Are users behaving differently than we expected?\n  - [ ] Do we need to change team interaction modes?\n  - [ ] Should we still build this in-house, or use an external provider?\n  - [ ] Is collaboration between teams still effective?\n  - [ ] Should a team move toward X-as-a-Service?\n  - [ ] Is work flowing smoothly through each team?\n  - [ ] Does the platform provide what consuming teams actually need?\n  - [ ] Are promises between teams still realistic and achievable?\n- [ ] Use operational data, customer signals, team feedback, and delivery metrics together.\n- [ ] Look for weak signals before they become major structural problems.\n\n## Treat Operations as Feedback to Development\n\n- [ ] Ensure operational experience feeds directly into development decisions.\n- [ ] Avoid separating \"new work\" teams from \"maintenance\" or BAU teams in a way that breaks learning.\n- [ ] Give teams responsibility for both new services and existing systems where practical.\n- [ ] Use production telemetry to improve design, reliability, usability, and security.\n- [ ] Staff operations or support work with experienced people who can recognize and explain system issues.\n- [ ] Make operational pain visible to product and engineering teams.\n\n## Review and Evolve Regularly\n\n- [ ] Review team boundaries every few months, not every day or week.\n- [ ] Check whether current topology still fits product, technology, and market conditions.\n- [ ] Expect different parts of the organization to require different interaction modes simultaneously.\n- [ ] Allow some teams to be in discovery while others consume services predictably.\n- [ ] Make interaction modes explicit so people understand why teams work together differently.\n- [ ] Adjust structures, APIs, platforms, and responsibilities as the organization learns.\n\n## Final Health Check\n\n- [ ] Teams have clear purposes.\n- [ ] Team interactions are explicit.\n- [ ] Collaboration is intentional, valuable, and limited where possible.\n- [ ] Platforms reduce cognitive load for stream-aligned teams.\n- [ ] Operations provide useful sensory input to development.\n- [ ] Delivery flow is measured and improving.\n- [ ] The organization can sense, adapt, and reshape itself as conditions change.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "The org chart is never done — why team topologies must keep evolving, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Leo laminates a large org chart while Vera watches skeptically.](assets/images/evolve-team-structures/comic-01-laminated-org-chart.jpeg)\n**Panel 1:** *The hook: the org chart declared finished — laminated, even.*\n**Panel 1:** *The hook: the org chart declared finished — laminated, even.*\n\n![A stressed Leo looks at the same org chart now tangled in lines that slow delivery.](assets/images/evolve-team-structures/comic-02-structure-strangles-delivery.jpeg)\n**Panel 2:** *The problem: a year on, the same structure is strangling delivery.*\n**Panel 2:** *The problem: a year on, the same structure is strangling delivery.*\n\n![Vera redraws the org chart as three evolving topology snapshots on a whiteboard.](assets/images/evolve-team-structures/comic-03-living-design.jpeg)\n**Panel 3:** *The principle: the topology is a living design, not a finished artifact.*\n**Panel 3:** *The principle: the topology is a living design, not a finished artifact.*\n\n![Diagram of teams with antenna icons, one connection sparking with friction marks.](assets/images/evolve-team-structures/comic-04-teams-as-sensors.jpeg)\n**Panel 4:** *The mechanism: teams are the organization's sensors — friction between them is signal.*\n**Panel 4:** *The mechanism: teams are the organization's sensors — friction between them is signal.*\n\n![Vera points at three trigger gauges while waving away Leo's reorg calendar.](assets/images/evolve-team-structures/comic-05-triggers-not-calendar.jpeg)\n**Panel 5:** *The discipline: defined triggers — software too big, cadence slowing, queues behind one team — not a reorg calendar.*\n**Panel 5:** *The discipline: defined triggers — software too big, cadence slowing, queues behind one team — not a reorg calendar.*\n\n![Whiteboard arc showing two overlapping teams gradually separating into a clean service relationship.](assets/images/evolve-team-structures/comic-06-collaboration-matures.jpeg)\n**Panel 6:** *The lifecycle: collaborate to discover, then let stable boundaries mature into X-as-a-Service.*\n**Panel 6:** *The lifecycle: collaborate to discover, then let stable boundaries mature into X-as-a-Service.*\n\n![Vera and Leo review a topology map at a table, moving one team shape while others stay put.](assets/images/evolve-team-structures/comic-07-regular-review.jpeg)\n**Panel 7:** *The rhythm: boundaries reviewed every few months — evidence moves one piece, the rest keep delivering.*\n**Panel 7:** *The rhythm: boundaries reviewed every few months — evidence moves one piece, the rest keep delivering.*\n\n![Leo pins an erasable whiteboard org map on the wall as Vera smiles beside him.](assets/images/evolve-team-structures/comic-08-organization-that-adapts.jpeg)\n**Panel 8:** *The closer: never done — current. An organization that can sense, adapt, and reshape itself.*\n**Panel 8:** *The closer: never done — current. An organization that can sense, adapt, and reshape itself.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
