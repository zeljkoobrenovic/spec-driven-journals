<script id="data" type="application/json">{"meta": {"id": "EXEC-NEXT-GEN-OPERATING-MODEL", "status": "draft:gray", "title": "The Next-Generation Operating Model", "date": "2026-07-26", "author": "Željko Obrenović", "permalink": "next-gen-operating-model", "timetoread": "8 min", "excerpt": "I run the organization on one small, explicit operating model: four team types, three interaction modes, boundaries sized to cognitive load, Conway's law used on purpose, and continuous sensing. This record assembles the pieces the other Team Topologies records develop, and gives the sequence I use to get started: team first, then streams, then the thinnest viable platform, then capability gaps, then sensing.", "tags": "engineering executive, team topologies, operating model, fast flow, synthesis", "icon": "assets/icons/next-gen-operating-model.png", "logo": "assets/images/next-gen-operating-model/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "team topologies", "operating model", "fast flow", "synthesis"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I run the organization on a small, explicit operating model: four team types, three interaction modes, team boundaries sized to cognitive load, Conway's law used deliberately, and continuous organizational sensing — because a structure everyone can name is one everyone can reason about, question, and evolve. The model is not a target org chart; it is a vocabulary plus a feedback loop, and the feedback loop is the part that keeps it honest.\n\n## Statement\n\nThe pieces of my operating model are simple, and there are deliberately few of them:\n\n- **Four team types, no more.** Stream-aligned teams carry the main flow of business change; platform teams support them; enabling teams help others learn; complicated-subsystem teams exist only where specialist knowledge truly demands them. Every team maps to one type, and every type has a clear reason to exist.\n- **Three interaction modes, made explicit.** Collaboration for joint discovery, X-as-a-Service for consuming what another team provides, facilitating for helping a team learn. No ad hoc, unnamed interaction patterns — and the modes in use are reviewed, because the right mode changes as work matures.\n- **Team-first boundaries sized to cognitive load.** The team is the fundamental delivery unit. Subsystems are limited to what one team can understand, own, and operate; architecture that overwhelms a team is a design defect, not a staffing problem.\n- **Conway's law used on purpose.** Team structure is my first architectural decision. I align teams with the architecture I want, reduce unnecessary inter-team communication, and make ownership of code, services, and APIs unambiguous.\n- **Continuous sensing.** The topology is dynamic, not fixed. Teams are the organization's sensors; I keep asking whether boundaries, types, and modes still fit — and change them when they don't.\n\n![One canvas showing four team types linked by three interaction-mode connectors, enclosed by a circular sensing feedback loop.](assets/images/next-gen-operating-model/operating-model-canvas.jpeg)\n**Figure 1:** *The whole model on one canvas: four team types, three interaction modes, and the sensing loop that keeps the topology alive.*\n\n## How to Read This\n\nThis is an **appendix record**: unlike the core records in this journal, grounded in Will Larson's *The Engineering Executive's Primer*, this one is grounded in Matthew Skelton and Manuel Pais's *Team Topologies* — read here through an executive lens, complementing the Primer-grounded records. It is also the **synthesis** of the Team Topologies appendix: the sibling records develop the individual pieces — the team types, the interaction modes, Conway's law, the org-chart critique — while this one assembles them into the operating model I actually run. Read it first, as the map, or last, as the capstone. The working checklist — all twelve sections, from diagnosis to the final readiness check — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**A model everyone can name beats a structure only I understand.** Most organizations run on an implicit design: the org chart says one thing, work flows another way, and every reorg lands as a surprise. When the model is four types and three modes, my leaders can hold the whole thing in their heads. They can say \"this collaboration should have become X-as-a-Service by now\" — and be understood. Shared vocabulary turns organizational design from an executive privilege into an organizational capability.\n\n**The pieces only work together.** Team types without interaction modes decay into ambiguous relationships; interaction modes without cognitive-load limits just label the overload; Conway's law without sensing freezes yesterday's architecture into tomorrow's constraint. The book's real claim — and mine — is that this is one system, so I refuse to adopt it piecemeal.\n\n**Sensing is what makes it \"next-generation\".** A fixed topology, however well designed, is a snapshot. What distinguishes this model from a conventional reorg is the built-in expectation of change: collaboration is expected during discovery, stable patterns get pushed into platforms and tooling, boundaries get reviewed as technology and product needs shift. Structure becomes a continuous activity, not an event.\n\n**The conditions matter as much as the shapes.** The model fails in a hostile habitat: blame-driven incident reviews, CapEx/OpEx splits that fragment teams, large-batch project budgeting, training budgets that stop at individuals. Part of my job is clearing that ground — a culture where people speak up, funding that follows long-lived teams, and a clear, explained business vision.\n\n![A five-step path with markers for team, streams, platform, capabilities, and sensing, the last marker drawn as a loop.](assets/images/next-gen-operating-model/getting-started-path.jpeg)\n**Figure 2:** *Getting started is a sequence: start with the team, find the streams, thin the platform, close capability gaps, then keep sensing — forever.*\n\n## What This Means in Practice\n\nAdopting the model is a sequence, not a menu. I get started in five moves:\n\n1. **Start with the team.** Before drawing any boxes, I make the team the unit: clear purpose, real ownership of its software, reasonable autonomy, and a cognitive load it can actually carry — with documentation, onboarding, and support inside the team's responsibility.\n2. **Identify the streams of change.** I find where business change actually flows — customer tasks, products, purchasing journeys, regional markets, market segments — and align stream-aligned teams to those flows, not to internal departments. Each stream has to reflect real change pressure, or it is a department wearing a costume.\n3. **Identify the thinnest viable platform.** I ask what minimum the stream-aligned teams need to move fast, and build just that: big enough to encapsulate complexity and support reliable flow, small enough that it never becomes its own empire.\n4. **Close capability gaps.** The model exposes what's missing: team coaching, mentoring, service management, documentation, continuous delivery, pairing and review practices, blameless incident reviews. I fund these as supporting capabilities, because topology without practices is a diagram.\n5. **Practice sensing.** I teach the principles, practice the interaction modes deliberately, explain why some teams work closely and others stay apart, and review boundaries on a rhythm. The final readiness check is never \"done\" — it is the recurring question.\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Four team types and three modes are the whole vocabulary. | Every organization must look identical — the vocabulary is fixed, the topology is yours. |\n| Adopt the model as one system, in sequence. | Adopt it in one big-bang reorg — start with the team, not the announcement. |\n| The platform is the thinnest viable one. | Platforms are bad — a platform that stays \"just big enough\" is a force multiplier. |\n| The topology is dynamic; expect it to change. | Change it constantly — sensing triggers deliberate evolution, not permanent churn. |\n| Culture, funding, and practices are part of the model. | Structure alone will fix delivery — shapes without conditions are theater. |\n| Everyone should be able to name the model. | Everyone must read the book — the vocabulary travels in how we explain decisions. |\n\n## Anti-Patterns\n\n- **Stickers on the old org.** Renaming departments \"stream-aligned\" and \"platform\" while funding, interactions, and boundaries stay exactly as they were.\n- **The big-bang topology reorg.** Announcing the target structure in one move, skipping the sequence — and the explanation — so teams experience it as one more disruptive reorg.\n- **The maximal platform.** Building the platform ahead of demand until it becomes a gatekeeping empire the streams route around.\n- **Frozen topology.** Designing a beautiful structure once and defending it — no sensing, no boundary reviews, collaborations that never mature into X-as-a-Service.\n- **Vocabulary without conditions.** Preaching team types while keeping blame-based reviews, project deadlines, and CapEx/OpEx splits that shred long-lived teams.\n- **A fifth team type for every exception.** Inventing new team types instead of asking which of the four the work truly belongs to — the constraint is the value.\n\n![Split image: a rigid org-chart tree with tangled communication lines beside a flow-driven layout of teams streaming toward the customer over a platform.](assets/images/next-gen-operating-model/chart-vs-flow.jpeg)\n**Figure 3:** *Before and after: the org chart describes reporting lines; the operating model describes how change actually flows.*\n\n## Related Records\n\n- [The Four Fundamental Team Topologies](four-fundamental-team-topologies.html) — the four team types this model assembles.\n- [Team Interaction Modes](team-interaction-modes.html) — the three modes that make the connections explicit.\n- [Conway's Law](conways-law.html) — why team structure is the first architectural decision.\n- [The Problem with Org Charts](org-chart-problems.html) — the diagnosis this model answers.\n- [Engineering Strategy](engineering-strategy.html) — the strategy this operating model exists to serve.\n- [Measuring Engineering Organizations](measuring-engineering-organizations.html) — how I check that the model is actually producing flow.\n\n## Scope and Revisiting\n\nThis principle governs how I structure the whole engineering organization and how I sequence its evolution. I revisit it whenever a new stream of change appears or an old one dries up, whenever the platform's size comes into question, and whenever I catch an interaction that no one can name. The sensing section self-enforces: if the topology has not changed in a year, I treat that as a finding, not as stability.\n\n## Authoritative References\n\n- Matthew Skelton & Manuel Pais, *Team Topologies: Organizing Business and Technology Teams for Fast Flow* (IT Revolution Press, 2019) — the book whose concluding synthesis this record distills.\n- The authors maintain ongoing materials, training, and case studies at [teamtopologies.com](https://teamtopologies.com/).\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "5 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle. The Article tab carries the rationale, the getting-started sequence, and the anti-patterns.*\n\n## Diagnose Current Delivery Problems\n\n- [ ] Teams are not disengaged or overloaded.\n- [ ] Software delivery is not centered only on \"feature delivery.\"\n- [ ] Team boundaries are clear.\n- [ ] Reorganizations are neither frequent nor disruptive, nor poorly explained.\n- [ ] Conway's Law is understood and intentionally used.\n- [ ] Architectural choices are not accidental or driven by friction.\n- [ ] Teams are not isolated in ways that prevent effective scaling.\n- [ ] Cognitive load is visible and actively managed.\n\n## Start with Team-First Thinking\n\n- [ ] Treat the team as the fundamental delivery unit.\n- [ ] Ensure each team has a clear purpose and mission.\n- [ ] Give teams reasonable autonomy.\n- [ ] Make sure teams effectively own their part of the software.\n- [ ] Design work so teams can focus on user needs.\n- [ ] Reduce unnecessary cognitive load.\n- [ ] Ensure teams can consume and provide software or information to other teams.\n- [ ] Include documentation, onboarding, support, and communication in the team's responsibility.\n\n## Choose the Right Team Types\n\n- [ ] Identify **stream-aligned teams** for the main flow of business change.\n- [ ] Identify **platform teams** to support stream-aligned teams.\n- [ ] Use **enabling teams** to help other teams learn or adopt new practices.\n- [ ] Use **complicated-subsystem teams** only where specialist knowledge is truly needed.\n- [ ] Avoid creating additional team types unless absolutely necessary.\n- [ ] Ensure every team type has a clear reason to exist.\n\n## Define Team Interaction Modes\n\n- [ ] Use **collaboration mode** when teams need to discover new approaches together.\n- [ ] Use **X-as-a-Service mode** when one team consumes a service, API, tool, or product from another.\n- [ ] Use **facilitating mode** when one team helps another adopt or learn something.\n- [ ] Avoid unclear or ad hoc interaction patterns.\n- [ ] Regularly review whether current interaction modes are still appropriate.\n\n## Apply Conway's Law Strategically\n\n- [ ] Align team structure with the desired software architecture.\n- [ ] Reduce unnecessary communication between teams.\n- [ ] Design teams so systems can be deployed independently.\n- [ ] Avoid large upfront architecture designs that ignore team communication patterns.\n- [ ] Make ownership of code, services, and APIs clear.\n- [ ] Use team boundaries to support modular, maintainable software.\n\n## Identify Streams of Change\n\n- [ ] Identify the main business flows where change happens.\n- [ ] Align stream-aligned teams to those flows.\n- [ ] Choose streams based on real business needs, not internal departments.\n- [ ] Consider possible stream types:\n  - [ ] Customer or citizen tasks\n  - [ ] Business products\n  - [ ] Online purchasing journeys\n  - [ ] Regional markets\n  - [ ] Market segments\n- [ ] Confirm that each stream reflects meaningful change pressure.\n\n## Build a Thinnest Viable Platform\n\n- [ ] Identify the minimum platform services needed by stream-aligned teams.\n- [ ] Keep the platform \"just big enough.\"\n- [ ] Avoid building a large platform before teams need it.\n- [ ] Provide clear documentation and onboarding.\n- [ ] Encapsulate underlying complexity.\n- [ ] Support reliable, fast flow of change.\n- [ ] Allow the platform to evolve over time.\n\n## Manage Cognitive Load and Architecture Size\n\n- [ ] Limit subsystem size to what one team can understand and own.\n- [ ] Avoid architecture that overwhelms teams.\n- [ ] Design software around team-sized boundaries.\n- [ ] Ensure teams can maintain, operate, and improve their systems.\n- [ ] Prioritize humane and sustainable architecture choices.\n\n## Build Supporting Capabilities\n\n- [ ] Provide team coaching.\n- [ ] Provide mentoring, especially for senior staff.\n- [ ] Improve service management practices.\n- [ ] Maintain strong documentation.\n- [ ] Invest in process improvement.\n- [ ] Support continuous delivery and operability.\n- [ ] Encourage pairing, mobbing, testing, and review practices.\n- [ ] Avoid blame-based incident reviews.\n\n## Create the Right Organizational Conditions\n\n- [ ] Build a healthy organizational culture.\n- [ ] Make it safe for people to speak up about problems.\n- [ ] Support professional development for individuals and teams.\n- [ ] Avoid harmful CapEx/OpEx funding splits.\n- [ ] Reduce project-driven deadlines and large-batch budgeting where possible.\n- [ ] Allocate training budgets to teams, not only individuals.\n- [ ] Provide clear business vision and priorities.\n- [ ] Explain why priorities were chosen.\n\n## Practice and Evolve\n\n- [ ] Teach teams the principles behind the new ways of working.\n- [ ] Practice different interaction modes deliberately.\n- [ ] Explain why some teams work closely together while others stay apart.\n- [ ] Review team boundaries as technology and product needs change.\n- [ ] Expect collaboration during discovery periods.\n- [ ] Push stable patterns into platforms and supporting tooling.\n- [ ] Treat team topology as dynamic, not fixed.\n- [ ] Continuously sense whether the organization needs to adapt.\n\n## Final Readiness Check\n\n- [ ] Teams are aligned to business streams.\n- [ ] Team types are limited and intentional.\n- [ ] Interaction modes are explicit.\n- [ ] Cognitive load is manageable.\n- [ ] Architecture supports team ownership.\n- [ ] Platform support is useful but not excessive.\n- [ ] Engineering practices support fast flow.\n- [ ] Culture, funding, and leadership support the model.\n- [ ] Teams understand how and why the organization is changing.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "All the pieces become one model — the operating system everyone can name, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Leo looks at a table of scattered puzzle pieces with team and diagram icons while Vera watches calmly.](assets/images/next-gen-operating-model/comic-01-scattered-pieces.jpeg)\n**Panel 1:** *The hook: team types, modes, Conway's law — all learned, all scattered.*\n\n![Vera draws four team shapes joined by three connector styles on a whiteboard as Leo watches.](assets/images/next-gen-operating-model/comic-02-one-model.jpeg)\n**Panel 2:** *The principle: assemble the pieces into one operating model everyone can name.*\n\n![Vera places one glowing puzzle piece depicting a small team at the center of the table.](assets/images/next-gen-operating-model/comic-03-start-with-team.jpeg)\n**Panel 3:** *Step one: the team is the unit — everything else is built around it.*\n\n![Leo traces a river on a map-like sketch of flowing streams marked with customer and product icons.](assets/images/next-gen-operating-model/comic-04-streams-of-change.jpeg)\n**Panel 4:** *Step two: find the real streams of change — and align teams to them, not to departments.*\n\n![A crossed-out bloated fortress platform next to a slim platform bar supporting small teams, marked with a tick.](assets/images/next-gen-operating-model/comic-05-thinnest-platform.jpeg)\n**Panel 5:** *Step three: the thinnest viable platform — it earns its size, it does not start with one.*\n\n![Vera draws a circular loop around the team diagram, small signal marks rising from the teams, as Leo takes notes.](assets/images/next-gen-operating-model/comic-06-sensing-loop.jpeg)\n**Panel 6:** *Step five: practice sensing — the topology is dynamic, not fixed.*\n\n![Two engineers discuss a small poster of the operating-model diagram while Vera and Leo walk past smiling.](assets/images/next-gen-operating-model/comic-07-model-everyone-names.jpeg)\n**Panel 7:** *The payoff: shared vocabulary turns organizational design into an organizational capability.*\n\n![Close-up of Vera's and Leo's hands placing the last piece of a puzzle showing the assembled operating model.](assets/images/next-gen-operating-model/comic-08-puzzle-assembled.jpeg)\n**Panel 8:** *The closer: the puzzle assembled — and never quite finished.*\n"}]}]}</script>

                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
