<script id="data" type="application/json">{"meta": {"id": "EXEC-FIRST-90-DAYS", "status": "draft:gray", "title": "First 90 Days", "date": "2026-07-25", "author": "Željko Obrenović", "permalink": "first-90-days", "timetoread": "9 min", "excerpt": "In my first 90 days as an engineering executive I prioritize learning over change. I work to understand the business, the people, the way work gets done, and the technology before modifying any of them — and I limit early changes to one or two high-leverage improvements. Moving slower than my instincts tell me is not caution for its own sake; it is the fastest route to durable impact.", "tags": "engineering executive, onboarding, first 90 days, learning, trust, leadership", "icon": "assets/icons/starting.png", "logo": "assets/images/first-90-days/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "onboarding", "first 90 days", "learning", "trust", "leadership"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: In my first 90 days I prioritize learning over change. I clarify what success looks like, understand how the business makes money, build relationships before I need them, learn how work actually gets done, and only then make a small number of high-leverage changes. I move slower than my instincts tell me — because early trust and an accurate map of the organization are worth more than early visible wins.\n\n## Statement\n\nWhen I step into an engineering executive role, my first quarter is a learning quarter. I treat the organization as a system I do not yet understand, and I refuse to modify systems I do not understand.\n\nConcretely, this means five commitments:\n\n- **Prioritize learning over early change.** The instinct to \"show impact fast\" produces shallow, often wrong, interventions. I resist it.\n- **Understand systems before modifying them.** Processes, org structures, and technical architectures all encode history. I learn the history before rewriting it.\n- **Focus on durable improvements, not visible quick wins.** If a change would not still look good in two years, it is not why I was hired.\n- **Build trust before conflict.** Every executive role eventually requires hard conflict. I build the relationship capital first, so conflict spends trust rather than destroying it.\n- **Move slower than my instincts tell me.** My instincts were calibrated in a different company. Until they are recalibrated here, deliberate slowness is a feature.\n\n## How to Read This\n\nThis record is a vision of how I operate, not a policy imposed on anyone else. The principle is the durable part; the working part — the concrete moves I expect myself to make in a new executive role — lives in the **Checklist** tab of this post. If you are my manager, this tells you what to expect from my first quarter. If you are on my team, this explains why I am asking questions instead of issuing directions.\n\n## Rationale\n\n**Early visible wins are a trap.** A new executive is under real pressure — from the CEO, from the team, from themselves — to demonstrate impact quickly. But the changes you can identify in week three are, almost by definition, the changes that are visible without context. The problems that matter are usually the ones the organization has already normalized, and you only find those by listening, shadowing, and reading. A quick win that later has to be unwound costs more trust than it bought.\n\n![Line chart comparing a quick-wins curve that spikes early then collapses with a learn-first curve that starts flat and rises steadily past it.](assets/images/first-90-days/quick-wins-vs-durable-trust.jpeg)\n**Figure 1:** *Two first-year trajectories: early visible wins that get unwound, versus deliberate learning that compounds.*\n\n\n**The organization is the best source of its own diagnosis.** Support tickets, customer meetings, incident reviews, on-call rotations, and skip-level 1:1s contain the real state of the company. Deploying a trivial change myself tells me more about developer experience than any survey. Shadowing interviews tells me more about the hiring bar than any funnel report. I go to the primary sources.\n\n![Hub-and-spoke map of seven primary sources, from support tickets to shadowed interviews, feeding a central node labeled 'Accurate picture'.](assets/images/first-90-days/primary-sources-map.jpeg)\n**Figure 2:** *The organization diagnoses itself: primary sources feed the accurate map that early changes must wait for.*\n\n\n**Trust is built in small, consistent deposits.** Attending existing forums before changing them, sharing what I am learning in weekly updates, closing loops with people who raised concerns — these are small acts, but they compound. When I later need to make an unpopular call, that reservoir is what makes it survivable. This connects directly to [Inspected Trust](inspected-trust.html): trust and verification are built together from day one.\n\n**Sustainability starts on day one.** Burnout cycles — mine or the team's — usually start with an unexamined pace set in the first months. I deliberately build external support (peer groups, coaching, self-care) and watch the team's pace from the start, per [Managing Priorities and Energy](managing-energy.html).\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Learn before changing. | Never change anything early — urgent, dire issues still get immediate attention. |\n| Limit early changes to 1–2 high-leverage improvements. | Postpone all judgment — I form and write down hypotheses from week one. |\n| Attend routine forums before changing them. | Accept every existing ritual forever. |\n| Avoid \"how we did it at my last job\". | Discard prior experience — I apply it once I understand the local context. |\n| Move slower than instinct. | Move slowly indefinitely — the learning quarter ends, and then I am accountable for direction. |\n\nIn practice, my first 90 days follow an arc: **clarify expectations** (written expectations from the CEO, measurable goals for the quarter) → **understand** (business model, people, execution systems, organizational health, technology) → **make limited changes** (one or two high-leverage improvements, often a weekly operational review) → **reflect and sustain** (write down what I am learning, build external support, protect the team's pace).\n\n![Four-segment 90-day timeline where the Understand phase is widest and the Limited changes phase is narrow with a badge reading 1-2.](assets/images/first-90-days/ninety-day-arc.jpeg)\n**Figure 3:** *The 90-day arc: understanding takes the widest share, and change stays deliberately limited.*\n\n\n## Anti-Patterns\n\n- **Quick-win theater.** Shipping a visible reorganization or process overhaul in month one to demonstrate decisiveness, before understanding why the current shape exists.\n- **\"At my last company…\"** Importing solutions from a previous context without checking whether the constraints match. Prior experience is a hypothesis generator, not an answer key.\n- **Disrupting without an alternative.** Removing a system — however flawed — before a working replacement exists.\n- **Judgment without context.** Concluding who is strong or weak, which teams work, which technology is bad, from second-hand narrative instead of direct observation.\n- **Skipping the business.** Diving into engineering internals without first understanding how the company makes money, where it spends it, and what must be true in 12 months.\n\n## Related Records\n\n- [Getting the Job](getting-the-job.html) — everything before day one: finding and evaluating the role this quarter begins.\n- [Engineering Strategy](engineering-strategy.html) — the implicit strategy I document in the first 90 days becomes the explicit one I write later.\n- [Inspected Trust](inspected-trust.html) — the trust built here is what inspection later draws on.\n- [Managing Priorities and Energy](managing-energy.html) — the sustainability practices started in the first quarter.\n- [Hiring](hiring.html) — the hiring review begun here becomes an ongoing operating rhythm.\n\n## Scope and Revisiting\n\nThis principle applies to my own ramp into any engineering executive role; the durations are guidelines, not a rigid calendar. I revisit it after each ramp — what the checklist missed, what it over-weighted — and when the role's context (company stage, urgency of turnaround) genuinely demands a faster arc.\n\n## Authoritative References\n\n- Will Larson, *The Engineering Executive's Primer* (O'Reilly, 2024) — the \"First 90 Days\" chapter this record's checklist distills; the principle above is my operating commitment to it.\n- Will Larson, [Your first 90 days as CTO or VP Engineering](https://lethain.com/first-ninety-days-cto-vpe/) — the freely available companion essay.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle. It is grouped the way I use it; the guiding principles come first because everything else derives from them. The Article tab carries the rationale, implications, and anti-patterns.*\n\n### Guiding Principles\n\n- [ ] Prioritize learning over early change.\n- [ ] Understand systems before modifying them.\n- [ ] Focus on durable improvements, not visible quick wins.\n- [ ] Build trust before conflict.\n- [ ] Move slower than your instincts tell you.\n\n### Clarify Expectations (Week 1–2)\n\n- [ ] Ask your manager (CEO/CTO) to write explicit expectations for your role.\n- [ ] Ask: \"What will success look like in 6–12 months?\"\n- [ ] Identify any urgent, dire issues needing immediate attention.\n- [ ] Align on measurable goals for your first 90 days.\n\n### Understand the Business\n\n- [ ] Understand how the business makes money.\n- [ ] Know where money is spent and the current financial runway.\n- [ ] Identify what must be true in 12 months for step-function growth.\n- [ ] Identify knowledge gaps between Engineering and the business.\n- [ ] Learn the company's core domain deeply.\n\n### Build Relationships and Trust\n\n- [ ] Go on a listening tour — meet individuals and teams.\n- [ ] Meet cross-functional peers and stakeholders.\n- [ ] Set up recurring 1:1s (directs and skip-levels).\n- [ ] Share weekly or monthly updates on what you are learning.\n- [ ] Attend routine forums before changing them.\n- [ ] Shadow support tickets, customer and partner meetings, and user testing sessions.\n\n### Learn How Work Gets Done\n\n- [ ] Map how ideas become shipped work.\n- [ ] Understand how work is assigned and prioritized.\n- [ ] Identify who handles emergencies.\n- [ ] Determine whether execution systems are working and scaling.\n- [ ] Identify internal engineering velocity metrics and external business-impact metrics.\n\n### Understand Organizational Health\n\n- [ ] Assess team morale and inclusion.\n- [ ] Identify who is succeeding and who isn't — and why.\n- [ ] Document undocumented processes.\n- [ ] Spot-check compensation and inclusion health.\n- [ ] Pay attention to non-product engineering roles (TPM, SRE, and similar).\n\n### Understand the Technology\n\n- [ ] Evaluate whether the existing tech stack is effective; identify major friction points.\n- [ ] Learn how major technical decisions are made.\n- [ ] Build and deploy a small, trivial change yourself.\n- [ ] Join an on-call rotation (as observer if needed) and attend incident reviews.\n- [ ] Document the technology history, the context behind decisions, and the implicit engineering strategy.\n\n### Understand and Improve Hiring\n\n- [ ] Review hiring funnel metrics and pipeline; establish a recurring recruiting meeting.\n- [ ] Shadow interviews and onboarding.\n- [ ] Identify the 1–3 highest-priority missing roles and personally help close top candidates.\n- [ ] Evaluate whether the hiring process needs an overhaul.\n- [ ] Kick off engineering brand efforts (blog, talks, social presence).\n\n### Make the Right (Limited) Changes\n\n- [ ] Limit early changes to 1–2 high-leverage improvements.\n- [ ] Avoid disrupting systems without a working alternative.\n- [ ] Consider adding a weekly operational review.\n- [ ] Evaluate org structure for execution impediments.\n- [ ] Plan next year's org growth (size, roles, transitions).\n\n### Learn Through Reflection\n\n- [ ] Follow a \"20–40 rule\" for problem-solving before asking for help.\n- [ ] Create a regular thinking space to slow down.\n- [ ] Avoid rushing to judgment without context, and avoid referencing \"how we did it at my last job\".\n- [ ] Write down what you are learning.\n\n### Build External Support\n\n- [ ] Build a peer support group of similar leaders.\n- [ ] Consider engaging an executive coach.\n- [ ] Create space for self-care: sleep, exercise, therapy, hobbies.\n\n### Protect Long-Term Sustainability\n\n- [ ] Assess whether the team's pace is sustainable.\n- [ ] Identify energy drains — for you and for the team.\n- [ ] Add energizing practices deliberately, and avoid burnout cycles early.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why my first quarter in an executive role is a learning quarter — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Vera arrives at a new office while Leo eagerly asks what she will change first.](assets/images/first-90-days/comic-01-day-one.jpeg)\n**Panel 1:** *Day one: everyone expects the new executive to start changing things.*\n\n![Comic panel: Vera at a desk with thought bubbles of the CEO, the team, and herself, all with clock icons.](assets/images/first-90-days/comic-02-pressure-to-shine.jpeg)\n**Panel 2:** *The problem: pressure from the CEO, the team, and yourself to demonstrate impact quickly.*\n\n![Comic panel: Leo presents a week-three reorg chart that is cracking apart behind him.](assets/images/first-90-days/comic-03-quick-win-theater.jpeg)\n**Panel 3:** *The trap: quick-win theater — a visible change that later has to be unwound costs more trust than it bought.*\n\n![Comic panel: Vera takes notes at the back of a team meeting while engineers discuss at a whiteboard.](assets/images/first-90-days/comic-04-learning-quarter.jpeg)\n**Panel 4:** *The principle: treat the organization as a system you do not yet understand — and refuse to modify what you do not understand.*\n\n![Comic panel: Vera takes a support call with a deploy running on a terminal beside her while Leo watches.](assets/images/first-90-days/comic-05-primary-sources.jpeg)\n**Panel 5:** *How it plays out: tickets, incidents, on-call, and a hands-on deploy tell you more than any report.*\n\n![Comic panel: Vera drops small coins into a clear jar labeled Trust.](assets/images/first-90-days/comic-06-trust-deposits.jpeg)\n**Panel 6:** *Build trust before conflict: small, consistent deposits compound into the reservoir hard calls will need.*\n\n![Comic panel: Vera picks two sticky notes from a wall full of them while Leo gestures at the rest.](assets/images/first-90-days/comic-07-one-or-two-changes.jpeg)\n**Panel 7:** *Then act — but small: one or two high-leverage improvements that will still look good in two years.*\n\n![Comic panel: Vera faces the reader with a long winding path behind her outreaching a short sprint line.](assets/images/first-90-days/comic-08-slower-is-faster.jpeg)\n**Panel 8:** *The closer: move slower than your instincts — it is the fastest route to durable impact.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
