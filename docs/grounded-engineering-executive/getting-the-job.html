<script id="data" type="application/json">{"meta": {"id": "EXEC-GETTING-THE-JOB", "status": "draft:gray", "title": "Getting the Job", "date": "2026-07-25", "author": "Željko Obrenović", "permalink": "getting-the-job", "timetoread": "9 min", "excerpt": "I treat the search for an engineering executive role as a one-of-one process: unstructured, variable, and not generalizable from past interviews. I start from an honest answer to why I want the role at all, work the search through my network and recruiters without relying on either alone, and negotiate the full contract without negotiating trust away. Above all, I keep the freedom to walk away — the goal is not an executive job, it is the right one.", "tags": "engineering executive, job search, career, negotiation, interviews, leadership", "icon": "assets/icons/job-search.png", "logo": "assets/images/getting-the-job/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "job search", "career", "negotiation", "interviews", "leadership"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I pursue the *right* executive role, not *an* executive role. I start by pressure-testing why I want the job at all, treat every search as a one-of-one process that past interview loops cannot predict, work my network and recruiters without relying on either alone, and negotiate the full contract — equity, acceleration, severance, role support — without over-negotiating trust away. I keep the freedom to walk away at every stage, because rejection is not failure; it is filtering toward a better fit.\n\n## Statement\n\nBefore I pursue an engineering executive role, I make a small number of commitments to myself:\n\n- **Start with an honest \"why\".** I articulate why I want the role, and I make sure the rationale is positive — growth, impact, learning — not ego or status. I pressure-test that reasoning with trusted peers, and I confirm I am motivated by the work, not just the title.\n- **Treat the search as one-of-one.** Executive searches are unstructured and variable; role definitions differ significantly across companies. I do not over-generalize from past interview experiences.\n- **Work every channel, rely on none.** I activate my network, build relationships with recruiters, and seek warm introductions through investors, founders, and operators — knowing the best roles often never reach a recruiter or a job board.\n- **Negotiate the full contract.** Compensation, equity, acceleration, severance, bonus, start date, and role support all get clarified before I sign — and I stop before negotiation damages the trust the role will run on.\n- **Do the diligence, then decide.** Time with the CEO, a conversation with a board member, meetings with every executive I will work with, the recent P&L, recent executive departures — and the willingness to walk away if something feels off.\n\n![Concept map with a central node reading 'The right role, not any role' connected to five labeled commitment nodes with simple icons.](assets/images/getting-the-job/search-commitments-map.jpeg)\n**Figure 1:** *The five commitments of the search, all serving one stance: the right role, not any role.*\n\n## How to Read This\n\nThis record is a vision of how I approach a search, not advice on how anyone else should run theirs. If you are a recruiter, CEO, or board member, it tells you how I will evaluate an opportunity — and that my questions are diligence, not hesitation. The working checklist — the concrete moves at each stage, from deciding to pursue the role to handling rejection — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Executive searches are one-of-one.** Below the executive level, interviews are structured and comparable; at this level, every search is different. Role definitions vary significantly across companies, processes are improvised, and the signals are noisy — confidence is common in these rooms, and I have to discern substance from bravado, in others and in myself. Because the process is one-of-one, past interview loops are weak predictors, and preparation still matters: structured storytelling, a clear executive presentation of vision plus first 90 days, and thoughtful follow-ups.\n\n![Side-by-side comparison of four identical structured interview funnels versus four irregular, differently shaped executive search funnels.](assets/images/getting-the-job/one-of-one-vs-structured.jpeg)\n**Figure 2:** *Below the executive level, loops are structured and comparable; every executive search is one-of-one.*\n\n**Motivation must be pressure-tested before the search starts.** A search run on ego or status produces the wrong acceptance criteria: it optimizes for getting *an* offer instead of finding the *right* role. So I write down why I want the job, check the rationale is about growth, impact, and learning, and ask trusted peers to challenge it. If I am chasing the title rather than the work, the best outcome is discovering that before an offer arrives, not after.\n\n**The contract is negotiated once.** Severance and acceleration terms are nearly impossible to add later; the only time to negotiate them is before signing. So I clarify everything — base, bonus structure, equity form and vesting, single versus double trigger, severance duration, parental leave, start date, and the support the role needs to succeed. And then I stop: over-negotiating to the last term damages exactly the trust with the CEO that the role depends on from day one.\n\n**Walking away is a feature of the process, not a defect.** The diligence before accepting — enough time with the CEO to trust their leadership and judgment, at least one board member, every executive I will regularly work with, the company's recent financials, the story behind recent executive departures — exists to make walking away possible. If something feels off and my key questions are not fully answered, I decline. And when a process ends in rejection, I reframe it the same way: the process filtered toward a better fit, and I maintain the relationships it created.\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Pressure-test the \"why\" before searching. | Ambition is suspect — growth, impact, and learning are exactly the right reasons. |\n| Treat every search as one-of-one. | Skip preparation — structured stories and a crisp presentation still matter. |\n| Negotiate the full contract, including severance and acceleration. | Extract every last term — over-negotiation spends the trust the role needs. |\n| Do full diligence: CEO, board, peers, financials. | Delay indefinitely — once the key questions are answered, decide. |\n| Be willing to walk away at every stage. | Treat rejection as failure — it filters toward the right fit. |\n\nIn practice the search follows an arc: **decide whether to pursue** (honest, pressure-tested motivation) → **find roles** (internal or external, through network and recruiters) → **interview** (preparation, presentation, mutual fit) → **negotiate** (the whole contract, without damaging trust) → **decide** (diligence, then a clear yes or a clean walk-away).\n\n![Horizontal five-stage search flow ending at a node labeled 'Right role', with a walk-away exit branching down from every stage into a shared bottom lane.](assets/images/getting-the-job/search-arc-walk-away.jpeg)\n**Figure 3:** *The search arc: five stages, each with a legitimate walk-away exit — walking away is the process working.*\n\n\n## Anti-Patterns\n\n- **Chasing the title.** Pursuing the role for status or ego. The rationale fails the pressure test, and the acceptance criteria degrade to \"whoever says yes first\".\n- **\"My last loop went like this…\"** Over-generalizing from past interview experiences into a process that is, by nature, one-of-one and different at every company.\n- **Mistaking confidence for substance.** Executive processes are full of bravado — from candidates and from companies. Diligence exists to separate the two.\n- **Recruiter-only search.** Relying solely on recruiters when the best roles are often filled through warm introductions and never reach them — and taking publicly posted executive roles at face value without investigating the context.\n- **Over-negotiating trust away.** Winning every contract point while eroding the relationship with the CEO before day one.\n- **Skipping the company's diligence.** Accepting without meeting the board, reviewing the P&L, or asking about recent executive departures — and discovering the answers on the job.\n\n## Related Records\n\n- [First 90 Days](first-90-days.html) — everything after the signed offer: the learning quarter this search leads into.\n- [Your Network](your-network.html) — the network I activate here is curated long before any search begins.\n- [Working with Your CEO, Peers, and Engineering](working-with-your-ceo-peers-and-engineering.html) — trusting the CEO's leadership and judgment is the diligence question; this record is the working relationship it predicts.\n- [Personal and Organizational Prestige](personal-and-organizational-prestige.html) — the visible track record that makes warm introductions and recruiter relationships work.\n\n## Scope and Revisiting\n\nThis principle governs my own pursuit of executive roles, internal or external. I revisit it after every search — accepted, declined, or rejected — to record what the diligence caught, what it missed, and whether the \"why\" I wrote down at the start still describes the role I ended up in.\n\n## Authoritative References\n\n- Will Larson, *The Engineering Executive's Primer* (O'Reilly, 2024) — the \"Getting the Job\" chapter this record's checklist distills; the principle above is my operating commitment to it.\n- Will Larson, [Getting a job as an engineering executive](https://lethain.com/getting-engineering-executive-job/) — the freely available companion essay.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle, grouped by search stage — from deciding to pursue the role to handling rejection. The Article tab carries the rationale, implications, and anti-patterns.*\n\n### Decide Whether to Pursue an Executive Role\n\n- [ ] Clearly articulate why you want an executive role.\n- [ ] Ensure your rationale is positive (growth, impact, learning — not ego or status).\n- [ ] Pressure-test your reasoning with trusted peers/mentors.\n- [ ] Confirm you're motivated by the work — not just the title.\n\n### Prepare for a \"One-of-One\" Search\n\n- [ ] Accept that executive searches are unstructured and variable.\n- [ ] Avoid over-generalizing from past interview experiences.\n- [ ] Recognize that confidence is common — discern substance from bravado.\n- [ ] Expect role definitions to vary significantly across companies.\n\n### Finding Roles\n\n**Internal**\n\n- [ ] Evaluate realistically whether internal promotion makes sense.\n- [ ] Consider political dynamics and peer relationships.\n- [ ] Assess whether you'll receive adequate support in transition.\n- [ ] Understand internal transitions may be harder than external ones.\n\n**External**\n\n- [ ] Strengthen and activate your professional network.\n- [ ] Build relationships with executive recruiters.\n- [ ] Maintain an updated LinkedIn profile.\n- [ ] Respond thoughtfully and professionally to recruiter outreach.\n- [ ] Seek warm introductions via investors, founders, or operators.\n- [ ] Don't rely solely on recruiters (best roles often never reach them).\n- [ ] Be cautious about roles publicly posted — investigate context.\n\n### Interview Process\n\n**General Preparation**\n\n- [ ] Prepare to be evaluated on fit, communication, and perceived leadership.\n- [ ] Show energy and authentic excitement for the company.\n- [ ] Use structured storytelling (e.g., STAR method).\n- [ ] Send timely, thoughtful follow-ups.\n\n**Interview Stages**\n\n- [ ] Recruiter screen: clarify expectations, logistics, and concerns.\n- [ ] CEO/executive call: demonstrate preparation and strategic thinking.\n- [ ] Deep founder discussions: assess mutual working fit.\n- [ ] Meet peer executives and key team members.\n- [ ] Prepare a clear, structured executive presentation (vision + first 90 days).\n\n**Presentation**\n\n- [ ] Focus on high-impact priorities.\n- [ ] Leave time for discussion.\n- [ ] Ask what has worked well in past candidate presentations.\n- [ ] Align your plan with company priorities.\n\n### Negotiating the Contract\n\n**Compensation**\n\n- [ ] Benchmark compensation with peers.\n- [ ] Review comparable public executive compensation (if applicable).\n- [ ] Clarify base, bonus structure, and equity details.\n\n**Equity**\n\n- [ ] Understand form (options, RSUs, etc.).\n- [ ] Review vesting schedule and cliffs.\n- [ ] Negotiate vesting terms if appropriate.\n- [ ] Understand post-termination exercise window.\n- [ ] Evaluate tax implications with an advisor.\n\n**Acceleration**\n\n- [ ] Clarify single vs. double trigger acceleration.\n- [ ] Understand acquisition/change-of-control scenarios.\n\n**Severance**\n\n- [ ] Negotiate severance terms upfront.\n- [ ] Confirm severance duration and conditions.\n\n**Bonus**\n\n- [ ] Clarify bonus size and structure.\n- [ ] Understand individual vs. shared goal metrics.\n\n**Other Terms**\n\n- [ ] Negotiate parental leave terms (if relevant).\n- [ ] Agree on a realistic start date.\n- [ ] Negotiate role support (e.g., executive assistant, hiring budget).\n- [ ] Don't over-negotiate to the point of damaging trust.\n\n### Deciding Whether to Accept\n\n- [ ] Spend sufficient time with the CEO.\n- [ ] Ensure you trust their leadership and judgment.\n- [ ] Speak with at least one board member.\n- [ ] Meet every executive you'll regularly work with.\n- [ ] Review the company's recent financials (P&L).\n- [ ] Confirm your key questions have been fully answered.\n- [ ] Investigate recent executive departures.\n- [ ] Be willing to walk away if something feels off.\n- [ ] Ask yourself:\n  - [ ] Am I still excited?\n  - [ ] Can I see myself thriving here?\n  - [ ] Have trusted advisors validated this decision?\n\n### If You Don't Get the Job\n\n- [ ] Reframe rejection as filtering toward a better fit.\n- [ ] Remember: the goal is not *an* executive job — it's the *right* one.\n- [ ] Maintain relationships even when processes end.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "How I search for an executive role — the right one, not any one — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Leo excitedly waves his phone at a calm, seated Vera.](assets/images/getting-the-job/comic-01-any-offer.jpeg)\n**Panel 1:** *The temptation: an executive offer appears, and grabbing it feels obvious.*\n\n![Comic panel: Vera calmly asks Leo why he wants the job while he freezes mid-gesture.](assets/images/getting-the-job/comic-02-why-this-job.jpeg)\n**Panel 2:** *First question, before any search: an honest, pressure-tested 'why'.*\n\n![Comic panel: Leo stares dreamily at a glowing VP badge while Vera looks skeptical.](assets/images/getting-the-job/comic-03-chasing-the-title.jpeg)\n**Panel 3:** *The wrong way: chasing the title degrades the search to 'whoever says yes first'.*\n\n![Comic panel: Vera pushes aside Leo's stack of interview notes and tells him every search is one-of-one.](assets/images/getting-the-job/comic-04-one-of-one.jpeg)\n**Panel 4:** *The principle: every executive search is one-of-one — past loops predict nothing.*\n\n![Comic panel: Vera holds the handles of three doors labeled Network, Recruiters, and Warm intros.](assets/images/getting-the-job/comic-05-every-channel.jpeg)\n**Panel 5:** *How it plays out: activate every channel — the best roles never reach a job board.*\n\n![Comic panel: Vera caps her pen over a contract listing equity, severance, acceleration, and support.](assets/images/getting-the-job/comic-06-full-contract.jpeg)\n**Panel 6:** *Negotiate the full contract once — and stop before negotiation spends the trust the role runs on.*\n\n![Comic panel: Vera walks calmly away from a large door labeled Offer while Leo looks back surprised.](assets/images/getting-the-job/comic-07-walk-away.jpeg)\n**Panel 7:** *The cost of the principle: sometimes diligence means declining — and that is the process working.*\n\n![Comic panel: Vera faces the reader holding her closed notebook, Leo nodding beside her.](assets/images/getting-the-job/comic-08-right-role.jpeg)\n**Panel 8:** *The closer: the goal is not an executive job — it is the right one.*\n"}]}]}</script>

            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
