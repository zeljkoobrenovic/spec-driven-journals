when scale clearly demands it.\n\n## Statement\n\nMy commitments on who runs engineering processes:\n\n- **Philosophy first.** Every process trades quality against overhead. I decide how much process sophistication the organization can realistically sustain, avoid over-optimizing for perfection at the expense of usability, and insist that each process is worth its operational cost.\n- **Name the current pattern.** Early startup (founders run processes directly), baseline (centralized functions run company-scoped processes; engineers and managers run engineering-scoped ones), specialized engineering roles (dedicated EngOps/TPM headcount), company embedded (dedicated Engineering partners inside Recruiting, People, Finance), or business-unit local. Each has real pros and real costs; I evaluate the one we are in before proposing another.\n- **Default to baseline and make it work.** Below roughly a hundred engineers I reconsider specialized roles very carefully. Within baseline I make ownership sustainable — six-month rotations, overlapping transitions, pairing on key roles — and valued: exposure to strategic discussions, ties to promotion criteria, public recognition.\n- **Check the budget reality.** Moving up the pattern curve costs headcount. I only propose it during growth phases, with clarity on whose budget absorbs the roles and readiness for cross-executive pushback.\n- **Hold the model.** Ground processes in a clear set of beliefs, commit for 3–4 years, and change intentionally — never reactively, never because a trend demands it.\n\n![Five ascending platforms from Early startup to Business-unit local along a rising cost curve, with the Baseline platform highlighted as the default.](assets/images/run-engineering-processes/pattern-cost-curve.jpeg)\n**Figure 1:** *The five patterns on the cost curve: name where you are, default to baseline, and move up only when scale demands it.*\n\n\n## How to Read This\n\nThis record tells engineering leaders in my organization why I will usually answer \"who should run this process?\" with \"we should\" — and tells peer executives and Finance why I argue against premature specialized process headcount. It is a vision of how I choose the pattern, not an EngOps hiring plan for any specific company. The working checklist — pattern identification, the baseline playbook, the budget reality check, and the final decision filter — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Specialized roles too early ossify processes.** A dedicated process specialist brings expertise and efficiency — and an incentive problem: specialists are incentivized to improve processes, not to eliminate them. Processes acquire owners whose role depends on the process existing, overhead compounds, and the organization loses the healthy instinct to ask whether a process should exist at all. Engineers and managers who run their own processes keep that instinct, and process ownership doubles as leadership development — which is why I encourage engineers to serve in process roles before moving into Staff+ or management.\n\n**Under-execution is usually the real problem.** When a process performs badly, the tempting diagnosis is structural: we need a different model, a dedicated role, a new framework. The more common truth is that the current model is run poorly — ownerless, unrotated, unrecognized. So my decision filter asks first: is the model truly failing, or are we under-executing within it? Are we solving a real scale problem, or reacting to a perceived sophistication gap compared to much larger companies? Improving execution is almost always cheaper than changing structure, and it reveals whether a structural change is actually needed.\n\n![Decision flowchart where a struggling process usually routes to fixing execution and only rarely, past scale and budget checks, to changing the pattern.](assets/images/run-engineering-processes/execution-first-decision-loop.jpeg)\n**Figure 2:** *The decision filter: fix execution within the pattern first — structural change waits for real scale and a budget reality check.*\n\n\n**Sustainability and status are what make baseline durable.** Baseline fails when process work is treated as a career dead-end dumped on whoever objects least. I prevent that deliberately: ownership rotates on a schedule, transitions overlap to preserve continuity, key roles are paired, process owners are exposed to strategic discussions, the work counts toward promotion, and contributors are publicly recognized. Valued work gets done well; invisible work decays.\n\n![Rotation ring of three owners with overlapping handoff arcs and a paired role, orbited by badges for visibility, promotion, and recognition.](assets/images/run-engineering-processes/sustainable-ownership-cycle.jpeg)\n**Figure 3:** *What keeps baseline durable: scheduled rotation, overlapping handoffs, pairing — and ownership that visibly counts.*\n\n\n**Models need years, not quarters.** Process fads — Agile extremes, management pendulum swings — offer perpetual reasons to reorganize how work is run. Every switch resets learning curves and burns credibility. Grounding processes in a clear set of beliefs and committing to a model for 3–4 years lets the organization get good at it — and makes an eventual intentional change meaningful instead of merely fashionable.\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Default to baseline; engineers and managers run their own processes. | Baseline is forever — scale can genuinely demand specialized roles. |\n| Improve execution before changing structure. | Tolerate failing processes — under-execution gets fixed, deliberately. |\n| Reconsider specialized roles carefully below ~100 engineers. | Never hire a TPM — the bar is scale-driven need, not headcount vanity. |\n| Commit to a model for 3–4 years. | Never adjust — changes are made intentionally, not reactively. |\n| Check the budget reality before moving up the cost curve. | Process quality is Finance's decision — the trade-off analysis is mine to own. |\n\n## Anti-Patterns\n\n- **Cargo-culting the big company.** Copying the process structure of an organization ten times our size because it looks sophisticated — importing its overhead without its scale.\n- **The premature specialist.** Hiring dedicated process roles at a size where engineers and managers could run the processes themselves — and creating specialists incentivized to improve processes rather than eliminate them.\n- **Process fad chasing.** Reorganizing how work runs every time a new methodology trends, resetting the organization's learning curve each time.\n- **Invisible process work.** Assigning process ownership with no rotation, no recognition, and no promotion relevance — then acting surprised when the process decays and the owner burns out.\n- **Structure as the answer to execution.** Responding to a poorly run process with a reorg or a new role instead of first fixing ownership, cadence, and accountability within the current pattern.\n- **Cost-curve climbing in a downturn.** Proposing new specialized process headcount while the company is in cost-reduction mode, without knowing whose budget absorbs it.\n\n## Related Records\n\n- [Meetings](meetings.html) — the recurring sessions many of these processes run through; that record covers the portfolio, this one covers who owns it.\n- [Calibrating Your Standards](calibrating-your-standards.html) — what \"good\" looks like inside a process; this record decides who is responsible for reaching it.\n- [Engineering Onboarding](engineering-onboarding.html) — a canonical engineering-scoped process that baseline puts in the hands of engineers and managers.\n- [Inspected Trust](inspected-trust.html) — rotated, delegated process ownership works because delegation comes with inspection, not blind trust.\n\n## Scope and Revisiting\n\nThis principle governs how I assign ownership of engineering processes in any organization I lead. The commitment horizon is explicit: hold the chosen model for 3–4 years, revisiting earlier only if the final decision filter shows the model truly failing at real scale — not merely under-executed — and the budget reality supports a change.\n\n## Authoritative References\n\n- Will Larson, *The Engineering Executive's Primer* (O'Reilly, 2024) — the engineering-processes chapter this record's checklist distills; the principle above is my operating commitment to it.\n- Will Larson, [Who runs Engineering processes?](https://lethain.com/who-runs-eng-process/) — the freely available companion essay.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle, running from philosophy through pattern identification to the final decision filter. The Article tab carries the rationale, implications, and anti-patterns.*\n\n### Clarify Your Philosophy First\n\n- [ ] Acknowledge that every process is a trade-off between quality and overhead.\n- [ ] Decide how much process sophistication your org can realistically sustain.\n- [ ] Avoid over-optimizing for perfection at the expense of usability.\n- [ ] Ensure processes are worth their operational cost.\n\n### Identify Your Current Pattern\n\n- Determine which pattern best matches your organization:\n\n**Early Startup**\n\n- [ ] Founders or functional leaders run processes directly.\n- [ ] Processes are lightweight or ad hoc.\n- [ ] No dedicated support roles exist.\n- [ ] Work happens only if someone explicitly owns it.\n\n**Baseline (Most Common)**\n\n- [ ] Company-scoped processes run by centralized functions (e.g., People/HR).\n- [ ] Engineering-scoped processes run by engineers/managers.\n- [ ] No specialized engineering process roles.\n- [ ] Engineering is treated similarly to other functions operationally.\n\n**Specialized Engineering Roles**\n\n- [ ] Dedicated EngOps / TPM / onboarding/incident roles exist.\n- [ ] Full-time support for engineering-scoped processes.\n- [ ] Process efficiency prioritized.\n- [ ] Additional headcount allocated for process support.\n\n**Company Embedded Roles**\n\n- [ ] Recruiting / People / Finance has dedicated Engineering partners.\n- [ ] Engineering processes diverge from company defaults.\n- [ ] Cross-functional embeds support Engineering directly.\n\n**Business Unit Local**\n\n- [ ] Engineering is split across business units.\n- [ ] No single engineering leader over the entire org.\n- [ ] Business units define their own processes.\n- [ ] Standardization across units is limited.\n\n### Evaluate Pros & Cons of Your Pattern\n\n**Early Startup**\n\n- [ ] Low cost.\n- [ ] High flexibility.\n- [ ] Risk: Important processes don't happen.\n- [ ] Risk: Quality depends heavily on the founders' time/skill.\n\n**Baseline**\n\n- [ ] Clear ownership.\n- [ ] Modest specialization.\n- [ ] Unified systems across the company.\n- [ ] Risk: Outcomes depend on centralized function quality.\n- [ ] Risk: Hard to change company-wide processes.\n\n**Specialized Roles**\n\n- [ ] Increased efficiency.\n- [ ] Process expertise improves quality.\n- [ ] Engineers focus on engineering.\n- [ ] Higher cost (headcount).\n- [ ] Risk of ossifying processes.\n- [ ] Specialists incentivized to improve processes, not eliminate them.\n\n**Company Embedded**\n\n- [ ] Engineering customization.\n- [ ] Stronger cross-functional alignment.\n- [ ] Expensive.\n- [ ] Quality dependent on embedded individuals.\n\n**Business Unit Local**\n\n- [ ] Strong business alignment.\n- [ ] Tailored trade-offs per unit.\n- [ ] Hard to standardize.\n- [ ] Cross-org investment decisions become difficult.\n\n### If You're in Baseline (Recommended Default)\n\n**Keep It Working Longer**\n\n- [ ] Don't hire specialized roles too early (<100 engineers, reconsider carefully).\n- [ ] Avoid copying patterns from much larger companies prematurely.\n- [ ] Improve execution before changing structure.\n\n**Make It Sustainable**\n\n- [ ] Rotate process ownership (e.g., 6-month rotations).\n- [ ] Overlap transitions to preserve continuity.\n- [ ] Pair people in key process roles.\n\n**Make It Valued Work**\n\n- [ ] Expose process owners to strategic discussions.\n- [ ] Tie the process work to the promotion criteria.\n- [ ] Encourage engineers to serve in process roles before Staff+/management.\n- [ ] Publicly recognize process contributors.\n\n### Budget Reality Check\n\n- Before moving \"up\" the pattern curve:\n\n- [ ] Confirm revenue or headcount is growing.\n- [ ] Expect resistance if the company is in cost-reduction mode.\n- [ ] Understand whether budgeting is:\n  - [ ] Dollar-based\n  - [ ] Headcount-based (harder to justify role swaps)\n- [ ] Identify which department's budget will absorb new roles.\n- [ ] Prepare for cross-executive pushback.\n\n- Rule of thumb:\n\n- [ ] Only move up the cost curve during growth phases.\n- [ ] Default to staying in Baseline unless scale clearly demands change.\n\n### Trend Discipline\n\n- [ ] Avoid chasing process fads (Agile extremes, management swings, etc.).\n- [ ] Ground processes in a clear set of beliefs.\n- [ ] Commit to a model for 3–4 years before major changes.\n- [ ] Make changes intentionally, not reactively.\n\n### Final Decision Filter\n\n- Before changing patterns, ask:\n\n- [ ] Is the current model truly failing?\n- [ ] Or are we under-executing within it?\n- [ ] Are we solving a real-scale problem?\n- [ ] Or reacting to perceived sophistication gaps?\n- [ ] Can we sustain the operational overhead long term?\n\n### Default Recommendation\n\n- If forced to choose without context:\n\n- [ ] Start with or stay in **Baseline**.\n- [ ] Improve execution before increasing specialization.\n- [ ] Move up patterns only when the scale makes it unavoidable.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Who should run engineering processes? Usually: we should — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: an exasperated Leo holds messy sprint boards and asks Vera to hire a TPM.](assets/images/run-engineering-processes/comic-01-hire-a-tpm.jpeg)\n**Panel 1:** *The hook: a struggling process, and the reflex answer — hire a specialist.*\n\n![Comic panel: Vera holds a balance scale weighing a gem labeled Quality against weights labeled Overhead.](assets/images/run-engineering-processes/comic-02-quality-vs-overhead.jpeg)\n**Panel 2:** *The frame: every process trades quality against overhead — and must be worth its cost.*\n\n![Comic panel: Vera points at a five-rung ladder chart of process patterns with a pin marking Baseline.](assets/images/run-engineering-processes/comic-03-name-the-pattern.jpeg)\n**Panel 3:** *The first move: name the pattern you are actually in before proposing a new one.*\n\n![Comic panel: Leo sketches a giant corporate process org over their tiny office while Vera warns about overhead without scale.](assets/images/run-engineering-processes/comic-04-cargo-cult.jpeg)\n**Panel 4:** *The wrong way: cargo-culting a company ten times your size.*\n\n![Comic panel: Vera inspects the sprint board with a magnifying glass, revealing tags for no owner, no rotation, no recognition.](assets/images/run-engineering-processes/comic-05-under-execution.jpeg)\n**Panel 5:** *The diagnosis: is the model truly failing, or are we under-executing within it? Usually the latter.*\n\n![Comic panel: engineers and managers each hold their own process clipboard, Leo among them, as Vera states they run their own processes.](assets/images/run-engineering-processes/comic-06-baseline-default.jpeg)\n**Panel 6:** *The principle: default to baseline — engineers and managers run engineering-scoped processes themselves.*\n\n![Comic panel: Leo relay-passes his process clipboard to a teammate while Vera applauds and pins a star on him.](assets/images/run-engineering-processes/comic-07-valued-ownership.jpeg)\n**Panel 7:** *What makes it durable: rotations, overlapping handoffs, and process work that visibly counts.*\n\n![Comic panel: Vera plants a flag labeled Our model while faded trend banners blow past behind her.](assets/images/run-engineering-processes/comic-08-hold-the-model.jpeg)\n**Panel 8:** *The closer: ground the model in beliefs, commit for three to four years, and change intentionally — never fashionably.*\n"}]}]}</script>

        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
