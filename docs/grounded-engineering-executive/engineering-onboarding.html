<script id="data" type="application/json">{"meta": {"id": "EXEC-ENGINEERING-ONBOARDING", "status": "draft:gray", "title": "Engineering Onboarding", "date": "2026-07-25", "author": "Željko Obrenović", "permalink": "engineering-onboarding", "timetoread": "8-10 min", "excerpt": "I run engineering onboarding as a program with clear goals and, above all, clear ownership: an executive sponsor, a program orchestrator with protected time, the team manager, and an onboarding buddy — each with explicit duties. The curriculum starts with three core sessions and is strengthened by surveys rather than up-front over-design. Attendance is required at every level, and investment is sized to hiring volume. Onboarding fails from unclear ownership and over-engineering, not from starting simple.", "tags": "engineering executive, onboarding, ownership, program design, talent, leadership", "icon": "assets/icons/onboarding.png", "logo": "assets/images/engineering-onboarding/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "onboarding", "ownership", "program design", "talent", "leadership"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I run engineering onboarding as a program with a measurable goal — a rising share of engineers productive within three months, with \"productive\" defined — and, above all, with clear ownership: an executive sponsor, a program orchestrator with protected time, the team manager, and an onboarding buddy, each with explicit duties. The curriculum starts with three core sessions and is strengthened by surveys, not up-front design. Everyone attends, at every level. Onboarding programs fail from unclear ownership and from trying too hard — not from starting simple.\n\n## Statement\n\nOnboarding turns hires into colleagues, and I run it as a program, not a vibe. My commitments:\n\n- **Clear goals, defined and measured.** The goal is to increase the percentage of engineers productive within their first three months and to build the foundation for long-term impact. \"Productive\" is defined at our company, with concrete success metrics — time to first PR, first deploy, survey results.\n- **Clear ownership above all.** Four named roles carry the program: I am the **executive sponsor** (select the orchestrator, define metrics and cadence, review data monthly, meet outlier new hires, publicly reinforce the program's importance); a **program orchestrator** owns the curriculum with protected time — at least 20 hours a month; the **team manager** runs a personalized plan, weekly 1:1s, a buddy assignment, and 1–3 starter projects; an **onboarding buddy** does daily check-ins in the first weeks and surfaces early friction.\n- **Start with three core sessions.** Engineering values and strategy, technical architecture overview, development environment setup. Everything else is added because surveys of new hires and managers say it is missing — not because it seemed complete on a whiteboard.\n- **Everyone attends.** All engineers, all engineering managers, all levels. Senior hires do not skip. Other functions may join by request, not by default.\n- **Size investment to hiring volume.** Hiring 5–10+ engineers a month justifies a structured program; infrequent hiring justifies a lightweight, personalized one. Attrition-driven hiring counts too.\n- **Measure and iterate quarterly.** Time-to-productivity, satisfaction scores, first-quarter performance trends, recurring friction — reviewed and acted on.\n\n![Diagram of a new hire supported by four connected roles: sponsor with monthly metrics, orchestrator with curriculum and protected time, manager with weekly one-on-ones, and buddy with daily check-ins.](assets/images/engineering-onboarding/four-roles-map.jpeg)\n**Figure 1:** *Clear ownership: four named roles with explicit duties close the seam a new hire could fall through.*\n\n\n## How to Read This\n\nThis record is for the leaders who own a piece of onboarding under my sponsorship — especially the program orchestrator I appoint — and for peer executives who want to know how new engineers become productive here. It states the program's shape, not one company's syllabus. The working checklist — the per-role duties, the curriculum design moves, the failure modes, and the quick-start version for starting from scratch this month — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Diffuse ownership is the root failure mode.** Onboarding is everyone's responsibility in general and therefore no one's in particular: the manager assumes the program covers it, the program assumes the manager covers it, and the new hire falls through the seam. Naming four roles with explicit, non-overlapping duties closes the seam. The most fragile role is the orchestrator — a program owned by someone with no protected time decays within two quarters, which is why the ≥20 hours/month allocation is a minimum expectation, not an aspiration, and why orchestrator transition continuity is planned rather than improvised.\n\n**The worst programs come from trying too hard, not from starting simple.** An over-engineered curriculum — weeks of sessions, elaborate content, heavy internal engagement — collapses under its own maintenance cost and is abandoned, leaving less than a simple program would have delivered. Three core sessions that reliably happen beat twelve that decay. The strengthening mechanism is empirical: survey new hires a month in, survey managers and tech leads on common gaps, remove low-value theoretical content, emphasize practical context. The curriculum is grown from evidence, the same way [Calibrating Your Standards](calibrating-your-standards.html) grows standards from demonstrated outcomes rather than decree.\n\n![Diagram of three core session cards surrounded by a survey-add-prune feedback loop that slowly grows the curriculum, with a crossed-out toppled binder tower representing up-front over-design.](assets/images/engineering-onboarding/curriculum-growth-loop.jpeg)\n**Figure 2:** *The growth mechanism: three core sessions, then survey-driven additions and pruning — never up-front over-design.*\n\n\n**Attendance without exceptions protects the program and the hires.** The senior hire who skips onboarding misses exactly what seniority cannot substitute for — this company's values, strategy, architecture, and ways of working — and their exemption signals to everyone else that the program is optional busywork. Requiring attendance at every level, per the expectations set in [Gelling Your Engineering Leadership Team](gelling-your-engineering-leadership-team.html), is a cheap, visible statement that context is not beneath anyone.\n\n**Investment must match volume.** A structured program for a company hiring twice a quarter is overhead; a personalized ad-hoc ramp for a company hiring ten engineers a month is negligence. I size the investment to actual hiring volume — including attrition-driven hiring, which replaces context the organization just lost — and I coordinate with company-wide onboarding by reusing its content while keeping engineering onboarding, and its feedback loops, owned within Engineering.\n\n![Slider diagram matching onboarding investment to hiring volume, from a lightweight personal ramp at low volume to a structured program at high volume, with attrition counting toward volume and mismatched pairings crossed out.](assets/images/engineering-onboarding/investment-vs-volume.jpeg)\n**Figure 3:** *Sizing the program: investment follows hiring volume — attrition included — in both directions.*\n\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Start with three core sessions and grow from survey evidence. | Design the complete curriculum up front — over-design is the failure mode. |\n| Assign an orchestrator with ≥20 protected hours/month. | Make onboarding a side-of-desk duty that loses to every deadline. |\n| Require attendance for all engineers and managers, all levels. | Force other functions in by default — Product and others join by request. |\n| Size the program to hiring volume. | One fixed program shape forever — light when hiring is rare, structured when it is not. |\n| Reuse company-wide onboarding content. | Hand engineering onboarding to another function — ownership and feedback stay in Engineering. |\n\nAs sponsor, my monthly rhythm is concrete: review the onboarding data, meet with outlier new hires — the excellent experiences and the struggling ones — and publicly reinforce that the program matters.\n\n## Anti-Patterns\n\n- **The orchestrator with no protected time.** Appointing an owner whose onboarding hours are the first casualty of every sprint — the program then exists on paper and nowhere else.\n- **Senior hires skipping onboarding.** Exempting the staff engineer or new director as too senior for it, losing the one window where the organization's context is systematically transferred — and telling everyone else the program is optional.\n- **The over-engineered curriculum.** Weeks of polished sessions nobody can sustain, followed by quiet abandonment. Trying too hard is how good intentions produce the worst programs.\n- **Onboarding by osmosis.** No program, no buddy, no starter projects — the new hire is handed a laptop and a channel list and expected to reconstruct the company from commit history.\n- **Set-and-forget.** A program built once and never surveyed, drifting from the actual gaps until its content describes a company that no longer exists.\n- **Orchestrator turnover with no continuity plan.** The program lives in one person's head; when they change roles, it resets to zero.\n\n## Related Records\n\n- [Hiring](hiring.html) — the system that ends where this one begins: at the accepted offer.\n- [Onboarding Peer Executives](onboarding-peer-executives.html) — onboarding applied to a very different audience: my executive peers.\n- [First 90 Days](first-90-days.html) — my own ramp follows the same conviction that early context determines long-term impact.\n- [Gelling Your Engineering Leadership Team](gelling-your-engineering-leadership-team.html) — the expectations that make managers accountable for their piece of onboarding.\n- [Measuring Engineering Organizations](measuring-engineering-organizations.html) — time-to-productivity and satisfaction metrics feed the same measurement discipline.\n\n## Scope and Revisiting\n\nThis principle governs onboarding for engineers and engineering managers in any organization I lead; my own ramp and peer executives are covered elsewhere. I revisit it quarterly through the measure-and-improve review, and structurally whenever hiring volume changes regime — a hiring surge, a freeze, or an attrition wave each justify resizing the program.\n\n## Authoritative References\n\n- Will Larson, *The Engineering Executive's Primer* (O'Reilly, 2024) — the \"Engineering Onboarding\" chapter this record's checklist distills; the principle above is my operating commitment to it.\n- Will Larson, [Running your engineering onboarding program](https://lethain.com/engineering-onboarding-programs/) — the freely available companion essay.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle, grouped as the source organizes it: goals, then ownership role by role, then curriculum, attendance, and upkeep. The Article tab carries the rationale, implications, and anti-patterns.*\n\n### Define Clear Goals\n\n- [ ] Increase % of engineers productive within the first 3 months.\n- [ ] Build foundation for long-term impact (1–3+ years).\n- [ ] Define what \"productive\" means at your company.\n- [ ] Decide success metrics (time to first PR, first deploy, survey results, etc.).\n\n### Assign Clear Ownership (Critical)\n\n**Executive Sponsor**\n\n- [ ] Appoint executive sponsor (Head of Eng / CTO).\n- [ ] Select program orchestrator.\n- [ ] Define success metrics & monitoring cadence.\n- [ ] Review onboarding data monthly.\n- [ ] Meet with outlier new hires (excellent or struggling experiences).\n- [ ] Publicly reinforce onboarding's importance.\n\n**Program Orchestrator**\n\n- [ ] Own and evolve onboarding curriculum.\n- [ ] Coordinate onboarding sessions.\n- [ ] Create templates for managers.\n- [ ] Run post-onboarding surveys.\n- [ ] Track metrics and trends over time.\n- [ ] Continuously iterate program.\n- [ ] Ensure the program is sustainable long-term.\n- [ ] Allocate ≥20 hours/month (minimum expectation).\n\n**Team Manager**\n\n- [ ] Create a personalized onboarding plan (using template).\n- [ ] Schedule weekly 1:1s (first few months).\n- [ ] Assign an onboarding buddy.\n- [ ] Define first 1–3 starter projects.\n- [ ] Ensure the new hire is added to:\n  - [ ] Team meetings\n  - [ ] Slack/chat channels\n  - [ ] Email groups\n  - [ ] Documentation systems\n\n**Onboarding Buddy**\n\n- [ ] Daily check-ins for first few weeks (15–30 mins).\n- [ ] Help set up the dev environment.\n- [ ] Answer workflow and team-specific questions.\n- [ ] Bring the new hire to meetings / social touchpoints.\n- [ ] Help navigate the first project.\n- [ ] After 1–2 weeks, reassess meeting frequency.\n- [ ] Keep the manager informed of early friction.\n\n### Design the Curriculum\n\n**Core Segments (Start Here)**\n\n- [ ] Engineering values & strategy.\n- [ ] Technical architecture overview.\n- [ ] Development environment setup.\n\n**Strengthen Over Time**\n\n- [ ] Survey new hires 1 month after onboarding.\n- [ ] Survey managers/tech leads on common gaps.\n- [ ] Remove low-value theoretical content.\n- [ ] Emphasize practical, real-world context.\n\n**Consider Project-Based Component**\n\n- [ ] Decide: centralized onboarding project vs team-selected starter projects.\n- [ ] Ensure the project provides:\n  - [ ] Real business value\n  - [ ] Safe learning surface\n  - [ ] Clear ownership\n- [ ] Assign tech lead support if centralized.\n\n**Build Peer Cohort Effect**\n\n- [ ] Group new hires when possible.\n- [ ] Create opportunities for cohort bonding.\n- [ ] Encourage cross-team networking.\n\n### Decide Who Attends\n\n- [ ] Require all engineers (all levels).\n- [ ] Require all engineering managers.\n- [ ] Do not allow senior hires to skip.\n- [ ] Allow other functions (e.g., Product) by request, not default.\n\n### Avoid Common Failure Modes\n\n- [ ] Keep the program simple enough to sustain long-term.\n- [ ] Avoid over-engineering or excessive complexity.\n- [ ] Ensure internal engagement is manageable.\n- [ ] Plan for orchestrator transition continuity.\n- [ ] Regularly review and refresh content.\n\n- Reminder: The worst onboarding programs come from trying too hard, not from starting simple.\n\n### Coordinate with Company-Wide Onboarding\n\n- [ ] Reuse company onboarding content where appropriate.\n- [ ] Avoid duplicating existing materials.\n- [ ] Keep Engineering onboarding owned within Engineering (when possible).\n- [ ] Ensure feedback loops stay within Engineering.\n\n### Decide When to Invest Heavily\n\n- [ ] Hiring 5–10+ engineers per month → structured program strongly recommended.\n- [ ] Rapid growth phase → prioritize onboarding.\n- [ ] Hiring infrequently → consider lightweight/personalized onboarding instead.\n- [ ] Account for attrition-driven hiring (not just growth).\n\n### Measure & Improve\n\n- [ ] Track time-to-productivity metrics.\n- [ ] Track onboarding satisfaction scores.\n- [ ] Monitor first-quarter performance trends.\n- [ ] Identify recurring friction areas.\n- [ ] Review and iterate quarterly.\n\n### Quick Start Version (If You Need Something This Month)\n\n- If starting from scratch:\n\n- [ ] Assign orchestrator.\n- [ ] Create 3 core sessions (values, architecture, dev setup).\n- [ ] Require attendance for all engineers.\n- [ ] Assign buddies.\n- [ ] Run a 1-month feedback survey.\n- [ ] Improve next cycle.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why onboarding fails from unclear ownership and trying too hard — never from starting simple — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Leo hands a bewildered new hire a laptop and a long unrolling scroll of chat channel names.](assets/images/engineering-onboarding/comic-01-laptop-and-good-luck.jpeg)\n**Panel 1:** *The hook: a laptop, a channel list, and good luck.*\n\n![Comic panel: three managers point at each other while a new hire falls through a crack in the floor between them.](assets/images/engineering-onboarding/comic-02-everyones-job.jpeg)\n**Panel 2:** *The problem: diffuse ownership — the new hire falls through the seam.*\n\n![Comic panel: Vera shows a board with a new hire surrounded by four roles labeled Sponsor, Orchestrator, Manager, and Buddy.](assets/images/engineering-onboarding/comic-03-four-named-roles.jpeg)\n**Panel 3:** *The principle: four named roles close the ownership seam.*\n\n![Comic panel: an orchestrator shields a protected block of calendar hours from reaching hands holding urgent papers.](assets/images/engineering-onboarding/comic-04-protected-time.jpeg)\n**Panel 4:** *The fragile part: an orchestrator without protected time is a program on paper only.*\n\n![Comic panel: Vera lays out three cards labeled Values, Architecture, and Dev Setup next to a tray of survey slips.](assets/images/engineering-onboarding/comic-05-three-core-sessions.jpeg)\n**Panel 5:** *The curriculum: three core sessions, strengthened by evidence.*\n\n![Comic panel: a towering stack of syllabus binders topples over an exhausted presenter while Leo dives away.](assets/images/engineering-onboarding/comic-06-overengineered-collapse.jpeg)\n**Panel 6:** *The wrong way: the over-engineered program that collapses and gets abandoned.*\n\n![Comic panel: a distinguished new director sits among young engineers in an onboarding session while Vera watches approvingly.](assets/images/engineering-onboarding/comic-07-everyone-attends.jpeg)\n**Panel 7:** *The rule: everyone attends, at every level.*\n\n![Comic panel: close-up of Vera holding up three fingers and summarizing onboarding as simple, owned, and measured.](assets/images/engineering-onboarding/comic-08-simple-owned-measured.jpeg)\n**Panel 8:** *The closer: start simple, own it clearly, measure it quarterly.*\n"}]}]}</script>

            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
