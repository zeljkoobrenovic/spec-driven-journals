<script id="data" type="application/json">{"meta": {"id": "EXEC-HIRING", "status": "draft:gray", "title": "Hiring", "date": "2026-07-25", "author": "Željko Obrenović", "permalink": "hiring", "timetoread": "8-10 min", "excerpt": "As an executive I own the hiring system, not individual hires: documented loops, a written leveling framework, standardized compensation governance, trained interviewers and hiring managers, and monthly metrics. I resist over-optimizing a process that is already fast and stable, I show up personally only where an executive adds unique value, and I follow the process by default while breaking it deliberately when the business demands it.", "tags": "engineering executive, hiring, recruiting, leveling, compensation, leadership", "icon": "assets/icons/hiring.png", "logo": "assets/images/hiring/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "hiring", "recruiting", "leveling", "compensation", "leadership"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I own hiring as a system, not as a series of heroics. My leverage is the machine: documented interview loops with explicit rubrics, a written leveling framework with clear accountability, centralized compensation governance, trained interviewers and hiring managers, and metrics reviewed monthly. I resist over-optimizing a process that is already fast and stable, and I engage personally only where an executive adds unique value — closing key candidates and reviewing out-of-band decisions. I follow the process by default, and break it deliberately when the business demands it — the system serves the business, not the other way around.\n\n## Statement\n\nHiring is the highest-leverage system I run, and I run it as a system. My commitments:\n\n- **Establish the process.** Every role has a documented hiring loop with clear ownership (recruiter, hiring manager, approvers), explicit interview problems and scoring rubrics, trained interviewers (shadow → reverse-shadow), a strong ATS as the coordination core, and job descriptions aligned with the leveling framework.\n- **Write the leveling framework down.** Leveling is provisional early (phone screen plus experience heuristic), shapes the loop, and is finalized holistically — with clear accountability for the final decision and a defined escalation path.\n- **Standardize compensation.** The recruiter calculates offers from structured guidelines; approvers review leveling and compensation together; in-band versus out-of-band rules are explicit; governance is centralized. We do not systematically overpay to \"win\" candidates.\n- **Monitor and debug, monthly.** Recruiting updates in the weekly leadership meeting, a monthly hiring review with the recruiting lead, and four metrics reviewed monthly: hires per recruiter, time to hire, offer rate, acceptance rate.\n- **Resist over-optimizing.** If recruiters are closing roughly five or more engineers a quarter, loops are stable, and time-to-offer is two weeks or less, the process is healthy — I require a high bar before adding steps and avoid bespoke loops.\n- **Show up where the executive is the unique value.** Sell calls for senior candidates, personal support for strategically critical hires, review of out-of-band compensation requests — without slowing the process.\n- **The system serves the business.** Follow the process by default; break it deliberately when necessary, weighing the cost of overriding against the cost of delay; refine it continuously.\n\n![Pipeline diagram of a hiring system with candidates flowing through screen, loop, level, and offer stages, governed by leveling and compensation frameworks, measured by four monthly gauges, with an executive touching only sell calls and out-of-band reviews.](assets/images/hiring/hiring-system-map.jpeg)\n**Figure 1:** *The hiring machine: a governed, instrumented pipeline — the executive touches it at exactly two points.*\n\n\n## How to Read This\n\nThis record tells my hiring managers and recruiting partners what system I will build and hold them accountable to, and where I will personally engage. It is a vision of the executive role in hiring, not an interviewing handbook — question design and assessment craft live with the teams. The working checklist — process foundations, leveling, compensation governance, prioritization, training, diversity, brand, committees, and the executive quick diagnostic — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**The executive's leverage is the system, not the individual hire.** I might touch a handful of hires personally in a quarter; the system touches all of them. A written leveling framework, standardized compensation, documented loops, and trained interviewers improve every hiring decision made without me in the room — which is nearly all of them. Time spent making the system explainable, measurable, and consistent compounds; time spent substituting for it does not.\n\n![Comparison of an executive personally reaching three candidates versus adjusting a system gear whose cascading arrows reach an entire grid of candidates.](assets/images/hiring/system-vs-heroics-leverage.jpeg)\n**Figure 2:** *Leverage: personal involvement touches a handful of hires; the system touches all of them, and compounds.*\n\n\n**Over-optimizing a healthy process destroys the thing it optimizes.** Hiring processes accumulate steps the way codebases accumulate dependencies — each addition individually defensible, the sum slow and brittle. When throughput is healthy, loops are stable, and time-to-offer is fast, the correct move is to leave the process alone. I require a high bar before adding new interviews and resist unnecessary specialization, because speed and predictability are themselves competitive advantages in closing candidates.\n\n![Chart showing that as individually defensible interview steps accumulate, time to offer rises steeply and acceptance rate falls, with a dashed line marking the healthy zone.](assets/images/hiring/overoptimization-curve.jpeg)\n**Figure 3:** *Over-optimization: each step is defensible alone; the sum doubles time-to-offer and drags acceptance down.*\n\n\n**Governance beats heroics on compensation and leveling.** Case-by-case compensation \"wins\" compound into systematic overpaying and internal inequity; ad-hoc leveling compounds into title inflation and calibration debt. Centralized governance — structured offer guidelines, joint review of leveling and compensation, explicit out-of-band approval — keeps individual generosity from becoming structural unfairness. The same logic makes me cautious about hiring committees: they can help calibration at scale, but introduced casually they diffuse the accountability the system depends on. This is [Inspected Trust](inspected-trust.html) applied to hiring: the metrics review and approval visibility are the inspection forums of the hiring machine.\n\n**Hiring managers are part of the system, and the system trains them.** Unicorn job requirements, unaccountable vetoes, constant pushes for non-standard compensation, indecisiveness stretching into endless interviews, delayed engagement with strong candidates — these are red flags I watch for and address with targeted training, clear decision timelines, and reinforced accountability, not with quiet workarounds.\n\n**Balance is audited, not assumed.** Internal versus external hires, network hires versus open-market hires, representation across hiring, retention, and promotion — these drift unless tracked. I audit the balances periodically, hold Engineering leadership (not just recruiting) accountable for diversity, and keep engineering-brand investment proportional to actual hiring needs and tied to business outcomes.\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| I own the hiring system and its metrics. | I drive individual hires — the system, not my calendar, closes most candidates. |\n| I personally engage on senior sells and critical hires. | Every candidate gets executive attention — that would slow the process for no gain. |\n| Follow the process by default. | Never break it — I break it deliberately when the business demands, weighing override cost against delay cost. |\n| Resist adding steps to a fast, stable process. | Never change the process — I continuously refine it against metrics and outcomes. |\n| Centralize compensation and leveling governance. | Rigidity on every offer — out-of-band exists; it is just visible and approved, not improvised. |\n\nThe health check is the executive quick diagnostic: we can explain our leveling framework, we know our monthly metrics, time-to-offer is fast and predictable, hiring managers are accountable, compensation is consistent, we are not over-relying on networks or committees — and the process feels intentional, not accidental.\n\n## Anti-Patterns\n\n- **Unicorn job requirements.** Role descriptions demanding a combination of skills no real candidate has, guaranteeing a pipeline that trickles and a hiring manager who blames the market.\n- **The unaccountable veto.** Any interviewer able to kill a candidate without owning the decision — vetoes without accountability turn the loop into a lottery.\n- **Systematic overpaying to \"win.\"** Treating every negotiation as a must-win and compensating out-of-band by default, buying candidates at the cost of internal equity and a governance system nobody believes.\n- **Committees as responsibility diffusion.** Introducing hiring committees so no one is accountable for a decision, rather than as a deliberate calibration tool with a clarified accountability structure.\n- **Optimizing the healthy process.** Adding interview stages, bespoke loops, and novel assessments to a process that was already fast and stable — until time-to-offer doubles and acceptance rate follows.\n- **Recruiters as rewards for weakness.** Reallocating recruiter bandwidth to the weakest hiring managers by default, teaching the organization that failing at hiring earns more hiring support.\n\n## Related Records\n\n- [Engineering Onboarding](engineering-onboarding.html) — where the hiring system hands off: everything after the accepted offer.\n- [First 90 Days](first-90-days.html) — the hiring review begun during my ramp becomes this ongoing operating rhythm.\n- [Inspected Trust](inspected-trust.html) — the monthly metrics review and approval visibility are inspection applied to the hiring machine.\n- [Running Engineering Processes](run-engineering-processes.html) — the hiring system is one of the clearly owned processes the organization runs on.\n- [Measuring Engineering Organizations](measuring-engineering-organizations.html) — hiring metrics are part of what I report and review.\n\n## Scope and Revisiting\n\nThis principle governs engineering hiring wherever I am the accountable executive — the process, its governance, and my personal engagement in it. I revisit it when the monthly metrics degrade (the debug trigger), when company scale changes what the process must handle (committees and specialization earn reconsideration at scale), and whenever the quick diagnostic returns a \"no\" that persists across two reviews.\n\n## Authoritative References\n\n- Will Larson, *The Engineering Executive's Primer* (O'Reilly, 2024) — the \"Hiring\" chapter this record's checklist distills; the principle above is my operating commitment to it.\n- Will Larson, [The Engineering executive's role in hiring](https://lethain.com/eng-exec-role-in-hiring/) — the freely available companion essay.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle, grouped as the source organizes it: build the system, keep it healthy, engage where the executive adds unique value. The Article tab carries the rationale, implications, and anti-patterns.*\n\n### Establish the Hiring Process\n\n**Foundations**\n\n- [ ] Confirm whether to adapt the existing process vs. rebuild.\n- [ ] Ensure every role includes a documented hiring loop.\n- [ ] Assign clear ownership (recruiter, hiring manager, approvers).\n\n**Infrastructure**\n\n- [ ] Implement a strong ATS (core coordination system).\n- [ ] Maintain centralized hiring documentation.\n- [ ] Create visibility into approvals and exceptions.\n\n**Interview Design**\n\n- [ ] Define clear interview problems/questions.\n- [ ] Create explicit scoring rubrics for each interview.\n- [ ] Standardize interview questions where appropriate.\n- [ ] Document full interview loops per role.\n- [ ] Train interviewers (shadow → reverse-shadow model).\n\n**Leveling Framework**\n\n- [ ] Define the written leveling framework.\n- [ ] Decide when leveling occurs (provisional + final).\n- [ ] Establish a clear escalation path for leveling decisions.\n- [ ] Clarify who approves which levels.\n\n**Job Descriptions**\n\n- [ ] Create a standardized job description template.\n- [ ] Maintain shared job description library.\n- [ ] Keep JDs aligned with the leveling framework.\n\n### Avoid Over-Optimizing the Process\n\n- [ ] Recruiters hiring ≥ ~5 engineers per quarter (if not headcount constrained).\n- [ ] Interview loops are stable (not constantly changing).\n- [ ] Time-to-offer ≤ 2 weeks from first interview.\n- [ ] Require a high bar before adding new steps/interviews.\n- [ ] Avoid unnecessary specialization or bespoke loops.\n\n### Monitor & Debug the Process\n\n**Ongoing Oversight**\n\n- [ ] Include recruiting updates in the weekly leadership meeting.\n- [ ] Hold a monthly hiring review with the recruiting lead.\n- [ ] Maintain visibility into all hiring approvals.\n- [ ] Personally review out-of-band compensation requests.\n\n**Metrics (Review Monthly)**\n\n- [ ] Hires per recruiter (throughput)\n- [ ] Time to hire\n- [ ] Offer rate\n- [ ] Acceptance rate\n\n### Help Close Key Candidates\n\n- [ ] Make yourself available for senior candidate sell calls.\n- [ ] Insert the executive sell step by default for senior roles (optional, not mandatory).\n- [ ] Personally support strategically critical hires.\n- [ ] Avoid slowing process unnecessarily.\n\n### Level Candidates Effectively\n\n- [ ] Provisionally level early (phone screen + experience heuristic).\n- [ ] Customize the interview loop based on the provisional level.\n- [ ] Final level based on holistic evaluation.\n- [ ] Define clear accountability for the final leveling decision.\n- [ ] Avoid committee overreach unless scale demands it.\n\n### Standardize Compensation Decisions\n\n- [ ] The recruiter calculates the offer using structured guidelines.\n- [ ] Approvers review leveling + compensation together.\n- [ ] Define approval rules for in-band vs. out-of-band offers.\n- [ ] Centralize compensation governance.\n- [ ] Avoid systematic overpaying to \"win\" candidates.\n\n### Manage Hiring Prioritization\n\n- [ ] Allocate recruiter bandwidth intentionally.\n- [ ] Align hiring priorities with the headcount plan.\n- [ ] Avoid reallocating recruiters to the weakest hiring managers.\n- [ ] Monitor recruiter-to-open-role ratio.\n\n### Train Hiring Managers\n\n- Watch for these red flags:\n\n- [ ] Unrealistic \"unicorn\" requirements\n- [ ] Any interviewer can veto without accountability\n- [ ] Constant push for non-standard compensation\n- [ ] Indecisiveness → endless interviews\n- [ ] Delayed engagement with strong candidates\n\n- Actions:\n\n- [ ] Run targeted training sessions.\n- [ ] Set clear expectations for decision timelines.\n- [ ] Reinforce hiring manager accountability.\n\n### Balance Internal, External & Network Hiring\n\n- [ ] Track internal vs. external hires.\n- [ ] Avoid over-reliance on personal networks.\n- [ ] Avoid exclusively external senior hiring.\n- [ ] Ensure fair evaluation of internal candidates.\n- [ ] Periodically audit imbalance across teams.\n\n### Improve Diversity Responsibly\n\n- [ ] Track representation across hires, retention, and promotion.\n- [ ] Do not offload diversity accountability solely to recruiting.\n- [ ] Hold Engineering leadership accountable.\n- [ ] Monitor retention of diverse hires.\n\n### Build Engineering Brand (If Needed)\n\n- [ ] Assess whether brand investment is necessary.\n- [ ] Keep investment proportional to hiring needs.\n- [ ] Tie branding work to clear business outcomes.\n\n### Consider Hiring Committees Carefully\n\n- [ ] Clarify the accountability structure before introducing.\n- [ ] Evaluate tradeoff: consistency vs. speed.\n- [ ] Prevent diffusion of responsibility.\n- [ ] Use committees for calibration if needed — not as the default.\n\n### Remember: The System Serves You\n\n- [ ] Follow the process by default.\n- [ ] Break the process deliberately when necessary.\n- [ ] Weigh the cost of overriding vs. the cost of delay.\n- [ ] Continuously refine the system.\n- [ ] Ensure the system supports business outcomes.\n\n### Executive Quick Diagnostic\n\n- If you can answer \"yes\" to these, your system is healthy:\n\n- [ ] We can clearly explain our leveling framework.\n- [ ] We know our monthly hiring metrics.\n- [ ] Time-to-offer is fast and predictable.\n- [ ] Hiring managers are accountable for decisions.\n- [ ] Compensation decisions are consistent.\n- [ ] We aren't over-relying on networks or committees.\n- [ ] Our process feels intentional — not accidental.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why the executive's hiring leverage is the machine, not the heroics — in seven panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Leo sprints down a hallway with a huge stack of resumes while Vera watches from a doorway.](assets/images/hiring/comic-01-hero-hiring.jpeg)\n**Panel 1:** *The hook: hiring as heroics — the executive tries to be everywhere.*\n\n![Comic panel: Vera compares a lone figure reaching three candidates with a conveyor carrying many candidates.](assets/images/hiring/comic-02-system-touches-all.jpeg)\n**Panel 2:** *The problem: personal effort touches a few hires; the system touches them all.*\n\n![Comic panel: Vera adjusts one of four gears labeled Loops, Rubrics, Leveling, and Comp while Leo takes notes.](assets/images/hiring/comic-03-own-the-machine.jpeg)\n**Panel 3:** *The principle: own the machine — documented, governed, trained.*\n\n![Comic panel: a candidate checks her watch on an obstacle course of hurdles while Leo adds another hurdle and Vera facepalms.](assets/images/hiring/comic-04-overoptimizing.jpeg)\n**Panel 4:** *The wrong way: over-optimizing a process that was already fast and stable.*\n\n![Comic panel: Vera and a recruiting lead review four round gauges on a wall next to a monthly calendar.](assets/images/hiring/comic-05-monthly-metrics.jpeg)\n**Panel 5:** *The instrument panel: four metrics, reviewed every month.*\n\n![Comic panel: Vera takes a warm video call with a senior candidate while the hiring machine runs on its own behind her.](assets/images/hiring/comic-06-executive-unique-value.jpeg)\n**Panel 6:** *The exception: show up personally only where the executive is the unique value.*\n\n![Comic panel: close-up of Vera tapping her notebook and saying the system serves the business.](assets/images/hiring/comic-07-serves-the-business.jpeg)\n**Panel 7:** *The closer: follow the process by default; break it deliberately, never accidentally.*\n"}]}]}</script>

                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
