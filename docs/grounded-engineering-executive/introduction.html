to a role, how I set strategy, how I run processes and meetings, how I hire, how I handle conflict at the executive table, and how I keep the whole thing sustainable. Twenty-one records, each one an operating principle I am prepared to be held to.\n\n## Why Write It Down\n\nThree reasons, in increasing order of importance.\n\n**Alignment is cheaper in writing.** An operating model that lives in my head has to be re-explained in every 1:1, re-negotiated in every conflict, and re-discovered by every new colleague. A written record is explained once, linked forever, and read before the meeting instead of litigated during it.\n\n**Writing forces the argument.** A preference can stay vague; a published principle cannot. Each record has to survive its own *Rationale* section — why this way and not the obvious alternative — and its own *Anti-Patterns* section, which names the failure modes I am explicitly steering away from. Several drafts did not survive that test, which is the point.\n\n**A written model is inspectable.** [Inspected Trust](inspected-trust.html) commits me to verifying my organization's work — and to making my own work inspectable in return. This journal is that commitment applied to myself: the principles are public, the checklists are concrete enough to check me against, and discrepancies between what I wrote and what I do are legitimate things to raise with me.\n\n![Split diagram contrasting an unwritten operating model producing distorted copies through repeated retellings with a single written record that everyone links to and one person inspects with a magnifying glass.](assets/images/introduction/spoken-vs-written-model.jpeg)\n**Figure 1:** *Why write it down: retellings drift; a written record is explained once, linked forever — and inspectable.*\n\n\n## What a Record Looks Like\n\nEvery record follows the same shape, so you always know where to look:\n\n| Part | What it gives you |\n| --- | --- |\n| **Status / Principle** blockquote | The whole principle in one quotable paragraph — read only this and you have the direction. |\n| **Statement → Rationale → Anti-Patterns** | The ADR-shaped body: what I commit to, why, what it does *not* say, and the failure modes it guards against. |\n| **Checklist** tab | The operational working checklist — grouped, checkable actions. The article is the argument; this is the part I actually run. |\n| **Comic** tab | An eight-panel explainer with a recurring cast — the two-minute version, built to be shared. |\n| **View spec** link | The authoring contract behind the post — intent, success criteria, and a decision log, versioned like everything else. |\n\nEvery record carries `status: draft`. That is honest, not tentative: these principles are written ahead of being fully tested in the role, and each one names the conditions under which I will revisit it.\n\n![Exploded-layer diagram of one record: a quotable principle box atop an argument document, Checklist and Comic tabs at the side, and a faint spec blueprint behind everything.](assets/images/introduction/record-anatomy.jpeg)\n**Figure 2:** *The anatomy of a record: principle up front, argument behind it, the runnable and shareable versions one tab away — and the spec as the contract underneath.*\n\n\n## Where the Material Comes From\n\nThe vision is mine; the grounding is borrowed openly. Each record starts from one chapter of Will Larson's *The Engineering Executive's Primer* (O'Reilly, 2024) and its distilled working checklist, and each credits the matching freely available essay on lethain.com. What the records add is commitment: Larson describes what engineering executives do; these pages state what *I* will do, in first person, with the trade-offs I accept and the anti-patterns I reject. Where my practice disagrees with the book, the record says so.\n\n## The Map\n\nThe six sections follow the arc of the job:\n\n- **Getting the Role** — the search and the landing: [Getting the Job](getting-the-job.html), [First 90 Days](first-90-days.html).\n- **Setting Direction** — strategy, planning, values, and measurement: [Engineering Strategy](engineering-strategy.html), [Planning](planning.html), [Organizational Values](organizational-values.html), [Measuring Engineering Organizations](measuring-engineering-organizations.html).\n- **Operating the Organization** — the day-to-day machinery: [Running Engineering Processes](run-engineering-processes.html), [Meetings](meetings.html), [Internal Communication](internal-communication.html), [Calibrating Your Standards](calibrating-your-standards.html), [Inspected Trust](inspected-trust.html).\n- **Talent** — building the team: [Hiring](hiring.html), [Engineering Onboarding](engineering-onboarding.html).\n- **Working with Peers and the Business** — everything beyond my own org: [Working with Your CEO, Peers, and Engineering](working-with-your-ceo-peers-and-engineering.html), [Gelling Your Engineering Leadership Team](gelling-your-engineering-leadership-team.html), [Onboarding Peer Executives](onboarding-peer-executives.html), [Your Network](your-network.html), [Mergers and Acquisitions](mergers-and-acquisitions.html).\n- **Leading Yourself** — the sustainable executive: [Leadership Styles](leadership-styles.html), [Managing Priorities and Energy](managing-energy.html), [Personal and Organizational Prestige](personal-and-organizational-prestige.html).\n\nThe records cross-link heavily, because the principles are not independent: inspection draws on the trust built in the first 90 days; strategy constrains planning; energy management is what makes all of it survivable. Follow the links rather than the section order if a thread pulls you.\n\n![Six labeled stations along an arc from getting the role to leading yourself, with faint threads cross-connecting non-adjacent stations.](assets/images/introduction/journal-map.jpeg)\n**Figure 3:** *The map: six sections along the arc of the job — and the cross-links that make it a web, not a sequence.*\n\n\n## How to Read This Journal\n\n- **If you are deciding whether to work with me** — read the Status/Principle blockquotes across the sections that matter to you; that is the whole model in fifteen minutes. [Working with Your CEO, Peers, and Engineering](working-with-your-ceo-peers-and-engineering.html) and [Inspected Trust](inspected-trust.html) are the two that most define the experience of working with me.\n- **If you are on my team** — start with [Inspected Trust](inspected-trust.html) and [Calibrating Your Standards](calibrating-your-standards.html); they explain the behaviors you will actually observe, and the *How to Read This* section of each record is addressed to you.\n- **If you are an engineering leader building your own model** — take the checklists; they are the transferable part. The principles are deliberately personal, and disagreeing with them is a fine way to find your own.\n- **If you have two minutes** — open any record's Comic tab.\n\n## Status and Revisiting\n\nThis journal is a living document. Records move from `draft` to `accepted` as practice tests them, each one on the revisiting conditions it declares for itself — and this introduction gets updated whenever the journal's shape changes.\n\n## Authoritative References\n\n- Will Larson, *The Engineering Executive's Primer* (O'Reilly, 2024) — the book whose chapter checklists ground every record here.\n- Will Larson, [lethain.com](https://lethain.com/tags/executive/) — the freely available companion essays, credited individually in each record.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "The operating model, written down — what this journal is and how to read it, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Leo and two colleagues whisper in a corridor, each with a different contradictory guess about how the new executive operates.](assets/images/introduction/comic-01-guessing-game.jpeg)\n**Panel 1:** *The hook: an unwritten operating model gets reverse-engineered from meetings.*\n\n![Comic panel: a game of telephone where a speech bubble grows more distorted with each retelling while Vera winces.](assets/images/introduction/comic-02-drifting-copies.jpeg)\n**Panel 2:** *The problem: alignment by retelling degrades one conversation at a time.*\n\n![Comic panel: Vera hands Leo a softly glowing bound journal with six section icons on its cover.](assets/images/introduction/comic-03-written-down.jpeg)\n**Panel 3:** *The move: publish the operating model instead of narrating it.*\n\n![Comic panel: Vera points her pen at an open journal page showing a quote box, argument text, and two side tabs with checkbox and comic icons.](assets/images/introduction/comic-04-record-anatomy.jpeg)\n**Panel 4:** *Every record, same anatomy: read only the top box and you have the direction.*\n\n![Comic panel: Leo compares a checklist page of the journal against a whiteboard of Vera's actual work while she stands comfortably inviting it.](assets/images/introduction/comic-05-hold-me-to-it.jpeg)\n**Panel 5:** *A contract, not a memoir: written concretely enough to be checked.*\n\n![Comic panel: Vera and Leo study a wall map of six icon-marked stations along a path with threads criss-crossing between them.](assets/images/introduction/comic-06-six-stations.jpeg)\n**Panel 6:** *The map: getting the role, direction, operating, talent, peers, yourself.*\n\n![Comic panel: Vera annotates a journal page stamped as draft, crossing out a line and writing a margin correction while Leo watches.](assets/images/introduction/comic-07-drafts-on-purpose.jpeg)\n**Panel 7:** *Living records: draft is honest, and practice does the editing.*\n\n![Comic panel: close-up of Leo starting his own blank notebook with Vera's journal propped open beside it.](assets/images/introduction/comic-08-write-your-own.jpeg)\n**Panel 8:** *The closer: take the checklists, argue with the principles, write your own.*\n"}]}]}</script>

    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
