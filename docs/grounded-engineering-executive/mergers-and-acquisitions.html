<script id="data" type="application/json">{"meta": {"id": "EXEC-MERGERS-AND-ACQUISITIONS", "status": "draft:gray", "title": "Mergers and Acquisitions", "date": "2026-07-25", "author": "Željko Obrenović", "permalink": "mergers-and-acquisitions", "timetoread": "8-10 min", "excerpt": "In M&A, strategy comes before deals: I do not start evaluating an acquisition until the business strategy and a written, deal-specific thesis exist. Engineering due diligence is a disciplined evaluation run against that thesis, the integration plan is drafted before closing, and when I am overruled I document my dissent professionally — from a company perspective, not an engineering one. My final sanity check: would I still approve the deal if I had to personally run the integration?", "tags": "engineering executive, mergers and acquisitions, due diligence, integration, strategy, leadership", "icon": "assets/icons/mna.png", "logo": "assets/images/mergers-and-acquisitions/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "mergers and acquisitions", "due diligence", "integration", "strategy", "leadership"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: In M&A, strategy comes before deals. I do not start evaluating an acquisition until the business strategy and a written, deal-specific acquisition thesis exist; engineering due diligence is a disciplined evaluation of implementation, IP, security, compliance, integration mismatches, costs, and culture run against that thesis; and the integration plan is drafted before closing, not after. Engineering's job is to validate assumptions and price integration honestly — and when I am overruled, I document my dissent professionally, from a company perspective, not an engineering one. My final sanity check: would I still approve this deal if I had to personally run the integration?\n\n## Statement\n\nWhen my company considers acquiring — or being acquired — my participation follows four commitments:\n\n- **Strategy before deals.** No evaluation starts until we can say, in writing, how M&A supports the company's strategy: which business lines we are in, what role acquisitions play (growth, new markets, acquihire, reduced competition), what deal types and sizes are acceptable — and until the executive team is aligned on that document.\n- **A written, deal-specific thesis.** For each deal: how exactly it fits the strategy, whether it is a permanent pillar or an interim accelerant, which assumptions must hold for it to succeed — documented explicitly — and a valuation that reflects integration cost and risk, not just upside.\n- **Disciplined engineering evaluation.** Seven areas — product implementation, intellectual property, security, compliance, integration mismatches, costs and scalability, and engineering culture — evaluated with a standard template customized to this deal's thesis, and synced with Finance and Legal before I make a recommendation.\n- **Integration planned before closing.** The baseline approach (run as-is, then consolidate?), the technology path (rewrite, API integration, coexistence, multi-stack tolerance), team and leadership integration — decided and documented before signatures, not discovered after.\n\n![A deal token passes four gates labeled Strategy, Thesis, Evaluation, and Integration plan before reaching Close, while a shortcut arrow straight to Close is blocked.](assets/images/mergers-and-acquisitions/deal-gates.jpeg)\n**Figure 1:** *The order of operations: strategy, thesis, evaluation, and integration plan all gate the signature — there is no shortcut to Close.*\n\n\n## How to Read This\n\nThis record tells CEOs, CFOs, and corp-dev peers what Engineering will and will not sign off on in a deal, and gives my own leadership team the frame we use when one appears. The full diligence questions and process discipline live in the **Checklist** tab of this post. This is not legal or financial advice — deal structures, tax, and securities stay with Legal and Finance — and the strategy that M&A must serve gets written per [Engineering Strategy](engineering-strategy.html).\n\n## Rationale\n\n**Deals evaluated without a written thesis drift.** An acquisition under discussion generates its own momentum: bankers produce narratives, founders sell visions, and every meeting adds sunk cost. Without a written statement of what must be true for the deal to make sense, the evaluation quietly becomes a search for reasons to say yes. The thesis is the anchor — it turns diligence from impression-gathering into validating or invalidating specific, documented assumptions.\n\n**Valuation must price integration, not just upside.** The upside of a deal is presented; the integration is lived. Stack mismatches, long-term vendor contracts, compliance gaps, fragile systems held together by shortcuts, incompatible operating models — each is a real cost that lands on Engineering after closing. If the valuation reflects only the upside, the company is systematically overpaying, and Engineering is the only function positioned to say so with evidence. That is why the diligence areas are questions about substance: is the implementation real and production-grade or a wrapper on third-party APIs? Does the claimed IP actually exist and does the company own it? Who owns security, and how would they detect a breach? Are compliance controls actually operational? How painful would stack consolidation be — and would separate stacks create long-term subcultures? What does it cost to generate each dollar of revenue, and can the product scale without a rewrite? How are technical decisions actually made, and is the cultural friction manageable?\n\n![An iceberg whose small tip is labeled Upside with a price tag, while the larger underwater mass carries integration costs like stack mismatch, vendor contracts, compliance gaps, fragile systems, and culture friction.](assets/images/mergers-and-acquisitions/valuation-iceberg.jpeg)\n**Figure 2:** *Pricing the whole iceberg: the upside is presented, but the integration below the waterline is what Engineering lives with.*\n\n\n**Sunk-cost bias is the failure mode to guard against.** By the time Engineering's evaluation lands, the company has often spent months and real money on the deal. The pressure is to confirm, not to evaluate. My guards are procedural: assumptions documented before diligence, a standard template customized to the thesis, meetings limited to high-value sessions, and an explicit self-check — am I confident we are not falling into sunk-cost bias? The same discipline applies to my own resistance: I separate emotional reluctance from real risk before I argue either way.\n\n**Dissent is a company act, not an engineering veto.** I articulate risks from a company perspective, not just Engineering's. And when the executive team decides against my recommendation, I document my concerns professionally and then support the decision — the disagree-and-commit posture of [Working with Your CEO, Peers, and Engineering](working-with-your-ceo-peers-and-engineering.html). A documented dissent protects the company's learning either way; an undocumented grudge protects nothing.\n\n**The same honesty applies when we are the ones being acquired.** Understanding the acquirer's actual view of the deal (business, product, or acquihire), protecting the team's compensation, clarifying reporting lines, being honest about whether there is a meaningful role for me — the principle does not change sides when the table turns, and helping the team prepare for the transition is part of the job.\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| No deal evaluation before strategy and a written thesis exist. | Engineering vetoes deals — I inform the decision; the executive team makes it. |\n| Valuation must reflect integration cost and risk. | Every integration risk kills a deal — known and manageable is acceptable. |\n| Diligence validates documented assumptions against the thesis. | Diligence is exhaustive — I limit meetings to high-value sessions and request documentation in advance. |\n| The integration plan is drafted before closing. | Integration must mean consolidation — running as-is or long-term multi-stack tolerance are legitimate, explicit choices. |\n| Overruled dissent is documented professionally. | Overruled dissent is relitigated — once documented, I commit to making the deal work. |\n\nThe last gate is the **final sanity check** before recommending \"yes\": does this acquisition clearly advance our strategy? Are the integration costs realistic? Are the biggest risks known and manageable? And — the question that keeps the other three honest — would I still approve this deal if I had to personally run the integration?\n\n![A four-layer funnel of questions about strategy, costs, and risks, narrowing to the question would I run it myself, with a Yes token emerging at the bottom.](assets/images/mergers-and-acquisitions/final-sanity-check.jpeg)\n**Figure 3:** *The final sanity check: four questions gate the recommendation, and the personal-integration question keeps the other three honest.*\n\n\n## Anti-Patterns\n\n- **Thesis-free diligence.** Evaluating a deal because it appeared, retrofitting the rationale afterward. Without written assumptions there is nothing to validate — only impressions to collect.\n- **Upside-only valuation.** Pricing the deal on the pitch deck's future while treating integration cost, compliance gaps, and stack consolidation pain as post-closing details.\n- **Diligence theater.** Weeks of meetings that build familiarity instead of testing assumptions — no template, no advance documentation, no clear sync with Finance and Legal before the recommendation.\n- **Integration as an afterthought.** Closing first, then discovering nobody decided where the acquired Head of Engineering reports, whether teams merge, or whether the stack lives or dies — burning the acquired team's morale in the confusion.\n- **The engineering veto.** Framing my objections purely in engineering terms — stack elegance, technology preference — instead of company terms: cost, risk, strategy fit.\n- **Sunk-cost surrender.** Recommending \"yes\" because the company has already invested too much in evaluating the deal to walk away — the exact bias the written thesis exists to catch.\n\n## Related Records\n\n- [Engineering Strategy](engineering-strategy.html) — the strategy a deal must serve, and the frame the integration's technology choices must align with.\n- [Working with Your CEO, Peers, and Engineering](working-with-your-ceo-peers-and-engineering.html) — the disagree-and-commit posture my documented dissent belongs to.\n- [Onboarding Peer Executives](onboarding-peer-executives.html) — how incoming acquired leaders get set up for success after closing.\n- [Engineering Onboarding](engineering-onboarding.html) — the machinery that receives acquired engineers once teams integrate.\n- [Measuring Engineering Organizations](measuring-engineering-organizations.html) — the cost-per-dollar-of-revenue lens applied to a target's engineering organization.\n\n## Scope and Revisiting\n\nThis principle governs my participation in M&A from either side of the table — evaluating targets as an acquirer and navigating being acquired. I revisit it after each deal (closed or walked away from): which assumptions the thesis missed, where diligence over- or under-invested, and how the integration plan survived contact with reality.\n\n## Authoritative References\n\n- Will Larson, *The Engineering Executive's Primer* (O'Reilly, 2024) — the \"Mergers and Acquisitions\" chapter this record's checklist distills; the principle above is my operating commitment to it.\n- Will Larson, [Engineering's role in Mergers & Acquisitions](https://lethain.com/engineering-in-mergers-and-acquisition/) — the freely available companion essay.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle, ordered the way a deal unfolds — strategy, thesis, evaluation, integration, judgment. The Article tab carries the rationale, implications, and anti-patterns.*\n\n### Establish Business Strategy (Before Evaluating Any Deal)\n\n**Clarify how M&A supports the company's strategy**\n\n- [ ] Are our business lines clearly defined?\n- [ ] What are revenue and cash-flow expectations per line?\n- [ ] What role should M&A play?\n  - [ ] Accelerate growth.\n  - [ ] Enter new markets.\n  - [ ] Acquihire.\n  - [ ] Reduce competition.\n  - [ ] Other.\n- [ ] Are we pursuing:\n  - [ ] Acquihires (talent).\n  - [ ] Product acquisitions.\n  - [ ] Full business acquisitions.\n- [ ] What deal sizes/stages are acceptable?\n- [ ] Is this written down and aligned with the executive team?\n\n### Define the Acquisition Thesis (Deal-Specific)\n\n**What must be true for this deal to make sense?**\n\n- [ ] How exactly does this acquisition fit our strategy?\n- [ ] Is this about time-to-market acceleration?\n- [ ] Is this a permanent product pillar or an interim solution?\n- [ ] What assumptions must hold true for the deal to succeed?\n- [ ] Have we documented those assumptions explicitly?\n- [ ] Does the valuation reflect integration cost and risk (not just upside)?\n\n### Engineering Evaluation\n\n**A. Product Implementation**\n\n- [ ] Is the implementation real and production-grade?\n- [ ] Is it first-party IP, or is it primarily built on third-party APIs?\n- [ ] Have we reviewed the actual source code?\n- [ ] Is architecture scalable and maintainable?\n- [ ] Are there hidden technical shortcuts or fragile systems?\n\n**B. Intellectual Property**\n\n- [ ] Do claimed patents/IP actually exist?\n- [ ] Does the company truly own its core IP?\n- [ ] Are there licensing risks?\n- [ ] Have engineers validated the technical substance behind the IP?\n\n**C. Security**\n\n- [ ] Who owns security?\n- [ ] Are regular penetration tests conducted?\n- [ ] When was the last test? What were the findings?\n- [ ] Is there employee security training?\n- [ ] Have there been breaches?\n- [ ] How would they detect a breach?\n- [ ] Is sensitive data handled properly?\n\n**D. Compliance**\n\n- [ ] What certifications exist? (SOC 2 Type II, HIPAA, HITRUST, etc.)\n- [ ] Are audit reports available for the last 2–3 years?\n- [ ] Are controls actually operational?\n- [ ] Are there compliance gaps that affect valuation?\n\n**E. Integration Mismatches**\n\n- [ ] What is their cloud vendor? (AWS, GCP, Azure, on-prem)\n- [ ] What is their core tech stack?\n- [ ] How different is it from ours?\n- [ ] Are there long-term vendor contracts?\n- [ ] How painful would stack consolidation be?\n- [ ] Would separate stacks create long-term subcultures?\n\n**F. Costs & Scalability**\n\n- [ ] What are the total Engineering costs over time?\n- [ ] What does it cost to generate each dollar of revenue?\n- [ ] Are there economies or dysfunctions of scale?\n- [ ] How scalable is infrastructure?\n- [ ] Can the product scale without a rewrite?\n- [ ] Have Finance + Engineering modeled long-term cost structure?\n\n**G. Engineering Culture**\n\n- [ ] How are technical decisions made?\n- [ ] How are teams structured?\n- [ ] Is decision-making centralized or distributed?\n- [ ] Who are the real influencers?\n- [ ] How compatible are operating models?\n- [ ] Is friction manageable?\n\n### Process Discipline\n\n- [ ] Do we use a standard Engineering evaluation template?\n- [ ] Did we customize it to this deal's thesis?\n- [ ] Did we request documentation in advance?\n- [ ] Did we limit meetings to high-value sessions?\n- [ ] Did we validate or invalidate key assumptions?\n- [ ] Did we sync clearly with Finance and Legal before the recommendation?\n\n### Integration Plan (Before Closing)\n\n**Baseline Integration Approach**\n\n- [ ] Will we run the acquired stack \"as-is\" initially? (e.g., 6 months)\n- [ ] Do we have a consolidation timeline?\n- [ ] Are integration risks documented?\n\n**Technology Integration**\n\n- [ ] Full rewrite?\n- [ ] API integration?\n- [ ] Temporary coexistence?\n- [ ] Long-term multi-stack tolerance?\n- [ ] Does this align with our Engineering strategy?\n\n**Team Integration**\n\n- [ ] Where does the acquired Head of Engineering report?\n- [ ] Are teams merged or kept separate?\n- [ ] Is infrastructure/security/data centralized?\n- [ ] Is role clarity communicated early?\n\n**Leadership Integration**\n\n- [ ] Are senior leaders' roles defined?\n- [ ] Have we aligned expectations privately?\n- [ ] Are we setting up new leaders for success?\n- [ ] Are we protecting the morale of existing teams?\n\n### Executive Judgment & Dissent\n\n- [ ] Have I clearly articulated risks from a company perspective (not just Engineering)?\n- [ ] Have I separated emotional resistance from real risk?\n- [ ] If overruled, did I document concerns professionally?\n- [ ] Am I confident we're not falling into sunk-cost bias?\n\n### If You Are Being Acquired\n\n- [ ] Do we understand the acquirer's view of the deal? (business, product, acquihire)\n- [ ] Have we protected team compensation packages?\n- [ ] Have we clarified reporting lines?\n- [ ] Is there a meaningful role for me?\n- [ ] If required to stay, is compensation appropriate?\n- [ ] Have we helped the team prepare for transition?\n\n### Final Sanity Check\n\n**Before recommending \"yes\":**\n\n- [ ] Does this acquisition clearly advance our strategy?\n- [ ] Are integration costs realistic?\n- [ ] Are the biggest risks known and manageable?\n- [ ] Would I still approve this deal if I had to personally run the integration?\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "What Engineering actually does in an acquisition — anchor the deal to a written thesis and price the integration honestly.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Leo waves a rocket-covered pitch deck while Vera holds up an empty page and asks for the written thesis.](assets/images/mergers-and-acquisitions/comic-01-the-exciting-deal.jpeg)\n**Panel 1:** *The hook: before excitement, a written thesis — or no evaluation at all.*\n\n![Comic panel: a snowball labeled Deal rolls downhill collecting papers and dollar signs as Vera warns that deals generate their own momentum.](assets/images/mergers-and-acquisitions/comic-02-deal-momentum.jpeg)\n**Panel 2:** *The problem: without an anchor, diligence becomes a search for reasons to say yes.*\n\n![Comic panel: Vera lifts a cloth to reveal a hidden anchor labeled Integration chained to a shiny rocket being priced on its pedestal.](assets/images/mergers-and-acquisitions/comic-03-upside-only-pricing.jpeg)\n**Panel 3:** *Anti-pattern: upside-only valuation — the pitch is presented, the integration is lived.*\n\n![Comic panel: Vera pins a thesis sheet with a bullseye icon above three checkbox sticky notes, saying write what must be true.](assets/images/mergers-and-acquisitions/comic-04-the-written-thesis.jpeg)\n**Panel 4:** *The principle: a written thesis turns diligence into testing assumptions, not collecting impressions.*\n\n![Comic panel: Vera opens a sports car hood to reveal a hamster wheel and tangled cables, asking if it is a real engine or a wrapper.](assets/images/mergers-and-acquisitions/comic-05-under-the-hood.jpeg)\n**Panel 5:** *Diligence is about substance: is the implementation real, owned, secure, and scalable?*\n\n![Comic panel: Vera holds back a contract signing while pointing at a map of two roads merging into one, insisting on the integration plan first.](assets/images/mergers-and-acquisitions/comic-06-plan-before-signing.jpeg)\n**Panel 6:** *Integration is planned before closing — never discovered after.*\n\n![Comic panel: outvoted at the executive table, Vera files a dissent note into a flagged folder and rolls up her sleeves to support the decision.](assets/images/mergers-and-acquisitions/comic-07-documented-dissent.jpeg)\n**Panel 7:** *Dissent is a company act: document it professionally, then commit.*\n\n![Comic panel: Vera holds the deal folder before a mirror where her reflection wears a hard hat, asking if she would run the integration herself.](assets/images/mergers-and-acquisitions/comic-08-the-sanity-check.jpeg)\n**Panel 8:** *Closer: approve only the deal whose integration you would personally run.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
