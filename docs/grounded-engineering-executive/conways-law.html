<script id="data" type="application/json">{"meta": {"id": "EXEC-CONWAYS-LAW", "status": "draft:gray", "title": "Conway's Law", "date": "2026-07-26", "author": "Željko Obrenović", "permalink": "conways-law", "timetoread": "8 min", "excerpt": "I treat organizational design as my most powerful architectural decision. Systems mirror the communication structures that build them, so I shape team structures to produce the architecture we want — the reverse Conway maneuver — and I treat unnecessary cross-team communication as a design smell, not a virtue. Tool choices and shared services are architectural decisions too, whether or not anyone calls them that.", "tags": "engineering executive, team topologies, Conway's law, architecture, organization design", "icon": "assets/icons/conways-law.png", "logo": "assets/images/conways-law/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "team topologies", "Conway's law", "architecture", "organization design"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I treat organizational design as my most powerful architectural decision. Systems mirror the communication structures that build them, so I harness the force instead of fighting it: I clarify the architecture we actually want, then shape team boundaries to produce it — the reverse Conway maneuver. I treat unnecessary cross-team communication as a design smell rather than a virtue, involve technical leaders in every team-structure decision, and read tool choices and shared services as architecture in disguise.\n\n## Statement\n\nMy operating model for Conway's law has five parts:\n\n- **Architecture first, org chart second.** We define the architecture we actually want — designed for fast flow of change, not just technical elegance. Team design and software design are one decision, made together.\n- **Audit the force before it audits you.** I regularly ask whether our current structure could even produce the architecture we want — and the sharper version: *is there a better design unavailable to us because of our organization?*\n- **Run the reverse Conway maneuver.** When structure and target architecture disagree, I change the structure. Teams are arranged around business capabilities, own their part of the system, and deliver from design through deployment with minimal handoffs.\n- **Treat communication as expensive bandwidth.** Teams should talk because of real dependencies, not because poor boundaries force them to. When two teams must constantly coordinate, I fix the API or the boundary before I schedule another sync.\n- **Read tools as architecture.** Shared teams, databases, and tools are coupling forces. Shared tooling belongs where collaboration is actually needed; separate tools where boundaries should be clean.\n\n![Mirror-image diagram showing an org chart of communicating teams on one side and a software architecture with the identical shape on the other.](assets/images/conways-law/mirror-org-architecture.jpeg)\n**Figure 1:** *Conway's law: the system you ship mirrors the communication structure that built it — same shape on both sides of the mirror.*\n\n## How to Read This\n\nThis is an **appendix record**: unlike the core records in this journal, grounded in Will Larson's *The Engineering Executive's Primer*, this one is grounded in Matthew Skelton and Manuel Pais's *Team Topologies* — read here through an executive lens, complementing the Primer-grounded records. I read the book as the executive who signs off on both the org chart and the architecture, and therefore cannot pretend they are separate documents. If you work in my organization, this record explains why reorg proposals get architectural review and why I ask \"which teams will have to talk for this to ship?\" before approving a system design. The working checklist — all nine sections — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**The force is real whether or not I acknowledge it.** Organizations produce designs that copy their communication structures: if the teams owning two components barely talk, the interface between them will be wrong; if one team owns both halves, they will merge. Every org chart I approve is therefore an architecture diagram in draft form. Ignoring the force does not neutralize it — it hands the architectural decision to whoever last drew the reporting lines.\n\n**Since the force is inevitable, I point it at the target.** The naive reading of Conway's law is fatalistic: we will ship our org chart, so be it. The executive reading is the reverse Conway maneuver: decide the architecture we want, then shape team boundaries so that the natural, low-friction thing to build *is* that architecture. This is why technical leaders belong in every team-structure conversation, and why boundaries drawn by budget or politics are architectural malpractice — still architecture, just accidental.\n\n![Three-step sequence: target architecture sketched first, teams reshaped to match it, and the resulting system mirroring the target.](assets/images/conways-law/reverse-conway-maneuver.jpeg)\n**Figure 2:** *The reverse Conway maneuver: design the team structure first, so the architecture you want is the one the organization naturally produces.*\n\n**Fast flow needs bounded teams, not busy channels.** The point of the maneuver is flow: clear, bounded responsibility per team; components loosely coupled and highly cohesive; version expectations and cross-team testing explicit; changes shipped safely without excessive coordination. Every handoff and mandatory sync is latency built into the org chart. Centralized specialist teams are queues every dependent team must stand in, so I reduce reliance on them wherever a stream-aligned team can own the capability directly.\n\n**Unnecessary communication is a symptom, not a KPI.** Most organizations celebrate communication — more meetings, more channels, more alignment. I read it differently: if two teams designed to be independent are in constant contact, the boundary between them is wrong. The fix is rarely a coordination forum; it is a better API, a platform, or a redrawn boundary that removes the need to coordinate. Well-defined paths between the *right* teams are deliberate design; everything else is accidental chatter coupling the systems underneath it.\n\n![Side-by-side contrast of five teams tangled in chaotic communication lines versus the same teams linked by a few deliberate interface lines.](assets/images/conways-law/necessary-lines-vs-chatter.jpeg)\n**Figure 3:** *Communication as expensive bandwidth: a few deliberate, load-bearing lines beat a web of accidental chatter — the chatter couples the systems underneath it.*\n\n**Tools draw boundaries whether we notice or not.** A shared ticketing system, database, or deployment pipeline is a communication structure, and Conway's law applies to it. Shared tools belong where teams genuinely collaborate; separate tools where boundaries should be crisp. When a tool forces unrelated teams to interact, it is quietly redesigning my architecture. The same lens applies to visibility: teams need the operational information they depend on, behind security controls that protect without blinding.\n\n**The law can be over-applied.** Naive uses do damage too: fragmenting into many small component teams (maximizing handoffs), creating complicated-subsystem teams where no deep expertise is required, or dressing up a headcount cut or a fiefdom as a \"Conway-aligned reorg.\" Every reorganization gets evaluated for its impact on delivery, architecture, and team cognitive load — not just the reporting lines it tidies.\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Org design and architecture are one decision, made together. | The org chart dictates everything; architects are redundant. |\n| Change the team structure to get the architecture you want. | Reorganize often; churn is fine as long as it is \"Conway-aligned\". |\n| Unnecessary cross-team communication is a design smell. | Teams should not talk to each other. |\n| Reduce reliance on centralized specialist teams where possible. | All shared and platform teams are dissolved on sight. |\n| Tool choices are architectural decisions. | One tool policy fits every team. |\n| Technical leaders sit in team-structure decisions. | Engineers draw the org chart alone; managers merely execute it. |\n\nConcretely: no reorg is approved without an architectural impact assessment, and no target architecture without asking which team structure would naturally produce it. When delivery is slow, I look at dependency and communication patterns before individual performance. And a proposed new cross-team coordination meeting prompts one question first: what boundary failure is it compensating for?\n\n## Anti-Patterns\n\n- **Designing the system and the organization separately.** Two documents, two owners — and the org chart silently wins.\n- **The accidental architecture.** Boundaries drawn by budget, politics, or history — then years wondering why the system is tangled the same way.\n- **Communication as a virtue metric.** Celebrating cross-team meeting volume while the boundaries that made the meetings necessary go unexamined.\n- **The shared-everything trap.** Shared teams, databases, and tools creating coupling nobody chose, defended because sharing sounds efficient.\n- **Component-team confetti.** Many small component teams in Conway's name, maximizing handoffs and destroying flow.\n- **The fiefdom reorg.** Reorganizations run to cut headcount or build empires, labeled as architecture work.\n- **Managers without the lens.** Team-structure decisions made by people who do not realize they are architectural decisions.\n\n## Related Records\n\n- [Organizational Design](organizational-design.html) — sizes and staffs the organization as a system; this record names the architectural force the structure exerts.\n- [Engineering Strategy](engineering-strategy.html) — the target architecture worth maneuvering toward comes from strategy, not taste.\n- [The Problem with Org Charts](org-chart-problems.html) — appendix sibling; why the reporting-lines view of the organization misleads.\n- [Team-First Boundaries](team-first-boundaries.html) — appendix sibling; drawing the boundaries the maneuver needs, starting from cognitive load.\n- [The Four Fundamental Team Topologies](four-fundamental-team-topologies.html) — appendix sibling; the team types that make the maneuver concrete.\n\n## Scope and Revisiting\n\nThis principle governs how I connect organizational structure to system architecture: reorgs, team-boundary changes, shared-service decisions, and tool standardization all pass through it. I revisit it whenever a significant architecture change or reorg is proposed, whenever delivery slows in ways that trace to cross-team dependencies, and whenever I catch an org-chart decision made without anyone asking what system it will produce.\n\n## Authoritative References\n\n- Matthew Skelton & Manuel Pais, *Team Topologies: Organizing Business and Technology Teams for Fast Flow* (IT Revolution Press, 2019) — the Conway's-law chapter this record's checklist distills.\n- The authors maintain further material, patterns, and case studies at [teamtopologies.com](https://teamtopologies.com/).\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle. The Article tab carries the rationale, implications, and anti-patterns.*\n\n## Clarify the Desired Software Architecture\n\n- [ ] Have we defined the software architecture we actually want?\n- [ ] Are we avoiding designing software separately from team design?\n- [ ] Do team boundaries support the desired system boundaries?\n- [ ] Are services, APIs, databases, and interfaces aligned with team ownership?\n- [ ] Are we designing for fast flow of change, not just technical elegance?\n\n## Check for Conway's Law Effects\n\n- [ ] Does our current organization structure naturally produce the architecture we want?\n- [ ] Are communication paths between teams reflected in the software structure?\n- [ ] Are shared teams, shared databases, or shared tools creating unwanted coupling?\n- [ ] Are team dependencies slowing delivery?\n- [ ] Are we asking: \"Is there a better design unavailable to us because of our organization?\"\n\n## Use the Reverse Conway Maneuver\n\n- [ ] Have we shaped team boundaries to match the architecture we want?\n- [ ] Are teams arranged around business capabilities or product areas?\n- [ ] Can teams deliver changes from design through deployment with minimal handoffs?\n- [ ] Have we reduced reliance on centralized specialist teams where possible?\n- [ ] Are teams given enough autonomy to own their part of the system?\n\n## Enable Team-Scoped Flow\n\n- [ ] Does each team have a clear, bounded responsibility?\n- [ ] Are components loosely coupled?\n- [ ] Are components highly cohesive?\n- [ ] Are version compatibility expectations clear?\n- [ ] Is cross-team testing clear and appropriate?\n- [ ] Can teams make changes safely without excessive coordination?\n\n## Involve Technical Expertise in Organization Design\n\n- [ ] Are technical leaders involved in team-structure decisions?\n- [ ] Do managers understand how team design affects system architecture?\n- [ ] Are service ownership and team responsibilities decided with architectural input?\n- [ ] Are architects considering both technical and social/organizational factors?\n- [ ] Are team boundaries being designed intentionally rather than by budget or politics?\n\n## Restrict Unnecessary Communication\n\n- [ ] Are we avoiding the assumption that more communication is always better?\n- [ ] Are communication paths focused between the right teams?\n- [ ] Are teams communicating because of real dependencies, not poor architecture?\n- [ ] Could better APIs, platforms, or boundaries reduce the need for coordination?\n- [ ] Are we minimizing unnecessary team-to-team communication paths?\n\n## Review Tool Choices\n\n- [ ] Do shared tools support collaboration where collaboration is actually needed?\n- [ ] Are separate tools used where clear team boundaries are needed?\n- [ ] Are tools accidentally forcing teams to interact in unhealthy ways?\n- [ ] Do teams have access to the operational information they need?\n- [ ] Are security controls preserved without blocking useful visibility?\n\n## Avoid Naive Uses of Conway's Law\n\n- [ ] Are we avoiding too many small component teams?\n- [ ] Are stream-aligned teams preferred where fast flow is needed?\n- [ ] Are complicated-subsystem teams used only when deep expertise is truly required?\n- [ ] Are we avoiding reorganizations just to reduce headcount or create management fiefdoms?\n- [ ] Are reorganizations evaluated for their impact on delivery, architecture, and team cognitive load?\n\n## Final Readiness Check\n\n- [ ] Team structure and software architecture support each other.\n- [ ] Dependencies between teams are intentional and limited.\n- [ ] Teams can deliver value with minimal handoffs.\n- [ ] Communication is focused, not chaotic.\n- [ ] Tooling reinforces the desired collaboration patterns.\n- [ ] Technical leaders are involved in organization design.\n- [ ] The organization is designed to improve software flow, not just reporting lines.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "You ship your org chart — Conway's law and the reverse maneuver, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Leo proudly presents a whiteboard with four clean microservice boxes while Vera watches with interest.](assets/images/conways-law/comic-01-clean-whiteboard.jpeg)\n**Panel 1:** *The hook: a clean four-service architecture, designed on a whiteboard.*\n\n![Comic panel: Leo slumps before a monitor showing a tangled system diagram while Vera looks on calmly.](assets/images/conways-law/comic-02-shipped-tangle.jpeg)\n**Panel 2:** *The problem: the shipped system ignored the whiteboard.*\n\n![Comic panel: Vera holds an org chart beside the tangled system diagram, revealing the two shapes are identical, as Leo stares in surprise.](assets/images/conways-law/comic-03-org-chart-mirror.jpeg)\n**Panel 3:** *The principle: Conway's law — the system mirrors the organization that built it.*\n\n![Comic panel: Vera sketches two chatting teams whose constant communication line becomes a fused joint between two software components, while Leo watches.](assets/images/conways-law/comic-04-teams-mirror-talk.jpeg)\n**Panel 4:** *How it works: every standing communication path becomes a seam — or a weld — in the system.*\n\n![Comic panel: Vera draws four target services with one team placed under each, while Leo smiles in understanding.](assets/images/conways-law/comic-05-reverse-maneuver.jpeg)\n**Panel 5:** *The maneuver: reverse Conway — reshape the teams, and the architecture follows.*\n\n![Comic panel: Leo points at a calendar full of cross-team meetings while Vera crosses them out and draws a clean API connection instead.](assets/images/conways-law/comic-06-fix-boundary-not-meeting.jpeg)\n**Panel 6:** *The reframe: constant coordination is a design smell — a better boundary beats another meeting.*\n\n![Comic panel: Vera taps chains linking three teams to one shared database while Leo studies the diagram.](assets/images/conways-law/comic-07-tools-are-architecture.jpeg)\n**Panel 7:** *The hidden lever: shared databases and tools are communication structures — Conway's law applies to them too.*\n\n![Comic panel: close-up of Vera and Leo holding one sheet where the org chart and the architecture form a single overlapping figure.](assets/images/conways-law/comic-08-one-decision.jpeg)\n**Panel 8:** *The closer: org design is your most powerful architectural decision — make it on purpose.*\n"}]}]}</script>

    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

            let i = 0;

            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
