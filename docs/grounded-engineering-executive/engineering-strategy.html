<script id="data" type="application/json">{"meta": {"id": "EXEC-ENGINEERING-STRATEGY", "status": "draft:gray", "title": "Engineering Strategy", "date": "2026-07-25", "author": "Željko Obrenović", "permalink": "engineering-strategy", "timetoread": "10 min", "excerpt": "I write engineering strategy personally, ground it in an honest diagnosis, and publish only policies I am willing to enforce. A strategy is diagnosis, guiding policies, and coherent actions — anything else is a vision statement wearing a strategy costume. This record describes how I produce, socialize, launch, and review one.", "tags": "engineering executive, strategy, diagnosis, guiding policies, leverage, governance", "icon": "assets/icons/eng-strategy.png", "logo": "assets/images/engineering-strategy/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "strategy", "diagnosis", "guiding policies", "leverage", "governance"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I write engineering strategy personally, and I only start once I am confident in my diagnosis of the organization and willing to enforce what I publish. A strategy has three parts — diagnosis, guiding policies, coherent actions — and every policy must be applicable in real trade-offs, enforced with accountability, and leverage-creating. A policy that fails any of those three tests gets reconsidered, not published.\n\n## Statement\n\nEngineering strategy is one of the few artifacts I do not delegate. I run it as a personal writing project with a disciplined process around it:\n\n- **Before starting**, I check four preconditions: I am confident in my diagnosis, I am willing and able to enforce the strategy, I believe it creates real leverage (not just sounds good), and I am ready to personally write it.\n- **The document has exactly three parts** — Rumelt's kernel: a **diagnosis** (what is actually going on), **guiding policies** (what principles govern decisions), and **coherent actions** (what concrete actions implement the policies).\n- **Every guiding policy passes a quality bar**: *applicable* — useful in real trade-offs; *enforced* — there is accountability; *leverage-creating* — it produces compounding impact. Failing any one of these sends the policy back.\n- **The process is as deliberate as the document**: a small working group first, skeptics actively sought out, socialization before announcement, a short feedback window, and a committed review cadence after launch.\n\n![Three connected blocks labeled Diagnosis, Guiding policies, and Coherent actions, with a crossed-out vision-statement cloud floating disconnected above.](assets/images/engineering-strategy/strategy-kernel.jpeg)\n**Figure 1:** *Rumelt's kernel: diagnosis grounds policies, policies drive actions — anything outside the flow is costume.*\n\n\n## How to Read This\n\nThis record describes how I produce a strategy — it is not a strategy itself. The strategy for a given organization is always a separate, company-specific document. The phase-by-phase working checklist lives in the **Checklist** tab of this post. Annual planning mechanics are also deliberately out of scope here; [Planning](planning.html) covers those, and keeping strategy and planning separate is part of the point: strategy constrains decisions, planning allocates a year.\n\n## Rationale\n\n**Delegated strategy is dead strategy.** A strategy written by a working group and \"sponsored\" by the executive has no enforcement behind it. The organization detects this immediately: policies that cost something get waived, exceptions multiply, and the document becomes shelf-ware. Writing it personally is not vanity — it is the visible commitment that makes enforcement credible.\n\n**Diagnosis is the hard part, and the part most strategies skip.** A useful diagnosis names root causes and real constraints, not symptoms. That is why I review the roadmap, the financial plan, and business priorities; incorporate survey data; and validate the diagnosis with senior engineering managers, staff+ engineers, product leadership, and executive peers. I actively seek out skeptics — a diagnosis that has only been confirmed by people who agree with me is untested. And I avoid copying assumptions from previous roles: the diagnosis must be of *this* organization.\n\n**Policies without enforcement are decoration.** The three-part quality bar (applicable, enforced, leverage-creating) exists because most strategy documents fail it. \"We value quality\" is not applicable in a trade-off. A tech-stack standard nobody checks is not enforced. A rule that merely prevents annoyance does not create leverage. The bar keeps the document honest — and short.\n\n![Pipeline where a candidate policy card passes through three gates labeled Applicable, Enforced, and Leverage, with return arrows looping failed policies back to the start.](assets/images/engineering-strategy/policy-quality-gates.jpeg)\n**Figure 2:** *The quality bar: a policy that fails any of the three gates gets reconsidered, not published.*\n\n\n**Socializing beats announcing.** I iterate the diagnosis 1:1 with a small working group, meet likely strong dissenters before launch, and incorporate valid feedback without weakening the core intent. By the time the strategy is announced, the people who could kill it have already shaped it.\n\n![Concentric rings from a single author out to the organization along a timeline, with the announcement flag, a short feedback window, and a review-cadence clock at the end.](assets/images/engineering-strategy/socialize-before-announce.jpeg)\n**Figure 3:** *Socialize outward before announcing: by launch day, the people who could kill the strategy have shaped it.*\n\n\n**Missing company strategy is not an excuse.** When the business, product, or investment strategy above me is undocumented, I clarify it myself — even informally: cash-flow constraints, competitive threats, the distribution model, how success is measured. Engineering strategy has to plug into *something*; if that something is unwritten, I write down my best understanding and validate it.\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| I personally write the strategy. | I write it alone — a working group and skeptics shape it throughout. |\n| Every policy is enforced. | Every decision is centralized — the strategy explicitly defines what teams decide independently. |\n| Exceptions have a defined approval path. | Exceptions are forbidden — they are evaluated through an ongoing process. |\n| The diagnosis names real constraints. | The diagnosis is circulated verbatim — sensitive content is removed before wider circulation. |\n| Launch includes a feedback window. | Launch is a referendum — the window is short (about a week) and the core intent survives it. |\n\nThe guiding policies themselves cover three areas in my strategies: **resource allocation** (explicitly defined, mapped to the diagnosis, investing in unowned-but-critical areas like security, reliability, and developer productivity), **fundamental rules** (organization-wide standards with a defined exception path and a written *why* for each rule), and a **decision-making model** (what teams decide independently, what requires review, and how escalation works).\n\n## Anti-Patterns\n\n- **Vision-statement strategy.** Aspirational language (\"world-class engineering\") with no diagnosis, no policies that bind, no actions. Sounds good; changes nothing.\n- **Strategy by committee.** Fully delegating the writing, then discovering the executive is unwilling to enforce what the committee produced.\n- **Confirmation-only validation.** Reviewing the diagnosis only with people who already agree, and never meeting the strong dissenters until after launch.\n- **Unenforced standards.** Publishing rules with no accountability, then treating every violation as an isolated surprise.\n- **Strategy frozen in time.** No review cadence — the strategy is launched once and never checked against reality. I commit to reviewing impact in about two months and refreshing annually.\n\n## Related Records\n\n- [Planning](planning.html) — annual planning allocates within the constraints strategy sets.\n- [First 90 Days](first-90-days.html) — the implicit strategy documented during my ramp is the raw material for the explicit one.\n- [Organizational Values](organizational-values.html) — values and strategy reinforce each other; values without enforcement fail the same way policies do.\n- [Measuring Engineering Organizations](measuring-engineering-organizations.html) — the measurements that tell me whether the strategy is creating visible leverage.\n- [Inspected Trust](inspected-trust.html) — ongoing review of a strategy is inspection applied to my own artifact.\n\n## Scope and Revisiting\n\nThis principle governs how I produce engineering strategy wherever I hold the executive role. I revisit it when a strategy I ran this way fails in practice — a policy that passed the quality bar but did not create leverage is a signal the bar itself needs work — and after each annual refresh cycle.\n\n## Authoritative References\n\n- Will Larson, *The Engineering Executive's Primer* (O'Reilly, 2024) — the \"Engineering Strategy\" chapter this record's checklist distills.\n- Will Larson, [Writing an engineering strategy](https://lethain.com/eng-strategies/) — the freely available companion essay.\n- Richard Rumelt, *Good Strategy Bad Strategy* (Crown Business, 2011) — the origin of the diagnosis / guiding policies / coherent actions kernel.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle, grouped by phase. The Article tab carries the rationale, implications, and anti-patterns.*\n\n### Before You Start\n\n- [ ] I'm confident in my **diagnosis** of the organization.\n- [ ] I'm **willing and able to enforce** this strategy.\n- [ ] I believe this strategy will create **real leverage**, not just sound good.\n- [ ] I'm ready to **personally write** the strategy, not fully delegate it.\n\n### Define the Structure\n\n- [ ] **Diagnosis** — what is actually going on?\n- [ ] **Guiding policies** — what principles will govern decisions?\n- [ ] **Coherent actions** — what concrete actions implement the policies?\n\n### Diagnosis\n\n- [ ] Review the roadmap, financial plan, and business priorities.\n- [ ] Incorporate survey data (developer productivity, culture, and similar).\n- [ ] Identify root causes, not just symptoms.\n- [ ] Validate the diagnosis with senior engineering managers, staff+ engineers, product leadership, and executive peers.\n- [ ] Actively seek out skeptics; avoid copying assumptions from previous roles.\n- [ ] Make sure the diagnosis clearly explains the real constraints.\n\n### Guiding Policies\n\n- [ ] **Resource allocation** — explicitly defined, clearly mapped back to the diagnosis, investing in unowned but critical areas (security, reliability, developer productivity).\n- [ ] **Fundamental rules** — clear organization-wide standards (tech stack, lifecycle, review process), exceptions with a defined approval path, and an explanation of why each rule matters.\n- [ ] **Decision-making model** — what teams decide independently, what requires review or approval, a defined escalation path, and the *why* behind the structure.\n\n### Guiding Policies Quality Check\n\n- [ ] **Applicable** — useful in real trade-offs.\n- [ ] **Enforced** — there is accountability.\n- [ ] **Leverage-creating** — produces compounding impact.\n- [ ] If any policy fails one of these, reconsider it.\n\n### Coherent Actions\n\n- [ ] **Enforcement** — a process to maintain policies, an ongoing process for evaluating exceptions, clear enforcement ownership.\n- [ ] **Escalations** — a small, clear escalation path; teams know how to challenge a policy constructively.\n- [ ] **Transitions** — defined current → future state, explicit resource shifts, clear migration plans, organizational changes defined where needed.\n\n### Writing Process\n\n- [ ] Identify 3–5 trusted stakeholders for early feedback; iterate the diagnosis 1:1 with them; refine guiding policies with them.\n- [ ] Consider private feedback from 2–3 external engineering executives.\n- [ ] Share the diagnosis and guiding policies with key stakeholders; socialize before announcing; remove sensitive content before wider circulation.\n- [ ] Meet 1:1 with likely strong dissenters; incorporate valid feedback without weakening the core intent.\n\n### Launch\n\n- [ ] Schedule a strategy presentation meeting and explain the rationale behind decisions.\n- [ ] Set a short feedback window (about one week), finalize the document, and send a formal announcement.\n- [ ] Commit to reviewing impact in about two months, and set an annual refresh cadence.\n\n### Missing Company Strategy\n\nIf broader company strategies are undocumented, clarify — even informally:\n\n- [ ] The business strategy, the product strategy, and the investment thesis across functions.\n- [ ] Cash-flow constraints, competitive threats, the distribution model, and how success is measured.\n\n### Ongoing Review\n\n- [ ] Policies are being followed; exceptions are handled consistently; the escalation process works.\n- [ ] Resource allocation reflects stated priorities.\n- [ ] The strategy is creating visible leverage, and impact is reviewed at defined intervals.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "What makes a real engineering strategy — and why I only publish what I will enforce — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Leo unveils a glossy rocket poster reading world-class engineering while Vera looks unimpressed.](assets/images/engineering-strategy/comic-01-vision-poster.jpeg)\n**Panel 1:** *The hook: a shiny vision statement, presented as a strategy.*\n\n![Comic panel: Vera points at the poster now wearing a cape and mask while Leo scratches his head.](assets/images/engineering-strategy/comic-02-strategy-costume.jpeg)\n**Panel 2:** *The problem: it sounds good and changes nothing — a vision statement wearing a strategy costume.*\n\n![Comic panel: Vera draws three whiteboard boxes labeled Diagnosis, Policies, and Actions.](assets/images/engineering-strategy/comic-03-the-kernel.jpeg)\n**Panel 3:** *The principle: a strategy has exactly three parts — diagnosis, guiding policies, coherent actions.*\n\n![Comic panel: a cobwebbed strategy binder sits on a shelf above a shrugging committee as Leo whispers that nobody follows it.](assets/images/engineering-strategy/comic-04-committee-shelfware.jpeg)\n**Panel 4:** *The wrong way: strategy by committee — sponsored, not owned, and dead on the shelf.*\n\n![Comic panel: Vera writes a strategy draft by hand at her desk with pages spread around her.](assets/images/engineering-strategy/comic-05-write-it-yourself.jpeg)\n**Panel 5:** *My move: I write the strategy personally — visible commitment is what makes enforcement credible.*\n\n![Comic panel: Vera passes a policy card through three gates labeled Applicable, Enforced, and Leverage, with a rejected card in a bin.](assets/images/engineering-strategy/comic-06-policy-quality-bar.jpeg)\n**Panel 6:** *The quality bar: every policy must be applicable, enforced, and leverage-creating — or it goes back.*\n\n![Comic panel: Vera takes notes across from a stern, arms-crossed engineer while Leo peeks in from the doorway.](assets/images/engineering-strategy/comic-07-meet-the-skeptics.jpeg)\n**Panel 7:** *How it survives: seek out the skeptics before launch — the people who could kill it shape it first.*\n\n![Comic panel: Vera faces the reader holding a single thin signed document with Leo nodding beside her.](assets/images/engineering-strategy/comic-08-enforce-what-you-publish.jpeg)\n**Panel 8:** *The closer: short, honest, and enforced — only publish what you are willing to enforce.*\n"}]}]}</script>

    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
