<script id="data" type="application/json">{"meta": {"id": "EXEC-STATIC-TEAM-TOPOLOGIES", "status": "draft:gray", "title": "Static Team Topologies", "date": "2026-07-26", "author": "Željko Obrenović", "permalink": "static-team-topologies", "timetoread": "8 min", "excerpt": "I choose team structures from the known catalog of patterns and anti-patterns, judged against our own context — organization size, engineering maturity, Conway's law — never by copying another company's model. I treat ad-hoc team design and constant reshuffling as the two anti-patterns that quietly destroy delivery, and I make the conditional patterns — feature teams, SRE, embedded ops — earn their preconditions before I adopt them.", "tags": "engineering executive, team topologies, org patterns, anti-patterns, context", "icon": "assets/icons/static-team-topologies.png", "logo": "assets/images/static-team-topologies/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "team topologies", "org patterns", "anti-patterns", "context"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I choose team structures from known patterns judged against our context — organization size, software scale, engineering and cultural maturity, and Conway's law — never by copying another company's model. Patterns are a catalog; context is the selector. I design teams intentionally, keep them long-lived and aligned to value streams, and organize them for flow of change rather than local efficiency. And I treat ad-hoc team design and constant reshuffling as the two anti-patterns that quietly destroy delivery.\n\n## Statement\n\nMy operating model for choosing team structures has five parts:\n\n- **Design intentionally, never ad hoc.** Teams are long-lived, stable, and aligned to business domains or value streams — not reactions to short-term problems or project groupings that disband after delivery.\n- **Optimize for flow of change.** Work moves from idea to production with minimal handoffs; teams feel fast feedback from live systems. Fast, safe change beats local team efficiency.\n- **Select from the catalog, judge by context.** Known topologies — stream-aligned product teams, platform teams, feature teams, SRE — are options, not prescriptions. Size, maturity, and Conway's law decide which fits *our current context*, not an ideal future state.\n- **Make conditional patterns earn their preconditions.** Feature teams require high engineering maturity and trust; SRE requires scale that justifies it; product teams require a self-service support system.\n- **Manage dependencies and silos deliberately.** I track dependencies between teams, decide which to remove and which to accept, and make specialized teams enablers rather than blockers.\n\n![Split illustration contrasting an ill-fitting org chart traced from another company with a pattern card chosen from a catalog and checked against a context gauge.](assets/images/static-team-topologies/catalog-not-template.jpeg)\n**Figure 1:** *Patterns are a catalog, context is the selector: another company's model traced onto a differently-shaped organization does not fit.*\n\n## How to Read This\n\nThis is an **appendix record**: unlike the core records in this journal, grounded in Will Larson's *The Engineering Executive's Primer*, this one is grounded in Matthew Skelton and Manuel Pais's *Team Topologies* — read here through an executive lens, complementing the Primer-grounded records. The book catalogs team patterns observed across many organizations; I read it as the executive deciding which pattern my organization gets — and which fashionable pattern it does not. If you lead teams here, this record explains why I ask \"what is our context?\" before any structural proposal, and why \"company X does it this way\" is never, by itself, an argument. The working checklist — all eleven sections — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Copied models fail because context does not copy.** The famous topologies — Spotify's squads and tribes most of all — were answers to one company's size, maturity, culture, and constraints at one moment in time. Importing the org chart imports none of those. Skelton and Pais are blunt: there is no single \"best\" topology, and the anti-pattern is not any specific structure but adopting one without considering your own context. So every structural proposal must answer four questions first: how big are we and our software, how mature is our engineering discipline (automation, testing, deployment, monitoring), how mature is our culture, and what does Conway's law say our communication structure will do to the design? The topology that fits our *current* context wins — not the one that fits the organization we hope to be.\n\n**Ad-hoc design and constant reshuffling are the quiet killers.** Neither shows up in an incident review, which is why both survive. A team assembled reactively around a short-term problem inherits no domain, no ownership, and no reason to invest in the code it touches. A team reshuffled every quarter never gels and learns that ownership is temporary — so it behaves accordingly. Long-lived teams aligned to business domains or value streams are the unit of ownership; everything else in this record assumes them.\n\n**Flow of change is the objective function.** I organize teams so that work moves from idea to production with minimal handoffs, wait times shrink between development, testing, operations, and business-as-usual work, and delivery teams feel production directly — operational and customer signals both. The classic failure modes are all handoff shapes: work thrown over the wall between Dev, Test, and Ops; a separate \"DevOps team\" that becomes one more silo in the middle; routine delivery blocked on scarce specialist teams. A specialized team's job is to enable other teams through self-service, not to do the work for them.\n\n![Contrast of work thrown over walls between Dev, Test, and Ops with a single team flowing from idea to production on a platform drawn as a paved road.](assets/images/static-team-topologies/handoff-wall-vs-flow.jpeg)\n**Figure 2:** *Organize for flow of change: minimal handoffs and a self-service platform beat locally efficient silos passing work over walls.*\n\n**Conditional patterns are conditional.** The catalog's strongest patterns come with preconditions, and skipping them turns the pattern into its own anti-pattern. Stream-aligned product teams work when they can design, build, test, deploy, and operate their software, with non-blocking dependencies on infrastructure, QA, networking, and operations — which requires a support system of self-service platform capabilities around them. Feature teams work when engineering maturity is high, trust is sufficient to change shared code safely, and ownership boundaries are explicit — without that, they generate technical debt and erode trust. SRE works where scale and reliability needs justify it, with real coding and automation skill, defined SLOs and error budgets, and a relationship with application teams that stays dynamic — including handing operational responsibility back when appropriate. I invest in the preconditions before I adopt the pattern.\n\n**Dependencies are a budget, not background noise.** Between teams I look for knowledge, task, and resource dependencies; I keep them visible, decide which to remove and which to accept and manage, and review the counts before they grow unchecked. Splitting responsibilities to reduce bottlenecks, letting teams own more of their delivery lifecycle, and designing shared services for low friction are all the same move: team interactions that improve flow rather than reinforce silos.\n\n**Static is a snapshot, not a promise.** Even the right topology is right *for now*. Topology decisions get revisited as maturity, scale, and business needs change; temporary structures are stepping stones, never permanent silos. This record covers choosing the pattern; [Evolve Team Structures](evolve-team-structures.html) covers changing it — deliberately, which is the opposite of the constant reshuffling this record forbids.\n\n![Matrix of organization size versus engineering maturity with different team-topology icons in different cells and a pin marking the current context.](assets/images/static-team-topologies/context-fit-matrix.jpeg)\n**Figure 3:** *Judge by context: size, maturity, and Conway's law decide which topology fits — and the pin sits on the organization you have, not the one you want.*\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Choose from known patterns, judged against our context. | Invent nothing; the catalog is a straitjacket. |\n| \"Company X does it this way\" is data, never an argument. | Other companies' experience is worthless. |\n| Teams are long-lived and stable by default. | Structures are frozen forever — evolution is deliberate, not banned. |\n| Feature teams, SRE, and embedded ops must earn their preconditions. | These patterns are bad — they are conditional. |\n| Specialized teams enable through self-service. | Specialists disappear; platforms do everyone's work for them. |\n| Dependencies are tracked and budgeted. | All dependencies are removed — some are accepted and managed. |\n\nConcretely: every structural proposal that reaches me names the pattern it applies, the context evidence that it fits, and the anti-pattern it risks becoming. Proposals justified mainly by another company's example go back for a context assessment. Before I approve a feature-team or SRE adoption, I ask for precondition evidence — maturity, trust, ownership boundaries, SLOs — not aspiration.\n\n## Anti-Patterns\n\n- **The Spotify cargo cult.** Copying a famous company's model without considering our own size, maturity, and culture.\n- **Ad-hoc team design.** Teams formed reactively around whatever is on fire — no domain, no ownership, no expected lifespan.\n- **Constant reshuffling.** Rotating people so often that no team ever gels and ownership becomes a fiction.\n- **Over-the-wall handoffs.** Dev, Test, Ops, and BAU passing work between silos — locally efficient, collectively slow.\n- **The DevOps silo.** A separate DevOps team that becomes exactly the kind of silo it was meant to dissolve.\n- **The specialist bottleneck.** Routine delivery queued behind scarce specialist teams instead of enabled through self-service.\n- **Premature patterns.** Feature teams without the maturity and trust to change shared code safely; SRE without the scale to justify it.\n- **The ideal-state topology.** Choosing the structure that fits the organization we aspire to be, instead of the one we are.\n\n## Related Records\n\n- [Organizational Design](organizational-design.html) — appendix sibling; that record governs team sizing and investment sequencing, this one which shapes to pick.\n- [The Four Fundamental Team Topologies](four-fundamental-team-topologies.html) — appendix sibling; the four canonical team types this record's wider catalog narrows into.\n- [Team Interaction Modes](team-interaction-modes.html) — appendix sibling; how the chosen teams collaborate.\n- [Evolve Team Structures](evolve-team-structures.html) — appendix sibling; how topologies change deliberately over time.\n\n## Scope and Revisiting\n\nThis principle governs how I evaluate and choose team structures across my organization. I revisit it whenever a structural proposal reaches my desk, whenever our size or maturity shifts enough to change the context-fit judgment, and whenever I catch a copied model — including one of ours — applied somewhere its context does not hold.\n\n## Authoritative References\n\n- Matthew Skelton & Manuel Pais, *Team Topologies: Organizing Business and Technology Teams for Fast Flow* (IT Revolution Press, 2019) — the static-topologies chapters this record's checklist distills.\n- The authors maintain further materials, patterns, and training resources at [teamtopologies.com](https://teamtopologies.com/).\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle. The Article tab carries the rationale, implications, and anti-patterns.*\n\n## Intentional Team Design\n\n- [ ] Are teams designed intentionally rather than formed ad hoc?\n- [ ] Are team boundaries aligned to business domains or value streams?\n- [ ] Are teams long-lived enough to build ownership and context?\n- [ ] Are teams stable, rather than frequently shuffled between projects?\n- [ ] Have we avoided creating teams only as a reaction to short-term problems?\n\n## Flow of Change\n\n- [ ] Can work move from idea to production with minimal handoffs?\n- [ ] Are teams organized to reduce wait times between development, testing, operations, and business-as-usual work?\n- [ ] Do teams receive fast feedback from production/live systems?\n- [ ] Are software delivery teams exposed to operational and customer signals?\n- [ ] Are we optimizing for fast, safe change rather than local team efficiency?\n\n## Avoid Team Anti-Patterns\n\n- [ ] Are we avoiding \"throw it over the wall\" handoffs between Dev, Test, Ops, and BAU?\n- [ ] Are we avoiding temporary project teams that disband immediately after delivery?\n- [ ] Are we avoiding a separate DevOps team that becomes another silo?\n- [ ] Are we avoiding excessive dependency on specialist teams for routine delivery work?\n- [ ] Are we avoiding copying another company's model without considering our own context?\n\n## Choose the Right Topology for Context\n\n- [ ] Have we considered organization size and software scale?\n- [ ] Have we assessed technical and cultural maturity?\n- [ ] Have we considered engineering discipline, automation, testing, deployment, and monitoring maturity?\n- [ ] Have we identified which topology fits the current context, not an ideal future state?\n- [ ] Do we recognize that there is no single \"best\" topology for every organization?\n\n## Stream-Aligned / Product Teams\n\n- [ ] Are product or stream-aligned teams focused on a clear business stream?\n- [ ] Can the team design, build, test, deploy, and operate its software?\n- [ ] Does the team have enough autonomy to deliver without constant blocking dependencies?\n- [ ] Are dependencies on infrastructure, QA, networking, or operations non-blocking?\n- [ ] Does the team have access to self-service capabilities where needed?\n\n## Support Systems and Platforms\n\n- [ ] Do product teams have a compatible support system around them?\n- [ ] Are platform capabilities easy to consume through self-service?\n- [ ] Are infrastructure, deployment, monitoring, and test environments available without long waits?\n- [ ] Are platform/cloud teams focused on enabling product teams rather than doing all work for them?\n- [ ] Are responsibilities split clearly between platform design and application provisioning?\n\n## Feature Teams\n\n- [ ] Do feature teams have high engineering maturity?\n- [ ] Is there enough trust for teams to change shared code safely?\n- [ ] Are ownership boundaries clear across components and subsystems?\n- [ ] Are architecture, system ownership, and integration responsibilities explicitly handled?\n- [ ] Are teams avoiding shortcuts that create technical debt or reduce trust?\n\n## SRE and Reliability\n\n- [ ] Is SRE being used only where scale and reliability needs justify it?\n- [ ] Do SRE teams have strong coding and automation skills?\n- [ ] Are service-level objectives and error budgets defined?\n- [ ] Is the relationship between SRE and application teams dynamic over time?\n- [ ] Can application teams take back operational responsibility when appropriate?\n\n## Dependencies Between Teams\n\n- [ ] Have we identified knowledge, task, and resource dependencies?\n- [ ] Are cross-team dependencies visible and tracked?\n- [ ] Do we know which dependencies should be removed?\n- [ ] Do we know which dependencies should be accepted and managed?\n- [ ] Are dependency counts reviewed before they grow unchecked?\n\n## Breaking Down Silos\n\n- [ ] Have we split responsibilities where doing so reduces bottlenecks?\n- [ ] Are specialized teams enabling others instead of becoming blockers?\n- [ ] Are teams empowered to own more of their delivery lifecycle?\n- [ ] Are shared services designed to reduce friction?\n- [ ] Are team interactions improving flow rather than reinforcing silos?\n\n## Evolving the Organization\n\n- [ ] Do we treat team topology as something that evolves over time?\n- [ ] Are topology decisions revisited as maturity, scale, and business needs change?\n- [ ] Are we using temporary structures only as stepping stones, not permanent silos?\n- [ ] Do we have a multi-stage approach to improving team design?\n- [ ] Are team structures optimized for long-term adaptability, not just today's urgent problem?\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Patterns are a catalog, context is the selector — why copying a famous company's team model fails, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Leo excitedly shows Vera a famous company's squad-and-tribe org chart on his laptop and proposes adopting it.](assets/images/static-team-topologies/comic-01-copy-the-model.jpeg)\n**Panel 1:** *The hook: if it worked for them, it will work for us — right?*\n\n![Comic panel: Leo drowns in a comically oversized suit labeled with another company's name while Vera looks on.](assets/images/static-team-topologies/comic-02-someone-elses-suit.jpeg)\n**Panel 2:** *The problem: the model fits the company it grew in — context does not copy.*\n\n![Comic panel: Vera shows Leo a catalog of team-pattern diagrams and explains that context selects the pattern.](assets/images/static-team-topologies/comic-03-catalog-not-template.jpeg)\n**Panel 3:** *The principle: patterns are a catalog, context is the selector.*\n\n![Comic panel: Vera points at three whiteboard gauges labeled size, maturity, and Conway while Leo takes notes.](assets/images/static-team-topologies/comic-04-judge-by-context.jpeg)\n**Panel 4:** *The test: judge every pattern against size, maturity, and Conway's law.*\n\n![Comic panel: a chaotic sticky-note wall of overlapping ad-hoc teams around a small fire, with Vera shaking her head.](assets/images/static-team-topologies/comic-05-adhoc-teams.jpeg)\n**Panel 5:** *Anti-pattern one: ad-hoc teams assembled around whatever is on fire.*\n\n![Comic panel: engineers shuffled like cards between team boxes while Vera signals stop and Leo winces.](assets/images/static-team-topologies/comic-06-constant-reshuffle.jpeg)\n**Panel 6:** *Anti-pattern two: constant reshuffling — no team ever gels, ownership becomes fiction.*\n\n![Comic panel: a stable team flows along one smooth arrow from idea to production on a platform road while Vera and Leo watch.](assets/images/static-team-topologies/comic-07-longlived-flow.jpeg)\n**Panel 7:** *The payoff: long-lived teams, aligned to a stream, flowing idea to production without handoffs.*\n\n![Comic panel close-up: Leo in a well-fitted jacket as Vera closes her notebook with an approving nod.](assets/images/static-team-topologies/comic-08-our-own-fit.jpeg)\n**Panel 8:** *The closer: not their model — the topology that fits us.*\n"}]}]}</script>

                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
