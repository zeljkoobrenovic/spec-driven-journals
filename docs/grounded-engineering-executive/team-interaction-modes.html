<script id="data" type="application/json">{"meta": {"id": "EXEC-TEAM-INTERACTION-MODES", "status": "draft:gray", "title": "Team Interaction Modes", "date": "2026-07-26", "author": "Željko Obrenović", "permalink": "team-interaction-modes", "timetoread": "8 min", "excerpt": "I make how teams interact an explicit design decision, not an accident of who happens to talk to whom. There are exactly three modes: collaboration for time-boxed discovery, X-as-a-Service for steady delivery across a clear boundary, and facilitating to grow capability and then leave. When an interaction feels awkward or expensive, I do not blame the people — I read the friction as sensing data about where a boundary or a mode is wrong.", "tags": "engineering executive, team topologies, collaboration, x-as-a-service, facilitating, interaction design", "icon": "assets/icons/team-interaction-modes.png", "logo": "assets/images/team-interaction-modes/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "team topologies", "collaboration", "x-as-a-service", "facilitating", "interaction design"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I make how teams interact an explicit design decision with exactly three modes: **collaboration** for time-boxed, high-bandwidth discovery; **X-as-a-Service** for steady delivery across a clear, product-managed boundary; and **facilitating** to grow another team's capability and then step away. Every important team pair gets a deliberately chosen mode, matched to what each team is and what the work needs right now — and I read friction in these interactions as sensing data about where boundaries are wrong, not as evidence that people need to try harder.\n\n## Statement\n\nMy operating model for team interactions has four parts:\n\n- **Three modes, no more.** Every important team-to-team relationship runs in one of three modes: *collaboration* (working closely together for a defined period), *X-as-a-Service* (one team provides, another consumes, with minimal coordination), or *facilitating* (one team helps another learn, improve, or unblock itself). An interaction without an explicit mode is an interaction I have not designed yet.\n- **Choose per pair, deliberately.** For each relationship I identify the teams and their topology — stream-aligned, enabling, complicated-subsystem, or platform — decide the intended mode, and make it explicit: who owns what, which channels, what cadence.\n- **Respect each mode's economics.** Collaboration buys discovery at the price of high cognitive load, so it is time-boxed, limited to at most one other team at a time, and carries a plan to end. X-as-a-Service buys flow at the price of upfront boundary design, so the provider manages the service like a product. Facilitating buys capability at the price of expert time, so its goal is always self-sufficiency, never permanent dependency.\n- **Use friction as an instrument.** Awkward, expensive, or unclear interactions signal a misplaced boundary, a missing capability, or the wrong mode — and they feed boundary redesign, not blame.\n\n![Three pairs of team shapes connected by an overlapping zone, a socket-and-plug joint, and a dotted coaching arc, representing collaboration, X-as-a-Service, and facilitating.](assets/images/team-interaction-modes/three-modes-connectors.jpeg)\n**Figure 1:** *The three interaction modes as three different connectors: an overlapping zone (collaboration), a socket (X-as-a-Service), and a coaching arc (facilitating).*\n\n## How to Read This\n\nThis is an **appendix record**: unlike the core records in this journal, grounded in Will Larson's *The Engineering Executive's Primer*, this one is grounded in Matthew Skelton and Manuel Pais's *Team Topologies* — read here through an executive lens, complementing the Primer-grounded records. The book gives teams a shared vocabulary for working together; I read it as the executive's instrument panel: the modes are how I design coordination on purpose, and friction in them is how I sense when the design has drifted. If you lead teams in my organization, this record explains why \"let's just collaborate closely with everyone\" gets pushback from me, and why I ask \"what mode is this relationship in?\" before anything else about a cross-team problem. The working checklist — every mode's entry criteria and warning signs — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Undesigned interaction defaults to everyone talking to everyone.** Left alone, a growing organization drifts toward maximum communication: every team syncs with every other team, calendars fill, and coordination cost grows faster than headcount. The fix is not better meeting hygiene; it is refusing to require every team to communicate with every other team, and designing each important relationship deliberately instead. Intentional communication is a structural property, not a behavioral aspiration.\n\n**Collaboration is a discovery tool, not a default posture.** Close joint work is exactly right when there is significant uncertainty or novelty, boundaries are not yet known, and both teams bring expertise worth combining. It is also expensive: responsibilities blur and cognitive load rises. So I treat it like any expensive instrument — used where the expected benefit justifies the load, time-boxed, limited to one other team at a time, with an explicit plan to step down to a service relationship once the boundary or API becomes clear. Collaboration that continues too long is not warmth; it is a sign the team boundaries may be wrong.\n\n**X-as-a-Service is where flow lives.** When one team provides a component, platform, or capability that another consumes with minimal day-to-day coordination, both sides get their attention back. But the mode only works if the provider treats the service like a product: a well-chosen boundary, clear documentation, strong developer experience, versioning taken seriously, a roadmap — and the discipline to consider consumer requests without automatically building them. A service that consumers need constant help to use is not a service; it is collaboration wearing a service's clothes.\n\n**Facilitating exists to make itself unnecessary.** When a team needs help closing a capability gap, a facilitating team coaches, mentors, and removes impediments — without taking ownership of the helped team's main work. The goal is self-sufficiency, agreed by both sides, on a temporary basis. A facilitator who ends up doing the work has failed at the actual job; a facilitating team that becomes a permanent dependency is a bottleneck with good intentions.\n\n![Split illustration contrasting a tangled web of connections between six teams with the same teams linked by a few deliberate connections of three distinct styles.](assets/images/team-interaction-modes/gridlock-vs-designed.jpeg)\n**Figure 2:** *Collaboration everywhere is gridlock; a few deliberately chosen interactions per team pair is a design.*\n\n**Modes follow team types.** Stream-aligned teams typically collaborate when discovery is needed, consume capabilities as a service, and occasionally receive facilitation; enabling teams live mostly in facilitating mode; complicated-subsystem and platform teams typically provide their capability as a service and drop into collaboration only when a boundary needs discovery or refinement. When a relationship runs in a mode that contradicts what the teams are, one of the two is misdefined.\n\n**Friction is data, and I refuse to waste it.** The most valuable thing the mode vocabulary gives me is a sensing instrument. When an interaction feels awkward, slow, or unclear, the tempting explanation is interpersonal — this pair of leads doesn't click. The usually correct explanation is structural: a missing capability, a misplaced boundary, or a mode that no longer fits the architecture or the stage of work. So I ask whether the current mode is helping flow or creating friction, review whether the boundaries still make sense, and use techniques like event storming or context mapping to redraw them. I also change modes deliberately as a probe: running collaboration temporarily to discover a better service boundary, or swapping modes to build empathy across a seam. The organization's interaction pains are its most honest telemetry.\n\n![Two team shapes with a sparking connection, a gauge measuring the friction, and a feedback arrow leading to a hand redrawing the boundary between them.](assets/images/team-interaction-modes/friction-as-sensing.jpeg)\n**Figure 3:** *Friction as sensing: the gauge on the interaction feeds the redesign of the boundary.*\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Every important team pair has an explicitly chosen mode. | Every pair of teams needs a relationship at all. |\n| Collaboration is time-boxed and limited to one other team at a time. | Collaboration is bad — it is the right tool for genuine discovery. |\n| Providers manage their service like a product. | Consumers get everything they ask for. |\n| Facilitation ends when the helped team is self-sufficient. | Enabling teams are a permanent staffing shortcut. |\n| Friction in an interaction is a structural signal. | Interpersonal problems never exist — but structure is my first suspect. |\n| Modes change as technology, size, and market needs change. | The mode chosen at design time is fixed forever. |\n\nConcretely: when a cross-team initiative lands on my desk, the first question is \"what mode is each relationship in, and did anyone choose it?\" New collaborations state their time box and their exit — usually a service boundary — up front. Platform and complicated-subsystem teams are reviewed as product organizations, with developer experience a first-class metric. And when two teams grind against each other, I open the boundary question before the personnel question.\n\n## Anti-Patterns\n\n- **Collaboration everywhere.** Every team pairs closely with every other team; meetings metastasize, ownership blurs, and nothing ships because everything blocks on everything.\n- **Mode by accident.** Teams interact however history left them interacting; nobody can say whether a relationship is collaboration or a service, so expectations are guessed, not known.\n- **The eternal collaboration.** A \"temporary\" joint effort with no time box and no exit plan — comfortable, expensive, and a standing sign that the boundary was never found.\n- **The service that isn't.** An \"as-a-Service\" boundary whose consumers need constant hand-holding — collaboration's coordination cost with neither mode's clarity.\n- **The facilitator who stays.** An enabling team that quietly becomes a permanent dependency, doing the work instead of growing the capability.\n- **Blaming the people.** Treating a structurally awkward interaction as a personality conflict, and burning goodwill on the wrong fix.\n\n## Related Records\n\n- [The Four Fundamental Team Topologies](four-fundamental-team-topologies.html) — appendix sibling; the four team types whose relationships these modes govern.\n- [Evolve Team Structures](evolve-team-structures.html) — appendix sibling; mode friction is the sensing input, structure evolution is the response.\n- [Internal Communication](internal-communication.html) — the communication system these modes make intentional rather than accidental.\n- [Working with Your CEO, Peers, and Engineering](working-with-your-ceo-peers-and-engineering.html) — the same explicit-interaction discipline, applied at the executive seam.\n\n## Scope and Revisiting\n\nThis principle governs how I design, review, and evolve team-to-team relationships. I revisit each important interaction's mode when technology, organization size, market needs, or team experience changes; whenever a collaboration passes its time box; and whenever friction telemetry says a boundary has drifted. The final test: every important interaction has an explicit mode, communication is intentional rather than accidental, and the structure is ready to evolve when the modes say it must.\n\n## Authoritative References\n\n- Matthew Skelton & Manuel Pais, *Team Topologies: Organizing Business and Technology Teams for Fast Flow* (IT Revolution Press, 2019) — the interaction-modes chapters this record's checklist distills.\n- The authors maintain further material, tools, and case studies at [teamtopologies.com](https://teamtopologies.com/).\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle. The Article tab carries the rationale, implications, and anti-patterns. Use this checklist for each team-to-team relationship.*\n\n## Define the Interaction Clearly\n\n- [ ] Identify the teams involved.\n- [ ] Identify each team's topology: stream-aligned, enabling, complicated-subsystem, or platform.\n- [ ] Decide the intended interaction mode: **Collaboration**, **X-as-a-Service**, or **Facilitating**.\n- [ ] Make the interaction explicit so teams know what behavior is expected.\n- [ ] Define who owns what responsibilities.\n- [ ] Define the expected communication channels and cadence.\n- [ ] Avoid requiring every team to communicate with every other team.\n- [ ] Revisit the interaction mode as technology, organization size, market needs, or team experience changes.\n\n## Collaboration Mode Checklist\n\n- Use **Collaboration** when teams need close joint work, rapid discovery, innovation, or learning.\n\n- [ ] There is significant uncertainty or novelty.\n- [ ] The teams need to discover new approaches, patterns, or boundaries.\n- [ ] The work benefits from high adaptability.\n- [ ] Both teams have useful expertise to combine.\n- [ ] The teams can work with high interaction and mutual respect.\n- [ ] Responsibility is intentionally shared for the outcome of the collaboration.\n- [ ] The collaboration is time-boxed or clearly limited.\n- [ ] The team is collaborating with **at most one other team at a time**.\n- [ ] The teams understand that boundaries may blur temporarily.\n- [ ] The expected benefit justifies the higher cognitive load.\n- [ ] There is a plan to reduce collaboration once boundaries or APIs become clearer.\n\n### Watch for\n\n- [ ] Collaboration continuing too long.\n- [ ] Too much shared responsibility with unclear ownership.\n- [ ] Excessive meetings or context-sharing overhead.\n- [ ] A sign that team boundaries may be wrong.\n\n## X-as-a-Service Checklist\n\n- Use **X-as-a-Service** when one team provides a component, API, platform, tool, or capability that another team can consume with minimal collaboration.\n\n- [ ] The service boundary is clear and well chosen.\n- [ ] One team clearly provides the service.\n- [ ] Another team clearly consumes the service.\n- [ ] Day-to-day collaboration is minimal.\n- [ ] The consuming team can use the service without needing deep implementation knowledge.\n- [ ] The providing team manages the service like a product.\n- [ ] The service has clear documentation.\n- [ ] The service is easy to test, deploy, use, and debug.\n- [ ] The developer experience is strong.\n- [ ] Versioning and backward compatibility are considered.\n- [ ] There is a roadmap or communication plan for future changes.\n- [ ] Requests from consuming teams are considered but not automatically built.\n- [ ] The service helps reduce cognitive load for consuming teams.\n\n### Watch for\n\n- [ ] Consumers need frequent help to use the service.\n- [ ] The API or boundary is unclear.\n- [ ] The service slows delivery instead of improving flow.\n- [ ] Innovation across the boundary becomes too slow.\n- [ ] The provider team lacks product or service management capabilities.\n\n## Facilitating Mode Checklist\n\n- Use **Facilitating** when one team helps another team improve, learn, unblock itself, or adopt new practices.\n\n- [ ] One team needs help closing a capability gap.\n- [ ] The facilitating team has relevant expertise.\n- [ ] The goal is to make the helped team self-sufficient.\n- [ ] The facilitating team is not taking ownership of the other team's main work.\n- [ ] The interaction is focused on coaching, mentoring, enabling, or removing impediments.\n- [ ] The facilitating team can detect gaps across multiple teams.\n- [ ] The facilitating team works with only a small number of teams at the same time.\n- [ ] Both teams understand the purpose and temporary nature of the facilitation.\n- [ ] The helped team is open to learning and changing practices.\n\n### Watch for\n\n- [ ] The facilitating team becoming a permanent dependency.\n- [ ] The helped team resisting assistance.\n- [ ] The interaction feeling unclear, awkward, or unfamiliar.\n- [ ] The facilitator doing the work instead of enabling the team.\n\n## Match Modes to Team Types\n\n### Stream-aligned teams\n\n- [ ] Typically use **Collaboration** with other teams when discovery is needed.\n- [ ] Typically consume capabilities through **X-as-a-Service**.\n- [ ] Occasionally receive **Facilitation** to improve capabilities.\n\n### Enabling teams\n\n- [ ] Typically use **Facilitating** mode.\n- [ ] Occasionally use **Collaboration** to jointly discover or shape practices.\n\n### Complicated-subsystem teams\n\n- [ ] Typically provide capabilities through **X-as-a-Service**.\n- [ ] Occasionally use **Collaboration** when discovery or boundary refinement is needed.\n\n### Platform teams\n\n- [ ] Typically provide the platform through **X-as-a-Service**.\n- [ ] Occasionally use **Collaboration** to discover or refine platform capabilities.\n\n## Team Behavior Checklist\n\n### Collaboration behavior\n\n- [ ] Teams interact frequently.\n- [ ] Teams show mutual respect.\n- [ ] Teams are willing to share responsibility.\n- [ ] Teams use practices such as pairing, mobbing, workshops, or whiteboarding when useful.\n- [ ] Teams avoid blame when boundaries are unclear.\n\n### X-as-a-Service behavior\n\n- [ ] The provider team focuses on the user and developer experiences.\n- [ ] The consumer team gives clear feedback.\n- [ ] The provider team treats the service as a product.\n- [ ] The interaction is low-friction and predictable.\n\n### Facilitating behavior\n\n- [ ] The facilitating team helps without taking over.\n- [ ] The receiving team is open to being helped.\n- [ ] The goal is capability growth, not permanent dependency.\n- [ ] Both teams agree on what \"self-sufficient\" looks like.\n\n## Evolution and Improvement Checklist\n\n- [ ] Use collaboration temporarily to discover better service boundaries.\n- [ ] Move from collaboration to X-as-a-Service once the boundary is stable.\n- [ ] Use facilitating teams to support new structures during a Reverse Conway maneuver.\n- [ ] Temporarily change interaction modes to build empathy and experience.\n- [ ] Treat awkward interactions as signals of missing capabilities or misplaced boundaries.\n- [ ] Ask whether the current mode is helping flow or creating friction.\n- [ ] Review whether the interaction mode still fits the current architecture.\n- [ ] Review whether the team boundaries still make sense.\n- [ ] Use techniques like event storming or context mapping to clarify boundaries.\n\n## Final Review\n\n- [ ] Every important team interaction has an explicit mode.\n- [ ] Teams know whether they are collaborating, consuming/providing a service, or facilitating.\n- [ ] Responsibilities are clear.\n- [ ] Boundaries are clear enough for the current stage of work.\n- [ ] Communication is intentional, not accidental.\n- [ ] The interaction mode supports fast flow.\n- [ ] The organization is ready to evolve team structures and interaction modes when needed.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Choose the mode, don't inherit it — why three deliberate interaction modes beat collaboration everywhere, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Leo proudly presents a wall chart where every team is connected to every other team while Vera looks skeptical.](assets/images/team-interaction-modes/comic-01-everyone-collaborates.jpeg)\n**Panel 1:** *The hook: 'everyone collaborates with everyone' worn as a badge of honor.*\n\n![Leo overwhelmed by calendar invites while teams in the background wait on each other in a circle.](assets/images/team-interaction-modes/comic-02-gridlock.jpeg)\n**Panel 2:** *The problem: all-to-all collaboration means gridlock — everything blocks on everything.*\n\n![Vera draws three diagrams on a whiteboard showing an overlap, a socket joint, and a dotted arc between team shapes.](assets/images/team-interaction-modes/comic-03-three-modes.jpeg)\n**Panel 3:** *The principle: three modes — collaboration, X-as-a-Service, facilitating — chosen deliberately per team pair.*\n\n![Two teams working closely in a shared zone full of sketches while Vera points at a large hourglass.](assets/images/team-interaction-modes/comic-04-collaboration-timebox.jpeg)\n**Panel 4:** *Collaboration: high-bandwidth discovery — worth its high cost only when time-boxed with an exit.*\n\n![A team plugs into a clean, well-documented socket provided by another team while Vera comments.](assets/images/team-interaction-modes/comic-05-service-socket.jpeg)\n**Panel 5:** *X-as-a-Service: a clean socket — clear ownership, strong docs, minimal day-to-day coordination.*\n\n![A coaching figure helps a team along a dotted arc, then walks away as the team continues on its own.](assets/images/team-interaction-modes/comic-06-facilitate-then-leave.jpeg)\n**Panel 6:** *Facilitating: grow the capability, agree what self-sufficient means, then step away.*\n\n![Vera listens to a sparking connection between two teams with a stethoscope while pointing at the boundary line.](assets/images/team-interaction-modes/comic-07-friction-sensing.jpeg)\n**Panel 7:** *Friction as sensing: an awkward interaction points at a wrong boundary or mode, not at bad people.*\n\n![Vera and Leo stand before a tidy chart of a few deliberate team connections, Vera closing her notebook.](assets/images/team-interaction-modes/comic-08-designed-flow.jpeg)\n**Panel 8:** *The closer: interaction by design — an explicit mode for every important pair, and room to flow.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
