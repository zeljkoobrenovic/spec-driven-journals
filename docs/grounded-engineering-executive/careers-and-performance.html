<script id="data" type="application/json">{"meta": {"id": "EXEC-CAREERS-AND-PERFORMANCE", "status": "draft:gray", "title": "Careers, Hiring, and Performance", "date": "2026-07-26", "author": "Željko Obrenović", "permalink": "careers-and-performance", "timetoread": "10 min", "excerpt": "Careers run on luck more than we admit, and I treat reducing luck's share as my job. I build the systems underneath careers: humane, instrumented hiring funnels; interview loops that test real skills against rubrics rather than polish; career ladders with crisp level boundaries; and calibration that compares people against expectations, never against each other. Weak-performance feedback happens immediately — the cycle is never the first time anyone hears it.", "tags": "engineering executive, careers, hiring funnel, interviews, performance management, career ladders", "icon": "assets/icons/careers-and-performance.png", "logo": "assets/images/careers-and-performance/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "careers", "hiring funnel", "interviews", "performance management", "career ladders"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: Careers run on luck more than we admit, so I build systems that reduce luck's share: humane, instrumented hiring funnels; interview loops that test real skills against explicit rubrics; cold sourcing that reaches beyond homogeneous networks; career ladders with crisp level boundaries; and calibration that compares people against expectations rather than against each other. The systems stay simple enough to understand, and they never replace immediate feedback — a performance cycle is a summary, not a surprise.\n\n## Statement\n\nCareers in my organization should be decided by the work, not by who happened to interview someone, which manager argued well in calibration, or which quarter a project landed. Luck cannot be eliminated, but its share can be shrunk. My operating model has four parts:\n\n- **An instrumented hiring funnel.** Hiring is identify → motivate → evaluate → close, and each stage is measured: conversion rates, source quality, drop-off points, interviewer load, offer acceptance, candidate experience. The funnel extends past the offer — onboarding success, time to productivity, impact, promotion timing, retention — because hiring is part of the organization's lifecycle, not just recruiting.\n- **Humane, designed interview loops.** Every interview knows what signal it checks and uses a format that actually reveals it — realistic work samples over artificial puzzles. Interviewers write feedback independently before group discussion, new interviewers pair with experienced ones, and kindness to candidates is a design requirement, not a nice-to-have.\n- **Ladders with crisp boundaries.** Career ladders are self-contained and short, with clearly defined levels, so people can self-assess against them. Few ladders, created only when enough people justify them.\n- **Calibration against the ladder, not against each other.** Designations state performance against expectations. Calibration is a quest for consistency: participants read the reviews rather than watch presentations, distributions are studied but never forced into a curve, and calibrators need psychological safety to do honest work.\n\n![Dice representing career luck progressively replaced left to right by gears, a funnel, and a ladder, ending at a balanced scale.](assets/images/careers-and-performance/luck-to-systems.jpeg)\n**Figure 1:** *The thesis: luck cannot be eliminated from careers, but fair systems steadily shrink its share.*\n\n## How to Read This\n\nThis is an **appendix record**: grounded not in *The Engineering Executive's Primer* like this journal's core records, but in Will Larson's earlier, manager-focused book *An Elegant Puzzle* — read here through an executive lens. The book addresses the manager running these systems; I read it as the executive who owns their design and fairness, even where managers operate them daily.\n\nThe boundary with [Hiring](hiring.html) matters: that record covers my *role* in hiring as an executive — where I personally engage, what I delegate, how I keep hiring an executive priority. This record covers the *systems underneath*: the funnel, the loops, the ladders, the designations, and the calibration machinery that make careers fair regardless of who is watching. The working checklist lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Luck is the default allocator; fairness has to be built.** Left alone, careers are decided by noise. Every fair process I build — a rubric, a ladder, a calibration norm — transfers some of luck's share back to the work itself. Growth follows the same logic: it comes from navigating change, not from tenure, so I map years into eras and transitions and never assume company growth automatically creates personal growth.\n\n**Unmeasured funnels hide their failures.** Without instrumentation, hiring debates run on anecdote: the loudest recent story wins. With conversion rates, source quality, drop-off points, and offer-acceptance data, the funnel tells me where to improve first. And it must extend past the offer — a loop that produces hires who onboard slowly, plateau, and leave is a failing loop, whatever its acceptance rate says.\n\n**Referral networks reproduce themselves.** Referrals are limited by network size and skewed by network homogeneity — hiring only through them means hiring people who look like the people we already have. Cold sourcing is the deliberate counterweight: a small, consistent weekly investment, tracked like any other source, in close partnership with recruiters.\n\n![Four-stage hiring funnel with gauges at each stage, continuing past the offer into onboarding, productivity, and retention milestones.](assets/images/careers-and-performance/instrumented-funnel.jpeg)\n**Figure 2:** *The instrumented funnel: identify → motivate → evaluate → close — and it does not end at the offer.*\n\n**Interviews measure what they test, not what we hope.** An undesigned interview tests polish and confidence by accident. So loops start from funnel metrics, identify the skills that matter, design a test per skill with a rubric, and group tests into coherent interviews. Then the discipline: iterate interviews a little, rubrics a lot; review the funnel after 10–20 candidates; refresh annually; use hiring committees to detect patterns and keep the loop fair. Independent written feedback before group discussion keeps eight opinions from collapsing into one loud one.\n\n**Comparing people to each other corrupts everything downstream.** The moment designations become a ranking of people, calibration becomes a courtroom and managers become advocates. Comparing against the ladder keeps the question answerable — did this work meet these written expectations? — and makes the classic failure modes visible: designation momentum, tit-for-tat favoritism, level drift, crisis- or retention-driven designations handed out under pressure.\n\n**A cycle must never be the first time someone hears it.** Cycles summarize; they do not inform. Weak-performance feedback is given immediately, when it can still change the outcome. A designation that surprises its recipient is a management failure.\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Fair process shrinks luck's share of career outcomes. | Process eliminates luck. It cannot; it can only reduce it. |\n| Every interview knows its signal and has a rubric. | Interviews become mechanical. Kindness and genuine interest are design requirements. |\n| People are measured against a written ladder. | People are ranked against each other. Never. |\n| Distributions are studied in calibration. | A curve is forced. It is not. |\n| Weak-performance feedback is immediate. | Cycles are pointless. They summarize and make the system consistent. |\n| Specialized roles are possible. | They are cheap. They need a sponsor, a mission, a ladder, and dedicated calibration from day one. |\n\nTwo practices deserve emphasis. First, **the system stays simple**: ladders self-contained and short, few of them, a stable cycle cadence, the whole apparatus understandable by the people it evaluates — a performance system nobody can explain is a fairness risk in itself. Second, **specialized roles are created reluctantly**: only for a real problem an existing ladder cannot absorb, with eyes open to class-system dynamics, brittle design, and task offloading, and with the success requirements secured up front — sponsor, self-sustaining mission, ladder from day one, role models, dedicated calibration.\n\n![Crossed-out podium ranking people against each other beside the preferred picture of each person measured against rungs of a single ladder.](assets/images/careers-and-performance/ladder-not-each-other.jpeg)\n**Figure 3:** *Calibration done right: against the ladder's written expectations, never against each other.*\n\n## Anti-Patterns\n\n- **The unexplainable system.** A performance apparatus so intricate that employees cannot predict how their work maps to outcomes — complexity is where bias hides.\n- **Stack ranking by another name.** Any calibration habit that quietly turns \"against expectations\" into \"against each other,\" including forced curves.\n- **The heroic gut-feel interview.** Interviewers freestyle, test polish by accident, and discover in the debrief that nobody checked the core skill.\n- **Feedback groupthink.** Group discussion before independent written feedback — the loudest voice becomes the loop's only signal.\n- **Referral monoculture.** Treating a homogeneous referral stream as a healthy pipeline because it is cheap.\n- **The cycle-time ambush.** Saving weak-performance feedback for the formal cycle, then presenting the accumulated case as a verdict.\n- **Designation momentum.** Last cycle's rating silently becoming this cycle's starting point, in either direction.\n- **The casual specialized role.** A niche role created to solve a staffing headache, with no sponsor, no ladder, and no calibration home — a career dead end in the making.\n\n## Related Records\n\n- [Hiring](hiring.html) — my role in hiring as an executive; this record is the systems underneath it.\n- [Engineering Onboarding](engineering-onboarding.html) — the extended funnel's first segment: onboarding success and time to productivity.\n- [Calibrating Your Standards](calibrating-your-standards.html) — how I calibrate my own standards; this record is how the organization calibrates its designations.\n- [Measuring Engineering Organizations](measuring-engineering-organizations.html) — the measurement discipline the instrumented funnel belongs to.\n- [Organizational Design](organizational-design.html) — appendix sibling: the structures these careers grow inside.\n- [Engineering Culture](engineering-culture.html) — appendix sibling: the culture that makes fair process credible.\n\n## Scope and Revisiting\n\nThis principle governs the career, hiring, and performance systems of my organization — the parts managers run daily and I own structurally. I revisit it when the instrumentation shows the funnel degrading, when a calibration cycle produces surprises or visible favoritism, at annual interview-loop refreshes, and whenever the organization's size changes enough that ladders, levels, or cycle cadence stop fitting.\n\n## Authoritative References\n\n- Will Larson, *An Elegant Puzzle: Systems of Engineering Management* (Stripe Press, 2019) — the careers, hiring, and performance-management material this record distills.\n- Many of the book's chapters began as freely available essays on [lethain.com](https://lethain.com/), where the underlying arguments can still be read.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle. The Article tab carries the rationale, implications, and anti-patterns.*\n\n## Career Growth\n\n- [ ] Recognize that luck affects careers, and reduce its impact where you can.\n- [ ] Focus on creating fair processes for interviewing, promotion, and growth.\n- [ ] Map your past year into **eras** and **transitions**.\n- [ ] For each transition, identify:\n  - [ ] What changed in how you worked.\n  - [ ] What skills you relied on.\n  - [ ] What skills you developed.\n- [ ] Treat both stable periods and transitions as growth opportunities.\n- [ ] Do not assume company growth automatically creates personal growth.\n- [ ] Look for change, because growth usually comes from navigating change.\n\n## Humane Interview Process\n\n### Interview Process Design\n\n- [ ] Be kind to candidates.\n- [ ] Ensure all interviewers agree on the role's requirements.\n- [ ] Understand what signal each interview is checking for.\n- [ ] Choose interview formats that actually reveal that signal.\n- [ ] Come prepared to every interview.\n- [ ] Deliberately express interest in candidates.\n- [ ] Create feedback loops for interviewers and process designers.\n- [ ] Instrument and optimize the hiring funnel.\n\n### Candidate Experience\n\n- [ ] Allow candidates time to ask questions, especially if the interview runs long.\n- [ ] Avoid time-constrained, rushed, or adversarial interview formats.\n- [ ] Give overloaded interviewers a break from interviewing.\n- [ ] Watch for interviewer burnout.\n- [ ] Maintain strong communication between engineering managers and recruiters.\n- [ ] Send positive follow-up notes to candidates when appropriate.\n- [ ] Ask candidates for feedback on the interview process.\n\n### Interview Calibration\n\n- [ ] Define the role before interviewing.\n- [ ] Agree on required skills and expectations.\n- [ ] Break the interview loop into slots that cover all key signals.\n- [ ] Use redundancy so more than one interviewer checks important signals.\n- [ ] Prefer realistic work samples over artificial puzzles where possible.\n- [ ] Have interviewers write feedback independently before group discussion.\n- [ ] Pair new interviewers with experienced interviewers.\n- [ ] Review candidate feedback and debrief quality regularly.\n\n## Cold Sourcing\n\n### Candidate Sources\n\n- [ ] Track candidates by source:\n  - [ ] Inbound applicants.\n  - [ ] Referrals.\n  - [ ] Sourced candidates.\n- [ ] Recognize that referrals are limited by personal network size.\n- [ ] Watch for network homogeneity when relying heavily on referrals.\n- [ ] Use cold sourcing to move beyond existing personal networks.\n\n### Cold Sourcing Process\n\n- [ ] Join or actively use LinkedIn or another professional network.\n- [ ] Build your network by connecting with people you actually know.\n- [ ] Be patient with platform throttling and slow growth.\n- [ ] Search for second-degree connections by title, company, or role.\n- [ ] Send short, polite outreach notes.\n- [ ] Invite candidates to coffee or a short call.\n- [ ] Track who you contacted and what happened.\n- [ ] Spend a small, consistent amount of time each week on sourcing.\n- [ ] Partner closely with recruiters.\n- [ ] Treat sourcing as learning, not just candidate acquisition.\n\n## Hiring Funnel\n\n### Funnel Fundamentals\n\n- [ ] Define the hiring funnel:\n  - [ ] Identify candidates.\n  - [ ] Motivate candidates to apply or engage.\n  - [ ] Evaluate candidates.\n  - [ ] Close candidates.\n- [ ] Clearly define the role.\n- [ ] Spend time with candidates to build motivation.\n- [ ] Evaluate for certainty, candidate experience, and efficiency.\n- [ ] Close by selling the role, expressing need, and spending time.\n\n### Instrumentation\n\n- [ ] Track conversion rates at each stage.\n- [ ] Track candidate source quality.\n- [ ] Track where candidates drop off.\n- [ ] Track interviewer load and burnout.\n- [ ] Track offer acceptance rates.\n- [ ] Track candidate experience feedback.\n- [ ] Use the data to decide where to improve first.\n\n### Extended Funnel\n\n- [ ] Track onboarding success.\n- [ ] Track time to productivity.\n- [ ] Track employee impact after hiring.\n- [ ] Track promotion timing.\n- [ ] Track retention.\n- [ ] Treat hiring as part of the organization's long-term lifecycle, not just recruiting.\n\n## Performance Management\n\n### System Components\n\n- [ ] Define career ladders.\n- [ ] Define performance designations.\n- [ ] Define performance cycles.\n- [ ] Make the system simple enough to understand and use.\n- [ ] Use the system to give explicit feedback on how work is valued.\n\n### Career Ladders\n\n- [ ] Create ladders for roles with enough people to justify them.\n- [ ] Keep ladders self-contained and short.\n- [ ] Use a shared template across ladders.\n- [ ] Define levels clearly.\n- [ ] Make level boundaries crisp.\n- [ ] Help employees self-assess using the ladder.\n- [ ] Avoid creating too many ladders too early.\n\n### Performance Designations\n\n- [ ] Use designations as explicit statements of performance against expectations.\n- [ ] Gather self-review input.\n- [ ] Gather peer-review input.\n- [ ] Gather upward-review input where relevant.\n- [ ] Gather manager-review input.\n- [ ] Use calibration to keep ratings consistent and fair.\n- [ ] Compare people against the ladder, not against each other.\n- [ ] Avoid using performance designations as a substitute for immediate feedback.\n\n### Calibration\n\n- [ ] Frame calibration as a quest for consistency.\n- [ ] Have participants read reviews rather than rely on presentations.\n- [ ] Compare against role expectations.\n- [ ] Study rating distributions without forcing a fixed curve.\n- [ ] Watch for bias and politicization.\n- [ ] Build psychological safety and trust among calibrators.\n\n### Performance Cycles\n\n- [ ] Decide how often performance cycles happen.\n- [ ] Avoid changing the cycle too frequently.\n- [ ] Practice the process before running it at scale.\n- [ ] Give weak-performance feedback immediately, not only during cycles.\n- [ ] Keep performance, promotion, and compensation decisions clear.\n\n## Career-Level Risks\n\n- [ ] Watch for designation momentum.\n- [ ] Help employees set clear goals for the designation they aim to achieve.\n- [ ] Watch for tit-for-tat favoritism in calibration.\n- [ ] Watch for level expansion as the company ages.\n- [ ] Watch for level drift and compensation pressure.\n- [ ] Manage moments when many people cross level boundaries together.\n- [ ] Define career-level limits where useful.\n- [ ] Consider level splits carefully.\n- [ ] Use crisis- or retention-driven designations only with caution.\n\n## Specialized Roles\n\n### Before Creating a Specialized Role\n\n- [ ] Identify the problem the new role is meant to solve.\n- [ ] Check whether the issue can be solved by adjusting an existing ladder.\n- [ ] Check whether the function already exists informally.\n- [ ] Ask whether the role will improve recognition without limiting long-term career growth.\n- [ ] Confirm enough people will be affected to justify the role.\n- [ ] Decide who will maintain the role over time.\n\n### Risks to Consider\n\n- Class-system dynamics.\n- Brittle organization design.\n- Pattern matching from other companies.\n- Task offloading.\n- Work being viewed as trivial.\n- Work being valued for impact but not promotion.\n- Headcount planning obstacles.\n- Unrealistically high hiring bars.\n- Difficulty evaluating candidates.\n\n### Success Requirements\n\n- [ ] Secure an executive or senior sponsor.\n- [ ] Ensure recruiting support.\n- [ ] Define a self-sustaining mission.\n- [ ] Create a career ladder from the beginning.\n- [ ] Identify external and internal role models.\n- [ ] Run dedicated calibration for the specialized role.\n\n### Benefits to Validate\n\n- Increased efficiency.\n- Better ability to solve constraints.\n- Improved recognition of specialized work.\n- Better evaluation of specialist strengths.\n- Increased hiring pool.\n- Appropriate specialized compensation where needed.\n\n## Interview Loop Design\n\n- [ ] Start with metrics from the hiring funnel.\n- [ ] Understand current loop performance.\n- [ ] Review funnel performance.\n- [ ] Review employee trajectory after hiring.\n- [ ] Conduct candidate debriefs.\n- [ ] Learn from peer companies.\n- [ ] Identify role models for the role.\n- [ ] Identify the skills that matter most.\n- [ ] Design a test for each skill.\n- [ ] Avoid testing for polish by accident.\n- [ ] Create a rubric for every test.\n- [ ] Avoid Boolean rubrics when they do not provide sufficient signal.\n- [ ] Group tests into coherent interviews.\n- [ ] Run the loop.\n- [ ] Review the hiring funnel after 10–20 candidates.\n- [ ] Schedule an annual refresh.\n- [ ] Avoid design by committee.\n- [ ] Do not hire for vague \"potential\" unless you have an objective rubric.\n- [ ] Reuse the career ladder where possible.\n- [ ] Iterate interviews a little.\n- [ ] Iterate rubrics a lot.\n- [ ] Consider A/B testing loops at sufficient scale.\n- [ ] Use hiring committees to detect patterns and maintain fairness.\n- [ ] Avoid reusing interview material that you already know does not work.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "How fair systems — funnels, rubrics, and ladders — take luck out of the driver's seat of careers, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Leo shrugs in front of a wall of team portraits telling Vera that a star hire got lucky and promotions feel random.](assets/images/careers-and-performance/comic-01-just-got-lucky.jpeg)\n**Panel 1:** *The hook: when hiring and promotion look like luck, something is wrong.*\n\n![Vera's whiteboard sketch shows career paths blocked by giant tumbling dice labeled interviewer, timing, and who argues for you.](assets/images/careers-and-performance/comic-02-careers-run-on-dice.jpeg)\n**Panel 2:** *The problem: left alone, careers are decided by noise, not work.*\n\n![Vera swaps whiteboard dice for gears labeled funnel, rubrics, and ladder as Leo leans in.](assets/images/careers-and-performance/comic-03-shrink-lucks-share.jpeg)\n**Panel 3:** *The principle: fair systems steadily shrink luck's share of career outcomes.*\n\n![Vera and Leo study a four-stage hiring funnel with gauges that continues past the offer to onboarding and retention flags.](assets/images/careers-and-performance/comic-04-instrumented-funnel.jpeg)\n**Panel 4:** *The funnel: identify, motivate, evaluate, close — measured at every stage, and past the offer.*\n\n![Vera holds a rubric clipboard beside a candidate doing a realistic work sample while Leo sheepishly holds a puzzle cube.](assets/images/careers-and-performance/comic-05-rubrics-not-puzzles.jpeg)\n**Panel 5:** *The loops: realistic work samples scored against rubrics — never polish by accident.*\n\n![Vera moves figure cards from a head-to-head lineup to positions beside a ladder chart with labeled rungs.](assets/images/careers-and-performance/comic-06-ladder-not-each-other.jpeg)\n**Panel 6:** *Calibration: performance is measured against the ladder's expectations, never as a ranking of people.*\n\n![A crossed-out scene of a shocking review envelope contrasts with Vera giving calm same-day feedback at an employee's desk.](assets/images/careers-and-performance/comic-07-no-cycle-surprises.jpeg)\n**Panel 7:** *Feedback: delivered immediately — a performance cycle is a summary, not an ambush.*\n\n![Vera and Leo stand before the finished systems whiteboard while a single tiny die sits retired in a display case.](assets/images/careers-and-performance/comic-08-luck-retired.jpeg)\n**Panel 8:** *The closer: fair systems are how luck stops deciding careers.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
