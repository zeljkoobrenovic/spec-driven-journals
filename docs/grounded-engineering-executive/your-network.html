<script id="data" type="application/json">{"meta": {"id": "EXEC-YOUR-NETWORK", "status": "draft:gray", "title": "Your Network", "date": "2026-07-25", "author": "Željko Obrenović", "permalink": "your-network", "timetoread": "8-10 min", "excerpt": "I build my executive network as a long-term exchange of value, not extraction. I clarify one or two learning goals, prioritize relationships aligned to what I am actively learning, favor working together and precise near-network outreach over vague asks, and prefer small curated peer circles over large forums. The whole practice runs at a sustainable, modest rhythm — networking stays important, but never my top priority.", "tags": "engineering executive, network, peers, outreach, community, leadership", "icon": "assets/icons/network.png", "logo": "assets/images/your-network/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "network", "peers", "outreach", "community", "leadership"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I build and use my executive network as a long-term exchange of value, not extraction. I clarify one or two learning goals and prioritize relationships aligned to what I am actively learning; I favor working together and precise near-network outreach — two to four sentences, one specific question — over vague \"can we chat\" asks; and I prefer small curated peer circles to large forums, because easier access means lower signal. The whole practice runs at a sustainable, modest rhythm: networking stays important, but it is never my top priority.\n\n## Statement\n\nA curated network is executive infrastructure — the channel through which I benchmark team sizes and org structures, calibrate vendor pricing and compensation, get sensitive executive-team advice, read the job market, and run backchannel references on senior hires. None of that comes from a database; all of it comes from relationships. Four commitments govern how I build and use them:\n\n- **Exchange of value, not extraction.** I focus on being useful to others, not just getting help. I respect people's time and social capital, and I assume the whole thing takes consistent effort over years.\n- **Goals before contacts.** I define one or two specific learning goals — org design, pricing, hiring — and prioritize relationships aligned to what I am actively learning, rather than accumulating contacts indiscriminately.\n- **Precision in outreach.** The best network-building is working together. When I reach out cold, it is to my near network (mutual connections), in two to four concise sentences, with one clear, specific question — never a vague ask, never a demand on someone's calendar, never repeated follow-ups into silence.\n- **Small and curated over large and open.** For executive-level discussion I prefer a small, private peer circle with thoughtful members and a code of conduct. Large communities are for broad learning, not for sensitive questions.\n\n![Hub-and-spoke diagram of an executive connected by two-way bridges to nodes labeled Benchmarks, Comp signals, Sensitive advice, Market read, and Backchannel refs.](assets/images/your-network/network-as-infrastructure.jpeg)\n**Figure 1:** *The network as executive infrastructure: two-way relationships carrying what no internal channel can.*\n\n\n## How to Read This\n\nThis record tells engineering leaders — including future me — how much I invest in networking and how, and tells peers and near-network contacts what an outreach or exchange with me looks like. The working practices, from outreach discipline to the sustainable rhythm, live in the **Checklist** tab of this post. Public writing and speaking appear here only as a secondary networking channel; as a reputation strategy they belong to [Personal and Organizational Prestige](personal-and-organizational-prestige.html), and using the network to find a role belongs to [Getting the Job](getting-the-job.html).\n\n## Rationale\n\n**Executives need an outside network because the inside cannot answer their questions.** Once I am the most senior engineering leader in a company, nobody inside it can benchmark my org design, sanity-check a vendor renewal, calibrate executive compensation, or advise on a sensitive executive-team conflict. The questions that matter most at this level are exactly the ones that cannot be asked internally — so the network is not a career accessory; it is the peer group the org chart no longer provides.\n\n**Value flows back to people who send it out.** A network built on extraction depletes itself: people notice one-way relationships and quietly stop responding. So I close loops deliberately — after receiving help, I share the outcome and what worked, and I thank people for the specific advice. Being useful first is not politeness; it is what keeps the channel alive for the next decade.\n\n**Easier access means lower signal.** Large open communities are valuable for broad learning, but they cannot carry executive-grade discussion: sensitive details do not belong in public spaces, and complex issues rarely get high-quality answers there. The advice worth having concentrates in small, private, curated circles — which is why I invest in one, with strong communicators, a code of conduct, and a real commitment to operating the group.\n\n![A downward-sloping curve from a small ringed cluster labeled Curated circle at high signal to a large dot cloud labeled Open forum at high access and low signal.](assets/images/your-network/access-vs-signal.jpeg)\n**Figure 2:** *Easier access means lower signal: executive-grade discussion concentrates in small, private, curated circles.*\n\n\n**Vague asks are the tax that kills outreach.** \"Can we grab some time to chat?\" transfers all the work to the recipient: they must guess the topic, estimate the cost, and schedule the meeting. A two-to-four-sentence message with one specific question can be answered from a phone in a minute. The discipline is not etiquette — it is what makes the difference between outreach that works and outreach that gets ignored. And when outreach isn't working, I ask for feedback on my approach rather than doubling the volume.\n\n![Two message cards: a long vague ask that dumps guessing, time, and scheduling on the recipient, versus a four-line message with one question answered in a minute.](assets/images/your-network/outreach-anatomy.jpeg)\n**Figure 3:** *Anatomy of outreach that works: two to four sentences, one specific question, no work transferred to the recipient.*\n\n\n**A modest rhythm outlasts a sprint.** Networking rewards consistency over intensity: one new person a month, light periodic follow-ups with useful context, a simple record of who I have connected with. Anything heavier competes with the actual job — and per [Managing Priorities and Energy](managing-energy.html), the practice has to stay important without becoming a top priority.\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Networking is a long-term exchange of value. | Keep score on every favor — the repayment is eventual and diffuse. |\n| Focus relationships on 1–2 active learning goals. | Ignore people outside the goals — working relationships remain the high-leverage path. |\n| Cold outreach: near network, 2–4 sentences, one specific question. | Never reach out cold — done precisely, it works. |\n| Prefer small curated circles for executive discussion. | Abandon large communities — they are still where I learn broadly. |\n| Keep a modest, sustainable rhythm (about one new person a month). | Networking is my top priority — it stays important, never first. |\n\nBeyond peers, three other networks get deliberate, lighter-touch investment: **founders** (for perspective, and for advice when navigating founder dynamics), **venture capitalists** (pattern-level relationships for portfolio- and industry-level questions, met through CEO and board connections), and **executive recruiters** (relationships built before I need a job, maintained with periodic light-touch contact). Each is a thin variation of the same exchange-of-value principle.\n\n## Anti-Patterns\n\n- **The vague ask.** \"Can we grab some time to chat?\" — a time-based request with no question in it. It signals that my convenience outranks their cost, and it deserves the silence it usually gets.\n- **Extraction networking.** Appearing only when I need something — a reference, an introduction, a job — and vanishing between needs. Networks route around one-way nodes.\n- **The multi-part request.** Bundling three questions and two introduction asks into one message. Confusing requests get deferred forever; one clear question gets answered today.\n- **Introductions without mutual value.** Asking someone to spend their social capital connecting me with no story for why the other side benefits.\n- **Overconsuming communities.** Harvesting answers from other people's forums and circles without ever contributing back.\n- **Content as the primary strategy.** Relying on writing and speaking to build the network. I write when I enjoy it — but weighed against direct outreach and working relationships, content is the secondary channel, per [Personal and Organizational Prestige](personal-and-organizational-prestige.html).\n\n## Related Records\n\n- [Personal and Organizational Prestige](personal-and-organizational-prestige.html) — the passive-awareness complement: prestige makes people receptive; the network is the active relationships.\n- [Getting the Job](getting-the-job.html) — where the network gets spent: finding and evaluating the next role.\n- [Onboarding Peer Executives](onboarding-peer-executives.html) — the deepest form of network-building: turning a new peer into a long-term working relationship.\n- [Working with Your CEO, Peers, and Engineering](working-with-your-ceo-peers-and-engineering.html) — the internal peer network this external one complements.\n- [Managing Priorities and Energy](managing-energy.html) — the sustainable-rhythm constraint that keeps networking from becoming a second job.\n\n## Scope and Revisiting\n\nThis principle governs my own networking practice — the mindset, the outreach discipline, and the rhythm. I revisit it when my learning goals change (which should redirect where the effort goes), when outreach stops getting responses (a signal to seek feedback on my approach, not to increase volume), and at role transitions, when the network's value becomes most visible.\n\n## Authoritative References\n\n- Will Larson, *The Engineering Executive's Primer* (O'Reilly, 2024) — the \"Your Network\" chapter this record's checklist distills; the principle above is my operating commitment to it.\n- Will Larson, [Building your executive network](https://lethain.com/building-exec-network/) — the freely available companion essay.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle, grouped from mindset through building and maintaining. The Article tab carries the rationale, implications, and anti-patterns.*\n\n### Adopt the Right Mindset\n\n- [ ] Treat networking as an exchange of value, not extraction.\n- [ ] Assume it will take consistent effort over time.\n- [ ] Focus on being useful to others, not just getting help.\n- [ ] Respect people's time and social capital.\n\n### Clarify Your Networking Goals\n\n- [ ] Identify current challenges where an outside perspective would help.\n- [ ] Define 1–2 specific learning goals (e.g., org design, pricing, hiring).\n- [ ] Prioritize relationships aligned to what you're actively learning.\n\n### Leverage Your Network Effectively\n\n**Use your network for:**\n\n- [ ] Benchmarking team sizes and org structure.\n- [ ] Vendor pricing and renewal negotiation insights.\n- [ ] Sensitive executive-team advice.\n- [ ] Compensation calibration and market signals.\n- [ ] Job market and career move perspective.\n- [ ] Backchannel references on senior hires.\n\n**After receiving help:**\n\n- [ ] Share outcomes and context on what worked.\n- [ ] Thank them and acknowledge specific advice.\n\n### Build Your Network Intentionally\n\n**Work Together (High-Leverage Path)**\n\n- [ ] Spend time at a fast-growing company in a major tech hub (if early career).\n- [ ] Invest in strong peer relationships while working together.\n\n**Cold Outreach (Done Well)**\n\n- [ ] Reach out to \"near network\" contacts (mutual connections).\n- [ ] Keep messages to 2–4 concise sentences.\n- [ ] Ask one clear, specific question.\n- [ ] Avoid vague asks like \"Can we chat?\"\n- [ ] Do not demand time; offer flexibility instead.\n- [ ] Avoid repeated follow-ups if there is no reply.\n- [ ] Reuse effective outreach templates thoughtfully.\n\n### Consider Community Building\n\n- [ ] Join or create a small, curated peer learning circle.\n- [ ] Select thoughtful, strong communicators.\n- [ ] Establish a code of conduct.\n- [ ] Commit to maintaining and operating the group.\n- [ ] Prefer small, private groups for executive-level discussions.\n\n### Be Realistic About Large Communities\n\n- [ ] Use large forums to learn broadly.\n- [ ] Avoid sharing sensitive executive details publicly.\n- [ ] Don't expect high-quality advice on complex issues in open spaces.\n- Reminder: easier access often means lower signal.\n\n### Be Strategic About Writing & Speaking\n\n- [ ] Write or speak publicly if you enjoy it.\n- [ ] Don't rely on content creation as your primary networking strategy.\n- [ ] Weigh time investment vs. direct outreach and events.\n\n### Avoid Common Mistakes\n\n- [ ] Avoid vague time-based asks (\"grab some time to chat?\").\n- [ ] Avoid confusing or multi-part requests.\n- [ ] Avoid asking for introductions without clear mutual value.\n- [ ] Don't overconsume others' communities without contributing.\n- [ ] If outreach isn't working, get feedback on your approach.\n\n### Build Other Critical Networks\n\n**Founders**\n\n- [ ] Build relationships with founders for perspective.\n- [ ] Connect through startups or angel investing (if appropriate).\n- [ ] Seek the founder's advice if navigating founder dynamics.\n\n**Venture Capitalists**\n\n- [ ] Build pattern-level relationships with VCs.\n- [ ] Ask portfolio-level or industry-pattern questions.\n- [ ] Use CEO/board connections to meet a few trusted VCs.\n\n**Executive Recruiters**\n\n- [ ] Build relationships before you need a job.\n- [ ] Connect during hiring cycles.\n- [ ] Maintain periodic light-touch contact.\n\n### Maintain a Sustainable Rhythm\n\n- [ ] Set a modest goal (e.g., meet 1 new person per month).\n- [ ] Track who you've connected with.\n- [ ] Follow up periodically with useful context or updates.\n- [ ] Keep networking important — but not your top priority.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why an executive network is infrastructure, and how to build one without it becoming a second job.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Leo asks who sanity-checks Vera's org design and she points out the window saying nobody in this building.](assets/images/your-network/comic-01-nobody-inside.jpeg)\n**Panel 1:** *The hook: the questions that matter most cannot be asked internally.*\n\n![Comic panel: Vera points at an org chart where her top box has only empty dotted peer boxes beside it.](assets/images/your-network/comic-02-org-chart-ends.jpeg)\n**Panel 2:** *The problem: at the top, the org chart no longer provides a peer group.*\n\n![Comic panel: a phone shows an unanswered message asking to grab time to chat while Vera says the ask earns its silence.](assets/images/your-network/comic-03-the-vague-ask.jpeg)\n**Panel 3:** *Anti-pattern: the vague ask makes the recipient do all the work.*\n\n![Comic panel: Vera and a peer exchange small packages along a two-way loop of arrows as she says be useful first.](assets/images/your-network/comic-04-exchange-not-extraction.jpeg)\n**Panel 4:** *The principle: a network is a long-term exchange of value, not extraction.*\n\n![Comic panel: Vera sends a short four-line message with one question and the recipient happily replies from their phone.](assets/images/your-network/comic-05-one-precise-question.jpeg)\n**Panel 5:** *Outreach discipline: two to four sentences, one clear question, answerable in a minute.*\n\n![Comic panel: a noisy stadium crowd contrasts with Vera's quiet five-person round table as she notes easier access means lower signal.](assets/images/your-network/comic-06-circle-beats-stadium.jpeg)\n**Panel 6:** *Small and curated beats large and open for sensitive questions.*\n\n![Comic panel: Vera marks one amber dot on a calendar that has a single dot per month and tells Leo one new person a month.](assets/images/your-network/comic-07-modest-rhythm.jpeg)\n**Panel 7:** *The rhythm: consistency over intensity — about one new person a month.*\n\n![Comic panel: Vera closes her notebook and returns to her desk, saying networking is important but never her top priority.](assets/images/your-network/comic-08-never-the-top-priority.jpeg)\n**Panel 8:** *Closer: the network stays important — and never becomes the job.*\n"}]}]}</script>

    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);

        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing

            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
