<script id="data" type="application/json">{"meta": {"id": "EXEC-TEAM-FIRST-THINKING", "status": "draft:gray", "title": "Team-First Thinking", "date": "2026-07-26", "author": "Željko Obrenović", "permalink": "team-first-thinking", "timetoread": "8 min", "excerpt": "I treat the long-lived team, not the individual, as the unit of delivery. Work flows to teams, every system has exactly one owning team, rewards go to whole teams, and team cognitive load is the budget every assignment must fit within. Each team publishes a Team API so others can work with it without insider knowledge — and none of this works without strong engineering foundations underneath.", "tags": "engineering executive, team topologies, teams, cognitive load, ownership, flow", "icon": "assets/icons/team-first-thinking.png", "logo": "assets/images/team-first-thinking/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "team topologies", "teams", "cognitive load", "ownership", "flow"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I treat the long-lived team, not the individual, as the unit of delivery: work flows to teams, ownership belongs to teams, rewards go to teams, and team cognitive load is the budget every assignment must fit within. I keep teams small and stable, give every system exactly one owning team that acts as steward rather than private owner, and expect every team to publish a Team API — code, docs, working practices, and channels — so others can work with it without insider knowledge.\n\n## Statement\n\nMy operating model for team-first thinking has five parts:\n\n- **The team is the unit of delivery.** I assign software work to teams, never directly to individuals. Teams are small — ideally 5–9 people — long-lived, and not casually disrupted.\n- **Stability earns trust; trust earns speed.** Teams are designed around high trust, psychological safety, and shared goals, with time to pass through forming, storming, norming, and performing.\n- **Every system has exactly one owning team.** No shared ownership of code, libraries, or components. The owner is responsible for operability, maintenance, and evolution — as steward, not private owner — and other teams contribute through agreed paths.\n- **Cognitive load is the budget.** Every domain assignment and software boundary must fit within what the team can actually hold: accept the intrinsic load, eliminate the extraneous, protect the germane.\n- **Every team publishes a Team API.** Code, endpoints, documentation, working practices, communication channels, and roadmap — so other teams can interact without informal insider knowledge.\n\n![Split illustration contrasting individuals pulled out of teams toward scattered tasks with whole tasks flowing to one stable team.](assets/images/team-first-thinking/work-flows-to-teams.jpeg)\n**Figure 1:** *Work flows to teams, not to individuals: pulling people onto projects breaks teams; routing work to stable teams keeps them whole.*\n\n## How to Read This\n\nThis is an **appendix record**: unlike the core records in this journal, grounded in Will Larson's *The Engineering Executive's Primer*, this one is grounded in Matthew Skelton and Manuel Pais's *Team Topologies* — read here through an executive lens, complementing the Primer-grounded records. I read the book as the executive who decides what the unit of delivery, ownership, and reward actually is. If you lead teams here, this record explains why I push back when a plan names individuals instead of teams, and why \"the team is overloaded\" is a design problem on my desk, not a motivation problem on theirs. The working checklist — all fifteen sections — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Individuals don't scale; teams do.** A single engineer carries context that leaves when they do. A small, long-lived team compounds: shared context, mutual trust, and practiced ways of working take months to build and an afternoon to destroy, which is why I avoid reshuffling teams without a clear need. When a team grows past 5–9 people, the symptoms are predictable — slower decisions, weaker trust, coordination friction — and the fix is a deliberate split, not a bigger standup.\n\n**Shared ownership is deferred conflict.** When three teams change the same codebase, nobody maintains it and everybody blames it. So every system, service, component, and subsystem has exactly one owning team, responsible for its operability, maintenance, and evolution. Ownership means stewardship, not a fence: other teams contribute through pull requests and agreed collaboration paths.\n\n**Cognitive load is the real constraint, not headcount.** A team's capacity is not the sum of its hours; it is what the team can hold in its collective head. I separate three kinds of load. *Intrinsic* load — the essential complexity of the domain — I accept and staff for. *Extraneous* load — needless process, tooling friction, handoffs, poor documentation — I hunt down and eliminate, because it is pure waste. *Germane* load — learning, domain mastery, problem-solving — I protect, because it is where the value lives. This is why I never give one team a complex domain plus extras, or multiple complicated domains: the budget does not stretch, it snaps. And it is why software boundaries follow team cognitive load, not the other way around — the monolith-versus-microservices debate is unanswerable until you know what the teams can carry.\n\n![A beaker-shaped container with three layers of cognitive load — intrinsic, extraneous, germane — and an oversized block that does not fit.](assets/images/team-first-thinking/cognitive-load-budget.jpeg)\n**Figure 2:** *Cognitive load as the budget: accept the intrinsic, drain the extraneous, shield the germane — and refuse assignments that do not fit the container.*\n\n**Rewards decide what people optimize.** If bonuses and praise flow to individual heroics, I get heroes — and the silos and burnout heroes create. So I reward whole teams, avoid incentives that set teammates against each other, share training budgets at the team level, and audit performance systems for anything that undermines collaboration. A team-first mindset — unblocking teammates before starting new work, exploring options instead of winning arguments — survives only when the reward system agrees with it. Diversity makes this stronger: multiple perspectives and disagreement treated as input are how small teams avoid groupthink.\n\n**A team without an API is a bottleneck with a roadmap.** Other teams should not need to know whom to ping or which unwritten rule applies. So every team defines a Team API: the code, endpoints, and libraries it owns; versioning expectations; documentation and onboarding guides; working practices and communication channels; and current priorities. The test is empirical — I regularly check whether other teams actually find the API usable.\n\n![A team drawn as a module with labeled interface sockets that another team plugs into, with an informal back channel crossed out.](assets/images/team-first-thinking/team-api-surface.jpeg)\n**Figure 3:** *The Team API: what a team exposes — code, docs, ways of working, channels, roadmap — so collaboration runs through the interface, not through favors.*\n\n**Team-first design runs on engineering foundations.** Stable teams with clear ownership still stall without continuous delivery, test-supported development, first-class operability, and pipelines treated as products. A team that cannot safely release, observe, and operate its own software does not really own it. I fund these practices accordingly.\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Work is assigned to teams; teams decide who does what. | Individuals don't matter — they matter inside a team, not instead of one. |\n| Teams are long-lived; reshuffles need a clear reason. | Teams are frozen — they evolve, deliberately. |\n| Exactly one team owns each system, as steward. | Other teams are locked out — contribution flows through agreed paths. |\n| Cognitive load caps what a team can be assigned. | \"Overloaded\" is solved by pep talks or more headcount by default. |\n| Rewards go to whole teams. | Individual growth stops being recognized — it stops being the *unit*. |\n| Every team publishes a usable Team API. | Every interaction needs a formal process — the API makes the informal unnecessary, not forbidden. |\n\nConcretely: plans and roadmaps name teams, not people. Ownership maps have exactly one team per system; gaps and overlaps are incidents waiting to happen. Domain assignments are checked against load — one complex domain per team, never a pile of complicated ones. When a team says it is overloaded, my first question is what extraneous load we can remove, not who lacks motivation.\n\n## Anti-Patterns\n\n- **The star-routing habit.** Assigning critical work to named individuals across teams — single points of failure, while the teams around them never gel.\n- **The perpetual reshuffle.** Reorganizing teams before they reach performing, then wondering why nothing compounds.\n- **The commons codebase.** Multiple teams changing the same code with no owning team — shared ownership that is really no ownership.\n- **The overloaded workhorse.** One team holding a complex domain plus three others, praised for coping until it quietly stops delivering.\n- **Heroics on the bonus sheet.** Reward systems that pay for individual rescue missions, then act surprised by silos and burnout.\n- **The insider interface.** Collaboration that works only if you know whom to ask — informal favors standing in for a Team API.\n- **Team-first theater.** The vocabulary of stable teams and cognitive load, while pipelines, testing, and operability stay too weak for any team to truly own its software.\n\n## Related Records\n\n- [Organizational Design](organizational-design.html) — appendix sibling; sizing defaults and state diagnosis sit on top of the team-first stance this record establishes.\n- [Gelling Your Engineering Leadership Team](gelling-your-engineering-leadership-team.html) — the leadership team is a team too; forming-storming-norming-performing applies at the top first.\n- [Engineering Culture](engineering-culture.html) — the cultural substrate that team-first mindset and psychological safety depend on.\n- [Team-First Boundaries](team-first-boundaries.html) — appendix sibling; how software boundaries are drawn once the team is the unit they serve.\n- [Static Team Topologies](static-team-topologies.html) — appendix sibling; the team types and structures team-first thinking composes into.\n\n## Scope and Revisiting\n\nThis principle governs how I assign work, ownership, and rewards, and how I size what any single team is asked to carry. I revisit it whenever a plan names individuals instead of teams, an ownership map shows two teams on one system, or a team reports overload — each a signal that the design, not the people, needs attention. The warning-signs section of the checklist is the standing review trigger.\n\n## Authoritative References\n\n- Matthew Skelton & Manuel Pais, *Team Topologies: Organizing Business and Technology Teams for Fast Flow* (IT Revolution Press, 2019) — the team-first chapters this record's checklist distills.\n- The authors maintain ongoing materials, training, and case studies at [teamtopologies.com](https://teamtopologies.com/).\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "5 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle. The Article tab carries the rationale, implications, and anti-patterns.*\n\n## Team Structure\n\n- [ ] Treat the **team**, not the individual, as the basic unit of delivery.\n- [ ] Keep teams small, ideally **5–9 people**.\n- [ ] Avoid assigning software work directly to individuals; assign work to teams.\n- [ ] Keep teams **long-lived**, so they have time to form trust and effectiveness.\n- [ ] Avoid frequent team reshuffling unless there is a clear need.\n- [ ] Allow teams to evolve, but do not disrupt them casually.\n\n## Team Trust and Stability\n\n- [ ] Design teams around high trust, psychological safety, and shared goals.\n- [ ] Watch for signs that a team is too large: slower decisions, weaker trust, coordination friction.\n- [ ] Split teams when size or complexity begins to damage effectiveness.\n- [ ] Give new or changed teams time to pass through the forming, storming, norming, and performing stages.\n- [ ] Support teams with coaching when they are newly formed or under strain.\n\n## Ownership of Software\n\n- [ ] Ensure every software system, service, component, or subsystem is owned by **exactly one team**.\n- [ ] Avoid shared ownership of code, libraries, or components.\n- [ ] Allow other teams to contribute through pull requests, suggestions, or agreed collaboration paths.\n- [ ] Make the owning team responsible for operability, maintenance, and evolution.\n- [ ] Encourage teams to think of themselves as **stewards**, not private owners, of software.\n\n## Team-First Mindset\n\n- [ ] Encourage team members to put the team's needs above their individual preferences.\n- [ ] Make team goals visible and shared.\n- [ ] Keep meetings, standups, and investigations focused.\n- [ ] Encourage people to unblock teammates before starting new work.\n- [ ] Mentor less experienced team members.\n- [ ] Avoid \"winning\" arguments; explore options together.\n- [ ] Address consistently toxic or anti-team behavior quickly.\n\n## Diversity and Inclusion\n\n- [ ] Build teams with diverse backgrounds, skills, and perspectives.\n- [ ] Encourage multiple viewpoints when solving problems.\n- [ ] Watch for groupthink or overly homogeneous decision-making.\n- [ ] Create space for quieter or newer team members to contribute.\n- [ ] Treat disagreement as useful input, not disruption.\n\n## Rewards and Incentives\n\n- [ ] Reward the **whole team**, not just individuals.\n- [ ] Avoid incentives that create internal competition within the team.\n- [ ] Share training budgets at the team level where possible.\n- [ ] Evaluate outcomes based on team contribution and delivery.\n- [ ] Make sure performance systems do not undermine collaboration.\n\n## Cognitive Load\n\n- [ ] Regularly ask teams whether they feel effective and able to respond in time to the work they are assigned.\n- [ ] Identify sources of **intrinsic cognitive load**: essential domain or technical complexity.\n- [ ] Identify sources of **extraneous cognitive load**: unnecessary process, tooling, handoffs, confusion, or poor documentation.\n- [ ] Protect space for **germane cognitive load**: learning, domain mastery, and problem-solving.\n- [ ] Reduce unnecessary meetings, context switching, unclear ownership, and avoidable dependencies.\n- [ ] Provide training, automation, better tooling, and documentation to reduce overload.\n\n## Team Responsibilities and Domains\n\n- [ ] Identify the distinct domains each team is responsible for.\n- [ ] Classify domains as simple, complicated, or complex.\n- [ ] Assign each domain to a single team where possible.\n- [ ] Do not assign a complex domain plus additional domains to one team.\n- [ ] Avoid giving one team responsibility for multiple complicated domains.\n- [ ] Split large domains into smaller subdomains before assigning them to teams.\n- [ ] Review whether team responsibilities still match team capacity.\n\n## Software Boundaries\n\n- [ ] Design software boundaries around the team's cognitive load, not just the technical architecture.\n- [ ] Avoid choosing between monoliths and microservices before understanding the team's capacity.\n- [ ] Keep software subsystems small enough for one team to understand and own.\n- [ ] Align architecture with team ownership and communication patterns.\n- [ ] Realign architecture when teams or business streams grow too large.\n- [ ] Prefer clear, team-sized services or subsystems over tangled shared ownership.\n\n## Team APIs\n\n- [ ] Define a clear \"Team API\" for every team.\n- [ ] Include code, runtime endpoints, libraries, clients, or user interfaces owned by the team.\n- [ ] Include versioning and compatibility expectations.\n- [ ] Include documentation, how-to guides, and onboarding information.\n- [ ] Include team working practices and communication channels.\n- [ ] Include current priorities, roadmap, and upcoming work.\n- [ ] Make it easy for other teams to interact without needing informal insider knowledge.\n- [ ] Regularly test whether other teams find the Team API usable.\n\n## Team Interactions\n\n- [ ] Provide time and space for teams to build trust with each other.\n- [ ] Create opportunities for communities of practice, guilds, internal conferences, and learning sessions.\n- [ ] Encourage cross-team awareness without creating constant interruption.\n- [ ] Make collaboration paths explicit.\n- [ ] Avoid depending only on personal relationships or informal networks.\n- [ ] Support occasional cross-team discovery work without creating permanent dependency structures.\n\n## Physical and Virtual Environment\n\n- [ ] Design workspaces for team collaboration, focused work, and cross-team interaction.\n- [ ] Avoid both isolated cubicles and fully open-plan layouts as default solutions.\n- [ ] Give teams identifiable areas or spaces.\n- [ ] Provide whiteboards, collaboration areas, and quiet spaces.\n- [ ] Make virtual spaces easy to navigate.\n- [ ] Use predictable naming conventions for chat channels, wiki pages, and support spaces.\n- [ ] Make it easy to identify who belongs to which team.\n- [ ] Reduce digital noise and unnecessary notifications.\n\n## Engineering Practices\n\n- [ ] Invest in continuous delivery.\n- [ ] Use test-first or test-supported development practices.\n- [ ] Treat operability and reliability as first-class concerns.\n- [ ] Build delivery pipelines as important products in their own right.\n- [ ] Ensure teams can safely release, observe, and operate their own software.\n- [ ] Do not expect team-first design to work without strong engineering foundations.\n\n## Warning Signs to Watch For\n\n- [ ] Teams are larger than 9 people, and trust is weakening.\n- [ ] Multiple teams are changing the same codebase without clear ownership.\n- [ ] Individuals, not teams, are treated as the main delivery unit.\n- [ ] Teams are frequently reshuffled before they become effective.\n- [ ] A team owns too many domains or too much software.\n- [ ] Teams say they are overloaded, but leadership treats the issue as a staffing or motivation problem.\n- [ ] Rewards encourage individual heroics over team outcomes.\n- [ ] Other teams do not know how to interact with a team or its software.\n- [ ] Architecture reflects old reporting lines instead of current team ownership.\n- [ ] Collaboration depends on informal favors rather than clear interaction mechanisms.\n\n## Final Review Questions\n\n- [ ] Is each team small, stable, and long-lived?\n- [ ] Does each team own a clear part of the software?\n- [ ] Is every part of the system owned by exactly one team?\n- [ ] Are team responsibilities within cognitive load limits?\n- [ ] Are software boundaries aligned to team boundaries?\n- [ ] Do other teams know how to interact with this team?\n- [ ] Are incentives aligned with team success?\n- [ ] Is the physical or virtual environment helping teams collaborate?\n- [ ] Are engineering practices strong enough to support fast, safe flow?\n- [ ] Are teams able to deliver effectively without constant overload?\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Teams over stars — why the long-lived team, not the individual, is the unit of delivery, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Leo proudly maps critical tasks to individual star engineers across three teams while Vera watches.](assets/images/team-first-thinking/comic-01-star-routing.jpeg)\n**Panel 1:** *The hook: route everything to the stars — what could go wrong?*\n\n![Comic panel: overloaded star engineers juggle tasks while idle, reshuffled teams sit behind them and Leo panics at a timeline.](assets/images/team-first-thinking/comic-02-nothing-gels.jpeg)\n**Panel 2:** *The problem: heroes overload, teams reshuffle, nothing compounds.*\n\n![Comic panel: Vera crosses out individual portraits and routes all task arrows into one circled team of six.](assets/images/team-first-thinking/comic-03-team-is-the-unit.jpeg)\n**Panel 3:** *The principle: the team is the unit of delivery.*\n\n![Comic panel: the same small team shown over time with a rising trust curve, next to a crossed-out reshuffled team.](assets/images/team-first-thinking/comic-04-long-lived-stable.jpeg)\n**Panel 4:** *Small and long-lived: trust compounds only when the team stays together.*\n\n![Comic panel: Vera shows a beaker with three layers of cognitive load while Leo tries to add an oversized block that will not fit.](assets/images/team-first-thinking/comic-05-cognitive-load-budget.jpeg)\n**Panel 5:** *Cognitive load is the budget every assignment must fit within.*\n\n![Comic panel: Vera fixes a service map so each system has exactly one team flag while a pull request arrives along a marked path.](assets/images/team-first-thinking/comic-06-one-owner.jpeg)\n**Panel 6:** *Exactly one owner per system — stewards, with clear paths for contributors.*\n\n![Comic panel: Leo presents a team as a module with labeled interface sockets that another team plugs into, informal whispers crossed out.](assets/images/team-first-thinking/comic-07-team-api.jpeg)\n**Panel 7:** *The Team API: what the team exposes so others need no insider knowledge.*\n\n![Comic panel: Vera closes her notebook beside Leo in front of a board where work flows through stable teams into shipped releases.](assets/images/team-first-thinking/comic-08-teams-ship.jpeg)\n**Panel 8:** *The closer: stars burn out — teams ship.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
