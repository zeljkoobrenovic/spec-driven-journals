<script id="data" type="application/json">{"meta": {"id": "EXEC-ORGANIZATIONAL-VALUES", "status": "draft:gray", "title": "Organizational Values", "date": "2026-07-25", "author": "Željko Obrenović", "permalink": "organizational-values", "timetoread": "8 min", "excerpt": "Values exist to guide real decisions, not to decorate walls. I test every candidate value three ways — reversible, applicable, honest — and I change behavior before documenting it, never the other way around. I prefer extending existing company values over inventing new ones, roll values out slowly with buy-in, and integrate them into hiring, onboarding, promotions, and major decisions so they are used, not framed.", "tags": "engineering executive, values, culture, decision-making, leadership", "icon": "assets/icons/values.png", "logo": "assets/images/organizational-values/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "values", "culture", "decision-making", "leadership"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: Values are decision tools, not decoration. I test every candidate value three ways: it must be *reversible* (a real strategic choice another successful company might make the other way), *applicable* (usable in concrete trade-offs like speed versus quality), and *honest* (describing how we actually behave today — behavior changes before documentation, never after). I prefer extending existing company values over inventing new ones, roll values out slowly with buy-in rather than top-down announcement, and integrate them into hiring, onboarding, promotions, and major decisions — because a value that is never used in a decision is not a value.\n\n## Statement\n\nMy commitments on organizational values:\n\n- **Purpose before wording.** Before writing any value, I articulate which decisions it is meant to guide. Values reinforce cultural changes already underway; they do not magically create new ones. And senior leaders — starting with me — actively model them.\n- **Scope deliberately.** I first ask whether extending existing company values beats creating new ones. If new values are needed, I choose intentionally between company-wide, engineering, and engineering-leadership values, and check they are truly relevant to Engineering's work.\n- **Three quality tests.** Every value must be reversible, applicable, and honest. A value that fails any test gets rewritten or dropped.\n- **Behavior first, documentation second.** If behavior needs to change, we change the behavior — then write the value that describes it. Documenting an aspiration does not create it.\n- **Roll out slowly, integrate everywhere.** Small-group testing, early stakeholder involvement, iteration, buy-in over announcement — and then integration into hiring, onboarding, promotions, 1:1s, and major decision discussions.\n- **Maintain like any other system.** Values are revisited periodically, adjusted as behavior and strategy evolve, and leaders are consistently held accountable for modeling them.\n\n![Funnel where candidate value cards pass three sieve layers labeled Reversible, Applicable, and Honest, with rejects falling aside and one surviving value at the bottom.](assets/images/organizational-values/three-tests-filter.jpeg)\n**Figure 1:** *The quality bar: a value that fails reversible, applicable, or honest gets rewritten or dropped.*\n\n\n## How to Read This\n\nThis record tells my leadership team what standard any proposed value must meet before I will put my name behind it — and tells HR partners and peer executives how Engineering will engage with company-wide values work. It is a vision of how I evaluate and roll out values, not a proposal for which values any specific organization should pick. The working checklist — the quality tests, the traps, and the rollout and integration steps — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Reversible, applicable, honest is the quality bar because each test kills a distinct failure mode.** The *reversible* test kills universally good statements: if no successful company would reasonably choose the opposite, the value is not a strategic choice — it is applause. The *applicable* test kills abstractions: a value earns its place only if team members would know how to apply it in a specific scenario — a speed-versus-quality call, a build-versus-buy decision, a planning or promotion discussion. The *honest* test kills aspiration dressed as description: a value must describe how the organization behaves today, with top performers already modeling it. Values that fail these tests do not merely sit unused — they teach people that the written values are fiction.\n\n**Behavior change must precede documentation.** A document cannot change an organization; it can only make an existing change legible and durable. When I want different behavior, the sequence is: change the behavior in practice, verify top performers model it, then document it as a value. Reversing the sequence — announcing the value and hoping behavior follows — produces the most corrosive artifact in organizational life: a wall of values everyone can see nobody follows.\n\n![Two sequences: a checked behavior-verify-document flow above a faded announce-hope-ignored flow ending in a crooked poster.](assets/images/organizational-values/behavior-before-documentation.jpeg)\n**Figure 2:** *Behavior first, documentation second — the reversed sequence produces values everyone sees and nobody follows.*\n\n\n**Extending beats inventing.** Existing company values already have recognition and legitimacy; a parallel engineering set competes with them for attention and invites contradiction. So my first move is always to ask whether extending company values covers the need — and only when Engineering genuinely needs its own decision guidance do I add scoped values, chosen deliberately at the right level.\n\n**Rollout is where values live or die.** Values introduced top-down, early in a tenure, before understanding the organization, arrive as an imposition and are treated as one. So I wait long enough to understand the organization first — the patience argued in [First 90 Days](first-90-days.html) — test values in small groups, involve key stakeholders early, iterate before finalizing, and build buy-in rather than announcing. Then integration does the real work: values appear in hiring (where candidates can opt out), onboarding, promotions, 1:1s, and major decisions. A value used weekly needs no poster.\n\n![Widening pipeline from small-group testing through buy-in, fanning into five branches labeled hiring, onboarding, promotions, one-on-ones, and decisions.](assets/images/organizational-values/rollout-and-integration.jpeg)\n**Figure 3:** *Roll out slowly, then integrate everywhere: values live where real trade-offs are made, not on walls.*\n\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Every value must pass reversible, applicable, honest. | Values are just strategy restated — they are the decision-guiding layer that clarifies it. |\n| Change behavior before documenting it. | Never aspire to change — aspiration drives the behavior change; the value records its arrival. |\n| Prefer extending existing company values. | Engineering never gets its own values — scoped values are fine when chosen intentionally. |\n| Roll out slowly, with small groups and buy-in. | Values are democratic wordsmithing forever — iteration ends, and leaders are then accountable. |\n| Integrate values into hiring, promotion, and decisions. | Values are an HR artifact — they are used wherever real trade-offs are made. |\n\n## Anti-Patterns\n\n- **Identity values.** Statements about how we want to *see ourselves* rather than how we make decisions — the value nobody would ever use when deciding what to do next.\n- **Vague prioritization slogans.** Values that gesture at priorities without providing context for any actual trade-off. If it cannot help prioritize work, it is a slogan, not a value.\n- **Top-down announcement.** Publishing values before behavior exists, before small-group testing, before stakeholder buy-in — and then wondering why they are ignored.\n- **The week-two values exercise.** Introducing new values before understanding the organization, importing them from a previous company's culture rather than deriving them from this one's.\n- **Wall art.** Values that appear in the office and the handbook but never in a hiring debrief, a promotion discussion, or a major decision — visible everywhere except where decisions are made.\n- **Unaccountable leadership.** Holding the organization to values that its own leaders visibly do not model.\n\n## Related Records\n\n- [Engineering Strategy](engineering-strategy.html) — values reinforce and clarify strategy; the overlap is intentional and coherent, not accidental.\n- [Calibrating Your Standards](calibrating-your-standards.html) — standards are the engineering quality bar; values are the decision-guiding layer above them.\n- [First 90 Days](first-90-days.html) — the patience to understand the organization before introducing values is the same learning-first discipline.\n- [Hiring](hiring.html) — hiring is one of the primary places values are applied, including letting candidates opt out.\n- [Engineering Onboarding](engineering-onboarding.html) — onboarding is where new engineers first meet the values explicitly, not incidentally.\n\n## Scope and Revisiting\n\nThis principle governs how I evaluate, introduce, and maintain values for any engineering organization I lead, and how I engage with company-wide values work. I revisit it whenever strategy shifts enough that the values stop clarifying it, and periodically regardless — checking each value still passes reversible, applicable, honest against how we behave *now*.\n\n## Authoritative References\n\n- Will Larson, *The Engineering Executive's Primer* (O'Reilly, 2024) — the \"Organizational Values\" chapter this record's checklist distills; the principle above is my operating commitment to it.\n- Will Larson, [Setting engineering org values](https://lethain.com/setting-engineering-org-values/) — the freely available companion essay.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle, following the eight steps from clarifying purpose to maintaining and evolving. The Article tab carries the rationale, implications, and anti-patterns.*\n\n### 1. Clarify the Purpose of Values\n\n- [ ] Have we clearly articulated what decisions our values are meant to guide?\n- [ ] Are our values intended to reinforce existing cultural changes (not magically create new ones)?\n- [ ] Do senior leaders actively model these values?\n\n### 2. Decide the Scope of Values\n\n- [ ] Should we extend existing company values rather than create new ones?\n- [ ] If needed, are we choosing intentionally between:\n  - [ ] Company-wide values\n  - [ ] Engineering values\n  - [ ] Engineering leadership values\n- [ ] Are the proposed values truly relevant to Engineering's work?\n\n### 3. Evaluate Each Value for Quality\n\n**Reversible**\n\n- [ ] Can this value be reasonably reversed without sounding nonsensical?\n- [ ] Does it represent a real strategic choice (not just a universally good statement)?\n- [ ] Would another successful company reasonably choose the opposite?\n\n**Applicable**\n\n- [ ] Can this value guide real, complex decisions?\n- [ ] Does it help in trade-offs (e.g., speed vs. quality, build vs. buy)?\n- [ ] Can it be used in planning, hiring, performance reviews, and promotions?\n- [ ] Would team members know how to apply it in a specific scenario?\n\n**Honest**\n\n- [ ] Does this value accurately describe how the organization behaves today?\n- [ ] Are top performers already modeling this behavior?\n- [ ] Is it grounded in reality rather than aspiration?\n- [ ] If behavior needs to change, are we changing behavior first before documenting it?\n\n### 4. Avoid Common Traps\n\n**Identity Values**\n\n- [ ] Is this more about how we want to *see ourselves* than about how we make decisions?\n- [ ] Would someone rarely use this value when deciding what to do next?\n\n**Vague Prioritization Values**\n\n- [ ] Does this value actually help prioritize work?\n- [ ] Does it provide context for trade-offs?\n- [ ] Is it more than a slogan?\n\n### 5. Plan the Rollout Carefully\n\n- [ ] Have we waited long enough to understand the organization before introducing new values?\n- [ ] Have we tested the values in small groups first?\n- [ ] Did we involve key stakeholders early?\n- [ ] Did we iterate before finalizing?\n- [ ] Are we building buy-in rather than announcing top-down?\n\n### 6. Integrate Values Into Daily Work\n\n- [ ] Are values integrated into hiring (including allowing candidates to opt out)?\n- [ ] Are values explicitly discussed during onboarding?\n- [ ] Are promotions tied to value-aligned behavior?\n- [ ] Do 1:1s and team meetings reinforce value-aligned accomplishments?\n- [ ] Are values referenced in major decision discussions?\n\n### 7. Align With Strategy\n\n- [ ] Do the values reinforce and clarify the organization's strategy?\n- [ ] Can each value act as a guiding principle for strategic decisions?\n- [ ] Is the overlap between strategy and values intentional and coherent?\n\n### 8. Maintain and Evolve\n\n- [ ] Are we revisiting values periodically?\n- [ ] Are we adjusting values as behavior and strategy evolve?\n- [ ] Are leaders consistently held accountable for modeling them?\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why values are decision tools, not wall decoration — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Leo hangs a framed excellence poster while Vera watches with a raised eyebrow.](assets/images/organizational-values/comic-01-shiny-poster.jpeg)\n**Panel 1:** *The hook: a proud new values poster goes up on the wall.*\n\n![Comic panel: engineers argue at a whiteboard while the values poster hangs crooked and ignored behind them.](assets/images/organizational-values/comic-02-nobody-uses-it.jpeg)\n**Panel 2:** *The problem: visible everywhere except where decisions are made.*\n\n![Comic panel: Vera holds an excellence card next to a mirror reflecting it blank and asks if any rival would choose the opposite.](assets/images/organizational-values/comic-03-reversible-test.jpeg)\n**Panel 3:** *Test one, reversible: if no successful company would choose the opposite, it is applause, not a choice.*\n\n![Comic panel: Leo stands confused at a fork between ship fast and polish more, holding the values card upside down.](assets/images/organizational-values/comic-04-applicable-test.jpeg)\n**Panel 4:** *Test two, applicable: if it cannot decide a speed-versus-quality call, it is a slogan.*\n\n![Comic panel: Vera holds the values card beside a window showing the team behaving otherwise and asks if it describes them today.](assets/images/organizational-values/comic-05-honest-test.jpeg)\n**Panel 5:** *Test three, honest: a value must describe how we actually behave now — or it teaches people the values are fiction.*\n\n![Comic panel: Vera works alongside engineers practicing a new habit while a blank poster leans unwritten against the wall.](assets/images/organizational-values/comic-06-behavior-first.jpeg)\n**Panel 6:** *The principle: behavior first, documentation second — the value records the change, it does not create it.*\n\n![Comic panel: a well-worn values card with tabs for hiring, promotions, and decisions lies on the table between Vera and Leo.](assets/images/organizational-values/comic-07-values-in-use.jpeg)\n**Panel 7:** *How it plays out: values live in hiring debriefs, promotions, and major decisions — used, not framed.*\n\n![Comic panel: Vera holds the worn values card while the framed poster is carried away behind her.](assets/images/organizational-values/comic-08-no-poster-needed.jpeg)\n**Panel 8:** *The closer: a value used weekly needs no poster.*\n"}]}]}</script>

    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
