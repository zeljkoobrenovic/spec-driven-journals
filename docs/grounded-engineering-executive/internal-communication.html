<script id="data" type="application/json">{"meta": {"id": "EXEC-INTERNAL-COMMUNICATION", "status": "draft:gray", "title": "Internal Communication", "date": "2026-07-25", "author": "Željko Obrenović", "permalink": "internal-communication", "timetoread": "8-10 min", "excerpt": "I run internal communication as a deliberate operating system, not a byproduct of doing the work. I maintain a steady drip of short, predictable updates rather than rare grand announcements; I extract the real concern behind executive feedback instead of debating incidentals; I test significant messages before broadcasting them; and I structure every important communication as a packet, kept short, repeated across every channel.", "tags": "engineering executive, communication, updates, writing, leadership", "icon": "assets/icons/comms.png", "logo": "assets/images/internal-communication/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "communication", "updates", "writing", "leadership"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I communicate through a steady, predictable drip of short updates, not through rare grand announcements. Behind every piece of executive feedback I look for the kernel — the real concern — instead of debating incidentals. Significant messages get tested with reviewers before they go wide; important ones ship as a packet: a clear summary, a canonical source, and a place for questions. I keep it short, and I repeat it across every channel, because a message sent once through one channel was, for half the organization, never sent.\n\n## Statement\n\nInternal communication is an operating system I run deliberately. It does not happen as a side effect of doing the work; it is part of the work. My commitments:\n\n- **Maintain the drip.** A short, regular update goes out — weekly, typically — even when nothing major happened. Consistency is the point; the update is the heartbeat that tells the organization the executive function is alive and paying attention.\n- **Extract the kernel.** When an executive asks a question or pushes back, I identify the underlying concern — speed, priority, risk — confirm my understanding explicitly, and reframe the discussion around the real problem rather than getting stuck on incidental details.\n- **Test before broadcasting.** Significant or org-wide messages get shared with trusted reviewers first, asked specifically to flag confusion, unintended tone, potential controversy, and missing context. I revise before sending broadly.\n- **Build the packet.** Every important communication has three parts: a concise summary (what changed, who it applies to, what action is required, key dates, where to learn more, how to ask questions), a link to a single up-to-date canonical source, and a public place for questions plus a named contact for private ones.\n- **Keep it short.** I edit for brevity, remove unnecessary background, and cut anything that does not support the main message.\n- **Use every channel.** Email, chat, team meetings, all-hands, meeting minutes, weekly notes, a decision log — the same message travels through all of them, until at least one person on every team is informed.\n\n![Exploded diagram of a communication packet showing three parts: a concise summary card, a single canonical source document, and a questions area with a public bubble and a private named contact.](assets/images/internal-communication/communication-packet-anatomy.jpeg)\n**Figure 1:** *The packet: every important message ships with a summary, a canonical source, and a place for questions.*\n\n\n## How to Read This\n\nThis record explains how I communicate and what I expect of communication from my leadership team; if you receive my updates, it tells you why they look the way they do. It is a vision of my own operating style, not a writing course. The working checklist — the drip format, the reviewer questions, the packet structure, the final audit I run before any major message — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Consistency beats intensity.** Trust in executive communication compounds from predictability, not from eloquence. A leader who writes only when something is wrong teaches the organization to dread their messages; a leader who writes every week — including the weeks when the honest content is \"steady progress, nothing dramatic\" — earns the right to be believed when something big does land. The one or two human sentences in each update are not decoration; they are what makes the drip feel like a person communicating rather than a system emitting status.\n\n![Two timelines comparing rare large alarm spikes with declining trust against a steady weekly rhythm of small updates with rising trust.](assets/images/internal-communication/drip-vs-siren-timeline.jpeg)\n**Figure 2:** *Silence-then-siren versus the drip: trust compounds from predictability, not intensity.*\n\n\n**The kernel matters more than the debate.** Executive feedback usually arrives wrapped in an incidental detail — a question about one line item, a suggestion about one team. Debating the wrapper loses the executive and the argument at the same time. Extracting the underlying concern, confirming it explicitly, and reframing around it is how I keep executive conversations at the altitude where they can actually be resolved. This is the same move I expect of my own leaders when my questions land on them, and it is the communication counterpart of the alignment habit in [Working with Your CEO, Peers, and Engineering](working-with-your-ceo-peers-and-engineering.html).\n\n**Broadcasting is irreversible; testing is cheap.** A confusing or unintentionally controversial message to the whole organization cannot be unsent — the correction never reaches everyone the original did. One or two named reviewers, asked specific questions, catch most of what I cannot see in my own draft. The few hours of delay are almost always worth it.\n\n**Repetition is not redundancy — it is delivery.** People miss messages structurally, not carelessly: they were on vacation, the channel scrolled past, the meeting was skipped. A message that matters gets sent by email, repeated in chat, reinforced in team meetings and all-hands, and preserved in minutes, weekly notes, and the decision log. When I feel I am repeating myself is roughly when the organization is hearing it for the first time.\n\n![Diagram of one message fanning out through five channel lanes that each reach only part of a grid of teams, but together cover every team.](assets/images/internal-communication/multichannel-delivery.jpeg)\n**Figure 3:** *Repetition as delivery: no single channel reaches everyone, so the message travels through all of them.*\n\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Send a short update on a fixed cadence, even in quiet weeks. | Manufacture drama to fill the update — \"nothing major, here are the reminders\" is a fine message. |\n| Test significant messages with reviewers first. | Route every routine note through review — the drip flows without ceremony. |\n| Repeat important messages across every channel. | Spam every channel with everything — repetition is for messages that matter. |\n| Extract the kernel behind executive feedback. | Ignore the literal question — I answer it *and* address the concern underneath. |\n| Keep it short; cut what doesn't support the main message. | Withhold context — the canonical source carries the depth the summary omits. |\n\nBefore any major message goes out, I run a final quick audit: is it regular and predictable, did I extract the real issue, did someone review it, does it have a clear summary, is it concise, and is it shared across multiple channels?\n\n## Anti-Patterns\n\n- **Communicating only when something is wrong.** The silence-then-siren pattern: no updates for months, then a heavy announcement. The organization learns that a message from me means trouble, and stops reading the rest.\n- **The untested broadcast.** Sending a controversial or ambiguous org-wide message that no reviewer ever saw, then spending weeks managing the confusion a single pre-read would have caught.\n- **The single-channel announcement.** Declaring something once, in one meeting or one email, and assuming delivery. Half the organization never sees it, and later decisions get made against the stale version of reality.\n- **Debating the incidentals.** Spending an executive meeting litigating the detail an executive happened to mention, while the actual concern — speed, priority, risk — goes unaddressed and resurfaces next month.\n- **The summary-free wall of text.** An important message with no tl;dr, no clear statement of who it applies to or what action is required, and no canonical source — so every reader reconstructs their own version of what was decided.\n\n## Related Records\n\n- [Meetings](meetings.html) — the meeting portfolio is the synchronous half of this system; this record covers the written and multi-channel layer.\n- [Measuring Engineering Organizations](measuring-engineering-organizations.html) — what I report upward and how; this record covers how those messages travel.\n- [Working with Your CEO, Peers, and Engineering](working-with-your-ceo-peers-and-engineering.html) — extracting the kernel is how I keep executive relationships at the right altitude.\n- [Running Engineering Processes](run-engineering-processes.html) — the weekly notes and decision log that the drip feeds are operational processes with owners.\n- [First 90 Days](first-90-days.html) — sharing what I am learning in weekly updates starts the drip from my first weeks in a role.\n\n## Scope and Revisiting\n\nThis principle governs my own communication and the standard I hold my leadership team to for org-wide messages. I revisit it when the drip stops being read (a signal the format has decayed), when a major message lands badly despite the process, and whenever the organization's size or channel mix changes enough that \"every channel\" means something new.\n\n## Authoritative References\n\n- Will Larson, *The Engineering Executive's Primer* (O'Reilly, 2024) — the \"Internal Communication\" chapter this record's checklist distills.\n- Will Larson, [Internal comms for executives](https://lethain.com/internal-comms-execs/) — the freely available companion essay.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle, grouped as the source organizes it: the drip first, then the moves for significant messages, then the final audit. The Article tab carries the rationale, implications, and anti-patterns.*\n\n### Maintain the Drip (Consistent Updates)\n\n- [ ] Send a short, regular update (e.g., weekly), even if nothing major happened.\n- [ ] Include 1–2 human/personal sentences.\n- [ ] Add key reminders about upcoming deadlines.\n- [ ] Cover 2–3 important topics in short paragraphs.\n- [ ] Include a brief bulleted list of smaller updates.\n- [ ] Close with an invitation for questions and feedback.\n\n### Extract the Kernel (Respond to Executive Feedback Effectively)\n\n- [ ] Identify the underlying concern behind a question or suggestion.\n- [ ] Avoid getting stuck debating incidental details.\n- [ ] Confirm your understanding of the core issue explicitly.\n- [ ] Reframe discussion around the real problem (e.g., speed, priority, risk).\n\n### Test Before Broadcasting\n\n- [ ] Identify if the message is significant or org-wide.\n- [ ] Share the draft with at least one trusted reviewer.\n- [ ] Ask specific individuals (not just a group) for feedback.\n- [ ] Ask reviewers to flag:\n  - [ ] Confusing areas\n  - [ ] Unintended tone\n  - [ ] Potential controversy\n  - [ ] Missing context\n- [ ] Revise before sending broadly.\n\n### Build the Packet (Structure Every Important Communication)\n\n**Summary Section**\n\n- [ ] Start with a concise summary (tl;dr).\n- [ ] Clearly state:\n  - [ ] What changed\n  - [ ] Who it applies to\n  - [ ] What action is required\n  - [ ] Key dates\n  - [ ] Where to find more information\n  - [ ] How to ask questions\n\n**Canonical Source**\n\n- [ ] Link to a single source of truth (doc/wiki).\n- [ ] Ensure it is up-to-date.\n\n**Questions**\n\n- [ ] Provide a public place for questions (chat/email list).\n- [ ] Name a contact person for private questions.\n\n### Keep It Short\n\n- [ ] Edit for brevity.\n- [ ] Remove unnecessary background.\n- [ ] Use bullets where possible.\n- [ ] Cut anything that doesn't support the main message.\n\n### Use Every Channel\n\n- [ ] Share important updates via email.\n- [ ] Share the same updates via chat.\n- [ ] Reinforce in team meetings.\n- [ ] Reinforce in larger org meetings (e.g., all-hands).\n- [ ] Publish meeting minutes.\n- [ ] Maintain weekly notes.\n- [ ] Maintain a decision log.\n- [ ] Ensure at least one person on every team is informed.\n\n### Final Quick Audit Before Sending Any Major Message\n\n- [ ] Is it regular and predictable?\n- [ ] Did I extract the real issue?\n- [ ] Did someone review it?\n- [ ] Does it have a clear summary?\n- [ ] Is it concise?\n- [ ] Is it shared across multiple channels?\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why a steady drip of short updates beats the grand announcement — in seven panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Leo stares at a long unread announcement email while coworkers walk past unaware.](assets/images/internal-communication/comic-01-unread-announcement.jpeg)\n**Panel 1:** *The hook: the big announcement that nobody actually received.*\n\n![Comic panel: Vera points at a chart of long silence ending in a giant alarm bell while employees flinch.](assets/images/internal-communication/comic-02-silence-then-siren.jpeg)\n**Panel 2:** *The problem: communicating only when something is wrong.*\n\n![Comic panel: Leo shouts into a single pipe that reaches only half of the workers, while others are away or asleep.](assets/images/internal-communication/comic-03-single-channel.jpeg)\n**Panel 3:** *The wrong way: the single-channel announcement.*\n\n![Comic panel: Vera pins a short weekly note onto a board holding a tidy row of previous weekly notes.](assets/images/internal-communication/comic-04-the-drip.jpeg)\n**Panel 4:** *The principle: maintain the drip — consistency beats intensity.*\n\n![Comic panel: Vera hands a draft to two reviewers while a megaphone waits unused behind a rope.](assets/images/internal-communication/comic-05-test-before-broadcast.jpeg)\n**Panel 5:** *How it plays out: test before broadcasting — the megaphone waits.*\n\n![Comic panel: a glowing message parcel travels from Vera along arrows to email, chat, and meeting icons.](assets/images/internal-communication/comic-06-packet-every-channel.jpeg)\n**Panel 6:** *The mechanism: build the packet, then use every channel.*\n\n![Comic panel: close-up of Vera smiling and tapping her notebook, saying repetition means the message is finally landing.](assets/images/internal-communication/comic-07-just-hearing-it.jpeg)\n**Panel 7:** *The closer: repetition is not redundancy — it is delivery.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
