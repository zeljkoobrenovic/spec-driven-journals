<script id="data" type="application/json">{"meta": {"id": "EXEC-MEASURING-ENGINEERING-ORGANIZATIONS", "status": "draft:gray", "title": "Measuring Engineering Organizations", "date": "2026-07-25", "author": "Željko Obrenović", "permalink": "measuring-engineering-organizations", "timetoread": "9 min", "excerpt": "I measure an engineering organization for a specific audience. What I measure for myself — to plan, operate, optimize, and inspire — is not what I present to the CEO, Finance, or peer organizations, and I never present optimization metrics as proof of business impact. I only measure what feeds decisions, start with easy wins to build trust, use metrics to improve the system rather than judge individuals, and treat measuring something imperfect as strictly better than measuring nothing.", "tags": "engineering executive, metrics, measurement, stakeholders, data, leadership", "icon": "assets/icons/measuring.png", "logo": "assets/images/measuring-engineering-organizations/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "metrics", "measurement", "stakeholders", "data", "leadership"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I measure an engineering organization for a specific audience. What I measure for myself — to plan, operate, optimize, and inspire — is not what I present to the CEO and board, Finance, or peer organizations, and I never present optimization metrics as proof of business impact. I sequence measurement deliberately: only measure what feeds decisions, start with easy wins to build trust, take on one initiative at a time. I use metrics to improve the system, never to judge individuals, and I build confidence in the data through regular collaborative review — because measuring something imperfect beats measuring nothing.\n\n## Statement\n\nMy measurement practice follows four commitments:\n\n- **Measure for yourself first.** For my own leadership I measure to *plan* (a single view of business, product, and engineering impact), to *operate* (incidents, downtime, latency, cost normalized to a core business metric), to *optimize* (lead time, deployment frequency, developer productivity), and to *inspire and communicate* (the transformational technical investments worth telling the company about).\n- **Shape measurement per stakeholder.** The CEO and board get progress against a clear goal aligned to business strategy. Finance gets actuals versus budget and the cost-allocation methodology. Strategic peers (Product, Design, Sales) get shared business outcomes. Tactical peers (Customer Success, Legal) get concrete shared operational metrics with a review cadence.\n- **Sequence the work.** Only measure what will be used in decision-making, measure some easy things first to build trust, take on one new measurement initiative at a time, establish baselines, iterate.\n- **Trust the data by working it.** Weekly review, month-over-month trends, explicit hypotheses about metric behavior, investigation when data contradicts expectations, collaborative rather than solitary review, segmentation, and comparison of objective metrics to subjective experience.\n\n![Central Engineering node sending arrows to four differently shaped cards labeled Myself, CEO and board, Finance, and Peers.](assets/images/measuring-engineering-organizations/audience-shaped-measurement.jpeg)\n**Figure 1:** *One organization, four audiences — each gets measurement shaped to the decisions it makes.*\n\n\n## How to Read This\n\nThis record tells the leaders who report metrics with me what I will ask of the numbers, and tells the CEO, board, Finance, and peer executives what I will — and deliberately will not — show them. It is a vision of how I measure, not a metrics catalog or a tooling prescription. The working checklist — audience by audience, plus the sequencing rules and antipatterns — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**The audience determines the metric.** The same number that helps me run engineering is noise — or worse, misdirection — in a board deck. Deployment frequency helps my leadership team tune the delivery system; it tells the CEO nothing about whether Engineering is moving the business. So each audience gets measurement shaped to the decisions *they* make: strategy progress for the CEO and board, budget fidelity for Finance, shared outcomes for peers. Where possible I reuse planning and operational metrics across audiences — but reuse is an efficiency, not an excuse to show everyone the same dashboard.\n\n**Optimization metrics must never masquerade as impact.** Lead time, deployment frequency, and productivity scores measure how well the engineering system runs — not whether it is building the right things. Presenting them to the CEO as proof of business impact is the classic engineering-executive credibility mistake: it substitutes internal mechanics for business results, and when the business results disappoint, the metrics take the blame. Business impact is demonstrated with business metrics; optimization metrics stay inside the function they optimize.\n\n![Two zones divided by a wall with a gate: optimization metric chips loop inside Engineering while only a business-impact chip crosses to the board side.](assets/images/measuring-engineering-organizations/optimization-vs-impact-boundary.jpeg)\n**Figure 2:** *The boundary: optimization metrics tune the system inside Engineering; only business metrics demonstrate impact outside it.*\n\n\n**Teams, not individuals, are the unit of measurement.** Engineering output is a property of a system — its tooling, its processes, its interfaces — not a sum of individual scores. Measuring individuals corrupts both the data (people optimize the number) and the culture (metrics become surveillance). I use metrics to improve the system, and I keep performance assessment where it belongs: in management judgment informed by many sources, per [Inspected Trust](inspected-trust.html).\n\n**Trust in data is built, not assumed — and trust in people is not built with data.** Confidence in metrics comes from working them: reviewing weekly, holding explicit hypotheses, investigating contradictions, segmenting to find hidden issues, checking numbers against lived experience, and reviewing collaboratively so no single narrative goes unchallenged. But no dashboard substitutes for trust-building with stakeholders — a metric can support a relationship; it cannot replace one. And waiting for perfect data before measuring anything is how organizations end up measuring nothing.\n\n![Five-step circular loop from weekly review to checking lived experience, with a central trust-in-data meter rising and two figures reviewing a chart together.](assets/images/measuring-engineering-organizations/data-trust-loop.jpeg)\n**Figure 3:** *Trust in data is built, not assumed: a weekly collaborative loop raises confidence one cycle at a time.*\n\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Measure differently for each audience. | Maintain disconnected metric worlds — reuse planning and operational metrics where possible. |\n| Never present optimization metrics as business impact. | Hide optimization metrics — they drive real internal improvement. |\n| Measure teams and systems, not individuals. | Never assess individuals — that is management's job, done with judgment, not dashboards. |\n| Start with easy wins; one initiative at a time. | Stay easy forever — baselines expand across major categories over time. |\n| Measure something imperfect now. | Ship numbers you don't trust — confidence is built through weekly collaborative review. |\n\n## Anti-Patterns\n\n- **Metrics as a substitute for trust.** Answering a stakeholder relationship problem with a dashboard. The numbers can support trust already being built; they cannot manufacture it.\n- **Waiting for perfect data.** Postponing all measurement until the pipeline is clean, the tooling is bought, and the taxonomy is agreed — measuring nothing for a year in pursuit of measuring everything perfectly.\n- **Optimization theater for the board.** Presenting deployment frequency and lead time as proof of business impact — and losing credibility the first time the business asks what shipped.\n- **Measuring individuals.** Turning system-improvement metrics into per-person scorecards, corrupting the data and the culture in one move.\n- **Strategy in isolation.** Deciding the measurement strategy alone, without the leaders and peers who must act on it — then over-worrying about hypothetical misuse of data instead of reviewing it collaboratively.\n- **Boiling the ocean.** Launching several measurement initiatives at once, finishing none, and eroding the very trust that easy early wins were supposed to build.\n\n## Related Records\n\n- [Planning](planning.html) — the impact data measured here feeds the allocation reviews and roadmap decisions of the planning cycle.\n- [Engineering Strategy](engineering-strategy.html) — the CEO-facing goal that measurement tracks is set by the strategy, not by what is easy to count.\n- [Inspected Trust](inspected-trust.html) — inspection verifies delegated work through sampling and judgment; measurement improves systems — I keep the two instruments separate.\n- [Working with Your CEO, Peers, and Engineering](working-with-your-ceo-peers-and-engineering.html) — the stakeholder relationships that determine which measurements each audience actually needs.\n\n## Scope and Revisiting\n\nThis principle governs how I measure any engineering organization I lead and what I present to its stakeholders. Measurement is an evolving process, not a finished artifact: I revisit the portfolio as baselines are established, as cross-functional needs evolve, and whenever a metric stops feeding a decision — at which point it stops being measured.\n\n## Authoritative References\n\n- Will Larson, *The Engineering Executive's Primer* (O'Reilly, 2024) — the \"Measuring Engineering Organizations\" chapter this record's checklist distills; the principle above is my operating commitment to it.\n- Will Larson, [Measuring an engineering organization](https://lethain.com/measuring-engineering-organizations/) — the freely available companion essay.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle, grouped by audience first — yourself, then each stakeholder class — followed by sequencing, antipatterns, and data confidence. The Article tab carries the rationale, implications, and anti-patterns.*\n\n### Measure for Yourself (Internal Leadership)\n\n**Measure to Plan**\n\n- [ ] Maintain a single view of Business, Product, and Engineering impact.\n- [ ] Track shipped projects by team.\n- [ ] Track the impact of each shipped project.\n- [ ] Use metrics to support prioritization (not just delivery mechanics).\n\n**Measure to Operate**\n\n- [ ] Track incident count (with review writeups).\n- [ ] Track user-facing downtime.\n- [ ] Track API / website latency.\n- [ ] Track engineering cost normalized to a core business metric.\n- [ ] Track user ratings (e.g., app store ratings).\n- [ ] Track onboarding conversion completion rate.\n- [ ] Review operational metrics regularly.\n\n**Measure to Optimize**\n\n- [ ] Track delivery lead time.\n- [ ] Track deployment frequency.\n- [ ] Measure developer productivity (e.g., survey or framework like SPACE).\n- [ ] Instrument feedback loops within engineering.\n- [ ] Use metrics to improve the system, not judge individuals.\n\n**Measure to Inspire & Communicate**\n\n- [ ] Maintain a list of transformational technical investments.\n- [ ] Highlight generational improvements at company meetings.\n- [ ] Include at least one meaningful infrastructure improvement in annual planning.\n- [ ] Communicate the business impact of engineering work.\n\n### Measure for Stakeholders\n\n**Measure for CEO / Board**\n\n- [ ] Define a clear goal aligned to the business strategy.\n- [ ] Share progress updates against that goal.\n- [ ] Reuse planning/operational metrics where possible.\n- [ ] Focus on business impact, not micro-optimization.\n- [ ] Avoid presenting optimization metrics as proof of impact.\n\n**Measure for Finance**\n\n- [ ] Track actual vs budgeted headcount.\n- [ ] Track actual vs budgeted vendor costs.\n- [ ] Document capitalizable vs expensed engineering work.\n- [ ] Align on investment thesis and capacity allocation.\n- [ ] Document cost allocation methodology across initiatives.\n\n**Measure for Strategic Peer Organizations (Product, Design, Sales)**\n\n- [ ] Align on shared business outcomes.\n- [ ] Use planning impact metrics to support collaboration.\n- [ ] Ensure engineering measurement supports cross-functional goals.\n\n**Measure for Tactical Peer Organizations (Customer Success, Legal, etc.)**\n\n- [ ] Agree on concrete measurable outcomes.\n- [ ] Track shared operational metrics (e.g., resolution time, ticket acceptance).\n- [ ] Establish regular review cadence.\n- [ ] Adjust metrics as cross-functional needs evolve.\n\n### Sequence Your Measurement Work\n\n- [ ] Only measure what you'll use in decision-making.\n- [ ] Measure some easy things to build trust.\n- [ ] Take on one new measurement initiative at a time.\n- [ ] Establish a baseline across major measurement categories.\n- [ ] Iterate and refine over time.\n\n### Avoid Measurement Antipatterns\n\n- [ ] Don't substitute metrics for trust-building.\n- [ ] Don't wait for perfect data before measuring.\n- [ ] Don't use optimization metrics to judge performance.\n- [ ] Don't measure individuals instead of teams.\n- [ ] Don't over-worry about potential misuse of data.\n- [ ] Don't decide measurement strategy in isolation.\n\n### Build Confidence in Data\n\n- [ ] Review data weekly.\n- [ ] Compare trends month-over-month or quarter-over-quarter.\n- [ ] Maintain explicit hypotheses about metric behavior.\n- [ ] Investigate when data contradicts expectations.\n- [ ] Review data collaboratively (not alone).\n- [ ] Segment data to uncover hidden issues.\n- [ ] Compare objective metrics to subjective experience.\n- [ ] Document open questions and follow-ups.\n\n### Ongoing Mindset\n\n- [ ] Measure something (avoid measuring nothing).\n- [ ] Iterate in small steps.\n- [ ] Focus on usefulness over perfection.\n- [ ] Treat measurement as an evolving process.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "How I measure an engineering organization — for a specific audience, one step at a time — in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Leo wheels in a giant screen crowded with tiny charts and offers it as one dashboard for everyone.](assets/images/measuring-engineering-organizations/comic-01-one-dashboard.jpeg)\n**Panel 1:** *The hook: one giant dashboard, shown to everyone.*\n\n![Comic panel: puzzled board members squint at a deploys-per-week chart and ask what was shipped.](assets/images/measuring-engineering-organizations/comic-02-puzzled-board.jpeg)\n**Panel 2:** *The problem: deployment frequency tells the CEO nothing about whether Engineering moves the business.*\n\n![Comic panel: Vera lowers Leo's slide, which wears a small theater mask, and warns against selling mechanics as impact.](assets/images/measuring-engineering-organizations/comic-03-optimization-theater.jpeg)\n**Panel 3:** *The wrong way: optimization theater — when business results disappoint, the metrics take the blame.*\n\n![Comic panel: Vera hands different single sheets to figures labeled CEO, Finance, Peers, and Me.](assets/images/measuring-engineering-organizations/comic-04-audience-shapes-metric.jpeg)\n**Panel 4:** *The principle: the audience determines the metric — strategy progress for the CEO, budget fidelity for Finance, shared outcomes for peers.*\n\n![Comic panel: Vera flips Leo's engineer leaderboard over and sketches a system of gears on the back.](assets/images/measuring-engineering-organizations/comic-05-teams-not-individuals.jpeg)\n**Panel 5:** *The line I hold: metrics improve the system — they are never per-person scorecards.*\n\n![Comic panel: Vera lays a single numbered stepping stone while Leo wobbles holding five stones at once.](assets/images/measuring-engineering-organizations/comic-06-easy-wins-first.jpeg)\n**Panel 6:** *How it plays out: measure what feeds decisions, start easy to build trust, one initiative at a time.*\n\n![Comic panel: Vera and Leo examine one chart together with a magnifying glass and sticky notes.](assets/images/measuring-engineering-organizations/comic-07-work-the-data.jpeg)\n**Panel 7:** *Trust the data by working it: weekly collaborative review, hypotheses, and digging into surprises.*\n\n![Comic panel: Vera confidently holds up a slightly wobbly hand-drawn chart with eraser marks.](assets/images/measuring-engineering-organizations/comic-08-imperfect-beats-nothing.jpeg)\n**Panel 8:** *The closer: measuring something imperfect is strictly better than measuring nothing.*\n"}]}]}</script>

                if (sectionEl.firstChild) {

        }

                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
