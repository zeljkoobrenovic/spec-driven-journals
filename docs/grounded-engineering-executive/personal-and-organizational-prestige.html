<script id="data" type="application/json">{"meta": {"id": "EXEC-PRESTIGE", "status": "draft:gray", "title": "Personal and Organizational Prestige", "date": "2026-07-25", "author": "Željko Obrenović", "permalink": "personal-and-organizational-prestige", "timetoread": "8-10 min", "excerpt": "I optimize for prestige — ambient, positive, easily discoverable familiarity — not audience size. I first check whether I need to invest at all; when I do, it is a small number of timeless, high-quality artifacts, distributed simply, kept discoverable, and repeated only occasionally. The same principle scales to my organization: meaningful engineering problems and a little excellent content beat a heavy content machine. Pageviews and follower counts are explicitly not the measure.", "tags": "engineering executive, prestige, reputation, writing, engineering brand, leadership", "icon": "assets/icons/prestige.png", "logo": "assets/images/personal-and-organizational-prestige/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "prestige", "reputation", "writing", "engineering brand", "leadership"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I optimize for prestige — ambient, positive, easily discoverable familiarity — not audience size. Before investing at all, I check whether I need to: if I can hire senior people, recruiters call, and my network expands naturally, minimal investment is required. When I do invest, it is a small number of timeless, high-quality artifacts born from real experience — a blog post, a conference talk — distributed simply, kept discoverable, and repeated only occasionally over years. I never measure this in pageviews or followers, and the same principle governs my organization: meaningful engineering problems and a little excellent content beat a heavy content machine.\n\n## Statement\n\nPrestige is a means, not a scoreboard. Four commitments govern how I build it:\n\n- **I check whether investment is needed before investing.** Can I hire senior candidates successfully? Do people seek my advice beyond my direct reports? Can I start interview processes for the roles I want? Do executive recruiters bring me interesting roles? Is my network naturally expanding to more senior people? Mostly yes — minimal investment needed. Mostly no — build prestige deliberately.\n- **I optimize for prestige, not audience.** Prestige is passive, positive awareness — prestige ≠ brand ≠ followers. I deliberately avoid over-investing in content volume.\n- **When I create, I create little and well.** A timeless, high-leverage topic where I hold a meaningful, non-obvious perspective grounded in real experience; the format is a blog post or conference talk — small enough to iterate, permanent and discoverable; the quality bar assumes discarding two or three drafts and getting feedback from experienced reviewers. Then: distributed simply (a handful of peers sharing simultaneously, thoughtful posts in relevant communities, no controversy-driven promotion), kept discoverable (personal website, linked from professional profiles, findable by search, collected in one place), and repeated only two or three times over several years.\n- **The organization follows the same principle.** We focus on meaningful, attractive engineering problems, highlight prestigious employees and work, produce a small amount of thoughtful, high-quality content — and avoid high-frequency publishing strategies.\n\n![Split diagram contrasting an audience content conveyor feeding a follower counter with a single glowing artifact radiating awareness rings to scattered distant figures.](assets/images/personal-and-organizational-prestige/prestige-vs-audience.jpeg)\n**Figure 1:** *Two models: an audience must be fed; prestige radiates from a few durable artifacts.*\n\n\n## How to Read This\n\nThis record is itself an artifact of the principle it states: a small, durable, discoverable piece of writing born from practice — which is exactly how recruiters and hiring managers should read it. The full working practice, from the invest-at-all check to the metrics to avoid, lives in the **Checklist** tab of this post. Writing as a networking channel belongs to [Your Network](your-network.html); the hiring funnel that prestige quietly feeds belongs to [Hiring](hiring.html).\n\n## Rationale\n\n**The invest-at-all check comes first because prestige is instrumental.** Prestige exists to do specific jobs: attract senior candidates, open interview processes, bring recruiter calls, expand the network upward. If those jobs are already being done, more prestige is unpurposed effort — time taken from the actual role. The check turns a vanity question (\"am I known enough?\") into an operational one (\"is anything blocked by insufficient awareness?\").\n\n![Decision-flow diagram where five career signals feed a gate that branches to minimal investment when healthy or deliberate prestige-building when not.](assets/images/personal-and-organizational-prestige/invest-at-all-check.jpeg)\n**Figure 2:** *The invest-at-all check: an operational question about blocked jobs, not a vanity question.*\n\n\n**Prestige is not brand and not followers.** An audience must be fed — the content machine demands volume, and volume competes directly with quality and with the job. Prestige, by contrast, is ambient: people who have never met me have encountered one good artifact, or know someone who has, and arrive positively disposed. One timeless piece that surfaces in interviews for a decade builds more of that than a year of weekly output. That is why volume is the wrong axis: the artifact's half-life matters more than its frequency.\n\n**Bad metrics produce bad artifacts.** Pageviews, social media followers, content volume, and sales are all measurable — and all optimize toward controversy, frequency, and reach rather than depth. I explicitly do not optimize for any of them. Instead I timebox the effort, notice whether the content comes up in interviews and hiring conversations, and observe whether opportunities expand naturally. Thoughtful disagreement with a piece is a good sign; engagement-bait controversy is not, which is why I avoid controversy-driven promotion entirely.\n\n**Organizational prestige rests on the work, not the marketing.** Engineers are drawn to meaningful, attractive problems and to working alongside people they respect. So the organization's prestige strategy mirrors the personal one: make the problems genuinely attractive, highlight the prestigious employees and work we already have, and publish a small amount of excellent content about it — rather than running a high-frequency publishing operation that drains engineering time and reads as marketing. This is the durable version of the engineering-brand effort that [Hiring](hiring.html) kicks off.\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Check whether prestige investment is needed before investing. | Never invest — if senior hiring stalls and recruiters are silent, build deliberately. |\n| Optimize for ambient, positive, discoverable familiarity. | Build an audience — prestige ≠ brand ≠ followers. |\n| A few timeless, high-quality artifacts, repeated over years. | Publish on a cadence — the content machine is explicitly rejected. |\n| Distribute simply and keep artifacts discoverable. | Promote via controversy or chase reach. |\n| Judge by timeboxed effort and naturally expanding opportunities. | Judge by pageviews, followers, volume, or sales. |\n\nIn practice the arc for one artifact is: **decide** (run the invest-at-all check) → **choose** (a timeless topic with a non-obvious perspective from real experience) → **make it excellent** (discard drafts, seek experienced reviewers, verify readers can articulate the key insight) → **distribute simply** (5–10 peers sharing simultaneously, relevant communities) → **keep it discoverable** (personal site, professional profiles, one collected place) → **repeat lightly** (two or three times over several years).\n\n![Six-station journey from decide through choose, make excellent, distribute, keep discoverable, and repeat lightly, fading into a long arrow labeled years.](assets/images/personal-and-organizational-prestige/artifact-lifecycle.jpeg)\n**Figure 3:** *One artifact's arc: most of the effort in the making, most of the payoff in the long discoverable tail.*\n\n\n## Anti-Patterns\n\n- **The content machine.** Committing to a weekly newsletter, podcast, or posting schedule to \"build a brand\" — volume crowding out quality, the machine's appetite crowding out the job.\n- **Follower-count leadership.** Measuring standing by audience metrics — pageviews, followers, likes — and drifting toward whatever content those metrics reward, which is rarely the timeless kind.\n- **Controversy as distribution.** Promoting work by picking fights. It generates reach and destroys exactly the *positive* half of ambient positive awareness.\n- **Prestige without substance.** Publishing takes on topics where I hold no real experience or accomplishment — the artifact may circulate, but it cannot survive contact with an informed reader.\n- **Undiscoverable excellence.** Writing something genuinely good and letting it die in a feed — no personal site, no profile links, not findable by search, never collected anywhere.\n- **The organizational content mill.** Standing up a high-frequency engineering blog for employer branding while the actual engineering problems remain unattractive — marketing the work instead of fixing it.\n\n## Related Records\n\n- [Your Network](your-network.html) — the active-relationship complement: the network is who I know; prestige is who knows of me.\n- [Hiring](hiring.html) — where prestige pays off operationally: senior candidates who answer, and the engineering-brand efforts begun in the first 90 days.\n- [Getting the Job](getting-the-job.html) — recruiter relationships and inbound interest as the observable dividends of prestige.\n- [Managing Priorities and Energy](managing-energy.html) — the timeboxing discipline: prestige work must stay modest and orthogonal, never a second job.\n- [Organizational Values](organizational-values.html) — highlighting prestigious work only rings true when the values behind the work are actually practiced.\n\n## Scope and Revisiting\n\nThis principle governs my personal reputation investment and how my organization presents engineering externally. I revisit it whenever the invest-at-all check changes its answer — senior hiring stalling or recruiter interest drying up signals more deliberate investment; a naturally expanding network signals the current level is enough — and after each artifact, by observing over months whether it surfaces in conversations and whether opportunities expanded.\n\n## Authoritative References\n\n- Will Larson, *The Engineering Executive's Primer* (O'Reilly, 2024) — the \"Personal and Organizational Prestige\" chapter this record's checklist distills; the principle above is my operating commitment to it.\n- Will Larson, [Building personal and organizational prestige](https://lethain.com/building-prestige/) — the freely available companion essay.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle, ordered as the practice runs — from deciding whether to invest at all, through one artifact's lifecycle, to the organizational half. The Article tab carries the rationale, implications, and anti-patterns.*\n\n### Decide If You Even Need to Invest\n\n- [ ] Can I hire senior candidates successfully?\n- [ ] Do people seek my advice beyond my direct reports?\n- [ ] Can I start interview processes for the roles I want?\n- [ ] Do executive recruiters bring me interesting roles?\n- [ ] Is my network naturally expanding to more senior people?\n\n- If mostly \"yes\" → minimal investment needed.\n- If mostly \"no\" → build prestige deliberately.\n\n### Understand the Goal\n\n- [ ] I am optimizing for prestige (passive positive awareness), not audience size.\n- [ ] I understand prestige ≠ brand ≠ followers.\n- [ ] I will avoid over-investing in content volume.\n\n### Choose a Timeless, High-Leverage Topic\n\n- [ ] I have a meaningful, non-obvious perspective.\n- [ ] The topic will remain relevant for years to come.\n- [ ] The insight adds depth, not controversy.\n- [ ] It reflects real experience and accomplishment.\n\n### Pick the Right Format\n\n- [ ] Blog post or conference talk (preferred).\n- [ ] Small enough to iterate quickly.\n- [ ] Creates a permanent, discoverable artifact.\n- [ ] Not a book or podcast (unless intentional and strategic).\n\n### Create High-Quality Content\n\n- [ ] I expect to discard 2–3 drafts.\n- [ ] I've gotten feedback from experienced reviewers.\n- [ ] Readers can clearly articulate my key insight.\n- [ ] Some thoughtful disagreement is possible (a good sign).\n\n### Distribute Simply\n\n- [ ] I asked 5–10 peers to share it simultaneously.\n- [ ] I shared it thoughtfully in relevant communities.\n- [ ] I avoided controversy-driven promotion.\n\n### Make It Discoverable\n\n- [ ] It lives on a personal website.\n- [ ] It's linked from LinkedIn or professional profiles.\n- [ ] It's easy to find via search.\n- [ ] Future content is collected in one place.\n\n### Repeat (Lightly)\n\n- [ ] I'll repeat this 2–3 times over several years.\n- [ ] I will prioritize quality over frequency.\n- [ ] I won't build a heavy content machine.\n\n### Avoid Bad Metrics\n\n**Do not optimize for:**\n\n- [ ] Pageviews.\n- [ ] Social media followers.\n- [ ] Content volume.\n- [ ] Sales (if prestige is the goal).\n\n**Instead:**\n\n- [ ] Timebox effort.\n- [ ] Notice whether content comes up in interviews or hiring conversations.\n- [ ] Observe whether opportunities expand naturally.\n\n### For Organizations\n\n- [ ] Focus on meaningful, attractive engineering problems.\n- [ ] Highlight prestigious employees or work.\n- [ ] Produce a small amount of thoughtful, high-quality content.\n- [ ] Avoid high-frequency publishing strategies.\n\n### The Core Principle\n\n- Prestige = ambient, positive, easily discoverable familiarity.\n\n- [ ] Small amount.\n- [ ] High quality.\n- [ ] Timeless insight.\n- [ ] Easily discoverable.\n- [ ] Repeated occasionally.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Prestige, not followers — why a few timeless artifacts beat the content machine, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Leo excitedly shows Vera a phone with a climbing follower graph while Vera looks unimpressed.](assets/images/personal-and-organizational-prestige/comic-01-follower-dream.jpeg)\n**Panel 1:** *The hook: measuring standing in followers.*\n\n![Comic panel: Leo runs on a treadmill feeding a conveyor of papers into a hungry monster mouth while Vera watches.](assets/images/personal-and-organizational-prestige/comic-02-content-treadmill.jpeg)\n**Panel 2:** *The problem: the content machine must be fed, and it eats the job.*\n\n![Comic panel: Vera points at a glowing framed article on a wall while distant silhouettes nod approvingly.](assets/images/personal-and-organizational-prestige/comic-03-prestige-defined.jpeg)\n**Panel 3:** *The principle: ambient, positive, discoverable familiarity.*\n\n![Comic panel: Vera shows Leo a hand-drawn checklist in her notebook with several items ticked.](assets/images/personal-and-organizational-prestige/comic-04-invest-check.jpeg)\n**Panel 4:** *Step one: check whether you need to invest at all.*\n\n![Comic panel: Leo polishes one glowing document at night with discarded drafts in the wastebasket as Vera nods.](assets/images/personal-and-organizational-prestige/comic-05-one-great-artifact.jpeg)\n**Panel 5:** *Create little and well: one timeless artifact beats a year of output.*\n\n![Comic panel: Leo hands his document to a small circle of peers while a signpost marks its permanent home.](assets/images/personal-and-organizational-prestige/comic-06-simple-distribution.jpeg)\n**Panel 6:** *Distribute simply, keep it discoverable — then let it work.*\n\n![Comic panel: Vera and Leo look at engineers working on an exciting glowing machine, with one framed article beside the window and ignored flyers in a corner.](assets/images/personal-and-organizational-prestige/comic-07-org-same-principle.jpeg)\n**Panel 7:** *The organization follows the same rule: the work is the brand.*\n\n![Comic panel: an older Leo in an interview where the interviewer holds up his old article and smiles.](assets/images/personal-and-organizational-prestige/comic-08-decade-later.jpeg)\n**Panel 8:** *The closer: the artifact that outlives the algorithm.*\n"}]}]}</script>

    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);

        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing

            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
