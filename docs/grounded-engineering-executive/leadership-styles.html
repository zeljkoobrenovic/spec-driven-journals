<script id="data" type="application/json">{"meta": {"id": "EXEC-LEADERSHIP-STYLES", "status": "draft:gray", "title": "Leadership Styles", "date": "2026-07-25", "author": "Željko Obrenović", "permalink": "leadership-styles", "timetoread": "8-10 min", "excerpt": "I choose my leadership style by the situation, not by habit: policy for recurring decisions that must scale without me in the room, consensus when context is distributed and buy-in drives execution, conviction when a high-stakes, non-recurring decision is stalled and someone must decide. Any style can be misused and no single style works everywhere — so I deliberately practice my weaker styles to stay fluent in all three. The goal is adaptability, not purity.", "tags": "engineering executive, leadership styles, decision making, policy, consensus, conviction", "icon": "assets/icons/leadership.png", "logo": "assets/images/leadership-styles/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "leadership styles", "decision making", "policy", "consensus", "conviction"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I choose how to decide before I decide: policy when a decision recurs and the organization must move consistently without me in the room, consensus when context is distributed and buy-in materially affects execution, conviction when a high-stakes, non-recurring decision is stalled and someone must decide. Any style can be misused, and no single style works everywhere — so I deliberately practice the styles I underuse, and I run the micromanagement self-check before overriding people closer to the work. The goal is adaptability, not purity.\n\n## Statement\n\nThe three styles are decision-making modes, not identities — and each has explicit triggers:\n\n- **I lead with policy** when the decision recurs frequently, many people must make it consistently, speed and predictability matter, and I want the organization to move without me in the room. Executing it means: identify the recurring decision, study how strong decision-makers handle it today, codify their best judgment into a clear written policy, validate it with key contributors, roll it out intentionally, and set a review point to revisit it with data.\n- **I lead from consensus** when multiple stakeholders hold critical context, no one person has the full picture, the decision is important enough to remember in six months, buy-in materially affects execution, and the issue isn't well-suited for policy. Executing it means: identify all relevant stakeholders, create a shared channel, write a framing document outlining the known perspectives, ensure everyone feels heard, appoint the most senior engaged leader, set a clear deadline, follow the agreed process, and close the loop on the outcome.\n- **I lead with conviction** when the decision is high-stakes and long-lasting, stakeholders are deeply divided, no one has clear authority or full context, the decision is unlikely to be repeated, and momentum is stalled. Executing it means: deeply understand the trade-offs, engage the people with the most context, write down my reasoning and pressure-test it, communicate a tentative decision with a short timeout, then finalize, move to execution, and document the rationale for transparency.\n\nAcross all three: strong executives develop fluency in every style, and the choice is made deliberately, per situation — never out of habit.\n\n![A decision token routed by three trigger questions to cards labeled Policy, Consensus, and Conviction.](assets/images/leadership-styles/style-selector.jpeg)\n**Figure 1:** *The style selector: explicit triggers route each decision to policy, consensus, or conviction — never habit.*\n\n\n## How to Read This\n\nThis record lets my team and peer executives predict which mode I will bring to a given decision — and lets them call it out when the mode doesn't fit the triggers. It is a description of decision-making modes, not personality archetypes. The full execution checklists, the micromanagement self-check, and the development practice live in the **Checklist** tab of this post. How I verify delegated work without micromanaging is [Inspected Trust](inspected-trust.html); here the self-check guards only the conviction style.\n\n## Rationale\n\n**Style should follow the situation, because each style fails outside its zone.** Policy applied to a one-off, high-stakes decision produces bureaucracy nobody needs twice. Consensus applied to a stalled, deeply divided decision produces an expensive stalemate. Conviction applied to a recurring decision makes me the bottleneck for the organization's routine judgment. The triggers are not preferences; they are the conditions under which each style actually works.\n\n**Defaulting to habit is the quiet failure mode.** Every leader has a comfortable style, and the comfortable style gets applied to situations it doesn't fit — usually without anyone noticing, because it looks like consistency. That is why I check my defaults deliberately: am I defaulting to one style out of habit? Has my company's context changed — growth, downturn, scale — in ways that change which styles the situation now demands? Am I too distant from the details, or over-engaging unnecessarily?\n\n**Conviction needs a guard, because it is the style closest to micromanagement.** Before overriding people closer to the work, I run the self-check: am I carefully considering feedback from those closest to the work — and am I adding friction to a team that would reach a similar outcome without me? If yes to the first and no to the second, I am likely not micromanaging; if the answers go the other way, the intervention is friction, not leadership.\n\n![A two-by-two quadrant on feedback consideration versus added friction, with only the yes-feedback, no-friction quadrant marked Lead and the rest marked Friction.](assets/images/leadership-styles/micromanagement-self-check.jpeg)\n**Figure 2:** *The conviction guard: only feedback-considered, friction-free intervention counts as leadership — the rest is micromanagement.*\n\n\n**Fluency is built, not assumed.** I identify which style I default to and which I underuse, and once a month I review upcoming decisions and choose one to handle deliberately in my weaker style — then debrief with someone skilled in that style and compare the outcome against my default approach. Repeated consistently, this is what turns three named modes into a real repertoire, the same deliberate-practice move as [Calibrating Your Standards](calibrating-your-standards.html).\n\n![A five-step monthly loop: spot the default style, pick one decision, use the weaker style, debrief, and compare outcomes.](assets/images/leadership-styles/deliberate-practice-loop.jpeg)\n**Figure 3:** *The fluency loop: one decision a month handled deliberately in the weaker style, debriefed, and compared.*\n\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| The situation picks the style — via explicit triggers. | I have a \"true\" style that situations occasionally interrupt. |\n| Policy exists so the org moves consistently without me in the room. | Every decision deserves a policy — one-off decisions don't. |\n| Consensus means everyone is heard, with a deadline and an appointed closer. | Consensus means everyone agrees — it means the process was followed and the loop closed. |\n| Conviction is for stalled, high-stakes, non-recurring decisions — pressure-tested and documented. | Conviction is a license to override teams — the micromanagement self-check comes first. |\n| I deliberately practice my weaker styles monthly. | Fluency arrives with the job title. |\n\nA reader who knows the triggers can predict my mode: a recurring escalation pattern gets a written policy with a review date; a cross-team architecture question where context is scattered gets a framing document, a channel, and a deadline; a stalled, divisive, bet-the-roadmap call gets my written reasoning, a tentative decision, a short timeout, and then execution.\n\n## Anti-Patterns\n\n- **Consensus as conflict avoidance.** Running a consensus process on a decision that is stalled and deeply divided — where the triggers point to conviction — because seeking more input feels safer than deciding.\n- **Conviction as ego.** Reaching for the decisive style on decisions that recur or where others hold the context — skipping the self-check, overriding teams that would have landed in the same place without the friction.\n- **Policy as bureaucracy.** Writing policy for one-off decisions, encoding process where judgment was needed once and never again.\n- **Habit dressed as identity.** \"I'm a consensus leader\" (or a decisive one) — turning a default into a brand, instead of noticing that the company's context has changed and the situations now demand a different mix.\n- **Consensus without a closer.** Broad input, everyone heard — but no appointed leader, no deadline, no closed loop; the process substitutes for the decision.\n- **Undocumented conviction.** Deciding firmly but never writing down the reasoning — losing the pressure-test before the decision and the transparency after it.\n\n## Related Records\n\n- [Inspected Trust](inspected-trust.html) — the verification counterpart: how I check work without micromanaging, beyond the conviction-style self-check here.\n- [Managing Priorities and Energy](managing-energy.html) — the balance check's last question (is my role too challenging or not challenging enough?) feeds the sustainability practice there.\n- [Running Engineering Processes](run-engineering-processes.html) — leading with policy at organizational scale: processes with owners, reviews, and iteration.\n- [Calibrating Your Standards](calibrating-your-standards.html) — the same deliberate-practice loop applied to quality standards instead of decision styles.\n- [Working with Your CEO, Peers, and Engineering](working-with-your-ceo-peers-and-engineering.html) — style choice is also audience-aware: what the CEO, peers, and Engineering each need from a decision.\n\n## Scope and Revisiting\n\nThis principle governs how I approach decisions in any executive role. I revisit it monthly through the development practice (one decision handled in my weaker style, debriefed), and whenever the balance check flags drift: defaulting out of habit, a changed company context, too much distance from details, or unnecessary over-engagement.\n\n## Authoritative References\n\n- Will Larson, *The Engineering Executive's Primer* (O'Reilly, 2024) — the \"Leadership Styles\" chapter this record's checklist distills; the principle above is my operating commitment to it.\n- Will Larson, [Developing leadership styles](https://lethain.com/developing-leadership-styles/) — the freely available companion essay.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle, keeping the source's own grouping: selection triggers first, then execution per style, then the self-checks that keep the styles honest. The Article tab carries the rationale, implications, and anti-patterns.*\n\n### Choose the Right Style for the Situation\n\n**Lead with Policy when:**\n\n- [ ] The decision recurs frequently.\n- [ ] Many people must make the decision consistently.\n- [ ] Speed and predictability matter.\n- [ ] You want the organization to move without you in the room.\n\n**Lead with Consensus when:**\n\n- [ ] Multiple stakeholders hold a critical context.\n- [ ] No one person has the full picture.\n- [ ] The decision is important enough to remember in 6 months.\n- [ ] Buy-in materially affects execution.\n- [ ] The issue isn't well-suited for policy.\n\n**Lead with Conviction when:**\n\n- [ ] The decision is high-stakes and long-lasting.\n- [ ] Stakeholders are deeply divided.\n- [ ] No one has clear authority or a full context.\n- [ ] The decision is unlikely to be repeated.\n- [ ] Momentum is stalled, and someone must decide.\n\n### Style Execution Checklists\n\n**Leading with Policy**\n\n- [ ] Identify a frequently recurring decision.\n- [ ] Study how strong decision-makers handle it today.\n- [ ] Codify the best judgment into a clear written policy.\n- [ ] Validate with key contributors.\n- [ ] Roll it out intentionally.\n- [ ] Set a review point to revisit with data.\n- [ ] Iterate as needed.\n\n**Leading from Consensus**\n\n- [ ] Confirm the decision needs broad input.\n- [ ] Identify all relevant stakeholders.\n- [ ] Create a shared communication channel.\n- [ ] Write a framing document outlining known perspectives.\n- [ ] Ensure everyone feels heard.\n- [ ] Appoint the most senior engaged leader.\n- [ ] Set a clear deadline.\n- [ ] Follow the agreed decision-making process.\n- [ ] Close the loop and communicate the outcome.\n\n**Leading with Conviction**\n\n- [ ] Confirm that the decision is important and non-recurring.\n- [ ] Deeply understand the trade-offs.\n- [ ] Engage the individuals with the most context.\n- [ ] Write down your reasoning.\n- [ ] Pressure-test your thinking.\n- [ ] Communicate a tentative decision with a short timeout.\n- [ ] Finalize and move to execution.\n- [ ] Document the rationale for transparency.\n\n### Micromanagement Self-Check\n\n**Ask yourself:**\n\n- [ ] Am I carefully considering feedback from those closest to the work?\n- [ ] Am I adding friction to a team that would reach a similar outcome without me?\n\n- If yes to the first and no to the second → you're likely not micromanaging.\n\n### Development Checklist\n\n- [ ] Identify which style you default to.\n- [ ] Identify which style you underuse.\n- [ ] Once a month, review upcoming decisions.\n- [ ] Choose one to intentionally handle using your weaker style.\n- [ ] Debrief with someone skilled in that style.\n- [ ] Compare outcomes vs. your default approach.\n- [ ] Repeat consistently.\n\n### Balance & Engagement Check\n\n- [ ] Am I defaulting to one style out of habit?\n- [ ] Has my company context changed (growth, downturn, scale)?\n- [ ] Am I too distant from details?\n- [ ] Am I over-engaging unnecessarily?\n- [ ] Is my role currently too challenging or not challenging enough?\n\n### Core Principle Reminder\n\n- [ ] You can misuse any leadership style.\n- [ ] No single style works everywhere.\n- [ ] Strong executives develop fluency in all three.\n- [ ] The goal is adaptability, not purity.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Three ways to decide — and why the situation, not habit, should pick which one you use.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Leo asks about Vera's leadership style and she opens a toolbox with three tools, saying it depends on the decision.](assets/images/leadership-styles/comic-01-which-style.jpeg)\n**Panel 1:** *The hook: choose how to decide before you decide.*\n\n![Comic panel: Leo swings the same hammer at a screw, a plant, and a cracking window while Vera notes every style fails outside its zone.](assets/images/leadership-styles/comic-02-one-hammer-everywhere.jpeg)\n**Panel 2:** *The problem: the comfortable style gets applied where it does not fit.*\n\n![Comic panel: a divided meeting room with a spinning clock and circular whiteboard arrows while Vera says the decision needs a decider, not more input.](assets/images/leadership-styles/comic-03-consensus-as-avoidance.jpeg)\n**Panel 3:** *Anti-pattern: consensus as conflict avoidance produces an expensive stalemate.*\n\n![Comic panel: Vera presents a board with three tools labeled Recurs, Scattered, and Stalled, saying the situation picks the style.](assets/images/leadership-styles/comic-04-three-triggers.jpeg)\n**Panel 4:** *The principle: policy when it recurs, consensus when context is scattered, conviction when it is stalled.*\n\n![Comic panel: Vera pins a one-page policy and walks away while three teams independently make the same consistent choice.](assets/images/leadership-styles/comic-05-policy-scales.jpeg)\n**Panel 5:** *Policy: codify the recurring decision so the org moves without you in the room.*\n\n![Comic panel: stakeholders add puzzle pieces to a shared framing document while an appointed closer holds a deadline flag and Vera lists the rules.](assets/images/leadership-styles/comic-06-consensus-with-a-closer.jpeg)\n**Panel 6:** *Consensus: everyone is heard — with a framing doc, an appointed closer, and a deadline.*\n\n![Comic panel: Vera writes her reasoning beside a small mirror with a question mark while a stalled cart waits on a track behind her.](assets/images/leadership-styles/comic-07-conviction-with-a-guard.jpeg)\n**Panel 7:** *Conviction: run the micromanagement self-check, write the reasoning, then decide.*\n\n![Comic panel: Vera hands Leo the least-worn tool from her toolbox in front of a calendar with one circled date, urging monthly practice of the weakest style.](assets/images/leadership-styles/comic-08-adaptability-not-purity.jpeg)\n**Panel 8:** *Closer: adaptability, not purity — deliberately practice the style you underuse.*\n"}]}]}</script>

    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
