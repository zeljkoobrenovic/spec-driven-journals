<script id="data" type="application/json">{"meta": {"id": "EXEC-GELLING-LEADERSHIP-TEAM", "status": "draft:gray", "title": "Gelling Your Engineering Leadership Team", "date": "2026-07-25", "author": "Željko Obrenović", "permalink": "gelling-your-engineering-leadership-team", "timetoread": "8-10 min", "excerpt": "A leadership team is built and maintained, never assumed. In my first 60–90 days I debug the team — who should stay, which relationships are broken, whether the structure brings the right leaders and domains into the room — and act decisively on what I find. Then I operate it on explicit values, clear structure and rituals, and deliberate space for human connection; I referee defections from values immediately; and I keep maintaining the team continuously, because gelled is a state you sustain, not a milestone you pass.", "tags": "engineering executive, leadership team, team values, expectations, accountability, leadership", "icon": "assets/icons/team.png", "logo": "assets/images/gelling-your-engineering-leadership-team/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "leadership team", "team values", "expectations", "accountability", "leadership"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: A leadership team is built and maintained, never assumed. In my first 60–90 days I debug the team — assessing who should stay, which relationships are broken, and whether the structure brings the right leaders and domains into the room — and I act decisively on what I find, because early personnel decisions reset team dynamics. I then operate the team on explicit values (how we decide, how we handle conflict, when we escalate), clear structure and rituals, and deliberate space for human connection. I set explicit expectations for how members lead, work with peers, and navigate me; I referee defections from values immediately; and I keep maintaining the team, because a gelled team does not stay gelled on its own.\n\n## Statement\n\nThe leadership team is my primary instrument as an executive, and it goes through a deliberate lifecycle:\n\n- **Debug first (first 60–90 days).** I assess the current team: who may need to move on — distinguishing behavioral issues and active damage from simple underperformance — which relationship pairs are broken, whether the org structure brings the right leaders into the room, and whether key domains (Data, Security, Infrastructure) and the technical perspective itself are properly represented. I form hypotheses, actively try to disprove them, validate through 1:1s and observation — then act decisively.\n- **Operate on explicit values.** How decisions are made, how conflicts are navigated, when to escalate versus resolve directly — clarified, aligned with company values, documented if helpful, and enforced consistently.\n- **Give the team structure and humanity.** Recurring meetings and rituals, clear information flow from the exec team, explicit escalation pathways, a defined update cadence — and deliberate informal, unstructured time, because purely transactional relationships do not hold under pressure.\n- **Set explicit expectations for members.** How they lead their teams and are evaluated (execution versus firefighting versus vision); how they engage cross-functionally and handle peer conflict; when to resolve versus escalate; that they build strong leadership teams of their own — \"turtles all the way down\"; and how to navigate me, including my working style, decision philosophy, and stakeholder priorities.\n- **Referee defections immediately.** Value violations get addressed at once, consistently, for everyone — tolerated drift dissolves the team faster than any external pressure.\n- **Prevent internal competition.** I watch for collaboration curdling into zero-sum rivalry, address perceived lack of opportunity, and reinforce that future capacity exceeds current capacity.\n- **Maintain continuously.** Expectations revisited, composition re-evaluated periodically, values reinforced weekly, small tensions addressed before they grow.\n\n![Five-stage pipeline from Debug through Operate on values, Set expectations, Referee, and Maintain, with a circular arrow from Maintain looping back over the whole sequence.](assets/images/gelling-your-engineering-leadership-team/leadership-team-lifecycle.jpeg)\n**Figure 1:** *The leadership team lifecycle: debug first, operate deliberately, and maintain continuously — the loop never closes.*\n\n## How to Read This\n\nThis record is for members of my engineering leadership team, present and future: it tells you what I expect, how the team operates, and why I act quickly on composition. It applies recursively — I expect each of you to run your own leadership team the same way. The working checklist — the debugging sequence, the operating mechanics, the member expectations, the maintenance rhythm — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**Gelling starts with debugging, not with values.** The tempting first move is a values offsite; the correct first move is an honest audit of composition. No amount of shared values compensates for a member actively damaging the team, a broken relationship pair poisoning every meeting, or a structure that leaves Security unrepresented and the technical perspective absent from the room. The debugging window is the first 60–90 days — the same window as [First 90 Days](first-90-days.html), but focused on the team — and it ends in decisions, not observations.\n\n![Three magnifying glasses labeled People, Pairs, and Structure examine a team, with arrows converging on a decision diamond labeled Decide.](assets/images/gelling-your-engineering-leadership-team/three-debugging-lenses.jpeg)\n**Figure 2:** *The debugging audit looks through three lenses — people, relationship pairs, and structure — and ends in decisions, not observations.*\n\n\n**Early decisive personnel action resets team dynamics.** Everyone on the team already knows who is not working out; what they are watching is whether I know, and whether I will act. Moving quickly on the members who won't be part of the long-term team — and setting clear expectations for those who remain — resets the dynamics in a way slow-motion tolerance never does. Deferred personnel decisions do not age into easier ones; they age into a team that has learned the stated standards are negotiable.\n\n**Unaddressed violations and peer competition dissolve teams from within.** A leadership team rarely fails by external shock; it fails by erosion. One tolerated value violation teaches everyone the values are decorative. Collaboration drifts into internal competition when members perceive opportunity as zero-sum — so I address the perception directly, create non-zero-sum growth paths, and reinforce that the organization's future capacity is larger than its current one. Refereeing is not an occasional intervention; it is a standing duty.\n\n![Two timelines of a team circle: on the tolerated side small cracks compound until the circle crumbles; on the refereed side an early intervention keeps the circle whole.](assets/images/gelling-your-engineering-leadership-team/erosion-vs-refereed.jpeg)\n**Figure 3:** *Teams rarely fail by shock — they erode; refereeing the first defection is what keeps the circle whole.*\n\n\n**Transactional teams fail under load.** A team whose members only meet inside agendas has no reserve to draw on when a hard quarter arrives. Deliberate informal time and genuine relationships are not soft extras; they are the shock absorbers. The same logic scales down: each member owes their own team the same investment, which is why \"turtles all the way down\" is an explicit expectation and not a slogan.\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Debug composition in the first 60–90 days and act decisively. | Clean house by default — the bar for moving someone out is behavioral damage, not unfamiliarity. |\n| Move quickly on members who won't be part of the long-term team. | Skip diligence — hypotheses are actively disproven through 1:1s and observation first. |\n| Define and enforce explicit team values. | Write a values poster — undocumented but consistently enforced beats documented and ignored. |\n| Create space for human connection. | Mandate friendship — I build the conditions; the relationships are the team's to grow. |\n| Referee value violations immediately, for everyone. | Zero tolerance for disagreement — conflict inside the values is healthy; defection from them is not. |\n\nOne concrete expectation deserves emphasis: members should not have to reverse-engineer me. I clarify my working style — risk tolerance, process preference — share my decision-making philosophy, make stakeholder prioritization explicit, and consider maintaining a personal README, per [Leadership Styles](leadership-styles.html).\n\n## Anti-Patterns\n\n- **Tolerating repeated behavioral drift.** Letting a member violate team values again and again because they are senior, tenured, or hard to replace — the fastest way to teach the team that the values are fiction.\n- **The values offsite before the composition audit.** Investing in alignment rituals with a team whose membership, relationships, or structure are the actual problem.\n- **Slow-motion personnel decisions.** Knowing by month two who won't be part of the long-term team and acting in month nine — spending the intervening months of team trust for nothing.\n- **Purely transactional relationships.** A leadership team that only convenes around agendas and escalations, with no informal fabric — functional in calm weather, brittle in a crisis.\n- **Letting collaboration curdle into competition.** Ignoring the signs of zero-sum behavior — hoarded scope, positioning against peers — until the team is a collection of rivals sharing a meeting.\n- **The unrepresented domain.** Running a leadership team where key domains or the technical perspective itself have no seat, then wondering why decisions keep getting relitigated by reality.\n\n## Related Records\n\n- [Working with Your CEO, Peers, and Engineering](working-with-your-ceo-peers-and-engineering.html) — the executive table around and above me; this record covers the team that reports to me.\n- [First 90 Days](first-90-days.html) — the ramp whose team-debugging slice this record takes long-term.\n- [Organizational Values](organizational-values.html) — the values of all of engineering; this record covers the leadership team's own working values.\n- [Inspected Trust](inspected-trust.html) — a gelled team is one where inspection reads as support, not suspicion.\n- [Leadership Styles](leadership-styles.html) — the working-style clarity (including a personal README) that members use to navigate me.\n\n## Scope and Revisiting\n\nThis principle governs the leadership team reporting to me in any executive role — its composition, operation, and maintenance. The debugging phase recurs whenever the team materially changes: a reorganization, a merger, several new members. Beyond that, the maintenance rhythm *is* the revisiting: expectations revisited regularly, composition re-evaluated periodically, and the record itself reviewed when small tensions stop surfacing — silence being the more worrying signal.\n\n## Authoritative References\n\n- Will Larson, *The Engineering Executive's Primer* (O'Reilly, 2024) — the \"Gelling Your Engineering Leadership Team\" chapter this record's checklist distills; the principle above is my operating commitment to it.\n- Will Larson, [Gelling your Engineering leadership team](https://lethain.com/gelling-engineering-leadership-team/) — the freely available companion essay.\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "3 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle, following the source's lifecycle arc: debug the team first, then operate it, set expectations, prevent competition, and maintain. The Article tab carries the rationale, implications, and anti-patterns.*\n\n### Debugging & Establishing the Team (First 60–90 Days)\n\n**Assess the Current Team**\n\n- [ ] Identify members who may need to move on (behavioral issues or active damage vs. simple underperformance).\n- [ ] Identify broken relationship pairs (internal or with key stakeholders).\n- [ ] Evaluate whether the org structure brings the right leaders into the room.\n- [ ] Ensure key domains (e.g., Data, Security, Infrastructure) are properly represented.\n\n**Form Initial Hypotheses**\n\n- [ ] Develop a clear point of view for your leadership team.\n- [ ] Actively try to disprove your early assumptions.\n- [ ] Validate perceptions through 1:1s and observation.\n\n**Take Decisive Action**\n\n- [ ] Move out individuals who won't be part of the long-term team.\n- [ ] Set clear expectations for those who remain.\n- [ ] Make personnel decisions quickly to reset team dynamics.\n- [ ] Consider starting with a broader team early on.\n- [ ] Ensure that the technical perspective is represented (e.g., by senior engineers or architects).\n\n### Operating the Leadership Team\n\n**Define Team Values**\n\n- [ ] Clarify how decisions are made.\n- [ ] Define how conflicts are navigated.\n- [ ] Align on when to escalate vs. resolve directly.\n- [ ] Align team values with broader company values.\n- [ ] Document values (if helpful) and enforce them consistently.\n\n**Establish Team Structure**\n\n- [ ] Define recurring meetings and rituals.\n- [ ] Clarify information flow from exec team to leadership team.\n- [ ] Establish clear escalation pathways.\n- [ ] Decide on update cadence (weekly reports, chat updates, etc.).\n\n**Create Space for Human Connection**\n\n- [ ] Build informal, unstructured interaction time.\n- [ ] Avoid purely transactional relationships.\n- [ ] Encourage relationship-building outside structured meetings.\n\n**Referee Defection from Values**\n\n- [ ] Address value violations immediately.\n- [ ] Hold members accountable consistently.\n- [ ] Avoid tolerating repeated behavioral drift.\n- [ ] Reinforce that values apply to everyone.\n\n### Setting Expectations for Team Members\n\n**Leading Their Teams**\n\n- [ ] Clarify how leaders will be evaluated (execution vs. firefighting vs. vision).\n- [ ] Align on performance expectations.\n- [ ] Ensure they understand business-level goals.\n\n**Communicating with Peers**\n\n- [ ] Set expectations for cross-functional engagement.\n- [ ] Avoid siloed, heads-down leadership behavior.\n- [ ] Define how to handle peer conflicts.\n\n**Staying Aligned with Peers**\n\n- [ ] Clarify when to resolve vs. escalate.\n- [ ] Define escalation norms (together vs. separately).\n- [ ] Encourage shared ownership over competing priorities.\n\n**Building Their Own Leadership Teams**\n\n- [ ] Ensure each leader develops their own strong team.\n- [ ] Reinforce \"turtles all the way down\" leadership consistency.\n- [ ] Encourage cascading communication of priorities and values.\n\n**Navigating You (the Executive)**\n\n- [ ] Clarify your working style (risk tolerance, process preference).\n- [ ] Share decision-making philosophy.\n- [ ] Make stakeholder prioritization explicit.\n- [ ] Consider creating a personal README.\n\n### Preventing Competition Among Peers\n\n- [ ] Watch for collaboration drifting into internal competition.\n- [ ] Address perceived lack of opportunity.\n- [ ] Encourage non-zero-sum growth opportunities.\n- [ ] Reinforce that future capacity > current capacity.\n- [ ] Avoid tolerating value violations that fuel competition.\n\n### Ongoing Maintenance\n\n- [ ] Revisit expectations regularly.\n- [ ] Periodically re-evaluate team composition.\n- [ ] Reinforce values in weekly meetings.\n- [ ] Address small tensions before they grow.\n- [ ] Invest consistently in relationships.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "How a leadership team actually gels — debug it first, then operate it, then keep maintaining it.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Leo excitedly shows Vera an offsite brochure while Vera calmly suggests debugging the team first.](assets/images/gelling-your-engineering-leadership-team/comic-01-the-offsite-instinct.jpeg)\n**Panel 1:** *The tempting first move is a values offsite; the correct first move is debugging.*\n\n![Comic panel: Vera and Leo observe a meeting room with two leaders sitting back-to-back and an empty chair labeled Security.](assets/images/gelling-your-engineering-leadership-team/comic-02-the-broken-room.jpeg)\n**Panel 2:** *No amount of shared values compensates for broken composition, relationships, or structure.*\n\n![Comic panel: Leo holds a calendar with months crossed out while Vera warns that everyone already knows who is not working out.](assets/images/gelling-your-engineering-leadership-team/comic-03-slow-motion-decision.jpeg)\n**Panel 3:** *Anti-pattern: knowing by month two and acting in month nine.*\n\n![Comic panel: Vera checks off a three-item whiteboard list about people, relationships, and structure while Leo takes notes.](assets/images/gelling-your-engineering-leadership-team/comic-04-debug-then-act.jpeg)\n**Panel 4:** *The principle: debug composition in the first 60-90 days, then act decisively.*\n\n![Comic panel: Vera points at a three-arrow signpost labeled Decide, Conflict, and Escalate as team members follow the path.](assets/images/gelling-your-engineering-leadership-team/comic-05-explicit-values.jpeg)\n**Panel 5:** *Operate on explicit values: how we decide, handle conflict, and escalate.*\n\n![Comic panel: the leadership team laughs together over coffee with no laptops while Vera notes that transactional teams break under load.](assets/images/gelling-your-engineering-leadership-team/comic-06-shock-absorbers.jpeg)\n**Panel 6:** *Informal time is not a soft extra; it is the shock absorber.*\n\n![Comic panel: Vera raises a referee whistle between two leaders tugging at a box labeled Scope.](assets/images/gelling-your-engineering-leadership-team/comic-07-the-referee.jpeg)\n**Panel 7:** *Referee value violations immediately; never let collaboration curdle into rivalry.*\n\n![Comic panel: Vera waters a thriving potted plant while telling Leo that a gelled team is sustained, not achieved.](assets/images/gelling-your-engineering-leadership-team/comic-08-never-done.jpeg)\n**Panel 8:** *Closer: a gelled team does not stay gelled on its own.*\n"}]}]}</script>

            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
