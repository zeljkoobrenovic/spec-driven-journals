<script id="data" type="application/json">{"meta": {"id": "EXEC-FOUR-FUNDAMENTAL-TEAM-TOPOLOGIES", "status": "draft:gray", "title": "The Four Fundamental Team Topologies", "date": "2026-07-26", "author": "Željko Obrenović", "permalink": "four-fundamental-team-topologies", "timetoread": "9 min", "excerpt": "I build organizations from exactly four team types: stream-aligned teams that own a flow of change end to end, enabling teams that grow capability and then step away, complicated-subsystem teams only where deep specialism genuinely demands one, and platform teams that run the platform as a product. Most teams are stream-aligned; everything else exists to make them faster. If a team cannot say which of the four it is, that ambiguity is my problem to fix.", "tags": "engineering executive, team topologies, stream-aligned, platform, enabling teams, complicated subsystem", "icon": "assets/icons/four-fundamental-team-topologies.png", "logo": "assets/images/four-fundamental-team-topologies/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["engineering executive", "team topologies", "stream-aligned", "platform", "enabling teams", "complicated subsystem"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: I build organizations from exactly four team types: stream-aligned teams that own a flow of change end to end — the overwhelming majority — enabling teams that grow capability in other teams and then step away, complicated-subsystem teams only where deep specialism genuinely demands one, and platform teams that run the platform as an internal product whose sole job is to make stream-aligned teams faster. Any team that cannot name its type has an ambiguity problem, and ambiguity problems are mine to fix.\n\n## Statement\n\nMy operating model for team types has five parts:\n\n- **Four types, no fifth.** Every team is stream-aligned, enabling, complicated-subsystem, or platform. Vague \"support,\" \"ops,\" or \"shared services\" teams without a clear topology do not persist — each gets a type or gets restructured.\n- **Stream-aligned is the default and the majority.** A stream-aligned team owns a continuous flow of change — a product, service, or customer need — from idea to production, with long-term ownership. I aim for roughly 6:1 to 9:1 stream-aligned teams against everything else.\n- **Enabling teams grow capability, then leave.** Their goal is the *autonomy* of the teams they help. Engagements are time-boxed; a permanent dependency on an enabling team is a failure of the enabling team.\n- **Complicated-subsystem teams are rare and justified.** They exist only where a subsystem genuinely requires specialist expertise most stream-aligned teams could not safely carry — and only in small numbers.\n- **The platform is a product.** Platform teams provide self-service internal services that reduce cognitive load for the streams. They start from a thinnest viable platform and are judged by whether their users move faster.\n\n![Diagram of the four fundamental team topologies: horizontal stream-aligned flows on top of a platform bar, with an enabling team alongside and a complicated-subsystem block embedded.](assets/images/four-fundamental-team-topologies/four-types-canonical-layout.jpeg)\n**Figure 1:** *The four types in their canonical layout: stream-aligned flows ride on the platform; enabling and complicated-subsystem teams support from the side.*\n\n## How to Read This\n\nThis is an **appendix record**: unlike the core records in this journal, grounded in Will Larson's *The Engineering Executive's Primer*, this one is grounded in Matthew Skelton and Manuel Pais's *Team Topologies* — read here through an executive lens, complementing the Primer-grounded records. The book gives teams a shared vocabulary; I read it as the executive who enforces that vocabulary, because a taxonomy only constrains an organization if someone refuses to approve teams outside it. If you lead teams in my organization, this record explains why every team charter names one of four types, and why \"we're kind of a hybrid\" is a question, not an answer. The working checklist — organization-level checks, per-type checks, and the conversion guides — lives in the **Checklist** tab of this post.\n\n## Rationale\n\n**A closed vocabulary forces every team's purpose into the open.** With an open-ended set of team types, each new problem breeds a new bespoke team — a tools team here, a shared-services team there — until nobody can explain who owns what. Four types is a deliberately small budget. When a proposed team fits none of them, that friction is the design working: either the purpose is unclear, or the responsibility belongs inside an existing stream.\n\n**Flow is the thing being optimized, not utilization.** All four types serve one goal: a fast, safe, sustainable flow of change. That is why stream-aligned teams dominate — they are the only type that directly delivers value — and why the other three are legitimate only insofar as they make the streams faster. Teams stay loosely coupled, with minimal hand-offs. A supporting team that streams must wait on has inverted its purpose: support teams serve streams, they do not control them.\n\n**Enabling that never ends is dependency, not enablement.** An enabling team's success metric is its own exit. It works with a stream-aligned team for a limited period, transfers the capability — a practice, a technology, a way of working — and steps away, sharing bad news about new tools as freely as good. The moment an enabling team becomes the permanent place where a certain kind of work goes, it is a bottleneck with a flattering name — or an ivory tower issuing guidance it never has to live with.\n\n![Three-stage timeline showing an enabling team overlapping a stream team, transferring capability, then stepping away.](assets/images/four-fundamental-team-topologies/enabling-grows-then-leaves.jpeg)\n**Figure 2:** *Enabling done right: grow the capability, then step away — the engagement is time-boxed by design.*\n\n**Specialism is a cost I pay only when I must.** A complicated-subsystem team — owning a video codec, a mathematical model, a reconciliation engine — is justified only when most stream-aligned teams could not safely change the subsystem and embedding the expertise everywhere would be impractical. It earns its keep by delivering higher quality and speed than the streams could themselves, collaborating closely during early exploration and reducing interaction once the subsystem stabilizes. Every such team adds a hand-off, so I keep their number small: a subsystem that has become teachable no longer warrants a dedicated team.\n\n**A platform is a product or it is a tax.** What distinguishes a good platform team is how it behaves: it treats internal teams as customers, provides self-service APIs and task-focused documentation, defines support expectations, collects feedback, and measures developer experience. I insist on a thinnest viable platform — just big enough to accelerate the streams — because platforms naturally grow, dominate, and start dictating to the teams they exist to serve. Adoption is gradual and earned, not mandated on day one.\n\n![Thin platform layer with self-service access points speeding up stream-aligned teams above while absorbing infrastructure complexity below.](assets/images/four-fundamental-team-topologies/platform-as-a-product.jpeg)\n**Figure 3:** *The thinnest viable platform: a product layer judged by one measure — do the streams above it move faster?*\n\n**Legacy team types get an explicit fate, not a quiet exemption.** Teams that predate the vocabulary each get a deliberate conversion path. Infrastructure teams move toward platform behavior — self-service, never owning application changes for others. Component teams are reviewed: dissolved into streams, or converted to platform, enabling, or complicated-subsystem teams — they do not exist merely because the architecture has a component. Tooling teams get a time-bound or product-oriented mission before drifting into isolated tool maintenance. Support aligns to streams of change, with dynamic swarming for cross-stream incidents, rather than centralizing production responsibility away from the people who build the software. And architecture becomes part-time enabling: architects support teams and shape APIs, boundaries, and interactions — considering Conway's Law — rather than imposing decisions from outside the flow.\n\n## What This Means in Practice\n\n| What this principle says | What it does **not** say |\n| --- | --- |\n| Every team is one of four types, named in its charter. | Existing teams are renamed overnight — conversion is deliberate, not cosmetic. |\n| Most teams are stream-aligned, roughly 6:1 to 9:1. | The ratio is a law — it shifts the burden of proof, nothing more. |\n| Enabling engagements are time-boxed; the goal is autonomy. | Enabling teams are cheap consultants to park hard problems with. |\n| Complicated-subsystem teams exist only where specialism is proven. | Every gnarly module deserves its own team. |\n| The platform is a product with users, feedback, and a thin scope. | The platform is mandatory, ever-growing, or above criticism. |\n| Supporting teams serve streams and reduce their cognitive load. | Streams may outsource operating their own software wholesale. |\n\nConcretely: no team is chartered without naming its type, ownership area, and interaction model. Reorg proposals are judged first on whether they improve flow of change, not utilization. Stream-aligned teams can build, run, and monitor their service in production, with specialists collaborating across skill boundaries rather than becoming internal hand-off stages. And once a year I re-run the health check: is the ratio holding, are enabling teams actually leaving, does each complicated-subsystem team still deserve to exist, and is the platform still thin?\n\n## Anti-Patterns\n\n- **The team-type zoo.** Tiger teams, tools teams, shared-services groups, standing committees — each with a bespoke charter nobody can state.\n- **The vague ops team.** A \"support\" or \"ops\" team with no topology, absorbing whatever has no owner, becoming a hand-off stage for everyone.\n- **The enabling team that never leaves.** Specialists who become the permanent place a capability lives, so streams never learn it — dependency dressed as help.\n- **The subsystem land-grab.** Declaring every complicated-looking module a complicated subsystem, multiplying hand-offs to protect specialist turf.\n- **The platform empire.** A platform grown past its thinnest viable scope, mandating adoption, slowing the streams it was built to accelerate.\n- **Functional silos as stages.** Testing, QA, database, architecture, or operations as mandatory hand-off gates, so work pauses waiting for another silo.\n- **Component teams by inertia.** A team existing because the architecture diagram has a box there, not because the box reduces anyone's cognitive load.\n\n## Related Records\n\n- [Organizational Design](organizational-design.html) — appendix sibling on sizing and investment; this record supplies the vocabulary of team *purposes* those mechanics operate on.\n- [Running Engineering Processes](run-engineering-processes.html) — the process layer that keeps team charters and health checks actually happening.\n- [Static Team Topologies](static-team-topologies.html) — appendix sibling on choosing a topology for a specific context; this record defines the types it chooses among.\n- [Team Interaction Modes](team-interaction-modes.html) — appendix sibling on *how* the four types interact: collaboration, X-as-a-Service, facilitating.\n- [Team-First Boundaries](team-first-boundaries.html) — appendix sibling on cognitive load and boundary sizing, the constraint the four types are designed to respect.\n\n## Scope and Revisiting\n\nThis principle governs the vocabulary of team types in my organization: how teams are chartered, how legacy teams are converted, and how supporting teams are held to their supporting role. I revisit it whenever a proposed team resists classification, whenever the stream-aligned ratio drifts well outside 6:1 to 9:1, and at the yearly health check. The types are stable; the assignment of any given team to a type is not — that is what [Static Team Topologies](static-team-topologies.html) is for.\n\n## Authoritative References\n\n- Matthew Skelton and Manuel Pais, *Team Topologies: Organizing Business and Technology Teams for Fast Flow* (IT Revolution Press, 2019) — the chapters on the four fundamental topologies this record's checklist distills.\n- The authors maintain further materials, training, and updated patterns at [teamtopologies.com](https://teamtopologies.com/).\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "5 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this principle. The Article tab carries the rationale, implications, and anti-patterns.*\n\n## Organization-Level Checklist\n\n- [ ] We have identified which teams are **stream-aligned**, **enabling**, **complicated-subsystem**, or **platform** teams.\n- [ ] Most teams are **stream-aligned**.\n- [ ] We do not have **vague \"support,\" \"ops,\" or \"shared services\"** teams without a clear topology.\n- [ ] Each team has a clear purpose, ownership area, and interaction model.\n- [ ] Team responsibilities reduce ambiguity rather than increase it.\n- [ ] Teams are designed to improve **flow of change**, not just optimize resource utilization.\n- [ ] Teams are loosely coupled and can make progress without excessive coordination.\n- [ ] Hand-offs between teams are minimized.\n- [ ] Team boundaries reduce cognitive load for stream-aligned teams.\n- [ ] Platform, enabling, and complicated-subsystem teams exist to support stream-aligned teams, not control them.\n- [ ] The ratio of stream-aligned teams to other team types is roughly between **6:1 and 9:1**.\n\n## Stream-Aligned Team Checklist\n\n- A stream-aligned team should own a continuous flow of work aligned to a business domain, product, service, user journey, or customer need.\n\n- [ ] The team is aligned to a single valuable stream of work.\n- [ ] The team owns delivery from idea to production.\n- [ ] The team is close to customers or users.\n- [ ] The team can deliver value quickly, safely, and independently.\n- [ ] The team has minimal hand-offs to other teams.\n- [ ] The team has long-term ownership of its area, not temporary project ownership.\n- [ ] The team has the capabilities needed to build, run, and evolve its service.\n- [ ] The team can monitor and operate its software in production.\n- [ ] The team regularly evaluates flow, quality, and sustainability.\n- [ ] The team has time to address technical debt and code quality.\n- [ ] The team uses feedback and experimentation to improve.\n- [ ] The team proactively reaches out to enabling, platform, or complicated-subsystem teams when needed.\n\n## Stream-Aligned Team Capabilities\n\n- Check whether the team has access to these capabilities, either internally or through lightweight support:\n\n- [ ] Product ownership or product management\n- [ ] Design and architecture\n- [ ] Development and coding\n- [ ] Testing and quality assurance\n- [ ] User experience\n- [ ] Application security\n- [ ] Infrastructure and operability\n- [ ] Metrics and monitoring\n- [ ] Commercial or operational viability analysis\n\n- Important check:\n\n- [ ] We do **not** assume each capability requires a separate specialist role.\n- [ ] Specialists do not become bottlenecks for the team.\n- [ ] Team members can collaborate across skill boundaries.\n\n## Enabling Team Checklist\n\n- An enabling team helps stream-aligned teams build capabilities, adopt new practices, and overcome knowledge gaps.\n\n- [ ] The team is made up of specialists in a technical or product area.\n- [ ] The team helps stream-aligned teams learn, rather than taking over the work permanently.\n- [ ] The team's goal is to increase the autonomy of stream-aligned teams.\n- [ ] The team works with stream-aligned teams for a limited period when possible.\n- [ ] The team avoids becoming a permanent dependency.\n- [ ] The team actively understands the needs of stream-aligned teams.\n- [ ] The team establishes regular checkpoints with the teams it supports.\n- [ ] The team stays ahead of new tools, practices, and approaches.\n- [ ] The team shares both good news and bad news about technology choices.\n- [ ] The team promotes learning across teams.\n- [ ] The team acts more like a coach or consultant than a command-and-control authority.\n- [ ] The team avoids becoming an ivory tower.\n\n## Complicated-Subsystem Team Checklist\n\n- A complicated-subsystem team owns a part of the system that requires deep specialist knowledge.\n\n- [ ] The subsystem genuinely requires specialist expertise.\n- [ ] Most stream-aligned teams would struggle to understand or safely change the subsystem.\n- [ ] The team reduces cognitive load for stream-aligned teams.\n- [ ] The team exists because embedding the expertise everywhere would be impractical.\n- [ ] The team owns a clearly bounded subsystem.\n- [ ] The team collaborates closely with stream-aligned teams during early exploration.\n- [ ] The team reduces interaction once the subsystem stabilizes.\n- [ ] The team prioritizes work based on the needs of stream-aligned teams.\n- [ ] The team delivers higher quality and speed than stream-aligned teams would.\n- [ ] There are only a small number of complicated-subsystem teams.\n\n- Examples to check against:\n\n- [ ] Video processing engine\n- [ ] Mathematical model\n- [ ] Financial reconciliation engine\n- [ ] Face-recognition system\n- [ ] Other highly specialized subsystems\n\n## Platform Team Checklist\n\n- A platform team provides internal services that help stream-aligned teams deliver with less cognitive load.\n\n- [ ] The platform enables stream-aligned teams to deliver with greater autonomy.\n- [ ] The platform is treated as an internal product.\n- [ ] The platform provides self-service APIs, tools, services, documentation, or support.\n- [ ] The platform reduces cognitive load for stream-aligned teams.\n- [ ] The platform team understands its users' needs.\n- [ ] The platform has clear user groups, such as developers, testers, product owners, and service engineers.\n- [ ] The platform has defined hours of operation and support expectations.\n- [ ] The platform is reliable, usable, and fit for purpose.\n- [ ] The platform team uses product-management techniques.\n- [ ] The platform team collects feedback from consuming teams.\n- [ ] The platform team focuses on usability and developer experience.\n- [ ] The platform avoids becoming too large or dominant.\n- [ ] The platform is \"just big enough\" to help teams move faster.\n- [ ] The platform provides a thin viable platform before expanding.\n- [ ] The platform exposes useful constraints without slowing teams down.\n- [ ] Platform adoption is understood as gradual, not immediate.\n\n## Platform Design Checklist\n\n- [ ] The platform provides self-service capabilities.\n- [ ] Teams can consume platform services without lengthy manual coordination.\n- [ ] Documentation is clear, current, and task-focused.\n- [ ] Onboarding a new developer to the platform is easy.\n- [ ] The platform abstracts away infrastructure, networking, or cross-cutting concerns where useful.\n- [ ] The platform does not hide unstable or poorly understood lower-level systems.\n- [ ] Platform layers and dependencies are documented.\n- [ ] The platform team understands what the platform depends on.\n- [ ] The platform reduces, rather than increases, security and audit burden for stream-aligned teams.\n- [ ] Internal pricing, usage tracking, or demand management is considered where demand is hard to control.\n\n## Avoiding Team Silos\n\n- [ ] We avoid teams organized only by single functional expertise.\n- [ ] Testing, QA, database, architecture, UX, and operations work are not isolated as mandatory hand-off stages.\n- [ ] Cross-functional teams are preferred where possible.\n- [ ] Specialist teams provide services or enablement rather than blocking flow.\n- [ ] Work does not pause while waiting for another functional silo.\n- [ ] Operational responsibility stays close to the teams building the software.\n- [ ] Support teams, if needed, are aligned to streams rather than centralized around all systems.\n\n## Converting Existing Team Types\n\n### Infrastructure Teams\n\n- [ ] Infrastructure teams are being moved toward platform-team behavior.\n- [ ] Infrastructure services are offered as self-service capabilities.\n- [ ] Infrastructure work reduces cognitive load for stream-aligned teams.\n- [ ] Infrastructure teams avoid owning application-level changes for other teams.\n\n### Component Teams\n\n- [ ] Component teams are reviewed to determine whether they should be dissolved, converted to platform teams, enabling teams, or complicated-subsystem teams.\n- [ ] Component teams do not exist merely because of technical architecture.\n- [ ] Component ownership does not create unnecessary hand-offs.\n\n### Tooling Teams\n\n- [ ] Tooling teams have a clear, time-bound, or product-oriented mission.\n- [ ] Tooling teams do not become isolated tool-maintenance teams.\n- [ ] Tooling teams are converted into enabling teams or platform teams where appropriate.\n\n### Support Teams\n\n- [ ] Support teams are aligned to streams of change where possible.\n- [ ] Support activity helps teams learn from incidents.\n- [ ] Support does not centralize all production responsibility away from stream-aligned teams.\n- [ ] Dynamic swarming is used for incidents that affect multiple streams.\n\n### Architecture Teams\n\n- [ ] Architecture is handled through part-time enabling where possible.\n- [ ] Architects support teams rather than impose decisions.\n- [ ] Architecture work helps shape APIs, boundaries, and team interactions.\n- [ ] Architecture decisions consider Conway's Law and team communication paths.\n\n## Final Health Check\n\n- [ ] Most teams are stream-aligned.\n- [ ] Supporting teams reduce cognitive load.\n- [ ] Enabling teams increase capability and then move on.\n- [ ] Complicated-subsystem teams exist only where specialist knowledge is truly required.\n- [ ] Platform teams provide useful internal products.\n- [ ] Teams are optimized for fast, safe, sustainable flow of change.\n- [ ] Team boundaries are clear, purposeful, and easy to explain.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Four team types, no fifth — how a zoo of teams becomes an organization built for flow, in eight panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. LEO: an eager young engineering manager, curly hair, round glasses, laptop under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and amber accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Leo shows Vera a whiteboard crowded with mismatched team boxes — tiger team, tools team, committee — while Vera raises an eyebrow.](assets/images/four-fundamental-team-topologies/comic-01-team-type-zoo.jpeg)\n**Panel 1:** *The hook: a team for everything, and a type for nothing.*\n\n![Comic panel: tangled arrows between team boxes while engineers shrug and a ticket floats unclaimed; Leo admits nobody knows who owns what.](assets/images/four-fundamental-team-topologies/comic-02-nobody-knows-who-owns-what.jpeg)\n**Panel 2:** *The problem: ambiguity between teams is where flow goes to die.*\n\n![Comic panel: Vera draws four simple shapes on a clean whiteboard — arrow, vertical bar, octagon, flat bar — telling Leo there are four team types, no fifth.](assets/images/four-fundamental-team-topologies/comic-03-four-types-only.jpeg)\n**Panel 3:** *The principle: every team is one of four types — stream-aligned, enabling, complicated-subsystem, platform.*\n\n![Comic panel: Vera points at many horizontal stream arrows flowing toward a customer, with a single small supporting shape beside them.](assets/images/four-fundamental-team-topologies/comic-04-stream-aligned-majority.jpeg)\n**Panel 4:** *The majority: stream-aligned teams own a flow of change end to end — roughly six to nine for every other team.*\n\n![Comic panel: Vera shows a thin platform bar with plug-in sockets under stream arrows that now have speed lines.](assets/images/four-fundamental-team-topologies/comic-05-platform-as-a-product.jpeg)\n**Panel 5:** *The platform: an internal product with users and feedback — just big enough to make the streams faster.*\n\n![Comic panel: an enabling figure hands a glowing skill to a stream team and walks away, while one small specialist octagon sits apart.](assets/images/four-fundamental-team-topologies/comic-06-enabling-grows-then-leaves.jpeg)\n**Panel 6:** *The rare types: enabling teams time-box their help; complicated-subsystem teams stay few and justified.*\n\n![Comic panel: Vera and Leo sort old team boxes into four bins shaped like the four topologies, one ops box morphing into a platform bar.](assets/images/four-fundamental-team-topologies/comic-07-converting-the-zoo.jpeg)\n**Panel 7:** *The conversion: legacy teams get an explicit fate under the four types — no quiet exemptions.*\n\n![Comic panel: close-up of Vera and Leo before the finished four-type diagram as Vera closes her notebook.](assets/images/four-fundamental-team-topologies/comic-08-easy-to-explain.jpeg)\n**Panel 8:** *The closer: an organization whose team boundaries are easy to explain — and whose ambiguities are the executive's to fix.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
