<script id="data" type="application/json">{"meta": {"id": "SEC-CLOUD-INFRASTRUCTURE", "status": "draft:gray", "title": "Cloud Infrastructure", "date": "2026-08-22", "author": "Željko Obrenović", "permalink": "cloud-infrastructure", "timetoread": "8 min", "excerpt": "The provider secures the cloud; my organization secures what it puts in the cloud — the data, the identities, the configurations, and the workloads. That split is a contract I read correctly for every service model, and everything else in this record follows from it: misconfiguration is treated as the leading cloud risk and countered with automated configuration monitoring and infrastructure as code behind review; MFA sits on every root and administrator account and access dies the day someone leaves; IAM is least-privilege by role with alerts on escalation; the old disciplines — inventory, patching, backups, encryption, logging — carry into the cloud undiminished; architecture follows established patterns and the provider Well-Architected frameworks; and no alert is trusted until it has fired on a test. Compliance is the baseline of this program, never the end of it.", "tags": "security, cloud, shared responsibility, misconfiguration, IAM, infrastructure as code, secrets management, GuardDuty, well-architected, defensive security", "icon": "assets/icons/cloud-infrastructure.png", "logo": "assets/images/cloud-infrastructure/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["security", "cloud", "shared responsibility", "misconfiguration", "IAM", "infrastructure as code", "secrets management", "GuardDuty", "well-architected", "defensive security"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: The provider secures the cloud; my organization secures what it puts in the cloud — **the data, the identities, the configurations, and the workloads**. That split is a contract, read correctly for every service model, and everything else follows from it. **Misconfiguration is treated as the leading cloud risk**, countered with continuous audits, automated configuration monitoring, and **infrastructure as code in source control behind code review and pipeline security checks**; **MFA sits on every root and administrator account** and access is removed the day someone leaves; **IAM is least-privilege by role**, reviewed regularly, with alerts on unexpected escalation; **the old disciplines — inventory, patching, backups, encryption, logging — carry into the cloud undiminished**; **architecture follows established patterns and the provider Well-Architected frameworks**, reassessed as workloads change; and **no alert is trusted until it has fired on a test**. The rule that closes the record: **compliance is the baseline of the security program — never the end of it.**\n\n## Statement\n\nThis is the bar every cloud account, subscription, and project in my organization is held to.\n\n**The shared responsibility model is read correctly — per service model.**\n\n- The differences between **SaaS, PaaS, and IaaS** are understood, and for each service model it is explicit what the provider secures and what my organization secures. The shared responsibility model is reviewed for AWS, Azure, and GCP — and the chapter's summary rule is mine: the provider generally secures the cloud infrastructure, while **we secure our data, identities, configurations, and workloads**.\n\n![Three columns for IaaS, PaaS, and SaaS showing the provider securing progressively more of the stack, while data, identities, configurations, and workloads always remain the customer's responsibility.](assets/images/cloud-infrastructure/shared-responsibility-per-model.jpeg)\n**Figure 1:** *The responsibility line moves with the service model — but data, identities, configurations, and workloads stay on our side of the contract in every column.*\n\n**Misconfiguration is the threat model's first entry.**\n\n- Cloud configurations are audited regularly, with **automated configuration-monitoring tools** doing the continuous watching — AWS Config, Azure Policy and Defender for Cloud, and Google Security Command Center are the worked examples.\n- **Least privilege is the default posture**: no overly permissive IAM roles, storage permissions, or firewall rules.\n- **Infrastructure is code wherever possible** — stored in source control, changed only through code review, with security checks built into the CI/CD pipelines. An infrastructure change nobody reviewed is a misconfiguration waiting for its incident.\n\n**Credentials and secrets are controlled end to end.**\n\n- Strong password policies, a password vault, **MFA on root and administrator accounts** — extended to all user accounts where possible — centralized identity management and SSO, and **access removed immediately when employees or contractors leave**.\n- **No secret ever lands in source code.** Repositories are scanned for exposed secrets, secrets live in a dedicated secrets-management service, rotation is regular, and a defined process exists for responding when a credential is exposed anyway.\n\n**IAM is least privilege, by role, and watched.**\n\n- Users and services get only the permissions their jobs require, through **role-based access control** with roles scoped to job function. Permissions are reviewed regularly across users, groups, services, and roles; unused and excessive privileges are removed; privileged permission changes are monitored; and **unexpected privilege escalation raises an alert**, not a retrospective.\n\n**The old disciplines carry into the cloud undiminished.**\n\n- An inventory of cloud assets; regular patching; continuous vulnerability scanning; critical data backed up **with restoration procedures tested**; a disaster recovery plan; sensitive data encrypted; network boundaries secured with firewalls, VPNs, and appropriate access controls; security logs collected, retained, and monitored for suspicious behavior — under recognized frameworks, with **CIS Controls and NIST CSF** as the named references.\n\n**Architecture is deliberate, not improvised.**\n\n- Established architecture patterns over designed-from-scratch; application layers separated in a **three-tier architecture** where appropriate; networks segmented so internal tiers are never directly internet-exposed; strict network ACLs and security groups.\n- **Microservices where isolation and independent scaling pay** — with inter-service communication secured and dependencies and inherited risks reviewed; **event-driven architecture where appropriate** — with security controls on producers, consumers, and channels; provider reference architectures as the starting point.\n- The **AWS Well-Architected Framework, Microsoft Azure Well-Architected Framework, and Google Cloud Architecture Framework** are reviewed, security is evaluated alongside reliability, performance, operations, and cost, and architecture is reassessed as workloads and threats change.\n\n**Detection is wired, centralized — and tested before it is trusted.**\n\n- Visibility into the overall security posture; cloud environments monitored for threats and vulnerabilities; alerts configured for the security events that matter; logs and alerts centralized in a SIEM where possible; incident-response procedures written for cloud security events.\n- **Security alerts are tested before production relies on them.** The chapter's AWS GuardDuty exercise is the worked example: wire GuardDuty findings through EventBridge to an SNS email notification, then generate sample findings and verify the notification arrives — end to end, before the day it matters.\n\n**Compliance is the baseline, not the destination.**\n\n- The final review closes on the rule that frames this whole record: passing the audit is where the security program starts, not where it stops.\n\n## How to Read This\n\nThis record closes the **Hardening the Estate** section of the journal — after [Endpoints](endpoints.html) and [Databases](databases.html), because the cloud is where an increasing share of both now lives. It is grounded in the Cloud Infrastructure chapter of the *Defensive Security Handbook*. Where the chapter names provider tools — AWS Config, Azure Policy and Defender for Cloud, Google Security Command Center, GuardDuty — the checklist keeps them verbatim, including the full GuardDuty exercise, and this article states the commitments at the capability level with the named services as the worked example. The full working checklist lives in the **Checklist** tab; the management summary is in the **TL;DR** tab and the conversation in the **Conversation** tab.\n\n## Rationale\n\n**The shared responsibility model is a contract, and misreading it creates controls nobody owns.** Every cloud breach postmortem that begins \"we assumed the provider handled that\" is a responsibility-model failure, not a technology failure. The split moves with the service model — the provider covers more of the stack in SaaS than in IaaS — which is why the record requires understanding it *per model* and *per provider*, not as a slogan. Read correctly, the model is actually clarifying: the provider's side is their problem and their audit; everything on my side — data, identities, configurations, workloads — has a named owner in my organization or it is unowned.\n\n**Misconfiguration, not exotic attack, is how cloud estates get breached.** The public-bucket, open-security-group, over-permissive-role genre of incident requires no zero-day and no adversary sophistication — just one console change nobody reviewed. That is why the record leads its threat model with misconfiguration and answers it structurally: automated configuration monitoring watching continuously, because point-in-time audits cannot keep pace with an estate that changes hourly; and least privilege as the default posture, because the cost of an over-permissive role is invisible until the day it is catastrophic.\n\n**Infrastructure as code turns security review into code review.** A console change is invisible, unreviewed, and unreproducible; the same change as code in source control is a diff with an approver, a history, and a rollback. Putting security checks into the CI/CD pipeline compounds the effect — misconfigurations get caught before deployment, by machinery, rather than after deployment, by incident. This is the single highest-leverage commitment in the record: it converts the leading cloud risk into an ordinary engineering workflow.\n\n![Diagram contrasting an unreviewed console change going straight to the cloud with an infrastructure-as-code path through source control, code review, and pipeline security checks.](assets/images/cloud-infrastructure/iac-review-pipeline.jpeg)\n**Figure 2:** *A console change is invisible and unreproducible; the same change as code is a diff with an approver, a history, and security checks that catch misconfiguration before deployment.*\n\n**In the cloud, identity is the perimeter.** There is no building, no badge reader, and no firewall between the internet and a leaked root credential — which is why MFA on root and administrator accounts is non-negotiable and extended to everyone where possible, why identity is centralized behind SSO, and why access is removed *immediately* on departure, not at the next quarterly review. The same logic drives the secrets discipline: a token in a repository is a credential published to whoever reads the repository, so repositories are scanned, secrets live in a dedicated service, rotation is routine, and — because prevention fails — an exposed-credential response process exists before the exposure.\n\n**The cloud does not repeal the old disciplines; it accelerates the penalty for skipping them.** Inventory, patching, vulnerability scanning, backups, encryption, logging — none of this is cloud-native wisdom; it is the same hygiene the rest of this journal demands, carried into an environment where a forgotten asset is a public asset and drift happens at API speed. The frameworks the chapter names — CIS Controls, NIST CSF — matter here for the same reason: they keep the hygiene program shaped by an external standard rather than by whatever the team remembered.\n\n**Architecture choices are security choices.** Established patterns, tiering, and segmentation are not aesthetics — they decide whether an internal tier is reachable from the internet and whether one compromised component means one compromised system. The record's microservices and event-driven clauses cut both ways deliberately: those styles buy isolation and independent scaling, and they multiply the surfaces — inter-service communication, producers, consumers, channels — that must each be secured. The provider Well-Architected frameworks earn their place because they institutionalize the review: security evaluated alongside reliability, performance, operations, and cost, and *reassessed* as workloads and threats change, because an architecture reviewed once is an architecture aging silently.\n\n**An untested alert is not detection — it is decoration.** The gap between \"GuardDuty is enabled\" and \"a finding reaches a human who acts\" is exactly where detection programs die: the unconfirmed subscription, the misrouted rule, the mailbox nobody reads. The chapter's GuardDuty exercise is the discipline in miniature — build the pipe (GuardDuty → EventBridge → SNS), then *generate sample findings* and watch the email arrive. The principle generalizes past AWS: every alert the organization plans to rely on gets fired deliberately, end to end, before the day it fires for real.\n\n![Detection pipeline from findings through event routing to a notification inbox, with a test loop firing a sample finding and verifying the notification arrives.](assets/images/cloud-infrastructure/alert-tested-end-to-end.jpeg)\n**Figure 3:** *An untested alert is decoration: build the pipe, fire a sample finding through it, and watch the notification arrive — end to end, before the day it matters.*\n\n**Compliance is the floor, because auditors certify the past and attackers work in the present.** A compliant estate is one that met a defined bar on the day of assessment; threats, workloads, and configurations all move faster than certification cycles. The record adopts the chapter's closing rule as its own frame: treat compliance as the baseline the program must never fall below — and never mistake it for the program.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Responsibility is explicit per service model: the provider secures the cloud, we secure data, identities, configurations, and workloads. | The provider handles security — \"managed\" moves the host, never the accountability for what we deploy. |\n| Configurations are monitored continuously by automated tooling. | An annual audit is enough — the estate changes hourly; point-in-time checks certify the past. |\n| Infrastructure changes go through code, source control, review, and pipeline security checks. | Console changes are fine if careful — an unreviewed change is a misconfiguration awaiting its incident. |\n| MFA on root and admin accounts, extended to all users where possible; access removed immediately on departure. | MFA is for the security team — the leaked admin credential is the whole perimeter. |\n| IAM is role-based least privilege, reviewed, with alerts on unexpected escalation. | Broad roles are acceptable to keep teams moving — the cost is invisible until it is catastrophic. |\n| Backups exist and restoration is tested; DR is planned; hygiene follows CIS Controls or NIST CSF. | Cloud durability replaces backups — replication faithfully replicates the deletion too. |\n| Alerts are tested end to end — sample findings generated, notification verified — before being relied on. | Enabling the detection service is detection — an unfired alert is a hypothesis. |\n| Compliance is the baseline the program never falls below. | Passing the audit is the goal — auditors certify the past; attackers work in the present. |\n\nConcretely: every cloud account in my organization has automated configuration monitoring on, MFA on root, infrastructure changes flowing through reviewed code, and a detection pipeline that has fired on a test — and the first audit question is *\"show me the sample finding arriving, not the service being enabled.\"*\n\n## Anti-Patterns\n\n- **The responsibility gap.** \"We assumed the provider handled that\" — the control that belonged to nobody, discovered in the postmortem.\n- **ClickOps drift.** An estate shaped by years of console changes nobody reviewed — unreproducible, unauditable, and different from what the IaC says.\n- **The wildcard role.** Permissions granted with a `*` to unblock a sprint, never revisited — the compromised service account that could do everything.\n- **Root without MFA.** The most powerful credential in the estate protected by a password alone — the whole perimeter, one phish wide.\n- **The token in the repo.** An API key committed \"temporarily\" to a private repository — private is one fork, one leak, one contractor away from public.\n- **The departed contractor's key.** Access that outlived the engagement because offboarding runs quarterly — a live credential in nobody's hands officially, somebody's actually.\n- **The alert nobody tested.** GuardDuty enabled, notifications never verified — the finding fires on breach day and lands in an unconfirmed subscription.\n- **Compliance as finish line.** The estate that passes the audit and stops there — certified against last year's bar, exposed to this year's attacker.\n\n## Related Records\n\n- [Databases](databases.html) — the data layer this estate hosts; cloud databases are held to that record's same-bar-as-on-premises rule.\n- [Authentication](authentication.html) — the organization-wide identity model behind this record's MFA, SSO, and centralized-identity commitments.\n- [Network Segmentation](network-segmentation.html) — the design discipline behind this record's tiering, ACLs, and never-expose-internal-tiers rule.\n- [Logging and Monitoring](logging-and-monitoring.html) — the SIEM pipeline this record's cloud logs and alerts centralize into.\n- [Vulnerability Management](vulnerability-management.html) — the continuous scanning this record requires, as an organization-wide loop.\n- [Incident Response](incident-response.html) — the plan the cloud-specific response procedures written here plug into.\n- [Industry Compliance Standards and Frameworks](compliance.html) — the baseline this record's closing rule positions the whole program above.\n\n## Scope and Revisiting\n\nThis record is `draft`. It applies to every cloud account, subscription, and project my organization operates, across providers, and as the audit bar for the existing estate. I revisit it if the provider mix or service-model mix shifts materially (each shift moves the responsibility line), if an audit finds infrastructure changing outside the code path (the IaC claim failing in practice), or if an alert that was never test-fired is found carrying production reliance — that is the record's central discipline failing silently.\n\n## Authoritative References\n\n- *Defensive Security Handbook*, 2nd edition — Lee Brotherston, Amanda Berlin, and William F. Reyor III (O'Reilly) — the Cloud Infrastructure chapter, whose checklist (including the AWS GuardDuty exercise and the final security review) this record distills.\n- CIS Controls — named by the chapter as a recognized security framework for cloud hygiene.\n- NIST Cybersecurity Framework — named by the chapter as a recognized security framework for cloud hygiene.\n- AWS Well-Architected Framework, Microsoft Azure Well-Architected Framework, and Google Cloud Architecture Framework — the provider architecture frameworks the chapter directs reviews toward.\n"}]}, {"key": "summary", "label": "TL;DR", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "The provider secures the cloud; my organization secures what it puts in the cloud — **the data, the identities, the configurations, and the workloads**. That split is a contract read correctly for every service model, and the rest follows: misconfiguration treated as the leading cloud risk, identity treated as the perimeter, infrastructure changed only through reviewed code, the old hygiene disciplines carried into the cloud undiminished, and no alert trusted until it has fired on a test. The closing rule: compliance is the baseline of the program, never the end of it.\n\n**What changes**\n\n* **Responsibility becomes explicit per service model.** SaaS, PaaS, and IaaS each split differently between provider and customer; the shared responsibility model is reviewed for AWS, Azure, and GCP, and everything on our side of the line gets a named owner.\n* **Misconfiguration gets structural answers.** Continuous automated configuration monitoring — AWS Config, Azure Policy/Defender for Cloud, or Google Security Command Center as the worked examples — least privilege as the default posture, and infrastructure as code in source control, behind code review, with security checks in the CI/CD pipelines.\n* **Identity becomes the perimeter.** MFA on root and administrator accounts and extended broadly, centralized identity and SSO, access removed the day someone leaves, no secrets in source code, repositories scanned, a dedicated secrets service with regular rotation, and a response process for exposed credentials.\n* **IAM tightens to least-privilege RBAC.** Roles scoped to job function, permissions reviewed regularly, unused privileges removed, and unexpected privilege escalation raising an alert, not a retrospective.\n* **Hygiene and architecture stay disciplined.** Inventory, patching, continuous vulnerability scanning, backups with tested restoration, DR planning, encryption, secured network boundaries, and log collection under CIS Controls or NIST CSF; architecture built on established patterns, tiering, and segmentation, checked against the provider Well-Architected frameworks and reassessed as workloads change.\n* **Detection gets proven, not just enabled.** Alerts centralized in a SIEM, cloud incident-response procedures written, and every alert test-fired end to end — the GuardDuty exercise (GuardDuty → EventBridge → SNS, sample findings generated, email verified) is the worked example.\n\n**What it costs**\n\n* IaC-only changes and pipeline gates slow the first week and repay it every week after — console speed is how estates drift into unauditable shapes.\n* Configuration monitoring, permission reviews, rotation, and alert testing are standing work, not projects.\n* Reading the responsibility model per service takes real effort — assuming the provider covers it costs a postmortem.\n\n**What we are not doing**\n\n* Not mandating a provider — AWS, Azure, and GCP tools are the worked examples; the commitments are capability-level.\n* Not covering the data layer in depth — cloud databases are held to [Databases](databases.html).\n* Not building the identity model or the SIEM pipeline here — those are [Authentication](authentication.html) and [Logging and Monitoring](logging-and-monitoring.html).\n* Not treating the audit as the goal — compliance is the floor, per [Industry Compliance Standards and Frameworks](compliance.html).\n\n*The Article tab carries the rationale and anti-patterns; the Checklist tab carries the full working checklist, the GuardDuty exercise, and the final security review. Grounded in the Cloud Infrastructure chapter of the* Defensive Security Handbook *(Brotherston, Berlin, and Reyor).*\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record — cloud infrastructure security from the shared responsibility model to a tested detection pipeline, including the AWS GuardDuty exercise. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Cloud Service Models\n\n- [ ] Understand the differences between **SaaS, PaaS, and IaaS**\n- [ ] Identify what the **cloud provider** secures for each service model\n- [ ] Identify what the **customer** is responsible for securing\n- [ ] Review the **shared responsibility model** for AWS, Azure, and GCP\n- [ ] Remember: the provider generally secures the cloud infrastructure, while you secure your data, identities, configurations, and workloads\n\n## 2. Prevent Misconfigurations\n\n- [ ] Regularly audit cloud configurations\n- [ ] Use automated configuration-monitoring tools\n- [ ] Enable tools such as **AWS Config**, **Azure Policy/Defender for Cloud**, or **Google Security Command Center**\n- [ ] Follow the **principle of least privilege**\n- [ ] Avoid overly permissive IAM roles, storage permissions, and firewall rules\n- [ ] Use **Infrastructure as Code (IaC)** where possible\n- [ ] Store IaC in source control\n- [ ] Require code review before infrastructure changes are deployed\n- [ ] Add security checks to CI/CD pipelines\n\n## 3. Credentials and Secrets\n\n- [ ] Enforce strong password policies\n- [ ] Use a password manager or secure password vault\n- [ ] Enable **MFA**, especially for root and administrator accounts\n- [ ] Extend MFA to all user accounts where possible\n- [ ] Remove access immediately when employees or contractors leave\n- [ ] Use centralized identity management and SSO when possible\n- [ ] Never hardcode passwords, API keys, tokens, or other secrets in source code\n- [ ] Scan repositories for exposed secrets\n- [ ] Store secrets in a dedicated secrets-management service\n- [ ] Rotate secrets regularly\n- [ ] Establish a process for responding to exposed credentials\n\n## 4. IAM and Permissions\n\n- [ ] Grant users and services only the permissions required for their jobs\n- [ ] Regularly review user, group, service, and role permissions\n- [ ] Remove unused or excessive privileges\n- [ ] Use **role-based access control (RBAC)**\n- [ ] Scope roles according to job function\n- [ ] Monitor privileged permission changes\n- [ ] Alert on unexpected or unauthorized privilege escalation\n\n## 5. Security Hygiene\n\n- [ ] Maintain an inventory of cloud assets\n- [ ] Patch systems and applications regularly\n- [ ] Continuously scan for vulnerabilities\n- [ ] Back up critical data\n- [ ] Test backup restoration procedures\n- [ ] Maintain a disaster recovery plan\n- [ ] Encrypt sensitive data\n- [ ] Secure network boundaries with firewalls, VPNs, and appropriate access controls\n- [ ] Collect and retain security logs\n- [ ] Monitor logs for suspicious behavior\n- [ ] Use recognized security frameworks such as **CIS Controls** or **NIST CSF**\n\n## 6. Secure Architecture\n\n- [ ] Use established architecture patterns instead of designing everything from scratch\n- [ ] Separate application layers in a **three-tier architecture** where appropriate\n- [ ] Segment networks so internal tiers are not directly exposed to the internet\n- [ ] Apply strict network ACLs and security groups\n- [ ] Consider **microservices** when independent scaling and isolation are beneficial\n- [ ] Secure communication between microservices\n- [ ] Review dependencies and inherited risks in microservice environments\n- [ ] Consider **event-driven architecture** when appropriate\n- [ ] Apply security controls to event producers, consumers, and channels\n- [ ] Use provider reference architectures as a starting point\n\n## 7. Well-Architected Frameworks\n\n- [ ] Review the **AWS Well-Architected Framework**\n- [ ] Review the **Microsoft Azure Well-Architected Framework**\n- [ ] Review the **Google Cloud Architecture Framework**\n- [ ] Evaluate security alongside reliability, performance, operations, and cost\n- [ ] Reassess architecture as workloads and threats change\n\n## 8. Security Visibility and Monitoring\n\n- [ ] Enable visibility into the overall security posture\n- [ ] Monitor cloud environments for threats and vulnerabilities\n- [ ] Configure alerts for important security events\n- [ ] Centralize logs and alerts in a SIEM when possible\n- [ ] Create incident-response procedures for cloud security events\n- [ ] Test security alerts before relying on them in production\n\n## 9. AWS GuardDuty Exercise\n\n### Configure SNS Email Notifications\n\n- [ ] Sign in to the **Amazon SNS console**\n- [ ] Select **Topics**\n- [ ] Choose **Create topic**\n- [ ] Select **Standard** as the topic type\n- [ ] Name the topic `Guard_Duty_Notification`\n- [ ] Create the topic\n- [ ] Open **Subscriptions**\n- [ ] Choose **Create subscription**\n- [ ] Select the `Guard_Duty_Notification` topic ARN\n- [ ] Select **Email** as the protocol\n- [ ] Enter the email address that should receive alerts\n- [ ] Create the subscription\n- [ ] Open the confirmation email\n- [ ] Confirm the SNS subscription\n\n### Enable GuardDuty\n\n- [ ] Open the **AWS Management Console**\n- [ ] Navigate to **GuardDuty**\n- [ ] Enable GuardDuty if it is not already enabled\n- [ ] Review the permissions GuardDuty requires\n- [ ] Open **Settings**\n- [ ] Set the finding export/update frequency to approximately **15 minutes** if following the exercise\n\n### Configure EventBridge\n\n- [ ] Open the **Amazon EventBridge console**\n- [ ] Select **Rules**\n- [ ] Choose **Create rule**\n- [ ] Name the rule `Guard_Duty_Finding`\n- [ ] Use the **default event bus**\n- [ ] Enable the rule\n- [ ] Select **Rule with an event pattern**\n- [ ] Set the event source to **AWS services**\n- [ ] Select **GuardDuty** as the AWS service\n- [ ] Select **GuardDuty Finding** as the event type\n- [ ] Verify the event pattern includes `aws.guardduty`\n- [ ] Continue to **Target selection**\n- [ ] Select **AWS service** as the target type\n- [ ] Select **SNS topic** as the target\n- [ ] Choose `Guard_Duty_Notification`\n- [ ] Review the configuration\n- [ ] Create the EventBridge rule\n\n### Validate the Configuration\n\n- [ ] Return to the GuardDuty console\n- [ ] Navigate to **Settings**\n- [ ] Find **Sample findings**\n- [ ] Select **Generate sample findings**\n- [ ] Verify that sample GuardDuty findings appear\n- [ ] Check that notification emails are received\n- [ ] Open individual findings and review severity, affected resources, region, and timestamps\n- [ ] Confirm that the SNS/EventBridge notification workflow operates as expected\n\n## Final Security Review\n\n- [ ] Understand the shared responsibility model\n- [ ] Secure the cloud perimeter\n- [ ] Monitor continuously for misconfigurations\n- [ ] Use IAM securely\n- [ ] Maintain visibility into the security posture\n- [ ] Enforce cloud security policies\n- [ ] Encrypt sensitive data\n- [ ] Keep the security team trained on evolving cloud threats\n- [ ] Maintain logs and monitor for threats and vulnerabilities\n- [ ] Treat compliance as a baseline — not the end of the security program\n\nWith the final review green, the cloud estate meets the bar — responsibilities owned, configurations watched, identity fenced, and detection proven. The test running through the whole sequence: **has every alert you plan to rely on actually fired on a test — sample finding generated, notification received — before the day it fires for real?**\n"}]}, {"key": "dialog", "label": "Conversation", "meta": {"timetoread": "8 min listen"}, "blocks": [{"type": "markdown", "content": "## The Contract Everyone Misreads\n\n**Ben:** Let me open with the line every cloud vendor loves: the provider runs the most secure data centers on earth. If AWS's security budget dwarfs ours, what exactly is left for an internal record to govern?\n\n**Ana:** Everything the breach reports are actually about. The provider secures the cloud — the data centers, the hypervisors, the physical layer. We secure what we put *in* the cloud: our data, our identities, our configurations, our workloads. That is the shared responsibility model, and the record treats it as a contract to be read, not a slogan to be nodded at — read per service model, because the line moves. SaaS puts most of the stack on the provider; IaaS leaves most of it on us. Every postmortem that begins \"we assumed the provider handled that\" is a responsibility-model failure, and the control in question belonged to nobody.\n\n**Ben:** So the threat model. I'd expect it to start with attackers — instead the record's first entry is misconfiguration. Our own mistakes as the top threat?\n\n**Ana:** Because that is empirically how cloud estates get breached. The public bucket, the open security group, the wildcard IAM role — no zero-day required, no sophistication, just one console change nobody reviewed. And the record answers it structurally rather than exhortationally: automated configuration monitoring watching continuously — AWS Config, Azure Policy and Defender for Cloud, Google Security Command Center are the worked examples — because point-in-time audits cannot keep pace with an estate that changes hourly. An annual audit certifies the past; the misconfiguration happened Tuesday.\n\n**Ben:** And infrastructure as code. Engineers will say the console is faster, and they're right.\n\n**Ana:** They are right about the first week and wrong about every week after. A console change is invisible, unreviewed, and unreproducible. The same change as code in source control is a diff with an approver, a history, and a rollback — and with security checks in the CI/CD pipeline, misconfigurations get caught before deployment by machinery instead of after deployment by incident. It is the single highest-leverage commitment in the record: it converts the leading cloud risk into ordinary code review. The anti-pattern is ClickOps drift — an estate shaped by years of unreviewed console changes, different from what the IaC says and unauditable either way.\n\n## Identity Is the Perimeter\n\n**Ben:** The credentials section is long — MFA, SSO, vaults, repo scanning, rotation, an exposed-credential playbook. Isn't this just password hygiene with a cloud sticker on it?\n\n**Ana:** It is perimeter defense, because in the cloud identity *is* the perimeter. There is no building and no badge reader between the internet and a leaked root credential — the most powerful object in the estate is one phish wide if it has no MFA. So: MFA on root and administrator accounts, non-negotiable, extended to all users where possible; centralized identity and SSO so there is one place to enforce and one place to cut; and access removed *immediately* when someone leaves — not at the quarterly review. The departed contractor's key that outlived the engagement is a named anti-pattern for a reason: it is a live credential officially in nobody's hands, actually in somebody's.\n\n**Ben:** And the token committed to a private repo? Devs will say private means private.\n\n**Ana:** Private means one fork, one leak, one contractor away from public. A secret in source code is a credential published to everyone who will ever read that repository, which is why the record layers it: never hardcode, scan repositories for the secrets that get committed anyway, keep secrets in a dedicated service, rotate them routinely, and — because prevention fails — have a defined response process for the exposed credential *before* the exposure. The playbook you write during the incident is not a playbook.\n\n**Ben:** IAM next. Least privilege by role, reviews, escalation alerts. Teams will tell you broad roles are the price of moving fast.\n\n**Ana:** Broad roles are a loan against an incident. The cost of a wildcard permission is invisible until the service account carrying it is compromised — then it is the whole estate. The record's demands are mundane on purpose: RBAC scoped to job function, regular reviews that actually remove unused privileges, monitoring of privileged permission changes, and an *alert* on unexpected escalation — not a line item discovered in the next audit. Escalation is the attacker's second move; detecting it in real time is the difference between an account reset and a breach report.\n\n## Old Disciplines, New Speed\n\n**Ben:** The hygiene section could be pasted from any pre-cloud handbook — inventory, patching, scanning, backups, encryption, logs. Did the chapter run out of cloud material?\n\n**Ana:** It made the opposite point: the cloud repeals none of it and accelerates the penalty for skipping it. A forgotten server in a data center sits behind a firewall; a forgotten asset in the cloud is often a public asset. And one of these gets skipped with special confidence — backups. Cloud durability is not a backup: replication faithfully replicates the deletion, the ransomware, and the bad migration. So critical data is backed up and restoration is *tested*, with a real DR plan behind it. The frameworks the chapter names — CIS Controls, NIST CSF — keep the hygiene program shaped by an external standard instead of by what the team happened to remember.\n\n**Ben:** Then architecture. Three-tier, segmentation, ACLs — but also microservices and event-driven. That reads like the record endorses every architecture at once.\n\n**Ana:** It endorses *deliberateness*, cutting both ways. Established patterns over designed-from-scratch, tiers separated, internal tiers never directly internet-exposed, strict ACLs and security groups — those are constants. Microservices and event-driven are conditional: use them where isolation and independent scaling actually pay, and price in what they multiply — inter-service communication to secure, dependencies to review, producers, consumers, and channels each needing controls. Provider reference architectures are the starting point, and the Well-Architected frameworks — AWS, Azure, Google Cloud — institutionalize the review, with one verb doing the work: *reassess* as workloads and threats change. An architecture reviewed once is an architecture aging silently.\n\n## Fire the Alert Before the Attacker Does\n\n**Ben:** The chapter spends pages on a GuardDuty exercise — SNS topics, EventBridge rules, sample findings. Console-clicking, in an executive record. Why keep it?\n\n**Ana:** Because it is the record's central discipline in miniature. The gap between \"GuardDuty is enabled\" and \"a finding reaches a human who acts\" is exactly where detection programs die — the unconfirmed subscription, the misrouted rule, the mailbox nobody reads. The exercise builds the pipe — GuardDuty findings through EventBridge to an SNS email — then *generates sample findings* and verifies the notification arrives, end to end. That last step is the whole point, and it generalizes past AWS: every alert the organization plans to rely on gets fired deliberately before the day it fires for real. An untested alert is not detection; it is decoration.\n\n**Ben:** And the record ends on compliance — specifically, that passing the audit isn't the goal. Bold line for an executive journal that also has a compliance record.\n\n**Ana:** The two records agree, and the chapter's closing rule is the frame: compliance is a baseline, not the end of the security program. Auditors certify the past — the estate as it stood on assessment day, against a bar written earlier still. Attackers work in the present, against the estate as it is now. So the program treats the audit as the floor it never falls below, and everything in this record — continuous configuration monitoring, tested alerts, reassessed architecture — is what living above the floor looks like. The anti-pattern is compliance as finish line: certified against last year's bar, exposed to this year's attacker.\n\n**Ben:** Then here's my concession. The cloud didn't shrink our security job — it moved it. Off the hardware, onto the data, the identities, the configurations, and the workloads — and the bar is: own your side of the contract, change infrastructure only through reviewed code, and never trust an alert you haven't fired yourself.\n\n**Ana:** That is the record. The provider secures the cloud; we secure what we put in it — and before we rely on any alarm, we pull the test handle and watch the email arrive.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why the provider secures the cloud while we secure what we put in it — in nine panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NADIA: a hands-on defensive-security lead, shoulder-length dark hair tied back, navy utility jacket over a plain shirt, an access badge on a lanyard, laptop with a padlock sticker under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and green accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: a provider crew and an office team point at each other across a bridge gap labeled security while a suitcase labeled our data falls through.](assets/images/cloud-infrastructure/comic-01-we-assumed-they-handled-it.jpeg)\n**Panel 1:** *The hook: every postmortem that begins 'we assumed the provider handled that' is a responsibility-model failure — the control that belonged to nobody.*\n\n![Comic panel: papers flutter out of a bucket labeled public next to a wide-open gate signed 0.0.0.0/0 welcome while Nadia sprints over.](assets/images/cloud-infrastructure/comic-02-the-open-bucket.jpeg)\n**Panel 2:** *The problem: the public bucket and the open security group — cloud estates get breached by one unreviewed change, not exotic attacks; misconfiguration leads the threat model.*\n\n![Comic panel: console clicks sprout crooked pipes on a messy cloud estate that no longer matches the blueprint labeled what the code says.](assets/images/cloud-infrastructure/comic-03-clickops-drift.jpeg)\n**Panel 3:** *The wrong way: ClickOps drift — an estate shaped by years of unreviewed console changes is unreproducible, unauditable, and different from what the code says.*\n\n![Comic panel: a contract scroll with a dividing line — provider shielding the cloud below, and data, identities, configs, workloads on the customer side above.](assets/images/cloud-infrastructure/comic-04-the-contract-read-right.jpeg)\n**Panel 4:** *The principle: the shared responsibility model is a contract — the provider secures the cloud infrastructure; everything on our side — data, identities, configurations, workloads — has a named owner or it is unowned.*\n\n![Comic panel: a code diff rides a conveyor through source control, code review, and security check stamps toward the cloud while a console shortcut chute is barred.](assets/images/cloud-infrastructure/comic-05-infrastructure-as-a-diff.jpeg)\n**Panel 5:** *Practice: infrastructure is code — every change is a diff with an approver, a history, and pipeline security checks, so misconfiguration is caught before deployment, by machinery.*\n\n![Comic panel: a lone key labeled root with an MFA double lock floats between the internet and the cloud estate, while a departing employee's key dissolves.](assets/images/cloud-infrastructure/comic-06-identity-is-the-perimeter.jpeg)\n**Panel 6:** *Practice: identity is the perimeter — MFA on root and every administrator, centralized SSO, and access that dies the day someone leaves, not at the next quarterly review.*\n\n![Comic panel: a developer hides a key in a library book labeled repository while a scanner robot moves it to a secrets vault with a rotation dial.](assets/images/cloud-infrastructure/comic-07-the-token-in-the-repo.jpeg)\n**Panel 7:** *Practice: no secret ever lands in source code — repositories are scanned, secrets live in a dedicated service, rotation is routine, and an exposure response process exists before the exposure.*\n\n![Comic panel: a detection pipe ends mid-air over an unread mailbox on one side; on the other Nadia's sample finding travels the pipe to a verified email.](assets/images/cloud-infrastructure/comic-08-the-alert-nobody-tested.jpeg)\n**Panel 8:** *The cost: 'GuardDuty enabled' is not detection — build the pipe, generate a sample finding, and watch the notification arrive end to end, before the day it fires for real.*\n\n![Comic panel: an auditor stays on a slab labeled compliance with last year's certificate while Vera and Nadia climb higher steps toward the present-day threat.](assets/images/cloud-infrastructure/comic-09-compliance-is-the-floor.jpeg)\n**Panel 9:** *The closer: auditors certify the past; attackers work in the present — compliance is the baseline the program never falls below, and never the program itself.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    const aligns = splitRow(lines[i + 1]).map(function (c) {
                        c = c.trim();
                        const left = c.startsWith(':'), right = c.endsWith(':');
                        return left && right ? 'center' : right ? 'num' : '';
                    });
                    const cellOpen = function (tag, idx) {
                        return aligns[idx] ? '<' + tag + ' class="' + aligns[idx] + '">' : '<' + tag + '>';
                    };
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach((h, idx) => {
                        html += cellOpen('th', idx) + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach((c, idx) => {
                            html += cellOpen('td', idx) + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
            markScrollableTables(host);
        }

        // A table wider than its wrapper scrolls sideways. Mark those wrappers
        // so the CSS can show a cue, and make them focusable so keyboard users
        // can reach and scroll them. Hidden panes measure 0 and are re-marked
        // when activated or when the window is resized.
        function markScrollableTables(host) {
            host.querySelectorAll('.table-wrap').forEach(function (wrap) {
                const scrolls = wrap.scrollWidth > wrap.clientWidth + 1;
                wrap.classList.toggle('is-scrollable', scrolls);
                if (scrolls) {
                    wrap.setAttribute('tabindex', '0');
                    wrap.setAttribute('role', 'region');
                    wrap.setAttribute('aria-label', 'Table that scrolls sideways');
                } else {
                    wrap.removeAttribute('tabindex');
                    wrap.removeAttribute('role');
                    wrap.removeAttribute('aria-label');
                }
            });
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        // With several modalities each pane is a tabpanel labelled by its
        // tab (W3C APG tabs pattern); tabindex=0 lets keyboard users move
        // from the tab list straight into the active content.
        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            if (mods.length > 1) {
                pane.id = 'pane-' + m.key;
                pane.setAttribute('role', 'tabpanel');
                pane.setAttribute('aria-labelledby', 'tab-' + m.key);
                pane.setAttribute('tabindex', '0');
            }
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                    // Roving tabindex: only the selected tab is in the Tab
                    // order; the arrow keys move between tabs.
                    tabButtons[m.key].setAttribute('tabindex', isActive ? '0' : '-1');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            } else {
                markScrollableTables(panes[key]);
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.id = 'tab-' + m.key;
                btn.dataset.key = m.key;
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-controls', 'pane-' + m.key);
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            // Keyboard support per the W3C APG tabs pattern (automatic
            // activation): Left/Right move between tabs and wrap, Home/End
            // jump to the first/last tab, and the focused tab is selected.
            tabBar.addEventListener('keydown', function (ev) {
                const keys = mods.map(function (m) { return m.key; });
                const focused = document.activeElement;
                const current = focused && focused.dataset ? keys.indexOf(focused.dataset.key) : -1;
                if (current < 0) return;
                let next = null;
                if (ev.key === 'ArrowRight') next = (current + 1) % keys.length;
                else if (ev.key === 'ArrowLeft') next = (current - 1 + keys.length) % keys.length;
                else if (ev.key === 'Home') next = 0;
                else if (ev.key === 'End') next = keys.length - 1;
                if (next === null) return;
                ev.preventDefault();
                activate(keys[next], true);
                tabButtons[keys[next]].focus();
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
        window.addEventListener('resize', function () { markScrollableTables(root); });
    })();
</script>
</body>
</html>
