<script id="data" type="application/json">{"meta": {"id": "SEC-STANDARDS-AND-PROCEDURES", "status": "draft:gray", "title": "Standards and Procedures", "date": "2026-08-22", "author": "Željko Obrenović", "permalink": "standards-and-procedures", "timetoread": "7 min", "excerpt": "In my organization, security documentation is a hierarchy with a division of labor: policy explains why, standards define what, procedures identify who, when, and where, and work instructions explain how. Standards speak in mandatory language — must, shall, will — and are specific enough to implement consistently; requirements are written once and referenced everywhere; procedures are written for the people who run them, not the people who wrote them. Every document carries its contract — version, owner, approver, purpose, scope, requirements, related documents — and lives in one approved repository where the authoritative version is unambiguous. The test I hold the documentation to: a new employee can find the authoritative document and apply it correctly without asking anyone.", "tags": "security documentation, standards, procedures, policies, governance, knowledge management, audit readiness, security program", "icon": "assets/icons/standards-and-procedures.png", "logo": "assets/images/standards-and-procedures/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["security documentation", "standards", "procedures", "policies", "governance", "knowledge management", "audit readiness", "security program"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: My security documentation is a hierarchy with a division of labor, not a pile of documents. **Policy explains why, standards define what, procedures identify who, when, and where, and work instructions explain how** — each document sits at its correct level and links to its neighbors. **Standards speak in mandatory language** — must, shall, will — and are specific enough to be implemented consistently; ambiguous words like *should* and *try* are banned where a requirement is mandatory. **Requirements are written once and referenced everywhere**, so a change is made centrally, not hunted across ten documents. **Procedures are written for their readers** — ordered steps, active voice, verified assumptions, real commands — and reviewed by people who understand both the technology and the audience. **Every document carries its contract**: version, owner, approver, purpose, scope, requirements, and related documents, stored in one approved repository where the authoritative version is unambiguous. The test I hold the whole layer to: **a new employee can find the authoritative document and apply it correctly without asking anyone**.\n\n## Statement\n\nWhen my organization writes the documentation that implements its security policies, this is the bar it is held to.\n\n**The hierarchy is explicit, and every document knows its level.**\n\n- **Policy explains why** the organization requires the control or rule; **standards define what** requirements must be followed; **procedures identify who performs activities, when, and where**; **work instructions, guidelines, and SOPs explain how** specific tasks are performed.\n- Each document is placed at the correct level of the hierarchy, and related policies, standards, procedures, and work instructions are clearly linked.\n\n![Four-layer documentation hierarchy — policy, standards, procedures, work instructions — linked level to level, each changing at its own speed.](assets/images/standards-and-procedures/documentation-hierarchy.jpeg)\n**Figure 1:** *The hierarchy is a division of labor: policy explains why, standards define what, procedures identify who, when, and where, and work instructions explain how — each layer changing at its own pace.*\n\n\n**Standards are mandatory, specific, and non-duplicative.**\n\n- Standards provide technology-specific requirements without unnecessary procedural detail, and they support and expand on the policies above them.\n- **Requirements use mandatory language** — must, shall, will. Ambiguous wording — should, try, mostly — is avoided wherever a requirement is mandatory, and every requirement is specific enough to be implemented consistently.\n- **Common requirements are documented once** and referenced by the policies that need them; standards are maintained separately where that improves usability, so a change is made centrally without touching multiple policies. Standards are reviewed regularly for technical accuracy.\n\n**Procedures are executable by their intended audience.**\n\n- Procedures explain how standards are implemented on specific technologies, with enough detail for the intended audience to complete the task consistently — including platform-specific variants where technologies differ.\n- Steps are listed in execution order, in the active voice, with clear wording; **assumptions and prerequisites are stated explicitly and verified as valid**; commands, settings, and examples are included where needed; and procedures allow appropriate judgment where overly prescriptive instructions would be impractical.\n- Procedures are reviewed by people who understand both the technology and the intended audience.\n\n**Documentation replaces tribal knowledge.**\n\n- Standards and procedures make policy implementation consistent across teams and systems, reduce reliance on institutional or legacy knowledge, and let employees find what they need without relying on specific individuals.\n- Documentation is understandable to new employees and to people outside the authoring team, and repetition between policies, standards, and procedures is minimized.\n\n**Documentation stands up to regulators and management.**\n\n- Applicable laws, regulations, contractual requirements, and compliance frameworks are identified, and the policies, standards, and procedures that support those obligations exist and can be produced readily during an audit.\n- Standards and procedures carry management endorsement; required approvals are documented, demonstrating that responsible management has accepted the requirements.\n\n**Every document carries its contract.**\n\n- **Version information**: version number, effective date, revision history — current and obsolete versions clearly distinguishable.\n- **Owner and approver**: identified, with approval formally recorded and responsibility for future review clear.\n- **Purpose, scope, and requirements**: a concise overview, an unambiguous scope with explicit exclusions, and clearly identified, objectively applicable requirements that reflect the current environment.\n- **Related documents**: applicable policies, standards, procedures, and regulatory references, kept current when neighbors change.\n- **Naming and storage**: consistent naming conventions and terminology, one approved and accessible repository, an unambiguous authoritative version, superseded documents archived, and access permissions matched to the intended audience.\n\n**Nothing is published without a quality review.**\n\n- Before release, every document is checked for readability at the readers' skill level, for conflicts with higher-level policy, for correct implementation down the hierarchy, and for validated technical content — then reviewed by subject-matter experts, formally approved, given a review date, and published and communicated to the people it applies to.\n\n## How to Read This\n\nThis record sits in **The Security Program** section of the journal — the documentation layer between [Policies: What Must Be Achieved, in Writing](policies.html), which state why, and the operational records that put controls on real systems. It is grounded in the Standards and Procedures chapter of the *Defensive Security Handbook* (Brotherston, Berlin, and Reyor), which treats standards and procedures as the machinery that makes policy real. The full working checklist — hierarchy, standards, procedures, document contents, and the final quality review — lives in the **Checklist** tab; the management summary is in the **TL;DR** tab and the conversation in the **Conversation** tab.\n\n## Rationale\n\n**The hierarchy is a division of labor, not bureaucracy.** Why, what, who-when-where, and how change at different speeds. The reasons my organization encrypts customer data are stable for years; the approved cipher suites change with the threat landscape; the commands to configure them change with every platform version. Separating the levels means each document changes at its own pace without dragging the others through re-approval — and it means a reader looking for a command is never forced to wade through a philosophy, or the reverse.\n\n**Mandatory language is a control; ambiguity is an exemption.** The moment a standard says *should*, every reader is licensed to decide it does not apply to them today. *Must*, *shall*, and *will* leave nothing to negotiate, which is exactly what a requirement is for. The same logic drives the specificity rule: a requirement that two competent engineers can implement two different ways is not a requirement, it is a suggestion wearing a checkbox.\n\n**Write once, reference everywhere — or every change becomes a search party.** When a password requirement lives in ten policies, updating it means finding all ten, and the one you miss becomes the contradiction an auditor finds and an engineer follows. Documenting common requirements once, in a standard that the policies reference, turns a fleet-wide change into a single reviewed edit. That is also why standards are maintained separately when doing so improves maintainability: the structure exists to make change cheap, not to make binders thick.\n\n![Comparison diagram: a requirement duplicated across documents drifts into contradiction, while one referenced central standard updates everywhere with a single edit.](assets/images/standards-and-procedures/write-once-reference-everywhere.jpeg)\n**Figure 2:** *Write once, reference everywhere: a requirement duplicated across ten documents becomes the contradiction an auditor finds — one referenced standard makes a fleet-wide change a single reviewed edit.*\n\n**A procedure is written for its reader, not its author.** The author already knows the assumptions, the prerequisite state, and the recovery path — the reader at 2 a.m. does not. Ordered steps, active voice, explicit and *verified* assumptions, and real commands are what make a procedure executable by the person who actually holds the pager. And because no procedure can anticipate everything, the record deliberately allows judgment where prescription would be impractical: a procedure that tries to script the unscriptable gets ignored in full, including the parts that mattered.\n\n**Documentation is the exit from key-person risk.** Every answer that lives only in a senior engineer's head is an outage waiting for their holiday and a crisis waiting for their resignation. The chapter's consistency section is really a resilience requirement: when employees can locate the information they need without relying on specific individuals, the organization has converted personal knowledge into institutional capability. That conversion is the difference between a security program and a set of talented individuals.\n\n![Diagram of questions bottlenecked through a single knowledge holder versus answered directly from a shared documentation repository.](assets/images/standards-and-procedures/tribal-knowledge-exit.jpeg)\n**Figure 3:** *Documentation is the exit from key-person risk: answers move out of individual heads into a repository every reader can reach without asking anyone.*\n\n**Audit-readiness is a by-product of hygiene, not a project.** When every document carries its version, owner, approver, scope, and recorded management endorsement, an audit is a retrieval exercise. When they do not, an audit is archaeology performed under deadline — and the reconstruction costs more than the discipline ever would. The same contract that satisfies an auditor serves the everyday reader: the owner field is who you send questions to; the effective date is how you know the document is alive.\n\n**An unowned document is already obsolete.** Documents rot silently — the platform version moves, the team renames, the requirement quietly stops reflecting the environment. The only known countermeasure is a named owner, a review date, and the final quality review that refuses to publish without them. A repository where the authoritative version is unambiguous and superseded versions are archived closes the last gap: nothing undermines documentation faster than two versions that both look current.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Policy says why, standards say what, procedures say who/when/where, work instructions say how. | Every control needs all four documents — small scopes collapse levels deliberately, not accidentally. |\n| Standards use must/shall/will; ambiguous wording is banned where a requirement is mandatory. | Everything is mandatory — genuine guidance may say *should*, as long as it is labeled guidance. |\n| Common requirements are documented once and referenced by the policies that need them. | Readers are sent on link chases — the reference points to one authoritative home, not a maze. |\n| Procedures carry ordered steps, verified assumptions, and real commands. | Procedures script away all judgment — where prescription is impractical, judgment is explicit. |\n| Every document has a version, owner, approver, purpose, scope, and related-document links. | The metadata is ceremony — the owner answers questions and the review date keeps the document alive. |\n| Documents live in one approved repository with an unambiguous authoritative version. | Teams cannot keep working copies — drafts exist, but only one version is authoritative. |\n| Nothing is published without SME review, recorded approval, and a review date. | Publication is slow forever — the quality gate is a checklist, not a committee season. |\n\nConcretely: every new standard or procedure in my organization goes through the final quality review before publication, and the first review question is *\"could a new employee find this document and apply it correctly without asking anyone?\"* A document that fails that question is not finished, no matter how technically correct it is.\n\n## Anti-Patterns\n\n- **The everything policy.** One giant document carrying the whys, the whats, and the command lines — impossible to approve quickly, impossible to change safely, obsolete at three different speeds simultaneously.\n- **The aspirational should.** A \"requirement\" written as *should* or *try to* — every reader is licensed to defer it, and the control exists only on paper.\n- **The copy-paste standard.** The same requirement duplicated across ten documents; the update misses one, and the contradiction ships to the auditor and the engineer alike.\n- **The author-only procedure.** Steps that make sense only to the person who wrote them — unstated assumptions, missing prerequisites, jargon the on-call reader has never seen.\n- **Tribal knowledge with a wiki skin.** The documents exist, but the real answers still live in three people's heads and a chat archive; the wiki is a monument, not a tool.\n- **The orphaned document.** No owner, no review date, no one responsible for accuracy — quietly wrong for two years and still being followed.\n- **Two authoritative versions.** The repository and the shared drive disagree, and half the organization is diligently complying with the obsolete one.\n- **The audit scramble.** Approvals reconstructed, owners guessed, and versions backdated the week before the audit — paying archaeology prices for hygiene work.\n\n## Related Records\n\n- [Policies: What Must Be Achieved, in Writing](policies.html) — the why-layer this record implements; standards and procedures expand policy into actionable requirements.\n- [Creating a Security Program: Risk Before Tools](security-program.html) — the program that commissions this documentation layer and gives it management endorsement.\n- [Industry Compliance Standards and Frameworks](compliance.html) — the external obligations the documentation must be able to face; that record decides which regulations and frameworks apply.\n- [Security Education](user-education.html) — teaching people to follow the documents; this record makes the documents followable.\n- [Incident Response](incident-response.html) — the discipline that depends hardest on procedures being executable by their reader under pressure.\n- [Asset Management and Documentation](asset-management.html) — documentation of what exists; this record governs documentation of what must be done.\n\n## Scope and Revisiting\n\nThis record is `draft`. It applies to every security policy, standard, procedure, and work instruction my organization writes, and as the audit bar for the documentation that already exists. I revisit it if audits or incidents reveal documents being bypassed because they cannot be found or followed (the findability test failing in practice), if the documentation hierarchy grows levels or ceremony that slow legitimate change (the structure must make change cheap, not expensive), or if a regulatory obligation demands document contents beyond the contract defined here.\n\n## Authoritative References\n\n- *Defensive Security Handbook*, 2nd edition (Lee Brotherston, Amanda Berlin, William F. Reyor III; O'Reilly) — the Standards and Procedures chapter, whose checklist (including the final quality review) this record distills.\n"}]}, {"key": "summary", "label": "TL;DR", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "Security documentation in my organization is a hierarchy with a division of labor: **policy explains why, standards define what, procedures identify who, when, and where, and work instructions explain how**. Standards speak in mandatory language and are specific enough to implement consistently; requirements are written once and referenced everywhere; procedures are written for their readers, not their authors; and every document carries a version, an owner, an approver, a purpose, a scope, and links to its neighbors. The test the whole layer is held to: a new employee can find the authoritative document and apply it correctly without asking anyone.\n\n**What changes**\n\n* **Every document gets a level.** The why/what/who-when-where/how separation is enforced, so each layer changes at its own speed — reasons stay stable while cipher suites and commands move — and related documents are explicitly linked.\n* **Requirements become requirements.** Must, shall, and will replace should, try, and mostly wherever a requirement is mandatory; anything two competent engineers could implement two different ways gets rewritten until it is specific enough to apply consistently.\n* **Duplication is engineered out.** Common requirements are documented once and referenced by the policies that need them, so a fleet-wide change is one reviewed edit instead of a search party across ten documents.\n* **Procedures are written for the 2 a.m. reader.** Ordered steps, active voice, explicitly stated and verified assumptions, real commands and examples — with judgment explicitly allowed where prescription would be impractical — and review by people who understand both the technology and the audience.\n* **Every document carries its contract.** Version information, owner, approver, purpose, scope with exclusions, clearly identified requirements, and related-document references; one approved repository where the authoritative version is unambiguous and superseded versions are archived; nothing published without SME review, recorded approval, and a next review date.\n\n**What it costs**\n\n* Authoring discipline up front: leveling, metadata, and the final quality review make writing a document slower than dumping knowledge into a wiki page.\n* Standing maintenance: owners, review dates, and cross-reference upkeep are recurring work, not a one-time cleanup.\n* Editorial friction: mandatory-language and specificity rules force arguments about what is actually required — arguments that were previously deferred to the reader.\n\n**What we are not doing**\n\n* Not writing four documents for every control — small scopes collapse levels deliberately, not accidentally.\n* Not deciding which external regulations apply — that is [Industry Compliance Standards and Frameworks](compliance.html); this record makes the documentation able to face them.\n* Not writing the why-layer — that is [Policies: What Must Be Achieved, in Writing](policies.html); and teaching people to follow the documents is [Security Education](user-education.html).\n\n*The Article tab carries the rationale and anti-patterns; the Checklist tab carries the full documentation-quality checklist, from hierarchy to the final quality review. Grounded in the Standards and Procedures chapter of the* Defensive Security Handbook*.*\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "5 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record — the documentation hierarchy, standards and procedure quality bars, required document contents, and the final quality review, from the Standards and Procedures chapter of the* Defensive Security Handbook*. The Article tab carries the rationale and anti-patterns.*\n\n## Documentation Hierarchy\n\n- [ ] **The policy** clearly explains **why** the organization requires the control or rule\n- [ ] **Standards/manuals** define **what** requirements must be followed\n- [ ] **Procedures** identify **who performs activities, when, and where**\n- [ ] **Work instructions, guidelines, and SOPs** explain **how** specific tasks are performed\n- [ ] Each document is placed at the correct level of the documentation hierarchy\n- [ ] Related policies, standards, procedures, and work instructions are clearly linked\n\n## Standards\n\n- [ ] Standards provide technology-specific requirements without unnecessary procedural detail\n- [ ] Standards support and expand upon applicable policy requirements\n- [ ] Requirements use clear, mandatory language such as **must**, **shall**, or **will**\n- [ ] Ambiguous wording such as **should**, **try**, or **mostly** is avoided where a requirement is mandatory\n- [ ] Requirements are specific enough to be consistently implemented\n- [ ] Standards avoid duplicating detailed information already maintained elsewhere\n- [ ] Common requirements are documented once and referenced by applicable policies\n- [ ] Standards are maintained separately where doing so improves usability and maintainability\n- [ ] Changes to standards can be made centrally without requiring unnecessary changes to multiple policies\n- [ ] Standards are reviewed regularly for technical accuracy\n\n## Procedures\n\n- [ ] Procedures explain how standards are implemented on specific technologies or platforms\n- [ ] Procedures contain enough detail for the intended audience to complete the task consistently\n- [ ] Platform-specific procedures are created where technologies require different implementation steps\n- [ ] Steps are listed in the order in which they must be performed\n- [ ] Instructions use the active voice\n- [ ] Grammar and wording are clear\n- [ ] Assumptions and prerequisites are explicitly stated\n- [ ] Assumptions are verified as valid\n- [ ] Instructions are concise and avoid unnecessary wording\n- [ ] Technical terminology and jargon are used only where appropriate\n- [ ] Commands, settings, configuration values, or examples are included where needed\n- [ ] Procedures allow appropriate judgment where overly prescriptive instructions would be impractical\n- [ ] Procedures are reviewed by people who understand both the technology and the intended audience\n\n## Consistency and Knowledge Distribution\n\n- [ ] Standards and procedures support consistent implementation of organizational policies\n- [ ] Requirements can be applied equally across relevant teams and systems\n- [ ] Documentation reduces reliance on institutional or legacy knowledge\n- [ ] Employees can locate the information they need without relying on specific individuals\n- [ ] Documentation is understandable to new employees and personnel outside the original authoring team\n- [ ] Documentation clearly communicates organizational expectations\n- [ ] Information is organized so users can quickly find the appropriate document\n- [ ] Repetition between policies, standards, and procedures is minimized\n\n## Regulatory and Management Requirements\n\n- [ ] Applicable laws, regulations, contractual requirements, and compliance frameworks have been identified\n- [ ] Required policies, standards, and procedures exist to support applicable compliance obligations\n- [ ] Relevant regulatory or legal references are included where appropriate\n- [ ] Documentation can be readily provided during an audit or compliance review\n- [ ] Standards and procedures have appropriate management endorsement\n- [ ] Required approvals are documented\n- [ ] Documentation demonstrates that responsible management has accepted the requirements\n\n## Required Document Contents\n\n### Version Information\n\n- [ ] Document version number is included\n- [ ] Effective date is included\n- [ ] Revision or update date is included where applicable\n- [ ] Current and obsolete versions can be clearly distinguished\n- [ ] A revision history is maintained where appropriate\n\n### Owner and Approver\n\n- [ ] Document owner is identified\n- [ ] Required approver or approving authority is identified\n- [ ] Approval has been formally recorded\n- [ ] Ownership information allows users to submit questions, feedback, or revision requests\n- [ ] Responsibility for future review and maintenance is clear\n\n### Purpose / Overview\n\n- [ ] The document contains a brief purpose or overview\n- [ ] The purpose explains what the document is intended to accomplish\n- [ ] The overview allows readers to quickly determine whether the document is relevant to them\n- [ ] The overview is concise and generally limited to a short paragraph where possible\n\n### Scope\n\n- [ ] The scope identifies who or what the document applies to\n- [ ] Applicable employees, contractors, departments, systems, applications, or technologies are identified\n- [ ] Any exclusions are clearly stated\n- [ ] Organizational or technical boundaries are unambiguous\n\n### Statements / Requirements\n\n- [ ] Requirements or procedural statements are clearly identified\n- [ ] Statements are concise and unambiguous\n- [ ] Requirements can be objectively understood and applied\n- [ ] Statements are reviewed regularly for accuracy\n- [ ] Technical requirements reflect the current environment\n- [ ] Obsolete instructions are removed or updated promptly\n\n### Related Documents\n\n- [ ] Applicable policies are referenced\n- [ ] Applicable standards are referenced\n- [ ] Applicable procedures, processes, work instructions, or SOPs are referenced\n- [ ] Related documents can be easily located\n- [ ] Applicable regulatory, legal, or compliance references are included where useful\n- [ ] Cross-references are kept current when related documents change\n\n## Naming and Organization\n\n- [ ] Consistent naming conventions are used for policies, standards, procedures, and supporting documents\n- [ ] Referenced systems, technologies, roles, and artifacts use consistent terminology\n- [ ] Document names clearly indicate their purpose\n- [ ] Documents are stored in an approved, accessible repository\n- [ ] Users can determine which document is authoritative\n- [ ] Superseded documents are archived or marked obsolete\n- [ ] Access permissions are appropriate for the intended audience\n\n## Final Quality Review\n\n- [ ] The document is written for the skill level of its intended readers\n- [ ] The document is easy to read and navigate\n- [ ] Language is simple, direct, and consistent\n- [ ] Requirements do not conflict with higher-level policies\n- [ ] Procedures correctly implement the applicable standards\n- [ ] Work instructions and SOPs correctly implement the applicable procedures\n- [ ] Technical information has been validated\n- [ ] The document has been reviewed by appropriate subject-matter experts\n- [ ] The document has received all required approvals\n- [ ] A review frequency or next review date has been established\n- [ ] The final approved version has been published and communicated to relevant users\n\nWith the final quality review green, the document is publishable — versioned, owned, approved, findable, and consistent with everything above and below it in the hierarchy. The test running through the whole checklist: **could a new employee find the authoritative document and apply it correctly without asking anyone?**\n"}]}, {"key": "dialog", "label": "Conversation", "meta": {"timetoread": "7 min listen"}, "blocks": [{"type": "markdown", "content": "## Why Documentation Deserves a Record\n\n**Ben:** Honest reaction first. This is a record about writing documents. Version numbers, owner fields, naming conventions. Why does an executive security operating model spend a whole record on paperwork?\n\n**Ana:** Because this layer is where policy either becomes real or becomes decoration. [Policies: What Must Be Achieved, in Writing](policies.html) can say \"customer data must be encrypted\" all it wants — until a standard names the approved algorithms and a procedure tells the engineer on shift how to configure them, that sentence protects nothing. The chapter's framing is a hierarchy with a division of labor: policy explains *why*, standards define *what*, procedures identify *who, when, and where*, and work instructions explain *how*. Four different questions, four different documents, four different speeds of change.\n\n**Ben:** That's the part that smells like bureaucracy. Four document types for one control? A ten-person company will drown in its own hierarchy.\n\n**Ana:** The record's commitment is that each document sits at the *correct* level — not that every control gets four documents. A small scope can collapse levels deliberately. What it forbids is collapsing them accidentally: the everything-policy that carries the whys, the whats, and the command lines in one giant file. That document is obsolete at three speeds simultaneously — the reasons last years, the requirements last months, the commands last one platform upgrade — and every tiny change drags the whole thing through re-approval.\n\n**Ben:** So the hierarchy is really a change-management structure.\n\n**Ana:** Exactly. Separate what changes slowly from what changes fast, and link them. The reader looking for a command never wades through philosophy, and the philosophy never gets re-approved because a flag name changed.\n\n## Must, Shall, Will\n\n**Ben:** Next objection: the language policing. Banning *should* and *try* — must, shall, will only. Isn't that pedantry? Engineers know what's expected.\n\n**Ana:** Do they? The moment a standard says *should*, every reader is licensed to decide it doesn't apply to them today. That's not a hypothetical — it's how controls quietly stop existing. *Must* leaves nothing to negotiate, which is what a requirement is for. And the record pairs it with a specificity rule: a requirement two competent engineers can implement two different ways isn't a requirement, it's a suggestion wearing a checkbox.\n\n**Ben:** But some things genuinely are guidance. Not everything can be mandatory.\n\n**Ana:** Agreed, and the record says so — genuine guidance may say *should*, as long as it's labeled guidance. The ban applies where a requirement is mandatory. The sin isn't the word; it's the ambiguity about which kind of statement you're reading.\n\n**Ben:** Fine. What about the write-once rule? Documenting a requirement once and referencing it everywhere sounds elegant until the reader has to chase links through five documents to answer one question.\n\n**Ana:** The alternative is worse, and we've all lived it: the password requirement pasted into ten policies, the update that catches nine of them, and the tenth becoming the contradiction the auditor finds and an engineer follows. Write-once turns a fleet-wide change into a single reviewed edit. The reference structure has a rule too — it points to one authoritative home, not a maze. If readers are chasing links, the structure failed; that's a defect, not the design.\n\n## Procedures for the 2 a.m. Reader\n\n**Ben:** The procedures section is oddly literary. Active voice, clear grammar, concise wording. Since when does a security book do style editing?\n\n**Ana:** Since procedures started being executed at 2 a.m. by someone who didn't write them. That's the design constraint behind every item: steps in execution order, assumptions stated *and verified*, real commands and examples included. The author already knows the prerequisite state and the recovery path — the on-call reader doesn't. A procedure is written for its reader, not its author, and everything on that list follows from that one sentence.\n\n**Ben:** Then explain the escape hatch. The record demands precision and then says procedures should \"allow appropriate judgment where overly prescriptive instructions would be impractical.\" Which is it?\n\n**Ana:** Both, on purpose. A procedure that tries to script the unscriptable gets ignored in full — including the parts that mattered. So you prescribe what can be prescribed and mark explicitly where judgment takes over. That honesty is what keeps the rest of the document credible. And note who reviews it: people who understand both the technology *and* the intended audience. A technically perfect procedure the audience can't follow fails review.\n\n**Ben:** There's a deeper claim hiding in this section though — the \"knowledge distribution\" business. Reducing reliance on institutional knowledge, finding information without relying on specific individuals.\n\n**Ana:** That's the real payload of the chapter, and it's a resilience requirement, not a writing tip. Every answer that lives only in a senior engineer's head is an outage waiting for their holiday and a crisis waiting for their resignation. When a new employee can locate and apply the authoritative document without asking anyone — that's the record's load-bearing test — the organization has converted personal knowledge into institutional capability. That's the difference between a security program and a collection of talented individuals.\n\n## Owners, Versions, and the Audit\n\n**Ben:** Last stretch: the document contract. Version numbers, effective dates, owners, approvers, scope, related documents. This is the part that reads like ISO cosplay. Who actually benefits?\n\n**Ana:** The everyday reader first, the auditor second. The owner field is who you send questions and revision requests to. The effective date and version history are how you know the document is alive and which version is current. The scope with explicit exclusions tells you in one paragraph whether the document applies to you at all. None of that is ceremony — each field answers a question a real reader has.\n\n**Ben:** And the audit part?\n\n**Ana:** Audit-readiness falls out as a by-product. With owners, recorded approvals, and versions in place, an audit is a retrieval exercise. Without them it's archaeology under deadline — approvals reconstructed, owners guessed, versions backdated the week before the assessor arrives. The record also insists on management endorsement being *documented*, because a standard nobody in authority has accepted isn't a requirement, it's a proposal.\n\n**Ben:** And the repository rule — one approved home, superseded versions archived?\n\n**Ana:** Because nothing kills documentation faster than two versions that both look current. Half the organization diligently complying with the obsolete one is worse than no document at all — they *believe* they're covered. One repository, one unambiguous authoritative version, obsolete ones archived and marked. And nothing ships without the final quality review: readability for the actual audience, no conflicts with higher-level policy, validated technical content, SME review, recorded approvals, and a next review date. An unowned document with no review date is already obsolete — it just hasn't noticed yet.\n\n**Ben:** Alright, here's my concession. This isn't a record about writing documents — it's a record about making the security program survive the people who built it. Policy becomes real through standards and procedures, requirements are written so they can't be negotiated or duplicated into contradiction, and the whole thing is held to one test: a new employee finds the authoritative document and applies it correctly without asking anyone.\n\n**Ana:** That's the record in one line. If they have to ask, the documentation layer failed — and if the answer lives in someone's head, so does the risk.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why security documentation is a hierarchy with a division of labor — and how it replaces tribal knowledge — in nine panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NADIA: a hands-on defensive-security lead, shoulder-length dark hair tied back, navy utility jacket over a plain shirt, an access badge on a lanyard, laptop with a padlock sticker under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and green accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: coworkers all point a new employee toward an empty chair with an out-of-office sign when asked how something works.](assets/images/standards-and-procedures/comic-01-ask-marcus.jpeg)\n**Panel 1:** *The hook: every answer that lives only in one engineer's head is an outage waiting for their holiday — and a crisis waiting for their resignation.*\n\n![Comic panel: an on-call engineer at 2 a.m. squints at dense cryptic notes with missing steps as question marks pile up.](assets/images/standards-and-procedures/comic-02-the-2am-reader.jpeg)\n**Panel 2:** *The problem: the author already knows the assumptions and the recovery path — the reader at 2 a.m. does not, and that is who the document is for.*\n\n![Comic panel: a monstrous document with layers labeled Why, What, and Commands crumbling at different speeds while Nadia props it up.](assets/images/standards-and-procedures/comic-03-the-everything-policy.jpeg)\n**Panel 3:** *The wrong way: the everything policy — whys, whats, and command lines in one document, impossible to change safely and obsolete at three different speeds simultaneously.*\n\n![Comic panel: a bookcase with four shelves labeled Policy why, Standards what, Procedures who when where, Work instructions how, with links between documents.](assets/images/standards-and-procedures/comic-04-four-shelves.jpeg)\n**Panel 4:** *The principle: a hierarchy with a division of labor — policy explains why, standards define what, procedures say who, when, and where, work instructions explain how.*\n\n![Comic panel: two engineers build different machines from one vague blueprint while Nadia holds a precise blueprint stamped Must.](assets/images/standards-and-procedures/comic-05-must-shall-will.jpeg)\n**Panel 5:** *Standards speak in must, shall, and will — a requirement that two competent engineers can implement two different ways is a suggestion wearing a checkbox.*\n\n![Comic panel: a search party hunts a rule through ten scattered documents versus one glowing standard linked by threads to ten policies.](assets/images/standards-and-procedures/comic-06-write-once-reference-everywhere.jpeg)\n**Panel 6:** *Requirements are written once and referenced everywhere — the copy you miss becomes the contradiction the auditor finds and the engineer follows.*\n\n![Comic panel: a calm on-call engineer follows a numbered procedure card with verified assumptions, a real command, and a use-judgment signpost.](assets/images/standards-and-procedures/comic-07-executable-by-the-reader.jpeg)\n**Panel 7:** *Procedures are executable by their reader: ordered steps, active voice, verified assumptions, real commands — and explicit judgment where prescription would be impractical.*\n\n![Comic panel: a document passes through a quality gate collecting stamps for readable, no conflicts, SME reviewed, and approved, with a version-block tag.](assets/images/standards-and-procedures/comic-08-the-quality-gate.jpeg)\n**Panel 8:** *Every document carries its contract — version, owner, approver, purpose, scope — and nothing is published without the quality review, an approval on record, and a review date.*\n\n![Comic panel: the new employee completes a task alone using the authoritative document while the once-indispensable engineer relaxes unneeded.](assets/images/standards-and-procedures/comic-09-without-asking-anyone.jpeg)\n**Panel 9:** *The closer: the test the whole layer is held to — a new employee can find the authoritative document and apply it correctly without asking anyone.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
