<script id="data" type="application/json">{"meta": {"id": "SEC-DISASTER-RECOVERY", "status": "draft:gray", "title": "Disaster Recovery", "date": "2026-08-22", "author": "Željko Obrenović", "permalink": "disaster-recovery", "timetoread": "8 min", "excerpt": "My organization's disaster recovery starts from the business, not from the backup tool. Every critical system carries a Recovery Point Objective and a Recovery Time Objective that business owners agreed to and someone priced; the recovery strategy — physical backups, warm standby, high availability, alternate systems, or cloud-native replication rebuilt through infrastructure-as-code — is chosen per system against those targets; dependencies are mapped so no application claims a recovery time its authentication service cannot meet; failover and failback have documented steps and named authority; and the plan is tested against real scenarios, without leaning on systems the disaster would have taken out, with security controls intact throughout — because a disaster is not an excuse to drop them. The test I hold the plan to: backups are proven by restoring them, and recovery is proven within the RTO — a backup that has never been restored is a hope, not a plan.", "tags": "security, disaster recovery, business continuity, RPO, RTO, backups, failover, failback, resilience, defensive security", "icon": "assets/icons/disaster-recovery.png", "logo": "assets/images/disaster-recovery/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["security", "disaster recovery", "business continuity", "RPO", "RTO", "backups", "failover", "failback", "resilience", "defensive security"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: My organization's disaster recovery starts from the business, not from the backup tool. **Every critical system carries an RPO and an RTO that business owners agreed to** and someone priced; **the recovery strategy is chosen per system** against those targets — physical backups, warm standby, high availability, alternate systems, or cloud-native replication recreated through infrastructure-as-code; **dependencies are mapped**, so no application claims a recovery time its authentication service cannot meet; **failover and failback have documented steps and named authority**; and **the plan is tested against real scenarios, without leaning on systems the disaster would have taken out** — with data protected and security controls intact throughout, because a disaster is not an excuse to drop them. The test I hold the plan to: **backups are proven by restoring them and recovery is proven within the RTO — a backup that has never been restored is a hope, not a plan.**\n\n## Statement\n\nWhen my organization plans for the day a system, a site, or a region is gone, this is the discipline I hold the plan to.\n\n**Recovery objectives come from the business and carry a price tag.**\n\n- **Critical services, applications, systems, and data are identified first**; each carries a Recovery Point Objective (how much data we can afford to lose) and a Recovery Time Objective (how long we can afford to be down), driven by business requirements — with the cost and technical complexity of each target reviewed, business owners' agreement obtained, and systems prioritized by business impact and recovery urgency.\n\n![Timeline showing RPO as the data-loss window between the last backup and the disaster, and RTO as the downtime window between the disaster and restored service.](assets/images/disaster-recovery/rpo-rto-timeline.jpeg)\n**Figure 1:** *RPO and RTO on one timeline: how much data the business can afford to lose, and how long it can afford to be down — both agreed by business owners and priced.*\n\n**The recovery strategy is chosen per system, not one-size-fits-all.**\n\n- **Traditional backups** where they fit — media stored at a separate secure location, replacement hardware confirmed available, and transport-plus-restoration time honestly counted into the RTO.\n- **Warm standby** for faster recovery — kept reasonably synchronized, geographically separated, with the DNS, routing, and traffic-redirection steps documented.\n- **High availability** where RPOs and RTOs are very short — with enough spare capacity to actually survive a failure.\n- **Alternate systems and function reassignment** where restoring the original is unnecessary — with reassigned systems verified able to carry production load.\n\n**Cloud-native recovery is engineered, not assumed.**\n\n- Critical applications and data replicate to another region or location, continuously or on schedule as a decision; **infrastructure-as-code recreates the recovery environment and is verified to reproduce production**; failover and failback are automated where possible, traffic reroutes to healthy regions, replication and readiness are monitored, cloud recovery is regularly tested, and **DR cost is reviewed for both normal and disaster operations**.\n\n**Dependencies are mapped before targets are promised.**\n\n- Every critical application's network, routing, DNS, authentication, directory, database, storage, API, and external-service dependencies are mapped; **dependent services must meet compatible RPO/RTO targets, or the targets are adjusted honestly**; dependencies are exercised in tabletop and technical tests.\n\n**The plan is written against real scenarios.**\n\n- Ransomware and cyberattack, mission-critical hardware failure, complete site loss, prolonged power outage, fire and flood and earthquake, pandemic or loss of site access — each reviewed with the IT and business teams it touches, each traced through systems, people, facilities, and communications, and each checked against what the plan actually covers.\n\n**Failover and failback are procedures with named authority.**\n\n- Clear criteria for declaring a disaster, a named authority to activate the plan, an escalation path for uncertain situations, exact documented failover steps with named actors, and confirmation that failover meets the RTO — plus an emergency communication plan.\n- **Failback is planned with the same rigor**: primary stability confirmed, data synchronized, a maintenance window chosen, approval authority named, impacts communicated, services verified after the switch, and issues documented and resolved.\n\n**The plan is tested — honestly.**\n\n- Regular tabletop and technical exercises; **scenarios run without relying on systems the simulated disaster would have taken out**; recovery verified within the RTO and data within the RPO; **backup restoration tested rather than assumed**; dependencies tested; every test observed, documented, debriefed, and converted into corrective actions with owners and deadlines; major changes retested.\n\n**Security does not take a disaster day off.**\n\n- Backup and replicated data carry controls comparable to production — encrypted where appropriate, access-restricted, strongly authenticated — so **backups never become the weaker path to sensitive data**; replication traffic is encrypted, authenticated, and monitored; recovery systems stay patched and configuration-aligned with production; access during a disaster stays least-privilege with emergency access documented and revoked afterwards; secondary sites meet the physical bar of the primary.\n\n**The plan lives.**\n\n- Contact details, communication channels, and out-of-band access to procedures are maintained; roles, priorities, and decision authority documented; actions recorded during incidents; **communication happens during all outages, regardless of size**; and the plan is reviewed after significant changes, with RPO/RTO revisited with business owners, dependency maps updated, backup success monitored, lessons incorporated, and alignment with business continuity planning confirmed.\n\n## How to Read This\n\nThis record sits in the **Response and Recovery** section, beside [Incident Response](incident-response.html): that record governs the fight against a live adversary; this one governs survival when systems, sites, or data are simply gone — whether an attacker, a flood, or a power grid took them. It is grounded in the Disaster Recovery chapter of the *Defensive Security Handbook* (Brotherston, Berlin, Reyor), read as an executive operating record. The full working checklist — all fifteen sections, from objectives to ongoing review — lives in the **Checklist** tab; the management summary in the **TL;DR** tab; the conversation in the **Conversation** tab.\n\n## Rationale\n\n**RPO and RTO are business decisions wearing technical clothes.** How much data we can lose and how long we can be down are questions only the business can answer — and only the business can pay for. An RTO set by IT alone is either gold-plated (recovery capacity the business never asked to fund) or fictional (a number nobody validated against cost and complexity). That is why the record requires business owners' explicit agreement, a reviewed price tag, and a priority order: when everything is down, the recovery sequence must already be decided, because the worst moment to negotiate priority is during the disaster.\n\n**Strategy per system, because uniformity wastes money at both ends.** Putting every system on high availability bankrupts the DR budget on systems that could tolerate a day of downtime; putting everything on tape leaves the revenue-critical path down for a week. The chapter's ladder — backups, warm standby, high availability, alternate systems, function reassignment — exists so each system buys exactly the recovery speed its RPO/RTO demands. The honesty requirement bites hardest at the bottom rung: if backup media must be transported and restored onto hardware that must first be procured, that time *is* the RTO, whatever the document says.\n\n![Staircase diagram of recovery strategies from backups to warm standby to high availability, trading rising cost for rising recovery speed.](assets/images/disaster-recovery/recovery-strategy-ladder.jpeg)\n**Figure 2:** *The strategy ladder: each system buys exactly the recovery speed its RPO and RTO demand — uniformity overspends at one end and underdelivers at the other.*\n\n**The cloud makes recovery cheaper to have and easier to fake.** Replication to another region and IaC that recreates the environment turn what once required a second datacenter into configuration — which is exactly why the record demands verification that the IaC actually reproduces production, that resources scale when DR activates, and that cost is understood in both normal and disaster modes. A recovery region that has never been stood up is the cloud version of the untested backup, with a better-looking architecture diagram.\n\n**A system's real RTO is the RTO of its slowest dependency.** The application that recovers in one hour but authenticates against a directory that takes a day has a one-day RTO; the document claiming otherwise is fiction. Dependency mapping is where DR plans die or become real: network, DNS, identity, databases, storage, third-party APIs. The record's rule — align dependent targets or adjust the promise honestly — keeps the plan an instrument rather than an aspiration.\n\n![Dependency chain where an application promising one-hour recovery depends on an identity service needing a day, making the real RTO the slowest link's.](assets/images/disaster-recovery/slowest-dependency-rto.jpeg)\n**Figure 3:** *A system's real RTO is the RTO of its slowest dependency — align the dependent targets, or adjust the promise honestly.*\n\n**Scenarios keep the plan honest about what \"disaster\" means.** A plan written abstractly recovers an abstract disaster. Ransomware is not a hardware failure: it attacks the backups themselves and may make the \"recovered\" environment re-infectable. Site loss is not a server loss: it takes the runbooks, the badge readers, and possibly the people's ability to travel. A pandemic takes no systems and all of the hands. Walking each named scenario through systems, people, facilities, and communications — with the business in the room — is how a generic plan becomes my organization's plan.\n\n**Untested recovery is a belief system.** The record's load-bearing test is blunt because the failure mode is universal: backups that ran green for years and restore nothing; failover that works except for the one manual step only a departed engineer knew; a DR runbook stored on the wiki that the disaster took down. Hence the double honesty rule — restore, don't assume, and run the exercise without the systems the disaster would have taken — and the closing loop: every test debriefed, every gap converted into an owned, deadlined corrective action, every major change retested.\n\n**Attackers read DR plans too.** Backup and standby environments hold the same crown jewels as production, usually with less scrutiny — which makes an unencrypted backup store or an unpatched warm standby the cheapest path to the data. And the moment of recovery is the moment of maximum temptation to drop controls \"just to get back up.\" The record refuses both: production-comparable controls on data at rest and in transit, patched and configuration-aligned recovery systems, least privilege maintained through the disaster, and temporary emergency access reviewed and revoked afterwards. A recovery that reopens the breach is not a recovery.\n\n**Failback is the forgotten half.** Every plan fails over; few plan the return. Failback done casually — data unsynchronized, no approval authority, no verification — turns a survived disaster into a self-inflicted second outage. The record gives the return trip the same discipline as the outbound one, and the communication rule extends to every outage regardless of size, because silence during small outages is how organizations rehearse silence for the big one.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Every critical system has an RPO and RTO that business owners agreed to and someone priced. | Every system gets an aggressive target — tolerating a slow recovery is a legitimate, priced decision. |\n| The recovery strategy is chosen per system against its targets. | One blessed DR architecture fits all — uniformity overspends and underdelivers at the same time. |\n| Backups are proven by restoring them; recovery is proven within the RTO. | A green backup job is evidence of recoverability — only a restore is. |\n| DR tests run without systems the simulated disaster would have taken out. | Tests must be full production failovers — tabletop and scoped technical exercises count, if they are honest. |\n| Dependencies are mapped and their targets aligned, or the promise is adjusted. | Dependency mismatches are tolerable footnotes — they are corrections to the RTO. |\n| Security controls hold during recovery; emergency access is temporary and revoked. | Speed justifies dropping controls — a recovery that reopens the breach is not a recovery. |\n| Failback is planned, approved, synchronized, and verified like failover. | Getting back to primary is an afterthought once the standby works. |\n\nConcretely: every system my organization calls critical can show its RPO, its RTO, the business owner who signed them, and the date of the last restore test that met them — and the DR runbook is reachable when the primary environment is not.\n\n## Anti-Patterns\n\n- **The untested backup.** Years of green backup jobs, zero restores — discovered to be empty, corrupt, or unrestorable at the exact moment they were the last copy.\n- **The RTO nobody bought.** A recovery target written by IT, never priced, never signed by a business owner — gold-plated where it did not matter and fictional where it did.\n- **The dependency surprise.** The flagship application restored in an hour, waiting a day for the identity provider — the real RTO was always the slowest dependency's.\n- **The plan on the dead wiki.** DR procedures, contact lists, and runbooks stored only on systems the disaster took down with everything else.\n- **The rotting standby.** A warm standby unpatched and configuration-drifted for a year — it fails over successfully into an environment that no longer runs the application, or runs it insecurely.\n- **The security holiday.** Controls dropped \"temporarily\" to accelerate recovery — shared admin credentials, disabled MFA, wide-open firewall rules — converting an outage into a breach.\n- **The convenient test.** A DR exercise that quietly uses production DNS, production identity, and the primary site's tooling — proving only that recovery works when nothing is actually wrong.\n- **The one-way failover.** A standby that works, and no synchronized, approved, verified path back — the survived disaster followed by a self-inflicted second outage.\n\n## Related Records\n\n- [Incident Response](incident-response.html) — the neighboring discipline: when an attacker destroys rather than infiltrates — ransomware above all — response hands off to this record's objectives and procedures.\n- [Cloud Infrastructure](cloud-infrastructure.html) — the platform controls that cloud-native DR (cross-region replication, IaC-recreated environments) builds on.\n- [Asset Management and Documentation](asset-management.html) — you cannot set recovery objectives for critical systems you have not identified; the criticality inventory starts there.\n- [Physical Security](physical-security.html) — secondary sites must meet the physical bar of the primary; that bar is defined there.\n- [Secure Network Infrastructure](network-security.html) — the encrypted, authenticated replication paths and the DNS/routing changes failover depends on.\n- [Creating a Security Program: Risk Before Tools](security-program.html) — DR is a pillar of the program's resilience commitment and stays aligned with business continuity planning there.\n\n## Scope and Revisiting\n\nThis record is `draft`. It applies to every system my organization classifies as critical, and its testing bar applies to every claimed recovery capability. I revisit it if a real disaster or test misses an agreed RPO/RTO (the plan failed, or the target was fiction — either way the record must answer), if the architecture shifts materially toward or away from cloud-native recovery, if dependency maps go stale enough to surprise a test, or if business owners' continuity requirements change — the plan follows the business, never the reverse.\n\n## Authoritative References\n\n- *Defensive Security Handbook*, 2nd edition (Lee Brotherston, Amanda Berlin, William F. Reyor III; O'Reilly) — the Disaster Recovery chapter, whose checklist this record distills.\n"}]}, {"key": "summary", "label": "TL;DR", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "My organization's disaster recovery starts from the business, not from the backup tool. Every critical system carries an **RPO and RTO that business owners agreed to and someone priced**; the recovery strategy is chosen per system against those targets; dependencies are mapped so no application promises a recovery time its authentication service cannot meet; failover and failback have documented steps and named authority; and the plan is tested without leaning on systems the disaster would have taken out — security controls intact throughout. The test: backups are proven by restoring them, and recovery is proven within the RTO — a backup that has never been restored is a hope, not a plan.\n\n**What changes**\n\n* **Recovery targets become business decisions.** Each critical system gets an RPO and RTO driven by business requirements, the cost of meeting each target is reviewed, business owners sign, and systems are ranked by impact — so the recovery order is decided before the disaster, not during it.\n* **Strategy is fitted per system.** Physical backups (transport and restore time counted honestly into the RTO), warm standby, high availability with real spare capacity, alternate systems, and function reassignment each buy exactly the speed a system's targets demand; cloud-native recovery replicates across regions and rebuilds environments through verified infrastructure-as-code, with costs understood in normal and disaster modes.\n* **Dependencies stop being surprises.** Network, DNS, identity, database, storage, and third-party dependencies are mapped, their RPO/RTO compatibility confirmed, and unrealistic promises corrected — a system's real RTO is the RTO of its slowest dependency.\n* **Failover and failback become procedures.** Clear declaration criteria, named activation authority, exact steps with named actors, an emergency communication plan — and a failback path synchronized, approved, verified, and communicated with the same rigor.\n* **Testing becomes honest.** Tabletop and technical exercises run without systems the simulated disaster would have removed; restores are performed, not assumed; RTO and RPO verified; every test debriefed into owned, deadlined corrective actions; major changes retested.\n* **Security holds through the disaster.** Backup data carries production-comparable controls, replication is encrypted and authenticated, recovery systems stay patched and aligned, access stays least-privilege, and emergency access is revoked afterwards.\n\n**What it costs**\n\n* Standing spend on standby environments, replication, and secondary-site security — priced per system rather than avoided or gold-plated.\n* Recurring test, restore, and debrief work; the plan is maintained, not filed.\n* Business owners' time: targets, priorities, and periodic reviews need their signature, not IT's guess.\n\n**What we are not doing**\n\n* Not giving every system an aggressive target — tolerating slow recovery is a legitimate, priced decision.\n* Not handling the live-adversary fight here — that is [Incident Response](incident-response.html); ransomware hands off from there to this plan.\n* Not defining the cloud platform or physical-site bar here — those live in [Cloud Infrastructure](cloud-infrastructure.html) and [Physical Security](physical-security.html).\n\n*The Article tab carries the rationale and anti-patterns; the Checklist tab carries all fifteen sections from objectives to ongoing review. Grounded in the Disaster Recovery chapter of the* Defensive Security Handbook*.*\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record — the disaster-recovery build from business-agreed objectives through strategy, dependencies, scenarios, failover and failback, honest testing, and ongoing review. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Define Recovery Objectives\n\n- [ ] Identify critical business services, applications, systems, and data\n- [ ] Define the **Recovery Point Objective (RPO)** for each critical system\n- [ ] Define the **Recovery Time Objective (RTO)** for each critical system\n- [ ] Confirm that RPO and RTO targets are driven by business requirements\n- [ ] Review the cost and technical complexity of meeting each target\n- [ ] Obtain agreement from business owners on acceptable recovery targets\n- [ ] Prioritize systems according to business impact and recovery urgency\n\n## 2. Select Recovery Strategies\n\n- [ ] Determine which recovery approach is appropriate for each system\n- [ ] Consider **traditional physical backups** where appropriate\n  - [ ] Store backup media at a separate, secure location\n  - [ ] Confirm replacement hardware or infrastructure will be available after a disaster\n  - [ ] Factor backup transport and restoration time into the RTO\n- [ ] Consider a **warm standby** environment for faster recovery\n  - [ ] Keep standby systems reasonably synchronized with production\n  - [ ] Keep standby systems geographically separated from the primary environment\n  - [ ] Document the process for redirecting DNS, routing, or network traffic during failover\n- [ ] Consider **high availability** for systems requiring very short RPOs and RTOs\n  - [ ] Ensure high-availability environments have enough spare capacity after a failure\n- [ ] Consider an **alternate system** when restoring the original system is unnecessary\n- [ ] Consider **system function reassignment** by repurposing noncritical systems during a disaster\n  - [ ] Verify reassigned systems can safely support production workloads\n\n## 3. Plan Cloud-Native Disaster Recovery\n\n- [ ] Replicate critical applications and data to another cloud region or location\n- [ ] Determine whether replication should be continuous or scheduled\n- [ ] Use **Infrastructure as Code (IaC)** to recreate recovery environments quickly\n- [ ] Verify IaC configurations accurately reproduce the production environment\n- [ ] Configure cloud resources to scale when disaster recovery is activated\n- [ ] Consider multi-region deployment for critical services\n- [ ] Configure traffic rerouting to healthy regions\n- [ ] Automate failover and failback where possible\n- [ ] Use orchestration tools to reduce manual recovery steps\n- [ ] Monitor cloud replication and recovery readiness\n- [ ] Regularly test cloud recovery procedures\n- [ ] Review cloud DR costs during normal and disaster operations\n\n## 4. Identify Dependencies\n\n- [ ] Map dependencies for every critical application and service\n- [ ] Identify required network connectivity\n- [ ] Identify routing and DNS dependencies\n- [ ] Identify authentication and directory-service dependencies\n- [ ] Identify databases, storage, APIs, and external services required by each system\n- [ ] Confirm dependent services have compatible RTO and RPO targets\n- [ ] Adjust unrealistic recovery targets when dependencies cannot meet them\n- [ ] Include dependencies in tabletop exercises and DR testing\n\n## 5. Prepare Disaster Scenarios\n\n- [ ] Develop a ransomware or cyberattack scenario\n- [ ] Develop a mission-critical hardware failure scenario\n- [ ] Develop a complete datacenter or site-loss scenario\n- [ ] Develop a prolonged power-outage scenario\n- [ ] Develop a fire, flood, earthquake, or other physical-disaster scenario\n- [ ] Develop a pandemic or loss-of-site-access scenario\n- [ ] Include representatives from relevant IT and business teams when reviewing scenarios\n- [ ] Identify how each scenario affects systems, people, facilities, and communications\n- [ ] Determine whether the existing DR plan adequately addresses each scenario\n\n## 6. Define Failover Procedures\n\n- [ ] Establish clear criteria for declaring a disaster\n- [ ] Define who is authorized to activate the DR plan\n- [ ] Establish an escalation process for uncertain situations\n- [ ] Document the exact steps required to fail over critical services\n- [ ] Identify who performs each failover action\n- [ ] Document DNS, routing, application, and infrastructure changes required during failover\n- [ ] Confirm failover can meet the defined RTO\n- [ ] Maintain an emergency communication plan for staff and stakeholders\n\n## 7. Define Failback Procedures\n\n- [ ] Document how services will return to the primary environment\n- [ ] Confirm the original environment is stable before failback\n- [ ] Synchronize data before returning services to the primary environment\n- [ ] Plan failback during an appropriate maintenance window where possible\n- [ ] Identify who is authorized to approve failback\n- [ ] Communicate planned service impacts before switching back\n- [ ] Verify applications and services after failback\n- [ ] Document and resolve any issues discovered during the process\n\n## 8. Test the Disaster Recovery Plan\n\n- [ ] Schedule regular DR tests\n- [ ] Perform tabletop exercises\n- [ ] Perform technical recovery exercises\n- [ ] Test scenarios without relying on systems that would be unavailable during the simulated disaster\n- [ ] Verify systems can be recovered within the RTO\n- [ ] Verify data can be recovered within the RPO\n- [ ] Test backup restoration rather than assuming backups are usable\n- [ ] Test network, DNS, authentication, and application dependencies\n- [ ] Observe and document each test\n- [ ] Record what worked well\n- [ ] Record failures, delays, and unexpected dependencies\n- [ ] Conduct a post-test debrief\n- [ ] Assign corrective actions to specific owners\n- [ ] Set deadlines for corrective actions\n- [ ] Update the DR plan based on lessons learned\n- [ ] Retest major changes\n\n## 9. Protect Data at Rest\n\n- [ ] Apply appropriate security controls to replicated and backup data\n- [ ] Encrypt sensitive backup data where appropriate\n- [ ] Restrict access to backup and recovery systems\n- [ ] Require strong authentication for administrative access\n- [ ] Apply controls comparable to those used in the production environment\n- [ ] Confirm backup copies do not create a weaker path to sensitive information\n\n## 10. Protect Data in Transit\n\n- [ ] Encrypt data transmitted to backup or secondary systems\n- [ ] Authenticate systems participating in replication\n- [ ] Secure network connections used for backup and recovery\n- [ ] Review replication traffic for exposure to untrusted networks\n- [ ] Monitor recovery-related network activity for suspicious behavior\n\n## 11. Maintain Patching and Configuration\n\n- [ ] Keep recovery systems patched at an appropriate level\n- [ ] Keep production and recovery configurations aligned\n- [ ] Apply configuration changes to both primary and recovery environments\n- [ ] Track intentional differences between environments\n- [ ] Verify applications behave correctly on recovery systems\n- [ ] Prevent outdated recovery systems from becoming a security weakness\n\n## 12. Control User Access\n\n- [ ] Define who can access recovery systems during a disaster\n- [ ] Maintain least-privilege access wherever possible\n- [ ] Protect personally identifiable, financial, and other sensitive information\n- [ ] Do not remove security controls simply to accelerate recovery\n- [ ] Document emergency-access procedures\n- [ ] Review and revoke temporary access after the incident\n\n## 13. Maintain Physical Security\n\n- [ ] Confirm secondary sites have appropriate physical access controls\n- [ ] Compare physical security at primary and recovery locations\n- [ ] Protect servers, storage, backup media, and networking equipment\n- [ ] Restrict access to authorized personnel\n- [ ] Address security gaps if a secondary location uses office space rather than a dedicated datacenter\n\n## 14. Communication and Documentation\n\n- [ ] Maintain current contact details for recovery personnel\n- [ ] Define communication channels to use during an outage\n- [ ] Identify who communicates with employees, customers, vendors, and leadership\n- [ ] Keep DR procedures accessible even if normal systems are unavailable\n- [ ] Document roles and responsibilities\n- [ ] Document recovery priorities and decision-making authority\n- [ ] Record actions and decisions during an incident\n- [ ] Communicate during all outages, regardless of size\n\n## 15. Ongoing Review\n\n- [ ] Review the DR plan after significant infrastructure or application changes\n- [ ] Review RPO and RTO targets periodically with business owners\n- [ ] Update dependency maps when systems change\n- [ ] Review backup and replication success regularly\n- [ ] Verify contact information remains current\n- [ ] Incorporate lessons from incidents and DR tests\n- [ ] Confirm the DR strategy continues to meet business requirements\n- [ ] Ensure disaster recovery planning remains aligned with business continuity planning\n\nWith every section green, the plan holds where it counts: objectives the business signed, strategies priced per system, dependencies aligned, failover and failback rehearsed, and controls intact under pressure. The test running through the whole sequence: **has every backup been proven by a restore, and every RTO been proven by a test that did not lean on systems the disaster would have taken out?**\n"}]}, {"key": "dialog", "label": "Conversation", "meta": {"timetoread": "8 min listen"}, "blocks": [{"type": "markdown", "content": "## Whose Numbers Are RPO and RTO\n\n**Ben:** Let me open with the obvious: we do backups. Nightly, offsite, encrypted, green dashboard. Isn't disaster recovery a solved problem we're now wrapping in ceremony?\n\n**Ana:** The green dashboard is where this record starts its argument. A backup job succeeding tells you a file was written. It doesn't tell you the file restores, that the restore fits inside the downtime the business can survive, or that anyone ever decided what that survivable downtime is. The record begins somewhere most DR programs skip: every critical system carries an RPO — how much data we can afford to lose — and an RTO — how long we can afford to be down — driven by business requirements, priced, and signed by business owners.\n\n**Ben:** Why drag business owners into what's essentially an infrastructure design choice?\n\n**Ana:** Because they're the only ones who can answer the two questions, and the only ones who can pay for the answers. An RTO set by IT alone is either gold-plated — recovery capacity nobody asked to fund — or fictional, a number never validated against cost. And the signature buys something else: priority. When everything is down at once, the recovery order must already be decided. The worst possible moment to negotiate which system matters most is during the disaster.\n\n**Ben:** Fine. But then the record refuses to pick one recovery architecture. Backups, warm standby, high availability, alternate systems, repurposed systems — why the menu? Pick the best one.\n\n**Ana:** Because \"the best one\" wastes money at both ends. High availability everywhere bankrupts the budget on systems that could tolerate a day down; tape everywhere leaves the revenue path dark for a week. Strategy is chosen per system against its signed targets. And each rung has an honesty clause. Tape offsite? Then transport time plus restore time plus procuring replacement hardware *is* your RTO, whatever the document says. Warm standby? It has to stay synchronized and geographically separate, with the DNS and routing switch documented. HA? Only counts if there's spare capacity left after the failure.\n\n## Cloud Recovery and the Dependency Trap\n\n**Ben:** The cloud section reads almost optimistic. Replicate to another region, infrastructure-as-code recreates everything. Hasn't the cloud basically solved DR?\n\n**Ana:** It's made DR cheaper to have and easier to fake — the record says both. Yes: cross-region replication and IaC turn what used to need a second datacenter into configuration. But the checklist is deliberately suspicious: verify the IaC actually reproduces production, confirm resources scale when DR activates, test the recovery procedures regularly, and review the cost in both normal and disaster modes. A recovery region that has never been stood up is the untested backup with a better architecture diagram.\n\n**Ben:** And the cost line? That seems oddly financial for a security record.\n\n**Ana:** A DR plan the organization can't afford to run is a plan that gets quietly abandoned in month three. Cost transparency is a survival property of the plan itself.\n\n**Ben:** Let's do dependencies. Every DR document I've seen has a dependency section nobody reads.\n\n**Ana:** That unread section is usually where the plan dies. A system's real RTO is the RTO of its slowest dependency. Your flagship app restores in an hour — and then waits a day for the identity provider, because nobody checked that the directory service had a compatible target. The record maps them all: network, routing, DNS, authentication, databases, storage, third-party APIs. Then the rule with teeth: dependent services meet compatible targets, or you adjust the promise honestly. And dependencies go into the tests, because a dependency map that's never exercised is just a diagram.\n\n**Ben:** The scenarios feel like tabletop theater, though. Ransomware, fire, flood, pandemic — do the labels change the plan?\n\n**Ana:** They change it completely, which is the point of walking each one through systems, people, facilities, and communications with the business in the room. Ransomware attacks the backups themselves and can make your recovered environment re-infectable — it's not a hardware failure with extra steps. Site loss takes the runbooks and badge readers with it. A pandemic takes no systems and all of the hands. A plan written abstractly recovers an abstract disaster. The scenarios are how it becomes ours.\n\n## Testing Without a Safety Net\n\n**Ben:** Now the hard one. \"Test without relying on systems that would be unavailable during the simulated disaster.\" That's expensive, disruptive, and frankly a bit performative. A scoped restore test in a sandbox tells me most of what I need. Why insist on the brutal version?\n\n**Ana:** Because the convenient test is one of the record's named anti-patterns, and it's the most seductive one. The exercise that quietly uses production DNS, production identity, and the primary site's tooling proves exactly one thing: recovery works when nothing is wrong. The disaster removes your DNS, your identity provider, your wiki — and your wiki is where the runbook lives. The plan-on-the-dead-wiki failure is so common the record has a separate line for keeping DR procedures accessible when normal systems are down.\n\n**Ben:** So every test is a full site-down simulation?\n\n**Ana:** No — the record wants a portfolio: tabletops, scoped technical exercises, restore drills, up to fuller simulations. The honesty rule isn't \"maximum pain,\" it's \"don't let the test secretly lean on what the disaster removes.\" And the loop closes the same way every time: observe, document, debrief, corrective actions with owners and deadlines, retest major changes. A test that finds nothing was probably not a test.\n\n**Ben:** And restores. Surely modern backup tools verify integrity automatically.\n\n**Ana:** Verification tells you the bits match. A restore tells you the system comes back — schema, permissions, application behavior, within the RPO and RTO. The record's load-bearing line is blunt on purpose: a backup that has never been restored is a hope, not a plan. Years of green jobs have ended in empty archives at precisely the moment they were the last copy.\n\n## Security During the Worst Week\n\n**Ben:** Here's a real objection from the trenches. It's 3 a.m., the site is down, revenue is bleeding. Someone says: disable MFA on the recovery accounts, open the firewall, share the admin password — we'll clean it up after. Isn't that just pragmatic triage?\n\n**Ana:** It's the anti-pattern the record calls the security holiday, and it's how an outage becomes a breach. Two facts make disaster week the worst week to drop controls. First, backup and standby environments hold the same crown jewels as production, usually with less scrutiny — an unencrypted backup store or an unpatched warm standby is the cheapest path to the data, and attackers know it. Second, adversaries deliberately exploit chaos; ransomware operators in particular count on recovery-mode sloppiness. So: production-comparable controls on backup data, encrypted and authenticated replication, patched and configuration-aligned recovery systems, least privilege maintained, emergency access documented — and revoked afterwards. A recovery that reopens the breach is not a recovery.\n\n**Ben:** The failback section surprised me. Everyone plans the jump to the standby; you're saying the jump back needs equal ceremony?\n\n**Ana:** Equal ceremony, because it's an equal outage risk. Failback done casually — primary not confirmed stable, data not synchronized, nobody authorized to approve, nothing verified after the switch — turns a survived disaster into a self-inflicted second one. And wrapped around all of it: communicate during every outage, regardless of size. Silence during small outages is how organizations rehearse silence for the big one.\n\n**Ben:** All right, the concession. Disaster recovery isn't a backup product — it's a set of promises: loss and downtime bounds the business actually signed, strategies priced to meet them, dependencies that don't lie, and proof by restore and rehearsal rather than by dashboard.\n\n**Ana:** With one addition: the promises decay. Systems change, dependencies shift, contacts go stale — which is why the fifteenth section is ongoing review, tied back to business continuity. The question I'd leave any team with is the record's own test: has every backup been proven by a restore, and every RTO by a test that didn't lean on what the disaster would take? If not, you don't have a plan yet. You have a hope with a table of contents.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why a backup that has never been restored is a hope, not a plan — in nine panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NADIA: a hands-on defensive-security lead, shoulder-length dark hair tied back, navy utility jacket over a plain shirt, an access badge on a lanyard, laptop with a padlock sticker under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and green accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Vera and Nadia look at a systems map with an entire region blacked out under storm, fire, and virus icons.](assets/images/disaster-recovery/comic-01-the-day-it-is-gone.jpeg)\n**Panel 1:** *The hook: one day a system, a site, or a whole region is simply gone — taken by an attacker, a flood, or the power grid. The plan for that day is written now or never.*\n\n![Comic panel: an engineer shows a dashboard of green backup checks while Nadia opens a vault containing only dust.](assets/images/disaster-recovery/comic-02-green-jobs-empty-tapes.jpeg)\n**Panel 2:** *The problem: years of green backup jobs, zero restores — discovered to be empty, corrupt, or unrestorable at the exact moment they were the last copy. Untested recovery is a belief system.*\n\n![Comic panel: an engineer paints a Recovery In 1 Hour poster while Vera holds an unsigned agreement and business people walk past.](assets/images/disaster-recovery/comic-03-the-rto-nobody-bought.jpeg)\n**Panel 3:** *The wrong way: the RTO nobody bought — a target written by IT alone, never priced, never signed by a business owner. Gold-plated where it did not matter, fictional where it did.*\n\n![Comic panel: a business owner signs a sheet with RPO and RTO dials and a price tag while Vera holds a system priority list.](assets/images/disaster-recovery/comic-04-signed-and-priced.jpeg)\n**Panel 4:** *The principle: recovery starts from the business, not the backup tool. Every critical system carries an RPO and RTO that business owners agreed to and someone priced — with the recovery order decided before the disaster, not during it.*\n\n![Comic panel: Nadia presents a ladder of recovery strategies with server characters standing on different rungs.](assets/images/disaster-recovery/comic-05-the-strategy-ladder.jpeg)\n**Panel 5:** *Strategy per system: backups, warm standby, high availability, alternate systems — uniformity wastes money at both ends, so each system buys exactly the recovery speed its targets demand.*\n\n![Comic panel: a race car labeled one hour is chained to a sleeping tortoise labeled identity one day while Nadia points at the chain.](assets/images/disaster-recovery/comic-06-slowest-dependency.jpeg)\n**Panel 6:** *Dependencies are mapped before targets are promised: the app that recovers in an hour but authenticates against a directory that takes a day has a one-day RTO — align the targets, or adjust the promise honestly.*\n\n![Comic panel: Nadia restores from a backup crate under a stopwatch while taped-off primary systems and wiki sit unusable behind her.](assets/images/disaster-recovery/comic-07-the-honest-drill.jpeg)\n**Panel 7:** *The honest test: restore, don't assume — and run the exercise without the systems the disaster would have taken out, wiki and DNS included. Recovery is proven within the RTO or the plan is fiction.*\n\n![Comic panel: Nadia blocks a Disable All Controls lever during recovery while a burglar lurks by the backup vault.](assets/images/disaster-recovery/comic-08-no-security-holiday.jpeg)\n**Panel 8:** *The cost of shortcuts: attackers read DR plans too. Backups carry production-grade controls, standbys stay patched, and emergency access is documented and revoked — a recovery that reopens the breach is not a recovery.*\n\n![Comic panel: Vera holds two cards — a crossed-out wishing star labeled hope and a stamped restore report labeled plan.](assets/images/disaster-recovery/comic-09-hope-or-plan.jpeg)\n**Panel 9:** *The closer: backups are proven by restoring them and recovery is proven within the RTO — a backup that has never been restored is a hope, not a plan.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
