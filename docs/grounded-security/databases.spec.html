<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Databases\n\n> Working doc for the post in this folder. The spec drives the post; the post\n> is the artifact.\n\n## Intent\n\nFix the bar my organization holds its databases to — the systems where a\nsecurity failure becomes the headline. The post turns the Databases chapter\nof the *Defensive Security Handbook* into an operating record: every critical\ndatabase is known, classified, and owned; access follows least privilege with\nprivileged access logged, reviewed, and managed; sensitive data is encrypted\nat rest, in transit, and in backups, with keys stored separately, rotated,\nand owned; secrets are never hardcoded and passwords never stored in\nplaintext; SQL injection is treated as an application problem with database\nconsequences; unauthorized access and insider threats are both planned for;\nexfiltration paths are closed and watched; configurations are hardened\nagainst recognized standards and vulnerabilities patched on a defined clock;\nactivity is logged with someone owning the alerts; backups restore and\ndatabases sit inside DR planning with defined RTO/RPO; cloud databases meet\nthe same bar as on-premises ones under a correctly read shared-responsibility\nmodel; governance assigns ownership, standards, minimum requirements,\ndocumented exceptions, and tracked risks; and database breaches are in the\nincident-response plan, with third parties, acquisitions, and legacy systems\nheld to the same scrutiny. The load-bearing test, verbatim from the chapter:\nfive questions — what data do we have and where is it, who can access it and\nwhy, how is it protected, how would we detect misuse or compromise, can we\nrecover quickly — answered clearly for every critical database, or the\norganization has a database-security governance gap.\n\n## Audience\n\nEngineering leads and DBAs in my organization who own databases (so they know\nthe bar each database is held to); security engineers auditing data-layer\nposture; peer executives who want to see what \"we protect the data where it\nlives\" concretely means. First-person declarative.\n\n## Success criteria\n\n- [x] **Principle is quotable** — highlight states the database bar end to\n      end and closes with the chapter's five-questions governance test.\n- [x] **Architecture and classification survive** — knowing where critical\n      and sensitive data is stored; which technologies are in use\n      (relational, NoSQL, cloud-managed, serverless, self-managed); which\n      databases are business-critical; who owns and operates each; the\n      on-premises versus cloud security implications and the shared\n      responsibility model; data classified by sensitivity, databases\n      containing customer, personal, financial, credential, IP, and\n      operationally critical data identified, and the highest-risk databases\n      receiving the strongest protection.\n- [x] **Access control and PAM survive** — authentication versus\n      authorization, least privilege, tightly restricted administrative\n      privileges, prompt removal of former employees and unnecessary\n      accounts, strong authentication for privileged access, securely\n      managed service accounts, no shared administrator accounts; privileged\n      access logged and monitored, PAM considered for critical systems,\n      periodic privileged-account review, application accounts without\n      administrator or system-level privileges.\n- [x] **Encryption and secrets survive** — encryption at rest, in transit\n      (TLS), and of backups; TDE understood; keys stored separately from\n      data, rotated, access-controlled, and owned, through a key- or\n      secrets-management solution; passwords never in plaintext, hashing\n      versus encryption, salted password hashing; no hardcoded credentials,\n      a centralized secrets manager, and rotation without major disruption.\n- [x] **Attack modes survive** — SQL injection (parameterized queries, input\n      validation, least-privileged application accounts, secure coding\n      standards, security testing); unauthorized access (brute force,\n      credential stuffing, password reuse, dictionary attacks, stolen\n      credentials; strong policies, MFA for administrative access, lockout\n      and rate limiting, authentication-failure monitoring, default\n      credentials removed); insider threats (malicious versus accidental,\n      job-based access, privileged-user monitoring, separation of duties,\n      export controls, role-change reviews); data leakage and exfiltration\n      (no unnecessary public exposure, protected communications, secured\n      backups/exports/snapshots/replicas, production data restricted in\n      dev/test, bulk-download monitoring, cloud misconfiguration awareness).\n- [x] **Operations survive** — hardening against documented standards with\n      CIS Benchmarks and DISA STIGs named, least functionality, restricted\n      network connectivity, configuration reviews; vulnerability and patch\n      management with defined patch timelines, compensating controls, and\n      tracked remediation; logging, monitoring, and detection with SIEM/XDR\n      forwarding, defined alerts, sufficient retention, and a named alert\n      owner; backup and recovery with encryption, restricted access,\n      attacker-resistant copies, RTO/RPO, and tested restoration;\n      availability and resilience including redundancy, failover, failure\n      planning, and inclusion in DR/BC planning.\n- [x] **Cloud, governance, incident response, and third parties survive** —\n      cloud database inventory by provider, provider-versus-organization\n      responsibilities, IAM review, no unnecessary public endpoints, network\n      controls, encryption/logging/backups/monitoring enabled, continuous\n      misconfiguration review; governance with per-database ownership,\n      documented standards, minimum requirements across the eight named\n      areas, periodic reviews, documented exceptions, and management-level\n      risk tracking; database breaches in the IR plan with the\n      what/who/when/how-much/which-credentials questions answerable;\n      third-party, acquisition, and legacy scrutiny including supplier\n      agreements and post-merger remediation.\n- [x] **The question sets survive** — the chapter's seventeen \"questions\n      you should be able to answer\" and the five-question priority reminder,\n      reproduced in the checklist.\n- [x] **Credit is explicit** — References name the *Defensive Security\n      Handbook*, the Databases chapter checklist, and the standards the\n      chapter names (CIS Benchmarks, DISA STIGs).\n\n## Non-goals\n\n- Not [Authentication](authentication.html) — MFA, lockout, and password policy here apply at\n  the database layer; the organization-wide identity model lives there.\n- Not [Secure Software Development](secure-software-development.html) — SQL injection is stated here as a\n  database consequence; the secure coding practice that prevents it lives\n  there.\n- Not [Disaster Recovery](disaster-recovery.html) — RTO, RPO, and tested restoration here cover\n  databases specifically; the organization-wide DR discipline lives there.\n- Not [Cloud Infrastructure](cloud-infrastructure.html) — cloud databases here must meet the same bar\n  as on-premises; the cloud estate's own record lives there.\n- Not a platform mandate — named technologies (MySQL, PostgreSQL, SQL\n  Server, MongoDB) are the worked example; the commitments are stated at the\n  capability level.\n\n## Modalities\n\nThe working tool ships as the checklist modality (`checklist.md`, rendered\nas the Checklist tab).\n\n- [x] `checklist.md` — operational checklist\n- [x] `summary.md` — management summary\n- [x] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic *(added later with the visual layer)*\n\n## Open questions\n\n- None.\n\n## Decision log\n\n- **2026-08-22** — Grounded in the Databases chapter checklist of the\n  *Defensive Security Handbook*, read through a practitioner-executive lens,\n  as with every record in this journal.\n\n## Sources\n\n- **Internal**\n  - `sources/checklists/defensive-security-handbook/Checklist_ DSH _ 13 _ Databases.pdf`\n    — the chapter checklist; reproduced, adapted, in the Checklist tab\n    (`checklist.md`), including the questions-you-should-be-able-to-answer\n    section and the priority reminder.\n- **External**\n  - *Defensive Security Handbook*, 2nd edition (Lee Brotherston, Amanda\n    Berlin, and William F. Reyor III; O'Reilly) — the Databases chapter.\n\n## Changelog\n\n- **2026-08-22** — Initial spec, article, checklist, summary, and dialog\n  written; spec and post agree. Status `accepted`. *(Željko, AI-mediated\n  session)*\n- **2026-08-22** — Post-review fixes applied (see REVIEW.md). *(Željko,\n  AI-mediated session)*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
