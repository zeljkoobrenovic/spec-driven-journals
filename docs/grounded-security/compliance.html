<script id="data" type="application/json">{"meta": {"id": "SEC-COMPLIANCE", "status": "draft:gray", "title": "Industry Compliance Standards and Frameworks", "date": "2026-08-22", "author": "Željko Obrenović", "permalink": "compliance", "timetoread": "7 min", "excerpt": "In my organization, compliance is the floor, never the program. Compliance standards are minimum requirements — an organization can be fully compliant and still be weak — so we never confuse the three layers of the map: laws and regulations that bind us, compliance standards that operationalize them, and security frameworks we choose in order to actually build the program. For every regulated data type we hold, we can name the regulation that governs it — FERPA for student records, GLBA for nonpublic personal information, HIPAA for ePHI, PCI DSS for cardholder data, SOX for financial-reporting controls — and we use frameworks like CIS, the ISO 27000 series, MITRE ATT&CK, and NIST CSF to build what compliance merely attests. The test I hold the posture to: being compliant is never mistaken for being secure.", "tags": "compliance, regulations, security frameworks, NIST CSF, ISO 27001, PCI DSS, HIPAA, GLBA, SOX, governance, risk, security program", "icon": "assets/icons/compliance.png", "logo": "assets/images/compliance/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["compliance", "regulations", "security frameworks", "NIST CSF", "ISO 27001", "PCI DSS", "HIPAA", "GLBA", "SOX", "governance", "risk", "security program"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: My organization treats compliance as the floor, never the program. **Compliance standards are minimum requirements** — an organization can be fully compliant and still be weak — so we keep the map layers straight: **laws and regulations bind us, compliance standards operationalize them, and security frameworks are what we choose to actually build with**. **For every regulated data type we hold, we can name the regulation that governs it** — FERPA for student records, GLBA for nonpublic personal information, HIPAA for ePHI, PCI DSS for cardholder data, SOX for the controls behind financial reporting — and we know the enforcement and penalties behind each. **Frameworks — CIS, CCM, COSO, COBIT, ISO 27000, MITRE ATT&CK, NIST CSF — are how the floor becomes a program**, and the structural risks of regulated industries are understood, not just their paperwork. The test I hold the posture to: **being compliant is never mistaken for being secure** — effective security combines compliance requirements with established frameworks and security best practice.\n\n## Statement\n\nWhen my organization reasons about compliance, this is the literacy and posture it is held to.\n\n**Compliance is understood as the floor.**\n\n- **Compliance standards are minimum requirements**, not complete security programs; an organization can be compliant and still have serious security weaknesses.\n- The difference between **regulatory compliance standards** and **security frameworks** is understood and never blurred; compliance requirements vary by industry, country, and governing body; compliance officers coordinate the regulatory requirements; and compliance obligations may involve administrative, technical, and physical controls.\n\n![Diagram of three layers: laws and regulations bind, compliance standards operationalize, and security frameworks are chosen to build the program.](assets/images/compliance/three-layer-compliance-map.jpeg)\n**Figure 1:** *The map has three layers that are never blurred: laws bind, compliance standards operationalize, and security frameworks are chosen instruments for building the program.*\n\n**Every regulated data type maps to its regulation.**\n\n- **FERPA** — student education records at educational institutions: the education-records versus directory-information distinction, PII disclosure requiring authorization, what valid consent must identify, and the honest note that FERPA carries relatively few specific cybersecurity requirements.\n- **GLBA** — financial institutions and **nonpublic personal information (NPI)**: an ongoing obligation to protect customer privacy and confidentiality; administrative, technical, and physical safeguards; a concrete control set (access controls, audit trails, change management, disposal, encryption, MFA, secure development, system inventory and monitoring, third-party standards, written risk assessments); third-party providers in scope; and enforcement by the FTC, FDIC, Federal Reserve, and OCC.\n- **HIPAA** — **electronic protected health information (ePHI)** at providers, health plans, and clearinghouses: administrative, physical, and technical safeguards plus policies and documentation; the **required versus addressable** distinction; risk assessment and mitigation; breach reporting to HHS and in some cases the FTC; civil and criminal penalties.\n- **PCI DSS** — **payment card and cardholder data** wherever it is stored, processed, or transmitted: required by the card brands, administered by the PCI Security Standards Council, covering the PAN, cardholder name, expiration date, and service code — with fines, penalties, or loss of card-processing capability behind failed validation.\n- **SOX** — corporate governance and financial reporting at U.S. public companies: Section 302's safeguards for accurate reporting, Section 404's independently verifiable controls, disclosure of security weaknesses affecting financial information, and COSO or COBIT as the usual supporting structures.\n\n![Diagram mapping five regulated data types to their governing regulations: student records to FERPA, NPI to GLBA, ePHI to HIPAA, cardholder data to PCI DSS, and financial-reporting controls to SOX.](assets/images/compliance/data-to-regulation-map.jpeg)\n**Figure 2:** *The executive's minimum viable competence: every regulated data type maps from memory to the regulation that governs it.*\n\n**Frameworks are how the floor becomes a program.**\n\n- **CIS** for benchmarks and system-hardening guidance that complement other frameworks; **CSA's Cloud Controls Matrix** for cloud security mapped to the major compliance standards; **COSO** for enterprise risk, internal controls, and fraud deterrence; **COBIT** (ISACA) for governance across its Plan-and-Organize, Acquire-and-Implement, Deliver-and-Support, and Monitor-and-Evaluate domains.\n- **The ISO 27000 series** for information security management — 27001's ISMS requirements through 27006's certification requirements — and the ISMS as the organizing idea; **MITRE ATT&CK** for adversary tactics, techniques, and procedures across enterprise, cloud, mobile, and industrial systems, used by offense and defense alike; **NIST CSF** for managing cybersecurity risk through its Core, Profiles, and Implementation Tiers.\n\n**Regulated industries are understood structurally, not just contractually.**\n\n- **Financial**: highly valuable data and a specific risk list — account takeover, third-party payment-processor breaches, ATM skimming, point-of-sale vulnerabilities, mobile and internet banking attacks, supply-chain compromise — amplified by legacy systems.\n- **Government**: large volumes of sensitive information under slow approval processes, legacy technology, and complex regulation — with **CMMC** (tiered maturity for the defense supply chain), **DoD Impact Levels** (sensitivity-based classification driving cloud-provider selection), **FedRAMP** (cloud security for federal use, built in part on NIST SP 800-53), and **FISMA** (federal information-security programs) as the operative programs.\n- **Healthcare**: highly sensitive patient information on outdated and legacy medical systems where device patching and OS upgrades are genuinely hard, HIPAA's financial and criminal penalty exposure, and **HITRUST CSF** as the industry's harmonization of HIPAA, NIST, ISO, and PCI DSS.\n\n**The posture is literacy, verified.**\n\n- I can explain the difference between a law or regulation, a compliance standard, and a security framework; match FERPA, GLBA, HIPAA, PCI DSS, and SOX to the industries and data they protect; explain the purpose of CIS, CCM, COSO, COBIT, ISO 27000, MITRE ATT&CK, and NIST CSF; identify CMMC, FedRAMP, FISMA, and DoD Impact Levels; and explain why finance, government, and healthcare are heavily regulated — while holding the two closing commitments: **compliant does not automatically mean secure**, and effective security combines compliance requirements with established frameworks and best practice.\n\n## How to Read This\n\nThis record closes **The Security Program** section of the journal — the external-obligations frame around [Creating a Security Program: Risk Before Tools](security-program.html), [Policies: What Must Be Achieved, in Writing](policies.html), and [Standards and Procedures](standards-and-procedures.html). It is grounded in the Industry Compliance Standards and Frameworks chapter of the *Defensive Security Handbook* (Brotherston, Berlin, and Reyor), which is deliberately a literacy chapter: its checklist tests what the responsible executive can explain, match, and distinguish — because compliance failures usually start as category confusion at the top. The full working checklist — core concepts, the regulation map, the framework shelf, the regulated industries, and the final review — lives in the **Checklist** tab; the management summary is in the **TL;DR** tab and the conversation in the **Conversation** tab.\n\n## Rationale\n\n**The floor is not the building.** Compliance standards are negotiated minimums — the least an industry could agree that everyone must do, ratified on the timescale of regulation while attackers iterate on the timescale of weeks. That is why the chapter's very first item is that compliance standards are minimum requirements, and why an organization can hold every certificate and still be soft: the standard cannot anticipate our architecture, our threat model, or this quarter's attacker technique. I fund the program to the risk, and let compliance fall out of a program built honestly — never the reverse.\n\n![Comparison of a bare compliance floor with a certificate versus a full security program built on top of the same floor.](assets/images/compliance/floor-is-not-the-building.jpeg)\n**Figure 3:** *The floor is not the building: an organization can hold every certificate and still be soft — the program is what gets built on top of the mandatory minimum.*\n\n**Category confusion at the top becomes control failure at the bottom.** A law binds us whether we like it or not; a compliance standard operationalizes the law into auditable requirements; a security framework is a structure we *choose* because it helps us build. When an executive blurs these — treating a framework as if it were mandatory, or a passed audit as if it were protection — budgets flow to attestation instead of defense, and the security team optimizes for the assessor instead of the adversary. Keeping the three layers straight is not pedantry; it is what lets me say precisely which obligations are non-negotiable and which structures are instruments.\n\n**The data-to-regulation map is the executive's minimum viable competence.** Student records mean FERPA; nonpublic personal information means GLBA; ePHI means HIPAA; cardholder data means PCI DSS; the controls behind financial reporting mean SOX. Each mapping carries its own enforcement reality — FTC and banking regulators for GLBA, HHS for HIPAA, the card brands' ability to switch off processing for PCI DSS, auditor-verified controls for SOX — and its own texture, like HIPAA's required-versus-addressable distinction or FERPA's thin cybersecurity specifics. An executive who cannot make these mappings from memory cannot triage a breach, scope an audit, or evaluate an acquisition.\n\n**Frameworks are chosen instruments, and each does a different job.** The chapter's shelf is not a menu of equivalents. CIS tells a hardening engineer what good looks like on a specific system; the CCM maps cloud controls to the compliance standards that demand them; COSO and COBIT speak the language of boards and auditors; ISO 27001 turns security management into a certifiable system; ATT&CK describes what adversaries actually do; NIST CSF gives the whole program a common risk language through its Core, Profiles, and Tiers. Knowing which instrument answers which question — and that HITRUST exists precisely because healthcare needed several harmonized at once — is what separates using frameworks from collecting them.\n\n**Regulated industries carry structural risk, not just paperwork.** Finance is heavily regulated because the attack list — account takeover, processor breaches, skimming, supply-chain compromise — is a standing business model, running on legacy systems that raise the risk further. Government carries sensitive data through slow approvals and old technology, which is why FedRAMP, FISMA, CMMC, and impact levels exist at all. Healthcare runs life-critical devices that cannot be patched on a normal cadence, holding data whose breach is uniquely damaging. Understanding *why* the regulation exists tells me where the real risk concentrates — and where a merely compliant posture will fail first.\n\n**The audit is an output, not an objective.** Everything this record demands — the mappings, the framework fluency, the industry context — exists so that compliance evidence is a by-product of a real program, produced on request, rather than a deliverable manufactured annually. The chapter's closing self-test is written in the first person — *I can explain, I can match, I understand* — because this literacy cannot be delegated to the compliance function. Compliance officers coordinate; the executive must still comprehend.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Compliance standards are minimum requirements — the floor of the program. | Compliance is optional or unimportant — the floor is mandatory; it is just not the building. |\n| For every regulated data type we hold, we name the governing regulation and its enforcement. | We hold every regulation's full text in our heads — counsel interprets statutes; we own the map. |\n| Regulatory standards and security frameworks are distinct instruments, never blurred. | Frameworks are bureaucracy — a chosen framework is how the program gets structure and a common language. |\n| Frameworks are selected by the job: CIS to harden, CCM for cloud, ISO 27001 to certify, ATT&CK for adversary behavior, NIST CSF for risk language. | We adopt every framework on the shelf — collecting frameworks is attestation theater with extra steps. |\n| Regulated-industry risk is understood structurally — legacy finance systems, unpatchable medical devices, slow government approvals. | Regulated means secure — the most regulated industries carry some of the oldest and softest infrastructure. |\n| Being compliant is never mistaken for being secure. | Audits are adversarial theater to be gamed — evidence flows honestly from a real program. |\n| The literacy is the executive's own — explain, match, distinguish. | Compliance work is centralized in one heroic officer — they coordinate; accountability stays with the executive. |\n\nConcretely: for every system and dataset in my organization, I expect one answer to *\"which regulation governs this data, and which framework control satisfies it?\"* — and in every audit and budget conversation, the sentence *\"we are compliant\"* is required to be followed by the evidence that we are also secure.\n\n## Anti-Patterns\n\n- **The certificate as strategy.** The security roadmap is the audit calendar; the program does exactly what the assessor checks and nothing the attacker does.\n- **Compliant and soft.** Every attestation current, while unmonitored legacy systems, flat networks, and unmanaged data stores sit outside the audited scope — the exact state the chapter's first checklist item warns about.\n- **The blurred map.** Frameworks treated as laws, standards treated as suggestions — budget flows to whatever document was most recently confused with an obligation.\n- **The framework collector.** ISO, NIST, COBIT, and CIS all \"adopted,\" none operationalized — four vocabularies, zero controls improved.\n- **The unmapped data store.** Cardholder data, health records, or NPI discovered in a system nobody scoped — the regulation applied all along; only the awareness was missing.\n- **The delegated brain.** Executives who cannot distinguish a regulation from a framework and route every question to the compliance officer — coordination mistaken for accountability.\n- **The annual evidence factory.** Screenshots, exports, and policies manufactured in the weeks before the assessment, describing an organization that exists only during audit season.\n- **Regulated-equals-secure.** Assuming a bank, hospital, or agency partner is safe because it is regulated — the industries with the heaviest rules run some of the oldest systems.\n\n## Related Records\n\n- [Creating a Security Program: Risk Before Tools](security-program.html) — the program that compliance attests; this record keeps the attestation from being mistaken for the program.\n- [Policies: What Must Be Achieved, in Writing](policies.html) — where compliance obligations become organizational rules with management endorsement.\n- [Standards and Procedures](standards-and-procedures.html) — the documentation layer that must be producible in any audit or compliance review.\n- [Asset Management and Documentation](asset-management.html) — you cannot map data to regulations until you know where the data lives; scope starts there.\n- [Cloud Infrastructure](cloud-infrastructure.html) — where CCM, FedRAMP, and impact-level thinking land on real infrastructure.\n- [Logging and Monitoring](logging-and-monitoring.html) — audit trails and monitoring are recurring control requirements across GLBA, HIPAA, PCI DSS, and SOX.\n- [Vulnerability Management](vulnerability-management.html) — the discipline that keeps the gap between compliant and secure visibly measured.\n\n## Scope and Revisiting\n\nThis record is `draft`. It applies to every executive and leader in my organization who owns systems or data touched by regulation, and as the literacy bar for compliance conversations at my level. I revisit it if the regulatory map changes materially (new obligations, new jurisdictions, or an acquisition bringing regulated data types we have not held before), if an audit or breach reveals regulated data outside the mapped scope (the unmapped-data-store anti-pattern occurring in practice), or if the framework shelf shifts — a major revision of NIST CSF, ISO 27001, or PCI DSS that changes what the instruments do.\n\n## Authoritative References\n\n- *Defensive Security Handbook*, 2nd edition (Lee Brotherston, Amanda Berlin, William F. Reyor III; O'Reilly) — the Industry Compliance Standards and Frameworks chapter, whose checklist (including the final review) this record distills.\n- The regulations the chapter maps: FERPA, GLBA, HIPAA, PCI DSS (PCI Security Standards Council), and SOX (Sections 302 and 404).\n- The frameworks and programs the chapter names: CIS benchmarks, CSA Cloud Controls Matrix, COSO, COBIT (ISACA), the ISO 27000 series (27001–27006), MITRE ATT&CK, NIST CSF, NIST SP 800-53, CMMC, DoD Impact Levels, FedRAMP, FISMA, and HITRUST CSF.\n"}]}, {"key": "summary", "label": "TL;DR", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "My organization treats compliance as the floor, never the program. **Compliance standards are minimum requirements** — an organization can be fully compliant and still be weak — so the map layers stay straight: laws and regulations bind us, compliance standards operationalize them, and security frameworks are the instruments we choose to actually build with. For every regulated data type we hold, we can name the regulation that governs it and the enforcement behind it. The test the posture is held to: being compliant is never mistaken for being secure.\n\n**What changes**\n\n* **Every regulated data type gets a named regulation.** Student records map to FERPA, nonpublic personal information to GLBA, ePHI to HIPAA, cardholder data to PCI DSS, financial-reporting controls to SOX — each with its enforcement reality, from banking regulators and HHS to the card brands' power to switch off processing.\n* **Frameworks are chosen by the job, not collected.** CIS to harden systems, CSA's Cloud Controls Matrix for cloud mapped to compliance standards, COSO and COBIT for the board-and-auditor layer, ISO 27001 for a certifiable ISMS, MITRE ATT&CK for adversary behavior, NIST CSF — Core, Profiles, Tiers — for the program's common risk language.\n* **Regulated industries are read structurally.** Finance's standing attack list on legacy systems, government's sensitive data behind slow approvals (CMMC, DoD Impact Levels, FedRAMP on NIST SP 800-53, FISMA), healthcare's unpatchable devices and HITRUST's harmonization of HIPAA, NIST, ISO, and PCI DSS — the regulation exists where the risk concentrates.\n* **The literacy stays with the executive.** Compliance officers coordinate, but the chapter's final review is written in the first person — I can explain, match, and distinguish — because category confusion at the top becomes control failure at the bottom.\n* **Audit evidence becomes a by-product.** With the mappings and frameworks operationalized, an audit is retrieval from a real program, not an annual evidence factory.\n\n**What it costs**\n\n* Real study: the regulation map and framework shelf must be genuinely learned at the leadership level, not delegated away.\n* Double bookkeeping by design: tracking the gap between compliant and secure means funding controls no assessor asked for.\n* Scope discipline: keeping regulated data mapped requires standing effort with asset inventory, not a pre-audit sprint.\n\n**What we are not doing**\n\n* Not treating compliance as optional — the floor is mandatory; it is just not the building.\n* Not building the security program here — that is [Creating a Security Program: Risk Before Tools](security-program.html); the documents that face the audit are [Policies: What Must Be Achieved, in Writing](policies.html) and [Standards and Procedures](standards-and-procedures.html).\n* Not issuing legal opinions — counsel interprets statutes; this record owns the executive map, with data location owned by [Asset Management and Documentation](asset-management.html).\n\n*The Article tab carries the rationale and anti-patterns; the Checklist tab carries the full literacy checklist, from core concepts through the final review. Grounded in the Industry Compliance Standards and Frameworks chapter of the* Defensive Security Handbook*.*\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record — the compliance and framework literacy bar, from core concepts through the regulation map, the framework shelf, the regulated industries, and the final review, from the Industry Compliance Standards and Frameworks chapter of the* Defensive Security Handbook*. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Core Compliance Concepts\n\n- [ ] Understand that **compliance standards are minimum requirements**, not complete security programs\n- [ ] Know that an organization can be compliant and still have security weaknesses\n- [ ] Understand the difference between **regulatory compliance standards** and **security frameworks**\n- [ ] Remember that compliance requirements can vary by industry, country, and governing body\n- [ ] Recognize the role of compliance officers in coordinating regulatory requirements\n- [ ] Understand that compliance requirements may involve administrative, technical, and physical controls\n\n## 2. Industry Compliance Standards\n\n### FERPA — Family Educational Rights and Privacy Act\n\n- [ ] Know that FERPA protects the privacy of **student education records**\n- [ ] Know that it applies to educational institutions, including higher education\n- [ ] Understand the distinction between **education records** and **directory information**\n- [ ] Know that personally identifiable information (PII) generally requires authorization before disclosure\n- [ ] Understand that consent should identify:\n  - [ ] Information being disclosed\n  - [ ] Reason for disclosure\n  - [ ] Parties receiving the information\n- [ ] Recognize examples of education records:\n  - [ ] Transcripts\n  - [ ] GPA\n  - [ ] Grades\n  - [ ] Social Security numbers\n  - [ ] Academic evaluations\n- [ ] Remember that FERPA contains relatively limited specific cybersecurity requirements\n\n### GLBA — Gramm-Leach-Bliley Act\n\n- [ ] Know that GLBA applies primarily to **financial institutions**\n- [ ] Understand that GLBA protects **nonpublic personal information (NPI)**\n- [ ] Know that financial institutions have an ongoing obligation to protect customer privacy and confidentiality\n- [ ] Understand that GLBA requires administrative, technical, and physical safeguards\n- [ ] Review important GLBA security controls:\n  - [ ] Access controls\n  - [ ] Audit trails\n  - [ ] Change management\n  - [ ] Disposal procedures\n  - [ ] Encryption\n  - [ ] Multi-factor authentication\n  - [ ] Secure development practices\n  - [ ] Protection of sensitive customer information\n  - [ ] System inventory\n  - [ ] System monitoring\n  - [ ] Third-party standards and frameworks\n  - [ ] Written risk assessments\n- [ ] Understand that third-party service providers may also be required to comply\n- [ ] Know that enforcement may involve the FTC, FDIC, Federal Reserve, OCC, and other regulators\n- [ ] Recognize that violations can result in fines and remediation requirements\n\n### HIPAA — Health Insurance Portability and Accountability Act\n\n- [ ] Know that HIPAA protects **electronic protected health information (ePHI)**\n- [ ] Identify covered organizations:\n  - [ ] Healthcare providers\n  - [ ] Health plans\n  - [ ] Healthcare clearinghouses\n- [ ] Know that HIPAA requirements are divided into:\n  - [ ] Administrative safeguards\n  - [ ] Physical safeguards\n  - [ ] Technical safeguards\n  - [ ] Policies and procedures\n  - [ ] Documentation requirements\n- [ ] Understand the difference between **required** and **addressable** implementation specifications\n- [ ] Know that organizations should perform a **risk assessment** and mitigate identified risks\n- [ ] Understand that HIPAA violations and breaches may need to be reported to HHS and, in some cases, the FTC\n- [ ] Recognize that HIPAA violations can result in civil and criminal penalties\n\n### PCI DSS — Payment Card Industry Data Security Standard\n\n- [ ] Know that PCI DSS protects **payment card and cardholder data**\n- [ ] Know that it applies to organizations that store, process, or transmit payment card information\n- [ ] Understand that PCI DSS is required by major payment card brands\n- [ ] Know that PCI DSS is administered by the **PCI Security Standards Council (PCI SSC)**\n- [ ] Identify cardholder data examples:\n  - [ ] Primary account number (PAN)\n  - [ ] Cardholder name\n  - [ ] Expiration date\n  - [ ] Service code\n- [ ] Understand that PCI DSS is intended to reduce payment-card fraud and strengthen cardholder-data security\n- [ ] Recognize that failure to validate compliance can result in fines, penalties, or loss of card-processing capability\n\n### SOX — Sarbanes-Oxley Act\n\n- [ ] Know that SOX was enacted in **2002**\n- [ ] Understand that SOX focuses on corporate governance and financial reporting\n- [ ] Know that it applies primarily to U.S. public companies and public accounting firms\n- [ ] Understand the cybersecurity relevance of:\n  - [ ] **Section 302**\n  - [ ] **Section 404**\n- [ ] Know that Section 302 requires safeguards to help ensure accurate financial reporting\n- [ ] Know that Section 404 requires controls to be independently verifiable by auditors\n- [ ] Understand that security-related weaknesses affecting financial information may need to be disclosed\n- [ ] Recognize that organizations commonly use **COSO** or **COBIT** to support SOX compliance\n\n## 3. Security Frameworks\n\n### CIS — Center for Internet Security\n\n- [ ] Know that CIS provides cybersecurity benchmarks and system-hardening guidance\n- [ ] Recognize that CIS provides resources for securing operating systems and applications\n- [ ] Understand that CIS materials can complement NIST and other frameworks\n\n### CCM — Cloud Controls Matrix\n\n- [ ] Know that CCM is maintained by the **Cloud Security Alliance (CSA)**\n- [ ] Understand that CCM is designed specifically for **cloud security**\n- [ ] Know that it maps cloud security concerns and practices to major compliance standards\n- [ ] Understand that CCM controls are organized into multiple security domains\n\n### COSO — Committee of Sponsoring Organizations of the Treadway Commission\n\n- [ ] Know that COSO provides guidance related to:\n  - [ ] Enterprise risk management\n  - [ ] Internal controls\n  - [ ] Fraud deterrence\n- [ ] Recognize that COSO is commonly associated with SOX compliance\n\n### COBIT — Control Objectives for Information and Related Technologies\n\n- [ ] Know that COBIT was developed by **ISACA**\n- [ ] Understand that COBIT helps organizations with governance, documentation, implementation, and compliance\n- [ ] Know the major COBIT domains:\n  - [ ] Plan and Organize\n  - [ ] Acquire and Implement\n  - [ ] Deliver and Support\n  - [ ] Monitor and Evaluate\n- [ ] Recognize that COBIT can align with more detailed security standards and frameworks\n\n### ISO 27000 Series\n\n- [ ] Know that the ISO 27000 series focuses on **information security management**\n- [ ] Know the purpose of major standards:\n  - [ ] **ISO 27001** — Requirements for establishing, implementing, maintaining, and continually improving an ISMS\n  - [ ] **ISO 27002** — Information security management guidelines and principles\n  - [ ] **ISO 27003** — ISMS implementation guidance\n  - [ ] **ISO 27004** — Security measurement and assessment guidance\n  - [ ] **ISO 27005** — Information security risk management guidance\n  - [ ] **ISO 27006** — Requirements for organizations that audit and certify ISMSs\n- [ ] Understand the purpose of an **Information Security Management System (ISMS)**\n\n### MITRE ATT&CK\n\n- [ ] Know that MITRE ATT&CK documents common adversary:\n  - [ ] Tactics\n  - [ ] Techniques\n  - [ ] Procedures\n- [ ] Understand that it is used by both offensive and defensive security teams\n- [ ] Know that ATT&CK covers areas such as:\n  - [ ] Enterprise systems\n  - [ ] Cloud platforms\n  - [ ] Mobile devices\n  - [ ] Industrial control systems\n- [ ] Understand that ATT&CK helps improve threat detection and defense capabilities\n\n### NIST Cybersecurity Framework — NIST CSF\n\n- [ ] Know that NIST is part of the **U.S. Department of Commerce**\n- [ ] Understand that the CSF provides guidance for managing cybersecurity risk\n- [ ] Know the three major CSF components discussed in the chapter:\n  - [ ] Framework Core\n  - [ ] Framework Profiles\n  - [ ] Framework Implementation Tiers\n- [ ] Understand that the Core describes cybersecurity activities and outcomes\n- [ ] Understand that Profiles help identify and prioritize cybersecurity improvements\n- [ ] Understand that Implementation Tiers provide context for how an organization manages cybersecurity risk\n\n## 4. Regulated Industries\n\n### Financial Sector\n\n- [ ] Recognize that financial organizations process highly valuable financial and personal data\n- [ ] Identify common financial-sector risks:\n  - [ ] Account takeover\n  - [ ] Third-party payment processor breaches\n  - [ ] ATM skimming\n  - [ ] Point-of-sale vulnerabilities\n  - [ ] Mobile banking attacks\n  - [ ] Internet banking attacks\n  - [ ] Supply-chain compromise\n- [ ] Understand that legacy systems can increase security risk\n\n### Government\n\n- [ ] Understand that government agencies handle large amounts of highly sensitive information\n- [ ] Recognize challenges such as:\n  - [ ] Slow approval processes\n  - [ ] Legacy technology\n  - [ ] Difficulty adopting new security controls\n  - [ ] Complex regulations\n- [ ] Know important U.S. government cybersecurity requirements and programs\n- **CMMC — Cybersecurity Maturity Model Certification**\n  - [ ] Know that CMMC uses a tiered/maturity-based approach to cybersecurity\n  - [ ] Understand its importance to organizations in the **defense supply chain**\n  - [ ] Recognize its role in evaluating contractors and contractual cybersecurity requirements\n- **DoD Impact Levels**\n  - [ ] Understand that DoD Impact Levels classify information based on sensitivity\n  - [ ] Know that different levels require different security protections\n  - [ ] Recognize their importance when selecting cloud service providers\n- **FedRAMP — Federal Risk and Authorization Management Program**\n  - [ ] Know that FedRAMP provides security requirements for cloud services used by the federal government\n  - [ ] Understand that FedRAMP is based in part on **NIST SP 800-53** controls\n  - [ ] Recognize that cloud service providers must meet government-specific security controls\n- **FISMA — Federal Information Security Management Act**\n  - [ ] Know that FISMA establishes federal information security requirements\n  - [ ] Understand that it covers development, documentation, and implementation of information security programs\n  - [ ] Recognize its influence on cybersecurity practices across government organizations\n\n### Healthcare\n\n- [ ] Understand that healthcare organizations store highly sensitive patient information\n- [ ] Recognize the risks created by outdated and legacy medical systems\n- [ ] Understand that medical-device patching and operating-system upgrades can present additional challenges\n- [ ] Know that HIPAA violations may result in:\n  - [ ] Financial penalties\n  - [ ] Criminal penalties\n  - [ ] Required corrective actions\n- [ ] Understand that healthcare breaches involving PHI can be particularly damaging\n- **HITRUST CSF**\n  - [ ] Know that HITRUST CSF is widely used in the healthcare industry\n  - [ ] Understand that it combines and harmonizes multiple standards and frameworks\n  - [ ] Recognize examples incorporated into HITRUST:\n    - [ ] HIPAA\n    - [ ] NIST\n    - [ ] ISO\n    - [ ] PCI DSS\n\n## 5. Final Review\n\n- [ ] I can explain the difference between a **law/regulation**, a **compliance standard**, and a **security framework**\n- [ ] I can match FERPA, GLBA, HIPAA, PCI DSS, and SOX to the industries/data they protect\n- [ ] I can explain the purpose of CIS, CCM, COSO, COBIT, ISO 27000, MITRE ATT&CK, and NIST CSF\n- [ ] I can identify important government programs such as CMMC, FedRAMP, FISMA, and DoD Impact Levels\n- [ ] I can explain why the financial, government, and healthcare sectors are heavily regulated\n- [ ] I understand that **being compliant does not automatically mean being secure**\n- [ ] I understand that effective security combines compliance requirements with established frameworks and security best practices\n\nWith the final review green, the literacy bar is met — the map layers are straight, every regulated data type has a named regulation, and every framework on the shelf has a known job. The test running through the whole checklist: **is \"we are compliant\" ever being mistaken for \"we are secure\"?**\n"}]}, {"key": "dialog", "label": "Conversation", "meta": {"timetoread": "8 min listen"}, "blocks": [{"type": "markdown", "content": "## The Floor and the Building\n\n**Ben:** Let me start where every compliance conversation actually starts: the invoice. Audits, assessors, evidence collection, certifications — enormous cost, and every breached company of the last decade had a wall of certificates. Why does this journal dignify compliance with a record?\n\n**Ana:** Because the record's first commitment is the exact point you just made. Compliance standards are minimum requirements — the chapter opens with that — and an organization can be fully compliant and still have serious weaknesses. The record exists to hold both truths at once: the floor is mandatory, and the floor is not the building. What it refuses is the confusion in either direction — treating compliance as the security strategy, or sneering at it as pure theater while regulators can fine you and card brands can switch off your payment processing.\n\n**Ben:** \"Floor, not building\" is a nice slogan. What breaks concretely when a company treats the certificate as the strategy?\n\n**Ana:** The roadmap becomes the audit calendar. Budget flows to whatever the assessor checks; the security team optimizes for the auditor instead of the adversary. And the scope boundary becomes the attack surface — every attestation current while the unmonitored legacy system and the flat network sit comfortably outside the audited scope. Compliance standards are negotiated minimums, ratified on the timescale of regulation, while attackers iterate weekly. A standard cannot anticipate your architecture or this quarter's technique. That's structural, not a flaw anyone can fix with a better standard.\n\n## Three Layers of the Map\n\n**Ben:** The record makes a big deal of distinguishing laws, compliance standards, and security frameworks. Executives have compliance officers for taxonomy. Why does the distinction deserve executive attention?\n\n**Ana:** Because category confusion at the top becomes control failure at the bottom. A law binds you whether you like it or not. A compliance standard operationalizes the law into auditable requirements. A framework is a structure you *choose* because it helps you build. Blur those and real money moves wrongly — I've watched organizations treat a framework as if it were legally mandatory and gold-plate it, while an actual regulatory obligation sat unmapped. And the chapter is pointed about the officer question: compliance officers *coordinate* regulatory requirements. The final review is written in the first person — I can explain, I can match, I can distinguish. That literacy can't be delegated, because the delegated brain is how the unmapped data store happens.\n\n**Ben:** The unmapped data store?\n\n**Ana:** Cardholder data or health records discovered in a system nobody scoped. The regulation applied the whole time — only the awareness was missing. That's why the record's practical test is per-dataset: which regulation governs this data, and which framework control satisfies it? You can't answer that without [Asset Management and Documentation](asset-management.html) telling you where the data lives.\n\n**Ben:** Alright, run the map. Convince me the alphabet soup compresses into something an executive can hold.\n\n**Ana:** Five mappings, each with an enforcement reality. Student education records — FERPA, educational institutions, with the honest note that it carries relatively few specific cybersecurity requirements. Nonpublic personal information at financial institutions — GLBA, with a concrete safeguard list from access controls and audit trails through MFA and written risk assessments, enforced by the FTC and the banking regulators, third parties in scope. Electronic protected health information — HIPAA, covering providers, plans, and clearinghouses, with its required-versus-addressable distinction and civil *and* criminal penalties. Cardholder data — PCI DSS, run by the PCI Security Standards Council for the card brands, where failed validation can end in losing card processing entirely. And the controls behind financial reporting — SOX, Sections 302 and 404, where controls must be independently verifiable by auditors. An executive who can't make those five mappings from memory can't triage a breach or scope an acquisition.\n\n## Frameworks Are Instruments\n\n**Ben:** Now the framework shelf — CIS, CCM, COSO, COBIT, ISO 27000, ATT&CK, NIST CSF. Every one has an industry behind it and consultants attached. How is \"know all seven\" not just framework collecting?\n\n**Ana:** Because the record's point is that they're different instruments for different jobs, not seven flavors of the same thing. CIS tells a hardening engineer what good looks like on a specific operating system. The Cloud Controls Matrix maps cloud controls to the compliance standards that demand them. COSO and COBIT speak the board-and-auditor language — which is why they show up supporting SOX. ISO 27001 turns security management into a certifiable system, with 27002 through 27006 around it. ATT&CK documents what adversaries actually do — tactics, techniques, procedures across enterprise, cloud, mobile, and industrial systems. And NIST CSF gives the whole program one risk language through the Core, Profiles, and Implementation Tiers. The anti-pattern is the framework collector — ISO, NIST, COBIT, and CIS all \"adopted,\" none operationalized: four vocabularies, zero controls improved.\n\n**Ben:** So the executive skill is matching the question to the instrument.\n\n**Ana:** Exactly. \"How do I harden this server?\" is a CIS question. \"How do I explain our risk posture to the board?\" is CSF. \"What will the attacker do after initial access?\" is ATT&CK. And healthcare's HITRUST exists precisely because that industry needed HIPAA, NIST, ISO, and PCI DSS harmonized into one framework rather than juggled separately. Frameworks are how the floor becomes a program — chosen, not collected.\n\n## Regulated Industries and the Honest Close\n\n**Ben:** The regulated-industries section could have been a paragraph: finance, government, healthcare — heavily regulated, lots of paperwork. Why does it get structural treatment?\n\n**Ana:** Because understanding *why* the regulation exists tells you where a merely compliant posture fails first. Finance is regulated because the attack list is a standing business model — account takeover, third-party processor breaches, skimming, point-of-sale, mobile and internet banking, supply-chain compromise — running on legacy systems that amplify all of it. Government holds enormous volumes of sensitive data behind slow approvals and old technology, which is exactly why the program stack exists: FISMA for federal security programs, FedRAMP built partly on NIST SP 800-53 for cloud, CMMC's maturity tiers for the defense supply chain, DoD Impact Levels driving cloud-provider selection. Healthcare runs life-critical devices that can't be patched on a normal cadence, holding data whose breach is uniquely damaging, under HIPAA's penalty exposure.\n\n**Ben:** There's an uncomfortable inversion in there: the most regulated industries run some of the oldest, softest infrastructure.\n\n**Ana:** The record names it as an anti-pattern — regulated-equals-secure. Assuming a bank or hospital partner is safe *because* it's regulated gets the causality backwards: the regulation exists because the risk concentrates there. Which is also the strongest evidence for the record's whole thesis — decades of mandatory floors did not build the buildings.\n\n**Ben:** Then what does the audit look like when an organization actually lives this record?\n\n**Ana:** Boring, in the best way. The evidence is a by-product of a real program, produced on request — not the annual evidence factory manufacturing screenshots that describe an organization that only exists during audit season. And in every budget and board conversation, one sentence discipline: \"we are compliant\" must always be followed by the evidence that we are also secure.\n\n**Ben:** Then here's my concession. Compliance isn't the enemy of security and it isn't the substitute for it — it's the floor, and the executive's job is threefold: keep the map layers straight, name the regulation behind every regulated byte we hold, and pick frameworks the way an engineer picks tools. And never let a certificate finish a sentence that should end with evidence.\n\n**Ana:** That's the record in one line — and the chapter's own closing words say it best: being compliant does not automatically mean being secure. Effective security combines the compliance requirements with established frameworks and actual practice. The certificate hangs on the wall of the building; it was never the building.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why compliance is the floor of a security program and never the program itself — in nine panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NADIA: a hands-on defensive-security lead, shoulder-length dark hair tied back, navy utility jacket over a plain shirt, an access badge on a lanyard, laptop with a padlock sticker under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and green accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: a wall of framed certificates while a burglar walks through an open back door into dusty servers.](assets/images/compliance/comic-01-compliant-and-soft.jpeg)\n**Panel 1:** *The hook: every attestation current, and the back door open — an organization can hold every certificate and still be soft. Compliant and weak is a real state.*\n\n![Comic panel: a committee slowly chisels a stone tablet labeled standard while an attacker on a rocket scooter zips past the window.](assets/images/compliance/comic-02-negotiated-minimums.jpeg)\n**Panel 2:** *The problem: compliance standards are negotiated minimums — the least an industry could agree everyone must do, ratified at the speed of regulation while attackers iterate at the speed of weeks.*\n\n![Comic panel: a team feeds manufactured evidence on a conveyor belt to an assessor while the roadmap wall is just an audit calendar.](assets/images/compliance/comic-03-the-audit-calendar.jpeg)\n**Panel 3:** *The wrong way: the certificate as strategy. The roadmap becomes the audit calendar, evidence is manufactured annually, and the team optimizes for the assessor instead of the adversary.*\n\n![Comic panel: Vera stands on a slab labeled compliance the floor beneath a rising structure labeled the program that Nadia builds.](assets/images/compliance/comic-04-floor-not-building.jpeg)\n**Panel 4:** *The principle: compliance is the floor, never the program. The floor is mandatory — but the program is built to the risk, and compliance falls out of a program built honestly, never the reverse.*\n\n![Comic panel: Nadia holds three transparent map layers labeled laws bind us, standards operationalize, frameworks we choose.](assets/images/compliance/comic-05-three-map-layers.jpeg)\n**Panel 5:** *Keep the map layers straight: laws and regulations bind us, compliance standards operationalize them into auditable requirements, and frameworks are instruments we choose in order to build — blur them and budget flows to attestation instead of defense.*\n\n![Comic panel: Vera draws matching lines from data icons to regulation badges FERPA, GLBA, HIPAA, PCI DSS, and SOX.](assets/images/compliance/comic-06-data-to-regulation.jpeg)\n**Panel 6:** *The executive's minimum viable competence: student records mean FERPA, nonpublic personal information means GLBA, ePHI means HIPAA, cardholder data means PCI DSS, financial-reporting controls mean SOX — each with its own enforcement behind it.*\n\n![Comic panel: Nadia hands out tools from a wall of frameworks labeled CIS, CCM, ISO 27001, ATT&CK, and NIST CSF.](assets/images/compliance/comic-07-the-instrument-shelf.jpeg)\n**Panel 7:** *Frameworks are how the floor becomes a program — CIS to harden, CCM for cloud, ISO 27001 to certify, ATT&CK for adversary behavior, NIST CSF for a common risk language. Using instruments, not collecting them.*\n\n![Comic panel: a bank, government office, and hospital wrapped in regulation ribbons, each atop a basement of ancient machines.](assets/images/compliance/comic-08-regulated-and-legacy.jpeg)\n**Panel 8:** *Regulated does not mean secure: finance, government, and healthcare carry the heaviest rules and some of the oldest, softest infrastructure — understanding why the regulation exists shows where a merely compliant posture fails first.*\n\n![Comic panel: a manager says we are compliant while Vera asks for evidence of secure and Nadia brings real charts.](assets/images/compliance/comic-09-compliant-and-secure.jpeg)\n**Panel 9:** *The closer: being compliant is never mistaken for being secure — in every audit and budget conversation, 'we are compliant' must be followed by the evidence that we are also secure.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
