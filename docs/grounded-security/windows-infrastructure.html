<script id="data" type="application/json">{"meta": {"id": "SEC-WINDOWS-INFRASTRUCTURE", "status": "draft:gray", "title": "Microsoft Windows Infrastructure", "date": "2026-08-22", "author": "Željko Obrenović", "permalink": "windows-infrastructure", "timetoread": "8 min", "excerpt": "My organization runs its Windows estate as one security system, not a fleet of servers — and the real boundary of that system is the Active Directory forest, not the domain. Nothing unsupported stays on the network without an approved exception and isolation; patching is centrally managed for Windows and the third-party software attackers actually exploit; domain controllers are treated as the crown jewels — dedicated, physically secured, and covered by a tested compromise-recovery plan; privilege is minimized, individually attributable, and monitored, with unique local administrator passwords and no shared accounts; and the security baseline is enforced through Group Policy, not documented in a binder. The test I hold the estate to: every privileged action is attributable to a named person, and a compromised domain controller has a documented, tested path back.", "tags": "windows, active directory, domain controllers, group policy, privileged access, LAPS, service accounts, patching, hardening, security baselines", "icon": "assets/icons/windows-infrastructure.png", "logo": "assets/images/windows-infrastructure/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["windows", "active directory", "domain controllers", "group policy", "privileged access", "LAPS", "service accounts", "patching", "hardening", "security baselines"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: My organization runs its Windows estate as **one security system, not a fleet of servers** — and the real boundary of that system is the **Active Directory forest**, not the domain. **Nothing unsupported stays on the network without an approved exception and isolation**; patching is centrally managed for Windows *and* the third-party software attackers actually exploit; **domain controllers are the crown jewels** — dedicated, physically secured, never dual-purpose, with a tested plan for their compromise; **privilege is minimized, individually attributable, and monitored** — unique local administrator passwords on every endpoint, dedicated non-interactive service accounts, no shared identities; and **the security baseline is enforced through Group Policy**, built on recognized baselines, so a machine cannot drift out of it unnoticed. The test I hold the estate to: **every privileged action is attributable to a named person, and a compromised domain controller has a documented, tested path back**.\n\n## Statement\n\nThis is the bar I hold my organization's Windows infrastructure to, from the oldest legacy box to the forest root.\n\n**Nothing unsupported without an owner and an exception.**\n\n- Unsupported Windows versions are upgraded; systems that cannot be upgraded because of legacy or vendor-dependent applications are **identified, removed where possible, and isolated on dedicated VLANs or an air-gapped network where not**; their business risk is documented, communicated to business and technical stakeholders, and paired with a replacement or migration plan.\n\n**Patching is central — and covers what attackers actually exploit.**\n\n- A centralized update platform (WSUS, Configuration Manager, or equivalent) applies Windows security updates promptly **and patches the commonly exploited third-party software** — browsers, Java, PDF applications. Installed software is inventoried, the unnecessary removed, the unpatchable tracked and wrapped in compensating controls.\n\n**Shares expose only what they must.**\n\n- SMB and file shares are inventoried, scanned for unexpected exposure, reviewed for sensitive information, and pruned; permissions — **both share and NTFS** — are restricted to the users and groups that need them, and re-audited periodically.\n\n**The forest is the security boundary; domains are containers.**\n\n- The Active Directory forest is treated as a major security boundary; **individual domains are not** — they are structural and administrative containers, and directory information is assumed queryable by any authenticated account. Every cross-forest and cross-domain trust is documented, understood by stakeholders, and minimized: unneeded trusts removed, one-way trusts preferred, SID filtering and selective authentication applied where warranted, and hybrid or cloud-connected directories covered by appropriate authentication controls.\n\n![Diagram of an Active Directory forest as the solid security boundary, domains as dashed containers inside it, and a single documented one-way trust to another forest.](assets/images/windows-infrastructure/forest-security-boundary.jpeg)\n**Figure 1:** *The forest is the boundary; domains are containers — and every trust is a documented, minimized gate through that boundary.*\n\n**Domain controllers are the crown jewels.**\n\n- Domain controllers are **dedicated, high-value assets** — never workstations, never dual-purpose servers. Physical access is restricted (dedicated racks or cages; read-only domain controllers for less secure locations, still physically protected); TPM and drive encryption protect their storage; interactive logons and administrative access are restricted; and **a documented response and recovery plan exists for their compromise** — with the honest understanding that a serious one may mean rebuilding the forest.\n\n**Directory structure serves administration and policy — nothing else.**\n\n- FSMO role placement is documented, deliberate, reviewed after infrastructure changes, and covered by transfer/seizure procedures. OUs are designed around clear administrative and policy requirements, delegate rights at the right scope, and are pruned of obsolete containers and privileges. Group nesting follows a consistent model — users into global groups, global into domain local, domain local onto resource ACLs, universal groups where multi-domain reach requires — with stale and unresolved SIDs cleaned up.\n\n**Privilege is minimized, dedicated, and attributable.**\n\n- **Domain Admins membership is minimized** and all privileged groups are reviewed; nobody keeps permanent admin rights they do not require, and no application gets administrator access because that is easier than determining what it actually needs. Privileged activity is logged and monitored, and administrators use separate admin and normal-user accounts.\n- **Service accounts are dedicated, least-privileged, non-interactive**, consistently named, documented, monitored, and removed when no longer required.\n- **Local administrator passwords are unique and managed** — Microsoft LAPS or an equivalent approved solution — with retrieval restricted, use audited, and exempt systems reviewed.\n- **Shared accounts are eliminated wherever possible**; the unavoidable ones are documented with their business justification, closely monitored, and periodically re-challenged.\n\n**The baseline is enforced through Group Policy.**\n\n- Windows security settings are centrally enforced through GPOs that are named to a standard, documented, tested before broad deployment, minimized against conflict, and permission-restricted. **Recognized security baselines — applicable NIST or Microsoft recommendations — are the starting point**; legacy protocols and weak settings are disabled through policy; core protections are duplicated in local policy so a machine temporarily off the domain stays protected; and GPOs are audited regularly for obsolete or duplicate settings.\n- **New systems land managed**: newly joined computers are redirected out of default containers into controlled OUs, receive baseline GPOs immediately, and their placement and policy application are verified.\n\n**The estate is watched — and recoverable.**\n\n- Windows and Active Directory security logging is enabled and collected centrally; privileged accounts, privileged-group changes, unusual authentication, trust changes, GPO changes, service-account activity, and unusual SMB access are monitored — and **logs are reviewed, not just collected**.\n- Physical access to critical Windows infrastructure is restricted; **tested backups of Active Directory exist, restoration is exercised regularly, recovery procedures assume privileged credentials are compromised, and backup systems are protected from ordinary administrative compromise**. Current network and AD architecture documentation is maintained.\n\n## How to Read This\n\nThis record sits in the **Hardening the Estate** section, between [Physical Security](physical-security.html) — which protects the rooms and racks the domain controllers live in — and [Unix Application Servers](unix-servers.html) and [Endpoints](endpoints.html), which harden the rest of the fleet. It is grounded in the Microsoft Windows Infrastructure chapter of the *Defensive Security Handbook* (Brotherston, Berlin, Reyor). The chapter is necessarily concrete — Active Directory, Group Policy, LAPS, FSMO roles — and the **Checklist** tab keeps every one of those specifics verbatim; this article states the commitments at the capability level, with the Microsoft mechanisms as the worked example, because the commitments (one boundary, crown-jewel controllers, attributable privilege, enforced baselines) would hold under any directory-centered estate. The management summary lives in the **TL;DR** tab and the conversation in the **Conversation** tab.\n\n## Rationale\n\n**A Windows estate is one system, and attackers treat it that way.** Active Directory connects every machine to every other through authentication, trust, and policy — which means the estate's real attack surface is the graph, not the individual servers. An attacker who lands on one workstation walks the graph: shared local admin passwords, over-privileged service accounts, forgotten trusts, writable shares. That is why this record refuses to talk about \"hardening servers\" one at a time and instead fixes the system-level properties — the boundary, the privilege model, the baseline, the watchtower.\n\n![Attack-graph diagram showing lateral-movement paths from one compromised workstation toward the domain controller, each path cut by a specific control.](assets/images/windows-infrastructure/attack-graph-broken-edges.jpeg)\n**Figure 2:** *Attackers walk the graph, not the server list — unique local passwords, least-privileged service accounts, and pruned shares cut the edges.*\n\n**The forest is the boundary because the domain never was.** The chapter is blunt about a mistake organizations keep making: treating domains as security boundaries. Directory information is queryable by any authenticated account, and domain separation alone protects nothing highly sensitive. Accepting that reframes trust management as boundary management: every cross-forest trust is a hole in the perimeter, so each one is documented, justified to stakeholders, made one-way where possible, filtered and restricted where warranted — and removed the moment it stops earning its risk. Hybrid and cloud-connected directories extend the same boundary and get the same scrutiny, which is where this record meets [Cloud Infrastructure](cloud-infrastructure.html) and [Authentication](authentication.html).\n\n**Whoever controls a domain controller controls every account — so it gets crown-jewel treatment.** A domain controller is not a server that happens to be important; it is the root of trust for the entire estate. Hence the absolutes: never a workstation, never dual-purpose, physically secured per [Physical Security](physical-security.html), encrypted at rest, logon-restricted. And hence the most sobering commitment in the record: a documented, tested plan for DC compromise, written with the honest understanding that a serious compromise may mean rebuilding the forest. Planning for that outcome before it happens is the difference between a hard month and an existential one — the estate-level instance of [Disaster Recovery](disaster-recovery.html).\n\n**Privilege minimization is really an attribution guarantee.** Minimal Domain Admins, separate admin accounts, dedicated service accounts, no shared identities, LAPS-managed local passwords — these controls share one purpose: when something privileged happens, a named person did it. Shared accounts destroy attribution; a single reused local administrator password turns one compromised endpoint into all of them; a service account that people also log in with is both. The record does not ask for less administration — it asks that every administrative act have exactly one author, because that is what monitoring, forensics, and accountability all stand on.\n\n**A baseline that is not enforced is a preference.** The difference between a hardening standard in a binder and a GPO is that the GPO wins arguments automatically: machines drift back to the baseline instead of away from it. Building on recognized baselines — NIST, Microsoft — means not deriving hundreds of settings from first principles; testing GPOs before broad deployment and auditing them for conflicts keeps the enforcement mechanism itself trustworthy; and putting core protections in local policy means a laptop off the domain does not silently shed its armor. The default-container rule is the same idea at birth: a machine should never exist, even briefly, outside the baseline.\n\n![Two-panel comparison of machines drifting away from a binder-documented baseline versus Group Policy pulling machines back onto an enforced baseline.](assets/images/windows-infrastructure/binder-vs-gpo-baseline.jpeg)\n**Figure 3:** *A baseline that is not enforced is a preference: Group Policy wins the argument automatically, pulling drift back instead of letting it accumulate.*\n\n**Legacy is a risk decision, not a default.** Every estate has the system that cannot be upgraded — the vendor application, the production line dependency. The record does not pretend these away; it forces them into the open: named, isolated on their own VLANs or air-gapped, their risk documented and communicated to the business, with a migration plan and an approved exception. The unacceptable state is the quiet one — the unsupported machine on the flat network that nobody signed for. [Vulnerability Management](vulnerability-management.html) carries the same exception discipline estate-wide.\n\n**Recovery must assume the credentials are gone.** The final commitments — central logging that is actually reviewed, monitoring of exactly the things attackers change (privileged groups, trusts, GPOs), tested AD backups, and backup systems protected from ordinary administrative compromise — form one argument: the estate must be able to detect the attack that got in and recover from the attack that won. A backup an attacker with admin credentials can encrypt or delete is not a backup; a restoration procedure never exercised is a hope. Detection at this depth feeds [Logging and Monitoring](logging-and-monitoring.html); the recovery discipline is [Disaster Recovery](disaster-recovery.html) applied to the directory itself.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Unsupported systems leave the network, or stay isolated under a documented, approved exception with a migration plan. | Legacy systems are forbidden — they are named, isolated, and owned. |\n| Patching is centrally managed and includes commonly exploited third-party software. | Every patch deploys instantly everywhere — promptness with tracking, not recklessness. |\n| The forest is the security boundary; trusts are documented, minimized, and restricted. | Multi-domain or multi-forest designs are wrong — they must simply be treated as what they are. |\n| Domain controllers are dedicated, physically secured, and covered by a tested compromise-recovery plan. | DCs merely need good passwords — their compromise is planned for, up to forest rebuild. |\n| Privilege is minimized and individually attributable: LAPS, dedicated service accounts, no shared identities. | Administration gets harder — it gets authored; unavoidable shared accounts are documented and monitored. |\n| The baseline is enforced through Group Policy, starting from recognized NIST/Microsoft baselines. | Baselines are adopted wholesale without testing — GPO changes are tested before broad deployment. |\n| Logs are collected centrally and reviewed; AD backups are tested and protected from admin compromise. | Collecting logs is monitoring — unreviewed logs and unexercised restores count as absent. |\n\nConcretely: my organization can produce, on request, the list of unsupported systems and their exceptions, the Domain Admins membership and why each member is there, the trust map, and the date of the last successful AD restoration test. If any of those four takes more than a day to produce, this record is failing in practice.\n\n## Anti-Patterns\n\n- **The dual-purpose domain controller.** The DC that is also the file server, print server, or someone's RDP jump box — the estate's root of trust carrying the estate's everyday attack surface.\n- **The eternal Domain Admin.** Everyone who ever needed elevated rights, still in the group — membership grows monotonically because removal requires a conversation nobody starts.\n- **One password to rule them all.** The same local administrator password on every endpoint; one compromised machine silently becomes all of them. LAPS exists precisely to kill this.\n- **The service account that is a person.** Service accounts used for interactive logons, or admins doing daily work with privileged identities — attribution and least privilege both destroyed in one habit.\n- **The trust nobody remembers.** A bidirectional forest trust created for a migration that finished years ago, undocumented, unfiltered, and quietly extending the security boundary to an estate nobody audits.\n- **The GPO graveyard.** Hundreds of unnamed, undocumented, conflicting GPOs where nobody can predict what a machine actually receives — the enforcement mechanism itself no longer trusted.\n- **The XP machine on the flat network.** The unsupported system everyone knows about and nobody signed for — no isolation, no exception, no owner, no plan.\n- **The backup the attacker can reach.** AD backups administrable with the same credentials the attacker just stole — recoverability that evaporates exactly when it is needed.\n\n## Related Records\n\n- [Physical Security](physical-security.html) — the racks, cages, and remote-office enclosures that make \"restrict physical access to domain controllers\" real.\n- [Unix Application Servers](unix-servers.html) — the same hardening discipline applied to the other half of the server estate.\n- [Endpoints](endpoints.html) — the workstations this infrastructure authenticates and polices; LAPS and baseline GPOs land there.\n- [Authentication](authentication.html) — the identity layer above the directory: password policy, MFA, and credential hygiene.\n- [Vulnerability Management](vulnerability-management.html) — the estate-wide patching, scanning, and exception cadence this record's update discipline plugs into.\n- [Logging and Monitoring](logging-and-monitoring.html) — where the centrally collected AD security logs are actually watched.\n- [Disaster Recovery](disaster-recovery.html) — the tested-restore discipline that DC compromise planning and protected backups instantiate.\n\n## Scope and Revisiting\n\nThis record is `draft`. It applies to every Active Directory forest, domain-joined system, and hybrid directory my organization operates. I revisit it if the directory architecture changes materially (a merger bringing new forests and trusts, a move to cloud-primary identity where the forest stops being the operative boundary), if an audit finds privileged actions that cannot be attributed to a named person (the attribution claim failing in practice), or if an AD restoration test fails or is silently skipped — an untested recovery path is the one failure mode this record refuses to tolerate.\n\n## Authoritative References\n\n- *Defensive Security Handbook*, 2nd edition (Lee Brotherston, Amanda Berlin, and William F. Reyor III) — the Microsoft Windows Infrastructure chapter, whose checklist this record distills.\n- Applicable NIST and Microsoft security baselines and recommendations — named by the chapter as the starting point for Group Policy security settings.\n"}]}, {"key": "summary", "label": "TL;DR", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "My organization runs its Windows estate as **one security system, not a fleet of servers** — and the real boundary of that system is the Active Directory forest, not the domain. Nothing unsupported stays on the network without an approved exception and isolation; patching is central and covers the third-party software attackers actually exploit; domain controllers get crown-jewel treatment with a tested compromise-recovery plan; privilege is minimized and individually attributable; and the security baseline is enforced through Group Policy, not documented in a binder. The test the estate is held to: every privileged action is attributable to a named person, and a compromised domain controller has a documented, tested path back.\n\n**What changes**\n\n* **Legacy becomes a signed risk decision.** Unsupported Windows is upgraded or removed; what must remain is isolated on dedicated VLANs or air-gapped, its business risk documented and communicated, with a migration plan and an approved exception — no quiet XP boxes on the flat network.\n* **File shares stop leaking.** SMB shares are inventoried, scanned for exposure, reviewed for sensitive data, and pruned; share and NTFS permissions are both restricted and periodically re-audited.\n* **The boundary moves to the forest.** Domains are treated as administrative containers, not security boundaries; every cross-forest and cross-domain trust is documented, minimized, made one-way where possible, and restricted with SID filtering and selective authentication where warranted — hybrid directories included.\n* **Domain controllers become crown jewels.** Dedicated, never dual-purpose, physically secured, TPM-backed and encrypted, logon-restricted — with a documented compromise-response plan that honestly contemplates rebuilding the forest.\n* **Privilege becomes attributable.** Domain Admins membership is minimized and reviewed; service accounts are dedicated, least-privileged, and non-interactive; local administrator passwords are unique per machine via LAPS or equivalent; shared accounts are eliminated or documented, monitored, and re-challenged.\n* **The baseline enforces itself.** Group Policy carries the security settings, built from recognized NIST/Microsoft baselines, tested before broad deployment, audited for conflicts — and newly joined machines land in managed OUs with baseline policies applied immediately.\n* **Detection and recovery are exercised.** AD security logs are centrally collected and actually reviewed — privileged activity, group changes, trusts, GPOs, unusual SMB access — and AD backups are tested, restoration rehearsed, and backup systems protected from ordinary administrative compromise.\n\n**What it costs**\n\n* Privilege minimization, LAPS, and separate admin accounts add friction to administration — accepted deliberately, because attribution is what monitoring and forensics stand on.\n* Trust reviews, GPO audits, share re-audits, and restoration tests are standing work on a cadence, not one-time cleanups.\n* Isolating and exception-tracking legacy systems forces uncomfortable conversations with the business — that is the point.\n\n**What we are not doing**\n\n* Not forbidding legacy or multi-forest designs — naming, isolating, and owning them.\n* Not treating this as all of identity — password policy, MFA, and credential hygiene live in [Authentication](authentication.html).\n* Not watching the logs here — central review disciplines live in [Logging and Monitoring](logging-and-monitoring.html), and tested-restore practice in [Disaster Recovery](disaster-recovery.html).\n\n*The Article tab carries the rationale and anti-patterns; the Checklist tab carries the full working checklist and final review. Grounded in the Microsoft Windows Infrastructure chapter of the* Defensive Security Handbook*.*\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "6 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record — the Windows estate from legacy hygiene through Active Directory, privilege, Group Policy, and recovery, ending in the final review. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Windows Endpoint and Server Hygiene\n\n- [ ] Upgrade unsupported Windows operating systems to currently supported versions\n- [ ] Identify systems that cannot be upgraded because of legacy or vendor-dependent applications\n- [ ] Remove unsupported legacy systems from the network whenever possible\n- [ ] If legacy systems must remain online, isolate them on dedicated VLANs or an appropriately air-gapped network\n- [ ] Document the business risk associated with keeping unsupported operating systems\n- [ ] Communicate legacy-system risks to relevant business and technical stakeholders\n- [ ] Maintain a plan for eventual replacement or migration of outdated systems\n\n## 2. Patch and Software Management\n\n- [ ] Use a centralized software-update platform such as WSUS, Configuration Manager, or another approved patch-management solution\n- [ ] Apply Microsoft Windows security updates promptly\n- [ ] Patch commonly exploited third-party software such as browsers, Java, and PDF applications\n- [ ] Maintain an accurate inventory of installed software\n- [ ] Remove software that is unnecessary for business operations\n- [ ] Track systems or applications that cannot be patched normally\n- [ ] Establish compensating security controls for software that must remain outdated\n\n## 3. SMB Shares and File Sharing\n\n- [ ] Inventory SMB/file shares throughout the environment\n- [ ] Scan for unexpectedly open or exposed shares using approved administrative or security tools\n- [ ] Review each share for sensitive information, credentials, trade secrets, PII, or other restricted data\n- [ ] Remove unnecessary shares\n- [ ] Restrict share permissions to only the users and groups that require access\n- [ ] Review both share permissions and NTFS permissions\n- [ ] Periodically re-audit file shares for excessive access\n\n## 4. Active Directory Forest Design\n\n- [ ] Treat the Active Directory forest as a major security boundary\n- [ ] Review the number of forests in the organization and confirm that each is necessary\n- [ ] Document every cross-forest trust\n- [ ] Document every cross-domain trust\n- [ ] Ensure stakeholders understand the security risks introduced by trusts\n- [ ] Remove trusts that are no longer required\n- [ ] Use one-way trusts where appropriate rather than granting unnecessary bidirectional access\n- [ ] Use SID filtering where appropriate\n- [ ] Use selective authentication when stronger trust restrictions are needed\n- [ ] Apply appropriate authentication controls to hybrid or cloud-connected directory environments\n\n## 5. Active Directory Domains\n\n- [ ] Do not treat an individual domain as a true security boundary\n- [ ] Design domains primarily as structural and administrative containers\n- [ ] Assume directory information can be queried by authenticated domain accounts\n- [ ] Avoid relying on domain separation alone to protect highly sensitive information\n- [ ] Review domain structure periodically as the organization changes\n\n## 6. Domain Controllers\n\n- [ ] Treat domain controllers as high-value security assets\n- [ ] Prevent domain controllers from being used as ordinary workstations\n- [ ] Do not use domain controllers as general-purpose or dual-purpose servers\n- [ ] Restrict physical access to domain controllers\n- [ ] Place physical domain controllers in dedicated secure racks, cages, or equivalent protected locations\n- [ ] Use TPM capabilities where supported\n- [ ] Protect domain-controller storage with appropriate drive encryption\n- [ ] Restrict interactive logons to domain controllers\n- [ ] Limit administrative access to authorized personnel\n- [ ] Have a documented response and recovery plan for a compromised domain controller\n- [ ] Understand that rebuilding or recovering the forest may be necessary after serious domain-controller compromise\n- [ ] Consider read-only domain controllers for remote or less physically secure locations\n- [ ] Physically secure offsite domain controllers even when they are read-only\n\n## 7. FSMO Role Placement\n\n- [ ] Document which servers hold each FSMO role\n- [ ] Keep the PDC Emulator and RID Master roles appropriately placed according to the environment's design\n- [ ] Consider the workload placed on the PDC Emulator when selecting its host\n- [ ] Avoid placing the Infrastructure Master on a Global Catalog server unless the forest/domain design makes this appropriate\n- [ ] Place the Schema Master and Domain Naming Master appropriately within the forest\n- [ ] Review FSMO placement after infrastructure changes or migrations\n- [ ] Maintain procedures for transferring or seizing FSMO roles during recovery\n\n## 8. Organizational Units\n\n- [ ] Design OUs around clear administrative and policy requirements\n- [ ] Use OUs to delegate administrative rights at the appropriate scope\n- [ ] Avoid unnecessary OU complexity\n- [ ] Align OU structure with Group Policy requirements\n- [ ] Review delegated permissions on OUs\n- [ ] Remove obsolete OUs and delegated privileges\n\n## 9. Active Directory Groups\n\n- [ ] Place users into global groups rather than assigning permissions directly to individual users\n- [ ] Place global groups into domain local groups where appropriate\n- [ ] Assign domain local groups to resource access-control lists\n- [ ] For multi-domain environments, place global groups into universal groups when required\n- [ ] Place universal groups into domain local groups\n- [ ] Assign domain local groups to the resource ACLs\n- [ ] Avoid excessive or unnecessarily complicated nested groups\n- [ ] Regularly review group membership\n- [ ] Remove stale or unresolved SIDs\n- [ ] Investigate tools such as SIDWalk when cleaning up unresolved SID references\n\n## 10. Privileged Accounts\n\n- [ ] Minimize membership in the Domain Admins group\n- [ ] Review membership in all other privileged administrative groups\n- [ ] Remove users who do not require permanent administrative privileges\n- [ ] Avoid granting administrator-level access simply because an application is easier to operate that way\n- [ ] Determine the exact permissions required by each application or administrative task\n- [ ] Delegate only the minimum required permissions\n- [ ] Review privileged access regularly\n- [ ] Log and monitor privileged administrative activity\n- [ ] Maintain separate administrative and normal-user accounts where appropriate\n\n## 11. Service Accounts\n\n- [ ] Use dedicated service accounts for services and applications\n- [ ] Prevent service accounts from being used for normal interactive logons\n- [ ] Apply least privilege to service accounts\n- [ ] Use a consistent service-account naming convention\n- [ ] Document the service or application associated with each service account\n- [ ] Monitor service-account activity\n- [ ] Review service-account permissions periodically\n- [ ] Remove service accounts that are no longer required\n\n## 12. Local Administrator Accounts\n\n- [ ] Avoid using the same local administrator password across multiple endpoints\n- [ ] Deploy Microsoft LAPS or an equivalent approved solution\n- [ ] Use unique, randomized local administrator passwords\n- [ ] Restrict who can retrieve managed local administrator passwords\n- [ ] Audit use of local administrator credentials\n- [ ] Review systems that are exempt from centralized local-password management\n\n## 13. Shared Accounts\n\n- [ ] Eliminate shared user accounts wherever possible\n- [ ] Require users and administrators to authenticate with individually attributable accounts\n- [ ] Replace shared administrator accounts with named administrative identities\n- [ ] Document any unavoidable shared accounts and their business justification\n- [ ] Closely monitor use of any approved shared accounts\n- [ ] Periodically review whether exceptions are still necessary\n\n## 14. Group Policy Objects\n\n- [ ] Use Group Policy to centrally enforce Windows security settings\n- [ ] Maintain a clear and consistent GPO naming standard\n- [ ] Document what each GPO does\n- [ ] Understand GPO inheritance and processing order\n- [ ] Minimize unnecessary or conflicting GPOs\n- [ ] Test GPO changes before broad deployment\n- [ ] Review GPO permissions and delegation\n- [ ] Restrict who can create, modify, link, and delete GPOs\n- [ ] Use recognized security baselines, such as applicable NIST or Microsoft recommendations, as a starting point\n- [ ] Include core baseline security settings in local policy where useful so protections remain when a computer is temporarily outside normal domain policy\n- [ ] Disable unnecessary legacy protocols and weak settings through policy\n- [ ] Apply appropriate account, password, auditing, and access-control requirements through policy\n- [ ] Regularly audit GPOs for obsolete or duplicate settings\n\n## 15. Default Computer and User Placement\n\n- [ ] Avoid leaving newly joined computers unmanaged in default containers longer than necessary\n- [ ] Create controlled OUs for newly joined computers\n- [ ] Redirect newly created computer objects to the appropriate managed OU where suitable\n- [ ] Apply baseline GPOs immediately to newly joined systems\n- [ ] Establish a controlled process for administrators installing or joining new systems\n- [ ] Verify new systems appear in the intended OU and receive the correct policies\n\n## 16. Monitoring and Auditing\n\n- [ ] Enable appropriate Windows and Active Directory security logging\n- [ ] Collect important logs centrally\n- [ ] Monitor privileged account activity\n- [ ] Monitor changes to privileged groups\n- [ ] Monitor unusual authentication behavior\n- [ ] Monitor changes to trusts\n- [ ] Monitor changes to GPOs\n- [ ] Monitor service-account activity\n- [ ] Monitor unusual SMB/share access\n- [ ] Regularly review logs rather than collecting them without analysis\n\n## 17. Physical and Recovery Security\n\n- [ ] Restrict physical access to critical Windows infrastructure\n- [ ] Document procedures for responding to domain-controller compromise\n- [ ] Maintain tested backups of Active Directory and critical Windows systems\n- [ ] Test restoration procedures regularly\n- [ ] Ensure recovery procedures account for compromise of privileged credentials\n- [ ] Protect backup systems from ordinary administrative compromise\n- [ ] Maintain current network and Active Directory architecture documentation\n\n## Final Review\n\n- [ ] No unsupported Windows systems remain without an approved exception\n- [ ] All unavoidable legacy systems are appropriately isolated\n- [ ] Windows and third-party patching is centrally managed\n- [ ] Unnecessary SMB shares have been removed\n- [ ] Active Directory trusts are documented and minimized\n- [ ] Domain controllers are dedicated and physically secured\n- [ ] FSMO role placement is documented and appropriate\n- [ ] OU delegation follows least privilege\n- [ ] Group nesting follows a consistent model\n- [ ] Domain Admin and other privileged memberships are minimized\n- [ ] Service accounts are dedicated, restricted, and monitored\n- [ ] Local administrator passwords are uniquely managed with LAPS or an equivalent solution\n- [ ] Shared accounts have been eliminated wherever possible\n- [ ] Security baselines are enforced through Group Policy\n- [ ] Newly joined systems automatically receive appropriate policies\n- [ ] Logging, monitoring, backup, and recovery processes have been tested\n\nWith the final review green, the Windows estate holds the test that runs through the whole checklist: **every privileged action is attributable to a named person, and a compromised domain controller has a documented, tested path back.**\n"}]}, {"key": "dialog", "label": "Conversation", "meta": {"timetoread": "8 min listen"}, "blocks": [{"type": "markdown", "content": "## One System, Not a Fleet\n\n**Ben:** Let me open with the obvious pushback. \"Harden your Windows servers\" is the least novel advice in security. What does this record say that the last twenty years of hardening guides didn't?\n\n**Ana:** It refuses the framing. You don't harden Windows servers one at a time, because a Windows estate isn't a fleet of servers — it's one system. Active Directory connects every machine to every other through authentication, trust, and policy, so the real attack surface is the graph. An attacker who lands on one workstation walks it: the reused local admin password, the over-privileged service account, the forgotten trust, the open share. The record fixes system-level properties — where the boundary is, who holds privilege, how the baseline is enforced, and what happens when the crown jewels fall.\n\n**Ben:** Start with the boundary claim, because it sounds like AD trivia. \"The forest is the security boundary, not the domain.\" Who cares?\n\n**Ana:** Anyone who ever put sensitive systems in a separate domain and thought that was isolation. The chapter is blunt: directory information can be queried by any authenticated domain account, so a domain is a structural and administrative container, nothing more. Once you accept that, trust management becomes boundary management. Every cross-forest trust is a hole in your perimeter — so each one is documented, justified to stakeholders, made one-way where possible, restricted with SID filtering or selective authentication where warranted, and removed when it stops earning its risk. The anti-pattern is the bidirectional trust from a migration that finished years ago, which nobody remembers and which quietly extends your boundary to an estate nobody audits.\n\n**Ben:** And hybrid — half of everyone's identity now lives in a cloud tenant.\n\n**Ana:** Same boundary, same scrutiny. The checklist explicitly extends authentication controls to hybrid and cloud-connected directories; the record hands the wider identity questions to [Authentication](authentication.html) and [Cloud Infrastructure](cloud-infrastructure.html), but the principle doesn't change at the tenant edge.\n\n## Crown Jewels and the Plan for Losing Them\n\n**Ben:** Domain controllers. The record's rules are absolutist — never a workstation, never dual-purpose, dedicated racks. Small IT teams double things up because they have three servers. Isn't this rich-company advice?\n\n**Ana:** It's the one place the record refuses proportionality, and for a precise reason: whoever controls a domain controller controls every account in the estate. It's not an important server; it's the root of trust. Every workload you co-host on it imports that workload's attack surface into the root of trust. If you can only afford absolutism in one place, this is the place — physical security per [Physical Security](physical-security.html), TPM and drive encryption, restricted logons, and read-only domain controllers for the branch office you can't physically secure to the same bar. Even those get locked up.\n\n**Ben:** The compromise-recovery plan is the part that reads strangely. You're asking teams to write a plan for the thing all the other controls prevent. Doesn't that concede failure?\n\n**Ana:** It concedes reality. The chapter says it out loud: serious domain-controller compromise may mean rebuilding or recovering the forest. That's the most expensive sentence in the whole checklist, and you want to have read it *before* the incident. A documented, tested plan — including procedures for transferring or seizing FSMO roles during recovery — is the difference between a hard month and an existential one. And it forces the backup discipline to be honest: backups tested by actual restoration, recovery procedures that assume privileged credentials are compromised, and backup systems protected from ordinary administrative compromise. A backup the attacker's stolen admin account can encrypt is not a backup.\n\n## Privilege as Attribution\n\n**Ben:** Next cluster: LAPS, dedicated service accounts, minimal Domain Admins, no shared accounts. Individually these are well-known controls. What's the record's actual argument?\n\n**Ana:** That they're one control, not four. Their shared purpose is attribution: when something privileged happens, a named person did it. A reused local administrator password means one compromised endpoint silently becomes all of them — LAPS exists precisely to kill that, unique randomized passwords per machine, retrieval restricted, use audited. A shared admin account means an action with no author. A service account someone also logs in with is both problems at once. The record doesn't ask for less administration; it asks that every administrative act have exactly one author, because attribution is what monitoring, forensics, and accountability all stand on.\n\n**Ben:** The Domain Admins group, though. Every organization says \"minimize membership\" and every organization's group grows anyway. Why would this record change that?\n\n**Ana:** Because it pairs the principle with the mechanisms that fight the growth. Nobody keeps permanent rights they don't currently require. No application gets admin because that's easier than determining what it actually needs — you determine the exact permissions and delegate the minimum. Privileged access is reviewed on a schedule, and privileged activity is logged and monitored, so membership is a standing question rather than a ratchet. And the record's practice test makes it concrete: I can ask for the Domain Admins list and the reason each member is on it, and get an answer within a day. If that takes a week, the record is failing.\n\n**Ben:** Admins with two accounts — daily and privileged — is real friction, every day.\n\n**Ana:** It is, and the record accepts it deliberately. The privileged account that reads email and browses the web is the most valuable phishing target in the company. Separation means the credential that can change the directory isn't the one sitting in a browser session.\n\n## The Baseline That Enforces Itself\n\n**Ben:** Group Policy. Fourteen checklist items about naming standards and inheritance order — this is the least glamorous section of the record.\n\n**Ana:** And the load-bearing one. A hardening standard in a binder is a preference; a GPO is a decision that wins arguments automatically — machines drift back to the baseline instead of away from it. But that only works if the enforcement mechanism itself is trustworthy, which is what the unglamorous items buy: naming standards and documentation so you can predict what a machine receives, testing before broad deployment, minimized conflicts, restricted rights over who can create or link GPOs, regular audits for obsolete settings. The anti-pattern is the GPO graveyard — hundreds of undocumented, conflicting objects where nobody can say what policy actually applies.\n\n**Ben:** And you don't write the baseline yourself.\n\n**Ana:** No — recognized baselines, applicable NIST or Microsoft recommendations, as the starting point. You spend your judgment on the deltas, not on deriving hundreds of settings from first principles. Two details in the chapter I'd underline: core protections duplicated in local policy, so a laptop temporarily off the domain doesn't shed its armor; and newly joined computers redirected out of default containers into managed OUs with baseline GPOs applied immediately and verified. A machine should never exist outside the baseline, even for an afternoon.\n\n**Ben:** You skipped legacy. Every estate has the unsupported box that runs the vendor application nobody can replace.\n\n**Ana:** The record doesn't forbid it — it forces it into daylight. Upgrade what can be upgraded; remove what can't; what must remain gets isolated on dedicated VLANs or air-gapped, its business risk documented and communicated to stakeholders, with a migration plan and an approved exception. The unacceptable state is the quiet one: the XP machine on the flat network that everyone knows about and nobody signed for. Same discipline [Vulnerability Management](vulnerability-management.html) applies estate-wide.\n\n**Ben:** All right. Close it out.\n\n**Ana:** The estate is one system. Its boundary is the forest, its root of trust is the domain controllers, its privilege has named authors, and its baseline enforces itself through policy. Watch the things attackers change — privileged groups, trusts, GPOs — and rehearse the recovery you hope never to run.\n\n**Ben:** So the takeaway I'll concede: hardening Windows isn't a hundred server tweaks — it's four system properties, and two questions you should be able to answer in a day. Who exactly holds privilege, and when did you last successfully restore Active Directory.\n\n**Ana:** If either answer embarrasses you, that's the record telling you where to start.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why a Windows estate is one security system with the forest as its boundary — in nine panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NADIA: a hands-on defensive-security lead, shoulder-length dark hair tied back, navy utility jacket over a plain shirt, an access badge on a lanyard, laptop with a padlock sticker under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and green accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Nadia shows Vera a wall map of servers joined by glowing lines into a single web labeled one system.](assets/images/windows-infrastructure/comic-01-one-system-not-a-fleet.jpeg)\n**Panel 1:** *The hook: a Windows estate is one security system, not a fleet of servers — authentication, trust, and policy connect every machine to every other.*\n\n![Comic panel: an intruder hops across stepping stones labeled shared password, old trust, open share toward a glowing crown.](assets/images/windows-infrastructure/comic-02-walking-the-graph.jpeg)\n**Panel 2:** *The problem: an attacker who lands on one workstation walks the graph — shared local passwords, forgotten trusts, writable shares, over-privileged service accounts.*\n\n![Comic panel: a crowned server plastered with file server, print server, and jump box signs as people plug cables in, Vera horrified.](assets/images/windows-infrastructure/comic-03-the-dual-purpose-dc.jpeg)\n**Panel 3:** *The wrong way: the dual-purpose domain controller — the estate's root of trust carrying the estate's everyday attack surface.*\n\n![Comic panel: Vera draws a solid wall around a forest with dotted internal fences labeled domains and one tagged bridge through the wall.](assets/images/windows-infrastructure/comic-04-the-forest-is-the-boundary.jpeg)\n**Panel 4:** *The principle: the forest is the security boundary, domains are containers — and every trust through the wall is documented, minimized, and removed when it stops earning its risk.*\n\n![Comic panel: a domain controller in a locked museum display case beside a framed compromise recovery plan, Nadia standing guard.](assets/images/windows-infrastructure/comic-05-crown-jewel-controllers.jpeg)\n**Panel 5:** *Practice: domain controllers get crown-jewel treatment — dedicated, physically secured, encrypted, logon-restricted, with a tested compromise plan that honestly contemplates forest rebuild.*\n\n![Comic panel: Nadia holds a ring of uniquely name-tagged keys beside a bin of crossed-out shared keys and a log listing named authors.](assets/images/windows-infrastructure/comic-06-every-action-has-an-author.jpeg)\n**Panel 6:** *Practice: privilege minimization is an attribution guarantee — minimal Domain Admins, unique managed local passwords, dedicated service accounts, no shared identities.*\n\n![Comic panel: laptops on a conveyor are stamped with shields by a Group Policy machine while a drifting laptop is pulled back by a baseline magnet.](assets/images/windows-infrastructure/comic-07-the-baseline-wins-arguments.jpeg)\n**Panel 7:** *Practice: a baseline that is not enforced is a preference — Group Policy built on recognized baselines pulls machines back from drift, and new systems land managed from birth.*\n\n![Comic panel: a legacy computer in a fenced pen with owner and exception tags, and a backup vault an intruder with stolen keys cannot reach.](assets/images/windows-infrastructure/comic-08-legacy-named-backups-tested.jpeg)\n**Panel 8:** *The cost: legacy is a signed risk decision — named, isolated, owned — and recovery assumes the credentials are gone: tested AD restores from backups ordinary admin compromise cannot touch.*\n\n![Comic panel: Vera holds a four-question card as Nadia hands over four folders labeled unsupported list, Domain Admins, trust map, last restore test.](assets/images/windows-infrastructure/comic-09-four-questions-one-day.jpeg)\n**Panel 9:** *The closer: the record's health check — the unsupported-systems list, Domain Admins membership, the trust map, and the last restore-test date, each producible within a day.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
