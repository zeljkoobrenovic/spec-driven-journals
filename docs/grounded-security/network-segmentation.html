<script id="data" type="application/json">{"meta": {"id": "SEC-NETWORK-SEGMENTATION", "status": "draft:gray", "title": "Network Segmentation", "date": "2026-08-22", "author": "Željko Obrenović", "permalink": "network-segmentation", "timetoread": "8 min", "excerpt": "Segmentation in my organization is least privilege applied to traffic: systems are separated by risk, function, sensitivity, and business need, and between segments the default is deny. Internet-facing systems live in a DMZ that cannot talk freely inward; VLANs are used with ACLs but never mistaken for walls; devices earn admission through NAC before they get network access; VPN users reach only the resources they need; application tiers and human duties are segmented alongside the network; and sensitive data lives in dedicated zones with extra monitoring. The whole design is documented, monitored, and tested — because the test I hold it to, from the chapter's own final review, is concrete: each segment can communicate only with the systems it legitimately needs, and prohibited traffic is proven blocked, not assumed.", "tags": "security, network segmentation, least privilege, default deny, DMZ, VLANs, ACLs, network access control, lateral movement", "icon": "assets/icons/network-segmentation.png", "logo": "assets/images/network-segmentation/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["security", "network segmentation", "least privilege", "default deny", "DMZ", "VLANs", "ACLs", "network access control", "lateral movement"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: Segmentation in my organization is **least privilege applied to traffic**: systems are separated by **risk, function, sensitivity, and business need**, and between segments the **default is deny** — every approved flow is documented, everything else is blocked. **Internet-facing systems live in a DMZ that cannot talk freely inward**; **VLANs are labels, not walls**, so they never stand as the only control; **devices earn admission** through NAC before the jack gives them anything; **VPN users reach only what they need**; and application tiers, human duties, and regulated data get the same separation as the network itself. The design is documented, monitored, and **tested until prohibited traffic is proven blocked**. The test I hold it to: **each segment can communicate only with the systems it legitimately needs** — lateral movement is minimized by design, not by hope.\n\n## Statement\n\nWhen my organization designs how its network is divided — and what may cross each boundary — this is the bar the design is held to.\n\n**Segmentation follows risk, not convenience.**\n\n- **The design starts with an inventory of what needs separating**: systems, users, applications, and data are identified, the topology and existing trust boundaries documented, and segments drawn by risk, function, sensitivity, and business need.\n- **Between segments, least privilege rules and the default is deny.** Approved traffic flows are documented on an allow-list basis; segmentation rules are reviewed regularly and unnecessary access is removed.\n\n![Six network zones — DMZ, corporate, sensitive data, guest, dev/test, management — with a few documented approved flows crossing boundaries and all other paths denied by default.](assets/images/network-segmentation/zones-default-deny.jpeg)\n**Figure 1:** *Least privilege applied to traffic: segments drawn by risk, function, and sensitivity, every approved flow documented on an allow-list — and between segments, the default is deny.*\n\n**Boundaries are real and enforced.**\n\n- **Firewalls, routers, and switches create the boundaries**, with rules configured for each segment's needs, boundary traffic monitored, and adequate logging on the devices that enforce them.\n- **The standing separations exist**: development and test networks apart from production, sensitive and regulated data on their own networks, guest networks apart from corporate, unnecessary egress limited, broadcast traffic reduced.\n- **Internet-facing systems live in a DMZ** that denies by default, admits only required inbound ports, and — critically — cannot talk freely to the internal network. DMZ systems are watched more closely because they absorb more risk.\n- **VLANs are used deliberately and trusted proportionately**: endpoints grouped by security requirement, inter-VLAN traffic controlled by ACLs or firewall policy, unused VLANs disabled, VLAN hopping protected against, IDs and purposes documented — and VLANs never relied on as the only segmentation control.\n- **ACLs are specific and tested**: rules keyed on source, destination, port, and protocol; no broad ANY-ANY allows; an explicit deny at the end; denials logged where useful; rules reviewed for rot and changes tested before production.\n\n**Admission is earned, not assumed.**\n\n- **Devices authenticate before they get normal network access** — 802.1X where appropriate, posture validated before admission, unknown or noncompliant devices quarantined in an isolated network.\n- **The edges are covered**: vendor equipment scanned before production access, guest access through captive portals restricted to internet-only, NAC applied in conference rooms and shared spaces, BYOD integrated with policy, unmanaged devices denied when required.\n\n**Remote access is scoped like any other segment.**\n\n- **VPN access exists on business need and dies with it** — strongest practical authentication, strong current encryption, users limited to the resources they need, host-integrity checks where supported, centralized identity integration, full logging and audit.\n- **Split tunneling is evaluated carefully before it is enabled**, and browser-based VPN sessions are protected against credential theft and malware exposure.\n\n**Applications and duties are segmented too.**\n\n- **Application tiers are separated where the security benefit justifies it**: web servers apart from database servers, database access restricted to authorized application systems, raw database files unreachable, TLS private keys kept off public-facing servers, tier-to-tier traffic restricted to required ports and protocols — most stringently for applications processing sensitive data.\n- **Unrelated critical services do not share a server** — databases apart from application servers where risk warrants it, and domain controllers, mail servers, and systems holding personally identifiable information kept isolated.\n- **People are segmented like packets**: development and production responsibilities separated, transaction creation split from approval, RBAC with regular permission reviews, generic and shared admin accounts disabled and alerted on, DBAs scoped to database work, and administrators holding separate standard and privileged accounts — privileged used only for privileged work, ideally from dedicated workstations.\n- **SDN and microsegmentation are evaluated on merit** — with the control plane secured, controller access restricted, automated policy changes monitored, and documentation kept accurate, so software-defined boundaries do not quietly delete the controls the hardware used to enforce.\n\n**Sensitive data lives in dedicated zones — and the design is proven, continuously.**\n\n- **Sensitive information is located, zoned, and watched**: dedicated security zones, access on business need, extra monitoring at the boundary, and segmentation requirements for PCI DSS, HIPAA, and other applicable standards verified and documented.\n- **The verification loop runs**: traffic captured and flow-analyzed for abnormal communication, permitted and denied traffic logged at important boundaries, firewall/VLAN/ACL/NAC/VPN configurations reviewed regularly, diagrams and naming kept current, obsolete rules and devices removed — and segmentation controls tested to prove prohibited traffic is actually blocked, with the design reassessed whenever systems or business requirements change.\n\n## How to Read This\n\nThis record sits in the **Identity and Network** section between [Secure Network Infrastructure](network-security.html) — which hardens the devices that enforce these boundaries — and [Intrusion Detection and Prevention Systems](ids-ips.html), which watches the traffic the boundaries admit. It is grounded in the Network Segmentation chapter of the *Defensive Security Handbook*, and its subject is the single design property that most limits an intruder: how far can an attacker who is already inside actually travel? The full working checklist — design, DMZ, VLANs, ACLs, NAC, VPN, application and duty segmentation, and the chapter's Final Review — lives in the **Checklist** tab; the **TL;DR** tab carries the management summary and the **Conversation** tab the dialog.\n\n## Rationale\n\n**Segmentation is the control on blast radius.** Every other defense in this journal reduces the probability of compromise; segmentation reduces its price. The attacker who lands on a workstation in a flat network has landed everywhere — the file servers, the database, the domain controller are all one hop away. The same attacker in a properly segmented network has won a cul-de-sac. Since some compromise is a matter of time, the size of the compartment it lands in is one of the few security properties my organization fully controls in advance.\n\n![Comparison of one compromised workstation spreading to everything in a flat network versus staying contained in a single compartment of a segmented network.](assets/images/network-segmentation/blast-radius-flat-vs-segmented.jpeg)\n**Figure 2:** *Every other defense reduces the probability of compromise; segmentation reduces its price — the attacker in a segmented network has won a cul-de-sac, not the estate.*\n\n**Default-deny is the only rule set that ages well.** An allow-list decays into safety: forget to add a flow and someone complains, so the mistake surfaces and gets fixed. A deny-list decays into exposure: forget to block something and nothing happens — until it does. The same asymmetry drives the record's insistence on documented approved flows and regular pruning, because a rule base that only ever grows is a deny-list in the making, one ANY-ANY \"temporary fix\" at a time.\n\n**A VLAN is a label, not a wall.** VLANs are the cheapest segmentation mechanism and therefore the most over-trusted; hopping attacks and misconfigured trunks cross them, which is why the record uses VLANs freely but never alone — always paired with ACLs or firewall policy, always with the hopping protections on, never mistaken for physical isolation. The DMZ logic is the same principle at the perimeter: exposure is asymmetric, so the systems that absorb the internet's hostility are placed where their compromise buys the attacker a monitored, restricted island — not a bridge inward.\n\n**Admission control moves trust from the jack to the device.** A network that grants full access to whatever plugs in has delegated its security policy to the office furniture. NAC inverts that: authenticate first, validate posture, and quarantine the unknown — the visitor's laptop and the vendor's demo box land in isolation, not on the corporate segment. Guest captive portals and conference-room controls are the same inversion applied to the places where unknown devices are most routine.\n\n![Flow of a device plugging in, authenticating via 802.1X, passing a posture check, and reaching the corporate segment — or landing in an isolated quarantine network if unknown or noncompliant.](assets/images/network-segmentation/nac-admission-flow.jpeg)\n**Figure 3:** *Admission is earned, not assumed: authenticate first, validate posture, and quarantine the unknown — trust moves from the jack to the device.*\n\n**Duty separation is segmentation of people.** The record deliberately keeps roles in a network chapter: a developer with standing production access, an administrator browsing the web with a privileged account, one person creating and approving the same transaction — each is a flat network drawn in an org chart. RBAC, split accounts, and separated responsibilities apply exactly the least-privilege, default-deny logic to humans that ACLs apply to packets, and both fail the same way: through exceptions nobody prunes.\n\n**An untested boundary is a diagram.** Firewall rules drift, ACLs rot, an emergency change quietly bridges two zones — and the network diagram stays reassuring throughout. That is why the record's loop does not end at \"documented\": it ends at *tested*, with prohibited traffic actually attempted and actually blocked, flows analyzed for abnormal communication, and the design reassessed when the business changes. For regulated zones this is also the difference between claiming PCI DSS or HIPAA scope reduction and being able to demonstrate it.\n\n**A design nobody understands is a design nobody can defend.** The chapter's final review asks a question most security checklists skip: can administrators quickly understand and troubleshoot the design, and does it balance security with legitimate usability? An over-clever segmentation scheme fails operationally — troubleshooting bypasses accumulate, exceptions multiply, and the elegant zone map becomes fiction. Consistent naming, current diagrams, and honest balance are what keep the segmentation real for years instead of months.\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Segments are drawn by risk, function, sensitivity, and business need, with default-deny between them. | A prescribed zone count or topology — the design is ours; the test it must pass is not. |\n| Every approved inter-segment flow is documented; everything else is blocked. | Documentation as archaeology — flows are pruned on review, not merely recorded. |\n| VLANs are paired with ACLs or firewall policy and hopping protections. | VLANs are worthless — they are one layer, never the only one. |\n| The DMZ denies by default and cannot talk freely to the internal network. | Internet-facing means unprotected — DMZ systems get *more* monitoring, not less. |\n| Devices authenticate and prove posture before receiving normal access; the unknown is quarantined. | Guests and vendors are locked out — they get isolated, internet-only paths built for them. |\n| VPN users reach only the resources they need, and split tunneling is deliberately evaluated. | Remote work is restricted — remote access is scoped exactly like any other segment. |\n| Duties are separated: dev from prod, creation from approval, standard from privileged accounts. | Developers never touch production — they touch it through controlled, logged, temporary paths. |\n| Segmentation is tested until prohibited traffic is proven blocked. | Testing once at rollout — the proof recurs, and the design is reassessed on change. |\n\nConcretely: any team in my organization proposing a new system must answer *which segment it lives in, what it must talk to, and why* — and the flows it names are the flows it gets. The standing audit question is the chapter's own: pick a segment, attempt the traffic that should be impossible, and watch it fail.\n\n## Anti-Patterns\n\n- **The flat network with a firewall at the front.** A hard perimeter around one big trusted interior — the first phished workstation is one hop from everything the organization owns.\n- **The ANY-ANY rule that never died.** A troubleshooting exception from two years ago, still bridging two zones because removing it might break something nobody can name.\n- **The VLAN mistaken for a wall.** Sensitive systems \"segmented\" by VLAN tag alone — no ACLs, no hopping protections — separation that ends at the first misconfigured trunk port.\n- **The DMZ with a back door.** Public-facing servers that can reach the internal network freely — the DMZ absorbs the breach and then escorts it inside.\n- **The live jack in the lobby.** Conference rooms and reception areas where any plugged-in device joins the corporate network — admission by furniture.\n- **The all-access VPN.** Remote users landing on the full internal network because scoping was tedious — the perimeter re-flattened, one credential theft from anywhere.\n- **The generic admin everyone shares.** One privileged account for browsing, email, and production changes alike — duty separation erased, attribution impossible, alerting silent.\n- **The paper segmentation.** A beautiful zone diagram, never tested — the prohibited flows work fine, and everyone finds out during the incident.\n\n## Related Records\n\n- [Secure Network Infrastructure](network-security.html) — hardens the firewalls, routers, and switches this record's boundaries depend on.\n- [Authentication](authentication.html) — the identity discipline NAC and VPN admission decisions rest on.\n- [Intrusion Detection and Prevention Systems](ids-ips.html) — the detection layer that watches the boundary traffic this record logs and restricts.\n- [Databases](databases.html) — the record's tier separation restricts who reaches the database; that record hardens what they reach.\n- [Cloud Infrastructure](cloud-infrastructure.html) — the same zoning logic where boundaries are security groups and virtual networks instead of switches.\n- [Industry Compliance Standards and Frameworks](compliance.html) — the program that owns the PCI DSS and HIPAA obligations this record's zones demonstrably support.\n- [Logging and Monitoring](logging-and-monitoring.html) — the platform receiving the boundary logs and flow analysis this record's verification loop produces.\n\n## Scope and Revisiting\n\nThis record is `draft`. It applies to every network my organization operates — office, data center, and cloud — and to every new system's placement decision. I revisit it if segmentation testing finds prohibited traffic flowing (the core test failing in practice), if the exception list at any boundary grows quarter over quarter (default-deny decaying into a deny-list), if the estate moves materially toward microsegmentation or Zero Trust architectures (the commitments must be restated in those terms, not silently dropped), or if teams begin routing around segment boundaries because legitimate flows take too long to approve — friction in the approval path is a defect to fix, not a reason to flatten the network.\n\n## Authoritative References\n\n- *Defensive Security Handbook*, 2nd edition (Lee Brotherston, Amanda Berlin, and William F. Reyor III; O'Reilly) — the Network Segmentation chapter, whose checklist (including its Final Review) this record distills.\n- PCI DSS and HIPAA, which the chapter names for verifying segmentation requirements around regulated data.\n- IEEE 802.1X, which the chapter names for network access control.\n"}]}, {"key": "summary", "label": "TL;DR", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "Segmentation in my organization is **least privilege applied to traffic**: systems separated by risk, function, sensitivity, and business need, with default-deny between segments and every approved flow documented. Every other defense reduces the probability of compromise; segmentation reduces its price — the attacker who lands inside wins a compartment, not the estate. The test the design is held to, from the chapter's own final review: each segment can communicate only with the systems it legitimately needs, and prohibited traffic is proven blocked, not assumed.\n\n**What changes**\n\n* **Segments are designed, not inherited.** The topology and trust boundaries are documented and systems needing separation identified — dev/test apart from production, guests apart from corporate, regulated data in dedicated zones with extra monitoring mapped to PCI DSS and HIPAA where applicable.\n* **Boundaries become default-deny.** Approved flows are documented allow-list style and pruned on review; ACLs are specific — source, destination, port, protocol — with no ANY-ANY rules; the DMZ admits only required inbound ports and cannot talk freely inward; VLANs are used with ACLs and hopping protections but never trusted as walls.\n* **Admission is earned.** NAC and 802.1X authenticate devices and validate posture before the jack gives them anything; unknown and noncompliant devices land in quarantine; guests get captive-portal, internet-only access; vendor equipment is scanned before it touches production.\n* **Remote access and applications get the same scoping.** VPN access exists on business need, reaches only required resources, and dies when the need does — split tunneling deliberately evaluated. Web tiers are separated from databases, TLS keys stay off public-facing servers, and tier-to-tier traffic is restricted to required ports.\n* **People are segmented like packets.** Dev and prod responsibilities separated, transaction creation split from approval, RBAC with regular reviews, generic admin accounts disabled and alerted on, and administrators holding separate standard and privileged accounts.\n* **The design is proven, continuously.** Boundary traffic is logged and flow-analyzed, configurations reviewed, diagrams kept current — and prohibited traffic is actually attempted and actually blocked, with the design reassessed whenever the business changes.\n\n**What it costs**\n\n* Real design and migration work upfront, and an approval path for new inter-segment flows that adds friction by intent — a defect to fix when slow, never a reason to flatten the network.\n* The verification loop recurs: testing, rule pruning, and documentation are standing work, not a rollout.\n* Some legitimate workflows get slower until their flows are documented — the price of an allow-list that means something.\n\n**What we are not doing**\n\n* Not hardening the firewalls and switches that enforce the boundaries — that is [Secure Network Infrastructure](network-security.html).\n* Not building the detection layer that watches boundary traffic — that is [Intrusion Detection and Prevention Systems](ids-ips.html).\n* Not prescribing a topology, zone count, or microsegmentation product — the design is ours; the test it must pass is not.\n\n*The Article tab carries the rationale and anti-patterns; the Checklist tab carries the full working checklist and the chapter's Final Review. Grounded in the Network Segmentation chapter of the* Defensive Security Handbook*.*\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "5 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record — the full segmentation discipline, from design and boundaries through NAC, VPN, application and duty separation, to the verification loop and the chapter's Final Review. The Article tab carries the rationale and anti-patterns.*\n\n## 1. Network Design\n\n- [ ] Identify systems, users, applications, and data that require segmentation\n- [ ] Document the network topology and existing trust boundaries\n- [ ] Separate systems according to risk, function, sensitivity, and business need\n- [ ] Apply the principle of least privilege between all network segments\n- [ ] Use a default-deny/allow-list approach wherever practical\n- [ ] Document approved traffic flows between segments\n- [ ] Regularly review segmentation rules and remove unnecessary access\n\n## 2. Physical Segmentation\n\n- [ ] Use firewalls, routers, and switches to create security boundaries\n- [ ] Configure firewall rules specifically for the needs of each segment\n- [ ] Monitor traffic crossing network boundaries\n- [ ] Ensure network devices provide adequate logging\n- [ ] Separate development/test networks from production\n- [ ] Separate networks containing sensitive or regulated data\n- [ ] Place internet-facing systems in a DMZ\n- [ ] Separate guest networks from internal corporate networks\n- [ ] Limit unnecessary outbound/egress internet access\n- [ ] Reduce unnecessary broadcast traffic\n\n## 3. DMZ\n\n- [ ] Place public-facing servers in a dedicated DMZ\n- [ ] Configure the DMZ firewall to deny traffic by default\n- [ ] Allow only required inbound ports and services\n- [ ] Restrict traffic from the DMZ to the internal network\n- [ ] Prevent unrestricted communication between DMZ systems and trusted systems\n- [ ] Monitor DMZ systems closely because they are exposed to higher risk\n\n## 4. VLANs\n\n- [ ] Group endpoints into VLANs based on security requirements\n- [ ] Separate high-priority servers, standard servers, user endpoints, and other device categories as needed\n- [ ] Use ACLs or firewall policies to control traffic between VLANs\n- [ ] Configure only necessary VLANs on each physical switch\n- [ ] Disable or restrict unused VLAN access\n- [ ] Protect against VLAN-hopping and related attacks\n- [ ] Do not rely on VLANs as the only segmentation security control\n- [ ] Document VLAN IDs, purposes, permitted traffic, and assigned devices\n\n## 5. Access Control Lists (ACLs)\n\n- [ ] Apply ACLs between subnets or network segments\n- [ ] Create specific rules based on source address, destination address, port, and protocol\n- [ ] Avoid overly broad ANY-ANY allow rules\n- [ ] Include an explicit deny rule at the end of the ACL where appropriate\n- [ ] Log denied or dropped traffic when useful for monitoring\n- [ ] Review ACLs regularly for obsolete or unnecessary rules\n- [ ] Test ACL changes before applying them to production systems\n\n## 6. Network Access Control (NAC)\n\n- [ ] Require authentication before devices receive normal network access\n- [ ] Use 802.1X where appropriate\n- [ ] Validate device security posture before granting access\n- [ ] Place unknown or noncompliant devices in an isolated network\n- [ ] Scan new third-party or vendor equipment before production access\n- [ ] Use guest captive portals for visitor access where appropriate\n- [ ] Restrict guest networks to required services, typically internet access only\n- [ ] Apply NAC controls in conference rooms and other shared connection areas\n- [ ] Integrate NAC with BYOD policies\n- [ ] Deny unauthorized or unmanaged devices when required\n\n## 7. VPN Security\n\n- [ ] Use the strongest practical authentication method\n- [ ] Use strong, current encryption methods\n- [ ] Grant VPN access only for a valid business need\n- [ ] Remove VPN access when it is no longer required\n- [ ] Limit remote users to only the resources they need\n- [ ] Apply endpoint or host-integrity checks where supported\n- [ ] Integrate VPN authentication with centralized identity services where appropriate\n- [ ] Log and audit VPN activity\n- [ ] Carefully evaluate split tunneling before enabling it\n- [ ] Protect browser-based VPN sessions against credential theft and malware exposure\n- [ ] Use secure IPsec or SSL/TLS configurations appropriate to the environment\n\n## 8. Egress Traffic\n\n- [ ] Determine which systems actually require internet access\n- [ ] Block direct internet access for servers that do not need it\n- [ ] Use internal repositories for software and updates when practical\n- [ ] Restrict outbound traffic by destination, port, and protocol\n- [ ] Monitor unusual outbound connections\n\n## 9. Application Segmentation\n\n- [ ] Separate application components when the security benefit justifies it\n- [ ] Separate web servers from database servers\n- [ ] Restrict database access to authorized application systems\n- [ ] Prevent unnecessary direct access to raw database files\n- [ ] Store SSL/TLS private keys away from public-facing web servers when possible\n- [ ] Use reverse proxies, load balancers, or dedicated security devices where appropriate\n- [ ] Restrict communication between application tiers to required ports and protocols\n- [ ] Apply segmentation especially to applications processing sensitive data\n\n## 10. Software-Defined Networking (SDN)\n\n- [ ] Evaluate whether SDN or microsegmentation can improve network isolation\n- [ ] Secure the SDN control plane\n- [ ] Restrict administrative access to SDN controllers\n- [ ] Monitor automated network policy changes\n- [ ] Maintain accurate documentation of software-defined network rules\n- [ ] Verify that removing traditional network devices does not eliminate necessary security controls\n\n## 11. Roles and Responsibilities\n\n- [ ] Separate development and production responsibilities where possible\n- [ ] Prevent developers from having unnecessary direct production access\n- [ ] Separate transaction creation from transaction approval responsibilities\n- [ ] Use role-based access control (RBAC)\n- [ ] Review user and administrator permissions regularly\n- [ ] Disable generic administrative accounts where possible\n- [ ] Alert on use of generic or shared privileged accounts\n- [ ] Give database administrators only the privileges needed for database administration\n- [ ] Avoid giving unnecessary operating-system root or administrator privileges\n- [ ] Provide administrators with separate standard and privileged accounts\n- [ ] Use standard accounts for routine activities such as email and browsing\n- [ ] Use privileged accounts only for administrative tasks\n- [ ] Consider separate administrative workstations for privileged activity\n- [ ] Clearly identify authorized backup administrators and document procedures\n\n## 12. Server and Service Separation\n\n- [ ] Avoid combining unrelated critical services on the same server\n- [ ] Separate databases from application servers when risk warrants it\n- [ ] Keep especially sensitive server roles isolated\n- [ ] Isolate Active Directory/domain controllers from unnecessary services\n- [ ] Isolate mail servers where appropriate\n- [ ] Isolate systems storing personally identifiable information (PII)\n\n## 13. Sensitive and Regulated Data\n\n- [ ] Identify where sensitive information is stored\n- [ ] Create dedicated security zones for sensitive data\n- [ ] Restrict access according to business need\n- [ ] Apply additional monitoring around sensitive-data segments\n- [ ] Verify segmentation requirements for applicable standards such as PCI DSS or HIPAA\n- [ ] Document how segmentation supports regulatory compliance\n\n## 14. Monitoring and Maintenance\n\n- [ ] Capture or analyze network traffic where appropriate\n- [ ] Use network-flow analysis to identify abnormal communication\n- [ ] Log permitted and denied traffic at important security boundaries\n- [ ] Regularly review firewall, VLAN, ACL, NAC, and VPN configurations\n- [ ] Test segmentation controls to verify that prohibited traffic is actually blocked\n- [ ] Keep network diagrams and documentation current\n- [ ] Apply consistent naming conventions to devices, rules, VLANs, and security zones\n- [ ] Remove obsolete devices, rules, accounts, and configurations\n- [ ] Reassess segmentation whenever systems, applications, or business requirements change\n\n## Final Review\n\n- [ ] Can each segment communicate only with systems it legitimately needs?\n- [ ] Are sensitive systems separated from lower-trust systems?\n- [ ] Is lateral movement between segments minimized?\n- [ ] Are unnecessary inbound and outbound connections blocked?\n- [ ] Are segmentation controls monitored and logged?\n- [ ] Can administrators quickly understand and troubleshoot the design?\n- [ ] Does the design balance security with legitimate usability and business requirements?\n\nWith the Final Review answered honestly, the network is compartmented rather than merely fenced — and the question running through the whole checklist never changes: **if an attacker landed in this segment today, how far could they actually travel?**\n"}]}, {"key": "dialog", "label": "Conversation", "meta": {"timetoread": "8 min listen"}, "blocks": [{"type": "markdown", "content": "## Blast Radius, Not Probability\n\n**Ben:** Let me open with the boring objection. We already spend heavily on keeping attackers out — firewalls, MFA, endpoint protection. Segmentation is spending on the assumption all of that fails. Why fund pessimism?\n\n**Ana:** Because the assumption is correct often enough to plan for. Every other defense in the journal reduces the *probability* of compromise; segmentation reduces its *price*. A phished workstation on a flat network is one hop from the file servers, the database, and the domain controller — the attacker lands everywhere at once. The same workstation in a segmented network is a cul-de-sac. Since some compromise is a matter of time, the size of the compartment it lands in is one of the few security properties we fully control in advance.\n\n**Ben:** And the design principle is \"least privilege applied to traffic.\" Meaning what, mechanically?\n\n**Ana:** Meaning segments are drawn by risk, function, sensitivity, and business need — against a documented topology, not the accidental one — and between segments the default is deny. Every approved flow is documented; everything undocumented is blocked. Dev and test never share a network with production, guests never touch corporate, regulated data gets its own zones with extra monitoring.\n\n**Ben:** Default-deny sounds noble until the first outage caused by a flow nobody documented. Deny-lists are so much gentler to operate.\n\n**Ana:** Gentler and quietly lethal — that's exactly the asymmetry the record leans on. An allow-list decays into safety: forget a legitimate flow and someone complains loudly, so the gap surfaces and gets fixed. A deny-list decays into exposure: forget to block something and nothing happens — until it does, silently, in an incident. And the record is honest about the operational half: if the approval path for new flows is so slow that teams route around it, that's a defect to fix in the path, never a reason to flatten the network.\n\n## Walls, Labels, and the DMZ\n\n**Ben:** The record uses VLANs everywhere and then warns against trusting them. Which is it?\n\n**Ana:** Both, deliberately. A VLAN is a label on a frame, not a wall — the cheapest segmentation mechanism and therefore the most over-trusted. Hopping attacks and misconfigured trunk ports cross it. So the record uses VLANs freely — grouped by security requirement, documented with IDs and purposes — but always paired with ACLs or firewall policy, always with hopping protections, never as the only control. The named anti-pattern is sensitive systems \"segmented\" by VLAN tag alone: separation that ends at the first misconfigured trunk.\n\n**Ben:** And the ACLs behind those VLANs — the record gets specific there too. No ANY-ANY, explicit deny at the end, tested before production. Isn't that just firewall hygiene?\n\n**Ana:** It's where segmentation actually lives or dies. Rules keyed on source, destination, port, and protocol; denials logged where useful; and — the part most shops skip — regular review to remove rules that no longer earn their place. The classic failure is the ANY-ANY exception from a troubleshooting session two years ago, still bridging two zones because removing it might break something nobody can name. A rule base that only grows is a deny-list in the making.\n\n**Ben:** The DMZ feels like 1998 vocabulary. Does it still earn a section?\n\n**Ana:** The vocabulary aged; the asymmetry didn't. Internet-facing systems absorb hostility by design, so they live where compromise buys the attacker a monitored, restricted island: deny by default, only required inbound ports, and — the load-bearing rule — no free path inward. The anti-pattern is the DMZ with a back door: public servers that can reach the internal network freely, so the DMZ absorbs the breach and then escorts it inside. And because DMZ systems carry more risk, they get more monitoring, not less.\n\n## Admission, Remote Access, and People\n\n**Ben:** NAC next. 802.1X, posture checks, quarantine networks — serious infrastructure. What does it buy that a locked office doesn't?\n\n**Ana:** It moves trust from the jack to the device. A network that grants full access to whatever plugs in has delegated its security policy to the office furniture — the live jack in the lobby is a named anti-pattern for a reason. With NAC, devices authenticate before they get anything, posture is validated, and the unknown or noncompliant lands in an isolated network. The routine cases get built paths: guests through captive portals to internet-only access, vendor equipment scanned before production, conference rooms covered, BYOD integrated with policy instead of ignored.\n\n**Ben:** VPN — surely that's just \"turn on MFA\" these days?\n\n**Ana:** Authentication is the entrance; the record cares about what's behind it. The all-access VPN is the perimeter re-flattened: remote users landing on the full internal network because scoping was tedious, one stolen credential from anywhere in the world. So VPN access exists on business need and dies with it, users reach only the resources they require, host-integrity checks run where supported, activity is logged and audited — and split tunneling is evaluated deliberately, because it quietly connects your network to whatever else the endpoint is touching.\n\n**Ben:** Now the odd section. Roles and responsibilities — developers, DBAs, approval workflows. Why are people in a network segmentation chapter?\n\n**Ana:** Because duty separation is segmentation of people, and it fails identically. A developer with standing production access, an admin reading email with a privileged account, one person creating and approving the same transaction — each is a flat network drawn in an org chart. The record applies the same logic: RBAC with regular permission reviews, dev separated from prod, creation split from approval, generic shared admin accounts disabled and alerted on, and administrators holding two accounts — standard for routine work, privileged only for privileged work, ideally from a dedicated workstation.\n\n## Tiers, Control Planes, and Proving It\n\n**Ben:** Application tiers — web apart from database, keys off public servers. Isn't that the application team's business, not the network's?\n\n**Ana:** It's the same principle at a finer grain, and the network enforces it. The web server is the exposed tier; if it falls, the question is what the attacker inherits. A database on the same box: everything. A database in its own segment, reachable only from authorized application systems on required ports, raw files unreachable, TLS private keys stored elsewhere: a much longer night for the attacker. And where the stack goes software-defined, the record keeps the guardrails — SDN can improve isolation, but its control plane becomes the crown jewels: controller access restricted, automated policy changes monitored, and no traditional control removed without checking what replaced it.\n\n**Ben:** Which brings us to my favorite line to attack: \"test segmentation controls to verify prohibited traffic is actually blocked.\" Testing that something *doesn't* work — how is that not busywork?\n\n**Ana:** It's the only part that makes the rest true. Rules drift, ACLs rot, an emergency change bridges two zones — and the diagram stays reassuring throughout. That's the paper-segmentation anti-pattern: a beautiful zone map, never tested, and everyone learns the prohibited flows work fine during the incident. So the loop runs: boundary traffic logged, flows analyzed for abnormal communication, configurations reviewed, obsolete rules removed, diagrams kept current — and prohibited traffic actually attempted, actually blocked. For the regulated zones, that's also the difference between claiming PCI DSS scope reduction and demonstrating it.\n\n**Ben:** The final review also asks whether administrators can quickly understand the design. That's an unusual security requirement.\n\n**Ana:** It's the sustainability requirement. An over-clever segmentation scheme fails operationally — troubleshooting bypasses accumulate, exceptions multiply, and within a year the elegant map is fiction. A design people understand is a design people maintain, and the chapter says the balance out loud: security against legitimate usability and business requirements, both real.\n\n**Ben:** Then here's my takeaway, and it's uncomfortably simple: the question isn't whether attackers get in — it's how far they can walk once they do. And that distance is a design choice we make in advance, and prove on a schedule.\n\n**Ana:** That's the record. Pick a segment, ask what it can reach and why, attempt the traffic that should be impossible — and if it flows, that's not an embarrassment, that's the audit working. Lateral movement is minimized by design, not by hope.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why lateral movement is minimized by design, not by hope — in nine panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NADIA: a hands-on defensive-security lead, shoulder-length dark hair tied back, navy utility jacket over a plain shirt, an access badge on a lanyard, laptop with a padlock sticker under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and green accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: an intruder on one workstation in an open floor with servers and a domain controller all one hop away, Nadia alarmed at a monitor.](assets/images/network-segmentation/comic-01-one-hop-from-everything.jpeg)\n**Panel 1:** *The hook: the flat network — the attacker who lands on one workstation has landed everywhere; the file servers, database, and domain controller are all one hop away.*\n\n![Comic panel: a castle with a massive gate labeled firewall but a single open hall inside where an intruder strolls between treasure rooms.](assets/images/network-segmentation/comic-02-castle-with-open-halls.jpeg)\n**Panel 2:** *The problem: a hard perimeter around one big trusted interior — the firewall at the front, and nothing between the first phished workstation and everything the organization owns.*\n\n![Comic panel: paper curtains labeled VLAN 10, 20, 30 divide a room while an intruder hops over one marked trunk port and Nadia lifts an edge.](assets/images/network-segmentation/comic-03-the-vlan-curtain.jpeg)\n**Panel 3:** *The wrong way: the VLAN mistaken for a wall — tags without ACLs or hopping protections are separation that ends at the first misconfigured trunk port.*\n\n![Comic panel: Vera shows a floor plan of sealed compartments with a few permit-stamped doors under a sign reading default deny.](assets/images/network-segmentation/comic-04-least-privilege-for-packets.jpeg)\n**Panel 4:** *The principle: segmentation is least privilege applied to traffic — segments drawn by risk, function, sensitivity, and business need; every approved flow documented, everything else denied.*\n\n![Comic panel: a fortified island labeled DMZ between a stormy internet sea and the mainland, connected only by a narrow guarded checkpoint bridge.](assets/images/network-segmentation/comic-05-the-dmz-island.jpeg)\n**Panel 5:** *Practice: internet-facing systems live in a DMZ — deny by default, only required ports in, no free path inward, and watched more closely because they absorb more risk.*\n\n![Comic panel: devices queue at a NAC gate; a badged laptop passes, an unknown gadget is diverted to a quarantine room, a guest phone gets internet-only.](assets/images/network-segmentation/comic-06-admission-is-earned.jpeg)\n**Panel 6:** *Practice: admission is earned — 802.1X authentication and posture checks before access, quarantine for the unknown, internet-only paths for guests; trust moves from the jack to the device.*\n\n![Comic panel: an admin with separate standard and privileged key cards, doors labeled dev and prod, and a create/approve two-person desk.](assets/images/network-segmentation/comic-07-people-are-segmented-too.jpeg)\n**Panel 7:** *Practice: duty separation is segmentation of people — dev apart from prod, creation split from approval, separate standard and privileged accounts, no shared generic admin.*\n\n![Comic panel: a ghostly cobwebbed bridge labeled ANY-ANY temp fix 2024 spans two zones as an intruder crosses and Nadia arrives with shears.](assets/images/network-segmentation/comic-08-the-any-any-ghost.jpeg)\n**Panel 8:** *The cost: the ANY-ANY that never died — a rule base that only grows decays default-deny into a deny-list, one 'temporary' exception at a time; pruning is part of the design.*\n\n![Comic panel: Nadia fires a test dart labeled prohibited traffic that bounces off a segment wall with a blocked-verified stamp while Vera nods.](assets/images/network-segmentation/comic-09-prove-it-blocked.jpeg)\n**Panel 9:** *The closer: an untested boundary is a diagram — pick a segment, attempt the traffic that should be impossible, and watch it fail. Lateral movement is minimized by design, not by hope.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
