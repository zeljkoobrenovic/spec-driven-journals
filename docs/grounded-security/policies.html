<script id="data" type="application/json">{"meta": {"id": "SEC-POLICIES", "status": "draft:gray", "title": "Policies: What Must Be Achieved, in Writing", "date": "2026-08-22", "author": "Željko Obrenović", "permalink": "policies", "timetoread": "6 min", "excerpt": "A security policy in my organization states what must be achieved — implementation lives in standards and procedures. The language is mandatory or it is not policy: must, will, shall, and do, never should, try, and mostly, with permitted exceptions documented. Every policy is a governed document — version, effective date, owner, approver, scope — and the set is managed deliberately: separate manageable documents, centrally stored under revision control, formally approved, communicated, and reviewed at least annually with obsolete versions archived. The test I hold the policy set to: any employee can find the current approved version of the policy that applies to them and understand what it requires — and nobody can find an obsolete one.", "tags": "security policies, governance, policy language, document control, policy lifecycle, compliance, defensive security", "icon": "assets/icons/policies.png", "logo": "assets/images/policies/logo.jpeg", "logo_credit": "Image generated by Google Gemini (gemini-3-pro-image-preview)"}, "tags": ["security policies", "governance", "policy language", "document control", "policy lifecycle", "compliance", "defensive security"], "modalities": [{"key": "index", "label": "Article", "meta": {}, "blocks": [{"type": "markdown", "content": "> **Status**: DRAFT\n>\n> **Principle**: A security policy in my organization states **what must be achieved** — the how lives in standards and procedures. **The language is mandatory or it is not policy**: must, will, shall, and do; never should, try, and mostly — with permitted exceptions **documented, not whispered**. Every policy is a **governed document** — version, effective date, revision history, owner, approver, scope, and management endorsement — and the set is managed deliberately: **separate manageable documents**, aligned to a framework, **centrally stored under revision control**, formally approved, communicated to the people they bind, with backup and physical copies that survive the outage they were written for. Policies are **living documents**, reviewed at least annually and after significant change, with obsolete versions archived. The test I hold the policy set to: **any employee can find the current approved version of the policy that applies to them and understand what it requires — and nobody can find an obsolete one**.\n\n## Statement\n\nWhen my organization writes, approves, and maintains security policies, this is the bar.\n\n**Policy states the what; implementation lives elsewhere.**\n\n- **Every policy has a reason.** Why the policy is needed and which security objective it supports is defined; the policy promotes consistent behavior, reflects the organization's overall security posture, and supports applicable regulatory, compliance, and audit requirements.\n- **Boundaries are explicit.** Expectations, boundaries, and prohibited behavior are clearly defined, and the policy is accessible enough that employees can actually understand the rules that apply to them.\n- **Endorsed from the top.** Every policy carries appropriate management endorsement — a policy without it is an opinion.\n\n**The language is mandatory or it is not policy.**\n\n- Statements are clear, simple, and concise. Policies focus on **what must be achieved**, leaving implementation steps to procedures and standards.\n- Mandatory requirements use **must, will, shall, and do**. Ambiguous terms — should, try, mostly — are avoided for anything mandatory. Permitted exceptions are clearly documented.\n- No unnecessary legalese, no excessively wordy statements; short paragraphs and bullet points where they serve the reader.\n\n![Contrast diagram of mandatory policy words — must, will, shall, do — against ambiguous ones — should, try, mostly — with exceptions as a signed, documented card.](assets/images/policies/mandatory-language.jpeg)\n**Figure 1:** *The language is mandatory or it is not policy: must, will, shall, and do — with permitted exceptions documented, never whispered.*\n\n\n**Every policy is a governed document.**\n\n- Each policy carries a version number, an effective date, a revision history, a named owner, a named approver, and executive sign-off where required.\n- Each policy states its purpose, defines its scope — who or what it applies to — contains the actual policy statements and requirements, and references related policies, standards, procedures, and relevant regulatory or legal requirements. Document and artifact naming is consistent across the set.\n- Roles and responsibilities for implementation, monitoring, compliance, and updates are defined in the document itself.\n\n![Anatomy diagram of a governed policy document with callouts for version, effective date, owner, approver, scope, requirements, and references.](assets/images/policies/governed-document-anatomy.jpeg)\n**Figure 2:** *Every policy is a governed document: version, effective date, owner, approver, scope, and references — metadata that decides which version binds and whose authority backs it.*\n\n\n**Coverage is deliberate, not accidental.**\n\n- The policy set deliberately spans the surface the organization actually has: acceptable use, access control and remote access, passwords, encryption and key protection, email and communications, internet usage, mobile devices, removable media, wireless, software installation, workstation security, server security and auditing, network equipment, malware protection, web application security, incident response and recovery, data breach response, disaster recovery, risk assessment, security awareness and social engineering, data and database credentials, logging, equipment acquisition and disposal, employee and third-party responsibilities, ethics and intellectual property, and whatever industry-specific or regulatory policies apply. A gap in coverage is a silent permission.\n\n**Policies are managed as a set.**\n\n- Separate, manageable documents rather than one omnibus; aligned with an appropriate security framework or regulatory regime; stored in a central, easily accessible location under revision control so the current approved version is always identifiable.\n- A formal review and approval process exists; new and revised policies are communicated to affected personnel; backup copies exist for the policies needed during outages, and critical policies exist on paper for the day digital access is what failed.\n\n**Policies are living documents.**\n\n- Reviewed at least annually — and after significant business, technology, regulatory, or security changes. Outdated requirements and references are updated, each revision records what changed, revised policies are re-approved, alignment with current business objectives is verified, and obsolete versions are removed or archived so nobody follows requirements that no longer exist.\n\n## How to Read This\n\nThis record is the policy layer of **The Security Program** section: [Creating a Security Program: Risk Before Tools](security-program.html) establishes governance and says documented policies must exist; this record fixes what \"a policy\" means before a single one is written. The how — configuration baselines, step-by-step procedures — is deliberately excluded and lives in [Standards and Procedures](standards-and-procedures.html). It is grounded in the \"Policies\" chapter of the *Defensive Security Handbook*. The full working checklist — foundation, language, contents, coverage, management, and maintenance — lives in the **Checklist** tab; the management summary is in the **TL;DR** tab and the conversation in the **Conversation** tab.\n\n## Rationale\n\n**A policy is a boundary, not a manual.** The moment a policy names a product, a port, or a procedure, it starts aging at the speed of the technology it mentions — and every tool swap becomes a policy amendment with executive sign-off. Splitting the what from the how keeps the policy durable while the implementation churns underneath it: \"authentication credentials must be protected in storage and transit\" survives a decade; the standard describing exactly how gets revised every year without touching the mandate. The split is also what keeps policies short enough to read — and a policy nobody reads governs nobody.\n\n**\"Should\" is a loophole spelled politely.** Every should in a policy is a decision delegated to whoever reads it under pressure, and pressure always argues for the convenient reading. Must, will, shall, and do give the employee a rule they can follow, the auditor a claim they can test, and the manager a line they can hold. The record does not pretend exceptions away — it demands they be documented, because a written exception is a decision and an unwritten one is erosion. The precision of the language is the precision of the policy.\n\n**An unowned policy is a rumor.** Version, effective date, owner, approver, revision history — the metadata looks bureaucratic until the day it is the whole argument. When two versions of the password policy circulate, the version block decides which one binds. When a requirement is challenged, the owner is who answers and the approver is whose authority backs it. Management endorsement is not ceremony either: a policy the executive layer never signed is a suggestion the executive layer never made — and it will be treated as exactly that in the first hard conflict with a deadline.\n\n**Coverage gaps are silent permissions.** Whatever has no policy is, in practice, allowed — or rather, decided ad hoc by whoever faces the question first, differently each time. The chapter's coverage list is long deliberately: removable media, wireless, third-party responsibilities, equipment disposal — the unglamorous corners are where the incidents start. Walking the list annually and consciously deciding *we need this one, we do not need that one* converts silent gaps into recorded decisions. Not every organization needs every policy; every organization needs to have decided.\n\n**A policy nobody can find binds nobody.** Central storage, revision control, and communication to affected personnel are what turn a signed document into an operating rule. And the record insists on the unfashionable detail: backup copies of the policies needed during outages, and physical copies of critical ones — because the incident-response policy locked inside the crashed document system is a punchline, not a control. The findability test cuts both ways: the current version must be one search away, and the obsolete version must be gone from where people look, because a stale policy that is still findable is still being followed by someone.\n\n**Review is what separates policy from archaeology.** An organization changes its business, its technology, and its regulatory footprint continuously; a policy set reviewed \"when we get to it\" describes a company that no longer exists. The annual review — plus triggered reviews after significant change — is the mechanism that keeps the mandate true. Recording what changed and re-approving each revision keeps the authority chain intact; archiving obsolete versions finishes the job. A policy set that only ever grows, never prunes, is not governance — it is sediment.\n\n![Circular policy lifecycle diagram — draft, approve, communicate, review, revise — with obsolete versions exiting into an archive.](assets/images/policies/living-policy-loop.jpeg)\n**Figure 3:** *Policies are living documents: reviewed at least annually and after significant change, re-approved on revision — and obsolete versions archived where nobody can follow them.*\n\n## What This Means in Practice\n\n| What this record says | What it does **not** say |\n| --- | --- |\n| Policy states what must be achieved; implementation lives in standards and procedures. | Policies are vague — a mandate can be precise about the outcome without naming a tool. |\n| Mandatory requirements use must, will, shall, and do. | Nothing is ever optional — genuinely optional practices are simply not written as policy, and exceptions are documented. |\n| Every policy has a version, effective date, owner, approver, and revision history. | The metadata is the point — a perfectly governed document with no policy substance is filing, not governance. |\n| Coverage spans the chapter's full list, decided deliberately. | Every organization needs every policy on the list — it needs a recorded decision for each. |\n| Policies live in one central location under revision control, with backup and physical copies of critical ones. | Paper binders for everything — physical copies are for the policies you need when digital access is down. |\n| Policies are reviewed at least annually and after significant change, with obsolete versions archived. | Annual review means annual rewrite — an unchanged policy that was genuinely reviewed and re-dated is a valid outcome. |\n\nConcretely: any new or revised policy in my organization ships with its version block complete and its approver named, and the annual review answers three questions per policy — *is it still true, is it still mandatory in its language, and can the people it binds still find it?* A no on any of the three is a defect with an owner.\n\n## Anti-Patterns\n\n- **The 90-page omnibus.** One giant security policy nobody reads, nobody can revise without a committee, and nobody can map to a specific question — instead of separate, manageable documents.\n- **The \"should\" policy.** Aspirational language throughout — employees cannot tell what is required, auditors cannot test compliance, and enforcement becomes selective by mood.\n- **Policy as procedure.** Tool names, console paths, and step-by-step commands baked into the mandate — outdated at the next upgrade, and every upgrade now needs executive re-approval.\n- **The orphan document.** No owner, no approver, no effective date — a policy that cannot answer *who says so, since when*.\n- **The secret policy.** Approved, filed, and communicated to no one — its first appearance is in the disciplinary meeting after someone violated it.\n- **The immortal draft.** Circulating for two years, cited in arguments, never formally approved — governing by habit without authority.\n- **The stale mandate.** Requirements referencing systems retired years ago, obsolete versions still findable and still followed — archaeology wearing a policy's clothes.\n- **The verbal exception.** Waivers granted in hallways and chat threads, never documented — each one a quiet amendment nobody approved and nobody remembers.\n\n## Related Records\n\n- [Creating a Security Program: Risk Before Tools](security-program.html) — the governance layer there mandates documented policies; this record is the document discipline it delegates.\n- [Standards and Procedures](standards-and-procedures.html) — the how that this record deliberately excludes: standards set the technical bar, procedures give the steps.\n- [Industry Compliance Standards and Frameworks](compliance.html) — policies must support regulatory, compliance, and audit requirements; the compliance frame itself lives there.\n- [Security Education](user-education.html) — communicating a policy makes it known; training makes it lived — the awareness program is there.\n- [Incident Response](incident-response.html) — the incident-response and breach-response policies named in the coverage list get their operating substance there.\n- [Disaster Recovery](disaster-recovery.html) — the disaster-recovery policy is on the coverage list here, and the physical-copy discipline exists for exactly its scenario.\n\n## Scope and Revisiting\n\nThis record is `draft`. It applies to every security policy my organization writes, revises, or inherits — and as the audit bar for the existing set. I revisit it if the regulatory footprint shifts enough to reshape the required coverage list, if policy reviews repeatedly find drift that the annual cycle missed (a signal the review triggers are wrong, not that people are careless), or if employees demonstrably cannot find or understand the policies that bind them — findability failing is the record's own test failing, and it gets fixed before more policy is written.\n\n## Authoritative References\n\n- *Defensive Security Handbook*, 2nd edition (Lee Brotherston, Amanda Berlin, and William F. Reyor III) — the \"Policies\" chapter, whose checklist this record distills.\n"}]}, {"key": "summary", "label": "TL;DR", "meta": {"timetoread": "2 min read"}, "blocks": [{"type": "markdown", "content": "A security policy in my organization states **what must be achieved** — the how lives in standards and procedures. The language is mandatory or it is not policy: must, will, shall, and do, never should, try, and mostly, with exceptions documented. Every policy is a governed document, the set is managed deliberately, and policies are living documents reviewed at least annually. The test the set is held to: any employee can find the current approved version of the policy that applies to them and understand what it requires — and nobody can find an obsolete one.\n\n**What changes**\n\n* **Policy and implementation split cleanly.** Policies state outcomes and boundaries tied to a security objective; tool names, configurations, and step-by-step instructions move to standards and procedures — so the mandate stays durable while the technology churns.\n* **The language becomes binding.** Mandatory requirements use must, will, shall, and do; ambiguous terms are banned for anything mandatory; permitted exceptions are documented rather than whispered; legalese is out, short clear statements are in.\n* **Every policy becomes a governed document.** Version number, effective date, revision history, named owner, named approver, executive sign-off where required, explicit purpose and scope, and references to related documents and regulatory requirements.\n* **Coverage becomes a decision, not an accident.** The set is walked against the chapter's full list — acceptable use through equipment disposal, third-party responsibilities, and industry-specific policies — and each entry is deliberately adopted or deliberately declined.\n* **The set gets a lifecycle.** Separate manageable documents, framework-aligned, centrally stored under revision control, formally approved, communicated to affected personnel, backed up — with physical copies of critical policies — and reviewed at least annually and after significant change, with obsolete versions archived.\n\n**What it costs**\n\n* Real governance overhead per document — owners, approvers, revision records, and re-approval on every change — accepted because an unowned policy is a rumor.\n* An annual review cycle that consumes leadership attention even in years when the answer is \"still true, re-dated.\"\n* Splitting policy from procedure means maintaining two document layers instead of one — the price of mandates that survive tool swaps.\n\n**What we are not doing**\n\n* Not writing the how here — configuration baselines and step-by-step instructions are [Standards and Procedures](standards-and-procedures.html).\n* Not defining the substance of each named policy — incident response and disaster recovery get their operating content in [Incident Response](incident-response.html) and [Disaster Recovery](disaster-recovery.html).\n* Not treating communication as education — making policies known happens here; making them lived is [Security Education](user-education.html).\n\n*The Article tab carries the rationale and anti-patterns; the Checklist tab carries the full working checklist from policy foundation to review and maintenance. Grounded in the \"Policies\" chapter of the* Defensive Security Handbook*.*\n"}]}, {"key": "checklist", "label": "Checklist", "meta": {"timetoread": "4 min read"}, "blocks": [{"type": "markdown", "content": "*The working checklist behind this record — writing, governing, and maintaining the security policy set. The Article tab carries the rationale and anti-patterns.*\n\n## Policy Foundation\n\n- [ ] Define why the policy is needed and what security objective it supports\n- [ ] Ensure the policy promotes consistent behavior across the organization\n- [ ] Make the policy accessible so employees can understand applicable rules\n- [ ] Clearly define expectations, boundaries, and prohibited behavior\n- [ ] Confirm the policy supports applicable regulatory, compliance, and audit requirements\n- [ ] Ensure the policy reflects the organization's overall security posture\n- [ ] Obtain appropriate management endorsement\n\n## Policy Language\n\n- [ ] Write clear, simple, and concise policy statements\n- [ ] Focus policies on **what must be achieved**, leaving detailed implementation steps to procedures or standards\n- [ ] Use strong terms such as **must**, **will**, **shall**, and **do** when requirements are mandatory\n- [ ] Avoid ambiguous terms such as **should**, **try**, and **mostly** for mandatory requirements\n- [ ] Clearly document any permitted exceptions\n- [ ] Avoid unnecessary legalese or excessively wordy statements\n- [ ] Use short paragraphs or bullet points where appropriate\n\n## Required Document Contents\n\n- [ ] Include a version number\n- [ ] Include an effective date\n- [ ] Include a revision history or summary of changes\n- [ ] Identify the policy owner\n- [ ] Identify the policy approver\n- [ ] Define roles and responsibilities for implementation, monitoring, compliance, and updates\n- [ ] Include executive sign-off where required\n- [ ] Provide a brief purpose or overview\n- [ ] Clearly define the scope and who or what the policy applies to\n- [ ] Include the actual policy statements and requirements\n- [ ] Reference related policies, standards, procedures, processes, and forms\n- [ ] Reference relevant regulatory, legal, or compliance requirements where appropriate\n- [ ] Use consistent document and artifact naming conventions\n\n## Policy Coverage\n\n- [ ] Acceptable use\n- [ ] Access control and remote access\n- [ ] Password construction and protection\n- [ ] Encryption and key protection\n- [ ] Email and communications\n- [ ] Internet usage\n- [ ] Mobile devices\n- [ ] Removable media\n- [ ] Wireless communications\n- [ ] Software installation\n- [ ] Workstation security\n- [ ] Server security and auditing\n- [ ] Router, switch, and network security\n- [ ] Malware and antivirus protection\n- [ ] Web application security\n- [ ] Incident response and recovery\n- [ ] Data breach response\n- [ ] Disaster recovery\n- [ ] Risk assessment\n- [ ] Security awareness and social engineering\n- [ ] Data/database credentials\n- [ ] Logging\n- [ ] Equipment acquisition and disposal\n- [ ] Employee and third-party responsibilities\n- [ ] Ethics and intellectual property\n- [ ] Any industry-specific or regulatory policies required by the organization\n\n## Policy Management\n\n- [ ] Create separate, manageable policy documents rather than one large document where practical\n- [ ] Align policies with an appropriate security framework or regulatory regime\n- [ ] Store policies in a central and easily accessible location\n- [ ] Use revision control so the current approved version is identifiable\n- [ ] Establish a formal review and approval process\n- [ ] Communicate new and revised policies to affected personnel\n- [ ] Keep backup copies of policies needed during outages or disaster recovery\n- [ ] Maintain physical copies of critical policies when digital access may be unavailable\n\n## Review and Maintenance\n\n- [ ] Treat policies as living documents\n- [ ] Review policies at least annually or according to the organization's review schedule\n- [ ] Review policies after significant business, technology, regulatory, or security changes\n- [ ] Update outdated requirements and references\n- [ ] Record what changed during each revision\n- [ ] Obtain required approval for revised policies\n- [ ] Verify policies remain aligned with current business objectives and the operating environment\n- [ ] Remove or archive obsolete versions so users do not follow outdated requirements\n\nWith every section green, the policy set is governed, findable, and alive — the mandate layer that [Standards and Procedures](standards-and-procedures.html) turns into technical bars and steps. The test running through the whole sequence: **can any employee find the current approved version of the policy that applies to them and understand what it requires — and is every obsolete version out of reach?**\n"}]}, {"key": "dialog", "label": "Conversation", "meta": {"timetoread": "7 min listen"}, "blocks": [{"type": "markdown", "content": "## Paper Versus Protection\n\n**Ben:** Let me open with what every engineer in the room is thinking: policies are the part of security that produces binders instead of protection. Attackers do not read our acceptable-use policy. Why does this deserve a record?\n\n**Ana:** Because policies are not aimed at attackers — they are aimed at the thousand daily decisions our own people make. Whether the contractor gets remote access, whether the database credentials go in the wiki, whether the old laptop goes in the bin with its disk. Without written boundaries, each of those is decided ad hoc by whoever faces it first, differently every time. The record's opening commitment is that every policy exists for a reason: a named security objective, consistent behavior across the organization, and support for the regulatory and audit requirements we actually carry.\n\n**Ben:** But that's exactly how you get the 90-page Security Policy that nobody has ever read to the end.\n\n**Ana:** Which is the first anti-pattern, and the record kills it structurally: separate, manageable documents rather than one omnibus. A policy someone can read in five minutes, scoped to one topic, findable when the question arises. And — this is the load-bearing split — the policy states *what must be achieved*, and leaves the implementation steps to procedures and standards. That single decision is what keeps policies short.\n\n**Ben:** Expand on that split, because it sounds like an excuse for vagueness. \"Achieve security\" — very achievable, very meaningless.\n\n**Ana:** The split isn't vague versus specific — it's outcome versus mechanism. \"Authentication credentials must be protected in storage and in transit\" is precise about the outcome and silent about the mechanism. The moment a policy names a product, a port, or a console path, it starts aging at the speed of that technology — and every tool swap suddenly requires executive re-approval of a mandate that didn't actually change. The mandate lives here; the mechanism lives in [Standards and Procedures](standards-and-procedures.html), where it can be revised at engineering speed.\n\n## The Words That Bind\n\n**Ben:** The language section reads almost like a style guide. Must, will, shall, do — banned words: should, try, mostly. Is grammar really a security control?\n\n**Ana:** In a policy, the grammar *is* the control. Every \"should\" is a decision delegated to whoever reads it under pressure — and pressure always argues for the convenient reading. \"Passwords should be unique\" means, operationally, \"unless it's Friday.\" Must, will, shall give the employee a rule they can follow, the auditor a claim they can test, and a manager a line they can hold without negotiating each case. The precision of the language is the precision of the policy.\n\n**Ben:** Real organizations run on exceptions, though. The legacy system that can't do MFA, the vendor who needs the weird access. Hard mandatory language just drives exceptions underground.\n\n**Ana:** Only if you pretend they don't exist. The record does the opposite: permitted exceptions are clearly documented. A written exception is a decision — scoped, visible, attributable. The verbal exception is the anti-pattern: waivers granted in hallways and chat threads, each one a quiet amendment nobody approved and nobody remembers. Mandatory language plus documented exceptions is honest; soft language plus invisible exceptions is erosion.\n\n**Ben:** Then the document metadata — version, effective date, revision history, owner, approver, executive sign-off. That's the bureaucratic part people skip.\n\n**Ana:** Until the day it's the entire argument. Two versions of the password policy are circulating — the version block decides which one binds. A requirement gets challenged — the owner answers, and the approver's authority backs it. An unowned policy is a rumor. And management endorsement is not ceremony: a policy the executive layer never signed is a suggestion the executive layer never made, and in the first hard collision with a deadline it gets treated as exactly that. Two anti-patterns live here — the orphan document and the immortal draft, the one that's been cited for two years and formally approved never.\n\n## Coverage and Findability\n\n**Ben:** The coverage list is twenty-six items — removable media, wireless, ethics, equipment disposal. Does a two-hundred-person company really need twenty-six policies?\n\n**Ana:** Maybe not — but it needs twenty-six *decisions*. The record's phrase is that a coverage gap is a silent permission: whatever has no policy is, in practice, allowed, or decided differently by each person who hits the question. Walking the list and consciously recording \"we need this, we don't need that\" converts silent gaps into decisions. And notice the unglamorous corners on that list — removable media, third-party responsibilities, equipment disposal. That's where incidents actually start, precisely because nobody wrote anything down.\n\n**Ben:** Fine. Now the part that surprised me: physical copies. Paper, in 2026?\n\n**Ana:** For critical policies, yes — and the reasoning is cold. The policies you need most urgently are the ones for outages and disasters, and those are exactly the moments your document platform may be down or ransomed. The incident-response policy locked inside the crashed document system is a punchline, not a control. Central storage under revision control is the daily answer; backup copies and paper for the critical few is the bad-day answer.\n\n**Ben:** And findability generally — you've made it the record's headline test.\n\n**Ana:** Because a policy nobody can find binds nobody. The test cuts in both directions: the current approved version must be one search away for the person it applies to — and the obsolete version must be gone from where people look, because a stale policy that's still findable is still being followed by somebody. That's why \"remove or archive obsolete versions\" is in the maintenance section and not a footnote. The secret policy — approved, filed, communicated to no one, making its debut in a disciplinary meeting — fails the same test from the other side.\n\n## Keeping It Alive\n\n**Ben:** Annual review of every policy. In practice that becomes a calendar ritual: open document, change the year, close document.\n\n**Ana:** An unchanged policy that was genuinely reviewed is a legitimate outcome — the record says so explicitly. What it refuses is the un-review. The three questions I ask per policy are: is it still true, is its language still mandatory, and can the people it binds still find it? And reviews aren't only calendar-driven — significant business, technology, regulatory, or security changes trigger them too. A policy set reviewed \"when we get to it\" describes a company that no longer exists. That's the stale mandate anti-pattern: requirements referencing systems retired years ago.\n\n**Ben:** And each revision goes back through approval?\n\n**Ana:** Recorded and re-approved — that keeps the authority chain intact. What changed, who approved it, effective when. Governance isn't the write-once act; it's the maintained chain.\n\n**Ben:** All right, here's my concession, with a condition. Policies earn their place if they stay short, mandatory, owned, and findable — the moment they bloat into procedure manuals or rot into archaeology, they're back to being binders.\n\n**Ana:** That's not a condition — that's the record. Policy says what must be achieved, in language that binds, in documents that are owned, found, and alive. Everything else — the how — belongs one layer down. And the test never changes: anyone can find the current version that applies to them and understand it, and no one can find an obsolete one.\n"}]}, {"key": "comics", "label": "Comic", "meta": {}, "blocks": [{"type": "markdown", "content": "Why a policy states what must be achieved — and why \"should\" is not policy language — in nine panels.\n\n<!-- comic-style\n{\n  \"cast\": \"VERA: a calm, seasoned engineering executive, short gray-streaked hair, dark blazer over a plain t-shirt, carries a small black notebook. NADIA: a hands-on defensive-security lead, shoulder-length dark hair tied back, navy utility jacket over a plain shirt, an access badge on a lanyard, laptop with a padlock sticker under one arm.\",\n  \"style\": \"Clean two-tone explainer comic, thick ink outlines, flat colors with deep blue and green accents on a light background, generous white space, hand-lettered speech bubbles with SHORT readable text, no photorealism.\"\n}\n-->\n\n![Comic panel: Nadia hauls a giant dusty tome labeled Security Policy while a frightened employee peeks from behind a desk.](assets/images/policies/comic-01-the-90-page-omnibus.jpeg)\n**Panel 1:** *The hook: the 90-page omnibus — one giant policy nobody reads, nobody can revise without a committee, and nobody can map to a real question.*\n\n![Comic panel: an employee stands at a crossroads with blank signposts while coworkers offer conflicting ghost versions of the rule.](assets/images/policies/comic-02-a-policy-nobody-reads.jpeg)\n**Panel 2:** *The problem: a policy nobody can find or understand binds nobody — the gap gets decided ad hoc by whoever faces the question first, differently each time.*\n\n![Comic panel: the word Should on a policy page opens like a gap in a fence and an employee with a deadline slips through it.](assets/images/policies/comic-03-the-should-loophole.jpeg)\n**Panel 3:** *The wrong way: 'should' is a loophole spelled politely — every one is a decision delegated to whoever reads it under pressure, and pressure argues for the convenient reading.*\n\n![Comic panel: Vera holds a stone tablet reading What Must Be Achieved while Nadia shelves Standards and Procedures binders by a revolving door.](assets/images/policies/comic-04-what-not-how.jpeg)\n**Panel 4:** *The principle: policy states the what — durable for a decade; the how lives in standards and procedures, revised every year without touching the mandate.*\n\n![Comic panel: Nadia builds a wall from bricks labeled Must, Will, Shall, Do and bins sponge bricks labeled Should, Try, Mostly; a signed Exception card hangs on a hook.](assets/images/policies/comic-05-must-will-shall-do.jpeg)\n**Panel 5:** *The language is mandatory or it is not policy: must, will, shall, and do — and permitted exceptions are documented, because a written exception is a decision and an unwritten one is erosion.*\n\n![Comic panel: two employees wave conflicting policy printouts while Vera points at a header block with version, date, owner, and approver fields.](assets/images/policies/comic-06-the-version-block.jpeg)\n**Panel 6:** *Every policy is a governed document — version, effective date, owner, approver, endorsement. When two versions circulate, the version block is the whole argument.*\n\n![Comic panel: a shelf of slim policy booklets with one empty glowing slot through which a USB stick character sneaks in.](assets/images/policies/comic-07-gaps-are-permissions.jpeg)\n**Panel 7:** *Coverage is deliberate, not accidental: walk the full list and decide each one — because whatever has no policy is, in practice, allowed.*\n\n![Comic panel: during an outage with dead monitors, Nadia retrieves a printed Incident Response Policy binder from a break-glass wall cabinet.](assets/images/policies/comic-08-the-paper-copy.jpeg)\n**Panel 8:** *Managed as a set: central storage under revision control — and paper copies of critical policies, because the response policy locked inside the crashed system is a punchline, not a control.*\n\n![Comic panel: an employee finds the current approved policy in one search while Vera locks an obsolete version into an archive drawer.](assets/images/policies/comic-09-the-findability-test.jpeg)\n**Panel 9:** *The closer: the test the set is held to — any employee can find the current approved policy that applies to them, and nobody can find an obsolete one.*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
