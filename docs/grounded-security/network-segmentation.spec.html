<script id="data" type="application/json">{"meta": {}, "tags": [], "modalities": [{"key": "spec", "label": "Spec", "meta": {}, "blocks": [{"type": "markdown", "content": "# Spec: Network Segmentation\n\n> Working doc for the post in this folder. The spec drives the post; the post\n> is the artifact.\n\n## Intent\n\nFix the shape of segmentation in my organization: least privilege applied to\ntraffic, not just accounts. The post turns the Network Segmentation chapter\nof the *Defensive Security Handbook* (titled \"Network Segmentation Security\"\non its checklist) into an operating record: segments designed from risk,\nfunction, sensitivity, and business need against a documented topology and\ntrust boundaries, with default-deny between segments and approved flows\ndocumented and periodically pruned; boundaries enforced with firewalls,\nrouters, and switches — dev/test separated from production, internet-facing\nsystems in a default-deny DMZ that cannot talk freely inward, guest networks\nisolated; VLANs used with ACLs but never mistaken for the only control;\nACLs specific (source, destination, port, protocol), no ANY-ANY, explicit\ndeny at the end, reviewed and tested before production; admission earned\nthrough NAC/802.1X with posture validation and quarantine for unknown\ndevices; VPN access granted on business need, scoped to required resources,\nsplit tunneling scrutinized; egress restricted so servers without an\ninternet need have no internet; application tiers separated (web from\ndatabase, keys off public-facing servers); SDN/microsegmentation evaluated\nwith its control plane secured; duties segmented too — dev/prod separation,\nRBAC, separate standard and privileged accounts, no generic admin logins;\nsensitive and regulated data in dedicated zones with extra monitoring,\nmapped to PCI DSS/HIPAA where applicable; and the whole design monitored,\ndocumented, and *tested* — prohibited traffic proven blocked. The\nload-bearing test, from the chapter's own Final Review: each segment can\ncommunicate only with the systems it legitimately needs — and lateral\nmovement is minimized by design, not by hope.\n\n## Audience\n\nNetwork and platform teams in my organization designing or auditing zones,\nVLANs, ACLs, and NAC (so they know the bar the design is held to); security\nengineers verifying that segmentation is real; peer executives who want to\nsee what \"least privilege for packets\" concretely commits us to.\nFirst-person declarative.\n\n## Success criteria\n\n- [x] **Principle is quotable** — highlight states segmentation as least\n      privilege applied to traffic, default-deny between segments, and\n      closes with the chapter's test: each segment communicates only with\n      what it legitimately needs, prohibited traffic proven blocked.\n- [x] **Design discipline survives** — identify what requires segmentation;\n      document topology and trust boundaries; separate by risk, function,\n      sensitivity, and business need; least privilege between segments;\n      default-deny/allow-list; approved flows documented; rules reviewed\n      and unnecessary access removed.\n- [x] **Boundary mechanics survive** — firewalls/routers/switches as\n      boundaries with per-segment rules and boundary monitoring; dev/test\n      separated from production; sensitive and regulated networks separated;\n      internet-facing systems in a DMZ that denies by default, admits only\n      required ports, and cannot talk freely inward; guest networks\n      isolated; broadcast reduced; VLANs grouped by security requirement,\n      ACL-controlled, hopping-protected, documented, and never the only\n      control; ACLs specific, no ANY-ANY, explicit deny, logged, reviewed,\n      tested before production.\n- [x] **Admission and remote access survive** — NAC with authentication\n      before access, 802.1X where appropriate, posture validation,\n      quarantine for unknown/noncompliant devices, vendor equipment scanned,\n      guest captive portals with internet-only access, NAC in shared spaces,\n      BYOD integration; VPN with strongest practical auth and current\n      encryption, business-need access removed when no longer needed, users\n      limited to required resources, host-integrity checks, centralized\n      identity, logging and audit, split tunneling carefully evaluated.\n- [x] **Egress and application segmentation survive** — internet access\n      justified per system, internal repositories for updates, outbound\n      restricted by destination/port/protocol and monitored; application\n      tiers separated (web vs. database), database access restricted to\n      authorized systems, raw file access prevented, TLS keys off\n      public-facing servers, proxies/load balancers used where appropriate,\n      sensitive-data applications segmented especially; unrelated critical\n      services kept off shared servers — domain controllers, mail servers,\n      and PII systems isolated.\n- [x] **SDN and duty segmentation survive** — SDN/microsegmentation\n      evaluated, control plane secured, controller access restricted,\n      automated policy changes monitored, documentation current; dev/prod\n      responsibilities separated, transaction creation vs. approval split,\n      RBAC with regular permission reviews, generic admin accounts disabled\n      and alerted on, DBA privileges scoped, separate standard and\n      privileged accounts with privileged used only for admin work,\n      admin workstations considered, backup administrators identified.\n- [x] **Sensitive-data zones and the verification loop survive** — sensitive\n      data located and zoned with business-need access and extra monitoring;\n      PCI DSS / HIPAA segmentation requirements verified and the compliance\n      story documented; traffic captured and flow-analyzed, boundary logging\n      of permitted and denied traffic, regular review of firewall/VLAN/ACL/\n      NAC/VPN configurations, segmentation controls tested to prove\n      prohibited traffic is blocked, diagrams current, naming consistent,\n      obsolete rules removed, design reassessed on change; the chapter's\n      Final Review reproduced.\n- [x] **Credit is explicit** — References name the *Defensive Security\n      Handbook* and the Network Segmentation chapter checklist, plus the\n      standards the chapter names (PCI DSS, HIPAA, 802.1X).\n\n## Non-goals\n\n- Not [Secure Network Infrastructure](network-security.html) — the switches, routers, and firewalls that\n  enforce these boundaries are hardened there; this record designs what\n  they enforce.\n- Not [Authentication](authentication.html) — NAC and VPN authenticate devices and users with\n  the credential and MFA discipline committed to there.\n- Not [Intrusion Detection and Prevention Systems](ids-ips.html) — boundary monitoring here feeds detection; the detection\n  and prevention systems live there.\n- Not [Databases](databases.html) — restricting who reaches the database is committed\n  here; hardening the database itself lives there.\n- Not [Industry Compliance Standards and Frameworks](compliance.html) — PCI DSS and HIPAA segmentation requirements are\n  verified here; the compliance program that owns the frameworks lives\n  there.\n- Not a topology mandate — no zone map, VLAN plan, or microsegmentation\n  product is prescribed; the commitments hold for any design that passes\n  the test.\n\n## Modalities\n\nThe working tool ships as the checklist modality (`checklist.md`, rendered\nas the Checklist tab).\n\n- [x] `checklist.md` — operational checklist\n- [x] `summary.md` — management summary\n- [x] `dialog.md` — two-host dialog\n- [ ] `comics.md` — explainer comic (added later with the visual layer)\n\n## Open questions\n\n- None.\n\n## Decision log\n\n- **2026-08-22** — Grounded in the Network Segmentation chapter checklist of\n  the *Defensive Security Handbook* (Brotherston, Berlin, Reyor), read\n  through a practitioner-executive lens, as with every record in this\n  journal.\n\n## Sources\n\n- **Internal**\n  - `sources/checklists/defensive-security-handbook/Checklist_ DSH _ 17 _ Network Segmentation.pdf`\n    — the chapter checklist; reproduced, adapted, in the Checklist tab\n    (`checklist.md`), including the Final Review.\n- **External**\n  - *Defensive Security Handbook*, 2nd edition — the Network Segmentation\n    chapter checklist.\n\n## Changelog\n\n- **2026-08-22** — Initial spec, article, checklist, summary, and dialog\n  written; spec and post agree. Status `accepted`. *(Željko, AI-mediated\n  session)*\n- **2026-08-22** — Post-review fixes applied (see REVIEW.md). *(Željko,\n  AI-mediated session)*\n"}]}]}</script>
<script>
    (function () {
        const data = JSON.parse(document.getElementById('data').textContent);
        const root = document.getElementById('content');

        const postId = (data.meta && data.meta.id) ? String(data.meta.id) : '';
        const postStatusRaw = (data.meta && data.meta.status) ? String(data.meta.status) : '';
        if (postId || postStatusRaw) {
            const header = document.getElementById('post-header');
            let sectionEl = header.querySelector('p.section');
            if (!sectionEl) {
                sectionEl = document.createElement('p');
                sectionEl.className = 'section';
                header.insertBefore(sectionEl, header.firstChild);
            }
            // Status pill goes first, then a " / " separator before the existing
            // content (section name and/or id).
            if (postStatusRaw) {
                const parts = postStatusRaw.split(':');
                const statusName = parts[0].trim();
                const statusColor = (parts[1] || '').trim();
                const wrap = document.createElement('span');
                wrap.className = 'post-status';
                const dot = document.createElement('span');
                dot.className = 'status-dot';
                if (statusColor) dot.style.background = statusColor;
                wrap.appendChild(dot);
                wrap.appendChild(document.createTextNode(statusName));
                if (sectionEl.firstChild) {
                    sectionEl.insertBefore(document.createTextNode(' • '), sectionEl.firstChild);
                    sectionEl.insertBefore(wrap, sectionEl.firstChild);
                } else {
                    sectionEl.appendChild(wrap);
                }
            }
            if (postId) {
                if (sectionEl.firstChild) sectionEl.appendChild(document.createTextNode(' • '));
                sectionEl.appendChild(document.createTextNode(postId));
            }
        }

        const tagsHost = document.getElementById('tags');
        (data.tags || []).forEach(function (t) {
            const span = document.createElement('span');
            span.className = 'tag';
            span.textContent = t;
            tagsHost.appendChild(span);
        });

        // Minimal markdown renderer. Supports: ATX headings, paragraphs, blockquotes,
        // unordered/ordered lists, fenced code, inline code, bold/italic/strikethrough, links, images, hr.
        // Sufficient for the posts in this repo; replace with a fuller parser if needed.
        function renderMarkdown(src) {
            const lines = src.replace(/\r\n/g, '\n').split('\n');
            const out = [];
            let i = 0;

            const bullet = /^(\s*)([-*])\s+(.*)$/;
            const ordered = /^(\s*)(\d+)\.\s+(.*)$/;
            const tableRow = /^\s*\|(.+)\|\s*$/;
            const tableSep = /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/;

            function splitRow(s) {
                let t = s.trim();
                if (t.startsWith('|')) t = t.slice(1);
                if (t.endsWith('|')) t = t.slice(0, -1);
                return t.split('|').map(c => c.trim());
            }

            function inline(s) {
                // Posts are trusted content, so raw HTML passes through unescaped
                // (some posts embed inline <blockquote>, <div>, etc.).
                // Stray ampersands still get fixed up.
                s = s.replace(/&(?![a-zA-Z]+;|#\d+;)/g, '&amp;');
                s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<a class="image-link" href="$2" target="_blank" rel="noopener noreferrer"><img alt="$1" src="$2"></a>');
                s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
                s = s.replace(/`([^`]+)`/g, function (_, c) {
                    return '<code>' + c.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code>';
                });
                // Bold/italic, including nested combinations: ***x***,
                // **a *b*** / ***a* b** (shared delimiters), and **a *b* c**.
                s = s.replace(/\*\*\*([^*\n]+)\*\*\*/g, '<strong><em>$1</em></strong>');
                s = s.replace(/\*\*([^*\n]+)\*([^*\n]+)\*\*\*/g, '<strong>$1<em>$2</em></strong>');
                s = s.replace(/\*\*\*([^*\n]+)\*([^*\n]+)\*\*/g, '<strong><em>$1</em>$2</strong>');
                s = s.replace(/\*\*((?:[^*\n]|\*(?!\*)[^*\n]+\*(?!\*))+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                s = s.replace(/~~([^~\n]+)~~/g, '<del>$1</del>');
                s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
                return s;
            }

            while (i < lines.length) {
                const line = lines[i];
                if (!line.trim()) {
                    i++;
                    continue;
                }

                const fence = line.match(/^```(\w*)\s*$/);
                if (fence) {
                    i++;
                    const buf = [];
                    while (i < lines.length && !/^```\s*$/.test(lines[i])) {
                        buf.push(lines[i]);
                        i++;
                    }
                    i++;
                    const escaped = buf.join('\n').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    const cls = fence[1] ? ' class="lang-' + fence[1] + '"' : '';
                    out.push('<pre><code' + cls + '>' + escaped + '</code></pre>');
                    continue;
                }

                const h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) {
                    out.push('<h' + h[1].length + '>' + inline(h[2]) + '</h' + h[1].length + '>');
                    i++;
                    continue;
                }

                if (/^\s*(?:-\s*){3,}\s*$/.test(line) || /^\s*\*{3,}\s*$/.test(line)) {
                    out.push('<hr>');
                    i++;
                    continue;
                }

                if (/^>\s?/.test(line)) {
                    const buf = [];
                    while (i < lines.length && /^>\s?/.test(lines[i])) {
                        buf.push(lines[i].replace(/^>\s?/, ''));
                        i++;
                    }
                    out.push('<blockquote>' + renderMarkdown(buf.join('\n')) + '</blockquote>');
                    continue;
                }

                if (tableRow.test(line) && i + 1 < lines.length && tableSep.test(lines[i + 1])) {
                    const headers = splitRow(line);
                    i += 2;
                    const rows = [];
                    while (i < lines.length && tableRow.test(lines[i])) {
                        rows.push(splitRow(lines[i]));
                        i++;
                    }
                    let html = '<div class="table-wrap"><table><thead><tr>';
                    headers.forEach(h => {
                        html += '<th>' + inline(h) + '</th>';
                    });
                    html += '</tr></thead><tbody>';
                    rows.forEach(r => {
                        html += '<tr>';
                        r.forEach(c => {
                            html += '<td>' + inline(c) + '</td>';
                        });
                        html += '</tr>';
                    });
                    html += '</tbody></table></div>';
                    out.push(html);
                    continue;
                }

                if (bullet.test(line) || ordered.test(line)) {
                    // Indent of the first bullet defines this list's base level.
                    // Deeper-indented bullets become nested lists (rendered by
                    // recursing into renderMarkdown). Same-or-less indent at a
                    // bullet starts a sibling item (or ends the list).
                    const firstMatch = line.match(bullet) || line.match(ordered);
                    const baseIndent = firstMatch[1].length;
                    const isOrdered = ordered.test(line);
                    const items = [];
                    let hasTask = false;
                    while (i < lines.length) {
                        const cur = lines[i];
                        if (!cur.trim()) {
                            // blank line breaks the list (matches CommonMark-ish behaviour)
                            i++;
                            break;
                        }
                        const mBul = cur.match(bullet);
                        const mOrd = cur.match(ordered);
                        const m = mBul || mOrd;
                        if (!m) break;
                        if (m[1].length < baseIndent) break;
                        if (m[1].length > baseIndent) break; // shouldn't happen at top of loop
                        // Same-type check: switching between -/* and 1. closes the list
                        if (isOrdered !== !!mOrd) break;

                        const itemBuf = [m[3]];
                        const nestedBuf = [];
                        i++;
                        while (i < lines.length) {
                            const nxt = lines[i];
                            if (!nxt.trim()) break;
                            const nBul = nxt.match(bullet);
                            const nOrd = nxt.match(ordered);
                            const nm = nBul || nOrd;
                            if (nm) {
                                if (nm[1].length > baseIndent) {
                                    // nested list line — dedent and stash
                                    nestedBuf.push(nxt.slice(baseIndent + 2));
                                    i++;
                                    continue;
                                }
                                // sibling or end of list
                                break;
                            }
                            // Plain continuation text
                            if (nestedBuf.length) {
                                // continuation inside the nested block
                                nestedBuf.push(nxt.slice(baseIndent + 2));
                            } else {
                                itemBuf.push(nxt.trim());
                            }
                            i++;
                        }

                        // GitHub-style task items: "- [ ] text" / "- [x] text"
                        // render as (clickable, unpersisted) checkboxes.
                        const itemText = itemBuf.join('\n');
                        const task = !isOrdered && itemText.match(/^\[( |x|X)\]\s+/);
                        let liHtml = inline(task ? itemText.slice(task[0].length) : itemText);
                        if (task) {
                            hasTask = true;
                            liHtml = '<input type="checkbox"' + (task[1] === ' ' ? '' : ' checked') + '>' + liHtml;
                        }
                        if (nestedBuf.length) {
                            liHtml += renderMarkdown(nestedBuf.join('\n'));
                        }
                        items.push(task ? '<li class="task">' + liHtml + '</li>' : '<li>' + liHtml + '</li>');
                    }
                    out.push((isOrdered ? '<ol>' : (hasTask ? '<ul class="task-list">' : '<ul>')) + items.join('') + (isOrdered ? '</ol>' : '</ul>'));
                    continue;
                }

                const buf = [line];
                i++;
                while (i < lines.length && lines[i].trim() && !/^#{1,6}\s/.test(lines[i]) && !/^>\s?/.test(lines[i]) && !bullet.test(lines[i]) && !ordered.test(lines[i]) && !/^```/.test(lines[i]) && !tableRow.test(lines[i])) {
                    buf.push(lines[i]);
                    i++;
                }
                out.push('<p>' + inline(buf.join(' ')) + '</p>');
            }
            return out.join('\n');
        }

        // Block dispatcher. New block types plug in here.
        const renderers = {
            markdown: function (block) {
                const div = document.createElement('div');
                div.innerHTML = renderMarkdown(block.content);
                return div;
            },
            mermaid: function (block) {
                // Mermaid scans elements with class "mermaid" whose textContent
                // is the diagram source. We collect these nodes and run
                // mermaid.run() once after all blocks are in the DOM.
                const div = document.createElement('div');
                div.className = 'mermaid';
                div.textContent = block.content;
                return div;
            },
            'force-graph': function (block) {
                // build.py emits parsed JSON: {nodes:[{id,size}], links:[{source,target}]}.
                // We instantiate force-graph after the container is in the DOM
                // so it can measure its own width.
                const div = document.createElement('div');
                div.className = 'force-graph';
                const data = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.ForceGraph) return;
                    const maxSize = data.nodes.reduce((m, n) => Math.max(m, n.size || 1), 1);
                    window.ForceGraph()(div)
                        .graphData(data)
                        .width(div.clientWidth)
                        .height(div.clientHeight)
                        .nodeRelSize(4)
                        .nodeVal(n => Math.max(20 * (n.size || 1) / maxSize, 0.001))
                        .nodeLabel(n => n.id + ' (' + (n.size || 1) + ')')
                        .nodeColor(() => 'rgba(135, 206, 235, 0.7)')
                        .linkColor(() => 'rgba(60, 60, 60, 0.4)')
                        .linkDirectionalArrowLength(4)
                        .linkDirectionalArrowRelPos(1)
                        .linkWidth(1);
                });
                return div;
            },
            'bubble-chart': function (block) {
                // build.py emits {nodes:[{name,size}]}. Renders a D3 circle-pack
                // SVG (same shape as the obren.io reference, just inline).
                const wrap = document.createElement('div');
                wrap.className = 'bubble-chart';
                const payload = JSON.parse(block.content);
                requestAnimationFrame(function () {
                    if (!window.d3) return;
                    const diameter = 480;
                    const fill = '#c0deed';
                    const textColor = '#111111';
                    const fontSize = 12;

                    const svg = window.d3.select(wrap).append('svg')
                        .attr('viewBox', '0 0 ' + diameter + ' ' + diameter)
                        .attr('width', diameter)
                        .attr('height', diameter);

                    const root = window.d3.hierarchy({children: payload.nodes})
                        .sum(d => d.size || 0)
                        .sort((a, b) => b.value - a.value);

                    window.d3.pack().size([diameter, diameter]).padding(2)(root);

                    const node = svg.selectAll('g')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('transform', d => 'translate(' + d.x + ',' + d.y + ')');

                    node.append('title').text(d => d.data.name + ': ' + d.value);
                    node.append('circle').attr('r', d => d.r).style('fill', fill);
                    node.append('text')
                        .attr('dy', '.3em')
                        .style('text-anchor', 'middle')
                        .style('fill', textColor)
                        .style('font-size', fontSize + 'px')
                        .text(d => d.data.name.substring(0, Math.max(0, Math.floor(d.r / 3))));
                });
                return wrap;
            }
        };

        // Render one modality's blocks into a host element. Mermaid runs
        // scoped to just the nodes created here, so lazily rendered tabs get
        // their diagrams on first activation.
        let mermaidInitialized = false;
        function renderBlocksInto(blocks, host) {
            const mermaidNodes = [];
            blocks.forEach(function (block) {
                const r = renderers[block.type];
                if (!r) {
                    const pre = document.createElement('pre');
                    pre.textContent = '[unknown block type: ' + block.type + ']';
                    host.appendChild(pre);
                    return;
                }
                const node = r(block);
                if (node instanceof Node) {
                    host.appendChild(node);
                    if (block.type === 'mermaid') mermaidNodes.push(node);
                }
            });
            if (mermaidNodes.length && window.mermaid) {
                if (!mermaidInitialized) {
                    window.mermaid.initialize({startOnLoad: false, theme: 'default'});
                    mermaidInitialized = true;
                }
                window.mermaid.run({nodes: mermaidNodes});
            }
        }

        // Modality tabs. One <article class="pane"> per modality; panes are
        // rendered lazily on first activation (force-graph / D3 / mermaid
        // need a visible, measurable container). With a single modality the
        // tab bar stays hidden and the page looks exactly like before.
        const mods = data.modalities;
        const tabBar = document.getElementById('modality-tabs');
        const panes = {};
        const tabButtons = {};
        const renderedPanes = {};

        mods.forEach(function (m) {
            const pane = document.createElement('article');
            pane.className = 'pane';
            pane.dataset.key = m.key;
            pane.hidden = true;
            root.appendChild(pane);
            panes[m.key] = pane;
        });

        const defaultKey = mods.some(m => m.key === 'index') ? 'index' : mods[0].key;

        function activate(key, updateHash) {
            mods.forEach(function (m) {
                const isActive = m.key === key;
                panes[m.key].hidden = !isActive;
                if (tabButtons[m.key]) {
                    tabButtons[m.key].classList.toggle('active', isActive);
                    tabButtons[m.key].setAttribute('aria-selected', isActive ? 'true' : 'false');
                }
            });
            // Unhide first, then render: the chart libraries measure widths.
            if (!renderedPanes[key]) {
                renderBlocksInto(mods.find(m => m.key === key).blocks, panes[key]);
                renderedPanes[key] = true;
            }
            if (updateHash) {
                history.replaceState(null, '',
                    key === defaultKey ? location.pathname + location.search : '#' + key);
            }
        }

        if (mods.length > 1) {
            mods.forEach(function (m) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = m.label;
                btn.setAttribute('role', 'tab');
                btn.addEventListener('click', function () { activate(m.key, true); });
                tabBar.appendChild(btn);
                tabButtons[m.key] = btn;
            });
            tabBar.hidden = false;
        }

        // The hash selects a tab only when it matches a modality key, so
        // existing anchors keep working.
        const initialHash = location.hash.slice(1);
        activate(mods.some(m => m.key === initialHash) ? initialHash : defaultKey, false);
        window.addEventListener('hashchange', function () {
            const k = location.hash.slice(1);
            if (mods.some(m => m.key === k)) activate(k, false);
        });
    })();
</script>
</body>
</html>
