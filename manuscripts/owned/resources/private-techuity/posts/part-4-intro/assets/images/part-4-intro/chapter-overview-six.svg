<svg xmlns="http://www.w3.org/2000/svg" width="600" height="1210" viewBox="0 0 600 1210" role="img" aria-labelledby="title desc">
<title id="title">Six choices for useful collaboration</title><desc id="desc">Six chapters stacked in reading order: plan support, learn together, choose help for work your team cannot yet do, set the terms including who takes the work over afterwards, clarify the adviser and meet the operating partners; learning and support come with company judgment and responsibility.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#337d79"/></marker></defs>
<rect width="600" height="1210" fill="#f6f1e6"/><text x="40" y="52" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="22" font-weight="700" fill="#337d79" text-anchor="start">COLLABORATE</text><text x="40" y="96" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="32" font-weight="700" fill="#24394a" text-anchor="start">Use the investor</text><text x="40" y="136" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="32" font-weight="700" fill="#24394a" text-anchor="start">relationship well</text><rect x="40" y="150" width="520" height="122" rx="16" fill="#fffdf8" stroke="#24394a" stroke-width="2"/><text x="60" y="192" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="28" font-weight="700" fill="#24394a" text-anchor="start">Plan support</text><text x="60" y="230" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" fill="#556a72" text-anchor="start">Agree how the investor and company</text><text x="60" y="260" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" fill="#556a72" text-anchor="start">will work together</text><path d="M300 278 L300 304" stroke="#337d79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="312" width="520" height="122" rx="16" fill="#e2eeea" stroke="#24394a" stroke-width="2"/><text x="60" y="354" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="28" font-weight="700" fill="#24394a" text-anchor="start">Learn together</text><text x="60" y="392" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" fill="#556a72" text-anchor="start">Use the investor’s network and peers to</text><text x="60" y="422" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" fill="#556a72" text-anchor="start">learn</text><path d="M300 440 L300 466" stroke="#337d79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="474" width="520" height="122" rx="16" fill="#fffdf8" stroke="#24394a" stroke-width="2"/><text x="60" y="516" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="28" font-weight="700" fill="#24394a" text-anchor="start">Choose help</text><text x="60" y="554" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" fill="#556a72" text-anchor="start">Compare sources of help for work your</text><text x="60" y="584" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" fill="#556a72" text-anchor="start">team cannot yet do</text><path d="M300 602 L300 628" stroke="#337d79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="636" width="520" height="122" rx="16" fill="#fffdf8" stroke="#24394a" stroke-width="2"/><text x="60" y="678" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="28" font-weight="700" fill="#24394a" text-anchor="start">Set the terms</text><text x="60" y="716" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" fill="#556a72" text-anchor="start">Agree the work, its cost and who takes</text><text x="60" y="746" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" fill="#556a72" text-anchor="start">it over afterwards</text><path d="M300 764 L300 790" stroke="#337d79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="798" width="520" height="122" rx="16" fill="#fffdf8" stroke="#24394a" stroke-width="2"/><text x="60" y="840" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="28" font-weight="700" fill="#24394a" text-anchor="start">Clarify the adviser</text><text x="60" y="878" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" fill="#556a72" text-anchor="start">Know what the investor’s adviser is</text><text x="60" y="908" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" fill="#556a72" text-anchor="start">asked to do</text><path d="M300 926 L300 952" stroke="#337d79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="40" y="960" width="520" height="122" rx="16" fill="#fffdf8" stroke="#24394a" stroke-width="2"/><text x="60" y="1002" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="28" font-weight="700" fill="#24394a" text-anchor="start">Operating partners</text><text x="60" y="1040" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" fill="#556a72" text-anchor="start">Meet the investor’s specialists who help</text><text x="60" y="1070" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" fill="#556a72" text-anchor="start">its companies</text><text x="300" y="1136" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" fill="#24394a" text-anchor="middle">Learning and support, with company</text><text x="300" y="1168" font-family="Arial, 'Liberation Sans', Helvetica, 'DejaVu Sans', sans-serif" font-size="24" font-weight="400" fill="#24394a" text-anchor="middle">judgment and responsibility.</text></svg>
