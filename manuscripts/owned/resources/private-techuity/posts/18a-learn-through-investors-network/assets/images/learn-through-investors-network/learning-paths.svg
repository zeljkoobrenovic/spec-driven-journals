<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 754" role="img" aria-labelledby="title desc">
<title id="title">From access to learning</title><desc id="desc">Connections lead to encounters and reflection, with possible outcomes of better questions, continuing relationships or local experiments.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#337d79"/></marker></defs>
<rect width="1000" height="754" fill="#f6f1e6"/><text x="55" y="65" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#337d79" text-anchor="start">FROM ACCESS TO LEARNING</text><text x="55" y="113" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="#24394a" text-anchor="start">Bring people and experience into view</text><rect x="55" y="163" width="390" height="135" rx="16" fill="#e2eeea" stroke="#24394a" stroke-width="2"/><text x="80" y="207" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#24394a" text-anchor="start">Investor connections</text><text x="80" y="248.0" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#24394a" text-anchor="start">Introductions, convening and</text><text x="80" y="281.0" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#24394a" text-anchor="start">continuity</text><rect x="555" y="163" width="390" height="135" rx="16" fill="#e2eeea" stroke="#24394a" stroke-width="2"/><text x="580" y="207" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#24394a" text-anchor="start">People and practice</text><text x="580" y="248.0" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#24394a" text-anchor="start">Encounters beyond your</text><text x="580" y="281.0" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#24394a" text-anchor="start">everyday work</text><path d="M454 228 L541 228" stroke="#337d79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M750 313 L750 351" stroke="#337d79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="55" y="366" width="890" height="106" rx="16" fill="#fffdf8" stroke="#24394a" stroke-width="2"/><text x="500" y="407" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#337d79" text-anchor="middle">REFLECT WITH YOUR COMPANY</text><text x="500" y="446" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#24394a" text-anchor="middle">What did we see? What might matter here?</text><path d="M190 481 L190 521" stroke="#337d79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="55" y="536" width="270" height="124" rx="16" fill="#f3e6cf" stroke="#c58c32" stroke-width="2"/><text x="190" y="577" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#24394a" text-anchor="middle">Better questions</text><text x="190" y="623" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#556a72" text-anchor="middle">Revisit an assumption</text><path d="M500 481 L500 521" stroke="#337d79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="365" y="536" width="270" height="124" rx="16" fill="#f3e6cf" stroke="#c58c32" stroke-width="2"/><text x="500" y="577" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#24394a" text-anchor="middle">Useful relationships</text><text x="500" y="623" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#556a72" text-anchor="middle">Keep a conversation</text><text x="500" y="648" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#556a72" text-anchor="middle">alive</text><path d="M810 481 L810 521" stroke="#337d79" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="675" y="536" width="270" height="124" rx="16" fill="#f3e6cf" stroke="#c58c32" stroke-width="2"/><text x="810" y="577" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#24394a" text-anchor="middle">A local experiment</text><text x="810" y="623" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#556a72" text-anchor="middle">Test what could transfer</text><text x="500" y="714" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#556a72" text-anchor="middle">Each can lead to more learning. Outcomes are not automatic.</text></svg>
