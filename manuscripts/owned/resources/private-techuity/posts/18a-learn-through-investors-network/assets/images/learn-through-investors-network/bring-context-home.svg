<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 664" role="img" aria-labelledby="title desc">
<title id="title">Carry the context home</title><desc id="desc">Four cards distinguish observation, a host explanation, Northline’s different conditions and its next question.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#337d79"/></marker></defs>
<rect width="1000" height="664" fill="#f6f1e6"/><text x="55" y="63" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#337d79" text-anchor="start">NORTHLINE · A FICTIONAL EXAMPLE</text><text x="55" y="112" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#24394a" text-anchor="start">Carry the context home</text><rect x="55" y="158" width="425" height="184" rx="16" fill="#e2eeea" stroke="#24394a" stroke-width="2"/><text x="79" y="201" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#337d79" text-anchor="start">1  OBSERVED</text><text x="79" y="245.0" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#24394a" text-anchor="start">People review suggestions</text><text x="79" y="281.96" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#24394a" text-anchor="start">inside their inventory</text><text x="79" y="318.92" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#24394a" text-anchor="start">screen.</text><rect x="520" y="158" width="425" height="184" rx="16" fill="#fffdf8" stroke="#24394a" stroke-width="2"/><text x="544" y="201" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#337d79" text-anchor="start">2  HOST’S EXPLANATION</text><text x="544" y="245.0" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#24394a" text-anchor="start">Reliable records and easy</text><text x="544" y="281.96" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#24394a" text-anchor="start">corrections help the</text><text x="544" y="318.92" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#24394a" text-anchor="start">workflow.</text><rect x="55" y="375" width="425" height="184" rx="16" fill="#fffdf8" stroke="#24394a" stroke-width="2"/><text x="79" y="418" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#337d79" text-anchor="start">3  OUR CIRCUMSTANCES</text><text x="79" y="462.0" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#24394a" text-anchor="start">Our customers have uneven</text><text x="79" y="498.96" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#24394a" text-anchor="start">product records.</text><rect x="520" y="375" width="425" height="184" rx="16" fill="#f3e6cf" stroke="#24394a" stroke-width="2"/><text x="544" y="418" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#337d79" text-anchor="start">4  NEXT ENQUIRY</text><text x="544" y="462.0" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#24394a" text-anchor="start">What information and</text><text x="544" y="498.96" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#24394a" text-anchor="start">control would our</text><text x="544" y="535.92" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#24394a" text-anchor="start">customers need?</text><text x="500" y="620" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#556a72" text-anchor="middle">A useful observation still needs interpretation and local enquiry.</text></svg>
